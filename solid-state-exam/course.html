73.6 393.0,173.6 393.9,173.5 394.8,173.5 395.8,173.5 396.7,173.5 397.6,173.5 398.5,173.5 399.5,173.4 400.4,173.4 401.3,173.4 402.2,173.4 403.1,173.3 404.1,173.3 405.0,173.2 405.9,173.1 406.8,173.0 407.7,172.9 408.7,172.8 409.6,172.7 410.5,172.5 411.4,172.3 412.3,172.1 413.3,171.8 414.2,171.5 415.1,171.1 416.0,170.7 416.9,170.2 417.9,169.6 418.8,168.9 419.7,168.0 420.6,167.0 421.5,165.8 422.5,164.4 423.4,162.8 424.3,160.9 425.2,158.6 426.1,155.9 427.1,152.8 428.0,149.1 428.9,144.7 429.8,139.5 430.7,133.4 431.7,126.2 432.6,117.8 433.5,107.8 434.4,96.1 435.3,82.2 436.3,65.9 437.2,46.7 438.1,24.0\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"80.8\" y=\"165.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">reverse: I ≈ −I<tspan dy=\"0.32em\" font-size=\"72%\">s</tspan><tspan dy=\"-0.32em\">​</tspan> (nA or less)</text><text x=\"414.3\" y=\"105.6\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">≈ 0.6–0.7 V (Si)</text><text x=\"412.3\" y=\"58.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">×10 per 60 mV</text></svg><figcaption>Ideal diode characteristic: exponential forward current (a decade per 60 mV at 300 K) and a tiny constant reverse current −I<sub>s</sub>.</figcaption></figure>\n```\n\nSketch in the exam: I against V; an exponential rising sharply near 0.6–0.7 V; a flat line just below the axis at −I_s for V < 0; label I_s and the cut-in voltage.\n\n#### Numerical check\n\n**Given:** Si, N_A = 10¹⁷ cm⁻³, N_D = 10¹⁶ cm⁻³, D_p = 12.4 cm²/s, D_n = 35 cm²/s, τ_p = τ_n = 1 μs, A = 10⁻⁴ cm², 300 K.\n\n**Solution.** L_p = √(12.4 × 10⁻⁶) = 3.52×10⁻³ cm; L_n = √(35 × 10⁻⁶) = 5.92×10⁻³ cm.\n\n    J_s = 1.6×10⁻¹⁹ × 10²⁰ × ( 12.4/(3.52×10⁻³ × 10¹⁶) + 35/(5.92×10⁻³ × 10¹⁷) )\n        = 16 × (3.52×10⁻¹³ + 5.92×10⁻¹⁴) = 6.6×10⁻¹² A/cm²\n\n**Answer:** **I_s = 6.6×10⁻¹⁶ A**; I(0.6 V) ≈ 6.6×10⁻¹⁶ × e^{23.17} ≈ **7.6 μA**; I(0.7 V) ≈ **0.36 mA**; I(−5 V) = **−6.6×10⁻¹⁶ A**.\n\n**What this means:** 86 % of the current is holes injected into the lightly doped n side. At 0.6 V the injected hole density at x_n is 1.2×10¹⁴ cm⁻³, still ≪ N_D = 10¹⁶ cm⁻³, so low-level injection holds.\n\n**Real diodes** depart from this: recombination in the depletion region (low forward bias), high-level injection and series resistance (high current), generation current and breakdown (reverse). These are lumped into I = I_s(e^{qV/ηkT} − 1), with ideality factor η between 1 and 2.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ assumptions listed: depletion approximation, low-level injection, no G–R in depletion region, Boltzmann statistics, E = 0 in neutral regions, long diodes\n- ✓ law of the junction: p_n(x_n) = p_n0e^{qV/kT}, n_p(−x_p) = n_p0e^{qV/kT}, derived from the barrier V_bi − V\n- ✓ diffusion equation D_p d²Δp/dx² − Δp/τ_p = 0 and its decaying-exponential solution with L_p = √(D_pτ_p)\n- ✓ J_p(x_n) = (qD_pp_n0/L_p)(e^{qV/kT} − 1) and the matching electron term\n- ✓ argument that the currents may be added at the depletion edges (J_n constant across W)\n- ✓ boxed result with J_s = qn_i²(D_p/(L_pN_D) + D_n/(L_nN_A))\n- ✓ forward bias: barrier lowered, injection, I ≈ I_se^{qV/kT}, 60 mV/decade\n- ✓ reverse bias: barrier raised, extraction, I ≈ −I_s\n- ✓ labelled I-V sketch\n\n**Common mistakes.**\n\n- Using total (not excess) minority density in the current: the \"−1\" comes from Δp = p_n0(e^{qV/kT} − 1); forgetting it gives zero reverse current and a wrong equation.\n- Keeping the growing exponential e^{+x/L_p} in the long-diode solution; it must be dropped so Δp → 0 far away.\n- Not justifying the addition of J_n and J_p: say explicitly that no recombination in the depletion region makes each constant across it.\n- Swapping the doping in J_s: holes injected into the n side carry D_p/(L_pN_D), so the *lighter* doping dominates.\n\n**Remember it.** \"Inject, diffuse, add\": the junction law injects, the diffusion equation spreads them over L, and the two slopes at the edges add up to I_s(e^{qV/kT} − 1).\n\n**Try a variant.** For a p⁺n silicon diode (N_D = 10¹⁶ cm⁻³ on the n side, D_p = 12.4 cm²/s, τ_p = 1 μs, A = 10⁻⁴ cm²), find I_s and the forward voltage for I = 1 mA. *Answer:* the electron term is negligible, so I_s ≈ qAn_i²D_p/(L_pN_D) = 1.6×10⁻¹⁹ × 10⁻⁴ × 10²⁰ × 12.4/(3.52×10⁻³ × 10¹⁶) = **5.6×10⁻¹⁶ A**; V = (kT/q) ln(I/I_s) = 0.0259 × ln(1.78×10¹²) = **0.73 V**.\n\n---\n\n### Q49. Differentiate between a Schottky barrier diode and an Ohmic contact. Explain their energy-band characteristics.\n\n> **Question type:** Compare and explain · **Topic:** metal–semiconductor contacts · **Full notes:** Week 11 (Metal–Semiconductor Interfaces)\n\n**What the examiner wants.** Both are metal–semiconductor contacts; the answer must show what makes one rectifying and the other not. Marks are for the band diagrams (before contact, at equilibrium, under bias for the Schottky diode), the barrier formulas, the two ways of making an ohmic contact, the I-V behaviour, and a comparison table.\n\n**Key terms.**\n\n- **Vacuum level (E_vac):** energy of an electron at rest just outside the material; the common reference.\n- **Work function (Φ_m, Φ_s):** energy from the Fermi level up to the vacuum level, for the metal and the semiconductor (eV).\n- **Electron affinity (χ):** energy from the conduction-band edge E_c up to the vacuum level; 4.05 eV for Si, independent of doping.\n- **Schottky barrier height (Φ_B):** barrier an electron in the metal must climb to enter the semiconductor (eV); fixed by the interface.\n- **Built-in potential (V_bi):** barrier an electron in the semiconductor must climb to reach the metal (V).\n- **Depletion / accumulation layer:** a surface layer with fewer / more majority carriers than the bulk; bands bend up / down in n-type.\n- **Thermionic emission:** carriers crossing *over* a barrier using thermal energy.\n- **Tunnelling (field emission):** carriers passing *through* a barrier only a few nanometres thick.\n\n**Model answer.**\n\nA **Schottky barrier diode** is a metal–semiconductor contact with a significant barrier to majority carriers, so it **rectifies**. An **ohmic contact** has no barrier that limits the current, so it conducts equally in both directions with a linear I-V (V = IR_c). Both are explained with band diagrams using one rule: **at equilibrium the Fermi level is flat**. The cases below are for a metal on **n-type** silicon.\n\n#### Before contact\n\nEnergies are measured down from the common vacuum level. The semiconductor work function depends on doping:\n\n    Φ_s = χ + (E_c − E_F),     E_c − E_F = kT ln(N_c/N_D)\n\nWhere:\n\n- Φ_s = semiconductor work function (eV); χ = electron affinity, 4.05 eV (Si)\n- E_c − E_F = depth of the Fermi level below the conduction-band edge (eV)\n- kT = 0.0259 eV at 300 K; N_c = 2.8×10¹⁹ cm⁻³ (Si); N_D = donor concentration (cm⁻³)\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 620 315\" role=\"img\" aria-label=\"Energy levels of a metal and an n-type semiconductor before contact, measured down from a common vacuum level: the metal work function, the semiconductor electron affinity and work function, and the higher semiconductor Fermi level\" style=\"width:620px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY /tspan></text><line x1=\"330.0\" y1=\"167.0\" x2=\"330.0\" y2=\"190.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.4\" opacity=\"1.0\" marker-end=\"url(#ars)\"/><line x1=\"230.0\" y1=\"190.0\" x2=\"336.0\" y2=\"190.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"0.8\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><line x1=\"324.0\" y1=\"167.0\" x2=\"370.0\" y2=\"167.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"0.8\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><text x=\"324.0\" y=\"182.5\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">q(Φ<tspan dy=\"0.32em\" font-size=\"72%\">m</tspan><tspan dy=\"-0.32em\">​</tspan> − Φ<tspan dy=\"0.32em\" font-size=\"72%\">s</tspan><tspan dy=\"-0.32em\">​</tspan>)</text></svg><figcaption>Metal and n-type semiconductor before contact. With Φ<sub>m</sub> > Φ<sub>s</sub> the semiconductor's Fermi level lies higher by Φ<sub>m</sub> − Φ<sub>s</sub>, so electrons will flow into the metal on contact.</figcaption></figure>\n```\n\nWhether E_F of the semiconductor lies above or below E_F of the metal decides which way electrons flow on contact, and hence the type of contact.\n\n#### Schottky barrier (Φ_m > Φ_s, moderate doping)\n\n**At equilibrium.**\n\n1. On contact, electrons flow from the semiconductor (higher E_F) into the metal.\n2. They leave behind positive donor ions: a **depletion region** forms in the semiconductor, with a thin sheet of negative charge on the metal surface.\n3. The resulting field bends the bands **upward** towards the interface until the Fermi levels align.\n4. Two barriers result:\n\n    Φ_B = Φ_m − χ          (barrier seen from the metal; Schottky–Mott rule)\n\n    V_bi = Φ_m − Φ_s = Φ_B − (E_c − E_F)/q          (barrier seen from the semiconductor)\n\n    W = √( 2ε_s(V_bi − V)/qN_D )\n\nWhere:\n\n- Φ_m = metal work function (eV), e.g. Au 5.1 eV\n- W = depletion width (cm); ε_s = 1.04×10⁻¹² F/cm; q = 1.6×10⁻¹⁹ C\n- V = applied voltage (V), positive for forward bias (metal positive)\n\n**Example (Au on n-Si, N_D = 10¹⁶ cm⁻³):** E_c − E_F = 0.0259 ln(2800) = 0.21 eV, Φ_s = 4.26 eV, Φ_B = 5.1 − 4.05 = **1.05 eV**, V_bi = 5.1 − 4.26 = **0.84 V**, W = **0.33 μm**: far too thick to tunnel through. (Real interfaces are **Fermi-level pinned**, so Au on n-Si actually measures Φ_B ≈ 0.8 eV.)\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 620 275\" role=\"img\" aria-label=\"Band diagram of a metal on n-type silicon after contact: the conduction band bends upward to the barrier q phi B at the interface, with built-in potential q V bi across the depletion width\" style=\"width:620px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><rect x=\"30.0\" y=\"160.0\" width=\"140.0\" height=\"60.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"170.0\" y1=\"30.0\" x2=\"170.0\" y2=\"230.0\" style=\"stroke:currentColor\" stroke-width=\"1.4\" opacity=\"1.0\"/><text x=\"100.0\" y=\"200.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\">metal</text><line x1=\"30.0\" y1=\"160.0\" x2=\"560.0\" y2=\"160.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-dasharray=\"6 3\"/><text x=\"564.0\" y= 10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">qV<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"170.0\" y1=\"250.0\" x2=\"330.0\" y2=\"250.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><text x=\"250.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">depletion width W</text><text x=\"540.0\" y=\"266.0\" text-anchor=\"end\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\">n-type Si</text></svg><figcaption>Schottky contact at equilibrium: flat E<sub>F</sub>, bands bent upward in the semiconductor, barrier qΦ<sub>B</sub> seen from the metal and qV<sub>bi</sub> seen from the semiconductor.</figcaption></figure>\n```\n\n**Under bias.** qΦ_B is fixed by the interface and never changes; the applied voltage appears across the depletion region and changes only the semiconductor-side barrier.\n\n- **Forward bias** (metal +): the semiconductor E_F rises by qV, the band bending falls to q(V_bi − V), W narrows, and electrons pour over the barrier into the metal; current rises exponentially.\n- **Reverse bias** (metal −): bending rises to q(V_bi + |V|), W widens, the semiconductor-to-metal flow is cut off, and only the small metal-to-semiconductor flow over the fixed Φ_B remains: the saturation current.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 670 205\" role=\"img\" aria-label=\"Metal on n-type silicon in equilibrium, forward and reverse bias: the barrier from the metal stays fixed while the semiconductor band bending shrinks under forward bias and grows under reverse bias\" style=\"width:670px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0 s suitable metals rare on Si and GaAs.\n\n**(b) Heavy doping, tunnelling (the practical method).** The surface under the contact is doped n⁺ (above about 10¹⁹ cm⁻³). The barrier height is unchanged, but since W ∝ 1/√N_D the barrier becomes only a few nanometres thick, and electrons **tunnel** through it in both directions. Example: for a 0.60 V barrier, W = 279 nm at N_D = 10¹⁶ cm⁻³ (rectifying) but only **8.8 nm** at 10¹⁹ cm⁻³ (ohmic).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 650 215\" role=\"img\" aria-label=\"Two ohmic contacts on n-type silicon: a low work-function metal makes the bands bend down into an accumulation layer with no barrier; heavy doping leaves a barrier only a few nanometres thick that electrons tunnel through\" style=\"width:650px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"150.0\" y=\"18.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\">(a) low work function, Φ<tspan dy=\"0.32em\" font-size=\"72%\">m</tspan><tspan dy=\"-0.32em\">​</tspan> &lt; Φ<tspan dy=\"0.32em\" font-size=\"72%\">s</tspan><tspan dy=\"-0.32em\">​</tspan></text><rect x=\"10.0\" y=\"120.0\" width=\"70.0\" height=\"60.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/ start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">electrons tunnel</text><text x=\"440.0\" y=\"76.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">through it</text><text x=\"603.0\" y=\"96.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"603.0\" y=\"156.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text></svg><figcaption>The two routes to an ohmic contact on n-type silicon: (a) Φ<sub>m</sub> < Φ<sub>s</sub>, downward band bending into an accumulation layer with no barrier; (b) heavy doping, a barrier so thin that electrons tunnel through it.</figcaption></figure>\n```\n\nAn ohmic contact is judged by its specific contact resistance ρ_c = R_cA (Ω·cm²; R_c = contact resistance in Ω, A = area in cm²); good contacts reach 10⁻⁶–10⁻⁸ Ω·cm². Silicides (TiSi₂, NiSi) on Si and alloyed Au–Ge–Ni on n-GaAs are standard.\n\nSketch in the exam: for each case draw E_vac, metal E_F, and the semiconductor E_c, E_F, E_v; mark qΦ_m, qΦ_s, qχ before contact; after contact show the flat E_F, the upward bend with qΦ_B and qV_bi (Schottky), the downward bend (accumulation) and the thin barrier with a tunnelling arrow (heavy doping).\n\n#### Comparison\n\n| Feature | Schottky barrier diode | Ohmic contact |\n|---|---|---|\n| Work-function condition (n-type) | Φ_m > Φ_s | Φ_m < Φ_s, or any metal on n⁺ |\n| Doping under contact | Moderate (10¹⁵–10¹⁷ cm⁻³) | Heavy (> 10¹⁹ cm⁻³) |\n| Band bending (n-type) | Upward: depletion layer | Downward (accumulation) or a very thin barrier |\n| Barrier to majority carriers | Yes: qΦ_B and qV_bi | None, or thin enough to tunnel through |\n| Transport | Thermionic emission over the barrier | Free flow, or tunnelling (field emission) |\n| I-V | Exponential, rectifying | Linear, symmetric, V = IR_c |\n| Resistance | Depends on bias polarity | Small and constant |\n| Effect of bias on bands | Semiconductor-side barrier changes, qΦ_B fixed | Negligible: no barrier to modulate |\n| Use | Fast rectifiers, RF detectors, clamps, MESFET gates | Connecting every device to the circuit |\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ definitions: rectifying barrier vs linear, symmetric, low-resistance contact\n- ✓ Φ_s = χ + (E_c − E_F); comparison of Φ_m and Φ_s decides the contact type\n- ✓ Schottky formation: electrons to metal, depletion region, upward bending, Fermi levels align\n- ✓ Φ_B = Φ_m − χ and V_bi = Φ_m − Φ_s\n- ✓ band diagrams before contact, at equilibrium and under forward/reverse bias, with qΦ_B fixed\n- ✓ thermionic emission J = A∗∗T²e^{−qΦ_B/kT}(e^{qV/ηkT} − 1)\n- ✓ ohmic route 1: accumulation, downward bending, no barrier\n- ✓ ohmic route 2: heavy doping, W ∝ 1/√N_D, tunnelling\n- ✓ comparison table\n\n**Common mistakes.**\n\n- Saying an ohmic contact \"has no barrier\". The practical (n⁺) ohmic contact has a barrier; it is simply thin enough to tunnel through.\n- Reversing the conditions for p-type: there a Schottky barrier needs Φ_m < Φ_s and an ohmic contact Φ_m > Φ_s.\n- Drawing Φ_B changing with bias. Only the semiconductor-side barrier (V_bi ∓ V) changes.\n- Mixing up Φ_B and V_bi: Φ_B is measured from the metal Fermi level, V_bi from the semiconductor conduction band; they differ by (E_c − E_F).\n\n**Remember it.** \"Schottky climbs over, ohmic walks through\": over a fixed barrier by thermionic emission, or through a paper-thin one by tunnelling.\n\n**Try a variant.** Platinum (Φ_m = 5.65 eV) is deposited on p-type silicon with N_A = 1×10¹⁶ cm⁻³. Is the ideal contact rectifying or ohmic? *Answer:* E_F − E_v = 0.0259 ln(N_v/N_A) = 0.0259 ln(1040) = 0.18 eV, so Φ_s = χ + E_g − 0.18 = 4.05 + 1.12 − 0.18 = **4.99 eV**. Φ_m > Φ_s on **p-type**, so electrons leave the semiconductor, holes accumulate at the surface and the bands bend upward with no hole barrier: the contact is **ohmic** (by contrast Al, 4.28 eV, gives a hole barrier Φ_{Bp} = 1.12 − (4.28 − 4.05) = 0.89 eV, a Schottky contact).\n\n---\n\n### Q50. Explain the principles of I-V and C-V characterisation of semiconductor devices and describe how C-V measurements can be used to estimate doping concentration.\n\n> **Question type:** Explanation with calculation · **Topic:** device characterisation · **Full notes:** Week 12 (Interface Characterisation)\n\n**What the examiner wants.** For each technique: what is applied, what is measured, which equation links them, and which plot turns the data into a straight line. Then a step-by-step description of extracting doping (and V_bi) from a Mott–Schottky plot, best shown with a worked numerical example and a note on limitations.\n\n**Key terms.**\n\n- **I-V characterisation:** measuring current as the DC voltage is stepped, to extract saturation current, ideality factor, series resistance, leakage, breakdown and barrier height.\n- **Ideality factor (η):** 1 for pure diffusion (or thermionic emission) current, up to 2 when depletion-region recombination dominates.\n- **Series resistance (R_s):** resistance of the bulk, contacts and leads in series with the junction (Ω).\n- **C-V characterisation:** measuring small-signal capacitance as the DC reverse bias is stepped, to find doping and V_bi.\n- **Depletion capacitance (C):** capacitance of the carrier-free depletion layer, C = ε_sA/W (F).\n- **One-sided junction:** p⁺n, n⁺p or Schottky diode; the depletion region lies almost entirely in the lightly doped side.\n- **Mott–Schottky plot:** 1/C² against V; straight for uniform doping.\n- **Doping profile N(x):** doping concentration as a function of depth below the surface.\n\n**Model answer.**\n\n#### 1. I-V characterisation\n\n**Principle.** A source-measure unit applies a DC voltage in steps from reverse to forward bias and records the current (picoamps to amps, often on a probe station, sometimes at several temperatures). The data are compared with the diode law:\n\n    I = I_s ( e^{qV/ηkT} − 1 )   ⇒   ln I = ln I_s + (q/ηkT) V     (V > about 0.1 V)\n\nWhere:\n\n- I = diode current (A); I_s = saturation current (A)\n- V = applied voltage, positive for forward bias (V)\n- η = ideality factor (dimensionless); kT/q = 0.0259 V at 300 K\n\nA **semi-log plot** of ln I against V is a straight line:\n\n- intercept at V = 0 → **I_s**;\n- slope = q/(ηkT) → **η = (q/kT)/slope**;\n- bending below the line at high current → **series resistance**, R_s = (extra voltage)/I;\n- reverse branch → **leakage** and **breakdown voltage**;\n- for a Schottky diode, **barrier height** Φ_B = (kT/q) ln(A∗∗AT²/I_s), with A = area (cm²), A∗∗ ≈ 110 A/cm²K² for n-Si, T in K;\n- a straight, symmetric line through the origin between two contacts confirms an **ohmic contact**.\n\nTransistors are characterised the same way (threshold voltage and mobility from MOSFET curves, current gain from BJT curves).\n\n#### 2. C-V characterisation\n\n**Principle.** An LCR meter superimposes a small AC signal (10–50 mV, about 1 MHz) on a DC **reverse** bias and measures the capacitance as the bias is stepped. A reverse-biased one-sided junction or Schottky diode is a parallel-plate capacitor whose \"gap\" is the depletion region:\n\n    C = ε_s A / W,     W = √( 2ε_s(V_bi − V)/qN )\n\nWhere:\n\n- C = depletion capacitance (F); A = junction area (cm²)\n- ε_s = permittivity of silicon, 1.04×10⁻¹² F/cm; q = 1.6×10⁻¹⁹ C\n- W = depletion width (cm); V_bi = built-in potential (V)\n- V = applied voltage, negative for reverse bias (V); N = doping of the lightly doped side (cm⁻³)\n\nAs reverse bias grows, W widens and C falls.\n\n#### 3. Estimating doping from C-V\n\nEliminating W and squaring:\n\n    1/C² = 2(V_bi − V) / (qε_s N A²)\n\nSo the procedure is:\n\n- Measure C at a series of reverse biases (0, −1, … −5 V).\n- Plot **1/C² against V**. For uniform doping the points lie on a straight line.\n- The **slope** is −2/(qε_sNA²), so:\n\n    N = 2 / ( qε_s A² |slope| )\n\n- The **voltage-axis intercept** (where 1/C² = 0) is **V_bi**. For a Schottky diode, Φ_B = V_bi + (kT/q) ln(N_c/N).\n- If the plot curves, the doping is non-uniform; use the local slope and the depth W = ε_sA/C to obtain a **profile**: N(W) = 2/(qε_sA²|d(1/C²)/dV|).\n\nWhere:\n\n- |slope| = magnitude of the slope of the 1/C² line (F⁻²V⁻¹)\n- N_c = conduction-band effective density of states, 2.8×10¹⁹ cm⁻³ (Si)\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 210\" role=\"img\" aria-label=\"1 over C squared against bias is a straight line whose slope gives the doping and whose voltage intercept gives the built-in potential\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"184.0\" x2=\"464.0\" y2=\"184.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"388.8\" y1=\"184.0\" x2=\"388.8\" y2=\"30.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"474.0\" y=\"188.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">V (V)</text><text x=\"393.8\" y=\"26.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">1/C²</text><line x1=\"99.0\" y1=\"180.0\" x2=\"99.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"99.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-5</text><line x1=\"157.0\" y1=\"180.0\" x2=\"157.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"157.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-4</text><line x1=\"214.9\" y1=\"180.0\" x2=\"214.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"214.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-3</text><line x1=\"272.9\" y1=\"180.0\" x2=\"272.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"272.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-2</text><line x1=\"330.9\" y1=\"180.0\" x2=\"330.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"330.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-1</text><line x1=\"446.8\" y1=\"180.0\" x2=\"446.8\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"446.8\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><polyline points=\"99.0,52.6 423.6,184.0\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"99.0\" cy=\"52.6\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"157.0\" cy=\"76.1\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"214.9\" cy=\"99.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"272.9\" cy=\"123.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"330.9\" cy=\"146.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"388.8\" cy=\"169.9\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"423.6\" cy=\"184.0\" r=\"3.6\" style=\"fill:var(--teal,#1C6E7E)\"/><text x=\"429.6\" y=\"176.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">V<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"259.7\" y=\"107.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">slope = −2/(qε<tspan dy=\"0.32em\" font-size=\"72%\">sNA</tspan><tspan dy=\"-0.32em\">​</tspan>²)</text><text x=\"81.6\" y=\"36.8\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">reverse bias</text></svg><figcaption>Mott–Schottky plot: 1/C² falls linearly towards the forward-bias side and meets the voltage axis at V<sub>bi</sub>; the slope gives the doping.</figcaption></figure>\n```\n\nSketch in the exam: 1/C² on the vertical axis, V on the horizontal with reverse bias to the left; a straight line falling to the right and cutting the V axis at +V_bi; label the slope −2/(qε_sNA²).\n\n#### 4. Worked example: doping and V_bi from a 1/C² line\n\n**Given:** a Schottky diode on n-type Si, A = 1.0×10⁻³ cm², 300 K, with readings:\n\n| V (V) | 0 | −1 | −2 | −3 | −4 | −5 |\n|---|---|---|---|---|---|---|\n| C (pF) | 37.2 | 22.8 | 17.9 | 15.2 | 13.4 | 12.2 |\n| 1/C² (F⁻²) | 7.2×10²⁰ | 1.92×10²¹ | 3.12×10²¹ | 4.33×10²¹ | 5.57×10²¹ | 6.72×10²¹ |\n\n**Find:** N_D, V_bi, the depletion depth at −5 V and the barrier height.\n\n**Formula:** N_D = 2/(qε_sA²|slope|); V_bi from 1/C² = 0; W = ε_sA/C; Φ_B = V_bi + (kT/q) ln(N_c/N_D).\n\n**Solution.**\n\nStep 1. The 1/C² values rise by about 1.2×10²¹ F⁻² per volt: the line is straight, so the doping is uniform. Slope from the end points:\n\n    slope = (6.72×10²¹ − 7.2×10²⁰)/(−5 − 0) = −1.20×10²¹ F⁻²V⁻¹\n\nStep 2. Doping:\n\n    N_D = 2 / (1.6×10⁻¹⁹ × 1.04×10⁻¹² × (10⁻³)² × 1.20×10²¹) = 2 / 2.0×10⁻¹⁶ = 1.0×10¹⁶ cm⁻³\n\nStep 3. Intercept: at V = 0, 1/C² = 7.2×10²⁰, and it falls by 1.20×10²¹ per volt of forward bias, so it reaches zero at\n\n    V_bi = 7.2×10²⁰ / 1.20×10²¹ = 0.60 V\n\nStep 4. Depth probed at −5 V:\n\n    W = ε_sA/C = 1.04×10⁻¹² × 10⁻³ / 12.2×10⁻¹² = 8.5×10⁻⁵ cm = 0.85 μm\n\nStep 5. Barrier height: (kT/q) ln(N_c/N_D) = 0.0259 × ln(2800) = 0.21 V, so Φ_B = 0.60 + 0.21 = 0.81 eV.\n\n**Answer:** **N_D = 1.0×10¹⁶ cm⁻³, V_bi = 0.60 V**, W(−5 V) = 0.85 μm, Φ_B ≈ 0.81 eV.\n\n**What this means:** the doping was measured electrically, without cutting or etching the wafer, and is uniform at least to 0.85 μm below the contact. A 0.81 eV barrier is typical of a good Schottky contact on n-Si.\n\n#### 5. Accuracy and limits\n\n- Measure only in reverse bias (forward bias adds a large diffusion capacitance).\n- Correct for stray (pad and probe) capacitance and series resistance; keep the AC signal small.\n- Know the area accurately: N ∝ 1/A², so a 10 % area error gives a 20 % doping error.\n- C-V sees only the lightly doped side, only to depths reached before breakdown; deep traps can distort the result at the wrong frequency.\n\n| | I-V | C-V |\n|---|---|---|\n| Applied | DC voltage, reverse to forward | DC reverse bias + small AC signal |\n| Measured | Current | Capacitance |\n| Straight-line plot | ln I against V | 1/C² against V |\n| Slope gives | η | Doping N |\n| Intercept gives | I_s (and Φ_B) | V_bi (and Φ_B) |\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ I-V principle: voltage stepped, current measured, I = I_s(e^{qV/ηkT} − 1)\n- ✓ semi-log plot: intercept → I_s, slope → η; R_s, leakage, breakdown, Φ_B\n- ✓ C-V principle: reverse bias + small AC signal, C = ε_sA/W, C falls with reverse bias\n- ✓ derivation of 1/C² = 2(V_bi − V)/(qε_sNA²)\n- ✓ N = 2/(qε_sA²|slope|) and V_bi from the voltage intercept\n- ✓ profiling: local slope and W = ε_sA/C for non-uniform doping\n- ✓ worked numbers: N ≈ 1×10¹⁶ cm⁻³, V_bi = 0.60 V\n- ✓ labelled Mott–Schottky sketch and at least two practical limitations\n\n**Common mistakes.**\n\n- Plotting C or 1/C against V: only 1/C² gives a straight line for uniform doping.\n- Leaving the area unsquared, or using it in m² with ε_s in F/cm: keep everything in cm, and remember A².\n- Reading V_bi from the 1/C² axis instead of the voltage axis, or giving it a negative sign: the line crosses at a positive (forward) voltage.\n- Applying it to a symmetric p-n junction without saying so: then N is the combined N_{A}N_D/(N_A + N_D), not a single doping.\n\n**Remember it.** \"Slope gives the dopants, intercept gives the barrier\": 1/C² against V is a straight line whose steepness is 2/(qε_sNA²) and whose zero is V_bi.\n\n**Try a variant.** A one-sided Si junction of area 2×10⁻³ cm² gives a 1/C² plot with slope magnitude 4.0×10²⁰ F⁻²V⁻¹. Find the doping of the lightly doped side. *Answer:* N = 2/(qε_sA²|slope|) = 2/(1.6×10⁻¹⁹ × 1.04×10⁻¹² × 4×10⁻⁶ × 4.0×10²⁰) = **7.5×10¹⁵ cm⁻³**. (Doubling the area quarters the slope for the same doping.)\n", "group": "The 50 questions, answered", "eyebrow": "The 50 questions, answered", "disp": "·"}, {"num": "06", "title": "Formula and Constants Sheet", "body": "\nEvery formula the 50 questions need, grouped by topic, with the question numbers that use it. Learn the boxed results of the derivations (Q27, Q37, Q48) by heart; the rest you should be able to rebuild from them. Every symbol is explained in the table that follows.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| ħ | Reduced Planck constant, h/2π | 1.055×10⁻³⁴ J·s |\n| m₀ | Free-electron mass | 9.11×10⁻³¹ kg |\n| ε₀ | Permittivity of free space | 8.854×10⁻¹⁴ F/cm |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| ε_r | Relative permittivity (dielectric constant) | Si 11.7, SiO₂ 3.9, GaAs 12.9 |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| Å | Ångström, a unit of length | 1 Å = 10⁻¹⁰ m = 0.1 nm |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_a | Activation energy of dopant diffusion | eV; about 3–4 eV |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| g(E), g_c, g_v | Density of states: allowed states per unit energy per unit volume | states/(eV·cm³) |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| p_n0, n_p0 | Equilibrium minority concentrations: holes on the n side, electrons on the p side | cm⁻³; p_n0 = n_i²/N_D |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| m∗, m_n∗, m_p∗ | Effective mass of electrons or holes | kg, or as a multiple of m₀ |\n| ψ | Wave function (\\|ψ\\|² is the probability density) | — |\n| V(x) | Potential energy in the Schrödinger equation | J or eV |\n| k (wave vector) | Wave vector, 2π/λ; measures the electron's momentum, p = ħk | m⁻¹ or cm⁻¹ |\n| α (Kronig–Penney) | √(2mE)/ħ, set by the electron energy | m⁻¹ |\n| P (Kronig–Penney) | Barrier strength mV₀ba/ħ² | dimensionless |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| a | Lattice constant: edge length of the cubic unit cell | Å; Si 5.43, Ge and GaAs 5.65 |\n| (h k l), {h k l} | Miller indices of a plane; family of equivalent planes | integers |\n| d_hkl | Spacing between neighbouring (h k l) planes, a/√(h² + k² + l²) | Å |\n| k₀ | Segregation coefficient, C_s/C_l at the freezing interface | dimensionless; B 0.8, P 0.35 |\n| C_s | Surface concentration of a diffusion (or solid concentration when freezing) | cm⁻³ |\n| C_l, C₀ | Concentration in the melt (liquid); C₀ at the start | cm⁻³ |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| D | Diffusion coefficient (dopants in a furnace, or carriers) | cm²/s |\n| D₀ | Diffusion constant in D = D₀e^{−E_a/kT} | cm²/s |\n| F | Particle flux in Fick's law | particles/(cm²·s) |\n| Q | Dose: dopant atoms per unit area (in Weeks 13–14, Q also means charge) | atoms/cm² (C or C/cm² for charge) |\n| Φ (dose) | Implanted dose (ions per cm²) | cm⁻² |\n| erfc | Complementary error function, erfc(u) = 1 − erf(u); read from a table | dimensionless |\n| x_j | Junction depth: where the dopant concentration equals the background | μm |\n| N_B (C_B) | Background doping of the wafer (in Week 13, N_B is the base doping) | cm⁻³ |\n| R_p | Projected range: average depth at which implanted ions stop | μm |\n| ΔR_p | Straggle: spread of the implanted ions' stopping depths | μm |\n| E (field) | Electric field (on band diagrams, E is energy instead) | V/cm |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| μ_L, μ_I | Mobility limited by lattice scattering, by ionised-impurity scattering | cm²/(V·s) |\n| v_d | Drift velocity | cm/s |\n| v_sat | Saturation velocity at high field | ≈ 10⁷ cm/s in Si |\n| τ_m | Mean free time between collisions | s; about 0.1–1 ps |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| G, G_L | Generation rate of electron–hole pairs (G_L: by light) | cm⁻³s⁻¹ |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| U | Net recombination rate, R − G | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| N_t | Density of traps (recombination centres) | cm⁻³ |\n| n₁, p₁ | SRH parameters n_ie^{(E_t − E_i)/kT} and n_ie^{(E_i − E_t)/kT} | cm⁻³ |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| S | Surface recombination velocity | cm/s |\n| N_st | Density of surface traps | cm⁻² |\n| U_s | Recombination rate per unit area at a surface | cm⁻²s⁻¹ |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| x_n, x_p | Parts of the depletion region on the n side and on the p side | μm |\n| E_max | Peak electric field, at the junction | V/cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I | Current | A |\n| η | Ideality factor of a diode, 1 (ideal) to 2 | dimensionless |\n| C, C_j | Capacitance (junction or depletion capacitance) | F (pF = 10⁻¹² F) |\n| Φ_m | Work function of a metal | eV; Al 4.28, Au 5.1 |\n| Φ_s | Work function of a semiconductor, χ + (E_c − E_F) | eV |\n| χ | Electron affinity: energy from E_c up to the vacuum level | eV; Si 4.05 |\n| Φ_B | Schottky barrier height seen from the metal | eV (or V) |\n| A∗∗ | Effective Richardson constant | A/(cm²·K²); n-Si ≈ 110 |\n| μ_i, τ_i (μ_L, μ_I, N_I) | Mobility and scattering time for one scattering mechanism (L: lattice, I: ionised impurity); N_I = ionised-impurity density | cm²/(V·s); s; cm⁻³ |\n| G_n, G_p, R_n, R_p | Generation and recombination rates of electrons and holes | cm⁻³s⁻¹ |\n| τ_b (τ_bulk), τ_surface | Lifetime from bulk recombination only; from surface recombination only | s |\n| U_s, p_s, Δp_s | Surface recombination rate; hole density and excess at the surface | cm⁻²s⁻¹; cm⁻³ |\n| n_n0, p_p0, p_n0, n_p0 | Equilibrium densities: majority (n_n0, p_p0) and minority (p_n0 holes on n side, n_p0 electrons on p side) | cm⁻³ |\n| p_n, n_p | Minority-carrier density: holes on the n side, electrons on the p side | cm⁻³ |\n| erfc(u), erfc⁻¹ | Complementary error function, 1 − erf(u), and its inverse (read from a table) | dimensionless |\n| N(x), N(W) | Doping concentration at depth x (or at the depletion edge W), from C-V profiling | cm⁻³ |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| MG-Si | Metallurgical-grade silicon (≈ 98 % pure) |\n| EG-Si | Electronic-grade silicon (99.9999999 % or better) |\n| CZ | Czochralski crystal growth |\n| CVD | Chemical vapour deposition |\n| VPE | Vapour-phase epitaxy |\n| SRH | Shockley–Read–Hall (trap-assisted) recombination |\n| I-V | Current–voltage (measurement or characteristic) |\n| C-V | Capacitance–voltage (measurement or characteristic) |\n\n\n## Physical constants\n\n| Quantity | Symbol | Value |\n|---|---|---|\n| Electronic charge | q | 1.6×10⁻¹⁹ C |\n| Boltzmann constant | k | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| Thermal energy at 300 K | kT | 0.0259 eV |\n| Thermal voltage at 300 K | kT/q | 0.0259 V (about 26 mV) |\n| Planck constant | h | 6.626×10⁻³⁴ J·s |\n| Reduced Planck constant | ħ = h/2π | 1.055×10⁻³⁴ J·s |\n| Free-electron mass | m₀ | 9.11×10⁻³¹ kg |\n| Permittivity of free space | ε₀ | 8.854×10⁻¹⁴ F/cm |\n| Electron-volt | 1 eV | 1.6×10⁻¹⁹ J |\n| Photon wavelength | λ | 1.24/E μm, with E in eV |\n\n## Material data at 300 K\n\n| | Si | Ge | GaAs |\n|---|---|---|---|\n| Crystal structure | Diamond | Diamond | Zinc blende |\n| Lattice constant a (Å) | 5.43 | 5.65 | 5.65 |\n| Band gap E_g (eV) | 1.12, indirect | 0.66, indirect | 1.42, direct |\n| n_i (cm⁻³) | 1×10¹⁰ | 2.4×10¹³ | 2×10⁶ |\n| N_c (cm⁻³) | 2.8×10¹⁹ | 1.04×10¹⁹ | 4.7×10¹⁷ |\n| N_v (cm⁻³) | 1.04×10¹⁹ | 6.0×10¹⁸ | 7.0×10¹⁸ |\n| μ_n (cm²/V·s) | 1350 | 3900 | 8500 |\n| μ_p (cm²/V·s) | 480 | 1900 | 400 |\n| D_n, D_p (cm²/s) | 35, 12.4 | 101, 49 | 220, 10 |\n| Relative permittivity ε_r | 11.7 | 16.0 | 12.9 |\n| Electron affinity χ (eV) | 4.05 | 4.0 | 4.07 |\n| Saturation velocity v_sat (cm/s) | 1×10⁷ | 6×10⁶ | about 1×10⁷ |\n| Melting point (°C) | 1414 | 937 | 1238 |\n\n## Crystals (Q5–Q8)\n\n    Miller indices: intercepts → reciprocals → clear fractions → (h k l)        (Q6, Q7)\n    d_hkl = a / √(h² + k² + l²)                    spacing of (h k l) planes, cubic crystal\n    Diamond lattice: 8 atoms per cell, 4 nearest neighbours, bond angle 109.5°  (Q8)\n\n## Growth (Q9–Q13)\n\n    SiO₂ + 2C → Si + 2CO                   (MG-Si, about 98 % pure, arc furnace)       (Q9)\n    Si + 3HCl → SiHCl₃ + H₂                (trichlorosilane, about 300 °C)\n    SiHCl₃ + H₂ → Si + 3HCl                (Siemens CVD, about 1100 °C → EG-Si)\n    k₀ = C_s/C_l;    C_s = k₀C₀(1 − f)^{k₀ − 1}        (CZ segregation)              (Q10, Q11)\n    SiCl₄ + 2H₂ → Si + 4HCl                (VPE of silicon)                            (Q12)\n\n## Doping and diffusion (Q14–Q21)\n\n    n ≈ N_D (n-type),   p ≈ N_A (p-type),   complete ionisation               (Q15, Q34)\n    Fick's first law:   F = −D ∂C/∂x                                             (Q18, Q39)\n    Fick's second law:  ∂C/∂t = D ∂²C/∂x²                                        (Q18)\n    D = D₀ e^{−E_a/kT}                                                           (Q17)\n    Constant source:    C(x, t) = C_s erfc( x / 2√(Dt) ),   Q = 2C_s√(Dt/π)         (Q19)\n    Limited source:     C(x, t) = ( Q/√(πDt) ) e^{−x²/4Dt}\n    Junction depth:     C(x_j) = N_B\n    Implant:            N(x) = ( Φ/(√(2π)ΔR_p) ) e^{−(x − R_p)²/2ΔR_p²},   Φ = It/qA    (Q20)\n\n## Bands and carrier statistics (Q22–Q34)\n\n    Schrödinger:   −(ħ²/2m) d²ψ/dx² + V(x)ψ = Eψ                                (Q23)\n    Kronig–Penney: P sin(αa)/(αa) + cos(αa) = cos(ka)                            (Q24)\n    E_g = E_c − E_v;    λ = 1.24/E_g μm                                          (Q25, Q26)\n    Fermi–Dirac:   f(E) = 1 / (1 + e^{(E − E_F)/kT})                             (Q30, Q31)\n    g_c(E) = ( 4π(2m_n∗)^{3/2}/h³ ) √(E − E_c)                                   (Q32)\n    n = N_c e^{−(E_c − E_F)/kT},     p = N_v e^{−(E_F − E_v)/kT}                 (Q27)\n    n_i = √(N_cN_v) e^{−E_g/2kT}     (boxed result of Q27)\n    np = n_i²                         (mass-action law)                          (Q28, Q29, Q34)\n    E_F − E_i = kT ln(N_D/n_i)   (n-type);    E_i − E_F = kT ln(N_A/n_i)   (p-type)    (Q33, Q34)\n    E_c − E_F = kT ln(N_c/N_D)\n\n## Transport (Q35–Q41)\n\n    v_d = μE;    μ = qτ_m/m∗;    1/μ = 1/μ_L + 1/μ_I   (Matthiessen)              (Q35, Q36)\n    J = q(nμ_n + pμ_p)E;    σ = q(nμ_n + pμ_p);    ρ = 1/σ   (boxed result of Q37)   (Q37, Q38)\n    J_n = qnμ_nE + qD_n dn/dx;    J_p = qpμ_pE − qD_p dp/dx                       (Q39)\n    Einstein:  D/μ = kT/q                                                         (Q40)\n    High field: v_d → v_sat ≈ 1×10⁷ cm/s                                          (Q41)\n\n## Recombination and continuity (Q42–Q46)\n\n    SRH:   U = (np − n_i²) / [ τ_p(n + n₁) + τ_n(p + p₁) ],    τ = 1/(σv_thN_t)       (Q43)\n    Low-level, n-type:  U = Δp/τ_p;    Δp(t) = Δp(0) e^{−t/τ_p}                     (Q42, Q44)\n    Continuity:  ∂Δp/∂t = D_p ∂²Δp/∂x² − μ_pE ∂Δp/∂x + G_L − Δp/τ_p                (Q45)\n    Steady state, no field:  Δp(x) = Δp(0) e^{−x/L_p},   L_p = √(D_pτ_p)\n    Surface:  U_s = SΔp_s,   S = σv_thN_st                                         (Q46)\n    1/τ_eff = 1/τ_b + 2S/W   (valid when SW/2D ≪ 1);   for large S, τ_surface ≈ W/2S + W²/(π²D)\n\n## Junctions, contacts and characterisation (Q47–Q50)\n\n    V_bi = (kT/q) ln( N_{A}N_D / n_i² )                                            (Q47)\n    W = √( (2ε_s/q)(V_bi − V)(1/N_A + 1/N_D) );    N_{A}x_p = N_{D}x_n;   E_max = qN_{D}x_n/ε_s\n    Law of the junction:  p_n(x_n) = p_n0 e^{qV/kT}                                 (Q48)\n    I = I_s ( e^{qV/kT} − 1 ),    J_s = qn_i²( D_p/(L_pN_D) + D_n/(L_nN_A) )   (boxed result of Q48)\n    Schottky:  Φ_B = Φ_m − χ;   V_bi = Φ_m − Φ_s;   J_s = A∗∗T² e^{−qΦ_B/kT}         (Q49)\n    Ohmic by tunnelling:  N_D ≳ 10¹⁹ cm⁻³, so W = √(2ε_sV_bi/qN_D) is a few nm\n    I-V:  I = I_s ( e^{qV/ηkT} − 1 );   η = (q/kT) dV/d(ln I)                        (Q50)\n    C-V:  C = ε_sA/W;   1/C² = 2(V_bi − V)/(qε_sNA²);   N = 2/(qε_sA² |slope|);   V_bi = V-axis intercept\n\n## Rules of thumb\n\n- Each decade of doping moves E_F by 2.3kT ≈ 60 mV; each 60 mV of forward bias multiplies a diode's current by 10 (300 K).\n- In silicon at room temperature, n_i roughly doubles for every 10 °C rise.\n- 10¹⁶ cm⁻³ of dopant is 1 atom in 5×10⁶ silicon atoms (Si has 5×10²² atoms/cm³), yet it raises the conductivity nearly a million times (from 3×10⁻⁶ to 2.2 S/cm, n-type).\n- Diffusion distances go as √(Dt): four times the time gives twice the depth.\n", "group": "Revision tools", "eyebrow": "Revision tools", "disp": "·"}, {"num": "07", "title": "Practice Examination Papers", "body": "\nThree full practice papers built from the 50 questions. Each question combines two or three of the 50, the way exam questions often do, and some parts change the numbers so you cannot simply recall an answer. The layout (eight questions, answer any five, 3 hours) is a practice format only: follow the instructions printed on your real paper.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| Å | Ångström, a unit of length | 1 Å = 10⁻¹⁰ m = 0.1 nm |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| a | Lattice constant: edge length of the cubic unit cell | Å; Si 5.43, Ge and GaAs 5.65 |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| S | Surface recombination velocity | cm/s |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| C, C_j | Capacitance (junction or depletion capacitance) | F (pF = 10⁻¹² F) |\n| Φ_m | Work function of a metal | eV; Al 4.28, Au 5.1 |\n| Φ_s | Work function of a semiconductor, χ + (E_c − E_F) | eV |\n| χ | Electron affinity: energy from E_c up to the vacuum level | eV; Si 4.05 |\n| Φ_B | Schottky barrier height seen from the metal | eV (or V) |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| VPE | Vapour-phase epitaxy |\n| LPE | Liquid-phase epitaxy |\n| MBE | Molecular-beam epitaxy |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n**How to use them.** Sit each paper in one go, timed, with only a calculator and the constants below. Then mark yourself: the marking guide after each paper says which model answers to use, and gives the answers to the new numerical parts.\n\n**Constants (supplied in each paper):** q = 1.6×10⁻¹⁹ C; kT/q = 0.0259 V at 300 K; for Si: n_i = 1×10¹⁰ cm⁻³, N_c = 2.8×10¹⁹ cm⁻³, N_v = 1.04×10¹⁹ cm⁻³, E_g = 1.12 eV, χ = 4.05 eV, ε_s = 1.04×10⁻¹² F/cm, μ_n = 1350 cm²/V·s, μ_p = 480 cm²/V·s, lattice constant 5.43 Å.\n\n---\n\n## Practice Paper 1\n\n*Answer any FIVE questions. Each question carries 20 marks. Time: 3 hours.*\n\n**1.** (a) Define a semiconductor and explain how its conductivity differs from that of a conductor and an insulator. *(8 marks)*\n(b) Define Miller indices. *(4 marks)*\n(c) A plane makes intercepts of a, 2b and ∞ (parallel to the z-axis) on the axes of a cubic silicon crystal. Find its Miller indices and the spacing between neighbouring planes of this family. *(8 marks)*\n\n**2.** (a) Describe the major stages in converting metallurgical-grade silicon into electronic-grade silicon. Give the chemical equations. *(10 marks)*\n(b) Explain the principle and operation of the Czochralski method. *(10 marks)*\n\n**3.** (a) Explain the principle of ion implantation and its major advantages over thermal diffusion. *(10 marks)*\n(b) Compare diffusion and ion implantation as doping techniques. *(10 marks)*\n\n**4.** (a) What is meant by an intrinsic semiconductor? *(3 marks)*\n(b) Derive the expression for the intrinsic carrier concentration. *(12 marks)*\n(c) For GaAs at 300 K, N_c = 4.7×10¹⁷ cm⁻³, N_v = 7.0×10¹⁸ cm⁻³ and E_g = 1.42 eV. Calculate n_i. *(5 marks)*\n\n**5.** (a) Explain how the Fermi level changes with doping in n-type and p-type semiconductors. Illustrate with band diagrams. *(10 marks)*\n(b) Silicon is doped with N_A = 2×10¹⁵ cm⁻³ acceptors. Assuming complete ionisation, find the hole and electron concentrations at 300 K and the position of the Fermi level relative to E_i. *(10 marks)*\n\n**6.** (a) Derive the expression for the drift current density due to electrons and holes. *(12 marks)*\n(b) n-type silicon has n = 1×10¹⁵ cm⁻³. Calculate the electron drift current density in a field of 50 V/cm. *(8 marks)*\n\n**7.** (a) Explain the Shockley–Read–Hall recombination mechanism. *(12 marks)*\n(b) Define minority-carrier lifetime and explain its significance in semiconductor devices. *(8 marks)*\n\n**8.** (a) Explain the formation of the depletion region and built-in potential in a p-n junction. *(10 marks)*\n(b) A silicon p⁺n junction has N_A = 1×10¹⁸ cm⁻³ and N_D = 1×10¹⁵ cm⁻³. Calculate the built-in potential and the zero-bias depletion width at 300 K. *(10 marks)*\n\n### Marking guide, Paper 1\n\n| Question | Model answers to mark against | Answers to new numerical parts |\n|---|---|---|\n| 1 | Q1, Q6, Q7 | Intercepts 1, 2, ∞ → reciprocals 1, ½, 0 → × 2 → **(2 1 0)**; d = a/√(2² + 1² + 0²) = 5.43/√5 = **2.43 Å** |\n| 2 | Q9, Q10 | — |\n| 3 | Q20, Q21 | — |\n| 4 | Q27 | n_i = √(N_cN_v) e^{−E_g/2kT} = √(4.7×10¹⁷ × 7.0×10¹⁸) × e^{−1.42/0.0518} = **2.3×10⁶ cm⁻³** |\n| 5 | Q33, Q34 | p = N_A = **2×10¹⁵ cm⁻³**; n = n_i²/p = **5×10⁴ cm⁻³**; E_i − E_F = 0.0259 ln(2×10¹⁵/10¹⁰) = **0.32 eV below E_i** |\n| 6 | Q37, Q38 | J_n = qnμ_nE = 1.6×10⁻¹⁹ × 10¹⁵ × 1350 × 50 = **10.8 A/cm²** |\n| 7 | Q43, Q44 | — |\n| 8 | Q47 | V_bi = 0.0259 ln(10¹⁸ × 10¹⁵/10²⁰) = **0.775 V**; W ≈ √(2ε_sV_bi/qN_D) = **1.0 μm**, almost all on the n side |\n\n---\n\n## Practice Paper 2\n\n*Answer any FIVE questions. Each question carries 20 marks. Time: 3 hours.*\n\n**1.** (a) Distinguish between elemental and compound semiconductors, giving two examples of each. *(8 marks)*\n(b) Compare the properties and applications of Si, Ge and GaAs. *(12 marks)*\n\n**2.** (a) What is a crystal lattice? Explain the significance of crystal structure in semiconductor materials. *(10 marks)*\n(b) Explain the difference between covalent, ionic and metallic bonding, and identify the dominant bonding in silicon. *(10 marks)*\n\n**3.** (a) State four advantages and two limitations of the Czochralski method. *(8 marks)*\n(b) Compare VPE, LPE and MBE in terms of growth mechanism, temperature, precision and applications. *(12 marks)*\n\n**4.** (a) What is doping, and why is it necessary in device fabrication? *(6 marks)*\n(b) Differentiate between n-type and p-type semiconductors. *(6 marks)*\n(c) Explain the difference between donor and acceptor impurities, with examples. *(8 marks)*\n\n**5.** (a) State the time-independent Schrödinger equation and explain its terms. *(6 marks)*\n(b) Explain the Kronig–Penney model and how it leads to energy bands. *(10 marks)*\n(c) Distinguish between the valence band, the conduction band and the forbidden gap. *(4 marks)*\n\n**6.** (a) Explain the Fermi–Dirac distribution function and its significance. *(8 marks)*\n(b) Explain what happens to the distribution at absolute zero. *(4 marks)*\n(c) Find the probability that a state 0.1 eV above the Fermi level is occupied at 300 K, and the probability that a state 0.1 eV below it is empty. *(8 marks)*\n\n**7.** (a) Explain diffusion current in a semiconductor and state Fick's law. *(10 marks)*\n(b) State and explain the Einstein relation. Use it to find the electron diffusion coefficient in a sample where μ_n = 1000 cm²/V·s at 300 K. *(10 marks)*\n\n**8.** (a) Differentiate between a Schottky barrier diode and an ohmic contact, and explain their energy-band characteristics. *(14 marks)*\n(b) Nickel (Φ_m = 5.15 eV) is deposited on n-type silicon with N_D = 1×10¹⁶ cm⁻³. Using the ideal model, find the barrier height Φ_B and the built-in potential V_bi. *(6 marks)*\n\n### Marking guide, Paper 2\n\n| Question | Model answers to mark against | Answers to new numerical parts |\n|---|---|---|\n| 1 | Q2, Q4 | — |\n| 2 | Q5, Q8 | — |\n| 3 | Q11, Q13 | — |\n| 4 | Q14, Q15, Q16 | — |\n| 5 | Q23, Q24, Q25 | — |\n| 6 | Q30, Q31 | f = 1/(1 + e^{0.1/0.0259}) = **0.021** (2 %); the state 0.1 eV below E_F is empty with probability 1 − f = **0.021** too, by symmetry |\n| 7 | Q39, Q40 | D_n = (kT/q)μ_n = 0.0259 × 1000 = **25.9 cm²/s** |\n| 8 | Q49 | Φ_B = Φ_m − χ = 5.15 − 4.05 = **1.10 eV**; Φ_s = 4.05 + 0.0259 ln(2.8×10¹⁹/10¹⁶) = 4.26 eV; V_bi = Φ_m − Φ_s = **0.89 V** (ideal; pinning lowers both in practice) |\n\n---\n\n## Practice Paper 3\n\n*Answer any FIVE questions. Each question carries 20 marks. Time: 3 hours.*\n\n**1.** (a) Explain why silicon is widely used in device fabrication. *(8 marks)*\n(b) Explain the principles of VPE, LPE and MBE. *(12 marks)*\n\n**2.** (a) Define Miller indices and explain how they identify crystal planes. *(8 marks)*\n(b) Determine the Miller indices of a plane with intercepts 2a, 3b and 1c, and sketch the plane. *(12 marks)*\n\n**3.** (a) Describe the mechanism of dopant diffusion in a semiconductor. *(10 marks)*\n(b) State and explain Fick's first and second laws of diffusion. *(10 marks)*\n\n**4.** (a) Explain the basic assumptions of the quantum-mechanical model of electrons in a semiconductor. *(8 marks)*\n(b) Explain the difference between direct and indirect band-gap semiconductors. *(8 marks)*\n(c) Calculate the longest wavelength of light that GaAs (E_g = 1.42 eV) can absorb or emit. *(4 marks)*\n\n**5.** (a) Explain the difference between intrinsic and extrinsic carrier concentrations. *(6 marks)*\n(b) Silicon has n_i = 1.0×10¹⁰ cm⁻³. If the electron and hole concentrations are equal, determine them. *(4 marks)*\n(c) Define the density of states and explain its importance in finding carrier concentrations. *(10 marks)*\n\n**6.** (a) Define carrier mobility and explain the factors that affect it. *(8 marks)*\n(b) Explain the mechanisms of carrier scattering. *(6 marks)*\n(c) Explain velocity saturation and hot-carrier effects. *(6 marks)*\n\n**7.** (a) What is meant by generation and recombination of carriers? *(5 marks)*\n(b) Explain the continuity equation for minority carriers and its application. *(9 marks)*\n(c) What is surface recombination velocity? Explain how surface states affect carrier lifetime. *(6 marks)*\n\n**8.** (a) Derive the ideal Shockley diode equation. *(12 marks)*\n(b) A Schottky diode of area 1×10⁻³ cm² gives a straight line of 1/C² against V with slope −1.2×10²¹ F⁻²V⁻¹, crossing the voltage axis at +0.80 V. Find the doping concentration of the semiconductor and the built-in potential. *(8 marks)*\n\n### Marking guide, Paper 3\n\n| Question | Model answers to mark against | Answers to new numerical parts |\n|---|---|---|\n| 1 | Q3, Q12 | — |\n| 2 | Q6, Q7 | — |\n| 3 | Q17, Q18 | — |\n| 4 | Q22, Q26 | λ = 1.24/E_g = 1.24/1.42 = **0.873 μm** (near infrared) |\n| 5 | Q28, Q29, Q32 | **n = p = 1.0×10¹⁰ cm⁻³** |\n| 6 | Q35, Q36, Q41 | — |\n| 7 | Q42, Q45, Q46 | — |\n| 8 | Q48, Q50 | N = 2/(qε_sA²\\|slope\\|) = 2/(1.6×10⁻¹⁹ × 1.04×10⁻¹² × 10⁻⁶ × 1.2×10²¹) = **1.0×10¹⁶ cm⁻³**; V_bi = intercept = **0.80 V** |\n", "group": "Revision tools", "eyebrow": "Revision tools", "disp": "·"}, {"num": "08", "title": "Last-Minute Flashcards", "body": "\nOne line per question: the facts, equations and numbers that every full answer must contain. Use this page in the last days before the exam. Cover the right-hand column, say the answer aloud, then check. If you cannot, go back to the full model answer.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| ħ | Reduced Planck constant, h/2π | 1.055×10⁻³⁴ J·s |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_t | Energy level of a trap (recombination centre) in the gap | eV |\n| E_a | Activation energy of dopant diffusion | eV; about 3–4 eV |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| g(E), g_c, g_v | Density of states: allowed states per unit energy per unit volume | states/(eV·cm³) |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| m∗, m_n∗, m_p∗ | Effective mass of electrons or holes | kg, or as a multiple of m₀ |\n| ψ | Wave function (\\|ψ\\|² is the probability density) | — |\n| α (Kronig–Penney) | √(2mE)/ħ, set by the electron energy | m⁻¹ |\n| P (Kronig–Penney) | Barrier strength mV₀ba/ħ² | dimensionless |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| (h k l), {h k l} | Miller indices of a plane; family of equivalent planes | integers |\n| C_s | Surface concentration of a diffusion (or solid concentration when freezing) | cm⁻³ |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| D | Diffusion coefficient (dopants in a furnace, or carriers) | cm²/s |\n| D₀ | Diffusion constant in D = D₀e^{−E_a/kT} | cm²/s |\n| F | Particle flux in Fick's law | particles/(cm²·s) |\n| Q | Dose: dopant atoms per unit area (in Weeks 13–14, Q also means charge) | atoms/cm² (C or C/cm² for charge) |\n| erfc | Complementary error function, erfc(u) = 1 − erf(u); read from a table | dimensionless |\n| R_p | Projected range: average depth at which implanted ions stop | μm |\n| R_s | Sheet resistance (or diode series resistance in Week 12) | Ω/□ (ohms per square); Ω |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| v_d | Drift velocity | cm/s |\n| v_sat | Saturation velocity at high field | ≈ 10⁷ cm/s in Si |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| T_e | Electron temperature of hot carriers | K |\n| G, G_L | Generation rate of electron–hole pairs (G_L: by light) | cm⁻³s⁻¹ |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| U | Net recombination rate, R − G | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| N_t | Density of traps (recombination centres) | cm⁻³ |\n| n₁, p₁ | SRH parameters n_ie^{(E_t − E_i)/kT} and n_ie^{(E_i − E_t)/kT} | cm⁻³ |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| S | Surface recombination velocity | cm/s |\n| N_st | Density of surface traps | cm⁻² |\n| U_s | Recombination rate per unit area at a surface | cm⁻²s⁻¹ |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I | Current | A |\n| η | Ideality factor of a diode, 1 (ideal) to 2 | dimensionless |\n| C, C_j | Capacitance (junction or depletion capacitance) | F (pF = 10⁻¹² F) |\n| Φ_m | Work function of a metal | eV; Al 4.28, Au 5.1 |\n| Φ_s | Work function of a semiconductor, χ + (E_c − E_F) | eV |\n| χ | Electron affinity: energy from E_c up to the vacuum level | eV; Si 4.05 |\n| Φ_B | Schottky barrier height seen from the metal | eV (or V) |\n| β | Common-emitter current gain, I_C/I_B (also h_FE) | dimensionless; 50–500 |\n| V_T (V_th) | Threshold voltage of a MOSFET | V |\n| v_dn, v_dp | Drift velocity of electrons and holes | cm/s |\n| μ_i, τ_i (μ_L, μ_I, N_I) | Mobility and scattering time for one scattering mechanism (L: lattice, I: ionised impurity); N_I = ionised-impurity density | cm²/(V·s); s; cm⁻³ |\n| G_n, G_p, R_n, R_p | Generation and recombination rates of electrons and holes | cm⁻³s⁻¹ |\n| τ_b (τ_bulk), τ_surface | Lifetime from bulk recombination only; from surface recombination only | s |\n| U_s, p_s, Δp_s | Surface recombination rate; hole density and excess at the surface | cm⁻²s⁻¹; cm⁻³ |\n| p_n, n_p | Minority-carrier density: holes on the n side, electrons on the p side | cm⁻³ |\n| erfc(u), erfc⁻¹ | Complementary error function, 1 − erf(u), and its inverse (read from a table) | dimensionless |\n| N(x), N(W) | Doping concentration at depth x (or at the depletion edge W), from C-V profiling | cm⁻³ |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| InP | Indium phosphide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| CB | Conduction band |\n| VB | Valence band |\n| III–V | Compound of Group III and Group V elements (e.g. GaAs) |\n| MG-Si | Metallurgical-grade silicon (≈ 98 % pure) |\n| EG-Si | Electronic-grade silicon (99.9999999 % or better) |\n| CZ | Czochralski crystal growth |\n| FZ | Float-zone crystal growth |\n| CVD | Chemical vapour deposition |\n| VPE | Vapour-phase epitaxy |\n| LPE | Liquid-phase epitaxy |\n| MBE | Molecular-beam epitaxy |\n| MOCVD | Metal-organic chemical vapour deposition |\n| UHV | Ultra-high vacuum (≈ 10⁻¹⁰ Torr) |\n| SRH | Shockley–Read–Hall (trap-assisted) recombination |\n| LDD | Lightly doped drain |\n| I-V | Current–voltage (measurement or characteristic) |\n| C-V | Capacitance–voltage (measurement or characteristic) |\n| HEMT | High-electron-mobility transistor |\n| BJT | Bipolar junction transistor |\n| HBT | Heterojunction bipolar transistor |\n| IC | Integrated circuit |\n| VLSI | Very-large-scale integration |\n| LED | Light-emitting diode |\n| RF | Radio frequency |\n| LHS | Left-hand side (of an equation) |\n| IR | Infrared |\n\n\n## Material physics and semiconductor growth (Q1–Q13)\n\n| Q | Topic | Must-know answer |\n|---|---|---|\n| 1 | Semiconductor vs conductor and insulator | Conductivity between metal and insulator, controllable by doping, T, light. Metal: no gap, σ falls with T. Insulator: gap > 4 eV. Semiconductor: gap ≈ 1 eV, two carriers, σ rises with T. |\n| 2 | Elemental and compound semiconductors | Elemental: one element, Group IV, covalent, e.g. **Si, Ge**. Compound: two or more elements (III–V, II–VI), tunable and often direct gap, e.g. **GaAs, InP**. |\n| 3 | Why silicon | Abundant and cheap; excellent native SiO₂; 1.12 eV gap gives low leakage to 150 °C; large perfect crystals; strong, good thermal conductor; well-understood doping. |\n| 4 | Si, Ge and GaAs | Gaps 1.12 / 0.66 / 1.42 eV; indirect / indirect / direct; μ_n 1350 / 3900 / 8500. Si for ICs and power; Ge for IR and SiGe HBTs; GaAs for RF, LEDs, lasers. |\n| 5 | Crystal lattice and structure | Lattice = periodic array of points; crystal = lattice + basis. Structure sets bands and gap, mobility, anisotropy, doping sites, epitaxy, cleavage and defects. |\n| 6 | Miller indices | Smallest integers proportional to reciprocals of intercepts. Steps: intercepts → reciprocals → clear fractions → (h k l). Infinite intercept → 0; negative → bar. |\n| 7 | Miller indices of intercepts 2a, 3b, 1c | 2, 3, 1 → 1/2, 1/3, 1 → × 6 → **(3 2 6)**. In a cubic crystal d = a/7. |\n| 8 | Covalent, ionic and metallic bonding | Covalent: shared pairs, directional. Ionic: electron transfer, Coulomb attraction. Metallic: electron sea. **Si is covalent**: four sp³ bonds, tetrahedral, 109.5°. |\n| 9 | MG-Si to EG-Si | SiO₂ + 2C → MG-Si (98 %); Si + 3HCl → SiHCl₃ (300 °C); fractional distillation; Siemens CVD SiHCl₃ + H₂ → Si + 3HCl (1100 °C) → EG-Si (9N–11N) polysilicon; then CZ/FZ. |\n| 10 | Czochralski growth | Seed dipped into melt at 1414 °C and slowly pulled (≈ 1 mm/min) with counter-rotation; melt freezes epitaxially on seed; Dash neck removes dislocations; shoulder, body, tail. |\n| 11 | Advantages and limitations of CZ | Advantages: large diameter, dislocation-free, controlled doping, low cost, oxygen strengthens and getters. Limitations: O and C contamination from crucible (limits resistivity), axial doping variation from segregation. |\n| 12 | VPE, LPE and MBE principles | VPE: gas reacts on hot substrate (SiCl₄ + 2H₂ → Si + 4HCl). LPE: precipitation from cooling saturated melt. MBE: atomic beams in UHV with shutters, monolayer control. |\n| 13 | VPE, LPE and MBE compared | Temperature VPE 1000–1250 °C > LPE 700–900 °C > MBE 500–650 °C. Precision MBE (atomic) > VPE > LPE. Uses: VPE production Si/MOCVD LEDs; LPE LEDs, thick layers; MBE quantum wells, HEMTs. |\n\n## Impurity control and doping (Q14–Q21)\n\n| Q | Topic | Must-know answer |\n|---|---|---|\n| 14 | What doping is and why | Controlled addition of impurities (10¹⁴–10²⁰ cm⁻³). Needed because intrinsic σ is too low and T-sensitive; sets carrier type, makes junctions, sets V_bi, V_T, β, contacts. |\n| 15 | n-type and p-type | n-type: Group V donors, electrons majority, E_F near E_c, n ≈ N_D. p-type: Group III acceptors, holes majority, E_F near E_v, p ≈ N_A. |\n| 16 | Donors and acceptors | Donor: one extra valence electron, gives it to CB, becomes +, level near E_c (P, As, Sb). Acceptor: one fewer, takes an electron creating a hole, becomes −, level near E_v (B, Al, Ga, In). |\n| 17 | Mechanism of dopant diffusion | Thermally activated jumps down a gradient. Vacancy (substitutional, slow: B, P, As), interstitial (fast: Au, Cu, Fe), interstitialcy. D = D₀e^{−E_a/kT}. Predeposition + drive-in. |\n| 18 | Fick's first and second laws | First law F = −D∂C/∂x (flux ∝ gradient). Second law ∂C/∂t = D∂²C/∂x² (from continuity), gives the profile's time evolution. |\n| 19 | Constant-source diffusion profile | Constant source → C = 10²⁰ erfc(x/2√(Dt)) cm⁻³. Maximum (10²⁰) at the surface, falling monotonically with depth; penetrates as √t; dose Q = (2/√π)C_s√(Dt). |\n| 20 | Ion implantation and its advantages | Ionised, mass-selected dopant ions accelerated (keV–MeV) into the wafer; Gaussian profile at R_p; anneal. Advantages: precise dose, independent depth, low temperature, resist masks, shallow and buried profiles. |\n| 21 | Diffusion vs ion implantation | Diffusion: high T, surface-peaked erfc/Gaussian, coupled dose/depth, no damage, cheap batch. Implant: room T, peak at R_p, ±1 % dose, damage needs anneal, channelling, costly, standard for VLSI. |\n\n## Energy bands and carrier statistics (Q22–Q34)\n\n| Q | Topic | Must-know answer |\n|---|---|---|\n| 22 | Assumptions of the quantum model | Wave nature; fixed nuclei (Born–Oppenheimer); perfect periodic potential; independent electrons in average potential; Bloch functions; Pauli principle; effective mass; Fermi–Dirac statistics. |\n| 23 | Schrödinger equation | −(ħ²/2m)d²ψ/dx² + Vψ = Eψ. Kinetic-energy term + potential-energy term = total energy E; \\|ψ\\|² is probability density; E eigenvalues give quantisation. |\n| 24 | Kronig–Penney model | Periodic square wells and barriers; Bloch condition gives P sin(αa)/αa + cos αa = cos ka. Only energies with LHS between ±1 are allowed → bands and gaps; edges at k = nπ/a. |\n| 25 | Valence band, conduction band, gap | VB: highest full band at 0 K (bond electrons, holes). CB: lowest empty band (free electrons). Gap E_g = E_c − E_v: no states. |\n| 26 | Direct and indirect band gaps | Direct: CB min and VB max at same k, photon only, efficient light (GaAs). Indirect: different k, phonon needed, poor emitter (Si, Ge). λ = 1.24/E_g μm. |\n| 27 | Intrinsic semiconductor; derive n_i | Pure, n = p = n_i. n = N_ce^{−(E_c−E_F)/kT}, p = N_ve^{−(E_F−E_v)/kT}; multiply: **n_i = √(N_cN_v) e^{−E_g/2kT}** ∝ T^{3/2}e^{−E_g/2kT}. |\n| 28 | Intrinsic and extrinsic concentrations | Intrinsic: thermal only, n = p = n_i, strongly T-dependent. Extrinsic: from dopants, n ≠ p, n ≈ N_D or p ≈ N_A, nearly T-independent. Linked by np = n_i². |\n| 29 | n and p when n = p = n_i | n = p and np = n_i² ⇒ **n = p = 1.0×10¹⁰ cm⁻³**. |\n| 30 | Fermi–Dirac function | f(E) = 1/(1 + e^{(E−E_F)/kT}): occupation probability of a state; ½ at E_F. Gives n and p, defines E_F, constant E_F in equilibrium sets junction physics. |\n| 31 | Fermi–Dirac at absolute zero | At 0 K f is a step: 1 below E_F, 0 above. VB full, CB empty, pure semiconductor is an insulator. |\n| 32 | Density of states | g(E) = states per unit energy per unit volume, g_c ∝ (m_n∗)^{3/2}√(E − E_c). n = ∫g f dE; gives N_c, N_v; zero in gap. |\n| 33 | Fermi level and doping | n-type: E_F rises toward E_c, E_F − E_i = kT ln(N_D/n_i). p-type: falls toward E_v. 60 mV per decade; degenerate at very high doping; returns to E_i at high T. |\n| 34 | Majority carriers for N_D = 5×10¹⁶ cm⁻³ | n ≈ N_D = **5×10¹⁶ cm⁻³**. (p = 2×10³ cm⁻³; E_F − E_i = 0.40 eV in Si.) |\n\n## Carrier transport and injection (Q35–Q46)\n\n| Q | Topic | Must-know answer |\n|---|---|---|\n| 35 | Mobility and what affects it | μ = v_d/E = qτ/m∗. Depends on effective mass, temperature (lattice T^{−3/2}, impurity T^{3/2}), doping, field, defects, surfaces, orientation, strain. |\n| 36 | Scattering mechanisms | Lattice (acoustic, optical, polar phonons), ionised impurity, neutral impurity, carrier–carrier, defects, surface roughness, alloy, intervalley. Matthiessen 1/μ = Σ1/μ_i. |\n| 37 | Drift current density | v_dn = −μ_nE, v_dp = μ_pE; J = ρv: J_n = qnμ_nE, J_p = qpμ_pE; **J = q(nμ_n + pμ_p)E**, σ = q(nμ_n + pμ_p). |\n| 38 | Electron drift current density | J = qnμ_nE = 1.6×10⁻¹⁹ × 2×10¹⁶ × 1350 × 10 = **43.2 A/cm²**. |\n| 39 | Diffusion current and Fick's law | Current from carriers moving down a concentration gradient by random motion. Fick: F = −D dC/dx. J_n = qD_n dn/dx, J_p = −qD_p dp/dx. |\n| 40 | Einstein relation | **D/μ = kT/q** (0.0259 V). From zero equilibrium current in a non-uniform sample. Si: D_n = 35, D_p = 12.4 cm²/s. |\n| 41 | Velocity saturation and hot carriers | High field: optical-phonon emission caps v_d at v_sat ≈ 10⁷ cm/s. Hot carriers (T_e ≫ T): impact ionisation, avalanche, oxide injection and V_T drift, substrate current; LDD as cure. |\n| 42 | Generation and recombination | Generation creates e–h pairs (thermal, optical, impact); recombination annihilates them (radiative, SRH, Auger, surface). Equal in equilibrium; net U = Δp/τ. |\n| 43 | SRH recombination | Recombination via mid-gap trap: capture/emission of electrons and holes. U = (np − n_i²)/[τ_p(n + n₁) + τ_n(p + p₁)]; maximum for E_t ≈ E_i; τ = 1/σv_thN_t. |\n| 44 | Minority-carrier lifetime | Average time an excess minority carrier survives: Δp(t) = Δp(0)e^{−t/τ}. Sets L = √(Dτ), diode leakage, switching speed, BJT gain, solar-cell efficiency. |\n| 45 | Continuity equation | ∂p/∂t = −(1/q)∂J_p/∂x + G − R; minority form ∂Δp/∂t = D∂²Δp/∂x² − Δp/τ + G. Used for diodes (exponential profile), BJTs, lifetime and Haynes–Shockley, solar cells. |\n| 46 | Surface recombination velocity | S defined by U_s = SΔp_s (cm/s), S = σv_thN_st. Dangling-bond surface states act as SRH centres and shorten the lifetime: 1/τ_eff = 1/τ_b + 2S/W when SW/2D ≪ 1 (for very large S the loss is limited by diffusion to the surface). Passivate with SiO₂, SiNₓ, Al₂O₃. |\n\n## Junctions, interfaces and characterisation (Q47–Q50)\n\n| Q | Topic | Must-know answer |\n|---|---|---|\n| 47 | Depletion region and built-in potential | Diffusion of carriers uncovers fixed ions → depletion region and field; drift balances diffusion; flat E_F. **V_bi = (kT/q) ln(N_{A}N_D/n_i²)**; W = √(2ε_sV_bi(N_A + N_D)/qN_{A}N_D). |\n| 48 | Shockley diode equation | Assumptions; law of junction p_n = p_n0e^{qV/kT}; diffusion equation → exponential decay over L_p; currents at edges; **I = I_s(e^{qV/kT} − 1)**, J_s = qn_i²(D_p/L_pN_D + D_n/L_nN_A). Forward: exponential rise; reverse: −I_s. |\n| 49 | Schottky diode vs ohmic contact | Schottky: Φ_m > Φ_s (n-type), upward bending, depletion, barrier Φ_B = Φ_m − χ, rectifying, thermionic, fast. Ohmic: Φ_m < Φ_s or heavy doping, accumulation or tunnelling, linear I-V. |\n| 50 | I-V and C-V characterisation | I-V: ln I vs V gives I_s, η, R_s, breakdown, Φ_B. C-V: C = ε_sA/W; **1/C² = 2(V_bi − V)/(qε_sNA²)**; slope gives N = 2/(qε_sA²·slope), intercept gives V_bi; local slope gives profile N(W). |\n\n## If you remember only ten things\n\n1. np = n_i², and n_i(Si) = 1×10¹⁰ cm⁻³ at 300 K.\n2. n ≈ N_D in n-type, p ≈ N_A in p-type (complete ionisation).\n3. n_i = √(N_cN_v) e^{−E_g/2kT}: a wider gap means far fewer carriers.\n4. f(E) = 1/(1 + e^{(E − E_F)/kT}); E_F moves 60 mV per decade of doping.\n5. J = q(nμ_n + pμ_p)E for drift; J_n = qD_n dn/dx for diffusion; D/μ = kT/q.\n6. Fick: F = −D ∂C/∂x and ∂C/∂t = D ∂²C/∂x²; constant source gives an erfc profile.\n7. Lifetime τ and diffusion length L = √(Dτ) control every injection device.\n8. V_bi = (kT/q) ln(N_{A}N_D/n_i²); W ∝ √(V_bi − V) and is wider on the lightly doped side.\n9. I = I_s(e^{qV/kT} − 1): forward current rises tenfold per 60 mV; reverse current saturates at −I_s.\n10. Schottky: Φ_B = Φ_m − χ, rectifying, thermionic, fast. Ohmic: heavy doping makes the barrier thin enough to tunnel through. C-V: the slope of 1/C² against V gives the doping, the intercept gives V_bi.\n", "group": "Revision tools", "eyebrow": "Revision tools", "disp": "·"}, {"num": "09", "title": "Glossary — Key Terms, Symbols, Constants and Abbreviations", "body": "\nEvery key term, symbol, constant and abbreviation used in the 50 model answers. Each question also defines its own key terms, and each page has its own symbols table.\n\n## Key terms A–Z\n\n| Term | Meaning | Questions |\n|---|---|---|\n| **Absolute zero (0
