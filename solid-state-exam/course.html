K)** | the lowest possible temperature, where thermal energy kT = 0. | Q31 |\n| **Acceptor** | a Group III atom (B, Al, Ga, In) that takes an electron from a bond, creating a hole and making silicon p-type. | Q14, Q16, Q33 |\n| **Acceptor and donor ions (N_A⁻, N_D⁺)** | dopant atoms that have taken or given up an electron; they are charged and fixed in the lattice, so they cannot move. | Q47 |\n| **Activation energy (E_a)** | the energy barrier an atom must overcome to make one jump, in eV. | Q17 |\n| **Allowed band** | a range of energies for which electron states exist. | Q24 |\n| **Allowed state** | an energy level that an electron may occupy in the crystal (in the conduction or valence band, not in the gap). | Q30, Q32 |\n| **Annealing** | heating after implantation to repair lattice damage and place dopants on lattice sites where they become electrically active. | Q20, Q21 |\n| **Autodoping / out-diffusion** | unwanted transfer of dopant from the substrate into the growing layer, by evaporation and re-deposition / by diffusion at high temperature. | Q13 |\n| **Background doping (N_B)** | the doping the wafer already has, of the opposite type to the diffused dopant. | Q19 |\n| **Band gap (E_g)** | the forbidden energy range between the top of the valence band (E_v) and the bottom of the conduction band (E_c), E_g = E_c − E_v, in electron-volts (eV). | Q1, Q2, Q3, Q4, Q25, Q27, Q32 |\n| **Band-gap engineering** | tuning E_g by alloying compounds, e.g. Al_{x}Ga_{1−x}As. | Q2 |\n| **Barrier strength (P)** | a dimensionless number measuring how tightly each atom holds its electrons. | Q24 |\n| **Basis** | the atom or group of atoms attached to each lattice point; crystal = lattice + basis. | Q5 |\n| **Bloch's theorem** | in a periodic potential the wave function satisfies ψ(x + L) = e^{ikL}ψ(x), where L is the period; it is a travelling wave times a periodic function. | Q24 |\n| **Boltzmann approximation** | replacing the Fermi–Dirac function by an exponential when E_F is more than about 3kT from the band edge. | Q27, Q30 |\n| **Brillouin-zone boundary** | the values k = ±nπ/a where the electron wave is Bragg-reflected by the lattice and band edges occur. | Q24 |\n| **Built-in potential (V_bi)** | the voltage across the depletion region in equilibrium; the barrier majority carriers must climb to cross the junction. | Q47, Q49 |\n| **Bulk lifetime (τ_bulk)** | the lifetime set by recombination inside the volume alone (s). | Q46 |\n| **C-V characterisation** | measuring small-signal capacitance as the DC reverse bias is stepped, to find doping and V_bi. | Q50 |\n| **Capture / emission** | a trap taking a carrier from a band / giving a carrier back to a band. | Q43 |\n| **Capture cross-section (σ_n, σ_p)** | the effective target area a trap presents to an electron or a hole (cm²). | Q43 |\n| **Carrier concentration (n, p)** | the number of free electrons (n) or holes (p) per cm³. | Q30 |\n| **Channelling** | ions travelling unusually deep along open crystal directions; prevented by tilting the wafer about 7°. | Q20 |\n| **Chemical vapour deposition (CVD)** | growing a solid from gases that react on a hot surface. | Q9 |\n| **Compensation** | partial cancelling when both donors and acceptors are present. | Q33 |\n| **Complementary error function (erfc)** | erfc(u) = 1 − erf(u); a tabulated function that equals 1 at u = 0 and falls rapidly towards 0 as u grows. | Q19 |\n| **Complete ionisation** | every dopant atom has given up its electron (donor) or hole (acceptor); true for Si at room temperature. | Q28, Q34 |\n| **Compound semiconductor** | a semiconductor made of two or more different elements in a fixed ratio. | Q2 |\n| **Concentration (C)** | the number of dopant atoms per unit volume, cm⁻³. | Q18 |\n| **Concentration gradient (∂C/∂x)** | the rate at which concentration changes with depth, cm⁻⁴. | Q18, Q39 |\n| **Conduction band** | the band above the valence band; electrons in it are free to move and carry current. | Q1, Q31 |\n| **Conduction band (E_c) and valence band (E_v)** | the band of free-electron states and the band of bonding-electron states; E_c and E_v are their edges. | Q16 |\n| **Conduction band / valence band** | the band of energies where electrons move freely / the band of energies occupied by the bonding electrons; they are separated by the band gap E_g (1.12 eV in Si). | Q42 |\n| **Conduction-band minimum / valence-band maximum** | the lowest point of the conduction band and the highest point of the valence band on the E–k diagram. | Q26 |\n| **Conductivity (σ)** | how easily a material carries electric current, in S/cm; its inverse is resistivity ρ = 1/σ in Ω·cm. | Q1, Q37 |\n| **Constant-source diffusion (predeposition)** | diffusion in which a dopant supply keeps the surface concentration fixed at C_s for the whole process. | Q19 |\n| **Continuity (conservation of atoms)** | atoms are neither created nor destroyed, so any change in the number stored in a slice equals inflow minus outflow. | Q18 |\n| **Continuity equation** | a book-keeping statement that carriers are conserved: change = net inflow + generation − recombination. | Q45 |\n| **Covalent bond** | a pair of electrons shared between neighbouring atoms (four per Si atom). | Q25 |\n| **Crystal lattice** | an infinite, periodic three-dimensional array of points in which every point has identical surroundings. | Q5 |\n| **Crystal plane** | a flat sheet passing through lattice points of a crystal. | Q6 |\n| **Current density (J)** | charge crossing unit area per unit time (A/cm²). | Q37, Q38, Q45 |\n| **Czochralski (CZ) method** | growth of a large single crystal by slowly pulling a seed crystal from molten silicon. | Q3, Q11 |\n| **Dangling bond** | an unpaired bond left on a surface atom because the crystal ends there. | Q46 |\n| **Dash necking** | pulling a thin neck (≈ 3 mm wide) quickly at the start so that dislocations grow out of the sides. | Q10 |\n| **Degenerate semiconductor** | one so heavily doped that E_F is within 3kT of a band edge or inside a band. | Q33 |\n| **Delocalised electrons** | electrons not tied to any one atom, free to move through the whole crystal. | Q8 |\n| **Density of states (g(E))** | the number of allowed states per unit energy per unit volume at energy E (cm⁻³eV⁻¹). | Q32 |\n| **Depletion / accumulation layer** | a surface layer with fewer / more majority carriers than the bulk; bands bend up / down in n-type. | Q49 |\n| **Depletion capacitance (C)** | capacitance of the carrier-free depletion layer, C = ε_sA/W (F). | Q50 |\n| **Depletion region (space-charge region), width W** | the layer around the junction emptied of mobile carriers, containing only fixed ion charge. | Q47 |\n| **Diamond cubic / zinc blende** | the crystal structures of Si and of GaAs; both have each atom bonded to four neighbours, but in zinc blende the two kinds of atom alternate. | Q2, Q4 |\n| **Diamond cubic structure** | two interpenetrating face-centred cubic (FCC) lattices offset by a quarter of the body diagonal; each atom has four tetrahedral neighbours (the structure of Si and Ge). | Q5 |\n| **Diffusion** | the net movement of atoms from a region of high concentration to one of low concentration, caused by their random thermal motion. | Q17, Q39, Q47 |\n| **Diffusion coefficient (D)** | a measure of how fast a dopant spreads, in cm²/s. | Q17, Q18, Q39, Q40, Q44, Q46, Q48 |\n| **Diffusion current density** | the current carried by the diffusion flux of charged carriers (A/cm²). | Q39 |\n| **Diffusion length (L)** | average distance a minority carrier diffuses before recombining, L = √(Dτ). | Q44, Q45, Q48 |\n| **Diffusion length (√(Dt))** | the characteristic distance dopant spreads in time t; the profile's depth scale is 2√(Dt). | Q19 |\n| **Direct / indirect band gap** | direct means an electron can drop across the gap and emit light without changing its momentum; indirect means a lattice vibration (phonon) must also take part, so light emission is weak. | Q2, Q4 |\n| **Directional bond** | a bond that points along fixed directions, so it fixes the angles between neighbouring atoms. | Q8 |\n| **Dislocation** | a line defect, a row of atoms out of place; it causes leakage and must be removed. | Q10, Q11 |\n| **Donor** | a Group V atom (P, As, Sb) that gives a free electron to silicon, making it n-type. | Q14, Q16, Q33 |\n| **Donor / acceptor** | an impurity that gives an electron to the conduction band (e.g. P in Si; concentration N_D) / takes an electron from the valence band, creating a hole (e.g. B in Si; concentration N_A). | Q28 |\n| **Donor concentration (N_D)** | number of donor atoms per cm³; each ionised donor gives one free electron. | Q34 |\n| **Dopant** | an impurity added on purpose to control conductivity, e.g. boron (B) or phosphorus (P). | Q3, Q10, Q14 |\n| **Doping** | adding a small, controlled amount of a chosen impurity to change the number of carriers. | Q1 |\n| **Doping profile N(x)** | doping concentration as a function of depth below the surface. | Q50 |\n| **Dose (Q)** | the total number of dopant atoms introduced per cm² of surface (the area under the profile). | Q19, Q20, Q21 |\n| **Drift** | carrier motion caused by an electric field. | Q37, Q38, Q47 |\n| **Drift and diffusion** | carrier motion driven by an electric field E, and by a concentration gradient. | Q45 |\n| **Drift velocity (v_d)** | the small average velocity carriers gain in the direction of an electric field (cm/s). | Q35, Q37, Q38, Q41 |\n| **E_c, E_v** | the energy of the bottom of the conduction band and the top of the valence band (eV). | Q25 |\n| **Effective density of states (N_c, N_v)** | the number of states per cm³ that, placed at the band edge, give the same carrier count as the whole band; Si at 300 K: N_c = 2.8×10¹⁹, N_v = 1.04×10¹⁹ cm⁻³. | Q27, Q32, Q33 |\n| **Effective lifetime (τ_eff)** | the lifetime actually measured, including both bulk and surface losses (s). | Q46 |\n| **Effective mass (m∗)** | the mass a carrier appears to have when pushed by a force inside the crystal. | Q22, Q32, Q35, Q37 |\n| **Effusion cell** | a small heated oven that evaporates one element to make an atomic beam (MBE). | Q12 |\n| **Eigenvalue** | an allowed value of E for which the equation has an acceptable solution. | Q23 |\n| **Electron affinity (χ)** | energy from the conduction-band edge E_c up to the vacuum level; 4.05 eV for Si, independent of doping. | Q49 |\n| **Electron concentration (n)** | the number of free electrons in the conduction band per cm³ (cm⁻³). | Q29 |\n| **Electron mobility (μ_n)** | drift velocity per unit electric field, cm²/V·s; higher mobility means faster devices. | Q4 |\n| **Electron-volt (eV)** | the energy an electron gains across 1 V; 1 eV = 1.6×10⁻¹⁹ J. | Q25 |\n| **Electronegativity** | how strongly an atom attracts electrons towards itself. A large difference between two atoms favours ionic bonding. | Q8 |\n| **Electronic-grade silicon (EG-Si)** | polycrystalline silicon of 99.9999999 % (\"9N\") purity or better, i.e. at most about one impurity atom per billion silicon atoms. | Q9 |\n| **Electron–hole pair** | a free electron plus the empty bond (hole) it leaves behind when a covalent bond breaks. | Q8, Q42 |\n| **Elemental semiconductor** | a semiconductor made of a single chemical element. | Q2 |\n| **Energy band** | a wide range of closely spaced allowed electron energies formed when many atoms join into a solid. | Q1, Q25 |\n| **Epitaxy** | growth of a thin single-crystal layer that copies the crystal arrangement of the substrate. | Q5, Q12, Q13 |\n| **Excess carrier concentration (Δp, Δn)** | the carrier density above its equilibrium value, Δp = p − p₀ (cm⁻³). | Q44, Q45 |\n| **Excess carrier density (Δp, Δn)** | the amount by which a carrier density exceeds its equilibrium value. | Q48 |\n| **Extrinsic semiconductor** | a doped semiconductor whose carrier density is set by the dopants, not by n_i. | Q14, Q28 |\n| **E–k diagram (band structure)** | a graph of allowed electron energy E against k. | Q26 |\n| **Fermi level (E_F)** | the energy at which a state has a 50 % chance of being occupied; its position shows whether electrons or holes dominate. | Q15, Q27, Q30, Q31, Q33, Q40, Q47 |\n| **Fermi level (E_F) and intrinsic level (E_i)** | the 50 %-occupancy energy, and its value in the pure material (near mid-gap). | Q28, Q34 |\n| **Fermion** | a particle, such as the electron, that obeys the Pauli exclusion principle. | Q30 |\n| **Fermi–Dirac distribution f(E)** | the probability that an electron state of energy E is occupied in thermal equilibrium. | Q22 |\n| **Fermi–Dirac function (f(E))** | the probability that an allowed electron state at energy E is occupied in thermal equilibrium. | Q31, Q32 |\n| **Float-zone (FZ) method** | the crucible-free alternative, in which a molten zone is moved along a polysilicon rod. | Q11 |\n| **Flux (F)** | the number of atoms crossing unit area per unit time, atoms/(cm²·s). | Q18, Q39 |\n| **Forbidden gap** | a range of energies for which no electron states exist. | Q24 |\n| **Fractional distillation** | separating liquids by repeatedly boiling and condensing them, using their different boiling points. | Q9 |\n| **Free carrier** | an electron in the conduction band or a hole in the valence band, able to carry current. | Q31 |\n| **Generation rate (G)** | number of electron–hole pairs created per unit volume per unit time (cm⁻³s⁻¹). | Q42 |\n| **Group IV, III–V, II–VI** | columns of the periodic table; e.g. a III–V compound joins a group III element (Ga, In, Al) with a group V element (As, P, N). | Q2 |\n| **Hamiltonian (Ĥ)** | the total-energy operator, kinetic plus potential. | Q23 |\n| **HEMT / MESFET** | high-speed field-effect transistors made in GaAs for microwave circuits. | Q4 |\n| **Hole** | the empty place left in a bond when an electron is freed; it moves through the crystal like a positive charge. | Q1, Q15, Q25 |\n| **Hole concentration (p)** | the number of holes (empty bond states in the valence band) per cm³ (cm⁻³). | Q29 |\n| **Homoepitaxy / heteroepitaxy** | growing the same material (Si on Si) / a different material (AlGaAs on GaAs). | Q12 |\n| **Hot carrier** | a carrier whose average energy is far above the thermal value (3/2)kT; described by an electron temperature T_e much greater than the lattice temperature T. | Q41 |\n| **I-V characterisation** | measuring current as the DC voltage is stepped, to extract saturation current, ideality factor, series resistance, leakage, breakdown and barrier height. | Q50 |\n| **Ideality factor (η)** | 1 for pure diffusion (or thermionic emission) current, up to 2 when depletion-region recombination dominates. | Q50 |\n| **Impact ionisation** | a hot carrier breaks a covalent bond and creates a new electron–hole pair. | Q41 |\n| **Impurity (dopant)** | a foreign atom sitting on a lattice site of the semiconductor in place of a host atom (a substitutional impurity). | Q16 |\n| **Ingot (boule)** | the large cylindrical single crystal that is pulled; later sliced into wafers. | Q10 |\n| **Intercept** | the distance from the origin at which a plane cuts a crystal axis, measured in units of the lattice constants a, b, c. | Q6, Q7 |\n| **Interface abruptness** | how sharply the composition or doping changes from one layer to the next. | Q13 |\n| **Interface trap density (D_it)** | the number of unwanted electron states at the Si/SiO₂ boundary per cm² per eV. | Q3 |\n| **Interplanar spacing (d_hkl)** | the perpendicular distance between neighbouring parallel planes of the same (h k l) set. | Q6, Q7 |\n| **Interstitial site** | a space between normal lattice sites where a small atom can sit. | Q17 |\n| **Intrinsic carrier concentration (n_i)** | the number of electrons (equal to holes) per cm³ created by heat in pure material; 1×10¹⁰ cm⁻³ for Si at 300 K. | Q3, Q4, Q14, Q27, Q28, Q29, Q47 |\n| **Intrinsic gettering** | trapping of metal impurities by oxygen precipitates deep in the wafer, away from the devices at the surface. | Q11 |\n| **Intrinsic level (E_i)** | the Fermi level of undoped material, close to mid-gap (about 0.56 eV below E_c in Si). | Q33, Q40, Q43 |\n| **Intrinsic semiconductor** | a pure semiconductor whose free electrons and holes come only from breaking bonds by heat, so n = p = n_i. | Q14, Q27, Q29 |\n| **Ion** | an atom that has lost electrons (positive ion, e.g. Na⁺) or gained them (negative ion, e.g. Cl⁻). | Q8 |\n| **Ion energy (E)** | the kinetic energy gained by an ion of charge q through accelerating voltage V, E = qV (keV to MeV). | Q20 |\n| **Ion implantation** | doping by firing accelerated dopant ions into the wafer. | Q20, Q21 |\n| **Ionisation energy** | the small energy needed to free the donor's electron (E_c − E_D) or to fill the acceptor's empty bond (E_A − E_v); about 0.04–0.05 eV in Si. | Q16 |\n| **Ionised impurity** | a dopant that has given up or taken an electron and so carries a fixed charge (N_D⁺ or N_A⁻). | Q16, Q36 |\n| **Junction depth (x_j)** | the depth where the diffused concentration equals N_B, so a p-n junction forms. | Q19 |\n| **kT** | the typical thermal energy of a particle; 0.0259 eV at 300 K (k = Boltzmann's constant, T = absolute temperature). | Q1 |\n| **Lateral diffusion** | sideways spread of dopant under the edge of a mask window. | Q21 |\n| **Lattice** | the regular, repeating arrangement of atoms in a crystal; its repeat distance is the lattice period a. | Q22 |\n| **Lattice constant (a)** | the edge length of a cubic unit cell; Si 5.43 Å (1 Å = 10⁻¹⁰ m). | Q5, Q6 |\n| **Lattice constants (a, b, c)** | the edge lengths of the unit cell along x, y and z. | Q7 |\n| **LDD (lightly doped drain)** | a MOSFET drain extension with lower doping that reduces the peak field. | Q41 |\n| **Leakage current** | the small unwanted current through a reverse-biased junction, caused by thermally generated carriers. | Q3 |\n| **Lifetime (τ_p)** | average survival time of an excess minority carrier (s). | Q45, Q48 |\n| **Low-level injection** | excess carrier density much smaller than the majority density. | Q43, Q44, Q48 |\n| **Lowest common multiple (LCM)** | the smallest number that all the denominators divide into exactly. | Q6, Q7 |\n| **LPE (liquid-phase epitaxy)** | epitaxy by precipitation from a saturated solution in molten metal as it cools. | Q13 |\n| **Majority / minority carrier** | the carrier present in larger / smaller numbers (electrons / holes in n-type). | Q28 |\n| **Majority carrier** | the carrier present in larger number (electrons in n-type, holes in p-type). | Q15, Q34 |\n| **Mass-action law** | in equilibrium np = n_i², so raising one carrier lowers the other. | Q15, Q28, Q29, Q34 |\n| **Matthiessen's rule** | when several scattering mechanisms act, 1/μ = 1/μ₁ + 1/μ₂ + … | Q35, Q36 |\n| **MBE (molecular-beam epitaxy)** | epitaxy from beams of atoms in ultra-high vacuum. | Q13 |\n| **Mean free time (τ_m)** | the average time between two collisions of a carrier (about 0.1–1 ps). | Q35, Q36, Q37 |\n| **Melt** | the molten silicon in the crucible, held just above silicon's melting point of 1414 °C. | Q10 |\n| **Metallurgical-grade silicon (MG-Si)** | silicon about 98 % pure, made by reducing quartz with carbon in an arc furnace; too impure for devices. | Q9 |\n| **Miller indices (h k l)** | the smallest integers proportional to the reciprocals of a plane's intercepts on the crystal axes; they name the plane's orientation. | Q7 |\n| **Minority carrier** | the carrier present in smaller number (holes in n-type, electrons in p-type). | Q15, Q34, Q39, Q44, Q48 |\n| **Minority-carrier lifetime (τ)** | average time an excess minority carrier survives before it recombines. | Q42 |\n| **Mobility (μ)** | drift velocity per unit electric field (cm²/V·s); it falls when carriers are scattered. | Q5, Q35, Q36, Q37, Q38, Q40 |\n| **MOCVD** | metal-organic chemical vapour deposition, the version of VPE used for III–V compounds. | Q12 |\n| **Monolayer** | one atomic layer of the crystal, about 0.28 nm thick for GaAs. | Q13 |\n| **Mott–Schottky plot** | 1/C² against V; straight for uniform doping. | Q50 |\n| **n-type semiconductor** | a semiconductor doped mainly with donors, so free electrons outnumber holes. | Q15, Q34 |\n| **Native oxide** | an oxide that grows directly on the material by heating it in oxygen or steam; for silicon it is silicon dioxide (SiO₂). | Q3 |\n| **Negative differential mobility** | a field range where more field gives less drift velocity (GaAs electrons). | Q41 |\n| **Non-degenerate semiconductor** | doped lightly enough that Boltzmann statistics apply (E_F more than about 3kT from the band edges). | Q40 |\n| **Nuclear and electronic stopping** | energy loss by collisions with silicon nuclei (causes damage) and with electrons (little damage). | Q20 |\n| **Octet (full outer shell)** | eight electrons in the outer shell, the stable arrangement that atoms reach by bonding. | Q8 |\n| **One-sided junction** | p⁺n, n⁺p or Schottky diode; the depletion region lies almost entirely in the lightly doped side. | Q50 |\n| **Optical phonon** | a high-energy lattice vibration (about 0.063 eV in Si) that can absorb a large amount of carrier energy in one collision. | Q41 |\n| **p-n junction** | the boundary between a p-type and an n-type region in one continuous crystal. | Q47 |\n| **p-type semiconductor** | a semiconductor doped mainly with acceptors, so holes outnumber free electrons. | Q15 |\n| **Partial derivative (∂)** | a rate of change with respect to one variable while the other (x or t) is held fixed. | Q18 |\n| **Passivation** | treating a surface so that it has few active surface states. | Q46 |\n| **Pauli exclusion principle** | no two electrons can occupy the same quantum state (at most one electron per state, counting spin). | Q30 |\n| **Periodic potential** | a potential energy V(x) that repeats with the lattice period, V(x + a) = V(x). | Q22, Q24, Q36 |\n| **Phonon** | a quantum (packet) of lattice vibration. | Q22, Q26, Q35, Q36, Q43 |\n| **Photon** | a quantum of light; it carries energy hν but almost no momentum compared with an electron in a crystal. | Q26 |\n| **Polycrystalline silicon (polysilicon)** | solid silicon made of many small crystal grains pointing in different directions. | Q9 |\n| **Predeposition / drive-in** | the first diffusion step with a constant surface source, and the second step that spreads a fixed dose deeper. | Q17 |\n| **Profile** | the curve of dopant concentration C against depth x. | Q21 |\n| **Projected range (R_p)** | the average depth at which the ions stop. | Q20 |\n| **Projected range (R_p) and straggle (ΔR_p)** | mean stopping depth of implanted ions and its spread. | Q21 |\n| **Quantum well / heterostructure** | a very thin layer (a few nm) of one semiconductor sandwiched between another; it needs atomically sharp interfaces. | Q13 |\n| **Quasi-equilibrium** | carriers in the depletion region stay so close to equilibrium that Boltzmann statistics still link the densities on either side of it. | Q48 |\n| **Quasi-neutral region** | a region outside the depletion layer where the net charge, and so the field, is nearly zero. | Q45 |\n| **Radiative recombination** | an electron falls into a hole and the energy leaves as a photon. | Q26 |\n| **Reciprocal** | one divided by a number; the reciprocal of 2 is 1/2, and of ∞ is 0. | Q6, Q7 |\n| **Recombination rate (R)** | number of electron–hole pairs destroyed per unit volume per unit time (cm⁻³s⁻¹). | Q42, Q44 |\n| **Reduced Planck constant (ħ)** | ħ = h/2π = 1.055×10⁻³⁴ J·s. | Q23 |\n| **Resistivity (ρ)** | how strongly the material opposes current (Ω·cm); set mainly by the doping. | Q11, Q14 |\n| **RHEED (reflection high-energy electron diffraction)** | an electron beam bounced off the growing surface; its pattern shows the surface order and counts atomic layers. | Q12 |\n| **Saturation current (I_s, J_s)** | the small reverse current of the diode, and the scale factor of the exponential (A, or A/cm² for J_s). | Q48 |\n| **Saturation velocity (v_sat)** | the maximum drift velocity at high field, about 10⁷ cm/s in Si. | Q38, Q41 |\n| **Scattering** | any collision that randomises a carrier's direction and destroys the velocity it gained from the field. | Q35, Q36 |\n| **Schottky barrier height (Φ_B)** | barrier an electron in the metal must climb to enter the semiconductor (eV); fixed by the interface. | Q49 |\n| **Schrödinger equation** | the wave equation whose solutions give the allowed wave functions and energies of an electron. | Q22 |\n| **Seed crystal** | a small, perfect single crystal cut to the wanted orientation (e.g. ⟨100⟩) that starts the growth. | Q10 |\n| **Segregation coefficient (k₀)** | the ratio of dopant concentration in the freezing solid to that in the liquid, k₀ = C_s/C_l; for most dopants k₀ < 1 (B 0.8, P 0.35). | Q11 |\n| **Series resistance (R_s)** | resistance of the bulk, contacts and leads in series with the junction (Ω). | Q50 |\n| **Siemens process** | the CVD step in which purified SiHCl₃ and hydrogen deposit pure silicon on heated silicon rods. | Q9 |\n| **SiGe HBT** | a fast bipolar transistor with a silicon–germanium base. | Q4 |\n| **Single crystal** | a solid with the same lattice and orientation throughout; *polycrystalline* material is made of many small crystals (grains), *amorphous* has no long-range order. | Q5, Q10 |\n| **Stationary state** | a state whose energy and probability distribution do not change with time. | Q23 |\n| **Stoichiometry** | the exact ratio of the elements in a compound (1 : 1 for GaAs). | Q2 |\n| **Straggle (ΔR_p)** | the standard deviation of the stopping depths about R_p. | Q20 |\n| **Substitutional impurity** | a dopant that occupies a normal lattice site in place of a silicon atom. | Q17 |\n| **Substrate** | the wafer on which the layer is grown. | Q12 |\n| **Supersaturated solution** | a liquid holding more dissolved material than it can keep at that temperature, so the excess comes out as solid. | Q12 |\n| **Surface concentration (C_s)** | the dopant concentration at x = 0, here 1×10²⁰ cm⁻³ (close to the solid solubility of B or P in Si). | Q19 |\n| **Surface recombination velocity (S)** | the rate of recombination per unit area divided by the excess minority density at the surface (cm/s). | Q46 |\n| **Surface states** | localised energy levels in the band gap at a surface, caused by broken (dangling) bonds, adsorbed atoms and oxide defects. | Q46 |\n| **Thermal budget** | the total amount of high-temperature processing (temperature and time) a wafer receives; more budget means existing profiles spread more. | Q21 |\n| **Thermal diffusion** | doping in which dopant atoms move into a heated wafer (900–1200 °C) from a surface source by random thermal jumps. | Q21 |\n| **Thermal energy (kT)** | Boltzmann constant times absolute temperature; 0.0259 eV at 300 K. | Q27, Q30 |\n| **Thermal equilibrium** | the steady state of a sample at fixed temperature with no applied voltage, light or current. | Q29, Q40, Q42 |\n| **Thermal velocity (v_th)** | the average random speed of carriers, about 1×10⁷ cm/s at 300 K. | Q43 |\n| **Thermal voltage (kT/q)** | Boltzmann constant × temperature ÷ electronic charge; 0.0259 V at 300 K. | Q40 |\n| **Thermionic emission** | carriers crossing *over* a barrier using thermal energy. | Q49 |\n| **Trap** | a defect or impurity with an energy level inside the band gap that helps electrons and holes recombine. | Q42, Q43 |\n| **Trap density (N_t)** | concentration of recombination centres in the gap (cm⁻³). | Q44 |\n| **Trichlorosilane (SiHCl₃)** | a silicon compound that is liquid at room temperature (boils at 32 °C), used as the carrier that can be purified. | Q9 |\n| **Tunnelling (field emission)** | carriers passing *through* a barrier only a few nanometres thick. | Q49 |\n| **Ultra-high vacuum (UHV)** | pressure of about 10⁻¹⁰ Torr, so low that atoms travel in straight lines without colliding. | Q12 |\n| **Unit cell** | the smallest block which, repeated by translation in three directions, rebuilds the whole crystal. | Q5 |\n| **Vacancy** | an empty lattice site where an atom is missing. | Q17 |\n| **Vacuum level (E_vac)** | energy of an electron at rest just outside the material; the common reference. | Q49 |\n| **Valence band** | the highest band that is full at 0 K; it holds the electrons that form the bonds. | Q1, Q31 |\n| **Valence electrons** | the electrons in an atom's outermost shell; they are the ones that form bonds. Silicon has four. | Q8, Q16 |\n| **VPE (vapour-phase epitaxy)** | epitaxy from gases that react on a hot wafer; MOCVD is its metal-organic form for III–V compounds. | Q13 |\n| **Wafer orientation** | the crystal plane parallel to the wafer surface, e.g. a (100) wafer. | Q6 |\n| **Wave function (ψ)** | the mathematical wave that describes an electron; \\|ψ\\|² gives the probability of finding it at a point. | Q22, Q23 |\n| **Wave vector (k)** | k = 2π/λ; it measures the electron's momentum, p = ħk. | Q24, Q26 |\n| **Work function (Φ_m, Φ_s)** | energy from the Fermi level up to the vacuum level, for the metal and the semiconductor (eV). | Q49 |\n\n## Constants and units\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| ħ | Reduced Planck constant, h/2π | 1.055×10⁻³⁴ J·s |\n| m₀ | Free-electron mass | 9.11×10⁻³¹ kg |\n| ε₀ | Permittivity of free space | 8.854×10⁻¹⁴ F/cm |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| ε_ox | Permittivity of SiO₂, 3.9ε₀ | 3.45×10⁻¹³ F/cm |\n| ε_r | Relative permittivity (dielectric constant) | Si 11.7, SiO₂ 3. const KEY = "pgdee-sse-exam-read";
let read = new Set();
try { read = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...read])); } catch(e) {} }

const list = document.getElementById("modlist");
const sel  = document.getElementById("sel");
let cur = 0;

let lastGroup = null;
MODS.forEach((m,i)=>{
  if (m.group && m.group !== lastGroup && m.num !== "00") {
    const gl = document.createElement("li");
    gl.className = "seclabel grouplabel"; gl.textContent = m.group;
    list.appendChild(gl);
  }
  lastGroup = m.group;
  const li = document.createElement("li");
  const b  = document.createElement("button");
  b.innerHTML = '<span class="modnum">'+m.disp+'</span><span>'+m.title+'</span><span class="tick">&#10003;</span>';
  b.onclick = ()=>show(i);
  li.appendChild(b); list.appendChild(li);
  const o = document.createElement("option");
  o.value = i; o.textContent = (m.eyebrow && m.num !== "00" ? m.eyebrow : m.disp) + " · " + m.title;
  sel.appendChild(o);
});
sel.onchange = e => show(+e.target.value);

function show(i){
  cur = i;
  const m = MODS[i];
  document.getElementById("eyebrow").textContent =
    m.eyebrow + (m.group && m.eyebrow !== m.group ? "  ·  " + m.group : "");
  document.getElementById("doctitle").textContent = m.title;
  const doc = document.getElementById("doc");
  doc.innerHTML = mdToHtml(m.body);
  /* Only data tables get the scrolling wrapper. Matrices and piecewise cases
     use a table for layout; wrapping them adds the wrapper's bottom margin to
     the flex line, which pushed the brace and the determinant bars out of
     alignment with their own rows. */
  doc.querySelectorAll("table").forEach(t=>{
    if (t.closest(".cases, .mat")) return;
    const w = document.createElement("div");
    w.className = "tablewrap";
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });

  [...list.querySelectorAll("li:not(.grouplabel) button")].forEach((b,j)=>{
    b.setAttribute("aria-current", j===i ? "true" : "false");
    b.parentNode.classList.toggle("done", read.has(MODS[j].num));
  });
  sel.value = i;

  const rb = document.getElementById("readbtn");
  const isRead = read.has(m.num);
  rb.setAttribute("aria-pressed", isRead ? "true" : "false");
  rb.textContent = isRead ? "✓  Marked as read" : "Mark this module read";
  rb.onclick = ()=>{ read.has(m.num) ? read.delete(m.num) : read.add(m.num); save(); show(i); };

  const p = document.getElementById("prev"), n = document.getElementById("next");
  p.disabled = i===0; n.disabled = i===MODS.length-1;
  document.getElementById("prevt").textContent = i>0 ? MODS[i-1].title : "—";
  document.getElementById("nextt").textContent = i<MODS.length-1 ? MODS[i+1].title : "—";
  p.onclick = ()=>show(i-1); n.onclick = ()=>show(i+1);

  window.scrollTo(0,0);
}

document.addEventListener("keydown", e=>{
  if(e.target.tagName === "SELECT") return;
  if(e.key === "ArrowRight" && cur < MODS.length-1) show(cur+1);
  if(e.key === "ArrowLeft"  && cur > 0) show(cur-1);
});

show(0);

/* Downloads: inside claude.ai the page asks the viewer to confirm the save; opened
   as a local file it falls back to a plain link to the file beside it. */
const FILES = { docx: "ELE717-Exam-Companion.docx", pdf: "ELE717-Exam-Companion.pdf" };
function dlMsg(t){ document.querySelectorAll(".dl-msg").forEach(p => p.textContent = t); }
async function download(fmt){
  const name = FILES[fmt], url = "downloads/" + name;
  const btns = document.querySelectorAll(".dlbtn");
  btns.forEach(b => b.disabled = true);
  try {
    const d = window.claude && typeof window.claude.use === "function"
      ? await window.claude.use("downloads") : null;
    if (d) {
      dlMsg("Preparing " + name + "…");
      let data;
      if (fmt === "docx") {
        /* The page host serves no .docx files, so the Word file is published as
           base64 text and rebuilt into bytes here. */
        const r = await fetch(url + ".b64.txt");
        if (!r.ok) throw { code: "missing" };
        const bin = atob((await r.text()).trim());
        data = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
      } else {
        const r = await fetch(url);
        if (!r.ok) throw { code: "missing" };
        data = await r.blob();
      }
      await d.save({ filename: name, data });
      dlMsg("Saved " + name + ".");
    } else if (location.protocol === "file:" || !window.claude) {
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      dlMsg("If nothing happens, open the downloads folder next to this page.");
    } else {
      dlMsg("Downloads are not available in this view.");
    }
  } catch (e) {
    const code = e && e.code;
    dlMsg(code === "declined" ? "" :
          code === "rate_limited" ? "A download prompt is already open." :
          code === "missing" ? "The " + fmt.toUpperCase() + " file could not be found." :
          "Downloads are not available in this view.");
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}
document.querySelectorAll(".dlbtn").forEach(b => b.addEventListener("click", () => download(b.dataset.fmt)));
</script>
