r(--copper,#B4622F);\" opacity=\"1.0\">+</text><circle cx=\"128.0\" cy=\"48.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><line x1=\"148.0\" y1=\"72.0\" x2=\"166.0\" y2=\"72.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"157.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">+</text><circle cx=\"161.0\" cy=\"48.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><line x1=\"181.0\" y1=\"72.0\" x2=\"199.0\" y2=\"72.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"190.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">+</text><circle cx=\"194.0\" cy=\"48.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><line x1=\"214.0\" y1=\"72.0\" x2=\"232.0\" y2=\"72.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"223.0\" y=\"88.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">+</text><text x=\"246.0\" y=\"76.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"140.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan> ≈ 0.045 eV (P in Si)</text><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">p-type: acceptors</text><rect x=\"310.0\" y=\"34.0\" width=\"200.0\" height=\"30.0\" rx=\"0\" style=\"fill:none;stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"310.0\" y1=\"60.0\" x2=\"510.0\" y2=\"60.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"310.0\" y1=\"150.0\" x2=\"510.0\" y2=\"150.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><rect x=\"310.0\" y=\"30.0\" width=\"200.0\" height=\"30.0\" rx=\"0\" style=\"fill:none;stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"310.0\" y=\"150.0\" width=\"200.0\" height=\"26.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><text x=\"516.0\" y=\"64.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"516.0\" y=\"154.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"319.0\" y1=\"138.0\" x2=\"337.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"328.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"332.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"352.0\" y1=\"138.0\" x2=\"370.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"361.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"365.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"385.0\" y1=\"138.0\" x2=\"403.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"394.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"398.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"418.0\" y1=\"138.0\" x2=\"436.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"427.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"431.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"451.0\" y1=\"138.0\" x2=\"469.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"460.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"464.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"484.0\" y1=\"138.0\" x2=\"502.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"493.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><text x=\"516.0\" y=\"141.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">A</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"410.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E<tspan dy=\"0.32em\" font-size=\"72%\">A</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan> ≈ 0.045 eV (B in Si)</text></svg><figcaption>Donor levels just below the conduction band release electrons and become positive ions; acceptor levels just above the valence band take electrons, become negative ions and leave holes.</figcaption></figure>\n```\n\n**Sketch in the exam:** an energy-band diagram with E_c at the top and E_v at the bottom; a dashed line E_D about 0.045 eV below E_c with \"+\" signs and arrows taking electrons up into the conduction band; a dashed line E_A about 0.045 eV above E_v with \"−\" signs and arrows lifting electrons from the valence band, leaving holes (○) behind.\n\n#### Examples in a compound semiconductor (GaAs)\n\nIn GaAs the rule is applied site by site: an atom on an **arsenic (Group V) site** that has one more electron, such as **S, Se or Te (Group VI)**, is a donor; an atom on a **gallium (Group III) site** with one fewer electron, such as **Zn, Be or Mg (Group II)**, is an acceptor. Silicon (Group IV) is a donor on a Ga site and an acceptor on an As site; carbon on an As site is an acceptor.\n\n#### Summary table\n\n| Feature | Donor impurity | Acceptor impurity |\n|---|---|---|\n| Valence electrons (in Si) | 5 (one more than Si) | 3 (one fewer than Si) |\n| Periodic group (for Si) | Group V | Group III |\n| Action | Gives (donates) an electron | Takes (accepts) an electron, creating a hole |\n| Charge after ionisation | Positive, N_D⁺ (fixed) | Negative, N_A⁻ (fixed) |\n| Energy level | E_D just below E_c | E_A just above E_v |\n| Ionisation energy | ≈ 0.045 eV (P) | ≈ 0.045 eV (B) |\n| Type of material produced | n-type | p-type |\n| Examples in Si | P, As, Sb | B, Al, Ga, In |\n| Examples in GaAs | S, Se, Te on As site; Si on Ga site | Zn, Be, Mg on Ga site; C on As site |\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ donor: one extra valence electron, Group V in Si, with at least two named examples\n- ✓ acceptor: one missing valence electron, Group III in Si, with at least two named examples\n- ✓ small ionisation energy (≈ 0.045 eV) compared with kT, so nearly all are ionised at 300 K\n- ✓ donor becomes a fixed positive ion; acceptor becomes a fixed negative ion and creates a mobile hole\n- ✓ E_D just below E_c; E_A just above E_v (labelled band diagram)\n- ✓ donors give n-type, acceptors give p-type\n- ✓ summary table\n\n**Common mistakes.**\n\n- Saying the acceptor \"creates a positive ion\". The acceptor ion is negative; the *hole* it releases behaves as a positive carrier.\n- Calling the ion a carrier. The ionised dopant is fixed in the lattice and does not carry current.\n- Giving Group VI or Group II elements as dopants for silicon. For Si use Group V (donors) and Group III (acceptors); Group VI and II are the GaAs dopants.\n\n**Remember it.** \"Donors donate (5 electrons, +ion, level near E_c); acceptors accept (3 electrons, −ion, level near E_v).\"\n\n**Try a variant.** Explain why a donor with ionisation energy 0.045 eV is almost fully ionised at 300 K, while a deep impurity with 0.4 eV is not. *Answer:* the chance of ionisation depends on the ratio of the binding energy to kT. For 0.045 eV the ratio is 0.045/0.0259 ≈ 1.7, so thermal energy easily frees the electron and nearly every donor is ionised. For 0.4 eV the ratio is about 15, and e^{−15} ≈ 3×10⁻⁷, so very few are ionised; such deep levels act as traps and recombination centres rather than dopants.\n\n---\n\n### Q17. Describe the mechanism of dopant diffusion in a semiconductor.\n\n> **Question type:** Describe · **Topic:** dopant diffusion mechanisms · **Full notes:** Week 3 (Impurity Control and Doping)\n\n**What the examiner wants.** An account of *how* dopant atoms move: the driving force (random thermal jumps plus a concentration gradient), the atomic mechanisms (vacancy, interstitial, interstitialcy), the temperature dependence D = D₀e^{−E_a/kT}, and the macroscopic description by Fick's laws with the two practical stages (predeposition and drive-in). A sketch of the atomic jumps earns marks.\n\n**Key terms.**\n\n- **Diffusion:** the net movement of atoms from a region of high concentration to one of low concentration, caused by their random thermal motion.\n- **Vacancy:** an empty lattice site where an atom is missing.\n- **Interstitial site:** a space between normal lattice sites where a small atom can sit.\n- **Substitutional impurity:** a dopant that occupies a normal lattice site in place of a silicon atom.\n- **Diffusion coefficient (D):** a measure of how fast a dopant spreads, in cm²/s.\n- **Activation energy (E_a):** the energy barrier an atom must overcome to make one jump, in eV.\n- **Predeposition / drive-in:** the first diffusion step with a constant surface source, and the second step that spreads a fixed dose deeper.\n\n**Model answer.**\n\n#### 1. What drives diffusion\n\nAt furnace temperatures (900–1200 °C for silicon) every atom vibrates about its lattice site and occasionally jumps to a neighbouring position. Each jump is random in direction. Where the dopant is crowded (at the surface) more atoms jump towards the sparse region than come back, so there is a **net flow down the concentration gradient**. No force pushes the atoms; the flow is purely statistical. At room temperature jumps are so rare that dopants do not move.\n\n#### 2. Atomic mechanisms\n\n**(a) Vacancy (substitutional) diffusion.** The common dopants B, P, As and Sb sit on lattice sites. A dopant can move only when a **neighbouring site is vacant**: it jumps into the vacancy, and the vacancy appears where the atom was. The rate depends on how many vacancies exist (which rises steeply with temperature) and on the jump probability. The activation energy is high, about **3–4 eV**, so D is small: 10⁻¹⁵ to 10⁻¹² cm²/s at processing temperatures.\n\n**(b) Interstitial diffusion.** Small atoms, or atoms that do not bond into the lattice (Au, Cu, Fe, Na, Li, H), squeeze through the **open spaces between lattice sites** of the diamond structure without needing a vacancy. The activation energy is low (about 0.5–1.5 eV), so they diffuse many orders of magnitude faster. These are usually unwanted contaminants, which is why furnace cleanliness matters.\n\n**(c) Interstitialcy (kick-out) mechanism.** A silicon self-interstitial knocks a substitutional dopant off its site; the dopant travels as an interstitial and then drops back into a lattice site. This explains why B and P diffuse faster during oxidation (**oxidation-enhanced diffusion**), because oxidation injects silicon interstitials.\n\n**Sketch in the exam:** a square grid of Si atoms. Show (i) a dopant atom next to an empty square (vacancy) with an arrow into it, labelled \"vacancy mechanism\"; (ii) a small atom between grid points with a zig-zag arrow through the gaps, labelled \"interstitial mechanism\".\n\n#### 3. Temperature dependence\n\n    D = D₀ e^{−E_a/kT}\n\nWhere:\n\n- D = diffusion coefficient (cm²/s)\n- D₀ = diffusion constant for the dopant–silicon pair (cm²/s), e.g. 0.76 cm²/s for B\n- E_a = activation energy (eV), e.g. 3.46 eV for B\n- k = Boltzmann constant, 8.617×10⁻⁵ eV/K\n- T = absolute temperature (K)\n\nFor boron, D ≈ 1.5×10⁻¹⁴ cm²/s at 1000 °C and 1.5×10⁻¹³ cm²/s at 1100 °C: **100 °C hotter makes D ten times larger** (D roughly doubles every 30 °C). Furnace temperature must therefore be controlled to about ±0.5 °C.\n\n#### 4. Macroscopic description\n\nThe flux follows **Fick's first law**, F = −D ∂C/∂x (F = atoms crossing 1 cm² per second, C = dopant concentration in cm⁻³, x = depth in cm), and the profile changes in time by **Fick's second law**, ∂C/∂t = D ∂²C/∂x². Depth grows as √(Dt).\n\n#### 5. The practical two-step process\n\n1. **Predeposition:** the dopant source (gas such as POCl₃ or B₂H₆, or a doped glass) keeps the surface at a constant concentration C_s, usually the solid solubility. The profile is a complementary error function (erfc).\n2. **Drive-in:** the source is removed and the wafer is heated again; the fixed dose spreads deeper and the surface concentration falls, giving a Gaussian profile.\n\nDoping is confined to windows in a silicon dioxide mask, because dopants diffuse much more slowly in SiO₂. Under the mask edge the dopant also spreads **sideways** by about 0.8 of the vertical depth (lateral diffusion).\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ diffusion = net movement from high to low concentration by random thermal jumps, at 900–1200 °C\n- ✓ vacancy mechanism for substitutional dopants (B, P, As, Sb), high E_a, slow\n- ✓ interstitial mechanism for small/metal atoms (Au, Cu, Fe, Na), low E_a, fast\n- ✓ interstitialcy/kick-out mechanism (oxidation-enhanced diffusion) mentioned\n- ✓ D = D₀e^{−E_a/kT} with symbols defined and the strong temperature effect\n- ✓ link to Fick's laws and depth ∝ √(Dt)\n- ✓ predeposition (erfc) and drive-in (Gaussian); oxide masking and lateral diffusion\n- ✓ labelled sketch of vacancy and interstitial jumps\n\n**Common mistakes.**\n\n- Describing diffusion as atoms being \"pushed\" by a force or field. The flow comes only from random jumps and a concentration gradient.\n- Saying the common dopants move interstitially. B, P, As and Sb move mainly by vacancies (and interstitialcy); the fast interstitial diffusers are metals.\n- Writing D = D₀e^{+E_a/kT}. The exponent is negative: a larger barrier gives a smaller D.\n\n**Remember it.** \"Big dopants wait for a vacancy; small metals slip between the gaps; heat makes both go faster.\"\n\n**Try a variant.** Phosphorus in silicon has D₀ = 3.85 cm²/s and E_a = 3.66 eV. Find D at 1000 °C. *Answer:* T = 1273 K, kT = 8.617×10⁻⁵ × 1273 = 0.1097 eV, E_a/kT = 33.37, D = 3.85 × e^{−33.37} = **1.2×10⁻¹⁴ cm²/s**.\n\n---\n\n### Q18. State and explain Fick's first and second laws of diffusion.\n\n> **Question type:** State and explain (with short derivation) · **Topic:** Fick's laws · **Full notes:** Week 3 (Impurity Control and Doping)\n\n**What the examiner wants.** Each law stated in words and as an equation, every symbol defined with units, the meaning of the minus sign, how the second law follows from the first plus conservation of atoms, and what each law tells you physically. Naming the two standard solutions (erfc and Gaussian) completes the answer.\n\n**Key terms.**\n\n- **Flux (F):** the number of atoms crossing unit area per unit time, atoms/(cm²·s).\n- **Concentration (C):** the number of dopant atoms per unit volume, cm⁻³.\n- **Concentration gradient (∂C/∂x):** the rate at which concentration changes with depth, cm⁻⁴.\n- **Diffusion coefficient (D):** the proportionality constant between flux and gradient, cm²/s; D = D₀e^{−E_a/kT}.\n- **Continuity (conservation of atoms):** atoms are neither created nor destroyed, so any change in the number stored in a slice equals inflow minus outflow.\n- **Partial derivative (∂):** a rate of change with respect to one variable while the other (x or t) is held fixed.\n\n**Model answer.**\n\n#### Fick's first law\n\n**Statement:** the diffusion flux of atoms is proportional to the concentration gradient and directed from high to low concentration.\n\n    F = −D ∂C/∂x\n\nWhere:\n\n- F = flux: atoms crossing 1 cm² per second (atoms/cm²·s)\n- D = diffusion coefficient (cm²/s)\n- C = C(x, t), dopant concentration (atoms/cm³)\n- x = depth below the surface (cm)\n- ∂C/∂x = concentration gradient (atoms/cm⁴)\n\n**Explanation.**\n\n- The **minus sign** means the flow is \"downhill\": where C falls with depth (∂C/∂x negative), F is positive, i.e. atoms move deeper.\n- If the concentration is uniform (∂C/∂x = 0) there is **no net flux**, even though atoms still jump randomly.\n- A steeper gradient gives a larger flux; a larger D (hotter furnace) gives a larger flux for the same gradient.\n- The first law gives the flux at one instant. It does not say how the profile changes with time, so it is used directly only in steady state.\n\n#### Fick's second law\n\n**Statement:** the rate of change of concentration at a point is proportional to the curvature (second derivative) of the concentration profile at that point.\n\n**Derivation.** Assume D is constant (independent of C and x) and no atoms are generated or lost.\n\nStep 1. Take a thin slice between x and x + dx, of unit area. Atoms enter at x with flux F(x) and leave at x + dx with flux F(x + dx).\n\nStep 2. The increase in atoms stored per second is (∂C/∂t)dx, and it must equal inflow minus outflow:\n\n    (∂C/∂t) dx = F(x) − F(x + dx) = −(∂F/∂x) dx\n\nStep 3. Cancel dx to get the continuity equation:\n\n    ∂C/∂t = −∂F/∂x\n\nStep 4. Substitute the first law F = −D ∂C/∂x, with D constant:\n\n    ∂C/∂t = D ∂²C/∂x²\n\n**This is Fick's second law (the diffusion equation): ∂C/∂t = D ∂²C/∂x².**\n\nWhere:\n\n- ∂C/∂t = rate of change of concentration at a fixed depth (atoms/cm³·s)\n- ∂²C/∂x² = curvature of the profile (atoms/cm⁵)\n- t = time (s); other symbols as above\n\n**Explanation.**\n\n- Where the profile curves **upwards** (∂²C/∂x² > 0, a hollow), concentration rises; where it curves **downwards** (a hump), it falls. Diffusion therefore always **smooths out** a profile.\n- The equation contains D and t only as the product Dt, so the depth scale of any profile is √(Dt): four times the time only doubles the depth.\n- Solving it needs boundary and initial conditions. With a **constant surface concentration** C_s it gives the predeposition profile C = C_s erfc(x/2√(Dt)); with a **fixed dose** Q it gives the drive-in Gaussian C = (Q/√(πDt)) e^{−x²/4Dt}.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 200\" role=\"img\" aria-label=\"Constant-source erfc profiles all start at the same surface value and deepen with time; fixed-dose Gaussian profiles spread and their surface value falls\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id= .1,149.3 450.6,149.6 452.0,150.0 453.4,150.3 454.9,150.7 456.3,151.1 457.8,151.4 459.2,151.8 460.6,152.2 462.1,152.5 463.5,152.9 464.9,153.2 466.4,153.6 467.8,154.0 469.2,154.3 470.7,154.7 472.1,155.0 473.6,155.4 475.0,155.7 476.4,156.1 477.9,156.4 479.3,156.8 480.8,157.1 482.2,157.5 483.6,157.8 485.1,158.2 486.5,158.5 487.9,158.8 489.4,159.1 490.8,159.5 492.2,159.8 493.7,160.1 495.1,160.4 496.6,160.8 498.0,161.1 499.4,161.4 500.9,161.7 502.3,162.0 503.8,162.3 505.2,162.6 506.6,162.9 508.1,163.2 509.5,163.5 510.9,163.7 512.4,164.0 513.8,164.3 515.2,164.6 516.7,164.8 518.1,165.1 519.6,165.3 521.0,165.6 522.4,165.8 523.9,166.1 525.3,166.3 526.8,166.6 528.2,166.8 529.6,167.0 531.1,167.3 532.5,167.5 533.9,167.7 535.4,167.9 536.8,168.1 538.2,168.3 539.7,168.6 541.1,168.8 542.6,168.9 544.0,169.1 545.4,169.3 546.9,169.5 548.3,169.7 549.8,169.9 551.2,170.0 552.6,170.2 554.1,170.4 555.5,170.5 556.9,170.7 558.4,170.9 559.8,171.0 561.2,171.2 562.7,171.3 564.1,171.4 565.6,171.6 567.0,171.7 568.4,171.9 569.9,172.0 571.3,172.1 572.8,172.2 574.2,172.4 575.6,172.5 577.1,172.6 578.5,172.7 579.9,172.8 581.4,172.9 582.8,173.0 584.2,173.1 585.7,173.2 587.1,173.3 588.6,173.4 590.0,173.5\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"366.0\" y=\"131.4\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">9t₁</text><text x=\"475.0\" y=\"27.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor\" opacity=\".85\">fixed dose: Gaussian</text></svg><figcaption>The two solutions of Fick's second law: constant-source erfc profiles (left) deepen with time at fixed surface value; fixed-dose Gaussian profiles (right) deepen while their surface value falls.</figcaption></figure>\n```\n\n| | First law | Second law |\n|---|---|---|\n| Relates | Flux to gradient | Rate of change of C to curvature |\n| Equation | F = −D ∂C/∂x | ∂C/∂t = D ∂²C/∂x² |\n| Use | Flux at an instant, steady state | Profile evolution with time |\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ first law stated in words and as F = −D ∂C/∂x\n- ✓ every symbol defined with units (F, D, C, x, t)\n- ✓ meaning of the minus sign (flow from high to low)\n- ✓ continuity equation ∂C/∂t = −∂F/∂x from conservation of atoms in a slice\n- ✓ second law ∂C/∂t = D ∂²C/∂x², with the assumption D constant\n- ✓ physical meaning: curvature drives change, profiles smooth out, depth ∝ √(Dt)\n- ✓ the erfc and Gaussian solutions named with their boundary conditions\n\n**Common mistakes.**\n\n- Dropping the minus sign in the first law: without it atoms would flow up the gradient.\n- Writing the second law as ∂C/∂t = D ∂C/∂x (first derivative). It is the **second** derivative in x and the **first** in t.\n- Stating the laws without explaining them. \"Explain\" means saying what each term does physically.\n\n**Remember it.** \"First law: flux follows the slope. Second law: the profile changes where it bends.\"\n\n**Try a variant.** Near the surface of a wafer at 1000 °C the boron concentration falls linearly from 5×10¹⁹ cm⁻³ to zero over 1 μm, and D = 2×10⁻¹⁴ cm²/s. Find the diffusion flux. *Answer:* ∂C/∂x = −5×10¹⁹/(1×10⁻⁴ cm) = −5×10²³ cm⁻⁴; F = −D ∂C/∂x = 2×10⁻¹⁴ × 5×10²³ = **1×10¹⁰ atoms/cm²·s**, directed into the wafer.\n\n---\n\n### Q19. A semiconductor is doped by diffusion with a constant surface concentration of 1 × 10²⁰ cm⁻³. Explain how the impurity concentration varies with depth.\n\n> **Question type:** Explanation with calculation · **Topic:** constant-source (erfc) diffusion profile · **Full notes:** Week 3 (Impurity Control and Doping)\n\n**What the examiner wants.** Recognise the constant-source (predeposition) case, state the boundary conditions, give the solution of Fick's second law C(x, t) = C_s erfc(x/2√(Dt)), and describe how C falls with depth and how the profile changes with time. Full marks need numbers: choose a realistic D and t, tabulate C against depth, find the junction depth in a stated background doping, give the dose, and describe (or draw) the sketch.\n\n**Key terms.**\n\n- **Constant-source diffusion (predeposition):** diffusion in which a dopant supply keeps the surface concentration fixed at C_s for the whole process.\n- **Surface concentration (C_s):** the dopant concentration at x = 0, here 1×10²⁰ cm⁻³ (close to the solid solubility of B or P in Si).\n- **Complementary error function (erfc):** erfc(u) = 1 − erf(u); a tabulated function that equals 1 at u = 0 and falls rapidly towards 0 as u grows.\n- **Diffusion length (√(Dt)):** the characteristic distance dopant spreads in time t; the profile's depth scale is 2√(Dt).\n- **Background doping (N_B):** the doping the wafer already has, of the opposite type to the diffused dopant.\n- **Junction depth (x_j):** the depth where the diffused concentration equals N_B, so a p-n junction forms.\n- **Dose (Q):** the total number of dopant atoms introduced per cm² of surface (the area under the profile).\n\n**Model answer.**\n\n#### 1. The boundary-value problem\n\nThe profile obeys Fick's second law, ∂C/∂t = D ∂²C/∂x², with\n\n- C(0, t) = C_s = 1×10²⁰ cm⁻³ for all t (constant surface source)\n- C(x, 0) = 0 for x > 0 (no dopant at the start)\n- C(∞, t) = 0 (the wafer is effectively infinitely thick)\n\nIts solution is the **complementary error function** profile:\n\n    C(x, t) = C_s erfc( x / 2√(Dt) ) = 1×10²⁰ erfc( x / 2√(Dt) )   cm⁻³\n\nWhere:\n\n- C(x, t) = dopant concentration at depth x after time t (cm⁻³)\n- C_s = surface concentration, 1×10²⁰ cm⁻³\n- x = depth below the surface (cm)\n- D = diffusion coefficient of the dopant at the furnace temperature (cm²/s)\n- t = diffusion time (s)\n- erfc = complementary error function (dimensionless); u = x/2√(Dt) is its argument\n\n#### 2. How the concentration varies with depth\n\n- **At the surface** (x = 0): erfc(0) = 1, so C = 1×10²⁰ cm⁻³ at all times.\n- **It falls monotonically with depth.** Near the surface the fall is gentle (almost linear); further in it falls faster than exponentially, because for large u erfc(u) ≈ e^{−u²}/(u√π).\n- **The depth scale is 2√(Dt).** At x = 2√(Dt) (u = 1) C has dropped to 15.7 % of C_s; at x = 4√(Dt) (u = 2) to 0.47 %; at x = 6√(Dt) (u = 3) to about 2×10⁻⁵ of C_s.\n- **With time the profile pushes deeper** as √t, while the surface value stays pinned at 10²⁰ cm⁻³: four times the time gives twice the depth.\n- **The dose keeps growing** because the source keeps supplying atoms:\n\n    Q = (2/√π) C_s √(Dt)\n\nWhere:\n\n- Q = dose (atoms/cm²); other symbols as above\n\n- **A junction forms** where C(x_j) = N_B, the background doping of opposite type:\n\n    x_j = 2√(Dt) · erfc⁻¹( N_B / C_s )\n\nWhere:\n\n- erfc⁻¹ = inverse complementary error function: the value of u for which erfc(u) equals the number in brackets (read the erfc table backwards)\n\n#### 3. Worked numerical illustration\n\n**Given:** boron diffused into n-type silicon at 1000 °C (T = 1273 K) for t = 1 h = 3600 s, with C_s = 1×10²⁰ cm⁻³. For boron in Si, D₀ = 0.76 cm²/s and E_a = 3.46 eV. Background doping N_B = 1×10¹⁶ cm⁻³ (phosphorus).\n\n**Find:** D, the depth scale, C(x) at several depths, the junction depth x_j and the dose Q.\n\n**Formula:** D = D₀e^{−E_a/kT}; C = C_s erfc(x/2√(Dt)); x_j = 2√(Dt) erfc⁻¹(N_B/C_s); Q = (2/√π)C_s√(Dt).\n\n**Solution.**\n\nStep 1. Diffusion coefficient:\n\n    kT = 8.617×10⁻⁵ × 1273 = 0.1097 eV,   E_a/kT = 3.46/0.1097 = 31.54\n    D = 0.76 × e^{−31.54} = 1.5×10⁻¹⁴ cm²/s\n\nStep 2. Depth scale:\n\n    Dt = 1.5×10⁻¹⁴ × 3600 = 5.4×10⁻¹¹ cm²\n    √(Dt) = 7.35×10⁻⁶ cm = 0.0735 μm,   2√(Dt) = 0.147 μm\n\nStep 3. Profile (x = u × 0.147 μm):\n\n| u = x/2√(Dt) | Depth x (μm) | erfc(u) | C (cm⁻³) |\n|---|---|---|---|\n| 0 | 0 | 1.000 | 1.0×10²⁰ |\n| 0.5 | 0.074 | 0.480 | 4.8×10¹⁹ |\n| 1.0 | 0.147 | 0.157 | 1.6×10¹⁹ |\n| 1.5 | 0.220 | 0.0339 | 3.4×10¹⁸ |\n| 2.0 | 0.294 | 4.7×10⁻³ | 4.7×10¹⁷ |\n| 2.5 | 0.367 | 4.1×10⁻⁴ | 4.1×10¹⁶ |\n| 2.75 | 0.404 | 1.0×10⁻⁴ | 1.0×10¹⁶ (junction) |\n| 3.0 | 0.441 | 2.2×10⁻⁵ | 2.2×10¹⁵ |\n\nStep 4. Junction depth: erfc(u_j) = N_B/C_s = 10¹⁶/10²⁰ = 1×10⁻⁴, which gives u_j = 2.75.\n\n    x_j = 2.75 × 0.147 μm = 0.404 μm\n\nStep 5. Dose:\n\n    Q = (2/√π) × 1×10²⁰ × 7.35×10⁻⁶ = 1.128 × 7.35×10¹⁴ = 8.3×10¹⁴ atoms/cm²\n\n**Answer:** **C(x) = 1×10²⁰ erfc(x/0.147 μm) cm⁻³; it falls from 10²⁰ cm⁻³ at the surface to 1.6×10¹⁹ cm⁻³ at 0.15 μm and 4.7×10¹⁷ cm⁻³ at 0.29 μm, reaching the background 10¹⁶ cm⁻³ at x_j ≈ 0.40 μm; dose Q ≈ 8.3×10¹⁴ cm⁻².**\n\n**What this means:** in one hour at 1000 °C the boron forms a heavily doped p⁺ layer only about 0.4 μm thick: concentration drops four orders of magnitude in 0.4 μm. Diffusing for 4 h would double x_j to 0.81 μm (and the dose to 1.7×10¹⁵ cm⁻²) while the surface would stay at 10²⁰ cm⁻³.\n\n#### 4. Sketch\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 200\" role=\"img\" aria-label=\"Constant-source erfc profiles all start at the same surface value and deepen with time; fixed-dose Gaussian profiles spread and their surface value falls\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"50.0\" y1=\"176.0\" x2=\"274.0\" y2=\"176.0\" style=\"stroke:currentColor\" str ,157.8 485.1,158.2 486.5,158.5 487.9,158.8 489.4,159.1 490.8,159.5 492.2,159.8 493.7,160.1 495.1,160.4 496.6,160.8 498.0,161.1 499.4,161.4 500.9,161.7 502.3,162.0 503.8,162.3 505.2,162.6 506.6,162.9 508.1,163.2 509.5,163.5 510.9,163.7 512.4,164.0 513.8,164.3 515.2,164.6 516.7,164.8 518.1,165.1 519.6,165.3 521.0,165.6 522.4,165.8 523.9,166.1 525.3,166.3 526.8,166.6 528.2,166.8 529.6,167.0 531.1,167.3 532.5,167.5 533.9,167.7 535.4,167.9 536.8,168.1 538.2,168.3 539.7,168.6 541.1,168.8 542.6,168.9 544.0,169.1 545.4,169.3 546.9,169.5 548.3,169.7 549.8,169.9 551.2,170.0 552.6,170.2 554.1,170.4 555.5,170.5 556.9,170.7 558.4,170.9 559.8,171.0 561.2,171.2 562.7,171.3 564.1,171.4 565.6,171.6 567.0,171.7 568.4,171.9 569.9,172.0 571.3,172.1 572.8,172.2 574.2,172.4 575.6,172.5 577.1,172.6 578.5,172.7 579.9,172.8 581.4,172.9 582.8,173.0 584.2,173.1 585.7,173.2 587.1,173.3 588.6,173.4 590.0,173.5\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"366.0\" y=\"131.4\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">9t₁</text><text x=\"475.0\" y=\"27.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor\" opacity=\".85\">fixed dose: Gaussian</text></svg><figcaption>Left panel: constant-source erfc profiles at times t₁, 4t₁ and 9t₁. All start from the same surface value C<sub>s</sub>; longer times push the profile deeper.</figcaption></figure>\n```\n\n**Sketch in the exam:** axes of log C (from 10¹⁵ to 10²¹ cm⁻³) against depth x (μm). Draw three erfc curves for t₁ < t₂ < t₃, all starting at the same point C_s = 10²⁰ cm⁻³ on the vertical axis, flat-ish near the surface then bending steeply down; the later curves lie further to the right. Draw a horizontal dashed line at N_B = 10¹⁶ cm⁻³ and mark x_j where each curve crosses it; label the region above the line \"p-type (B > N_B)\" and below \"n-type substrate\".\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ identifies constant-source (predeposition) diffusion and states the boundary conditions\n- ✓ C(x, t) = C_s erfc(x/2√(Dt)) with every symbol defined\n- ✓ C = C_s = 10²⁰ cm⁻³ at x = 0, independent of time\n- ✓ monotonic, steep fall with depth on the scale 2√(Dt); profile deepens as √t\n- ✓ dose Q = (2/√π)C_s√(Dt) grows with time\n- ✓ junction where C(x_j) = N_B, x_j = 2√(Dt) erfc⁻¹(N_B/C_s)\n- ✓ realistic numbers: D ≈ 1.5×10⁻¹⁴ cm²/s for B at 1000 °C, x_j ≈ 0.4 μm for 1 h into 10¹⁶ cm⁻³\n- ✓ labelled sketch (log C against x, several times, N_B line, x_j)\n\n**Common mistakes.**\n\n- Using the Gaussian profile. A **constant** surface concentration means erfc; a **fixed dose** (source removed) means Gaussian.\n- Saying the surface concentration rises or falls with time. In this case it is fixed at 1×10²⁰ cm⁻³; only the depth and the dose grow.\n- Forgetting to convert units: √(Dt) comes out in cm; multiply by 10⁴ for μm.\n- Plotting on a linear scale only: the interesting part (10¹⁶–10¹⁸ cm⁻³ near the junction) is invisible unless C is on a log axis.\n\n**Remember it.** \"Constant source: surface stays put, the erfc tail creeps in as √(Dt).\"\n\n**Try a variant.** Repeat the junction-depth calculation for the same boron diffusion (1000 °C, 1 h) into a more lightly doped substrate, N_B = 1×10¹⁵ cm⁻³ (erfc⁻¹(10⁻⁵) = 3.12). *Answer:* x_j = 3.12 × 0.147 μm = **0.46 μm**. Ten times lighter background moves the junction only 14 % deeper, because the erfc tail is so steep.\n\n---\n\n### Q20. Explain the principle of ion implantation and identify its major advantages over thermal diffusion.\n\n> **Question type:** Explain and list · **Topic:** ion implantation · **Full notes:** Week 3 (Impurity Control and Doping)\n\n**What the examiner wants.** The principle: ions generated, mass-selected, accelerated to a known energy, scanned over the wafer, stopping at a depth set by energy, with a Gaussian profile at R_p, dose from beam charge, then annealing. Then a list of distinct advantages, each tied to a contrast with diffusion. A labelled block diagram and a profile sketch earn marks.\n\n**Key terms.**\n\n- **Ion implantation:** doping by firing accelerated dopant ions into the wafer.\n- **Ion energy (E):** the kinetic energy gained by an ion of charge q through accelerating voltage V, E = qV (keV to MeV).\n- **Dose (Q or Φ):** the number of implanted ions per cm² of wafer.\n- **Projected range (R_p):** the average depth at which the ions stop.\n- **Straggle (ΔR_p):** the standard deviation of the stopping depths about R_p.\n- **Nuclear and electronic stopping:** energy loss by collisions with silicon nuclei (causes damage) and with electrons (little damage).\n- **Annealing:** heating after implantation to repair lattice damage and place dopants on lattice sites where they become electrically active.\n- **Channelling:** ions travelling unusually deep along open crystal directions; prevented by tilting the wafer about 7°.\n\n**Model answer.**\n\n#### 1. Principle\n\nDopant atoms are **ionised, accelerated through a high voltage and fired into the wafer**, where they slow down by collisions and come to rest below the surface. The depth is set by the ion energy, the amount by the beam charge.\n\n    ion source → extraction → mass analyser (magnet) → accelerator → focusing and scanning → wafer (in vacuum)\n\n- **Ion source:** a gas such as BF₃, PH₃ or AsH₃ is ionised in a plasma to give positive ions.\n- **Extraction and mass analysis:** an electric field pulls the ions out; a magnet bends each ion by an amount that depends on its mass-to-charge ratio, so only the chosen species (e.g. ¹¹B⁺) passes the exit slit.\n- **Acceleration:** the ions gain kinetic energy E = qV (a singly charged ion through 100 kV has 100 keV).\n- **Scanning:** the beam is swept across the wafer for uniform doping. The whole path is in high vacuum.\n- **Stopping:** inside the silicon each ion loses energy by **nuclear stopping** (collisions with Si nuclei, which displace atoms and damage the lattice) and **electronic stopping** (interaction with electrons). It stops at a random depth; the distribution is approximately **Gaussian**:\n\n    C(x) = [ Q / (√(2π) ΔR_p) ] exp[ −(x − R_p)² / (2ΔR_p²) ]\n\nWhere:\n\n- C(x) = implanted concentration at depth x (cm⁻³)\n- Q = dose (ions/cm²)\n- R_p = projected range (cm), increasing with energy and decreasing with ion mass\n- ΔR_p = straggle (cm)\n\nThe peak is **below the surface** at x = R_p, with height N_p = Q/(√(2π)ΔR_p) ≈ 0.4Q/ΔR_p.\n\n- **Dose measurement:** the ion current reaching the wafer is collected (Faraday cup) and integrated:\n\n    Q = I t / (q A)\n\nWhere:\n\n- I = beam current (A); t = implant time (s); q = 1.6×10⁻¹⁹ C per singly charged ion; A = implanted area (cm²)\n\n- **Annealing:** furnace annealing or rapid thermal annealing (RTA, about 1000 °C for seconds) repairs the damage and activates the dopants. Channelling is avoided by tilting the wafer about 7° or using a thin screen oxide.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 205\" role=\"img\" aria-label=\"Gaussian implanted profile peaking at the projected range R_p below the surface, with straggle ΔR_p and the junction where it meets the background doping\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"> sion\n\n1. **Precise dose control** (about ±1 %) over 10¹¹ to 10¹⁶ ions/cm², because the dose is counted from measured charge. In diffusion the dose depends on solid solubility, temperature and time and is far less accurate.\n2. **Depth and dose are independent:** depth set by energy, dose by charge. In diffusion both depend on the same Dt product.\n3. **Low process temperature:** implantation is done near room temperature, so earlier dopant profiles are not disturbed and the thermal budget is small.\n4. **Very shallow junctions** with low-energy implants, essential for modern MOSFETs.\n5. **Buried and retrograde profiles:** the peak can be placed below the surface; a diffused profile always has its maximum at the surface.\n6. **Photoresist can be used as a mask**, which simplifies processing; diffusion needs oxide or nitride masks that survive 1000 °C.\n7. **Less lateral spread** under mask edges (about ΔR_p, compared with 0.8 × depth for diffusion), allowing smaller, self-aligned devices.\n8. **High purity:** mass analysis passes only the chosen ion.\n9. **Not limited by solid solubility**, and good uniformity and reproducibility across large wafers.\n\n**Limitations (for balance):** expensive equipment, lattice damage that must be annealed, channelling, and lower throughput (one or a few wafers at a time).\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ principle: ionise, mass-analyse, accelerate (E = qV), scan, implant in vacuum\n- ✓ stopping by nuclear and electronic collisions; depth set by energy and ion mass\n- ✓ Gaussian profile with R_p and ΔR_p; peak below the surface\n- ✓ dose Q = It/qA measured from beam charge\n- ✓ annealing to repair damage and activate dopants; channelling and 7° tilt\n- ✓ at least five advantages, each contrasted with diffusion (dose precision, independent depth, low temperature, shallow/buried profiles, resist mask, small lateral spread)\n- ✓ labelled block diagram and profile sketch\n\n**Common mistakes.**\n\n- Saying implantation needs no heating. It needs an anneal; the advantage is that the *doping step* is at room temperature and the anneal is short.\n- Claiming the implanted peak is at the surface. It is at R_p below the surface.\n- Listing advantages without saying *over diffusion*: each point should state what diffusion does instead.\n\n**Remember it.** \"Energy picks the depth, charge counts the dose, anneal heals the damage.\"\n\n**Try a variant.** A 100 mm diameter wafer is implanted with singly charged P⁺ ions using a beam current of 50 μA for 100 s. Find the dose. *Answer:* A = π × (5 cm)² = 78.5 cm²; Q = It/(qA) = (50×10⁻⁶ × 100)/(1.6×10⁻¹⁹ × 78.5) = **4.0×10¹⁴ ions/cm²**.\n\n---\n\n### Q21. Compare diffusion and ion implantation as semiconductor doping techniques.\n\n> **Question type:** Compare · **Topic:** diffusion versus ion implantation · **Full notes:** Week 3 (Impurity Control and Doping)\n\n**What the examiner wants.** A short description of each technique (principle, profile equation), then a point-by-point comparison on the same headings: principle, temperature, profile shape, dose control, depth control, lateral spread, masking, damage, throughput and cost, typical uses. End with a comparison table and a one-paragraph conclusion.\n\n**Key terms.**\n\n- **Thermal diffusion:** doping in which dopant atoms move into a heated wafer (900–1200 °C) from a surface source by random thermal jumps.\n- **Ion implantation:** doping in which accelerated dopant ions are fired into the wafer and stop by collisions.\n- **Dose (Q):** dopant atoms introduced per cm² of surface.\n- **Profile:** the curve of dopant concentration C against depth x.\n- **Projected range (R_p) and straggle (ΔR_p):** mean stopping depth of implanted ions and its spread.\n- **Lateral diffusion:** sideways spread of dopant under the edge of a mask window.\n- **Thermal budget:** the total amount of high-temperature processing (temperature and time) a wafer receives; more budget means existing profiles spread more.\n- **Annealing:** post-implant heating that repairs damage and activates dopants.\n\n**Model answer.**\n\n#### 1. Thermal diffusion\n\nThe wafer is heated to 900–1200 °C in a furnace with a dopant source (gas or doped glass) at the surface. Atoms move in by random thermal jumps, obeying Fick's laws. A **predeposition** at constant surface concentration C_s gives\n\n    C(x, t) = C_s erfc( x / 2√(Dt) )\n\nand a **drive-in** of the fixed dose Q gives\n\n    C(x, t) = [ Q / √(πDt) ] e^{−x²/4Dt}\n\nWhere:\n\n- C(x, t) = concentration at depth x after time t (cm⁻³)\n- C_s = surface concentration (cm⁻³); Q = dose (cm⁻²)\n- D = diffusion coefficient (cm²/s); t = time (s); x = depth (cm)\n\nBoth profiles have their **maximum at the surface**, and dose and depth are both governed by the single product Dt.\n\n#### 2. Ion implantation\n\nDopant ions are mass-selected, accelerated to energy E = qV (keV–MeV) and scanned over the wafer at room temperature. The profile is approximately Gaussian with its **peak below the surface**:\n\n    C(x) = [ Q / (√(2π) ΔR_p) ] exp[ −(x − R_p)² / (2ΔR_p²) ]\n\nWhere:\n\n- R_p = projected range, set by ion energy (cm); ΔR_p = straggle (cm); Q = dose measured from beam charge, Q = It/qA\n\nThe lattice is damaged and the wafer must be **annealed**.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 205\" role=\"img\" aria-label=\"Gaussian implanted profile peaking at the projected range R_p below the surface, with straggle ΔR_p and the junction where it meets the background doping\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" exam:** on one set of axes (log C against x), draw a diffused erfc curve falling from the surface and an implanted Gaussian peaking at R_p below the surface; add the N_B line and mark x_j for each.\n\n#### 3. Comparison table\n\n| Feature | Thermal diffusion | Ion implantation |\n|---|---|---|\n| Principle | Random thermal jumps down a concentration gradient (Fick's laws) | Kinetic energy of accelerated ions; stopping by nuclear and electronic collisions |\n| Process temperature | High, 900–1200 °C | Near room temperature, plus anneal (RTA ≈ 1000 °C for seconds) |\n| Profile shape | erfc (constant source) or Gaussian (fixed dose), maximum at surface | Gaussian centred at R_p, peak below surface; buried and retrograde profiles possible |\n| Dose control | Moderate (± 5–10 %), set by solubility, T and t | Excellent (± 1 %), counted from beam charge |\n| Depth control | Coupled to dose through Dt | Independent, set by ion energy |\n| Shallow junctions | Difficult | Easy (low-energy implants) |\n| Lateral spread | Large, about 0.8 × junction depth | Small, about ΔR_p |\n| Masking material | SiO₂ or Si₃N₄ (must survive high T) | Photoresist, oxide, nitride, polysilicon |\n| Crystal damage | Negligible | Significant; annealing essential; amorphisation at high doses |\n| Special problem | Disturbs earlier profiles (large thermal budget) | Channelling (prevented by 7° tilt, screen oxide) |\n| Concentration limit | Solid solubility | Can exceed solubility |\n| Purity | Depends on source and furnace cleanliness | Mass-analysed, very pure |\n| Throughput and cost | Batches of 100+ wafers, cheap furnace | One or a few wafers at a time, expensive implanter |\n| Typical uses | Drive-in, deep wells, solar-cell emitters, older bipolar processes | Source/drain, threshold-voltage adjust, wells, LDD, channel stops in modern CMOS |\n\n#### 4. Conclusion\n\nDiffusion is simple, cheap, damage-free and handles many wafers at once, but its dose and depth are coupled, it needs high temperature, it spreads sideways and it cannot easily make very shallow junctions. Ion implantation gives precise, independent control of dose and depth at low temperature, allows buried profiles and resist masks, and is the standard method in modern VLSI, at the cost of expensive equipment and lattice damage that must be annealed. In practice the two are combined: **implant to set the dose, then a thermal drive-in (or anneal) to set the final depth**.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ brief principle of each technique\n- ✓ profile equations: erfc / Gaussian for diffusion; Gaussian at R_p for implantation\n- ✓ temperature contrast (900–1200 °C versus room temperature plus anneal)\n- ✓ dose and depth control: coupled through Dt versus independent (charge and energy)\n- ✓ lateral spread, masking materials and shallow-junction capability\n- ✓ damage/annealing and channelling for implantation\n- ✓ cost, throughput and typical applications\n- ✓ comparison table and a concluding sentence (they are complementary)\n\n**Common mistakes.**\n\n- Writing two separate essays with no direct comparison. Use the same headings for both, ideally in a table.\n- Saying diffusion gives a Gaussian \"peaked below the surface\". Diffused profiles always peak at the surface; only implanted profiles peak below it.\n- Ignoring the disadvantages of implantation (damage, channelling, cost). A fair comparison scores higher.\n\n**Remember it.** \"Diffusion: hot, cheap, surface-peaked, coupled. Implantation: cold, precise, buried-peak, independent, but needs an anneal.\"\n\n**Try a variant.** Boron is implanted with dose 1×10¹⁵ cm⁻² and straggle ΔR_p = 0.03 μm. Find the peak concentration and say why such a high value could not be obtained this shallow by diffusion. *Answer:* N_p = Q/(√(2π)ΔR_p) = 1×10¹⁵/(2.507 × 3×10⁻⁶ cm) = **1.3×10²⁰ cm⁻³**, a few hundredths of a micron below the surface. Diffusion is limited by solid solubility and needs a long, hot cycle to put in this dose, during which the dopant spreads much deeper; implantation places it directly at the chosen depth.\n", "group": "The 50 questions, answered", "eyebrow": "The 50 questions, answered", "disp": "·"}, {"num": "03", "title": "Questions 22–34 — Energy Bands and Carrier Statistics", "body": "\nModule 2: the quantum model of electrons in a crystal, how energy bands form, direct and indirect gaps, intrinsic and extrinsic carriers, Fermi–Dirac statistics, the density of states and the Fermi level. Each question stands on its own: its key terms are defined with it, so you can start anywhere.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| ħ | Reduced Planck constant, h/2π | 1.055×10⁻³⁴ J·s |\n| m₀ | Free-electron mass | 9.11×10⁻³¹ kg |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| Å | Ångström, a unit of length | 1 Å = 10⁻¹⁰ m = 0.1 nm |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_D | Donor energy level, just below E_c | eV; E_c − E_D ≈ 0.045 eV for P in Si |\n| E_A | Acceptor energy level, just above E_v | eV; E_A − E_v ≈ 0.045 eV for B in Si |\n| E_n | Allowed energy of level n of a particle in a box | J or eV |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| g(E), g_c, g_v | Density of states: allowed states per unit energy per unit volume | states/(eV·cm³) |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| n₀, p₀ | Equilibrium electron and hole concentrations | cm⁻³ |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| m∗, m_n∗, m_p∗ | Effective mass of electrons or holes | kg, or as a multiple of m₀ |\n| ψ | Wave function (\\|ψ\\|² is the probability density) | — |\n| V(x) | Potential energy in the Schrödinger equation | J or eV |\n| k (wave vector) | Wave vector, 2π/λ; measures the electron's momentum, p = ħk | m⁻¹ or cm⁻¹ |\n| α (Kronig–Penney) | √(2mE)/ħ, set by the electron energy | m⁻¹ |\n| P (Kronig–Penney) | Barrier strength mV₀ba/ħ² | dimensionless |\n| V₀ | Height of a potential barrier | J or eV |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| ν, hν | Frequency of light, and photon energy | Hz; eV |\n| f (growth) | Fraction of the melt already solidified | 0 to 1 |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| V, V_a | Applied voltage (positive for forward bias) | V |\n| α | Common-base current gain, I_C/I_E | dimensionless; 0.98–0.999 |\n| β | Common-emitter current gain, I_C/I_B (also h_FE) | dimensionless; 50–500 |\n| λ_max | Longest wavelength a material absorbs, 1.24/E_g (μm, E_g in eV) | μm |\n| ψ_k(x), u_k(x) | Bloch wavefunction of an electron, and its part that repeats with the lattice | — |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| GaN | Gallium nitride |\n| InP | Indium phosphide |\n| GaP | Gallium phosphide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| CB | Conduction band |\n| VB | Valence band |\n| MOS | Metal–oxide–semiconductor |\n| IC | Integrated circuit |\n| LED | Light-emitting diode |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n## Questions on this page\n\n| Q | Question |\n|---|---|\n| 22 | Explain the basic assumptions of the quantum mechanical model of electrons in a semiconductor. |\n| 23 | State the time-independent Schrödinger equation and explain the physical meaning of its terms. |\n| 24 | Explain the basic principle of the Kronig-Penney model and how it leads to the formation of energy bands. |\n| 25 | Distinguish between valence band, conduction band, and forbidden energy gap. |\n| 26 | Explain the difference between a direct band-gap and an indirect band-gap semiconductor. |\n| 27 | What is meant by an intrinsic semiconductor? Derive the expression for intrinsic carrier concentration. |\n| 28 | Explain the difference between intrinsic and extrinsic carrier concentrations. |\n| 29 | Silicon has an intrinsic carrier concentration of approximately 1.0 × 10¹⁰ cm⁻³ at a specified temperature. If the electron and hole concentrations are equal, determine the electron and hole concentrations. |\n| 30 | Explain the Fermi-Dirac distribution function and its significance in semiconductor physics. |\n| 31 | Write the Fermi-Dirac distribution equation and explain what happens to the distribution at absolute zero. |\n| 32 | Define the density of states in a semiconductor and explain its importance in determining carrier concentration. |\n| 33 | Explain how the Fermi energy level changes with doping in n-type and p-type semiconductors. |\n| 34 | An n-type semiconductor has a donor concentration of 5 × 10¹⁶ cm⁻³. Assuming complete ionization, determine the approximate majority-carrier concentration. |\n\n## Model answers\n\n### Q22. Explain the basic assumptions of the quantum mechanical model of electrons in a semiconductor.\n\n> **Question type:** Explanation · **Topic:** quantum model of electrons in a crystal · **Full notes:** Week 4 (Energy Bands and Carrier Concentrations)\n\n**What the examiner wants.** \"Explain the assumptions\" means list each simplifying assumption the model makes AND say in a sentence why it is made or what it allows. A full answer names about six assumptions, from the wave nature of the electron to the statistics that fill the bands, and ends by saying what the model predicts (energy bands).\n\n**Key terms.**\n\n- **Wave function (ψ):** the mathematical wave that describes an electron; |ψ|² gives the probability of finding it at a point.\n- **Schrödinger equation:** the wave equation whose solutions give the allowed wave functions and energies of an electron.\n- **Lattice:** the regular, repeating arrangement of atoms in a crystal; its repeat distance is the lattice period a.\n- **Periodic potential:** a potential energy V(x) that repeats with the lattice period, V(x + a) = V(x).\n- **Phonon:** a quantum (packet) of lattice vibration.\n- **Effective mass (m∗):** the mass a carrier appears to have when pushed by a force inside the crystal.\n- **Fermi–Dirac distribution f(E):** the probability that an electron state of energy E is occupied in thermal equilibrium.\n\n**Model answer.**\n\nA crystal contains about 5×10²² atoms per cm³ and even more electrons, all interacting. This many-body problem cannot be solved exactly, so the quantum mechanical model makes the following assumptions.\n\n**1. Electrons behave as waves.** Each electron is described by a wave function ψ that obeys the Schrödinger equation. Its momentum is written p = ħk, where k = 2π/λ is the wave vector and ħ = h/2π = 1.055×10⁻³⁴ J·s. This replaces the classical \"small ball\" picture, which cannot explain why some solids conduct and others do not.\n\n**2. The nuclei are fixed (adiabatic or Born–Oppenheimer approximation).** A silicon nucleus is about 50 000 times heavier than an electron and moves far more slowly, so the ion cores are treated as stationary at their lattice sites. Their vibrations (phonons) are added back later as a small disturbance that scatters carriers.\n\n**3. The crystal is perfect and infinite.** The ion cores form a perfectly regular lattice that extends forever, so the potential energy seen by an electron is exactly periodic:\n\n    V(x + a) = V(x)\n\nWhere:\n\n- V(x) = potential energy of an electron at position x (eV)\n- a = lattice period, the spacing of the repeating unit (cm or Å)\n\nSurfaces, impurities and defects are ignored at first and treated separately later (as donor, acceptor or trap levels).\n\n**4. Each electron moves independently (one-electron approximation).** Instead of tracking every electron–electron repulsion, each electron is assumed to move in an *average* periodic potential created by all the ion cores and all the other electrons. The many-body problem becomes a single-particle problem that can be solved.\n\n**5. Pauli exclusion principle.** Each quantum state (one value of k and one spin) can hold at most one electron. The states are therefore filled from the lowest energy upwards, which is why a band can be \"full\" or \"empty\".\n\n**6. Thermal-equilibrium statistics.** At temperature T the electrons are shared among the available states according to the Fermi–Dirac function f(E). This decides how many electrons sit in the conduction band and how many holes are left in the valence band.\n\n**7. Effective-mass approximation.** Near the edge of a band, an electron (or hole) responds to an applied force as if it were a free particle with an effective mass m∗. The whole effect of the crystal potential is packed into this one number, so device equations can treat carriers as simple particles.\n\n**What the assumptions lead to.** Assumptions 3 and 4 give **Bloch's theorem**: the electron wave in a periodic potential is a travelling wave multiplied by a function with the period of the lattice, ψ_k(x) = u_k(x)e^{ikx}. Solving the Schrödinger equation with this form (for example in the Kronig–Penney model) gives **allowed energy bands separated by forbidden gaps**, the basis of all semiconductor physics.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ electron described by a wave function ψ obeying the Schrödinger equation\n- ✓ nuclei treated as fixed (Born–Oppenheimer); vibrations added later as phonons\n- ✓ perfect, infinite periodic lattice with V(x + a) = V(x)\n- ✓ one-electron (independent-electron, average-potential) approximation\n- ✓ Pauli exclusion principle fills states from the bottom up\n- ✓ Fermi–Dirac statistics in thermal equilibrium\n- ✓ effective-mass approximation near band edges\n- ✓ conclusion: Bloch waves and energy bands with gaps\n\n**Common mistakes.**\n\n- Listing the assumptions with no explanation. The command word is \"explain\": add one sentence on why each is made.\n- Calling Bloch's theorem an assumption. It is a *result* of assuming a periodic potential; say so.\n- Confusing \"periodic potential\" with \"periodic wave function\". The potential repeats exactly; the Bloch wave function repeats only up to a phase factor e^{ika}.\n\n**Remember it.** \"Wave, Fixed, Perfect, Alone, Pauli, Fermi, Effective\": the electron is a wave, nuclei are fixed, the crystal is perfect, each electron is alone in an average field, Pauli fills the states, Fermi sets the occupation, and m∗ hides the crystal.\n\n**Try a variant.** Why does an electron in a perfect crystal travel without being scattered by the atoms, and what does scatter it? *Answer:* in a perfectly periodic potential the solutions are Bloch waves, ψ_k = u_k(x)e^{ikx}, which are travelling waves that extend through the whole crystal; the atoms only shape the wave (through u_k) and do not deflect it. Scattering comes only from departures from perfect periodicity: lattice vibrations (phonons), ionised impurities, defects and surfaces. This is why mobility falls when temperature or doping rises.\n\n---\n\n### Q23. State the time-independent Schrödinger equation and explain the physical meaning of its terms.\n\n> **Question type:** Statement and explanation · **Topic:** Schrödinger equation · **Full notes:** Week 4 (Energy Bands and Carrier Concentrations)\n\n**What the examiner wants.** Write the equation correctly (one-dimensional form is enough, the 3-D form earns credit), then explain every term: the wave function, the kinetic-energy term, the potential-energy term and the energy E. Mention the conditions ψ must satisfy and how quantisation follows.\n\n**Key terms.**\n\n- **Wave function (ψ):** the amplitude of the electron's probability wave; |ψ|² dx is the probability of finding it between x and x + dx.\n- **Stationary state:** a state whose energy and probability distribution do not change with time.\n- **Hamiltonian (Ĥ):** the total-energy operator, kinetic plus potential.\n- **Eigenvalue:** an allowed value of E for which the equation has an acceptable solution.\n- **Reduced Planck constant (ħ):** ħ = h/2π = 1.055×10⁻³⁴ J·s.\n\n**Model answer.**\n\n**The equation.** In one dimension, for an electron of mass m in a potential energy V(x) that does not change with time:\n\n    −(ħ²/2m) d²ψ(x)/dx² + V(x) ψ(x) = E ψ(x)\n\nWhere:\n\n- ψ(x) = wave function of the electron (for a 1-D problem its unit is m^{−1/2})\n- ħ = reduced Planck constant, h/2π = 1.055×10⁻³⁴ J·s\n- m = electron mass, 9.11×10⁻³¹ kg (in a crystal, the effective mass m∗)\n- x = position (m)\n- V(x) = potential energy of the electron at x (J)\n- E = total energy of the electron (J)\n\nIn three dimensions, −(ħ²/2m)∇²ψ(r) + V(r)ψ(r) = Eψ(r), written compactly as **Ĥψ = Eψ**.\n\n**Physical meaning of each term.** The equation is an energy balance: **kinetic energy + potential energy = total energy**.\n\n- **ψ(x), the wave function.** ψ itself cannot be measured. Its square, |ψ(x)|² dx, is the probability of finding the electron between x and x + dx. Where |ψ|² is large, the electron is likely to be found.\n- **−(ħ²/2m) d²ψ/dx², the kinetic-energy term.** It comes from the classical kinetic energy p²/2m with the momentum replaced by the operator p = −iħ d/dx. The second derivative measures how sharply ψ curves: a wave that wiggles tightly (short wavelength) has high momentum and high kinetic energy.\n- **V(x)ψ, the potential-energy term.** V(x) describes the forces acting on the electron: the attraction of the ion cores in a crystal, a barrier, or a well. In a crystal V(x) is periodic.\n- **E, the total energy.** A constant, because the equation describes stationary states. Acceptable solutions exist only for certain values of E, the **eigenvalues**. This is how energy quantisation (and, in a crystal, energy bands) appears.\n- **The left-hand side as a whole** is the Hamiltonian operator Ĥ acting on ψ.\n\n**Conditions on ψ.** ψ must be finite, single-valued and continuous, with a continuous slope dψ/dx wherever V is finite, and normalised, ∫|ψ|² dx = 1 (the electron is certainly somewhere). These conditions are what pick out the allowed energies.\n\n**Link to time.** The full wave function is Ψ(x, t) = ψ(x) e^{−iEt/ħ}. Because |e^{−iEt/ħ}|² = 1, the probability |Ψ|² does not change with time, which is why these are called stationary states.\n\n**Two quick illustrations.**\n\n- Free electron (V = 0): ψ = Ae^{ikx} and E = ħ²k²/2m. Any energy is allowed.\n- Electron in a box of width L with impassable walls: ψ must be zero at both walls, so only E_n = n²π²ħ²/2mL² (n = 1, 2, 3 …) are allowed. Confinement produces quantisation.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ correct equation −(ħ²/2m)d²ψ/dx² + Vψ = Eψ (and/or Ĥψ = Eψ)\n- ✓ ψ explained, with |ψ|² as probability density\n- ✓ first term identified as kinetic energy, linked to p = −iħ d/dx\n- ✓ V(x)ψ identified as potential energy, with an example (periodic crystal potential)\n- ✓ E is the constant total energy; only eigenvalues allowed, giving quantisation\n- ✓ conditions on ψ (finite, continuous, normalised)\n- ✓ \"time-independent\" explained: V independent of t, stationary states\n\n**Common mistakes.**\n\n- Dropping the minus sign or writing ħ²/m instead of ħ²/2m. Check by the free-electron result: ψ = e^{ikx} must give E = ħ²k²/2m.\n- Saying ψ is the probability. It is |ψ|² that is the probability density.\n- Writing E as a variable that changes with x. E is a single constant for each solution.\n\n**Remember it.** \"Curvature is kinetic, V is potential, E is the total\": KE + PE = E, written for waves.\n\n**Try a variant.** Find the lowest three energy levels of an electron confined in a one-dimensional box of width 1 nm. *Answer:* E_n = n²π²ħ²/2mL². E₁ = π² × (1.055×10⁻³⁴)² / (2 × 9.11×10⁻³¹ × (10⁻⁹)²) = 6.03×10⁻²⁰ J = **0.377 eV**; E₂ = 4E₁ = **1.51 eV**; E₃ = 9E₁ = **3.39 eV**. The levels are discrete and spread further apart as n rises; halving the box to 0.5 nm makes E₁ four times larger (1.51 eV).\n\n---\n\n### Q24. Explain the basic principle of the Kronig-Penney model and how it leads to the formation of energy bands.\n\n> **Question type:** Explanation · **Topic:** Kronig–Penney model and energy bands · **Full notes:** Week 4 (Energy Bands and Carrier Concentrations)\n\n**What the examiner wants.** Two parts: (1) the principle, meaning the idealised periodic potential the model uses and how it is solved (Schrödinger equation, boundary conditions, Bloch's theorem); (2) how bands follow, meaning the final condition and the argument that cos(ka) must lie between −1 and +1. A labelled sketch of the potential and of the condition plotted against αa earns marks.\n\n**Key terms.**\n\n- **Periodic potential:** a potential energy that repeats with the lattice period.\n- **Bloch's theorem:** in a periodic potential the wave function satisfies ψ(x + L) = e^{ikL}ψ(x), where L is the period; it is a travelling wave times a periodic function.\n- **Wave vector (k):** k = 2π/λ; it measures the electron's momentum, p = ħk.\n- **Allowed band:** a range of energies for which electron states exist.\n- **Forbidden gap:** a range of energies for which no electron states exist.\n- **Brillouin-zone boundary:** the values k = ±nπ/a where the electron wave is Bragg-reflected by the lattice and band edges occur.\n- **Barrier strength (P):** a dimensionless number measuring how tightly each atom holds its electrons.\n\n**Model answer.**\n\n**1. The principle.** The real potential in a crystal is complicated. Kronig and Penney (1931) replaced it with the simplest *periodic* potential that can be solved exactly: an infinite one-dimensional row of **rectangular wells and barriers**.\n\n- Each **well** (V = 0, width a) represents the region near an ion core, where the electron is attracted.\n- Each **barrier** (height V₀, width b) represents the region between ions.\n- The pattern repeats with period a + b.\n\nSketch: a square-wave potential V(x) against x, wells of width a at V = 0, barriers of height V₀ and width b, period (a + b) marked.\n\n**2. The method.**\n\n- Solve the Schrödinger equation in a well, where the solution oscillates, with α² = 2mE/ħ².\n- Solve it in a barrier, where the solution grows or decays exponentially, with β² = 2m(V₀ − E)/ħ².\n- Make ψ and dψ/dx continuous at every edge.\n- Apply Bloch's theorem: the solution in one period equals that in the next multiplied by e^{ik(a+b)}.\n- Take the limit of very thin, very high barriers (b → 0, V₀ → ∞, with V₀b finite). A non-trivial solution then exists only if\n\n    P · sin(αa)/(αa) + cos(αa) = cos(ka),     α = √(2mE)/ħ,     P = mV₀ba/ħ²\n\nWhere:\n\n- α = a quantity that rises with electron energy E (m⁻¹)\n- a = well width, effectively the atomic spacing (m)\n- k = electron wave vector (m⁻¹)\n- P = barrier strength (dimensionless)\n- m = electron mass, 9.11×10⁻³¹ kg; E = electron energy (J)\n- V₀ = barrier height (J); b = barrier width (m)\n- ħ = reduced Planck constant, 1.055×10⁻³⁴ J·s\n\n**3. How bands form.** The right-hand side, cos(ka), is a cosine, so for any real k it must lie **between −1 and +1**. The left-hand side, f(αa), depends only on the energy. Plot f(αa) against αa (that is, against energy):\n\n- it starts at 1 + P (above +1) at αa = 0 and then oscillates like a fading cosine;\n- where **−1 ≤ f(αa) ≤ +1**, a real k exists: these energies are **allowed bands**;\n- where **|f(αa)| > 1**, no real k exists, so no electron wave can travel: these energies are **forbidden gaps**.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 250\" role=\"img\" aria-label=\"Graph of the Kronig-Penney function against alpha a; energies where it lies between minus one and plus one form allowed bands\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><rect x=\"141.7\" y=\"141.6\" 7 493.6,149.3 494.2,149.0 494.8,148.7 495.4,148.4 496.0,148.1 496.6,147.8 497.2,147.5 497.7,147.2 498.3,146.9 498.9,146.7 499.5,146.4 500.1,146.1 500.7,145.9 501.3,145.6 501.8,145.3 502.4,145.1 503.0,144.9 503.6,144.6 504.2,144.4 504.8,144.2 505.4,143.9 505.9,143.7 506.5,143.5 507.1,143.3 507.7,143.1 508.3,142.9 508.9,142.7 509.5,142.6 510.1,142.4 510.6,142.2 511.2,142.1 511.8,141.9 512.4,141.8 513.0,141.6 513.6,141.5 514.2,141.4 514.7,141.2 515.3,141.1 515.9,141.0 516.5,140.9 517.1,140.8 517.7,140.7 518.3,140.6 518.9,140.6 519.4,140.5 520.0,140.4 520.6,140.4 521.2,140.3 521.8,140.3 522.4,140.2 523.0,140.2 523.5,140.2 524.1,140.2 524.7,140.2 525.3,140.2 525.9,140.2 526.5,140.2 527.1,140.2 527.7,140.2 528.2,140.2 528.8,140.3 529.4,140.3 530.0,140.4\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"530.0\" y=\"232.0\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E)\">bars mark allowed bands</text></svg><figcaption>The left-hand side of the Kronig–Penney condition against αa for P = 3π/2. Shaded strips, where the curve stays between −1 and +1, are the allowed bands; where it leaves the strip there are no states and a forbidden gap appears.</figcaption></figure>\n```\n\nSketch: f(αa) against αa with horizontal lines at +1 and −1; shade the allowed bands and label the gaps.\n\n**4. What the model shows.**\n\n- The energy spectrum is a series of **allowed bands separated by forbidden gaps**.\n- Band edges occur at ka = nπ, i.e. k = ±nπ/a, the **Brillouin-zone boundaries**. There the electron wave is Bragg-reflected by the rows of atoms, standing waves form, and the energy splits to open a gap.\n- Allowed bands get **wider at higher energy**, because the sin(αa)/(αa) term fades as αa grows.\n- If **P → ∞** (electrons tightly bound), each band shrinks to a single sharp level, as in an isolated atom.\n- If **P → 0** (no barriers), the gaps close and the free-electron result E = ħ²k²/2m returns.\n\nSo the model shows that bands and gaps are a direct result of an electron wave moving through a periodic potential. Whether the highest occupied band is full or partly full, and how wide the gap above it is, then decides whether a solid is a metal, semiconductor or insulator.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ periodic array of rectangular wells (width a) and barriers (V₀, width b) described or sketched\n- ✓ Schrödinger equation solved in each region; continuity of ψ and dψ/dx\n- ✓ Bloch's theorem applied\n- ✓ final condition P sin(αa)/(αa) + cos(αa) = cos(ka), with α and P defined\n- ✓ argument: |cos ka| ≤ 1, so only energies with |f(αa)| ≤ 1 are allowed\n- ✓ sketch of f(αa) with ±1 lines, bands and gaps labelled\n- ✓ gaps at k = nπ/a (Bragg reflection)\n- ✓ limits P → ∞ (atomic levels) and P → 0 (free electron)\n\n**Common mistakes.**\n\n- Stating the equation without the key argument. The marks are in \"cos(ka) cannot exceed 1 in magnitude, so some energies have no solution\".\n- Plotting f against k instead of against αa (energy). The allowed/forbidden test is made along the energy axis.\n- Mixing up the limits: large P means tight binding (narrow bands), not free electrons.\n\n**Remember it.** \"A cosine can't beat one\": wherever the left-hand side goes beyond ±1, there is a gap.\n\n**Try a variant.** Explain what happens to the band structure in the Kronig–Penney model as the barrier strength P is increased from zero to a very large value. *Answer:* at P = 0 the condition becomes cos(αa) = cos(ka), so α = k and E = ħ²k²/2m for every energy: no gaps, free electron. As P increases, the curve f(αa) rises above +1 and below −1 over wider ranges, so the forbidden gaps widen and the allowed bands narrow. As P → ∞, the bands become allowed only where sin(αa) = 0, i.e. αa = nπ, giving discrete levels E_n = n²π²ħ²/2ma², the levels of an isolated well (electrons tightly bound to each atom).\n\n---\n\n### Q25. Distinguish between valence band, conduction band, and forbidden energy gap.\n\n> **Question type:** Distinction · **Topic:** energy bands · **Full notes:** Week 4 (Energy Bands and Carrier Concentrations)\n\n**What the examiner wants.** Define each of the three clearly, then contrast them point by point: occupancy at 0 K, band edge, role in conduction, carriers and typical values. A labelled band diagram and a comparison table secure full marks.\n\n**Key terms.**\n\n- **Energy band:** a range of closely spaced allowed electron energies, formed when the levels of many atoms split as they come together.\n- **Electron-volt (eV):** the energy an electron gains across 1 V; 1 eV = 1.6×10⁻¹⁹ J.\n- **E_c, E_v:** the energy of the bottom of the conduction band and the top of the valence band (eV).\n- **Band gap (E_g):** E_g = E_c − E_v.\n- **Hole:** an empty electron state in the valence band that behaves as a positive carrier.\n- **Covalent bond:** a pair of electrons shared between neighbouring atoms (four per Si atom).\n\n**Model answer.**\n\n**How the bands arise.** An isolated silicon atom has sharp energy levels. When N atoms form a crystal, each level splits into N closely spaced levels, which merge into a band. In silicon the outer 3s and 3p levels (4 electrons per atom) split into a lower band and an upper band, each with room for 4 electrons per atom, separated by an energy range with no states.\n\n**Valence band.** The highest energy band that is **completely filled** with electrons at absolute zero (0 K). Its top edge is E_v. Its electrons are the bonding electrons that hold the crystal together. A completely full band cannot carry current, because for every electron moving one way there is another moving the other way. When some electrons leave it, the empty states (holes) let the band conduct.\n\n**Conduction band.** The next band above the valence band, **empty** at 0 K. Its bottom edge is E_c. An electron that reaches it is no longer tied to a bond and can move freely through the crystal, carrying current.\n\n**Forbidden energy gap.** The range of energy between E_v and E_c in which a perfect crystal has **no allowed electron states**. Its width is\n\n    E_g = E_c − E_v\n\nWhere:\n\n- E_g = band-gap energy (eV): Si 1.12, Ge 0.66, GaAs 1.42 eV at 300 K\n- E_c = bottom of the conduction band (eV)\n- E_v = top of the valence band (eV)\n\nAn electron needs at least E_g (from heat or a photon) to jump from the valence band to the conduction band. Each jump creates **two** carriers: a free electron in the conduction band and a hole in the valence band. Impurities can place a few levels inside the gap (donor and acceptor levels), but a perfect crystal has none.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 220\" role=\"img\" aria-label=\"Band diagrams of a metal with a partly filled band, a semiconductor with a small gap, and an insulator with a wide gap\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"100.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Metal</text><text x=\"300.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" f
