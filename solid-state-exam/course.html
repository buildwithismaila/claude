" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"260.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"276.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><path d=\"M182,304 a18,6 0 1,1 36,0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" stroke-linejoin=\"round\" marker-end=\"url(#ar)\"/><text x=\"236.0\" y=\"30.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">pull rod: rotate and lift slowly (≈ 1 mm/min)</text><text x=\"212.0\" y=\"83.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">seed crystal (sets orientation)</text><text x=\"210.0\" y=\"102.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Dash neck (removes dislocations)</text><text x=\"244.0\" y=\"172.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">single-crystal ingot</text><text x=\"304.0\" y=\"236.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Si melt, ≈ 1420 °C</text><text x=\"304.0\" y=\"266.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">quartz crucible</text><text x=\"312.0\" y=\"296.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">heater</text><line x1=\"300.0\" y1=\"233.0\" x2=\"252.0\" y2=\"240.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\"/><line x1=\"300.0\" y1=\"263.0\" x2=\"287.0\" y2=\"262.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\"/><line x1=\"308.0\" y1=\"293.0\" x2=\"312.0\" y2=\"286.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\"/><text x=\"200.0\" y=\"335.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.8\">crucible counter-rotates; chamber filled with argon</text></svg><figcaption>A Czochralski puller: the rotating seed is lifted slowly from the melt in a quartz crucible, which rotates the other way; the frozen crystal copies the seed's orientation.</figcaption></figure>\n```\n\n*Sketch in the exam:* crucible with melt, heater coils on both sides, the ingot above the melt with the seed and pull rod at the top, curved arrows showing opposite rotations. Label \"quartz crucible\", \"graphite susceptor\", \"Si melt (1414 °C)\", \"heater\", \"seed\", \"neck\", \"ingot\", \"pull rod\", \"argon in/out\".\n\n**3. Operation (steps in order).**\n\n1. **Load:** chunks of EG-Si polysilicon and a carefully weighed amount of dopant go into the crucible.\n2. **Melt:** the chamber is purged with argon and the charge is melted (≈ 1420 °C).\n3. **Dip:** the seed is lowered until it just touches the melt surface, and the temperature is adjusted so it neither melts away nor grows quickly.\n4. **Neck (Dash technique):** the seed is pulled up fast to grow a thin neck about 3 mm across. Dislocations caused by the thermal shock of dipping run out of the sides, so the crystal below is dislocation-free.\n5. **Shoulder:** the pull rate and temperature are lowered so the crystal widens to the target diameter (up to 300 mm).\n6. **Body:** the crystal is grown at constant diameter, pulled at about **1 mm/min**, while seed and crucible **counter-rotate** (10–30 rpm) to stir the melt and keep temperature and doping even.\n7. **Tail:** the pull rate is raised so the diameter narrows to a cone before the crystal leaves the melt; a sudden break would send dislocations back up the crystal.\n8. **Cool:** the ingot is lifted clear and cooled slowly to avoid thermal stress.\n\n**4. After growth.** The ingot is checked for orientation, resistivity and defects, ground to an exact diameter, given a flat or notch to mark its orientation, sliced into wafers, lapped, etched and polished.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ principle: seed dipped into melt and slowly pulled; melt freezes onto seed and copies its orientation\n- ✓ melting point 1414 °C; melt held just above it\n- ✓ equipment: quartz crucible, graphite susceptor, heater, rotating pull rod, argon ambient\n- ✓ labelled sketch of the puller\n- ✓ Dash necking explained (removes dislocations)\n- ✓ shoulder, constant-diameter body, tail in order\n- ✓ counter-rotation of seed and crucible, and why (stirring, uniformity)\n- ✓ typical values: pull rate ≈ 1 mm/min, diameter up to 300 mm\n- ✓ diameter control by pull rate and temperature\n\n**Common mistakes.**\n\n- Describing only the steps and forgetting the **principle** (why the crystal copies the seed). The question asks for both.\n- Leaving out Dash necking, or saying it is \"to make the crystal thinner\". Its purpose is to **remove dislocations**.\n- Saying seed and crucible rotate the same way: they rotate in **opposite** directions.\n- Mixing up CZ with float-zone growth: CZ uses a crucible; FZ has none.\n\n**Remember it.** \"Dip, Neck, Shoulder, Body, Tail\": the crystal copies the seed it is pulled from.\n\n**Try a variant.** A 300 mm CZ ingot body 1.5 m long is pulled at 1.2 mm/min. How long does the body take to grow, and what is its mass (density of Si 2.33 g/cm³)? *Answer:* t = L/v = 150 cm ÷ 0.12 cm/min = 1250 min ≈ **20.8 h**. m = density × πr²L = 2.33 × π × 15² × 150 = 2.47×10⁵ g ≈ **247 kg**, so the crucible must be charged with well over 250 kg of silicon.\n\n---\n\n### Q11. State four advantages and two limitations of the Czochralski method.\n\n> **Question type:** State · **Topic:** Czochralski crystal growth · **Full notes:** Week 2 (Material Growth Techniques)\n\n**What the examiner wants.** \"State\" means a short, clear list: exactly four advantages and two limitations, each in one or two sentences with a reason or number. No long description of the process is needed.\n\n**Key terms.**\n\n- **Czochralski (CZ) method:** growing a single crystal by slowly pulling a rotating seed from molten silicon held in a quartz crucible.\n- **Float-zone (FZ) method:** the crucible-free alternative, in which a molten zone is moved along a polysilicon rod.\n- **Segregation coefficient (k₀):** the ratio of dopant concentration in the freezing solid to that in the liquid, k₀ = C_s/C_l; for most dopants k₀ < 1 (B 0.8, P 0.35).\n- **Resistivity (ρ):** how strongly the material opposes current (Ω·cm); set mainly by the doping.\n- **Intrinsic gettering:** trapping of metal impurities by oxygen precipitates deep in the wafer, away from the devices at the surface.\n- **Dislocation:** a line defect in the crystal that causes leakage.\n\n**Model answer.**\n\n**Advantages.**\n\n1. **Large diameters.** Ingots of 200 mm and 300 mm diameter are routine, so many chips fit on each wafer and the cost per chip is low.\n2. **Dislocation-free crystals of chosen orientation.** The ingot copies the seed, so (100) or (111) material is obtained at will, and Dash necking removes dislocations.\n3. **Controlled doping.** Dopant added to the melt sets the conductivity type and resistivity of the crystal.\n4. **High throughput and low cost.** The process is mature and automated, and fast enough that about 95 % of all silicon wafers are CZ-grown.\n\n(A fifth acceptable advantage: the **oxygen** picked up from the crucible strengthens the wafer against warping and slip and allows **intrinsic gettering**.)\n\n**Limitations.**\n\n1. **Contamination from the crucible.** The hot quartz crucible slowly dissolves, adding oxygen (≈ 10¹⁸ cm⁻³), and graphite parts add carbon. Oxygen forms thermal donors and precipitates and limits the resistivity to about 100 Ω·cm or less, so CZ silicon is unsuitable for high-voltage power devices and detectors (FZ is used instead).\n2. **Non-uniform doping along the ingot (segregation).** Because k₀ < 1, the crystal rejects dopant into the melt, which becomes steadily richer. The doping therefore rises from the seed end to the tail end:\n\n    C_s = k₀ C₀ (1 − f)^{k₀ − 1}\n\nWhere:\n\n- C_s = dopant concentration in the crystal at the point being grown (cm⁻³)\n- k₀ = segregation coefficient (dimensionless)\n- C₀ = dopant concentration in the starting melt (cm⁻³)\n- f = fraction of the melt already frozen (0 at the seed end)\n\nSo resistivity varies along the ingot; melt convection also causes radial variations (growth striations).\n\n(Also acceptable: the crucible is used up each run; high energy use; batch process.)\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ exactly four advantages listed, each with a reason\n- ✓ large diameter (200–300 mm) → low cost per chip\n- ✓ dislocation-free single crystal with the seed's orientation\n- ✓ controlled doping / resistivity\n- ✓ high throughput, mature, low cost (or oxygen strengthening and gettering)\n- ✓ limitation: oxygen (≈ 10¹⁸ cm⁻³) and carbon contamination from crucible; limits resistivity\n- ✓ limitation: axial doping non-uniformity from segregation, k₀ < 1\n\n**Common mistakes.**\n\n- Giving more or fewer items than asked, or mixing advantages and limitations in one list. Use two numbered lists.\n- Listing \"oxygen\" only as a limitation without noticing it is also an advantage (strength, gettering). Either is fine if you explain it; do not contradict yourself.\n- Vague points such as \"good quality\". Say what is good: dislocation-free, chosen orientation, large diameter.\n- Writing that doping *falls* along the ingot. For k₀ < 1 it **rises** towards the tail.\n\n**Remember it.** CZ is **Big, Perfect, Doped and Cheap**, but **Oxygen-laden and Uneven**.\n\n**Try a variant.** An arsenic-doped CZ ingot (k₀ = 0.3) is grown. By what factor is the arsenic concentration at the half-way point (f = 0.5) higher than at the seed end? *Answer:* C_s(f)/C_s(0) = (1 − f)^{k₀ − 1} = (0.5)^{−0.7} = **1.62**, so the doping is 62 % higher and the resistivity about 38 % lower half-way along: a clear example of limitation 2.\n\n---\n\n### Q12. Explain the principles of vapour-phase epitaxy (VPE), liquid-phase epitaxy (LPE), and molecular-beam epitaxy (MBE).\n\n> **Question type:** Explain · **Topic:** epitaxial growth · **Full notes:** Week 2 (Material Growth Techniques)\n\n**What the examiner wants.** First define epitaxy. Then, for each of the three methods, explain where the atoms come from and why they settle in the crystal, with an example reaction or material, the typical temperature and pressure, and how doping is done. A labelled sketch of each set-up earns marks.\n\n**Key terms.**\n\n- **Epitaxy:** growing a thin single-crystal layer on a single-crystal wafer so that the layer continues the wafer's crystal structure and orientation.\n- **Substrate:** the wafer on which the layer is grown.\n- **Homoepitaxy / heteroepitaxy:** growing the same material (Si on Si) / a different material (AlGaAs on GaAs).\n- **Supersaturated solution:** a liquid holding more dissolved material than it can keep at that temperature, so the excess comes out as solid.\n- **Ultra-high vacuum (UHV):** pressure of about 10⁻¹⁰ Torr, so low that atoms travel in straight lines without colliding.\n- **Effusion cell:** a small heated oven that evaporates one element to make an atomic beam (MBE).\n- **RHEED (reflection high-energy electron diffraction):** an electron beam bounced off the growing surface; its pattern shows the surface order and counts atomic layers.\n- **MOCVD:** metal-organic chemical vapour deposition, the version of VPE used for III–V compounds.\n\n**Model answer.**\n\n**Epitaxy.** Epitaxy (Greek *epi*, \"upon\", *taxis*, \"arrangement\") is the growth of a thin single-crystal layer on a single-crystal substrate so that the layer takes the substrate's crystal structure and orientation. It is used to make layers with different doping or a different material from the substrate, with sharp boundaries. The three methods differ in the **phase from which the atoms arrive**: gas, liquid or atomic beam.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 640 186\" role=\"img\" aria-label=\"Schematics of vapour-phase, liquid-phase and molecular-beam epitaxy\" style=\"width:640px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"100.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">VPE / CVD</text><rect x=\"30.0\" y=\"40.0\" width=\"140.0\" height=\"90.0\" rx=\"4\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.6\"/><rect x=\"55.0\" y=\"108.0\" width=\"90.0\" height=\"14.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.55\"/><rect x=\"65.0\" y=\"100.0\" width=\"70.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"8.0\" y1=\"60.0\" x2=\"160.0\" y2=\"60.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" opacity=\"1.0\" marker-end=\"url(#art)\"/><line x1=\"8.0\" y1=\"76.0\" x2=\"160.0\" y2=\"76.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" opacity=\"1.0\" marker-end=\"url(#art)\"/><text x=\"30.0\" y=\"55.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">SiCl₄ + H₂</text><line x1=\"170.0\" y1=\"90.0\" x2=\"190.0\" y2=\"90.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-end=\"url(#ar)\"/><text x=\"178.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">HCl</text><text x=\"100.0\" y=\"162.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">gas reacts on hot</text><text x=\"100.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">substrate, 1000–1250 °C</text><text x=\"315.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">LPE</text><rect x=\"245.0\" y=\"60.0\" width=\"140.0\" height=\"40.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\" opacity=\"1.0\"/><rect x=\"270.0\" y=\"62.0\" width=\"50.0\" height=\"26.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"330.0\" y=\"62.0\" width=\"40.0\" height=\"26.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.6\"/><rect x=\"275.0\" y=\"88.0\" width=\"40.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"385.0\" y1=\"92.0\" x2=\"415.0\" y2=\"92.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-end=\"url(#ar)\"/><text x=\"295.0\" y=\"54.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">Ga + As melt</text><text x=\"315.0\" y=\"120.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">slider moves substrate</text><text x=\"315.0\" y=\"162.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">cool slowly: GaAs</text><text x=\"315.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">precipitates, 700–900 °C</text><text x=\"535.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">MBE</text><rect x=\"460.0\" y=\"34.0\" width=\"150.0\" height=\"100.0\" rx=\"30\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.6\"/><rect x=\"505.0\" y=\"44.0\" width=\"60.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"510.0\" y=\"36.0\" width=\"50.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.55\"/><rect x=\"473.0\" y=\"112.0\" width=\"18.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"482.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">Ga</text><line x1=\"482.0\" y1=\"110.0\" x2=\"521.8\" y2=\"56.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.1\" opacity=\"1.0\" stroke-dasharray=\"3 3\"/><rect x=\"526.0\" y=\"112.0\" width=\"18.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"535.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">As</text><line x1=\"535.0\" y1=\"110.0\" x2=\"535.0\" y2=\"56.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.1\" opacity=\"1.0\" stroke-dasharray=\"3 3\"/><rect x=\"579.0\" y=\"112.0\" width=\"18.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"588.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">Si</text><line x1=\"588.0\" y1=\"110.0\" x2=\"548.2\" y2=\"56.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.1\" opacity=\"1.0\" stroke-dasharray=\"3 3\"/><line x1=\"470.0\" y1=\"100.0\" x2=\"494.0\" y2=\"100.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\"/><text x=\"535.0\" y=\"162.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">UHV ≈ 10⁻¹⁰ Torr, 500–650 °C</text><text x=\"535.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">atomic-layer control</text></svg><figcaption>The three epitaxy methods: reacting gases on a hot wafer (VPE), a cooling saturated melt on the wafer (LPE), and atomic beams in ultra-high vacuum (MBE).</figcaption></figure>\n```\n\n#### Vapour-phase epitaxy (VPE)\n\n**Principle: growth from a gas by chemical reaction at a hot surface.** A gas containing the semiconductor, carried by hydrogen, flows over a heated substrate in a reactor. At the hot surface the gas decomposes or is reduced, leaving semiconductor atoms behind. These atoms move over the surface until they reach lattice sites, so the layer continues the substrate crystal. For silicon:\n\n    SiCl₄ + 2H₂ → Si + 4HCl      (≈ 1150–1250 °C)\n    SiH₄ → Si + 2H₂              (≈ 600–1000 °C)\n\nWhere:\n\n- SiCl₄ = silicon tetrachloride; SiH₄ = silane (silicon sources)\n- H₂ = hydrogen (carrier and reducing gas); HCl = hydrogen chloride (by-product)\n\n**Doping:** a little dopant gas is added: diborane (B₂H₆) for p-type, phosphine (PH₃) or arsine (AsH₃) for n-type. **Rate control:** at high temperature the rate is limited by how fast gas reaches the surface (mass-transport limited); at lower temperature by the surface reaction (reaction-rate limited). Pressure is atmospheric or reduced. For III–V compounds the metal-organic form, MOCVD, is used, e.g. (CH₃)₃Ga + AsH₃ → GaAs + 3CH₄ at 600–750 °C.\n\n#### Liquid-phase epitaxy (LPE)\n\n**Principle: growth by precipitation from a cooling saturated solution.** The semiconductor is dissolved in a molten metal solvent until the solution is saturated, e.g. GaAs in liquid gallium at about 700–900 °C. The substrate is brought into contact with the solution and the whole is cooled slowly (≈ 0.1–1 °C/min). As the temperature falls the solution can hold less, becomes **supersaturated**, and the excess semiconductor crystallises onto the substrate, continuing its lattice. Growth takes place **close to thermodynamic equilibrium**, so the crystal is of high quality. A **sliding graphite boat** moves the substrate under a series of melts of different composition or doping to build up multilayers. Dopants are added to the melt.\n\n#### Molecular-beam epitaxy (MBE)\n\n**Principle: physical deposition from atomic beams in ultra-high vacuum.** In a chamber at about 10⁻¹⁰ Torr, each element (Ga, As, Al, dopants such as Si or Be) is heated in its own **effusion cell**. Evaporated atoms travel as collision-free **beams** in straight lines to a heated substrate (≈ 500–650 °C for GaAs). They adsorb, migrate on the surface and are incorporated into lattice sites. Each cell has a **shutter** that opens or closes in a fraction of a second, so composition and doping can be switched abruptly. Growth is slow, about **one atomic layer per second** (≈ 1 μm/h), and is watched in real time by **RHEED**, so thickness is controlled to a single atomic layer. Growth is **far from equilibrium** and controlled by the beam fluxes.\n\n**In one sentence each.** VPE: gas reacts on a hot wafer. LPE: a saturated melt is cooled so solid comes out onto the wafer. MBE: beams of atoms in vacuum stick to the wafer one layer at a time.\n\n*Sketch in the exam:* (a) VPE: horizontal tube, gas inlet (SiCl₄ + H₂), wafers on a heated susceptor, exhaust (HCl). (b) LPE: graphite boat with wells of melt, sliding slider carrying the substrate, furnace. (c) MBE: vacuum chamber, heated substrate facing several effusion cells with shutters, RHEED gun and screen.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ definition of epitaxy (layer continues substrate structure and orientation)\n- ✓ VPE: gas-phase source, reaction on hot surface; SiCl₄ + 2H₂ → Si + 4HCl at ≈ 1200 °C\n- ✓ VPE doping gases (B₂H₆, PH₃, AsH₃); mention of MOCVD for III–V\n- ✓ LPE: saturated solution in molten metal, cooled → supersaturation → precipitation on substrate\n- ✓ LPE example: GaAs in Ga, 700–900 °C, sliding graphite boat\n- ✓ MBE: UHV ≈ 10⁻¹⁰ Torr, effusion cells, collision-free beams, shutters\n- ✓ MBE: ≈ 1 monolayer/s, atomic-layer control, RHEED monitoring\n- ✓ labelled sketches (any of the three)\n\n**Common mistakes.**\n\n- Explaining MBE as a chemical reaction. MBE is **physical** deposition of elemental atoms; VPE is the chemical method.\n- Forgetting *why* LPE grows: cooling makes the solution supersaturated. \"The wafer is dipped in a melt\" alone does not explain the principle.\n- Not defining epitaxy, or confusing it with simply depositing any film. An epitaxial layer must be **single-crystal and aligned** with the substrate.\n- Quoting the MBE vacuum as \"low vacuum\". It is **ultra-high** vacuum, which is what keeps the beams collision-free.\n\n**Remember it.** **V**apour **R**eacts, **L**iquid **P**recipitates, **M**olecular **B**eams **B**uild layer by layer.\n\n**Try a variant.** Why must MBE be carried out in ultra-high vacuum? *Answer:* Two reasons. (1) The atoms must reach the wafer as beams without colliding with gas molecules: the mean free path of a gas molecule is roughly λ ≈ 5×10⁻³/P cm (P in Torr), so at 10⁻¹⁰ Torr λ ≈ 5×10⁷ cm (about 500 km), far longer than the ≈ 20 cm cell-to-wafer distance. (2) At one atomic layer per second the surface is easily contaminated, so the background gas must be extremely low to keep the layer pure. UHV also allows electron-beam monitoring (RHEED) during growth.\n\n---\n\n### Q13. Compare VPE, LPE, and MBE in terms of growth mechanism, temperature, precision, and applications.\n\n> **Question type:** Compare · **Topic:** epitaxial growth · **Full notes:** Week 2 (Material Growth Techniques)\n\n**What the examiner wants.** A point-by-point comparison under the four headings named (growth mechanism, temperature, precision, applications), with numbers where possible, ending with a comparison table and a one-line conclusion on when each method is chosen. Extra rows (growth rate, cost, purity) add strength but the four named headings must be there.\n\n**Key terms.**\n\n- **Epitaxy:** growth of a thin single-crystal layer that continues the crystal structure and orientation of the substrate below it.\n- **VPE (vapour-phase epitaxy):** epitaxy from gases that react on a hot wafer; MOCVD is its metal-organic form for III–V compounds.\n- **LPE (liquid-phase epitaxy):** epitaxy by precipitation from a saturated solution in molten metal as it cools.\n- **MBE (molecular-beam epitaxy):** epitaxy from beams of atoms in ultra-high vacuum.\n- **Monolayer:** one atomic layer of the crystal, about 0.28 nm thick for GaAs.\n- **Interface abruptness:** how sharply the composition or doping changes from one layer to the next.\n- **Autodoping / out-diffusion:** unwanted transfer of dopant from the substrate into the growing layer, by evaporation and re-deposition / by diffusion at high temperature.\n- **Quantum well / heterostructure:** a very thin layer (a few nm) of one semiconductor sandwiched between another; it needs atomically sharp interfaces.\n\n**Model answer.**\n\n**1. Growth mechanism.**\n\n- **VPE:** chemical. Gas-phase compounds (SiCl₄, SiH₄, or metal-organics in MOCVD) react or decompose at the hot substrate surface and leave atoms behind, e.g. SiCl₄ + 2H₂ → Si + 4HCl. Rate is limited by mass transport or surface reaction.\n- **LPE:** precipitation from a liquid. A saturated solution (GaAs in molten Ga) is cooled, becomes supersaturated, and deposits the semiconductor on the substrate. Growth is close to equilibrium.\n- **MBE:** physical. Atoms evaporated from effusion cells travel as beams in ultra-high vacuum (≈ 10⁻¹⁰ Torr), adsorb and migrate on the substrate. Growth is far from equilibrium, set by the beam fluxes.\n\n**2. Temperature.**\n\n- **VPE:** highest. Silicon 1000–1250 °C (SiCl₄ ≈ 1200 °C); silane can work lower; MOCVD 600–750 °C for GaAs.\n- **LPE:** intermediate, about 700–900 °C for GaAs.\n- **MBE:** lowest, about 500–650 °C for GaAs. Low temperature means little diffusion, which keeps interfaces sharp.\n\n**3. Precision (thickness control and interfaces).**\n\n- **VPE:** good, about tens of nm, with good uniformity over many wafers; interfaces moderately sharp, blurred by autodoping and out-diffusion at high temperature. Growth rate 0.1–5 μm/min.\n- **LPE:** poorest, about 0.1 μm; interfaces graded and surfaces rough, though crystal quality and purity are very high. Growth rate 0.1–1 μm/min.\n- **MBE:** best, a single atomic layer (≈ 0.28 nm for GaAs); atomically abrupt interfaces controlled by shutters and monitored by RHEED. Growth rate slow, ≈ 1 μm/h (≈ 1 monolayer/s).\n\n**4. Applications.**\n\n- **VPE:** silicon epitaxial layers for bipolar transistors, CMOS and power devices; in MOCVD form, mass production of LEDs, lasers, solar cells and HEMTs (GaAs, InP, GaN).\n- **LPE:** LEDs, early heterostructure lasers, photodetectors, thick high-quality III–V layers.\n- **MBE:** quantum wells, superlattices, high-electron-mobility transistors (HEMTs), heterojunction bipolar transistors (HBTs), quantum-cascade and VCSEL lasers, and research.\n\n**Comparison table.**\n\n| Feature | VPE | LPE | MBE |\n|---|---|---|---|\n| Source phase | Gas (SiCl₄, SiH₄, metal-organics) | Liquid solution in molten metal | Atomic/molecular beams from solid sources |\n| Growth mechanism | Chemical reaction at hot surface | Precipitation from supersaturated solution on cooling; near equilibrium | Physical deposition, adsorption and surface migration; far from equilibrium |\n| Pressure | Atmospheric or reduced | Atmospheric (H₂ or inert) | Ultra-high vacuum ≈ 10⁻¹⁰ Torr |\n| Temperature | Highest: Si 1000–1250 °C (MOCVD 600–750 °C) | Medium: 700–900 °C | Lowest: 500–650 °C |\n| Growth rate | 0.1–5 μm/min | 0.1–1 μm/min | ≈ 1 μm/h (≈ 1 monolayer/s) |\n| Thickness precision | Good, tens of nm | Poor, ≈ 0.1 μm | Excellent, one atomic layer |\n| Interfaces | Moderately sharp | Graded | Atomically abrupt |\n| In-situ monitoring | Limited | None | RHEED |\n| Throughput and cost | High throughput, moderate cost | Low throughput, low cost | Low throughput, very high cost |\n| Applications | Si epi for BJTs, CMOS, power; MOCVD LEDs, lasers, solar cells | LEDs, early lasers, thick layers, photodetectors | Quantum wells, HEMTs, HBTs, advanced lasers, research |\n\n**Conclusion.** VPE is the industrial workhorse for volume production; LPE is simple and cheap and gives high-quality thick layers but poor control; MBE gives atomic-scale control for advanced heterostructure devices at high cost and low throughput.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ mechanism for each: chemical reaction (VPE), precipitation on cooling (LPE), physical beam deposition in UHV (MBE)\n- ✓ temperature ranking with values: VPE highest (Si ≈ 1000–1250 °C), LPE 700–900 °C, MBE lowest 500–650 °C\n- ✓ precision ranking: MBE (one atomic layer) > VPE (tens of nm) > LPE (≈ 0.1 μm)\n- ✓ interface abruptness linked to temperature / shutters\n- ✓ growth rates with units\n- ✓ at least two applications per method\n- ✓ comparison table covering the four named headings\n- ✓ conclusion on when each method is chosen\n\n**Common mistakes.**\n\n- Writing three separate descriptions with no comparison. Compare *under each heading*, then give the table.\n- Ranking temperatures wrongly. MBE is the **lowest**, not the highest, despite its sophisticated equipment.\n- Confusing growth rate units: VPE and LPE are in μm per **minute**, MBE in μm per **hour**, a factor of about 60–300 slower.\n- Calling LPE \"imprecise and low quality\". Its thickness control is poor, but its **crystal quality is very high** (near-equilibrium growth).\n\n**Remember it.** Hotter, faster, coarser → VPE; cooler, slower, finer → MBE; LPE sits in the middle on temperature but last on precision.\n\n**Try a variant.** A 10 nm GaAs quantum well is to be grown. Which method would you choose, and how long does the well take at 1 monolayer per second (monolayer thickness a/2, a = 5.653 Å)? *Answer:* **MBE**, because only it gives single-atomic-layer control and abrupt interfaces at this thickness. Monolayer = 5.653/2 = 2.83 Å = 0.283 nm, so 10 nm needs 10/0.283 ≈ 35 monolayers, taking **≈ 35 s** (the growth rate is 0.283 nm/s ≈ 1.0 μm/h). LPE (± 0.1 μm = 100 nm) could not even define the layer.\n", "group": "The 50 questions, answered", "eyebrow": "The 50 questions, answered", "disp": "·"}, {"num": "02", "title": "Questions 14–21 — Impurity Control and Doping", "body": "\nModule 1, part 2: why and how semiconductors are doped: donors and acceptors, diffusion and Fick's laws, the diffusion profile, and ion implantation. Each question stands on its own: its key terms are defined with it, so you can start anywhere.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_D | Donor energy level, just below E_c | eV; E_c − E_D ≈ 0.045 eV for P in Si |\n| E_A | Acceptor energy level, just above E_v | eV; E_A − E_v ≈ 0.045 eV for B in Si |\n| E_a | Activation energy of dopant diffusion | eV; about 3–4 eV |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| N_D⁺, N_A⁻ | Concentrations of ionised donors and acceptors | cm⁻³ |\n| C_s | Surface concentration of a diffusion (or solid concentration when freezing) | cm⁻³ |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| D | Diffusion coefficient (dopants in a furnace, or carriers) | cm²/s |\n| D₀ | Diffusion constant in D = D₀e^{−E_a/kT} | cm²/s |\n| F | Particle flux in Fick's law | particles/(cm²·s) |\n| Q | Dose: dopant atoms per unit area (in Weeks 13–14, Q also means charge) | atoms/cm² (C or C/cm² for charge) |\n| erfc | Complementary error function, erfc(u) = 1 − erf(u); read from a table | dimensionless |\n| x_j | Junction depth: where the dopant concentration equals the background | μm |\n| N_B (C_B) | Background doping of the wafer (in Week 13, N_B is the base doping) | cm⁻³ |\n| R_p | Projected range: average depth at which implanted ions stop | μm |\n| ΔR_p | Straggle: spread of the implanted ions' stopping depths | μm |\n| N_p | Peak concentration of an implanted profile | cm⁻³ |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| I | Current | A |\n| A (area) | Device or contact area | cm² |\n| G_n, G_p, R_n, R_p | Generation and recombination rates of electrons and holes | cm⁻³s⁻¹ |\n| erfc(u), erfc⁻¹ | Complementary error function, 1 − erf(u), and its inverse (read from a table) | dimensionless |\n| t | Time (or a thickness, where the text says so) | s (or cm) |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| GaAs | Gallium arsenide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| RTA | Rapid thermal annealing |\n| LDD | Lightly doped drain |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| CMOS | Complementary MOS (n- and p-channel MOSFETs together) |\n| BJT | Bipolar junction transistor |\n| VLSI | Very-large-scale integration |\n| LED | Light-emitting diode |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n## Questions on this page\n\n| Q | Question |\n|---|---|\n| 14 | What is semiconductor doping? Explain why doping is necessary in semiconductor device fabrication. |\n| 15 | Differentiate between n-type and p-type semiconductors. |\n| 16 | Explain the difference between donor impurities and acceptor impurities, giving suitable examples. |\n| 17 | Describe the mechanism of dopant diffusion in a semiconductor. |\n| 18 | State and explain Fick's first and second laws of diffusion. |\n| 19 | A semiconductor is doped by diffusion with a constant surface concentration of 1 × 10²⁰ cm⁻³. Explain how the impurity concentration varies with depth. |\n| 20 | Explain the principle of ion implantation and identify its major advantages over thermal diffusion. |\n| 21 | Compare diffusion and ion implantation as semiconductor doping techniques. |\n\n## Model answers\n\n### Q14. What is semiconductor doping? Explain why doping is necessary in semiconductor device fabrication.\n\n> **Question type:** Definition and explanation · **Topic:** doping · **Full notes:** Week 3 (Impurity Control and Doping)\n\n**What the examiner wants.** A precise definition of doping (deliberate, controlled, small amounts of chosen impurities) with the two dopant groups and their effect, then a set of distinct reasons why devices cannot be made without it. A number showing how much doping changes the conductivity earns extra credit.\n\n**Key terms.**\n\n- **Intrinsic semiconductor:** a pure semiconductor whose free electrons and holes come only from breaking bonds by heat, so n = p = n_i.\n- **Intrinsic carrier concentration (n_i):** the number of free electrons (and holes) per cm³ in pure material; 1×10¹⁰ cm⁻³ for Si at 300 K.\n- **Dopant:** an impurity atom added on purpose to change the electrical behaviour of the semiconductor.\n- **Donor:** a Group V atom (P, As, Sb) that gives a free electron to silicon, making it n-type.\n- **Acceptor:** a Group III atom (B, Al, Ga, In) that takes an electron from a bond, creating a hole and making silicon p-type.\n- **Extrinsic semiconductor:** a doped semiconductor whose carrier density is set by the dopants, not by n_i.\n- **Resistivity (ρ):** how strongly a material opposes current, in Ω·cm; ρ = 1/σ, where σ is conductivity.\n\n**Model answer.**\n\n#### Definition\n\n**Doping** is the deliberate introduction of small, carefully controlled quantities of selected impurity atoms (dopants) into a pure (intrinsic) semiconductor in order to change its conductivity and to decide whether current is carried mainly by electrons or by holes. Typical doping levels in silicon are 10¹⁴ to 10²⁰ atoms/cm³, i.e. roughly one dopant atom per 5×10⁸ down to one per 500 silicon atoms (Si has 5×10²² atoms/cm³).\n\n- **Group V donors** (phosphorus, arsenic, antimony) have five valence electrons; the fifth is loosely bound (≈ 0.045 eV) and becomes a free electron, so the silicon becomes **n-type**.\n- **Group III acceptors** (boron, aluminium, gallium, indium) have three valence electrons; the missing bond electron is supplied by a neighbour, leaving a mobile **hole**, so the silicon becomes **p-type**.\n\nDoping is done by **thermal diffusion** or **ion implantation**, using oxide or photoresist masks so that only chosen areas are doped.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 500 215\" role=\"img\" aria-label=\"Phosphorus in silicon has a fifth, loosely bound electron; boron in silicon leaves one bond short of an electron, a hole\" style=\"width:500px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"65.0\" y1=\"42.5\" x2=\"95.0\" y2=\"42.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.45\"/><line x1=\"65.0\" y1=\"49.5\" x2=\"95.0\" y2=\"49.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.45\"/><circle cx=\"73.0\" cy=\"46.0\" r=\"3\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"87.0\" cy=\"46.0\" r=\"3\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><line x1=\"46.5\" y1=\"61.0\" x2=\"46.5\" y2=\"91.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.45\"/><line x1=\"53.5\" y1=\"61.0\" x2=\"53. 6.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"330.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"390.0\" cy=\"46.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"390.0\" y=\"50.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"390.0\" cy=\"106.0\" r=\"14\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"390.0\" y=\"110.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">B</text><circle cx=\"390.0\" cy=\"166.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"390.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"450.0\" cy=\"46.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"450.0\" y=\"50.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"450.0\" cy=\"106.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"450.0\" y=\"110.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"450.0\" cy=\"166.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"450.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><text x=\"420.0\" y=\"128.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">hole</text><text x=\"390.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">p-type: boron acceptor</text></svg><figcaption>A phosphorus atom in the silicon lattice donates its fifth electron (n-type); a boron atom leaves one bond incomplete, creating a hole (p-type).</figcaption></figure>\n```\n\n#### Why doping is necessary\n\n1. **Pure silicon conducts far too little.** With n = p = n_i = 1×10¹⁰ cm⁻³, the intrinsic resistivity is about 3.4×10⁵ Ω·cm (worked below). Adding just 10¹⁶ cm⁻³ phosphorus (one atom in 5 million) lowers it to about 0.46 Ω·cm, roughly 700 000 times lower.\n2. **It sets the carrier type.** Every device needs regions where electrons dominate (n) and regions where holes dominate (p). Without them there is no p-n junction, so no diode, bipolar transistor (BJT), MOSFET, solar cell or LED.\n3. **It makes the conductivity stable with temperature.** In pure silicon n_i rises exponentially with temperature, so the current would drift wildly. In doped silicon the carrier density is fixed by N_D or N_A over a wide range (the extrinsic range, about −50 to +150 °C), so circuits behave predictably.\n4. **It sets device parameters.** The doping levels fix the built-in voltage and depletion width of a junction, the breakdown voltage, the MOSFET threshold voltage, the BJT current gain, the value of diffused resistors and the quality of Ohmic contacts (heavily doped n⁺ and p⁺ regions).\n5. **It allows local, selective control.** Through mask windows, different regions of one chip receive different doping. This is what makes integrated circuits possible.\n\n**Supporting calculation.**\n\n    ρ = 1 / [ q (n μ_n + p μ_p) ]\n\nWhere:\n\n- ρ = resistivity (Ω·cm)\n- q = electronic charge, 1.6×10⁻¹⁹ C\n- n, p = electron and hole concentrations (cm⁻³)\n- μ_n, μ_p = electron and hole mobilities, 1350 and 480 cm²/V·s in Si\n\nIntrinsic: ρ = 1/(1.6×10⁻¹⁹ × 10¹⁰ × (1350 + 480)) = **3.4×10⁵ Ω·cm**.\nDoped with N_D = 10¹⁶ cm⁻³ (n ≈ N_D, holes negligible): ρ = 1/(1.6×10⁻¹⁹ × 10¹⁶ × 1350) = **0.46 Ω·cm**.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ definition: deliberate, controlled addition of small amounts of impurity to an intrinsic semiconductor\n- ✓ Group V donors (P, As, Sb) give n-type; Group III acceptors (B, Ga, Al, In) give p-type\n- ✓ typical concentration range 10¹⁴–10²⁰ cm⁻³\n- ✓ reason: intrinsic conductivity too low (n_i = 10¹⁰ cm⁻³), with a number\n- ✓ reason: creates n and p regions, hence p-n junctions and all devices\n- ✓ reason: temperature-stable carrier density (extrinsic region)\n- ✓ reason: sets device parameters (V_bi, breakdown, threshold voltage, contacts)\n- ✓ reason: selective doping through masks makes integrated circuits possible\n\n**Common mistakes.**\n\n- Saying doping \"adds charge\" to the crystal. A doped crystal stays electrically neutral: each free carrier is balanced by a fixed ionised dopant.\n- Giving only one reason (\"to increase conductivity\"). The question says *why necessary*: give at least four distinct reasons.\n- Mixing up the groups: boron (Group III) is an acceptor, phosphorus (Group V) a donor.\n\n**Remember it.** Doping turns silicon from a near-insulator into a material whose type, conductivity and junctions the designer chooses.\n\n**Try a variant.** Calculate the resistivity of silicon doped with 1×10¹⁷ cm⁻³ boron (take μ_p = 480 cm²/V·s) and compare it with intrinsic silicon. *Answer:* p ≈ N_A = 10¹⁷ cm⁻³, ρ = 1/(qN_Aμ_p) = 1/(1.6×10⁻¹⁹ × 10¹⁷ × 480) = **0.13 Ω·cm**, about 2.6 million times lower than 3.4×10⁵ Ω·cm. (At this doping the real mobility is somewhat lower, so the true ρ is a little higher.)\n\n---\n\n### Q15. Differentiate between n-type and p-type semiconductors.\n\n> **Question type:** Compare / distinguish · **Topic:** n-type and p-type semiconductors · **Full notes:** Week 3 (Impurity Control and Doping)\n\n**What the examiner wants.** A point-by-point contrast: how each type is made, what the dopant does, which carriers are majority and minority, the fixed ion left behind, the energy level and Fermi-level position, and the carrier-density formulas. End with a comparison table; a band sketch for each type earns marks.\n\n**Key terms.**\n\n- **n-type semiconductor:** a semiconductor doped mainly with donors, so free electrons outnumber holes.\n- **p-type semiconductor:** a semiconductor doped mainly with acceptors, so holes outnumber free electrons.\n- **Majority carrier:** the carrier present in larger number (electrons in n-type, holes in p-type).\n- **Minority carrier:** the carrier present in smaller number (holes in n-type, electrons in p-type).\n- **Hole:** an empty place in a covalent bond (a missing valence electron) that moves through the crystal like a positive charge +q.\n- **Fermi level (E_F):** the energy at which a state has a 50 % chance of being occupied; its position shows whether electrons or holes dominate.\n- **Mass-action law:** in equilibrium np = n_i², so raising one carrier lowers the other.\n\n**Model answer.**\n\n#### 1. n-type semiconductor\n\nAn **n-type** semiconductor is made by adding a **pentavalent** (Group V) impurity, such as phosphorus, arsenic or antimony, to silicon. Four of the five valence electrons bond with neighbouring Si atoms; the fifth is bound by only ≈ 0.045 eV and is freed at room temperature. The impurity is a **donor** and is left as an immobile positive ion N_D⁺. Electrons are the **majority carriers** and holes the **minority carriers**:\n\n    n ≈ N_D,     p = n_i² / N_D\n\nWhere:\n\n- n, p = electron and hole concentrations (cm⁻³)\n- N_D = donor concentration (cm⁻³)\n- n_i = intrinsic carrier concentration, 1×10¹⁰ cm⁻³ for Si at 300 K\n\nThe donor level E_D lies just below the conduction-band edge E_c, and the Fermi level moves **up** from mid-gap towards E_c.\n\n#### 2. p-type semiconductor\n\nA **p-type** semiconductor is made by adding a **trivalent** (Group III) impurity, such as boron, aluminium, gallium or indium. The impurity completes only three bonds; an electron from a neighbouring bond fills the gap (needing ≈ 0.045 eV for B), leaving a mobile **hole** in the valence band. The impurity is an **acceptor** and becomes an immobile negative ion N_A⁻. Holes are the majority carriers and electrons the minority carriers:\n\n    p ≈ N_A,     n = n_i² / N_A\n\nWhere:\n\n- N_A = acceptor concentration (cm⁻³); other symbols as above\n\nThe acceptor level E_A lies just above the valence-band edge E_v, and the Fermi level moves **down** towards E_v.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 210\" role=\"img\" aria-label=\"Band diagrams showing the Fermi level at mid-gap for intrinsic material, near the conduction band for n-type and near the valence band for p-type\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"110.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">intrinsic</text><line x1=\"40.0\" y1=\"50.0\" x2=\"180.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"40.0\" y1=\"170.0\" x2=\"180.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"40.0\" y1=\"110.0\" x2=\"180.0\" y2=\"110.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><line x1=\"40.0\" y1=\"110.0\" x2=\"180.0\" y2=\"110.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-dasharray=\"6 3\"/><text x=\"186.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"186.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"186.0\" y=\"114.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> = E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"310.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">n-type</text><line x1=\"240.0\" y1=\"50.0\" x2=\"380.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"240.0\" y1=\"170.0\" x2=\"380.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"240.0\" y1=\"110.0\" x2=\"380.0\" y2=\"110.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><line x1=\"240.0\" y1=\"64.4\" x2=\"380.0\" y2=\"64.4\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-dasharray=\"6 3\"/><text x=\"386.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"386.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"386.0\" y=\"122.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.75\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"235.0\" y=\"68.4\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"510.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">p-type</text><line x1=\"440.0\" y1=\"50.0\" x2=\"580.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"440.0\" y1=\"170.0\" x2=\"580.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"440.0\" y1=\"110.0\" x2=\"580.0\" y2=\"110.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><line x1=\"440.0\" y1=\"155.6\" x2=\"580.0\" y2=\"155.6\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-dasharray=\"6 3\"/><text x=\"586.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"586.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"586.0\" y=\"106.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.75\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"435.0\" y=\"159.6\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"325.0\" y=\"200.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> = kT ln(N<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan>/n<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan>)  for n-type;   E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> = kT ln(N<tspan dy=\"0.32em\" font-size=\"72%\">A</tspan><tspan dy=\"-0.32em\">​</tspan>/n<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan>)  for p-type</text></svg><figcaption>The Fermi level sits at mid-gap (E<sub>i</sub>) in intrinsic silicon, near the conduction band in n-type and near the valence band in p-type.</figcaption></figure>\n```\n\n**Sketch in the exam:** two band diagrams side by side. For n-type, draw E_c and E_v, a dashed donor level E_D just below E_c with \"+\" ions, and E_F above mid-gap. For p-type, draw a dashed acceptor level E_A just above E_v with \"−\" ions, and E_F below mid-gap.\n\n#### 3. Worked illustration\n\nFor Si with N_D = 10¹⁶ cm⁻³: n = 10¹⁶ cm⁻³ and p = (10¹⁰)²/10¹⁶ = **10⁴ cm⁻³**, so electrons outnumber holes by 10¹². For p-type with N_A = 10¹⁶ cm⁻³ the numbers are simply swapped.\n\nBoth types are **electrically neutral** overall: every free electron is balanced by a fixed N_D⁺ ion, every hole by a fixed N_A⁻ ion.\n\n#### 4. Comparison table\n\n| Feature | n-type | p-type |\n|---|---|---|\n| Impurity added | Pentavalent, Group V: P, As, Sb | Trivalent, Group III: B, Al, Ga, In |\n| Name of impurity | Donor | Acceptor |\n| What the impurity does | Gives a free electron to the conduction band | Takes an electron from a bond, creating a hole |\n| Fixed ion left behind | Positive, N_D⁺ | Negative, N_A⁻ |\n| Majority carriers | Electrons | Holes |\n| Minority carriers | Holes | Electrons |\n| Carrier densities | n ≈ N_D, p = n_i²/N_D | p ≈ N_A, n = n_i²/N_A |\n| Impurity energy level | E_D just below E_c | E_A just above E_v |\n| Fermi level | Above mid-gap, towards E_c | Below mid-gap, towards E_v |\n| Conductivity | σ ≈ qN_Dμ_n | σ ≈ qN_Aμ_p |\n| Hall coefficient sign | Negative | Positive |\n\nBecause μ_n (1350) is larger than μ_p (480 cm²/V·s), n-type silicon conducts about 2.8 times better than p-type silicon at the same doping.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ dopant group and examples for each type (P, As, Sb; B, Al, Ga, In)\n- ✓ donor gives an electron / acceptor creates a hole, with the mechanism\n- ✓ majority and minority carriers correctly named for each type\n- ✓ sign of the fixed ion (N_D⁺, N_A⁻) and overall neutrality\n- ✓ n ≈ N_D, p = n_i²/N_D and the p-type equivalents\n- ✓ positions of E_D, E_A and E_F (band sketch)\n- ✓ comparison table\n\n**Common mistakes.**\n\n- Saying a p-type semiconductor is positively charged. It is neutral; \"p\" refers to the sign of the majority carrier, not of the material.\n- Writing that n-type has \"no holes\". It has a few (minority) holes, p = n_i²/N_D.\n- Placing the donor level near the valence band. Donors sit near E_c, acceptors near E_v.\n\n**Remember it.** \"N for Negative carriers (electrons), P for Positive carriers (holes); the crystal itself stays neutral.\"\n\n**Try a variant.** A silicon sample is doped with 5×10¹⁵ cm⁻³ boron. State its type and find the majority and minority carrier concentrations at 300 K. *Answer:* p-type; p ≈ N_A = **5×10¹⁵ cm⁻³** (holes, majority), n = n_i²/N_A = 10²⁰/(5×10¹⁵) = **2×10⁴ cm⁻³** (electrons, minority).\n\n---\n\n### Q16. Explain the difference between donor impurities and acceptor impurities, giving suitable examples.\n\n> **Question type:** Explain / distinguish · **Topic:** donors and acceptors · **Full notes:** Week 3 (Impurity Control and Doping)\n\n**What the examiner wants.** For each kind of impurity: its valence compared with the host, what happens to the extra or missing electron, the charge of the ion left behind, where its energy level sits in the band gap, and examples (named elements, in Si and ideally in GaAs). A band diagram and a summary table complete the answer.\n\n**Key terms.**\n\n- **Impurity (dopant):** a foreign atom sitting on a lattice site of the semiconductor in place of a host atom (a substitutional impurity).\n- **Valence electrons:** the outer electrons an atom uses for bonding; Si has four.\n- **Donor:** an impurity with one more valence electron than the host atom it replaces; it donates an electron.\n- **Acceptor:** an impurity with one fewer valence electron than the host atom; it accepts an electron and creates a hole.\n- **Ionisation energy:** the small energy needed to free the donor's electron (E_c − E_D) or to fill the acceptor's empty bond (E_A − E_v); about 0.04–0.05 eV in Si.\n- **Conduction band (E_c) and valence band (E_v):** the band of free-electron states and the band of bonding-electron states; E_c and E_v are their edges.\n- **Ionised impurity:** a dopant that has given up or taken an electron and so carries a fixed charge (N_D⁺ or N_A⁻).\n\n**Model answer.**\n\n#### Donor impurities\n\nA **donor** has **one more** valence electron than the atom it replaces. In silicon (Group IV), the donors are Group V elements: **phosphorus (P), arsenic (As) and antimony (Sb)**.\n\n- Four of the donor's five electrons form covalent bonds with the four neighbouring Si atoms.\n- The fifth electron is held only by the weak attraction of the extra nuclear charge, about **0.045 eV** for P (about 0.04–0.05 eV for As and Sb). Thermal energy at room temperature (kT = 0.0259 eV) frees almost all of them.\n- The freed electron enters the conduction band; the donor becomes a **fixed positive ion** (N_D⁺).\n- In the band diagram the donor gives a localised level **E_D just below E_c**.\n- Donors make the material **n-type**.\n\n#### Acceptor impurities\n\nAn **acceptor** has **one fewer** valence electron than the atom it replaces. In silicon the acceptors are Group III elements: **boron (B), aluminium (Al), gallium (Ga) and indium (In)**.\n\n- Only three bonds can be completed; one bond is missing an electron.\n- An electron from a neighbouring Si–Si bond moves in with very little energy (about **0.045 eV** for B). The acceptor becomes a **fixed negative ion** (N_A⁻) and the empty bond left behind is a mobile **hole** in the valence band.\n- In the band diagram the acceptor gives a level **E_A just above E_v**.\n- Acceptors make the material **p-type**.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 206\" role=\"img\" aria-label=\"Donor levels just below the conduction band release electrons; acceptor levels just above the valence band create holes\" style=\"width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"140.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">n-type: donors</text><rect x=\"40.0\" y=\"34.0\" width
