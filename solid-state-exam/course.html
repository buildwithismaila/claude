x2=\"380.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"240.0\" y1=\"110.0\" x2=\"380.0\" y2=\"110.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><line x1=\"240.0\" y1=\"64.4\" x2=\"380.0\" y2=\"64.4\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-dasharray=\"6 3\"/><text x=\"386.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"386.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"386.0\" y=\"122.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.75\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"235.0\" y=\"68.4\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"510.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">p-type</text><line x1=\"440.0\" y1=\"50.0\" x2=\"580.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"440.0\" y1=\"170.0\" x2=\"580.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"440.0\" y1=\"110.0\" x2=\"580.0\" y2=\"110.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><line x1=\"440.0\" y1=\"155.6\" x2=\"580.0\" y2=\"155.6\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-dasharray=\"6 3\"/><text x=\"586.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"586.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"586.0\" y=\"106.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.75\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"435.0\" y=\"159.6\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"325.0\" y=\"200.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> = kT ln(N<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan>/n<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan>)  for n-type;   E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> = kT ln(N<tspan dy=\"0.32em\" font-size=\"72%\">A</tspan><tspan dy=\"-0.32em\">​</tspan>/n<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan>)  for p-type</text></svg><figcaption>In n-type silicon the Fermi level lies above the intrinsic level, between E<sub>i</sub> and E<sub>c</sub>; for N<sub>D</sub> = 5×10¹⁶ cm⁻³ it is 0.40 eV above E<sub>i</sub> and 0.16 eV below E<sub>c</sub>.</figcaption></figure>\n```\n\nSketch: a band diagram with E_c and E_v, a dashed E_i near mid-gap, and E_F drawn 0.40 eV above E_i (0.16 eV below E_c), labelled with these values.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ majority carriers identified as electrons\n- ✓ n₀ ≈ N_D justified by complete ionisation and N_D ≫ n_i\n- ✓ answer 5×10¹⁶ cm⁻³ with the unit\n- ✓ (follow-up) p₀ = n_i²/n₀ = 2×10³ cm⁻³\n- ✓ (follow-up) E_F − E_i = kT ln(n₀/n_i) = 0.40 eV, Fermi level above E_i, towards E_c\n- ✓ (follow-up) E_c − E_F = kT ln(N_c/n₀) = 0.16 eV\n- ✓ assumption stated: silicon at 300 K, n_i = 10¹⁰ cm⁻³\n\n**Common mistakes.**\n\n- Adding n_i to N_D (\"5×10¹⁶ + 10¹⁰\") as if it mattered, or, worse, giving n_i as the answer. n_i is negligible here; n₀ ≈ N_D.\n- Calculating p₀ = n_i/N_D or N_D/n_i instead of n_i²/N_D; check the units: (cm⁻³)²/cm⁻³ = cm⁻³.\n- Using log₁₀ instead of the natural log in E_F − E_i = kT ln(n₀/n_i): log₁₀(5×10⁶) = 6.70 would give 0.17 eV, which is wrong.\n- Placing E_F below E_i for n-type material; donors raise E_F.\n\n**Remember it.** \"Majority = dopant, minority = n_i² over dopant, and E_F climbs kT ln(N_D/n_i) above mid-gap.\"\n\n**Try a variant.** p-type silicon at 300 K has N_A = 2×10¹⁵ cm⁻³ (complete ionisation). Find the majority and minority concentrations and the Fermi-level position. *Answer:* p₀ ≈ N_A = **2×10¹⁵ cm⁻³** (holes); n₀ = n_i²/p₀ = 10²⁰/2×10¹⁵ = **5×10⁴ cm⁻³** (electrons); E_i − E_F = 0.0259 ln(2×10⁵) = **0.316 eV below E_i**, i.e. E_F − E_v = 0.0259 ln(1.04×10¹⁹/2×10¹⁵) = **0.222 eV above E_v**.\n", "group": "The 50 questions, answered", "eyebrow": "The 50 questions, answered", "disp": "·"}, {"num": "04", "title": "Questions 35–46 — Carrier Transport and Injection", "body": "\nModule 3: how carriers move (drift, mobility, scattering, diffusion, the Einstein relation, high fields) and how excess carriers are generated, recombine and flow (SRH, lifetime, continuity, surfaces). Each question stands on its own: its key terms are defined with it, so you can start anywhere.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| m₀ | Free-electron mass | 9.11×10⁻³¹ kg |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_t | Energy level of a trap (recombination centre) in the gap | eV |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| n₀, p₀ | Equilibrium electron and hole concentrations | cm⁻³ |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| m∗, m_n∗, m_p∗ | Effective mass of electrons or holes | kg, or as a multiple of m₀ |\n| ν, hν | Frequency of light, and photon energy | Hz; eV |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| D | Diffusion coefficient (dopants in a furnace, or carriers) | cm²/s |\n| F | Particle flux in Fick's law | particles/(cm²·s) |\n| Q | Dose: dopant atoms per unit area (in Weeks 13–14, Q also means charge) | atoms/cm² (C or C/cm² for charge) |\n| R_p | Projected range: average depth at which implanted ions stop | μm |\n| E (field) | Electric field (on band diagrams, E is energy instead) | V/cm |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| μ_L, μ_I | Mobility limited by lattice scattering, by ionised-impurity scattering | cm²/(V·s) |\n| v_d | Drift velocity | cm/s |\n| v_th | Thermal velocity of carriers | ≈ 10⁷ cm/s at 300 K |\n| v_sat | Saturation velocity at high field | ≈ 10⁷ cm/s in Si |\n| τ_m | Mean free time between collisions | s; about 0.1–1 ps |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| T_e | Electron temperature of hot carriers | K |\n| G, G_L | Generation rate of electron–hole pairs (G_L: by light) | cm⁻³s⁻¹ |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| U | Net recombination rate, R − G | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| N_t | Density of traps (recombination centres) | cm⁻³ |\n| σ_n, σ_p | Capture cross-section of a trap for electrons, holes | cm² |\n| n₁, p₁ | SRH parameters n_ie^{(E_t − E_i)/kT} and n_ie^{(E_i − E_t)/kT} | cm⁻³ |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| S | Surface recombination velocity | cm/s |\n| N_st | Density of surface traps | cm⁻² |\n| U_s | Recombination rate per unit area at a surface | cm⁻²s⁻¹ |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| A (area) | Device or contact area | cm² |\n| α | Common-base current gain, I_C/I_E | dimensionless; 0.98–0.999 |\n| β | Common-emitter current gain, I_C/I_B (also h_FE) | dimensionless; 50–500 |\n| N_E, W_E, D_E; N_B, W_B, D_B | Doping, width and minority diffusion coefficient of the emitter; of the base | cm⁻³; μm; cm²/s |\n| f_T | Transition (cut-off) frequency | Hz |\n| V_T (V_th) | Threshold voltage of a MOSFET | V |\n| V_GS, V_DS, V_SB, V_G | Gate–source, drain–source, source–body and gate voltages | V |\n| σ_i, ρ_i | Conductivity and resistivity of intrinsic (undoped) material; σ_doped after doping | S/cm; Ω·cm |\n| F_n, F_p | Particle flux of electrons and holes (carriers crossing 1 cm² per second) | cm⁻²s⁻¹ |\n| B_z, I_x, V_H | Hall effect: magnetic field (z), current (x) and Hall voltage | T (tesla); A; V |\n| v_dn, v_dp | Drift velocity of electrons and holes | cm/s |\n| μ_i, τ_i (μ_L, μ_I, N_I) | Mobility and scattering time for one scattering mechanism (L: lattice, I: ionised impurity); N_I = ionised-impurity density | cm²/(V·s); s; cm⁻³ |\n| J_drift, J_diff | Drift and diffusion parts of the current density | A/cm² |\n| G_th, R_th | Thermal generation and recombination rates (equal in equilibrium) | cm⁻³s⁻¹ |\n| G_n, G_p, R_n, R_p | Generation and recombination rates of electrons and holes | cm⁻³s⁻¹ |\n| f_t, e_n, e_p | Probability a trap is occupied by an electron; emission rates of electrons and holes from traps | dimensionless; s⁻¹ |\n| r_a, r_b, r_c, r_d | SRH rates: electron capture, electron emission, hole capture, hole emission | cm⁻³s⁻¹ |\n| τ_b (τ_bulk), τ_surface | Lifetime from bulk recombination only; from surface recombination only | s |\n| U_s, p_s, Δp_s | Surface recombination rate; hole density and excess at the surface | cm⁻²s⁻¹; cm⁻³ |\n| I_gen, J_gen | Generation current (density) from carriers generated in the depletion region | A; A/cm² |\n| τ₀ (τ_g) | Effective generation lifetime in a depletion region | s |\n| t | Time (or a thickness, where the text says so) | s (or cm) |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| GaAs | Gallium arsenide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| SRH | Shockley–Read–Hall (trap-assisted) recombination |\n| LDD | Lightly doped drain |\n| MOS | Metal–oxide–semiconductor |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| CMOS | Complementary MOS (n- and p-channel MOSFETs together) |\n| BJT | Bipolar junction transistor |\n| LED | Light-emitting diode |\n| IGBT | Insulated-gate bipolar transistor |\n| TCAD | Technology computer-aided design (device simulation software) |\n\n\n## Questions on this page\n\n| Q | Question |\n|---|---|\n| 35 | Define carrier mobility and explain the factors that affect electron and hole mobility in semiconductors. |\n| 36 | Explain the mechanisms responsible for carrier scattering in semiconductor materials. |\n| 37 | Derive the expression for drift current density due to electrons and holes. |\n| 38 | A semiconductor has an electron concentration of 2 × 10¹⁶ cm⁻³, electron mobility of 1350 cm²/V·s, and an electric field of 10 V/cm. Calculate the electron drift current density. |\n| 39 | Explain diffusion current in a semiconductor and state Fick's law. |\n| 40 | State and explain the Einstein relation between carrier mobility and diffusion coefficient. |\n| 41 | Explain velocity saturation and hot-carrier effects in semiconductors. |\n| 42 | What is meant by generation and recombination of charge carriers? |\n| 43 | Explain the Shockley-Read-Hall (SRH) recombination mechanism. |\n| 44 | Define minority-carrier lifetime and explain its significance in semiconductor devices. |\n| 45 | Explain the continuity equation for minority carriers and discuss its application to semiconductor devices. |\n| 46 | What is surface recombination velocity? Explain how semiconductor surface states affect carrier lifetime. |\n\n## Model answers\n\n### Q35. Define carrier mobility and explain the factors that affect electron and hole mobility in semiconductors.\n\n> **Question type:** Definition and explanation · **Topic:** carrier mobility · **Full notes:** Week 7 (Drift and Diffusion Currents)\n\n**What the examiner wants.** Two parts. First a precise definition of mobility, with its formula and unit. Then an explanation of each factor that changes mobility, saying *why* it does so (through the collision time or the effective mass), not just listing names.\n\n**Key terms.**\n\n- **Drift velocity (v_d):** the small average velocity carriers gain in the direction of an electric field (cm/s).\n- **Mobility (μ):** drift velocity per unit electric field, μ = v_d/E (cm²/V·s).\n- **Mean free time (τ_m):** the average time between two collisions of a carrier (about 0.1–1 ps).\n- **Effective mass (m∗):** the mass a carrier appears to have when it is accelerated inside the crystal.\n- **Scattering:** any collision that randomises a carrier's direction and destroys the velocity it gained from the field.\n- **Phonon:** a quantum of lattice vibration; its number grows with temperature.\n- **Matthiessen's rule:** when several scattering mechanisms act, 1/μ = 1/μ₁ + 1/μ₂ + …\n\n**Model answer.**\n\n#### Definition\n\nCarrier mobility is the drift velocity a carrier gains per unit applied electric field. It measures how easily electrons or holes move through the crystal.\n\n    μ = v_d / E = qτ_m / m∗\n\nWhere:\n\n- μ = mobility (cm²/V·s)\n- v_d = drift velocity (cm/s)\n- E = electric field (V/cm)\n- q = electronic charge, 1.6×10⁻¹⁹ C\n- τ_m = mean free time between collisions (s)\n- m∗ = effective mass of the carrier (kg)\n\nElectrons and holes have separate mobilities, μ_n and μ_p. In silicon at 300 K, μ_n = 1350 and μ_p = 480 cm²/V·s. The formula shows that mobility is high when collisions are rare (long τ_m) and the carrier is light (small m∗). Every factor below acts through one of these two quantities.\n\n#### Factors affecting mobility\n\n1. **Effective mass.** μ ∝ 1/m∗. Electrons usually have a smaller effective mass than holes, so μ_n > μ_p (Si 1350 vs 480; GaAs electrons, m∗ = 0.067m₀, reach about 8500 cm²/V·s).\n2. **Temperature (lattice scattering).** Atoms vibrate more as T rises, so carriers collide with phonons more often and τ_m falls: μ_L ∝ T^{−3/2}. Near room temperature mobility falls as temperature rises.\n3. **Temperature (impurity scattering).** Slow carriers are deflected more by charged ions. At higher T carriers move faster and are deflected less, so μ_I ∝ T^{3/2}/N_I rises with T. This dominates at low temperature.\n4. **Doping concentration.** More ionised donors and acceptors mean more Coulomb scattering centres, so mobility falls as N_D + N_A rises (Si electrons: about 1350 at light doping, about 800 at 10¹⁷ cm⁻³, about 100 at 10²⁰ cm⁻³). Compensated material has low mobility even if the net doping is small, because both ion types scatter.\n5. **Electric field.** At low field μ is constant. At high field (above about 10⁴ V/cm in Si) carriers emit optical phonons, the drift velocity saturates near 10⁷ cm/s, and the effective mobility v_d/E falls.\n6. **Crystal defects.** Dislocations, grain boundaries and vacancies add scattering; polycrystalline and amorphous material have much lower mobility than single crystal.\n7. **Surface and interface scattering.** In a MOSFET channel, carriers are pressed against the rough Si/SiO₂ interface and its trapped charges; channel mobility is roughly half the bulk value.\n8. **Orientation, strain and carrier density.** Mobility depends on crystal direction and can be raised by strain (strained silicon); at very high carrier densities carrier–carrier scattering lowers it.\n\nThe separate effects combine through Matthiessen's rule:\n\n    1/μ = 1/μ_L + 1/μ_I + …\n\nWhere:\n\n- μ = total mobility (cm²/V·s)\n- μ_L = mobility limited by lattice scattering alone (cm²/V·s)\n- μ_I = mobility limited by ionised-impurity scattering alone (cm²/V·s)\n\nThe smallest term dominates, so mobility against temperature rises at low T (impurity-limited), peaks, then falls at high T (lattice-limited).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 225\" role=\"img\" aria-label=\"Log-log plot of electron mobility against temperature for light and heavy doping, rising then falling, with the lattice-scattering limit shown dashed\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"198.0\" x2=\"444.0\" y2=\"198.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"70.0\" y1=\"198.0\" x2=\"70.0\" y2=\"34.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"70.0\" y1=\"198.0\" x2=\"70.0\" y2=\"193.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\"/><text x=\"70.0\" y=\"213.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">50</text><line x1=\"176.0\" y1=\"198.0\" x2=\"176.0\" y2=\"193.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\"/><text x=\"176.0\" y=\"213.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">100</text><line x1=\"282.0\" y1=\"198 61.8 191.1,160.9 194.2,160.1 197.2,159.2 200.2,158.4 203.2,157.6 206.3,156.7 209.3,155.9 212.3,155.1 215.4,154.3 218.4,153.5 221.4,152.7 224.4,152.0 227.5,151.2 230.5,150.4 233.5,149.7 236.6,149.0 239.6,148.2 242.6,147.5 245.6,146.8 248.7,146.2 251.7,145.5 254.7,144.8 257.8,144.2 260.8,143.6 263.8,143.0 266.8,142.4 269.9,141.8 272.9,141.3 275.9,140.7 279.0,140.2 282.0,139.7 285.0,139.3 288.0,138.8 291.1,138.4 294.1,138.0 297.1,137.6 300.1,137.2 303.2,136.9 306.2,136.6 309.2,136.3 312.3,136.1 315.3,135.8 318.3,135.6 321.3,135.5 324.4,135.3 327.4,135.2 330.4,135.1 333.5,135.1 336.5,135.0 339.5,135.0 342.5,135.0 345.6,135.1 348.6,135.2 351.6,135.3 354.7,135.4 357.7,135.6 360.7,135.8 363.7,136.0 366.8,136.2 369.8,136.5 372.8,136.8 375.9,137.1 378.9,137.5 381.9,137.8 384.9,138.2 388.0,138.6 391.0,139.1 394.0,139.5 397.1,140.0 400.1,140.5 403.1,141.0 406.1,141.6 409.2,142.2 412.2,142.7 415.2,143.3 418.3,143.9 421.3,144.6 424.3,145.2 427.3,145.9 430.4,146.6 433.4,147.2 436.4,148.0 439.5,148.7 442.5,149.4 445.5,150.1 448.5,150.9\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2.1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"240.0\" y=\"166.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">heavy doping</text><polyline points=\"141.9,50.8 450.0,147.8\" fill=\"none\" style=\"stroke:currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><text x=\"165.9\" y=\"54.5\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">lattice ∝ T<tspan dy=\"-0.45em\" font-size=\"72%\">−3/2</tspan><tspan dy=\"0.45em\">​</tspan></text></svg><figcaption>Mobility against temperature for light and heavy doping. Impurity scattering limits the low-temperature side, lattice scattering the high-temperature side; heavier doping lowers the curve and moves the peak to a higher temperature.</figcaption></figure>\n```\n\nSketch: log μ against log T, a curve rising as T^{3/2} then falling as T^{−3/2}; label \"impurity scattering\" and \"lattice scattering\", and draw a lower curve labelled \"higher N_I\".\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ definition μ = v_d/E with unit cm²/V·s\n- ✓ μ = qτ_m/m∗, linking mobility to collision time and effective mass\n- ✓ effective mass: why μ_n > μ_p, with Si values 1350 and 480 cm²/V·s\n- ✓ lattice scattering, μ_L ∝ T^{−3/2}\n- ✓ ionised-impurity scattering, μ_I ∝ T^{3/2}/N_I, and fall of μ with doping\n- ✓ high-field effect (velocity saturation)\n- ✓ at least one further factor: defects, surface scattering, strain\n- ✓ Matthiessen's rule and/or the sketch of μ against T\n\n**Common mistakes.**\n\n- Saying \"mobility increases with temperature\" without qualification: near room temperature it decreases; it only increases at low T where impurity scattering dominates.\n- Defining mobility as \"the speed of a carrier\": it is velocity *per unit field*, so its unit is cm²/V·s, not cm/s.\n- Listing factors with no reason: always say whether the factor changes τ_m or m∗.\n- Adding mobilities directly: it is the reciprocals that add.\n\n**Remember it.** \"Mobility = q τ over m\": anything that shortens the time between bumps, or makes the carrier heavier, slows it down.\n\n**Try a variant.** In a silicon sample the lattice-limited mobility is 1350 cm²/V·s and the impurity-limited mobility is 2000 cm²/V·s. Find the total electron mobility. *Answer:* 1/μ = 1/1350 + 1/2000 = 1.24×10⁻³, so **μ ≈ 806 cm²/V·s**, lower than either value alone.\n\n---\n\n### Q36. Explain the mechanisms responsible for carrier scattering in semiconductor materials.\n\n> **Question type:** Explanation · **Topic:** carrier scattering · **Full notes:** Week 7 (Drift and Diffusion Currents)\n\n**What the examiner wants.** Say what scattering is and why it happens (anything that breaks the perfect periodicity of the crystal), then explain each mechanism: its physical cause, when it dominates, and how it depends on temperature and doping. Finish with how the mechanisms combine.\n\n**Key terms.**\n\n- **Scattering:** a collision that changes a carrier's momentum and randomises the velocity it gained from a field.\n- **Periodic potential:** the regularly repeating electric potential of a perfect crystal lattice; a carrier moves through it without scattering (Bloch's theorem).\n- **Phonon:** a quantum of lattice vibration. *Acoustic* phonons are low-energy; *optical* phonons are high-energy (about 63 meV in Si).\n- **Ionised impurity:** a donor (+) or acceptor (−) ion that has given up or taken an electron and so carries a charge.\n- **Mean free time (τ_m):** the average time between collisions.\n- **Mobility (μ):** drift velocity per unit field, μ = qτ_m/m∗ (cm²/V·s).\n- **Matthiessen's rule:** scattering rates add, so 1/μ = Σ 1/μ_i.\n\n**Model answer.**\n\n#### Why scattering happens\n\nIn a perfectly periodic, perfectly still crystal an electron would travel freely with no collisions (Bloch's theorem). Scattering happens whenever something breaks that perfect periodicity. Each scattering event randomises the carrier's direction, so it limits the mean free time τ_m and hence the mobility, μ = qτ_m/m∗.\n\n#### The mechanisms\n\n1. **Lattice (phonon) scattering.** Above 0 K the atoms vibrate about their sites and distort the periodic potential. Carriers exchange energy and momentum with these vibrations (phonons). *Acoustic-phonon* scattering is nearly elastic and dominates in lightly doped Si at room temperature. More vibration at higher T means more scattering, giving μ_L ∝ T^{−3/2}. *Optical-phonon* scattering (phonon energy about 63 meV in Si) becomes important at high temperature and high field, and causes velocity saturation.\n2. **Polar-optical and piezoelectric scattering.** In compound semiconductors such as GaAs the bonds are partly ionic, so vibrating atoms create electric fields that scatter carriers strongly.\n3. **Ionised-impurity scattering.** The Coulomb field of each charged donor or acceptor ion deflects a passing carrier, like a charged particle passing a nucleus (Rutherford scattering). A slow carrier spends longer near the ion and is deflected more. It is therefore strongest at low temperature and high doping: μ_I ∝ T^{3/2}/N_I, where N_I is the ionised-impurity concentration.\n4. **Neutral-impurity scattering.** Un-ionised dopant atoms distort the lattice potential slightly. This is weak and matters only at very low temperature, when dopants are frozen out.\n5. **Carrier–carrier scattering.** Electrons and holes repel or attract one another. Important only at very high carrier densities (heavily doped or strongly injected regions).\n6. **Defect scattering.** Dislocations, grain boundaries, stacking faults and vacancies disturb the lattice; dislocations in n-type material can also be charged lines.\n7. **Surface and interface scattering.** Carriers confined near a surface (a MOSFET channel at the Si/SiO₂ interface) are scattered by surface roughness, interface traps and oxide charge; channel mobility is about half the bulk value.\n8. **Alloy scattering.** In alloys such as SiGe or Al_{x}Ga_{1−x}As the random placement of different atoms makes the potential non-periodic.\n9. **Intervalley scattering.** A carrier absorbs or emits a phonon and moves to another conduction-band minimum; in GaAs this causes negative differential mobility (the Gunn effect).\n\n#### Combining the mechanisms\n\nThe scattering rates add, 1/τ = Σ 1/τ_i, so the mobilities combine by Matthiessen's rule:\n\n    1/μ = 1/μ_L + 1/μ_I + …\n\nWhere:\n\n- μ = total mobility (cm²/V·s)\n- μ_L = lattice-limited mobility (cm²/V·s)\n- μ_I = ionised-impurity-limited mobility (cm²/V·s)\n\nThe mechanism with the lowest mobility dominates. In lightly doped Si near 300 K this is lattice scattering; in heavily doped Si or at low temperature it is ionised-impurity scattering.\n\n```figure\n< 6.6,149.0 239.6,148.2 242.6,147.5 245.6,146.8 248.7,146.2 251.7,145.5 254.7,144.8 257.8,144.2 260.8,143.6 263.8,143.0 266.8,142.4 269.9,141.8 272.9,141.3 275.9,140.7 279.0,140.2 282.0,139.7 285.0,139.3 288.0,138.8 291.1,138.4 294.1,138.0 297.1,137.6 300.1,137.2 303.2,136.9 306.2,136.6 309.2,136.3 312.3,136.1 315.3,135.8 318.3,135.6 321.3,135.5 324.4,135.3 327.4,135.2 330.4,135.1 333.5,135.1 336.5,135.0 339.5,135.0 342.5,135.0 345.6,135.1 348.6,135.2 351.6,135.3 354.7,135.4 357.7,135.6 360.7,135.8 363.7,136.0 366.8,136.2 369.8,136.5 372.8,136.8 375.9,137.1 378.9,137.5 381.9,137.8 384.9,138.2 388.0,138.6 391.0,139.1 394.0,139.5 397.1,140.0 400.1,140.5 403.1,141.0 406.1,141.6 409.2,142.2 412.2,142.7 415.2,143.3 418.3,143.9 421.3,144.6 424.3,145.2 427.3,145.9 430.4,146.6 433.4,147.2 436.4,148.0 439.5,148.7 442.5,149.4 445.5,150.1 448.5,150.9\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2.1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"240.0\" y=\"166.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">heavy doping</text><polyline points=\"141.9,50.8 450.0,147.8\" fill=\"none\" style=\"stroke:currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><text x=\"165.9\" y=\"54.5\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">lattice ∝ T<tspan dy=\"-0.45em\" font-size=\"72%\">−3/2</tspan><tspan dy=\"0.45em\">​</tspan></text></svg><figcaption>The two main mechanisms compete: impurity scattering sets the rising, low-temperature side of the mobility curve and lattice scattering the falling, high-temperature side.</figcaption></figure>\n```\n\nSketch: log μ against log T with the T^{3/2} impurity branch and the T^{−3/2} lattice branch, and the actual curve passing under both.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ scattering is caused by any departure from a perfect periodic lattice\n- ✓ lattice (phonon) scattering, acoustic and optical, with μ_L ∝ T^{−3/2}\n- ✓ ionised-impurity (Coulomb) scattering, with μ_I ∝ T^{3/2}/N_I\n- ✓ neutral-impurity and carrier–carrier scattering, and when they matter\n- ✓ defect and surface/interface scattering\n- ✓ at least one of: polar, alloy, intervalley scattering\n- ✓ Matthiessen's rule and which mechanism dominates where\n\n**Common mistakes.**\n\n- Saying the electron \"collides with the atoms\" of a perfect lattice: a perfect still lattice does not scatter; only vibrations and imperfections do.\n- Getting the temperature dependence of impurity scattering backwards: it is *weaker* at high T, because fast carriers are deflected less.\n- Giving only two mechanisms: the question says \"mechanisms\", so cover at least five with a reason for each.\n\n**Remember it.** \"Shake, charge, break\": the lattice shakes (phonons), ions are charged (impurities), the crystal breaks (defects and surfaces).\n\n**Try a variant.** Lattice-limited electron mobility in Si is 1350 cm²/V·s at 300 K. Estimate it at 400 K, assuming μ_L ∝ T^{−3/2}. *Answer:* μ_L = 1350 × (400/300)^{−3/2} = 1350 × 0.650 = **≈ 877 cm²/V·s**: heating by 100 K cuts the lattice-limited mobility by about a third.\n\n---\n\n### Q37. Derive the expression for drift current density due to electrons and holes.\n\n> **Question type:** Derivation · **Topic:** drift current · **Full notes:** Week 7 (Drift and Diffusion Currents)\n\n**What the examiner wants.** A step-by-step derivation starting from \"current density = charge × concentration × velocity\", showing how the drift velocity follows from the field (v_d = μE), handling the signs for electrons and holes, and ending with J = q(nμ_n + pμ_p)E, the conductivity σ and the resistivity ρ. State assumptions first and box the final result.\n\n**Key terms.**\n\n- **Drift:** carrier motion caused by an electric field.\n- **Drift velocity (v_d):** the average velocity carriers gain from the field, on top of their random thermal motion (cm/s).\n- **Mobility (μ_n, μ_p):** drift velocity per unit field (cm²/V·s).\n- **Current density (J):** charge crossing unit area per unit time (A/cm²).\n- **Effective mass (m∗):** the apparent mass of a carrier accelerated inside the crystal.\n- **Mean free time (τ_m):** average time between collisions (s).\n- **Conductivity (σ):** J/E, the material's ability to carry current (S/cm); resistivity ρ = 1/σ (Ω·cm).\n\n**Model answer.**\n\nSketch: a bar of semiconductor of cross-section A with the field E pointing in +x. Draw holes (⊕) drifting along +x and electrons (⊖) drifting along −x; draw both current arrows J_p and J_n pointing along +x.\n\n#### Assumptions\n\n- The semiconductor is uniform (n and p do not vary with position), so there is no diffusion current.\n- Steady state, with a uniform field E in the +x direction.\n- The field is low enough that carriers stay near thermal equilibrium, so v_d is proportional to E (no velocity saturation).\n- Each carrier type has a constant effective mass m∗ and mean free time τ_m.\n\n#### Derivation\n\n**Step 1. Force on a carrier.** An electron (charge −q) feels F = −qE; a hole (charge +q) feels F = +qE.\n\n**Step 2. Drift velocity of electrons.** In steady state the momentum each electron gains from the field per unit time equals the momentum lost in collisions, which on average is m_n∗v_dn/τ_mn:\n\n    m_n∗ v_dn / τ_mn = −qE   ⇒   v_dn = −(qτ_mn / m_n∗) E = −μ_n E\n\nWhere:\n\n- v_dn = electron drift velocity (cm/s)\n- m_n∗ = electron effective mass (kg)\n- τ_mn = electron mean free time (s)\n- μ_n = qτ_mn/m_n∗ = electron mobility (cm²/V·s)\n- E = electric field (V/cm)\n\nThe minus sign shows electrons drift against the field.\n\n**Step 3. Drift velocity of holes.** By the same argument with charge +q:\n\n    v_dp = +(qτ_mp / m_p∗) E = +μ_p E\n\nHoles drift along the field.\n\n**Step 4. Current density from charge × velocity.** Take a plane of area A across the bar. In time dt, every carrier within a distance v_d·dt behind the plane crosses it: that is a volume v_d·dt·A. If the concentration is c and each carrier has charge Q, the charge crossing is Q·c·v_d·dt·A. Dividing by A and dt:\n\n    J = Q c v_d\n\nWhere:\n\n- J = current density (A/cm²)\n- Q = charge per carrier (C)\n- c = carrier concentration (cm⁻³)\n- v_d = drift velocity (cm/s)\n\n**Step 5. Electron drift current.** Put Q = −q, c = n, v_d = −μ_nE:\n\n    J_n = (−q)(n)(−μ_n E) = qnμ_n E\n\nThe two minus signs cancel: electrons move against E, but because they are negative their current flows along E.\n\n**Step 6. Hole drift current.** Put Q = +q, c = p, v_d = +μ_pE:\n\n    J_p = (+q)(p)(+μ_p E) = qpμ_p E\n\n**Step 7. Total drift current.** Both components point along E, so they add:\n\n    J_drift = J_n + J_p = qnμ_n E + qpμ_p E\n\n**Step 8. Conductivity and resistivity.** Comparing with Ohm's law in the form J = σE:\n\n    σ = q(nμ_n + pμ_p),     ρ = 1/σ = 1 / [q(nμ_n + pμ_p)]\n\n#### Result\n\n**J_drift = q(nμ_n + pμ_p)E, with σ = q(nμ_n + pμ_p) and ρ = 1/σ.**\n\nWhere:\n\n- J_drift = total drift current density (A/cm²)\n- q = electronic charge, 1.6×10⁻¹⁹ C\n- n, p = electron and hole concentrations (cm⁻³)\n- μ_n, μ_p = electron and hole mobilities (cm²/V·s)\n- E = electric field (V/cm)\n- σ = conductivity (S/cm); ρ = resistivity (Ω·cm)\n\n#### Special cases\n\n- n-type (n ≫ p): σ ≈ qN_Dμ_n. For N_D = 10¹⁶ cm⁻³ in Si, σ = 1.6×10⁻¹⁹ × 10¹⁶ × 1350 = 2.16 S/cm.\n- p-type (p ≫ n): σ ≈ qN_Aμ_p.\n- Intrinsic (n = p = n_i): σ_i = qn_i(μ_n + μ_p) = 1.6×10⁻¹⁹ × 10¹⁰ × 1830 = 2.93×10⁻⁶ S/cm.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ assumptions stated (uniform sample, low field, steady state)\n- ✓ v_d = μE derived from force balance, with μ = qτ_m/m∗\n- ✓ correct directions: electrons against E, holes along E\n- ✓ J = (charge)(concentration)(velocity), justified by counting carriers crossing a plane\n- ✓ J_n = qnμ_nE with the sign cancellation explained\n- ✓ J_p = qpμ_pE\n- ✓ boxed total J = q(nμ_n + pμ_p)E\n- ✓ σ = q(nμ_n + pμ_p) and ρ = 1/σ, with n-type, p-type or intrinsic special case\n- ✓ labelled sketch of carrier and current directions\n\n**Common mistakes.**\n\n- Writing J_n = −qnμ_nE and concluding the electron and hole currents cancel: they add, because the electron's negative charge and negative velocity cancel.\n- Skipping the step J = (charge)(concentration)(velocity): it carries marks, so show the carrier-counting argument.\n- Using the thermal velocity (about 10⁷ cm/s) instead of the drift velocity: the random thermal motion averages to zero and carries no current.\n- Forgetting to state the low-field assumption: v_d = μE fails at high field.\n\n**Remember it.** \"Charge × count × speed\": J = (q)(n)(μE) for each carrier, and the two minus signs of the electron cancel.\n\n**Try a variant.** Find the conductivity and resistivity of intrinsic silicon at 300 K. *Answer:* σ_i = qn_i(μ_n + μ_p) = 1.6×10⁻¹⁹ × 10¹⁰ × (1350 + 480) = **2.93×10⁻⁶ S/cm**, so ρ_i = 1/σ_i = **3.4×10⁵ Ω·cm**.\n\n---\n\n### Q38. A semiconductor has an electron concentration of 2 × 10¹⁶ cm⁻³, electron mobility of 1350 cm²/V·s, and an electric field of 10 V/cm. Calculate the electron drift current density.\n\n> **Question type:** Calculation · **Topic:** drift current · **Full notes:** Week 7 (Drift and Diffusion Currents)\n\n**What the examiner wants.** A single-formula calculation. Marks come from writing the drift-current formula, substituting with units, and giving the answer with the correct unit (A/cm²). A one-line comment on what the number means shows understanding.\n\n**Key terms.**\n\n- **Drift:** the motion of charge carriers caused by an electric field.\n- **Mobility (μ_n):** how fast an electron drifts per unit field, v_d = μ_nE; unit cm²/V·s.\n- **Drift velocity (v_d):** the average velocity carriers gain from the field (cm/s).\n- **Current density (J):** current per unit cross-sectional area (A/cm²).\n- **Saturation velocity (v_sat):** the maximum drift velocity at high field, about 10⁷ cm/s in Si.\n\n**Model answer.**\n\n**Given:** n = 2×10¹⁶ cm⁻³, μ_n = 1350 cm²/V·s, E = 10 V/cm, q = 1.6×10⁻¹⁹ C.\n\n**Find:** the electron drift current density J_n.\n\n**Formula:**\n\n    J_n = q n μ_n E\n\nWhere:\n\n- J_n = electron drift current density (A/cm²)\n- q = electronic charge, 1.6×10⁻¹⁹ C\n- n = electron concentration (cm⁻³)\n- μ_n = electron mobility (cm²/V·s)\n- E = electric field (V/cm)\n\n**Solution.**\n\nStep 1. Drift velocity: v_d = μ_nE = 1350 × 10 = 1.35×10⁴ cm/s.\n\nStep 2. Current density:\n\n    J_n = 1.6×10⁻¹⁹ × 2×10¹⁶ × 1350 × 10 = 43.2 A/cm²\n\nStep 3. Units check: C × cm⁻³ × cm²/(V·s) × V/cm = C/(s·cm²) = A/cm².\n\n**Answer:** **J_n = 43.2 A/cm²** (with q = 1.602×10⁻¹⁹ C, 43.3 A/cm²).\n\n**What this means:** a field of only 10 V/cm drives 43 A through every square centimetre; the drift velocity (1.35×10⁴ cm/s) is still far below the saturation velocity (10⁷ cm/s), so the simple linear formula is valid.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ J_n = qnμ_nE written down, with each symbol defined\n- ✓ correct substitution with units\n- ✓ answer 43.2 A/cm², with the unit\n- ✓ comment that the field is low enough for v_d = μE to hold\n\n**Common mistakes.**\n\n- Mixing metres and centimetres: keep everything in cm (cm⁻³, cm²/V·s, V/cm) and the answer comes out in A/cm².\n- Forgetting q, and giving 2.7×10²⁰ as the \"current\".\n- Giving the unit as A instead of A/cm²: this is a current density, not a current.\n\n**Remember it.** \"J = q n μ E\": charge × how many × how mobile × how hard you push.\n\n**Try a variant.** p-type silicon has p = 5×10¹⁵ cm⁻³ and μ_p = 480 cm²/V·s in a field of 100 V/cm. Find the hole drift current density. *Answer:* J_p = qpμ_pE = 1.6×10⁻¹⁹ × 5×10¹⁵ × 480 × 100 = **38.4 A/cm²**.\n\n---\n\n### Q39. Explain diffusion current in a semiconductor and state Fick's law.\n\n> **Question type:** Explanation and statement · **Topic:** diffusion current · **Full notes:** Week 7 (Drift and Diffusion Currents)\n\n**What the examiner wants.** Explain what causes diffusion current (random thermal motion plus a concentration gradient, no field needed), state Fick's law with its minus sign, and turn it into the electron and hole diffusion current densities with the correct signs. A labelled sketch and an example of where diffusion matters earn extra marks.\n\n**Key terms.**\n\n- **Diffusion:** net movement of particles from high to low concentration caused by their random thermal motion.\n- **Concentration gradient (dn/dx, dp/dx):** the rate at which carrier concentration changes with position (cm⁻⁴).\n- **Flux (F):** number of particles crossing 1 cm² per second (cm⁻²s⁻¹).\n- **Diffusion coefficient (D_n, D_p):** how fast carriers spread out (cm²/s); in Si, D_n = 35 and D_p = 12.4 cm²/s.\n- **Diffusion current density:** the current carried by the diffusion flux of charged carriers (A/cm²).\n- **Minority carrier:** the less numerous carrier type (holes in n-type, electrons in p-type).\n\n**Model answer.**\n\n#### What diffusion current is\n\nCarriers in a semiconductor move randomly at the thermal velocity (about 10⁷ cm/s), changing direction at every collision. If the concentration is the same everywhere, as many carriers cross any plane from left to right as from right to left, and there is no net flow. If the concentration is higher on one side, more carriers cross from that side simply because there are more of them. The result is a net flow from high to low concentration, with no electric field needed. Because the carriers are charged, this flow is an electric current: the **diffusion current**.\n\nDiffusion current is important wherever carrier gradients exist:\n\n- in the neutral regions of a forward-biased p-n junction, where injected minority carriers diffuse away from the junction;\n- in the base of a bipolar transistor;\n- under non-uniform illumination (solar cells, photodetectors) and in non-uniformly doped material.\n\n#### Fick's first law\n\nThe particle flux is proportional to the concentration gradient and flows down the gradient:\n\n    F = −D dC/dx\n\nWhere:\n\n- F = particle flux (cm⁻²s⁻¹)\n- D = diffusion coefficient (cm²/s)\n- C = particle concentration (cm⁻³)\n- dC/dx = concentration gradient (cm⁻⁴)\n- the minus sign = flow is from high to low concentration\n\nFor electrons and holes: F_n = −D_n dn/dx and F_p = −D_p dp/dx.\n\n#### Diffusion current densities\n\nMultiply each flux by the carrier's charge (−q for electrons, +q for holes):\n\n    J_{n,diff} = (−q)(−D_n dn/dx) = +qD_n dn/dx\n    J_{p,diff} = (+q)(−D_p dp/dx) = −qD_p dp/dx\n\nWhere:\n\n- J_{n,diff}, J_{p,diff} = electron and hole diffusion current densities (A/cm²)\n- q = electronic charge, 1.6×10⁻¹⁹ C\n- D_n, D_p = electron and hole diffusion coefficients (cm²/s)\n- n, p = electron and hole concentrations (cm⁻³)\n\nBoth carriers flow down their gradient, but the electron current points *opposite* to the electron flow (negative charge), while the hole current points *with* the hole flow.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"Electrons and holes both diffuse down their concentration gradients, but electron current flows opposite to electron flux\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" re 6.3 527.7,126.5 529.0,126.7 530.3,126.8 531.6,127.0 532.9,127.2 534.2,127.3 535.6,127.5 536.9,127.7 538.2,127.8 539.5,128.0 540.8,128.1 542.1,128.3 543.4,128.4 544.8,128.6 546.1,128.7 547.4,128.9 548.7,129.0 550.0,129.1\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"352.6\" cy=\"106.0\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"379.9\" cy=\"114.9\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"407.2\" cy=\"121.6\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"434.5\" cy=\"126.7\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"461.8\" cy=\"130.4\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"489.1\" cy=\"133.3\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"516.4\" cy=\"135.4\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><text x=\"445.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:currentColor\" opacity=\".85\">holes</text><line x1=\"370\" y1=\"176\" x2=\"520\" y2=\"176\" style=\"stroke:currentColor\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"445.0\" y=\"170\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor\">flux, down the gradient</text><line x1=\"370\" y1=\"206\" x2=\"520\" y2=\"206\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\" marker-end=\"url(#art)\"/><text x=\"445.0\" y=\"200\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E)\">J_p = −qD_p dp/dx  (with the flux)</text></svg><figcaption>Electrons and holes both diffuse from high to low concentration; the electron current is opposite to the electron flow, the hole current is in the same direction as the hole flow.</figcaption></figure>\n```\n\nSketch: a concentration profile falling from left to right; draw the particle-flow arrows pointing right for both carriers, the hole current arrow pointing right and the electron current arrow pointing left.\n\n**Example.** Electron concentration in Si falls linearly from 10¹⁷ cm⁻³ to zero over 1 μm (10⁻⁴ cm). Then dn/dx = −10²¹ cm⁻⁴ and J_n = qD_n dn/dx = 1.6×10⁻¹⁹ × 35 × (−10²¹) = −5.6×10³ A/cm²: a large current, flowing in −x, from a modest gradient.\n\nWhen a field is also present, the total currents are J_n = qnμ_nE + qD_n dn/dx and J_p = qpμ_pE − qD_p dp/dx.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ cause: random thermal motion plus a concentration gradient; no field needed\n- ✓ Fick's law F = −D dC/dx with the minus sign explained\n- ✓ D defined with unit cm²/s (Si values 35 and 12.4 cm²/s)\n- ✓ J_n = +qD_n dn/dx and J_p = −qD_p dp/dx with correct signs\n- ✓ direction of electron current opposite to electron flow\n- ✓ where diffusion matters (forward-biased diode, BJT base)\n- ✓ labelled sketch or numerical example\n- ✓ total current = drift + diffusion\n\n**Common mistakes.**\n\n- Giving both current densities the same sign: the electron one is +qD_n dn/dx, the hole one −qD_p dp/dx.\n- Saying diffusion needs a field: it happens with no field at all.\n- Stating Fick's law without the minus sign, which would send particles uphill.\n- Confusing the diffusion of carriers (D about 10 cm²/s) with dopant diffusion in a furnace (D about 10⁻¹³ cm²/s).\n\n**Remember it.** \"Ink in water\": carriers spread from crowded to empty; the electron's minus sign flips its current.\n\n**Try a variant.** In n-type silicon the hole concentration falls linearly from 10¹⁶ cm⁻³ to zero over 10 μm. Find the hole diffusion current density (D_p = 12.4 cm²/s). *Answer:* dp/dx = −10¹⁶/10⁻³ = −10¹⁹ cm⁻⁴, so J_p = −qD_p dp/dx = 1.6×10⁻¹⁹ × 12.4 × 10¹⁹ = **19.8 A/cm²**, in the +x direction (with the hole flow).\n\n---\n\n### Q40. State and explain the Einstein relation between carrier mobility and diffusion coefficient.\n\n> **Question type:** Statement and explanation · **Topic:** Einstein relation · **Full notes:** Week 7 (Drift and Diffusion Currents)\n\n**What the examiner wants.** State the relation exactly for both carriers, say what kT/q is and its value at 300 K, explain *why* D and μ are linked (same collisions), and justify it, ideally with the equilibrium drift-equals-diffusion argument. A numerical use (finding D from μ) completes the answer.\n\n**Key terms.**\n\n- **Mobility (μ):** drift velocity per unit field (cm²/V·s).\n- **Diffusion coefficient (D):** constant in Fick's law, F = −D dC/dx (cm²/s).\n- **Thermal voltage (kT/q):** Boltzmann constant × temperature ÷ electronic charge; 0.0259 V at 300 K.\n- **Thermal equilibrium:** no external bias or illumination; no net current flows and the Fermi level is flat.\n- **Fermi level (E_F):** the energy at which the probability of occupation is one half.\n- **Intrinsic level (E_i):** the Fermi level of the undoped material; it follows the band edges and the electrostatic potential.\n- **Non-degenerate semiconductor:** doped lightly enough that Boltzmann statistics apply (E_F more than about 3kT from the band edges).\n\n**Model answer.**\n\n#### Statement\n\nFor a non-degenerate semiconductor, the ratio of diffusion coefficient to mobility equals the thermal voltage, for both electrons and holes:\n\n    D_n / μ_n = D_p / μ_p = kT/q\n\nWhere:\n\n- D_n, D_p = electron and hole diffusion coefficients (cm²/s)\n- μ_n, μ_p = electron and hole mobilities (cm²/V·s)\n- k = Boltzmann constant, 8.617×10⁻⁵ eV/K\n- T = absolute temperature (K)\n- q = electronic charge, 1.6×10⁻¹⁹ C\n- kT/q = thermal voltage, 0.0259 V at 300 K\n\n#### Why μ and D are linked\n\nDrift (response to a field) and diffusion (response to a gradient) are done by the same carriers and are limited by the same collisions. Mobility is μ = qτ_m/m∗. Diffusion depends on how far a carrier travels between collisions, D = v_th²τ_m/3, and with (1/2)m∗v_th² = (3/2)kT this is D = kTτ_m/m∗. Dividing, the collision time τ_m and the effective mass m∗ cancel:\n\n    D/μ = (kTτ_m/m∗) / (qτ_m/m∗) = kT/q\n\nSo a carrier that rarely collides both drifts easily and spreads quickly, and the ratio depends only on temperature.\n\n#### Equilibrium proof\n\nTake an n-type sample with non-uniform doping, in thermal equilibrium.\n\nStep 1. Electrons diffuse from the high-doped side and uncover positive donor ions, creating an internal field E.\n\nStep 2. That field drives a drift current back. With no external circuit the net current is zero:\n\n    J_n = qnμ_nE + qD_n dn/dx = 0\n\nStep 3. In equilibrium E_F is flat and n = n_i e^{(E_F − E_i)/kT}. E_i follows the electrostatic potential, dE_i/dx = qE, so\n\n    dn/dx = −(n/kT) dE_i/dx = −(qn/kT) E\n\nStep 4. Substituting into the zero-current condition:\n\n    qnμ_nE − qD_n(qn/kT)E = 0   ⇒   D_n = (kT/q) μ_n\n\nThe same argument with holes gives D_p = (kT/q)μ_p.\n\n#### Use and significance\n\n- Mobility is easy to measure (Hall effect, conductivity), so D follows: Si electrons D_n = 0.0259 × 1350 = 35.0 cm²/s; holes D_p = 0.0259 × 480 = 12.4 cm²/s.\n- It links the drift and diffusion terms of the current equations and is needed for diffusion lengths L = √(Dτ) and diode saturation currents.\n- In degenerate (very heavily doped) material Boltzmann statistics fail and D/μ is larger than kT/q.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ D/μ = kT/q stated for both electrons and holes\n- ✓ kT/q named the thermal voltage, 0.0259 V (about 26 mV) at 300 K\n- ✓ physical reason: the same scattering limits both drift and diffusion\n- ✓ equilibrium argument: drift current cancels diffusion current\n- ✓ use of flat E_F and Boltzmann statistics to get dn/dx = −(qn/kT)E\n- ✓ numerical example: D_n = 35 cm²/s, D_p = 12.4 cm²/s for Si\n- ✓ limitation to non-degenerate material\n\n**Common mistakes.**\n\n- Writing μ/D = kT/q (upside down): check units, D/μ has units (cm²/s)/(cm²/V·s) = V.\n- Using kT = 0.0259 J: it is 0.0259 eV, so kT/q = 0.0259 V.\n- Forgetting the temperature dependence: kT/q scales with T, so at 350 K it is 0.0302 V, not 0.0259 V.\n- Stating it without saying when it is valid (thermal equilibrium physics, non-degenerate doping).\n\n**Remember it.** \"D over μ is kT over q\": spread over push equals thermal voltage, 26 mV at room temperature.\n\n**Try a variant.** Electrons in a sample at 350 K have mobility 1000 cm²/V·s. Find their diffusion coefficient. *Answer:* kT/q = 8.617×10⁻⁵ × 350 = 0.0302 V, so D_n = (kT/q)μ_n = 0.0302 × 1000 = **30.2 cm²/s**.\n\n---\n\n### Q41. Explain velocity saturation and hot-carrier effects in semiconductors.\n\n> **Question type:** Explanation · **Topic:** high-field effects · **Full notes:** Week 8 (High-Field Effects and Excess Carriers)\n\n**What the examiner wants.** Two linked parts. Explain why drift velocity stops rising at high field (energy loss by optical-phonon emission), give v_sat for Si and sketch v_d against E. Then explain what hot carriers are and list their effects (impact ionisation, oxide injection, substrate current, velocity overshoot) with device consequences and cures.\n\n**Key terms.**\n\n- **Drift velocity (v_d):** average velocity carriers gain from a field; v_d = μE at low field.\n- **Saturation velocity (v_sat):** the limiting drift velocity at high field, about 10⁷ cm/s in Si at 300 K.\n- **Optical phonon:** a high-energy lattice vibration (about 0.063 eV in Si) that can absorb a large amount of carrier energy in one collision.\n- **Hot carrier:** a carrier whose average energy is far above the thermal value (3/2)kT; described by an electron temperature T_e much greater than the lattice temperature T.\n- **Impact ionisation:** a hot carrier breaks a covalent bond and creates a new electron–hole pair.\n- **Negative differential mobility:** a field range where more field gives less drift velocity (GaAs electrons).\n- **LDD (lightly doped drain):** a MOSFET drain extension with lower doping that reduces the peak field.\n\n**Model answer.**\n\n#### Velocity saturation\n\nAt low field carriers lose the energy they gain from the field to acoustic phonons and stay close to thermal equilibrium, so the drift velocity is proportional to field: v_d = μE.\n\nAt high field (above about 10⁴ V/cm in Si) carriers gain energy faster than acoustic-phonon scattering can remove it. Once a carrier's extra energy reaches the optical-phonon energy (about 0.063 eV in Si), it emits an optical phonon and loses that energy in one collision. Each time it speeds up it is knocked back, so the drift velocity stops growing and levels off at the saturation velocity:\n\n    v_sat ≈ 1×10⁷ cm/s   (Si electrons and holes, 300 K)\n\nAn empirical formula (Caughey–Thomas) joins the two regimes:\n\n    v_d = μE / [1 + (μE/v_sat)^β]^{1/β}\n\nWhere:\n\n- v_d = drift velocity (cm/s)\n- μ = low-field mobility (cm²/V·s); Si μ_n = 1350, μ_p = 480\n- E = electric field (V/cm)\n- v_sat = saturation velocity (cm/s)\n- β = fitting exponent, about 2 for Si electrons and 1 for holes (dimensionless)\n\nAt low field this gives μE; at high field, v_sat. The effective mobility v_d/E therefore falls at high field.\n\n**GaAs** behaves differently: electrons reach about 2×10⁷ cm/s near 3.5 kV/cm, then slow down as they transfer to a heavier conduction-band valley (negative differential mobility, used in Gunn diodes).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 230\" role=\"img\" aria-label=\"Drift velocity against electric field on log axes: silicon electrons and holes saturate near ten to the seven centimetres per second, GaAs electrons peak and then fall\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerH
