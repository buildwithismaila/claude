<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELE 717 Exam Companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --sidebar:#EDF1F3;
  --ink:#17212B; --ink-soft:#5A6975; --ink-faint:#8695A1;
  --rule:#D9E1E6; --rule-soft:#E7EDF0;
  --copper:#A2542A; --copper-soft:#F3E7DE;
  --teal:#186A7B; --teal-soft:#E0EEF1;
  --shadow:0 1px 2px rgba(23,33,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
    --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
    --rule:#22303A; --rule-soft:#1A252E;
    --copper:#DC8B57; --copper-soft:#2A1D14;
    --teal:#54B4C6; --teal-soft:#122730;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
  --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
  --rule:#22303A; --rule-soft:#1A252E;
  --copper:#DC8B57; --copper-soft:#2A1D14;
  --teal:#54B4C6; --teal-soft:#122730;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16px; line-height:1.65;
  display:grid; grid-template-columns:272px 1fr; min-height:100vh;
}
::selection{background:var(--copper-soft); color:var(--ink)}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--copper); outline-offset:2px; border-radius:2px}

/* ---------- sidebar ---------- */
#nav{
  background:var(--sidebar); border-right:1px solid var(--rule);
  padding:26px 0 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
}
.brand{padding:0 22px 20px; border-bottom:1px solid var(--rule); margin-bottom:14px}
.brand h1{
  font-size:19px; line-height:1.2; margin:0 0 6px; font-weight:700;
  letter-spacing:-.01em; text-wrap:balance;
}
.brand p{margin:0; font-size:12px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase}
.seclabel{
  padding:0 22px; margin:18px 0 8px; font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-faint); font-weight:600;
}
.modlist{list-style:none; margin:0; padding:0}
.modlist .grouplabel{margin:20px 0 6px; line-height:1.35; text-wrap:balance}
.modlist button{
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  display:grid; grid-template-columns:26px 1fr 16px; gap:9px; align-items:baseline;
  padding:7px 22px; font:inherit; font-size:14px; color:var(--ink-soft);
  border-left:2px solid transparent;
}
.modlist button:hover{background:var(--rule-soft); color:var(--ink)}
.modlist button[aria-current="true"]{
  color:var(--ink); font-weight:600; border-left-color:var(--copper); background:var(--rule-soft);
}
.modnum{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.modlist button[aria-current="true"] .modnum{color:var(--copper)}
.tick{font-size:12px; color:var(--teal); opacity:0; transition:opacity .15s}
.done .tick{opacity:1}
.done .modnum{text-decoration:line-through}

/* ---------- downloads ---------- */
.dl{margin-top:14px}
.dl-label{display:block; font-size:11px; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:6px}
.dl-row{display:flex; gap:6px; flex-wrap:wrap}
.dlbtn{
  font:inherit; font-size:13px; font-weight:600; cursor:pointer; padding:6px 10px;
  background:var(--surface); color:var(--ink); border:1px solid var(--rule); border-radius:3px;
}
.dlbtn:hover{border-color:var(--copper); color:var(--copper)}
.dlbtn[disabled]{opacity:.5; cursor:default}
.dl-msg{margin:6px 0 0; font-size:12px; color:var(--ink-soft); min-height:1em}
.dl-mob{margin-top:8px}
.dl-mob .dl-msg:empty{display:none}

/* ---------- reading column ---------- */
main{padding:0; min-width:0}
.sheet{
  background:var(--surface); border-left:0; min-height:100vh;
  padding:46px 56px 96px; max-width:none;
}
.wrap{max-width:74ch; margin:0 auto}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--copper); margin:0 0 8px;
}
h2.doctitle{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700;
  font-size:38px; line-height:1.1; letter-spacing:-.02em; margin:0 0 6px; text-wrap:balance;
}
.rule{height:1px; background:var(--rule); margin:26px 0 32px}

#doc h2{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:23px; font-weight:600;
  letter-spacing:-.01em; margin:44px 0 12px; padding-top:14px;
  border-top:1px solid var(--rule-soft); text-wrap:balance;
}
#doc h3{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:17px; font-weight:600;
  margin:28px 0 8px; color:var(--ink);
}
#doc h4{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:15.5px; font-weight:600;
  margin:24px 0 8px; color:var(--copper); letter-spacing:.01em;
}
#doc p{margin:0 0 14px}
#doc strong{font-weight:600}
#doc ul,#doc ol{margin:0 0 16px; padding-left:22px}
#doc li{margin:0 0 6px}
#doc hr{border:0; border-top:1px solid var(--rule); margin:34px 0}

/* formulas + code */
#doc code{
  font-family:"IBM Plex Mono",monospace; font-size:.87em;
  background:var(--rule-soft); padding:1px 5px; border-radius:3px;
}
#doc pre{
  font-family:"IBM Plex Mono",monospace; font-size:13.5px; line-height:1.6;
  background:var(--surface); border:1px solid var(--rule);
  border-left:3px solid var(--copper);
  padding:14px 18px; overflow-x:auto; margin:0 0 18px; border-radius:0 3px 3px 0;
}
#doc pre code{background:none; padding:0; font-size:inherit}

/* blockquote = the "warning / think about this" voice */
#doc blockquote{
  margin:0 0 20px; padding:14px 18px; background:var(--teal-soft);
  border-left:3px solid var(--teal); font-style:normal;
}
#doc blockquote p:last-child{margin:0}

/* tables */
.tablewrap{overflow-x:auto; margin:0 0 20px}
#doc .cases .tablewrap, #doc .mat .tablewrap{margin:0; overflow:visible}
#doc table{border-collapse:collapse; width:100%; font-size:14.5px}
#doc th{
  /* deliberately NOT uppercased: in this course a header may be a variable,
     and n, N, v, V, s, S are different quantities */
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600; text-align:left;
  font-size:12.5px; letter-spacing:.03em; color:var(--ink-soft);
  border-bottom:1px solid var(--rule); padding:8px 12px 6px;
}
#doc td{
  padding:8px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:top;
  font-variant-numeric:tabular-nums;
}
#doc tbody tr:last-child td{border-bottom:1px solid var(--rule)}


/* ---------- mathematical typesetting ---------- */
#doc sub, #doc sup{
  font-size:.68em; line-height:0; position:relative; font-feature-settings:"tnum";
  padding-left:.04em;
}
#doc sub{ bottom:-.22em }
#doc sup{ top:-.42em }

/* display equations */
#doc .eq{
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16.5px; line-height:2.15; white-space:pre-wrap;
  margin:22px auto; padding:2px 0; max-width:100%;
  width:max-content; text-align:left; overflow-x:auto;
  color:var(--ink);
}
#doc .eq sub{ bottom:-.2em }

/* matrices and determinants */
#doc .eqrow{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:26px auto; overflow-x:auto; font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16.5px;
}
#doc .eqlhs{ white-space:nowrap }
#doc .mat{ display:inline-block; position:relative; padding:2px 12px }
#doc .mat table{ border-collapse:collapse; width:auto; margin:0 }
#doc .mat table td,
#doc .mat tbody tr td,
#doc .mat tbody tr:last-child td{
  padding:5px 14px; text-align:center; border:0; white-space:nowrap;
  font-variant-numeric:normal; background:none;
}
#doc .mat::before, #doc .mat::after{
  content:""; position:absolute; top:0; bottom:0; width:1px; background:var(--ink);
}
#doc .mat::before{ left:0 } #doc .mat::after{ right:0 }
#doc .mat-bracket::before, #doc .mat-bracket::after{
  width:7px; background:none; border-top:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
}
#doc .mat-bracket::before{ border-left:1px solid var(--ink) }
#doc .mat-bracket::after{ border-right:1px solid var(--ink) }

@media (max-width:860px){
  #doc .eq, #doc .eqrow{ font-size:15px }
  #doc .mat td{ padding:4px 9px }
}

/* ---------- piecewise definitions ---------- */
/* Centre both children on the same axis. Relying on stretch put the table at
   the container's top while the brace was centred, and the container measured
   20px taller than either child, so the brace hung low by half that. */
#doc .cases{ display:inline-flex; align-items:center; gap:8px; line-height:0 }
#doc .cases .brace{ flex:0 0 auto; display:block; overflow:visible }
#doc .cases table{ line-height:normal }
#doc .cases table{ border-collapse:collapse; width:auto; margin:0 }
#doc .cases table td,
#doc .cases tbody tr td,
#doc .cases tbody tr:last-child td{
  height:30px; padding:0 0 0 2px; border:0; background:none;
  vertical-align:middle; white-space:nowrap; text-align:left;
  font-variant-numeric:normal;
}
#doc .cases td.cval{ padding-right:22px }
#doc .cases td.ccond{ color:var(--ink-soft) }

/* ---------- figures ---------- */
#doc figure.fig{
  margin:26px 0; padding:0; text-align:center;
  color:var(--ink);
}
#doc figure.fig svg{ margin:0 auto 6px }
#doc figure.fig figcaption{
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
  font-size:12px; line-height:1.45; color:var(--ink-soft);
  max-width:60ch; margin:4px auto 0; text-wrap:balance;
}
#doc img{
  display:block; margin:20px auto; max-width:100%; height:auto;
  background:#fff; padding:10px; border:1px solid var(--rule); border-radius:2px;
}

/* ---------- footer nav ---------- */
.pager{
  display:flex; gap:12px; justify-content:space-between; align-items:stretch;
  margin-top:52px; padding-top:22px; border-top:1px solid var(--rule);
}
.pager button{
  flex:1; text-align:left; background:var(--surface); border:1px solid var(--rule);
  padding:12px 16px; cursor:pointer; font-family:"IBM Plex Sans Condensed",sans-serif;
  color:var(--ink); font-size:15px; line-height:1.3;
}
.pager button:hover{border-color:var(--copper)}
.pager button:disabled{opacity:.35; cursor:default}
.pager button.next{text-align:right}
.pager span{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px}

.readbtn{
  display:inline-flex; align-items:center; gap:8px; margin-top:26px;
  background:none; border:1px solid var(--rule); color:var(--ink-soft);
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:13.5px;
  padding:8px 14px; cursor:pointer;
}
.readbtn:hover{border-color:var(--teal); color:var(--ink)}
.readbtn[aria-pressed="true"]{border-color:var(--teal); color:var(--teal); background:var(--teal-soft)}

/* ---------- mobile ---------- */
#mobsel{display:none}
@media (max-width:860px){
  body{grid-template-columns:1fr}
  #nav{display:none}
  #mobsel{
    display:block; position:sticky; top:0; z-index:5; background:var(--sidebar);
    border-bottom:1px solid var(--rule); padding:12px 18px;
  }
  #mobsel select{
    width:100%; font-family:"IBM Plex Sans Condensed",sans-serif; font-size:15px;
    padding:9px 10px; background:var(--surface); color:var(--ink);
    border:1px solid var(--rule); border-radius:2px;
  }
  .sheet{padding:28px 20px 72px}
  h2.doctitle{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<nav id="nav">
  <div class="brand">
    <h1>Solid State Electronics<br>Exam Companion</h1>
    <p>ELE 717 · The 50 PGD questions</p>
    <div class="dl" role="group" aria-label="Download the exam companion">
      <span class="dl-label">Download the exam companion</span>
      <div class="dl-row">
        <button class="dlbtn" data-fmt="docx">Word (.docx)</button>
        <button class="dlbtn" data-fmt="pdf">PDF</button>
      </div>
      <p class="dl-msg" aria-live="polite"></p>
    </div>
  </div>
  <ul class="modlist" id="modlist"></ul>
</nav>

<main>
  <div id="mobsel"><select id="sel" aria-label="Choose module"></select>
    <div class="dl dl-mob" role="group" aria-label="Download the exam companion">
      <div class="dl-row">
        <button class="dlbtn" data-fmt="docx">Download Word</button>
        <button class="dlbtn" data-fmt="pdf">Download PDF</button>
      </div>
      <p class="dl-msg" aria-live="polite"></p>
    </div>
  </div>
  <div class="sheet">
    <div class="wrap">
      <p class="eyebrow" id="eyebrow"></p>
      <h2 class="doctitle" id="doctitle"></h2>
      <div class="rule"></div>
      <article id="doc"></article>
      <button class="readbtn" id="readbtn" aria-pressed="false"></button>
      <div class="pager">
        <button id="prev"><span>Previous</span><b id="prevt"></b></button>
        <button id="next" class="next"><span>Next</span><b id="nextt"></b></button>
      </div>
    </div>
  </div>
</main>

<script>
/* ---- Mathematical typesetting -------------------------------------------
   Turns the plain-text notation used in the source files into real typographic
   subscripts and superscripts:

     a_x        -> a with subscript x
     E_t1       -> E with subscript t1
     e^{-jBz}   -> e with superscript -jBz
     r2 / 10-12 written with Unicode super/subscript characters is normalised
     to the same markup, so one mechanism handles everything.

   Runs after bold/italic and before code spans are restored, so code stays
   literal.                                                                  */

const SUP_CHARS = { "⁰":"0","¹":"1","²":"2","³":"3","⁴":"4",
  "⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9",
  "⁻":"−","⁺":"+","ⁿ":"n" };
const SUB_CHARS = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4",
  "₅":"5","₆":"6","₇":"7","₈":"8","₉":"9",
  "₋":"−","₊":"+","ₓ":"x","ᵧ":"y" };

const SUP_RE = /[⁰¹²³⁴-⁹⁺⁻ⁿ]+/g;
const SUB_RE = /[₀-₉₊₋ₓᵧ]+/g;

/* letters (incl. Greek), digits, and a leading sign are allowed in a bare run */
const RUN = "[A-Za-z0-9\\u0370-\\u03FF]";

function normaliseUnicodeScripts(s){
  s = s.replace(SUP_RE, m => "^{" + Array.from(m).map(c => SUP_CHARS[c]).join("") + "}");
  s = s.replace(SUB_RE, m => "_{" + Array.from(m).map(c => SUB_CHARS[c]).join("") + "}");
  return s;
}

/* Resolve marker{...} with brace counting, so a group may contain nested braces
   (Unicode normalisation injects them: e^{jω₀t} becomes e^{j_{0}t} first). */
function braced(s, marker, tag){
  let out = "", i = 0;
  for(;;){
    const j = s.indexOf(marker + "{", i);
    if(j < 0){ out += s.slice(i); return out; }
    out += s.slice(i, j);
    let depth = 0, k = j + 1;
    for(; k < s.length; k++){
      if(s[k] === "{") depth++;
      else if(s[k] === "}" && --depth === 0) break;
    }
    if(k >= s.length){ out += s.slice(j); return out; }   // unbalanced: leave alone
    out += "<" + tag + ">" + mathify(s.slice(j + 2, k)) + "</" + tag + ">";
    i = k + 1;
  }
}

function mathify(s){
  /* explicit groups first, recursing into their contents */
  s = braced(s, "^", "sup");
  s = braced(s, "_", "sub");
  /* then Unicode scripts, which become groups of their own */
  s = normaliseUnicodeScripts(s);
  s = braced(s, "^", "sup");
  s = braced(s, "_", "sub");
  /* finally bare runs: a_x, ^2 */
  s = s.replace(new RegExp("\\^(" + RUN + "+)", "g"), (m,c) => "<sup>" + c + "</sup>");
  /* A bare subscript run ends where the letter case changes or a Greek letter
     starts, so N_Dx_n reads N_D x_n and L_pN_D reads L_p N_D. Digits may follow
     anything (n_p0). Mixed-case subscripts such as E_{Fn} must be braced. */
  const kind = ch => /[0-9]/.test(ch) ? "d" : /[\u0370-\u03FF]/.test(ch) ? "g"
                   : ch === ch.toUpperCase() ? "U" : "L";
  s = s.replace(new RegExp("_("  + RUN + "+)", "g"), (m,c) => {
    const first = kind(c[0]);
    let k = 1;
    while (k < c.length) {
      const t = kind(c[k]);
      if (t === "d") { k++; continue; }
      if (t === "g" || first === "g" || first === "d" || t !== first) break;
      k++;
    }
    return "<sub>" + c.slice(0, k) + "</sub>" + c.slice(k);
  });
  return s;
}

/* ---- Matrices ------------------------------------------------------------
   ```matrix
   lhs: A x B  =
   style: det          (det = vertical bars, bracket = square brackets)
   a_x ; a_y ; a_z
   A_x ; A_y ; A_z
   ```                                                                       */
function matrixToHtml(body, esc){
  let lhs = "", style = "det";
  const rows = [];
  body.split("\n").forEach(line => {
    if(!line.trim()) return;
    const d = line.match(/^\s*(lhs|style)\s*:\s*(.*)$/i);
    if(d){ if(d[1].toLowerCase() === "lhs") lhs = d[2]; else style = d[2].trim(); return; }
    rows.push(line.split(";").map(c => c.trim()));
  });
  const body_ = rows.map(r =>
    "<tr>" + r.map(c => "<td>" + mathify(esc(c)) + "</td>").join("") + "</tr>").join("");
  return '<div class="eqrow">' +
      (lhs ? '<span class="eqlhs">' + mathify(esc(lhs)) + "</span>" : "") +
      '<span class="mat mat-' + (style === "bracket" ? "bracket" : "det") + '">' +
      "<table>" + body_ + "</table></span></div>";
}

/* ---- Piecewise definitions ------------------------------------------------
   ```cases
   lhs: u(t)  =
   1 ; t ≥ 0
   0 ; t < 0
   ```
   The brace is drawn to fit the row count exactly, rather than stretching one
   glyph, so the hooks keep their shape at any number of cases.               */
const CASE_ROW = 30;            /* must match #doc .cases td height in the CSS */

function brace(rows){
  const H = rows * CASE_ROW, m = H / 2, W = 11;
  const d = "M" + (W - 1) + ",1"
          + "C" + (W - 5) + ",1 " + (W - 6) + ",3 " + (W - 6) + ",6"
          + "L" + (W - 6) + "," + (m - 5)
          + "C" + (W - 6) + "," + (m - 2) + " " + (W - 8) + "," + m + " 1," + m
          + "C" + (W - 8) + "," + m + " " + (W - 6) + "," + (m + 2) + " " + (W - 6) + "," + (m + 5)
          + "L" + (W - 6) + "," + (H - 6)
          + "C" + (W - 6) + "," + (H - 3) + " " + (W - 5) + "," + (H - 1) + " " + (W - 1) + "," + (H - 1);
  return '<svg class="brace" width="' + W + '" height="' + H + '" '
       + 'viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">'
       + '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.3" '
       + 'stroke-linecap="round"/></svg>';
}

function casesToHtml(body, esc){
  let lhs = "";
  const rows = [];
  body.split("\n").forEach(line => {
    if(!line.trim()) return;
    const d = line.match(/^\s*lhs\s*:\s*(.*)$/i);
    if(d){ lhs = d[1]; return; }
    const parts = line.split(";");
    rows.push([parts[0] || "", parts.slice(1).join(";") || ""]);
  });
  const body_ = rows.map(r =>
      '<tr><td class="cval">' + mathify(esc(r[0].trim())) + '</td>'
    + '<td class="ccond">' + mathify(esc(r[1].trim())) + "</td></tr>").join("");
  return '<div class="eqrow">'
       + (lhs ? '<span class="eqlhs">' + mathify(esc(lhs)) + "</span>" : "")
       + '<span class="cases">' + brace(rows.length)
       + "<table>" + body_ + "</table></span></div>";
}

/* Minimal markdown renderer, inlined so the page has no external dependencies. */
function mdToHtml(src){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function inline(s){
    s = esc(s);
    const codes = [], figs = [];
    s = s.replace(/`([^`]+)`/g, function(m,c){ codes.push(c); return "\u0001" + (codes.length-1) + "\u0002"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    /* images: ![alt](src) — src is inlined as a data URI at build time */
    /* lazy alt so captions may contain brackets, e.g. "the sequence s[n]" */
    s = s.replace(/!\[([\s\S]*?)\]\(([^)\s]+)\)/g, function(m,alt,src){
      figs.push('<img src="' + src + '" alt="' + alt + '">');
      return "\u0005" + (figs.length-1) + "\u0006";
    });
    s = mathify(s);
    s = s.replace(/\u0005(\d+)\u0006/g, function(m,i){ return figs[+i]; });
    s = s.replace(/\u0001(\d+)\u0002/g, function(m,i){ return "<code>" + codes[+i] + "</code>"; });
    return s;
  }
  // Prose reflows; notation blocks (formula sheet, equation runs) keep their line breaks.
  function joinLines(arr){
    const mathy = arr.filter(x => /[=|⇒⟺→∮∫∇×·√]/.test(x)).length;
    const sep = (arr.length > 1 && mathy >= arr.length / 2) ? "<br>" : " ";
    // Join first, then parse inline markup, so **bold** spanning a source line
    // break is still closed correctly. \u0004 stands in for the join point.
    return inline(arr.join("\u0004")).split("\u0004").join(sep);
  }
  const lines = String(src).replace(/\r\n?/g,"\n").split("\n");
  const blank = l => !l.trim();
  const startsBlock = l =>
    /^#{1,6}\s/.test(l) || /^>\s?/.test(l) || /^```/.test(l) ||
    /^(---|\*\*\*|___)\s*$/.test(l) || /^\s*[-*]\s+/.test(l) ||
    /^\s*\d+\.\s+/.test(l) || /^\s*\|/.test(l) || /^ {4}\S/.test(l);
  const out = [];
  let i = 0;
  while(i < lines.length){
    const l = lines[i];
    if(blank(l)){ i++; continue; }

    if(/^```/.test(l)){
      const isMatrix = /^```\s*matrix\b/.test(l);
      const isFigure = /^```\s*figure\b/.test(l);
      const isCases  = /^```\s*cases\b/.test(l);
      i++; const buf = [];
      while(i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(isMatrix ? matrixToHtml(buf.join("\n"), esc)
             : isCases  ? casesToHtml(buf.join("\n"), esc)
             : isFigure ? buf.join("\n")          /* already HTML, built locally */
                        : "<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if(/^(---|\*\*\*|___)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }

    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; out.push("<h"+n+">" + inline(h[2]) + "</h"+n+">"); i++; continue; }

    if(/^\s*\|/.test(l) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      // "\\|" is an escaped pipe (e.g. |A| for magnitude), not a cell separator.
      const cells = r => r.trim().replace(/\\\|/g,"\u0003").replace(/^\|/,"").replace(/\|$/,"")
                          .split("|").map(c => c.trim().replace(/\u0003/g,"|"));
      const head = cells(l); i += 2; const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map(c => "<th>"+inline(c)+"</th>").join("") +
        "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>"+inline(c)+"</td>").join("") + "</tr>").join("") +
        "</tbody></table>");
      continue;
    }

    if(/^>\s?/.test(l)){
      const buf = [];
      while(i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,""));
      out.push("<blockquote>" + mdToHtml(buf.join("\n")) + "</blockquote>"); continue;
    }

    if(/^ {4}\S/.test(l)){
      const buf = [];
      while(i < lines.length && (/^ {4}/.test(lines[i]) ||
            (blank(lines[i]) && /^ {4}\S/.test(lines[i+1] || "")))){
        buf.push(lines[i].replace(/^ {4}/,"")); i++;
      }
      out.push('<div class="eq">' + mathify(esc(buf.join("\n"))) + "</div>"); continue;
    }

    if(/^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l)){
      const ordered = /^\s*\d+\.\s+/.test(l);
      const re = ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
      const items = [];
      while(i < lines.length && !blank(lines[i])){
        if(re.test(lines[i])){ items.push(lines[i].replace(re,"")); i++; }
        else if(/^\s+\S/.test(lines[i]) && items.length){ items[items.length-1] += "\n" + lines[i].trim(); i++; }
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push("<"+tag+">" + items.map(t => "<li>" + joinLines(t.split("\n")) + "</li>").join("") + "</"+tag+">");
      continue;
    }

    const buf = [];
    while(i < lines.length && !blank(lines[i]) && !startsBlock(lines[i])){ buf.push(lines[i]); i++; }
    if(!buf.length){ buf.push(lines[i]); i++; }
    out.push("<p>" + joinLines(buf) + "</p>");
  }
  return out.join("\n");
}

const MODS = [{"num": "00", "title": "Start Here", "body": "\nThis companion is built around one thing: the **50 PGD examination questions** for ELE 717 Solid State Electronics. Every question has a full model answer written the way you should write it in the exam, with the terms it uses defined, the marking points listed, the usual mistakes pointed out, and a variant question to test yourself.\n\nIt is separate from the week-by-week course. Use the weekly course to learn a topic properly; use this companion to turn that understanding into marks.\n\n## How each question is laid out\n\nEvery one of the 50 questions follows the same pattern, so you always know where to look:\n\n| Part | What it gives you |\n|---|---|\n| **Question type, topic, full notes** | Whether it is a definition, explanation, comparison, derivation or calculation, and which week of the weekly course teaches it in full. |\n| **What the examiner wants** | What the command word asks for and what a complete answer contains. |\n| **Key terms** | Every technical word the answer uses, defined in one line, so the question stands on its own. |\n| **Model answer** | A full-mark answer: numbered points, equations with every symbol explained, diagrams to draw, and for calculations the Given → Find → Formula → Solution → Answer → What this means layout. |\n| **Marking checklist** | The points a marker looks for. Compare your own answer against it, point by point. |\n| **Common mistakes** | The errors that lose marks on that question. |\n| **Remember it** | One sentence to fix the idea in your memory. |\n| **Try a variant** | A similar question the examiner could set instead, with a short answer. |\n\n## How to use it: three passes\n\n1. **Understand.** Read the model answer for a question, slowly, with the key terms. If something is still unclear, open the week named under \"Full notes\".\n2. **Write.** Cover the model answer. Write your own answer on paper, under exam conditions (about 1½ minutes per mark, or 15–20 minutes for a long question). Then mark it against the **marking checklist**. Every missing point is a mark you would have lost.\n3. **Recall.** In the last days, use the **Last-minute flashcards** page: one line per question. Then sit the **practice papers**, timed.\n\nTick each page as done with the button at the bottom; your progress is remembered in this browser.\n\n## Command words: what each one asks for\n\n| Command word | What to do | How much to write |\n|---|---|---|\n| **Define / What is** | Give the precise meaning in one or two sentences, with the symbol and unit if there is one. Add an example. | Short, exact |\n| **State** | Write the law or equation, with its symbols defined. No proof needed. | Short |\n| **Explain** | Say *why* or *how*: give the mechanism, step by step, with a diagram if it helps. | Medium to long |\n| **Describe** | Say *what happens*, in order (stages, procedure). | Medium |\n| **Distinguish / Differentiate** | Give the features of each, side by side. Finish with a table. | Medium |\n| **Compare** | Like distinguish, but cover similarities as well as differences, under the headings the question names. Finish with a table. | Medium to long |\n| **Derive** | Start from stated assumptions and known laws; number each step; end with the boxed result. | Long |\n| **Calculate / Determine** | Show the formula, the substitution with units, and the answer with its unit. | Short |\n\n## Exam technique that earns marks\n\n- **Define before you use.** Start long answers with one-line definitions of the key terms. Markers give marks for them, and it organises your answer.\n- **Every equation needs its symbols.** Write \"where n = electron concentration (cm⁻³), …\" under each equation. An equation with undefined symbols often scores half.\n- **Draw.** Band diagrams, profiles and I-V curves earn marks quickly. Label the axes, the levels (E_c, E_v, E_F) and the key quantities (qV_bi, W, Φ_B).\n- **Units, always.** Keep everything in centimetres (cm⁻³, cm²/V·s, V/cm, F/cm). The answer then comes out in A/cm², cm, V.\n- **Derivations: assumptions first.** List the assumptions, number the steps, put a box round the result. Even if you get stuck, the assumptions and the start earn marks.\n- **Comparisons: end with a table.** It is quick for the marker to check and shows you covered every heading.\n- **Say what the number means.** One sentence after a calculation (\"the field is low enough for v = μE to hold\") shows understanding.\n\n## Numbers you must know (silicon at 300 K)\n\n| Quantity | Value |\n|---|---|\n| Electronic charge q | 1.6×10⁻¹⁹ C |\n| Thermal voltage kT/q | 0.0259 V (kT = 0.0259 eV) |\n| Band gap E_g | 1.12 eV (Ge 0.66 eV, GaAs 1.42 eV) |\n| Intrinsic concentration n_i | 1×10¹⁰ cm⁻³ |\n| Effective densities of states N_c, N_v | 2.8×10¹⁹, 1.04×10¹⁹ cm⁻³ |\n| Mobilities μ_n, μ_p | 1350, 480 cm²/V·s |\n| Diffusion coefficients D_n, D_p | 35, 12.4 cm²/s |\n| Permittivity ε_s | 11.7ε₀ = 1.04×10⁻¹² F/cm |\n| Electron affinity χ | 4.05 eV |\n| Lattice constant a | 5.43 Å |\n| Saturation velocity v_sat | 1×10⁷ cm/s |\n\nThe **Formula and constants sheet** page has the full list.\n\n## Question map\n\nAll 50 questions, what kind of answer each needs, and where to find it. \"Full notes\" is the week of the weekly course that teaches the topic.\n\n| Q | Topic | Type | Page | Full notes |\n|---|---|---|---|---|\n| 1 | Semiconductor vs conductor and insulator | Define, explain | Questions 1–13 | Week 1 |\n| 2 | Elemental and compound semiconductors | Distinguish | Questions 1–13 | Week 1 |\n| 3 | Why silicon | Explain | Questions 1–13 | Week 1 |\n| 4 | Si, Ge and GaAs | Compare | Questions 1–13 | Week 1 |\n| 5 | Crystal lattice and structure | Define, explain | Questions 1–13 | Week 1 |\n| 6 | Miller indices | Define, explain | Questions 1–13 | Week 1 |\n| 7 | Miller indices of intercepts 2a, 3b, 1c | Calculation | Questions 1–13 | Week 1 |\n| 8 | Covalent, ionic and metallic bonding | Distinguish ³ | Calculation | Questions 22–34 | Weeks 4–5 |\n| 35 | Mobility and what affects it | Define, explain | Questions 35–46 | Week 7 |\n| 36 | Scattering mechanisms | Explain | Questions 35–46 | Week 7 |\n| 37 | Drift current density | Derive | Questions 35–46 | Week 7 |\n| 38 | Electron drift current density | Calculation | Questions 35–46 | Week 7 |\n| 39 | Diffusion current and Fick's law | Explain, state | Questions 35–46 | Week 7 |\n| 40 | Einstein relation | State, explain | Questions 35–46 | Week 7 |\n| 41 | Velocity saturation and hot carriers | Explain | Questions 35–46 | Week 8 |\n| 42 | Generation and recombination | Define | Questions 35–46 | Week 8 |\n| 43 | SRH recombination | Explain | Questions 35–46 | Week 8 |\n| 44 | Minority-carrier lifetime | Define, explain | Questions 35–46 | Week 8 |\n| 45 | Continuity equation | Explain | Questions 35–46 | Week 9 |\n| 46 | Surface recombination velocity | Define, explain | Questions 35–46 | Week 9 |\n| 47 | Depletion region and built-in potential | Explain | Questions 47–50 | Week 10 |\n| 48 | Shockley diode equation | Derive | Questions 47–50 | Week 10 |\n| 49 | Schottky diode vs ohmic contact | Distinguish | Questions 47–50 | Week 11 |\n| 50 | I-V and C-V characterisation | Explain | Questions 47–50 | Week 12 |\n\nThe five calculations (Q7, Q19, Q29, Q34, Q38) and the three derivations (Q27, Q37, Q48) are the most reliable marks in the paper: learn them until you can write them without looking.\n", "group": "", "eyebrow": "Orientation", "disp": "00"}, {"num": "01", "title": "Questions 1–13 — Material Physics and Semiconductor Growth", "body": "\nModule 1, part 1: what a semiconductor is, the main materials, crystal structure and Miller indices, bonding, and how silicon is purified and grown into crystals and epitaxial layers. Each question stands on its own: its key terms are defined with it, so you can start anywhere.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| Å | Ångström, a unit of length | 1 Å = 10⁻¹⁰ m = 0.1 nm |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| k (wave vector) | Wave vector, 2π/λ; measures the electron's momentum, p = ħk | m⁻¹ or cm⁻¹ |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| a | Lattice constant: edge length of the cubic unit cell | Å; Si 5.43, Ge and GaAs 5.65 |\n| (h k l), {h k l} | Miller indices of a plane; family of equivalent planes | integers |\n| [u v w], ⟨u v w⟩ | A crystal direction; family of equivalent directions | integers |\n| d_hkl | Spacing between neighbouring (h k l) planes, a/√(h² + k² + l²) | Å |\n| k₀ | Segregation coefficient, C_s/C_l at the freezing interface | dimensionless; B 0.8, P 0.35 |\n| C_s | Surface concentration of a diffusion (or solid concentration when freezing) | cm⁻³ |\n| C_l, C₀ | Concentration in the melt (liquid); C₀ at the start | cm⁻³ |\n| f (growth) | Fraction of the melt already solidified | 0 to 1 |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| α, β, γ (cell) | Angles between the edges of a unit cell | degrees; 90° for cubic |\n| v_pull | Pull rate of a Czochralski crystal | mm/min |\n| r (atom) | Atomic radius (hard-sphere model), half the nearest-neighbour distance | Å |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| GaN | Gallium nitride |\n| SiC | Silicon carbide |\n| InP | Indium phosphide |\n| GaP | Gallium phosphide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| FCC | Face-centred cubic lattice |\n| III–V | Compound of Group III and Group V elements (e.g. GaAs) |\n| MG-Si | Metallurgical-grade silicon (≈ 98 % pure) |\n| EG-Si | Electronic-grade silicon (99.9999999 % or better) |\n| CZ | Czochralski crystal growth |\n| FZ | Float-zone crystal growth |\n| CVD | Chemical vapour deposition |\n| VPE | Vapour-phase epitaxy |\n| LPE | Liquid-phase epitaxy |\n| MBE | Molecular-beam epitaxy |\n| MOCVD | Metal-organic chemical vapour deposition |\n| UHV | Ultra-high vacuum (≈ 10⁻¹⁰ Torr) |\n| RHEED | Reflection high-energy electron diffraction (counts atomic layers during MBE) |\n| MOS | Metal–oxide–semiconductor |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| CMOS | Complementary MOS (n- and p-channel MOSFETs together) |\n| MESFET | Metal–semiconductor field-effect transistor |\n| HEMT | High-electron-mobility transistor |\n| BJT | Bipolar junction transistor |\n| HBT | Heterojunction bipolar transistor |\n| IC | Integrated circuit |\n| VLSI | Very-large-scale integration |\n| LED | Light-emitting diode |\n| RF | Radio frequency |\n| IGBT | Insulated-gate bipolar transistor |\n| MEMS | Micro-electro-mechanical systems |\n| LCM | Lowest common multiple |\n| KOH | Potassium hydroxide (an anisotropic silicon etchant) |\n| VCSEL | Vertical-cavity surface-emitting laser |\n\n\n## Questions on this page\n\n| Q | Question |\n|---|---|\n| 1 | Define a semiconductor and explain how its electrical conductivity differs from that of a conductor and an insulator. |\n| 2 | Distinguish between elemental semiconductors and compound semiconductors, giving two examples of each. |\n| 3 | Explain why silicon is widely used in semiconductor device fabrication. |\n| 4 | Compare the properties and applications of silicon (Si), germanium (Ge), and gallium arsenide (GaAs). |\n| 5 | What is a crystal lattice? Explain the significance of crystal structure in semiconductor materials. |\n| 6 | Define Miller indices and explain how they are used to identify crystal planes. |\n| 7 | Determine the Miller indices of a crystal plane having intercepts of 2a, 3b, and 1c. |\n| 8 | Explain the difference between covalent, ionic, and metallic bonding and identify the dominant bonding mechanism in silicon. |\n| 9 | Describe the major stages involved in converting metallurgical-grade silicon (MG-Si) into electronic-grade silicon (EG-Si). |\n| 10 | Explain the principle and operation of the Czochralski (CZ) crystal growth method. |\n| 11 | State four advantages and two limitations of the Czochralski method. |\n| 12 | Explain the principles of vapour-phase epitaxy (VPE), liquid-phase epitaxy (LPE), and molecular-beam epitaxy (MBE). |\n| 13 | Compare VPE, LPE, and MBE in terms of growth mechanism, temperature, precision, and applications. |\n\n## Model answers\n\n### Q1. Define a semiconductor and explain how its electrical conductivity differs from that of a conductor and an insulator.\n\n> **Question type:** Definition and explanation · **Topic:** classification of solids by conductivity · **Full notes:** Week 1 (Introduction to Semiconductor Materials)\n\n**What the examiner wants.** First a precise definition of a semiconductor (conductivity between metals and insulators, and controllable). Then an explanation, using energy bands, of why the three classes of material conduct so differently, including how each responds to temperature. A labelled band sketch and a short comparison table earn the full marks.\n\n**Key terms.**\n\n- **Conductivity (σ):** how easily a material carries electric current, in S/cm; its inverse is resistivity ρ = 1/σ in Ω·cm.\n- **Energy band:** a wide range of closely spaced allowed electron energies formed when many atoms join into a solid.\n- **Valence band:** the highest band that is full at 0 K; it holds the electrons that form the bonds.\n- **Conduction band:** the band above the valence band; electrons in it are free to move and carry current.\n- **Band gap (E_g):** the forbidden energy range between the top of the valence band (E_v) and the bottom of the conduction band (E_c), E_g = E_c − E_v, in electron-volts (eV).\n- **Hole:** the empty place left in a bond when an electron is freed; it moves through the crystal like a positive charge.\n- **Doping:** adding a small, controlled amount of a chosen impurity to change the number of carriers.\n- **kT:** the typical thermal energy of a particle; 0.0259 eV at 300 K (k = Boltzmann's constant, T = absolute temperature).\n\n**Model answer.**\n\n**Definition.** A semiconductor is a material whose electrical conductivity lies between that of a conductor and an insulator (resistivity roughly 10⁻³ to 10⁸ Ω·cm) and can be changed over many orders of magnitude by temperature, light, electric field and, above all, by doping. Examples: silicon (Si), germanium (Ge), gallium arsenide (GaAs).\n\n**How conductivity depends on carriers.** Current is carried by mobile charges, so\n\n    σ = q(nμ_n + pμ_p)\n\nWhere:\n\n- σ = conductivity (S/cm)\n- q = electronic charge, 1.6×10⁻¹⁹ C\n- n, p = concentrations of free electrons and holes (cm⁻³)\n- μ_n, μ_p = electron and hole mobilities, i.e. drift speed per unit field (cm²/V·s)\n\nThe three classes differ mainly in **how many free carriers they have**, and that is decided by their energy-band structure.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 220\" role=\"img\" aria-label=\"Band diagrams of a metal with a partly filled band, a semiconductor with a small gap, and an insulator with a wide gap\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"100.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Metal</text><text x=\"300.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Semiconductor</text><text x=\"500.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Insulator</text><rect x=\"30.0\" y=\"70.0\" width=\"140.0\" height=\"110.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"30.0\" y=\"120.0\" width=\"140.0\" height=\"60.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"30.0\" y=\"70.0\" width=\"140.0\" height=\"110.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"24.0\" y1=\"120.0\" x2=\"176.0\" y2=\"120.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-dasharray=\"5 3\"/><text x=\"178.0\" y=\"124.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"100.0\" y=\"100.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">empty states</text><text x=\"100.0\" y=\"155.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">filled states</text><text x=\"100.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">partly filled band, no gap</text><rect x=\"230.0\" y=\"50.0\" width=\"140.0\" height=\"55.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"230.0\" y=\"135.0\" width=\"140.0\" height=\"55.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><circle cx=\"255.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"255.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"285.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"285.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"315.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"315.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"345.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"345.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"380.0\" y1=\"105.0\" x2=\"380.0\" y2=\"135.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.8\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><text x=\"385.0\" y=\"124.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan> ≈ 1 eV</text><text x=\"300.0\" y=\"72.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">conduction band</text><text x=\"300.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">valence band</text><text x=\"300.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">small gap, a few carriers</text><rect x=\"430.0\" y=\"40.0\" width=\"140.0\" height=\"40.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"430.0\" y=\"150.0\" width=\"140.0\" height=\"40.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"580.0\" y1=\"80.0\" x2=\"580.0\" y2=\"150.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.8\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><text x=\"585.0\" y=\"119.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan> &gt; 4 eV</text><text x=\"500.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">conduction band</text><text x=\"500.0\" y=\"174.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">valence band</text><text x=\"500.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">wide gap, no carriers</text><line x1=\"12.0\" y1=\"195.0\" x2=\"12.0\" y2=\"45.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-end=\"url(#ar)\"/><text x=\"18.0\" y=\"50.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;font-style:italic;\" opacity=\"1.0\">E</text></svg><figcaption>Energy bands of a metal, a semiconductor and an insulator at room temperature: no gap, a small gap, and a wide gap.</figcaption></figure>\n```\n\nSketch in the exam: three band diagrams side by side, label \"conduction band\", \"valence band\", \"E_g\", and show a few electrons above a small gap for the semiconductor.\n\n**1. Conductor (metal).** The valence and conduction bands overlap, or the top band is only partly filled, so there is no gap. About 10²² free electrons per cm³ are always present. Conductivity is very high (σ ≈ 10⁵–10⁶ S/cm; copper ρ = 1.7×10⁻⁶ Ω·cm) and is hardly changed by impurities. When temperature rises the number of electrons stays the same but lattice vibrations scatter them more, so conductivity **falls** (positive temperature coefficient of resistance).\n\n**2. Insulator.** The valence band is full and the conduction band empty, separated by a wide gap (E_g > about 4 eV; SiO₂ ≈ 9 eV). Room-temperature thermal energy (kT ≈ 0.026 eV) is far too small to lift electrons across, so there are practically no free carriers. Resistivity is very high (10¹⁰–10¹⁸ Ω·cm) and changes little with temperature under normal conditions.\n\n**3. Semiconductor.** The arrangement is the same as in an insulator (full valence band, empty conduction band at 0 K) but the gap is **small** (Si 1.12 eV, Ge 0.66 eV, GaAs 1.42 eV). At room temperature a small fraction of bonds is broken thermally: each freed electron enters the conduction band and leaves a hole in the valence band, so **both electrons and holes** conduct. Pure silicon has only n = p = n_i = 1×10¹⁰ cm⁻³ at 300 K, so its conductivity is low; but:\n\n- heating breaks more bonds (n_i rises roughly as e^{−E_g/2kT}), so conductivity **rises** with temperature (negative temperature coefficient of resistance);\n- doping with about one phosphorus atom per million Si atoms (5×10¹⁶ cm⁻³) raises the conductivity more than a million times.\n\n**Comparison.**\n\n| Property | Conductor | Semiconductor | Insulator |\n|---|---|---|---|\n| Band gap | None (bands overlap) | Small, ≈ 0.5–3.5 eV | Large, > 4 eV |\n| Free carriers | ≈ 10²² cm⁻³, fixed | Few, controllable; electrons **and** holes | Practically none |\n| Resistivity (Ω·cm) | ≈ 10⁻⁶ | ≈ 10⁻³ to 10⁸ | 10¹⁰ to 10¹⁸ |\n| Effect of heating | σ falls | σ rises | Very small |\n| Effect of impurities | Small | Very large | Small |\n| Examples | Cu, Al, Ag | Si, Ge, GaAs | Glass, SiO₂, rubber |\n\n**Conclusion.** Conductors have no gap and a fixed, huge number of carriers; insulators have a wide gap and essentially none; semiconductors have a small gap, two kinds of carrier, and a carrier density that we can engineer, which is what makes devices possible.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ definition: conductivity between conductor and insulator **and** controllable (doping, temperature, light)\n- ✓ at least two examples (Si, Ge, GaAs)\n- ✓ labelled band diagram for all three classes\n- ✓ conductor: overlapping bands, ≈ 10²² cm⁻³ electrons, σ falls with temperature\n- ✓ insulator: wide gap (> 4 eV, e.g. SiO₂ 9 eV), no carriers\n- ✓ semiconductor: small gap (Si 1.12 eV), electron–hole pairs created thermally, σ rises with temperature\n- ✓ effect of doping on a semiconductor (orders of magnitude)\n- ✓ typical resistivity ranges or a comparison table\n\n**Common mistakes.**\n\n- Defining a semiconductor only as \"conductivity between a conductor and an insulator\". The key word is *controllable*; without it you lose the main definition mark.\n- Saying a semiconductor conducts \"less when hot, like a metal\". It is the opposite: heating creates carriers, so σ rises.\n- Forgetting holes. Semiconductors have two carrier types; metals have only electrons.\n- Drawing the semiconductor band diagram with overlapping bands, or the metal with a gap.\n\n**Remember it.** \"No gap, small gap, big gap\": metal, semiconductor, insulator, and only the small gap can be tuned.\n\n**Try a variant.** Explain why the resistance of a silicon sample falls when it is heated, while that of a copper wire rises. *Answer:* In copper the number of free electrons (≈ 10²² cm⁻³) is fixed; heating only increases lattice vibrations, which scatter the electrons and lower their mobility, so resistance rises. In silicon heating breaks covalent bonds, creating electron–hole pairs; n_i grows roughly as e^{−E_g/2kT}, so the number of carriers rises far faster than the mobility falls, and resistance drops.\n\n---\n\n### Q2. Distinguish between elemental semiconductors and compound semiconductors, giving two examples of each.\n\n> **Question type:** Compare / distinguish · **Topic:** classes of semiconductor material · **Full notes:** Week 1 (Introduction to Semiconductor Materials)\n\n**What the examiner wants.** Define each class, then set them side by side under the same headings (composition, position in the periodic table, crystal structure, bonding, band gap, processing, uses). Two correct examples of each are compulsory marks. End with a comparison table.\n\n**Key terms.**\n\n- **Elemental semiconductor:** a semiconductor made of a single chemical element.\n- **Compound semiconductor:** a semiconductor made of two or more different elements in a fixed ratio.\n- **Group IV, III–V, II–VI:** columns of the periodic table; e.g. a III–V compound joins a group III element (Ga, In, Al) with a group V element (As, P, N).\n- **Band gap (E_g):** the energy (eV) needed to free an electron from a bond, i.e. to lift it from the valence band to the conduction band.\n- **Direct / indirect band gap:** direct means an electron can drop across the gap and emit light without changing its momentum; indirect means a lattice vibration (phonon) must also take part, so light emission is weak.\n- **Diamond cubic / zinc blende:** the crystal structures of Si and of GaAs; both have each atom bonded to four neighbours, but in zinc blende the two kinds of atom alternate.\n- **Stoichiometry:** the exact ratio of the elements in a compound (1 : 1 for GaAs).\n- **Band-gap engineering:** tuning E_g by alloying compounds, e.g. Al_{x}Ga_{1−x}As.\n\n**Model answer.**\n\n**Elemental semiconductors.** These consist of atoms of one element, all from group IV of the periodic table, each with four valence electrons. They crystallise in the diamond-cubic structure, where every atom forms four identical covalent bonds, so the bonding is purely covalent. Their band gap is fixed by the element, and both important ones are indirect.\n\n*Examples:* **silicon (Si)**, E_g = 1.12 eV; **germanium (Ge)**, E_g = 0.66 eV.\n\n**Compound semiconductors.** These are formed from two or more elements whose valence electrons average four per atom, for example a group III atom (3 electrons) with a group V atom (5 electrons). They crystallise in the zinc-blende (or wurtzite) structure. Because the two atoms have different electronegativities, the bonds are covalent with partial ionic character. Their band gap depends on the elements chosen and can be tuned continuously by alloying; many are direct-gap.\n\n*Examples:* **gallium arsenide (GaAs)**, III–V, E_g = 1.42 eV direct; **indium phosphide (InP)**, III–V. Others: gallium nitride (GaN, 3.4 eV), silicon carbide (SiC, IV–IV), cadmium telluride (CdTe, II–VI).\n\n**Main points of difference.**\n\n1. **Composition:** one element versus two or more elements in a fixed ratio.\n2. **Bonding:** purely covalent versus covalent with some ionic character.\n3. **Band gap:** fixed and indirect (Si, Ge) versus adjustable and often direct, so compounds can emit light.\n4. **Mobility:** compounds such as GaAs can have much higher electron mobility (≈ 8500 cm²/V·s against 1350 for Si), suiting very high frequencies.\n5. **Processing:** elemental crystals are easier to grow and dope, cheaper and more mature; compounds need careful control of stoichiometry, are more brittle, costly, and sometimes toxic (arsenic).\n6. **Applications:** elemental for integrated circuits, power devices and solar cells; compound for LEDs, lasers, microwave/RF and high-power wide-gap devices.\n\n**Comparison table.**\n\n| Feature | Elemental | Compound |\n|---|---|---|\n| Composition | One element | Two or more elements |\n| Periodic-table groups | Group IV | III–V, II–VI, IV–IV |\n| Crystal structure | Diamond cubic | Zinc blende or wurtzite |\n| Bonding | Purely covalent | Covalent, partly ionic |\n| Band gap | Fixed; Si and Ge indirect | Tunable by alloying; many direct |\n| Light emission | Very poor | Efficient (direct-gap ones) |\n| Cost and processing | Cheap, mature (especially Si) | Costly, stoichiometry must be controlled |\n| Typical uses | ICs, power devices, solar cells | LEDs, lasers, RF, high-power |\n| **Examples** | **Si, Ge** | **GaAs, InP** (also GaN, SiC, CdTe) |\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ definition of elemental (single element, group IV)\n- ✓ definition of compound (two or more elements, e.g. III–V)\n- ✓ two elemental examples: Si, Ge\n- ✓ two compound examples, e.g. GaAs, InP (or GaN, SiC)\n- ✓ difference in bonding (purely covalent vs partly ionic)\n- ✓ difference in band gap (fixed/indirect vs tunable/often direct) and its consequence for light emission\n- ✓ difference in cost/processing and in applications\n- ✓ comparison table\n\n**Common mistakes.**\n\n- Giving SiO₂ or diamond as a \"compound semiconductor\". SiO₂ is an insulator; diamond is elemental (carbon).\n- Calling SiGe or SiC \"elemental\" because they contain silicon. They contain two elements, so they are compound (IV–IV).\n- Listing only examples with no actual point of difference. The question says *distinguish*: give at least four contrasting features.\n- Stating that all compound semiconductors are direct-gap. GaP and SiC are indirect.\n\n**Remember it.** \"One element, one gap; two elements, choose your gap.\"\n\n**Try a variant.** Classify the following as elemental or compound and state the group combination: Ge, GaN, CdTe, SiC. *Answer:* Ge, elemental (group IV); GaN, compound III–V; CdTe, compound II–VI; SiC, compound IV–IV.\n\n---\n\n### Q3. Explain why silicon is widely used in semiconductor device fabrication.\n\n> **Question type:** Explanation · **Topic:** properties of silicon · **Full notes:** Week 1 (Introduction to Semiconductor Materials)\n\n**What the examiner wants.** A list of distinct reasons, each explained in one or two sentences with a supporting fact or number (abundance, native oxide, band gap, crystal growth, doping, mechanical and thermal properties). Six or seven well-explained reasons, plus one limitation, make a full-mark answer.\n\n**Key terms.**\n\n- **Native oxide:** an oxide that grows directly on the material by heating it in oxygen or steam; for silicon it is silicon dioxide (SiO₂).\n- **Band gap (E_g):** the energy needed to free an electron from a bond; 1.12 eV for Si at 300 K.\n- **Intrinsic carrier concentration (n_i):** the number of electrons (equal to holes) per cm³ created by heat in pure material; 1×10¹⁰ cm⁻³ for Si at 300 K.\n- **Leakage current:** the small unwanted current through a reverse-biased junction, caused by thermally generated carriers.\n- **Czochralski (CZ) method:** growth of a large single crystal by slowly pulling a seed crystal from molten silicon.\n- **Interface trap density (D_it):** the number of unwanted electron states at the Si/SiO₂ boundary per cm² per eV.\n- **Dopant:** an impurity added on purpose to control conductivity, e.g. boron (B) or phosphorus (P).\n\n**Model answer.**\n\nSilicon is used for more than 90 % of all semiconductor devices because it combines the following advantages.\n\n**1. Abundant and cheap.** Silicon is about 28 % of the Earth's crust, in the form of SiO₂ (sand, quartz). The raw material costs little and the refining industry is enormous, so wafers are inexpensive.\n\n**2. An excellent native oxide.** Heating silicon in oxygen grows SiO₂, which is:\n\n- an excellent insulator (E_g ≈ 9 eV, breakdown field ≈ 10 MV/cm);\n- chemically stable and insoluble in water;\n- joined to silicon by a very clean interface (D_it ≈ 10¹⁰ cm⁻²eV⁻¹).\n\nIt is used as the MOSFET gate insulator, a mask against dopant diffusion, surface passivation, and isolation between devices. No other semiconductor has an oxide this good; this one property is why MOS technology and VLSI are built on silicon.\n\n**3. A well-suited band gap.** E_g = 1.12 eV is large enough to keep n_i small (1×10¹⁰ cm⁻³ at 300 K), so leakage is low and devices work up to about 150 °C (germanium, with 0.66 eV, fails above about 75 °C). It is also small enough that doped silicon conducts well.\n\n**4. Mature crystal growth.** Very large (300 mm diameter), highly pure (impurities below 1 part per billion) and nearly defect-free single crystals are grown routinely by the Czochralski method.\n\n**5. Easy, predictable doping.** Boron (p-type) and phosphorus, arsenic and antimony (n-type) can be introduced accurately by diffusion and ion implantation, using SiO₂ as a mask.\n\n**6. Good mechanical and thermal properties.** Silicon is hard and strong enough to be handled as thin wafers and conducts heat about three times better than GaAs, which helps remove heat from dense ICs and power devices.\n\n**7. Elemental and non-toxic.** As a single element it has no stoichiometry to control and no toxic constituents (unlike the arsenic in GaAs), which simplifies processing.\n\n**Limitation.** Silicon has an **indirect** band gap, so it emits light very poorly, and its electron mobility (1350 cm²/V·s) is lower than that of GaAs (≈ 8500). LEDs, lasers and the highest-frequency circuits therefore use compound semiconductors instead.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ abundance and low cost (sand, ≈ 28 % of crust)\n- ✓ stable native oxide SiO₂ and its uses (gate dielectric, mask, passivation)\n- ✓ band gap 1.12 eV: low leakage, operation to ≈ 150 °C (compared with Ge)\n- ✓ large, pure single crystals by the CZ method\n- ✓ controllable doping by diffusion and ion implantation\n- ✓ mechanical strength and thermal conductivity\n- ✓ one limitation (indirect gap, poor light emitter)\n\n**Common mistakes.**\n\n- Writing \"silicon has the highest mobility\". It does not; Ge and GaAs are higher. Silicon wins on oxide, cost and maturity, not speed.\n- Listing reasons without explaining them (\"good oxide\" alone earns little; say what the oxide is used for).\n- Forgetting the oxide altogether. It is the single most important reason and examiners expect it.\n\n**Remember it.** \"Sand, oxide, gap\": cheap sand, a perfect oxide, and a gap that is just right.\n\n**Try a variant.** Explain why gallium arsenide, not silicon, is used to make laser diodes. *Answer:* GaAs has a direct band gap of 1.42 eV, so an electron dropping from the conduction band to the valence band can give its energy out as a photon without needing a phonon; emission is efficient, at λ = 1.24/1.42 = 0.87 μm (infrared). Silicon's gap is indirect, so recombination needs a phonon as well and the energy is lost mainly as heat.\n\n---\n\n### Q4. Compare the properties and applications of silicon (Si), germanium (Ge), and gallium arsenide (GaAs).\n\n> **Question type:** Compare · **Topic:** Si, Ge and GaAs · **Full notes:** Week 1 (Introduction to Semiconductor Materials)\n\n**What the examiner wants.** A side-by-side comparison of the three materials under the same headings (type, structure, band gap and its nature, mobility, thermal behaviour, oxide, cost), a short explanation of what each difference means for devices, and the main applications of each. A comparison table is expected.\n\n**Key terms.**\n\n- **Band gap (E_g):** the energy (eV) between the top of the valence band and the bottom of the conduction band.\n- **Direct / indirect band gap:** direct means an electron can recombine and emit a photon without changing momentum (efficient light emission); indirect needs a lattice vibration (phonon) as well (poor emission).\n- **Electron mobility (μ_n):** drift velocity per unit electric field, cm²/V·s; higher mobility means faster devices.\n- **Intrinsic carrier concentration (n_i):** thermally generated electrons per cm³ in pure material; smaller for wider gaps.\n- **Diamond cubic / zinc blende:** crystal structures in which every atom has four tetrahedral neighbours; in zinc blende the neighbours are of the other element.\n- **HEMT / MESFET:** high-speed field-effect transistors made in GaAs for microwave circuits.\n- **SiGe HBT:** a fast bipolar transistor with a silicon–germanium base.\n\n**Model answer.**\n\n**Comparison of properties (300 K).**\n\n| Property | Si | Ge | GaAs |\n|---|---|---|---|\n| Type | Elemental (group IV) | Elemental (group IV) | Compound (III–V) |\n| Crystal structure | Diamond cubic | Diamond cubic | Zinc blende |\n| Lattice constant | 5.43 Å | 5.65 Å | 5.65 Å |\n| Bonding | Covalent | Covalent | Covalent, partly ionic |\n| Band gap | 1.12 eV | 0.66 eV | 1.42 eV |\n| Nature of gap | Indirect | Indirect | **Direct** |\n| Electron mobility (cm²/V·s) | 1350 | 3900 | 8500 |\n| Max. operating temperature | ≈ 150 °C | ≈ 75 °C | High (wide gap) |\n| Native oxide | Excellent (SiO₂) | Poor, water-soluble | None useful |\n| Light emission | Very poor | Very poor | Efficient |\n| Cost / maturity | Lowest, most mature | Higher | Highest; brittle, toxic As |\n\n**What the differences mean.**\n\n- **Band gap and temperature.** The order is Ge (0.66) < Si (1.12) < GaAs (1.42 eV). A wider gap gives a smaller n_i, so lower leakage current and a higher maximum working temperature. Germanium leaks most and fails first when hot; this is why silicon replaced it.\n- **Direct versus indirect.** Only GaAs is direct, so only GaAs emits light efficiently; the emitted wavelength is λ = 1.24/E_g = 1.24/1.42 = 0.87 μm (near infrared).\n- **Mobility and speed.** GaAs electrons are about six times faster than silicon's, and Ge about three times, so GaAs (and Ge) suit very high-frequency work. GaAs hole mobility is poor, however, which makes GaAs CMOS impractical.\n- **Oxide.** Only silicon has a stable, high-quality native oxide; this is why MOS transistors and very large-scale integration (VLSI) are silicon technologies.\n- **Cost and processing.** Si is the cheapest and most mature; Ge is costlier; GaAs is the most expensive, brittle, and contains toxic arsenic.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"E-k diagrams: in GaAs the band extrema line up at k equals zero; in silicon the conduction-band minimum is displaced in k\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"165.0\" y1=\"204.0\" x2=\"165.0\" y2=\"36.2\" style=\
