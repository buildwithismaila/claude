chor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">Si holes</text><line x1=\"70.0\" y1=\"63.0\" x2=\"450.0\" y2=\"63.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.45\" stroke-dasharray=\"2 3\"/><text x=\"74.7\" y=\"58.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">v<tspan dy=\"0.32em\" font-size=\"72%\">sat</tspan><tspan dy=\"-0.32em\">​</tspan> ≈ 10<tspan dy=\"-0.45em\" font-size=\"72%\">7</tspan><tspan dy=\"0.45em\">​</tspan> cm/s</text></svg><figcaption>Drift velocity against electric field: silicon carriers rise linearly then level off near 10⁷ cm/s; GaAs electrons peak near 2×10⁷ cm/s and then fall.</figcaption></figure>\n```\n\nSketch: v_d against E on log axes; a straight line of slope μ at low field bending over to a flat line at v_sat = 10⁷ cm/s; label the \"ohmic region (v = μE)\" and \"saturation region\".\n\n**Consequences.** In short-channel MOSFETs carriers travel at v_sat over most of the channel, so drain current becomes proportional to (V_GS − V_T) instead of (V_GS − V_T)², and the speed is limited to f_T ≈ v_sat/(2πL); for a channel length L = 100 nm this is about 160 GHz.\n\n#### Hot-carrier effects\n\nWhen the field is high, the carriers' average kinetic energy rises far above (3/2)kT; they are \"hot\", with an effective temperature T_e much higher than the lattice temperature. Hot carriers cause:\n\n1. **Impact ionisation and avalanche breakdown.** A carrier with energy above about 1.5E_g knocks an electron out of a bond, creating an electron–hole pair. The new carriers are also accelerated and do the same, giving avalanche multiplication and junction breakdown (used deliberately in avalanche photodiodes).\n2. **Hot-carrier injection into the gate oxide.** Near a MOSFET drain some electrons exceed the 3.1 eV Si/SiO₂ barrier, enter the oxide and are trapped or create interface traps. The threshold voltage drifts and transconductance falls over the device's life: a major reliability problem.\n3. **Substrate and gate currents.** Holes from impact ionisation flow into the substrate; this can forward-bias source junctions and trigger parasitic bipolar action or CMOS latch-up.\n4. **Velocity overshoot.** In very short channels carriers cross before scattering brings them to steady state, briefly exceeding v_sat.\n5. **Extra noise and light emission** from the hot-carrier region.\n\n**Cures:** lightly doped drain (LDD) structures to spread the voltage drop and lower the peak field, lower supply voltages, graded junctions, and hardened (nitrided) gate oxides.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ low field: v_d = μE, carriers near equilibrium\n- ✓ mechanism of saturation: optical-phonon emission (about 0.063 eV in Si)\n- ✓ v_sat ≈ 10⁷ cm/s for Si, with a sketch of v_d against E\n- ✓ GaAs peak and negative differential mobility (intervalley transfer)\n- ✓ definition of hot carriers (energy ≫ (3/2)kT, T_e ≫ T)\n- ✓ impact ionisation and avalanche breakdown\n- ✓ hot-carrier injection into the oxide and threshold-voltage drift\n- ✓ device consequences (short-channel MOSFET current, f_T) and cures (LDD)\n\n**Common mistakes.**\n\n- Saying carriers \"cannot go faster than v_sat because of relativity\" or \"because the mobility becomes zero\": the cause is optical-phonon emission, and μ is only *effectively* reduced.\n- Calling hot carriers \"carriers in a hot crystal\": the crystal can be at room temperature; only the carriers are hot.\n- Confusing v_sat (about 10⁷ cm/s, the high-field drift limit) with the thermal velocity (also about 10⁷ cm/s, random motion that carries no current).\n- Listing hot-carrier effects without device consequences or cures.\n\n**Remember it.** \"Push too hard and the lattice pushes back\": optical phonons cap the speed at 10⁷ cm/s, and the excess energy makes carriers hot enough to break bonds and burrow into the oxide.\n\n**Try a variant.** Using the Caughey–Thomas formula with β = 2, find the electron drift velocity in Si at E = 10⁴ V/cm and compare it with the low-field prediction (μ_n = 1350 cm²/V·s, v_sat = 10⁷ cm/s). *Answer:* μE = 1.35×10⁷ cm/s, so v_d = 1.35×10⁷/√(1 + 1.35²) = 1.35×10⁷/1.68 = **8.0×10⁶ cm/s**, about 40 % below the linear value of 1.35×10⁷ cm/s. The linear formula already fails at this field (the crossover field v_sat/μ_n is only 7.4×10³ V/cm).\n\n---\n\n### Q42. What is meant by generation and recombination of charge carriers?\n\n> **Question type:** Definition / explanation · **Topic:** generation and recombination · **Full notes:** Week 8 (High-Field Effects and Excess Carriers)\n\n**What the examiner wants.** \"What is meant by\" asks you to define both terms precisely, then show you understand them: name the mechanisms of each, state how they balance in equilibrium and what happens when they do not, and say why they matter in devices. A sketch of the recombination paths earns extra marks.\n\n**Key terms.**\n\n- **Conduction band / valence band:** the band of energies where electrons move freely / the band of energies occupied by the bonding electrons; they are separated by the band gap E_g (1.12 eV in Si).\n- **Electron–hole pair:** a free electron in the conduction band together with the empty state (hole) it left in the valence band.\n- **Generation rate (G):** number of electron–hole pairs created per unit volume per unit time (cm⁻³s⁻¹).\n- **Recombination rate (R):** number of electron–hole pairs destroyed per unit volume per unit time (cm⁻³s⁻¹).\n- **Trap:** a defect or impurity with an energy level inside the band gap that helps electrons and holes recombine.\n- **Thermal equilibrium:** no light, no applied voltage, steady temperature; then n₀p₀ = n_i².\n- **Minority-carrier lifetime (τ):** average time an excess minority carrier survives before it recombines.\n\n**Model answer.**\n\n#### Generation\n\nGeneration is any process that gives an electron enough energy to leave the valence band (or a level in the gap) and enter the conduction band, creating a free electron and a free hole. Its rate is G (cm⁻³s⁻¹). The mechanisms are:\n\n- **Thermal generation:** lattice vibrations (heat) supply the energy, either across the whole gap or in two steps through a trap level.\n- **Optical generation:** a photon with energy hν ≥ E_g is absorbed and creates a pair (photodiodes, solar cells).\n- **Impact ionisation:** a carrier accelerated by a strong field hits the lattice hard enough to break a bond (avalanche breakdown).\n- **Tunnelling (Zener) generation:** at very high fields an electron tunnels straight from the valence band to the conduction band.\n\n#### Recombination\n\nRecombination is the reverse: a conduction-band electron falls back into an empty valence-band state, so one electron and one hole disappear together. The energy released (about E_g) leaves as a photon, as heat (phonons, i.e. lattice vibrations), or as kinetic energy of a third carrier. Its rate is R (cm⁻³s⁻¹). The mechanisms are:\n\n- **Direct (band-to-band, radiative):** the electron drops straight across the gap and emits a photon; dominant in direct-gap materials such as GaAs (LEDs, lasers).\n- **Indirect (trap-assisted, Shockley–Read–Hall, SRH):** the electron drops in two steps via a trap level and gives off heat; dominant in silicon.\n- **Auger:** the energy is handed to a third carrier; important at very high carrier densities.\n- **Surface recombination:** SRH recombination through states at the surface.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 640 232\" role=\"img\" aria-label=\"Three recombination paths: direct band-to-band with photon emission, two-step recombination through a mid-gap trap, and Auger recombination giving energy to a third carrier\" style=\"width:640px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"20.0\" y1=\"50.0\" x2=\"600.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"20.0\" y1=\"170.0\" x2=\"600.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><rect x=\"20.0\" y=\"26.0\" width=\"580.0\" height=\"24.0\" rx=\"0\" style=\"fill:none;stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"20.0\" y=\"170.0\" width=\"580.0\" height=\"20.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><text x=\"606.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"606.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><circle cx=\"110.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"110.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"110.0\" y1=\"48.0\" x2=\"110.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><path d=\"M118,110 q6,-8 12,0 t12,0 t12,0 t12,0\" style=\"fill:none;stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-linejoin=\"round\" marker-end=\"url(#ars)\"/><text x=\"144.0\" y=\"100.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">hν ≈ E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"125.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">band-to-band (radiative)</text><text x=\"125.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">GaAs, LEDs, lasers</text><line x1=\"280.0\" y1=\"110.0\" x2=\"340.0\" y2=\"110.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2.4\" opacity=\"1.0\"/><text x=\"344.0\" y=\"114.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">t</tspan><tspan dy=\"-0.32em\">​</tspan></text><circle cx=\"296.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"324.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"296.0\" y1=\"48.0\" x2=\"296.0\" y2=\"106.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><line x1=\"324.0\" y1=\"114.0\" x2=\"324.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><text x=\"290.0\" y=\"84.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">1</text><text x=\"330.0\" y=\"146.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">2</text><text x=\"310.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">Shockley–Read–Hall (trap)</text><text x=\"310.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">Si; energy to phonons</text><circle cx=\"484.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"484.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"516.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><line x1=\"484.0\" y1=\"48.0\" x2=\"484.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><path d=\"M516,38 q4,-10 0,-18\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\" opacity=\"1.0\" stroke-linejoin=\"round\" marker-end=\"url(#ar)\"/><text x=\"522.0\" y=\"26.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">third carrier kicked up</text><text x=\"500.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">Auger</text><text x=\"500.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">high carrier density</text></svg><figcaption>The three recombination paths: band-to-band (photon emitted), trap-assisted SRH (two steps via a gap level, heat released) and Auger (energy passed to a third carrier).</figcaption></figure>\n```\n\nSketch in the exam: E_c and E_v as two horizontal lines, a short dashed trap level E_t near mid-gap; draw a straight downward arrow (band-to-band, label \"hν\"), a two-step arrow via E_t (label \"SRH, heat\") and an upward arrow from E_v to E_c (label \"generation\").\n\n#### Balance and imbalance\n\nIn thermal equilibrium thermal generation and recombination are equal, so the carrier densities stay constant:\n\n    G_th = R_th   and   n₀p₀ = n_i²\n\nWhere:\n\n- G_th, R_th = thermal generation and recombination rates (cm⁻³s⁻¹)\n- n₀, p₀ = equilibrium electron and hole concentrations (cm⁻³)\n- n_i = intrinsic carrier concentration, 1×10¹⁰ cm⁻³ in Si at 300 K\n\nWhen the balance is disturbed, the net rate U = R − G always acts to restore equilibrium:\n\n- **Excess carriers (np > n_i²)**, e.g. from light or forward bias: U > 0, net recombination.\n- **Carrier deficit (np < n_i²)**, e.g. in a reverse-biased depletion region: U < 0, net generation.\n\nFor low-level injection (excess much smaller than the majority density) in n-type material the net rate is proportional to the excess:\n\n    U = Δp/τ_p\n\nWhere:\n\n- U = net recombination rate (cm⁻³s⁻¹)\n- Δp = p − p₀ = excess hole (minority-carrier) concentration (cm⁻³)\n- τ_p = minority-carrier (hole) lifetime (s)\n\n#### Why it matters\n\nGeneration and recombination set the reverse leakage current of diodes, the photocurrent of solar cells and photodetectors, the light output of LEDs, the current gain of bipolar transistors and the switching speed of p-n junctions.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ generation defined as creation of electron–hole pairs, with rate G in cm⁻³s⁻¹\n- ✓ recombination defined as annihilation of a pair, energy released as photon, heat or to a third carrier\n- ✓ at least three generation mechanisms (thermal, optical hν ≥ E_g, impact ionisation, tunnelling)\n- ✓ the recombination mechanisms: direct, SRH (trap-assisted), Auger, surface\n- ✓ equilibrium G_th = R_th with n₀p₀ = n_i²\n- ✓ net recombination when np > n_i², net generation when np < n_i²\n- ✓ U = Δp/τ for low-level injection\n- ✓ labelled band diagram and one or two device examples\n\n**Common mistakes.**\n\n- Saying generation \"creates electrons\" only: generation across the gap always creates electrons and holes in pairs.\n- Writing that recombination stops in equilibrium: both processes continue at equal rates; only the *net* rate is zero.\n- Claiming direct recombination dominates in silicon: Si has an indirect gap, so trap-assisted (SRH) recombination dominates.\n- Forgetting the units: G, R and U are per unit volume per unit time (cm⁻³s⁻¹), not per second.\n\n**Remember it.** Generation makes pairs, recombination breaks pairs, and nature always pushes np back towards n_i².\n\n**Try a variant.** n-type silicon is uniformly illuminated, producing G_L = 1×10²⁰ cm⁻³s⁻¹ pairs, and the hole lifetime is 1 μs. Find the steady-state excess hole concentration. *Answer:* in steady state generation equals net recombination, G_L = Δp/τ_p, so Δp = G_Lτ_p = 10²⁰ × 10⁻⁶ = **1×10¹⁴ cm⁻³**.\n\n---\n\n### Q43. Explain the Shockley-Read-Hall (SRH) recombination mechanism.\n\n> **Question type:** Explanation · **Topic:** SRH (trap-assisted) recombination · **Full notes:** Week 8 (High-Field Effects and Excess Carriers)\n\n**What the examiner wants.** Explain how a trap level in the band gap helps an electron and a hole recombine: the four capture and emission processes, the SRH rate equation with every symbol defined, and what it tells us (mid-gap traps are most effective, lifetime ∝ 1/N_t, low-level and depletion-region limits). A labelled energy diagram and a device application complete the answer.\n\n**Key terms.**\n\n- **Trap (recombination centre):** a localised energy level E_t inside the band gap caused by a defect or impurity (Au, Fe, Cu, vacancies, dislocations); N_t is its density (cm⁻³).\n- **Capture cross-section (σ_n, σ_p):** the effective target area a trap presents to an electron or a hole (cm²).\n- **Thermal velocity (v_th):** the average random speed of carriers, about 1×10⁷ cm/s at 300 K.\n- **Capture / emission:** a trap taking a carrier from a band / giving a carrier back to a band.\n- **Intrinsic level (E_i):** the Fermi level of undoped material, close to mid-gap.\n- **Phonon:** a quantum of lattice vibration; the energy given to the lattice as heat.\n- **Low-level injection:** excess carrier density much smaller than the majority density.\n\n**Model answer.**\n\n#### 1. Principle\n\nIn an indirect-gap semiconductor such as silicon an electron cannot easily drop straight across the gap, because it would have to change its momentum and emit a photon at the same time. Instead it recombines in two smaller steps through a trap level E_t in the gap, a process analysed by Shockley, Read and Hall. The energy is released as heat (phonons), not light.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 640 232\" role=\"img\" aria-label=\"Three recombination paths: direct band-to-band with photon emission, two-step recombination through a mid-gap trap, and Auger recombination giving energy to a third carrier\" style=\"width:640px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"20.0\" y1=\"50.0\" x2=\"600.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"20.0\" y1=\"170.0\" x2=\"600.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><rect x=\"20.0\" y=\"26.0\" width=\"580.0\" height=\"24.0\" rx=\"0\" style=\"fill:none;stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"20.0\" y=\"170.0\" width=\"580.0\" height=\"20.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><text x=\"606.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"606.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><circle cx=\"110.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"110.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"110.0\" y1=\"48.0\" x2=\"110.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><path d=\"M118,110 q6,-8 12,0 t12,0 t12,0 t12,0\" style=\"fill:none;stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-linejoin=\"round\" marker-end=\"url(#ars)\"/><text x=\"144.0\" y=\"100.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">hν ≈ E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"125.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">band-to-band (radiative)</text><text x=\"125.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">GaAs, LEDs, lasers</text><line x1=\"280.0\" y1=\"110.0\" x2=\"340.0\" y2=\"110.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2.4\" opacity=\"1.0\"/><text x=\"344.0\" y=\"114.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">t</tspan><tspan dy=\"-0.32em\">​</tspan></text><circle cx=\"296.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"324.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"296.0\" y1=\"48.0\" x2=\"296.0\" y2=\"106.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><line x1=\"324.0\" y1=\"114.0\" x2=\"324.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><text x=\"290.0\" y=\"84.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">1</text><text x=\"330.0\" y=\"146.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">2</text><text x=\"310.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">Shockley–Read–Hall (trap)</text><text x=\"310.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">Si; energy to phonons</text><circle cx=\"484.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"484.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"516.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><line x1=\"484.0\" y1=\"48.0\" x2=\"484.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><path d=\"M516,38 q4,-10 0,-18\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\" opacity=\"1.0\" stroke-linejoin=\"round\" marker-end=\"url(#ar)\"/><text x=\"522.0\" y=\"26.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">third carrier kicked up</text><text x=\"500.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">Auger</text><text x=\"500.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">high carrier density</text></svg><figcaption>SRH recombination (middle) uses a trap level in the gap as a stepping stone; band-to-band and Auger recombination are shown for comparison.</figcaption></figure>\n```\n\nSketch in the exam: E_c and E_v, a trap level E_t near mid-gap, and four arrows labelled (a) to (d) as in the table below.\n\n#### 2. The four processes at a trap\n\n| Process | What happens | Rate (cm⁻³s⁻¹) |\n|---|---|---|\n| (a) Electron capture | a conduction-band electron drops into an empty trap | r_a = σ_n v_th n N_t(1 − f_t) |\n| (b) Electron emission | a trapped electron is thermally lifted back to the conduction band | r_b = e_n N_t f_t |\n| (c) Hole capture | the trapped electron drops to the valence band and fills a hole | r_c = σ_p v_th p N_t f_t |\n| (d) Hole emission | a valence electron jumps into an empty trap, leaving a hole | r_d = e_p N_t(1 − f_t) |\n\nHere f_t is the probability that a trap is occupied by an electron, and e_n, e_p are emission coefficients (s⁻¹). **Recombination is (a) followed by (c); generation is (d) followed by (b).**\n\n#### 3. The SRH rate\n\nIn steady state the trap occupation does not change, so the net electron capture equals the net hole capture: r_a − r_b = r_c − r_d = U. Detailed balance in equilibrium gives e_n = σ_n v_th n₁ and e_p = σ_p v_th p₁. Solving for f_t and substituting gives the SRH net recombination rate:\n\n    U = (np − n_i²) / [ τ_p(n + n₁) + τ_n(p + p₁) ]\n\n    τ_n = 1/(σ_n v_th N_t),   τ_p = 1/(σ_p v_th N_t)\n\n    n₁ = n_i e^{(E_t − E_i)/kT},   p₁ = n_i e^{(E_i − E_t)/kT}\n\nWhere:\n\n- U = net recombination rate (cm⁻³s⁻¹); negative U means net generation\n- n, p = actual electron and hole concentrations (cm⁻³)\n- n_i = intrinsic carrier concentration, 1×10¹⁰ cm⁻³ in Si\n- τ_n, τ_p = electron and hole lifetimes (s)\n- σ_n, σ_p = capture cross-sections (cm²); v_th = thermal velocity (cm/s); N_t = trap density (cm⁻³)\n- n₁, p₁ = the electron and hole densities there would be if E_F were at E_t (cm⁻³)\n- E_t, E_i = trap level and intrinsic level (eV); kT = 0.0259 eV at 300 K\n\n#### 4. What the equation tells us\n\n- **Driving force (np − n_i²).** Positive with excess carriers (recombination), negative when carriers are depleted (generation), zero in equilibrium.\n- **Mid-gap traps are most effective.** If E_t is near a band edge, n₁ or p₁ becomes large, the denominator grows and U falls: a shallow trap just captures a carrier and re-emits it. Deep levels near E_i (such as gold in Si) are the efficient recombination centres.\n- **U ∝ N_t.** More traps mean shorter lifetime, τ = 1/(σv_thN_t).\n- **Low-level injection in n-type** (n ≫ p, n₁, p₁): U = Δp/τ_p. The rate is limited by the capture of the scarce minority carrier.\n- **Reverse-biased depletion region** (n, p ≈ 0, E_t = E_i): U = −n_i/(τ_n + τ_p) = −n_i/2τ₀ with τ₀ = τ_n = τ_p, a net generation that gives the generation leakage current J_gen = qn_iW/2τ₀ (W = depletion width). For W = 1 μm and τ₀ = 1 μs, J_gen = 1.6×10⁻¹⁹ × 10¹⁰ × 10⁻⁴/(2 × 10⁻⁶) = 8×10⁻⁸ A/cm².\n\n#### 5. Example and applications\n\nWith N_t = 1×10¹³ cm⁻³, σ_p = 1×10⁻¹⁵ cm² and v_th = 1×10⁷ cm/s: τ_p = 1/(10⁻¹⁵ × 10⁷ × 10¹³) = 1×10⁻⁵ s = 10 μs.\n\n- **Lifetime killing:** gold or platinum diffusion, or electron irradiation, adds mid-gap traps on purpose to cut τ to nanoseconds in fast-switching diodes and thyristors.\n- **Lifetime preservation:** clean processing and gettering remove traps to keep τ long in solar cells, CCD imagers and low-leakage devices.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ recombination through a trap level E_t in the gap, two steps, energy released as phonons\n- ✓ why it dominates in Si (indirect gap makes direct recombination unlikely)\n- ✓ the four processes (electron capture/emission, hole capture/emission) with a labelled diagram\n- ✓ SRH equation U = (np − n_i²)/[τ_p(n + n₁) + τ_n(p + p₁)] with symbols defined\n- ✓ τ = 1/(σv_thN_t)\n- ✓ mid-gap traps most effective; shallow traps ineffective\n- ✓ low-level limit U = Δp/τ_p; depletion-region generation −n_i/2τ₀\n- ✓ an application (gold doping for fast diodes, or gettering for long lifetime)\n\n**Common mistakes.**\n\n- Saying SRH emits light: the energy goes to the lattice as heat; photons come from band-to-band recombination.\n- Claiming the shallowest traps are the most effective: it is the deep, mid-gap traps.\n- Writing τ = σv_thN_t instead of its inverse: more traps must give a *shorter* lifetime.\n- Leaving out the generation case: the same equation with np < n_i² explains diode leakage current.\n\n**Remember it.** An electron crossing a wide river uses a stepping stone in the middle; stones near the banks are no help.\n\n**Try a variant.** n-type Si has N_D = 1×10¹⁵ cm⁻³ and τ_n = τ_p = 1 μs, but the traps lie 0.3 eV above E_i instead of at mid-gap. Find the effective low-level lifetime. *Answer:* n₁ = n_i e^{0.3/0.0259} = 10¹⁰ × e^{11.58} = 1.07×10¹⁵ cm⁻³ (p₁ ≈ 9×10⁴ cm⁻³ is negligible). With n ≈ N_D ≫ p, U ≈ Δp × N_D/[τ_p(N_D + n₁)], so τ_eff = τ_p(1 + n₁/N_D) = 1 μs × (1 + 1.07) ≈ **2.1 μs**: moving the trap 0.3 eV off mid-gap roughly halves its effectiveness.\n\n---\n\n### Q44. Define minority-carrier lifetime and explain its significance in semiconductor devices.\n\n> **Question type:** Definition and explanation · **Topic:** minority-carrier lifetime · **Full notes:** Week 8 (High-Field Effects and Excess Carriers)\n\n**What the examiner wants.** A precise definition (with the equation U = Δp/τ and the exponential decay), how lifetime depends on traps, and then a list of devices where lifetime controls performance, each with the reason. Quote a number (for example a diffusion length) to show depth.\n\n**Key terms.**\n\n- **Minority carrier:** the less numerous carrier type: holes in n-type, electrons in p-type material.\n- **Excess carrier concentration (Δp, Δn):** the carrier density above its equilibrium value, Δp = p − p₀ (cm⁻³).\n- **Low-level injection:** Δp much smaller than the majority-carrier density, so the majority density hardly changes.\n- **Recombination rate (U):** net number of electron–hole pairs destroyed per cm³ per second.\n- **Diffusion coefficient (D):** how quickly carriers spread by diffusion (cm²/s); D_p = 12.4 cm²/s for holes in Si.\n- **Diffusion length (L):** average distance a minority carrier diffuses before recombining, L = √(Dτ).\n- **Trap density (N_t):** concentration of recombination centres in the gap (cm⁻³).\n\n**Model answer.**\n\n#### Definition\n\nThe minority-carrier lifetime is the average time an excess minority carrier survives in a semiconductor before it recombines with a majority carrier. Under low-level injection it is defined by the recombination rate:\n\n    U = Δp/τ_p      (holes in n-type);   U = Δn/τ_n      (electrons in p-type)\n\nIf the source of excess carriers (for example light) is removed at t = 0, the excess decays exponentially:\n\n    Δp(t) = Δp(0) e^{−t/τ_p}\n\nWhere:\n\n- U = net recombination rate (cm⁻³s⁻¹)\n- Δp(t) = excess hole concentration at time t (cm⁻³); Δp(0) = its value at t = 0\n- τ_p, τ_n = hole and electron minority-carrier lifetimes (s)\n- t = time after the source is removed (s)\n\nSo τ is the time for the excess to fall to 1/e (37 %) of its starting value.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 195\" role=\"img\" aria-label=\"Excess carrier density held constant under illumination, then decaying exponentially after the light is switched off, reaching one over e after one lifetime\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=  y1=\"46.3\" x2=\"156.3\" y2=\"46.3\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"146.3\" y=\"50.3\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><polyline points=\"60.0,46.3 152.3,46.3\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><polyline points=\"152.3,46.3 154.2,50.0 156.2,53.6 158.1,57.2 160.0,60.6 161.9,63.9 163.8,67.1 165.8,70.2 167.7,73.2 169.6,76.1 171.5,78.9 173.5,81.7 175.4,84.3 177.3,86.9 179.2,89.4 181.2,91.8 183.1,94.2 185.0,96.4 186.9,98.6 188.8,100.8 190.8,102.8 192.7,104.8 194.6,106.8 196.5,108.7 198.5,110.5 200.4,112.3 202.3,114.0 204.2,115.6 206.2,117.3 208.1,118.8 210.0,120.3 211.9,121.8 213.8,123.2 215.8,124.6 217.7,125.9 219.6,127.2 221.5,128.5 223.5,129.7 225.4,130.9 227.3,132.0 229.2,133.1 231.2,134.2 233.1,135.2 235.0,136.2 236.9,137.2 238.8,138.2 240.8,139.1 242.7,140.0 244.6,140.8 246.5,141.7 248.5,142.5 250.4,143.3 252.3,144.0 254.2,144.8 256.2,145.5 258.1,146.2 260.0,146.8 261.9,147.5 263.8,148.1 265.8,148.7 267.7,149.3 269.6,149.9 271.5,150.5 273.5,151.0 275.4,151.5 277.3,152.0 279.2,152.5 281.2,153.0 283.1,153.5 285.0,153.9 286.9,154.3 288.8,154.8 290.8,155.2 292.7,155.6 294.6,155.9 296.5,156.3 298.5,156.7 300.4,157.0 302.3,157.4 304.2,157.7 306.2,158.0 308.1,158.3 310.0,158.6 311.9,158.9 313.8,159.2 315.8,159.5 317.7,159.7 319.6,160.0 321.5,160.2 323.5,160.5 325.4,160.7 327.3,160.9 329.2,161.1 331.2,161.3 333.1,161.5 335.0,161.7 336.9,161.9 338.8,162.1 340.8,162.3 342.7,162.5 344.6,162.7 346.5,162.8 348.5,163.0 350.4,163.1 352.3,163.3 354.2,163.4 356.2,163.6 358.1,163.7 360.0,163.8 361.9,164.0 363.8,164.1 365.8,164.2 367.7,164.3 369.6,164.4 371.5,164.5 373.5,164.7 375.4,164.8 377.3,164.9 379.2,165.0 381.2,165.0 383.1,165.1 385.0,165.2 386.9,165.3 388.8,165.4 390.8,165.5 392.7,165.6 394.6,165.6 396.5,165.7 398.5,165.8 400.4,165.8 402.3,165.9 404.2,166.0 406.2,166.0 408.1,166.1 410.0,166.2 411.9,166.2 413.8,166.3 415.8,166.3 417.7,166.4 419.6,166.4 421.5,166.5 423.5,166.5 425.4,166.6 427.3,166.6 429.2,166.6 431.2,166.7 433.1,166.7 435.0,166.8 436.9,166.8 438.8,166.8 440.8,166.9 442.7,166.9 444.6,166.9 446.5,167.0 448.5,167.0 450.4,167.0 452.3,167.1 454.2,167.1 456.2,167.1 458.1,167.2 460.0,167.2\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"213.8\" y1=\"168.0\" x2=\"213.8\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><line x1=\"152.3\" y1=\"123.2\" x2=\"213.8\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><text x=\"106.2\" y=\"63.3\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">light on</text><text x=\"106.2\" y=\"79.1\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Δp = Gτ<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"220.0\" y=\"119.2\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">1/e at t = τ<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text></svg><figcaption>Under steady light the excess holds at Δp = G<sub>L</sub>τ<sub>p</sub>; after the light is switched off it decays exponentially, falling to 1/e of its value in one lifetime τ<sub>p</sub>.</figcaption></figure>\n```\n\nSketch in the exam: Δp against t, flat at G_Lτ_p, then an exponential fall after \"light off\", with τ_p marked where the curve reaches 0.37 of the start.\n\n**What sets τ.** For trap-assisted (SRH) recombination, τ_p = 1/(σ_p v_th N_t), where σ_p is the trap capture cross-section (cm²), v_th ≈ 10⁷ cm/s the thermal velocity and N_t the trap density. Lifetime is inversely proportional to the trap density, so it is a sensitive measure of crystal purity: about 1 ns to 1 ms in silicon.\n\n#### Significance in devices\n\n1. **Diffusion length.** Carriers spread a distance L = √(Dτ) before recombining. For holes in Si with D_p = 12.4 cm²/s and τ_p = 1 μs, L_p = √(12.4 × 10⁻⁶) = 3.5×10⁻³ cm = 35 μm. L decides how thick device regions can be.\n2. **Diode current.** The saturation current J_s = qn_i²[D_p/(L_pN_D) + D_n/(L_nN_A)] depends on τ through L, and the depletion-region generation current qn_iW/2τ₀ is inversely proportional to τ. Short lifetime means more leakage.\n3. **Switching speed.** A forward-biased diode stores minority charge Q = Iτ, which must be removed before it can turn off, so the reverse-recovery time is of the order of τ. Fast-recovery diodes are gold- or platinum-doped to cut τ to nanoseconds.\n4. **Bipolar transistor gain.** Electrons injected into the base must cross it before recombining. The base transport factor is about 1 − W_B²/2L_n² (W_B = base width), so a long lifetime (L_n ≫ W_B) gives a high current gain β.\n5. **Solar cells and photodetectors.** Photogenerated carriers must diffuse to the junction before they recombine; a longer L collects more of them, raising photocurrent and efficiency.\n6. **LEDs and lasers.** The share of recombination that is radiative, and the maximum modulation speed (bandwidth roughly ∝ 1/τ), depend on lifetime.\n7. **Power devices.** In p-i-n diodes and IGBTs a long lifetime gives conductivity modulation and a low on-state voltage but slow turn-off: a design trade-off.\n8. **Material quality.** Because τ reacts strongly to metal contamination, it is measured (photoconductive decay) to monitor crystal growth and process cleanliness.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ definition: average time an excess minority carrier exists before recombining\n- ✓ U = Δp/τ_p under low-level injection\n- ✓ Δp(t) = Δp(0)e^{−t/τ}; τ is the 1/e time\n- ✓ τ = 1/(σv_thN_t): lifetime falls as trap density rises\n- ✓ L = √(Dτ) with a numerical example\n- ✓ at least four devices explained: diode leakage, switching speed, BJT gain, solar cells\n- ✓ the speed-versus-gain/efficiency trade-off (gold doping)\n\n**Common mistakes.**\n\n- Defining lifetime for majority carriers: it is the *minority* carriers whose excess decays with τ, because their relative change is large.\n- Saying \"long lifetime is always good\": it is good for gain and efficiency but bad for switching speed.\n- Writing L = Dτ instead of L = √(Dτ): check the unit, √(cm²/s × s) = cm.\n- Stating that τ is the time for all excess carriers to disappear: after one τ, 37 % are still there.\n\n**Remember it.** Lifetime is how long, diffusion length is how far: L = √(Dτ).\n\n**Try a variant.** Excess holes in n-type Si have τ_p = 1 μs. How long after the light is switched off does Δp fall to 10 % of its initial value? *Answer:* 0.1 = e^{−t/τ_p}, so t = τ_p ln 10 = 1 μs × 2.303 = **2.3 μs**.\n\n---\n\n### Q45. Explain the continuity equation for minority carriers and discuss its application to semiconductor devices.\n\n> **Question type:** Explanation with derivation · **Topic:** continuity equation · **Full notes:** Week 9 (Continuity Equation and Surface Phenomena)\n\n**What the examiner wants.** State the continuity equation as carrier conservation, derive it from a thin slab, reduce it to the minority-carrier diffusion equation with the assumptions stated, then show how it is solved and used in real devices (diode, BJT, solar cell, lifetime measurement). Standard solutions with their equations earn the \"discuss application\" marks.\n\n**Key terms.**\n\n- **Continuity equation:** a book-keeping statement that carriers are conserved: change = net inflow + generation − recombination.\n- **Current density (J_p, J_n):** hole and electron current per unit area (A/cm²).\n- **Drift and diffusion:** carrier motion driven by an electric field E, and by a concentration gradient.\n- **Excess carrier concentration (Δp):** p − p₀, the density above equilibrium (cm⁻³).\n- **Quasi-neutral region:** a region outside the depletion layer where the net charge, and so the field, is nearly zero.\n- **Lifetime (τ_p):** average survival time of an excess minority carrier (s).\n- **Diffusion length (L_p):** L_p = √(D_pτ_p), how far minority carriers travel before recombining (cm).\n\n**Model answer.**\n\n#### 1. Statement\n\nIn any small volume, the rate at which the carrier density increases equals the net inflow due to current, plus generation, minus recombination. In one dimension:\n\n    ∂p/∂t = −(1/q) ∂J_p/∂x + G_p − R_p\n\n    ∂n/∂t = +(1/q) ∂J_n/∂x + G_n − R_n\n\nWhere:\n\n- p, n = hole and electron concentrations (cm⁻³); t = time (s); x = position (cm)\n- J_p, J_n = hole and electron current densities (A/cm²)\n- q = electronic charge, 1.6×10⁻¹⁹ C\n- G_p, G_n = generation rates; R_p, R_n = recombination rates (cm⁻³s⁻¹)\n\nThe signs differ because electrons carry negative charge: electron flow is opposite to J_n.\n\n#### 2. Derivation (holes)\n\nTake a slab of area A between x and x + dx.\n\n- Holes flowing in at x per second: J_p(x)A/q. Holes flowing out at x + dx: J_p(x + dx)A/q.\n- Holes created per second: G_pA dx; holes lost: R_pA dx.\n- Rate of change of the number in the slab: (∂p/∂t)A dx = (1/q)[J_p(x) − J_p(x + dx)]A + (G_p − R_p)A dx.\n- Using J_p(x + dx) − J_p(x) = (∂J_p/∂x)dx and dividing by A dx gives the hole equation above.\n\n#### 3. Minority-carrier diffusion equation\n\nFor holes in uniformly doped n-type material, substitute the current J_p = qμ_ppE − qD_p ∂p/∂x and, for low-level injection, R_p − G_th = Δp/τ_p, with G_L the extra generation by light. Assume:\n\n- low-level injection (Δp ≪ n₀), so recombination is Δp/τ_p;\n- a quasi-neutral region, so E ≈ 0 and drift is negligible;\n- uniform doping, so p₀ does not vary with x.\n\nThen:\n\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − Δp/τ_p + G_L\n\nWhere:\n\n- D_p = hole diffusion coefficient (cm²/s), 12.4 cm²/s in Si\n- τ_p = hole (minority-carrier) lifetime (s)\n- G_L = generation rate by light (cm⁻³s⁻¹)\n\n**This is the minority-carrier diffusion equation.** For electrons in p-type: ∂Δn/∂t = D_n ∂²Δn/∂x² − Δn/τ_n + G_L. Each term has a meaning: diffusion spreads carriers, recombination removes them, light creates them.\n\n#### 4. Standard solutions and applications\n\n- **Uniform light switched off (photoconductive decay):** no x-dependence and G_L = 0 give Δp(t) = Δp(0)e^{−t/τ_p}. Measuring the fall in conductivity gives the lifetime.\n- **Steady uniform light:** ∂/∂t = 0 and no gradient give Δp = G_Lτ_p (photoconductors, light-dependent resistors).\n- **p-n junction diode (long neutral region):** steady state, no light: D_p d²Δp/dx² = Δp/τ_p gives Δp(x) = Δp(0)e^{−x/L_p}. The diffusion current at the depletion edge, J_p = qD_pΔp(0)/L_p, leads to the Shockley diode equation.\n- **Bipolar transistor (short base, W_B ≪ L_n):** recombination is negligible, the profile is almost a straight line, and its slope gives the collector current; the small recombination loss gives the base transport factor and current gain.\n- **Solar cells and photodiodes:** with G_L(x) = G₀e^{−αx} (α = absorption coefficient) the solution gives the collected photocurrent and shows that L must be longer than the absorption depth 1/α.\n- **Haynes–Shockley experiment:** a pulse of injected carriers drifts and spreads as a moving Gaussian; its speed gives μ_p, its spreading gives D_p, its shrinking area gives τ_p, confirming the Einstein relation.\n- **Switching transients:** the time-dependent equation gives the stored charge and the reverse-recovery time of diodes.\n- **Device simulation:** with Poisson's equation and the current equations, the continuity equations are solved numerically in every TCAD simulator.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 195\" role=\"img\" aria-label=\"Steady-state excess minority-carrier density decaying exponentially from the injection point with characteristic length L_p\" style=\"wid 3 307.5,162.5 310.0,162.7 312.5,162.8 315.0,163.0 317.5,163.1 320.0,163.3 322.5,163.4 325.0,163.6 327.5,163.7 330.0,163.8 332.5,164.0 335.0,164.1 337.5,164.2 340.0,164.3 342.5,164.4 345.0,164.5 347.5,164.7 350.0,164.8 352.5,164.9 355.0,165.0 357.5,165.0 360.0,165.1 362.5,165.2 365.0,165.3 367.5,165.4 370.0,165.5 372.5,165.6 375.0,165.6 377.5,165.7 380.0,165.8 382.5,165.8 385.0,165.9 387.5,166.0 390.0,166.0 392.5,166.1 395.0,166.2 397.5,166.2 400.0,166.3 402.5,166.3 405.0,166.4 407.5,166.4 410.0,166.5 412.5,166.5 415.0,166.6 417.5,166.6 420.0,166.6 422.5,166.7 425.0,166.7 427.5,166.8 430.0,166.8 432.5,166.8 435.0,166.9 437.5,166.9 440.0,166.9 442.5,167.0 445.0,167.0 447.5,167.0 450.0,167.1 452.5,167.1 455.0,167.1 457.5,167.2 460.0,167.2\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"140.0\" y1=\"168.0\" x2=\"140.0\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><line x1=\"60.0\" y1=\"123.2\" x2=\"140.0\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><text x=\"148.0\" y=\"119.2\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Δp falls to 1/e at x = L<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan> = √(D<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan>τ<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan>)</text></svg><figcaption>Steady-state solution for holes injected at x = 0 into a long n-type bar: the excess decays exponentially with characteristic length L<sub>p</sub>.</figcaption></figure>\n```\n\nSketch in the exam: Δp against x, starting at Δp(0) and decaying exponentially; mark L_p where it has fallen to 0.37 Δp(0).\n\n**Worked number.** Holes injected into a long n-type Si bar with Δp(0) = 1×10¹⁴ cm⁻³, D_p = 12.4 cm²/s, τ_p = 1 μs: L_p = √(12.4 × 10⁻⁶) = 35.2 μm, and J_p(0) = qD_pΔp(0)/L_p = 1.6×10⁻¹⁹ × 12.4 × 10¹⁴/3.52×10⁻³ = 5.6×10⁻² A/cm² = 56 mA/cm².\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ physical statement: conservation of carriers (inflow + generation − recombination)\n- ✓ ∂p/∂t = −(1/q)∂J_p/∂x + G − R and the electron form with the opposite sign\n- ✓ slab derivation\n- ✓ assumptions stated (low-level injection, E ≈ 0, uniform doping)\n- ✓ minority-carrier diffusion equation ∂Δp/∂t = D_p∂²Δp/∂x² − Δp/τ_p + G_L\n- ✓ standard solutions: e^{−t/τ}, G_Lτ, e^{−x/L_p}, linear profile in a short region\n- ✓ at least three device applications (diode, BJT, solar cell, lifetime measurement)\n- ✓ L_p = √(D_pτ_p) defined\n\n**Common mistakes.**\n\n- Getting the sign of the current term wrong for electrons: it is +(1/q)∂J_n/∂x because electrons are negative.\n- Dropping the drift term without saying why: state that the region is quasi-neutral (E ≈ 0).\n- Writing the recombination term as Δp × τ_p instead of Δp/τ_p.\n- Using the long-region exponential for a narrow BJT base: when W ≪ L the profile is a straight line.\n\n**Remember it.** \"What comes in, plus what is made, minus what dies, is what piles up.\"\n\n**Try a variant.** For the same bar (Δp(0) = 1×10¹⁴ cm⁻³, L_p = 35.2 μm), find the excess hole concentration at x = 2L_p. *Answer:* Δp = Δp(0)e^{−2} = 10¹⁴ × 0.135 = **1.35×10¹³ cm⁻³**: after two diffusion lengths only 13.5 % of the injected holes remain.\n\n---\n\n### Q46. What is surface recombination velocity? Explain how semiconductor surface states affect carrier lifetime.\n\n> **Question type:** Definition and explanation · **Topic:** surface recombination · **Full notes:** Week 9 (Continuity Equation and Surface Phenomena)\n\n**What the examiner wants.** Define S with its equation and unit, explain where surface states come from, then explain how they lower the effective lifetime, with the τ_eff formula and its limit of validity. A short number example and the ways of reducing S (passivation) complete a full-mark answer.\n\n**Key terms.**\n\n- **Surface states:** localised energy levels in the band gap at a surface, caused by broken (dangling) bonds, adsorbed atoms and oxide defects.\n- **Dangling bond:** an unpaired bond left on a surface atom because the crystal ends there.\n- **Surface recombination velocity (S):** the rate of recombination per unit area divided by the excess minority density at the surface (cm/s).\n- **Bulk lifetime (τ_bulk):** the lifetime set by recombination inside the volume alone (s).\n- **Effective lifetime (τ_eff):** the lifetime actually measured, including both bulk and surface losses (s).\n- **Diffusion coefficient (D):** how fast minority carriers spread by diffusion (cm²/s); D_p = 12 cm²/s for holes is used below.\n- **Passivation:** treating a surface so that it has few active surface states.\n\n**Model answer.**\n\n#### 1. Surface recombination velocity\n\nAt a surface, recombination takes place in a very thin layer, so it is counted per unit area rather than per unit volume:\n\n    U_s = S Δp_s\n\nWhere:\n\n- U_s = surface recombination rate (cm⁻²s⁻¹)\n- S = surface recombination velocity (cm/s)\n- Δp_s = excess minority-carrier (hole) concentration at the surface (cm⁻³)\n\nS has the units of a velocity: it is the effective speed at which excess carriers flow into the surface and are annihilated. For surface traps of density N_st (cm⁻²) with capture cross-section σ_p (cm²):\n\n    S = σ_p v_th N_st\n\nwith v_th ≈ 1×10⁷ cm/s the thermal velocity. S appears in the diffusion equation as a boundary condition at the surface: carriers arriving by diffusion equal carriers recombining there, D_p dΔp/dx = SΔp_s.\n\n- S = 0: an ideal surface, no recombination.\n- S → ∞: every arriving carrier recombines, Δp_s = 0 (like an Ohmic contact).\n- Typical values: bare Si 10⁴–10⁶ cm/s; thermally oxidised Si 10–10³ cm/s; well-passivated Si below 10 cm/s.\n\n#### 2. Origin of surface states\n\nThe periodic crystal ends at the surface. Surface atoms have dangling bonds; there are also adsorbed impurities, oxide defects and contamination. Together they create a high density of localised levels spread through the band gap, many near mid-gap, which are exactly the levels that make efficient Shockley–Read–Hall (SRH, trap-assisted) recombination centres.\n\n#### 3. How surface states affect lifetime\n\n- **An extra recombination path.** Carriers that reach the surface recombine there quickly, so the measured lifetime is shorter than the bulk lifetime. The rates add:\n\n    1/τ_eff = 1/τ_bulk + 1/τ_surface\n\n- **Small S (SW/2D ≪ 1).** Carriers reach the surfaces easily and the excess is nearly uniform across a wafer of thickness W with both faces recombining, so 1/τ_surface = 2S/W.\n- **Large S (diffusion limit).** The surfaces swallow carriers faster than diffusion can bring them, so the loss is limited by the time to diffuse to a surface. A good approximation for any S is:\n\n    τ_surface ≈ W/(2S) + W²/(π²D)\n\nWhere:\n\n- τ_eff, τ_bulk, τ_surface = effective, bulk and surface-limited lifetimes (s)\n- W = wafer thickness (cm)\n- D = minority-carrier diffusion coefficient (cm²/s)\n- W/(2S) = time for the surfaces to remove carriers once they arrive; W²/(π²D) = time for carriers to diffuse to the surfaces, the shortest τ_surface can ever be\n\nFor small S the first term dominates and the formula reduces to 1/τ_surface = 2S/W.\n\n- **Depletion of carriers near the surface.** Δp falls towards the surface, and the gradient keeps pulling carriers there, so even carriers generated deep inside are lost.\n- **Surface band bending.** Charge in surface states bends the bands. Under depletion, electron and hole densities near the surface become similar, which maximises SRH recombination and generation.\n- **Leakage, noise and instability.** Surface generation adds to junction leakage where the junction meets the surface; trapping and release of carriers gives 1/f noise; charged states shift MOS threshold voltages.\n- **Device performance.** High S lowers solar-cell efficiency (especially for blue light absorbed near the surface), lowers BJT gain through recombination at the emitter edge, and weakens photodetector response.\n\n#### 4. Worked example\n\n**Given:** n-type Si wafer, W = 300 μm = 0.03 cm, τ_bulk = 100 μs, D_p = 12 cm²/s; oxidised faces S = 100 cm/s; bare faces S = 10⁵ cm/s.\n\n**Find:** τ_eff in each case.\n\n**Solution.**\n\nStep 1. Oxidised: SW/2D = 100 × 0.03/24 = 0.13 (small), so the simple formula applies.\n\n    1/τ_eff = 1/10⁻⁴ + 2 × 100/0.03 = 1.0×10⁴ + 6.7×10³ = 1.67×10⁴ s⁻¹   ⇒   τ_eff = 60 μs\n\nStep 2. Bare: SW/2D = 10⁵ × 0.03/24 = 125 (not small), so use the full form. W/(2S) = 0.15 μs; W²/(π²D) = (0.03)²/(9.87 × 12) = 7.6 μs; τ_surface ≈ 7.75 μs.\n\n    1/τ_eff = 1/100 μs + 1/7.75 μs   ⇒   τ_eff ≈ 7.2 μs\n\n**Answer:** **τ_eff = 60 μs (oxidised) and about 7.2 μs (bare).** The simple formula would wrongly give 0.15 μs for the bare wafer.\n\n**What this means:** a good oxide keeps most of the bulk lifetime; with bare surfaces the surfaces control the lifetime, and the loss is then limited by how fast holes can diffuse 150 μm to the nearest face.\n\n#### 5. Reducing surface recombination (passivation)\n\n- Thermal SiO₂ followed by a forming-gas (H₂) anneal, which ties up dangling bonds.\n- Silicon nitride or Al₂O₃ films whose fixed charge repels minority carriers (field-effect passivation).\n- A heavily doped surface layer (back-surface field) that keeps minority carriers away from the surface.\n- Clean, damage-free surface preparation.\n\nSketch in the exam: Δp against x across a wafer, flat-topped for small S and dropping towards both faces for large S; label the faces \"S\".\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ U_s = SΔp_s with S in cm/s, and S = σ_pv_thN_st\n- ✓ boundary condition D_p dΔp/dx = SΔp_s; limits S = 0 and S → ∞\n- ✓ origin of surface states: dangling bonds, adsorbates, oxide defects, levels near mid-gap\n- ✓ 1/τ_eff = 1/τ_bulk + 1/τ_surface\n- ✓ 1/τ_surface = 2S/W only when SW/2D ≪ 1; diffusion limit τ_surface ≈ W/(2S) + W²/(π²D) for large S\n- ✓ band bending and leakage/noise effects\n- ✓ a numerical example or typical values of S\n- ✓ passivation methods\n\n**Common mistakes.**\n\n- Using 1/τ_eff = 1/τ_bulk + 2S/W for a bare surface: when SW/2D is large it predicts absurdly short lifetimes; diffusion to the surface sets the limit W²/(π²D).\n- Giving S the unit s⁻¹ or cm⁻²s⁻¹: S is a velocity, cm/s; U_s is the per-area rate.\n- Adding lifetimes instead of rates: it is the *inverses* (1/τ) that add.\n- Treating surface states as single levels near the band edges: they are spread through the gap, with many near mid-gap, which is why they recombine so well.\n\n**Remember it.** The surface is a carrier trapdoor: S says how wide it opens, diffusion says how fast carriers can reach it.\n\n**Try a variant.** Repeat the 300 μm wafer (τ_bulk = 100 μs, D_p = 12 cm²/s) for a poorly passivated surface with S = 10⁴ cm/s. *Answer:* SW/2D = 10⁴ × 0.03/24 = 12.5, not small. τ_surface ≈ 0.03/(2 × 10⁴) + 7.6 μs = 1.5 μs + 7.6 μs = 9.1 μs; 1/τ_eff = 1/100 + 1/9.1 (μs⁻¹), so **τ_eff ≈ 8.3 μs** (the simple formula would wrongly give 1.5 μs).\n", "group": "The 50 questions, answered", "eyebrow": "The 50 questions, answered", "disp": "·"}, {"num": "05", "title": "Questions 47–50 — Junctions, Interfaces and Characterisation", "body": "\nModule 4: the p-n junction and its diode equation, metal–semiconductor contacts, and how devices are measured with I-V and C-V characterisation. These are long questions: practise writing them in full. Each question stands on its own: its key terms are defined with it, so you can start anywhere.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| p_n0, n_p0 | Equilibrium minority concentrations: holes on the n side, electrons on the p side | cm⁻³; p_n0 = n_i²/N_D |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| N_D⁺, N_A⁻ | Concentrations of ionised donors and acceptors | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| R_s | Sheet resistance (or diode series resistance in Week 12) | Ω/□ (ohms per square); Ω |\n| E (field) | Electric field (on band diagrams, E is energy instead) | V/cm |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| G, G_L | Generation rate of electron–hole pairs (G_L: by light) | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| V, V_a | Applied voltage (positive for forward bias) | V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| x_n, x_p | Parts of the depletion region on the n side and on the p side | μm |\n| E_max | Peak electric field, at the junction | V/cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I | Current | A |\n| A (area) | Device or contact area | cm² |\n| η | Ideality factor of a diode, 1 (ideal) to 2 | dimensionless |\n| C, C_j | Capacitance (junction or depletion capacitance) | F (pF = 10⁻¹² F) |\n| Φ_m | Work function of a metal | eV; Al 4.28, Au 5.1 |\n| Φ_s | Work function of a semiconductor, χ + (E_c − E_F) | eV |\n| χ | Electron affinity: energy from E_c up to the vacuum level | eV; Si 4.05 |\n| Φ_B | Schottky barrier height seen from the metal | eV (or V) |\n| A∗∗ | Effective Richardson constant | A/(cm²·K²); n-Si ≈ 110 |\n| ρ_c | Specific contact resistance | Ω·cm² |\n| E_vac | Vacuum level: energy of an electron just free of the material | eV |\n| n_n0, p_p0, p_n0, n_p0 | Equilibrium densities: majority (n_n0, p_p0) and minority (p_n0 holes on n side, n_p0 electrons on p side) | cm⁻³ |\n| Δp_n, Δn_p | Excess minority carriers at the depletion edges (holes on n side, electrons on p side) | cm⁻³ |\n| R_c | Contact resistance | Ω (specific: Ω·cm²) |\n| Φ_Bn, Φ_Bp | Schottky barrier height for electrons (n-type) and for holes (p-type) | eV |\n| p_n, n_p | Minority-carrier density: holes on the n side, electrons on the p side | cm⁻³ |\n| N(x), N(W) | Doping concentration at depth x (or at the depletion edge W), from C-V profiling | cm⁻³ |\n| t | Time (or a thickness, where the text says so) | s (or cm) |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| I-V | Current–voltage (measurement or characteristic) |\n| C-V | Capacitance–voltage (measurement or characteristic) |\n| LCR | Inductance–capacitance–resistance meter |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| MESFET | Metal–semiconductor field-effect transistor |\n| BJT | Bipolar junction transistor |\n| RF | Radio frequency |\n| DC | Direct current (steady) |\n| AC | Alternating current (small signal) |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n## Questions on this page\n\n| Q | Question |\n|---|---|\n| 47 | Explain the formation of the depletion region and built-in potential in a p-n junction. |\n| 48 | Derive the ideal Shockley diode equation and explain the effect of forward and reverse bias. |\n| 49 | Differentiate between a Schottky barrier diode and an Ohmic contact. Explain their energy-band characteristics. |\n| 50 | Explain the principles of I-V and C-V characterisation of semiconductor devices and describe how C-V measurements can be used to estimate doping concentration. |\n\n## Model answers\n\n### Q47. Explain the formation of the depletion region and built-in potential in a p-n junction.\n\n> **Question type:** Explanation · **Topic:** p-n junction electrostatics · **Full notes:** Week 10 (The p-n Junction Diode)\n\n**What the examiner wants.** \"Explain\" means give the physical cause-and-effect chain: diffusion, uncovered ions, field, drift that opposes diffusion, equilibrium with a flat Fermi level. Then state what the built-in potential is, derive its formula from the Fermi-level positions, and back it up with a labelled sketch and a typical number.\n\n**Key terms.**\n\n- **p-n junction:** the boundary between a p-type and an n-type region in one continuous crystal.\n- **Acceptor and donor ions (N_A⁻, N_D⁺):** dopant atoms that have taken or given up an electron; they are charged and fixed in the lattice, so they cannot move.\n- **Diffusion:** movement of carriers from where they are many to where they are few.\n- **Drift:** movement of carriers pushed by an electric field.\n- **Depletion region (space-charge region), width W:** the layer around the junction emptied of mobile carriers, containing only fixed ion charge.\n- **Fermi level (E_F):** the energy at which a state has a 50 % chance of being occupied; in equilibrium it is flat (the same) throughout a connected system.\n- **Built-in potential (V_bi):** the voltage across the depletion region in equilibrium; the barrier majority carriers must climb to cross the junction.\n- **Intrinsic carrier concentration (n_i):** carrier density of pure silicon, 1×10¹⁰ cm⁻³ at 300 K.\n\n**Model answer.**\n\n**1. Before equilibrium: diffusion.** When p-type silicon (holes p ≈ N_A) and n-type silicon (electrons n ≈ N_D) are formed in one crystal, there is a huge concentration difference across the boundary. Holes therefore diffuse from the p side into the n side, and electrons diffuse from the n side into the p side. Carriers that cross recombine with the majority carriers on the other side and disappear.\n\n**2. Fixed charge is uncovered.** Each hole that leaves the p side leaves behind a negative acceptor ion; each electron that leaves the n side leaves behind a positive donor ion. These ions are locked in the lattice. A layer next to the junction is therefore stripped of mobile carriers and holds only fixed charge: **negative on the p side, positive on the n side**. This is the **depletion region**.\n\n**3. Charge balance.** The two layers carry equal and opposite charge:\n\n    N_A x_p = N_D x_n\n\nWhere:\n\n- N_A, N_D = acceptor and donor concentrations (cm⁻³)\n- x_p, x_n = depth of the depletion region on the p side and on the n side (cm)\n\nSo the region extends further into the **more lightly doped** side.\n\n**4. A field builds up and drift opposes diffusion.** The positive and negative charge layers create an electric field pointing from the n side to the p side, largest at the junction. This field drives holes back to p and electrons back to n (a drift current), opposite to the diffusion current.\n\n**5. Equilibrium.** The depletion region grows until, for holes and for electrons separately, drift exactly cancels diffusion. The net current is zero and the Fermi level is one flat line through the whole structure.\n\n**6. The built-in potential.** The field across the depletion region corresponds to a potential difference V_bi, with the n side positive relative to the p side. In the band diagram the bands on the p side sit higher by qV_bi, a barrier that holds back the majority carriers. Because E_F must be flat, the bands bend by the sum of the Fermi-level offsets from the intrinsic level E_i on the two sides:\n\n    qV_bi = kT ln(N_A/n_i) + kT ln(N_D/n_i)\n\n    V_bi = (kT/q) ln( N_{A}N_D / n_i² )\n\nWhere:\n\n- V_bi = built-in potential (V)\n- q = electronic charge, 1.6×10⁻¹⁹ C\n- kT = thermal energy, 0.0259 eV at 300 K, so kT/q = 0.0259 V\n- N_A, N_D = acceptor and donor concentrations (cm⁻³)\n- n_i = intrinsic carrier concentration, 1×10¹⁰ cm⁻³ for Si at 300 K\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 354\" role=\"img\" aria-label=\"Abrupt p-n junction in equilibrium: fixed charge in the depletion region, the triangular electric field, and the band diagram with a flat Fermi level and bands bent by q V bi\" style=\"width:560px;max-width:100%;height:auto;display:block; pan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"437.5\" y1=\"22.0\" x2=\"437.5\" y2=\"326.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.45\" stroke-dasharray=\"2 4\"/><text x=\"437.5\" y=\"344.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">x<tspan dy=\"0.32em\" font-size=\"72%\">n</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"280.0\" y=\"344.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">0</text></svg><figcaption>Abrupt p-n junction in equilibrium: fixed negative and positive ion charge either side of the junction, the triangular field peaking at the junction, and bands bent by qV<sub>bi</sub> under a flat Fermi level.</figcaption></figure>\n```\n\nSketch in the exam: three stacked graphs against x. (a) Charge density: a negative block of height qN_A from −x_p to 0, a positive block of height qN_D from 0 to x_n. (b) Field: a triangle, zero at both edges, peak E_max at x = 0. (c) Band diagram: E_c and E_v higher on the p side by qV_bi, a flat dashed E_F. Label W, x_p, x_n, qV_bi.\n\n**7. Width and field (depletion approximation: no free carriers inside W, neutral outside).**\n\n    W = x_n + x_p = √( (2ε_s/q) V_bi (1/N_A + 1/N_D) ),     E_max = qN_D x_n/ε_s\n\nWhere:\n\n- W = total depletion width (cm)\n- ε_s = permittivity of silicon, 1.04×10⁻¹² F/cm\n- E_max = peak electric field, at the junction (V/cm)\n- other symbols as above\n\n**Typical numbers (Si, N_A = 10¹⁷ cm⁻³, N_D = 10¹⁶ cm⁻³, 300 K):** V_bi = 0.0259 × ln(10¹³) = **0.775 V**; W = **0.33 μm** (0.30 μm on the n side, 0.03 μm on the p side); E_max ≈ **4.7×10⁴ V/cm**.\n\n**8. Remarks.** V_bi cannot be read with a voltmeter: contact potentials at the metal leads cancel it exactly, so it drives no external current. Applied bias changes the barrier to V_bi − V_a (V_a = applied voltage, positive for forward bias), which is the basis of rectification.\n\n**Marking checklist.** The points a marker looks for. Tick each one off in your own answer:\n\n- ✓ diffusion of holes p → n and electrons n → p, driven by the concentration gradient\n- ✓ immobile ions uncovered: negative acceptors on p side, positive donors on n side\n- ✓ field from n to p; drift opposes diffusion; equilibrium when they balance\n- ✓ flat Fermi level in equilibrium\n- ✓ V_bi = (kT/q) ln(N_{A}N_D/n_i²), with symbols defined\n- ✓ N_A x_p = N_D x_n: wider on the lightly doped side\n- ✓ labelled sketch (charge, field, band diagram)\n- ✓ typical value (≈ 0.7–0.8 V for Si) and the point that it cannot be measured with a voltmeter\n\n**Common mistakes.**\n\n- Saying the depletion region contains \"no charge\". It contains no *mobile* carriers but a lot of fixed ion charge; that charge is the whole point.\n- Getting the field direction backwards. The field points from the positive (n) side to the negative (p) side.\n- Writing V_bi = (kT/q) ln(N_{A}N_D/n_i) (forgetting the square on n_i) or using log₁₀ instead of ln.\n- Claiming V_bi can be larger than the band gap for normal doping: it is always less than E_g/q (1.12 V for Si).\n\n**Remember it.** \"Carriers leave, ions stay, the field says stop\": diffusion uncovers ions, the ions' field stops further diffusion, and the voltage they leave behind is V_bi.\n\n**Try a variant.** Calculate V_bi and say on which side most of the depletion region lies for a silicon junction with N_A = 1×10¹⁸ cm⁻³ and N_D = 1×10¹⁵ cm⁻³ at 300 K. *Answer:* V_bi = 0.0259 × ln(10¹⁸ × 10¹⁵/10²⁰) = 0.0259 × ln(10¹³) = **0.775 V**; since x_n/x_p = N_A/N_D = 1000, **almost all of W lies in the lightly doped n side** (a one-sided p⁺n junction).\n\n---\n\n### Q48. Derive the ideal Shockley diode equation and explain the effect of forward and reverse bias.\n\n> **Question type:** Derivation · **Topic:** ideal diode equation · **Full notes:** Week 10 (The p-n Junction Diode); minority-carrier diffusion in Week 9\n\n**What the examiner wants.** A full, ordered derivation: list the assumptions, obtain the minority densities at the depletion edges (law of the junction), solve the minority-carrier diffusion equation in each neutral region, find the diffusion currents at the depletion edges, add them, and identify J_s. Then use the result to explain forward and reverse bias, ideally with the I-V sketch.\n\n**Key terms.**\n\n- **Minority carrier:** the less numerous carrier (holes in n-type, electrons in p-type). Equilibrium values: p_n0 = n_i²/N_D on the n side, n_p0 = n_i²/N_A on the p side.\n- **Excess carrier density (Δp, Δn):** the amount by which a carrier density exceeds its equilibrium value.\n- **Low-level injection:** injected minority densities remain much smaller than the majority density.\n- **Lifetime (τ_p, τ_n):** average time an excess minority carrier survives before recombining (s).\n- **Diffusion coefficient (D_p, D_n):** how quickly carriers spread down a concentration gradient (cm²/s).\n- **Diffusion length (L_p, L_n):** average distance a minority carrier diffuses before recombining, L = √(Dτ) (cm).\n- **Saturation current (I_s, J_s):** the small reverse current of the diode, and the scale factor of the exponential (A, or A/cm² for J_s).\n- **Quasi-equilibrium:** carriers in the depletion region stay so close to equilibrium that Boltzmann statistics still link the densities on either side of it.\n\n**Model answer.**\n\n#### Assumptions\n\n1. Abrupt junction; **depletion approximation**: no mobile carriers inside the depletion region (from x = −x_p to x = x_n), exact neutrality outside it.\n2. Non-degenerate doping, so Boltzmann statistics apply.\n3. **Low-level injection**: Δp ≪ N_D on the n side and Δn ≪ N_A on the p side, so majority densities are unchanged.\n4. **No generation or recombination inside the depletion region**, so the electron and hole currents are each constant across it.\n5. All the applied voltage V appears across the depletion region; the neutral regions carry no field (E = 0), so minority current there is pure diffusion.\n6. Neutral regions much longer than the diffusion lengths, ending in ohmic contacts; steady state.\n\nTake x = 0 at the junction, the n region for x > x_n and the p region for x < −x_p. V > 0 means forward bias (p side positive).\n\n#### Step 1: law of the junction\n\nIn equilibrium the Boltzmann relation links the electron densities on the two sides of the barrier:\n\n    n_n0 = n_p0 e^{qV_bi/kT}\n\nWhere:\n\n- n_n0 = equilibrium electron (majority) density in the n region ≈ N_D (cm⁻³)\n- n_p0 = equilibrium electron (minority) density in the p region = n_i²/N_A (cm⁻³)\n- V_bi = built-in potential (V); kT/q = 0.0259 V at 300 K\n\nWith bias V the barrier becomes V_bi − V. Under quasi-equilibrium the same relation holds at the depletion edges with the new barrier, and by low-level injection n_n(x_n) ≈ n_n0:\n\n    n_p(−x_p) = n_n0 e^{−q(V_bi − V)/kT} = n_p0 e^{qV/kT}\n\nThe same argument for holes gives p_n(x_n) = p_n0 e^{qV/kT}. The **excess** minority densities at the edges are therefore:\n\n    Δp_n(x_n) = p_n0 ( e^{qV/kT} − 1 ),     Δn_p(−x_p) = n_p0 ( e^{qV/kT} − 1 )\n\nWhere:\n\n- p_n0 = n_i²/N_D = equilibrium hole density in the n region (cm⁻³)\n- Δp_n(x_n), Δn_p(−x_p) = excess hole and electron densities at the n-side and p-side depletion edges (cm⁻³)\n- V = applied voltage (V)\n\n#### Step 2: minority-carrier diffusion equation in the neutral n region\n\nThe hole continuity equation is ∂p/∂t = −(1/q) dJ_p/dx − Δp/τ_p. In steady state (∂p/∂t = 0) with no field, J_p = −qD_p dp/dx, so:\n\n    D_p d²Δp_n/dx² − Δp_n/τ_p = 0,     or     d²Δp_n/dx² = Δp_n/L_p²,   L_p = √(D_pτ_p)\n\nWhere:\n\n- D_p = hole diffusion coefficient (cm²/s); τ_p = hole lifetime (s); L_p = hole diffusion length (cm)\n- J_p = hole current density (A/cm²)\n\nThe general solution is a sum of e^{−(x − x_n)/L_p} and e^{+(x − x_n)/L_p}. In a long region Δp_n must fall to zero far from the junction, so the growing term is dropped. Using Step 1 as the boundary value:\n\n    Δp_n(x) = Δp_n(x_n) e^{−(x − x_n)/L_p}     (x ≥ x_n)\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 195\" role=\"img\" aria-label=\"Steady-state excess minority-carrier density decaying exponentially from the injection point with characteristic length L_p\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"60.0\" y1=\"168.0\" x2=\"454.0\" y2=\"168.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"60.0\" y1=\"168.0\" x2=\"60.0\" y2=\"34.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"464.0\" y=\"172.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">x / L<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"65.0\" y=\"30.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">Δp(x)/Δp(0)</text><line x1=\"140.0\" y1=\"164.0\" x2=\"140.0\" y2=\"172.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"140.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><line x1=\"220.0\" y1=\"164.0\" x2=\"220.0\" y2=\"172.0\" style=\"stroke:current b>p</sub>; the slope at the depletion edge sets the diffusion current.</figcaption></figure>\n```\n\n#### Step 3: hole current at the n-side edge, x = x_n\n\n    J_p(x_n) = −qD_p dΔp_n/dx |_{x_n} = (qD_p/L_p) Δp_n(x_n) = (qD_p p_n0/L_p)( e^{qV/kT} − 1 )\n\nWhere:\n\n- J_p(x_n) = hole diffusion current density at the n-side depletion edge (A/cm²), positive in the p → n direction\n- dΔp_n/dx = −Δp_n(x_n)/L_p = slope of the excess-hole profile at x_n (cm⁻⁴)\n\n#### Step 4: electron current at the p-side edge, x = −x_p\n\nThe identical argument in the p region gives Δn_p(x) = Δn_p(−x_p) e^{(x + x_p)/L_n} for x ≤ −x_p, and J_n = +qD_n dn/dx, so:\n\n    J_n(−x_p) = (qD_n n_p0/L_n)( e^{qV/kT} − 1 ),     L_n = √(D_nτ_n)\n\nWhere:\n\n- D_n = electron diffusion coefficient (cm²/s); τ_n = electron lifetime (s); L_n = electron diffusion length (cm)\n\n#### Step 5: add the two currents\n\nThe total current density J = J_n + J_p is the same at every x. By assumption 4, J_n does not change across the depletion region, so J_n(x_n) = J_n(−x_p). Evaluating the total at x = x_n:\n\n    J = J_p(x_n) + J_n(−x_p) = ( qD_p p_n0/L_p + qD_n n_p0/L_n )( e^{qV/kT} − 1 )\n\nWhere:\n\n- J = total current density (A/cm²), the same at every point of the diode\n- J_n(−x_p) = electron diffusion current density at the p-side depletion edge (A/cm²)\n\n#### Step 6: identify J_s\n\nSubstituting p_n0 = n_i²/N_D and n_p0 = n_i²/N_A, and multiplying by the area A:\n\n**J = J_s ( e^{qV/kT} − 1 ),   J_s = q n_i² ( D_p/(L_pN_D) + D_n/(L_nN_A) ),   I = A J = I_s ( e^{qV/kT} − 1 )**\n\nWhere:\n\n- J, I = diode current density (A/cm²) and current (A), positive in the forward direction\n- J_s, I_s = saturation current density (A/cm²) and saturation current (A), I_s = AJ_s\n- A = junction area (cm²); n_i = 1×10¹⁰ cm⁻³ for Si at 300 K\n- N_A, N_D = acceptor and donor concentrations (cm⁻³)\n\nThis is the **ideal Shockley diode equation**. Note that J_s ∝ n_i², and the term of the *lightly* doped side dominates.\n\n#### Effect of forward bias (V > 0, p side positive)\n\n- The barrier falls to V_bi − V and the depletion region narrows.\n- Minority carriers are **injected**: edge densities rise by e^{qV/kT}.\n- For V above about 0.1 V (≫ kT/q) the −1 is negligible: I ≈ I_s e^{qV/kT}. The current rises tenfold every (kT/q) ln 10 ≈ **60 mV**.\n- Because I_s is tiny, appreciable current needs about 0.6–0.7 V in Si (0.2–0.3 V in Ge).\n\n#### Effect of reverse bias (V < 0, p side negative)\n\n- The barrier rises to V_bi + |V| and the depletion region widens.\n- e^{qV/kT} → 0, so the edge minority densities fall almost to zero: carriers are **extracted**, not injected.\n- For |V| more than a few kT/q: I ≈ **−I_s**, small and independent of voltage, carried by minority carriers generated within a diffusion length of the junction.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 220\" role=\"img\" aria-label=\"Ideal silicon diode current against voltage: negligible reverse current and an exponential rise above about 0.6 volts\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"173.6\" x2=\"464.0\" y2=\"173.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"286.2\" y1=\"194.0\" x2=\"286.2\" y2=
