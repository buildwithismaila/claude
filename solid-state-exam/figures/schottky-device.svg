<svg viewBox="0 0 560 275" role="img" aria-label="Cross-section of a Schottky diode: a metal anode on a lightly doped n-type layer, which sits on a heavily doped n-plus substrate with an ohmic metal cathode underneath; oxide rings the metal" style="width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:"IBM Plex Sans Condensed",system-ui,sans-serif"><defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:currentColor" opacity=".7"/></marker><marker id="ars" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:var(--copper,#B4622F)"/></marker><marker id="art" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9 z" style="fill:var(--teal,#1C6E7E)"/></marker></defs><rect x="40.0" y="150.0" width="420.0" height="70.0" rx="0" style="fill:var(--teal-soft,#E0EEF1);stroke:currentColor" stroke-width="1.2" opacity="1.0"/><text x="250.0" y="195.0" text-anchor="middle" font-size="11" style="fill:currentColor;" opacity="1.0">n⁺ substrate (heavily doped)</text><rect x="40.0" y="80.0" width="420.0" height="70.0" rx="0" style="fill:none;stroke:currentColor" stroke-width="1.2" opacity="1.0"/><text x="52.0" y="140.0" text-anchor="start" font-size="11" style="fill:currentColor;" opacity="1.0">n-type layer (lightly doped)</text><rect x="40.0" y="62.0" width="130.0" height="18.0" rx="0" style="fill:none;stroke:currentColor" stroke-width="1.2" opacity="1.0" stroke-dasharray="4 2"/><rect x="330.0" y="62.0" width="130.0" height="18.0" rx="0" style="fill:none;stroke:currentColor" stroke-width="1.2" opacity="1.0" stroke-dasharray="4 2"/><text x="105.0" y="75.0" text-anchor="middle" font-size="10.5" style="fill:currentColor;" opacity="1.0">SiO₂</text><text x="395.0" y="75.0" text-anchor="middle" font-size="10.5" style="fill:currentColor;" opacity="1.0">SiO₂</text><rect x="170.0" y="50.0" width="160.0" height="30.0" rx="0" style="fill:var(--copper-soft,#F3E7DE);stroke:currentColor" stroke-width="1.2" opacity="1.0"/><text x="250.0" y="70.0" text-anchor="middle" font-size="11" style="fill:currentColor;" opacity="1.0">metal</text><path d="M180,80 Q250.0,128 320,80" style="fill:none;stroke:currentColor" stroke-width="1" opacity="0.7" stroke-linejoin="round" stroke-dasharray="4 3"/><text x="250.0" y="116.0" text-anchor="middle" font-size="10" style="fill:currentColor;" opacity="0.8">depletion region</text><rect x="40.0" y="220.0" width="420.0" height="14.0" rx="0" style="fill:var(--copper-soft,#F3E7DE);stroke:currentColor" stroke-width="1.2" opacity="1.0"/><line x1="250.0" y1="50.0" x2="250.0" y2="20.0" style="stroke:currentColor" stroke-width="1.2" opacity="1.0"/><circle cx="250.0" cy="18.0" r="3.5" style="fill:currentColor;stroke:none" stroke-width="1.2"/><text x="260.0" y="22.0" text-anchor="start" font-size="10.5" style="fill:currentColor;" opacity="1.0">anode (+ for forward bias)</text><line x1="250.0" y1="234.0" x2="250.0" y2="258.0" style="stroke:currentColor" stroke-width="1.2" opacity="1.0"/><circle cx="250.0" cy="260.0" r="3.5" style="fill:currentColor;stroke:none" stroke-width="1.2"/><text x="260.0" y="264.0" text-anchor="start" font-size="10.5" style="fill:currentColor;" opacity="1.0">cathode</text><text x="468.0" y="40.0" text-anchor="start" font-size="10.5" style="fill:var(--copper,#B4622F);" opacity="1.0">Schottky</text><text x="468.0" y="54.0" text-anchor="start" font-size="10.5" style="fill:var(--copper,#B4622F);" opacity="1.0">contact</text><line x1="464.0" y1="46.0" x2="332.0" y2="52.0" style="stroke:var(--copper,#B4622F)" stroke-width="0.8" opacity="0.6"/><text x="468.0" y="226.0" text-anchor="start" font-size="10.5" style="fill:var(--teal,#1C6E7E);" opacity="1.0">ohmic</text><text x="468.0" y="240.0" text-anchor="start" font-size="10.5" style="fill:var(--teal,#