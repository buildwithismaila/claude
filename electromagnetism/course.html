<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PGDEE Electromagnetism</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --sidebar:#EDF1F3;
  --ink:#17212B; --ink-soft:#5A6975; --ink-faint:#8695A1;
  --rule:#D9E1E6; --rule-soft:#E7EDF0;
  --copper:#A2542A; --copper-soft:#F3E7DE;
  --teal:#186A7B; --teal-soft:#E0EEF1;
  --shadow:0 1px 2px rgba(23,33,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
    --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
    --rule:#22303A; --rule-soft:#1A252E;
    --copper:#DC8B57; --copper-soft:#2A1D14;
    --teal:#54B4C6; --teal-soft:#122730;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
  --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
  --rule:#22303A; --rule-soft:#1A252E;
  --copper:#DC8B57; --copper-soft:#2A1D14;
  --teal:#54B4C6; --teal-soft:#122730;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16px; line-height:1.65;
  display:grid; grid-template-columns:272px 1fr; min-height:100vh;
}
::selection{background:var(--copper-soft); color:var(--ink)}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--copper); outline-offset:2px; border-radius:2px}

/* ---------- sidebar ---------- */
#nav{
  background:var(--sidebar); border-right:1px solid var(--rule);
  padding:26px 0 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
}
.brand{padding:0 22px 20px; border-bottom:1px solid var(--rule); margin-bottom:14px}
.brand h1{
  font-size:19px; line-height:1.2; margin:0 0 6px; font-weight:700;
  letter-spacing:-.01em; text-wrap:balance;
}
.brand p{margin:0; font-size:12px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase}
.seclabel{
  padding:0 22px; margin:18px 0 8px; font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-faint); font-weight:600;
}
.modlist{list-style:none; margin:0; padding:0}
.modlist button{
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  display:grid; grid-template-columns:26px 1fr 16px; gap:9px; align-items:baseline;
  padding:7px 22px; font:inherit; font-size:14px; color:var(--ink-soft);
  border-left:2px solid transparent;
}
.modlist button:hover{background:var(--rule-soft); color:var(--ink)}
.modlist button[aria-current="true"]{
  color:var(--ink); font-weight:600; border-left-color:var(--copper); background:var(--rule-soft);
}
.modnum{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.modlist button[aria-current="true"] .modnum{color:var(--copper)}
.tick{font-size:12px; color:var(--teal); opacity:0; transition:opacity .15s}
.done .tick{opacity:1}
.done .modnum{text-decoration:line-through}

/* ---------- reading column ---------- */
main{padding:0; min-width:0}
.sheet{
  background:var(--surface); border-left:0; min-height:100vh;
  padding:46px 56px 96px; max-width:none;
}
.wrap{max-width:74ch; margin:0 auto}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--copper); margin:0 0 8px;
}
h2.doctitle{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700;
  font-size:38px; line-height:1.1; letter-spacing:-.02em; margin:0 0 6px; text-wrap:balance;
}
.rule{height:1px; background:var(--rule); margin:26px 0 32px}

#doc h2{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:23px; font-weight:600;
  letter-spacing:-.01em; margin:44px 0 12px; padding-top:14px;
  border-top:1px solid var(--rule-soft); text-wrap:balance;
}
#doc h3{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:17px; font-weight:600;
  margin:28px 0 8px; color:var(--ink);
}
#doc p{margin:0 0 14px}
#doc strong{font-weight:600}
#doc ul,#doc ol{margin:0 0 16px; padding-left:22px}
#doc li{margin:0 0 6px}
#doc hr{border:0; border-top:1px solid var(--rule); margin:34px 0}

/* formulas + code */
#doc code{
  font-family:"IBM Plex Mono",monospace; font-size:.87em;
  background:var(--rule-soft); padding:1px 5px; border-radius:3px;
}
#doc pre{
  font-family:"IBM Plex Mono",monospace; font-size:13.5px; line-height:1.6;
  background:var(--surface); border:1px solid var(--rule);
  border-left:3px solid var(--copper);
  padding:14px 18px; overflow-x:auto; margin:0 0 18px; border-radius:0 3px 3px 0;
}
#doc pre code{background:none; padding:0; font-size:inherit}

/* blockquote = the "warning / think about this" voice */
#doc blockquote{
  margin:0 0 20px; padding:14px 18px; background:var(--teal-soft);
  border-left:3px solid var(--teal); font-style:normal;
}
#doc blockquote p:last-child{margin:0}

/* tables */
.tablewrap{overflow-x:auto; margin:0 0 20px}
#doc table{border-collapse:collapse; width:100%; font-size:14.5px}
#doc th{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600; text-align:left;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);
  border-bottom:1px solid var(--rule); padding:8px 12px 6px;
}
#doc td{
  padding:8px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:top;
  font-variant-numeric:tabular-nums;
}
#doc tbody tr:last-child td{border-bottom:1px solid var(--rule)}

/* ---------- footer nav ---------- */
.pager{
  display:flex; gap:12px; justify-content:space-between; align-items:stretch;
  margin-top:52px; padding-top:22px; border-top:1px solid var(--rule);
}
.pager button{
  flex:1; text-align:left; background:var(--surface); border:1px solid var(--rule);
  padding:12px 16px; cursor:pointer; font-family:"IBM Plex Sans Condensed",sans-serif;
  color:var(--ink); font-size:15px; line-height:1.3;
}
.pager button:hover{border-color:var(--copper)}
.pager button:disabled{opacity:.35; cursor:default}
.pager button.next{text-align:right}
.pager span{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px}

.readbtn{
  display:inline-flex; align-items:center; gap:8px; margin-top:26px;
  background:none; border:1px solid var(--rule); color:var(--ink-soft);
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:13.5px;
  padding:8px 14px; cursor:pointer;
}
.readbtn:hover{border-color:var(--teal); color:var(--ink)}
.readbtn[aria-pressed="true"]{border-color:var(--teal); color:var(--teal); background:var(--teal-soft)}

/* ---------- mobile ---------- */
#mobsel{display:none}
@media (max-width:860px){
  body{grid-template-columns:1fr}
  #nav{display:none}
  #mobsel{
    display:block; position:sticky; top:0; z-index:5; background:var(--sidebar);
    border-bottom:1px solid var(--rule); padding:12px 18px;
  }
  #mobsel select{
    width:100%; font-family:"IBM Plex Sans Condensed",sans-serif; font-size:15px;
    padding:9px 10px; background:var(--surface); color:var(--ink);
    border:1px solid var(--rule); border-radius:2px;
  }
  .sheet{padding:28px 20px 72px}
  h2.doctitle{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* Minimal markdown renderer, inlined so the page has no external dependencies. */
function mdToHtml(src){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function inline(s){
    s = esc(s);
    const codes = [];
    s = s.replace(/`([^`]+)`/g, function(m,c){ codes.push(c); return "\u0001" + (codes.length-1) + "\u0002"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = s.replace(/\u0001(\d+)\u0002/g, function(m,i){ return "<code>" + codes[+i] + "</code>"; });
    return s;
  }
  // Prose reflows; notation blocks (formula sheet, equation runs) keep their line breaks.
  function joinLines(arr){
    const mathy = arr.filter(x => /[=|⇒⟺→∮∫∇×·√]/.test(x)).length;
    const sep = (arr.length > 1 && mathy >= arr.length / 2) ? "<br>" : " ";
    return arr.map(inline).join(sep);
  }
  const lines = String(src).replace(/\r\n?/g,"\n").split("\n");
  const blank = l => !l.trim();
  const startsBlock = l =>
    /^#{1,6}\s/.test(l) || /^>\s?/.test(l) || /^```/.test(l) ||
    /^(---|\*\*\*|___)\s*$/.test(l) || /^\s*[-*]\s+/.test(l) ||
    /^\s*\d+\.\s+/.test(l) || /^\s*\|/.test(l) || /^ {4}\S/.test(l);
  const out = [];
  let i = 0;
  while(i < lines.length){
    const l = lines[i];
    if(blank(l)){ i++; continue; }

    if(/^```/.test(l)){
      i++; const buf = [];
      while(i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
    }
    if(/^(---|\*\*\*|___)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }

    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; out.push("<h"+n+">" + inline(h[2]) + "</h"+n+">"); i++; continue; }

    if(/^\s*\|/.test(l) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      const cells = r => r.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c => c.trim());
      const head = cells(l); i += 2; const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map(c => "<th>"+inline(c)+"</th>").join("") +
        "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>"+inline(c)+"</td>").join("") + "</tr>").join("") +
        "</tbody></table>");
      continue;
    }

    if(/^>\s?/.test(l)){
      const buf = [];
      while(i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,""));
      out.push("<blockquote>" + mdToHtml(buf.join("\n")) + "</blockquote>"); continue;
    }

    if(/^ {4}\S/.test(l)){
      const buf = [];
      while(i < lines.length && (/^ {4}/.test(lines[i]) ||
            (blank(lines[i]) && /^ {4}\S/.test(lines[i+1] || "")))){
        buf.push(lines[i].replace(/^ {4}/,"")); i++;
      }
      out.push("<pre><code>" + esc(buf.join("\n")) + "</code></pre>"); continue;
    }

    if(/^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l)){
      const ordered = /^\s*\d+\.\s+/.test(l);
      const re = ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
      const items = [];
      while(i < lines.length && !blank(lines[i])){
        if(re.test(lines[i])){ items.push(lines[i].replace(re,"")); i++; }
        else if(/^\s+\S/.test(lines[i]) && items.length){ items[items.length-1] += "\n" + lines[i].trim(); i++; }
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push("<"+tag+">" + items.map(t => "<li>" + joinLines(t.split("\n")) + "</li>").join("") + "</"+tag+">");
      continue;
    }

    const buf = [];
    while(i < lines.length && !blank(lines[i]) && !startsBlock(lines[i])){ buf.push(lines[i]); i++; }
    if(!buf.length){ buf.push(lines[i]); i++; }
    out.push("<p>" + joinLines(buf) + "</p>");
  }
  return out.join("\n");
}

const MODS = [{"num": "00", "title": "Start Here", "body": "\nThis is a from-scratch course. No prior field theory assumed. You need:\n\n- Algebra, trigonometry\n- Basic calculus (derivatives, integrals). Vector calculus is **taught here**, not assumed.\n- Circuit basics (V = IR, capacitors, inductors) — helpful, not required.\n\n## The one idea behind the whole subject\n\nCircuit theory says: charge moves through wires, and voltage/current tell you\neverything. That is a *lie that works* — it works only when the circuit is much\nsmaller than the wavelength of the signals in it.\n\nField theory says: charge creates a condition in the space around it. Another\ncharge placed there feels a force. That condition is a **field**. Electromagnetism\nis the study of two coupled fields — electric (**E**) and magnetic (**H**) — and\nthe four equations that bind them (Maxwell's equations).\n\nEverything in this course is either:\n1. Building the mathematical language (vectors, coordinates, div/curl/grad), or\n2. Building the four equations one piece at a time, or\n3. Solving the four equations in useful situations (waves, lines, guides, antennas).\n\n## Course map\n\n| Module | Title | What you gain |\n|---|---|---|\n| 01 | Vector algebra & coordinate systems | The language |\n| 02 | Vector calculus: grad, div, curl | The verbs of the language |\n| 03 | Electrostatics | Coulomb → Gauss → potential → capacitance |\n| 04 | Materials, boundary conditions, Poisson/Laplace | Fields in real matter |\n| 05 | Magnetostatics | Biot–Savart → Ampère → inductance |\n| 06 | Time-varying fields & Maxwell's equations | The unification |\n| 07 | Uniform plane waves | Propagation, loss, skin effect, polarization |\n| 08 | Transmission lines | Where EM meets circuits again; Smith chart |\n| 09 | Waveguides & resonators | Guided modes, cutoff |\n| 10 | Radiation & antennas | How energy leaves the circuit entirely |\n| 11 | Formula sheet | Exam-day single page |\n| 12 | Problem set with full solutions | Proof you understood |\n\n## How to use this\n\nRead a module, then close it and try to re-derive the boxed results on blank\npaper. If you cannot, you read it — you did not learn it. Do the module's\nexercises before moving on; each module builds directly on the previous one.\n\nNotation used throughout:\n- Vectors in bold: **E**, **B**. Unit vectors: **a**_x, **a**_r, etc.\n- Scalars italic-ish: V, ρ, ε.\n- ε₀ = 8.854×10⁻¹² F/m, μ₀ = 4π×10⁻⁷ H/m, c = 1/√(μ₀ε₀) ≈ 3×10⁸ m/s.\n- η₀ = √(μ₀/ε₀) ≈ 377 Ω (intrinsic impedance of free space).\n"}, {"num": "01", "title": "Vector Algebra and Coordinate Systems", "body": "\n## 1.1 Why vectors\n\nA field assigns a value to every point in space. A **scalar field** assigns a\nnumber (temperature T(x,y,z), potential V(x,y,z)). A **vector field** assigns a\nnumber *and a direction* (electric field **E**(x,y,z), velocity of water in a pipe).\n\nElectromagnetism is almost entirely vector fields, so the algebra must be fluent.\n\n## 1.2 Vector basics\n\nA vector **A** = A_x **a**_x + A_y **a**_y + A_z **a**_z.\n\n- Magnitude: |**A**| = √(A_x² + A_y² + A_z²)\n- Unit vector: **a**_A = **A**/|**A**|  (length 1, direction of **A**)\n- Addition is componentwise.\n\n**Position vector** of point P(x,y,z): **r** = x**a**_x + y**a**_y + z**a**_z.\n\n**Distance vector** from P₁ to P₂: **R**₁₂ = **r**₂ − **r**₁. This single object\nappears in every Coulomb-law and Biot–Savart problem you will ever do.\n\n## 1.3 Dot product — \"how much of A lies along B\"\n\n**A**·**B** = A_x B_x + A_y B_y + A_z B_z = |A||B| cos θ\n\nProperties and uses:\n- Result is a **scalar**.\n- **A**·**B** = 0 ⟺ perpendicular. This is how you test orthogonality.\n- Projection of **A** onto direction **a**_B is (**A**·**a**_B).\n- Work = **F**·**d**. Flux through a surface = **D**·**S**. Both are dot products\n  because both ask \"how much is aligned?\"\n\n## 1.4 Cross product — \"the perpendicular one\"\n\n**A** × **B** = |A||B| sin θ **a**_n , with **a**_n by the right-hand rule.\n\nDeterminant form:\n\n```\n          | a_x  a_y  a_z |\nA × B  =  | A_x  A_y  A_z |\n          | B_x  B_y  B_z |\n```\n\n= (A_y B_z − A_z B_y)**a**_x − (A_x B_z − A_z B_x)**a**_y + (A_x B_y − A_y B_x)**a**_z\n\nUses:\n- Result is a **vector** perpendicular to both.\n- **A** × **B** = 0 ⟺ parallel.\n- Magnetic force: **F** = q**v** × **B**. Poynting vector: **S** = **E** × **H**.\n  The \"sideways\" nature of magnetism is entirely a cross product.\n- Note **A**×**B** = −**B**×**A**. Order matters; sign errors here are the #1\n  source of wrong answers in magnetostatics.\n\n### Triple products\n- Scalar triple: **A**·(**B**×**C**) = volume of parallelepiped; cyclic-invariant.\n- Vector triple: **A**×(**B**×**C**) = **B**(**A**·**C**) − **C**(**A**·**B**)\n  (\"BAC−CAB\"). Needed in wave and antenna derivations.\n\n## 1.5 Coordinate systems — choose one that matches the symmetry\n\nThe physics never changes; the algebra does. Pick the system whose surfaces match\nyour object and half the work vanishes.\n\n### Cartesian (x, y, z)\n- Differential length: d**l** = dx **a**_x + dy **a**_y + dz **a**_z\n- Differential area: dS_z = dx dy **a**_z (and cyclic)\n- Differential volume: dv = dx dy dz\n- Use for: slabs, boxes, plane waves, rectangular waveguides.\n\n### Cylindrical (ρ, φ, z)\nρ = distance from z-axis, φ = angle from x-axis, z = height.\n\n- x = ρ cos φ, y = ρ sin φ, z = z; ρ = √(x²+y²), φ = tan⁻¹(y/x)\n- d**l** = dρ **a**_ρ + ρ dφ **a**_φ + dz **a**_z   ← note the ρ in the φ term\n- dS_ρ = ρ dφ dz **a**_ρ ;  dS_φ = dρ dz **a**_φ ;  dS_z = ρ dρ dφ **a**_z\n- dv = ρ dρ dφ dz\n- Use for: wires, coaxial cables, solenoids, circular waveguides.\n\n### Spherical (r, θ, φ)\nr = distance from origin, θ = polar angle from +z (0 to π), φ = azimuth (0 to 2π).\n\n- x = r sinθ cosφ, y = r sinθ sinφ, z = r cosθ\n- d**l** = dr **a**_r + r dθ **a**_θ + r sinθ dφ **a**_φ\n- dS_r = r² sinθ dθ dφ **a**_r\n- dv = r² sinθ dr dθ dφ\n- Use for: point charges, spheres, antenna radiation patterns.\n\n> **Critical warning.** In cylindrical and spherical systems the unit vectors\n> **change direction from point to point**. **a**_ρ at φ=0 is not **a**_ρ at\n> φ=90°. Therefore you may **never** add vectors at different points by adding\n> their components, and you may **never** pull **a**_r outside an integral over φ.\n> Cartesian unit vectors are the only constant ones. When in doubt, convert to\n> Cartesian, integrate, convert back.\n\n### Conversion of vector components\nTo convert **A** from Cartesian to cylindrical, dot with the new unit vectors:\n\nA_ρ = **A**·**a**_ρ = A_x cosφ + A_y sinφ\nA_φ = **A**·**a**_φ = −A_x sinφ + A_y cosφ\nA_z = A_z\n\nSpherical similarly, using the standard 3×3 transformation matrix.\n\n## 1.6 Worked examples\n\n**Example 1.** Given **A** = 3**a**_x − 2**a**_y + **a**_z and\n**B** = **a**_x + 4**a**_y − 2**a**_z, find (a) **A**·**B**, (b) the angle\nbetween them, (c) **A**×**B**.\n\n(a) 3(1) + (−2)(4) + (1)(−2) = 3 − 8 − 2 = **−7**\n(b) |A| = √14 = 3.742, |B| = √21 = 4.583.\n  cos θ = −7/(3.742×4.583) = −0.408 → θ = **114.1°**\n(c) **A**×**B** = ((−2)(−2) − (1)(4))**a**_x − ((3)(−2) − (1)(1))**a**_y + ((3)(4) − (−2)(1))**a**_z\n  = (4−4)**a**_x − (−6−1)**a**_y + (12+2)**a**_z = **7a_y + 14a_z**\n\nCheck: dot the result with **A**: 0(3) + 7(−2) + 14(1) = 0 ✓ (perpendicular, as required).\n\n**Example 2.** Point P has Cartesian coordinates (3, 4, 5). Give it in\ncylindrical and spherical.\n\nCylindrical: ρ = √(9+16) = 5, φ = tan⁻¹(4/3) = 53.13°, z = 5 → **(5, 53.13°, 5)**\nSpherical: r = √(9+16+25) = √50 = 7.071, θ = cos⁻¹(5/7.071) = 45°, φ = 53.13°\n→ **(7.071, 45°, 53.13°)**\n\n**Example 3.** Find the unit vector from P(1,2,3) toward Q(4,6,3).\n\n**R** = (4−1, 6−2, 3−3) = (3, 4, 0); |**R**| = 5;\n**a** = **0.6a_x + 0.8a_y**\n\n## 1.7 Exercises\n\n1. **A** = 2**a**_x + **a**_y − 3**a**_z, **B** = **a**_x − **a**_y + **a**_z.\n   Find **A**·**B**, **A**×**B**, and the component of **A** along **B**.\n2. Convert **A** = y**a**_x − x**a**_y + z**a**_z into cylindrical coordinates.\n   (Answer: −ρ**a**_φ + z**a**_z — a purely circulating field. Remember this one;\n   it is the shape of the magnetic field around a wire.)\n3. Show that **A**×(**B**×**C**) ≠ (**A**×**B**)×**C** in general by picking\n   **A**=**a**_x, **B**=**a**_x, **C**=**a**_y.\n4. Find the volume of the region 1 ≤ r ≤ 2, 0 ≤ θ ≤ π/2, 0 ≤ φ ≤ π/2 in\n   spherical coordinates by integrating dv. (Answer: 7π/6)\n\n## Takeaways\n\n- Dot product = alignment (scalars, flux, work). Cross product = perpendicularity\n  (forces, power flow, rotation).\n- Symmetry chooses the coordinate system; the right choice makes hard integrals easy.\n- Non-Cartesian unit vectors are position-dependent. Most beginner errors live here.\n"}, {"num": "02", "title": "Vector Calculus: Gradient, Divergence, Curl", "body": "\nMaxwell's equations are four statements written with div and curl. If you\nunderstand these two operators *physically*, Maxwell's equations stop being\nsymbols and become sentences.\n\n## 2.1 Line, surface, volume integrals\n\n**Line integral** ∫_L **A**·d**l** — add up the component of **A** along a path.\n\"How much does the field push you as you walk this route?\" Work and voltage are\nline integrals.\n\nIf the path is closed we write ∮ **A**·d**l** and call it the **circulation**.\n\n**Surface integral (flux)** Ψ = ∫_S **A**·d**S** — add up the component of **A**\npassing *through* a surface. \"How much crosses this net?\"\n\nFor a closed surface, ∮_S **A**·d**S** is the *net outflow*.\n\n**Volume integral** ∫_v ρ dv — total amount of a scalar density in a region.\n\n## 2.2 Gradient — steepest climb of a scalar field\n\nFor scalar V, ∇V points in the direction of maximum increase of V, with\nmagnitude equal to that rate of increase.\n\n- Cartesian: ∇V = (∂V/∂x)**a**_x + (∂V/∂y)**a**_y + (∂V/∂z)**a**_z\n- Cylindrical: ∇V = (∂V/∂ρ)**a**_ρ + (1/ρ)(∂V/∂φ)**a**_φ + (∂V/∂z)**a**_z\n- Spherical: ∇V = (∂V/∂r)**a**_r + (1/r)(∂V/∂θ)**a**_θ + (1/(r sinθ))(∂V/∂φ)**a**_φ\n\nKey facts:\n- dV = ∇V · d**l** (change in V for a small step d**l**).\n- ∇V is **perpendicular to surfaces of constant V** (equipotentials).\n- In electrostatics **E** = −∇V: the field points \"downhill\" in potential.\n\nThink of a hill: V is altitude, ∇V points straight uphill, a ball rolls along\n−∇V. That is literally what a positive charge does in a potential field.\n\n## 2.3 Divergence — net outflow per unit volume (\"is there a source here?\")\n\n∇·**A** = lim(Δv→0) [∮_S **A**·d**S**] / Δv\n\n- Cartesian: ∂A_x/∂x + ∂A_y/∂y + ∂A_z/∂z\n- Cylindrical: (1/ρ)∂(ρA_ρ)/∂ρ + (1/ρ)∂A_φ/∂φ + ∂A_z/∂z\n- Spherical: (1/r²)∂(r²A_r)/∂r + (1/(r sinθ))∂(A_θ sinθ)/∂θ + (1/(r sinθ))∂A_φ/∂φ\n\nPhysical reading: put a tiny box at a point. More field lines leaving than\nentering ⇒ divergence positive ⇒ a **source** inside. Negative ⇒ a **sink**.\nZero ⇒ lines pass straight through: the field is **solenoidal**.\n\n- ∇·**D** = ρ_v : electric flux diverges from charge. Charge is a source.\n- ∇·**B** = 0 : magnetic flux never diverges. No magnetic charge exists;\n  B-field lines always close on themselves.\n\n### Divergence theorem (Gauss's theorem)\n\n    ∮_S A·dS = ∫_v (∇·A) dv\n\n\"Total outflow through the skin = sum of all the little sources inside.\"\nThis converts Maxwell's integral forms into differential forms.\n\n## 2.4 Curl — circulation per unit area (\"is there a swirl here?\")\n\nThe component of ∇×**A** along **a**_n is lim(ΔS→0) [∮_L **A**·d**l**]/ΔS,\nwith L the rim of ΔS.\n\nCartesian determinant form:\n\n              | a_x     a_y     a_z  |\n    ∇ × A  =  | ∂/∂x    ∂/∂y    ∂/∂z |\n              | A_x     A_y     A_z  |\n\nCylindrical:\n∇×**A** = [(1/ρ)∂A_z/∂φ − ∂A_φ/∂z]**a**_ρ + [∂A_ρ/∂z − ∂A_z/∂ρ]**a**_φ\n        + (1/ρ)[∂(ρA_φ)/∂ρ − ∂A_ρ/∂φ]**a**_z\n\nSpherical:\n∇×**A** = (1/(r sinθ))[∂(A_φ sinθ)/∂θ − ∂A_θ/∂φ]**a**_r\n        + (1/r)[(1/sinθ)∂A_r/∂φ − ∂(rA_φ)/∂r]**a**_θ\n        + (1/r)[∂(rA_θ)/∂r − ∂A_r/∂θ]**a**_φ\n\nPhysical reading: drop a tiny paddlewheel into the field. If it spins, curl is\nnonzero, directed along the spin axis by the right-hand rule. Zero curl\neverywhere ⇒ **irrotational** / **conservative** ⇒ a potential exists.\n\n- ∇×**E** = 0 (statics): electrostatic field is conservative, V well-defined.\n- ∇×**H** = **J** + ∂**D**/∂t : current and changing E-flux make magnetic swirl.\n- ∇×**E** = −∂**B**/∂t : changing magnetic flux makes electric swirl — why\n  transformers work, and why \"voltage\" stops being single-valued in AC fields.\n\n### Stokes's theorem\n\n    ∮_L A·dl = ∫_S (∇×A)·dS\n\n\"Circulation round the rim = total swirl over any surface stretched on that rim.\"\n\n## 2.5 Two identities you must memorize\n\n    ∇ × (∇V) = 0        curl of a gradient is always zero\n    ∇ · (∇ × A) = 0     divergence of a curl is always zero\n\nConsequences:\n- ∇×**E** = 0 in statics ⇒ **E** is a gradient ⇒ **E** = −∇V exists.\n- ∇·**B** = 0 always ⇒ **B** is a curl ⇒ **B** = ∇×**A** defines the magnetic\n  vector potential **A**.\n\n## 2.6 The Laplacian\n\n∇²V = ∇·(∇V)\n\n- Cartesian: ∂²V/∂x² + ∂²V/∂y² + ∂²V/∂z²\n- Cylindrical: (1/ρ)∂/∂ρ(ρ ∂V/∂ρ) + (1/ρ²)∂²V/∂φ² + ∂²V/∂z²\n- Spherical: (1/r²)∂/∂r(r²∂V/∂r) + (1/(r²sinθ))∂/∂θ(sinθ ∂V/∂θ)\n             + (1/(r²sin²θ))∂²V/∂φ²\n\n∇²V = 0 is **Laplace's equation** (source-free regions).\n∇²V = −ρ_v/ε is **Poisson's equation**.\n\nVector identity used to derive the wave equation:\n∇²**A** = ∇(∇·**A**) − ∇×(∇×**A**)\n\n## 2.7 Worked examples\n\n**Example 1.** **A** = x²y **a**_x + yz **a**_y + xz² **a**_z. Find ∇·**A** and\n∇×**A** at (1, 2, 1).\n\n∇·**A** = 2xy + z + 2xz → 4 + 1 + 2 = **7**\n\n∇×**A**:\n- x: ∂A_z/∂y − ∂A_y/∂z = 0 − y = −y → −2\n- y: ∂A_x/∂z − ∂A_z/∂x = 0 − z² = −z² → −1\n- z: ∂A_y/∂x − ∂A_x/∂y = 0 − x² = −x² → −1\n\n∇×**A** = **−2a_x − a_y − a_z**\n\n**Example 2.** Show **E** = (Q/4πε₀r²)**a**_r is divergence-free except at r=0.\n\n∇·**E** = (1/r²) ∂/∂r [ r² · Q/(4πε₀r²) ] = (1/r²) ∂/∂r [Q/(4πε₀)] = **0**, r>0.\n\nGauss's law in action: no charge anywhere except the origin, so the field\ndiverges nowhere else — yet flux through any enclosing sphere is Q/ε₀ because\nall the source sits at that one point.\n\n**Example 3.** Verify Stokes's theorem for\n**A** = ρ cosφ **a**_ρ + ρ² sinφ **a**_φ over the quarter disc ρ ≤ 2,\n0 ≤ φ ≤ π/2 in the z = 0 plane.\n\n(∇×**A**)_z = (1/ρ)[∂(ρ·ρ²sinφ)/∂ρ − ∂(ρcosφ)/∂φ]\n            = (1/ρ)[3ρ² sinφ + ρ sinφ] = 3ρ sinφ + sinφ\n\n∫∫ (3ρ sinφ + sinφ) ρ dρ dφ = ∫₀^{π/2} sinφ dφ · ∫₀² (3ρ² + ρ) dρ\n = 1 · [ρ³ + ρ²/2]₀² = 8 + 2 = **10**\n\nThe closed line integral over the three edges gives 10 as well: the two straight\nradial edges contribute 0 (A_ρ·dl integrates to 0 at φ=0 and the a_φ term is\nperpendicular there), and the arc contributes 10.\n\n## 2.8 Exercises\n\n1. For V = x²yz find ∇V at (1,1,1), then verify ∇×(∇V) = 0.\n2. Find ∇·**A** and ∇×**A** for **A** = (1/ρ)**a**_φ, ρ ≠ 0. Why does this\n   matter for the field around a current-carrying wire?\n3. Verify the divergence theorem for **A** = r **a**_r over a sphere of radius a.\n   (Both sides = 4πa³.)\n4. Show ∇²(1/r) = 0 for r ≠ 0.\n\n## Takeaways\n\n- **grad**: scalar → vector, \"steepest ascent\".\n- **div**: vector → scalar, \"source strength\".\n- **curl**: vector → vector, \"swirl strength and axis\".\n- Divergence and Stokes theorems bridge the integral and differential forms of\n  every law that follows.\n"}, {"num": "03", "title": "Electrostatics", "body": "\nStatic charges, static fields. Everything here follows from one experimental law\nplus the calculus of Module 02.\n\n## 3.1 Coulomb's law\n\nForce on charge Q₂ due to Q₁, separated by **R**₁₂:\n\n    F₁₂ = (Q₁Q₂ / 4πε₀ R²) a_R12      [N]\n\n- ε₀ = 8.854×10⁻¹² F/m; 1/(4πε₀) ≈ 9×10⁹ m/F.\n- Like charges repel, unlike attract (sign comes out of the product Q₁Q₂).\n- Forces **superpose**: total force = vector sum of pairwise forces. This linearity\n  is what makes the whole subject tractable.\n\n## 3.2 Electric field intensity E\n\nDefine **E** as force per unit *test* charge:\n\n    E = F/Q_test      [V/m or N/C]\n\nFor a point charge Q at the origin:\n\n    E = (Q / 4πε₀ r²) a_r\n\nFor charge at **r**′ observed at **r**:\n\n    E(r) = Q(r − r′) / (4πε₀ |r − r′|³)\n\n### Continuous distributions\nReplace Q by a differential element and integrate:\n\n- Line charge ρ_L [C/m]:   **E** = ∫ ρ_L dl (**r**−**r**′)/(4πε₀|**r**−**r**′|³)\n- Surface charge ρ_S [C/m²]: same with ρ_S dS\n- Volume charge ρ_v [C/m³]: same with ρ_v dv\n\n### Three standard results — memorize these\n\n**Infinite line charge** ρ_L along the z-axis:\n\n    E = ρ_L / (2πε₀ρ)  a_ρ            (falls as 1/ρ)\n\n**Infinite sheet of charge** ρ_S in the z=0 plane:\n\n    E = ρ_S / (2ε₀)  a_n              (does NOT fall off with distance)\n\n**Two parallel sheets** +ρ_S and −ρ_S: field is ρ_S/ε₀ between them, zero\noutside. This is the parallel-plate capacitor.\n\n**Ring of charge** radius a, on its axis at height h:\n\n    E = ρ_L a h / (2ε₀ (a²+h²)^{3/2})  a_z\n\n## 3.3 Electric flux density D\n\n    D = ε₀E   (in free space)      [C/m²]\n\n**D** is deliberately defined without ε so that it depends only on the *free\ncharge*, not on the material. This makes Gauss's law material-independent.\n\nFlux: Ψ = ∫_S **D**·d**S**  [C]\n\n## 3.4 Gauss's law — the workhorse\n\n    ∮_S D·dS = Q_enc          (integral form)\n    ∇·D = ρ_v                 (differential form, via divergence theorem)\n\n**Total electric flux out of any closed surface equals the free charge enclosed.**\n\n### How to actually use it\nGauss's law is always true but only *useful* when symmetry lets you pull D out of\nthe integral. Procedure:\n\n1. Identify the symmetry (spherical, cylindrical, planar).\n2. Choose a **Gaussian surface** on which |**D**| is constant and **D** is either\n   parallel or perpendicular to d**S** everywhere.\n3. Then ∮**D**·d**S** = D × (area), and D = Q_enc/area.\n\n**Example — coaxial cable.** Inner conductor radius a carrying ρ_L, outer shield\nradius b. Gaussian surface: cylinder radius ρ, length L.\n\n    D(2πρL) = ρ_L L  ⇒  D = ρ_L/(2πρ),  E = ρ_L/(2πε ρ)   for a < ρ < b\n\nInside the conductor (ρ<a) and outside the shield (ρ>b), Q_enc = 0 ⇒ E = 0.\n\n**Example — uniformly charged sphere**, radius a, volume density ρ_v.\n\n- r > a: D(4πr²) = ρ_v(4/3)πa³ ⇒ D = ρ_v a³/(3r²)  (looks like a point charge)\n- r < a: D(4πr²) = ρ_v(4/3)πr³ ⇒ D = ρ_v r/3       (grows linearly from centre)\n\n## 3.5 Electric potential V\n\nWork done moving charge Q from A to B against the field:\n\n    W = −Q ∫_A^B E·dl\n\nPotential difference:\n\n    V_AB = V_A − V_B = −∫_A^B E·dl        [V]\n\nAbsolute potential (reference at infinity) of a point charge:\n\n    V = Q / (4πε₀ r)\n\nSuperposition applies to V too — and since V is a **scalar**, summing potentials\nis far easier than summing fields. Standard trick: find V by summation, then get\n**E** = −∇V.\n\n### The conservative property\n\n    ∮ E·dl = 0        ⟺       ∇ × E = 0\n\nWork done round a closed loop is zero. **This holds only in statics.** Module 06\nbreaks it.\n\n### E from V\n\n    E = −∇V\n\nExample: V = 10/r² in spherical → **E** = −∂V/∂r **a**_r = **20/r³ a_r** V/m.\n\n## 3.6 Electric dipole\n\nTwo charges +Q, −Q separated by small **d**. Dipole moment **p** = Q**d**.\n\n    V = (p cos θ) / (4πε₀ r²)                  falls as 1/r²\n    E = (p / 4πε₀r³)(2cosθ a_r + sinθ a_θ)     falls as 1/r³\n\nRemember the pattern: monopole V~1/r, dipole V~1/r², quadrupole V~1/r³. Higher\nmultipoles die faster. This is the basis of the multipole expansion and, later,\nof antenna theory.\n\n## 3.7 Energy in the electrostatic field\n\nAssembling n point charges takes work:\n\n    W_E = ½ Σ Q_k V_k\n\nIn continuous form, the energy lives *in the field* itself:\n\n    W_E = ½ ∫_v D·E dv = ½ ∫ ε E² dv        [J]\n\nEnergy density w_E = ½ εE² = ½ D·E = D²/(2ε)  [J/m³].\n\nThis is a conceptual turning point: energy is not \"in the charges\", it is stored\nin the space around them. Later, that stored energy is what propagates away as a\nwave.\n\n## 3.8 Capacitance\n\n    C = Q / V        [F]\n\nMethod: assume Q on the conductors → find **D** (Gauss) → find **E** → find\nV = −∫**E**·d**l** between them → divide.\n\nStandard results:\n\n| Geometry | Capacitance |\n|---|---|\n| Parallel plates, area S, spacing d | C = εS/d |\n| Coaxial, radii a<b, length L | C = 2πεL / ln(b/a) |\n| Concentric spheres, radii a<b | C = 4πε / (1/a − 1/b) |\n| Isolated sphere radius a | C = 4πεa |\n| Two-wire line, radius a, spacing d | C = πε / cosh⁻¹(d/2a) |\n\nEnergy stored: W = ½CV² = ½QV = Q²/2C.\n\n## 3.9 Worked examples\n\n**Example 1.** Point charges Q₁ = 2 mC at (0,0,0) and Q₂ = −3 mC at (2,0,0).\nFind **E** at (1,0,0).\n\nFrom Q₁: E₁ = 9×10⁹ × 2×10⁻³ / 1² = 1.8×10⁷ V/m along +**a**_x.\nFrom Q₂: distance 1 m, magnitude 9×10⁹ × 3×10⁻³ /1² = 2.7×10⁷ V/m, pointing\n*toward* Q₂ (negative charge attracts), i.e. +**a**_x.\n\n**E** = (1.8 + 2.7)×10⁷ **a**_x = **4.5×10⁷ a_x V/m**\n\n**Example 2.** A coaxial cable has a = 1 mm, b = 4 mm, ε_r = 2.25. Find C per\nmetre and the maximum E if 1 kV is applied.\n\nC/L = 2πε₀ε_r / ln(b/a) = 2π(8.854e−12)(2.25)/ln 4 = 1.252e−10/1.386\n  = **90.3 pF/m**\n\nE(ρ) = V / (ρ ln(b/a)). Maximum at ρ = a:\nE_max = 1000/(1e−3 × 1.386) = **7.2×10⁵ V/m = 0.72 MV/m**\n\n(Note: E is largest at the inner conductor — that is where cables break down,\nand why HV cable design fattens the centre conductor.)\n\n**Example 3.** Find the work to move a 2 μC charge from infinity to a point 0.5 m\nfrom a 10 μC charge.\n\nV = 9×10⁹ × 10×10⁻⁶ / 0.5 = 1.8×10⁵ V\nW = QV = 2×10⁻⁶ × 1.8×10⁵ = **0.36 J**\n\n## 3.10 Exercises\n\n1. An infinite line charge ρ_L = 5 nC/m lies along the z-axis. Find **E** at\n   (3, 4, 0). (Answer: 17.98 **a**_ρ V/m, with ρ = 5 m and **a**_ρ = 0.6**a**_x+0.8**a**_y.)\n2. A spherical shell of radius 2 m carries ρ_S = 10 nC/m². Find E at r = 1 m and\n   r = 4 m. (0 and 28.2 V/m.)\n3. V = 2x²y − 5z. Find **E** at (−4, 3, 6) and the energy density there.\n4. Derive C for concentric spheres from scratch, starting with Gauss's law.\n5. Two parallel plates 5 mm apart with ε_r = 4 have 500 V across them. Find\n   **E**, **D**, and the stored energy density.\n\n## Takeaways\n\n- Coulomb → superposition → Gauss. Gauss is Coulomb repackaged for symmetry.\n- V is a scalar; use it whenever you can, then differentiate to get **E**.\n- Energy lives in the field, density ½εE².\n- Capacitance is a pure geometry-plus-material number: Q/V, and Q cancels.\n"}, {"num": "04", "title": "Materials, Boundary Conditions, Poisson & Laplace", "body": "\n## 4.1 Conductors, dielectrics, and current\n\n**Conductors** have free electrons. **Dielectrics (insulators)** have bound\ncharges that can only shift slightly.\n\n### Convection and conduction current\n\nCurrent density **J** [A/m²]; total current I = ∫_S **J**·d**S**.\n\n- Convection: **J** = ρ_v **u** (charge physically transported, e.g. electron beam)\n- Conduction: **J** = σ**E**  ← **point form of Ohm's law**\n\nσ = conductivity [S/m]. Copper 5.8×10⁷, seawater ~4, glass ~10⁻¹².\n\nDeriving circuit Ohm's law from the point form, for a wire length L, area S:\nV = EL, I = JS = σES ⇒ R = V/I = L/(σS). Familiar, but now it is a *consequence*.\n\n### Continuity equation (charge conservation)\n\n    ∇·J = −∂ρ_v/∂t\n\n\"Current flowing out of a point = rate at which charge there decreases.\" Combined\nwith ∇·**D** = ρ_v and **J** = σ**E**, this gives charge relaxation:\n\n    ρ_v(t) = ρ_v0 e^{−t/T_r},   T_r = ε/σ\n\nFor copper T_r ≈ 1.5×10⁻¹⁹ s — charge placed inside a conductor rushes to the\nsurface essentially instantly. Hence:\n\n### Properties of a perfect conductor in statics\n1. **E** = 0 inside.\n2. ρ_v = 0 inside; all charge sits on the surface.\n3. The surface is an **equipotential**.\n4. **E** just outside is **normal** to the surface, magnitude ρ_S/ε.\n\n(Any tangential E would push surface charge sideways — it cannot survive in\nequilibrium. That is the whole proof.)\n\n## 4.2 Polarization in dielectrics\n\nAn applied field stretches each molecule into a tiny dipole. Sum per unit volume\n= **polarization P** [C/m²].\n\n    D = ε₀E + P\n    P = ε₀χ_e E        (linear, isotropic media)\n    D = ε₀(1 + χ_e)E = ε₀ε_r E = εE\n\n- χ_e = electric susceptibility; ε_r = 1 + χ_e = relative permittivity.\n- Bound charge densities: ρ_pv = −∇·**P**, ρ_ps = **P**·**a**_n.\n\nPhysical consequence: inside a dielectric the field is *reduced* by the factor\nε_r, because the induced dipoles partially cancel the applied field. This is\nexactly why inserting a dielectric raises capacitance by ε_r.\n\n**Dielectric strength**: the E-field at which the material breaks down and\nconducts. Air ≈ 3 MV/m, mica ≈ 200 MV/m. Design constraint in every HV problem.\n\n## 4.3 Boundary conditions — the most exam-heavy topic\n\nDerived by applying ∮**E**·d**l** = 0 to a thin rectangular loop straddling the\nboundary, and ∮**D**·d**S** = Q_enc to a thin pillbox straddling it.\n\n### Dielectric–dielectric\n\n**Tangential E is continuous:**\n\n    E_t1 = E_t2      ⇒  D_t1/ε₁ = D_t2/ε₂\n\n**Normal D jumps by the free surface charge:**\n\n    D_n1 − D_n2 = ρ_S     (and D_n1 = D_n2 if no free surface charge)\n    ⇒ ε₁E_n1 = ε₂E_n2\n\n### Law of refraction of field lines\nWith no free surface charge, if θ₁, θ₂ are measured from the normal:\n\n    tan θ₁ / tan θ₂ = ε₁ / ε₂\n\nField lines bend away from the normal on entering the denser (higher ε) medium.\n\n### Conductor–dielectric\n\n    E_t = 0,     D_n = ρ_S\n\nField meets a conductor at 90°, always.\n\n### Conductor–free space (same thing with ε₀)\n\n    D_t = ε₀E_t = 0,    D_n = ε₀E_n = ρ_S\n\n### Magnetic analogues (preview of Module 05)\n\n    B_n1 = B_n2                  (normal B continuous)\n    H_t1 − H_t2 = K              (tangential H jumps by surface current K)\n\n**Memory aid:** *E is tangentially continuous; D is normally continuous (up to\nρ_S). B is normally continuous; H is tangentially continuous (up to K).*\nElectric and magnetic are swapped — that duality repays memorizing.\n\n## 4.4 Poisson's and Laplace's equations\n\nStart from ∇·**D** = ρ_v, **D** = ε**E**, **E** = −∇V:\n\n    ∇²V = −ρ_v/ε        Poisson\n    ∇²V = 0             Laplace (charge-free region)\n\n### Why this matters\nCoulomb-style integration needs you to know where all the charge is. In real\nproblems you know the *boundary conditions* instead (this plate is at 100 V, that\none is grounded). Laplace's equation plus boundary conditions is the practical\nroute.\n\n### Uniqueness theorem\nA solution of Laplace's equation that satisfies the boundary conditions is **the**\nsolution. Consequence: **guess-and-verify is a legitimate method.** If your\nguess fits the equation and the boundaries, you are done — no need to justify how\nyou found it.\n\n### General solution procedure\n1. Choose the coordinate system matching the symmetry.\n2. Write ∇²V = 0 and drop all terms that symmetry kills.\n3. Integrate (usually twice), producing two constants.\n4. Apply the two boundary conditions to fix the constants.\n5. **E** = −∇V; ρ_S = D_n at conductor surfaces; Q = ∫ρ_S dS; C = Q/V.\n\n### Worked example — parallel plates\nPlates at z = 0 (V=0) and z = d (V=V₀); field varies only with z.\n\n∇²V = d²V/dz² = 0 ⇒ V = Az + B.\nBCs: B = 0, A = V₀/d ⇒ **V = V₀ z/d**\n**E** = −∇V = −(V₀/d)**a**_z ; D_n = εV₀/d = ρ_S\nQ = ρ_S S = εSV₀/d ⇒ **C = εS/d** ✓\n\n### Worked example — coaxial cable\nField varies only with ρ:\n\n(1/ρ) d/dρ (ρ dV/dρ) = 0 ⇒ ρ dV/dρ = A ⇒ V = A ln ρ + B\nBCs V(a)=V₀, V(b)=0 ⇒ **V = V₀ ln(b/ρ)/ln(b/a)**\n**E** = −dV/dρ **a**_ρ = V₀/(ρ ln(b/a)) **a**_ρ\nC = 2πεL/ln(b/a) ✓ — same as Module 03, obtained without Gauss.\n\n### Worked example — spherical\n(1/r²) d/dr(r² dV/dr)=0 ⇒ V = −A/r + B; with V(a)=V₀, V(b)=0:\nV = V₀ (1/r − 1/b)/(1/a − 1/b), giving C = 4πε/(1/a − 1/b). ✓\n\n## 4.5 Method of images\n\nA point charge Q at height h above an infinite grounded plane. The plane forces\nV = 0 on it. Replace the plane by an image charge −Q at depth h; the pair\nnaturally produces V = 0 on the midplane, so by uniqueness the field above the\nplane is correct.\n\nResults:\n- V(x,y,z) = (Q/4πε₀)[1/√(x²+y²+(z−h)²) − 1/√(x²+y²+(z+h)²)]\n- Force of attraction on Q: F = Q²/(4πε₀(2h)²) = Q²/(16πε₀h²)\n- Induced surface charge: ρ_S = −Qh / (2π(x²+y²+h²)^{3/2}); ∫ρ_S dS = −Q exactly.\n\nLine charge above a plane works the same way with an image −ρ_L.\nTwo perpendicular planes need **three** images (−, −, +) to zero both.\n\n## 4.6 Exercises\n\n1. Region 1 (z>0, ε_r=4) has **E**₁ = 5**a**_x − 2**a**_y + 3**a**_z V/m.\n   Region 2 (z<0) has ε_r = 2, no free surface charge. Find **E**₂.\n   (Tangential unchanged: 5, −2. Normal: ε₁E_z1 = ε₂E_z2 ⇒ E_z2 = 6.\n   **E**₂ = 5**a**_x − 2**a**_y + 6**a**_z V/m.)\n2. Show that V = ρ² sin φ does *not* satisfy Laplace's equation, but\n   V = ρ sin φ does.\n3. A 10 nC charge sits 2 cm above a grounded plane. Find the force on it and the\n   maximum induced surface charge density.\n4. Solve Laplace's equation for two coaxial cones (V depends on θ only) and find\n   the capacitance-like relation.\n5. Copper (σ=5.8e7, ε_r=1): compute the relaxation time and comment.\n\n## Takeaways\n\n- **J** = σ**E** is Ohm's law's true form; R = L/σS is a corollary.\n- Conductor interiors are field-free; all the action is on the surface.\n- Boundary conditions: E_t and D_n for electric, B_n and H_t for magnetic.\n- Laplace + boundary conditions + uniqueness is the practical solver, and\n  the method of images is uniqueness used cleverly.\n"}, {"num": "05", "title": "Magnetostatics", "body": "\nSteady currents, steady magnetic fields. The structure mirrors Module 03 almost\nline for line — which is the fastest way to learn it.\n\n| Electrostatics | Magnetostatics |\n|---|---|\n| Coulomb's law | Biot–Savart law |\n| Gauss's law ∮D·dS = Q | Ampère's law ∮H·dl = I |\n| **E** = −∇V | **B** = ∇×**A** |\n| ∇·**D** = ρ_v | ∇·**B** = 0 |\n| ∇×**E** = 0 | ∇×**H** = **J** |\n| C = Q/V | L = λ/I |\n| w = ½εE² | w = ½μH² |\n\n## 5.1 Biot–Savart law\n\nA current element I d**l** at **r**′ produces at **r**:\n\n    dH = I dl × a_R / (4πR²)      [A/m]\n\nwith **R** = **r** − **r**′, R = |**R**|, **a**_R = **R**/R.\n\nEquivalently d**H** = I d**l** × **R** / (4πR³).\n\nThe cross product is the whole story: the field **circles** the current. It is\nnever along the wire and never radially outward.\n\nFor surface and volume currents: I d**l** → **K** dS → **J** dv.\n\n### Standard results — memorize\n\n**Finite straight filament** along z, current I, field at perpendicular distance ρ,\nwith α₁, α₂ the angles subtended from the field point to the two ends\n(measured from the wire, positive toward +z):\n\n    H = I(sin α₂ − sin α₁) / (4πρ)   a_φ\n\n**Infinite straight wire** (α₁ = −90°, α₂ = +90°):\n\n    H = I / (2πρ)  a_φ        ⇒  B = μ₀I/(2πρ)\n\nDirection by right-hand rule: thumb along I, fingers curl along **H**.\n\n**Circular loop** radius a, on-axis at height h:\n\n    H = I a² / (2(a²+h²)^{3/2})  a_z ;  at centre H = I/2a\n\n**Infinite solenoid**, n turns per metre: H = nI inside, 0 outside.\n**Finite solenoid** on axis: H = (nI/2)(cos θ₂ − cos θ₁).\n**Toroid**, N turns, mean radius ρ: H = NI/(2πρ).\n**Infinite sheet of current K a_x in z=0 plane**: **H** = ½ **K** × **a**_n\n (i.e. ½K a_y for z>0 and −½K a_y for z<0 — uniform, distance-independent,\n the magnetic twin of the charged sheet).\n\n## 5.2 Ampère's circuital law\n\n    ∮_L H·dl = I_enc          (integral)\n    ∇ × H = J                 (differential, via Stokes)\n\nThe magnetic counterpart of Gauss's law, and used the same way: pick an\n**Amperian loop** on which H is constant and parallel to d**l**.\n\n**Coax example.** Inner conductor radius a carrying I, outer shell b<ρ<c carrying\n−I return.\n\n- ρ < a: I_enc = I(ρ²/a²) ⇒ H = Iρ/(2πa²)\n- a < ρ < b: H = I/(2πρ)\n- b < ρ < c: I_enc = I[1 − (ρ²−b²)/(c²−b²)] ⇒ H falls to 0 at ρ=c\n- ρ > c: I_enc = 0 ⇒ **H = 0** — the coax confines its own field entirely.\n  This is why coaxial cable neither radiates nor picks up interference.\n\n## 5.3 Magnetic flux density and flux\n\n    B = μ₀H   (free space)     [T = Wb/m²]\n    Ψ = ∫_S B·dS               [Wb]\n\n**Gauss's law for magnetism:**\n\n    ∮_S B·dS = 0      ⇔     ∇·B = 0\n\nNo magnetic monopoles. Every field line that leaves a region comes back. This\nis the *only* one of Maxwell's four equations with a zero on the right, and the\nonly one never modified by anything later.\n\n## 5.4 Magnetic potentials\n\n**Scalar potential** V_m, valid only where **J** = 0:\n    H = −∇V_m , with ∇²V_m = 0.\nCaution: V_m is multivalued (walk around a wire and it increases by I each lap).\n\n**Vector potential A** [Wb/m], valid everywhere because ∇·**B** = 0 always:\n\n    B = ∇ × A\n    A = ∫ μ₀ I dl / (4πR)     (line current)\n      = ∫ μ₀ J dv / (4πR)     (volume current)\n\nFlux can then be computed as a line integral instead of a surface one:\nΨ = ∫**B**·d**S** = ∮**A**·d**l** (Stokes). This is often far easier.\n\nIn the Coulomb gauge (∇·**A** = 0): ∇²**A** = −μ₀**J** — Poisson again, one\nequation per component.\n\n## 5.5 Magnetic forces\n\n**On a moving charge (Lorentz force):**\n\n    F = q(E + u × B)\n\nNote **F** ⊥ **u**, so a magnetic field does **no work** — it changes direction\nonly, never speed. Cyclotron radius r = mu/(qB), angular frequency ω = qB/m.\n\n**On a current element:**  d**F** = I d**l** × **B**;  **F** = I **L** × **B**\nfor a straight wire in a uniform field.\n\n**Between two parallel wires**, separation d, currents I₁ and I₂:\n\n    F/L = μ₀I₁I₂ / (2πd)\n\nAttract if currents are parallel, repel if antiparallel. (This is the historical\ndefinition of the ampere.)\n\n**Torque on a loop:** **T** = **m** × **B**, with magnetic moment **m** = I S **a**_n.\nThis is the entire operating principle of motors and moving-coil meters.\n\n## 5.6 Magnetic materials\n\nMagnetization **M** [A/m] = magnetic dipole moment per unit volume.\n\n    B = μ₀(H + M),   M = χ_m H,   B = μ₀(1+χ_m)H = μ₀μ_r H = μH\n\n- **Diamagnetic** (χ_m slightly negative): bismuth, copper, water.\n- **Paramagnetic** (χ_m slightly positive): aluminium, tungsten.\n- **Ferromagnetic** (χ_m huge, nonlinear, hysteretic): iron, nickel, cobalt,\n  ferrites. μ_r from hundreds to 10⁵. Loses magnetism above the **Curie\n  temperature**.\n\n**Hysteresis loop**: B vs H is not single-valued. Retentivity B_r (remaining B at\nH=0) and coercivity H_c (H needed to force B to 0). Loop area = energy lost per\ncycle per unit volume — the hysteresis loss in every transformer core.\n\n## 5.7 Magnetic boundary conditions\n\n    B_n1 = B_n2                     (normal B continuous)\n    H_t1 − H_t2 = K                 (tangential H jumps by surface current)\n    ⇒ H_t1 = H_t2 when K = 0, hence B_t1/μ₁ = B_t2/μ₂\n\nRefraction: tan θ₁ / tan θ₂ = μ₁ / μ₂.\n\nPractical consequence: at an air–iron boundary (μ₂ ≫ μ₁), lines in the iron run\nalmost parallel to the surface, and lines leaving iron into air emerge almost\nperpendicular. That is why iron \"guides\" flux — the basis of magnetic circuits.\n\n## 5.8 Inductance\n\nFlux linkage λ = NΨ.\n\n    L = λ / I         [H]\n\nMethod: assume I → find **H** (Ampère) → find **B** → find Ψ = ∫**B**·d**S** →\nmultiply by N → divide by I.\n\n| Geometry | Inductance |\n|---|---|\n| Solenoid, N turns, length ℓ, area S | L = μN²S/ℓ |\n| Toroid, N turns, mean radius ρ₀, area S | L = μN²S/(2πρ₀) |\n| Coax, radii a<b, per unit length | L = (μ/2π) ln(b/a) |\n| Two-wire line, per unit length | L = (μ/π) cosh⁻¹(d/2a) |\n\nMutual inductance M₁₂ = λ₁₂/I₂ = M₂₁; coupling coefficient k = M/√(L₁L₂), 0≤k≤1.\n\nEnergy: W_m = ½LI² = ½ ∫ **B**·**H** dv; density w_m = ½μH² = B²/2μ.\n\nNote for coax: LC = με per unit length — a relation that reappears as the\nfundamental transmission-line identity in Module 08.\n\n## 5.9 Magnetic circuits\n\nDirect analogy with DC circuits:\n\n| Electric | Magnetic |\n|---|---|\n| EMF V | MMF ℱ = NI [A-turns] |\n| Current I | Flux Ψ [Wb] |\n| Resistance R = ℓ/σS | Reluctance ℛ = ℓ/μS [A-t/Wb] |\n| V = IR | ℱ = Ψℛ |\n\nKirchhoff analogues: ΣNI = ΣℛΨ round a loop; ΣΨ = 0 at a node.\n\n**Air gaps dominate.** A 1 mm gap in an iron core with μ_r = 5000 has the same\nreluctance as 5 m of iron. Whenever a core has a gap, compute the gap first.\n\n## 5.10 Worked examples\n\n**Example 1.** A 5 A current flows in an infinite wire on the z-axis. Find **H**\nat (3, 4, 0) and the force per metre on a parallel wire at (3,4,0) carrying 2 A\nin the same direction.\n\nρ = 5 m. H = 5/(2π·5) = **0.159 A/m**, direction **a**_φ.\nB = μ₀H = 4π×10⁻⁷ × 0.159 = 2×10⁻⁷ T.\nF/L = μ₀I₁I₂/(2πd) = (4π×10⁻⁷)(5)(2)/(2π·5) = **4×10⁻⁷ N/m**, attractive.\n\n**Example 2.** A toroid has N = 500, mean radius 10 cm, cross-section 4 cm²,\nμ_r = 1000. Find L and the current for Ψ = 0.4 mWb.\n\nL = μ₀μ_r N²S/(2πρ₀) = (4π×10⁻⁷)(1000)(250000)(4×10⁻⁴)/(2π×0.1)\n  = (1.2566e−3)(250000)(4e−4)/0.6283 = 0.1257/0.6283 = **0.2 H**\n\nℛ = ℓ/μS = 0.6283/((1.2566e−3)(4e−4)) = 1.25×10⁶ A-t/Wb\nNI = Ψℛ = 4×10⁻⁴ × 1.25×10⁶ = 500 A-t ⇒ **I = 1 A**\n\n**Example 3.** Find the energy stored per metre in a coax with a = 1 mm,\nb = 5 mm, carrying 10 A.\n\nL/length = (μ₀/2π)ln(5) = 2×10⁻⁷ × 1.609 = 3.22×10⁻⁷ H/m\nW = ½LI² = ½(3.22e−7)(100) = **16.1 μJ/m**\n(Ignoring the internal inductance of the centre conductor, μ₀/8π = 5×10⁻⁸ H/m,\nwhich would add 2.5 μJ/m.)\n\n## 5.11 Exercises\n\n1. Use Ampère's law to find **H** inside and outside a solid cylindrical conductor\n   of radius a carrying uniform current I.\n2. A square loop of side 2 m carries 5 A in a field **B** = 0.5**a**_z T, the loop\n   lying in the xy-plane. Find the torque. (Zero — **m** ∥ **B**. Now tilt it 30°\n   and redo.)\n3. Derive L per unit length for a coax from energy, W = ½∫μH² dv, and confirm it\n   matches (μ/2π)ln(b/a).\n4. An iron core (μ_r = 2000, mean length 40 cm, area 5 cm²) has a 2 mm air gap\n   and 300 turns. Find the current for 0.8 mWb.\n5. Two media, μ_r1 = 1 (z>0) and μ_r2 = 200 (z<0), no surface current.\n   **B**₁ = 2**a**_x + 5**a**_z mT. Find **B**₂.\n\n## Takeaways\n\n- Biot–Savart is Coulomb's magnetic twin, with a cross product bolted on.\n- Ampère's law is the symmetry shortcut; use it exactly like Gauss's law.\n- ∇·**B** = 0 is permanent and absolute: no monopoles, closed loops always.\n- Magnetic fields do no work; they steer, they never accelerate.\n- L, like C, is pure geometry and material: assume I, find Ψ, divide.\n"}, {"num": "06", "title": "Time-Varying Fields and Maxwell's Equations", "body": "\nEverything so far assumed nothing changes with time. Release that assumption and\nelectric and magnetic fields stop being two subjects and become one.\n\n## 6.1 Faraday's law — changing B makes E\n\nExperimental fact: a changing magnetic flux through a loop drives a current.\n\n    emf = −dΨ/dt = −N dΨ/dt          [V]\n\nThe minus sign is **Lenz's law**: the induced current opposes the change that\ncreated it. (If it did not, you would get free energy — the sign is required by\nconservation of energy.)\n\nIn field terms:\n\n    ∮_L E·dl = −d/dt ∫_S B·dS\n    ∇ × E = −∂B/∂t                   (differential form)\n\n**This kills electrostatics' central convenience.** ∮**E**·d**l** is no longer\nzero, so **E** is no longer conservative and \"the voltage at a point\" is no longer\nwell-defined when fields vary in time. Circuit theory survives only because\nloops are usually tiny compared to a wavelength.\n\n### Three ways flux can change\n\nemf = −∫ (∂**B**/∂t)·d**S**  +  ∮ (**u** × **B**)·d**l**\n       ↑ transformer emf         ↑ motional emf\n\n1. **Transformer emf** — stationary loop, time-varying B. The transformer.\n2. **Motional emf** — moving conductor in a static B. The generator.\n   For a rod of length ℓ moving at velocity u perpendicular to B: emf = Bℓu.\n3. Both together — a rotating loop in a static field: Ψ = BS cos ωt, so\n   emf = BSω sin ωt. That is the sinusoidal AC generator, derived in one line.\n\n## 6.2 Displacement current — changing E makes B\n\nAmpère's law ∇×**H** = **J** is **inconsistent** with charge conservation. Take\nthe divergence of both sides:\n\n    ∇·(∇×H) = 0  ⇒  ∇·J = 0\n\nBut the continuity equation says ∇·**J** = −∂ρ_v/∂t, which is *not* zero when\ncharge accumulates.\n\n**The physical paradox.** Apply Ampère's law to a loop around a wire feeding a\ncapacitor. Stretch a flat surface across the loop: current I passes through, so\n∮**H**·d**l** = I. Now stretch a bulging surface that passes *between* the\ncapacitor plates: no conduction current crosses it, so ∮**H**·d**l** = 0. Same\nloop, two answers. Something is missing.\n\n**Maxwell's fix.** Add a term:\n\n    ∇ × H = J + ∂D/∂t\n\n**J**_d = ∂**D**/∂t is the **displacement current density**. Between the\ncapacitor plates, the changing E-field supplies exactly the missing current, and\nboth surfaces now give the same answer. Check:\n∇·(∇×**H**) = ∇·**J** + ∂(∇·**D**)/∂t = −∂ρ_v/∂t + ∂ρ_v/∂t = 0 ✓\n\nThis term is not bookkeeping. It is the reason electromagnetic waves exist: a\nchanging E makes an H, whose change makes an E, and the pair walks off into\nspace needing no charges at all. Maxwell predicted light from this in 1865.\n\n**Ratio of conduction to displacement current** (harmonic fields, e^{jωt}):\n\n    |J_c|/|J_d| = σ/(ωε)         \"loss tangent\" tan δ\n\n- σ/ωε ≫ 1 → good conductor (copper is a conductor up to optical frequencies)\n- σ/ωε ≪ 1 → good dielectric\n- The classification is **frequency-dependent**: wet soil is a conductor at 60 Hz\n  and a dielectric at 10 GHz.\n\n## 6.3 Maxwell's equations — the complete set\n\n### Differential form (point form)\n\n| Equation | Name | Says |\n|---|---|---|\n| ∇·**D** = ρ_v | Gauss's law | charge is the source of E-flux |\n| ∇·**B** = 0 | Gauss's law (magnetic) | no magnetic charge |\n| ∇×**E** = −∂**B**/∂t | Faraday | changing B curls E |\n| ∇×**H** = **J** + ∂**D**/∂t | Ampère–Maxwell | current and changing D curl H |\n\n### Integral form\n\n| Equation |\n|---|\n| ∮_S **D**·d**S** = ∫_v ρ_v dv = Q_enc |\n| ∮_S **B**·d**S** = 0 |\n| ∮_L **E**·d**l** = −d/dt ∫_S **B**·d**S** |\n| ∮_L **H**·d**l** = ∫_S (**J** + ∂**D**/∂t)·d**S** |\n\n### Constitutive relations (the material's contribution)\n\n    D = εE,    B = μH,    J = σE\n\nFour field equations + three constitutive relations + boundary conditions =\na complete, solvable description of all classical electromagnetism.\n\n### Time-harmonic (phasor) form\nFor fields varying as e^{jωt}, replace ∂/∂t → jω:\n\n    ∇·D_s = ρ_vs\n    ∇·B_s = 0\n    ∇×E_s = −jωB_s\n    ∇×H_s = J_s + jωD_s\n\nPhasors turn PDEs in space-and-time into PDEs in space alone. This is how every\npractical problem from Module 07 on is actually solved. Recover the real field\nwith **E**(t) = Re{**E**_s e^{jωt}}.\n\n## 6.4 Boundary conditions, general form\n\n    a_n × (E₁ − E₂) = 0          tangential E continuous\n    a_n × (H₁ − H₂) = K          tangential H jumps by surface current\n    a_n · (D₁ − D₂) = ρ_S        normal D jumps by surface charge\n    a_n · (B₁ − B₂) = 0          normal B continuous\n\nAt a perfect conductor (σ→∞): E_t = 0, H_n = 0, D_n = ρ_S, H_t = K.\n\n## 6.5 Poynting's theorem — where the energy goes\n\nTake **E**·(∇×**H**) − **H**·(∇×**E**) and use the identity\n∇·(**E**×**H**) = **H**·(∇×**E**) − **E**·(∇×**H**):\n\n    −∮_S (E × H)·dS = ∂/∂t ∫_v ½(εE² + μH²) dv + ∫_v σE² dv\n\nRead it right to left:\n- ∫σE² dv = **ohmic power dissipated** inside the volume\n- ∂/∂t ∫½(εE²+μH²) dv = **rate of increase of stored field energy**\n- Therefore the left side is the **power flowing in through the surface**.\n\nDefine the **Poynting vector**:\n\n    S = E × H         [W/m²]\n\nIt gives the instantaneous power flow per unit area, in the direction of\npropagation. **E**, **H**, **S** form a right-handed triad.\n\nFor time-harmonic fields, the time-average is\n\n    S_avg = ½ Re{E_s × H_s*}        [W/m²]\n\n**Worth pausing on:** in a DC circuit, energy does not flow *through* the copper.\n**E** points along the wire (driving current) and **H** circles it, so\n**S** = **E**×**H** points radially *into* the wire from the surrounding space.\nThe energy travels in the field around the conductor and is absorbed into the\nwire as heat. The wire guides; the field carries. Once you accept that, the\ntransmission line and the waveguide are the same idea taken seriously.\n\n## 6.6 Worked examples\n\n**Example 1.** A conducting bar slides at 10 m/s along rails 0.5 m apart in\n**B** = 0.2**a**_z T (rails in the xy-plane, bar along y, moving along x).\nFind the emf.\n\nemf = Bℓu = 0.2 × 0.5 × 10 = **1 V**\nDirection: **u**×**B** = 10**a**_x × 0.2**a**_z = −2**a**_y, so the emf drives\ncurrent in the −**a**_y direction in the bar.\n\n**Example 2.** A parallel-plate capacitor, plate area 5 cm², spacing 3 mm,\nε_r = 2, has v(t) = 50 sin(10³t) V applied. Find the displacement current.\n\nE = v/d, D = εE = ε₀ε_r v/d\nJ_d = ∂D/∂t = (ε₀ε_r/d) dv/dt\nI_d = J_d S = (ε₀ε_r S/d)(dv/dt) = C dv/dt\nC = (8.854e−12)(2)(5e−4)/3e−3 = 2.95×10⁻¹² F\nI_d = 2.95e−12 × 50 × 10³ cos(10³t) = **0.1476 cos(10³t) nA**\n\nNote the result *is* I = C dv/dt. Displacement current is exactly what makes a\ncapacitor pass AC — a fact you already used in circuit theory without knowing why.\n\n**Example 3.** Show that **E** = E₀ sin(ωt − βz)**a**_x satisfies Faraday's law\nand find **H**.\n\n∇×**E** = −∂E_x/∂z **a**_y = βE₀cos(ωt−βz)**a**_y\nSet equal to −∂**B**/∂t: ∂**B**/∂t = −βE₀cos(ωt−βz)**a**_y\n**B** = −(βE₀/ω) sin(ωt−βz)**a**_y ... integrating with zero DC term:\n**B** = (βE₀/ω) sin(ωt−βz)**a**_y (sign convention aside, the point stands)\n\nSo **H** is perpendicular to **E**, in phase with it, and E/H = ω/(βμ) = η.\n**S** = **E**×**H** is along **a**_z: the wave carries power in the direction of\ntravel. That is Module 07 in one example.\n\n## 6.7 Exercises\n\n1. A circular loop of radius 10 cm lies in the xy-plane in\n   **B** = 0.5 sin(100t)**a**_z T. Find the induced emf.\n2. Seawater has σ = 4 S/m, ε_r = 81. At what frequency are the conduction and\n   displacement currents equal? (σ = ωε ⇒ f = σ/(2πε) ≈ 888 MHz.)\n3. Show that ∇·**J** + ∂ρ_v/∂t = 0 follows from Maxwell's equations.\n4. Compute the Poynting vector inside a cylindrical resistor of radius a,\n   length ℓ, carrying I with voltage V across it. Show ∮**S**·d**S** = −VI,\n   i.e. exactly the dissipated power flows inward.\n5. Write Maxwell's equations in phasor form for a source-free lossless medium\n   and combine them into a single equation in **E**_s.\n\n## Takeaways\n\n- Faraday: changing B curls E. Ampère–Maxwell: current *and* changing D curl H.\n- Displacement current is not a correction; it is the mechanism of radiation.\n- The four equations plus **D**=ε**E**, **B**=μ**H**, **J**=σ**E** are complete.\n- **S** = **E**×**H** tells you where the energy actually is: in the field,\n  not in the wire.\n"}, {"num": "07", "title": "Uniform Plane Waves", "body": "\n## 7.1 Deriving the wave equation\n\nSource-free region (ρ_v = 0, **J** = σ**E**). Take the curl of Faraday's law:\n\n    ∇×(∇×E) = −μ ∂(∇×H)/∂t = −μ ∂/∂t (σE + ε ∂E/∂t)\n\nUse ∇×(∇×**E**) = ∇(∇·**E**) − ∇²**E**, and ∇·**E** = 0:\n\n    ∇²E = μσ ∂E/∂t + με ∂²E/∂t²\n\nIn a **lossless** medium (σ = 0):\n\n    ∇²E = με ∂²E/∂t²\n\nThis is the wave equation, with speed u = 1/√(με). In free space\nu = 1/√(μ₀ε₀) = 2.998×10⁸ m/s = c. Maxwell computed this from purely electrical\nmeasurements, got the speed of light, and concluded light is an EM wave.\n\n## 7.2 The uniform plane wave\n\n\"Uniform plane wave\": **E** and **H** are constant over any plane perpendicular\nto the direction of travel, and both lie *in* that plane (transverse). Take\npropagation along +z and **E** along x.\n\nPhasor form: ∇²**E**_s = γ²**E**_s, where the **propagation constant** is\n\n    γ = √(jωμ(σ + jωε)) = α + jβ\n\n- α = **attenuation constant** [Np/m]\n- β = **phase constant** [rad/m]\n\nSolution:\n\n    E(z,t) = E₀ e^{−αz} cos(ωt − βz) a_x\n    H(z,t) = (E₀/|η|) e^{−αz} cos(ωt − βz − θ_η) a_y\n\nGeneral expressions:\n\n    α = ω √( με/2 [ √(1 + (σ/ωε)²) − 1 ] )\n    β = ω √( με/2 [ √(1 + (σ/ωε)²) + 1 ] )\n\n**Intrinsic impedance:**\n\n    η = √( jωμ / (σ + jωε) ) = |η| ∠θ_η        [Ω]\n\nwith |η| = √(μ/ε) / [1+(σ/ωε)²]^{1/4} and θ_η = ½ tan⁻¹(σ/ωε), 0 ≤ θ_η ≤ 45°.\n\n**Derived quantities:**\n- wavelength λ = 2π/β\n- phase velocity u = ω/β = fλ\n- skin depth δ = 1/α (distance for the amplitude to fall to 1/e = 36.8%)\n\n**Key structural facts (true for every plane wave):**\n1. **E** ⊥ **H** ⊥ direction of propagation (a TEM wave).\n2. **E** × **H** points in the direction of travel.\n3. E/H = η at every point.\n4. In a lossy medium **H** *lags* **E** by θ_η.\n\n## 7.3 The four cases\n\n### (a) Free space (σ=0, μ=μ₀, ε=ε₀)\nα = 0, β = ω√(μ₀ε₀) = ω/c, η = η₀ = **377 Ω** (≈120π), u = c.\n\n### (b) Lossless dielectric (σ ≈ 0)\nα = 0, β = ω√(με), η = √(μ/ε), u = 1/√(με) = c/√(ε_r μ_r).\n\nRefractive index n = √(ε_r μ_r); for nonmagnetic materials n = √ε_r.\n\n### (c) Good conductor (σ/ωε ≫ 1)\n\n    α = β = √(πfμσ) = 1/δ\n    δ = 1/√(πfμσ)         skin depth\n    η = √(ωμ/σ) ∠45°      ⇒ H lags E by exactly 45°\n    u = ω/β = √(2ω/μσ),   λ = 2πδ\n\n**Skin effect.** At high frequency current crowds into a surface layer of\nthickness ~δ. Copper (σ=5.8e7, μ₀):\n\n| Frequency | δ |\n|---|---|\n| 50 Hz | 9.3 mm |\n| 1 kHz | 2.1 mm |\n| 1 MHz | 66 μm |\n| 1 GHz | 2.1 μm |\n\nConsequences you can now explain: AC resistance exceeds DC resistance;\ntransmission lines use hollow or stranded (Litz) conductors; silver plating a\nwaveguide works because only the top few μm carry current; and a metal box is an\nexcellent shield at RF but poor at 50 Hz.\n\nSurface resistance R_s = 1/(σδ) = √(πfμ/σ) [Ω/square]; AC resistance of a round\nwire radius a ≈ R_s·(ℓ/2πa) when a ≫ δ.\n\n### (d) Good (lossy) dielectric (σ/ωε ≪ 1)\n\n    α ≈ (σ/2)√(μ/ε)      (small, frequency-independent to first order)\n    β ≈ ω√(με)[1 + (1/8)(σ/ωε)²] ≈ ω√(με)\n    η ≈ √(μ/ε)[1 + j σ/(2ωε)]\n\nOften written with complex permittivity ε = ε′ − jε″ and loss tangent\ntan δ = ε″/ε′ = σ/(ωε).\n\n## 7.4 Power and the Poynting vector\n\n    S_avg = ½ Re{E_s × H_s*} = (E₀²/2|η|) e^{−2αz} cos θ_η  a_z    [W/m²]\n\nPower falls as e^{−2αz} — **twice** the field attenuation rate, because power\ngoes as the square of amplitude.\n\nAttenuation in decibels: α[dB/m] = 8.686 × α[Np/m].\n\n## 7.5 Polarization\n\nThe path traced by the tip of **E** at a fixed point, over one cycle.\n\n- **Linear**: E_x and E_y in phase (or one is zero). Tip oscillates along a line.\n- **Circular**: equal amplitudes, 90° out of phase. Tip traces a circle. RHCP or\n  LHCP depending on sign.\n- **Elliptical**: the general case.\n\nPractical relevance: a linearly polarized receiving antenna misaligned by angle θ\nfrom the incoming wave loses cos²θ in power (fully cross-polarized = nothing).\nSatellite links use circular polarization to be immune to receiver rotation and\nto Faraday rotation in the ionosphere.\n\n## 7.6 Reflection and transmission at normal incidence\n\nWave in medium 1 (η₁) hits a plane boundary with medium 2 (η₂) at z = 0.\n\n    Γ = (η₂ − η₁)/(η₂ + η₁)        reflection coefficient\n    τ = 2η₂/(η₂ + η₁)              transmission coefficient\n    1 + Γ = τ\n\nSpecial cases:\n- η₂ = η₁ (matched): Γ = 0, everything transmits.\n- Perfect conductor (η₂ = 0): Γ = −1. Total reflection with a 180° phase flip;\n  **E** = 0 at the surface — that is the boundary condition E_t = 0, recovered.\n- η₂ = ∞: Γ = +1.\n\nStanding waves form from incident + reflected:\n\n    SWR (s) = (1+|Γ|)/(1−|Γ|) = E_max/E_min,   1 ≤ s ≤ ∞\n\nPower: fraction reflected = |Γ|², fraction transmitted = 1 − |Γ|².\n\n## 7.7 Oblique incidence (summary)\n\nAngles obey **Snell's laws**:\n- θ_i = θ_r (reflection)\n- sin θ_i / sin θ_t = √(μ₂ε₂)/√(μ₁ε₁) = n₂/n₁ (refraction)\n\nTwo polarizations behave differently:\n- **Perpendicular (TE)**: **E** ⊥ plane of incidence.\n  Γ_⊥ = (η₂cosθ_i − η₁cosθ_t)/(η₂cosθ_i + η₁cosθ_t)\n- **Parallel (TM)**: **E** in the plane of incidence.\n  Γ_∥ = (η₂cosθ_t − η₁cosθ_i)/(η₂cosθ_t + η₁cosθ_i)\n\nTwo named consequences:\n- **Brewster angle** θ_B = tan⁻¹(√(ε₂/ε₁)): Γ_∥ = 0, parallel polarization is\n  fully transmitted. This is why polarized sunglasses cut glare off water.\n- **Total internal reflection** for n₁ > n₂ beyond the critical angle\n  θ_c = sin⁻¹(n₂/n₁). This is how optical fibre works.\n\n## 7.8 Worked examples\n\n**Example 1.** In free space, **E** = 10 cos(10⁸t − βz)**a**_x V/m. Find β, λ,\n**H**, and S_avg.\n\nβ = ω/c = 10⁸/3×10⁸ = **0.333 rad/m**\nλ = 2π/β = **18.85 m**;  f = ω/2π = 15.9 MHz\nH₀ = E₀/η₀ = 10/377 = 26.5 mA/m ⇒ **H** = 26.5 cos(10⁸t − 0.333z)**a**_y mA/m\nS_avg = E₀²/(2η₀) = 100/754 = **0.133 W/m²**\n\n**Example 2.** A wave at 10 GHz in copper (σ = 5.8×10⁷). Find δ, α, β, η, λ, u.\n\nδ = 1/√(πfμ₀σ) = 1/√(π × 10¹⁰ × 4π×10⁻⁷ × 5.8×10⁷)\n  = 1/√(2.29×10¹²) = 1/1.513×10⁶ = **0.66 μm**\nα = β = 1/δ = **1.513×10⁶ (Np/m and rad/m)**\n|η| = √(2)·... simpler: |η| = √(ωμ/σ) = √(2π×10¹⁰×4π×10⁻⁷/5.8×10⁷)\n  = √(1.362×10⁻³) = 0.0369 Ω, so **η = 0.0369∠45° Ω**\nλ = 2πδ = **4.15 μm**;  u = ω/β = 6.28×10¹⁰/1.513×10⁶ = **4.15×10⁴ m/s**\n\nNote how slow and how short: an EM wave inside copper crawls, and dies within a\nmicron. That is what \"conductors don't let fields in\" means quantitatively.\n\n**Example 3.** A plane wave in air strikes a dielectric with ε_r = 4 normally.\nFind Γ, τ, SWR, and the transmitted power fraction.\n\nη₁ = 377, η₂ = 377/√4 = 188.5\nΓ = (188.5 − 377)/(188.5 + 377) = −188.5/565.5 = **−0.333**\nτ = 2(188.5)/565.5 = **0.667**\ns = (1+0.333)/(1−0.333) = **2.0**\nReflected power = |Γ|² = 11.1%; **transmitted = 88.9%**\n\n**Example 4.** Loss tangent check: dry earth σ = 10⁻³ S/m, ε_r = 10.\nAt 1 MHz: σ/ωε = 10⁻³/(2π×10⁶ × 10 × 8.854×10⁻¹²) = 10⁻³/5.56×10⁻⁴ = **1.8**\nNeither a good conductor nor a good dielectric — use the exact formulas.\n\n## 7.9 Exercises\n\n1. A 100 MHz wave travels in a medium with ε_r = 9, μ_r = 1, σ = 0. Find u, λ, η.\n2. Find the skin depth of aluminium (σ = 3.5×10⁷) at 60 Hz and at 1 GHz.\n3. **E** = 5cos(ωt−βz)**a**_x + 5sin(ωt−βz)**a**_y. What polarization is this?\n4. A wave in a dielectric (ε_r=2.25) hits free space normally. Find Γ, SWR.\n5. Light in glass (n=1.5) hits an air interface. Find the critical angle and\n   the Brewster angle.\n6. A radio wave attenuates by 30 dB over 100 m. Find α in Np/m.\n\n## Takeaways\n\n- One wave equation, one propagation constant γ = α + jβ, four special cases.\n- η is the field-theory version of characteristic impedance; 377 Ω in free space.\n- Skin depth explains AC resistance, shielding, and why RF conductors are hollow.\n- Γ and SWR at a boundary are exactly the transmission-line results of Module 08,\n  arrived at from fields instead of circuits.\n"}, {"num": "08", "title": "Transmission Lines", "body": "\nWhere field theory hands the results back to circuit theory.\n\n## 8.1 When does a wire stop being a wire?\n\nCircuit theory assumes signals appear everywhere in the circuit simultaneously.\nThat is valid when the physical length ℓ ≪ λ. Rule of thumb: if ℓ > λ/10, you\nmust treat the connection as a transmission line.\n\nAt 50 Hz, λ = 6000 km — the wiring in your house is a lumped circuit.\nAt 3 GHz, λ = 10 cm — a 2 cm PCB trace is a transmission line.\n\n## 8.2 The distributed model\n\nA line is modelled per unit length by four parameters:\n\n- R [Ω/m] — conductor loss (both conductors)\n- L [H/m] — series inductance\n- G [S/m] — dielectric leakage\n- C [F/m] — shunt capacitance\n\n**Universal identities** (any TEM line, any cross-section):\n\n    LC = με        and        G/C = σ/ε\n\n| Line | L (H/m) | C (F/m) | R (Ω/m) |\n|---|---|---|---|\n| Coax (a,b) | (μ/2π)ln(b/a) | 2πε/ln(b/a) | (R_s/2π)(1/a + 1/b) |\n| Two-wire (a, d) | (μ/π)cosh⁻¹(d/2a) | πε/cosh⁻¹(d/2a) | R_s/(πa) |\n| Parallel plate (w, d) | μd/w | εw/d | 2R_s/w |\n\n## 8.3 Telegrapher's equations and their solution\n\n    ∂V/∂z = −(R + jωL) I\n    ∂I/∂z = −(G + jωC) V\n\nCombine:  d²V/dz² = γ²V, with\n\n    γ = α + jβ = √((R + jωL)(G + jωC))\n\n    Z₀ = √( (R + jωL) / (G + jωC) )      characteristic impedance [Ω]\n\nSolution: V(z) = V₀⁺e^{−γz} + V₀⁻e^{+γz}, and I(z) = (V₀⁺e^{−γz} − V₀⁻e^{+γz})/Z₀.\nForward wave and backward wave — note the **minus sign** on the reflected current.\n\n### Lossless line (R = G = 0) — the case you will use 90% of the time\n\n    α = 0,   β = ω√(LC),   Z₀ = √(L/C)  (real)\n    u = 1/√(LC) = 1/√(με),   λ = 2π/β = u/f\n\n**Z₀ is not a resistance you can measure with an ohmmeter.** It is the ratio V/I\nof a *single travelling wave*. An infinitely long line — or a finite line\nterminated in Z₀ — draws current as if it were a Z₀ resistor, because no wave\never comes back.\n\nTypical values: 50 Ω (RF/instrumentation), 75 Ω (video/TV), 300 Ω (twin-lead\nantenna feed), 100 Ω differential (Ethernet).\n\n### Distortionless line\nIf RC = GL then α = √(RG) and β = ω√(LC): attenuation and velocity become\nfrequency-independent, so a pulse keeps its shape. Z₀ = √(R/G), real.\n(Heaviside's insight — historically, adding series inductance \"loading coils\" to\ntelephone lines to satisfy this condition made long-distance telephony work.)\n\n## 8.4 Reflection, SWR, and input impedance\n\nAt a load Z_L at z = 0, with the line of impedance Z₀:\n\n    Γ_L = (Z_L − Z₀)/(Z_L + Z₀)\n    s = SWR = (1 + |Γ|)/(1 − |Γ|)\n    |Γ| = (s − 1)/(s + 1)\n\nReturn loss = −20 log₁₀|Γ| dB.\n\nReflection coefficient at distance ℓ from the load: Γ(ℓ) = Γ_L e^{−2γℓ},\nwhich for a lossless line is just Γ_L e^{−j2βℓ} — same magnitude, rotating phase.\n\n### Input impedance — the master formula\n\n    Z_in(ℓ) = Z₀ · (Z_L + jZ₀ tan βℓ) / (Z₀ + jZ_L tan βℓ)     [lossless]\n\nLossy version: replace jtan βℓ with tanh γℓ.\n\n### Special lengths — memorize these\n\n| Length | Result | Use |\n|---|---|---|\n| ℓ = λ/2 | Z_in = Z_L | \"half-wave repeater\"; insert without effect |\n| ℓ = λ/4 | Z_in = Z₀²/Z_L | **quarter-wave transformer** — impedance matching |\n| Z_L = 0, ℓ = λ/4 | Z_in = ∞ | shorted stub acts as an open |\n| Z_L = ∞, ℓ = λ/4 | Z_in = 0 | open stub acts as a short |\n| Z_L = 0, ℓ < λ/4 | Z_in = jZ₀tan βℓ (inductive) | shorted stub as a variable L |\n| Z_L = ∞, ℓ < λ/4 | Z_in = −jZ₀cot βℓ (capacitive) | open stub as a variable C |\n| Z_L = Z₀ | Z_in = Z₀ for any ℓ | matched — no reflection ever |\n\n**Quarter-wave transformer.** To match a 100 Ω load to a 50 Ω line, insert a\nλ/4 section of Z₀′ = √(50 × 100) = 70.7 Ω. Narrowband (works at one frequency and\nits odd multiples) but trivially simple.\n\n### Power\n\n    P_avg = |V₀⁺|²(1 − |Γ|²) / (2Z₀)\n\nMaximum power reaches the load when Γ = 0. Every reflection is wasted power and,\nin high-power systems, a source of arcing at the voltage maxima.\n\n## 8.5 The Smith chart\n\nA conformal map of the reflection coefficient plane, with constant-r and\nconstant-x circles of normalized impedance z = Z/Z₀ overlaid. It converts the\nmessy Z_in formula into \"rotate on a circle\".\n\nRules for using it:\n1. Normalize: z_L = Z_L/Z₀. Plot it.\n2. Centre = matched point (z = 1, Γ = 0). Outer rim = |Γ| = 1 (pure reactance).\n3. Radius of the circle through your point is |Γ|; that circle is the **constant\n   SWR circle**, and the SWR reads off where it crosses the positive real axis.\n4. **Toward the generator = clockwise.** One full revolution = λ/2 (not λ —\n   because Γ rotates as e^{−j2βℓ}, twice the electrical angle).\n5. Admittance from impedance: rotate 180° (i.e. y = 1/z is the diametrically\n   opposite point). Essential for shunt-stub matching.\n6. Real axis right of centre = voltage maximum (z real > 1); left of centre =\n   voltage minimum.\n\n**Single-stub matching procedure:**\n1. Plot z_L, convert to y_L (rotate 180°).\n2. Move clockwise (toward generator) along the constant-|Γ| circle to where it\n   crosses the g = 1 circle. That distance is d, the stub position.\n3. The remaining susceptance there is ±jb. Add a stub whose input susceptance is\n   ∓jb to cancel it.\n4. Read the stub length off the rim (from the short-circuit point y=∞ for a\n   shorted stub, or y=0 for an open stub).\n\n## 8.6 Transients on lines (step response)\n\nClose a switch connecting source V_g with internal R_g to a line of Z₀ and load\nZ_L. The line does *not* know about Z_L yet.\n\n1. At t=0 a step of amplitude V₁ = V_g Z₀/(Z₀+R_g) launches down the line.\n2. At t = T = ℓ/u it hits the load, reflecting Γ_L V₁.\n3. That returns at t = 2T, reflects Γ_g times, and so on.\n4. Steady state = the DC answer V_g Z_L/(Z_L + R_g), approached geometrically.\n\nThe **bounce diagram** (a zigzag of position vs time) organizes the bookkeeping.\nThis is exactly how you diagnose signal-integrity ringing on a PCB, and how time-\ndomain reflectometry (TDR) locates a cable fault: measure the round-trip time of\nthe reflection, multiply by u/2.\n\n## 8.7 Worked examples\n\n**Example 1.** A lossless 50 Ω line, ε_r = 2.25, operates at 100 MHz with\nZ_L = 100 + j50 Ω. Find Γ_L, SWR, and Z_in at 0.3λ from the load.\n\nΓ_L = (100+j50−50)/(100+j50+50) = (50+j50)/(150+j50)\n    = (70.71∠45°)/(158.1∠18.43°) = 0.447∠26.57°\ns = (1+0.447)/(1−0.447) = **2.62**\n\nβℓ = 2π(0.3) = 1.885 rad = 108°; tan(108°) = −3.078\nZ_in = 50 · (100+j50 + j50(−3.078)) / (50 + j(100+j50)(−3.078))\n     = 50 · (100 + j50 − j153.9) / (50 − j307.8 + 153.9)\n     = 50 · (100 − j103.9)/(203.9 − j307.8)\n     = 50 · (144.2∠−46.1°)/(369.2∠−56.5°)\n     = 50 × 0.3906∠10.4° = 19.5∠10.4° Ω ≈ 19.2 + j3.5 Ω\n\nAlso: u = c/√2.25 = 2×10⁸ m/s, λ = 2 m, so 0.3λ = 60 cm.\n\n**Example 2.** Match a 200 Ω antenna to a 50 Ω line at 300 MHz using a\nquarter-wave transformer in a medium with ε_r = 1.\n\nZ₀′ = √(50 × 200) = **100 Ω**\nλ = c/f = 1 m ⇒ section length = **25 cm**\n\n**Example 3.** A 75 Ω line is terminated in 300 Ω. Find SWR and return loss.\n\nΓ = (300−75)/(300+75) = 0.6; s = 1.6/0.4 = **4.0**\nReturn loss = −20log(0.6) = **4.44 dB** (poor — 36% of power bounces back).\n\n**Example 4 (TDR).** A pulse on a cable (u = 2×10⁸ m/s) returns after 1.2 μs\nwith the same polarity. Where and what is the fault?\n\nDistance = u·t/2 = 2×10⁸ × 1.2×10⁻⁶ / 2 = **120 m**.\nSame polarity ⇒ Γ > 0 ⇒ Z_L > Z₀ ⇒ an **open circuit / break**.\n(Inverted polarity would mean a short.)\n\n## 8.8 Exercises\n\n1. A coax has a = 0.6 mm, b = 3.5 mm, ε_r = 2.3. Find L, C, Z₀, u, and λ at 1 GHz.\n2. A lossless 100 Ω line is terminated in 50 − j75 Ω. Find Γ, SWR, and the\n   distance from the load to the first voltage minimum.\n3. Design a single shorted stub match for Z_L = 60 + j80 Ω on a 50 Ω line.\n   Give the stub position and length in wavelengths.\n4. A 50 Ω line of length λ/8 is shorted. Find Z_in. (j50 Ω — a pure inductance.)\n5. A generator (12 V, R_g = 25 Ω) drives a 50 Ω line 100 m long (u = 2×10⁸ m/s)\n   terminated in 150 Ω. Draw the bounce diagram and find V at the load at\n   t = 0.5 μs, 1.5 μs, and t → ∞.\n\n## Takeaways\n\n- Long compared with λ ⇒ transmission line, not wire.\n- Z₀ = √(L/C) is a wave property; termination in Z₀ makes reflections vanish.\n- Z_in rotates with distance, repeating every λ/2; λ/4 inverts it.\n- The Smith chart is that rotation drawn as a picture; clockwise = toward source.\n- Γ, SWR, and matching here are the same physics as Module 07's boundary,\n  with Z₀ playing the role of η.\n"}, {"num": "09", "title": "Waveguides and Cavity Resonators", "body": "\n## 9.1 Why waveguides\n\nAbove a few GHz, coaxial cable becomes unusable: conductor loss rises as √f\n(skin effect), the dielectric loses power, and the inner conductor gets so thin\nthat power handling collapses. A hollow metal pipe has no centre conductor and no\ndielectric — so it can carry high power at low loss.\n\nThe price: a waveguide is a **high-pass filter**. Below its cutoff frequency,\nnothing propagates at all.\n\n## 9.2 Mode classification\n\nSince there is only one conductor, a TEM wave is impossible (a TEM wave needs\ntwo conductors to hold the transverse voltage). So one field component must lie\nalong the propagation direction.\n\n- **TE (transverse electric)**: E_z = 0, H_z ≠ 0\n- **TM (transverse magnetic)**: H_z = 0, E_z ≠ 0\n- **TEM**: both zero — needs two conductors (coax, twin-lead, stripline)\n\n## 9.3 Rectangular waveguide (dimensions a × b, a > b)\n\nSolve the Helmholtz equation with the boundary condition E_t = 0 on all walls,\nby separation of variables. Result for TE_mn:\n\n    H_z = H₀ cos(mπx/a) cos(nπy/b) e^{−jβz}\n\nand for TM_mn:\n\n    E_z = E₀ sin(mπx/a) sin(nπy/b) e^{−jβz}\n\nm = half-cycle variations along x, n along y.\n\n### Cutoff frequency\n\n    f_c(mn) = (u′/2) √( (m/a)² + (n/b)² ),   u′ = 1/√(με)\n\n    λ_c = 2 / √((m/a)² + (n/b)²)\n\n### Propagation constant\n\n    β = √(ω²με − (mπ/a)² − (nπ/b)²) = β′ √(1 − (f_c/f)²)\n\n- f > f_c: β real → propagation\n- f < f_c: β imaginary → **evanescent**, field decays exponentially, no power flows\n\n### Guide quantities (for f > f_c)\n\n    λ_g = λ′ / √(1 − (f_c/f)²)         guide wavelength (LONGER than free-space)\n    u_p = u′ / √(1 − (f_c/f)²)         phase velocity (FASTER than c — allowed!)\n    u_g = u′ √(1 − (f_c/f)²)           group velocity (slower than c — energy speed)\n    u_p · u_g = u′²\n\n> **Faster than light?** No. u_p is the speed of a phase pattern, carrying no\n> information. The wave bounces down the guide at angle; the zig-zag pattern's\n> intersection with the wall moves faster than the wave itself, exactly as the\n> waterline of a wave hitting a beach obliquely races along the sand. Information\n> travels at u_g < c.\n\n### Wave impedances\n\n    η_TE = η′ / √(1 − (f_c/f)²)      (> η′, rises toward ∞ at cutoff)\n    η_TM = η′ √(1 − (f_c/f)²)        (< η′, falls to 0 at cutoff)\n\n### Dominant mode\n\nLowest cutoff mode = **TE₁₀** (for a > b), with\n\n    f_c10 = u′/(2a)      λ_c = 2a\n\nTM modes require both m ≥ 1 and n ≥ 1 (either index zero gives an all-zero\nfield), so the lowest TM mode is **TM₁₁** — much higher.\n\n**TE₁₀ fields:**\n\n    E_y = −(ωμa/π) H₀ sin(πx/a) sin(ωt − βz)\n    H_x = (βa/π) H₀ sin(πx/a) sin(ωt − βz)\n    H_z = H₀ cos(πx/a) cos(ωt − βz)\n\nE is vertical, maximum at the centre of the broad wall, zero at the side walls.\nThis is why a probe feeding a waveguide is placed at the centre of the broad wall.\n\n**Single-mode bandwidth.** With b = a/2 (the standard choice), the next modes are\nTE₂₀ at 2f_c10 and TE₀₁ at 2f_c10. So the usable single-mode band is\nf_c10 to 2f_c10 — an octave. In practice guides are used over roughly\n1.25 f_c to 1.9 f_c to stay clear of cutoff dispersion and higher modes.\n\nStandard example: **WR-90** (X-band), a = 22.86 mm, b = 10.16 mm,\nf_c10 = 6.557 GHz, rated band **8.2–12.4 GHz**.\n\n### Power and attenuation\n\nPower transmitted in TE₁₀:\n\n    P_avg = (a b E₀²) / (4 η_TE)      … E₀ the peak field at the guide centre\n\nAttenuation has two sources: dielectric loss (usually air, negligible) and wall\nloss α_c, which rises near cutoff and again slowly at high f, giving a minimum\nin the middle of the band.\n\n## 9.4 Circular waveguide (brief)\n\nSolutions involve Bessel functions J_n. Cutoff is set by the roots:\n\n- TE modes: p′_nm, the roots of J′_n(x) = 0. Dominant **TE₁₁**, p′₁₁ = 1.841.\n- TM modes: p_nm, roots of J_n(x) = 0. Lowest **TM₀₁**, p₀₁ = 2.405.\n\n    f_c = p / (2πa√(με))\n\nTE₀₁ is notable: its wall loss *decreases* with frequency, once proposed for\nlong-haul waveguide communication (overtaken by optical fibre).\n\n## 9.5 Cavity resonators\n\nShort both ends of a length d of rectangular guide. Standing waves in all three\ndimensions. Resonant frequency:\n\n    f_r = (u′/2) √( (m/a)² + (n/b)² + (p/d)² )\n\nDominant mode TE₁₀₁ (for a > b < d). Cavities replace LC tank circuits at\nmicrowave frequencies, where a lumped inductor's own capacitance would domin
