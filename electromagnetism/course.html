ate.\n\n**Quality factor:**\n\n    Q = 2π (energy stored) / (energy lost per cycle) = ω W / P_loss\n\nCavity Q values reach 10⁴–10⁵ (a lumped LC circuit manages a few hundred).\nFor TE₁₀₁ in a copper cavity:\n\n    Q = (a²+d²)abd / [ δ ( 2b(a³+d³) + ad(a²+d²) ) ]\n\nwith δ the skin depth. Note Q scales roughly as volume/(surface × δ) — bigger\ncavity, higher Q; superconducting cavities reach 10¹⁰.\n\nUses: microwave oven cavity, klystron, filters, frequency standards, particle\naccelerator cells.\n\n## 9.6 Worked examples\n\n**Example 1.** An air-filled rectangular guide has a = 2.286 cm, b = 1.016 cm.\nFind the cutoff frequencies of the first four modes.\n\nf_c(mn) = 15 √((m/2.286)² + (n/1.016)²) GHz  (with dimensions in cm, u′=3e10 cm/s)\n\n- TE₁₀: 15/2.286 = **6.56 GHz**\n- TE₂₀: 30/2.286 = **13.12 GHz**\n- TE₀₁: 15/1.016 = **14.76 GHz**\n- TE₁₁ / TM₁₁: 15√(0.1913 + 0.9688) = 15√1.16 = 15(1.077) = **16.16 GHz**\n\nSingle-mode band: 6.56 to 13.12 GHz; the practical rating is 8.2–12.4 GHz.\n\n**Example 2.** Operating that guide at 10 GHz in TE₁₀, find λ_g, u_p, u_g, η_TE.\n\nf_c/f = 6.56/10 = 0.656; √(1 − 0.430) = √0.570 = 0.755\nλ′ = 3 cm\nλ_g = 3/0.755 = **3.97 cm**\nu_p = 3×10⁸/0.755 = **3.97×10⁸ m/s**\nu_g = 3×10⁸ × 0.755 = **2.27×10⁸ m/s**  (check: u_p u_g = 9.01×10¹⁶ ≈ c² ✓)\nη_TE = 377/0.755 = **499 Ω**\n\n**Example 3.** Same guide at 5 GHz. What happens?\n\n5 GHz < 6.56 GHz ⇒ below cutoff. β = jα with\nα = (2π/λ′)√((f_c/f)² − 1) — the field decays exponentially, no propagation.\nα = (2π×5×10⁹/3×10⁸)√((1.312)² − 1) = 104.7 × 0.850 = 89 Np/m ≈ 773 dB/m.\nEffectively total blockage within a few centimetres. (This is exactly how the\nmesh in a microwave oven door works: the holes are far below cutoff at 2.45 GHz,\nso microwaves cannot get out, while visible light — 10⁵ times higher in\nfrequency — passes freely.)\n\n**Example 4.** A cavity 5×4×10 cm, air-filled. Find f for TE₁₀₁.\n\nf = 15 √((1/5)² + 0 + (1/10)²) GHz = 15 √(0.04 + 0.01) = 15(0.2236)\n  = **3.35 GHz**\n\n## 9.7 Exercises\n\n1. A guide with a = 4 cm, b = 2 cm is filled with ε_r = 2.25. Find f_c for TE₁₀\n   and the single-mode band.\n2. Show that TE₀₀, TM₁₀ and TM₀₁ modes cannot exist.\n3. At what frequency is η_TE = 600 Ω in an air guide with f_c = 6.56 GHz?\n4. Find the dominant-mode cutoff of a circular guide with a = 2 cm.\n5. Explain, using cutoff, why you cannot send 1 GHz down a 1 cm × 0.5 cm guide.\n\n## Takeaways\n\n- Waveguide = high-pass filter; below f_c the field is evanescent, not attenuated\n  by loss but by geometry.\n- TE₁₀ is the dominant rectangular mode: f_c = u′/2a, λ_c = 2a.\n- u_p > c and u_g < c, with u_p u_g = u′². Only u_g carries information.\n- Cavity = shorted guide section; Q is orders of magnitude above lumped LC.\n"}, {"num": "10", "title": "Radiation and Antennas", "body": "\n## 10.1 Why anything radiates\n\nStatic charge: field lines are attached, energy stays in the near field.\nUniformly moving charge: still no radiation (it is just a static field in a\nmoving frame).\n**Accelerating charge radiates.** Alternating current = charge accelerating back\nand forth = radiation.\n\nThe field-line picture: when a dipole's charges reverse, field lines that were\nattached to the charges pinch off and close on themselves. A closed loop of\n**E** with no charges to terminate on cannot stay put — it must propagate away at\nc. Those detached loops are the radiated wave.\n\n## 10.2 Retarded potentials\n\nThe field here now depends on the source as it was a travel-time ago:\n\n    V(r,t) = ∫ ρ_v(r′, t − R/u) / (4πεR)  dv′\n    A(r,t) = ∫ μ J(r′, t − R/u) / (4πR)   dv′\n\nwith R = |**r** − **r**′| and retardation t − R/u. Then **B** = ∇×**A** and\n**E** = −∇V − ∂**A**/∂t.\n\nEverything about antennas comes out of evaluating **A** and taking curls. The\nfinite propagation time is what makes radiation possible — with instantaneous\naction at a distance, nothing would ever detach.\n\n## 10.3 The Hertzian dipole\n\nAn infinitesimal current element of length dl ≪ λ carrying I₀cos ωt. Result in\nspherical coordinates (β = 2π/λ):\n\n**Far field (r ≫ λ, the radiation zone):**\n\n    E_θ = j (η₀ I₀ β dl / 4πr) sin θ · e^{−jβr}\n    H_φ = E_θ / η₀\n\nEverything else falls faster than 1/r and vanishes.\n\n**Three zones, three behaviours:**\n\n| Term | Falls as | Zone | Meaning |\n|---|---|---|---|\n| 1/r³ | fastest | near (reactive) | electrostatic/dipole field, stores energy |\n| 1/r² | middle | induction | reactive, energy sloshes in and out |\n| 1/r | slowest | far (radiation) | the only term that carries net power |\n\nOnly the 1/r term matters far away, because power ~ E² ~ 1/r², and the area of a\nsphere ~ r² — so the 1/r term delivers constant total power to infinity while all\nothers deliver zero. **That is the mathematical definition of radiation.**\n\n**Radiated power and radiation resistance:**\n\n    P_rad = ½ ∫ Re{E×H*}·dS = 40π² (dl/λ)² I₀²/... \n\ncarried out: P_rad = ½ I₀² R_rad with\n\n    R_rad = 80π² (dl/λ)²      [Ω]      (Hertzian dipole)\n\nNote (dl/λ)²: a short antenna radiates terribly. dl = λ/100 gives\nR_rad = 0.079 Ω — against even a small loss resistance, efficiency collapses.\n**This is why electrically small antennas are inefficient**, and why AM broadcast\ntowers are hundreds of metres tall.\n\n**Small loop** (magnetic dipole), area S, N turns:\n\n    R_rad = 320 π⁴ N² (S/λ²)²\n\nEven worse for small S — but loops are compact and are used in receivers where\nthe ambient field, not efficiency, sets the signal.\n\n## 10.4 Half-wave dipole\n\nLength ℓ = λ/2, sinusoidal current distribution I(z) = I₀cos βz.\n\n    E_θ = j(η₀I₀/2πr) [cos(π cosθ /2) / sinθ] e^{−jβr}\n\n    S_avg = (η₀I₀²/8π²r²) · [cos((π/2)cosθ)/sinθ]²\n\n    P_rad = 36.56 I₀²  ⇒  R_rad = 73 Ω,  Z_in = 73 + j42.5 Ω\n\nTrim slightly below λ/2 (about 0.47λ) and the reactance vanishes — that is why\nreal dipoles are cut a few percent short.\n\n73 Ω is close to 75 Ω coax, which is not a coincidence: the standard was chosen\nto feed dipoles directly.\n\n**Quarter-wave monopole** over a ground plane: image theory makes it equivalent\nto half a dipole, so it radiates half the power for the same current:\n\n    R_rad = 36.5 Ω,   same pattern in the upper half-space\n\n## 10.5 Antenna parameters\n\n**Radiation pattern** — |E| or power vs direction, normally plotted in the\nE-plane and H-plane. Key numbers: half-power (−3 dB) beamwidth, first-null\nbeamwidth, side-lobe level, front-to-back ratio.\n\n**Radiation intensity** U(θ,φ) = r² S_avg  [W/sr];  P_rad = ∮ U dΩ.\n\n**Directivity**\n\n    D = U_max / U_avg = 4π U_max / P_rad\n\n| Antenna | D | dBi |\n|---|---|---|\n| Isotropic (theoretical) | 1 | 0 |\n| Hertzian dipole | 1.5 | 1.76 |\n| Half-wave dipole | 1.64 | 2.15 |\n| Quarter-wave monopole | 3.28 | 5.15 |\n\n**Gain** G = e_r D, with radiation efficiency e_r = R_rad/(R_rad + R_loss).\nGain accounts for ohmic losses; directivity does not.\n\n**Effective aperture** A_e = (λ²/4π) G — the capture area of a receiving antenna.\nNote that a *fixed-size* aperture antenna (dish, horn) has G = 4πA_e/λ², so its\ngain rises as f²: this is why microwave links use small dishes and get huge gain.\n\n**Beamwidth–directivity rule of thumb:** D ≈ 41253/(θ_E · θ_H) with beamwidths in\ndegrees.\n\n## 10.6 The Friis transmission equation\n\n    P_r / P_t = G_t G_r (λ / 4πr)²\n\nIn dB: P_r = P_t + G_t + G_r − FSPL, where the **free-space path loss** is\n\n    FSPL(dB) = 20 log₁₀(r) + 20 log₁₀(f) + 32.44    (r in km, f in MHz)\n\nTwo conclusions worth internalizing:\n- Doubling the distance costs 6 dB, always.\n- Doubling the frequency also costs 6 dB *for fixed antenna gains* — but if the\n  antennas are fixed-*aperture* dishes, higher frequency actually **wins**,\n  because each dish gains 6 dB. Hence satellite links climbed from C-band to\n  Ku- to Ka-band.\n\n**Radar equation** (round trip, target cross-section σ):\n\n    P_r = P_t G² λ² σ / ((4π)³ r⁴)\n\nr⁴, not r² — the target re-radiates, so the loss happens twice. Doubling radar\nrange needs 16× the power.\n\n## 10.7 Antenna arrays\n\nN identical elements, spacing d, progressive phase shift α:\n\n    AF = sin(Nψ/2) / sin(ψ/2),    ψ = βd cos θ + α\n\nTotal pattern = **element pattern × array factor** (pattern multiplication).\n\n- **Broadside** (α = 0): main beam perpendicular to the array axis.\n- **End-fire** (α = −βd): main beam along the array axis.\n- **Phased array**: vary α electronically to steer the beam with no moving parts\n  — radar, 5G massive MIMO, Starlink terminals.\n\nTwo-element array, spacing λ/2:\n- α = 0 → broadside figure-of-eight\n- α = 180° → end-fire\n\nArray gain over one element ≈ N (ideal), i.e. 10log N dB.\n\n## 10.8 Common antenna types\n\n| Type | Notes |\n|---|---|\n| Dipole / monopole | The reference. 73 Ω / 36.5 Ω. |\n| Folded dipole | Z_in ≈ 300 Ω, wider band; matches twin-lead. |\n| Yagi–Uda | Driven element + reflector + directors. 8–15 dBi, cheap, narrowband. |\n| Log-periodic | Very wide band, ~7 dBi. TV antennas. |\n| Horn | Flared waveguide. 10–25 dBi, low loss, standard gain reference. |\n| Parabolic dish | G = e(πD/λ)². 30–60 dBi. Satellite, radio astronomy. |\n| Helical | Axial mode gives circular polarization. Satellite uplinks. |\n| Microstrip patch | Printed, flat, ~6 dBi, narrowband. Phones, GPS, arrays. |\n| Loop | Small: magnetic, poor efficiency. Large (≈λ): efficient. |\n\n## 10.9 Worked examples\n\n**Example 1.** A Hertzian dipole of length 2 cm carries 10 A at 100 MHz. Find\nR_rad and P_rad.\n\nλ = 3 m; dl/λ = 0.02/3 = 6.67×10⁻³\nR_rad = 80π²(6.67e−3)² = 789.6 × 4.44×10⁻⁵ = **0.0351 Ω**\nP_rad = ½I²R = ½(100)(0.0351) = **1.75 W**\n\nSanity check on efficiency: if the antenna's ohmic resistance is 1 Ω, efficiency\nis 0.0351/1.035 = 3.4%. Nearly all the power becomes heat. That is the price of\nbeing short.\n\n**Example 2.** A half-wave dipole radiates 100 W. Find the current, and the field\nstrength at 10 km broadside (θ = 90°).\n\nP = ½I₀²(73) ⇒ I₀ = √(200/73) = **1.655 A**\nE_θ(θ=90°) = η₀I₀/(2πr) = 377 × 1.655/(2π × 10⁴) = 624/62832 = **9.93 mV/m**\nS = E²/2η₀ = (9.93e−3)²/754 = **1.31×10⁻⁷ W/m²**\nCross-check with D: S = P·D/(4πr²) = 100(1.64)/(4π×10⁸) = 1.31×10⁻⁷ ✓\n\n**Example 3 (Friis).** A 2.4 GHz link: P_t = 20 dBm, G_t = G_r = 12 dBi,\nr = 1 km. Find P_r.\n\nλ = 0.125 m\nFSPL = 20log(1) + 20log(2400) + 32.44 = 0 + 67.6 + 32.44 = **100.0 dB**\nP_r = 20 + 12 + 12 − 100 = **−56 dBm** (2.5 nW)\n\nComfortably above a typical −85 dBm receiver sensitivity — 29 dB of link margin.\n\n**Example 4.** A parabolic dish, D = 3 m, at 12 GHz, aperture efficiency 0.6.\nFind the gain and half-power beamwidth.\n\nλ = 0.025 m\nG = 0.6 (π × 3/0.025)² = 0.6 (376.99)² = 0.6 × 142,122 = 85,273 = **49.3 dBi**\nHPBW ≈ 70λ/D = 70(0.025)/3 = **0.583°**\n\nThat extreme narrowness is why satellite dishes need careful aiming.\n\n## 10.10 Exercises\n\n1. A Hertzian dipole λ/50 long carries 5 A. Find R_rad, P_rad, and the efficiency\n   if R_loss = 0.5 Ω.\n2. Find the maximum power density 5 km from a half-wave dipole radiating 1 kW.\n3. A 2-element array with d = λ/4 and α = −90°. Sketch |AF| and identify the\n   direction of maximum.\n4. A GPS satellite transmits 27 W at 1.575 GHz with 13 dBi gain from 20,200 km.\n   Compute the received power on a 0 dBi antenna. Comment on why GPS needs\n   spread-spectrum processing gain.\n5. Prove D = 1.5 for a Hertzian dipole by integrating sin²θ over the sphere.\n\n## Takeaways\n\n- Acceleration radiates; only the 1/r field term carries power to infinity.\n- R_rad ∝ (dl/λ)² — short antennas are inefficient, and there is no way around it.\n- Half-wave dipole: 73 Ω, 2.15 dBi. Memorize both.\n- Friis: 6 dB per doubling of distance; the radar equation costs 12 dB.\n- Gain = efficiency × directivity; effective aperture ties gain to physical size.\n"}, {"num": "11", "title": "Formula Sheet", "body": "\n## Constants\nε₀ = 8.854×10⁻¹² F/m  |  1/4πε₀ = 9×10⁹  |  μ₀ = 4π×10⁻⁷ H/m\nc = 3×10⁸ m/s  |  η₀ = 377 Ω ≈ 120π  |  e = 1.602×10⁻¹⁹ C\n\n## Vector operators\n\n| | Cartesian | Cylindrical | Spherical |\n|---|---|---|---|\n| dl | dx,dy,dz | dρ, ρdφ, dz | dr, rdθ, r sinθ dφ |\n| dv | dx dy dz | ρ dρ dφ dz | r² sinθ dr dθ dφ |\n\n∇V (Cart) = ∂V/∂x **a**_x + ...\n∇·**A** (Cart) = ∂A_x/∂x + ∂A_y/∂y + ∂A_z/∂z\n∇·**A** (Cyl) = (1/ρ)∂(ρA_ρ)/∂ρ + (1/ρ)∂A_φ/∂φ + ∂A_z/∂z\n∇·**A** (Sph) = (1/r²)∂(r²A_r)/∂r + (1/r sinθ)∂(A_θsinθ)/∂θ + (1/r sinθ)∂A_φ/∂φ\n\n∮**A**·d**S** = ∫(∇·**A**)dv  |  ∮**A**·d**l** = ∫(∇×**A**)·d**S**\n∇×(∇V) = 0  |  ∇·(∇×**A**) = 0  |  ∇²**A** = ∇(∇·**A**) − ∇×(∇×**A**)\n\n## Electrostatics\n**F** = Q₁Q₂**a**_R/(4πε₀R²)  |  **E** = **F**/Q  |  **D** = ε**E**\nPoint: E = Q/4πε₀r²,  V = Q/4πε₀r\nLine: E = ρ_L/2πε₀ρ  |  Sheet: E = ρ_S/2ε₀\n∮**D**·d**S** = Q_enc  |  ∇·**D** = ρ_v  |  **E** = −∇V  |  ∮**E**·d**l** = 0\nDipole: V = p cosθ/4πε₀r²\nw_E = ½εE²  |  W = ½∫**D**·**E**dv  |  W = ½CV²\n∇²V = −ρ_v/ε (Poisson), ∇²V = 0 (Laplace)\n\n**C:** plates εS/d | coax 2πεL/ln(b/a) | spheres 4πε/(1/a−1/b) | isolated 4πεa\n\n**BCs:** E_t1 = E_t2 | D_n1 − D_n2 = ρ_S | tanθ₁/tanθ₂ = ε₁/ε₂\n\n## Currents and materials\n**J** = σ**E**  |  I = ∫**J**·d**S**  |  R = ℓ/σS  |  ∇·**J** = −∂ρ_v/∂t\nT_r = ε/σ  |  **D** = ε₀**E** + **P**  |  ε_r = 1 + χ_e\n\n## Magnetostatics\nd**H** = I d**l**×**a**_R/(4πR²)  |  **B** = μ**H**\nWire: H = I/2πρ | Loop centre: H = I/2a | Solenoid: H = nI | Toroid: H = NI/2πρ\nSheet: **H** = ½**K**×**a**_n\n∮**H**·d**l** = I_enc  |  ∇×**H** = **J**  |  ∮**B**·d**S** = 0  |  ∇·**B** = 0\n**B** = ∇×**A**,  **A** = ∫μI d**l**/4πR\n**F** = q(**E** + **u**×**B**)  |  **F** = I**L**×**B**  |  **T** = **m**×**B**\nParallel wires: F/L = μ₀I₁I₂/2πd\nw_m = ½μH²  |  W = ½LI²\n\n**L:** solenoid μN²S/ℓ | toroid μN²S/2πρ₀ | coax (μ/2π)ln(b/a)\n\n**BCs:** B_n1 = B_n2 | H_t1 − H_t2 = K | tanθ₁/tanθ₂ = μ₁/μ₂\n\n**Magnetic circuit:** ℱ = NI = Ψℛ, ℛ = ℓ/μS\n\n## Maxwell's equations\n\n| Differential | Integral |\n|---|---|\n| ∇·**D** = ρ_v | ∮**D**·d**S** = Q_enc |\n| ∇·**B** = 0 | ∮**B**·d**S** = 0 |\n| ∇×**E** = −∂**B**/∂t | ∮**E**·d**l** = −dΨ/dt |\n| ∇×**H** = **J** + ∂**D**/∂t | ∮**H**·d**l** = I + ∫(∂**D**/∂t)·d**S** |\n\nemf = −N dΨ/dt  |  motional emf = ∮(**u**×**B**)·d**l** = Bℓu\n**S** = **E**×**H**  |  **S**_avg = ½Re{**E**_s×**H**_s*}\nLoss tangent: tan δ = σ/ωε\n\n## Plane waves\nγ = α + jβ = √(jωμ(σ+jωε))  |  η = √(jωμ/(σ+jωε))\nα = ω√(με/2 [√(1+(σ/ωε)²) − 1]),  β = ω√(με/2 [√(1+(σ/ωε)²) + 1])\nu = ω/β  |  λ = 2π/β  |  δ = 1/α\n\n- Free space: β = ω/c, η = 377\n- Lossless: β = ω√(με), η = √(μ/ε), u = c/√(ε_rμ_r)\n- Good conductor: α = β = 1/δ = √(πfμσ), η = √(ωμ/σ)∠45°, λ = 2πδ\n- Good dielectric: α ≈ (σ/2)√(μ/ε), β ≈ ω√(με), η ≈ √(μ/ε)\n\nΓ = (η₂−η₁)/(η₂+η₁)  |  τ = 2η₂/(η₂+η₁)  |  s = (1+|Γ|)/(1−|Γ|)\nα[dB/m] = 8.686 α[Np/m]\nSnell: sinθ_i/sinθ_t = n₂/n₁ | θ_B = tan⁻¹√(ε₂/ε₁) | θ_c = sin⁻¹(n₂/n₁)\n\n## Transmission lines\nγ = √((R+jωL)(G+jωC))  |  Z₀ = √((R+jωL)/(G+jωC))\nLossless: β = ω√(LC), Z₀ = √(L/C), u = 1/√(LC)\nLC = με  |  G/C = σ/ε  |  distortionless: RC = GL\n\nΓ_L = (Z_L−Z₀)/(Z_L+Z₀)  |  s = (1+|Γ|)/(1−|Γ|)  |  RL = −20log|Γ|\n\n    Z_in = Z₀ (Z_L + jZ₀ tanβℓ)/(Z₀ + jZ_L tanβℓ)\n\nλ/2: Z_in = Z_L | λ/4: Z_in = Z₀²/Z_L | shorted stub: jZ₀tanβℓ | open: −jZ₀cotβℓ\nQW transformer: Z₀′ = √(Z₀Z_L)\nSmith chart: one revolution = λ/2, clockwise = toward generator\n\n## Waveguides (rectangular a×b)\nf_c = (u′/2)√((m/a)²+(n/b)²)  |  λ_c = 2/√((m/a)²+(n/b)²)\nDominant TE₁₀: f_c = u′/2a, λ_c = 2a\nβ = β′√(1−(f_c/f)²)  |  λ_g = λ′/√(1−(f_c/f)²)\nu_p = u′/√(1−(f_c/f)²)  |  u_g = u′√(1−(f_c/f)²)  |  u_p u_g = u′²\nη_TE = η′/√(1−(f_c/f)²)  |  η_TM = η′√(1−(f_c/f)²)\nCavity: f_r = (u′/2)√((m/a)²+(n/b)²+(p/d)²)  |  Q = ωW/P_loss\n\n## Antennas\nHertzian: E_θ = jη₀I₀βdl sinθ e^{−jβr}/4πr,  R_rad = 80π²(dl/λ)², D = 1.5\nHalf-wave dipole: R_rad = 73 Ω, Z_in = 73+j42.5, D = 1.64 (2.15 dBi)\nMonopole: R_rad = 36.5 Ω, D = 3.28 (5.15 dBi)\nSmall loop: R_rad = 320π⁴N²(S/λ²)²\nU = r²S_avg  |  D = 4πU_max/P_rad  |  G = e_r D  |  A_e = λ²G/4π\nFriis: P_r/P_t = G_tG_r(λ/4πr)²\nFSPL(dB) = 20log r_km + 20log f_MHz + 32.44\nRadar: P_r = P_tG²λ²σ/((4π)³r⁴)\nArray: AF = sin(Nψ/2)/sin(ψ/2), ψ = βd cosθ + α\nDish: G = e(πD/λ)², HPBW ≈ 70λ/D\n"}, {"num": "12", "title": "Problem Set with Full Solutions", "body": "\nWork each problem on paper before reading the solution. Twenty problems spanning\nthe whole course, roughly in exam order and exam style.\n\n---\n\n**P1.** Given **A** = 2**a**_x − 3**a**_y + **a**_z and **B** = 4**a**_x + 5**a**_z,\nfind the angle between them and the component of **A** perpendicular to **B**.\n\n*Solution.* **A**·**B** = 8 + 0 + 5 = 13. |A| = √14 = 3.742, |B| = √41 = 6.403.\ncos θ = 13/23.96 = 0.5426 ⇒ **θ = 57.1°**\nParallel component: (**A**·**a**_B)**a**_B = (13/41)(4**a**_x + 5**a**_z)\n = 1.268**a**_x + 1.585**a**_z\nPerpendicular part: **A** − that = **0.732a_x − 3a_y − 0.585a_z**\n(Check: dot with **B** = 2.93 − 2.93 = 0 ✓)\n\n---\n\n**P2.** Verify the divergence theorem for **A** = 2ρz **a**_ρ + ρ **a**_z over\nthe cylinder ρ ≤ 2, 0 ≤ z ≤ 3.\n\n*Solution.* ∇·**A** = (1/ρ)∂(ρ·2ρz)/∂ρ + ∂(ρ)/∂z = (1/ρ)(4ρz) = 4z\n∫∇·**A** dv = ∫₀^{2π}∫₀²∫₀³ 4z ρ dz dρ dφ = 2π · [ρ²/2]₀² · [2z²]₀³\n = 2π(2)(18) = **72π**\n\nSurface: curved wall (ρ=2): ∫ 2(2)z · (2 dφ dz) = ∫₀^{2π}∫₀³ 8z dz dφ\n = 2π(4·9) = 72π. Top (z=3): ∫ρ·ρdρdφ = 2π(8/3) = 16π/3.\nBottom (z=0), outward is −**a**_z: −∫ρ·ρdρdφ = −16π/3.\nTotal = 72π + 16π/3 − 16π/3 = **72π** ✓\n\n---\n\n**P3.** Two point charges, 5 nC at (2,0,4) and −2 nC at (−3,0,5). Find the\npotential at (1,0,1) and the energy needed to bring a 1 nC charge there from ∞.\n\n*Solution.* R₁ = √((1−2)²+0+(1−4)²) = √10 = 3.162\nR₂ = √((1+3)²+0+(1−5)²) = √32 = 5.657\nV = 9×10⁹[5e−9/3.162 + (−2e−9)/5.657] = 9[1.581 − 0.3536] = 9(1.2276)\n = **11.05 V**\nW = QV = 1e−9 × 11.05 = **11.05 nJ**\n\n---\n\n**P4.** A spherical volume charge ρ_v = 10/r² nC/m³ exists for 1 ≤ r ≤ 3 m.\nFind **D** at r = 2 m and r = 5 m.\n\n*Solution.* Q(r) = ∫₁^r (10e−9/r′²)(4πr′²)dr′ = 40π×10⁻⁹ (r−1)\nAt r = 2: Q = 40π×10⁻⁹ = 1.257×10⁻⁷ C\nD = Q/4πr² = 1.257e−7/(4π·4) = **2.5 nC/m²**\nAt r = 5: all charge enclosed, Q = 40π×10⁻⁹(2) = 2.513×10⁻⁷\nD = 2.513e−7/(4π·25) = **0.8 nC/m²**\n\n---\n\n**P5.** Region z > 0 has ε_r = 2, region z < 0 has ε_r = 5, no free surface\ncharge. **E**₁ (in z>0) = 4**a**_x − 3**a**_y + 6**a**_z V/m. Find **E**₂ and\nthe angles the fields make with the normal.\n\n*Solution.* Tangential continuous: E_x2 = 4, E_y2 = −3.\nNormal D continuous: 2(6) = 5E_z2 ⇒ E_z2 = 2.4\n**E₂ = 4a_x − 3a_y + 2.4a_z V/m**\nθ₁: tanθ₁ = √(16+9)/6 = 5/6 ⇒ θ₁ = **39.8°**\nθ₂: tanθ₂ = 5/2.4 = 2.083 ⇒ θ₂ = **64.4°**\nCheck: tanθ₁/tanθ₂ = 0.8333/2.083 = 0.4 = ε₁/ε₂ = 2/5 ✓\n\n---\n\n**P6.** A coaxial capacitor a = 5 mm, b = 15 mm, length 60 cm, with two\ndielectric layers: ε_r = 4 from 5 to 10 mm, ε_r = 2 from 10 to 15 mm.\nFind C.\n\n*Solution.* Series combination (same Q, potentials add).\nC₁ = 2πε₀(4)(0.6)/ln(10/5) = 2π(8.854e−12)(4)(0.6)/0.6931\n = 1.335e−10/0.6931 = 192.6 pF\nC₂ = 2πε₀(2)(0.6)/ln(15/10) = 6.674e−11/0.4055 = 164.6 pF\nC = C₁C₂/(C₁+C₂) = (192.6×164.6)/357.2 = **88.8 pF**\n\n---\n\n**P7.** A 20 nC point charge is 3 cm above an infinite grounded conducting plane.\nFind the force on it and the total induced charge.\n\n*Solution.* Image −20 nC at 3 cm below; separation 6 cm.\nF = (9e9)(20e−9)²/(0.06)² = (9e9)(4e−16)/(3.6e−3) = 3.6e−6/3.6e−3\n = **1.0×10⁻³ N = 1 mN**, attractive (toward the plane).\nTotal induced charge = **−20 nC** exactly (all field lines from Q terminate on\nthe plane).\n\n---\n\n**P8.** An infinite sheet of current **K** = 10**a**_x A/m lies in the z = 0\nplane. Find **H** at z = ±2 m, and the force per unit area on a second sheet\n**K** = 5**a**_x A/m at z = 2.\n\n*Solution.* **H** = ½**K**×**a**_n.\nFor z>0, **a**_n = **a**_z: ½(10**a**_x × **a**_z) = ½(10)(−**a**_y) = **−5a_y A/m**\nFor z<0: **+5a_y A/m**\n**B** at the second sheet = μ₀(−5**a**_y) = −6.28×10⁻⁶ **a**_y T\nForce per area = **K**₂ × **B** = 5**a**_x × (−6.28e−6 **a**_y)\n = −3.14×10⁻⁵ **a**_z N/m² — **attractive** (parallel currents attract), magnitude\n**31.4 μN/m²**\n\n---\n\n**P9.** A toroid with a rectangular cross-section (inner radius 4 cm, outer 6 cm,\nheight 2 cm) has 800 turns and μ_r = 1. Find L exactly (not by the mean-radius\napproximation).\n\n*Solution.* H = NI/2πρ, B = μ₀NI/2πρ\nΨ = ∫₀.₀₄^0.06 (μ₀NI/2πρ)(0.02 dρ) = (μ₀NI(0.02)/2π) ln(6/4)\n = (4πe−7)(800)I(0.02)(0.4055)/(2π) = (2e−7)(800)(0.02)(0.4055) I\n = 1.298×10⁻⁶ I\nL = NΨ/I = 800 × 1.298e−6 = **1.038 mH**\n\n(Mean-radius approximation: L = μ₀N²S/2πρ₀ = (4πe−7)(640000)(4e−4)/(2π×0.05)\n= 1.024 mH — within 1.4%.)\n\n---\n\n**P10.** An iron ring (μ_r = 1500, mean length 50 cm, cross-section 4 cm²) has a\n1 mm air gap and 500 turns. Find the current for a flux of 0.6 mWb, and comment.\n\n*Solution.* Iron: ℛ_i = ℓ/μS = 0.499/((4πe−7)(1500)(4e−4))\n = 0.499/(7.54e−7) = 6.62×10⁵ A-t/Wb\nGap: ℛ_g = 0.001/((4πe−7)(4e−4)) = 0.001/(5.027e−10) = 1.989×10⁶ A-t/Wb\nTotal ℛ = 2.65×10⁶\nNI = Ψℛ = 6e−4 × 2.65e6 = 1590 A-t ⇒ **I = 3.18 A**\n\nComment: the 1 mm gap contributes 75% of the total reluctance despite being\n0.2% of the path length. **Air gaps dominate magnetic circuits.**\n\n---\n\n**P11.** A square loop of side 20 cm lies in the xy-plane. **B** = 0.4 cos(500t)\n**a**_z T. Find the induced emf and the current if the loop resistance is 0.5 Ω.\n\n*Solution.* Ψ = BS = 0.4(0.04)cos(500t) = 0.016 cos(500t) Wb\nemf = −dΨ/dt = 0.016(500) sin(500t) = **8 sin(500t) V**\nI = 8 sin(500t)/0.5 = **16 sin(500t) A**\n\n---\n\n**P12.** Show that in a good conductor the conduction current dominates and\ncompute the frequency at which they are equal for copper (σ = 5.8×10⁷, ε_r = 1).\n\n*Solution.* σ = ωε ⇒ f = σ/(2πε₀) = 5.8e7/(2π × 8.854e−12)\n = 5.8e7/5.563e−11 = **1.04×10¹⁸ Hz**\n\nThat is in the X-ray region — far above optical. Copper is a conductor at every\nfrequency you will ever engineer with. This is why \"good conductor\napproximation\" is essentially always valid for metals.\n\n---\n\n**P13.** A uniform plane wave in a lossy medium (ε_r = 4, μ_r = 1, σ = 10⁻³ S/m)\nat 50 MHz. Find tan δ, α, β, η, u, λ, and δ_skin.\n\n*Solution.* ωε = 2π(5e7)(4)(8.854e−12) = 1.1124×10⁻²\ntan δ = 1e−3/1.1124e−2 = **0.0899** (a low-loss dielectric)\n\nUse good-dielectric approximations:\nα ≈ (σ/2)√(μ/ε) = (5e−4)(377/2) = (5e−4)(188.5) = **0.0943 Np/m**\n (= 0.819 dB/m)\nβ ≈ ω√(με) = ω√(ε_r)/c = 2π(5e7)(2)/3e8 = **2.094 rad/m**\nη ≈ √(μ/ε)(1 + j tanδ/2) = 188.5(1 + j0.045) = **188.5∠2.57° Ω**\nu = ω/β = 3.14e8/2.094 = **1.5×10⁸ m/s** (= c/2 ✓)\nλ = 2π/β = **3 m**\nδ_skin = 1/α = **10.6 m**\n\n---\n\n**P14.** A wave travelling in air strikes a lossless medium (ε_r = 9, μ_r = 1)\nnormally with E₀ = 6 V/m. Find Γ, τ, the reflected and transmitted E, the SWR,\nand the power in each.\n\n*Solution.* η₁ = 377, η₂ = 377/3 = 125.7\nΓ = (125.7 − 377)/(125.7 + 377) = −251.3/502.7 = **−0.5**\nτ = 2(125.7)/502.7 = **0.5**\nE_r = −3 V/m (phase reversal), E_t = 3 V/m\ns = 1.5/0.5 = **3.0**\nS_i = 36/(2×377) = 47.7 mW/m²\nS_r = |Γ|²S_i = 0.25(47.7) = 11.9 mW/m² (25%)\nS_t = 9/(2×125.7) = 35.8 mW/m² (75%) ✓ (11.9 + 35.8 = 47.7)\n\n---\n\n**P15.** A lossless 50 Ω line is terminated in 25 − j50 Ω at 500 MHz, u = 2×10⁸.\nFind Γ, SWR, Z_in at 20 cm, and the distance to the first voltage minimum.\n\n*Solution.* λ = 2e8/5e8 = 0.4 m; β = 2π/0.4 = 15.708 rad/m\nΓ = (25−j50−50)/(25−j50+50) = (−25−j50)/(75−j50)\n = (55.9∠−116.57°)/(90.14∠−33.69°) = **0.620∠−82.88°**\ns = 1.620/0.380 = **4.26**\n\nZ_in at ℓ = 0.2 m = λ/2 ⇒ **Z_in = Z_L = 25 − j50 Ω**\n(Half-wavelength repeats the load — no calculation needed.)\n\nFirst voltage minimum where the total phase = 180°:\n2βℓ_min = 180° + θ_Γ ⇒ ℓ_min = (180° − 82.88°)/(2×360°) · λ\nCareful: Γ(ℓ) = |Γ|∠(θ_Γ − 2βℓ). Minimum when θ_Γ − 2βℓ = −180°:\n2βℓ = 180° − 82.88° = 97.12° ⇒ βℓ = 48.56° = 0.8476 rad\nℓ = 0.8476/15.708 = **0.054 m = 5.4 cm**\n\n---\n\n**P16.** Match a 120 Ω load to a 50 Ω line at 1 GHz (a) with a quarter-wave\ntransformer in air, (b) find the SWR if instead nothing is done.\n\n*Solution.* (a) Z₀′ = √(50 × 120) = **77.46 Ω**; λ = 0.3 m ⇒ length\n = **7.5 cm**\n(b) Γ = (120−50)/170 = 0.4118; s = 1.4118/0.5882 = **2.40**\nReflected power = 17% of incident.\n\n---\n\n**P17.** An air-filled guide, a = 7.2 cm, b = 3.4 cm, operating at 3 GHz.\nWhich modes propagate? Find λ_g and η for the dominant mode.\n\n*Solution.* f_c(mn) = 15√((m/7.2)² + (n/3.4)²) GHz (cm)\nTE₁₀: 15/7.2 = **2.083 GHz** ✓ propagates\nTE₂₀: 30/7.2 = 4.167 GHz ✗\nTE₀₁: 15/3.4 = 4.412 GHz ✗\nSo **only TE₁₀ propagates** — good single-mode operation.\n\nf_c/f = 2.083/3 = 0.6944; √(1 − 0.4822) = √0.5178 = 0.7196\nλ′ = 10 cm ⇒ λ_g = 10/0.7196 = **13.90 cm**\nη_TE = 377/0.7196 = **524 Ω**\nu_p = 3e8/0.7196 = 4.17×10⁸ m/s; u_g = 2.16×10⁸ m/s\n\n---\n\n**P18.** A rectangular cavity 4 × 3 × 5 cm, air-filled. Find the three lowest\nresonant frequencies.\n\n*Solution.* f = 15√((m/4)² + (n/3)² + (p/5)²) GHz\nTE₁₀₁: 15√(0.0625 + 0.04) = 15(0.3202) = **4.80 GHz**\nTE₀₁₁: 15√(0 + 0.1111 + 0.04) = 15(0.3887) = **5.83 GHz**\nTE₁₁₀ / TM₁₁₀: 15√(0.0625 + 0.1111) = 15(0.4166) = **6.25 GHz**\n(TM₁₁₀ is valid; TE₁₁₀ requires p ≠ 0 so it does not exist.)\n\n---\n\n**P19.** A half-wave dipole is fed 250 W at 150 MHz. Find (a) the feed current,\n(b) the field strength 20 km away in the direction of maximum radiation,\n(c) the power received by an identical dipole there, correctly oriented.\n\n*Solution.* (a) P = ½I₀²(73) ⇒ I₀ = √(500/73) = **2.617 A**\n(b) E = η₀I₀/(2πr) = 377(2.617)/(2π×2e4) = 986.6/125664 = **7.85 mV/m**\n(c) S = E²/(2η₀) = (7.85e−3)²/754 = 8.17×10⁻⁸ W/m²\nA_e = λ²G/4π; λ = 2 m, G = 1.64 ⇒ A_e = 4(1.64)/(4π) = 0.522 m²\nP_r = S·A_e = 8.17e−8 × 0.522 = **4.27×10⁻⁸ W = 42.7 nW**\n\nCross-check with Friis: FSPL = 20log(20) + 20log(150) + 32.44\n = 26.02 + 43.52 + 32.44 = 101.98 dB\nP_t = 10log(250×1000) = 53.98 dBm\nP_r = 53.98 + 2.15 + 2.15 − 101.98 = −43.7 dBm = 4.27×10⁻⁸ W ✓\n\n---\n\n**P20.** A radar at 10 GHz has P_t = 100 kW, a 2 m dish with 60% efficiency, and\ndetects a target of σ = 5 m². The minimum detectable signal is −110 dBm. Find\nthe maximum range.\n\n*Solution.* λ = 0.03 m\nG = 0.6(π×2/0.03)² = 0.6(209.44)² = 0.6(43,865) = 26,319 = **44.2 dBi**\nP_min = −110 dBm = 10⁻¹⁴ W\n\nr⁴ = P_t G²λ²σ / ((4π)³ P_min)\n = (1e5)(26319)²(9e−4)(5) / (1984.4 × 1e−14)\n = (1e5)(6.927e8)(9e−4)(5) / (1.9844e−11)\n = (3.117e11)/(1.9844e−11) = 1.571×10²²\nr = (1.571e22)^{0.25} = **1.12×10⁵·⁵ ... ** compute: log₁₀ = 22.196/4 = 5.549\nr = 10^5.549 = **3.54×10⁵ m ≈ 354 km**\n\nNote the r⁴ dependence: to double this range to 708 km you would need\n16 × 100 kW = 1.6 MW of transmit power, or +6 dB of antenna gain (a 4 m dish).\n\n---\n\n## Self-assessment\n\nIf you solved 16+ of these unaided, you are exam-ready. If you struggled on:\n\n- P1–P2 → revisit Modules 01–02\n- P3–P7 → Modules 03–04\n- P8–P10 → Module 05\n- P11–P12 → Module 06\n- P13–P14 → Module 07\n- P15–P16 → Module 08\n- P17–P18 → Module 09\n- P19–P20 → Module 10\n"}];
const KEY = "pgdee-em-read";
let read = new Set();
try { read = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...read])); } catch(e) {} }

const list = document.getElementById("modlist");
const sel  = document.getElementById("sel");
let cur = 0;

MODS.forEach((m,i)=>{
  const li = document.createElement("li");
  const b  = document.createElement("button");
  b.innerHTML = '<span class="modnum">'+m.num+'</span><span>'+m.title+'</span><span class="tick">&#10003;</span>';
  b.onclick = ()=>show(i);
  li.appendChild(b); list.appendChild(li);
  const o = document.createElement("option");
  o.value = i; o.textContent = m.num + " · " + m.title;
  sel.appendChild(o);
});
sel.onchange = e => show(+e.target.value);

function show(i){
  cur = i;
  const m = MODS[i];
  document.getElementById("eyebrow").textContent =
    m.num === "00" ? "Orientation" : "Module " + m.num;
  document.getElementById("doctitle").textContent = m.title;
  const doc = document.getElementById("doc");
  doc.innerHTML = mdToHtml(m.body);
  doc.querySelectorAll("table").forEach(t=>{
    const w = document.createElement("div");
    w.className = "tablewrap";
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });

  [...list.querySelectorAll("button")].forEach((b,j)=>{
    b.setAttribute("aria-current", j===i ? "true" : "false");
    b.parentNode.classList.toggle("done", read.has(MODS[j].num));
  });
  sel.value = i;

  const rb = document.getElementById("readbtn");
  const isRead = read.has(m.num);
  rb.setAttribute("aria-pressed", isRead ? "true" : "false");
  rb.textContent = isRead ? "✓  Marked as read" : "Mark this module read";
  rb.onclick = ()=>{ read.has(m.num) ? read.delete(m.num) : read.add(m.num); save(); show(i); };

  const p = document.getElementById("prev"), n = document.getElementById("next");
  p.disabled = i===0; n.disabled = i===MODS.length-1;
  document.getElementById("prevt").textContent = i>0 ? MODS[i-1].title : "—";
  document.getElementById("nextt").textContent = i<MODS.length-1 ? MODS[i+1].title : "—";
  p.onclick = ()=>show(i-1); n.onclick = ()=>show(i+1);

  window.scrollTo(0,0);
}

document.addEventListener("keydown", e=>{
  if(e.target.tagName === "SELECT") return;
  if(e.key === "ArrowRight" && cur < MODS.length-1) show(cur+1);
  if(e.key === "ArrowLeft"  && cur > 0) show(cur-1);
});

show(0);
</script>
