<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELE 717 Solid State Electronics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --sidebar:#EDF1F3;
  --ink:#17212B; --ink-soft:#5A6975; --ink-faint:#8695A1;
  --rule:#D9E1E6; --rule-soft:#E7EDF0;
  --copper:#A2542A; --copper-soft:#F3E7DE;
  --teal:#186A7B; --teal-soft:#E0EEF1;
  --shadow:0 1px 2px rgba(23,33,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
    --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
    --rule:#22303A; --rule-soft:#1A252E;
    --copper:#DC8B57; --copper-soft:#2A1D14;
    --teal:#54B4C6; --teal-soft:#122730;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
  --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
  --rule:#22303A; --rule-soft:#1A252E;
  --copper:#DC8B57; --copper-soft:#2A1D14;
  --teal:#54B4C6; --teal-soft:#122730;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16px; line-height:1.65;
  display:grid; grid-template-columns:272px 1fr; min-height:100vh;
}
::selection{background:var(--copper-soft); color:var(--ink)}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--copper); outline-offset:2px; border-radius:2px}

/* ---------- sidebar ---------- */
#nav{
  background:var(--sidebar); border-right:1px solid var(--rule);
  padding:26px 0 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
}
.brand{padding:0 22px 20px; border-bottom:1px solid var(--rule); margin-bottom:14px}
.brand h1{
  font-size:19px; line-height:1.2; margin:0 0 6px; font-weight:700;
  letter-spacing:-.01em; text-wrap:balance;
}
.brand p{margin:0; font-size:12px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase}
.seclabel{
  padding:0 22px; margin:18px 0 8px; font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-faint); font-weight:600;
}
.modlist{list-style:none; margin:0; padding:0}
.modlist button{
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  display:grid; grid-template-columns:26px 1fr 16px; gap:9px; align-items:baseline;
  padding:7px 22px; font:inherit; font-size:14px; color:var(--ink-soft);
  border-left:2px solid transparent;
}
.modlist button:hover{background:var(--rule-soft); color:var(--ink)}
.modlist button[aria-current="true"]{
  color:var(--ink); font-weight:600; border-left-color:var(--copper); background:var(--rule-soft);
}
.modnum{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.modlist button[aria-current="true"] .modnum{color:var(--copper)}
.tick{font-size:12px; color:var(--teal); opacity:0; transition:opacity .15s}
.done .tick{opacity:1}
.done .modnum{text-decoration:line-through}

/* ---------- reading column ---------- */
main{padding:0; min-width:0}
.sheet{
  background:var(--surface); border-left:0; min-height:100vh;
  padding:46px 56px 96px; max-width:none;
}
.wrap{max-width:74ch; margin:0 auto}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--copper); margin:0 0 8px;
}
h2.doctitle{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700;
  font-size:38px; line-height:1.1; letter-spacing:-.02em; margin:0 0 6px; text-wrap:balance;
}
.rule{height:1px; background:var(--rule); margin:26px 0 32px}

#doc h2{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:23px; font-weight:600;
  letter-spacing:-.01em; margin:44px 0 12px; padding-top:14px;
  border-top:1px solid var(--rule-soft); text-wrap:balance;
}
#doc h3{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:17px; font-weight:600;
  margin:28px 0 8px; color:var(--ink);
}
#doc p{margin:0 0 14px}
#doc strong{font-weight:600}
#doc ul,#doc ol{margin:0 0 16px; padding-left:22px}
#doc li{margin:0 0 6px}
#doc hr{border:0; border-top:1px solid var(--rule); margin:34px 0}

/* formulas + code */
#doc code{
  font-family:"IBM Plex Mono",monospace; font-size:.87em;
  background:var(--rule-soft); padding:1px 5px; border-radius:3px;
}
#doc pre{
  font-family:"IBM Plex Mono",monospace; font-size:13.5px; line-height:1.6;
  background:var(--surface); border:1px solid var(--rule);
  border-left:3px solid var(--copper);
  padding:14px 18px; overflow-x:auto; margin:0 0 18px; border-radius:0 3px 3px 0;
}
#doc pre code{background:none; padding:0; font-size:inherit}

/* blockquote = the "warning / think about this" voice */
#doc blockquote{
  margin:0 0 20px; padding:14px 18px; background:var(--teal-soft);
  border-left:3px solid var(--teal); font-style:normal;
}
#doc blockquote p:last-child{margin:0}

/* tables */
.tablewrap{overflow-x:auto; margin:0 0 20px}
#doc .cases .tablewrap, #doc .mat .tablewrap{margin:0; overflow:visible}
#doc table{border-collapse:collapse; width:100%; font-size:14.5px}
#doc th{
  /* deliberately NOT uppercased: in this course a header may be a variable,
     and n, N, v, V, s, S are different quantities */
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600; text-align:left;
  font-size:12.5px; letter-spacing:.03em; color:var(--ink-soft);
  border-bottom:1px solid var(--rule); padding:8px 12px 6px;
}
#doc td{
  padding:8px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:top;
  font-variant-numeric:tabular-nums;
}
#doc tbody tr:last-child td{border-bottom:1px solid var(--rule)}


/* ---------- mathematical typesetting ---------- */
#doc sub, #doc sup{
  font-size:.68em; line-height:0; position:relative; font-feature-settings:"tnum";
  padding-left:.04em;
}
#doc sub{ bottom:-.22em }
#doc sup{ top:-.42em }

/* display equations */
#doc .eq{
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16.5px; line-height:2.15; white-space:pre-wrap;
  margin:22px auto; padding:2px 0; max-width:100%;
  width:max-content; text-align:left; overflow-x:auto;
  color:var(--ink);
}
#doc .eq sub{ bottom:-.2em }

/* matrices and determinants */
#doc .eqrow{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:26px auto; overflow-x:auto; font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16.5px;
}
#doc .eqlhs{ white-space:nowrap }
#doc .mat{ display:inline-block; position:relative; padding:2px 12px }
#doc .mat table{ border-collapse:collapse; width:auto; margin:0 }
#doc .mat table td,
#doc .mat tbody tr td,
#doc .mat tbody tr:last-child td{
  padding:5px 14px; text-align:center; border:0; white-space:nowrap;
  font-variant-numeric:normal; background:none;
}
#doc .mat::before, #doc .mat::after{
  content:""; position:absolute; top:0; bottom:0; width:1px; background:var(--ink);
}
#doc .mat::before{ left:0 } #doc .mat::after{ right:0 }
#doc .mat-bracket::before, #doc .mat-bracket::after{
  width:7px; background:none; border-top:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
}
#doc .mat-bracket::before{ border-left:1px solid var(--ink) }
#doc .mat-bracket::after{ border-right:1px solid var(--ink) }

@media (max-width:860px){
  #doc .eq, #doc .eqrow{ font-size:15px }
  #doc .mat td{ padding:4px 9px }
}

/* ---------- piecewise definitions ---------- */
/* Centre both children on the same axis. Relying on stretch put the table at
   the container's top while the brace was centred, and the container measured
   20px taller than either child, so the brace hung low by half that. */
#doc .cases{ display:inline-flex; align-items:center; gap:8px; line-height:0 }
#doc .cases .brace{ flex:0 0 auto; display:block; overflow:visible }
#doc .cases table{ line-height:normal }
#doc .cases table{ border-collapse:collapse; width:auto; margin:0 }
#doc .cases table td,
#doc .cases tbody tr td,
#doc .cases tbody tr:last-child td{
  height:30px; padding:0 0 0 2px; border:0; background:none;
  vertical-align:middle; white-space:nowrap; text-align:left;
  font-variant-numeric:normal;
}
#doc .cases td.cval{ padding-right:22px }
#doc .cases td.ccond{ color:var(--ink-soft) }

/* ---------- figures ---------- */
#doc figure.fig{
  margin:26px 0; padding:0; text-align:center;
  color:var(--ink);
}
#doc figure.fig svg{ margin:0 auto 6px }
#doc figure.fig figcaption{
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
  font-size:12px; line-height:1.45; color:var(--ink-soft);
  max-width:60ch; margin:4px auto 0; text-wrap:balance;
}
#doc img{
  display:block; margin:20px auto; max-width:100%; height:auto;
  background:#fff; padding:10px; border:1px solid var(--rule); border-radius:2px;
}

/* ---------- footer nav ---------- */
.pager{
  display:flex; gap:12px; justify-content:space-between; align-items:stretch;
  margin-top:52px; padding-top:22px; border-top:1px solid var(--rule);
}
.pager button{
  flex:1; text-align:left; background:var(--surface); border:1px solid var(--rule);
  padding:12px 16px; cursor:pointer; font-family:"IBM Plex Sans Condensed",sans-serif;
  color:var(--ink); font-size:15px; line-height:1.3;
}
.pager button:hover{border-color:var(--copper)}
.pager button:disabled{opacity:.35; cursor:default}
.pager button.next{text-align:right}
.pager span{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px}

.readbtn{
  display:inline-flex; align-items:center; gap:8px; margin-top:26px;
  background:none; border:1px solid var(--rule); color:var(--ink-soft);
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:13.5px;
  padding:8px 14px; cursor:pointer;
}
.readbtn:hover{border-color:var(--teal); color:var(--ink)}
.readbtn[aria-pressed="true"]{border-color:var(--teal); color:var(--teal); background:var(--teal-soft)}

/* ---------- mobile ---------- */
#mobsel{display:none}
@media (max-width:860px){
  body{grid-template-columns:1fr}
  #nav{display:none}
  #mobsel{
    display:block; position:sticky; top:0; z-index:5; background:var(--sidebar);
    border-bottom:1px solid var(--rule); padding:12px 18px;
  }
  #mobsel select{
    width:100%; font-family:"IBM Plex Sans Condensed",sans-serif; font-size:15px;
    padding:9px 10px; background:var(--surface); color:var(--ink);
    border:1px solid var(--rule); border-radius:2px;
  }
  .sheet{padding:28px 20px 72px}
  h2.doctitle{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>html{color-scheme:light dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>

<body>

<nav id="nav">
  <div class="brand">
    <h1>Solid State<br>Electronics</h1>
    <p>ELE 717 · PGDEE &middot; 20 modules</p>
  </div>
  <div class="seclabel">Course</div>
  <ul class="modlist" id="modlist"></ul>
</nav>

<main>
  <div id="mobsel"><select id="sel" aria-label="Choose module"></select></div>
  <div class="sheet">
    <div class="wrap">
      <p class="eyebrow" id="eyebrow"></p>
      <h2 class="doctitle" id="doctitle"></h2>
      <div class="rule"></div>
      <article id="doc"></article>
      <button class="readbtn" id="readbtn" aria-pressed="false"></button>
      <div class="pager">
        <button id="prev"><span>Previous</span><b id="prevt"></b></button>
        <button id="next" class="next"><span>Next</span><b id="nextt"></b></button>
      </div>
    </div>
  </div>
</main>

<script>
/* ---- Mathematical typesetting -------------------------------------------
   Turns the plain-text notation used in the source files into real typographic
   subscripts and superscripts:

     a_x        -> a with subscript x
     E_t1       -> E with subscript t1
     e^{-jBz}   -> e with superscript -jBz
     r2 / 10-12 written with Unicode super/subscript characters is normalised
     to the same markup, so one mechanism handles everything.

   Runs after bold/italic and before code spans are restored, so code stays
   literal.                                                                  */

const SUP_CHARS = { "⁰":"0","¹":"1","²":"2","³":"3","⁴":"4",
  "⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9",
  "⁻":"−","⁺":"+","ⁿ":"n" };
const SUB_CHARS = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4",
  "₅":"5","₆":"6","₇":"7","₈":"8","₉":"9",
  "₋":"−","₊":"+","ₓ":"x","ᵧ":"y" };

const SUP_RE = /[⁰¹²³⁴-⁹⁺⁻ⁿ]+/g;
const SUB_RE = /[₀-₉₊₋ₓᵧ]+/g;

/* letters (incl. Greek), digits, and a leading sign are allowed in a bare run */
const RUN = "[A-Za-z0-9\\u0370-\\u03FF]";

function normaliseUnicodeScripts(s){
  s = s.replace(SUP_RE, m => "^{" + Array.from(m).map(c => SUP_CHARS[c]).join("") + "}");
  s = s.replace(SUB_RE, m => "_{" + Array.from(m).map(c => SUB_CHARS[c]).join("") + "}");
  return s;
}

/* Resolve marker{...} with brace counting, so a group may contain nested braces
   (Unicode normalisation injects them: e^{jω₀t} becomes e^{j_{0}t} first). */
function braced(s, marker, tag){
  let out = "", i = 0;
  for(;;){
    const j = s.indexOf(marker + "{", i);
    if(j < 0){ out += s.slice(i); return out; }
    out += s.slice(i, j);
    let depth = 0, k = j + 1;
    for(; k < s.length; k++){
      if(s[k] === "{") depth++;
      else if(s[k] === "}" && --depth === 0) break;
    }
    if(k >= s.length){ out += s.slice(j); return out; }   // unbalanced: leave alone
    out += "<" + tag + ">" + mathify(s.slice(j + 2, k)) + "</" + tag + ">";
    i = k + 1;
  }
}

function mathify(s){
  /* explicit groups first, recursing into their contents */
  s = braced(s, "^", "sup");
  s = braced(s, "_", "sub");
  /* then Unicode scripts, which become groups of their own */
  s = normaliseUnicodeScripts(s);
  s = braced(s, "^", "sup");
  s = braced(s, "_", "sub");
  /* finally bare runs: a_x, ^2 */
  s = s.replace(new RegExp("\\^(" + RUN + "+)", "g"), (m,c) => "<sup>" + c + "</sup>");
  s = s.replace(new RegExp("_("  + RUN + "+)", "g"), (m,c) => "<sub>" + c + "</sub>");
  return s;
}

/* ---- Matrices ------------------------------------------------------------
   ```matrix
   lhs: A x B  =
   style: det          (det = vertical bars, bracket = square brackets)
   a_x ; a_y ; a_z
   A_x ; A_y ; A_z
   ```                                                                       */
function matrixToHtml(body, esc){
  let lhs = "", style = "det";
  const rows = [];
  body.split("\n").forEach(line => {
    if(!line.trim()) return;
    const d = line.match(/^\s*(lhs|style)\s*:\s*(.*)$/i);
    if(d){ if(d[1].toLowerCase() === "lhs") lhs = d[2]; else style = d[2].trim(); return; }
    rows.push(line.split(";").map(c => c.trim()));
  });
  const body_ = rows.map(r =>
    "<tr>" + r.map(c => "<td>" + mathify(esc(c)) + "</td>").join("") + "</tr>").join("");
  return '<div class="eqrow">' +
      (lhs ? '<span class="eqlhs">' + mathify(esc(lhs)) + "</span>" : "") +
      '<span class="mat mat-' + (style === "bracket" ? "bracket" : "det") + '">' +
      "<table>" + body_ + "</table></span></div>";
}

/* ---- Piecewise definitions ------------------------------------------------
   ```cases
   lhs: u(t)  =
   1 ; t ≥ 0
   0 ; t < 0
   ```
   The brace is drawn to fit the row count exactly, rather than stretching one
   glyph, so the hooks keep their shape at any number of cases.               */
const CASE_ROW = 30;            /* must match #doc .cases td height in the CSS */

function brace(rows){
  const H = rows * CASE_ROW, m = H / 2, W = 11;
  const d = "M" + (W - 1) + ",1"
          + "C" + (W - 5) + ",1 " + (W - 6) + ",3 " + (W - 6) + ",6"
          + "L" + (W - 6) + "," + (m - 5)
          + "C" + (W - 6) + "," + (m - 2) + " " + (W - 8) + "," + m + " 1," + m
          + "C" + (W - 8) + "," + m + " " + (W - 6) + "," + (m + 2) + " " + (W - 6) + "," + (m + 5)
          + "L" + (W - 6) + "," + (H - 6)
          + "C" + (W - 6) + "," + (H - 3) + " " + (W - 5) + "," + (H - 1) + " " + (W - 1) + "," + (H - 1);
  return '<svg class="brace" width="' + W + '" height="' + H + '" '
       + 'viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">'
       + '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.3" '
       + 'stroke-linecap="round"/></svg>';
}

function casesToHtml(body, esc){
  let lhs = "";
  const rows = [];
  body.split("\n").forEach(line => {
    if(!line.trim()) return;
    const d = line.match(/^\s*lhs\s*:\s*(.*)$/i);
    if(d){ lhs = d[1]; return; }
    const parts = line.split(";");
    rows.push([parts[0] || "", parts.slice(1).join(";") || ""]);
  });
  const body_ = rows.map(r =>
      '<tr><td class="cval">' + mathify(esc(r[0].trim())) + '</td>'
    + '<td class="ccond">' + mathify(esc(r[1].trim())) + "</td></tr>").join("");
  return '<div class="eqrow">'
       + (lhs ? '<span class="eqlhs">' + mathify(esc(lhs)) + "</span>" : "")
       + '<span class="cases">' + brace(rows.length)
       + "<table>" + body_ + "</table></span></div>";
}

/* Minimal markdown renderer, inlined so the page has no external dependencies. */
function mdToHtml(src){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function inline(s){
    s = esc(s);
    const codes = [], figs = [];
    s = s.replace(/`([^`]+)`/g, function(m,c){ codes.push(c); return "\u0001" + (codes.length-1) + "\u0002"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    /* images: ![alt](src) — src is inlined as a data URI at build time */
    /* lazy alt so captions may contain brackets, e.g. "the sequence s[n]" */
    s = s.replace(/!\[([\s\S]*?)\]\(([^)\s]+)\)/g, function(m,alt,src){
      figs.push('<img src="' + src + '" alt="' + alt + '">');
      return "\u0005" + (figs.length-1) + "\u0006";
    });
    s = mathify(s);
    s = s.replace(/\u0005(\d+)\u0006/g, function(m,i){ return figs[+i]; });
    s = s.replace(/\u0001(\d+)\u0002/g, function(m,i){ return "<code>" + codes[+i] + "</code>"; });
    return s;
  }
  // Prose reflows; notation blocks (formula sheet, equation runs) keep their line breaks.
  function joinLines(arr){
    const mathy = arr.filter(x => /[=|⇒⟺→∮∫∇×·√]/.test(x)).length;
    const sep = (arr.length > 1 && mathy >= arr.length / 2) ? "<br>" : " ";
    // Join first, then parse inline markup, so **bold** spanning a source line
    // break is still closed correctly. \u0004 stands in for the join point.
    return inline(arr.join("\u0004")).split("\u0004").join(sep);
  }
  const lines = String(src).replace(/\r\n?/g,"\n").split("\n");
  const blank = l => !l.trim();
  const startsBlock = l =>
    /^#{1,6}\s/.test(l) || /^>\s?/.test(l) || /^```/.test(l) ||
    /^(---|\*\*\*|___)\s*$/.test(l) || /^\s*[-*]\s+/.test(l) ||
    /^\s*\d+\.\s+/.test(l) || /^\s*\|/.test(l) || /^ {4}\S/.test(l);
  const out = [];
  let i = 0;
  while(i < lines.length){
    const l = lines[i];
    if(blank(l)){ i++; continue; }

    if(/^```/.test(l)){
      const isMatrix = /^```\s*matrix\b/.test(l);
      const isFigure = /^```\s*figure\b/.test(l);
      const isCases  = /^```\s*cases\b/.test(l);
      i++; const buf = [];
      while(i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(isMatrix ? matrixToHtml(buf.join("\n"), esc)
             : isCases  ? casesToHtml(buf.join("\n"), esc)
             : isFigure ? buf.join("\n")          /* already HTML, built locally */
                        : "<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if(/^(---|\*\*\*|___)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }

    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; out.push("<h"+n+">" + inline(h[2]) + "</h"+n+">"); i++; continue; }

    if(/^\s*\|/.test(l) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      // "\\|" is an escaped pipe (e.g. |A| for magnitude), not a cell separator.
      const cells = r => r.trim().replace(/\\\|/g,"\u0003").replace(/^\|/,"").replace(/\|$/,"")
                          .split("|").map(c => c.trim().replace(/\u0003/g,"|"));
      const head = cells(l); i += 2; const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map(c => "<th>"+inline(c)+"</th>").join("") +
        "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>"+inline(c)+"</td>").join("") + "</tr>").join("") +
        "</tbody></table>");
      continue;
    }

    if(/^>\s?/.test(l)){
      const buf = [];
      while(i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,""));
      out.push("<blockquote>" + mdToHtml(buf.join("\n")) + "</blockquote>"); continue;
    }

    if(/^ {4}\S/.test(l)){
      const buf = [];
      while(i < lines.length && (/^ {4}/.test(lines[i]) ||
            (blank(lines[i]) && /^ {4}\S/.test(lines[i+1] || "")))){
        buf.push(lines[i].replace(/^ {4}/,"")); i++;
      }
      out.push('<div class="eq">' + mathify(esc(buf.join("\n"))) + "</div>"); continue;
    }

    if(/^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l)){
      const ordered = /^\s*\d+\.\s+/.test(l);
      const re = ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
      const items = [];
      while(i < lines.length && !blank(lines[i])){
        if(re.test(lines[i])){ items.push(lines[i].replace(re,"")); i++; }
        else if(/^\s+\S/.test(lines[i]) && items.length){ items[items.length-1] += "\n" + lines[i].trim(); i++; }
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push("<"+tag+">" + items.map(t => "<li>" + joinLines(t.split("\n")) + "</li>").join("") + "</"+tag+">");
      continue;
    }

    const buf = [];
    while(i < lines.length && !blank(lines[i]) && !startsBlock(lines[i])){ buf.push(lines[i]); i++; }
    if(!buf.length){ buf.push(lines[i]); i++; }
    out.push("<p>" + joinLines(buf) + "</p>");
  }
  return out.join("\n");
}

const MODS = [{"num": "00", "title": "Start Here", "body": "\n**Course:** ELE 717 Solid State Electronics (3 credits, compulsory), Postgraduate Diploma in Electrical/Electronic Engineering, Nigerian Defence Academy.\n\n**Official content (NUC BMAS / CCMAS):** *Physics and material properties of semiconductors: elemental and compound materials, energy bands, carrier concentrations and statistics, high-field effects and velocity saturation. Carrier transport and injection: diffusion and drift currents, carrier lifetime, excess carriers, injection mechanisms, surface phenomena. Material growth and impurity control: bulk and epitaxial growth, purification of silicon, crystal growth, doping and impurity control. Junctions and interfaces: metal–semiconductor interfaces, Schottky barriers versus Ohmic contacts, stability and characterisation. Device technology: p-n junction diodes, BJTs and FETs/MOSFETs.*\n\nThis course takes you from \"what is a semiconductor?\" to \"why does a diode obey the Shockley equation?\". The issued lecture note covers the first part (materials, crystals, Miller indices, bonding). The examination paper goes much further, into growth, doping, band theory, carrier statistics, transport, recombination and junctions. Every one of those topics is taught here from scratch.\n\n## How the material is organised\n\nEach module teaches one topic, then solves every examination question that belongs to it, in the order they appear on the paper. The question number (Q1 to Q50) is kept so you can find it.\n\n| Module | Topic | Exam questions |\n|---|---|---|\n| 01 | Semiconductor materials: Si, Ge, GaAs | Q1–Q4 |\n| 02 | Crystal lattices, structures and Miller indices | Q5–Q7 |\n| 03 | Bonding and crystal defects | Q8 |\n| 04 | Silicon purification and Czochralski growth | Q9–Q11 |\n| 05 | Epitaxial growth: VPE, LPE, MBE | Q12–Q13 |\n| 06 | Doping and thermal diffusion | Q14–Q19 |\n| 07 | Ion implantation | Q20–Q21 |\n| 08 | Quantum mechanics and energy bands | Q22–Q26 |\n| 09 | Carrier statistics and the Fermi level | Q27–Q34 |\n| 10 | Drift, mobility and high-field effects | Q35–Q38, Q41 |\n| 11 | Diffusion current and the Einstein relation | Q39–Q40 |\n| 12 | Generation, recombination and lifetime | Q42–Q44 |\n| 13 | Continuity equation and surface recombination | Q45–Q46 |\n| 14 | The p-n junction and the Shockley diode | Q47–Q48 |\n| 15 | Metal–semiconductor contacts | Q49 |\n| 16 | I-V and C-V characterisation | Q50 |\n| 17 | Device technology: BJT and MOSFET | syllabus only |\n| 18 | Formula sheet and constants | — |\n| 19 | Rapid-revision answer key (all 50) | Q1–Q50 |\n\n## The paper, by module\n\nThe examination questions are grouped on the paper as:\n\n- **Module 1: Material physics and semiconductor growth** (Q1–Q13) → here Modules 01–05.\n- **Module 1: Impurity control and doping** (Q14–Q21) → Modules 06–07.\n- **Module 2: Energy bands and carrier statistics** (Q22–Q34) → Modules 08–09.\n- **Module 3: Carrier transport and injection** (Q35–Q46) → Modules 10–13.\n- **Module 4: Junctions, interfaces and characterisation** (Q47–Q50) → Modules 14–16.\n\n## Four ideas that carry the whole course\n\n**1. The band gap decides everything.** A semiconductor has a gap E_g between a full valence band and an empty conduction band. It is small enough (about 0.5–3 eV) that heat, light or impurities can put carriers across it. Conductivity therefore becomes something you control, which is the whole point of the material.\n\n**2. Two kinds of carrier.** Electrons in the conduction band and holes in the valence band both carry current. In equilibrium their product is fixed: **np = n_i²**. Doping raises one and lowers the other.\n\n**3. Two ways to move.** Carriers drift in an electric field (J = qnμE) and diffuse down a concentration gradient (J = qD dn/dx). The two are linked by the Einstein relation D/μ = kT/q.\n\n**4. Excess carriers die exponentially.** Minority carriers injected into a region recombine with a lifetime τ and travel a diffusion length L = √(Dτ) before they do. The diode equation is nothing more than this fact applied at the edge of a depletion region.\n\n## How to study this\n\n1. Read the module once, straight through.\n2. Cover the solutions and attempt each exam question on paper.\n3. Check your answer. For derivations, check that you stated the **assumptions**; examiners give marks for them.\n4. Use Module 18 for the night before, and Module 19 to test yourself on all 50 questions in one sitting.\n\n> The numbers you must know without looking: E_g (Si 1.12 eV, Ge 0.66 eV, GaAs 1.42 eV), n_i(Si) ≈ 1×10¹⁰ cm⁻³, kT/q = 0.0259 V at 300 K, q = 1.602×10⁻¹⁹ C, Si lattice constant 5.43 Å, μ_n(Si) ≈ 1350 cm²/V·s.\n\n## Textbooks\n\nFrom the lecture note: *Fundamentals of Solid State Electronics* (C.-T. Sah, World Scientific, 1991); *Solid State Electronic Circuits* (Edward W. Maby); *Solid State Electronic Devices* (B. G. Streetman and S. K. Banerjee). Further reading: Sze and Ng, *Physics of Semiconductor Devices*; Neamen, *Semiconductor Physics and Devices*; Pierret, *Semiconductor Device Fundamentals*; Kittel, *Introduction to Solid State Physics*.\n\nStreetman and Banerjee is the closest match to the exam paper. Neamen is the easiest to read on your own.\n"}, {"num": "01", "title": "Semiconductor Materials: Si, Ge and GaAs", "body": "\nLecture note §1–§12. This module answers \"what is a semiconductor, and which one do I use?\".\n\n## 1.1 What a semiconductor is\n\nA **semiconductor** is a material whose electrical conductivity lies between that of a good conductor and an insulator, and whose conductivity can be **controlled** by temperature, illumination, electric field, magnetic field and impurity concentration.\n\nThe defining feature is not a particular conductivity value. It is a **finite, moderate energy gap** between occupied and unoccupied electron states. That gap is what makes the conductivity controllable, and controllability is what makes semiconductors useful for switching, amplification, rectification, sensing, energy conversion and computation.\n\nTypical resistivity ranges at room temperature:\n\n| Class | Resistivity ρ (Ω·cm) | Band picture | Examples |\n|---|---|---|---|\n| Conductor | 10⁻⁶ – 10⁻⁴ | Bands overlap, or a band is partly filled | Cu, Al, Ag |\n| Semiconductor | 10⁻³ – 10⁸ | Moderate gap, about 0.1–3.5 eV | Si, Ge, GaAs |\n| Insulator | 10¹⁰ – 10¹⁸ | Large gap, more than about 4 eV | SiO₂, glass, diamond |\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 220\" role=\"img\" aria-label=\"Band diagrams of a metal with a partly filled band, a semiconductor with a small gap, and an insulator with a wide gap\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"100.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Metal</text><text x=\"300.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Semiconductor</text><text x=\"500.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Insulator</text><rect x=\"30.0\" y=\"70.0\" width=\"140.0\" height=\"110.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"30.0\" y=\"120.0\" width=\"140.0\" height=\"60.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"30.0\" y=\"70.0\" width=\"140.0\" height=\"110.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"24.0\" y1=\"120.0\" x2=\"176.0\" y2=\"120.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-dasharray=\"5 3\"/><text x=\"178.0\" y=\"124.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"100.0\" y=\"100.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">empty states</text><text x=\"100.0\" y=\"155.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">filled states</text><text x=\"100.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">partly filled band, no gap</text><rect x=\"230.0\" y=\"50.0\" width=\"140.0\" height=\"55.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"230.0\" y=\"135.0\" width=\"140.0\" height=\"55.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><circle cx=\"255.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"255.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"285.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"285.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"315.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"315.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"345.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"345.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"380.0\" y1=\"105.0\" x2=\"380.0\" y2=\"135.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.8\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><text x=\"385.0\" y=\"124.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan> ≈ 1 eV</text><text x=\"300.0\" y=\"72.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">conduction band</text><text x=\"300.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">valence band</text><text x=\"300.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">small gap, a few carriers</text><rect x=\"430.0\" y=\"40.0\" width=\"140.0\" height=\"40.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"430.0\" y=\"150.0\" width=\"140.0\" height=\"40.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"580.0\" y1=\"80.0\" x2=\"580.0\" y2=\"150.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.8\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><text x=\"585.0\" y=\"119.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan> &gt; 4 eV</text><text x=\"500.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">conduction band</text><text x=\"500.0\" y=\"174.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">valence band</text><text x=\"500.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">wide gap, no carriers</text><line x1=\"12.0\" y1=\"195.0\" x2=\"12.0\" y2=\"45.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-end=\"url(#ar)\"/><text x=\"18.0\" y=\"50.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;font-style:italic;\" opacity=\"1.0\">E</text></svg><figcaption>Band pictures at room temperature. In a metal the highest band is partly filled. In a semiconductor a small gap lets some electrons cross by thermal excitation. In an insulator the gap is too wide for that.</figcaption></figure>\n```\n\n### Temperature: the opposite behaviour\n\nThis is the cleanest way to tell a semiconductor from a metal:\n\n- **Metal:** the number of free electrons is fixed and huge. Raising temperature only increases lattice vibration, which scatters electrons more. Resistance **rises** with temperature (positive temperature coefficient).\n- **Semiconductor:** raising temperature breaks more covalent bonds and creates more electron–hole pairs, roughly as exp(−E_g/2kT). The carrier increase wins over the extra scattering. Resistance **falls** with temperature (negative temperature coefficient).\n- **Insulator:** the gap is so large that almost no carriers are created even when hot.\n\n## 1.2 Valence electrons\n\nElectrons in the outermost shell are **valence electrons**; they form bonds and set the electrical behaviour.\n\n- Si (Z = 14) and Ge (Z = 32) are Group 14 (IV). Each has 4 valence electrons and forms four directional covalent bonds.\n- In GaAs, Ga is Group 13 (3 valence electrons) and As is Group 15 (5 valence electrons). The average is **4 per atom**, so GaAs also forms a tetrahedral crystal like Si.\n\nThis \"average of four\" rule is why III–V and II–VI compounds behave like Group IV semiconductors.\n\n## 1.3 Elemental and compound semiconductors\n\n**Elemental:** made of one element. Si, Ge (Group IV); also Se, Te, and diamond C (wide gap).\n\n**Compound:** made of two or more elements, grouped by the periodic-table columns they come from:\n\n- **III–V:** GaAs, InP, GaN, GaP, InSb, AlAs.\n- **II–VI:** CdTe, ZnSe, ZnS, CdS.\n- **IV–IV:** SiC, SiGe.\n- **Ternary and quaternary alloys:** Al_{x}Ga_{1−x}As, In_{0.53}Ga_{0.47}As, InGaAsP.\n\nThe advantage of compounds is **band-gap engineering**. By choosing the elements and the alloy fraction x you choose the gap (and so the light wavelength), the mobility and the lattice constant.\n\n## 1.4 The three materials in detail\n\n### Silicon (Si)\n\n- Diamond-cubic, a = 5.43 Å, **indirect** gap 1.12 eV.\n- Second most abundant element in the Earth's crust (sand, quartz), so cheap.\n- Grows a **stable, high-quality native oxide SiO₂**, the single most important reason for its dominance: it masks diffusion, passivates surfaces, and forms the MOS gate dielectric.\n- Large gap compared with Ge, so low intrinsic carrier concentration (n_i ≈ 10¹⁰ cm⁻³), low leakage, and operation up to about 150 °C.\n- Strong Si–Si bonds and good thermal conductivity (1.5 W/cm·K); large, dislocation-free crystals are routine.\n- Limitation: indirect gap, so it is a poor light emitter. Electron mobility is moderate.\n\n### Germanium (Ge)\n\n- Diamond-cubic, a = 5.65 Å, **indirect** gap 0.66 eV.\n- Higher electron and hole mobility than Si (μ_n ≈ 3900, μ_p ≈ 1900 cm²/V·s).\n- Small gap means high n_i (≈ 2.4×10¹³ cm⁻³): large leakage current and strong temperature sensitivity. Usable only to about 70–80 °C.\n- Its oxide GeO₂ is water-soluble and unstable, so no good MOS technology.\n- Uses: infrared detectors and optics, high-speed SiGe heterojunction transistors, substrates for space solar cells.\n\n### Gallium arsenide (GaAs)\n\n- III–V compound, **zinc-blende** structure, a = 5.65 Å, **direct** gap 1.42 eV.\n- Very high electron mobility (≈ 8500 cm²/V·s) and low effective mass: microwave and millimetre-wave devices (HEMTs, MESFETs).\n- Direct gap gives efficient radiative recombination: LEDs and laser diodes (≈ 870 nm), and efficient solar cells.\n- Can be made **semi-insulating** (ρ ≈ 10⁸ Ω·cm), an excellent substrate for RF integrated circuits.\n- Limitations: expensive, brittle, arsenic is toxic, low hole mobility, no useful native oxide, poorer thermal conductivity (0.46 W/cm·K), smaller wafers.\n\n## 1.5 Comparison table\n\n| Property | Si | Ge | GaAs |\n|---|---|---|---|\n| Type | Elemental (IV) | Elemental (IV) | Compound (III–V) |\n| Crystal | Diamond cubic | Diamond cubic | Zinc blende |\n| Lattice constant | 5.43 Å | 5.65 Å | 5.65 Å |\n| E_g at 300 K | 1.12 eV | 0.66 eV | 1.42 eV |\n| Gap type | Indirect | Indirect | Direct |\n| n_i (cm⁻³) | ≈ 1×10¹⁰ | ≈ 2.4×10¹³ | ≈ 2×10⁶ |\n| μ_n (cm²/V·s) | 1350 | 3900 | 8500 |\n| μ_p (cm²/V·s) | 480 | 1900 | 400 |\n| Relative permittivity ε_r | 11.7 | 16.0 | 12.9 |\n| Native oxide | Excellent SiO₂ | GeO₂, unstable | None useful |\n| Main uses | ICs, power, sensors, solar | IR, high-speed, SiGe HBT | RF, microwave, LEDs, lasers |\n| Relative cost | Low | Higher | High |\n\n## 1.6 Material selection\n\n- **Choose Si** for large-scale integration, low cost, mature processing, good oxide and power devices.\n- **Choose GaAs** (or other III–V) for high frequency, high electron mobility, or light emission.\n- **Choose Ge** (or SiGe) for high mobility or infrared work.\n- **Wide-gap SiC and GaN** for high voltage, high temperature and high power (E_g ≈ 3.3 and 3.4 eV).\n\nIn practice it is a trade-off between band gap, mobility, thermal conductivity, breakdown field, defect density, cost and manufacturability.\n\n---\n\n## Exam questions solved\n\n### Q1. Define a semiconductor and explain how its electrical conductivity differs from that of a conductor and an insulator.\n\n**Definition.** A semiconductor is a material whose conductivity lies between that of conductors and insulators (resistivity roughly 10⁻³ to 10⁸ Ω·cm) and can be controlled by temperature, light, electric field and, above all, by adding small amounts of impurity (doping). Examples: Si, Ge, GaAs.\n\n**Difference, explained with energy bands.**\n\n1. **Conductor.** The valence and conduction bands overlap, or the highest band is only partly filled. There is no gap, so a huge number of free electrons (about 10²² cm⁻³) is always present. Conductivity is very high (σ ≈ 10⁶ S/cm) and almost independent of impurities. It **decreases** as temperature rises because lattice scattering increases.\n2. **Insulator.** The valence band is full and the conduction band is empty, separated by a wide gap (E_g > about 4 eV, e.g. SiO₂ ≈ 9 eV). Thermal energy at room temperature (kT ≈ 0.026 eV) cannot lift electrons across, so there are practically no carriers. Conductivity is extremely small (σ < 10⁻¹⁰ S/cm).\n3. **Semiconductor.** Same full/empty arrangement but a **small gap** (Si 1.12 eV). At room temperature a small fraction of electrons is thermally excited into the conduction band, leaving holes behind, so both electrons and holes conduct. Conductivity is moderate and **increases** with temperature (negative temperature coefficient of resistance), and can be raised by many orders of magnitude by doping.\n\n**Summary.** Conductors have no gap and fixed, abundant carriers; insulators have a wide gap and essentially no carriers; semiconductors have a small gap, two carrier types, and a carrier density that can be engineered.\n\n### Q2. Distinguish between elemental semiconductors and compound semiconductors, giving two examples of each.\n\n| | Elemental | Compound |\n|---|---|---|\n| Composition | One chemical element | Two or more elements |\n| Periodic table | Group IV (14) | Combinations such as III–V, II–VI, IV–IV |\n| Crystal structure | Diamond cubic | Zinc blende or wurtzite |\n| Bonding | Purely covalent | Covalent with partial ionic character |\n| Band gap | Fixed by the element; Si and Ge are indirect | Adjustable by choice of elements and alloying; many are direct |\n| Processing | Mature, cheap (especially Si) | More difficult and costly; stoichiometry must be controlled |\n| Typical use | ICs, power, detectors | Optoelectronics, RF, high power |\n| **Examples** | **Silicon (Si), Germanium (Ge)** | **Gallium arsenide (GaAs), Indium phosphide (InP)**; also GaN, SiC, CdTe |\n\n### Q3. Explain why silicon is widely used in semiconductor device fabrication.\n\n1. **Abundance and cost.** Si makes up about 28 % of the Earth's crust as SiO₂ (sand, quartz). Raw material is cheap and the refining industry is enormous.\n2. **Excellent native oxide.** Silicon oxidises to SiO₂, which is stable, insoluble in water, an excellent insulator (E_g ≈ 9 eV, breakdown ≈ 10 MV/cm) and forms a very clean interface with Si (interface trap density about 10¹⁰ cm⁻²eV⁻¹). SiO₂ is used as a diffusion mask, surface passivation, field isolation and the MOSFET gate dielectric. No other semiconductor has a comparable oxide.\n3. **Suitable band gap.** At 1.12 eV it is large enough to give low intrinsic concentration and low leakage, so devices work up to about 150 °C (Ge fails above about 75 °C), yet small enough for good conduction when doped.\n4. **Mature crystal growth.** Very large (300 mm), nearly defect-free, highly pure single crystals are routinely grown by the Czochralski method.\n5. **Mechanical and thermal strength.** Si is hard, can be handled as thin wafers, and conducts heat well (about 3 times better than GaAs), which matters in power devices and dense ICs.\n6. **Well-understood doping.** B, P, As and Sb dope it predictably by diffusion and ion implantation.\n7. **Elemental.** No stoichiometry to control and no toxic constituents, unlike GaAs.\n\nIts main limitation is the indirect gap, which makes it a poor light emitter; that is why lasers and LEDs use compound semiconductors.\n\n### Q4. Compare the properties and applications of silicon (Si), germanium (Ge), and gallium arsenide (GaAs).\n\nUse the table in §1.5 as the core of the answer, then comment:\n\n- **Structure and bonding.** Si and Ge are elemental, diamond cubic, purely covalent. GaAs is a III–V compound, zinc blende, mainly covalent with partial ionic character (As is more electronegative than Ga).\n- **Band gap.** Ge (0.66 eV) < Si (1.12 eV) < GaAs (1.42 eV). The larger the gap, the lower n_i, the lower the leakage and the higher the maximum operating temperature. Si and Ge are **indirect**; GaAs is **direct**, so only GaAs emits light efficiently.\n- **Mobility.** GaAs electrons are fastest (8500), then Ge (3900), then Si (1350) cm²/V·s. Hence GaAs and Ge suit high-speed work, though GaAs hole mobility is poor.\n- **Oxide.** Only Si has an excellent native oxide, which is why MOS technology and VLSI are silicon.\n- **Cost and processing.** Si cheapest and most mature; Ge more expensive; GaAs most expensive, brittle and toxic.\n\n**Applications.**\n\n- **Si:** microprocessors, memories, all digital and analogue ICs, MOSFETs and BJTs, power devices (IGBTs, thyristors), solar cells, sensors and MEMS.\n- **Ge:** infrared detectors and lenses, high-speed SiGe heterojunction transistors, substrates for multi-junction space solar cells; historically the first transistors.\n- **GaAs:** microwave and RF amplifiers in mobile phones and radar, satellite communication, HEMTs and MESFETs, LEDs, laser diodes for optical fibre links, high-efficiency solar cells for satellites.\n"}, {"num": "02", "title": "Crystal Lattices, Structures and Miller Indices", "body": "\nLecture note §13–§17 and §21–§26. Semiconductor devices are made on single-crystal wafers, so you need the language of crystals: lattices, unit cells, and Miller indices for planes and directions.\n\n## 2.1 Lattice, basis and crystal\n\n- A **lattice** is an ideal mathematical array of points repeated periodically in space. Every point has identical surroundings.\n- A **basis** (motif) is the atom or group of atoms attached to each lattice point.\n- **Crystal = lattice + basis.**\n\nMaterials come in three forms:\n\n- **Single crystal:** periodic order throughout the whole piece. Required for devices (wafers).\n- **Polycrystalline:** many small crystals (grains) at random orientation, joined at grain boundaries. Used for MOSFET gates (poly-Si).\n- **Amorphous:** no long-range order. Examples: SiO₂ films, a-Si:H in thin-film solar cells.\n\n## 2.2 The unit cell\n\nThe **unit cell** is a volume which, when translated through the lattice, fills all space and regenerates the whole crystal. It is described by three edge lengths a, b, c and three angles α, β, γ.\n\n- The **primitive cell** contains exactly one lattice point (smallest possible).\n- The **conventional cell** is chosen for convenience and symmetry; for cubic crystals it is the cube, which may contain several lattice points.\n- **Lattice constant:** in a cubic crystal, the edge length a.\n- **Coordination number:** number of nearest neighbours of each atom.\n- **Atomic packing factor:** APF = (volume of atoms in the cell) / (volume of the cell).\n\n## 2.3 The cubic lattices\n\n| Structure | Atoms per cell | Coordination no. | Nearest-neighbour distance | APF |\n|---|---|---|---|---|\n| Simple cubic (SC) | 1 | 6 | a | 0.52 |\n| Body-centred cubic (BCC) | 2 | 8 | (√3/2)a | 0.68 |\n| Face-centred cubic (FCC) | 4 | 12 | (√2/2)a | 0.74 |\n| Diamond cubic | 8 | 4 | (√3/4)a | 0.34 |\n\nCounting atoms in a cubic cell: a corner atom is shared by 8 cells (counts 1/8), a face atom by 2 (counts 1/2), a body atom by 1.\n\n- SC: 8 × 1/8 = 1\n- BCC: 8 × 1/8 + 1 = 2\n- FCC: 8 × 1/8 + 6 × 1/2 = 4\n- Diamond: 8 × 1/8 + 6 × 1/2 + 4 inside = 8\n\n## 2.4 Diamond-cubic structure (Si, Ge, C)\n\nThe diamond lattice is **two interpenetrating FCC lattices**, one displaced from the other by one quarter of the body diagonal, (a/4, a/4, a/4). Its Bravais lattice is FCC with a two-atom basis.\n\n- Each atom has **4 nearest neighbours** at the corners of a regular tetrahedron, bond angle 109.5°.\n- Bonds are strongly directional and covalent (sp³ hybrid orbitals).\n- Open structure: APF only 0.34. This open space is why interstitial impurities and diffusion are possible.\n\nFor Si, a = 5.43 Å:\n\n    nearest-neighbour distance  r = (√3/4)a = (1.732/4)(5.43 Å) = 2.35 Å\n    atom density  N = 8/a³ = 8/(5.43×10⁻⁸ cm)³ = 5.0×10²² atoms/cm³\n\nThe atom density is worth remembering: doping at 10¹⁶ cm⁻³ means one impurity per 5 million Si atoms.\n\n## 2.5 Zinc-blende structure (GaAs, InP, GaP)\n\nGeometrically identical to diamond, but the two FCC sublattices hold **different atoms**: one Ga, one As. Each Ga has four As nearest neighbours and vice versa.\n\nBecause the two atoms differ, the crystal has **polarity** and **mixed covalent–ionic** bonding. It also lacks inversion symmetry, which gives piezoelectric and polar-optical effects. Opposite (111) faces are chemically different (a Ga face and an As face) and etch differently.\n\n## 2.6 Wurtzite structure (GaN, ZnO, CdS)\n\nHexagonal, but still **tetrahedrally** coordinated. The difference from zinc blende is the stacking of close-packed layers: wurtzite stacks ABABAB (hexagonal), zinc blende stacks ABCABC (cubic). Wurtzite crystals have built-in **spontaneous polarisation** and strong piezoelectric fields, which matter in GaN LEDs and HEMTs.\n\n## 2.7 Miller indices for planes\n\nMiller indices (h k l) identify a family of parallel crystal planes.\n\n**Procedure:**\n\n1. Find the intercepts of the plane on the x, y, z axes in units of a, b, c.\n2. Take the **reciprocals**.\n3. Clear fractions by multiplying by the lowest common denominator.\n4. Reduce to the smallest set of integers (if needed).\n5. Write in round brackets: (h k l).\n\nRules:\n\n- A plane **parallel** to an axis meets it at infinity; 1/∞ = 0, so that index is **0**.\n- A **negative** intercept gives a negative index, written with a bar over it. In plain text it is written as −1 or 1̄, e.g. (1 1̄ 0).\n- If a plane passes through the origin, shift the origin to a neighbouring lattice point first.\n\n### Notation summary\n\n| Notation | Meaning |\n|---|---|\n| (h k l) | One specific plane (or set of parallel planes) |\n| {h k l} | Family of all planes equivalent by symmetry, e.g. {100} = (100), (010), (001), (1̄00), (01̄0), (001̄) |\n| [u v w] | One specific direction |\n| ⟨u v w⟩ | Family of equivalent directions, e.g. ⟨111⟩ = the 8 body diagonals |\n\n### Directions\n\nA direction [u v w] is the vector from the start point to the end point, with components reduced to the smallest integers. [100] is the x-axis, [010] the y-axis, [001] the z-axis, [110] lies in the x–y plane, [111] is the body diagonal.\n\nIn **cubic** crystals only, the direction [h k l] is **perpendicular** to the plane (h k l).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 640 215\" role=\"img\" aria-label=\"Unit cubes with the (100) face, the (110) diagonal plane and the (111) plane shaded\" style=\"width:640px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><polygon points=\"37.7,180.4 132.8,180.4 132.8,85.4 37.7,85.4\" style=\"fill:var(--copper,#B4622F);stroke:var(--copper,#B4622F)\" fill-opaci
