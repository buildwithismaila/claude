2=\"85.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"237.8\" y1=\"180.4\" x2=\"332.8\" y2=\"180.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"237.8\" y1=\"85.4\" x2=\"332.8\" y2=\"85.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"332.8\" y1=\"180.4\" x2=\"332.8\" y2=\"85.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"290.0\" y1=\"150.0\" x2=\"214.2\" y2=\"194.1\" style=\"stroke:currentColor\" stroke-width=\"0.9\" opacity=\"0.45\" marker-end=\"url(#ar)\"/><text x=\"206.2\" y=\"206.1\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;font-style:italic;\" opacity=\"0.8\">x</text><line x1=\"290.0\" y1=\"150.0\" x2=\"418.2\" y2=\"150.0\" style=\"stroke:currentColor\" stroke-width=\"0.9\" opacity=\"0.45\" marker-end=\"url(#ar)\"/><text x=\"424.2\" y=\"154.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;font-style:italic;\" opacity=\"0.8\">y</text><line x1=\"290.0\" y1=\"150.0\" x2=\"290.0\" y2=\"21.8\" style=\"stroke:currentColor\" stroke-width=\"0.9\" opacity=\"0.45\" marker-end=\"url(#ar)\"/><text x=\"296.0\" y=\"19.8\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;font-style:italic;\" opacity=\"0.8\">z</text><text x=\"335.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">(110)</text><polygon points=\"437.8,180.4 585.0,150.0 490.0,55.0\" style=\"fill:var(--copper,#B4622F);stroke:var(--copper,#B4622F)\" fill-opacity=\"0.28\" stroke-width=\"1.4\" opacity=\"1.0\" stroke-linejoin=\"round\"/><line x1=\"490.0\" y1=\"150.0\" x2=\"490.0\" y2=\"55.0\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\" stroke-dasharray=\"3 3\"/><line x1=\"490.0\" y1=\"150.0\" x2=\"585.0\" y2=\"150.0\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\" stroke-dasharray=\"3 3\"/><line x1=\"490.0\" y1=\"150.0\" x2=\"437.8\" y2=\"180.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\" stroke-dasharray=\"3 3\"/><line x1=\"490.0\" y1=\"55.0\" x2=\"585.0\" y2=\"55.0\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"490.0\" y1=\"55.0\" x2=\"437.8\" y2=\"85.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"585.0\" y1=\"150.0\" x2=\"585.0\" y2=\"55.0\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"585.0\" y1=\"150.0\" x2=\"532.8\" y2=\"180.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"585.0\" y1=\"55.0\" x2=\"532.8\" y2=\"85.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"437.8\" y1=\"180.4\" x2=\"437.8\" y2=\"85.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"437.8\" y1=\"180.4\" x2=\"532.8\" y2=\"180.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"437.8\" y1=\"85.4\" x2=\"532.8\" y2=\"85.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"532.8\" y1=\"180.4\" x2=\"532.8\" y2=\"85.4\" style=\"stroke:currentColor\" stroke-width=\"1.1\" opacity=\"0.8\"/><line x1=\"490.0\" y1=\"150.0\" x2=\"414.2\" y2=\"194.1\" style=\"stroke:currentColor\" stroke-width=\"0.9\" opacity=\"0.45\" marker-end=\"url(#ar)\"/><text x=\"406.2\" y=\"206.1\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;font-style:italic;\" opacity=\"0.8\">x</text><line x1=\"490.0\" y1=\"150.0\" x2=\"618.2\" y2=\"150.0\" style=\"stroke:currentColor\" stroke-width=\"0.9\" opacity=\"0.45\" marker-end=\"url(#ar)\"/><text x=\"624.2\" y=\"154.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;font-style:italic;\" opacity=\"0.8\">y</text><line x1=\"490.0\" y1=\"150.0\" x2=\"490.0\" y2=\"21.8\" style=\"stroke:currentColor\" stroke-width=\"0.9\" opacity=\"0.45\" marker-end=\"url(#ar)\"/><text x=\"496.0\" y=\"19.8\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;font-style:italic;\" opacity=\"0.8\">z</text><text x=\"535.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"13\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">(111)</text></svg><figcaption>The three most important planes in a cubic crystal. Silicon wafers for MOS ICs are cut on (100); bipolar and some power wafers use (111).</figcaption></figure>\n```\n\n## 2.8 Interplanar spacing\n\nThe perpendicular distance between adjacent planes of the same (h k l) set in a cubic crystal:\n\n    d_{hkl} = a / √(h² + k² + l²)\n\nHigher indices mean more closely spaced, less densely populated planes.\n\n## 2.9 Why orientation matters in processing\n\n- **Surface atom density** differs by plane: in Si, (100) has 6.8×10¹⁴ atoms/cm², (111) has 7.8×10¹⁴ atoms/cm².\n- **Oxidation rate:** (111) oxidises faster than (100).\n- **Interface traps:** (100) gives the lowest Si/SiO₂ interface-state density, so **MOS technology uses (100) wafers**.\n- **Anisotropic etching:** KOH etches (100) far faster than (111), giving V-grooves with 54.7° walls, used in MEMS.\n- **Cleavage:** wafers break along {111} planes in Si and {110} in GaAs.\n- **Epitaxy:** the substrate orientation and lattice constant set the orientation and quality of the grown layer.\n- **Ion implantation channelling:** along low-index directions ions travel deep; wafers are tilted about 7° to avoid it.\n\n## 2.10 Worked examples from the lecture note\n\n| Intercepts | Reciprocals | Clear fractions | Miller indices |\n|---|---|---|---|\n| a, 2b, 3c | 1, 1/2, 1/3 | × 6 | (6 3 2) |\n| 2a, 3b, c | 1/2, 1/3, 1 | × 6 | (3 2 6) |\n| a, b, ∞ | 1, 1, 0 | — | (1 1 0) |\n| ∞, b, c | 0, 1, 1 | — | (0 1 1) |\n| 2a, ∞, 2c | 1/2, 0, 1/2 | × 2 | (1 0 1) |\n| a, 2b, 4c | 1, 1/2, 1/4 | × 4 | (4 2 1) |\n\nDirections: from (0,0,0) to (1,2,1) gives [121]. From (1,1,1) to (0,2,3) the change is (−1, 1, 2), giving [1̄12]. From (1,0,1) to (3,2,0) the change is (2, 2, −1), giving [221̄].\n\nSpacing: for Si (a = 5.43 Å), d₁₁₁ = 5.43/√3 = 3.135 Å. For a = 5.65 Å, d₂₂₀ = 5.65/√8 = 1.998 Å.\n\n---\n\n## Exam questions solved\n\n### Q5. What is a crystal lattice? Explain the significance of crystal structure in semiconductor materials.\n\n**Crystal lattice.** A crystal lattice is an infinite, periodic three-dimensional array of points in space such that every point has identical surroundings. It is generated by repeating a unit cell (edges a, b, c and angles α, β, γ) by translation. Attaching a basis of one or more atoms to each lattice point gives the real crystal: crystal = lattice + basis. Si, for example, is an FCC lattice with a two-atom basis, which produces the diamond structure.\n\n**Significance of crystal structure.**\n\n1. **It produces the energy bands.** The periodic potential of the lattice splits the atomic levels into allowed bands and forbidden gaps (Bloch's theorem, Kronig–Penney model). The size and type (direct or indirect) of the band gap depend on the structure and the atomic spacing.\n2. **Carrier mobility.** In a perfect periodic lattice electrons move without scattering; departures from periodicity (vibrations, impurities, defects, grain boundaries) cause scattering. Single crystals therefore have much higher mobility than polycrystalline or amorphous material.\n3. **Anisotropy.** Properties such as surface atom density, oxidation rate, etch rate, interface trap density, piezoelectric response and mobility differ with crystal direction. Wafer orientation ((100) or (111)) is chosen accordingly.\n4. **Doping and diffusion.** Dopant atoms sit on substitutional lattice sites to become active. Open structures (diamond, APF 0.34) allow interstitial diffusion.\n5. **Epitaxy and heterostructures.** Layers can be grown defect-free only on substrates with matching structure and lattice constant (e.g. AlGaAs on GaAs).\n6. **Mechanical behaviour.** Cleavage planes, hardness and how wafers are diced all follow from the structure and bond directions.\n7. **Defects.** Departures from the ideal structure (vacancies, dislocations) create states in the gap that act as traps and recombination centres, shortening carrier lifetime.\n\n### Q6. Define Miller indices and explain how they are used to identify crystal planes.\n\n**Definition.** Miller indices are a set of three smallest integers (h k l), proportional to the **reciprocals of the intercepts** a plane makes on the crystal axes (measured in units of the lattice constants), that specify the orientation of that plane and all planes parallel to it.\n\n**How they identify a plane (procedure):**\n\n1. Choose the origin at a lattice point not on the plane. Find the intercepts on x, y, z in units of a, b, c: say p, q, r.\n2. Take reciprocals 1/p, 1/q, 1/r. A plane parallel to an axis has an infinite intercept and so a zero index.\n3. Multiply by the lowest common multiple of the denominators to obtain integers.\n4. Reduce to the smallest integers and enclose in round brackets (h k l). Negative indices carry a bar.\n\n**Use and notation.** (h k l) names a particular plane; {h k l} the family of symmetry-equivalent planes; [u v w] a direction and ⟨u v w⟩ a family of directions. In cubic crystals [h k l] is normal to (h k l), and the spacing between planes is d = a/√(h² + k² + l²). Miller indices are used to specify wafer orientation ((100) for MOS, (111) for bipolar), etch planes, cleavage planes and X-ray diffraction peaks.\n\n**Example.** Intercepts a, 2b, 3c → reciprocals 1, 1/2, 1/3 → × 6 → **(6 3 2)**.\n\n### Q7. Determine the Miller indices of a crystal plane having intercepts of 2a, 3b, and 1c.\n\n| Step | x | y | z |\n|---|---|---|---|\n| Intercepts (in units of a, b, c) | 2 | 3 | 1 |\n| Reciprocals | 1/2 | 1/3 | 1/1 |\n| Multiply by the LCM of the denominators, 6 | 3 | 2 | 6 |\n\n**Miller indices = (3 2 6).**\n\nCheck: the integers 3, 2, 6 have no common factor, so no further reduction is possible. If the crystal is cubic with lattice constant a, the spacing of these planes is d₃₂₆ = a/√(9 + 4 + 36) = a/√49 = **a/7**.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 470 225\" role=\"img\" aria-label=\"The plane cutting the x axis at 2a, the y axis at 3b and the z axis at c, with Miller indices 3 2 6\" style=\"width:470px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"170.0\" y1=\"160.0\" x2=\"93.4\" y2=\"204.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" marker-end=\"url(#ar)\"/><text x=\"83.4\" y=\"214.5\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;font-style:italic;\" opacity=\"1.0\">x</text><line x1=\"170.0\" y1=\"160.0\" x2=\"362.0\" y2=\"160.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" marker-end=\"url(#ar)\"/><text x=\"370.0\" y=\"164.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;font-style:italic;\" opacity=\"1.0\">y</text><line x1=\"170.0\" y1=\"160.0\" x2=\"170.0\" y2=\"68.8\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" marker-end=\"url(#ar)\"/><text x=\"178.0\" y=\"64.8\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;font-style:italic;\" opacity=\"1.0\">z</text><line x1=\"139.6\" y1=\"172.4\" x2=\"147.6\" y2=\"178.4\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"113.2\" y1=\"187.7\" x2=\"121.2\" y2=\"193.7\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"218.0\" y1=\"156.0\" x2=\"218.0\" y2=\"164.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"266.0\" y1=\"156.0\" x2=\"266.0\" y2=\"164.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"314.0\" y1=\"156.0\" x2=\"314.0\" y2=\"164.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"166.0\" y1=\"112.0\" x2=\"174.0\" y2=\"112.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><polygon points=\"117.2,190.7 314.0,160.0 170.0,112.0\" style=\"fill:var(--copper,#B4622F);stroke:var(--copper,#B4622F)\" fill-opacity=\"0.25\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-linejoin=\"round\"/><circle cx=\"117.2\" cy=\"190.7\" r=\"3.2\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><text x=\"101.2\" y=\"204.7\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">2a</text><circle cx=\"314.0\" cy=\"160.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><text x=\"318.0\" y=\"178.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">3b</text><circle cx=\"170.0\" cy=\"112.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><text x=\"154.0\" y=\"114.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">1c</text><text x=\"330.0\" y=\"40.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">intercepts 2, 3, 1</text><text x=\"330.0\" y=\"58.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">reciprocals ½, ⅓, 1</text><text x=\"330.0\" y=\"76.0\" text-anchor=\"start\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">× 6  →  (3 2 6)</text></svg><figcaption>The (3 2 6) plane, cutting the axes at 2a, 3b and 1c.</figcaption></figure>\n```\n"}, {"num": "03", "title": "Bonding and Crystal Defects", "body": "\nLecture note §18–§20 and §27. The type of bond holding the atoms together decides how electrons behave in the solid. Defects decide how far real crystals fall short of the ideal.\n\n## 3.1 The bonding mechanisms\n\n**Ionic bonding.** One atom transfers electrons to another, producing positive and negative ions held together by electrostatic (Coulomb) attraction. Occurs between elements of very different electronegativity, e.g. Na⁺Cl⁻. The bond is strong but **non-directional**. Electrons are tightly bound to the ions, so ionic solids are insulators with large gaps; they are hard, brittle and have high melting points.\n\n**Covalent bonding.** Neighbouring atoms **share** pairs of valence electrons, one electron from each, so each atom completes its outer shell (8 electrons). The bond is strong and **directional**, which fixes the crystal geometry (tetrahedral, 109.5°). Electrons are localised in bonds at low temperature but can be freed by modest energy, which gives semiconducting behaviour. Examples: Si, Ge, diamond.\n\n**Metallic bonding.** Valence electrons leave their atoms and form a delocalised \"sea\" or gas of electrons shared by the whole crystal, holding a lattice of positive ion cores together. Non-directional. The free electron sea explains the high electrical and thermal conductivity, lustre and ductility of metals. Examples: Cu, Al, Na.\n\n**Van der Waals bonding.** Weak attraction between fluctuating dipoles in neutral atoms or molecules. Important in layered materials (graphite, MoS₂) and noble-gas solids, not in Si or GaAs.\n\n**Mixed ionic–covalent.** Real compound semiconductors lie between the ideal limits.\n\n| | Ionic | Covalent | Metallic |\n|---|---|---|---|\n| Mechanism | Electron transfer, ion attraction | Electron-pair sharing | Shared electron sea |\n| Directional? | No | Yes | No |\n| Free electrons | None | Few (created thermally) | Very many |\n| Electrical behaviour | Insulator | Semiconductor (or insulator) | Conductor |\n| Example | NaCl | Si, Ge, C | Cu, Al |\n\n## 3.2 Covalent bonding in Si and Ge\n\nEach Si atom has 4 valence electrons (3s²3p²). They hybridise into four **sp³** orbitals pointing to the corners of a tetrahedron, and each overlaps with one from a neighbour to form a two-electron bond. Every atom ends up sharing 8 electrons.\n\nAt 0 K all electrons sit in bonds: none is free and the crystal is an insulator. At room temperature thermal energy breaks a small number of bonds. Each broken bond releases a **free electron** and leaves behind a **hole** (a missing bond electron), which neighbouring bond electrons can hop into, so the hole also moves. This is the bond picture of electron–hole pair generation; in band language, the bond energy needed is the band gap E_g.\n\n## 3.3 Ionic character in GaAs\n\nGa contributes 3 electrons and As 5, so the bonds are still mainly covalent sp³. But **As is more electronegative** than Ga, so the shared electrons spend more time near As. Each bond is partly polar (As slightly negative, Ga slightly positive), giving about 30 % ionic character. Consequences: polar optical-phonon scattering, piezoelectricity, larger band gap than a purely covalent equivalent, and the Ga/As face polarity of (111) surfaces.\n\n## 3.4 Defects in real crystals\n\n| Type | Dimension | Examples | Effect |\n|---|---|---|---|\n| Point | 0-D | Vacancy, self-interstitial, substitutional or interstitial impurity, Frenkel pair (vacancy + interstitial) | Traps, recombination centres; vacancies assist diffusion |\n| Line | 1-D | Edge and screw dislocations | Leakage paths, recombination along the line, enhanced diffusion |\n| Planar | 2-D | Grain boundaries, stacking faults, twin boundaries, surfaces and interfaces | Scattering, interface traps, junction leakage |\n| Volume | 3-D | Voids, precipitates (e.g. SiO₂ clusters), inclusions | Gettering sites if controlled, device failure if not |\n\nDefects act as **scattering centres** (lower mobility), **recombination–generation centres** (shorter lifetime, more leakage), **traps** (charge storage and noise) and **diffusion paths**. Not all impurities are unwanted: deliberate dopants are substitutional point defects.\n\n---\n\n## Exam questions solved\n\n### Q8. Explain the difference between covalent, ionic, and metallic bonding and identify the dominant bonding mechanism in silicon.\n\n**Covalent bonding.** Adjacent atoms share pairs of valence electrons so that each completes a stable outer shell. The shared electrons are localised between the two atoms, making the bond strong and directional. Covalent solids are hard, have high melting points, and are semiconductors or insulators depending on how tightly the bonds hold their electrons.\n\n**Ionic bonding.** An electropositive atom gives up valence electrons to an electronegative atom; the resulting positive and negative ions attract electrostatically. The bond is strong but non-directional, there are no free electrons, and ionic solids (NaCl, MgO) are brittle insulators that conduct only when molten or dissolved.\n\n**Metallic bonding.** Each atom releases its valence electrons into a common delocalised electron gas that binds the positive ion cores. The bond is non-directional, and the mobile electron gas gives high electrical and thermal conductivity, ductility and metallic lustre.\n\n**Key differences:** how the electrons are held (shared between pairs / transferred to ions / shared by all atoms), directionality (yes / no / no), and the resulting electrical behaviour (semiconductor or insulator / insulator / conductor).\n\n**Bonding in silicon: covalent.** Si has four valence electrons. In the diamond-cubic lattice each Si atom forms four sp³ covalent bonds with four nearest neighbours at 109.5°, sharing one electron pair with each so that every atom has a full octet. Because Si–Si bonds are between identical atoms there is no ionic character. The modest bond strength (equivalent to E_g = 1.12 eV) is what lets thermal energy break a few bonds at room temperature, creating electron–hole pairs and giving silicon its semiconducting behaviour.\n"}, {"num": "04", "title": "Silicon Purification and Czochralski Growth", "body": "\nNot covered in the lecture note, but examined (Q9–Q11). A device needs silicon with fewer than about one unwanted impurity atom per billion, grown as one perfect crystal. This module explains how sand becomes a wafer.\n\n## 4.1 The route from sand to wafer\n\n    Quartzite (SiO₂) → MG-Si (98 %) → SiHCl₃ → purified SiHCl₃ → EG-Si polysilicon → single-crystal ingot → wafers\n\n| Stage | Product | Purity |\n|---|---|---|\n| Carbothermic reduction in an arc furnace | Metallurgical-grade Si (MG-Si) | ≈ 98–99 % |\n| Hydrochlorination, distillation, Siemens CVD | Electronic-grade polysilicon (EG-Si) | 99.9999999 % (9N) or better; impurities at ppb level |\n| Czochralski or float-zone growth | Single-crystal, doped ingot | Dopant set deliberately |\n\n## 4.2 Stage 1: metallurgical-grade silicon\n\nQuartzite (fairly pure SiO₂) is mixed with carbon (coal, coke, wood chips) and heated to about **2000 °C** in a submerged-electrode arc furnace:\n\n    SiO₂ + 2C → Si + 2CO\n\nMolten silicon is tapped from the furnace. MG-Si is about 98 % pure; the main impurities are Fe, Al, Ca, C, B and P. It is fine for steel and aluminium alloys and silicones, but far too impure for devices (it would contain about 10²⁰ cm⁻³ of unwanted impurities).\n\n## 4.3 Stage 2: conversion to trichlorosilane\n\nMG-Si is ground and reacted with dry hydrogen chloride in a fluidised-bed reactor at about **300 °C**:\n\n    Si + 3HCl → SiHCl₃ + H₂\n\nTrichlorosilane (TCS) is a liquid that boils at 32 °C. The impurities form their own chlorides (FeCl₃, AlCl₃, BCl₃, PCl₃) with different boiling points.\n\n## 4.4 Stage 3: fractional distillation\n\nThe liquid SiHCl₃ is purified by repeated **fractional distillation**, which separates it from the impurity chlorides because of the boiling-point differences. Because distillation of a liquid is very effective, the TCS reaches impurity levels in the parts-per-billion range.\n\n## 4.5 Stage 4: Siemens process (CVD of polysilicon)\n\nPurified TCS and hydrogen are fed into a bell-jar reactor containing thin, high-purity silicon rods heated electrically to about **1100 °C**. Silicon deposits on the rods by chemical vapour deposition:\n\n    SiHCl₃ + H₂ → Si + 3HCl\n\nThe rods grow over many hours into thick bars of **electronic-grade polycrystalline silicon** (EG-Si), purity 9N to 11N. The by-products are recycled. EG-Si is still polycrystalline and undoped; the next step turns it into one crystal with the right doping.\n\n## 4.6 Stage 5: single-crystal growth\n\nThe polysilicon is melted and regrown as a single crystal by the **Czochralski (CZ)** method (most wafers) or the **float-zone (FZ)** method (very high resistivity). The ingot is then ground to diameter, given an orientation flat or notch, sliced into wafers with a wire saw, lapped, etched and chemically-mechanically polished.\n\n## 4.7 The Czochralski method\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 470 345\" role=\"img\" aria-label=\"Czochralski crystal puller: a rotating seed is slowly withdrawn from silicon melt in a heated quartz crucible, growing a single-crystal ingot\" style=\"width:470px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"200.0\" y1=\"10.0\" x2=\"200.0\" y2=\"62.0\" style=\"stroke:currentColor\" stroke-width=\"2.2\" opacity=\"1.0\"/><path d=\"M184,34 a16,6 0 1,0 32,0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" stroke-linejoin=\"round\" marker-end=\"url(#ar)\"/><line x1=\"226.0\" y1=\"52.0\" x2=\"226.0\" y2=\"22.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" opacity=\"1.0\" marker-end=\"url(#art)\"/><rect x=\"193.0\" y=\"62.0\" width=\"14.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"196.0\" y=\"76.0\" width=\"8.0\" height=\"12.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"197.5\" y=\"88.0\" width=\"5.0\" height=\"22.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><path d=\"M197.5,110 L162,140 L162,212 Q200,222 238,212 L238,140 L202.5,110 Z\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.3\" opacity=\"1.0\" stroke-linejoin=\"round\"/><path d=\"M110,190 L110,280 Q200,300 290,280 L290,190\" style=\"fill:none;stroke:currentColor\" stroke-width=\"2.4\" opacity=\"1.0\" stroke-linejoin=\"round\"/><path d=\"M120,214 L120,276 Q200,292 280,276 L280,214 Z\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"0\" opacity=\"1.0\" stroke-linejoin=\"round\"/><line x1=\"120.0\" y1=\"214.0\" x2=\"160.0\" y2=\"214.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" opacity=\"1.0\"/><line x1=\"240.0\" y1=\"214.0\" x2=\"280.0\" y2=\"214.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" opacity=\"1.0\"/><path d=\"M100,186 L100,288 Q200,312 300,288 L300,186\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\" stroke-linejoin=\"round\"/><rect x=\"79.0\" y=\"196.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"212.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"228.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"244.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"260.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"276.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"196.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"212.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"228.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"244.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"260.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"276.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><path d=\"M182,304 a18,6 0 1,1 36,0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" stroke-linejoin=\"round\" marker-end=\"url(#ar)\"/><text x=\"236.0\" y=\"30.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">pull rod: rotate and lift slowly (≈ 1 mm/min)</text><text x=\"212.0\" y=\"83.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">seed crystal (sets orientation)</text><text x=\"210.0\" y=\"102.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Dash neck (removes dislocations)</text><text x=\"244.0\" y=\"172.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">single-crystal ingot</text><text x=\"304.0\" y=\"236.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Si melt, ≈ 1420 °C</text><text x=\"304.0\" y=\"266.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">quartz crucible</text><text x=\"312.0\" y=\"296.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">heater</text><line x1=\"300.0\" y1=\"233.0\" x2=\"252.0\" y2=\"240.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\"/><line x1=\"300.0\" y1=\"263.0\" x2=\"287.0\" y2=\"262.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\"/><line x1=\"308.0\" y1=\"293.0\" x2=\"312.0\" y2=\"286.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\"/><text x=\"200.0\" y=\"335.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.8\">crucible counter-rotates; chamber filled with argon</text></svg><figcaption>Czochralski puller. The seed is dipped into the melt and slowly withdrawn while seed and crucible rotate in opposite directions; the melt freezes onto the seed with the seed's orientation.</figcaption></figure>\n```\n\n**Principle.** A single-crystal **seed** of the desired orientation is dipped into molten silicon held just above its melting point (1414 °C). As the seed is slowly pulled up, the melt in contact with it cools and solidifies, and the atoms arrange themselves to continue the seed's lattice. The ingot therefore grows as one crystal with the seed's orientation.\n\n**Equipment.** A fused-silica (quartz, SiO₂) crucible inside a graphite susceptor, heated by RF induction or resistance heaters; a seed holder on a rotating pull rod; a chamber filled with argon at reduced pressure; diameter control by optical sensing.\n\n**Operation.**\n\n1. Load EG-Si chunks and the dopant (B for p-type; P, As or Sb for n-type, often as a heavily doped Si alloy) into the crucible.\n2. Evacuate and backfill with argon. Melt the charge at about 1420 °C.\n3. Lower the seed until it just touches the melt and let it reach thermal equilibrium.\n4. **Necking (Dash technique):** pull fast to grow a thin neck about 3 mm in diameter. Dislocations from the thermal shock of dipping run out of the side of the neck, so the crystal becomes dislocation-free.\n5. **Shoulder and body:** reduce the pull rate to widen the crystal to full diameter, then grow the main body at constant diameter. Typical pull rate about 1 mm/min (a few mm/min for small diameters). Seed and crucible rotate in opposite directions (about 10–30 rpm) to mix the melt and keep the temperature and doping uniform.\n6. **Tail:** increase the pull rate to narrow the diameter to a cone before separating from the melt, to avoid thermal shock dislocations running back up the crystal.\n7. Cool slowly. Ingots up to 300 mm (12 inch) diameter and about 2 m long are routine.\n\nThe diameter is controlled by the **pull rate** and the **melt temperature**: pulling faster or making the melt hotter gives a thinner crystal.\n\n### Dopant segregation\n\nImpurities prefer the liquid. The **equilibrium segregation coefficient** is\n\n    k₀ = C_s / C_l\n\nwhere C_s and C_l are the concentrations in the solid and in the liquid at the interface. Most dopants have k₀ < 1:\n\n| Impurity | B | P | As | Sb | Al | Ga | O | Fe |\n|---|---|---|---|---|---|---|---|---|\n| k₀ in Si | 0.8 | 0.35 | 0.3 | 0.023 | 0.002 | 0.008 | 0.25 | 8×10⁻⁶ |\n\nAs the crystal grows, rejected impurity accumulates in the shrinking melt, so the doping rises along the ingot. If C₀ is the initial melt concentration and f the fraction already solidified:\n\n    C_s = k₀ C₀ (1 − f)^{k₀ − 1}\n\n**Example.** To get boron at 1×10¹⁶ cm⁻³ in the first part of the crystal, the melt needs C₀ = C_s/k₀ = 1×10¹⁶/0.8 = 1.25×10¹⁶ cm⁻³. Half-way along (f = 0.5), C_s = 0.8 × 1.25×10¹⁶ × (0.5)^{−0.2} = 1.15×10¹⁶ cm⁻³, about 15 % higher. For P (k₀ = 0.35) the variation is much larger.\n\nThe same physics makes crystal growth a purification step: metals like Fe, with k₀ ≈ 10⁻⁵, are left behind in the melt.\n\n### Float-zone (FZ) comparison\n\nIn FZ growth a polysilicon rod is held vertically and a narrow molten zone, produced by an RF coil, is moved along it from a seed. No crucible touches the melt, so oxygen and carbon contamination are very low and resistivity up to about 10⁴ Ω·cm is possible. FZ wafers are used for power devices and detectors, but diameters are limited (≤ 200 mm) and the process is more expensive.\n\n---\n\n## Exam questions solved\n\n### Q9. Describe the major stages involved in converting metallurgical-grade silicon (MG-Si) into electronic-grade silicon (EG-Si).\n\n**Starting point: production of MG-Si.** Quartzite is reduced with carbon in an electric arc furnace at about 2000 °C: SiO₂ + 2C → Si + 2CO. The product is about 98 % pure, with Fe, Al, Ca, B, P and C as the main impurities.\n\n**Stage 1: Hydrochlorination (conversion to a volatile compound).** Pulverised MG-Si is reacted with anhydrous HCl at about 300 °C, usually with a catalyst in a fluidised bed: Si + 3HCl → SiHCl₃ + H₂. Silicon becomes trichlorosilane, a liquid boiling at 32 °C. Impurities form their own chlorides.\n\n**Stage 2: Purification by fractional distillation.** Because SiHCl₃ and the impurity chlorides have different boiling points, repeated fractional distillation separates them, leaving SiHCl₃ with electrically active impurities at parts-per-billion levels.\n\n**Stage 3: Reduction and deposition (Siemens process).** The purified SiHCl₃ is mixed with high-purity hydrogen and passed over electrically heated thin silicon filaments (about 1100 °C) in a CVD reactor: SiHCl₃ + H₂ → Si + 3HCl. Silicon deposits on the rods, which grow into thick polycrystalline bars of **electronic-grade silicon** (purity 9N–11N, i.e. 99.9999999 % or better). HCl and unreacted chlorosilanes are recovered and recycled.\n\n**Stage 4 (to make device material): single-crystal growth.** The EG-Si polysilicon is broken into chunks, melted with the required dopant and grown into a single-crystal ingot by Czochralski or float-zone growth. Segregation during freezing purifies it further. The ingot is then shaped, sliced, lapped, etched and polished into wafers.\n\n### Q10. Explain the principle and operation of the Czochralski (CZ) crystal growth method.\n\n**Principle.** Crystal pulling from the melt. A small single-crystal seed of known orientation is brought into contact with molten silicon held slightly above its melting point (1414 °C). Heat is conducted away up the seed, so the melt at the seed–melt interface solidifies. The freezing atoms take up positions that continue the seed's lattice, so the growing ingot is a single crystal with the same orientation as the seed. Pull rate and temperature control the diameter.\n\n**Equipment.** Furnace (quartz crucible in a graphite susceptor, RF or resistance heater); crystal-pulling mechanism (seed holder on a rotating, slowly rising shaft; crucible rotation and lift); ambient control (argon flow at reduced pressure); diameter and temperature control system.\n\n**Operation.**\n\n1. Polysilicon EG-Si and a precise amount of dopant are loaded into the crucible. The chamber is purged with argon and the charge is melted.\n2. The seed is lowered to touch the melt surface.\n3. A thin neck is pulled quickly (Dash necking) to eliminate dislocations.\n4. The pull rate and temperature are lowered so the crystal widens (shoulder) to the target diameter.\n5. The body is grown at constant diameter with typical pull rate about 1 mm/min while seed and crucible counter-rotate to stir the melt and keep it thermally symmetric.\n6. At the end the diameter is tapered to a tail cone and the crystal is lifted clear and cooled slowly.\n\nThe finished ingot is then characterised for orientation, resistivity and defects before being sliced into wafers.\n\n### Q11. State four advantages and two limitations of the Czochralski method.\n\n**Advantages:**\n\n1. **Large diameters**: 200 mm and 300 mm ingots are routine, which lowers cost per chip.\n2. **Dislocation-free crystals** of controlled orientation ((100), (111)) from the seed, thanks to Dash necking.\n3. **Controlled doping**: dopant added to the melt gives the required type and resistivity.\n4. **High throughput and low cost**: mature, highly automated, relatively fast growth.\n5. **Oxygen content strengthens the wafer** against warping and slip, and allows **intrinsic gettering** (oxygen precipitates in the bulk trap metallic impurities away from the device surface).\n\n**Limitations:**\n\n1. **Contamination from the crucible**: the quartz crucible dissolves slowly, introducing oxygen (≈ 10¹⁸ cm⁻³) and the graphite parts introduce carbon. Oxygen forms thermal donors and precipitates, and limits the attainable resistivity (CZ cannot easily exceed about 100 Ω·cm), so FZ is preferred for high-power and detector devices.\n2. **Non-uniform axial doping** because of segregation (k₀ < 1): the dopant concentration rises from seed end to tail end, so resistivity varies along the ingot. Melt convection also causes radial non-uniformity and growth striations.\n\n(Also acceptable: the crucible is consumed in each run; high energy consumption; batch process.)\n"}, {"num": "05", "title": "Epitaxial Growth: VPE, LPE and MBE", "body": "\nExamined in Q12–Q13. **Epitaxy** (Greek *epi* \"upon\", *taxis* \"arrangement\") is the growth of a thin single-crystal layer on a single-crystal substrate so that the layer continues the substrate's lattice and orientation.\n\n## 5.1 Why epitaxy is needed\n\nBulk growth gives one uniformly doped crystal. Devices need thin layers of **different doping or composition** on top of each other, with sharp interfaces:\n\n- A lightly doped layer on a heavily doped substrate (bipolar transistors, power diodes, CMOS latch-up prevention).\n- Layers of a different material: AlGaAs on GaAs, InGaAs on InP, GaN on sapphire (heterostructures, quantum wells, lasers, HEMTs).\n- Layers with fewer defects and less oxygen than CZ substrates.\n\n**Homoepitaxy:** layer and substrate are the same material (Si on Si). **Heteroepitaxy:** different materials (GaAs on Si, AlGaAs on GaAs). In heteroepitaxy the **lattice mismatch** f = (a_layer − a_sub)/a_sub must be small, otherwise misfit dislocations form above a critical thickness.\n\n## 5.2 Vapour-phase epitaxy (VPE)\n\nAlso called **chemical vapour deposition (CVD) epitaxy**. The workhorse for silicon.\n\n**Principle.** Gaseous compounds containing the semiconductor flow over a heated substrate. They decompose or react at the surface, depositing atoms which migrate to lattice sites and continue the crystal.\n\n**Silicon chemistries** (from the hydrogen reduction of chlorosilanes or pyrolysis of silane):\n\n    SiCl₄ + 2H₂ → Si + 4HCl          (≈ 1150–1250 °C)\n    SiH₂Cl₂ → Si + 2HCl              (≈ 1000–1100 °C)\n    SiH₄ → Si + 2H₂                  (≈ 600–1000 °C)\n\nThe HCl by-product etches silicon, so the reaction is reversible; too much SiCl₄ causes etching instead of growth. Dopant gases are added: **B₂H₆** (diborane) for p-type, **PH₃** (phosphine) or **AsH₃** (arsine) for n-type.\n\n**Growth regimes.** Two steps in series: transport of reactant through the gas boundary layer (mass-transport limited, weakly temperature dependent, at high T) and the surface reaction (reaction-rate limited, strongly temperature dependent, at low T). Production reactors usually run mass-transport limited for good uniformity.\n\n**For compound semiconductors:** chloride and hydride VPE, and **metal-organic CVD (MOCVD/MOVPE)**: (CH₃)₃Ga + AsH₃ → GaAs + 3CH₄ at about 600–750 °C. MOCVD is used for most commercial LEDs and lasers.\n\n**Typical figures:** growth rate 0.1–5 μm/min, thickness control about ±5 %, high throughput (many wafers per batch).\n\n**Problems:** **autodoping** (dopant evaporating from the substrate re-enters the layer) and **out-diffusion** from the heavily doped substrate at high temperature both blur the interface.\n\n## 5.3 Liquid-phase epitaxy (LPE)\n\n**Principle.** The substrate is brought into contact with a melt (solution) of the semiconductor dissolved in a solvent metal, saturated at a set temperature. The melt is then cooled slowly. As the solubility falls, the solution becomes supersaturated and the excess semiconductor crystallises onto the substrate, continuing its lattice.\n\n**Example:** GaAs dissolved in molten Ga, growth at about **700–900 °C** while cooling at about 0.1–1 °C/min. AlGaAs layers are grown by adding Al to the melt.\n\n**Apparatus:** the **sliding-boat** (graphite boat with several wells holding different melts; the substrate slides under each in turn to grow a multilayer structure), or tipping and dipping systems.\n\n**Features:** growth is close to thermodynamic equilibrium, so crystal quality is excellent and deep-level defect density is low; equipment is simple and cheap; growth rates are high (0.1–1 μm/min). But thickness control is poor (about 0.1 μm at best), interfaces are not abrupt, surface morphology is rough, the area is small, and some alloys cannot be grown. Historically used for the first double-heterostructure lasers and for LEDs; still used for some LEDs and thick layers.\n\n## 5.4 Molecular-beam epitaxy (MBE)\n\n**Principle.** In **ultra-high vacuum** (about 10⁻¹⁰–10⁻¹¹ Torr), beams of atoms or molecules evaporated from heated **effusion (Knudsen) cells** travel in straight lines (the mean free path is far longer than the chamber) and strike a heated substrate. They adsorb, migrate on the surface and incorporate into the lattice. Growth is controlled by opening and closing **mechanical shutters** in front of each cell, which switches a beam in a fraction of a second.\n\n**Example:** GaAs from Ga and As₄ cells with the substrate at about **550–650 °C**. Dopants: Si (n-type) and Be (p-type) cells.\n\n**Features:**\n\n- Growth rate about **1 μm/h**, i.e. about **one monolayer per second**, so layer thickness is controlled to a **single atomic layer**.\n- **Abrupt interfaces** and arbitrary composition and doping profiles: quantum wells, superlattices, modulation-doped HEMTs, quantum-cascade lasers.\n- **Low growth temperature** minimises interdiffusion and autodoping.\n- **In-situ monitoring**: **RHEED** (reflection high-energy electron diffraction) oscillations count monolayers as they grow; mass spectrometers check beams.\n- Disadvantages: very expensive UHV equipment, slow growth, low throughput, difficult with high-vapour-pressure elements like P, and needs long bake-outs.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 640 186\" role=\"img\" aria-label=\"Schematics of vapour-phase, liquid-phase and molecular-beam epitaxy\" style=\"width:640px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"100.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">VPE / CVD</text><rect x=\"30.0\" y=\"40.0\" width=\"140.0\" height=\"90.0\" rx=\"4\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.6\"/><rect x=\"55.0\" y=\"108.0\" width=\"90.0\" height=\"14.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.55\"/><rect x=\"65.0\" y=\"100.0\" width=\"70.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"8.0\" y1=\"60.0\" x2=\"160.0\" y2=\"60.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" opacity=\"1.0\" marker-end=\"url(#art)\"/><line x1=\"8.0\" y1=\"76.0\" x2=\"160.0\" y2=\"76.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" opacity=\"1.0\" marker-end=\"url(#art)\"/><text x=\"30.0\" y=\"55.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">SiCl₄ + H₂</text><line x1=\"170.0\" y1=\"90.0\" x2=\"190.0\" y2=\"90.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-end=\"url(#ar)\"/><text x=\"178.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">HCl</text><text x=\"100.0\" y=\"162.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">gas reacts on hot</text><text x=\"100.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">substrate, 1000–1250 °C</text><text x=\"315.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">LPE</text><rect x=\"245.0\" y=\"60.0\" width=\"140.0\" height=\"40.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\" opacity=\"1.0\"/><rect x=\"270.0\" y=\"62.0\" width=\"50.0\" height=\"26.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"330.0\" y=\"62.0\" width=\"40.0\" height=\"26.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.6\"/><rect x=\"275.0\" y=\"88.0\" width=\"40.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"385.0\" y1=\"92.0\" x2=\"415.0\" y2=\"92.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-end=\"url(#ar)\"/><text x=\"295.0\" y=\"54.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">Ga + As melt</text><text x=\"315.0\" y=\"120.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">slider moves substrate</text><text x=\"315.0\" y=\"162.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">cool slowly: GaAs</text><text x=\"315.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">precipitates, 700–900 °C</text><text x=\"535.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">MBE</text><rect x=\"460.0\" y=\"34.0\" width=\"150.0\" height=\"100.0\" rx=\"30\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.6\"/><rect x=\"505.0\" y=\"44.0\" width=\"60.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"510.0\" y=\"36.0\" width=\"50.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.55\"/><rect x=\"473.0\" y=\"112.0\" width=\"18.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"482.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">Ga</text><line x1=\"482.0\" y1=\"110.0\" x2=\"521.8\" y2=\"56.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.1\" opacity=\"1.0\" stroke-dasharray=\"3 3\"/><rect x=\"526.0\" y=\"112.0\" width=\"18.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"535.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">As</text><line x1=\"535.0\" y1=\"110.0\" x2=\"535.0\" y2=\"56.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.1\" opacity=\"1.0\" stroke-dasharray=\"3 3\"/><rect x=\"579.0\" y=\"112.0\" width=\"18.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"588.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">Si</text><line x1=\"588.0\" y1=\"110.0\" x2=\"548.2\" y2=\"56.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.1\" opacity=\"1.0\" stroke-dasharray=\"3 3\"/><line x1=\"470.0\" y1=\"100.0\" x2=\"494.0\" y2=\"100.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\"/><text x=\"535.0\" y=\"162.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">UHV ≈ 10⁻¹⁰ Torr, 500–650 °C</text><text x=\"535.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">atomic-layer control</text></svg><figcaption>The three methods side by side: gas reacting at a hot surface (VPE), a cooling saturated melt (LPE), and atomic beams in ultra-high vacuum (MBE).</figcaption></figure>\n```\n\n---\n\n## Exam questions solved\n\n### Q12. Explain the principles of vapour-phase epitaxy (VPE), liquid-phase epitaxy (LPE), and molecular-beam epitaxy (MBE).\n\nEpitaxy is the growth of a thin single-crystal film on a single-crystal substrate such that the film adopts the substrate's crystal structure and orientation. The three methods differ in the phase from which atoms arrive.\n\n**Vapour-phase epitaxy (VPE).** The semiconductor is supplied as a gas-phase chemical compound carried by hydrogen over a heated substrate inside a reactor. The compound decomposes or is reduced at the hot surface, and the released atoms move to lattice sites. For silicon the standard reaction is hydrogen reduction of silicon tetrachloride at about 1200 °C, SiCl₄ + 2H₂ → Si + 4HCl; silane SiH₄ → Si + 2H₂ is used at lower temperature. Doping is achieved by adding gases such as PH₃, AsH₃ or B₂H₆. The rate is set either by mass transport of reactants through the gas boundary layer or by the surface reaction. MOCVD is the metal-organic version used for III–V compounds.\n\n**Liquid-phase epitaxy (LPE).** The substrate is placed in contact with a saturated solution of the semiconductor in a molten metal solvent (e.g. GaAs in liquid Ga). On slow, controlled cooling the solubility decreases, the solution becomes supersaturated and the semiconductor precipitates epitaxially on the substrate. Growth occurs near thermodynamic equilibrium. A sliding graphite boat moves the substrate under successive melts to grow multilayers.\n\n**Molecular-beam epitaxy (MBE).** In ultra-high vacuum (≈ 10⁻¹⁰ Torr), elemental sources in heated effusion cells produce collision-free molecular beams aimed at a heated substrate. Atoms adsorb, migrate and incorporate in the lattice. Each beam has a shutter, so composition and doping can be switched abruptly. Growth is slow (≈ 1 monolayer/s) and is monitored in real time by RHEED, so thickness is controlled to atomic precision.\n\n### Q13. Compare VPE, LPE, and MBE in terms of growth mechanism, temperature, precision, and applications.\n\n| Feature | VPE (CVD) | LPE | MBE |\n|---|---|---|---|\n| Source phase | Gas (chlorosilanes, silane, metal-organics) | Liquid solution (melt) | Atomic or molecular beams from solid sources |\n| Growth mechanism | Chemical reaction / decomposition at the hot surface | Precipitation from a supersaturated solution on cooling; near equilibrium | Physical deposition: adsorption and surface migration; far from equilibrium |\n| Environment | Atmospheric or reduced pressure, H₂ carrier | Inert or H₂, graphite boat | Ultra-high vacuum, 10⁻¹⁰–10⁻¹¹ Torr |\n| Typical temperature | High: Si 1000–1250 °C; MOCVD 600–750 °C | Intermediate: 700–900 °C (GaAs) | Low: 400–650 °C (GaAs ≈ 600 °C) |\n| Growth rate | 0.1–5 μm/min | 0.1–1 μm/min | ≈ 1 μm/h (≈ 1 monolayer/s) |\n| Thickness precision | ≈ tens of nm; good uniformity | Poor, ≈ 0.1 μm; rough surface | Excellent, one atomic layer |\n| Interface abruptness | Moderate (autodoping, out-diffusion) | Poor (graded) | Atomically abrupt |\n| Crystal purity | Good | Very high, low deep-level defects | Very high (UHV) |\n| In-situ monitoring | Limited | None | RHEED, mass spectrometry |\n| Cost and throughput | Moderate cost, high throughput (batch) | Low cost, low throughput, small area | Very high cost, low throughput |\n| Applications | Si epi layers for BJTs, CMOS, power devices; MOCVD for LEDs, lasers, solar cells | LEDs, early heterostructure lasers, thick layers, photodetectors | Quantum wells, superlattices, HEMTs, HBTs, quantum-cascade and VCSEL lasers, research |\n\n**Conclusion.** VPE is the industrial choice for volume production, LPE is a simple low-cost method giving high-quality thick layers with poor control, and MBE gives the ultimate atomic-scale control for advanced heterostructure devices at high cost.\n"}, {"num": "06", "title": "Doping and Thermal Diffusion", "body": "\nLecture note §6 and §28, extended for Q14–Q19. Doping is how a semiconductor's conductivity and carrier type are set. Diffusion is the oldest way of getting the dopant into the wafer.\n\n## 6.1 Doping\n\n**Doping** is the deliberate, controlled addition of small amounts of specific impurity atoms (typically 10¹⁴–10²⁰ cm⁻³, i.e. one in 10⁸ to one in 500 host atoms) to change the type and concentration of carriers.\n\n### Donors: n-type\n\nA Group V atom (P, As, Sb) substitutes for Si. Four of its five valence electrons form bonds; the fifth is only weakly bound (about **0.045 eV** for P in Si, versus E_g = 1.12 eV) and at room temperature is released into the conduction band. The donor becomes a fixed positive ion N_D⁺.\n\nIn band terms the donor creates a level E_D just below E_c.\n\n- Electrons: majority carriers. Holes: minority carriers.\n- n ≈ N_D, p = n_i²/N_D.\n\n### Acceptors: p-type\n\nA Group III atom (B, Al, Ga, In) substitutes for Si. It has only three valence electrons, so one bond is incomplete. A neighbouring electron easily moves in (about **0.045 eV** for B), leaving a mobile **hole** in the valence band and making the acceptor a fixed negative ion N_A⁻.\n\nIn band terms the acceptor creates a level E_A just above E_v.\n\n- Holes: majority. Electrons: minority.\n- p ≈ N_A, n = n_i²/N_A.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 206\" role=\"img\" aria-label=\"Donor levels just below the conduction band release electrons; acceptor levels just above the valence band create holes\" style=\"width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7 "196.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan> ≈ 0.045 eV (P in Si)</text><text x=\"410.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">p-type: acceptors</text><rect x=\"310.0\" y=\"34.0\" width=\"200.0\" height=\"30.0\" rx=\"0\" style=\"fill:none;stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"310.0\" y1=\"60.0\" x2=\"510.0\" y2=\"60.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"310.0\" y1=\"150.0\" x2=\"510.0\" y2=\"150.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><rect x=\"310.0\" y=\"30.0\" width=\"200.0\" height=\"30.0\" rx=\"0\" style=\"fill:none;stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"310.0\" y=\"150.0\" width=\"200.0\" height=\"26.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><text x=\"516.0\" y=\"64.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"516.0\" y=\"154.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"319.0\" y1=\"138.0\" x2=\"337.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"328.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"332.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"352.0\" y1=\"138.0\" x2=\"370.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"361.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"365.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"385.0\" y1=\"138.0\" x2=\"403.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"394.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"398.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"418.0\" y1=\"138.0\" x2=\"436.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"427.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"431.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"451.0\" y1=\"138.0\" x2=\"469.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"460.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><circle cx=\"464.0\" cy=\"162.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"484.0\" y1=\"138.0\" x2=\"502.0\" y2=\"138.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"493.0\" y=\"130.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">−</text><text x=\"516.0\" y=\"141.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">A</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"410.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E<tspan dy=\"0.32em\" font-size=\"72%\">A</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan> ≈ 0.045 eV (B in Si)</text></svg><figcaption>Donor levels sit just below the conduction band and give up electrons; acceptor levels sit just above the valence band and capture electrons, creating holes.</figcaption></figure>\n```\n\nIonisation energies in Si (eV): P 0.045, As 0.054, Sb 0.039; B 0.045, Al 0.067, Ga 0.072, In 0.16. Because these are only about 2kT, practically all shallow dopants are ionised at 300 K.\n\n**In GaAs:** Group VI (S, Se, Te) on As sites are donors; Group II (Zn, Be, Mg) on Ga sites are acceptors; Group IV Si is **amphoteric** (a donor on a Ga site, an acceptor on an As site).\n\n**Compensation.** If both donors and acceptors are present, they cancel: the net doping is |N_D − N_A|, but both still scatter carriers.\n\n## 6.2 How dopants move: diffusion mechanisms\n\nAt high temperature (900–1200 °C for Si) atoms vibrate strongly and occasionally jump to a neighbouring site. Net movement goes from high to low concentration.\n\n1. **Substitutional (vacancy) diffusion.** The dopant sits on a lattice site and can only move when a **vacancy** appears next to it; it then swaps into the vacancy. Slow, because it needs both a vacancy (formation energy) and a jump (migration energy): activation energy 3–4 eV. Main dopants B, P, As, Sb.\n2. **Interstitial diffusion.** Small atoms squeeze between lattice sites without needing vacancies. Fast, activation energy 0.5–1.5 eV. Examples: Au, Cu, Fe, Li, H, Na. These metals are lifetime killers.\n3. **Interstitialcy (kick-out) mechanism.** A Si self-interstitial pushes a substitutional dopant into an interstitial position, the dopant moves, then kicks a Si atom out. Important for B and P.\n\nThe diffusion coefficient follows an Arrhenius law:\n\n    D = D₀ exp(−E_a / kT)\n\nFor B in Si: D₀ ≈ 0.76 cm²/s, E_a ≈ 3.46 eV, giving D ≈ 10⁻¹³ cm²/s at 1100 °C. A tiny change in T changes D a lot, so furnace temperature must be held to ±0.5 °C.\n\n## 6.3 Fick's laws\n\n**First law** (flux is proportional to the concentration gradient):\n\n    F = −D ∂C/∂x\n\nF is the flux (atoms per cm² per second), C the concentration (cm⁻³), D the diffusion coefficient (cm²/s). The minus sign means atoms flow **down** the gradient.\n\n**Second law** (conservation of atoms combined with the first law):\n\n    ∂C/∂t = −∂F/∂x = D ∂²C/∂x²\n\nIt gives how the concentration profile C(x, t) evolves in time. The two standard solutions correspond to the two steps of a real diffusion process.\n\n### Constant-source (predeposition) diffusion: erfc profile\n\nThe surface is held at a fixed concentration C_s (equal to the solid solubility of the dopant at that temperature) by a gas or glass source. With boundary conditions C(0, t) = C_s, C(∞, t) = 0, C(x, 0) = 0:\n\n    C(x, t) = C_s erfc( x / 2√(Dt) )\n\n    Total dose  Q(t) = (2/√π) C_s √(Dt)   [atoms/cm²]\n\n√(Dt) is the **diffusion length**; it sets the depth scale.\n\n### Limited-source (drive-in) diffusion: Gaussian profile\n\nA fixed dose Q is first deposited, the source is removed, and the wafer is heated to drive the dopant deeper:\n\n    C(x, t) = ( Q / √(πDt) ) exp( −x² / 4Dt )\n\nThe surface concentration C_s = Q/√(πDt) **falls** with time while the total dose stays constant.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 200\" role=\"img\" aria-label=\"Constant-source erfc profiles all start at the same surface value and deepen with time; fixed-dose Gaussian profiles spread and their surface value falls\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" s
