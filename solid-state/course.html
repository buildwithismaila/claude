64.0\" y=\"121.5\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">qΦ<tspan dy=\"0.32em\" font-size=\"72%\">B</tspan><tspan dy=\"-0.32em\">​</tspan> = q(Φ<tspan dy=\"0.32em\" font-size=\"72%\">m</tspan><tspan dy=\"-0.32em\">​</tspan> − χ)</text><line x1=\"40.0\" y1=\"20.0\" x2=\"40.0\" y2=\"158.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" marker-end=\"url(#ar)\"/><text x=\"46.0\" y=\"44.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">qΦ<tspan dy=\"0.32em\" font-size=\"72%\">m</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"400.0\" y1=\"130.0\" x2=\"400.0\" y2=\"78.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.4\" opacity=\"1.0\" marker-end=\"url(#ars)\"/><line x1=\"172.0\" y1=\"75.0\" x2=\"410.0\" y2=\"75.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\" stroke-dasharray=\"2 3\"/><text x=\"406.0\" y=\"112.5\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">qV<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"170.0\" y1=\"250.0\" x2=\"330.0\" y2=\"250.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><text x=\"250.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">depletion width W</text><text x=\"540.0\" y=\"266.0\" text-anchor=\"end\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\">n-type Si</text></svg><figcaption>Metal on n-type silicon with Φ<sub>m</sub> > Φ<sub>s</sub>, after contact. Electrons in the metal see the barrier qΦ<sub>B</sub>; electrons in the semiconductor see the smaller built-in barrier qV<sub>bi</sub>.</figcaption></figure>\n```\n\nTwo barriers result:\n\n    Barrier height (seen from the metal):  Φ_B = Φ_m − χ        (ideal Schottky–Mott rule)\n    Built-in potential (seen from the semiconductor):  V_bi = Φ_m − Φ_s = Φ_B − (E_c − E_F)/q\n\nFor p-type: Φ_Bp = E_g/q − (Φ_m − χ), and a rectifying contact needs Φ_m < Φ_s.\n\n**Fermi-level pinning.** Real barriers depend only weakly on Φ_m, because interface states fix the Fermi level at the surface at a characteristic energy (about one-third of the gap above E_v in Si and GaAs). Measured Φ_B on n-Si: Al ≈ 0.72, Ti ≈ 0.6, Au ≈ 0.8, PtSi ≈ 0.85 eV; on n-GaAs nearly always about 0.8 eV.\n\n**Image-force lowering.** An electron near the metal is attracted by its image charge, which lowers the barrier slightly with field: ΔΦ = √(qE_max/4πε_s).\n\n### Current transport\n\nCurrent is carried by **majority carriers** (electrons) emitted over the barrier: **thermionic emission**.\n\n    J = J_s [ exp(qV/ηkT) − 1 ],     J_s = A∗∗ T² exp( −qΦ_B/kT )\n\nA∗∗ is the effective Richardson constant (120 A cm⁻²K⁻² for free electrons; about 110 for n-Si, 8 for n-GaAs), η the ideality factor (1.0–1.1 for good diodes).\n\nForward bias lowers the semiconductor-side barrier to V_bi − V; the metal-side barrier Φ_B is fixed, which gives the small, voltage-independent reverse current.\n\n**Example.** n-Si, Φ_B = 0.8 eV, T = 300 K: J_s = 110 × (300)² × exp(−0.8/0.0259) = 9.9×10⁶ × 3.9×10⁻¹⁴ = 3.8×10⁻⁷ A/cm². That is about 10⁵ times larger than the J_s of a comparable p-n junction, so the Schottky diode turns on at about 0.3–0.4 V instead of 0.6–0.7 V.\n\n### Schottky diode versus p-n diode\n\n| | Schottky diode | p-n junction diode |\n|---|---|---|\n| Carriers | Majority carriers only | Minority-carrier injection and diffusion |\n| Mechanism | Thermionic emission over a barrier | Diffusion |\n| Stored charge | Negligible | Minority charge Q = Iτ |\n| Switching | Very fast (ps), no reverse recovery | Slower (reverse-recovery time ≈ τ) |\n| Turn-on voltage (Si) | 0.2–0.4 V | 0.6–0.7 V |\n| Reverse leakage | Higher | Lower |\n| Breakdown voltage | Lower | Higher |\n| Uses | Microwave mixers and detectors, power-supply rectifiers, clamps in Schottky TTL, MESFET gates | General rectification, high-voltage, low leakage |\n\n## 15.3 Ohmic contacts\n\nAn **Ohmic contact** has a linear, symmetric I-V characteristic and a resistance that is negligible compared with the device. It supplies current in either direction without limiting it.\n\nTwo ways to make one:\n\n1. **Low barrier** (Φ_m < Φ_s for n-type, or Φ_m > Φ_s for p-type). Electrons flow from metal to semiconductor on contact, forming an **accumulation** layer instead of a depletion layer. There is no barrier to majority-carrier flow. In practice, pinning makes such low-barrier metals rare for Si and GaAs.\n2. **Tunnelling contact** (the practical method). Dope the semiconductor very heavily under the contact (n⁺ or p⁺, above about 10¹⁹ cm⁻³). The depletion width W = √(2ε_sV_bi/qN_D) becomes only a few nanometres, so electrons **tunnel** straight through the barrier (field emission) in both directions, whatever its height.\n\nQuality is measured by the **specific contact resistance** ρ_c (Ω·cm²). For tunnelling contacts it falls exponentially with doping:\n\n    ρ_c ∝ exp( (2√(ε_s m∗)/ħ) · Φ_B / √N_D )\n\nGood contacts reach ρ_c ≈ 10⁻⁶–10⁻⁸ Ω·cm². Common choices: Al or silicides (TiSi₂, CoSi₂, NiSi) on n⁺/p⁺ Si; alloyed Au–Ge–Ni on n-GaAs. Contact resistance is measured with the transmission-line (TLM) method.\n\n## 15.4 Stability of contacts\n\nContacts must stay stable through processing and operation:\n\n- **Al spiking:** Si dissolves into Al and Al penetrates into Si, shorting shallow junctions. Prevented by Al–1%Si alloy or barrier layers (TiN, TiW).\n- **Electromigration:** high current densities move metal atoms, causing voids and open circuits. Reduced by Al–Cu alloys or Cu metallisation.\n- **Interdiffusion and reaction** at high temperature change the barrier height; silicides are used because they form a clean, stable interface.\n- **Interface contamination** and native oxide raise ρ_c and change Φ_B.\n\n---\n\n## Exam questions solved\n\n### Q49. Differentiate between a Schottky barrier diode and an Ohmic contact. Explain their energy-band characteristics.\n\nBoth are metal–semiconductor junctions. The difference is whether a significant potential barrier to majority-carrier flow exists at the interface.\n\n**Schottky barrier diode (rectifying contact).**\n\n*Condition:* n-type semiconductor with Φ_m > Φ_s (or p-type with Φ_m < Φ_s), moderate doping (≤ 10¹⁷ cm⁻³).\n\n*Energy-band characteristics:*\n\n1. Before contact, E_F in the n-semiconductor lies above E_F in the metal by Φ_m − Φ_s.\n2. On contact, electrons flow from semiconductor to metal until the Fermi levels align. A **depletion region** of ionised donors forms in the semiconductor and the bands bend **upward** at the interface.\n3. A barrier of height **qΦ_B = q(Φ_m − χ)** opposes electron flow from metal to semiconductor; a built-in barrier **qV_bi = q(Φ_m − Φ_s)** opposes flow from semiconductor to metal. (In practice Φ_B is fixed by Fermi-level pinning, e.g. ≈ 0.8 eV for Au on n-Si.)\n4. Forward bias (metal positive) lowers the semiconductor-side barrier to V_bi − V, and electrons are thermionically emitted into the metal: current rises exponentially. Reverse bias raises it to V_bi + |V| while Φ_B stays the same, so only a small saturation current flows.\n\n*I-V:* rectifying, J = A∗∗T²e^{−qΦ_B/kT}[e^{qV/ηkT} − 1].\n\n*Features:* majority-carrier device, negligible minority storage, very fast switching, low forward drop (0.2–0.4 V on Si), higher leakage than a p-n diode.\n\n**Ohmic contact.**\n\n*Condition:* either n-type with Φ_m < Φ_s (p-type with Φ_m > Φ_s), or, in practice, any metal on a **very heavily doped** (n⁺ or p⁺, > 10¹⁹ cm⁻³) surface layer.\n\n*Energy-band characteristics:*\n\n1. **Low-barrier case:** electrons flow from the metal into the semiconductor on contact, forming an **accumulation layer**; the bands bend **downward**. There is no barrier for electrons in either direction.\n2. **Tunnelling case:** a barrier exists, but heavy doping makes the depletion region only a few nanometres thick (W ∝ 1/√N_D). Electrons **tunnel** through it freely in both directions (field emission).\n\n*I-V:* linear and symmetric, V = IR_c, with very low specific contact resistance (ρ_c ≈ 10⁻⁶–10⁻⁸ Ω·cm²).\n\n| Feature | Schottky barrier | Ohmic contact |\n|---|---|---|\n| Work-function condition (n-type) | Φ_m > Φ_s | Φ_m < Φ_s (or heavy doping) |\n| Semiconductor doping | Moderate (10¹⁵–10¹⁷ cm⁻³) | Heavy (> 10¹⁹ cm⁻³) |\n| Band bending at interface (n-type) | Upward, depletion layer | Downward (accumulation) or very thin barrier |\n| Barrier to majority carriers | Yes, qΦ_B and qV_bi | None, or transparent to tunnelling |\n| Conduction mechanism | Thermionic emission | Free flow or field-emission tunnelling |\n| I-V characteristic | Rectifying, exponential | Linear, symmetric |\n| Resistance | Depends on bias and polarity | Small, constant |\n| Purpose | Fast rectifier, detector, MESFET gate | Connecting devices to the circuit |\n| Examples | Au, Pt, W, PtSi on n-Si; Ti/Au on n-GaAs | Al or silicide on n⁺/p⁺ Si; Au–Ge–Ni on n⁺-GaAs |\n"}, {"num": "16", "title": "I-V and C-V Characterisation", "body": "\nExamined in Q50. Once a device is made, its parameters are extracted electrically. Current–voltage (I-V) measurements reveal how current flows; capacitance–voltage (C-V) measurements reveal how charge is distributed, which gives the doping profile.\n\n## 16.1 I-V characterisation\n\n**Set-up.** A source-measure unit (SMU) or semiconductor parameter analyser applies a stepped voltage and measures current (pA to A), usually on a probe station, often at several temperatures.\n\n**What is extracted from a diode:**\n\nPlot ln I against V (semi-log). For the ideal or near-ideal diode\n\n    I = I_s [ exp(qV/ηkT) − 1 ]  ⇒  ln I ≈ ln I_s + qV/(ηkT)\n\n- **Saturation current I_s:** the intercept at V = 0 of the straight-line region.\n- **Ideality factor η:** from the slope, η = (q/kT) / (d ln I/dV). η ≈ 1 means diffusion current; η ≈ 2 means depletion-region recombination dominates.\n- **Series resistance R_s:** from the bending at high current, where V = V_j + IR_s.\n- **Reverse leakage and breakdown voltage V_BR** from the reverse characteristic.\n- **Schottky barrier height** from I_s: Φ_B = (kT/q) ln(A∗∗T²/J_s). With temperature-dependent data, an **Arrhenius plot** of ln(J_s/T²) versus 1/T has slope −qΦ_B/k.\n- **Ohmic contact check:** the I-V of two contacts should be linear and symmetric. Contact resistance is extracted by the transmission-line method (TLM).\n\n**Other I-V tests:** MOSFET output (I_D–V_DS) and transfer (I_D–V_GS) curves give threshold voltage, transconductance and mobility; BJT Gummel plots give current gain; four-point probe gives sheet resistance; Hall measurements give carrier type, density and mobility.\n\n## 16.2 C-V characterisation\n\n**Set-up.** A small AC voltage (10–50 mV, 10 kHz – 1 MHz) is superimposed on a DC bias V, and an LCR meter measures the small-signal capacitance C = dQ/dV as the DC bias is swept, usually in reverse.\n\n**Theory.** A reverse-biased junction (p⁺n or Schottky) behaves as a parallel-plate capacitor whose plate separation is the depletion width:\n\n    C = ε_s A / W,     W = √( 2ε_s (V_bi − V) / qN )\n\nso\n\n    C = A √( qε_s N / 2(V_bi − V) )\n\nSquaring and inverting:\n\n    1/C² = 2(V_bi − V) / (q ε_s N A²)\n\nFor uniform doping, **1/C² is a straight line against V**:\n\n- **Slope:** d(1/C²)/dV = −2/(qε_s N A²), so\n\n    N = 2 / ( q ε_s A² · |d(1/C²)/dV| )\n\n- **Intercept on the voltage axis** (1/C² = 0) gives V = V_bi. For a Schottky diode, Φ_B = V_bi + (kT/q) ln(N_c/N_D) + kT/q.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 210\" role=\"img\" aria-label=\"1 over C squared against bias is a straight line whose slope gives the doping and whose voltage intercept gives the built-in potential\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"184.0\" x2=\"464.0\" y2=\"184.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"388.8\" y1=\"184.0\" x2=\"388.8\" y2=\"30.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"474.0\" y=\"188.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">V (V)</text><text x=\"393.8\" y=\"26.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">1/C²</text><line x1=\"99.0\" y1=\"180.0\" x2=\"99.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"99.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-5</text><line x1=\"157.0\" y1=\"180.0\" x2=\"157.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"157.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-4</text><line x1=\"214.9\" y1=\"180.0\" x2=\"214.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"214.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-3</text><line x1=\"272.9\" y1=\"180.0\" x2=\"272.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"272.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-2</text><line x1=\"330.9\" y1=\"180.0\" x2=\"330.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"330.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-1</text><line x1=\"446.8\" y1=\"180.0\" x2=\"446.8\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"446.8\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><polyline points=\"99.0,52.6 423.6,184.0\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"99.0\" cy=\"52.6\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"157.0\" cy=\"76.1\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"214.9\" cy=\"99.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"272.9\" cy=\"123.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"330.9\" cy=\"146.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"388.8\" cy=\"169.9\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"423.6\" cy=\"184.0\" r=\"3.6\" style=\"fill:var(--teal,#1C6E7E)\"/><text x=\"429.6\" y=\"176.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">V<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"259.7\" y=\"107.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">slope = −2/(qε<tspan dy=\"0.32em\" font-size=\"72%\">sNA</tspan><tspan dy=\"-0.32em\">​</tspan>²)</text><text x=\"81.6\" y=\"36.8\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">reverse bias</text></svg><figcaption>Mott–Schottky plot. For uniform doping 1/C² falls on a straight line; the slope gives the doping, the voltage-axis intercept gives the built-in potential.</figcaption></figure>\n```\n\n**Non-uniform doping: profiling.** If N varies with depth, the local slope gives the doping at the edge of the depletion region, and the capacitance gives where that edge is:\n\n    N(W) = 2 / ( q ε_s A² · d(1/C²)/dV ) = −C³ / ( q ε_s A² · dC/dV ),     W = ε_s A / C\n\nSweeping the reverse bias moves W deeper and maps out the **doping profile** N(x). This works for one-sided junctions (p⁺n, n⁺p) or Schottky diodes, where the depletion region lies in one side only.\n\n**Worked example.** A Si Schottky diode of area A = 1×10⁻³ cm² gives a straight 1/C² plot with slope −1.2×10²¹ F⁻²V⁻¹ and voltage intercept 0.60 V. Then:\n\n    N_D = 2 / (1.602×10⁻¹⁹ × 1.036×10⁻¹² × (10⁻³)² × 1.2×10²¹)\n        = 2 / (1.99×10⁻¹⁶) = 1.0×10¹⁶ cm⁻³\n\n    V_bi = 0.60 V\n\n    At V = −5 V:  C = A√(qε_sN_D/2(V_bi − V)) = 10⁻³ √(1.66×10⁻¹⁵/11.2) = 12.2 pF\n                  W = ε_sA/C = 1.036×10⁻¹⁵/12.2×10⁻¹² = 0.85 μm\n\n**MOS C-V.** On a MOS capacitor, C-V curves (accumulation, depletion, inversion) give the oxide thickness (C_ox = ε_oxA/t_ox), flat-band and threshold voltages, substrate doping, fixed oxide charge, mobile ions (bias–temperature stress shifts) and interface-trap density D_it (from high- and low-frequency curves). This is the main tool for monitoring gate-oxide quality and stability.\n\n**Precautions.** Use reverse bias (forward bias adds diffusion capacitance and conductance); subtract stray and pad capacitance; choose frequency so traps do not respond (or do, deliberately); include series resistance correction; keep the AC signal small; Debye-length limits resolution near abrupt doping steps.\n\n---\n\n## Exam questions solved\n\n### Q50. Explain the principles of I-V and C-V characterisation of semiconductor devices and describe how C-V measurements can be used to estimate doping concentration.\n\n**I-V characterisation: principle.** A known DC voltage is applied across the device (swept in steps from reverse to forward bias) and the resulting current is measured with a source-measure unit, usually on a probe station and sometimes at several temperatures. Comparing the measured curve with device theory gives the transport parameters.\n\nFor a diode, I = I_s[exp(qV/ηkT) − 1]. From a semi-log plot of ln I versus V:\n\n- the intercept gives the **saturation current I_s** (and, for Schottky diodes, the **barrier height** Φ_B = (kT/q) ln(AA∗∗T²/I_s));\n- the slope gives the **ideality factor** η (1 for ideal diffusion current, approaching 2 when depletion-region recombination dominates);\n- deviation at high current gives the **series resistance**;\n- the reverse branch gives **leakage current** and **breakdown voltage**;\n- for contacts, a linear symmetric I-V confirms an **Ohmic** contact and gives contact resistance.\n\nI-V curves of transistors give threshold voltage, transconductance, output resistance, mobility and current gain, and repeated I-V measurement after stress is used to test **stability and reliability**.\n\n**C-V characterisation: principle.** A reverse-biased p-n junction or Schottky barrier has a depletion region free of carriers between two conducting regions; it behaves like a parallel-plate capacitor with dielectric ε_s and plate separation W:\n\n    C = ε_s A / W\n\nThe DC reverse bias is swept, and the small-signal capacitance is measured with a small AC voltage (typically 1 MHz, a few tens of mV) using an LCR meter. Since W increases with reverse bias, C decreases.\n\n**Using C-V to estimate doping.** For a one-sided abrupt junction (p⁺n or Schottky on n-type) with uniform doping N:\n\n    W = √( 2ε_s(V_bi − V)/qN )   ⇒   C = A √( qε_sN / 2(V_bi − V) )\n\nRearranging:\n\n    1/C² = 2(V_bi − V) / (qε_s N A²)\n\n1. Measure C at a series of reverse biases V.\n2. Plot **1/C² against V** (the Mott–Schottky plot). For uniform doping it is a **straight line**.\n3. The **slope** is −2/(qε_sNA²), so the doping concentration is **N = 2/(qε_sA²·|slope|)**.\n4. The **intercept** on the V axis gives the built-in potential V_bi (and from it the Schottky barrier height).\n5. **For non-uniform doping**, use the local slope: N(W) = 2/(qε_sA² d(1/C²)/dV) evaluated at each bias, and the depth W = ε_sA/C. This gives the doping profile N(x) as a function of depth.\n\n**Example.** A diode of area 10⁻³ cm² on Si (ε_s = 1.036×10⁻¹² F/cm) gives a 1/C² slope magnitude of 1.2×10²¹ F⁻²V⁻¹:\n\n    N = 2 / (1.602×10⁻¹⁹ × 1.036×10⁻¹² × 10⁻⁶ × 1.2×10²¹) = 1.0×10¹⁶ cm⁻³\n\n**Advantages and limits.** C-V is non-destructive, fast and needs only a simple diode, but only measures the doping on the lightly doped side, only to depths reachable before breakdown, and with resolution limited by the Debye length. Accuracy requires a correct area, correction for stray capacitance and series resistance, and a frequency at which deep traps do not respond.\n"}, {"num": "17", "title": "Device Technology: BJT and MOSFET", "body": "\nOn the official syllabus (\"physics of operational solid-state devices including p-n diodes, BJTs and FETs/MOSFETs\") but not on the 50-question paper. This module shows how the physics of Modules 09–16 makes the two transistors work, so a long essay question on devices will not catch you out.\n\n## 17.1 The bipolar junction transistor (BJT)\n\nAn npn BJT is two p-n junctions back to back sharing a thin p-type **base**: heavily doped n⁺ emitter, thin moderately doped p base, lightly doped n collector.\n\n**Forward-active mode:** emitter–base junction forward biased, collector–base junction reverse biased.\n\n1. The forward-biased E–B junction **injects electrons** from the emitter into the base (law of the junction: n_p(0) = n_p0 e^{qV_BE/kT}).\n2. The base is much thinner than the electron diffusion length (W_B ≪ L_n), so almost all injected electrons **diffuse across** the base without recombining. The profile is nearly linear.\n3. At the reverse-biased C–B junction the field **sweeps** them into the collector.\n\nCollector current, from the slope of the linear profile:\n\n    I_C = (qAD_n n_i² / (N_A W_B)) · exp(qV_BE/kT) = I_S e^{qV_BE/kT}\n\nThe base current is the much smaller hole current injected back into the emitter plus recombination in the base.\n\n**Efficiencies and gain:**\n\n    Emitter injection efficiency  γ ≈ 1 − (D_p N_A W_B)/(D_n N_D L_pE)   → keep N_D(emitter) ≫ N_A(base)\n    Base transport factor  α_T ≈ 1 − W_B²/(2L_n²)                       → thin base, long lifetime\n    α = γα_T = I_C/I_E,     β = α/(1 − α) = I_C/I_B   (typically 50–500)\n\n**Non-ideal effects:** base-width modulation (**Early effect**, finite output resistance), high-level injection, base resistance, avalanche breakdown of the C–B junction, and the base transit time τ_B = W_B²/2D_n which limits f_T. The SiGe heterojunction bipolar transistor (HBT) improves γ by using a narrower-gap base.\n\n## 17.2 The MOS capacitor\n\nMetal (or poly-Si) gate, SiO₂ insulator, p-type Si substrate. As gate voltage V_G increases:\n\n- **Accumulation** (V_G < V_FB): holes pile up at the surface; C = C_ox.\n- **Depletion** (V_FB < V_G < V_T): holes pushed away, leaving negative acceptor ions; C falls.\n- **Inversion** (V_G > V_T): the surface potential reaches 2φ_F, where φ_F = (kT/q) ln(N_A/n_i). Electrons become the majority at the surface: an n-type **inversion layer** (channel).\n\nThreshold voltage:\n\n    V_T = V_FB + 2φ_F + √(2qε_sN_A·2φ_F) / C_ox,     C_ox = ε_ox/t_ox\n\nV_FB = Φ_ms − Q_f/C_ox includes the work-function difference and fixed oxide charge. Mobile ions (Na⁺) and interface traps make V_T drift: the **stability** problem the syllabus mentions.\n\n## 17.3 The MOSFET\n\nAdd n⁺ source and drain on either side of the gate. With V_GS > V_T, the inversion channel connects them and current flows when V_DS is applied.\n\nSquare-law (long-channel) model, n-channel:\n\n    Linear (V_DS < V_GS − V_T):   I_D = μ_n C_ox (W/L) [ (V_GS − V_T)V_DS − V_DS²/2 ]\n    Saturation (V_DS ≥ V_GS − V_T):  I_D = (μ_n C_ox/2)(W/L)(V_GS − V_T)²\n\nSaturation happens when the channel **pinches off** at the drain end.\n\n**Short-channel effects** connect back to Module 10: velocity saturation (I_D ∝ V_GS − V_T instead of the square), hot-carrier injection, drain-induced barrier lowering, channel-length modulation and reduced surface mobility. CMOS combines n- and p-channel MOSFETs so that almost no static current flows.\n\n## 17.4 Other FETs\n\n- **JFET:** a reverse-biased p-n junction gate widens its depletion region into the channel to pinch it off.\n- **MESFET:** the same idea with a Schottky gate (Module 15); standard in GaAs microwave circuits.\n- **HEMT:** a modulation-doped AlGaAs/GaAs (or AlGaN/GaN) heterojunction forms a 2-D electron gas with very high mobility, made by MBE or MOCVD (Module 05).\n\n## 17.5 How the course fits together\n\n| Device feature | Physics behind it | Module |\n|---|---|---|\n| Junction barrier, V_bi | Constant Fermi level, carrier statistics | 09, 14 |\n| Exponential I-V | Law of the junction, Boltzmann statistics | 14 |\n| Diffusion across base | Diffusion current, continuity equation, L = √(Dτ) | 11, 13 |\n| Current gain β | Minority-carrier lifetime, SRH recombination | 12 |\n| Channel conduction | Drift, surface mobility | 10 |\n| Saturation in short channels | Velocity saturation, hot carriers | 10 |\n| Contacts and gates | Schottky and Ohmic contacts | 15 |\n| Thin base, sharp doping | Epitaxy, diffusion, ion implantation | 05–07 |\n| Gate oxide, (100) wafers | Si/SiO₂ interface, crystal orientation | 01, 02 |\n"}, {"num": "18", "title": "Formula Sheet and Constants", "body": "\n## Physical constants\n\n| Quantity | Symbol | Value |\n|---|---|---|\n| Electronic charge | q | 1.602×10⁻¹⁹ C |\n| Boltzmann constant | k | 1.381×10⁻²³ J/K = 8.617×10⁻⁵ eV/K |\n| Thermal energy at 300 K | kT | 0.0259 eV |\n| Thermal voltage at 300 K | kT/q | 0.0259 V (25.9 mV) |\n| Planck constant | h | 6.626×10⁻³⁴ J·s |\n| Reduced Planck constant | ħ | 1.055×10⁻³⁴ J·s |\n| Free electron mass | m₀ | 9.109×10⁻³¹ kg |\n| Permittivity of free space | ε₀ | 8.854×10⁻¹⁴ F/cm |\n| Speed of light | c | 3×10¹⁰ cm/s |\n| Electron-volt | 1 eV | 1.602×10⁻¹⁹ J |\n| Photon wavelength | λ | 1.24/E (μm, with E in eV) |\n\n## Material data at 300 K\n\n| | Si | Ge | GaAs |\n|---|---|---|---|\n| Crystal | Diamond | Diamond | Zinc blende |\n| Lattice constant a (Å) | 5.43 | 5.65 | 5.65 |\n| Atoms/cm³ | 5.0×10²² | 4.4×10²² | 4.4×10²² |\n| E_g (eV) | 1.12 (indirect) | 0.66 (indirect) | 1.42 (direct) |\n| n_i (cm⁻³) | 1×10¹⁰ | 2.4×10¹³ | 2×10⁶ |\n| N_c (cm⁻³) | 2.8×10¹⁹ | 1.04×10¹⁹ | 4.7×10¹⁷ |\n| N_v (cm⁻³) | 1.04×10¹⁹ | 6.0×10¹⁸ | 7.0×10¹⁸ |\n| μ_n (cm²/V·s) | 1350 | 3900 | 8500 |\n| μ_p (cm²/V·s) | 480 | 1900 | 400 |\n| D_n, D_p (cm²/s) | 35, 12.4 | 101, 49 | 220, 10 |\n| ε_r | 11.7 | 16.0 | 12.9 |\n| χ (eV) | 4.05 | 4.0 | 4.07 |\n| v_sat (cm/s) | 1×10⁷ | 6×10⁶ | ≈ 1×10⁷ (peak 2×10⁷) |\n| Melting point (°C) | 1414 | 937 | 1238 |\n\n## Crystals and Miller indices\n\n    Miller indices: intercepts → reciprocals → clear fractions → (h k l)\n    d_{hkl} = a / √(h² + k² + l²)      (cubic)\n    Diamond: 8 atoms/cell, coordination 4, r_nn = (√3/4)a, APF = 0.34\n    SC 1, BCC 2, FCC 4 atoms/cell;  APF 0.52, 0.68, 0.74\n\n## Growth and doping\n\n    SiO₂ + 2C → Si + 2CO;   Si + 3HCl → SiHCl₃ + H₂;   SiHCl₃ + H₂ → Si + 3HCl\n    Segregation: k₀ = C_s/C_l;   C_s = k₀C₀(1 − f)^{k₀ − 1}\n    Fick 1: F = −D ∂C/∂x;   Fick 2: ∂C/∂t = D ∂²C/∂x²;   D = D₀ e^{−E_a/kT}\n    Constant source: C = C_s erfc(x/2√(Dt));   Q = (2/√π)C_s√(Dt)\n    Limited source: C = (Q/√(πDt)) exp(−x²/4Dt)\n    Implant: N(x) = (Φ/√(2π)ΔR_p) exp(−(x − R_p)²/2ΔR_p²);   N_p ≈ 0.4Φ/ΔR_p;   Φ = It/qA\n\n## Bands and statistics\n\n    Schrödinger: −(ħ²/2m) d²ψ/dx² + Vψ = Eψ\n    Kronig–Penney: P sin(αa)/(αa) + cos(αa) = cos(ka)\n    1/m∗ = (1/ħ²) d²E/dk²\n    f(E) = 1/(1 + e^{(E − E_F)/kT})\n    g_c(E) = (4π(2m_n∗)^{3/2}/h³)√(E − E_c)\n    n = N_c e^{−(E_c − E_F)/kT};   p = N_v e^{−(E_F − E_v)/kT}\n    N_c = 2(2πm_n∗kT/h²)^{3/2}\n    n_i = √(N_cN_v) e^{−E_g/2kT};   np = n_i²\n    n = n_i e^{(E_F − E_i)/kT};   p = n_i e^{(E_i − E_F)/kT}\n    n = (N_D − N_A)/2 + √(((N_D − N_A)/2)² + n_i²)\n    E_F − E_i = kT ln(N_D/n_i);   E_i − E_F = kT ln(N_A/n_i)\n\n## Transport\n\n    v_d = μE;   μ = qτ_m/m∗;   1/μ = 1/μ_L + 1/μ_I\n    J_drift = q(nμ_n + pμ_p)E;   σ = q(nμ_n + pμ_p);   ρ = 1/σ\n    J_n = qnμ_nE + qD_n dn/dx;   J_p = qpμ_pE − qD_p dp/dx\n    Einstein: D/μ = kT/q\n    v_d = μE/[1 + (μE/v_sat)^β]^{1/β}\n\n## Recombination and continuity\n\n    SRH: U = (np − n_i²)/[τ_p(n + n₁) + τ_n(p + p₁)];   τ = 1/(σv_thN_t)\n    Low-level, n-type: U = Δp/τ_p;   Δp(t) = Δp(0)e^{−t/τ_p}\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − μ_pE ∂Δp/∂x + G_L − Δp/τ_p\n    L = √(Dτ);   Δp(x) = Δp(0)e^{−x/L_p}\n    Surface: U_s = SΔp_s;   S = σv_thN_st;   1/τ_eff = 1/τ_b + 2S/W\n\n## Junctions and contacts\n\n    V_bi = (kT/q) ln(N_AN_D/n_i²)\n    W = √((2ε_s/q)(V_bi − V)(1/N_A + 1/N_D));   N_Ax_p = N_Dx_n;   E_max = qN_Dx_n/ε_s\n    I = I_s(e^{qV/kT} − 1);   J_s = qn_i²(D_p/(L_pN_D) + D_n/(L_nN_A))\n    C_j = ε_sA/W;   1/C² = 2(V_bi − V)/(qε_sNA²);   N = 2/(qε_sA²|d(1/C²)/dV|)\n    Schottky: Φ_B = Φ_m − χ;   V_bi = Φ_m − Φ_s;   J_s = A∗∗T²e^{−qΦ_B/kT}\n    Ohmic (tunnelling): N_D ≳ 10¹⁹ cm⁻³\n\n## Devices\n\n    BJT: I_C = I_Se^{qV_BE/kT};   α_T ≈ 1 − W_B²/2L_n²;   β = α/(1 − α)\n    MOSFET: V_T = V_FB + 2φ_F + √(4qε_sN_Aφ_F)/C_ox\n    I_D(sat) = (μC_ox/2)(W/L)(V_GS − V_T)²\n\n## Rules of thumb\n\n- Each decade of doping moves E_F by 60 mV; each 60 mV of forward bias raises diode current tenfold (300 K).\n- n_i(Si) roughly doubles every 8 °C.\n- Doping 10¹⁶ cm⁻³ in Si = 1 dopant per 5×10⁶ Si atoms; ρ ≈ 0.5 Ω·cm (n-type), 1.4 Ω·cm (p-type).\n- Diffusion length in good Si: tens to hundreds of μm.\n"}, {"num": "19", "title": "Rapid-Revision Answer Key (Q1–Q50)", "body": "\nThe key point of every answer in one or two lines, for testing yourself the night before. Cover the right-hand column, say the answer aloud, then check. Full answers are in the module named in the first column.\n\n## Material physics and semiconductor growth (Q1–Q13)\n\n| Q | Key answer |\n|---|---|\n| 1 (M01) | Conductivity between metal and insulator, controllable by doping, T, light. Metal: no gap, σ falls with T. Insulator: gap > 4 eV. Semiconductor: gap ≈ 1 eV, two carriers, σ rises with T. |\n| 2 (M01) | Elemental: one element, Group IV, covalent, e.g. **Si, Ge**. Compound: two or more elements (III–V, II–VI), tunable and often direct gap, e.g. **GaAs, InP**. |\n| 3 (M01) | Abundant and cheap; excellent native SiO₂; 1.12 eV gap gives low leakage to 150 °C; large perfect crystals; strong, good thermal conductor; well-understood doping. |\n| 4 (M01) | Gaps 1.12 / 0.66 / 1.42 eV; indirect / indirect / direct; μ_n 1350 / 3900 / 8500. Si for ICs and power; Ge for IR and SiGe HBTs; GaAs for RF, LEDs, lasers. |\n| 5 (M02) | Lattice = periodic array of points; crystal = lattice + basis. Structure sets bands and gap, mobility, anisotropy, doping sites, epitaxy, cleavage and defects. |\n| 6 (M02) | Smallest integers proportional to reciprocals of intercepts. Steps: intercepts → reciprocals → clear fractions → (h k l). Infinite intercept → 0; negative → bar. |\n| 7 (M02) | 2, 3, 1 → 1/2, 1/3, 1 → × 6 → **(3 2 6)**. In a cubic crystal d = a/7. |\n| 8 (M03) | Covalent: shared pairs, directional. Ionic: electron transfer, Coulomb attraction. Metallic: electron sea. **Si is covalent**: four sp³ bonds, tetrahedral, 109.5°. |\n| 9 (M04) | SiO₂ + 2C → MG-Si (98 %); Si + 3HCl → SiHCl₃ (300 °C); fractional distillation; Siemens CVD SiHCl₃ + H₂ → Si + 3HCl (1100 °C) → EG-Si (9N–11N) polysilicon; then CZ/FZ. |\n| 10 (M04) | Seed dipped into melt at 1414 °C and slowly pulled (≈ 1 mm/min) with counter-rotation; melt freezes epitaxially on seed; Dash neck removes dislocations; shoulder, body, tail. |\n| 11 (M04) | Advantages: large diameter, dislocation-free, controlled doping, low cost, oxygen strengthens and getters. Limitations: O and C contamination from crucible (limits resistivity), axial doping variation from segregation. |\n| 12 (M05) | VPE: gas reacts on hot substrate (SiCl₄ + 2H₂ → Si + 4HCl). LPE: precipitation from cooling saturated melt. MBE: atomic beams in UHV with shutters, monolayer control. |\n| 13 (M05) | Temperature VPE 1000–1250 °C > LPE 700–900 °C > MBE 500–650 °C. Precision MBE (atomic) > VPE > LPE. Uses: VPE production Si/MOCVD LEDs; LPE LEDs, thick layers; MBE quantum wells, HEMTs. |\n\n## Impurity control and doping (Q14–Q21)\n\n| Q | Key answer |\n|---|---|\n| 14 (M06) | Controlled addition of impurities (10¹⁴–10²⁰ cm⁻³). Needed because intrinsic σ is too low and T-sensitive; sets carrier type, makes junctions, sets V_bi, V_T, β, contacts. |\n| 15 (M06) | n-type: Group V donors, electrons majority, E_F near E_c, n ≈ N_D. p-type: Group III acceptors, holes majority, E_F near E_v, p ≈ N_A. |\n| 16 (M06) | Donor: one extra valence electron, gives it to CB, becomes +, level near E_c (P, As, Sb). Acceptor: one fewer, takes an electron creating a hole, becomes −, level near E_v (B, Al, Ga, In). |\n| 17 (M06) | Thermally activated jumps down a gradient. Vacancy (substitutional, slow: B, P, As), interstitial (fast: Au, Cu, Fe), interstitialcy. D = D₀e^{−E_a/kT}. Predeposition + drive-in. |\n| 18 (M06) | First law F = −D∂C/∂x (flux ∝ gradient). Second law ∂C/∂t = D∂²C/∂x² (from continuity), gives the profile's time evolution. |\n| 19 (M06) | Constant source → C = 10²⁰ erfc(x/2√(Dt)) cm⁻³. Maximum (10²⁰) at the surface, falling monotonically with depth; penetrates as √t; dose Q = (2/√π)C_s√(Dt). |\n| 20 (M07) | Ionised, mass-selected dopant ions accelerated (keV–MeV) into the wafer; Gaussian profile at R_p; anneal. Advantages: precise dose, independent depth, low temperature, resist masks, shallow and buried profiles. |\n| 21 (M07) | Diffusion: high T, surface-peaked erfc/Gaussian, coupled dose/depth, no damage, cheap batch. Implant: room T, peak at R_p, ±1 % dose, damage needs anneal, channelling, costly, standard for VLSI. |\n\n## Energy bands and carrier statistics (Q22–Q34)\n\n| Q | Key answer |\n|---|---|\n| 22 (M08) | Wave nature; fixed nuclei (Born–Oppenheimer); perfect periodic potential; independent electrons in average potential; Bloch functions; Pauli principle; effective mass; Fermi–Dirac statistics. |\n| 23 (M08) | −(ħ²/2m)d²ψ/dx² + Vψ = Eψ. Kinetic-energy term + potential-energy term = total energy E; \\|ψ\\|² is probability density; E eigenvalues give quantisation. |\n| 24 (M08) | Periodic square wells and barriers; Bloch condition gives P sin(αa)/αa + cos αa = cos ka. Only energies with LHS between ±1 are allowed → bands and gaps; edges at k = nπ/a. |\n| 25 (M08) | VB: highest full band at 0 K (bond electrons, holes). CB: lowest empty band (free electrons). Gap E_g = E_c − E_v: no states. |\n| 26 (M08) | Direct: CB min and VB max at same k, photon only, efficient light (GaAs). Indirect: different k, phonon needed, poor emitter (Si, Ge). λ = 1.24/E_g μm. |\n| 27 (M09) | Pure, n = p = n_i. n = N_ce^{−(E_c−E_F)/kT}, p = N_ve^{−(E_F−E_v)/kT}; multiply: **n_i = √(N_cN_v) e^{−E_g/2kT}** ∝ T^{3/2}e^{−E_g/2kT}. |\n| 28 (M09) | Intrinsic: thermal only, n = p = n_i, strongly T-dependent. Extrinsic: from dopants, n ≠ p, n ≈ N_D or p ≈ N_A, nearly T-independent. Linked by np = n_i². |\n| 29 (M09) | n = p and np = n_i² ⇒ **n = p = 1.0×10¹⁰ cm⁻³**. |\n| 30 (M09) | f(E) = 1/(1 + e^{(E−E_F)/kT}): occupation probability of a state; ½ at E_F. Gives n and p, defines E_F, constant E_F in equilibrium sets junction physics. |\n| 31 (M09) | At 0 K f is a step: 1 below E_F, 0 above. VB full, CB empty, pure semiconductor is an insulator. |\n| 32 (M09) | g(E) = states per unit energy per unit volume, g_c ∝ (m_n∗)^{3/2}√(E − E_c). n = ∫g f dE; gives N_c, N_v; zero in gap. |\n| 33 (M09) | n-type: E_F rises toward E_c, E_F − E_i = kT ln(N_D/n_i). p-type: falls toward E_v. 60 mV per decade; degenerate at very high doping; returns to E_i at high T. |\n| 34 (M09) | n ≈ N_D = **5×10¹⁶ cm⁻³**. (p = 2×10³ cm⁻³; E_F − E_i = 0.40 eV in Si.) |\n\n## Carrier transport and injection (Q35–Q46)\n\n| Q | Key answer |\n|---|---|\n| 35 (M10) | μ = v_d/E = qτ/m∗. Depends on effective mass, temperature (lattice T^{−3/2}, impurity T^{3/2}), doping, field, defects, surfaces, orientation, strain. |\n| 36 (M10) | Lattice (acoustic, optical, polar phonons), ionised impurity, neutral impurity, carrier–carrier, defects, surface roughness, alloy, intervalley. Matthiessen 1/μ = Σ1/μ_i. |\n| 37 (M10) | v_dn = −μ_nE, v_dp = μ_pE; J = ρv: J_n = qnμ_nE, J_p = qpμ_pE; **J = q(nμ_n + pμ_p)E**, σ = q(nμ_n + pμ_p). |\n| 38 (M10) | J = qnμE = 1.602×10⁻¹⁹ × 2×10¹⁶ × 1350 × 10 = **43.3 A/cm²**. |\n| 39 (M11) | Current from carriers moving down a concentration gradient by random motion. Fick: F = −D dC/dx. J_n = qD_n dn/dx, J_p = −qD_p dp/dx. |\n| 40 (M11) | **D/μ = kT/q** (0.0259 V). From zero equilibrium current in a non-uniform sample. Si: D_n = 35, D_p = 12.4 cm²/s. |\n| 41 (M10) | High field: optical-phonon emission caps v_d at v_sat ≈ 10⁷ cm/s. Hot carriers (T_e ≫ T): impact ionisation, avalanche, oxide injection and V_T drift, substrate current; LDD as cure. |\n| 42 (M12) | Generation creates e–h pairs (thermal, optical, impact); recombination annihilates them (radiative, SRH, Auger, surface). Equal in equilibrium; net U = Δp/τ. |\n| 43 (M12) | Recombination via mid-gap trap: capture/emission of electrons and holes. U = (np − n_i²)/[τ_p(n + n₁) + τ_n(p + p₁)]; maximum for E_t ≈ E_i; τ = 1/σv_thN_t. |\n| 44 (M12) | Average time an excess minority carrier survives: Δp(t) = Δp(0)e^{−t/τ}. Sets L = √(Dτ), diode leakage, switching speed, BJT gain, solar-cell efficiency. |\n| 45 (M13) | ∂p/∂t = −(1/q)∂J_p/∂x + G − R; minority form ∂Δp/∂t = D∂²Δp/∂x² − Δp/τ + G. Used for diodes (exponential profile), BJTs, lifetime and Haynes–Shockley, solar cells. |\n| 46 (M13) | S defined by U_s = SΔp_s (cm/s), S = σv_thN_st. Dangling-bond surface states are SRH centres: 1/τ_eff = 1/τ_b + 2S/W. Passivate with SiO₂, SiNₓ, Al₂O₃. |\n\n## Junctions, interfaces and characterisation (Q47–Q50)\n\n| Q | Key answer |\n|---|---|\n| 47 (M14) | Diffusion of carriers uncovers fixed ions → depletion region and field; drift balances diffusion; flat E_F. **V_bi = (kT/q) ln(N_AN_D/n_i²)**; W = √(2ε_sV_bi(N_A + N_D)/qN_AN_D). |\n| 48 (M14) | Assumptions; law of junction p_n = p_n0e^{qV/kT}; diffusion equation → exponential decay over L_p; currents at edges; **I = I_s(e^{qV/kT} − 1)**, J_s = qn_i²(D_p/L_pN_D + D_n/L_nN_A). Forward: exponential rise; reverse: −I_s. |\n| 49 (M15) | Schottky: Φ_m > Φ_s (n-type), upward bending, depletion, barrier Φ_B = Φ_m − χ, rectifying, thermionic, fast. Ohmic: Φ_m < Φ_s or heavy doping, accumulation or tunnelling, linear I-V. |\n| 50 (M16) | I-V: ln I vs V gives I_s, η, R_s, breakdown, Φ_B. C-V: C = ε_sA/W; **1/C² = 2(V_bi − V)/(qε_sNA²)**; slope gives N = 2/(qε_sA²·slope), intercept gives V_bi; local slope gives profile N(W). |\n"}];
const KEY = "pgdee-sse-read";
let read = new Set();
try { read = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...read])); } catch(e) {} }

const list = document.getElementById("modlist");
const sel  = document.getElementById("sel");
let cur = 0;

MODS.forEach((m,i)=>{
  const li = document.createElement("li");
  const b  = document.createElement("button");
  b.innerHTML = '<span class="modnum">'+m.num+'</span><span>'+m.title+'</span><span class="tick">&#10003;</span>';
  b.onclick = ()=>show(i);
  li.appendChild(b); list.appendChild(li);
  const o = document.createElement("option");
  o.value = i; o.textContent = m.num + " · " + m.title;
  sel.appendChild(o);
});
sel.onchange = e => show(+e.target.value);

function show(i){
  cur = i;
  const m = MODS[i];
  document.getElementById("eyebrow").textContent =
    m.num === "00" ? "Orientation" : "Module " + m.num;
  document.getElementById("doctitle").textContent = m.title;
  const doc = document.getElementById("doc");
  doc.innerHTML = mdToHtml(m.body);
  /* Only data tables get the scrolling wrapper. Matrices and piecewise cases
     use a table for layout; wrapping them adds the wrapper's bottom margin to
     the flex line, which pushed the brace and the determinant bars out of
     alignment with their own rows. */
  doc.querySelectorAll("table").forEach(t=>{
    if (t.closest(".cases, .mat")) return;
    const w = document.createElement("div");
    w.className = "tablewrap";
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });

  [...list.querySelectorAll("button")].forEach((b,j)=>{
    b.setAttribute("aria-current", j===i ? "true" : "false");
    b.parentNode.classList.toggle("done", read.has(MODS[j].num));
  });
  sel.value = i;

  const rb = document.getElementById("readbtn");
  const isRead = read.has(m.num);
  rb.setAttribute("aria-pressed", isRead ? "true" : "false");
  rb.textContent = isRead ? "✓  Marked as read" : "Mark this module read";
  rb.onclick = ()=>{ read.has(m.num) ? read.delete(m.num) : read.add(m.num); save(); show(i); };

  const p = document.getElementById("prev"), n = document.getElementById("next");
  p.disabled = i===0; n.disabled = i===MODS.length-1;
  document.getElementById("prevt").textContent = i>0 ? MODS[i-1].title : "—";
  document.getElementById("nextt").textContent = i<MODS.length-1 ? MODS[i+1].title : "—";
  p.onclick = ()=>show(i-1); n.onclick = ()=>show(i+1);

  window.scrollTo(0,0);
}

document.addEventListener("keydown", e=>{
  if(e.target.tagName === "SELECT") return;
  if(e.key === "ArrowRight" && cur < MODS.length-1) show(cur+1);
  if(e.key === "ArrowLeft"  && cur > 0) show(cur-1);
});

show(0);
</script>
</body>
