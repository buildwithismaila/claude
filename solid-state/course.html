n2. **Impact ionisation.** A hot carrier with energy above about 1.5E_g collides with a bond and creates a new electron–hole pair. Repeated, this gives **avalanche multiplication** and avalanche breakdown (used in avalanche photodiodes and IMPATT diodes; limits breakdown voltage).\n3. **Hot-carrier injection** into the gate oxide of MOSFETs. Carriers near the drain overcome the Si/SiO₂ barrier (3.1 eV for electrons), become trapped in the oxide or create interface states, shifting the threshold voltage and degrading transconductance over time. A major reliability problem; reduced by **lightly doped drain (LDD)** structures and lower supply voltages.\n4. **Substrate current** from holes generated by impact ionisation, which can trigger parasitic bipolar action and latch-up.\n5. **Velocity overshoot** in very short devices, where carriers cross before they reach steady state and briefly exceed v_sat.\n6. **Light emission** and noise.\n\n---\n\n## Exam questions solved\n\n### Q35. Define carrier mobility and explain the factors that affect electron and hole mobility in semiconductors.\n\n**Definition.** Carrier mobility μ is the drift velocity acquired per unit applied electric field:\n\n    μ = |v_d| / E = qτ_m / m∗      [cm²/V·s]\n\nwhere τ_m is the mean free time between collisions and m∗ the effective mass. It measures how easily carriers move through the crystal under a field. Electron mobility μ_n and hole mobility μ_p are different (Si: 1350 and 480 cm²/V·s).\n\n**Factors affecting mobility:**\n\n1. **Effective mass.** μ ∝ 1/m∗. Electrons generally have lighter effective mass than holes, so μ_n > μ_p. GaAs electrons (m∗ = 0.067m₀) have μ_n ≈ 8500 cm²/V·s.\n2. **Temperature.** Two opposing effects:\n   (a) Lattice scattering increases with T, μ_L ∝ T^{−3/2}.\n   (b) Ionised-impurity scattering decreases with T, μ_I ∝ T^{3/2}/N_I, since faster carriers are deflected less.\n   Mobility therefore rises at low T, peaks, and falls at high T. Near room temperature lattice scattering usually dominates and μ falls as T rises.\n3. **Doping (impurity) concentration.** More ionised impurities mean more Coulomb scattering: μ falls as N_D + N_A increases (Si μ_n ≈ 1350 at 10¹⁴ cm⁻³ but about 100 at 10²⁰ cm⁻³). Compensated material has low mobility even though net doping is small.\n4. **Electric field.** At low field μ is constant. At high field carriers heat up, emit optical phonons, and drift velocity saturates, so the effective mobility v_d/E falls.\n5. **Crystal defects** (dislocations, grain boundaries, vacancies) add scattering; polycrystalline and amorphous material have much lower mobility.\n6. **Surface and interface scattering.** In MOSFET channels, roughness and interface charge reduce mobility to roughly half the bulk value, and it falls further with higher gate field.\n7. **Crystal orientation and strain.** Mobility depends on direction in anisotropic bands; strain alters effective masses (strained-Si technology).\n8. **Carrier concentration** at high injection (carrier–carrier scattering).\n\nThese are combined using Matthiessen's rule, 1/μ = 1/μ_L + 1/μ_I + …\n\n### Q36. Explain the mechanisms responsible for carrier scattering in semiconductor materials.\n\nIn a perfectly periodic, motionless lattice an electron would move without scattering (Bloch's theorem). Scattering happens whenever something breaks that perfect periodicity. The main mechanisms:\n\n1. **Lattice (phonon) scattering.** Above 0 K the atoms vibrate about their positions, distorting the periodic potential. Carriers exchange energy and momentum with these lattice vibrations (phonons). *Acoustic-phonon* scattering is low-energy and nearly elastic, dominant at room temperature in Si; its rate increases with T, giving μ_L ∝ T^{−3/2}. *Optical-phonon* scattering involves high-energy phonons (63 meV in Si); it matters at high temperatures and high fields and causes velocity saturation. *Polar-optical and piezoelectric* scattering occur in compound semiconductors (GaAs), where the vibrating ionic bonds create electric fields that scatter carriers strongly.\n2. **Ionised-impurity scattering.** Ionised donors (+) and acceptors (−) have Coulomb fields that deflect passing carriers (Rutherford-like scattering). Slower carriers spend more time near the ion and are deflected more, so it is strongest at low temperature and high doping: μ_I ∝ T^{3/2}/N_I.\n3. **Neutral-impurity scattering.** Non-ionised impurity atoms scatter weakly by their distorted potential. Matters only at low temperatures when dopants are frozen out.\n4. **Carrier–carrier scattering.** Coulomb interactions between carriers. Important at very high carrier densities (heavily doped or highly injected regions, e.g. in power devices and solar cells).\n5. **Defect scattering.** Dislocations (charged lines in n-type material), grain boundaries, stacking faults, vacancies and clusters disturb the lattice and scatter carriers.\n6. **Surface and interface scattering.** At surfaces and at the Si/SiO₂ interface, surface roughness, interface traps and oxide charges scatter carriers confined near the interface (MOSFET channels).\n7. **Alloy scattering.** In alloys such as Al_{x}Ga_{1−x}As or SiGe, the random distribution of different atoms makes the potential non-periodic.\n8. **Intervalley scattering.** Carriers move between equivalent or non-equivalent conduction-band minima by absorbing or emitting phonons (basis of the Gunn effect).\n\nThe total rate is the sum of the individual rates, 1/τ = Σ 1/τ_i, giving Matthiessen's rule 1/μ = Σ 1/μ_i. Near room temperature in lightly doped Si, lattice scattering dominates; in heavily doped Si or at low temperature, ionised-impurity scattering dominates.\n\n### Q37. Derive the expression for drift current density due to electrons and holes.\n\n**Assumptions:** uniform semiconductor, steady state, uniform field E in the +x direction, low enough field that v_d ∝ E.\n\n**Step 1: drift velocity.** An electron experiences force F = −qE. Between collisions (mean free time τ_m), it accelerates by a = −qE/m_n∗. Averaging over all electrons, momentum gained from the field equals momentum lost in collisions:\n\n    m_n∗ v_dn / τ_m = −qE   ⇒   v_dn = −(qτ_m/m_n∗) E = −μ_n E\n\nSimilarly, holes (charge +q) drift with the field:\n\n    v_dp = +(qτ_mp/m_p∗) E = +μ_p E\n\n**Step 2: current density from charge flow.** Current density is charge density × velocity. Consider a bar of cross-section A. In time dt, all carriers within distance v_d·dt of a cross-section pass through it; that is (v_d dt A) × concentration carriers.\n\nFor electrons, charge density −qn and velocity v_dn:\n\n    J_n = (−qn)(v_dn) = (−qn)(−μ_n E) = qnμ_n E\n\nFor holes, charge density +qp and velocity v_dp:\n\n    J_p = (+qp)(+μ_p E) = qpμ_p E\n\nElectrons move against the field but carry negative charge, so their current is in the same direction as the hole current: both are along E.\n\n**Step 3: total drift current density.**\n\n    J_drift = J_n + J_p = q( nμ_n + pμ_p ) E\n\nComparing with Ohm's law J = σE:\n\n    σ = q( nμ_n + pμ_p ),     ρ = 1/σ = 1 / [ q(nμ_n + pμ_p) ]\n\nFor an n-type sample (n ≫ p), σ ≈ qnμ_n ≈ qN_Dμ_n; for p-type, σ ≈ qN_Aμ_p. For an intrinsic sample, σ_i = qn_i(μ_n + μ_p).\n\n### Q38. A semiconductor has an electron concentration of 2 × 10¹⁶ cm⁻³, electron mobility of 1350 cm²/V·s, and an electric field of 10 V/cm. Calculate the electron drift current density.\n\n**Given:** n = 2×10¹⁶ cm⁻³, μ_n = 1350 cm²/V·s, E = 10 V/cm, q = 1.602×10⁻¹⁹ C.\n\n    J_n = q n μ_n E\n        = (1.602×10⁻¹⁹ C)(2×10¹⁶ cm⁻³)(1350 cm²/V·s)(10 V/cm)\n        = (1.602×10⁻¹⁹)(2.7×10²⁰)   A/cm²\n        = 43.3 A/cm²\n\n**J_n ≈ 43.3 A/cm²** (= 4.33×10⁵ A/m²).\n\n**Units check:** C · cm⁻³ · cm²/(V·s) · V/cm = C/(s·cm²) = A/cm². ✓\n\nSupporting quantities:\n\n- Drift velocity v_d = μ_nE = 1350 × 10 = 1.35×10⁴ cm/s (well below v_sat = 10⁷ cm/s, so the linear model is valid).\n- Conductivity σ = qnμ_n = 4.33 S/cm, resistivity ρ = 0.231 Ω·cm, and J = σE = 4.33 × 10 = 43.3 A/cm². ✓\n\n### Q41. Explain velocity saturation and hot-carrier effects in semiconductors.\n\n**Velocity saturation.** At low fields, drift velocity is proportional to the field, v_d = μE, because carriers lose the energy they gain from the field to the lattice (acoustic phonons) and stay near thermal equilibrium. As the field increases (above about 10³–10⁴ V/cm in Si), carriers gain energy faster than acoustic-phonon scattering can remove it. Once their energy reaches the optical-phonon energy (≈ 0.063 eV in Si), they emit optical phonons very rapidly, which transfers energy to the lattice efficiently and limits further gain. The drift velocity therefore stops increasing and approaches a **saturation velocity**:\n\n    v_sat ≈ 10⁷ cm/s  (Si, 300 K)\n\nand is described empirically by v_d = μE/[1 + (μE/v_sat)^β]^{1/β}. The effective mobility v_d/E falls at high field. In GaAs the electron velocity peaks at about 2×10⁷ cm/s then decreases (negative differential mobility) because electrons transfer to the heavier L-valley.\n\n**Consequences:** in short-channel MOSFETs the drain current becomes proportional to (V_GS − V_T) rather than (V_GS − V_T)², and the maximum transconductance and transit-time-limited speed are set by v_sat: f_T ≈ v_sat/(2πL).\n\n**Hot-carrier effects.** Under high fields, carriers acquire an average kinetic energy far greater than the thermal value (3/2)kT; they are described by an effective electron temperature T_e ≫ T. These \"hot\" carriers cause:\n\n1. **Impact ionisation**: carriers with energy above about 1.5E_g break bonds and create electron–hole pairs, leading to avalanche multiplication and **avalanche breakdown** of junctions.\n2. **Hot-carrier injection into gate oxides**: hot electrons near the drain of a MOSFET surmount the 3.1 eV Si/SiO₂ barrier, become trapped in the oxide or create interface traps. The threshold voltage shifts and transconductance degrades over the device's life (hot-carrier degradation).\n3. **Substrate and gate currents**: impact-generated holes flow to the substrate, which can forward-bias source junctions and trigger parasitic bipolar action or CMOS latch-up.\n4. **Velocity overshoot**: in very short channels carriers transit before scattering brings them to steady state, briefly exceeding v_sat.\n5. **Increased noise and light emission.**\n\n**Mitigation:** lightly doped drain (LDD) structures to reduce the peak field, reduced supply voltage, graded junctions, and nitrided or hardened gate oxides.\n"}, {"num": "11", "title": "Diffusion Current and the Einstein Relation", "body": "\nExamined in Q39–Q40. Carriers also move without any field, simply because there are more of them in one place than another. This is the current that flows in the neutral regions of a diode and the base of a transistor.\n\n## 11.1 Diffusion\n\nRandom thermal motion produces a net flow from high to low concentration. With a gradient dn/dx, more carriers cross a plane from the crowded side than from the sparse side. The particle flux is proportional to the gradient (Fick's first law, Module 06):\n\n    Φ_n = −D_n dn/dx,      Φ_p = −D_p dp/dx\n\nD_n and D_p are the **diffusion coefficients** (cm²/s). In Si at 300 K, D_n ≈ 35 and D_p ≈ 12 cm²/s.\n\n## 11.2 Diffusion current densities\n\nMultiply the flux by the carrier charge:\n\n    J_{n,diff} = (−q)(−D_n dn/dx) = +q D_n dn/dx\n    J_{p,diff} = (+q)(−D_p dp/dx) = −q D_p dp/dx\n\nNote the signs. Electrons and holes both flow down their gradients, but the electron's negative charge makes electron current flow **up** the electron gradient.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"Electrons and holes both diffuse down their concentration gradients, but electron current flows opposite to electron flux\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewB dth=\"2\" marker-end=\"url(#art)\"/><text x=\"445.0\" y=\"200\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E)\">J_p = −qD_p dp/dx  (with the flux)</text></svg><figcaption>Carriers diffuse from high to low concentration. Because the electron charge is negative, the electron diffusion current points the opposite way to the electron flow.</figcaption></figure>\n```\n\n## 11.3 The total current equations\n\nWhen both a field and gradients are present:\n\n    J_n = q n μ_n E + q D_n dn/dx\n    J_p = q p μ_p E − q D_p dp/dx\n    J = J_n + J_p\n\nThese two equations, together with the continuity equations (Module 13) and Poisson's equation, are the full set of **semiconductor device equations**.\n\n## 11.4 The Einstein relation\n\n    D_n / μ_n = D_p / μ_p = kT/q\n\nkT/q = 0.0259 V at 300 K is the **thermal voltage** V_T.\n\n**Derivation.** Take a non-uniformly doped n-type sample, N_D(x), in equilibrium with no external connection.\n\n**Step 1.** Electrons diffuse away from the heavily doped side, uncovering positive donor ions. This builds an internal field E that pulls them back.\n\n**Step 2.** In equilibrium no net current flows, so drift balances diffusion:\n\n    0 = q n μ_n E + q D_n dn/dx\n\n**Step 3.** In equilibrium the Fermi level is flat, while E_c (and E_i) follow the electrostatic potential: E = (1/q) dE_c/dx. Using n = N_c exp(−(E_c − E_F)/kT):\n\n    dn/dx = −(n/kT) dE_c/dx = −(n/kT) qE\n\n**Step 4.** Substitute into step 2:\n\n    0 = qnμ_n E − q D_n (nq/kT) E   ⇒   D_n/μ_n = kT/q\n\nThe same argument for holes gives D_p/μ_p = kT/q. The relation holds for any non-degenerate semiconductor in or near equilibrium.\n\n**Meaning.** Diffusion and drift are both limited by the same scattering processes. A carrier that scatters rarely both drifts easily (high μ) and spreads quickly (high D). Once one is known, the other follows.\n\n| | μ (cm²/V·s) | D = μkT/q (cm²/s) |\n|---|---|---|\n| Si electrons | 1350 | 35.0 |\n| Si holes | 480 | 12.4 |\n| GaAs electrons | 8500 | 220 |\n| Ge electrons | 3900 | 101 |\n\n---\n\n## Exam questions solved\n\n### Q39. Explain diffusion current in a semiconductor and state Fick's law.\n\n**Diffusion current** is the current produced by the net movement of carriers from a region of higher concentration to one of lower concentration, caused by their random thermal motion. No electric field is needed. If the concentration varies with position, more carriers cross any plane from the high-concentration side than from the low side simply because there are more of them, so a net flux results. Because the carriers are charged, this flux is a current.\n\nDiffusion current is important wherever carrier gradients exist: in the neutral regions of a forward-biased p-n junction (injected minority carriers diffusing away from the junction), in the base of a bipolar transistor, under non-uniform illumination, and in non-uniformly doped material.\n\n**Fick's (first) law.** The particle flux is proportional to the negative of the concentration gradient:\n\n    F = −D dC/dx\n\nwhere D is the diffusion coefficient (cm²/s). Applied to electrons and holes:\n\n    Electron flux:  F_n = −D_n dn/dx       Hole flux:  F_p = −D_p dp/dx\n\n**Diffusion current densities** (multiply by the charge, −q for electrons, +q for holes):\n\n    J_{n,diff} = +q D_n dn/dx\n    J_{p,diff} = −q D_p dp/dx\n\nIn three dimensions, J_n = qD_n∇n and J_p = −qD_p∇p.\n\n**Example.** If the electron concentration falls linearly from 10¹⁷ cm⁻³ to 0 over 1 μm in Si (D_n = 35 cm²/s):\n\n    dn/dx = −10¹⁷/10⁻⁴ = −10²¹ cm⁻⁴\n    J_n = q D_n dn/dx = (1.602×10⁻¹⁹)(35)(−10²¹) = −5.6×10³ A/cm²\n\nThe negative sign means the current flows in the −x direction, while the electrons themselves flow in +x (down their gradient).\n\nTotal current when a field is present: J_n = qnμ_nE + qD_n dn/dx and J_p = qpμ_pE − qD_p dp/dx.\n\n### Q40. State and explain the Einstein relation between carrier mobility and diffusion coefficient.\n\n**Statement.**\n\n    D_n/μ_n = kT/q,      D_p/μ_p = kT/q\n\nThe ratio of diffusion coefficient to mobility equals the thermal voltage kT/q (0.0259 V at 300 K), for both electrons and holes, in a non-degenerate semiconductor.\n\n**Explanation.** Drift and diffusion are two responses of the same carriers, both limited by the same random scattering events. Mobility describes the response to an electric field (μ = qτ_m/m∗); diffusion describes the response to a concentration gradient (D = v_th²τ_m/3 ≈ kTτ_m/m∗). Dividing gives D/μ = kT/q: the scattering time and mass cancel, leaving only temperature.\n\n**Derivation (equilibrium argument).** In a non-uniformly doped sample in thermal equilibrium, an internal field E develops such that the drift and diffusion currents cancel exactly:\n\n    J_n = qnμ_nE + qD_n dn/dx = 0\n\nIn equilibrium E_F is constant and n = n_i exp((E_F − E_i)/kT). Since E_i varies with the electrostatic potential, dE_i/dx = qE, so\n\n    dn/dx = −(n/kT) dE_i/dx = −(qn/kT) E\n\nSubstituting:\n\n    qnμ_nE − qD_n(qn/kT)E = 0   ⇒   D_n = (kT/q)μ_n\n\n**Uses.**\n\n1. One measurement gives the other: mobility is easy to measure (Hall effect, conductivity), so D follows. Si electrons: D_n = 0.0259 × 1350 = **35 cm²/s**; holes: D_p = 0.0259 × 480 = **12.4 cm²/s**.\n2. It links the drift and diffusion terms in the current equations and is needed to calculate diffusion lengths L = √(Dτ) and diode saturation currents.\n3. It shows why the built-in voltage of a junction is set by kT/q times a logarithm of a concentration ratio.\n\nFor degenerate semiconductors the relation is modified (D/μ > kT/q), because carriers then obey Fermi–Dirac rather than Boltzmann statistics.\n"}, {"num": "12", "title": "Generation, Recombination and Carrier Lifetime", "body": "\nExamined in Q42–Q44. Devices work by disturbing equilibrium: light, forward bias or a field injects extra carriers. How fast those extra carriers disappear sets the switching speed of a diode, the gain of a transistor and the efficiency of a solar cell.\n\n## 12.1 Equilibrium and excess carriers\n\nIn thermal equilibrium, carriers are generated and recombine continuously at equal rates, G_th = R_th, so n₀p₀ = n_i².\n\n**Excess carriers** are those above equilibrium:\n\n    n = n₀ + Δn,      p = p₀ + Δp\n\nCreated optically or by injection, electrons and holes are usually made in pairs, so Δn = Δp. Then np > n_i², and net recombination returns the system towards equilibrium.\n\n**Low-level injection:** Δp ≪ n₀ in n-type material. The majority concentration hardly changes, n ≈ n₀, while the **minority** concentration may change by many orders of magnitude. Minority carriers therefore control the behaviour.\n\n**Example.** n-Si with N_D = 10¹⁶ cm⁻³ (p₀ = 10⁴ cm⁻³) illuminated to give Δn = Δp = 10¹⁴ cm⁻³: n = 1.01×10¹⁶ (1 % change), p = 10¹⁴ (a factor of 10¹⁰ change).\n\n## 12.2 Generation mechanisms\n\n1. **Thermal generation:** lattice vibrations supply E_g to break a bond. Mostly through defect levels in the gap (two small steps are easier than one big one).\n2. **Optical generation:** a photon with hν ≥ E_g is absorbed and creates an electron–hole pair. Basis of photodiodes and solar cells. Generation rate G (cm⁻³s⁻¹) falls with depth as e^{−αx}.\n3. **Impact ionisation:** a high-field carrier knocks an electron out of a bond (avalanche).\n4. **Band-to-band tunnelling** at very high fields (Zener effect).\n\n## 12.3 Recombination mechanisms\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 640 232\" role=\"img\" aria-label=\"Three recombination paths: direct band-to-band with photon emission, two-step recombination through a mid-gap trap, and Auger recombination giving energy to a third carrier\" style=\"width:640px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse d=\"url(#ars)\"/><text x=\"144.0\" y=\"100.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">hν ≈ E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"125.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">band-to-band (radiative)</text><text x=\"125.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">GaAs, LEDs, lasers</text><line x1=\"280.0\" y1=\"110.0\" x2=\"340.0\" y2=\"110.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2.4\" opacity=\"1.0\"/><text x=\"344.0\" y=\"114.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">t</tspan><tspan dy=\"-0.32em\">​</tspan></text><circle cx=\"296.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"324.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"296.0\" y1=\"48.0\" x2=\"296.0\" y2=\"106.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><line x1=\"324.0\" y1=\"114.0\" x2=\"324.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><text x=\"290.0\" y=\"84.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">1</text><text x=\"330.0\" y=\"146.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">2</text><text x=\"310.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">Shockley–Read–Hall (trap)</text><text x=\"310.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">Si; energy to phonons</text><circle cx=\"484.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"484.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"516.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><line x1=\"484.0\" y1=\"48.0\" x2=\"484.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><path d=\"M516,38 q4,-10 0,-18\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\" opacity=\"1.0\" stroke-linejoin=\"round\" marker-end=\"url(#ar)\"/><text x=\"522.0\" y=\"26.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">third carrier kicked up</text><text x=\"500.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">Auger</text><text x=\"500.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">high carrier density</text></svg><figcaption>The three recombination paths. Band-to-band emits a photon. Shockley–Read–Hall goes through a trap level in the gap. Auger gives the energy to a third carrier.</figcaption></figure>\n```\n\n1. **Direct (band-to-band, radiative):** an electron falls directly from the conduction band into a hole, emitting a photon of energy ≈ E_g. Rate R = B·np. Dominant in direct-gap GaAs (LEDs, lasers); very weak in indirect Si.\n2. **Indirect (trap-assisted, Shockley–Read–Hall):** recombination through a localised **trap** (recombination centre) in the gap, created by defects or impurities such as Au, Fe, Cu or Pt. Energy goes to phonons (heat). Dominant in Si and Ge.\n3. **Auger:** the energy released by recombination is given to a third carrier, which is kicked high into its band and then thermalises. Rate ∝ n²p or np². Dominant at very high carrier densities (heavily doped emitters, concentrator solar cells, lasers).\n4. **Surface recombination:** SRH recombination through the high density of states at surfaces and interfaces (Module 13).\n\n## 12.4 Shockley–Read–Hall (SRH) recombination\n\nA single trap level at E_t, density N_t, with capture cross-sections σ_n and σ_p. Four processes take place:\n\n1. **Electron capture:** a conduction electron falls into an empty trap. Rate ∝ σ_n v_th n N_t(1 − f_t).\n2. **Electron emission:** a trapped electron is emitted to the conduction band. Rate ∝ e_n N_t f_t.\n3. **Hole capture:** a trapped electron drops to the valence band, filling a hole. Rate ∝ σ_p v_th p N_t f_t.\n4. **Hole emission:** an electron from the valence band jumps into an empty trap, creating a hole. Rate ∝ e_p N_t(1 − f_t).\n\nRecombination is (1) followed by (3); generation is (4) followed by (2). Requiring the trap occupancy f_t to be in steady state (electrons in = electrons out) gives the SRH net rate:\n\n    U = (np − n_i²) / [ τ_p(n + n₁) + τ_n(p + p₁) ]\n\n    τ_n = 1/(σ_n v_th N_t),   τ_p = 1/(σ_p v_th N_t)\n    n₁ = n_i exp((E_t − E_i)/kT),   p₁ = n_i exp((E_i − E_t)/kT)\n\n**Key results:**\n\n- U > 0 (net recombination) when np > n_i² (injection). U < 0 (net generation) when np < n_i² (depletion region under reverse bias, the source of junction leakage current).\n- U is largest when E_t ≈ E_i (n₁ = p₁ = n_i): **mid-gap traps are the most effective recombination centres.** Gold (E_t ≈ E_i) is therefore a powerful lifetime killer.\n- **Low-level injection in n-type** (n ≈ n₀ ≫ p, n₁, p₁): U ≈ Δp/τ_p. The recombination rate is set by the minority-carrier lifetime τ_p = 1/(σ_p v_th N_t), which is inversely proportional to the trap density.\n\n**Example.** N_t = 10¹³ cm⁻³, σ_p = 10⁻¹⁵ cm², v_th = 10⁷ cm/s: τ_p = 1/(10⁻¹⁵ × 10⁷ × 10¹³) = 10⁻⁵ s = **10 μs**.\n\n## 12.5 Minority-carrier lifetime\n\nIf the generation source is switched off at t = 0, excess minority carriers decay exponentially (low-level injection, uniform sample):\n\n    dΔp/dt = −Δp/τ_p   ⇒   Δp(t) = Δp(0) e^{−t/τ_p}\n\nτ_p is the **minority-carrier lifetime**: the average time an excess minority carrier survives before recombining. Under steady generation G, Δp = Gτ_p.\n\nTypical values: high-quality Si 1 μs to 1 ms; gold-doped Si for switching diodes about 1–10 ns; GaAs about 1–10 ns (fast radiative recombination).\n\nCombined mechanisms add as rates: 1/τ = 1/τ_SRH + 1/τ_rad + 1/τ_Auger.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 195\" role=\"img\" aria-label=\"Excess carrier density held constant under illumination, then decaying exponentially after the light is switched off, reaching one over e after one lifetime\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><rect x=\"60.0\" y=\"28.0\" width=\"92.3\" height=\"140.0\" style=\"fill:var(--copper-soft,#F3E7DE)\"/><line x1=\"60.0\" y1=\"168.0\" x2=\"454.0\" y2=\"168.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"152.3\" y1=\"168.0\" x2=\"152.3\" y2=\"34.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"464.0\" y=\"172.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">t / τ<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"157.3\" y=\"30.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:c .0 204.2,115.6 206.2,117.3 208.1,118.8 210.0,120.3 211.9,121.8 213.8,123.2 215.8,124.6 217.7,125.9 219.6,127.2 221.5,128.5 223.5,129.7 225.4,130.9 227.3,132.0 229.2,133.1 231.2,134.2 233.1,135.2 235.0,136.2 236.9,137.2 238.8,138.2 240.8,139.1 242.7,140.0 244.6,140.8 246.5,141.7 248.5,142.5 250.4,143.3 252.3,144.0 254.2,144.8 256.2,145.5 258.1,146.2 260.0,146.8 261.9,147.5 263.8,148.1 265.8,148.7 267.7,149.3 269.6,149.9 271.5,150.5 273.5,151.0 275.4,151.5 277.3,152.0 279.2,152.5 281.2,153.0 283.1,153.5 285.0,153.9 286.9,154.3 288.8,154.8 290.8,155.2 292.7,155.6 294.6,155.9 296.5,156.3 298.5,156.7 300.4,157.0 302.3,157.4 304.2,157.7 306.2,158.0 308.1,158.3 310.0,158.6 311.9,158.9 313.8,159.2 315.8,159.5 317.7,159.7 319.6,160.0 321.5,160.2 323.5,160.5 325.4,160.7 327.3,160.9 329.2,161.1 331.2,161.3 333.1,161.5 335.0,161.7 336.9,161.9 338.8,162.1 340.8,162.3 342.7,162.5 344.6,162.7 346.5,162.8 348.5,163.0 350.4,163.1 352.3,163.3 354.2,163.4 356.2,163.6 358.1,163.7 360.0,163.8 361.9,164.0 363.8,164.1 365.8,164.2 367.7,164.3 369.6,164.4 371.5,164.5 373.5,164.7 375.4,164.8 377.3,164.9 379.2,165.0 381.2,165.0 383.1,165.1 385.0,165.2 386.9,165.3 388.8,165.4 390.8,165.5 392.7,165.6 394.6,165.6 396.5,165.7 398.5,165.8 400.4,165.8 402.3,165.9 404.2,166.0 406.2,166.0 408.1,166.1 410.0,166.2 411.9,166.2 413.8,166.3 415.8,166.3 417.7,166.4 419.6,166.4 421.5,166.5 423.5,166.5 425.4,166.6 427.3,166.6 429.2,166.6 431.2,166.7 433.1,166.7 435.0,166.8 436.9,166.8 438.8,166.8 440.8,166.9 442.7,166.9 444.6,166.9 446.5,167.0 448.5,167.0 450.4,167.0 452.3,167.1 454.2,167.1 456.2,167.1 458.1,167.2 460.0,167.2\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"213.8\" y1=\"168.0\" x2=\"213.8\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><line x1=\"152.3\" y1=\"123.2\" x2=\"213.8\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><text x=\"106.2\" y=\"63.3\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">light on</text><text x=\"106.2\" y=\"79.1\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Δp = Gτ<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"220.0\" y=\"119.2\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">1/e at t = τ<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text></svg><figcaption>Photoconductive decay. After the light pulse ends, the excess carrier density falls to 1/e of its value in one lifetime.</figcaption></figure>\n```\n\n---\n\n## Exam questions solved\n\n### Q42. What is meant by generation and recombination of charge carriers?\n\n**Generation** is any process that creates free electron–hole pairs (or a free carrier from a dopant or trap) by giving an electron enough energy to move from the valence band (or a localised state) into the conduction band. The rate G is the number of pairs created per unit volume per unit time (cm⁻³s⁻¹). Mechanisms:\n\n- **Thermal generation** by lattice vibrations, directly or through trap levels in the gap.\n- **Optical generation** by absorption of photons with hν ≥ E_g (photodetectors, solar cells).\n- **Impact ionisation** by energetic carriers in high fields (avalanche).\n- **Tunnelling** generation at very high fields (Zener).\n\n**Recombination** is the reverse: a conduction-band electron falls back to the valence band and fills a hole, so both carriers are annihilated. The released energy E_g appears as a photon, as heat (phonons), or as kinetic energy of a third carrier. The rate R has the same units. Mechanisms:\n\n- **Direct (band-to-band, radiative)** recombination, emitting a photon; dominant in direct-gap materials.\n- **Indirect (trap-assisted, SRH)** recombination through defect or impurity levels in the gap, releasing heat; dominant in Si.\n- **Auger** recombination, energy given to a third carrier; dominant at high carrier density.\n- **Surface** recombination through surface states.\n\n**Equilibrium and non-equilibrium.** In thermal equilibrium the two processes balance (G_th = R_th), giving n₀p₀ = n_i². If excess carriers are introduced (np > n_i²), net recombination U = R − G > 0 restores equilibrium; if carriers are removed (np < n_i², e.g. a reverse-biased depletion region), net generation occurs. For low-level injection the net recombination rate is U = Δp/τ_p (n-type), where τ_p is the minority-carrier lifetime.\n\nGeneration and recombination govern the leakage current of diodes, the operation of solar cells, LEDs and photodetectors, the gain of BJTs and the switching speed of p-n junctions.\n\n### Q43. Explain the Shockley-Read-Hall (SRH) recombination mechanism.\n\n**Principle.** SRH (trap-assisted or indirect) recombination occurs through localised energy levels E_t in the forbidden gap introduced by crystal defects or impurities (e.g. Au, Fe, Cu, vacancies, dislocations). Instead of crossing the whole gap in one step, which in an indirect semiconductor requires an unlikely phonon-assisted transition, the electron makes two smaller steps via the trap, and the energy is released as lattice vibrations (phonons).\n\n**The four processes** at a trap (density N_t, occupation probability f_t):\n\n| Process | Description | Rate |\n|---|---|---|\n| (a) Electron capture | CB electron captured by an empty trap | r_a = v_thσ_n n N_t(1 − f_t) |\n| (b) Electron emission | Trapped electron emitted to CB | r_b = e_n N_t f_t |\n| (c) Hole capture | Trapped electron drops to VB, annihilating a hole | r_c = v_thσ_p p N_t f_t |\n| (d) Hole emission | VB electron captured by empty trap, leaving a hole | r_d = e_p N_t(1 − f_t) |\n\n**Recombination** = (a) then (c). **Generation** = (d) then (b).\n\n**Derivation outline.** In steady state the trap occupation is constant, so the net electron capture rate equals the net hole capture rate: r_a − r_b = r_c − r_d = U. The emission coefficients follow from detailed balance in equilibrium: e_n = v_thσ_n n₁ and e_p = v_thσ_p p₁. Solving for f_t and substituting gives:\n\n    U = (np − n_i²) / [ τ_p(n + n₁) + τ_n(p + p₁) ]\n\nwith τ_n = 1/(σ_n v_th N_t), τ_p = 1/(σ_p v_th N_t), n₁ = n_i e^{(E_t − E_i)/kT}, p₁ = n_i e^{(E_i − E_t)/kT}.\n\n**Interpretation.**\n\n1. The driving force is (np − n_i²): positive for excess carriers (recombination), negative for depletion (generation), zero in equilibrium.\n2. U is maximum when E_t is near mid-gap (E_t ≈ E_i). Shallow levels near a band edge just re-emit carriers and are ineffective. **Deep, mid-gap levels are the effective recombination centres.**\n3. U ∝ N_t: more traps give faster recombination and shorter lifetime.\n4. For low-level injection in n-type material (n ≫ p, n₁, p₁): U = (p − p₀)/τ_p = Δp/τ_p. The rate is limited by capture of the minority carrier.\n5. In a reverse-biased depletion region (n, p ≈ 0): U = −n_i/(τ_p + τ_n) ≈ −n_i/2τ₀, a net generation that produces the generation leakage current J_gen = qn_iW/2τ₀.\n\n**Applications:** gold or platinum doping, or electron irradiation, is deliberately used to reduce lifetime in fast-switching diodes and thyristors. Conversely, gettering and clean processing reduce trap densities for long lifetimes in solar cells, CCDs and low-leakage devices.\n\n### Q44. Define minority-carrier lifetime and explain its significance in semiconductor devices.\n\n**Definition.** The minority-carrier lifetime is the average time an excess minority carrier exists in a semiconductor before it recombines with a majority carrier. For low-level injection, τ_p (holes in n-type) or τ_n (electrons in p-type) is defined by\n\n    U = Δp / τ_p\n\nso that, when generation stops, the excess density decays exponentially:\n\n    Δp(t) = Δp(0) e^{−t/τ_p}\n\nτ_p is the time for the excess to fall to 1/e (37 %) of its initial value. With SRH recombination, τ_p = 1/(σ_p v_th N_t): lifetime is inversely proportional to the trap density. Typical values: 1 ns to 1 ms in Si depending on purity.\n\n**Significance:**\n\n1. **Diffusion length.** Injected minority carriers diffuse an average distance L = √(Dτ) before recombining. In Si with D_p = 12 cm²/s and τ_p = 1 μs, L_p = √(12 × 10⁻⁶) = 35 μm. L determines how far carriers travel and therefore device dimensions.\n2. **Diode current.** The saturation current J_s = qn_i²(D_p/(L_pN_D) + D_n/(L_nN_A)) depends on lifetime through L. Short lifetime raises leakage; generation current in the depletion region is ∝ 1/τ.\n3. **Switching speed.** When a forward-biased diode is turned off, the stored minority charge Q = Iτ must be removed; the reverse-recovery time is ≈ τ. Fast-recovery and switching diodes are gold- or platinum-doped to cut τ to nanoseconds.\n4. **BJT current gain.** Electrons injected into a p-type base must cross it before recombining. The base transport factor ≈ 1 − W_B²/2L_n², so long lifetime (L_n ≫ W_B) gives high β.\n5. **Solar cells and photodetectors.** Photogenerated carriers must reach the junction before recombining; long lifetime (long L) means higher collection efficiency, current and efficiency.\n6. **LEDs and lasers.** The radiative fraction of recombination, and the modulation speed (bandwidth ∝ 1/τ), depend on lifetime.\n7. **Power devices.** In p-i-n diodes and IGBTs, long lifetime gives conductivity modulation and low on-state voltage but slow switching; there is a design trade-off.\n8. **Material quality indicator.** Lifetime is very sensitive to metallic contamination, so it is measured (photoconductive decay, μ-PCD) to monitor crystal growth and process cleanliness.\n"}, {"num": "13", "title": "The Continuity Equation and Surface Recombination", "body": "\nExamined in Q45–Q46. The continuity equation is the bookkeeping rule that ties together drift, diffusion, generation and recombination. Surfaces are where that bookkeeping gets an extra loss term.\n\n## 13.1 Deriving the continuity equation\n\nTake a thin slab of area A between x and x + dx. The number of holes in it changes because of:\n\n- holes flowing in at x and out at x + dx (current);\n- generation inside it, G_p;\n- recombination inside it, R_p.\n\n    ∂p/∂t · A dx = [ J_p(x) − J_p(x + dx) ] A/q + (G_p − R_p) A dx\n\nDivide by A dx and let dx → 0:\n\n    ∂p/∂t = −(1/q) ∂J_p/∂x + G_p − R_p\n    ∂n/∂t = +(1/q) ∂J_n/∂x + G_n − R_n\n\n## 13.2 The minority-carrier diffusion equation\n\nFor holes in n-type material, insert J_p = qpμ_pE − qD_p ∂p/∂x and R_p = Δp/τ_p. With low-level injection, uniform doping and a small or zero field:\n\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − μ_p E ∂Δp/∂x + G_L − Δp/τ_p\n\nThe terms are, in order: diffusion, drift, external generation, recombination.\n\n### Standard solutions\n\n| Situation | Equation | Solution |\n|---|---|---|\n| Uniform, no gradient, light off at t = 0 | dΔp/dt = −Δp/τ_p | Δp(t) = Δp(0)e^{−t/τ_p} |\n| Uniform steady illumination | 0 = G_L − Δp/τ_p | Δp = G_Lτ_p |\n| Steady injection at x = 0 into a long sample | 0 = D_p d²Δp/dx² − Δp/τ_p | Δp(x) = Δp(0)e^{−x/L_p} |\n| Steady injection into a short sample of length W ≪ L_p | d²Δp/dx² ≈ 0 | Linear: Δp(x) = Δp(0)(1 − x/W) |\n\nThe **diffusion length**:\n\n    L_p = √(D_p τ_p),     L_n = √(D_n τ_n)\n\nis the average distance a minority carrier diffuses before recombining.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 195\" role=\"img\" aria-label=\"Steady-state excess minority-carrier density decaying exponentially from the injection point with characteristic length L_p\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"60.0\" y1=\"168.0\" x2=\"454.0\" y2=\"168.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"60.0\" y1=\"168.0\" x2=\"60.0\" y2=\"34.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"464.0\" y=\"172.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">x / L<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"65.0\" y=\"30.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">Δp(x)/Δp(0)</text><line x1=\"140.0\" y1=\"164.0\" x2=\"140.0\" y2=\"172.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"140.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><line x1=\"220.0\" y1=\"164.0\" x2=\"220.0\" y2=\"172.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"220.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">2</text><line x1=\"300.0\" y1=\"164.0\" x2=\"300.0\" y2=\"172.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"300.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">3</text><line x1=\"380.0\" y1=\"164.0\" x2=\"380.0\" y2=\"172.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"380.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">4</text><line x1=\"56.0\" y1=\"123.0\" x2=\"64.0\" y2=\"123.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"54.0\" y=\"127.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">0.37</text><line x1=\"56.0\" y1=\"46.3\" x2=\"64.0\" y2=\"46.3\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"54.0\" y=\"50.3\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><polyline points=\"60.0,46.3 62.5,50.0 65.0,53.6 67.5,57.2 70.0,60.6 72.5,63.9 75.0,67.1 77.5,70.2 80.0,73.2 82.5,76.1 85.0,78.9 87.5,81.7 90.0,84.3 92.5,86.9 95.0,89.4 97.5,91.8 100.0,94.2 102.5,96.4 105.0,98.6 107.5,100.8 110.0,102.8 112.5,104.8 115.0,106.8 117.5,108.7 120.0,110.5 122.5,112.3 125.0,114.0 127.5,115.6 130.0,117.3 132.5,118.8 135.0,120.3 137.5,121.8 140.0,123.2 142.5,124.6 145.0,125.9 147.5,127.2 150.0,128.5 152.5,129.7 155.0,130.9 157.5,132.0 160.0,133.1 162.5,134.2 165.0,135.2 167.5,136.2 170.0,137.2 172.5,138.2 175.0,139.1 177.5,140.0 180.0,140.8 182.5,141.7 185.0,142.5 187.5,143.3 190.0,144.0 192.5,144.8 195.0,145.5 197.5,146.2 200.0,146.8 202.5,147.5 205.0,148.1 207.5,148.7 210.0,149.3 212.5,149.9 215.0,150.5 217.5,151.0 220.0,151.5 222.5,152.0 225.0,152.5 227.5,153.0 230.0,153.5 232.5,153.9 235.0,154.3 237.5,154.8 240.0,155.2 242.5,155.6 245.0,155.9 247.5,156.3 250.0,156.7 252.5,157.0 255.0,157.4 257.5,157.7 260.0,158.0 262.5,158.3 265.0,158.6 267.5,158.9 270.0,159.2 272.5,159.5 275.0,159.7 277.5,160.0 280.0,160.2 282.5,160.5 285.0,160.7 287.5,160.9 290.0,161.1 292.5,161.3 295.0,161.5 297.5,161.7 300.0,161.9 302.5,162.1 305.0,162.3 307.5,162.5 310.0,162.7 312.5,162.8 315.0,163.0 317.5,163.1 320.0,163.3 322.5,163.4 325.0,163.6 327.5,163.7 330.0,163.8 332.5,164.0 335.0,164.1 337.5,164.2 340.0,164.3 342.5,164.4 345.0,164.5 347.5,164.7 350.0,164.8 352.5,164.9 355.0,165.0 357.5,165.0 360.0,165.1 362.5,165.2 365.0,165.3 367.5,165.4 370.0,165.5 372.5,165.6 375.0,165.6 377.5,165.7 380.0,165.8 382.5,165.8 385.0,165.9 387.5,166.0 390.0,166.0 392.5,166.1 395.0,166.2 397.5,166.2 400.0,166.3 402.5,166.3 405.0,166.4 407.5,166.4 410.0,166.5 412.5,166.5 415.0,166.6 417.5,166.6 420.0,166.6 422.5,166.7 425.0,166.7 427.5,166.8 430.0,166.8 432.5,166.8 435.0,166.9 437.5,166.9 440.0,166.9 442.5,167.0 445.0,167.0 447.5,167.0 450.0,167.1 452.5,167.1 455.0,167.1 457.5,167.2 460.0,167.2\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"140.0\" y1=\"168.0\" x2=\"140.0\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><line x1=\"60.0\" y1=\"123.2\" x2=\"140.0\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><text x=\"148.0\" y=\"119.2\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Δp falls to 1/e at x = L<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan> = √(D<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan>τ<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan>)</text></svg><figcaption>Steady-state minority-carrier profile when carriers are injected at x = 0 into a long n-type bar. The excess falls to 1/e in one diffusion length.</figcaption></figure>\n```\n\n**Example.** n-Si with D_p = 12 cm²/s, τ_p = 1 μs: L_p = √(12 × 10⁻⁶) = 3.46×10⁻³ cm = 34.6 μm. The hole diffusion current at x = 0 is J_p = qD_pΔp(0)/L_p.\n\n## 13.3 Surfaces and surface states\n\nAt a surface the periodic lattice ends abruptly. Atoms there have unsatisfied bonds (**dangling bonds**), and adsorbed impurities and oxide defects add more. These create a high density of **surface states** (traps) distributed through the gap, typically 10¹⁰–10¹⁵ cm⁻². They:\n\n- act as **SRH recombination centres**, so carriers recombine much faster at the surface than in the bulk;\n- **trap charge**, bending the bands near the surface (depletion, accumulation or inversion) even with no applied bias;\n- cause instability and noise, and in MOS devices shift the threshold voltage (interface trap density D_it).\n\n### Surface recombination velocity\n\nBecause the recombination happens in an infinitesimally thin layer, it is described as a flux (per area), not a rate per volume:\n\n    U_s = S · Δp(0)      [carriers cm⁻² s⁻¹]\n\nS, the **surface recombination velocity** (cm/s), plays the role of a velocity with which excess carriers \"flow into\" the surface and disappear. With SRH statistics for surface traps of density N_st (cm⁻²):\n\n    S = σ_p v_th N_st\n\nThe surface acts as a sink. Carriers diffuse towards it, so the boundary condition at the surface is\n\n    D_p dΔp/dx |_{x=0} = S Δp(0)\n\nLimits: S = 0 means a perfect, reflecting surface (no recombination); S → ∞ forces Δp(0) = 0, as at an Ohmic contact.\n\nTypical values: bare or freshly etched Si 10⁴–10⁶ cm/s; thermally oxidised Si 10–100 cm/s; best passivated Si (Al₂O₃, SiNₓ, annealed SiO₂) below 10 cm/s.\n\n### Effective lifetime\n\nIn a wafer of thickness W with both surfaces recombining:\n\n    1/τ_eff = 1/τ_bulk + 2S/W          (for small S)\n\n**Example.** τ_bulk = 100 μs, W = 300 μm = 0.03 cm, S = 100 cm/s: 2S/W = 6.7×10³ s⁻¹, 1/τ_bulk = 1×10⁴ s⁻¹, so τ_eff = 1/(1.67×10⁴) = 60 μs. Unpassivated (S = 10⁵ cm/s) it would fall to about 0.15 μs.\n\n---\n\n## Exam questions solved\n\n### Q45. Explain the continuity equation for minority carriers and discuss its application to semiconductor devices.\n\n**Statement.** The continuity equation expresses conservation of carriers: in any small volume, the rate of increase of carrier concentration equals the net inflow due to current, plus generation, minus recombination.\n\n    ∂p/∂t = −(1/q) ∂J_p/∂x + G_p − R_p      (holes)\n    ∂n/∂t = +(1/q) ∂J_n/∂x + G_n − R_n      (electrons)\n\n**Derivation.** For a slab of area A and thickness dx, the number of holes increases at the rate (1/q)[J_p(x) − J_p(x + dx)]A from current flow and at (G_p − R_p)A dx from generation and recombination. Dividing by A dx and taking the limit gives the equations above.\n\n**Minority-carrier form.** For holes in an n-type region, substitute the hole current J_p = qμ_ppE − qD_p ∂p/∂x and, for low-level injection, the recombination rate R_p − G_th = Δp/τ_p. With uniform doping:\n\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − μ_pE ∂Δp/∂x − μ_p p ∂E/∂x + G_L − Δp/τ_p\n\nIn a quasi-neutral region E ≈ 0, giving the **ambipolar / minority-carrier diffusion equation**:\n\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − Δp/τ_p + G_L\n\nFor electrons in p-type material: ∂Δn/∂t = D_n ∂²Δn/∂x² − Δn/τ_n + G_L.\n\n**Applications:**\n\n1. **p-n junction diode.** In the neutral regions under steady forward bias, 0 = D_p d²Δp/dx² − Δp/τ_p gives Δp(x) = Δp(x_n)e^{−(x − x_n)/L_p}. The diffusion current at the depletion edge leads directly to the Shockley diode equation (Module 14).\n2. **Bipolar transistor.** In a narrow base (W_B ≪ L_n), solving the equation gives a nearly linear minority-carrier profile; the slope gives collector current, and the small recombination loss gives the base transport factor and current gain.\n3. **Photoconductive decay and lifetime measurement.** For uniform illumination switched off at t = 0, Δp(t) = Δp(0)e^{−t/τ_p}; measuring the decay of conductivity gives τ.\n4. **Haynes–Shockley experiment.** A pulse of minority carriers drifts and spreads; the time-dependent solution, a moving and broadening Gaussian, gives μ_p, D_p and τ_p and was used to verify the Einstein relation.\n5. **Solar cells and photodiodes.** With G_L(x) = G₀e^{−αx}, the solution gives the collection efficiency and photocurrent and shows why the diffusion length must exceed the absorption depth.\n6. **Switching transients.** The time-dependent equation gives stored charge and the reverse-recovery time of diodes.\n7. **Device simulation.** Together with Poisson's equation and the current equations, the continuity equations are solved numerically in every TCAD simulator.\n\n### Q46. What is surface recombination velocity? Explain how semiconductor surface states affect carrier lifetime.\n\n**Surface recombination velocity.** At a semiconductor surface, recombination happens in a very thin layer through surface states. It is described per unit area as\n\n    U_s = S · Δp_s      (cm⁻² s⁻¹)\n\nwhere Δp_s is the excess minority-carrier density at the surface and **S is the surface recombination velocity** (cm/s). It is the effective velocity at which excess carriers move into the surface and are annihilated. For surface traps of density N_st (cm⁻²) with capture cross-section σ_p:\n\n    S = σ_p v_th N_st\n\nS enters the boundary condition for the diffusion equation: D_p dΔp/dx = SΔp at the surface. S = 0 means an ideal surface; S → ∞ means every carrier arriving recombines (Δp_s = 0, like an Ohmic contact). Typical values: unpassivated Si 10⁴–10⁶ cm/s; thermally oxidised Si 10–10³ cm/s; well-passivated Si < 10 cm/s.\n\n**Surface states.** The crystal periodicity ends at the surface, leaving unsaturated (dangling) bonds, as well as adsorbed atoms, oxide defects and contamination. These produce a high density of localised energy levels distributed throughout the band gap, many near mid-gap.\n\n**How they affect lifetime:**\n\n1. **Additional recombination path.** Mid-gap surface states are efficient SRH centres. Carriers that diffuse to the surface recombine there quickly, so the measured (effective) lifetime is lower than the bulk lifetime: 1/τ_eff = 1/τ_bulk + 1/τ_surface, with 1/τ_surface ≈ 2S/W for a wafer of thickness W recombining at both surfaces. In thin wafers and small devices surface recombination can dominate: a 300 μm wafer with τ_bulk = 100 μs falls to τ_eff ≈ 60 μs at S = 100 cm/s and below 1 μs at S = 10⁵ cm/s.\n2. **Carrier depletion near the surface.** The excess carrier density falls towards the surface, creating a gradient that pulls more carriers there, so even carriers generated deep in the material are lost.\n3. **Surface band bending.** Charge in surface states bends the bands, creating depletion or inversion layers. Under depletion, both electrons and holes are present in similar numbers near the surface, which maximises SRH recombination and generation.\n4. **Leakage and noise.** Surface generation adds to reverse leakage current of junctions where they meet the surface; trapping and detrapping produces 1/f noise; charged states cause threshold-voltage drift and instability in MOS devices.\n5. **Device performance.** High S reduces solar-cell efficiency (especially for blue light absorbed near the surface), reduces BJT current gain (surface recombination at the emitter–base perimeter), and degrades photodetector response.\n\n**Reduction (passivation):** thermal oxidation (SiO₂) with forming-gas (H₂) anneal to tie up dangling bonds; silicon nitride and Al₂O₃ films with fixed charge for field-effect passivation; heavily doped surface layers (back-surface field) that repel minority carriers; and clean, damage-free surface preparation.\n"}, {"num": "14", "title": "The p-n Junction and the Shockley Diode", "body": "\nExamined in Q47–Q48. Everything so far (doping, Fermi level, drift, diffusion, recombination) meets in the p-n junction, the building block of diodes, transistors, solar cells and LEDs.\n\n## 14.1 Forming the junction\n\nJoin p-type (acceptors N_A) and n-type (donors N_D) silicon in one crystal. Initially there is a huge concentration difference across the interface:\n\n1. **Holes diffuse** from p to n, and **electrons diffuse** from n to p.\n2. Each hole that leaves the p side uncovers a fixed negative acceptor ion N_A⁻; each electron that leaves the n side uncovers a fixed positive donor ion N_D⁺. Carriers crossing also recombine with the majority carriers on the far side.\n3. A layer of **uncompensated fixed charge** builds up: negative on the p side, positive on the n side. This is the **depletion region** (space-charge region), almost empty of mobile carriers.\n4. This charge creates an electric field pointing from n to p, which **drives drift currents** opposite to the diffusion currents.\n5. Equilibrium is reached when drift exactly cancels diffusion for each carrier type; the Fermi level is then constant across the whole structure.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 354\" role=\"img\" aria-label=\"Abrupt p-n junction in equilibrium: fixed charge in the depletion region, the triangular electric field, and the band diagram with a flat Fermi level and bands bent by q V bi\" style=\"width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"48.4\" x2=\"490.0\" y2=\"48.4\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><rect x=\"227.5\" y=\"48.4\" width=\"52.5\" height=\"42.0\" style=\"fill:var(--teal,#1C6E7E);stroke:var(--teal,#1C6E7E)\" fill-opacity=\".25\"/><rect x=\"280.0\" y=\"34.4\" width=\"157.5\" height=\"14.0\" style=\"fill:var(--copper,#B4622F);stroke:var(--copper,#B4622F)\" fill-opacity=\".25\"/><text x=\"253.8\" y=\"73.4\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">−qN<tspan dy=\"0.32em\" font-size=\"72%\">A</ --teal,#1C6E7E)\" stroke-width=\"1.3\" marker-end=\"url(#art)\"/><line x1=\"143.5\" y1=\"247.6\" x2=\"437.5\" y2=\"247.6\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"0.8\" opacity=\"1.0\" stroke-dasharray=\"2 3\"/><text x=\"160.0\" y=\"230.3\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">qV<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"227.5\" y1=\"22.0\" x2=\"227.5\" y2=\"326.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.45\" stroke-dasharray=\"2 4\"/><text x=\"227.5\" y=\"344.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">−x<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"437.5\" y1=\"22.0\" x2=\"437.5\" y2=\"326.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.45\" stroke-dasharray=\"2 4\"/><text x=\"437.5\" y=\"344.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">x<tspan dy=\"0.32em\" font-size=\"72%\">n</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"280.0\" y=\"344.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">0</text></svg><figcaption>The abrupt p-n junction in equilibrium: space charge, electric field, and the band diagram with a flat Fermi level and bands bent by qV<sub>bi</sub>.</figcaption></figure>\n```\n\n## 14.2 Built-in potential\n\nThe bands bend by qV_bi so that E_F lines up. On the p side E_i − E_F = kT ln(N_A/n_i); on the n side E_F − E_i = kT ln(N_D/n_i). Adding:\n\n    V_bi = (kT/q) ln( N_A N_D / n_i² )\n\nEquivalently, it follows from setting J_n = 0 (Einstein relation) and integrating: n_n0/n_p0 = exp(qV_bi/kT).\n\nThe built-in potential cannot be measured with a voltmeter: contact potentials at the metal leads cancel it exactly.\n\n## 14.3 Depletion approximation\n\nAssume the depletion region (−x_p to x_n) is completely free of carriers, with abrupt edges, and the regions outside are neutral. Poisson's equation:\n\n    d²V/dx² = −ρ/ε_s,     ρ = −qN_A (−x_p < x < 0),   ρ = +qN_D (0 < x < x_n)\n\nResults:\n\n    Charge balance:  N_A x_p = N_D x_n\n    Peak field (at x = 0):  E_max = qN_D x_n/ε_s = qN_A x_p/ε_s\n    Total width:  W = x_n + x_p = √( (2ε_s/q)(V_bi − V_a)(1/N_A + 1/N_D) )\n    x_n = W N_A/(N_A + N_D),   x_p = W N_D/(N_A + N_D)\n    V_bi − V_a = ½ E_max W\n\nV_a is the applied voltage (positive for forward bias). The depletion region extends mostly into the **more lightly doped** side. For a one-sided p⁺n junction, W ≈ √(2ε_s(V_bi − V_a)/qN_D).\n\n**Worked example.** Si, N_A = 10¹⁷ cm⁻³, N_D = 10¹⁶ cm⁻³, n_i = 10¹⁰ cm⁻³, 300 K, ε_s = 11.7 × 8.854×10⁻¹⁴ = 1.036×10⁻¹² F/cm.\n\n    V_bi = 0.0259 ln(10³³/10²⁰) = 0.0259 × 29.93 = 0.775 V\n\n    W = √( 2(1.036×10⁻¹²)(0.775)(10⁻¹⁷ + 10⁻¹⁶) / 1.602×10⁻¹⁹ )\n      = √(1.10×10⁻⁹) = 3.32×10⁻⁵ cm = 0.332 μm\n\n    x_n = 0.332 × (10/11) = 0.302 μm,   x_p = 0.030 μm\n\n    E_max = qN_D x_n/ε_s = (1.602×10⁻¹⁹)(10¹⁶)(3.02×10⁻⁵)/(1.036×10⁻¹²) = 4.7×10⁴ V/cm\n\n## 14.4 Junction under bias\n\n**Forward bias** (p positive, V_a > 0): the barrier falls to V_bi − V_a and the depletion region narrows. Diffusion now exceeds drift; majority carriers are **injected** across as minority carriers into the opposite sides, where they diffuse and recombine. Current rises exponentially.\n\n**Reverse bias** (V_a < 0): the barrier rises to V_bi + |V_a| and W widens. Diffusion is suppressed. Only the small drift of minority carriers that wander to the depletion edge flows: the **reverse saturation current**, nearly independent of voltage, until breakdown.\n\n**Law of the junction.** At the edges of the depletion region:\n\n    p_n(x_n) = p_n0 exp(qV_a/kT),      n_p(−x_p) = n_p0 exp(qV_a/kT)\n\nThe minority-carrier density at each edge is raised (forward) or lowered (reverse) by the Boltzmann factor.\n\n## 14.5 Breakdown\n\nAt large reverse bias the current rises sharply:\n\n- **Avalanche breakdown:** carriers accelerated by the depletion field impact-ionise and multiply. Dominates in lightly doped junctions, V_BR > about 6 V, positive temperature coefficient.\n- **Zener breakdown:** in heavily doped junctions (very thin W), electrons tunnel directly from the p-side valence band into the n-side conduction band. V_BR < about 4 V, negative temperature coefficient.\n\n## 14.6 Junction capacitance\n\nThe depletion layer stores charge that changes with voltage, so it acts as a capacitor:\n\n    C_j = ε_s A / W = A √( qε_s N_A N_D / (2(N_A + N_D)(V_bi − V_a)) )\n\nUnder forward bias the stored minority charge adds a **diffusion capacitance** C_d = (q/kT) I τ, which dominates at forward bias. Reverse-biased junctions are used as voltage-controlled capacitors (varactors). C–V measurement is in Module 16.\n\n---\n\n## Exam questions solved\n\n### Q47. Explain the formation of the depletion region and built-in potential in a p-n junction.\n\n**Formation of the depletion region.**\n\n1. When p-type and n-type regions are formed in one crystal, the p side has a high hole concentration (p_p0 ≈ N_A) and the n side a high electron concentration (n_n0 ≈ N_D). The steep concentration gradients cause holes to diffuse from p to n and electrons from n to p.\n2. Holes leaving the p side near the junction leave behind **immobile negative acceptor ions**; electrons leaving the n side leave behind **immobile positive donor ions**. Diffusing carriers also recombine with the majority carriers on the other side.\n3. A region on both sides of the metallurgical junction is therefore stripped of mobile carriers and contains only fixed ionic charge: **negative on the p side, positive on the n side**. This is the **depletion region** or space-charge region, typically 0.1–10 μm wide.\n4. The two charge layers are equal in magnitude, N_A x_p = N_D x_n, so the depletion region extends further into the more lightly doped side.\n5. The space charge produces an **electric field** directed from the positive (n) side to the negative (p) side, maximum at the junction: E_max = qN_D x_n/ε_s.\n6. This field drives drift currents of holes back to p and electrons back to n, opposing the diffusion. The depletion region grows until **drift exactly balances diffusion** for both carriers and the net current is zero. In equilibrium the Fermi level is constant throughout.\n\n**Built-in potential.** The field corresponds to an electrostatic potential difference across the depletion region, the **built-in potential V_bi**, with the n side positive with respect to the p side. In the band diagram, the bands bend by qV_bi so that the flat Fermi level is near E_v on the p side and near E_c on the n side. It forms a potential barrier that majority carriers must surmount to cross.\n\nIts value follows from the Fermi-level positions: q V_bi = (E_i − E_F)_p + (E_F − E_i)_n = kT ln(N_A/n_i) + kT ln(N_D/n_i), so\n\n    V_bi = (kT/q) ln( N_A N_D / n_i² )\n\nWidth of the depletion region:\n\n    W = √( (2ε_s V_bi / q)(N_A + N_D)/(N_A N_D) )\n\n**Example (Si, N_A = 10¹⁷, N_D = 10¹⁶ cm⁻³):** V_bi = 0.0259 ln(10¹³) = **0.775 V**; W = **0.33 μm**, of which 0.30 μm is on the n side; E_max ≈ 4.7×10⁴ V/cm.\n\nThe built-in potential cannot drive current in an external circuit, because in equilibrium it is exactly balanced by the contact potentials at the metal–semiconductor contacts. Applied bias changes the barrier to V_bi − V_a, which is the basis of rectification.\n\n### Q48. Derive the ideal Shockley diode equation and explain the effect of forward and reverse bias.\n\n**Assumptions (Shockley):**\n\n1. Abrupt junction; depletion approximation (no carriers in the depletion region, neutral elsewhere).\n2. Boltzmann statistics apply (non-degenerate).\n3. **Low-level injection**: injected minority densities are much smaller than majority densities.\n4. No generation or recombination inside the depletion region, so electron and hole currents are each constant across it.\n5. All applied voltage V appears across the depletion region; neutral regions have negligible resistance (zero field).\n6. Long neutral regions (longer than the diffusion lengths) terminated by Ohmic contacts.\n\n**Step 1: law of the junction.** In equilibrium n_n0/n_p0 = exp(qV_bi/kT). With bias V the barrier becomes V_bi − V, and (quasi-equilibrium across the depletion region) the minority densities at its edges become:\n\n    p_n(x_n) = p_n0 exp(qV/kT),     n_p(−x_p) = n_p0 exp(qV/kT)\n\nSo the excess minority densities at the edges are:\n\n    Δp_n(x_n) = p_n0 [ exp(qV/kT) − 1 ],     Δn_p(−x_p) = n_p0 [ exp(qV/kT) − 1 ]\n\n**Step 2: minority-carrier diffusion in the neutral n region.** With E = 0 and steady state, the continuity equation reduces to\n\n    D_p d²Δp_n/dx² − Δp_n/τ_p = 0\n\nFor a long region (Δp → 0 as x → ∞) the solution is\n\n    Δp_n(x) = Δp_n(x_n) exp( −(x − x_n)/L_p ),     L_p = √(D_pτ_p)\n\n**Step 3: hole diffusion current at x = x_n.** With no field, the hole current is pure diffusion:\n\n    J_p(x_n) = −qD_p dΔp_n/dx |_{x_n} = (qD_p/L_p) Δp_n(x_n) = (qD_p p_n0/L_p) [ exp(qV/kT) − 1 ]\n\n**Step 4: electron current at x = −x_p.** Similarly in the p region:\n\n    J_n(−x_p) = (qD_n n_p0/L_n) [ exp(qV/kT) − 1 ]\n\n**Step 5: total current.** With no recombination in the depletion region, J_n is the same at x_n as at −x_p, so the total current (constant everywhere) is the sum of the two minority diffusion currents at the depletion edges:\n\n    J = J_p(x_n) + J_n(−x_p) = [ qD_p p_n0/L_p + qD_n n_p0/L_n ] [ exp(qV/kT) − 1 ]\n\nUsing p_n0 = n_i²/N_D and n_p0 = n_i²/N_A:\n\n    J = J_s [ exp(qV/kT) − 1 ],     J_s = q n_i² ( D_p/(L_p N_D) + D_n/(L_n N_A) )\n\nor, for area A, **I = I_s [ exp(qV/kT) − 1 ]** with I_s = AJ_s. This is the ideal Shockley diode equation.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 220\" role=\"img\" aria-label=\"Ideal silicon diode current against voltage: negligible reverse current a  text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">≈ 0.6–0.7 V (Si)</text><text x=\"412.3\" y=\"58.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">×10 per 60 mV</text></svg><figcaption>Ideal diode characteristic. Forward current grows by a factor of 10 for every 60 mV at 300 K; reverse current saturates at −I<sub>s</sub>.</figcaption></figure>\n```\n\n**Effect of forward bias (V > 0, p side positive):**\n\n- The barrier is lowered to V_bi − V and the depletion region narrows.\n- Minority carriers are injected: the edge densities increase by exp(qV/kT).\n- For V ≫ kT/q (above about 0.1 V) the −1 is negligible: I ≈ I_s exp(qV/kT). Current increases by a decade every 2.3kT/q ≈ 60 mV.\n- Significant current flows only above the \"cut-in\" voltage (≈ 0.6–0.7 V in Si, ≈ 0.2–0.3 V in Ge), because I_s is so small.\n\n**Effect of reverse bias (V < 0):**\n\n- The barrier rises to V_bi + |V|; the depletion region widens.\n- The edge minority densities fall almost to zero (exp(qV/kT) → 0). Carriers are extracted rather than injected.\n- For |V| ≫ kT/q: I ≈ −I_s, a small, voltage-independent **reverse saturation current** (Si, about 10⁻¹⁵–10⁻¹² A for small diodes) carried by minority carriers generated within a diffusion length of the junction.\n- In real diodes, generation in the depletion region adds a current ∝ W ∝ √|V|, and at large |V| avalanche or Zener breakdown occurs.\n\n**Numerical example.** A Si p⁺n diode with N_D = 10¹⁶ cm⁻³, D_p = 10 cm²/s, τ_p = 1 μs, area 10⁻⁴ cm²: L_p = √(10 × 10⁻⁶) = 3.16×10⁻³ cm; J_s ≈ qn_i²D_p/(L_pN_D) = (1.602×10⁻¹⁹)(10²⁰)(10)/(3.16×10⁻³ × 10¹⁶) = 5.1×10⁻¹² A/cm², so I_s = 5.1×10⁻¹⁶ A. At V = 0.6 V, I = I_s e^{0.6/0.0259} = 5.1×10⁻¹⁶ × 1.15×10¹⁰ ≈ 5.9 μA, and at 0.7 V it is about 280 μA.\n\n**Real diodes** deviate: recombination in the depletion region at low forward bias (I ∝ e^{qV/2kT}), high-level injection at high current, series resistance, and generation current and breakdown in reverse. These are summarised by I = I_s(e^{qV/ηkT} − 1), with ideality factor η between 1 and 2.\n"}, {"num": "15", "title": "Metal–Semiconductor Contacts: Schottky and Ohmic", "body": "\nExamined in Q49. Every device has to be connected to metal wiring. Depending on the metal, the semiconductor and its doping, the contact either rectifies (Schottky) or conducts freely in both directions (Ohmic).\n\n## 15.1 Energy quantities\n\n- **Work function Φ_m** (metal) or **Φ_s** (semiconductor): energy to take an electron from the Fermi level to the vacuum level. Φ_s depends on doping, because E_F moves.\n- **Electron affinity χ**: energy from the bottom of the conduction band to the vacuum level. A material constant: Si 4.05 eV, GaAs 4.07 eV, Ge 4.0 eV.\n\n    Φ_s = χ + (E_c − E_F)\n\nMetal work functions (eV): Al 4.28, Ti 4.33, Cr 4.5, W 4.55, Ni 5.15, Au 5.1, Pt 5.65.\n\n## 15.2 The Schottky barrier (rectifying contact)\n\n**Case: metal on n-type with Φ_m > Φ_s.**\n\nBefore contact, the semiconductor Fermi level is higher than the metal's. On contact electrons flow from the semiconductor into the metal until the Fermi levels align. This leaves a **depletion region** of positive donor ions in the semiconductor (with a thin sheet of negative charge on the metal surface). The bands bend **upward** towards the interface.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 620 275\" role=\"img\" aria-label=\"Band diagram of a metal on n-type silicon after contact: the conduction band bends upward to the barrier q phi B at the interface, with built-in potential q V bi across the depletion width\" style=\"width:620px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><mar
