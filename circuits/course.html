rings at 4 rad/s inside a decaying envelope, dying out after about\n5/α = 1.67 s.\n\n**Example 3 — critical damping.** For L = 2 H and C = 0.5 F in series, find the\nR that gives critical damping.\n\n    ω_0 = 1/√(2 × 0.5) = 1\n    Critical: α = ω_0 ⇒ R/2L = 1 ⇒ R = 2L = 4 Ω\n\n**Example 4 — parallel RLC.** R = 5 Ω, L = 0.1 H, C = 0.01 F. Classify.\n\n    α = 1/(2RC) = 1/(2 × 5 × 0.01) = 10\n    ω_0 = 1/√(0.1 × 0.01) = 1/√(0.001) = 31.62\n\nα < ω_0 ⇒ **underdamped**, ω_d = √(1000 − 100) = 30 rad/s.\n\nNote that *increasing* R here would reduce α and make it ring more — the\nopposite of the series case.\n\n**Example 5 — step response.** The circuit of Example 3 (critically damped,\nR = 4 Ω, L = 2 H, C = 0.5 F) is driven by a 10 V step, starting from rest. Find\nv_C(t).\n\n    v_C(∞) = 10 V  (capacitor open at DC)\n    v_C(0⁺) = 0,   i_L(0⁺) = 0 ⇒ dv_C/dt(0⁺) = i_L(0⁺)/C = 0\n\n    v_C(t) = 10 + (A_1 + A_2 t)e^{−t}\n\nAt t = 0:  0 = 10 + A_1 ⇒ A_1 = −10\ndv_C/dt = A_2e^{−t} − (A_1 + A_2t)e^{−t}; at t = 0: A_2 − A_1 = 0 ⇒ A_2 = −10\n\n    v_C(t) = 10 − 10(1 + t)e^{−t} V\n\nNo overshoot, as critical damping guarantees.\n\n## 16.7 Exercises\n\n1. Series RLC: R = 10 Ω, L = 0.5 H, C = 0.2 F. Find α, ω_0 and classify.\n   (α = 10, ω_0 = 1, overdamped)\n2. Find R for critical damping in a parallel RLC with L = 1 H, C = 0.25 F.\n   (R = 1 Ω)\n3. A circuit rings at 200 rad/s with an envelope decaying with τ = 50 ms. Find\n   α, ω_d and ω_0. (α = 20, ω_d = 200, ω_0 = 201)\n4. For Example 2, find v_C(t) and confirm it starts at 10 V.\n5. Explain why increasing R damps a series RLC but undamps a parallel one.\n6. A radio tuner has L = 1 μH and C = 3.18 pF. Find the station frequency.\n   (89.25 MHz)\n7. In an LC circuit L = 40 mH, C = 4 μF, with current maximum at t = 0. Find ω,\n   the period, and when the capacitor is first fully charged.\n   (2500 rad/s; 2.51 ms; 0.628 ms — a quarter cycle)\n8. An LC circuit has peak current 1.0 A, L = 1 mH, C = 10 μF. Find the peak\n   charge. (ω = 10⁴ rad/s; q₀ = i₀/ω = 100 μC)\n\n## Takeaways\n\n- α = R/2L (series) or 1/2RC (parallel); ω_0 = 1/√(LC) for both.\n- Compare α with ω_0: over, critical, or underdamped.\n- Underdamped ⇒ e^{−αt} envelope ringing at ω_d = √(ω_0² − α²) < ω_0.\n- Two initial conditions: the continuous variable, and its derivative obtained\n  from the *other* storage element.\n"}, {"num": "17", "title": "Applying the Theorems to AC", "body": "\nEvery theorem in Modules 07–12 holds unchanged for AC steady state. Only one\nthing changes: **resistance R becomes impedance Z, a complex number.** Once you\naccept complex arithmetic, nothing else is new.\n\n## 13.1 Sinusoids and phasors\n\nA sinusoid v(t) = V_m cos(ωt + φ) is represented by the **phasor**\n\n    V = V_m ∠φ        (or V_rms ∠φ, if RMS convention is used)\n\nwith ω = 2πf understood throughout. Phasors turn differential equations into\nalgebra:\n\n    d/dt  ⟶  × jω           ∫ dt  ⟶  ÷ jω\n\nRMS values: for a sinusoid, V_rms = V_m/√2 = 0.7071 V_m. Power calculations use\nRMS; most textbook phasors use amplitude. Be explicit about which you are using\n— mixing them costs a factor of 2 in power.\n\n## 13.2 Impedance\n\n    Z = V/I = R + jX        [Ω]\n\n| Element | Impedance | Note |\n|---|---|---|\n| Resistor R | Z = R | current in phase with voltage |\n| Inductor L | Z = jωL | voltage **leads** current by 90° |\n| Capacitor C | Z = 1/(jωC) = −j/(ωC) | voltage **lags** current by 90° |\n\n- X > 0 → inductive; X < 0 → capacitive.\n- **Admittance** Y = 1/Z = G + jB (siemens), the AC counterpart of conductance.\n\nSeries and parallel combination rules are **identical** to the resistive case,\nusing Z:\n\n    Z_series = Z_1 + Z_2 + …\n    1/Z_parallel = 1/Z_1 + 1/Z_2 + …\n\nMnemonic for phase: **ELI the ICE man** — in an inductor (L), E leads I; in a\ncapacitor (C), I leads E.\n\n## 13.3 The theorems in AC form\n\n| Theorem | AC statement |\n|---|---|\n| Nodal/mesh | Same equations with Z and complex V, I |\n| Superposition | Same — and **mandatory** for sources at different frequencies |\n| Source transformation | V_s = I_s Z, same Z |\n| Thévenin | V_th = open-circuit phasor voltage; Z_th = impedance looking in |\n| Norton | I_N = short-circuit phasor current; Z_N = Z_th |\n| Maximum power | **Z_L = Z_th\\*** (complex conjugate) |\n\n### Different frequencies\n\nImpedance depends on ω. If two sources operate at different frequencies you\n**cannot** write a single phasor circuit — the impedances differ between them.\nYou must:\n\n1. Solve the circuit at ω_1 with the ω_2 source deactivated.\n2. Solve at ω_2 with the ω_1 source deactivated.\n3. Convert each answer back to the time domain.\n4. **Add the time-domain waveforms** — not the phasors.\n\nA DC source counts as ω = 0, where an inductor is a short and a capacitor an\nopen. This is the one situation where superposition is not merely convenient but\nunavoidable.\n\n## 13.4 AC power\n\n    S = V_rms I_rms* = P + jQ        [VA]\n\n- **P** = real power [W] = V_rms I_rms cos θ — does actual work\n- **Q** = reactive power [VAr] = V_rms I_rms sin θ — sloshes back and forth\n- **|S|** = apparent power [VA]\n- **cos θ** = power factor, with θ the angle by which voltage leads current\n\nLagging power factor = inductive load (the usual industrial case). Leading =\ncapacitive.\n\n**Power factor correction:** adding shunt capacitance cancels inductive Q,\nreducing the current drawn for the same real power, which cuts I²R losses in the\nsupply. The capacitance needed to move from pf angle θ_1 to θ_2 is\n\n    C = P(tan θ_1 − tan θ_2) / (ω V_rms²)\n\n## 13.5 Maximum power transfer in AC\n\nWith Z_th = R_th + jX_th, maximum power goes to the load when\n\n    Z_L = Z_th*  =  R_th − jX_th\n\nso the reactances **cancel** and the resistances **match**. Then\n\n    P_max = |V_th|² / (8R_th)     for amplitude phasors\n    P_max = V_th,rms² / (4R_th)   for RMS phasors\n\nThe reactance cancellation makes physical sense: reactive power does no work, so\nthe best thing to do with it is eliminate it, leaving a purely resistive match.\n\n**Restricted cases:**\n- If only |Z_L| may vary (fixed angle), the condition is |Z_L| = |Z_th|.\n- If the load must be purely resistive, then R_L = |Z_th| = √(R_th² + X_th²).\n\n## 13.6 Worked examples\n\n**Example 1 — impedances.** Find Z for a 10 Ω resistor in series with a 20 mH\ninductor at 50 Hz.\n\n    ω = 2π(50) = 314.16 rad/s\n    X_L = ωL = 314.16 × 0.02 = 6.283 Ω\n    Z = 10 + j6.283 = 11.81 ∠32.14° Ω\n\n**Example 2 — AC Thévenin.**\nA 100∠0° V source in series with j10 Ω feeds terminals across a −j20 Ω\ncapacitor. Find the Thévenin equivalent.\n\n*V_th* (voltage divider with impedances):\n\n    V_th = 100 × (−j20)/(j10 − j20) = 100 × (−j20)/(−j10) = 200∠0° V\n\nThe divider ratio exceeds 1 — entirely normal in a resonant LC divider, and a\nresult that would be impossible with resistors.\n\n*Z_th* (source shorted): j10 ∥ (−j20)\n\n    Z_th = (j10)(−j20)/(j10 − j20) = (200)/(−j10) = j20 Ω\n\n**Example 3 — conjugate matching.**\nA source has Z_th = 6 + j8 Ω and V_th = 50∠0° V (amplitude). Find the load for\nmaximum power and the power delivered.\n\n    Z_L = 6 − j8 Ω\n    Total Z = 12 Ω (purely real)\n    I = 50/12 = 4.167 A amplitude\n    P = ½|I|²R_L = ½(4.167)²(6) = 52.1 W\n\nCheck with the formula: P_max = |V_th|²/(8R_th) = 2500/48 = 52.1 W ✓\n\n**Example 4 — power factor.**\nA load draws 5 kW at 0.7 lagging from a 240 V, 50 Hz supply. Find the current,\nand the capacitance to correct to 0.95 lagging.\n\n    |S| = P/pf = 5000/0.7 = 7143 VA\n    I = 7143/240 = 29.8 A\n\n    θ_1 = cos⁻¹(0.7) = 45.57°,  tan θ_1 = 1.0202\n    θ_2 = cos⁻¹(0.95) = 18.19°, tan θ_2 = 0.3287\n    C = 5000(1.0202 − 0.3287)/(314.16 × 240²)\n      = 5000(0.6915)/(314.16 × 57600)\n      = 3457.5/18,095,574 = 191 μF\n\nNew current: |S| = 5000/0.95 = 5263 VA ⇒ I = 21.9 A, a **26% reduction** for the\nsame real power. That is the whole commercial case for power factor correction.\n\n## 13.7 Exercises\n\n1. Find Z for 50 Ω in series with 100 μF at 60 Hz. (50 − j26.5 Ω)\n2. A circuit has a 10 V DC source and a 5cos(1000t) V source. Explain why\n   superposition is required, and state what the inductor looks like to each.\n3. Z_th = 20 + j15 Ω, V_th = 100∠0° V amplitude. Find Z_L for max power and\n   P_max. (20 − j15 Ω; 62.5 W)\n4. A load takes 10 A at 0.8 lagging from 415 V. Find P, Q and |S|.\n   (3.32 kW, 2.49 kVAr, 4.15 kVA)\n5. Repeat Module 09 Example 1 with the 4 Ω replaced by j4 Ω and the 12 Ω by\n   −j12 Ω.\n\n## Takeaways\n\n- Replace R by Z and every DC theorem carries over unchanged.\n- Different frequencies ⇒ separate phasor circuits, then add in the time domain.\n- Maximum power needs the **conjugate** match: resistances equal, reactances\n  cancelled.\n- Power factor correction reduces current, not real power — that is the point.\n"}, {"num": "18", "title": "Three-Phase Circuits", "body": "\nNearly all bulk electrical power is generated, transmitted and consumed as three\nphase. The reason is not tradition: three-phase delivers **constant instantaneous\npower**, needs less conductor material for the same power, and produces a\nrotating magnetic field that starts a motor without help.\n\n## 18.1 Balanced three-phase sources\n\nThree sinusoidal sources of equal magnitude, 120° apart.\n\n**Positive (abc) sequence:**\n\n    V_an = V_p ∠0°\n    V_bn = V_p ∠−120°\n    V_cn = V_p ∠+120°\n\n**Negative (acb) sequence** reverses b and c. Sequence matters: it decides which\nway a three-phase motor turns.\n\n**Key property:** V_an + V_bn + V_cn = 0 for a balanced set. Three equal phasors\n120° apart always sum to zero — which is why the neutral of a balanced system\ncarries no current.\n\n## 18.2 Wye and delta\n\n### Wye (Y, star)\nThree phases share a common neutral point.\n\n- **Phase voltage** V_p = line-to-neutral\n- **Line voltage** V_L = line-to-line\n\n    V_L = √3 V_p,   with V_L leading V_p by 30°\n    I_L = I_p       (line and phase currents are the same)\n\nThe √3 comes from the phasor difference of two sources 120° apart:\n|V_an − V_bn| = √3 V_p.\n\n### Delta (Δ, mesh)\nThree phases connected head to tail in a closed triangle. No neutral.\n\n    V_L = V_p       (line and phase voltages are the same)\n    I_L = √3 I_p,   with I_L lagging I_p by 30°\n\n**The symmetry to remember:**\n\n| | Wye | Delta |\n|---|---|---|\n| Voltage | V_L = √3 V_p | V_L = V_p |\n| Current | I_L = I_p | I_L = √3 I_p |\n\n√3 = 1.732 appears exactly once in each column, and never in both.\n\n## 18.3 Balanced load analysis\n\nFour combinations exist (Y–Y, Y–Δ, Δ–Y, Δ–Δ), but you never need four methods.\n\n> **Per-phase method:** convert everything to an equivalent **Y–Y** system,\n> analyse **one phase only** as a single-phase circuit, then infer the other two\n> by ±120°.\n\nConversions:\n\n    Δ load → Y load:   Z_Y = Z_Δ/3\n    Y load → Δ load:   Z_Δ = 3Z_Y\n\nFor a balanced Y–Y system the neutral carries zero current, so you may connect\n(or ignore) the neutral freely — it makes no difference. That is what licenses\nthe per-phase shortcut.\n\n**Procedure:**\n1. Convert any Δ source or load to its Y equivalent.\n2. Draw one phase: V_p in series with the line impedance and Z_Y.\n3. Solve for I_p.\n4. Line currents and other phases follow by symmetry and the √3/30° rules.\n\n## 18.4 Three-phase power\n\nFor a balanced load with phase angle θ (the impedance angle):\n\n    P = 3 V_p I_p cos θ = √3 V_L I_L cos θ        [W]\n    Q = 3 V_p I_p sin θ = √3 V_L I_L sin θ        [VAr]\n    |S| = √3 V_L I_L                              [VA]\n\n**The √3 V_L I_L form is the one used in practice**, because line quantities are\nwhat you measure at a switchboard. Note it holds for **both** Y and Δ — the\nconnection cancels out of the product.\n\n### Constant instantaneous power\n\nThe great advantage. For a balanced three-phase load:\n\n    p(t) = 3 V_p I_p cos θ = constant\n\nThe three phases' pulsating powers sum to a steady value. A single-phase load\ndelivers power that pulses to zero twice per cycle; a three-phase motor\ntherefore produces smooth torque with no vibration at twice mains frequency.\n\n### Power measurement — the two-wattmeter method\n\nTwo wattmeters suffice for any three-wire system, balanced or not:\n\n    P = P_1 + P_2\n    Q = √3 (P_1 − P_2)\n    tan θ = √3 (P_1 − P_2)/(P_1 + P_2)\n\nA negative reading on one wattmeter is normal when the power factor is below\n0.5 — it is not a fault.\n\n## 18.5 Unbalanced loads\n\nIf the load is not balanced:\n\n- **Four-wire Y (with neutral):** each phase is independent — solve as three\n  separate single-phase circuits. The neutral now carries\n  I_N = I_a + I_b + I_c ≠ 0.\n- **Three-wire Y (no neutral):** the load's star point shifts away from the\n  source neutral. Use Millman's theorem (Module 12) to find the displacement\n  voltage, then each phase current.\n- **Δ load:** each phase sees the full line voltage regardless of balance, so\n  phase currents are independent; line currents follow by KCL.\n\nPer-phase analysis is **invalid** for unbalanced systems — that shortcut relies\non symmetry.\n\n## 18.6 Worked examples\n\n**Example 1 — Y connection basics.** A balanced Y source has\nV_an = 240∠0° V. Find all phase and line voltages.\n\n    V_an = 240∠0°,  V_bn = 240∠−120°,  V_cn = 240∠120°\n    V_L = √3(240) = 415.7 V\n    V_ab = 415.7∠30°,  V_bc = 415.7∠−90°,  V_ca = 415.7∠150°\n\n(That is the standard 240/415 V system used across much of the world.)\n\n**Example 2 — balanced Y–Y load.**\nA 415 V (line) balanced Y source feeds a balanced Y load of Z = 12 + j9 Ω per\nphase. Find the line current and total power.\n\n    V_p = 415/√3 = 239.6 V\n    |Z| = √(144 + 81) = 15 Ω,  θ = tan⁻¹(9/12) = 36.87°\n    I_p = 239.6/15 = 15.97 A = I_L\n\n    P = √3 V_L I_L cos θ = √3(415)(15.97)(0.8) = 9184 W ≈ 9.18 kW\n    Q = √3(415)(15.97)(0.6) = 6888 VAr\n    |S| = √3(415)(15.97) = 11,480 VA\n\nCheck per-phase: P = 3I_p²R = 3(15.97²)(12) = 9183 W ✓\n\n**Example 3 — delta load.**\nThe same source feeds a balanced Δ load of Z_Δ = 36 + j27 Ω per phase.\n\nConvert: Z_Y = Z_Δ/3 = 12 + j9 Ω — identical to Example 2. So the line current\nand total power are the same: **15.97 A and 9.18 kW**.\n\nDirectly in delta: V_p = V_L = 415 V, |Z_Δ| = 45 Ω, so\nI_p = 415/45 = 9.22 A, and I_L = √3(9.22) = 15.97 A ✓\n\n**Example 4 — two-wattmeter method.**\nTwo wattmeters read P_1 = 8 kW and P_2 = 2 kW. Find total power and power factor.\n\n    P = 8 + 2 = 10 kW\n    tan θ = √3(8 − 2)/(8 + 2) = √3(6)/10 = 1.0392\n    θ = 46.1°\n    pf = cos 46.1° = 0.693 lagging\n\n**Example 5 — why three-phase uses less copper.**\nCompare a single-phase and a three-phase system delivering the same power at the\nsame line voltage and power factor. Single-phase needs I = P/(V cos θ); three\nphase needs I_L = P/(√3 V cos θ), i.e. **1/√3 of the current** — so conductor\ncross-section (and copper mass) drops by the same factor, offset by needing\nthree conductors rather than two. The net saving is about 25%, which over\nthousands of kilometres of transmission line is enormous.\n\n## 18.7 Exercises\n\n1. A balanced Δ load draws 12 A line current from a 400 V supply at 0.85 pf.\n   Find P, Q and the phase current. (7.07 kW, 4.38 kVAr, 6.93 A)\n2. A Y load of 20∠30° Ω per phase is fed from 415 V line. Find I_L and P.\n   (11.98 A; 7.46 kW)\n3. Convert a Δ load of 60∠40° Ω per phase to its Y equivalent. (20∠40° Ω)\n4. Two wattmeters read 5 kW and −1 kW. Find total power and pf.\n   (4 kW; pf = 0.359)\n5. Explain why a balanced three-phase load needs no neutral conductor.\n\n## Takeaways\n\n- Balanced set sums to zero — hence no neutral current.\n- Wye: V_L = √3V_p, I_L = I_p. Delta: V_L = V_p, I_L = √3I_p. The √3 sits in\n  exactly one row of each.\n- Convert Δ → Y (÷3), analyse **one phase**, infer the rest.\n- P = √3 V_L I_L cos θ for both connections.\n- Instantaneous power is constant — the reason three-phase motors run smoothly.\n"}, {"num": "19", "title": "The Laplace Transform", "body": "\nModules 15 and 16 solved differential equations by recognising their form.\nThat stops working for anything more complicated. The Laplace transform converts\ndifferential equations into **algebraic** ones, solves them by algebra, and\nconverts back. It also handles initial conditions automatically, which is its\nreal advantage over classical methods.\n\n## 19.1 Definition\n\n    F(s) = ℒ{f(t)} = ∫₀^∞ f(t) e^{−st} dt\n\nwith s = σ + jω a complex frequency. The lower limit is 0⁻, which is what allows\nimpulses at the origin to be captured.\n\nThe transform exists whenever the integral converges, which for all signals in\ncircuit theory it does for Re(s) large enough.\n\n## 19.2 Transform pairs\n\n| f(t), t ≥ 0 | F(s) |\n|---|---|\n| δ(t) | 1 |\n| u(t) | 1/s |\n| t | 1/s² |\n| t^n | n!/s^{n+1} |\n| e^{−at} | 1/(s+a) |\n| t e^{−at} | 1/(s+a)² |\n| sin ωt | ω/(s² + ω²) |\n| cos ωt | s/(s² + ω²) |\n| e^{−at} sin ωt | ω/((s+a)² + ω²) |\n| e^{−at} cos ωt | (s+a)/((s+a)² + ω²) |\n| tⁿe^{−at} | n!/(s+a)^{n+1} |\n| sin(ωt + φ) | (s sin φ + ω cos φ)/(s² + ω²) |\n| cos(ωt + φ) | (s cos φ − ω sin φ)/(s² + ω²) |\n\nThose ten cover essentially every circuit problem. Note the pattern: **damping\nshifts s to s + a** — compare rows 7–8 with 9–10.\n\n## 19.3 Properties\n\n| Property | Statement |\n|---|---|\n| Linearity | ℒ{af + bg} = aF(s) + bG(s) |\n| **Differentiation** | ℒ{df/dt} = sF(s) − f(0⁻) |\n| Second derivative | ℒ{d²f/dt²} = s²F(s) − sf(0⁻) − f′(0⁻) |\n| **Integration** | ℒ{∫₀^t f dτ} = F(s)/s |\n| Time shift | ℒ{f(t−a)u(t−a)} = e^{−as}F(s) |\n| Frequency shift | ℒ{e^{−at}f(t)} = F(s+a) |\n| Scaling | ℒ{f(at)} = (1/a)F(s/a) |\n| Convolution | ℒ{f * g} = F(s)G(s) |\n| **Frequency differentiation** | ℒ{t f(t)} = −dF(s)/ds |\n| **Time periodicity** | ℒ{f(t)} = F₁(s)/(1 − e^{−sT}) |\n\n**Scaling** in full: ℒ{f(at)} = (1/a)F(s/a). Substitute x = at in the defining\nintegral and the 1/a falls out of dx = a dt.\n\n**Frequency differentiation** is the one to reach for whenever the time function\ncarries a factor of t:\n\n    ℒ{t sin ωt} = −d/ds [ω/(s²+ω²)] = 2ωs/(s²+ω²)²\n\nRepeat it for t², t³ and so on. This is far quicker than integrating by parts.\n\n**Time periodicity.** If f(t) is periodic with period T, write it as the sum of\nshifted copies of its **first period** f₁(t):\n\n    f(t) = f₁(t) + f₁(t−T)u(t−T) + f₁(t−2T)u(t−2T) + …\n\nTransforming term by term and using the time shift:\n\n    F(s) = F₁(s)[1 + e^{−sT} + e^{−2sT} + …] = F₁(s)/(1 − e^{−sT})\n\nusing the geometric series 1 + x + x² + … = 1/(1−x). So you only ever transform\n**one period** and divide.\n\n### The full property table\n\n| Property | f(t) | F(s) |\n|---|---|---|\n| Linearity | a₁f₁(t) + a₂f₂(t) | a₁F₁(s) + a₂F₂(s) |\n| Time shift | f(t−a)u(t−a) | e^{−as}F(s) |\n| Scaling | f(at) | (1/a)F(s/a) |\n| Frequency shift | e^{−at}f(t) | F(s+a) |\n| Time differentiation | df/dt | sF(s) − f(0⁻) |\n| | d²f/dt² | s²F(s) − sf(0⁻) − f′(0⁻) |\n| | dⁿf/dtⁿ | sⁿF(s) − s^{n−1}f(0⁻) − … − f^{(n−1)}(0⁻) |\n| Frequency differentiation | t f(t) | −dF(s)/ds |\n| Time periodicity | f(t) = f(t + nT) | F₁(s)/(1 − e^{−sT}) |\n| Initial value | f(0⁺) | lim_{s→∞} sF(s) |\n| Final value | f(∞) | lim_{s→0} sF(s) |\n\n**The differentiation property is the whole point.** Differentiation in time\nbecomes multiplication by s, and the initial condition f(0⁻) appears\nautomatically as an additive term. Initial conditions stop being a separate step\n— they are built into the algebra.\n\n### Initial and final value theorems\n\n    f(0⁺) = lim_{s→∞} sF(s)\n    f(∞)  = lim_{s→0} sF(s)\n\nThe final value theorem is **only valid if f(t) actually settles** — that is, if\nall poles of sF(s) are in the left half plane. Applying it to an oscillating or\ngrowing response gives a confident wrong answer, and that is a favourite exam\ntrap.\n\n## 19.4 The inverse transform by partial fractions\n\nCircuit problems produce F(s) = N(s)/D(s), a ratio of polynomials. Factor D(s)\nand split into simple terms, then read each back off the table.\n\n**Case 1 — distinct real poles.**\n\n    F(s) = k_1/(s+p_1) + k_2/(s+p_2) + …\n\nwith residues found by the cover-up rule:\n\n    k_i = [(s + p_i) F(s)]  evaluated at  s = −p_i\n\n**Case 2 — repeated poles.** For (s+p)^n, include terms\nk_1/(s+p) + k_2/(s+p)² + … + k_n/(s+p)^n, with\n\n    k_{n−m} = (1/m!) d^m/ds^m [(s+p)^n F(s)]  at  s = −p\n\n**Case 3 — complex poles.** Either use conjugate residues, or (usually easier)\ncomplete the square in the denominator and match the damped sine/cosine rows of\nthe table directly.\n\n**Before you start:** if the degree of N(s) is ≥ that of D(s), divide out first.\nPartial fractions require a proper fraction.\n\n## 19.5 Worked examples\n\n**Example 1 — transform a differential equation.**\nSolve dy/dt + 3y = 6u(t) with y(0⁻) = 2.\n\nTransform both sides:\n\n    sY(s) − 2 + 3Y(s) = 6/s\n    Y(s)(s + 3) = 6/s + 2\n    Y(s) = 6/[s(s+3)] + 2/(s+3)\n\nPartial fractions on the first term: 6/[s(s+3)] = A/s + B/(s+3)\n\n    A = 6/(s+3) at s=0 = 2\n    B = 6/s at s=−3 = −2\n\n    Y(s) = 2/s − 2/(s+3) + 2/(s+3) = 2/s\n\n    y(t) = 2u(t)\n\nThe initial condition happens to exactly equal the final value, so nothing\nchanges — a clean check that the algebra was right.\n\n**Example 2 — distinct poles.**\n\n    F(s) = (s + 4)/[(s + 1)(s + 3)]\n\n    k_1 = (s+4)/(s+3) at s=−1 = 3/2 = 1.5\n    k_2 = (s+4)/(s+1) at s=−3 = 1/(−2) = −0.5\n\n    F(s) = 1.5/(s+1) − 0.5/(s+3)\n    f(t) = 1.5e^{−t} − 0.5e^{−3t}\n\nCheck with the initial value theorem: f(0⁺) = lim sF(s) = 1, and\n1.5 − 0.5 = 1 ✓\n\n**Example 3 — complex poles by completing the square.**\n\n    F(s) = 10/(s² + 4s + 29)\n\n    s² + 4s + 29 = (s + 2)² + 25 = (s+2)² + 5²\n\nMatching the damped-sine row with a = 2, ω = 5:\n\n    F(s) = 2 × 5/[(s+2)² + 5²]\n    f(t) = 2e^{−2t} sin 5t\n\n**Example 4 — repeated pole.**\n\n    F(s) = 4/[s(s + 2)²] = A/s + B/(s+2) + C/(s+2)²\n\n    A = 4/(s+2)² at s=0 = 1\n    C = 4/s at s=−2 = −2\n    B: differentiate 4/s, giving −4/s², at s=−2 ⇒ −4/4 = −1\n\n    F(s) = 1/s − 1/(s+2) − 2/(s+2)²\n    f(t) = 1 − e^{−2t} − 2t e^{−2t}\n\nCheck the final value: lim_{s→0} sF(s) = 1, and as t → ∞ the exponentials vanish\nleaving 1 ✓\n\n**Example 5 — time shift.** Find ℒ{5u(t − 3)}.\n\n    = 5e^{−3s}/s\n\nAny delay becomes a factor e^{−as}. This is how switching at a time other than\nzero is handled.\n\n## 19.5a Transforming from the definition\n\nThe table is derived, not given. Being able to reproduce two or three entries\nfrom the defining integral is examinable, and the method is always the same.\n\n**u(t):**\n\n    ℒ{u(t)} = ∫₀^∞ 1·e^{−st} dt = [−e^{−st}/s]₀^∞ = 0 − (−1/s) = 1/s\n\n**e^{−at}u(t):**\n\n    ℒ{e^{−at}} = ∫₀^∞ e^{−at}e^{−st} dt = ∫₀^∞ e^{−(s+a)t} dt\n               = [−e^{−(s+a)t}/(s+a)]₀^∞ = 1/(s+a)\n\nBy the same working with +a, ℒ{e^{at}u(t)} = 1/(s − a).\n\n**δ(t):** by the sifting property, ∫δ(t)e^{−st}dt = e^{−s(0)} = **1**.\n\n**r(t) = t u(t):** integrate by parts with u = t, dv = e^{−st}dt:\n\n    ℒ{t} = [−te^{−st}/s]₀^∞ + (1/s)∫₀^∞ e^{−st}dt = 0 + (1/s)(1/s) = 1/s²\n\n**sin ωt:** use Euler, sin ωt = (e^{jωt} − e^{−jωt})/2j:\n\n    ℒ{sin ωt} = (1/2j)[1/(s − jω) − 1/(s + jω)]\n              = (1/2j)·[(s + jω) − (s − jω)]/(s² + ω²)\n              = (1/2j)(2jω)/(s² + ω²) = ω/(s² + ω²)\n\nThe same route with cos ωt = (e^{jωt} + e^{−jωt})/2 gives s/(s² + ω²).\n\n## 19.6 Exercises\n\n1. Find ℒ{3e^{−2t} + 4 sin 5t}. (3/(s+2) + 20/(s²+25))\n2. Invert F(s) = (2s + 5)/[(s+1)(s+4)]. (e^{−t} + e^{−4t})\n3. Solve d²y/dt² + 5dy/dt + 6y = 0 with y(0) = 1, y′(0) = 0.\n   (3e^{−2t} − 2e^{−3t})\n4. Find the final value of F(s) = 10/[s(s+5)] and verify by inversion. (2)\n5. Explain why the final value theorem fails for F(s) = ω/(s² + ω²).\n6. Use frequency differentiation to find ℒ{t² sin 2t} and ℒ{t² cos 3t}.\n7. Find the Laplace transform of the gate g(t) = 10[u(t−2) − u(t−3)].\n   (10(e^{−2s} − e^{−3s})/s)\n8. Find the initial and final values of H(s) = 20/[(s+3)(s²+8s+25)] without\n   inverting. (Both zero.)\n\n## Takeaways\n\n- ℒ turns d/dt into ×s and ∫dt into ÷s, carrying initial conditions along\n  automatically.\n- Ten transform pairs cover the whole of circuit theory.\n- Inversion is partial fractions; complete the square for complex poles.\n- The final value theorem only applies when the response actually settles.\n"}, {"num": "20", "title": "Circuit Analysis in the s-Domain", "body": "\nRather than write a differential equation and transform it, transform the\n**circuit itself**. Every technique from Modules 03–12 then works unchanged, in\nalgebra, with initial conditions built in.\n\n## 20.1 s-domain impedances\n\n| Element | Time domain | s-domain impedance |\n|---|---|---|\n| Resistor | v = Ri | Z = R |\n| Inductor | v = L di/dt | Z = sL |\n| Capacitor | i = C dv/dt | Z = 1/(sC) |\n\nCompare with phasors (Module 17), where the same elements were R, jωL and\n1/(jωC). **The s-domain is the generalisation:** set s = jω and you recover the\nphasor method. Phasor analysis is the special case of s-domain analysis\nrestricted to the imaginary axis — that is, to steady-state sinusoids only. The\ns-domain handles transients as well, because σ ≠ 0 is allowed.\n\n## 20.2 Initial conditions as sources\n\nThis is what makes the method powerful. Non-zero initial conditions appear as\n**additional sources** in the transformed circuit.\n\n**Inductor with initial current i(0⁻):**\nFrom ℒ{L di/dt} = sLI(s) − Li(0⁻):\n\n- **Series form:** impedance sL in series with a voltage source **Li(0⁻)**,\n  polarity aiding the original current.\n- **Parallel form:** impedance sL in parallel with a current source\n  **i(0⁻)/s**.\n\n**Capacitor with initial voltage v(0⁻):**\nFrom ℒ{C dv/dt} = sCV(s) − Cv(0⁻):\n\n- **Series form:** impedance 1/(sC) in series with a voltage source\n  **v(0⁻)/s**, polarity matching the original charge.\n- **Parallel form:** impedance 1/(sC) in parallel with a current source\n  **Cv(0⁻)**.\n\nUse the series form with mesh analysis and the parallel form with nodal\nanalysis. Once these sources are drawn in, the circuit is purely algebraic and\nevery earlier technique applies.\n\n## 20.3 The method\n\n1. Redraw the circuit in the s-domain: R → R, L → sL, C → 1/(sC).\n2. Add initial-condition sources for any L or C with non-zero initial state.\n3. Transform the input sources (a step V becomes V/s, an impulse becomes a\n   constant, and so on).\n4. Solve for the unknown using **any** method — series/parallel, dividers,\n   nodal, mesh, Thévenin, Norton, superposition. All remain valid with Z(s) in\n   place of R.\n5. Invert by partial fractions to get the time-domain answer.\n\nThe step that makes it worthwhile: you never write a differential equation, and\nyou never separately match initial conditions.\n\n## 20.4 Worked examples\n\n**Example 1 — RC step response, redone.**\nA 12 V step through 2 kΩ onto an uncharged 500 μF capacitor. (Module 15,\nExample 2 solved this classically.)\n\ns-domain: source 12/s, impedances 2000 and 1/(500×10⁻⁶ s) = 2000/s.\n\nVoltage divider:\n\n    V_C(s) = (12/s) × [2000/s] / [2000 + 2000/s]\n           = (12/s) × [2000/s] × [s/(2000s + 2000)]\n           = (12/s) × 2000/(2000(s + 1))\n           = 12/[s(s + 1)]\n\nPartial fractions: 12/[s(s+1)] = 12/s − 12/(s+1)\n\n    v_C(t) = 12(1 − e^{−t}) V ✓\n\nIdentical to Module 15, with no differential equation written.\n\n**Example 2 — with an initial condition.**\nA 2 H inductor carrying 6 A initially, in series with 4 Ω, is connected to a\n12 V source at t = 0. (Module 15, Example 3.)\n\ns-domain, series form: impedance 2s, initial-condition voltage source\nLi(0⁻) = 2 × 6 = 12 V, and the input 12/s.\n\nKVL around the loop:\n\n    12/s + 12 = I(s)(2s + 4)\n    I(s) = (12/s + 12)/(2s + 4) = (12 + 12s)/[s(2s + 4)]\n         = 12(1 + s)/[2s(s + 2)] = 6(s + 1)/[s(s + 2)]\n\nPartial fractions:\n\n    A = 6(s+1)/(s+2) at s=0 = 6/2 = 3\n    B = 6(s+1)/s at s=−2 = 6(−1)/(−2) = 3\n\n    I(s) = 3/s + 3/(s+2)\n    i(t) = 3 + 3e^{−2t} A ✓\n\nMatches Module 15 exactly — but the initial condition entered as a source rather\nthan as a separate matching step.\n\n**Example 3 — second order.**\nA series RLC with R = 6 Ω, L = 1 H, C = 0.04 F, driven by a 10 V step from rest.\nFind v_C(t).\n\ns-domain impedances: 6, s, 25/s (since 1/0.04 = 25).\n\n    V_C(s) = (10/s) × (25/s)/(6 + s + 25/s)\n\nMultiply numerator and denominator by s:\n\n    = (10/s) × 25/(s² + 6s + 25)\n    = 250/[s(s² + 6s + 25)]\n\nComplete the square: s² + 6s + 25 = (s+3)² + 16 = (s+3)² + 4²\n\nPartial fractions:\n\n    250/[s((s+3)²+16)] = A/s + (Bs + C)/((s+3)²+16)\n\n    A = 250/25 = 10\n\nMatching: 250 = 10[(s+3)²+16] + (Bs + C)s\n        250 = 10s² + 60s + 250 + Bs² + Cs\n    ⇒ 0 = (10 + B)s² + (60 + C)s\n    ⇒ B = −10,  C = −60\n\n    V_C(s) = 10/s − (10s + 60)/((s+3)² + 16)\n\nRewrite the numerator around (s+3): 10s + 60 = 10(s+3) + 30\n\n    = 10/s − 10(s+3)/((s+3)²+4²) − (30/4)(4)/((s+3)²+4²)\n\n    v_C(t) = 10 − 10e^{−3t}cos4t − 7.5e^{−3t}sin4t  V\n\nChecks: at t = 0, 10 − 10 − 0 = 0 ✓ (uncharged). As t → ∞, v → 10 V ✓.\nUnderdamped with α = 3, ω_d = 4 — matching Module 16's classification for these\nelement values.\n\n**Example 4 — Thévenin in the s-domain.**\nFind the s-domain Thévenin equivalent seen by a capacitor 1/(sC), where the rest\nof the network is a source V/s in series with R.\n\n    V_th(s) = V/s,   Z_th(s) = R\n\nso V_C(s) = (V/s)·[1/sC]/[R + 1/sC] = V/[s(sRC + 1)], giving the familiar\nV(1 − e^{−t/RC}). Every DC theorem carries straight over.\n\n**Example 5 — mesh analysis in the s-domain (from the lecture notes).**\nA u(t) source drives a 1 Ω resistor into a node; a ⅓ F capacitor sits from that\nnode to ground; a 5 Ω resistor leads on to a 1 H inductor to ground. Output is\nv_o(t) across the inductor. Zero initial conditions.\n\nTransform everything:\n\n    u(t) → 1/s,   1 H → sL = s,   ⅓ F → 1/(sC) = 3/s\n\nMesh 1 (source loop, sharing the capacitor branch), mesh 2 (right-hand loop):\n\n    1/s = (1 + 3/s)I₁ − (3/s)I₂\n    0   = −(3/s)I₁ + (s + 5 + 3/s)I₂\n\nFrom the second equation:\n\n    (3/s)I₁ = (s + 5 + 3/s)I₂   ⇒   I₁ = (1/3)(s² + 5s + 3)I₂\n\nSubstituting into the first and multiplying through by 3s:\n\n    3 = (s + 3)(s² + 5s + 3)I₂ − 9I₂\n      = (s³ + 8s² + 18s + 9)I₂ − 9I₂\n      = (s³ + 8s² + 18s)I₂\n\n    I₂ = 3/[s(s² + 8s + 18)]\n\nThe output is across the inductor, so V_o(s) = sL·I₂ = s·I₂:\n\n    V_o(s) = 3/(s² + 8s + 18)\n\nComplete the square: s² + 8s + 18 = (s + 4)² + 2 = (s + 4)² + (√2)²\n\n    V_o(s) = (3/√2) · √2/[(s + 4)² + (√2)²]\n    v_o(t) = (3/√2) e^{−4t} sin(√2 t)  V,   t ≥ 0\n           = 2.121 e^{−4t} sin(1.414t)  V\n\nUnderdamped, α = 4, ω_d = √2 — and the √2 appearing as both the damped frequency\nand the scaling factor is not a coincidence: the sine pair in the table carries\nω in its numerator, so you must divide by it to match.\n\n**Example 6 — nodal analysis with a stored initial condition and an impulse\nsource (from the lecture notes).**\nA source 10e^{−t}u(t) V feeds through 10 Ω to node v_o; a 10 Ω runs from v_o to\nground; a 0.1 F capacitor charged to v_C(0) = 5 V also runs to ground; and a\n2δ(t) A current source injects into the node.\n\nTransform each piece:\n\n    10e^{−t}u(t) → 10/(s + 1)\n    0.1 F → 1/(0.1s) = 10/s\n    capacitor initial condition → parallel current source Cv(0⁻) = 0.1 × 5 = 0.5 A\n    2δ(t) → 2  (the impulse transforms to a constant)\n\nKCL at v_o, taking the two source currents as entering:\n\n    [10/(s+1) − V_o]/10 − V_o/10 − V_o/(10/s) + 2 + 0.5 = 0\n\nMultiply through by 10:\n\n    10/(s+1) − V_o − V_o − sV_o + 25 = 0\n    10/(s+1) + 25 = V_o(s + 2)\n\n    V_o(s) = [10/(s+1) + 25]/(s + 2) = [10 + 25(s+1)]/[(s+1)(s+2)]\n           = (25s + 35)/[(s+1)(s+2)]\n\nResidues:\n\n    A = (25s+35)/(s+2) at s = −1 = (−25+35)/1 = 10\n    B = (25s+35)/(s+1) at s = −2 = (−50+35)/(−1) = 15\n\n    V_o(s) = 10/(s+1) + 15/(s+2)\n    v_o(t) = (10e^{−t} + 15e^{−2t}) u(t)  V\n\nCheck at t = 0: v_o(0⁺) = 25 V. That is **not** 5 V, and it should not be — the\nimpulse dumps charge into the capacitor instantaneously, so v_C jumps. This is\nthe one legitimate exception to \"capacitor voltage cannot change abruptly\"\n(Module 13): an impulse of current is exactly the infinite current that the rule\notherwise forbids.\n\n## 20.5 Why this replaces the classical method\n\n| Classical (Modules 15–16) | s-domain |\n|---|---|\n| Write and solve a differential equation | Write algebra |\n| Classify damping by hand | Poles tell you directly |\n| Match initial conditions separately | Built in as sources |\n| Awkward for switched or delayed inputs | e^{−as} handles any delay |\n| Different method per circuit order | One method for all orders |\n\nThe classical method still matters for insight — knowing that α and ω_0 govern\nthe shape is more useful than a pile of algebra. But for actually getting the\nanswer, the s-domain wins as soon as the circuit gets past second order.\n\n## 20.6 Exercises\n\n1. A 10 V step is applied to a series RL circuit (R = 5 Ω, L = 1 H) from rest.\n   Find i(t) via the s-domain. (2(1 − e^{−5t}) A)\n2. A 1 F capacitor charged to 5 V discharges through 2 Ω. Solve in the s-domain.\n   (2.5e^{−0.5t} A)\n3. Draw both the series and parallel s-domain models of an inductor with\n   i(0⁻) = 3 A and L = 0.5 H, labelling the source values. (1.5 V; 3/s A)\n4. Find V_C(s) for a parallel RLC driven by an impulse current source.\n5. Explain in one sentence how the s-domain reduces to the phasor method.\n\n## Takeaways\n\n- R → R, L → sL, C → 1/(sC), and initial conditions become sources.\n- Every technique from Modules 03–12 works unchanged with Z(s).\n- Phasor analysis is the s-domain with s = jω — steady state only.\n- Solve by algebra, then invert by partial fractions.\n"}, {"num": "21", "title": "Transfer Functions, Poles, Zeros and Stability", "body": "\n## 21.1 Definition\n\nFor a circuit at rest (all initial conditions zero), the **transfer function** is\nthe ratio of output transform to input transform:\n\n    H(s) = Y(s)/X(s)\n\nIt is a property of the **circuit alone** — independent of what you drive it\nwith. That is what makes it useful: characterise the circuit once, then predict\nits response to anything.\n\nFour kinds, depending on what is input and output:\n\n| H(s) | Name | Units |\n|---|---|---|\n| V_o/V_i | Voltage gain | — |\n| I_o/I_i | Current gain | — |\n| V_o/I_i | Transfer impedance | Ω |\n| I_o/V_i | Transfer admittance | S |\n\nDriving-point impedance Z(s) = V/I at a single port is a special case.\n\n**Impulse response.** Since ℒ{δ(t)} = 1, driving with an impulse gives\nY(s) = H(s), so\n\n    h(t) = ℒ⁻¹{H(s)}\n\nThe impulse response *is* the inverse transform of the transfer function. And\nfor any input, y(t) = h(t) * x(t) — convolution in time, multiplication in s.\nThat equivalence is the practical reason transforms are used at all.\n\n## 21.2 Poles and zeros\n\nWrite H(s) as a ratio of polynomials and factor:\n\n    H(s) = K (s − z_1)(s − z_2)… / [(s − p_1)(s − p_2)…]\n\n- **Zeros** z_i: values of s where H(s) = 0 — the circuit blocks that frequency.\n- **Poles** p_i: values of s where H(s) → ∞ — the circuit's natural frequencies.\n\n**The poles determine the response shape**, entirely. Each pole contributes a\nterm to the time response:\n\n| Pole location | Contributes | Behaviour |\n|---|---|---|\n| Real, negative (−a) | e^{−at} | decaying exponential |\n| Real, positive (+a) | e^{+at} | growing — unstable |\n| At origin (0) | constant | integrator |\n| Complex pair (−α ± jω_d) | e^{−αt}cos(ω_d t + φ) | damped oscillation |\n| Imaginary pair (±jω) | cos(ωt + φ) | sustained oscillation |\n| Right-half complex pair | e^{+αt}cos(...) | growing oscillation — unstable |\n| Repeated pole on the axis | t·(…) | grows — unstable |\n\nNotice this reproduces Module 16's three cases exactly: overdamped = two real\npoles, critically damped = repeated real pole, underdamped = complex pair. The\npole plot is the same information in a picture.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 620 262\" role=\"img\" aria-label=\"The s-plane: poles in the left half give decaying responses, poles on the imaginary axis sustained oscillation, and poles in the right half growth\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker></defs><line x1=\"30\" y1=\"130\" x2=\"320\" y2=\"130\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"200\" y1=\"242\" x2=\"200\" y2=\"18\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"326\" y=\"134\" font-size=\"11\" style=\"fill:currentColor\">σ</text><text x=\"206\" y=\"14\" font-size=\"11\" style=\"fill:currentColor\">jω</text><rect x=\"30\" y=\"18\" width=\"170\" height=\"224\" style=\"fill:var(--copper,#B4622F)\" opacity=\".055\"/><text x=\"115\" y=\"34\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor\" opacity=\".65\">stable half-plane</text><line x1=\"75.4\" y1=\"125.0\" x2=\"85.4\" y2=\"135.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\"/><line x1=\"75.4\" y1=\"135.0\" x2=\"85.4\" y2=\"125.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\"/><line x1=\"126.0\" y1=\"60.6\" x2=\"136.0\" y2=\"70.6\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\"/><line x1=\"126.0\" y1=\"70.6\" x2=\"136.0\" y2=\"60.6\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\"/><line x1=\"126.0\" y1=\"189.4\" x2=\"136.0\" y2=\"199.4\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\"/><line x1=\"126.0\" y1=\"199.4\" x2=\"136.0\" y2=\"189.4\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\"/><line x1=\"195.0\" y1=\"37.6\" x2=\"205.0\" y2=\"47.6\" style=\"stroke:currentColor\" stroke-width=\"2\"/><line x1=\"195.0\" y1=\"47.6\" x2=\"205.0\" y2=\"37.6\" style=\"stroke:currentColor\" stroke-width=\"2\"/><line x1=\"195.0\" y1=\"212.4\" x2=\"205.0\" y2=\"222.4\" style=\"stroke:currentColor\" stroke-width=\"2\"/><line x1=\"195.0\" y1=\"222.4\" x2=\"205.0\" y2=\"212.4\" style=\"stroke:currentColor\" stroke-width=\"2\"/><line x1=\"250.2\" y1=\"79.0\" x2=\"260.2\" y2=\"89.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\"/><line x1=\"250.2\" y1=\"89.0\" x2=\"260.2\" y2=\"79.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\"/><line x1=\"250.2\" y1=\"171.0\" x2=\"260.2\" y2=\"181.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\"/><line x1=\"250.2\" y1=\"181.0\" x2=\"260.2\" y2=\"171.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\"/><text x=\"360\" y=\"48\" font-size=\"11\" style=\"fill:currentColor\" font-weight=\"600\">real, negative</text><text x=\"360\" y=\"60\" font-size=\"10\" style=\"fill:currentColor\" opacity=\".7\">decaying exponential</text><text x=\"360\" y=\"74\" font-size=\"11\" style=\"fill:currentColor\" font-weight=\"600\">complex pair, left</text><text x=\"360\" y=\"86\" font-size=\"10\" style=\"fill:currentColor\" opacity=\".7\">damped oscillation</text><text x=\"360\" y=\"100\" font-size=\"11\" style=\"fill:currentColor\" font-weight=\"600\">on the jω axis</text><text x=\"360\" y=\"112\" font-size=\"10\" style=\"fill:currentColor\" opacity=\".7\">sustained oscillation</text><text x=\"360\" y=\"126\" font-size=\"11\" style=\"fill:currentColor\" font-weight=\"600\">anywhere on the right</text><text x=\"360\" y=\"138\" font-size=\"10\" style=\"fill:currentColor\" opacity=\".7\">growing — unstable</text></svg><figcaption>Where a pole sits decides the shape of the response it contributes. Distance left of the imaginary axis sets how fast it decays; height above the axis sets how fast it oscillates. Everything in the shaded half-plane is stable.</figcaption></figure>\n```\n\n**Distance from the origin** sets the frequency; **distance left of the\nimaginary axis** sets how fast it decays.\n\n## 21.3 Stability\n\n> A linear circuit is **stable** if and only if **every pole of H(s) lies\n> strictly in the left half of the s-plane** (Re(p) < 0).\n\n- All poles strictly left → **stable**. Every natural response decays; output\n  stays bounded for bounded input (BIBO stable).\n- Any pole strictly right → **unstable**. Response grows without limit.\n- Simple (non-repeated) poles **on** the imaginary axis → **marginally stable**.\n  Sustained oscillation, neither growing nor decaying. An ideal LC tank.\n- **Repeated** poles on the imaginary axis → unstable (the t factor grows).\n\n**Zeros do not affect stability.** They shape the response's amplitude and\nphase, but they cannot make a stable circuit unstable. Only poles matter.\n\n### Passive circuits are always stable\n\nAny circuit made only of positive R, L and C cannot be unstable — there is no\nsource of energy to sustain growth, and any R guarantees poles move strictly\nleft. Instability requires an **active** element: a dependent source, an\namplifier, or feedback. This is why op-amp and transistor circuits need stability\nanalysis and a resistor network never does.\n\n### Routh–Hurwitz test\n\nTo test stability without factoring the denominator, take the characteristic\npolynomial a_n s^n + … + a_1 s + a_0.\n\n**Necessary condition:** all coefficients present and of the same sign. If any\ncoefficient is zero or has the opposite sign, the system is **not** stable — and\nthis alone settles many exam questions immediately.\n\n**Sufficient test:** build the Routh array; the number of sign changes in the\nfirst column equals the number of right-half-plane poles. Zero sign changes\nmeans stable.\n\nFor a second-order polynomial s² + a_1s + a_0, the necessary condition is also\nsufficient: **stable ⟺ a_1 > 0 and a_0 > 0**.\n\n## 21.4 Frequency response from H(s)\n\nSet s = jω:\n\n    H(jω) = |H(jω)| ∠φ(ω)\n\n- |H(jω)| is the **magnitude response** — the gain at each frequency\n- φ(ω) is the **phase response**\n\nGain in decibels: |H|_dB = 20 log₁₀|H(jω)|. The **cutoff (half-power)\nfrequency** is where |H| falls to 1/√2 = 0.707 of maximum, i.e. −3 dB, which is\nwhere the output power halves.\n\nStandard filter shapes, identified by where the zeros sit:\n\n| Filter | H(s) shape | Passes |\n|---|---|---|\n| Low-pass | K/(s + a) | low frequencies |\n| High-pass | Ks/(s + a) | high frequencies |\n| Band-pass | Ks/(s² + as + b) | a band around ω_0 |\n| Band-stop (notch) | K(s² + ω_0²)/(s² + as + b) | everything except ω_0 |\n\nA zero at the origin blocks DC → high-pass. A zero at infinity (denominator of\nhigher degree) blocks high frequencies → low-pass.\n\n## 21.5 Worked examples\n\n**Example 1 — RC low-pass.**\nR in series, C to ground, output across C.\n\n    H(s) = (1/sC)/(R + 1/sC) = 1/(1 + sRC) = (1/RC)/(s + 1/RC)\n\nOne pole at s = −1/RC, no finite zeros. Stable (pole is left-half).\n\nCutoff: |H(jω)| = 1/√(1 + (ωRC)²) = 0.707 when ωRC = 1, so\n\n    ω_c = 1/RC,   f_c = 1/(2πRC)\n\nFor R = 1 kΩ, C = 1 μF: f_c = 1/(2π × 10⁻³) = **159 Hz**.\n\n**Example 2 — classify from poles.**\n\n    H(s) = 10/(s² + 4s + 13)\n\n    s = [−4 ± √(16 − 52)]/2 = −2 ± j3\n\nComplex pair, real part −2 < 0 ⇒ **stable**, underdamped. Response rings at\n3 rad/s inside an e^{−2t} envelope. Compare Module 16: α = 2, ω_d = 3,\nω_0 = √13 = 3.61.\n\n**Example 3 — instability from a dependent source.**\n\n    H(s) = K/(s² + (3 − K)s + 2)\n\nFor stability both coefficients must be positive: 2 > 0 always, and we need\n\n    3 − K > 0   ⇒   K < 3\n\nAt K = 3 the poles sit on the imaginary axis at ±j√2 — marginally stable,\noscillating at √2 rad/s. Above K = 3 the circuit oscillates with growing\namplitude. This is exactly how an oscillator is designed: set the gain at the\nboundary.\n\n**Example 4 — band-pass.**\n\n    H(s) = 20s/(s² + 20s + 10000)\n\nZero at s = 0 (blocks DC), poles from s² + 20s + 10⁴:\n\n    ω_0 = √10000 = 100 rad/s,  2α = 20 ⇒ α = 10\n    Q = ω_0/2α = 100/20 = 5\n\nPeak gain at ω = ω_0 = 100 rad/s, where H(j100) = 20(j100)/(−10000 + j2000 +\n10000) = 2000j/2000j = 1. Bandwidth = 2α = 20 rad/s.\n\n**Example 5 — Routh necessary condition.**\nIs s³ + 2s² − s + 5 stable?\n\nThe s coefficient is **negative** while the others are positive. A sign change\nmeans at least one right-half-plane root ⇒ **unstable**. No further work needed.\n\n## 21.6 Exercises\n\n1. Find H(s) = V_o/V_i for an RL circuit with output across R. Identify the\n   filter type. (sL-free: H = R/(R+sL), low-pass)\n2. H(s) = (s+2)/[(s+1)(s+5)]. List poles and zeros and state stability.\n3. For what K is H(s) = K/(s² + (K−4)s + 9) stable? (K > 4)\n4. An RC high-pass has R = 10 kΩ, C = 10 nF. Find f_c. (1.59 kHz)\n5. Explain why a circuit of positive R, L and C alone can never be unstable.\n\n## Takeaways\n\n- H(s) = output/input with zero initial conditions; h(t) = ℒ⁻¹{H(s)}.\n- Poles set the response shape; zeros shape amplitude and phase only.\n- Stable ⟺ all poles strictly in the left half plane.\n- Passive RLC is always stable; instability needs an active element.\n- s = jω converts the transfer function into the frequency response.\n"}, {"num": "22", "title": "Fourier Series and Transforms", "body": "\nLaplace handles transients from switching. Fourier answers a different question:\n**what frequencies is a signal made of, and what does the circuit do to each?**\n\n## 22.1 Fourier series — periodic signals\n\nAny periodic signal f(t) with period T (satisfying the mild Dirichlet\nconditions) can be written as a sum of sinusoids at multiples of the fundamental\nω_0 = 2π/T:\n\n    f(t) = a_0 + Σ_{n=1}^∞ [a_n cos nω_0 t + b_n sin nω_0 t]\n\nwith coefficients\n\n    a_0 = (1/T)∫_T f(t) dt                    (the DC or average value)\n    a_n = (2/T)∫_T f(t) cos(nω_0 t) dt\n    b_n = (2/T)∫_T f(t) sin(nω_0 t) dt\n\n**Amplitude–phase form**, usually more useful:\n\n    f(t) = a_0 + Σ A_n cos(nω_0 t + φ_n)\n    A_n = √(a_n² + b_n²)        φ_n = −tan⁻¹(b_n/a_n)\n\nn = 1 is the **fundamental**, n ≥ 2 the **harmonics**.\n\n### Symmetry shortcuts — use these before integrating\n\n| Symmetry | Condition | Consequence |\n|---|---|---|\n| **Even** | f(−t) = f(t) | all b_n = 0 (cosines only) |\n| **Odd** | f(−t) = −f(t) | a_0 = 0 and all a_n = 0 (sines only) |\n| **Half-wave** | f(t ± T/2) = −f(t) | all **even** harmonics vanish |\n\nChecking symmetry first can halve or quarter the work. A square wave that is odd\nand half-wave symmetric has only odd sine harmonics — three of the four\ncoefficient families are zero before you integrate anything.\n\n### Exponential form\n\n    f(t) = Σ_{n=−∞}^{∞} c_n e^{jnω_0 t},    c_n = (1/T)∫_T f(t)e^{−jnω_0 t} dt\n\nwith c_0 = a_0 and c_n = (a_n − jb_n)/2. Compact, and the natural bridge to the\nFourier transform.\n\n### Standard series worth knowing\n\n**Square wave**, amplitude A, odd, half-wave symmetric:\n\n    f(t) = (4A/π)[sin ω_0t + (1/3)sin 3ω_0t + (1/5)sin 5ω_0t + …]\n\nOdd harmonics only, amplitudes falling as 1/n.\n\n**Sawtooth**, amplitude A, odd:\n\n    f(t) = (2A/π)[sin ω_0t − (1/2)sin 2ω_0t + (1/3)sin 3ω_0t − …]\n\nAll harmonics, falling as 1/n.\n\n**Triangular wave**: odd harmonics falling as 1/n² — much faster, which is why a\ntriangle sounds far less harsh than a square.\n\n**The general rule:** the smoother the waveform, the faster its harmonics decay.\nDiscontinuities give 1/n; corners give 1/n².\n\n## 22.2 Circuit analysis with Fourier series\n\nThis is where superposition (Module 07) earns its keep. Because each harmonic is\na different frequency, you **must** treat them separately:\n\n1. Decompose the input into its harmonics.\n2. Evaluate the circuit's response **at each harmonic frequency** — remember\n   impedance depends on ω, so Z is different for every n.\n3. Compute each harmonic's output using phasor methods.\n4. **Add the time-domain results.**\n\nThe DC term (n = 0) is handled with L shorted and C opened.\n\n**Average power with harmonics:**\n\n    P = V_dc I_dc + Σ_n (V_n I_n/2) cos θ_n\n\nOnly harmonics **present in both** voltage and current contribute. Different\nharmonics are orthogonal, so cross terms vanish — which is exactly why you may\nadd powers here but not in Module 07's superposition (there it was one frequency\nin two parts; here it is genuinely different frequencies).\n\n**RMS with harmonics:**\n\n    F_rms = √(F_dc² + Σ (F_n²/2))\n\nfor amplitude coefficients F_n.\n\n**Total harmonic distortion:**\n\n    THD = √(Σ_{n≥2} F_n²) / F_1\n\n## 22.3 The Fourier transform — aperiodic signals\n\n### Deriving it from the series\n\nStart from the exponential Fourier series and let the period grow without bound.\n\n    f(t) = Σ_{n=−∞}^{∞} c_n e^{jnω₀t},    c_n = (1/T)∫_{−T/2}^{T/2} f(t)e^{−jnω₀t}dt\n\nSubstitute c_n into the sum:\n\n    f(t) = Σ_{n=−∞}^{∞} [(1/T)∫_{−T/2}^{T/2} f(t)e^{−jnω₀t}dt] e^{jnω₀t}\n\nSpacing between adjacent harmonics is Δω = (n+1)ω₀ − nω₀ = ω₀ = 2π/T, so\n1/T = Δω/2π:\n\n    f(t) = (1/2π) Σ [∫_{−T/2}^{T/2} f(t)e^{−jnω₀t}dt] e^{jnω₀t} Δω\n\nNow let T → ∞. Three things happen together:\n\n    Σ → ∫,        Δω → dω,        nω₀ → ω\n\nThe harmonic lines, spaced Δω apart, close up into a continuum. That gives\n\n    f(t) = (1/2π)∫_{−∞}^{∞} [∫_{−∞}^{∞} f(t)e^{−jωt}dt] e^{jωt} dω\n\nand the inner bracket is the **Fourier transform**:\n\n    F(ω) = ℱ{f(t)} = ∫_{−∞}^{∞} f(t) e^{−jωt} dt\n    f(t) = ℱ⁻¹{F(ω)} = (1/2π)∫_{−∞}^{∞} F(ω) e^{jωt} dω\n\n**Relationship to Laplace.** For a causal signal, F(ω) = F(s)|_{s=jω}. The\nFourier transform is the Laplace transform evaluated on the imaginary axis — the\nsame restriction that turns s-domain analysis into phasor analysis (Module 20).\n\nThe difference in use:\n\n| | Laplace | Fourier |\n|---|---|---|\n| Signals | causal, t ≥ 0 | any, including t < 0 |\n| Handles growing signals | yes (σ ≠ 0) | no |\n| Initial conditions | built in | not handled |\n| Best for | transients, switching | steady-state spectra, filtering |\n\n### Common pairs\n\n| f(t) | F(ω) |\n|---|---|\n| δ(t) | 1 |\n| 1 | 2πδ(ω) |\n| e^{−at}u(t) | 1/(a + jω) |\n| u(t) | πδ(ω) + 1/jω |\n| cos ω_0t | π[δ(ω−ω_0) + δ(ω+ω_0)] |\n| u(t+τ) − u(t−τ) | 2 sin(ωτ)/ω |\n| t | −2/ω² |\n| sgn(t) | 2/(jω) |\n| e^{at}u(−t) | 1/(a − jω) |\n| tⁿe^{−at}u(t) | n!/(a + jω)^{n+1} |\n| sin ω₀t | jπ[δ(ω+ω₀) − δ(ω−ω₀)] |\n| e^{−at}sin ω₀t u(t) | ω₀/((a+jω)² + ω₀²) |\n| e^{−at}cos ω₀t u(t) | (a+jω)/((a+jω)² + ω₀²) |\n| rect pulse of width τ | τ sinc(ωτ/2) |\n\nNote the reciprocal relationship in the last row: a **narrow** pulse in time has\na **wide** spectrum, and vice versa. A perfect impulse contains all frequencies\nequally; a perfect DC level contains only ω = 0. This is the time–bandwidth\ntrade-off, and it is why fast switching generates broadband interference.\n\n### Properties\n\nLinearity; time shift f(t−a) ⟷ e^{−jωa}F(ω); frequency shift; scaling\n(compress in time ⇒ stretch in frequency); and convolution\nf * g ⟷ F(ω)G(ω).\n\n**Parseval's theorem** — energy is the same computed either way:\n\n    ∫|f(t)|² dt = (1/2π)∫|F(ω)|² dω\n\n## 22.3a Circuit analysis with the Fourier transform\n\nThe method mirrors the s-domain (Module 20), with jω in place of s:\n\n    R → R          L → jωL          C → 1/(jωC)\n\nThen define the **transfer function**\n\n    H(ω) = Y(ω)/X(ω)        so       Y(ω) = H(ω)X(ω)\n\nand H(ω) is the Fourier transform of the impulse response h(t), exactly as\nH(s) was its Laplace transform.\n\n**Procedure:**\n1. Transform the input signal to X(ω).\n2. Replace circuit elements by their jω impedances.\n3. Find H(ω) by ordinary circuit analysis (dividers, nodal, mesh).\n4. Multiply: Y(ω) = H(ω)X(ω).\n5. Invert by partial fractions, reading pairs off the table.\n\n**Its one limitation:** the Fourier transform produces a response valid for\n−∞ < t < ∞, but it **cannot carry initial conditions**. Where the Laplace\ntransform folds v_C(0⁻) and i_L(0⁻) in as sources, Fourier has nowhere to put\nthem. Use Fourier for steady-state and spectral questions; use Laplace whenever\nthe circuit starts from a stored state.\n\n**Worked example (following the lecture notes).** A 2 Ω resistor in series with\na 1 F capacitor, output across the capacitor, driven by v_i(t) = 2e^{−3t}u(t).\nFind v_o(t).\n\nInput transform, from the table with a = 3:\n\n    V_i(ω) = 2/(3 + jω)\n\nImpedances: R = 2, Z_C = 1/(jωC) = 1/(jω). Voltage divider:\n\n    H(ω) = Z_C/(R + Z_C) = (1/jω)/(2 + 1/jω) = 1/(2jω + 1)\n\n    V_o(ω) = H(ω)V_i(ω) = 2/[(1 + 2jω)(3 + jω)]\n\nPartial fractions — write 2 = A(3 + jω) + B(1 + 2jω):\n\n    Set jω = −3:  2 = B(1 − 6) = −5B   ⇒  B = −2/5\n    Set jω = −½:  2 = A(3 − ½) = 2.5A  ⇒  A = 4/5\n\n    V_o(ω) = (4/5)/(1 + 2jω) − (2/5)/(3 + jω)\n           = (2/5)/(½ + jω) − (2/5)/(3 + jω)\n\n(dividing the first term top and bottom by 2 to put it in the table's a + jω\nform — a step worth doing deliberately, as it is where sign and factor errors\ncreep in.)\n\nInverting with ℱ⁻¹{1/(a + jω)} = e^{−at}u(t):\n\n    v_o(t) = (2/5)(e^{−t/2} − e^{−3t}) u(t)  V\n\nSanity check at t = 0: v_o(0) = 0 ✓ — the capacitor starts uncharged, as the\nFourier method assumes.\n\n## 22.4 Worked examples\n\n**Example 1 — coefficients of a square wave.**\nA square wave of amplitude 10 V, period 2 s, odd symmetry. Find the first three\nnon-zero terms.\n\n    ω_0 = 2π/2 = π rad/s\n    Odd ⇒ a_n = 0, a_0 = 0\n    b_n = 4A/(nπ) for odd n = 40/(nπ)\n\n    b_1 = 40/π = 12.73\n    b_3 = 40/3π = 4.24\n    b_5 = 40/5π = 2.55\n\n    f(t) ≈ 12.73 sin πt + 4.24 sin 3πt + 2.55 sin 5πt + …\n\nNote the fundamental's amplitude (12.73 V) **exceeds** the square wave's own\namplitude (10 V). That is correct, not an error — the harmonics subtract near\nthe peaks.\n\n**Example 2 — harmonic response.**\nThe square wave of Example 1 drives an RC low-pass with R = 1 Ω, C = 1 F\n(ω_c = 1 rad/s). Find the output amplitude of the first and third harmonics.\n\n    |H(jω)| = 1/√(1 + ω²)\n\n    n=1: ω = π = 3.142 ⇒ |H| = 1/√(1+9.87) = 0.303 ⇒ 12.73 × 0.303 = 3.86 V\n    n=3: ω = 3π = 9.425 ⇒ |H| = 1/√(1+88.8) = 0.1055 ⇒ 4.24 × 0.1055 = 0.45 V\n\nThe third harmonic is attenuated far more than the first — the filter is\nsmoothing the square wave toward a sinusoid, which is exactly what a low-pass\nfilter does to a switching waveform.\n\n**Example 3 — RMS with harmonics.**\nA voltage has a 10 V DC component plus harmonics of amplitude 6 V and 4 V. Find\nthe RMS value.\n\n    V_rms = √(10² + 6²/2 + 4²/2) = √(100 + 18 + 8) = √126 = 11.22 V\n\n**Example 4 — THD.**\nA waveform has a fundamental amplitude of 100 V with harmonics 20 V, 10 V, 5 V.\n\n    THD = √(20² + 10² + 5²)/100 = √(400+100+25)/100 = √525/100\n        = 22.91/100 = 22.9%\n\n**Example 5 — Fourier transform of a decaying exponential.**\n\n    f(t) = 5e^{−3t}u(t)\n    F(ω) = 5/(3 + jω)\n    |F(ω)| = 5/√(9 + ω²)\n\nMaximum 5/3 at DC, falling to 0.707 of that at ω = 3 rad/s — the same −3 dB\npoint as the corresponding filter.\n\n## 22.5 Exercises\n\n1. A waveform is even and half-wave symmetric. Which coefficients survive?\n2. Find a_0 for a sawtooth rising linearly from 0 to 10 V over each period.\n   (5 V)\n3. A signal has fundamental 50 V and third harmonic 15 V. Find RMS and THD.\n   (36.9 V; 30%)\n4. Find the Fourier transform of 2e^{−4t}u(t) and its magnitude at ω = 4.\n   (2/(4+jω); 0.354)\n5. Explain why a square wave fed to a good low-pass filter emerges nearly\n   sinusoidal.\n6. Derive ℱ{cos ω₀t} using Euler's formula and ℱ{e^{jω₀t}} = 2πδ(ω − ω₀).\n7. State the properties of the Fourier transform, and compare the Fourier and\n   Laplace transforms on: signal range, initial conditions, and what each is\n   best used for.\n8. Find v_o(t) for the RC circuit of §22.3a if the input is 5e^{−2t}u(t)\n   instead.\n\n## Takeaways\n\n- Fourier series decomposes a periodic signal into harmonics of ω_0.\n- Check even/odd/half-wave symmetry **before** integrating.\n- Each harmonic sees a different impedance — solve separately, add in time.\n- Powers of different harmonics **do** add (they are orthogonal); this does not\n  contradict Module 07.\n- The Fourier transform is Laplace on the imaginary axis; narrow in time means\n  wide in frequency.\n"}, {"num": "23", "title": "Two-Port Networks", "body": "\nThévenin reduced a network to a **one-port** — a single pair of terminals. Many\nreal blocks have two pairs: an input port and an output port. Amplifiers,\nfilters, transmission lines, transformers and attenuators are all two-ports.\n\nA two-port is characterised by four numbers relating the four terminal\nquantities V_1, I_1, V_2, I_2 — with no need to know anything about what is\ninside.\n\n**Convention:** both currents flow **into** the positive terminal of their port.\n\n## 23.1 The six parameter sets\n\nWhich two of the four variables you treat as independent gives six choices.\n\n### z-parameters (open-circuit impedance)\n\n    V_1 = z_11 I_1 + z_12 I_2\n    V_2 = z_21 I_1 + z_22 I_2\n\n```matrix\nlhs: z  =\nstyle: bracket\nz_11 ; z_12\nz_21 ; z_22\n```\n\nFound by **open-circuiting** one port at a time:\n\n    z_11 = V_1/I_1 |_{I_2=0}     input impedance, output open\n    z_12 = V_1/I_2 |_{I_1=0}     reverse transfer impedance\n    z_21 = V_2/I_1 |_{I_2=0}     forward transfer impedance\n    z_22 = V_2/I_2 |_{I_1=0}     output impedance, input open\n\n### y-parameters (short-circuit admittance)\n\n    I_1 = y_11 V_1 + y_12 V_2\n    I_2 = y_21 V_1 + y_22 V_2\n\nFound by **short-circuiting** one port at a time. The y-matrix is the inverse of\nthe z-matrix: **[y] = [z]⁻¹**.\n\n### h-parameters (hybrid)\n\n    V_1 = h_11 I_1 + h_12 V_2\n    I_2 = h_21 I_1 + h_22 V_2\n\n- h_11 = input impedance (Ω), output shorted\n- h_12 = reverse voltage gain (dimensionless)\n- h_21 = forward current gain (dimensionless) — **this is transistor β**\n- h_22 = output admittance (S), input open\n\nMixed units, hence \"hybrid\". These are the standard parameters for bipolar\ntransistors, which is why they matter far beyond circuit theory.\n\n### Transmission (ABCD) parameters\n\n    V_1 = A V_2 − B I_2\n    I_1 = C V_2 − D I_2\n\nNote the **minus signs**: here I_2 is taken as flowing *out* of the network, so\nthat cascaded stages chain naturally. A is dimensionless, B in Ω, C in S, D\ndimensionless.\n\n**The cascade property** is why these exist:\n\n> Two-ports in cascade multiply their ABCD matrices, in order.\n\nThat single fact makes ABCD the parameter set for transmission lines and\nmulti-stage filters.\n\nAlso defined: g-parameters (the inverse hybrid) and the inverse transmission\nparameters, both rarely used.\n\n## 23.2 Reciprocity and symmetry\n\n| Property | Condition |\n|---|---|\n| **Reciprocal** | z_12 = z_21, or y_12 = y_21, or AD − BC = 1, or h_12 = −h_21 |\n| **Symmetric** | z_11 = z_22, or A = D |\n\nAny network built only from R, L, C and transformers (no dependent sources) is\n**reciprocal** — this is Module 12's reciprocity theorem expressed in parameters.\nA network containing a dependent source (an amplifier) generally is not, which\nis exactly what makes it useful as an amplifier: signal goes forward but not\nbackward.\n\n**Symmetric** means the two ports are interchangeable — the network looks the\nsame from either end.\n\n## 23.3 Interconnections\n\n| Connection | Parameters that add |\n|---|---|\n| Series (both ports in series) | **z** matrices add |\n| Parallel (both ports in parallel) | **y** matrices add |\n| Cascade (output to input) | **ABCD** matrices multiply |\n| Series–parallel | **h** matrices add |\n\nEach parameter set exists because it makes one interconnection trivial. Choose\nthe set that matches how your blocks are wired.\n\n## 23.4 Conversions\n\nAll six sets describe the same network, so any can be converted to any other.\nThe two you should know:\n\n    [y] = [z]⁻¹\n\nFor z from ABCD:\n\n    z_11 = A/C,  z_12 = (AD − BC)/C,  z_21 = 1/C,  z_22 = D/C\n\nAnd ABCD from z:\n\n    A = z_11/z_21,  B = Δz/z_21,  C = 1/z_21,  D = z_22/z_21\n\nwhere Δz = z_11z_22 − z_12z_21.\n\n## 23.5 Worked examples\n\n**Example 1 — z-parameters of a T network.**\nA T network: Z_a in the input series arm, Z_b in the shunt arm to ground, Z_c in\nthe output series arm.\n\nWith port 2 open (I_2 = 0), no current flows in Z_c:\n\n    z_11 = V_1/I_1 = Z_a + Z_b\n    z_21 = V_2/I_1 = Z_b        (V_2 is the voltage across Z_b)\n\nWith port 1 open (I_1 = 0):\n\n    z_22 = Z_b + Z_c\n    z_12 = Z_b\n\nSince z_12 = z_21 = Z_b, the network is **reciprocal** ✓ (as it must be — it is\npassive).\n\nNumerically, with Z_a = 10 Ω, Z_b = 20 Ω, Z_c = 30 Ω:\n\n```matrix\nlhs: z  =\nstyle: bracket\n30 Ω ; 20 Ω\n20 Ω ; 50 Ω\n```\n\n**Example 2 — ABCD of a series impedance.**\nA single series Z between the ports.\n\n    V_1 = V_2 + I_1 Z,  and  I_1 = −I_2\n\n    A = 1,  B = Z,  C = 0,  D = 1\n\nCheck reciprocity: AD − BC = 1 − 0 = 1 ✓\n\n**Example 3 — ABCD of a shunt admittance.**\nA single shunt Y across the output.\n\n    A = 1,  B = 0,  C = Y,  D = 1\n\n**Example 4 — cascade.**\nCascade a 10 Ω series element with a 0.05 S shunt element.\n\n```matrix\nlhs: T  =\nstyle: bracket\n1 ; 10\n0 ; 1\n```\n\ntimes\n\n```matrix\nlhs: ×\nstyle: bracket\n1 ; 0\n0.05 ; 1\n```\n\nMultiplying:\n\n    A = 1(1) + 10(0.05) = 1.5\n    B = 1(0) + 10(1) = 10\n    C = 0(1) + 1(0.05) = 0.05\n    D = 0(0) + 1(1) = 1\n\nCheck: AD − BC = 1.5 − 0.5 = 1 ✓ — still reciprocal, as a passive cascade must\nbe.\n\n**Example 5 — input impedance with a load.**\nA two-port with known z-parameters drives a load Z_L. Then V_2 = −I_2 Z_L, and\n\n    Z_in = z_11 − z_12 z_21/(z_22 + Z_L)\n\nWith the T network of Example 1 and Z_L = 50 Ω:\n\n    Z_in = 30 − (20)(20)/(50 + 50) = 30 − 400/100 = 26 Ω\n\nSanity check directly: 10 + [20 ∥ (30 + 50)] = 10 + (20×80)/100 = 10 + 16 = 26 Ω ✓\n\n## 23.6 Exercises\n\n1. Find the z-parameters of a π network with shunt 10 Ω, series 20 Ω, shunt\n   10 Ω.\n2. Find ABCD for a 5 Ω series element cascaded with a 0.1 S shunt, and verify\n   AD − BC = 1.\n3. A two-port has h_21 = 100 and h_11 = 2 kΩ. What kind of device is this\n   likely to model, and what does h_21 represent?\n4. Show that for a symmetric T network, A = D.\n5. Two identical two-ports are connected in parallel. If each has\n   y_11 = 0.05 S, what is y_11 of the combination? (0.1 S)\n\n## Takeaways\n\n- Four numbers describe any two-port from outside; six equivalent sets exist.\n- z from open circuits, y from short circuits, h mixes both, ABCD cascades.\n- Reciprocal ⟺ z_12 = z_21 ⟺ AD − BC = 1; passive networks always are.\n- Pick the parameter set that makes your interconnection add or multiply.\n"}, {"num": "24", "title": "Introduction to Computer-Aided Analysis", "body": "\nHand analysis stops being practical somewhere around four or five nodes with\nreactive elements. Every real design is checked by simulation. This module covers\nwhat the tools are actually doing, which matters because a simulator that is\nquietly wrong is more dangerous than no simulator at all.\n\n## 24.1 What SPICE does\n\nSPICE (Simulation Program with Integrated Circuit Emphasis, Berkeley, 1973) and\nits descendants — LTspice, PSpice, Ngspice, Multisim, and the engines inside\nProteus and Altium — all work the same way.\n\nThe core algorithm is **modified nodal analysis (MNA)** — Module 05, generalised:\n\n1. Write KCL at every node in terms of node voltages, exactly as you learned.\n2. **Modify** it to handle elements whose current cannot be written in terms of\n   node voltages — ideal voltage sources and inductors — by adding their branch\n   current as an extra unknown, with an extra equation.\n3. Assemble and solve the resulting matrix **Ax = b** by LU decomposition.\n\nSo the simulator is doing your nodal analysis, on a matrix of a few thousand\nunknowns, a few thousand times per second. Understanding Module 05 is\nunderstanding SPICE.\n\n## 24.2 The four analysis types\n\n| Analysis | SPICE name | What it computes | Your module |\n|---|---|---|---|\n| DC operating point | `.op` | Steady-state node voltages; L shorted, C opened | 05, 13 |\n| DC sweep | `.dc` | Output vs a swept source value | 05 |\n| **Transient** | `.tran` | v(t), i(t) by numerical integration | 15, 16 |\n| **AC (small-signal)** | `.ac` | Magnitude and phase vs frequency | 17, 21 |\n\nTwo more that matter:\n- **`.noise`** — noise contributions referred to input or output.\n- **Monte Carlo / worst-case** — sweeps component tolerances to check whether a\n  design survives real parts, not ideal ones.\n\n### Transient analysis\n\nThe differential equations are integrated numerically, stepping forward in time.\nMethods: backward Euler (robust, damps artificially), trapezoidal (SPICE's\ndefault, accurate but can ring), and Gear (good for stiff circuits).\n\nThe simulator chooses step size adaptively — small where things change fast. The\nconsequence you will meet: `.tran` results depend on the step size, so a\nsuspiciously clean or suspiciously noisy result should always be re-run with a\ntighter maximum step.\n\n### AC analysis is linear only\n\n`.ac` **linearises the circuit around its DC operating point** and then solves\nwith complex impedances — exactly Module 17. Two consequences:\n\n- The result is a frequency response, and it is meaningless if the circuit is\n  genuinely nonlinear at signal level.\n- Amplitude is irrelevant in `.ac`; you can ask for 1 V input and get gain\n  directly. A \"10 V\" output in an AC analysis does not mean the real circuit\n  would swing 10 V — it might clip long before.\n\nThat last point is one of the commonest misreadings of simulator output.\n\n## 24.3 Netlists\n\nEvery schematic is compiled to a **netlist** — a text list of elements and the\nnodes they connect. Node 0 is always ground.\n\n    * RC low-pass filter\n    V1  in  0   AC 1  PULSE(0 5 0 1n 1n 1m 2m)\n    R1  in  out 1k\n    C1  out 0   1u\n    .tran 0 10m\n    .ac dec 100 1 100k\n    .end\n\nReading that: a source V1 between node `in` and ground; a 1 kΩ from `in` to\n`out`; a 1 μF from `out` to ground; run a transient to 10 ms and an AC sweep\nfrom 1 Hz to 100 kHz at 100 points per decade.\n\nElement letters: R, L, C, V, I, D (diode), Q (BJT), M (MOSFET), E/G/F/H (the\nfour dependent sources of Module 02).\n\nBeing able to read a netlist matters because it is the unambiguous\nrepresentation — schematics can hide connection errors that a netlist makes\nobvious.\n\n## 24.4 Where simulators go wrong\n\nWorth taking seriously; these cause real design failures.\n\n**Convergence failure.** The solver iterates (Newton–Raphson) and sometimes fails\nto settle. Causes: no DC path to ground from some node, a floating node, ideal\nswitches with zero resistance, or a loop of ideal voltage sources — the same\nillegal connections flagged in Module 02. Fixes: add a large resistor to ground,\nadd small series resistance to ideal sources, relax tolerances.\n\n**Ideal components.** A simulated capacitor has no ESR, no lead inductance and\nno voltage coefficient. A real one has all three. Circuits that only work in\nsimulation usually depend on some ideality.\n\n**Model quality.** Results are only as good as the device models. A transistor\nmodel from a vendor at 25 °C says nothing about behaviour at 85 °C.\n\n**Numerical artefacts.** Trapezoidal integration can produce ringing that is not\nphysical. Re-run with a different method or smaller step before believing an\noscillation.\n\n> **The rule:** a simulator answers the question you asked about the circuit you\n> entered. It does not check that either was sensible. Always sanity-check the\n> result against hand analysis — which is why Modules 01–23 come first, not\n> instead.\n\n## 24.5 A worked verification\n\nTake the RC low-pass of Module 21 Example 1: R = 1 kΩ, C = 1 μF.\n\n**Hand analysis:**\n\n    f_c = 1/(2πRC) = 1/(2π × 10³ × 10⁻⁶) = 159.15 Hz\n    τ = RC = 1 ms, so a step settles in 5τ = 5 ms\n    Gain at f_c = 0.707 (−3 dB), phase = −45°\n\n**What the simulator should show:**\n- `.ac` — magnitude flat at 0 dB below 159 Hz, falling at −20 dB/decade above,\n  passing −3 dB at 159 Hz, phase going 0° → −45° at f_c → −90°.\n- `.tran` with a 5 V step — an exponential rise reaching 3.16 V at 1 ms\n  (63.2%) and essentially 5 V by 5 ms.\n\nIf the simulation disagrees with either, **the simulation is wrong or the\nnetlist is wrong** — not the mathematics. That is the discipline: hand analysis\npredicts, simulation confirms, and disagreement is a bug to be found.\n\n## 24.6 Tools worth knowing\n\n| Tool | Notes |\n|---|---|\n| **LTspice** | Free, fast, industry standard. The default recommendation. |\n| **Ngspice** | Open source, scriptable, engine behind many front ends. |\n| **PSpice** | Commercial, common in universities. |\n| **Multisim** | Strong instrument-style interface, good for teaching. |\n| **MATLAB/Octave** | For solving the matrix equations directly, and for control-style analysis of H(s) — poles, Bode plots, step response. |\n| **Python (NumPy/SciPy)** | `scipy.signal` handles transfer functions, Bode plots and step responses in a few lines. |\n\nFor this course specifically, the two most useful things you can do\ncomputationally: solve nodal/mesh matrices numerically to check hand answers,\nand plot |H(jω)| from a transfer function to check a filter design.\n\n## 24.7 Exercises\n\n1. Write a netlist for a series RLC with R = 10 Ω, L = 1 mH, C = 1 μF driven by\n   a 1 V AC source, and add the line for an AC sweep from 100 Hz to 1 MHz.\n2. For that circuit, hand-compute ω_0 and Q, and state where the peak should\n   appear. (ω_0 = 31,623 rad/s ⇒ 5033 Hz; Q = 3.16)\n3. A simulation of a passive RLC shows a growing oscillation. What are the two\n   possible explanations, and which is more likely?\n4. Explain why `.ac` analysis cannot predict clipping.\n5. Give two circuit constructions that commonly cause convergence failure and\n   the fix for each.\n\n## Takeaways\n\n- SPICE is modified nodal analysis plus numerical integration — Module 05 at\n  scale.\n- `.op`, `.dc`, `.tran`, `.ac` map directly onto the analyses you have learned\n  by hand.\n- `.ac` is linearised and amplitude-blind; it cannot show clipping.\n- Convergence failures usually mean an idealisation the solver cannot handle.\n- Hand analysis predicts, simulation confirms. Disagreement means a bug.\n"}, {"num": "25", "title": "Formula Sheet", "body": "\n## Basics\nq = ∫i dt  |  i = dq/dt  |  v = dw/dq  |  p = vi  |  w = ∫p dt\nPassive sign convention: current **into +** ⇒ p = vi is **absorbed**\nΣ p_absorbed = 0 over the whole circuit\n1 kWh = 3.6×10⁶ J\n\n## Resistance\nv = iR  |  G = 1/R  |  p = i²R = v²/R  |  R = ρℓ/A\nShort: R = 0, v = 0. Open: R = ∞, i = 0.\n\n## Series and parallel\nR_series = R_1 + R_2 + …\n1/R_parallel = 1/R_1 + 1/R_2 + …  |  two only: R_1R_2/(R_1+R_2)\nn equal in parallel: R/n\nSeries R_eq > largest; parallel R_eq < smallest\n\n## Dividers\nVoltage: V_k = V_s R_k/ΣR          (load must be folded in first)\nCurrent (two): I_1 = I_s R_2/(R_1+R_2),  I_2 = I_s R_1/(R_1+R_2)\nNote the cross-over: current prefers the **smaller** resistance\n\n## Delta–wye\nΔ→Y: R_1 = R_bR_c/(R_a+R_b+R_c)  (and cyclic)\nY→Δ: R_a = (R_1R_2+R_2R_3+R_3R_1)/R_1  (and cyclic)\nBalanced: R_Δ = 3R_Y\nBridge balance: R_1R_4 = R_2R_3\n\n## Kirchhoff\nKCL: Σi_in = 0 at a node (or any closed surface)\nKVL: Σv = 0 around a loop\nb branches, n nodes ⇒ (n−1) KCL + [b−(n−1)] KVL\n\n## Nodal analysis\nCurrent leaving node A through R: (V_A − V_B)/R\nBy inspection: G_kk = Σ conductances at node k; G_jk = −(conductance between j,k)\nI_k = source currents entering node k\nVoltage source to ground ⇒ node voltage known\nVoltage source between two nodes ⇒ **supernode** + constraint V_A − V_B = V_s\n\n## Mesh analysis\nAll mesh currents same direction (clockwise)\nShared resistor voltage: R(i_1 − i_2)\nBy inspection: R_kk = Σ resistances in mesh k; R_jk = −(shared resistance)\nV_k = source rises driving mesh k\nCurrent source in one mesh ⇒ mesh current known\nCurrent source shared ⇒ **supermesh** + constraint i_1 − i_2 = I_s\nMatrix is symmetric unless dependent sources are present\n\n## Superposition\nVoltage source off ⇒ **short**.  Current source off ⇒ **open**.\nDependent sources **always stay active**.\nNever superpose power — superpose v or i, then square.\n\n## Source transformation\nV_s = I_s R  |  I_s = V_s/R  |  R unchanged\nArrow points toward where the + terminal faced\nTerminal behaviour preserved; internal power **not** preserved\n\n## Thévenin and Norton\nV_th = open-circuit voltage\nI_N = short-circuit current\nR_th = R_N = resistance looking in, **independent** sources off\nR_th = V_oc/I_sc  |  I_N = V_th/R_th  |  V_th = I_N R_N\n\nFinding R_th:\n1. Reduce by series/parallel — only if no dependent sources\n2. Test source (1 V ⇒ R = 1/I, or 1 A ⇒ R = V/1) — always valid\n3. V_oc/I_sc — always valid, fails only if both are zero\n\nValid **only at the terminals**: internal v, i and p are not reproduced.\n\n## Maximum power transfer\nDC: R_L = R_th  |  P_max = V_th²/(4R_th) = I_N²R_th/4\nEfficiency at match = **50%**\nIf R_th is the variable instead, make it as **small** as possible\nAC: Z_L = Z_th* (R_L = R_th, X_L = −X_th)\n  P_max = |V_th|²/(8R_th) amplitude, or V_rms²/(4R_th)\n  |Z_L| fixed-angle case: |Z_L| = |Z_th|\n  Purely resistive load: R_L = |Z_th|\n\n## Other theorems\nMillman: V_eq = ΣV_kG_k/ΣG_k,  R_eq = 1/ΣG_k\nReciprocity: I_B/V_A = I_A/V_B (linear, passive, bilateral, single source)\nSubstitution: replace a branch by anything with the same v and i\nCompensation: ΔR in a branch carrying I ⇒ equivalent source V_c = I·ΔR opposing\nTellegen: Σv_k i_k = 0 (needs only KCL and KVL)\n\n## AC steady state\nV = V_m∠φ  |  ω = 2πf  |  V_rms = V_m/√2\nZ_R = R  |  Z_L = jωL  |  Z_C = 1/(jωC) = −j/(ωC)\nZ = R + jX  |  Y = 1/Z = G + jB\nd/dt → ×jω,  ∫dt → ÷jω\nELI the ICE man: inductor E leads I; capacitor I leads E\n\nS = V_rms I_rms* = P + jQ\nP = V_rms I_rms cos θ [W]  |  Q = V_rms I_rms sin θ [VAr]  |  |S| [VA]\npf = cos θ; lagging = inductive, leading = capacitive\npf correction: C = P(tan θ_1 − tan θ_2)/(ω V_rms²)\n\nDifferent frequencies ⇒ solve separately, add **time-domain** waveforms\nDC is ω = 0: inductor → short, capacitor → open\n\n## Storage elements\ni = C dv/dt  |  v = L di/dt\nw_C = ½Cv²  |  w_L = ½Li²\n**v_C and i_L cannot change instantaneously**\nDC steady state: C → open, L → short\nAt t = 0⁺: uncharged C → short, unenergised L → open\nC series: 1/C_eq = Σ1/C_k; C parallel: C_eq = ΣC_k  (opposite to R)\nL series: L_eq = ΣL_k; L parallel: 1/L_eq = Σ1/L_k  (like R)\n\n## Signals: classification and operations\nCT x(t) defined everywhere; DT x(n) at integers only\nDT representations: graphical, tabular, functional, sequence (arrow = n = 0)\nTime shift x(t−t₀): t₀ > 0 delays. Reversal x(−t). Scaling x(at): a>1 compresses\nCombined: write x(at−b) as x(a(t−b/a)) — scale first, then shift\nEnergy: E = ∫|x|²dt (CT), Σ|x(n)|² (DT); energy signal ⟺ 0<E<∞, P=0\nPower: P = lim(1/2T)∫|x|²dt; power signal ⟺ 0<P<∞, E=∞\nEven x(−t)=x(t); odd x(−t)=−x(t), so x(0)=0\nx_e = ½[x(t) + x(−t)]   |   **x_o = ½[x(t) − x(−t)]**\neven×even = even; odd×odd = even; even×odd = odd\nDT sinusoid periodic only if ω is a rational multiple of 2π\nsgn(t) = 2u(t) − 1  |  sinc(t) = sin t/t, even, sinc(0) = 1\nParabolic p(t) = (t²/2)u(t); chain δ → u → r → p by integration\ne^{st}, s = σ+jω: σ sets growth/decay, ω sets oscillation\n\n## Elementary signals\nu(t) step  |  r(t) = t·u(t) ramp  |  δ(t) impulse\nδ = du/dt, u = dr/dt  |  sifting: ∫f(t)δ(t−a)dt = f(a)\nPulse a→b of height A: A[u(t−a) − u(t−b)]\n1τ → 63.2%, 3τ → 95%, **5τ → done**\nF_rms = √((1/T)∫f²dt); sinusoid A/√2; square wave A\n\n## First-order circuits\nτ = R_th C   or   τ = L/R_th     (R_th seen by the element)\n\n    x(t) = x(∞) + [x(0⁺) − x(∞)] e^{−t/τ}      x = v_C or i_L only\n\nInitial value from pre-switch steady state; final from post-switch.\n\n## LC oscillator\nω₀ = 1/√(LC)  |  i₀ = ω₀q₀  |  energy ½q²/C + ½Li² = constant\nDamped: peak charge decays with 2L/R; peak energy with L/R\n\n## Second-order circuits\nSeries RLC: α = R/2L     Parallel RLC: α = 1/(2RC)\nBoth: ω_0 = 1/√(LC),  ζ = α/ω_0,  Q = ω_0/2α\ns = −α ± √(α² − ω_0²)\n\n| Case | Condition | Form |\n|---|---|---|\n| Overdamped | α > ω_0 | A_1e^{s_1t} + A_2e^{s_2t} |\n| Critically damped | α = ω_0 | (A_1 + A_2t)e^{−αt} |\n| Underdamped | α < ω_0 | e^{−αt}(A_1cos ω_dt + A_2sin ω_dt) |\n\nω_d = √(ω_0² − α²)\nSecond initial condition: dv_C/dt(0⁺) = i_L(0⁺)/C, or di_L/dt(0⁺) = v_C(0⁺)/L\n\n## Three-phase\nBalanced set sums to zero\nWye: V_L = √3 V_p (leading 30°), I_L = I_p\nDelta: V_L = V_p, I_L = √3 I_p (lagging 30°)\nZ_Y = Z_Δ/3\nP = √3 V_L I_L cos θ  |  Q = √3 V_L I_L sin θ  |  |S| = √3 V_L I_L\nInstantaneous power is constant\nTwo wattmeters: P = P_1 + P_2, tan θ = √3(P_1 − P_2)/(P_1 + P_2)\n\n## Laplace transform\nF(s) = ∫₀^∞ f(t)e^{−st}dt\n\n| f(t) | F(s) | | f(t) | F(s) |\n|---|---|---|---|---|\n| δ(t) | 1 | | e^{−at} | 1/(s+a) |\n| u(t) | 1/s | | te^{−at} | 1/(s+a)² |\n| t | 1/s² | | sin ωt | ω/(s²+ω²) |\n| t^n | n!/s^{n+1} | | cos ωt | s/(s²+ω²) |\n| e^{−at}sin ωt | ω/((s+a)²+ω²) | | e^{−at}cos ωt | (s+a)/((s+a)²+ω²) |\n\nℒ{af + bg} = aF + bG  |  ℒ{f(at)} = (1/a)F(s/a)\nℒ{df/dt} = sF(s) − f(0⁻)\nℒ{d²f/dt²} = s²F(s) − sf(0⁻) − f′(0⁻)\nℒ{∫f} = F(s)/s  |  ℒ{f(t−a)u(t−a)} = e^{−as}F(s)  |  ℒ{e^{−at}f} = F(s+a)\nf(0⁺) = lim_{s→∞} sF(s)  |  f(∞) = lim_{s→0} sF(s)  (only if it settles)\nℒ{t f(t)} = −dF(s)/ds   (frequency differentiation)\nPeriodic f: ℒ{f} = F_1(s)/(1 − e^{−sT}), F_1 = transform of one period\nℒ{sin(ωt+φ)} = (s sinφ + ω cosφ)/(s²+ω²)\nℒ{cos(ωt+φ)} = (s cosφ − ω sinφ)/(s²+ω²)\nℒ{tⁿe^{−at}} = n!/(s+a)^{n+1}\nℒ{t² sin at} = 2a(3s² − a²)/(s²+a²)³\nℒ{t² cos at} = 2s(s² − 3a²)/(s²+a²)³\nResidue (simple pole): k_i = [(s + p_i)F(s)] at s = −p_i\nRepeated pole (s+p)^n: k_{n−m} = (1/m!) d^m/ds^m[(s+p)^n F(s)] at s = −p\n\n## s-domain circuits\nR → R  |  L → sL  |  C → 1/(sC)\nInductor IC: series source Li(0⁻), or parallel source i(0⁻)/s\nCapacitor IC: series source v(0⁻)/s, or parallel source Cv(0⁻)\nPhasors are the s-domain at s = jω\n\n## Transfer functions and stability\nH(s) = Y(s)/X(s) with zero initial conditions;  h(t) = ℒ⁻¹{H(s)}\ny(t) = h(t) * x(t)  ⟷  Y(s) = H(s)X(s)\nPoles set the response shape; zeros do not affect stability\n**Stable ⟺ all poles strictly in the left half plane**\nSimple poles on the jω axis → marginally stable; repeated → unstable\nPassive RLC is always stable\n2nd order s² + a_1s + a_0: stable ⟺ a_1 > 0 and a_0 > 0\nFrequency response: H(jω); |H|_dB = 20log₁₀|H|; cutoff at 0.707 (−3 dB)\nRC filter: ω_c = 1/RC, f_c = 1/(2πRC)\n\n## Fourier\nf(t) = a_0 + Σ[a_n cos nω_0t + b_n sin nω_0t],  ω_0 = 2π/T\na_0 = (1/T)∫f dt  |  a_n = (2/T)∫f cos nω_0t dt  |  b_n = (2/T)∫f sin nω_0t dt\nA_n = √(a_n² + b_n²)\nEven ⇒ b_n = 0. Odd ⇒ a_0 = a_n = 0. Half-wave ⇒ even harmonics vanish.\nSquare wave: (4A/π)[sin ω_0t + ⅓sin 3ω_0t + ⅕sin 5ω_0t + …]\nP = V_dc I_dc + Σ(V_n I_n/2)cos θ_n\nF_rms = √(F_dc² + Σ F_n²/2)  |  THD = √(Σ_{n≥2}F_n²)/F_1\nF(ω) = ∫f(t)e^{−jωt}dt = F(s)|_{s=jω} for causal f\nNarrow in time ⟺ wide in frequency\nCircuit analysis: R → R, L → jωL, C → 1/(jωC); Y(ω) = H(ω)X(ω); H(ω) = ℱ{h(t)}\nFourier carries **no** initial conditions — use Laplace when the circuit is\npre-charged\n\n| f(t) | F(ω) | | f(t) | F(ω) |\n|---|---|---|---|---|\n| δ(t) | 1 | | sgn(t) | 2/jω |\n| 1 | 2πδ(ω) | | e^{−at}u(t) | 1/(a+jω) |\n| u(t) | πδ(ω) + 1/jω | | e^{at}u(−t) | 1/(a−jω) |\n| t | −2/ω² | | tⁿe^{−at}u(t) | n!/(a+jω)^{n+1} |\n| u(t+τ)−u(t−τ) | 2sin(ωτ)/ω | | e^{jω₀t} | 2πδ(ω−ω₀) |\n| cos ω₀t | π[δ(ω−ω₀)+δ(ω+ω₀)] | | sin ω₀t | jπ[δ(ω+ω₀)−δ(ω−ω₀)] |\n\n## Two-port networks\nz: V_1 = z_11I_1 + z_12I_2, V_2 = z_21I_1 + z_22I_2 (open-circuit)\ny = z⁻¹ (short-circuit)\nh: V_1 = h_11I_1 + h_12V_2, I_2 = h_21I_1 + h_22V_2  (h_21 = transistor β)\nABCD: V_1 = AV_2 − BI_2, I_1 = CV_2 − DI_2\nReciprocal ⟺ z_12 = z_21 ⟺
