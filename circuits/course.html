 of that network is 3 V, then\n\n    I_N = V_th/R_th = 3/5 = 0.6 A\n\n## 10.5 Exercises\n\n1. Convert a Thévenin equivalent of 18 V behind 9 Ω to Norton form. (2 A ∥ 9 Ω)\n2. A network has I_sc = 4 A and V_oc = 24 V. Give both equivalents.\n   (24 V + 6 Ω; 4 A ∥ 6 Ω)\n3. Find the Norton equivalent of a 5 A source in parallel with 4 Ω, in series\n   with 6 Ω to the terminals. (2 A ∥ 10 Ω)\n4. For a source with V_oc = 10 V and R_th = 5 Ω, sketch the v–i line and mark\n   both intercepts.\n5. A load of 2 Ω is connected to the equivalent of Exercise 3. Find the load\n   current and voltage. (1.667 A; 3.33 V)\n\n## Takeaways\n\n- I_N = short-circuit current, R_N = R_th.\n- I_N = V_th/R_th — the two equivalents are one source transformation apart.\n- Any two of V_th, I_N, R_th give the third.\n- Pick the form that matches how the load connects and which analysis method you\n  are already using.\n"}, {"num": "11", "title": "Maximum Power Transfer", "body": "\n## 11.1 The question\n\nGiven a source network with a fixed Thévenin equivalent (V_th, R_th), what load\nresistance R_L extracts the most power?\n\nThis is a genuinely different question from \"what load gets the most voltage\"\n(answer: an open circuit) or \"the most current\" (answer: a short circuit).\nNeither of those extremes delivers any power at all — one has no current, the\nother no voltage. The maximum sits between them.\n\n## 11.2 Derivation\n\nWith the load connected:\n\n    I = V_th/(R_th + R_L)\n    P_L = I²R_L = V_th² R_L / (R_th + R_L)²\n\nDifferentiate with respect to R_L and set to zero. Using the quotient rule:\n\n    dP/dR_L = V_th² [(R_th + R_L)² − R_L · 2(R_th + R_L)] / (R_th + R_L)⁴\n            = V_th² [(R_th + R_L) − 2R_L] / (R_th + R_L)³\n            = V_th² (R_th − R_L) / (R_th + R_L)³\n\nThis is zero when\n\n    R_L = R_th\n\nand the second derivative is negative there, confirming a maximum.\n\n## 11.3 The result\n\n> **Maximum power is transferred to the load when R_L = R_th.**\n\nThe maximum power itself:\n\n    P_max = V_th² R_th / (2R_th)² = V_th² / (4R_th)\n\nEquivalently, in terms of the Norton form, P_max = I_N² R_th/4.\n\n## 11.4 Efficiency — the part that matters in practice\n\nAt the matched condition, the load and R_th carry the same current and have the\nsame resistance, so they dissipate **equal power**. Therefore:\n\n    η = P_L/P_total = 50%\n\n**Half the energy is wasted inside the source.** This is why matched loading is\nused in signal and communications systems — where the signal is precious and the\npower is negligible — and **never** in power systems, where wasting half the\ngenerated energy would be catastrophic.\n\nA power distribution network deliberately operates with R_L ≫ R_th, sacrificing\nmaximum power transfer for efficiency in the 90%+ range. The two goals are in\ndirect conflict, and knowing which one applies is an engineering judgement, not\na formula.\n\n### Shape of the curve\n\nThe peak is **broad and flat**. Because P depends on the ratio R_L/R_th:\n\n| R_L/R_th | P/P_max |\n|---|---|\n| 0.5 | 0.889 |\n| 0.8 | 0.988 |\n| 1.0 | 1.000 |\n| 1.25 | 0.988 |\n| 2.0 | 0.889 |\n| 5.0 | 0.556 |\n\nSo a mismatch of ±25% costs barely 1% of the available power. Precise matching\nmatters far less than people assume — a useful practical fact.\n\n## 11.5 Variants worth knowing\n\n**Fixed load, variable source resistance.** If R_L is fixed and R_th can vary,\nthe answer is *not* R_th = R_L — it is **R_th as small as possible**, because\nevery ohm of R_th only wastes power. The symmetric-looking answer is wrong here.\nRead the question carefully to see which resistance is the free variable.\n\n**Constrained range.** If R_L is restricted to a range that excludes R_th,\nP_L is monotonic over that range, so pick whichever endpoint is closest to R_th.\n\n**AC circuits.** With impedances, maximum power transfer requires the **complex\nconjugate** match:\n\n    Z_L = Z_th*        i.e.   R_L = R_th  and  X_L = −X_th\n\nThe reactance is cancelled, not matched. If only the magnitude |Z_L| may vary\nwith a fixed angle, the condition becomes |Z_L| = |Z_th| instead. See Module 13.\n\n## 11.6 Worked examples\n\n**Example 1.** A network has V_th = 24 V, R_th = 8 Ω. Find R_L for maximum\npower, that power, and the efficiency.\n\n    R_L = 8 Ω\n    P_max = V_th²/(4R_th) = 576/32 = 18 W\n    Check: I = 24/16 = 1.5 A, P_L = 1.5²(8) = 18 W ✓\n    Power in R_th = 18 W, total = 36 W, η = 50%\n\n**Example 2.** For Module 09 Example 1 (V_th = 9 V, R_th = 3 Ω), find the\nmaximum power available and compare with the 6 Ω load used there.\n\n    P_max = 81/12 = 6.75 W at R_L = 3 Ω\n    With 6 Ω: I = 9/9 = 1 A, P = 1²(6) = 6 W\n\nSo the 6 Ω load, though mismatched 2:1, still gets 6/6.75 = **89%** of the\navailable power — exactly as the table in §11.4 predicts.\n\n**Example 3.** A 12 V battery with 0.5 Ω internal resistance. What load draws\nmaximum power, and would you ever use it?\n\n    R_L = 0.5 Ω,  P_max = 144/2 = 72 W\n\nBut the battery itself would also dissipate 72 W, at 24 A. It would overheat\nrapidly and the efficiency would be 50%. In practice you would never load a\nbattery this way — this is the classic illustration that maximum power transfer\nis a signal-engineering criterion, not a power-engineering one.\n\n**Example 4 — the variable-source-resistance trap.**\nA fixed 10 Ω load is fed by a source whose internal resistance can be chosen\nanywhere from 2 Ω to 40 Ω. What value maximises load power?\n\nNot 10 Ω. Choose **R_th = 2 Ω**, the smallest available, since\n\n    P_L = V_th²(10)/(R_th + 10)²\n\ndecreases monotonically as R_th grows.\n\n## 11.7 Exercises\n\n1. V_th = 40 V, R_th = 20 Ω. Find R_L, P_max and η. (20 Ω, 20 W, 50%)\n2. A source delivers 100 W to a matched load. What is V_th if R_th = 25 Ω?\n   (100 V)\n3. A network's Norton equivalent is 3 A ∥ 12 Ω. Find P_max. (27 W)\n4. Show that at R_L = 4R_th the load receives 64% of P_max.\n5. Explain why a 400 kV transmission line is not operated at matched load.\n\n## Takeaways\n\n- R_L = R_th for maximum power; P_max = V_th²/(4R_th).\n- Efficiency at match is exactly 50% — fine for signals, unacceptable for power.\n- The peak is flat: ±25% mismatch costs about 1%.\n- If it is R_th that varies rather than R_L, the answer flips to \"make R_th as\n  small as possible\".\n"}, {"num": "12", "title": "Millman, Reciprocity, Substitution and Tellegen", "body": "\nThe four theorems here are narrower than Thévenin and Norton but each solves one\nclass of problem very quickly.\n\n## 12.1 Millman's theorem\n\nFor several **practical voltage sources connected in parallel** across a common\npair of terminals, the single equivalent is:\n\n    V_eq = (V_1G_1 + V_2G_2 + … + V_nG_n) / (G_1 + G_2 + … + G_n)\n    R_eq = 1 / (G_1 + G_2 + … + G_n)\n\nwith G_k = 1/R_k. In resistance form:\n\n    V_eq = (V_1/R_1 + V_2/R_2 + … ) / (1/R_1 + 1/R_2 + … )\n\n**What it really is:** a weighted average of the source voltages, weighted by\nconductance. The stiffest source (lowest R) dominates — which is exactly what\nyour intuition about paralleled batteries should say.\n\n**Conditions:** all branches must be in parallel between the *same* two nodes.\nA branch with no source is included with V_k = 0 (it still contributes its\nconductance to the denominator).\n\n**Example.** Three sources across common terminals: 12 V with 2 Ω, 10 V with\n4 Ω, and 6 V with 4 Ω.\n\n    Numerator = 12/2 + 10/4 + 6/4 = 6 + 2.5 + 1.5 = 10\n    Denominator = 1/2 + 1/4 + 1/4 = 1.0\n    V_eq = 10 V,   R_eq = 1 Ω\n\nNote this is just a one-line nodal analysis. Millman is nodal analysis for the\nsingle-node case, pre-solved.\n\n## 12.2 Reciprocity theorem\n\n> In a linear, **passive**, bilateral network with a **single** source, the\n> source and the response may be interchanged without changing the ratio between\n> them.\n\nPut a voltage source in branch A and measure the current in branch B. Move the\nsame source to branch B: the current now measured in branch A is **identical**.\n\n    I_B / V_A = I_A / V_B\n\n**Strict conditions — all four must hold:**\n1. Linear\n2. Passive — **no dependent sources**, no amplifiers\n3. Bilateral — elements behave the same in both directions (resistors do; diodes\n   do not)\n4. A single independent source\n\nReciprocity fails immediately if a dependent source is present. That is the\npoint of the \"passive\" requirement, and it is why transistor circuits are not\nreciprocal — which is precisely what makes amplification possible.\n\n**Use:** it halves the work when a problem asks for the same network driven from\ntwo different branches, and it is a powerful sanity check on a long solution.\n\n## 12.3 Substitution theorem\n\n> Any branch in a network may be replaced by any other branch that produces the\n> **same voltage across it and current through it**, without disturbing the rest\n> of the circuit.\n\nIf a branch carries 2 A with 6 V across it, it may be replaced by:\n- a 3 Ω resistor, or\n- a 6 V source, or\n- a 2 A source, or\n- any combination with the same terminal v and i.\n\n**Use:** it justifies replacing a complicated subnetwork with a single measured\nsource once you know its operating point, and it is the formal basis for the\n\"replace the load with a source\" step in several proofs. Its limitation is that\nthe substitution is valid **only at that one operating point** — change anything\nelse in the circuit and the equivalence is void.\n\n## 12.4 Compensation theorem\n\n> If a resistance R in a branch carrying current I changes by ΔR, the change in\n> all other currents and voltages is the same as would be produced by inserting\n> a voltage source of value **V_c = I·ΔR** in that branch, opposing the original\n> current, with all other sources deactivated.\n\n**Use:** sensitivity analysis. It tells you how much a circuit's behaviour shifts\nwhen one component drifts, without re-solving the whole network — useful for\ntolerance and error budgets.\n\n**Example.** A branch carries 0.5 A through 20 Ω. The resistor is replaced by a\n22 Ω (a +2 Ω change). The perturbation is equivalent to a source of\n\n    V_c = 0.5 × 2 = 1 V\n\ninserted in opposition, with the original sources off. Solve that much simpler\ncircuit to get the change in every current.\n\n## 12.5 Tellegen's theorem\n\n> For **any** network satisfying KCL and KVL, with branch voltages v_k and\n> branch currents i_k taken in the passive sign convention:\n\n    Σ v_k i_k = 0\n\nThe remarkable part: this needs **no** assumption of linearity, and the elements\nneed not even be the same in the two sets. It depends only on the *topology* —\non KCL and KVL holding — not on what the elements are.\n\nFor a single network it reduces to conservation of power (Module 01). Its deeper\nuse is in network theory proofs and in checking large simulations.\n\n## 12.6 Which theorem for which problem\n\n| Problem shape | Reach for |\n|---|---|\n| Find what a load does | Thévenin or Norton |\n| Best load for max power | Maximum power transfer |\n| Several sources, want one contribution | Superposition |\n| Simplify a source chain | Source transformation |\n| Several parallel practical sources | Millman |\n| Same network driven from two branches | Reciprocity |\n| One component's value drifts | Compensation |\n| Check a solved circuit | Tellegen / Σp = 0 |\n\n## 12.7 Exercises\n\n1. Four sources in parallel: 24 V/6 Ω, 12 V/4 Ω, 0 V/12 Ω, 18 V/9 Ω. Find the\n   Millman equivalent. (V_eq = 14.73 V, R_eq = 1.636 Ω)\n2. A 10 V source in branch A causes 0.4 A in branch B. What current would it\n   cause in A if moved to B? (0.4 A)\n3. A branch carries 1.5 A through 8 Ω. It is changed to 8.5 Ω. Give the\n   compensating source value. (0.75 V)\n4. Why does reciprocity fail for a circuit containing a CCCS?\n5. Verify Tellegen's theorem on Module 04 Example 3.\n\n## Takeaways\n\n- Millman = one-line nodal analysis for parallel practical sources; it is a\n  conductance-weighted average.\n- Reciprocity needs linear, passive, bilateral, single-source — dependent sources\n  kill it.\n- Substitution is valid only at the operating point it was derived from.\n- Compensation converts a component change into an equivalent source.\n- Tellegen needs only KCL and KVL — topology alone.\n"}, {"num": "13", "title": "Applying the Theorems to AC", "body": "\nEvery theorem in Modules 07–12 holds unchanged for AC steady state. Only one\nthing changes: **resistance R becomes impedance Z, a complex number.** Once you\naccept complex arithmetic, nothing else is new.\n\n## 13.1 Sinusoids and phasors\n\nA sinusoid v(t) = V_m cos(ωt + φ) is represented by the **phasor**\n\n    V = V_m ∠φ        (or V_rms ∠φ, if RMS convention is used)\n\nwith ω = 2πf understood throughout. Phasors turn differential equations into\nalgebra:\n\n    d/dt  ⟶  × jω           ∫ dt  ⟶  ÷ jω\n\nRMS values: for a sinusoid, V_rms = V_m/√2 = 0.7071 V_m. Power calculations use\nRMS; most textbook phasors use amplitude. Be explicit about which you are using\n— mixing them costs a factor of 2 in power.\n\n## 13.2 Impedance\n\n    Z = V/I = R + jX        [Ω]\n\n| Element | Impedance | Note |\n|---|---|---|\n| Resistor R | Z = R | current in phase with voltage |\n| Inductor L | Z = jωL | voltage **leads** current by 90° |\n| Capacitor C | Z = 1/(jωC) = −j/(ωC) | voltage **lags** current by 90° |\n\n- X > 0 → inductive; X < 0 → capacitive.\n- **Admittance** Y = 1/Z = G + jB (siemens), the AC counterpart of conductance.\n\nSeries and parallel combination rules are **identical** to the resistive case,\nusing Z:\n\n    Z_series = Z_1 + Z_2 + …\n    1/Z_parallel = 1/Z_1 + 1/Z_2 + …\n\nMnemonic for phase: **ELI the ICE man** — in an inductor (L), E leads I; in a\ncapacitor (C), I leads E.\n\n## 13.3 The theorems in AC form\n\n| Theorem | AC statement |\n|---|---|\n| Nodal/mesh | Same equations with Z and complex V, I |\n| Superposition | Same — and **mandatory** for sources at different frequencies |\n| Source transformation | V_s = I_s Z, same Z |\n| Thévenin | V_th = open-circuit phasor voltage; Z_th = impedance looking in |\n| Norton | I_N = short-circuit phasor current; Z_N = Z_th |\n| Maximum power | **Z_L = Z_th\\*** (complex conjugate) |\n\n### Different frequencies\n\nImpedance depends on ω. If two sources operate at different frequencies you\n**cannot** write a single phasor circuit — the impedances differ between them.\nYou must:\n\n1. Solve the circuit at ω_1 with the ω_2 source deactivated.\n2. Solve at ω_2 with the ω_1 source deactivated.\n3. Convert each answer back to the time domain.\n4. **Add the time-domain waveforms** — not the phasors.\n\nA DC source counts as ω = 0, where an inductor is a short and a capacitor an\nopen. This is the one situation where superposition is not merely convenient but\nunavoidable.\n\n## 13.4 AC power\n\n    S = V_rms I_rms* = P + jQ        [VA]\n\n- **P** = real power [W] = V_rms I_rms cos θ — does actual work\n- **Q** = reactive power [VAr] = V_rms I_rms sin θ — sloshes back and forth\n- **|S|** = apparent power [VA]\n- **cos θ** = power factor, with θ the angle by which voltage leads current\n\nLagging power factor = inductive load (the usual industrial case). Leading =\ncapacitive.\n\n**Power factor correction:** adding shunt capacitance cancels inductive Q,\nreducing the current drawn for the same real power, which cuts I²R losses in the\nsupply. The capacitance needed to move from pf angle θ_1 to θ_2 is\n\n    C = P(tan θ_1 − tan θ_2) / (ω V_rms²)\n\n## 13.5 Maximum power transfer in AC\n\nWith Z_th = R_th + jX_th, maximum power goes to the load when\n\n    Z_L = Z_th*  =  R_th − jX_th\n\nso the reactances **cancel** and the resistances **match**. Then\n\n    P_max = |V_th|² / (8R_th)     for amplitude phasors\n    P_max = V_th,rms² / (4R_th)   for RMS phasors\n\nThe reactance cancellation makes physical sense: reactive power does no work, so\nthe best thing to do with it is eliminate it, leaving a purely resistive match.\n\n**Restricted cases:**\n- If only |Z_L| may vary (fixed angle), the condition is |Z_L| = |Z_th|.\n- If the load must be purely resistive, then R_L = |Z_th| = √(R_th² + X_th²).\n\n## 13.6 Worked examples\n\n**Example 1 — impedances.** Find Z for a 10 Ω resistor in series with a 20 mH\ninductor at 50 Hz.\n\n    ω = 2π(50) = 314.16 rad/s\n    X_L = ωL = 314.16 × 0.02 = 6.283 Ω\n    Z = 10 + j6.283 = 11.81 ∠32.14° Ω\n\n**Example 2 — AC Thévenin.**\nA 100∠0° V source in series with j10 Ω feeds terminals across a −j20 Ω\ncapacitor. Find the Thévenin equivalent.\n\n*V_th* (voltage divider with impedances):\n\n    V_th = 100 × (−j20)/(j10 − j20) = 100 × (−j20)/(−j10) = 200∠0° V\n\nThe divider ratio exceeds 1 — entirely normal in a resonant LC divider, and a\nresult that would be impossible with resistors.\n\n*Z_th* (source shorted): j10 ∥ (−j20)\n\n    Z_th = (j10)(−j20)/(j10 − j20) = (200)/(−j10) = j20 Ω\n\n**Example 3 — conjugate matching.**\nA source has Z_th = 6 + j8 Ω and V_th = 50∠0° V (amplitude). Find the load for\nmaximum power and the power delivered.\n\n    Z_L = 6 − j8 Ω\n    Total Z = 12 Ω (purely real)\n    I = 50/12 = 4.167 A amplitude\n    P = ½|I|²R_L = ½(4.167)²(6) = 52.1 W\n\nCheck with the formula: P_max = |V_th|²/(8R_th) = 2500/48 = 52.1 W ✓\n\n**Example 4 — power factor.**\nA load draws 5 kW at 0.7 lagging from a 240 V, 50 Hz supply. Find the current,\nand the capacitance to correct to 0.95 lagging.\n\n    |S| = P/pf = 5000/0.7 = 7143 VA\n    I = 7143/240 = 29.8 A\n\n    θ_1 = cos⁻¹(0.7) = 45.57°,  tan θ_1 = 1.0202\n    θ_2 = cos⁻¹(0.95) = 18.19°, tan θ_2 = 0.3287\n    C = 5000(1.0202 − 0.3287)/(314.16 × 240²)\n      = 5000(0.6915)/(314.16 × 57600)\n      = 3457.5/18,095,574 = 191 μF\n\nNew current: |S| = 5000/0.95 = 5263 VA ⇒ I = 21.9 A, a **26% reduction** for the\nsame real power. That is the whole commercial case for power factor correction.\n\n## 13.7 Exercises\n\n1. Find Z for 50 Ω in series with 100 μF at 60 Hz. (50 − j26.5 Ω)\n2. A circuit has a 10 V DC source and a 5cos(1000t) V source. Explain why\n   superposition is required, and state what the inductor looks like to each.\n3. Z_th = 20 + j15 Ω, V_th = 100∠0° V amplitude. Find Z_L for max power and\n   P_max. (20 − j15 Ω; 62.5 W)\n4. A load takes 10 A at 0.8 lagging from 415 V. Find P, Q and |S|.\n   (3.32 kW, 2.49 kVAr, 4.15 kVA)\n5. Repeat Module 09 Example 1 with the 4 Ω replaced by j4 Ω and the 12 Ω by\n   −j12 Ω.\n\n## Takeaways\n\n- Replace R by Z and every DC theorem carries over unchanged.\n- Different frequencies ⇒ separate phasor circuits, then add in the time domain.\n- Maximum power needs the **conjugate** match: resistances equal, reactances\n  cancelled.\n- Power factor correction reduces current, not real power — that is the point.\n"}, {"num": "14", "title": "Formula Sheet", "body": "\n## Basics\nq = ∫i dt  |  i = dq/dt  |  v = dw/dq  |  p = vi  |  w = ∫p dt\nPassive sign convention: current **into +** ⇒ p = vi is **absorbed**\nΣ p_absorbed = 0 over the whole circuit\n1 kWh = 3.6×10⁶ J\n\n## Resistance\nv = iR  |  G = 1/R  |  p = i²R = v²/R  |  R = ρℓ/A\nShort: R = 0, v = 0. Open: R = ∞, i = 0.\n\n## Series and parallel\nR_series = R_1 + R_2 + …\n1/R_parallel = 1/R_1 + 1/R_2 + …  |  two only: R_1R_2/(R_1+R_2)\nn equal in parallel: R/n\nSeries R_eq > largest; parallel R_eq < smallest\n\n## Dividers\nVoltage: V_k = V_s R_k/ΣR          (load must be folded in first)\nCurrent (two): I_1 = I_s R_2/(R_1+R_2),  I_2 = I_s R_1/(R_1+R_2)\nNote the cross-over: current prefers the **smaller** resistance\n\n## Delta–wye\nΔ→Y: R_1 = R_bR_c/(R_a+R_b+R_c)  (and cyclic)\nY→Δ: R_a = (R_1R_2+R_2R_3+R_3R_1)/R_1  (and cyclic)\nBalanced: R_Δ = 3R_Y\nBridge balance: R_1R_4 = R_2R_3\n\n## Kirchhoff\nKCL: Σi_in = 0 at a node (or any closed surface)\nKVL: Σv = 0 around a loop\nb branches, n nodes ⇒ (n−1) KCL + [b−(n−1)] KVL\n\n## Nodal analysis\nCurrent leaving node A through R: (V_A − V_B)/R\nBy inspection: G_kk = Σ conductances at node k; G_jk = −(conductance between j,k)\nI_k = source currents entering node k\nVoltage source to ground ⇒ node voltage known\nVoltage source between two nodes ⇒ **supernode** + constraint V_A − V_B = V_s\n\n## Mesh analysis\nAll mesh currents same direction (clockwise)\nShared resistor voltage: R(i_1 − i_2)\nBy inspection: R_kk = Σ resistances in mesh k; R_jk = −(shared resistance)\nV_k = source rises driving mesh k\nCurrent source in one mesh ⇒ mesh current known\nCurrent source shared ⇒ **supermesh** + constraint i_1 − i_2 = I_s\nMatrix is symmetric unless dependent sources are present\n\n## Superposition\nVoltage source off ⇒ **short**.  Current source off ⇒ **open**.\nDependent sources **always stay active**.\nNever superpose power — superpose v or i, then square.\n\n## Source transformation\nV_s = I_s R  |  I_s = V_s/R  |  R unchanged\nArrow points toward where the + terminal faced\nTerminal behaviour preserved; internal power **not** preserved\n\n## Thévenin and Norton\nV_th = open-circuit voltage\nI_N = short-circuit current\nR_th = R_N = resistance looking in, **independent** sources off\nR_th = V_oc/I_sc  |  I_N = V_th/R_th  |  V_th = I_N R_N\n\nFinding R_th:\n1. Reduce by series/parallel — only if no dependent sources\n2. Test source (1 V ⇒ R = 1/I, or 1 A ⇒ R = V/1) — always valid\n3. V_oc/I_sc — always valid, fails only if both are zero\n\nValid **only at the terminals**: internal v, i and p are not reproduced.\n\n## Maximum power transfer\nDC: R_L = R_th  |  P_max = V_th²/(4R_th) = I_N²R_th/4\nEfficiency at match = **50%**\nIf R_th is the variable instead, make it as **small** as possible\nAC: Z_L = Z_th* (R_L = R_th, X_L = −X_th)\n  P_max = |V_th|²/(8R_th) amplitude, or V_rms²/(4R_th)\n  |Z_L| fixed-angle case: |Z_L| = |Z_th|\n  Purely resistive load: R_L = |Z_th|\n\n## Other theorems\nMillman: V_eq = ΣV_kG_k/ΣG_k,  R_eq = 1/ΣG_k\nReciprocity: I_B/V_A = I_A/V_B (linear, passive, bilateral, single source)\nSubstitution: replace a branch by anything with the same v and i\nCompensation: ΔR in a branch carrying I ⇒ equivalent source V_c = I·ΔR opposing\nTellegen: Σv_k i_k = 0 (needs only KCL and KVL)\n\n## AC steady state\nV = V_m∠φ  |  ω = 2πf  |  V_rms = V_m/√2\nZ_R = R  |  Z_L = jωL  |  Z_C = 1/(jωC) = −j/(ωC)\nZ = R + jX  |  Y = 1/Z = G + jB\nd/dt → ×jω,  ∫dt → ÷jω\nELI the ICE man: inductor E leads I; capacitor I leads E\n\nS = V_rms I_rms* = P + jQ\nP = V_rms I_rms cos θ [W]  |  Q = V_rms I_rms sin θ [VAr]  |  |S| [VA]\npf = cos θ; lagging = inductive, leading = capacitive\npf correction: C = P(tan θ_1 − tan θ_2)/(ω V_rms²)\n\nDifferent frequencies ⇒ solve separately, add **time-domain** waveforms\nDC is ω = 0: inductor → short, capacitor → open\n\n## Constants\nρ_copper = 1.72×10⁻⁸ Ω·m  |  ρ_aluminium = 2.82×10⁻⁸ Ω·m\ne = 1.602×10⁻¹⁹ C\n"}, {"num": "15", "title": "Problem Set with Full Solutions", "body": "\nTwenty problems spanning the course. Work each on paper before reading the\nsolution. All numerical answers have been checked independently.\n\n---\n\n**P1.** An element has 15 V across it, + on the left, and 3 A entering the right\nterminal. Find the power absorbed and state what the element is doing.\n\n*Solution.* Current enters the **−** terminal, so p = vi gives *delivered* power.\n\n    p_delivered = 15 × 3 = 45 W   ⇒   p_absorbed = −45 W\n\nThe element **delivers** 45 W — it is acting as a source.\n\n---\n\n**P2.** Find R_eq at terminals a–b: 10 Ω in series with (20 Ω ∥ (5 Ω + 15 Ω)).\n\n    5 + 15 = 20 Ω\n    20 ∥ 20 = 10 Ω\n    R_eq = 10 + 10 = 20 Ω\n\n---\n\n**P3.** A 60 V source feeds 4 Ω in series with 8 Ω. A 24 Ω load is then placed\nacross the 8 Ω. Find the load voltage before and after loading.\n\n*Before:* V = 60 × 8/12 = **40 V**\n\n*After:* 8 ∥ 24 = 192/32 = 6 Ω\n\n    V = 60 × 6/(4+6) = 60 × 0.6 = 36 V\n\nThe 10% droop is the divider's Thévenin resistance (4 ∥ 8 = 2.667 Ω) acting\nagainst the 24 Ω load.\n\n---\n\n**P4.** A delta network has R_a = 30 Ω, R_b = 20 Ω, R_c = 50 Ω. Find the\nequivalent wye.\n\n    Sum = 100 Ω\n    R_1 = R_bR_c/100 = (20)(50)/100 = 10 Ω\n    R_2 = R_aR_c/100 = (30)(50)/100 = 15 Ω\n    R_3 = R_aR_b/100 = (30)(20)/100 = 6 Ω\n\n---\n\n**P5.** A single loop: 40 V source, then 5 Ω, then a 10 V source in opposition,\nthen 15 Ω. Find the current and check power balance.\n\nKVL clockwise:\n\n    40 − 5i − 10 − 15i = 0\n    30 = 20i    ⇒   i = 1.5 A\n\nPower: 40 V delivers 60 W; 10 V absorbs 15 W; resistors absorb\n1.5²(5) + 1.5²(15) = 11.25 + 33.75 = 45 W.\nCheck: −60 + 15 + 45 = 0 ✓\n\n---\n\n**P6.** Nodal analysis. Node 1 has a 5 A source in, 4 Ω to ground, and 2 Ω to\nnode 2. Node 2 has 8 Ω to ground. Find V_1 and V_2.\n\n    Node 1: V_1/4 + (V_1 − V_2)/2 = 5\n    Node 2: (V_2 − V_1)/2 + V_2/8 = 0\n\nFrom node 2: 4V_2 − 4V_1 + V_2 = 0 ⇒ 5V_2 = 4V_1 ⇒ V_2 = 0.8V_1\nNode 1 ×4: V_1 + 2V_1 − 2V_2 = 20 ⇒ 3V_1 − 1.6V_1 = 20 ⇒ 1.4V_1 = 20\n\n    V_1 = 14.29 V,   V_2 = 11.43 V\n\nCheck node 1: 14.29/4 + (14.29−11.43)/2 = 3.571 + 1.429 = 5.0 ✓\n\n---\n\n**P7.** Supernode. Nodes 1 and 2 are joined by a 6 V source (+ at 1). Node 1 has\n5 Ω to ground, node 2 has 10 Ω to ground, and a 4 A source feeds node 2.\n\n    Supernode: V_1/5 + V_2/10 = 4\n    Constraint: V_1 − V_2 = 6  ⇒  V_1 = V_2 + 6\n\n    (V_2 + 6)/5 + V_2/10 = 4\n    2(V_2 + 6) + V_2 = 40\n    3V_2 = 28    ⇒   V_2 = 9.333 V,  V_1 = 15.333 V\n\nCheck: 15.333/5 + 9.333/10 = 3.067 + 0.933 = 4.0 ✓\n\n---\n\n**P8.** Mesh analysis. Mesh 1: 20 V source, 3 Ω, shared 6 Ω. Mesh 2: shared 6 Ω,\n9 Ω. Find both mesh currents and the current in the 6 Ω.\n\n    (3+6)i_1 − 6i_2 = 20\n    −6i_1 + (6+9)i_2 = 0   ⇒   i_1 = 2.5 i_2\n\n    9(2.5i_2) − 6i_2 = 20  ⇒  22.5i_2 − 6i_2 = 20  ⇒  16.5i_2 = 20\n    i_2 = 1.212 A,   i_1 = 3.030 A\n    i_6 = i_1 − i_2 = 1.818 A\n\nCheck mesh 1: 20 − 3(3.030) − 6(1.818) = 20 − 9.091 − 10.909 = 0 ✓\n\n---\n\n**P9.** Supermesh. Meshes 1 and 2 share a 3 A source (from mesh 2 into mesh 1).\nMesh 1 has a 15 V source and 4 Ω; mesh 2 has 5 Ω and 6 Ω.\n\n    Constraint: i_1 − i_2 = 3\n    Supermesh: 15 − 4i_1 − 5i_2 − 6i_2 = 0  ⇒  15 − 4i_1 − 11i_2 = 0\n\n    15 − 4(i_2 + 3) − 11i_2 = 0\n    15 − 4i_2 − 12 − 11i_2 = 0\n    3 = 15i_2    ⇒   i_2 = 0.2 A,   i_1 = 3.2 A\n\nCheck: 15 − 4(3.2) − 11(0.2) = 15 − 12.8 − 2.2 = 0 ✓\n\n---\n\n**P10.** Superposition. A 30 V source through 6 Ω and a 3 A source both feed a\nnode that has 12 Ω to ground. Find the node voltage.\n\n*30 V alone* (3 A opened): V' = 30 × 12/(6+12) = 20 V\n*3 A alone* (30 V shorted): 6 ∥ 12 = 4 Ω, so V'' = 3 × 4 = 12 V\n\n    V = 20 + 12 = 32 V\n\nCheck by nodal: (V−30)/6 + V/12 = 3 ⇒ 2V − 60 + V = 36 ⇒ 3V = 96 ⇒ V = 32 ✓\n\n---\n\n**P11.** Using P10's answer, find the power in the 12 Ω — and show why adding\nthe two individual powers is wrong.\n\n    P = V²/R = 32²/12 = 1024/12 = 85.3 W\n\nNaive sum: 20²/12 + 12²/12 = 33.3 + 12 = 45.3 W — **wrong**, because power is\nquadratic. Superpose voltage, then square.\n\n---\n\n**P12.** Source transformation. A 36 V source in series with 12 Ω is in parallel\nwith a 1 A source and 6 Ω. Reduce to a single practical source.\n\n    36 V/12 Ω → 3 A ∥ 12 Ω\n    Parallel current sources: 3 + 1 = 4 A\n    12 ∥ 6 = 4 Ω\n\n    Equivalent: 4 A ∥ 4 Ω,  or  16 V in series with 4 Ω\n\n---\n\n**P13.** Thévenin. A 48 V source in series with 8 Ω, with 24 Ω across the output\nterminals a–b. Find V_th, R_th, and the current into a 10 Ω load.\n\n    V_th = 48 × 24/(8+24) = 48 × 0.75 = 36 V\n    R_th = 8 ∥ 24 = 192/32 = 6 Ω\n    I_L = 36/(6+10) = 2.25 A\n\nDirect check: with 10 Ω connected, 24 ∥ 10 = 240/34 = 7.059 Ω; total 15.059 Ω;\nsource current 48/15.059 = 3.188 A; node voltage 3.188 × 7.059 = 22.5 V;\nI_10 = 22.5/10 = 2.25 A ✓\n\n---\n\n**P14.** Norton. Give the Norton equivalent of P13's network and verify\nconsistency.\n\n    I_N = V_th/R_th = 36/6 = 6 A,  R_N = 6 Ω\n\nDirect check of I_sc: shorting a–b removes the 24 Ω, so I_sc = 48/8 = 6 A ✓\nLoad current by divider: 6 × 6/(6+10) = 2.25 A ✓\n\n---\n\n**P15.** Thévenin by V_oc/I_sc. A network gives V_oc = 20 V and, when shorted,\nI_sc = 5 A. A 6 Ω load is connected. Find the load power.\n\n    R_th = 20/5 = 4 Ω\n    I_L = 20/(4+6) = 2 A\n    P_L = 2²(6) = 24 W\n\n---\n\n**P16.** Maximum power transfer. For the network of P13 (V_th = 36 V,\nR_th = 6 Ω), find R_L for maximum power, that power, and the efficiency.\n\n    R_L = 6 Ω\n    P_max = V_th²/(4R_th) = 1296/24 = 54 W\n    Check: I = 36/12 = 3 A, P = 9 × 6 = 54 W ✓\n    R_th also dissipates 54 W, so η = 50%\n\nCompare with the 10 Ω load of P13: P = 2.25²(10) = 50.6 W, which is 94% of the\nmaximum despite a 1.67:1 mismatch — the flat-peak effect.\n\n---\n\n**P17.** Thévenin with a dependent source. A network consists of a 10 V source\nin series with 2 Ω to node x, a 4 Ω from x to ground, and a VCCS from x to\nground of value 0.25v_x, where v_x is the node-x voltage. Terminals a–b are at\nnode x.\n\n*V_th* (terminals open):\n\n    (v_x − 10)/2 + v_x/4 + 0.25v_x = 0\n    Multiply by 4:  2v_x − 20 + v_x + v_x = 0\n    4v_x = 20   ⇒   V_th = 5 V\n\n*R_th* by test source: deactivate the 10 V (short), apply 1 V at a–b.\n\n    v_x = 1 V (terminals are node x)\n    Current drawn from the test source = 1/2 + 1/4 + 0.25(1) = 0.5+0.25+0.25 = 1 A\n    R_th = 1/1 = 1 Ω\n\n*Check by V_oc/I_sc:* shorting a–b forces v_x = 0, so the dependent source\ncontributes nothing and I_sc = 10/2 = 5 A. Then R_th = 5/5 = 1 Ω ✓\n\nNote that naive reduction would give 2 ∥ 4 = 1.33 Ω — wrong, because it deletes\nthe dependent source.\n\n---\n\n**P18.** Millman. Three practical sources in parallel: 20 V/5 Ω, 10 V/2 Ω, and\n5 V/10 Ω. Find the equivalent, then the current into a 4 Ω load.\n\n    Numerator = 20/5 + 10/2 + 5/10 = 4 + 5 + 0.5 = 9.5\n    Denominator = 1/5 + 1/2 + 1/10 = 0.2 + 0.5 + 0.1 = 0.8\n    V_eq = 9.5/0.8 = 11.875 V,   R_eq = 1/0.8 = 1.25 Ω\n    I_L = 11.875/(1.25 + 4) = 11.875/5.25 = 2.262 A\n\n---\n\n**P19.** AC. A 100∠0° V (amplitude) source at ω = 1000 rad/s drives 30 Ω in\nseries with 40 mH. Find Z, the current phasor, and the real power.\n\n    X_L = ωL = 1000 × 0.04 = 40 Ω\n    Z = 30 + j40 = 50∠53.13° Ω\n    I = 100∠0°/50∠53.13° = 2∠−53.13° A  (amplitude)\n\nReal power (amplitude phasors, so use ½):\n\n    P = ½|I|²R = ½(4)(30) = 60 W\n\nPower factor = cos 53.13° = 0.6 lagging.\n\n---\n\n**P20.** AC maximum power. A source has V_th = 60∠0° V amplitude and\nZ_th = 5 + j12 Ω. Find Z_L for maximum power and the power delivered. Then find\nthe best purely resistive load and the power it would receive.\n\n*Conjugate match:*\n\n    Z_L = 5 − j12 Ω\n    Total Z = 10 Ω\n    I = 60/10 = 6 A amplitude\n    P = ½(36)(5) = 90 W\n    Check: P_max = |V_th|²/(8R_th) = 3600/40 = 90 W ✓\n\n*Purely resistive load:*\n\n    R_L = |Z_th| = √(25 + 144) = 13 Ω\n    Total Z = 18 + j12, |Z| = √(324+144) = √468 = 21.633 Ω\n    |I| = 60/21.633 = 2.773 A\n    P = ½(2.773)²(13) = ½(7.691)(13) = 50.0 W\n\nThe resistive-only load gets 50 W against 90 W available — a 44% shortfall.\nCancelling the reactance is worth a great deal.\n\n---\n\n## Self-assessment\n\n| Struggled on | Revisit |\n|---|---|\n| P1, P5 | Module 01 (sign convention), 04 |\n| P2, P3, P4 | Module 03 |\n| P6, P7 | Module 05 |\n| P8, P9 | Module 06 |\n| P10, P11 | Module 07 |\n| P12 | Module 08 |\n| P13, P14, P15, P17 | Modules 09–10 |\n| P16 | Module 11 |\n| P18 | Module 12 |\n| P19, P20 | Module 13 |\n\nSixteen or more unaided means you are exam-ready. Fewer than ten means go back\nto Modules 04–06: almost every later failure traces to shaky nodal or mesh work.\n"}];
const KEY = "pgdee-em-read";
let read = new Set();
try { read = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...read])); } catch(e) {} }

const list = document.getElementById("modlist");
const sel  = document.getElementById("sel");
let cur = 0;

MODS.forEach((m,i)=>{
  const li = document.createElement("li");
  const b  = document.createElement("button");
  b.innerHTML = '<span class="modnum">'+m.num+'</span><span>'+m.title+'</span><span class="tick">&#10003;</span>';
  b.onclick = ()=>show(i);
  li.appendChild(b); list.appendChild(li);
  const o = document.createElement("option");
  o.value = i; o.textContent = m.num + " · " + m.title;
  sel.appendChild(o);
});
sel.onchange = e => show(+e.target.value);

function show(i){
  cur = i;
  const m = MODS[i];
  document.getElementById("eyebrow").textContent =
    m.num === "00" ? "Orientation" : "Module " + m.num;
  document.getElementById("doctitle").textContent = m.title;
  const doc = document.getElementById("doc");
  doc.innerHTML = mdToHtml(m.body);
  doc.querySelectorAll("table").forEach(t=>{
    const w = document.createElement("div");
    w.className = "tablewrap";
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });

  [...list.querySelectorAll("button")].forEach((b,j)=>{
    b.setAttribute("aria-current", j===i ? "true" : "false");
    b.parentNode.classList.toggle("done", read.has(MODS[j].num));
  });
  sel.value = i;

  const rb = document.getElementById("readbtn");
  const isRead = read.has(m.num);
  rb.setAttribute("aria-pressed", isRead ? "true" : "false");
  rb.textContent = isRead ? "✓  Marked as read" : "Mark this module read";
  rb.onclick = ()=>{ read.has(m.num) ? read.delete(m.num) : read.add(m.num); save(); show(i); };

  const p = document.getElementById("prev"), n = document.getElementById("next");
  p.disabled = i===0; n.disabled = i===MODS.length-1;
  document.getElementById("prevt").textContent = i>0 ? MODS[i-1].title : "—";
  document.getElementById("nextt").textContent = i<MODS.length-1 ? MODS[i+1].title : "—";
  p.onclick = ()=>show(i-1); n.onclick = ()=>show(i+1);

  window.scrollTo(0,0);
}

document.addEventListener("keydown", e=>{
  if(e.target.tagName === "SELECT") return;
  if(e.key === "ArrowRight" && cur < MODS.length-1) show(cur+1);
  if(e.key === "ArrowLeft"  && cur > 0) show(cur-1);
});

show(0);
</script>

</html>
