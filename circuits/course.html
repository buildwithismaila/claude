<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --sidebar:#EDF1F3;
  --ink:#17212B; --ink-soft:#5A6975; --ink-faint:#8695A1;
  --rule:#D9E1E6; --rule-soft:#E7EDF0;
  --copper:#A2542A; --copper-soft:#F3E7DE;
  --teal:#186A7B; --teal-soft:#E0EEF1;
  --shadow:0 1px 2px rgba(23,33,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
    --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
    --rule:#22303A; --rule-soft:#1A252E;
    --copper:#DC8B57; --copper-soft:#2A1D14;
    --teal:#54B4C6; --teal-soft:#122730;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
  --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
  --rule:#22303A; --rule-soft:#1A252E;
  --copper:#DC8B57; --copper-soft:#2A1D14;
  --teal:#54B4C6; --teal-soft:#122730;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16px; line-height:1.65;
  display:grid; grid-template-columns:272px 1fr; min-height:100vh;
}
::selection{background:var(--copper-soft); color:var(--ink)}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--copper); outline-offset:2px; border-radius:2px}

/* ---------- sidebar ---------- */
#nav{
  background:var(--sidebar); border-right:1px solid var(--rule);
  padding:26px 0 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
}
.brand{padding:0 22px 20px; border-bottom:1px solid var(--rule); margin-bottom:14px}
.brand h1{
  font-size:19px; line-height:1.2; margin:0 0 6px; font-weight:700;
  letter-spacing:-.01em; text-wrap:balance;
}
.brand p{margin:0; font-size:12px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase}
.seclabel{
  padding:0 22px; margin:18px 0 8px; font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-faint); font-weight:600;
}
.modlist{list-style:none; margin:0; padding:0}
.modlist button{
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  display:grid; grid-template-columns:26px 1fr 16px; gap:9px; align-items:baseline;
  padding:7px 22px; font:inherit; font-size:14px; color:var(--ink-soft);
  border-left:2px solid transparent;
}
.modlist button:hover{background:var(--rule-soft); color:var(--ink)}
.modlist button[aria-current="true"]{
  color:var(--ink); font-weight:600; border-left-color:var(--copper); background:var(--rule-soft);
}
.modnum{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.modlist button[aria-current="true"] .modnum{color:var(--copper)}
.tick{font-size:12px; color:var(--teal); opacity:0; transition:opacity .15s}
.done .tick{opacity:1}
.done .modnum{text-decoration:line-through}

/* ---------- reading column ---------- */
main{padding:0; min-width:0}
.sheet{
  background:var(--surface); border-left:0; min-height:100vh;
  padding:46px 56px 96px; max-width:none;
}
.wrap{max-width:74ch; margin:0 auto}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--copper); margin:0 0 8px;
}
h2.doctitle{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700;
  font-size:38px; line-height:1.1; letter-spacing:-.02em; margin:0 0 6px; text-wrap:balance;
}
.rule{height:1px; background:var(--rule); margin:26px 0 32px}

#doc h2{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:23px; font-weight:600;
  letter-spacing:-.01em; margin:44px 0 12px; padding-top:14px;
  border-top:1px solid var(--rule-soft); text-wrap:balance;
}
#doc h3{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:17px; font-weight:600;
  margin:28px 0 8px; color:var(--ink);
}
#doc p{margin:0 0 14px}
#doc strong{font-weight:600}
#doc ul,#doc ol{margin:0 0 16px; padding-left:22px}
#doc li{margin:0 0 6px}
#doc hr{border:0; border-top:1px solid var(--rule); margin:34px 0}

/* formulas + code */
#doc code{
  font-family:"IBM Plex Mono",monospace; font-size:.87em;
  background:var(--rule-soft); padding:1px 5px; border-radius:3px;
}
#doc pre{
  font-family:"IBM Plex Mono",monospace; font-size:13.5px; line-height:1.6;
  background:var(--surface); border:1px solid var(--rule);
  border-left:3px solid var(--copper);
  padding:14px 18px; overflow-x:auto; margin:0 0 18px; border-radius:0 3px 3px 0;
}
#doc pre code{background:none; padding:0; font-size:inherit}

/* blockquote = the "warning / think about this" voice */
#doc blockquote{
  margin:0 0 20px; padding:14px 18px; background:var(--teal-soft);
  border-left:3px solid var(--teal); font-style:normal;
}
#doc blockquote p:last-child{margin:0}

/* tables */
.tablewrap{overflow-x:auto; margin:0 0 20px}
#doc table{border-collapse:collapse; width:100%; font-size:14.5px}
#doc th{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600; text-align:left;
  font-size:12px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-soft);
  border-bottom:1px solid var(--rule); padding:8px 12px 6px;
}
#doc td{
  padding:8px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:top;
  font-variant-numeric:tabular-nums;
}
#doc tbody tr:last-child td{border-bottom:1px solid var(--rule)}


/* ---------- mathematical typesetting ---------- */
#doc sub, #doc sup{
  font-size:.68em; line-height:0; position:relative; font-feature-settings:"tnum";
  padding-left:.04em;
}
#doc sub{ bottom:-.22em }
#doc sup{ top:-.42em }

/* display equations */
#doc .eq{
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16.5px; line-height:2.15; white-space:pre-wrap;
  margin:22px auto; padding:2px 0; max-width:100%;
  width:max-content; text-align:left; overflow-x:auto;
  color:var(--ink);
}
#doc .eq sub{ bottom:-.2em }

/* matrices and determinants */
#doc .eqrow{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:26px auto; overflow-x:auto; font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16.5px;
}
#doc .eqlhs{ white-space:nowrap }
#doc .mat{ display:inline-block; position:relative; padding:2px 12px }
#doc .mat table{ border-collapse:collapse; width:auto; margin:0 }
#doc .mat table td,
#doc .mat tbody tr td,
#doc .mat tbody tr:last-child td{
  padding:5px 14px; text-align:center; border:0; white-space:nowrap;
  font-variant-numeric:normal; background:none;
}
#doc .mat::before, #doc .mat::after{
  content:""; position:absolute; top:0; bottom:0; width:1px; background:var(--ink);
}
#doc .mat::before{ left:0 } #doc .mat::after{ right:0 }
#doc .mat-bracket::before, #doc .mat-bracket::after{
  width:7px; background:none; border-top:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
}
#doc .mat-bracket::before{ border-left:1px solid var(--ink) }
#doc .mat-bracket::after{ border-right:1px solid var(--ink) }

@media (max-width:860px){
  #doc .eq, #doc .eqrow{ font-size:15px }
  #doc .mat td{ padding:4px 9px }
}

/* ---------- footer nav ---------- */
.pager{
  display:flex; gap:12px; justify-content:space-between; align-items:stretch;
  margin-top:52px; padding-top:22px; border-top:1px solid var(--rule);
}
.pager button{
  flex:1; text-align:left; background:var(--surface); border:1px solid var(--rule);
  padding:12px 16px; cursor:pointer; font-family:"IBM Plex Sans Condensed",sans-serif;
  color:var(--ink); font-size:15px; line-height:1.3;
}
.pager button:hover{border-color:var(--copper)}
.pager button:disabled{opacity:.35; cursor:default}
.pager button.next{text-align:right}
.pager span{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px}

.readbtn{
  display:inline-flex; align-items:center; gap:8px; margin-top:26px;
  background:none; border:1px solid var(--rule); color:var(--ink-soft);
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:13.5px;
  padding:8px 14px; cursor:pointer;
}
.readbtn:hover{border-color:var(--teal); color:var(--ink)}
.readbtn[aria-pressed="true"]{border-color:var(--teal); color:var(--teal); background:var(--teal-soft)}

/* ---------- mobile ---------- */
#mobsel{display:none}
@media (max-width:860px){
  body{grid-template-columns:1fr}
  #nav{display:none}
  #mobsel{
    display:block; position:sticky; top:0; z-index:5; background:var(--sidebar);
    border-bottom:1px solid var(--rule); padding:12px 18px;
  }
  #mobsel select{
    width:100%; font-family:"IBM Plex Sans Condensed",sans-serif; font-size:15px;
    padding:9px 10px; background:var(--surface); color:var(--ink);
    border:1px solid var(--rule); border-radius:2px;
  }
  .sheet{padding:28px 20px 72px}
  h2.doctitle{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
/* ---- Mathematical typesetting -------------------------------------------
   Turns the plain-text notation used in the source files into real typographic
   subscripts and superscripts:

     a_x        -> a with subscript x
     E_t1       -> E with subscript t1
     e^{-jBz}   -> e with superscript -jBz
     r2 / 10-12 written with Unicode super/subscript characters is normalised
     to the same markup, so one mechanism handles everything.

   Runs after bold/italic and before code spans are restored, so code stays
   literal.                                                                  */

const SUP_CHARS = { "⁰":"0","¹":"1","²":"2","³":"3","⁴":"4",
  "⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9",
  "⁻":"−","⁺":"+","ⁿ":"n" };
const SUB_CHARS = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4",
  "₅":"5","₆":"6","₇":"7","₈":"8","₉":"9",
  "₋":"−","₊":"+","ₓ":"x","ᵧ":"y" };

const SUP_RE = /[⁰¹²³⁴-⁹⁺⁻ⁿ]+/g;
const SUB_RE = /[₀-₉₊₋ₓᵧ]+/g;

/* letters (incl. Greek), digits, and a leading sign are allowed in a bare run */
const RUN = "[A-Za-z0-9\\u0370-\\u03FF]";

function normaliseUnicodeScripts(s){
  s = s.replace(SUP_RE, m => "^{" + Array.from(m).map(c => SUP_CHARS[c]).join("") + "}");
  s = s.replace(SUB_RE, m => "_{" + Array.from(m).map(c => SUB_CHARS[c]).join("") + "}");
  return s;
}

function applyScripts(s){
  s = s.replace(/\^\{([^{}]*)\}/g, (m,c) => "<sup>" + applyScripts(c) + "</sup>");
  s = s.replace(/_\{([^{}]*)\}/g,  (m,c) => "<sub>" + applyScripts(c) + "</sub>");
  s = s.replace(new RegExp("\\^(" + RUN + "+)", "g"), (m,c) => "<sup>" + c + "</sup>");
  s = s.replace(new RegExp("_("  + RUN + "+)", "g"), (m,c) => "<sub>" + c + "</sub>");
  return s;
}

function mathify(s){ return applyScripts(normaliseUnicodeScripts(s)); }

/* ---- Matrices ------------------------------------------------------------
   ```matrix
   lhs: A x B  =
   style: det          (det = vertical bars, bracket = square brackets)
   a_x ; a_y ; a_z
   A_x ; A_y ; A_z
   ```                                                                       */
function matrixToHtml(body, esc){
  let lhs = "", style = "det";
  const rows = [];
  body.split("\n").forEach(line => {
    if(!line.trim()) return;
    const d = line.match(/^\s*(lhs|style)\s*:\s*(.*)$/i);
    if(d){ if(d[1].toLowerCase() === "lhs") lhs = d[2]; else style = d[2].trim(); return; }
    rows.push(line.split(";").map(c => c.trim()));
  });
  const body_ = rows.map(r =>
    "<tr>" + r.map(c => "<td>" + mathify(esc(c)) + "</td>").join("") + "</tr>").join("");
  return '<div class="eqrow">' +
      (lhs ? '<span class="eqlhs">' + mathify(esc(lhs)) + "</span>" : "") +
      '<span class="mat mat-' + (style === "bracket" ? "bracket" : "det") + '">' +
      "<table>" + body_ + "</table></span></div>";
}

/* Minimal markdown renderer, inlined so the page has no external dependencies. */
function mdToHtml(src){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function inline(s){
    s = esc(s);
    const codes = [];
    s = s.replace(/`([^`]+)`/g, function(m,c){ codes.push(c); return "\u0001" + (codes.length-1) + "\u0002"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    s = mathify(s);
    s = s.replace(/\u0001(\d+)\u0002/g, function(m,i){ return "<code>" + codes[+i] + "</code>"; });
    return s;
  }
  // Prose reflows; notation blocks (formula sheet, equation runs) keep their line breaks.
  function joinLines(arr){
    const mathy = arr.filter(x => /[=|⇒⟺→∮∫∇×·√]/.test(x)).length;
    const sep = (arr.length > 1 && mathy >= arr.length / 2) ? "<br>" : " ";
    // Join first, then parse inline markup, so **bold** spanning a source line
    // break is still closed correctly. \u0004 stands in for the join point.
    return inline(arr.join("\u0004")).split("\u0004").join(sep);
  }
  const lines = String(src).replace(/\r\n?/g,"\n").split("\n");
  const blank = l => !l.trim();
  const startsBlock = l =>
    /^#{1,6}\s/.test(l) || /^>\s?/.test(l) || /^```/.test(l) ||
    /^(---|\*\*\*|___)\s*$/.test(l) || /^\s*[-*]\s+/.test(l) ||
    /^\s*\d+\.\s+/.test(l) || /^\s*\|/.test(l) || /^ {4}\S/.test(l);
  const out = [];
  let i = 0;
  while(i < lines.length){
    const l = lines[i];
    if(blank(l)){ i++; continue; }

    if(/^```/.test(l)){
      const isMatrix = /^```\s*matrix\b/.test(l);
      i++; const buf = [];
      while(i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(isMatrix ? matrixToHtml(buf.join("\n"), esc)
                        : "<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if(/^(---|\*\*\*|___)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }

    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; out.push("<h"+n+">" + inline(h[2]) + "</h"+n+">"); i++; continue; }

    if(/^\s*\|/.test(l) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      // "\\|" is an escaped pipe (e.g. |A| for magnitude), not a cell separator.
      const cells = r => r.trim().replace(/\\\|/g,"\u0003").replace(/^\|/,"").replace(/\|$/,"")
                          .split("|").map(c => c.trim().replace(/\u0003/g,"|"));
      const head = cells(l); i += 2; const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map(c => "<th>"+inline(c)+"</th>").join("") +
        "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>"+inline(c)+"</td>").join("") + "</tr>").join("") +
        "</tbody></table>");
      continue;
    }

    if(/^>\s?/.test(l)){
      const buf = [];
      while(i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,""));
      out.push("<blockquote>" + mdToHtml(buf.join("\n")) + "</blockquote>"); continue;
    }

    if(/^ {4}\S/.test(l)){
      const buf = [];
      while(i < lines.length && (/^ {4}/.test(lines[i]) ||
            (blank(lines[i]) && /^ {4}\S/.test(lines[i+1] || "")))){
        buf.push(lines[i].replace(/^ {4}/,"")); i++;
      }
      out.push('<div class="eq">' + mathify(esc(buf.join("\n"))) + "</div>"); continue;
    }

    if(/^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l)){
      const ordered = /^\s*\d+\.\s+/.test(l);
      const re = ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
      const items = [];
      while(i < lines.length && !blank(lines[i])){
        if(re.test(lines[i])){ items.push(lines[i].replace(re,"")); i++; }
        else if(/^\s+\S/.test(lines[i]) && items.length){ items[items.length-1] += "\n" + lines[i].trim(); i++; }
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push("<"+tag+">" + items.map(t => "<li>" + joinLines(t.split("\n")) + "</li>").join("") + "</"+tag+">");
      continue;
    }

    const buf = [];
    while(i < lines.length && !blank(lines[i]) && !startsBlock(lines[i])){ buf.push(lines[i]); i++; }
    if(!buf.length){ buf.push(lines[i]); i++; }
    out.push("<p>" + joinLines(buf) + "</p>");
  }
  return out.join("\n");
}

const MODS = [{"num": "00", "title": "Start Here", "body": "\n**Course:** Circuit Theorems I — Postgraduate Diploma in Electrical/Electronic\nEngineering.\n\nThis is a from-scratch course. The prerequisite material — network analysis —\nis **taught here in Modules 01–06**, not assumed. If you already have it, skim\nthose and start at Module 07.\n\n## What this subject is actually for\n\nReal circuits have dozens of elements. Writing one equation per element gives\nyou an unsolvable mess. The whole of circuit theory is a set of legal moves for\n**replacing a complicated thing with a simpler thing that behaves identically at\nthe terminals you care about**.\n\nThat sentence is the course. Every theorem here — Thévenin, Norton,\nsuperposition, source transformation, maximum power transfer — is one such\nlegal move. Learn what each one is allowed to do, and what it destroys.\n\nThe phrase \"at the terminals you care about\" is doing heavy lifting, and is\nwhere most marks are lost. A Thévenin equivalent reproduces the original\nnetwork's behaviour **only** at the two terminals you extracted it from. Internal\nvoltages, internal currents, and internal power dissipation are all wrong. More\non this in Module 09; it is the single most common misunderstanding in the\nsubject.\n\n## Prerequisites\n\nYou need secondary-school algebra and the ability to solve simultaneous linear\nequations (2×2 and 3×3 by hand). Calculus is **not** required until Module 13,\nand even there only lightly.\n\nEverything electrical is built up from scratch:\n\n| You need | Taught in |\n|---|---|\n| Charge, current, voltage, power, energy | Module 01 |\n| The passive sign convention | Module 01 — do not skip this |\n| Resistance, Ohm's law, sources | Module 02 |\n| Series/parallel reduction, dividers, delta–wye | Module 03 |\n| Kirchhoff's current and voltage laws | Module 04 |\n| Nodal analysis | Module 05 |\n| Mesh analysis | Module 06 |\n\n## Course map\n\n| Module | Title | Role |\n|---|---|---|\n| 01 | Electrical quantities and sign conventions | Prerequisite |\n| 02 | Circuit elements, Ohm's law, sources | Prerequisite |\n| 03 | Series–parallel reduction and dividers | Prerequisite |\n| 04 | Kirchhoff's laws | Prerequisite |\n| 05 | Nodal analysis | Network analysis |\n| 06 | Mesh analysis | Network analysis |\n| 07 | Linearity and superposition | **Theorem** |\n| 08 | Source transformation | **Theorem** |\n| 09 | Thévenin's theorem | **Theorem** |\n| 10 | Norton's theorem | **Theorem** |\n| 11 | Maximum power transfer | **Theorem** |\n| 12 | Millman, reciprocity, substitution, Tellegen | **Theorem** |\n| 13 | Applying the theorems to AC | Extension |\n| 14 | Formula sheet | Reference |\n| 15 | Problem set with full solutions | Practice |\n\n## The dependency chain\n\nNothing here is optional in the middle:\n\n    Sign convention → Ohm + KCL/KVL → Nodal/Mesh → Linearity\n                                                      ↓\n                    Superposition → Source transformation\n                                                      ↓\n                              Thévenin ⟷ Norton → Max power transfer\n\nSuperposition is what makes Thévenin legal. Thévenin is what makes maximum power\ntransfer computable. If a theorem ever feels arbitrary, the reason is almost\nalways that the link above it was skipped.\n\n## How to use this\n\nRead a module, then close it and rework its examples on blank paper **without\nlooking at the circuit description twice**. Circuit theory is not conceptually\nhard; it is bookkeeping-hard. The marks go to whoever keeps their signs and\nlabels straight under time pressure, and that is a trained skill, not an\nunderstood one.\n\nEvery module ends with exercises that have answers. Module 15 has 20 full\nproblems with complete solutions.\n\n## Notation used throughout\n\n- Uppercase V, I for DC or RMS values; lowercase v, i for instantaneous.\n- V_s, I_s for sources; V_th, R_th for Thévenin; I_N, R_N for Norton.\n- Ω for ohms, S for siemens, ∥ for \"in parallel with\".\n- R_1 ∥ R_2 means R_1R_2/(R_1 + R_2).\n"}, {"num": "01", "title": "Electrical Quantities and Sign Conventions", "body": "\n## 1.1 Charge and current\n\nCharge q is measured in coulombs (C). The electron carries −1.602×10⁻¹⁹ C.\n\n**Current** is the rate of flow of charge past a point:\n\n    i = dq/dt        [A = C/s]\n\nFor a steady flow, I = Q/t.\n\n**Conventional current** flows in the direction positive charge would move —\nopposite to actual electron drift. Every formula in this course uses\nconventional current. Electron flow is a physical fact you can safely forget.\n\nA current has **no meaning without a reference arrow**. \"The current is 3 A\" is\nincomplete; \"the current is 3 A in the direction of the arrow\" is complete. If\nthe arrow is drawn one way and the true flow is the other, the answer simply\ncomes out negative — and a negative current is a correct answer, not an error.\n\n## 1.2 Voltage\n\n**Voltage** (potential difference) between two points is the energy per unit\ncharge required to move charge between them:\n\n    v = dw/dq        [V = J/C]\n\nVoltage is always **between two points**. \"The voltage at node A\" is shorthand\nfor \"the voltage at A with respect to the reference node\". There is no such\nthing as an absolute voltage, only a difference.\n\nNotation: V_AB means the potential at A minus the potential at B.\n\n    V_AB = −V_BA        and       V_AB = V_A − V_B\n\nPolarity marks (+ and −) on a circuit diagram play the same role for voltage\nthat arrows play for current: they declare an assumed reference, not a fact.\n\n## 1.3 The passive sign convention — the most important rule in the course\n\n> **Passive sign convention:** current enters the element at its **+** terminal.\n\nWhen an element is labelled this way, then\n\n    p = vi\n\nis the power **absorbed** by that element.\n\n- p > 0 → the element is **absorbing** (dissipating or storing) power.\n- p < 0 → the element is **delivering** power to the rest of the circuit.\n\nIf current instead enters at the − terminal, then p = vi is the power\n**delivered**, or equivalently p = −vi is the power absorbed.\n\n**Why this matters so much.** Roughly half of all lost marks in circuit theory\nare sign errors, and most of those trace back to an element whose assumed\npolarity was never written on the diagram. The fix is mechanical: *before\ncalculating anything, draw the reference arrow and the ± marks on every element,\nand never change them.* If a value comes out negative, leave it negative and\ncarry it through. Re-drawing arrows halfway is how sign errors are born.\n\n### Conservation of power\n\nIn any circuit, at every instant,\n\n    Σ p_absorbed = 0\n\nEquivalently: power delivered by the sources equals power absorbed by everything\nelse. This is the single best check on a finished answer — total it up, and if\nit does not come to zero, you have a sign or arithmetic error somewhere.\n\n## 1.4 Energy\n\n    w = ∫ p dt        [J]\n\nFor constant power, W = Pt. The commercial unit is the kilowatt-hour:\n1 kWh = 1000 W × 3600 s = 3.6×10⁶ J.\n\n## 1.5 Units and prefixes\n\n| Quantity | Symbol | Unit | Unit symbol |\n|---|---|---|---|\n| Charge | q, Q | coulomb | C |\n| Current | i, I | ampere | A |\n| Voltage | v, V | volt | V |\n| Power | p, P | watt | W |\n| Energy | w, W | joule | J |\n| Resistance | R | ohm | Ω |\n| Conductance | G | siemens | S |\n\n| Prefix | Symbol | Factor |\n|---|---|---|\n| pico | p | 10⁻¹² |\n| nano | n | 10⁻⁹ |\n| micro | μ | 10⁻⁶ |\n| milli | m | 10⁻³ |\n| kilo | k | 10³ |\n| mega | M | 10⁶ |\n| giga | G | 10⁹ |\n\nNote the case: **m** is milli, **M** is mega — a factor of 10⁹ apart. And a\ncapital **G** is giga while an italic G is conductance.\n\n## 1.6 Worked examples\n\n**Example 1.** A charge of 12 C passes a point in 4 s. Find the current.\n\n    I = Q/t = 12/4 = 3 A\n\n**Example 2.** An element has 12 V across it with the + mark on the left, and\n2 A flowing into the left terminal. Find the power and say whether the element\nabsorbs or delivers.\n\nCurrent enters the + terminal ⇒ passive sign convention applies.\n\n    p = vi = 12 × 2 = 24 W    (absorbed)\n\nThe element absorbs 24 W. It is behaving as a load.\n\n**Example 3.** Same element, but the 2 A flows **out of** the + terminal.\n\nCurrent enters the − terminal, so p = vi is now the power *delivered*:\n\n    p_delivered = 12 × 2 = 24 W   ⇒   p_absorbed = −24 W\n\nThe element delivers 24 W. It is behaving as a source. This is exactly what a\nbattery being discharged does — and a battery being *charged* absorbs, which is\nwhy the same element can appear with either sign.\n\n**Example 4.** A circuit has three elements: a source delivering 50 W, a\nresistor absorbing 30 W, and a third element. Find the third element's power.\n\n    Σ p_absorbed = 0\n    (−50) + 30 + p_3 = 0   ⇒   p_3 = +20 W absorbed\n\n**Example 5.** A 60 W lamp runs for 8 hours. Find the energy in kWh and joules.\n\n    W = Pt = 60 × 8 = 480 Wh = 0.48 kWh\n    W = 0.48 × 3.6×10⁶ = 1.728×10⁶ J\n\n## 1.7 Exercises\n\n1. A current of 5 mA flows for 2 minutes. How much charge is transferred?\n   (0.6 C)\n2. An element absorbs 100 W with 20 V across it. Find the current, and state\n   which terminal it enters. (5 A, entering the + terminal)\n3. A battery delivers 24 W at 12 V while being discharged. Find the current.\n   Now the same battery is charged at 1.5 A at 12 V — what power does it absorb?\n   (2 A; 18 W)\n4. In a three-element circuit, element A absorbs −40 W and element B absorbs\n   25 W. Find element C's absorbed power. (15 W)\n5. Convert: 0.0047 A to mA; 2.2 MΩ to Ω; 470 pF to F.\n\n## Takeaways\n\n- Current needs an arrow, voltage needs ± marks. Both are *assumptions*, and a\n  negative answer means the assumption was backwards — which is fine.\n- Passive sign convention: current into +, then p = vi is absorbed power.\n- Σ p_absorbed = 0 across the whole circuit. Use it to check every answer.\n"}, {"num": "02", "title": "Circuit Elements, Ohm's Law and Sources", "body": "\n## 2.1 Resistance and Ohm's law\n\n    v = iR        R = v/i        [Ω]\n\nwith the passive sign convention assumed (current into the + terminal).\n\n**Conductance** is the reciprocal:\n\n    G = 1/R       i = Gv        [S]\n\nConductance is not just notational tidiness — parallel combinations add in\nconductance, which is why nodal analysis (Module 05) is naturally written in G.\n\n**Power in a resistor:**\n\n    p = vi = i²R = v²/R\n\nAll three forms are the same equation. Use whichever quantity you already know.\nNote p is always **positive** for a resistor: a resistor can only absorb. This\nis a useful sanity check — if your algebra hands you a negative resistor power,\nsomething upstream is wrong.\n\n### Resistivity\n\n    R = ρℓ/A\n\nwith ρ the resistivity (Ω·m), ℓ the length and A the cross-sectional area.\nCopper ρ ≈ 1.72×10⁻⁸ Ω·m. Doubling length doubles R; doubling diameter\nquarters it.\n\n### Two limiting cases\n\n| | R | v | i |\n|---|---|---|---|\n| **Short circuit** | 0 | 0 regardless of i | set by the rest of the circuit |\n| **Open circuit** | ∞ | set by the rest of the circuit | 0 regardless of v |\n\nThese two are worth stating explicitly because half of Thévenin/Norton practice\nconsists of deliberately short-circuiting or open-circuiting a pair of\nterminals and asking what survives.\n\n## 2.2 Independent sources\n\nAn **ideal independent voltage source** maintains a specified voltage across its\nterminals **whatever current flows through it**. The current is decided by the\nexternal circuit, not by the source.\n\nAn **ideal independent current source** pushes a specified current through its\nterminals **whatever voltage appears across it**. The voltage is decided by the\nexternal circuit.\n\nTwo consequences students routinely get wrong:\n\n- You **cannot** know the current through an ideal voltage source by looking at\n  the source. You must analyse the circuit around it.\n- You **cannot** know the voltage across an ideal current source by looking at\n  the source. Same reason.\n\n**Illegal connections.** Two unequal ideal voltage sources in parallel is a\ncontradiction (which voltage wins?). Two unequal ideal current sources in series\nis likewise a contradiction. Real circuits never contain these; exam questions\nsometimes do, as a trap.\n\n### Practical sources\n\nReal sources are not ideal. Model them as:\n\n- **Practical voltage source** = ideal V_s **in series** with R_s\n- **Practical current source** = ideal I_s **in parallel** with R_p\n\nThe terminal voltage of a practical voltage source **droops** with load:\n\n    V_terminal = V_s − I R_s\n\nA \"stiff\" source has R_s much smaller than the load resistance. A car battery\n(R_s ≈ 0.01 Ω) is stiff; a 9 V PP3 battery near end-of-life is not, which is why\nits terminal voltage collapses under load.\n\n## 2.3 Dependent (controlled) sources\n\nA dependent source's value is set by a voltage or current **elsewhere** in the\ncircuit. There are four types:\n\n| Type | Name | Relationship | Gain units |\n|---|---|---|---|\n| VCVS | Voltage-controlled voltage source | v = μ v_x | dimensionless |\n| VCCS | Voltage-controlled current source | i = g v_x | S |\n| CCVS | Current-controlled voltage source | v = r i_x | Ω |\n| CCCS | Current-controlled current source | i = β i_x | dimensionless |\n\nDrawn as a **diamond**, where independent sources are circles.\n\nDependent sources are how transistors, op-amps and amplifiers get represented,\nso they are not an exotic special case — they are the normal case in electronics.\n\n**Three rules that will save you:**\n\n1. A dependent source is **never** switched off when applying superposition\n   (Module 07). Only independent sources are.\n2. A dependent source is **never** switched off when finding R_th (Module 09).\n   You must use the test-source method instead.\n3. The controlling variable v_x or i_x must stay **inside** the network you are\n   analysing. If you extract a Thévenin equivalent that cuts between a dependent\n   source and its controlling variable, the result is meaningless.\n\n## 2.4 Worked examples\n\n**Example 1.** A 12 V source drives a 4 Ω resistor. Find I, P and G.\n\n    I = V/R = 12/4 = 3 A\n    P = I²R = 9 × 4 = 36 W   (check: P = V²/R = 144/4 = 36 W ✓)\n    G = 1/4 = 0.25 S\n\n**Example 2.** A practical source has V_s = 10 V, R_s = 2 Ω, and drives a 8 Ω\nload. Find the terminal voltage and the power lost internally.\n\n    I = 10/(2+8) = 1 A\n    V_terminal = 10 − 1(2) = 8 V\n    P_internal = I²R_s = 1 × 2 = 2 W\n    P_load = 1 × 8 = 8 W\n\nEfficiency = 8/10 = **80%**. Note the source's own resistance wastes 20% here.\nModule 11 shows that the *maximum power* condition is worse still — 50%.\n\n**Example 3.** A copper wire is 100 m long with cross-section 2.5 mm². Find R.\n\n    R = ρℓ/A = (1.72×10⁻⁸)(100)/(2.5×10⁻⁶) = 1.72×10⁻⁶/2.5×10⁻⁶\n    R = 0.688 Ω\n\n**Example 4.** In a circuit, a CCCS produces 4i_x where i_x = 0.5 A is the\ncurrent in a nearby branch. What current does the dependent source supply?\n\n    i = 4 × 0.5 = 2 A\n\nIf i_x later turns out to be −0.5 A, the dependent source supplies −2 A — it\nfollows its controller, including the sign.\n\n## 2.5 Exercises\n\n1. A resistor dissipates 20 W with 2 A through it. Find R and V. (5 Ω, 10 V)\n2. A 100 Ω and a 25 Ω resistor each have 10 V across them. Which dissipates\n   more, and by what factor? (The 25 Ω, by 4×)\n3. A practical current source of 2 A with R_p = 50 Ω drives a 50 Ω load. Find\n   the load current and the fraction of the source current that is \"lost\".\n   (1 A; half)\n4. Explain why two ideal 5 V sources may be connected in parallel but a 5 V and\n   a 6 V source may not.\n5. An aluminium wire (ρ = 2.82×10⁻⁸ Ω·m) must have the same resistance as the\n   copper wire of Example 3. What cross-section does it need? (4.1 mm²)\n\n## Takeaways\n\n- Ohm's law needs the passive sign convention to be unambiguous.\n- Ideal voltage sources fix v and let the circuit decide i; ideal current sources\n  do the opposite. Never assume either one's unknown quantity.\n- Practical sources are ideal ones plus a series (or parallel) resistance — and\n  that resistance is exactly what becomes R_th in Module 09.\n- Dependent sources are never deactivated. Remember this now; it is the most\n  common single error in Thévenin problems.\n"}, {"num": "03", "title": "Series–Parallel Reduction and Dividers", "body": "\n## 3.1 What \"in series\" and \"in parallel\" actually mean\n\nTwo elements are **in series** if they share exactly one node and **nothing else\nconnects to that node**. Same current must flow through both.\n\nTwo elements are **in parallel** if they are connected between **the same pair of\nnodes**. Same voltage must appear across both.\n\nThat second half of the series definition — *nothing else connects to that node*\n— is the part people drop, and it is what makes bridge circuits (§3.5) resist\nseries–parallel reduction entirely.\n\n## 3.2 Series and parallel resistance\n\n**Series** (currents equal, voltages add):\n\n    R_eq = R_1 + R_2 + … + R_n\n\n**Parallel** (voltages equal, currents add):\n\n    1/R_eq = 1/R_1 + 1/R_2 + … + 1/R_n\n    G_eq = G_1 + G_2 + … + G_n\n\nFor exactly two in parallel, the product-over-sum shortcut:\n\n    R_eq = R_1R_2 / (R_1 + R_2)        written R_1 ∥ R_2\n\nFor n **equal** resistors in parallel, R_eq = R/n.\n\nTwo useful sanity checks:\n- Series R_eq is always **larger** than the largest resistor.\n- Parallel R_eq is always **smaller** than the smallest resistor.\n\nIf your answer violates either, stop and recheck — this catches a surprising\nnumber of arithmetic slips.\n\n## 3.3 Voltage divider\n\nFor resistors in **series** carrying the same current, the source voltage splits\nin proportion to resistance:\n\n    V_k = V_s · R_k / (R_1 + R_2 + … + R_n)\n\nFor the two-resistor case:\n\n    V_1 = V_s R_1/(R_1+R_2)        V_2 = V_s R_2/(R_1+R_2)\n\n**Condition for use:** the divider must be *unloaded*, or the load must be\nincluded in the calculation. Hanging a load R_L across R_2 means you must first\nreplace R_2 by R_2 ∥ R_L. Forgetting this is the classic \"my potentiometer\ndoesn't give the voltage I calculated\" mistake.\n\n## 3.4 Current divider\n\nFor resistors in **parallel** sharing the same voltage, current splits in\nproportion to **conductance** — i.e. inversely with resistance:\n\n    I_k = I_s · G_k / (G_1 + … + G_n)\n\nFor the two-resistor case, note the deliberately surprising cross-over:\n\n    I_1 = I_s R_2/(R_1+R_2)        I_2 = I_s R_1/(R_1+R_2)\n\nThe current through R_1 depends on R_2 — more current takes the easier path.\nCompare with the voltage divider, where V_1 depends on R_1. **Getting these two\nthe wrong way round is the most common error in the whole module**; the way to\nkeep them straight is to reason from the physics (current prefers low\nresistance) rather than to memorise which symbol goes on top.\n\n## 3.5 Ladder reduction\n\nTo find the resistance seen at a pair of terminals, work **from the far end\nback toward the terminals**, collapsing series and parallel pairs one at a time.\nRedraw after every step. Do not try to do two steps in your head.\n\n**Example.** Find R_eq at terminals a–b:\n6 Ω in series with (4 Ω parallel with (8 Ω in series with 8 Ω)).\n\n    Innermost: 8 + 8 = 16 Ω\n    Then: 4 ∥ 16 = (4)(16)/20 = 3.2 Ω\n    Then: 6 + 3.2 = 9.2 Ω\n\n## 3.6 Delta–wye (Δ–Y, or π–T) transformation\n\nSome networks — the Wheatstone bridge above all — contain no two resistors that\nare purely in series or purely in parallel. Series–parallel reduction stalls.\nThe Δ–Y transformation is the way out.\n\n**Delta to wye** (each wye resistor = product of the two adjacent deltas over the\nsum of all three):\n\n    R_1 = R_b R_c / (R_a + R_b + R_c)\n    R_2 = R_a R_c / (R_a + R_b + R_c)\n    R_3 = R_a R_b / (R_a + R_b + R_c)\n\n**Wye to delta** (each delta resistor = sum of pairwise products over the\nopposite wye):\n\n    R_a = (R_1R_2 + R_2R_3 + R_3R_1) / R_1\n    R_b = (R_1R_2 + R_2R_3 + R_3R_1) / R_2\n    R_c = (R_1R_2 + R_2R_3 + R_3R_1) / R_3\n\n**Balanced special case:** if all three deltas are equal to R_Δ, then all three\nwye resistors equal R_Δ/3. And conversely R_Δ = 3R_Y. Worth memorising — it\nappears constantly in three-phase work.\n\n### Wheatstone bridge\n\nA bridge is **balanced** when no current flows in the detector branch, which\nhappens when\n\n    R_1/R_2 = R_3/R_4        (opposite products equal: R_1R_4 = R_2R_3)\n\nAt balance the middle branch can be removed (or shorted — either, since it\ncarries no current and has no voltage across it), and the rest reduces by\nseries–parallel. If the bridge is **not** balanced, use Δ–Y, or fall back on\nnodal or mesh analysis.\n\n## 3.7 Worked examples\n\n**Example 1.** Find the equivalent resistance of 12 Ω ∥ 4 Ω, then in series\nwith 5 Ω.\n\n    12 ∥ 4 = (12)(4)/16 = 3 Ω\n    R_eq = 3 + 5 = 8 Ω\n\nCheck: parallel result 3 Ω is smaller than the smaller resistor (4 Ω) ✓\n\n**Example 2.** A 24 V source feeds 3 Ω in series with 9 Ω. Find the voltage\nacross the 9 Ω, then repeat with a 18 Ω load across the 9 Ω.\n\nUnloaded:\n\n    V_9 = 24 × 9/12 = 18 V\n\nLoaded: replace 9 Ω by 9 ∥ 18 = (9)(18)/27 = 6 Ω\n\n    V_out = 24 × 6/(3+6) = 24 × 6/9 = 16 V\n\nThe load pulled the output down from 18 V to 16 V. That droop is precisely what\nthe Thévenin resistance of the divider predicts (Module 09).\n\n**Example 3.** A 10 A source feeds 2 Ω in parallel with 8 Ω. Find both currents.\n\n    I_2 = 10 × 8/(2+8) = 8 A\n    I_8 = 10 × 2/(2+8) = 2 A\n\nCheck: they sum to 10 A ✓, and the larger current is in the smaller resistor ✓\n\n**Example 4.** A delta of three 15 Ω resistors. Find the equivalent wye.\n\n    R_Y = R_Δ/3 = 5 Ω each\n\n**Example 5.** A bridge has R_1 = 100 Ω, R_2 = 200 Ω, R_3 = 150 Ω. Find R_4 for\nbalance.\n\n    R_1R_4 = R_2R_3  ⇒  R_4 = (200)(150)/100 = 300 Ω\n\n## 3.8 Exercises\n\n1. Find R_eq for 6 Ω ∥ 3 Ω ∥ 2 Ω. (1 Ω)\n2. Three resistors 10 Ω, 20 Ω, 30 Ω in series across 120 V. Find each voltage.\n   (20 V, 40 V, 60 V)\n3. A current divider splits 6 A between 5 Ω and 20 Ω. Find both. (4.8 A, 1.2 A)\n4. Convert a wye of 10 Ω, 20 Ω, 30 Ω into the equivalent delta.\n   (R_a = 110 Ω, R_b = 55 Ω, R_c = 36.67 Ω)\n5. Why can a balanced bridge's middle branch be either removed *or* shorted with\n   no change to the rest of the circuit?\n\n## Takeaways\n\n- Series shares current, parallel shares voltage — and \"series\" requires that\n  nothing else taps the shared node.\n- Voltage divider: V_1 ∝ R_1. Current divider: I_1 ∝ R_2. Reason it out from\n  \"current takes the easy path\" rather than memorising.\n- A loaded divider is a different divider. Fold the load in first.\n- Δ–Y is the escape hatch when nothing is in series or parallel. R_Δ = 3R_Y when\n  balanced.\n"}, {"num": "04", "title": "Kirchhoff's Laws", "body": "\nOhm's law describes one element. Kirchhoff's laws describe how elements\n**constrain each other** once wired together. Together they are sufficient to\nsolve any lumped circuit — everything later in this course is a shortcut built\non top of them.\n\n## 4.1 Vocabulary\n\n- **Node** — a point where two or more elements meet. An *essential node* joins\n  three or more.\n- **Branch** — a single element (or unbroken series chain) between two nodes.\n- **Loop** — any closed path that returns to its start without passing any node\n  twice.\n- **Mesh** — a loop containing no other loop inside it. Only planar circuits\n  have meshes.\n\nA wire with no element in it is **not** a new node — both its ends are the\n*same* node. Redrawing a circuit to collapse wires into single nodes before\nstarting is often the single most useful step.\n\n## 4.2 Kirchhoff's Current Law (KCL)\n\n> The algebraic sum of currents entering any node is zero.\n\n    Σ i_in = 0        or equivalently        Σ i_in = Σ i_out\n\n**Why it is true:** charge cannot accumulate at a node. A node is an idealised\npoint with no capacity to store charge, so whatever flows in must flow out at\nthe same instant.\n\nKCL also applies to any **closed surface** drawn around a group of nodes (a\n\"supernode\" or \"Gaussian surface\" argument). That generalisation is what makes\nsupernodes work in Module 05.\n\n## 4.3 Kirchhoff's Voltage Law (KVL)\n\n> The algebraic sum of voltages around any closed loop is zero.\n\n    Σ v = 0\n\n**Why it is true:** voltage is potential difference. Walking a closed loop\nreturns you to your starting potential, so the rises and drops must cancel.\n\n**Applying it without sign errors — a fixed procedure:**\n\n1. Choose a loop direction (clockwise is a fine default; keep it for all loops).\n2. Walk the loop. At each element, write the sign of the terminal you **enter\n   first**.\n3. Enter at − and leave at + → that is a **rise**, write +v. Enter at + → a\n   **drop**, write −v.\n4. Set the total to zero.\n\nFor a resistor with assumed current i, walking *with* the current gives a drop\nof −iR; walking *against* it gives +iR.\n\nDo it the same way every time and the signs stop being a source of error.\n\n## 4.4 The branch-current method\n\nThe most direct application of the two laws, and the conceptual ancestor of\nnodal and mesh analysis.\n\n1. Label a current in every branch, with an arrow.\n2. Write KCL at every essential node **except one** (the last is redundant — it\n   is implied by the others).\n3. Write KVL around enough loops to reach as many equations as unknowns.\n4. Solve.\n\nFor a circuit with b branches and n nodes, you need b equations:\n(n − 1) from KCL, and b − (n − 1) from KVL.\n\nThis method works always but generates many unknowns. Nodal and mesh analysis\n(Modules 05–06) are systematic ways of reducing the count before you start.\n\n## 4.5 Worked examples\n\n**Example 1.** Three branches meet at a node. 5 A enters, 2 A leaves. Find the\nthird branch current and its direction.\n\n    Σ i_in = 0:   5 − 2 − i_3 = 0   ⇒   i_3 = 3 A leaving\n\n**Example 2.** A single loop contains a 20 V source, and resistors 3 Ω, 5 Ω and\n2 Ω in series. Find the current and the voltage across each resistor.\n\nKVL clockwise, current i assumed clockwise from the + terminal of the source:\n\n    20 − 3i − 5i − 2i = 0\n    20 = 10i     ⇒   i = 2 A\n\n    V_3 = 6 V,  V_5 = 10 V,  V_2 = 4 V     (sum = 20 V ✓)\n\n**Example 3 (two sources, opposing).** A loop contains a 12 V source and a 4 V\nsource connected in opposition, with 2 Ω and 6 Ω in series. Find i.\n\nTake clockwise, entering the 12 V at − (a rise) and the 4 V at + (a drop):\n\n    12 − 2i − 4 − 6i = 0\n    8 = 8i      ⇒   i = 1 A\n\nPower check:\n- 12 V source delivers 12 × 1 = 12 W\n- 4 V source **absorbs** 4 × 1 = 4 W (it is being charged)\n- Resistors absorb 1²(2) + 1²(6) = 8 W\n- Total absorbed: −12 + 4 + 8 = 0 ✓\n\n**Example 4 (branch-current method).** Two sources, one shared branch.\nV_1 = 10 V in series with 2 Ω on the left; V_2 = 6 V in series with 3 Ω on the\nright; a 4 Ω resistor connects the common node to the common reference.\n\nLet i_1 flow in from the left branch, i_2 in from the right, and i_3 down\nthrough the 4 Ω.\n\nKCL at the top node:\n\n    i_1 + i_2 = i_3\n\nKVL left loop: 10 − 2i_1 − 4i_3 = 0\nKVL right loop: 6 − 3i_2 − 4i_3 = 0\n\nSubstituting i_3 = i_1 + i_2:\n\n    10 = 2i_1 + 4i_1 + 4i_2 = 6i_1 + 4i_2\n    6  = 3i_2 + 4i_1 + 4i_2 = 4i_1 + 7i_2\n\nSolving: from the first, i_1 = (10 − 4i_2)/6. Substituting,\n\n    4(10 − 4i_2)/6 + 7i_2 = 6\n    (40 − 16i_2)/6 + 7i_2 = 6\n    40 − 16i_2 + 42i_2 = 36\n    26i_2 = −4    ⇒   i_2 = −0.1538 A\n    i_1 = (10 + 0.6154)/6 = 1.769 A\n    i_3 = 1.769 − 0.154 = 1.615 A\n\nThe negative i_2 says the right-hand source is being charged, not discharged —\na perfectly valid result, and exactly the kind of thing you must not \"fix\" by\nflipping an arrow midway.\n\nCheck with KVL on the left loop: 10 − 2(1.769) − 4(1.615) = 10 − 3.538 − 6.462\n= 0 ✓\n\n## 4.6 Exercises\n\n1. At a node, currents of 3 A and 7 A enter and 4 A leaves. Find the fourth\n   branch current. (6 A leaving)\n2. A loop has a 15 V source and 4 Ω, 6 Ω in series. Find i and each voltage.\n   (1.5 A; 6 V, 9 V)\n3. Repeat Example 3 with the 4 V source reversed so it aids the 12 V source.\n   (i = 2 A)\n4. How many independent KCL and KVL equations does a circuit with 6 branches\n   and 4 nodes require? (3 KCL, 3 KVL)\n5. Show that in Example 4 the total power delivered equals the total absorbed.\n\n## Takeaways\n\n- KCL is charge conservation at a node; KVL is energy conservation around a loop.\n- Pick one loop direction and one sign rule, and never vary them.\n- (n − 1) KCL equations, the rest KVL. The last KCL equation is always redundant.\n- A negative current is an answer, not a mistake.\n"}, {"num": "05", "title": "Nodal Analysis", "body": "\nNodal analysis is KCL applied systematically. It produces the **smallest set of\nequations** whenever a circuit has more branches than nodes — which is most of\nthe time.\n\n## 5.1 The method\n\n1. Identify all nodes. Choose one as the **reference (ground)**, ideally the one\n   with most connections or the − terminal of a source. Its voltage is 0.\n2. Label the remaining node voltages V_1, V_2, … These are your unknowns —\n   there are (n − 1) of them.\n3. Write **KCL at each non-reference node**, expressing every branch current in\n   terms of node voltages via Ohm's law.\n4. Solve the simultaneous equations.\n\nThe key step is 3. For a resistor R between nodes A and B, the current **leaving\nnode A through R** is\n\n    i = (V_A − V_B)/R\n\nAlways write it as *(this node − other node) / R*. Being mechanical about that\neliminates almost all sign errors.\n\n## 5.2 The standard form\n\nFor a circuit with only resistors and **current** sources, KCL at every node\ncollapses to the single matrix equation **GV = I**, with the conductance matrix\n\n```matrix\nlhs: G  =\nstyle: bracket\nG_11 ; −G_12 ; −G_13\n−G_21 ; G_22 ; −G_23\n−G_31 ; −G_32 ; G_33\n```\n\nwhere\n\n- G_kk = **sum of all conductances connected to node k** (always positive)\n- G_jk = **negative of the conductance directly between nodes j and k**\n- I_k = sum of source currents **entering** node k\n\nThis \"by inspection\" form works **only** when every source is an independent\ncurrent source. Voltage sources need the treatment in §5.3, and dependent\nsources break the symmetry of the matrix.\n\nThe conductance matrix is **symmetric** (G_jk = G_kj) for circuits without\ndependent sources. If yours comes out asymmetric and you have no dependent\nsources, you have made an error — a genuinely useful check.\n\n## 5.3 Voltage sources: three cases\n\n**Case 1 — source between a node and ground.** That node's voltage is simply\n*known*. Write V_k = V_s and remove it from the unknowns. This is the easiest\npossible situation, so choose your ground to create it whenever you can.\n\n**Case 2 — source between two non-reference nodes: the supernode.**\nYou cannot write Ohm's law for the source branch (an ideal source has no\nresistance). Instead:\n\n1. Enclose both nodes in a **supernode** and write KCL for the whole enclosure —\n   legal because KCL applies to any closed surface.\n2. Add the **constraint equation** from the source itself:\n   V_A − V_B = V_s.\n\nTwo equations, two unknowns, no need to know the source current.\n\n**Case 3 — a dependent source.** Treat it as above, then add an equation\nexpressing its controlling variable in terms of node voltages.\n\n## 5.4 Worked examples\n\n**Example 1 — two unknown nodes, current sources only.**\nA 4 A source feeds node 1. Node 1 connects to ground through 2 Ω, and to node 2\nthrough 4 Ω. Node 2 connects to ground through 8 Ω and has a 2 A source feeding\nit. Find V_1 and V_2.\n\nConductances: 1/2 = 0.5, 1/4 = 0.25, 1/8 = 0.125 S\n\nNode 1: (0.5 + 0.25)V_1 − 0.25V_2 = 4\nNode 2: −0.25V_1 + (0.25 + 0.125)V_2 = 2\n\n    0.75V_1 − 0.25V_2 = 4\n    −0.25V_1 + 0.375V_2 = 2\n\nFrom the first: V_1 = (4 + 0.25V_2)/0.75. Substituting:\n\n    −0.25(4 + 0.25V_2)/0.75 + 0.375V_2 = 2\n    −(1 + 0.0625V_2)/0.75 + 0.375V_2 = 2\n    −1.3333 − 0.08333V_2 + 0.375V_2 = 2\n    0.29167V_2 = 3.3333   ⇒   V_2 = 11.43 V\n    V_1 = (4 + 2.857)/0.75 = 9.14 V\n\nCheck by KCL at node 1: (9.14)/2 + (9.14 − 11.43)/4 = 4.571 − 0.571 = 4.0 ✓\n\n**Example 2 — voltage source to ground.**\nA 12 V source sits between node 1 and ground. Node 1 connects to node 2 through\n3 Ω; node 2 goes to ground through 6 Ω and carries a 2 A source into it.\n\n    V_1 = 12 V (known immediately)\n\nNode 2: (V_2 − 12)/3 + V_2/6 = 2\n\n    2(V_2 − 12) + V_2 = 12\n    3V_2 = 36    ⇒   V_2 = 12 V\n\nWith V_2 = 12 V there is no current in the 3 Ω at all, and the whole 2 A flows\nthrough the 6 Ω. Check: 12/6 = 2 A ✓\n\n**Example 3 — supernode.**\nNodes 1 and 2 are joined by an 8 V source (+ at node 1). Node 1 connects to\nground through 4 Ω; node 2 connects to ground through 2 Ω. A 3 A source feeds\nnode 1 from ground.\n\nSupernode KCL (currents leaving the enclosure into the resistors equal the 3 A\nentering):\n\n    V_1/4 + V_2/2 = 3\n\nConstraint:\n\n    V_1 − V_2 = 8   ⇒   V_1 = V_2 + 8\n\nSubstituting:\n\n    (V_2 + 8)/4 + V_2/2 = 3\n    (V_2 + 8) + 2V_2 = 12\n    3V_2 = 4    ⇒   V_2 = 1.333 V,   V_1 = 9.333 V\n\nCheck: 9.333/4 + 1.333/2 = 2.333 + 0.667 = 3.0 ✓\n\n**Example 4 — dependent source.**\nNode 1 has a 6 A source into it, connects to ground via 2 Ω and to node 2 via\n1 Ω. Node 2 connects to ground via 3 Ω and also carries a VCCS of 2v_x into it,\nwhere v_x is the voltage across the 2 Ω (i.e. v_x = V_1).\n\nNode 1: V_1/2 + (V_1 − V_2)/1 = 6\nNode 2: (V_2 − V_1)/1 + V_2/3 = 2V_1\n\nFrom node 1:  1.5V_1 − V_2 = 6\nFrom node 2:  −V_1 + V_2 + V_2/3 = 2V_1  ⇒  −3V_1 + 1.3333V_2 = 0\n            ⇒  V_2 = 2.25V_1\n\nSubstituting: 1.5V_1 − 2.25V_1 = 6 ⇒ −0.75V_1 = 6 ⇒ **V_1 = −8 V**,\n**V_2 = −18 V**\n\nA negative node voltage is perfectly legal — the dependent source is driving the\nnode below ground.\n\n## 5.5 Choosing nodal or mesh\n\n| Prefer nodal when | Prefer mesh when |\n|---|---|\n| Fewer nodes than meshes | Fewer meshes than nodes |\n| Current sources dominate | Voltage sources dominate |\n| You want node voltages | You want branch currents |\n| Circuit is non-planar | (mesh is impossible — nodal is your only option) |\n\nCount both before starting. Choosing the better method halves the work, and\ncosts ten seconds.\n\n## 5.6 Exercises\n\n1. Two nodes joined by 5 Ω; node 1 to ground via 10 Ω with 3 A in; node 2 to\n   ground via 20 Ω. Find V_1, V_2. (V_1 = 21.43 V, V_2 = 17.14 V)\n2. Redo Example 1 using conductances written straight into the matrix by\n   inspection, and confirm the matrix is symmetric.\n3. A 10 V source sits between nodes 1 and 2, with node 1 to ground via 5 Ω and\n   node 2 to ground via 5 Ω, and a 4 A source into node 2. Find both voltages.\n4. Why is the (n−1)th KCL equation sufficient — what happened to the nth?\n5. Convert the circuit of Example 3 into mesh form and confirm the same answer.\n\n## Takeaways\n\n- Ground the busiest node, or the one that turns a voltage source into a known.\n- Current out of node A through R is always (V_A − V_other)/R.\n- A voltage source between two live nodes ⇒ supernode + constraint equation.\n- The conductance matrix is symmetric unless dependent sources are present.\n"}, {"num": "06", "title": "Mesh Analysis", "body": "\nMesh analysis is KVL applied systematically. Where nodal analysis solves for\nnode voltages, mesh analysis solves for **loop currents**.\n\n**Restriction:** meshes only exist in **planar** circuits — those drawable with\nno crossing wires. For a non-planar circuit, nodal analysis is your only option.\n\n## 6.1 The method\n\n1. Confirm the circuit is planar and identify the meshes (windows).\n2. Assign a mesh current to each, **all in the same direction** (clockwise by\n   convention). This consistency is what makes the by-inspection form work.\n3. Write KVL around each mesh, expressing resistor voltages in terms of mesh\n   currents.\n4. Solve.\n\n**The crucial subtlety:** a resistor on the **boundary between two meshes**\ncarries the *difference* of the two mesh currents. For a resistor shared by\nmeshes 1 and 2, the voltage drop when traversing with mesh 1 is\n\n    v = R(i_1 − i_2)\n\nA branch current is not a mesh current unless that branch belongs to only one\nmesh. Confusing the two is the defining error of this module.\n\n## 6.2 The standard form\n\nFor a planar circuit containing only **independent voltage sources**, KVL\naround every mesh collapses to **RI = V**, with the resistance matrix\n\n```matrix\nlhs: R  =\nstyle: bracket\nR_11 ; −R_12 ; −R_13\n−R_21 ; R_22 ; −R_23\n−R_31 ; −R_32 ; R_33\n```\n\n- R_kk = **sum of all resistances in mesh k** (always positive)\n- R_jk = **negative of the resistance shared** between meshes j and k\n- V_k = sum of source voltages **driving** mesh current k (a rise in the\n  direction of travel counts positive)\n\nAs with nodal, the resistance matrix is **symmetric** when no dependent sources\nare present. Note the structural duality with Module 05: conductance ↔\nresistance, node voltage ↔ mesh current, current source ↔ voltage source. The\ntwo methods are the same idea viewed from opposite sides.\n\n## 6.3 Current sources: three cases\n\n**Case 1 — current source in one mesh only.** That mesh current is *known*\nimmediately: i_k = ±I_s. One fewer unknown.\n\n**Case 2 — current source shared between two meshes: the supermesh.**\nYou cannot write KVL through an ideal current source (its voltage is unknown).\nInstead:\n\n1. Form a **supermesh** by merging the two meshes and traversing the outer\n   boundary, *avoiding* the source branch entirely.\n2. Add the **constraint equation** from the source:\n   i_1 − i_2 = I_s (with the sign set by the source's direction).\n\n**Case 3 — dependent source.** Same as above, plus an equation relating the\ncontrolling variable to mesh currents.\n\n## 6.4 Worked examples\n\n**Example 1 — two meshes.**\nMesh 1: 10 V source, 2 Ω, and 4 Ω shared. Mesh 2: 4 Ω shared, 6 Ω.\nBoth currents clockwise.\n\nBy inspection:\n\n    (2 + 4)i_1 − 4i_2 = 10\n    −4i_1 + (4 + 6)i_2 = 0\n\n    6i_1 − 4i_2 = 10\n    −4i_1 + 10i_2 = 0    ⇒   i_1 = 2.5 i_2\n\nSubstituting: 15i_2 − 4i_2 = 10 ⇒ 11i_2 = 10 ⇒ **i_2 = 0.909 A**,\n**i_1 = 2.273 A**\n\nCurrent in the shared 4 Ω = i_1 − i_2 = **1.364 A** (downward, in mesh 1's\ndirection).\n\nCheck with KVL on mesh 1: 10 − 2(2.273) − 4(1.364) = 10 − 4.545 − 5.455 = 0 ✓\n\n**Example 2 — current source in one mesh.**\nMesh 1 contains a 3 A source on its own branch; mesh 2 contains 5 Ω and a 20 V\nsource, sharing an 8 Ω with mesh 1.\n\n    i_1 = −3 A     (negative if the source pushes against the clockwise\n                    assumption; take it as given here)\n\nMesh 2 KVL:  −8(i_2 − i_1) − 5i_2 + 20 = 0\n\n    −8i_2 − 24 − 5i_2 + 20 = 0\n    −13i_2 = 4    ⇒   i_2 = −0.3077 A\n\n**Example 3 — supermesh.**\nMeshes 1 and 2 share a branch containing a 4 A source (pointing from mesh 2 into\nmesh 1). Mesh 1 also has a 12 V source and 2 Ω; mesh 2 also has 6 Ω and 3 Ω.\n\nConstraint from the source:\n\n    i_1 − i_2 = 4\n\nSupermesh KVL around the outer boundary (skipping the source branch):\n\n    12 − 2i_1 − 6i_2 − 3i_2 = 0\n    12 − 2i_1 − 9i_2 = 0\n\nSubstituting i_1 = i_2 + 4:\n\n    12 − 2i_2 − 8 − 9i_2 = 0\n    4 = 11i_2   ⇒   i_2 = 0.364 A,   i_1 = 4.364 A\n\nCheck: 12 − 2(4.364) − 9(0.364) = 12 − 8.727 − 3.273 = 0 ✓\n\n**Example 4 — three meshes by inspection.**\nMesh 1: 1 Ω, 2 Ω shared with mesh 2, driven by 9 V.\nMesh 2: 2 Ω shared with 1, 3 Ω, 4 Ω shared with mesh 3.\nMesh 3: 4 Ω shared with 2, 5 Ω.\n\n    (1+2)i_1 − 2i_2 + 0     = 9\n    −2i_1 + (2+3+4)i_2 − 4i_3 = 0\n    0 − 4i_2 + (4+5)i_3      = 0\n\n    3i_1 − 2i_2        = 9\n    −2i_1 + 9i_2 − 4i_3 = 0\n         −4i_2 + 9i_3   = 0   ⇒   i_3 = 0.4444 i_2\n\nSubstituting into the middle equation:\n\n    −2i_1 + 9i_2 − 1.7778i_2 = 0   ⇒   2i_1 = 7.2222i_2   ⇒   i_1 = 3.6111i_2\n\nThen 3(3.6111i_2) − 2i_2 = 9 ⇒ 10.8333i_2 − 2i_2 = 9 ⇒ 8.8333i_2 = 9\n\n    i_2 = 1.0189 A,   i_1 = 3.6793 A,   i_3 = 0.4528 A\n\nNote the matrix is symmetric, and the zeros in the corners say meshes 1 and 3\nshare nothing — exactly as drawn.\n\n## 6.5 Exercises\n\n1. Two meshes: mesh 1 has 24 V and 4 Ω, shared 8 Ω, mesh 2 has 12 Ω. Find both\n   mesh currents. (i_1 = 2.727 A, i_2 = 1.091 A)\n2. Redo Module 05 Example 3 by mesh analysis and confirm the node voltages.\n3. A supermesh problem: two meshes sharing a 2 A source, mesh 1 with 10 V and\n   3 Ω, mesh 2 with 7 Ω. Find both currents.\n4. State why mesh analysis cannot be applied to a non-planar circuit.\n5. For Example 4, verify the power delivered by the 9 V source equals the total\n   dissipated.\n\n## Takeaways\n\n- All mesh currents in the same direction, always. That is what makes the\n  by-inspection matrix work.\n- A shared resistor carries the **difference** of two mesh currents.\n- Current source in one mesh ⇒ that mesh current is known. Shared ⇒ supermesh\n  plus constraint.\n- Mesh and nodal are duals: count meshes and nodes, then pick the smaller.\n"}, {"num": "07", "title": "Linearity and Superposition", "body": "\n## 7.1 Linearity\n\nA circuit is **linear** if it contains only linear elements — resistors, and\nsources whose dependent relationships are proportional. Linearity means two\nproperties hold:\n\n**Homogeneity (scaling).** Multiply every independent source by k, and every\nvoltage and current in the circuit multiplies by k.\n\n**Additivity.** The response to several sources acting together equals the sum\nof the responses to each acting alone.\n\nTogether these give **superposition**, and superposition is what every remaining\ntheorem in this course is built on. Thévenin, Norton, source transformation and\nmaximum power transfer are all consequences.\n\n> **Power is not linear.** p = i²R is a *square* law. You may never superpose\n> powers. Superpose the voltage or current first, then square the **total**. A\n> question that asks for power via superposition is testing exactly this, and\n> the wrong method gives a confidently wrong number.\n\n## 7.2 Superposition — the method\n\nTo find any voltage or current in a linear circuit with multiple independent\nsources:\n\n1. Take one independent source at a time.\n2. **Deactivate all other independent sources:**\n   - Voltage source → replace with a **short circuit** (0 V across it)\n   - Current source → replace with an **open circuit** (0 A through it)\n3. Solve the simplified circuit for the quantity you want.\n4. Repeat for each source.\n5. **Add** the individual contributions algebraically, respecting sign.\n\n### The rule that gets forgotten\n\n> **Dependent sources are never deactivated.** They stay active in every single\n> sub-circuit, because their value is not an independent input to the system —\n> it is part of the circuit's own behaviour.\n\nIf you kill a dependent source, you are analysing a different circuit.\n\n### Why \"short\" and \"open\"?\n\nAn ideal voltage source set to zero volts is, by definition, an element with\n0 V across it whatever the current — that is exactly a short circuit. An ideal\ncurrent source set to zero amps passes 0 A whatever the voltage — exactly an\nopen circuit. The replacements are not conventions; they are what the\ndeactivated sources *are*.\n\n## 7.3 When superposition is worth using\n\nHonestly: **often it is not**. For a circuit with three sources you solve three\ncircuits instead of one. Nodal or mesh analysis is usually faster.\n\nSuperposition earns its place when:\n\n- One source is AC and another DC (Module 13) — they *cannot* be combined any\n  other way.\n- Sources are at different frequencies — same reason.\n- You need to understand the *contribution* of one source, not just the total.\n- It is the stepping-stone to proving Thévenin, which is its real job here.\n\n## 7.4 Worked examples\n\n**Example 1 — two voltage sources.**\nA 12 V source and a 6 V source drive a shared 4 Ω resistor through 2 Ω and 3 Ω\nrespectively (both source branches meeting at the top of the 4 Ω).\nFind the current in the 4 Ω.\n\n*Contribution of the 12 V source* (6 V shorted):\nThe 3 Ω is now in parallel with the 4 Ω: 3 ∥ 4 = 12/7 = 1.714 Ω\n\n    i_total = 12/(2 + 1.714) = 12/3.714 = 3.231 A\n    i_4' = 3.231 × 3/(3+4) = 1.385 A      (current divider)\n\n*Contribution of the 6 V source* (12 V shorted):\nThe 2 Ω is now in parallel with the 4 Ω: 2 ∥ 4 = 8/6 = 1.333 Ω\n\n    i_total = 6/(3 + 1.333) = 6/4.333 = 1.385 A\n    i_4'' = 1.385 × 2/(2+4) = 0.462 A\n\n*Total:*\n\n    i_4 = 1.385 + 0.462 = 1.846 A\n\nCross-check by nodal analysis. With the top node at V:\n\n    (V − 12)/2 + (V − 6)/3 + V/4 = 0\n    6(V−12) + 4(V−6) + 3V = 0\n    6V − 72 + 4V − 24 + 3V = 0\n    13V = 96   ⇒   V = 7.385 V\n    i_4 = 7.385/4 = 1.846 A ✓\n\n**Example 2 — a voltage source and a current source.**\nA 10 V source in series with 5 Ω feeds a node; a 2 A source also feeds that\nnode; the node connects to ground through 10 Ω. Find the node voltage.\n\n*10 V alone* (2 A source opened):\n\n    V' = 10 × 10/(5+10) = 6.667 V\n\n*2 A alone* (10 V source shorted): the 2 A sees 5 ∥ 10 = 3.333 Ω\n\n    V'' = 2 × 3.333 = 6.667 V\n\n*Total:* V = 6.667 + 6.667 = **13.33 V**\n\nCheck by nodal: (V − 10)/5 + V/10 = 2 ⇒ 2V − 20 + V = 20 ⇒ 3V = 40 ⇒\nV = 13.33 V ✓\n\n**Example 3 — the power trap.**\nIn Example 2, find the power in the 10 Ω resistor.\n\n**Wrong:** P' = (6.667)²/10 = 4.44 W, P'' = 4.44 W, \"total\" 8.89 W.\n**Right:** V = 13.33 V total, so\n\n    P = V²/R = (13.33)²/10 = 17.8 W\n\nThe correct answer is *twice* the naive sum, because power goes as the square.\nSuperpose the voltage, then square.\n\n**Example 4 — with a dependent source.**\nA 6 V source in series with 2 Ω feeds node A; a 3 A source also feeds node A;\nnode A connects to ground through 4 Ω; and a VCVS of value 2v_x sits in series\nwith the 2 Ω branch, where v_x is the node A voltage.\n\nThe dependent source stays active throughout. Taking the 6 V alone (3 A opened),\nthen the 3 A alone (6 V shorted), each sub-circuit still contains 2v_x. In\npractice, with a dependent source present it is nearly always quicker to abandon\nsuperposition and write one nodal equation — which is the honest lesson here.\n\n## 7.5 Exercises\n\n1. Two sources, 20 V and 5 A, share a 10 Ω load through 5 Ω and 20 Ω\n   respectively. Find the load voltage by superposition, then check by nodal.\n2. A circuit gives an output of 6 V when driven by a 12 V source. What output\n   does a 30 V source give? (15 V — by homogeneity alone)\n3. In Example 1, find the power in the 4 Ω, and confirm you cannot get it by\n   adding the two individual powers. (13.6 W; the naive sum gives 8.6 W)\n4. Explain, in terms of what a source *is*, why deactivating a current source\n   means opening it rather than shorting it.\n5. A circuit has a 10 V DC source and a sinusoidal source. Why is superposition\n   essentially mandatory here?\n\n## Takeaways\n\n- Linearity = scaling + additivity. It holds for v and i, never for p.\n- Kill voltage sources by shorting, current sources by opening.\n- Dependent sources always stay active.\n- Superposition's real importance is as the proof engine for Thévenin, not as a\n  day-to-day solving method.\n"}, {"num": "08", "title": "Source Transformation", "body": "\n## 8.1 The transformation\n\nA practical voltage source and a practical current source are\n**indistinguishable from outside** if:\n\n    V_s = I_s R          I_s = V_s / R          R unchanged\n\nThat is:\n\n> A voltage source V_s **in series** with R ⟺ a current source I_s = V_s/R\n> **in parallel** with the same R.\n\n### Why they are equivalent\n\nCompare terminal behaviour. For the voltage source in series with R, the\nterminal voltage at load current I is\n\n    V = V_s − IR\n\nFor the current source in parallel with R, the current through the load is\nI_s − V/R, so\n\n    I = I_s − V/R   ⇒   V = (I_s − I)R = I_s R − IR\n\nThese are the same straight line provided V_s = I_s R. Two black boxes with\nidentical v–i characteristics cannot be told apart by any external measurement.\n\n### The direction rule\n\nThe current source arrow must point **toward the terminal that the voltage\nsource's + terminal faced**. Get this backwards and every sign in the rest of\nthe problem inverts. Mark it on the diagram before moving on.\n\n## 8.2 What it is for\n\nSource transformation is a **circuit-simplification engine**. Alternating\nbetween the two forms lets you merge sources that could not otherwise be\ncombined:\n\n- Current sources **in parallel** add directly.\n- Voltage sources **in series** add directly.\n- Neither can be done in the other configuration.\n\nSo the working pattern is: transform → merge → transform back → merge again,\nmarching the sources toward the terminals of interest until only one remains.\nDoing this to completion *is* finding the Thévenin or Norton equivalent, which\nis why this module sits immediately before those two.\n\n## 8.3 Limitations\n\n- The resistance must be **genuinely in series** (for a voltage source) or\n  **genuinely in parallel** (for a current source). An ideal source with no\n  associated resistance cannot be transformed at all.\n- The internal behaviour is **not** preserved. Power dissipated in R differs\n  between the two forms even though the terminal behaviour is identical. See\n  §8.5 — this is a favourite exam trap.\n- A dependent source **can** be transformed, provided its controlling variable\n  is not inside the part being transformed away.\n\n## 8.4 Worked examples\n\n**Example 1 — basic conversion.**\nA 24 V source in series with 6 Ω. Convert.\n\n    I_s = 24/6 = 4 A in parallel with 6 Ω\n\n**Example 2 — repeated transformation.**\nA 12 V source in series with 3 Ω feeds node A; node A has a 6 Ω to ground; a\n2 A source also feeds node A. Find the current in a 4 Ω load at node A.\n\nStep 1 — transform the 12 V/3 Ω into 4 A ∥ 3 Ω.\n\nNow at node A: 4 A source, 3 Ω, 6 Ω, 2 A source, and the 4 Ω load.\n\nStep 2 — merge the two current sources (parallel): 4 + 2 = 6 A.\nMerge 3 ∥ 6 = 2 Ω.\n\nStep 3 — now a 6 A source in parallel with 2 Ω, feeding the 4 Ω load.\nCurrent divider:\n\n    I_4 = 6 × 2/(2+4) = 2 A\n\nCheck by transforming back: 6 A ∥ 2 Ω = 12 V in series with 2 Ω, so\nI = 12/(2+4) = 2 A ✓\n\n**Example 3 — marching toward the terminals.**\nA 10 V source in series with 5 Ω, then a 5 Ω to ground, then a 10 Ω in series\nto terminals a–b. Reduce to a single source at a–b.\n\n    10 V / 5 Ω  →  2 A ∥ 5 Ω\n    5 ∥ 5 = 2.5 Ω, still 2 A\n    2 A ∥ 2.5 Ω  →  5 V in series with 2.5 Ω\n    Add the series 10 Ω:  5 V in series with 12.5 Ω\n\nSo looking into a–b you see a 5 V source behind 12.5 Ω — which is precisely the\nThévenin equivalent of the whole thing.\n\n**Example 4 — the internal-power trap.**\nA 24 V source in series with 6 Ω drives a 6 Ω load. Compare the power in the\ninternal resistance with that of the transformed equivalent.\n\n*Voltage form:* I = 24/12 = 2 A. Power in the internal 6 Ω = 2²(6) = **24 W**.\nSource delivers 24 × 2 = 48 W.\n\n*Current form:* 4 A ∥ 6 Ω into a 6 Ω load. Load gets 2 A (divider), so the\nparallel 6 Ω also carries 2 A, dissipating 2²(6) = **24 W** — the same here, but\nthe *source's* delivered power is now 4 A × 12 V = 48 W with the internal\nelement carrying a different current in general.\n\nThe load sees identical behaviour in both: 2 A, 12 V, 24 W. That is all the\nequivalence promises. **Never** use a transformed circuit to compute the power\ninside the original source.\n\n## 8.5 Exercises\n\n1. Convert a 5 A source in parallel with 8 Ω to its voltage form. (40 V, 8 Ω)\n2. A 15 V source in series with 3 Ω, in parallel with a 6 A source and 2 Ω.\n   Reduce to a single current source and resistance. (11 A ∥ 1.2 Ω)\n3. Use repeated source transformation to find the current through a 5 Ω load fed\n   by a 20 V source in series with 10 Ω, with a 4 A source in parallel at the\n   load terminals.\n4. Why can an ideal voltage source (no series resistance) not be transformed?\n5. Show algebraically that the two forms have the same v–i line, and identify\n   what the slope and intercepts represent physically.\n\n## Takeaways\n\n- V_s = I_s R, same R, arrow pointing toward where + was.\n- Transform to merge: current sources in parallel add, voltage sources in\n  series add.\n- Terminal behaviour is preserved; internal power is not.\n- Marching transformations all the way to a terminal pair yields Thévenin or\n  Norton directly.\n"}, {"num": "09", "title": "Thévenin's Theorem", "body": "\nThe central result of the course.\n\n## 9.1 Statement\n\n> Any linear two-terminal network, however complicated, can be replaced — **as\n> seen from those two terminals** — by a single voltage source V_th in series\n> with a single resistance R_th.\n\n- **V_th** = the **open-circuit voltage** at the terminals\n- **R_th** = the resistance looking back into the network with all **independent**\n  sources deactivated\n\n## 9.2 What \"as seen from those two terminals\" means\n\nThis is the sentence that decides whether you understand the theorem.\n\nThe equivalent reproduces the original network's **v–i relationship at the\nterminals**. Connect any load you like and it will draw exactly the same current\nand sit at exactly the same voltage as it would have in the original circuit.\n\nIt reproduces **nothing else**:\n\n- Internal node voltages are wrong.\n- Internal branch currents are wrong.\n- **Internal power dissipation is wrong.** The power in R_th is *not* the power\n  lost inside the original network.\n\nSo: use Thévenin to find what happens to the **load**. Never use it to answer a\nquestion about the interior of the network you replaced. If a problem asks for\nthe power dissipated by a resistor that got absorbed into R_th, you must go back\nto the original circuit.\n\n## 9.3 Finding V_th\n\nRemove the load, leaving the terminals open. Find the voltage across them by any\nmethod — nodal, mesh, divider, superposition, source transformation.\n\n**Note:** with the load removed, no current flows in the branch that led to it,\nso any resistance in series with the open terminals drops zero volts and can be\nignored when computing V_th (though it still counts toward R_th).\n\n## 9.4 Finding R_th — three methods\n\n### Method 1 — Deactivate and reduce (no dependent sources)\n\nTurn off all independent sources (voltage → short, current → open) and reduce\nthe resulting resistor network by series/parallel from the terminals inward.\n\nFastest when it applies. It applies **only** if there are no dependent sources.\n\n### Method 2 — Test source (works always, required with dependent sources)\n\nDeactivate the **independent** sources only; leave dependent sources active.\nThen either:\n\n- Apply a 1 V test source across the terminals, find the current I drawn, and\n  take R_th = 1/I; or\n- Apply a 1 A test source, find the voltage V, and take R_th = V/1.\n\nUse this whenever a dependent source is present. Method 1 is simply invalid\nthere, because you may not deactivate a dependent source.\n\n### Method 3 — Open-circuit / short-circuit\n\n    R_th = V_oc / I_sc\n\nwhere V_oc = V_th is the open-circuit voltage and I_sc is the current that flows\nwhen the terminals are shorted together.\n\nWorks always, including with dependent sources, and is often the least error-\nprone because both quantities are ordinary circuit-analysis problems. Its one\nfailure case: a network with V_th = 0 and I_sc = 0 gives 0/0, and you must fall\nback to Method 2.\n\n## 9.5 Worked examples\n\n**Example 1 — plain resistive network.**\nA 12 V source in series with 4 Ω, with 12 Ω from the junction to ground, and\nterminals a–b across the 12 Ω. Find the Thévenin equivalent and then the current\nin a 6 Ω load.\n\n*V_th* (load removed, simple divider):\n\n    V_th = 12 × 12/(4+12) = 9 V\n\n*R_th* (12 V shorted; 4 Ω now parallel with 12 Ω):\n\n    R_th = 4 ∥ 12 = 48/16 = 3 Ω\n\n*Load current:*\n\n    I_L = V_th/(R_th + R_L) = 9/(3+6) = 1 A\n\nCheck directly: with the 6 Ω in place, 12 ∥ 6 = 4 Ω, total 8 Ω, source current\n12/8 = 1.5 A, node voltage 1.5 × 4 = 6 V, so I_6 = 6/6 = 1 A ✓\n\n**Example 2 — two sources, using superposition for V_th.**\nA 20 V source through 5 Ω and a 10 V source through 20 Ω both feed terminals\na–b, which also has a 4 Ω to ground.\n\n*V_th* by nodal (terminals open, so the 4 Ω is the only path to ground):\n\n    (V − 20)/5 + (V − 10)/20 + V/4 = 0\n    4(V − 20) + (V − 10) + 5V = 0\n    4V − 80 + V − 10 + 5V = 0\n    10V = 90   ⇒   V_th = 9 V\n\n*R_th* (both sources shorted): 5 ∥ 20 ∥ 4\n\n    1/R_th = 1/5 + 1/20 + 1/4 = 0.2 + 0.05 + 0.25 = 0.5\n    R_th = 2 Ω\n\n**Example 3 — open-circuit/short-circuit method.**\nSame circuit as Example 1. Short a–b: the 12 Ω is shorted out, so\n\n    I_sc = 12/4 = 3 A\n    R_th = V_oc/I_sc = 9/3 = 3 Ω ✓\n\n**Example 4 — with a dependent source (test-source method).**\nA network has a 4 Ω from terminal a to node x, a 2 Ω from x to ground, a 6 V\nindependent source driving x through the 2 Ω branch, and a VCCS of 0.5v_x from\nx to ground, where v_x is the voltage across the 2 Ω.\n\n*R_th:* deactivate the 6 V (short it), keep the VCCS. Apply a 1 V test source\nat a–b. Let node x be at v_x.\n\nKCL at x (currents leaving x): through the 2 Ω to ground, through the dependent\nsource, and back through the 4 Ω to the test source:\n\n    v_x/2 + 0.5v_x + (v_x − 1)/4 = 0\n    Multiply by 4:  2v_x + 2v_x + v_x − 1 = 0\n    5v_x = 1   ⇒   v_x = 0.2 V\n\nTest-source current (into the network through the 4 Ω):\n\n    I = (1 − v_x)/4 = 0.8/4 = 0.2 A\n    R_th = 1/0.2 = 5 Ω\n\nNote that Method 1 would have given 4 + 2 = 6 Ω — wrong, because it illegally\nremoves the dependent source's effect.\n\n## 9.6 Exercises\n\n1. A 30 V source in series with 10 Ω, with 20 Ω across the output terminals.\n   Find V_th and R_th. (20 V, 6.67 Ω)\n2. Using Example 2's equivalent, find the current delivered to a 3 Ω load.\n   (1.8 A)\n3. A network has V_oc = 15 V and I_sc = 2.5 A. Find R_th and the load current\n   into 4 Ω. (6 Ω; 1.5 A)\n4. Explain why the power dissipated in R_th does not equal the power lost inside\n   the original network.\n5. A network containing a CCVS has its independent sources deactivated, and\n   series/parallel reduction gives 8 Ω. Why is that answer not R_th?\n\n## Takeaways\n\n- V_th = open-circuit voltage; R_th = resistance looking in with **independent**\n  sources off.\n- Three routes to R_th: reduce (no dependent sources), test source (always),\n  or V_oc/I_sc (always).\n- The equivalent is valid **only at the terminals**. Internal currents, voltages\n  and powers are not preserved.\n- Dependent sources are never deactivated — this is where most marks are lost.\n"}, {"num": "10", "title": "Norton's Theorem", "body": "\n## 10.1 Statement\n\n> Any linear two-terminal network can be replaced, as seen from those terminals,\n> by a single current source I_N in parallel with a single resistance R_N.\n\n- **I_N** = the **short-circuit current** at the terminals\n- **R_N** = R_th, found exactly as in Module 09\n\nNorton is the dual of Thévenin. Everything true of one is true of the other with\n\"voltage/series\" and \"current/parallel\" swapped.\n\n## 10.2 The relationship between them\n\n    I_N = V_th / R_th          V_th = I_N R_N          R_N = R_th\n\nThis is just source transformation (Module 08) applied to the equivalent itself.\nGiven either equivalent you have the other immediately — so in practice you find\nwhichever is easier and convert.\n\nThe three quantities V_th, I_N and R_th are linked by R_th = V_oc/I_sc, so\n**any two of them determine the third**. Finding two is always enough.\n\n## 10.3 Which to use\n\n| Use Thévenin when | Use Norton when |\n|---|---|\n| The load is in series | The load is in parallel |\n| Sources are mostly voltage sources | Sources are mostly current sources |\n| You want load voltage | You want load current |\n| Combining with mesh analysis | Combining with nodal analysis |\n\nNeither is more \"correct\". They describe the same straight-line v–i\ncharacteristic, seen from different ends:\n\n    V = V_th − I R_th       (Thévenin form)\n    I = I_N − V/R_N         (Norton form)\n\nThe intercepts are V_th (at I = 0) and I_N (at V = 0), and the slope is R_th\neither way.\n\n## 10.4 Worked examples\n\n**Example 1.** Find the Norton equivalent of a 12 V source in series with 4 Ω,\nwith 12 Ω across the terminals. (Same circuit as Module 09 Example 1.)\n\n*I_N* — short the terminals. The 12 Ω is shorted out:\n\n    I_N = 12/4 = 3 A\n\n*R_N* — sources off: 4 ∥ 12 = 3 Ω\n\nEquivalent: **3 A in parallel with 3 Ω**\n\nCross-check against Thévenin: V_th = I_N R_N = 3 × 3 = 9 V ✓ (matches\nModule 09)\n\nLoad current into 6 Ω, by current divider:\n\n    I_L = 3 × 3/(3+6) = 1 A ✓\n\n**Example 2 — current-source network.**\nA 6 A source in parallel with 10 Ω, feeding a 15 Ω in series to the terminals.\nFind the Norton equivalent.\n\n*I_N* — short the terminals. The 15 Ω is then in parallel with the 10 Ω, and the\n6 A divides:\n\n    I_N = 6 × 10/(10+15) = 2.4 A\n\n*R_N* — open the 6 A source: 10 Ω in series with 15 Ω = 25 Ω\n\nEquivalent: **2.4 A in parallel with 25 Ω**\n\nCheck: V_th = 2.4 × 25 = 60 V. Directly, the open-circuit voltage is the 6 A\nthrough the 10 Ω (no current flows in the 15 Ω when open), giving\n6 × 10 = 60 V ✓\n\n**Example 3 — mixed sources.**\nA 24 V source in series with 6 Ω, in parallel with a 2 A source, feeding\nterminals a–b.\n\nTransform the 24 V/6 Ω into 4 A ∥ 6 Ω. Now two parallel current sources:\n\n    I_N = 4 + 2 = 6 A\n    R_N = 6 Ω\n\nEquivalent: **6 A in parallel with 6 Ω**, i.e. V_th = 36 V behind 6 Ω.\n\n**Example 4 — with a dependent source.**\nUsing the network from Module 09 Example 4, R_N = R_th = 5 Ω. If the\nopen-circuit voltage
