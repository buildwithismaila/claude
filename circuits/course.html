bsorbed into R_th, you must go back\nto the original circuit.\n\n## 9.3 Finding V_th\n\nRemove the load, leaving the terminals open. Find the voltage across them by any\nmethod — nodal, mesh, divider, superposition, source transformation.\n\n**Note:** with the load removed, no current flows in the branch that led to it,\nso any resistance in series with the open terminals drops zero volts and can be\nignored when computing V_th (though it still counts toward R_th).\n\n## 9.4 Finding R_th — three methods\n\n### Method 1 — Deactivate and reduce (no dependent sources)\n\nTurn off all independent sources (voltage → short, current → open) and reduce\nthe resulting resistor network by series/parallel from the terminals inward.\n\nFastest when it applies. It applies **only** if there are no dependent sources.\n\n### Method 2 — Test source (works always, required with dependent sources)\n\nDeactivate the **independent** sources only; leave dependent sources active.\nThen either:\n\n- Apply a 1 V test source across the terminals, find the current I drawn, and\n  take R_th = 1/I; or\n- Apply a 1 A test source, find the voltage V, and take R_th = V/1.\n\nUse this whenever a dependent source is present. Method 1 is simply invalid\nthere, because you may not deactivate a dependent source.\n\n### Method 3 — Open-circuit / short-circuit\n\n    R_th = V_oc / I_sc\n\nwhere V_oc = V_th is the open-circuit voltage and I_sc is the current that flows\nwhen the terminals are shorted together.\n\nWorks always, including with dependent sources, and is often the least error-\nprone because both quantities are ordinary circuit-analysis problems. Its one\nfailure case: a network with V_th = 0 and I_sc = 0 gives 0/0, and you must fall\nback to Method 2.\n\n## 9.5 Worked examples\n\n**Example 1 — plain resistive network.**\nA 12 V source in series with 4 Ω, with 12 Ω from the junction to ground, and\nterminals a–b across the 12 Ω. Find the Thévenin equivalent and then the current\nin a 6 Ω load.\n\n*V_th* (load removed, simple divider):\n\n    V_th = 12 × 12/(4+12) = 9 V\n\n*R_th* (12 V shorted; 4 Ω now parallel with 12 Ω):\n\n    R_th = 4 ∥ 12 = 48/16 = 3 Ω\n\n*Load current:*\n\n    I_L = V_th/(R_th + R_L) = 9/(3+6) = 1 A\n\nCheck directly: with the 6 Ω in place, 12 ∥ 6 = 4 Ω, total 8 Ω, source current\n12/8 = 1.5 A, node voltage 1.5 × 4 = 6 V, so I_6 = 6/6 = 1 A ✓\n\n**Example 2 — two sources, using superposition for V_th.**\nA 20 V source through 5 Ω and a 10 V source through 20 Ω both feed terminals\na–b, which also has a 4 Ω to ground.\n\n*V_th* by nodal (terminals open, so the 4 Ω is the only path to ground):\n\n    (V − 20)/5 + (V − 10)/20 + V/4 = 0\n    4(V − 20) + (V − 10) + 5V = 0\n    4V − 80 + V − 10 + 5V = 0\n    10V = 90   ⇒   V_th = 9 V\n\n*R_th* (both sources shorted): 5 ∥ 20 ∥ 4\n\n    1/R_th = 1/5 + 1/20 + 1/4 = 0.2 + 0.05 + 0.25 = 0.5\n    R_th = 2 Ω\n\n**Example 3 — open-circuit/short-circuit method.**\nSame circuit as Example 1. Short a–b: the 12 Ω is shorted out, so\n\n    I_sc = 12/4 = 3 A\n    R_th = V_oc/I_sc = 9/3 = 3 Ω ✓\n\n**Example 4 — with a dependent source (test-source method).**\nA network has a 4 Ω from terminal a to node x, a 2 Ω from x to ground, a 6 V\nindependent source driving x through the 2 Ω branch, and a VCCS of 0.5v_x from\nx to ground, where v_x is the voltage across the 2 Ω.\n\n*R_th:* deactivate the 6 V (short it), keep the VCCS. Apply a 1 V test source\nat a–b. Let node x be at v_x.\n\nKCL at x (currents leaving x): through the 2 Ω to ground, through the dependent\nsource, and back through the 4 Ω to the test source:\n\n    v_x/2 + 0.5v_x + (v_x − 1)/4 = 0\n    Multiply by 4:  2v_x + 2v_x + v_x − 1 = 0\n    5v_x = 1   ⇒   v_x = 0.2 V\n\nTest-source current (into the network through the 4 Ω):\n\n    I = (1 − v_x)/4 = 0.8/4 = 0.2 A\n    R_th = 1/0.2 = 5 Ω\n\nNote that Method 1 would have given 4 + 2 = 6 Ω — wrong, because it illegally\nremoves the dependent source's effect.\n\n## 9.6 Exercises\n\n1. A 30 V source in series with 10 Ω, with 20 Ω across the output terminals.\n   Find V_th and R_th. (20 V, 6.67 Ω)\n2. Using Example 2's equivalent, find the current delivered to a 3 Ω load.\n   (1.8 A)\n3. A network has V_oc = 15 V and I_sc = 2.5 A. Find R_th and the load current\n   into 4 Ω. (6 Ω; 1.5 A)\n4. Explain why the power dissipated in R_th does not equal the power lost inside\n   the original network.\n5. A network containing a CCVS has its independent sources deactivated, and\n   series/parallel reduction gives 8 Ω. Why is that answer not R_th?\n\n## Takeaways\n\n- V_th = open-circuit voltage; R_th = resistance looking in with **independent**\n  sources off.\n- Three routes to R_th: reduce (no dependent sources), test source (always),\n  or V_oc/I_sc (always).\n- The equivalent is valid **only at the terminals**. Internal currents, voltages\n  and powers are not preserved.\n- Dependent sources are never deactivated — this is where most marks are lost.\n"}, {"num": "10", "title": "Norton's Theorem", "body": "\n## 10.1 Statement\n\n> Any linear two-terminal network can be replaced, as seen from those terminals,\n> by a single current source I_N in parallel with a single resistance R_N.\n\n- **I_N** = the **short-circuit current** at the terminals\n- **R_N** = R_th, found exactly as in Module 09\n\nNorton is the dual of Thévenin. Everything true of one is true of the other with\n\"voltage/series\" and \"current/parallel\" swapped.\n\n## 10.2 The relationship between them\n\n    I_N = V_th / R_th          V_th = I_N R_N          R_N = R_th\n\nThis is just source transformation (Module 08) applied to the equivalent itself.\nGiven either equivalent you have the other immediately — so in practice you find\nwhichever is easier and convert.\n\nThe three quantities V_th, I_N and R_th are linked by R_th = V_oc/I_sc, so\n**any two of them determine the third**. Finding two is always enough.\n\n## 10.3 Which to use\n\n| Use Thévenin when | Use Norton when |\n|---|---|\n| The load is in series | The load is in parallel |\n| Sources are mostly voltage sources | Sources are mostly current sources |\n| You want load voltage | You want load current |\n| Combining with mesh analysis | Combining with nodal analysis |\n\nNeither is more \"correct\". They describe the same straight-line v–i\ncharacteristic, seen from different ends:\n\n    V = V_th − I R_th       (Thévenin form)\n    I = I_N − V/R_N         (Norton form)\n\nThe intercepts are V_th (at I = 0) and I_N (at V = 0), and the slope is R_th\neither way.\n\n## 10.4 Worked examples\n\n**Example 1.** Find the Norton equivalent of a 12 V source in series with 4 Ω,\nwith 12 Ω across the terminals. (Same circuit as Module 09 Example 1.)\n\n*I_N* — short the terminals. The 12 Ω is shorted out:\n\n    I_N = 12/4 = 3 A\n\n*R_N* — sources off: 4 ∥ 12 = 3 Ω\n\nEquivalent: **3 A in parallel with 3 Ω**\n\nCross-check against Thévenin: V_th = I_N R_N = 3 × 3 = 9 V ✓ (matches\nModule 09)\n\nLoad current into 6 Ω, by current divider:\n\n    I_L = 3 × 3/(3+6) = 1 A ✓\n\n**Example 2 — current-source network.**\nA 6 A source in parallel with 10 Ω, feeding a 15 Ω in series to the terminals.\nFind the Norton equivalent.\n\n*I_N* — short the terminals. The 15 Ω is then in parallel with the 10 Ω, and the\n6 A divides:\n\n    I_N = 6 × 10/(10+15) = 2.4 A\n\n*R_N* — open the 6 A source: 10 Ω in series with 15 Ω = 25 Ω\n\nEquivalent: **2.4 A in parallel with 25 Ω**\n\nCheck: V_th = 2.4 × 25 = 60 V. Directly, the open-circuit voltage is the 6 A\nthrough the 10 Ω (no current flows in the 15 Ω when open), giving\n6 × 10 = 60 V ✓\n\n**Example 3 — mixed sources.**\nA 24 V source in series with 6 Ω, in parallel with a 2 A source, feeding\nterminals a–b.\n\nTransform the 24 V/6 Ω into 4 A ∥ 6 Ω. Now two parallel current sources:\n\n    I_N = 4 + 2 = 6 A\n    R_N = 6 Ω\n\nEquivalent: **6 A in parallel with 6 Ω**, i.e. V_th = 36 V behind 6 Ω.\n\n**Example 4 — with a dependent source.**\nUsing the network from Module 09 Example 4, R_N = R_th = 5 Ω. If the\nopen-circuit voltage of that network is 3 V, then\n\n    I_N = V_th/R_th = 3/5 = 0.6 A\n\n## 10.5 Exercises\n\n1. Convert a Thévenin equivalent of 18 V behind 9 Ω to Norton form. (2 A ∥ 9 Ω)\n2. A network has I_sc = 4 A and V_oc = 24 V. Give both equivalents.\n   (24 V + 6 Ω; 4 A ∥ 6 Ω)\n3. Find the Norton equivalent of a 5 A source in parallel with 4 Ω, in series\n   with 6 Ω to the terminals. (2 A ∥ 10 Ω)\n4. For a source with V_oc = 10 V and R_th = 5 Ω, sketch the v–i line and mark\n   both intercepts.\n5. A load of 2 Ω is connected to the equivalent of Exercise 3. Find the load\n   current and voltage. (1.667 A; 3.33 V)\n\n## Takeaways\n\n- I_N = short-circuit current, R_N = R_th.\n- I_N = V_th/R_th — the two equivalents are one source transformation apart.\n- Any two of V_th, I_N, R_th give the third.\n- Pick the form that matches how the load connects and which analysis method you\n  are already using.\n"}, {"num": "11", "title": "Maximum Power Transfer", "body": "\n## 11.1 The question\n\nGiven a source network with a fixed Thévenin equivalent (V_th, R_th), what load\nresistance R_L extracts the most power?\n\nThis is a genuinely different question from \"what load gets the most voltage\"\n(answer: an open circuit) or \"the most current\" (answer: a short circuit).\nNeither of those extremes delivers any power at all — one has no current, the\nother no voltage. The maximum sits between them.\n\n## 11.2 Derivation\n\nWith the load connected:\n\n    I = V_th/(R_th + R_L)\n    P_L = I²R_L = V_th² R_L / (R_th + R_L)²\n\nDifferentiate with respect to R_L and set to zero. Using the quotient rule:\n\n    dP/dR_L = V_th² [(R_th + R_L)² − R_L · 2(R_th + R_L)] / (R_th + R_L)⁴\n            = V_th² [(R_th + R_L) − 2R_L] / (R_th + R_L)³\n            = V_th² (R_th − R_L) / (R_th + R_L)³\n\nThis is zero when\n\n    R_L = R_th\n\nand the second derivative is negative there, confirming a maximum.\n\n## 11.3 The result\n\n> **Maximum power is transferred to the load when R_L = R_th.**\n\nThe maximum power itself:\n\n    P_max = V_th² R_th / (2R_th)² = V_th² / (4R_th)\n\nEquivalently, in terms of the Norton form, P_max = I_N² R_th/4.\n\n## 11.4 Efficiency — the part that matters in practice\n\nAt the matched condition, the load and R_th carry the same current and have the\nsame resistance, so they dissipate **equal power**. Therefore:\n\n    η = P_L/P_total = 50%\n\n**Half the energy is wasted inside the source.** This is why matched loading is\nused in signal and communications systems — where the signal is precious and the\npower is negligible — and **never** in power systems, where wasting half the\ngenerated energy would be catastrophic.\n\nA power distribution network deliberately operates with R_L ≫ R_th, sacrificing\nmaximum power transfer for efficiency in the 90%+ range. The two goals are in\ndirect conflict, and knowing which one applies is an engineering judgement, not\na formula.\n\n### Shape of the curve\n\nThe peak is **broad and flat**. Because P depends on the ratio R_L/R_th:\n\n| R_L/R_th | P/P_max |\n|---|---|\n| 0.5 | 0.889 |\n| 0.8 | 0.988 |\n| 1.0 | 1.000 |\n| 1.25 | 0.988 |\n| 2.0 | 0.889 |\n| 5.0 | 0.556 |\n\nSo a mismatch of ±25% costs barely 1% of the available power. Precise matching\nmatters far less than people assume — a useful practical fact.\n\n## 11.5 Variants worth knowing\n\n**Fixed load, variable source resistance.** If R_L is fixed and R_th can vary,\nthe answer is *not* R_th = R_L — it is **R_th as small as possible**, because\nevery ohm of R_th only wastes power. The symmetric-looking answer is wrong here.\nRead the question carefully to see which resistance is the free variable.\n\n**Constrained range.** If R_L is restricted to a range that excludes R_th,\nP_L is monotonic over that range, so pick whichever endpoint is closest to R_th.\n\n**AC circuits.** With impedances, maximum power transfer requires the **complex\nconjugate** match:\n\n    Z_L = Z_th*        i.e.   R_L = R_th  and  X_L = −X_th\n\nThe reactance is cancelled, not matched. If only the magnitude |Z_L| may vary\nwith a fixed angle, the condition becomes |Z_L| = |Z_th| instead. See Module 17.\n\n## 11.6 Worked examples\n\n**Example 1.** A network has V_th = 24 V, R_th = 8 Ω. Find R_L for maximum\npower, that power, and the efficiency.\n\n    R_L = 8 Ω\n    P_max = V_th²/(4R_th) = 576/32 = 18 W\n    Check: I = 24/16 = 1.5 A, P_L = 1.5²(8) = 18 W ✓\n    Power in R_th = 18 W, total = 36 W, η = 50%\n\n**Example 2.** For Module 09 Example 1 (V_th = 9 V, R_th = 3 Ω), find the\nmaximum power available and compare with the 6 Ω load used there.\n\n    P_max = 81/12 = 6.75 W at R_L = 3 Ω\n    With 6 Ω: I = 9/9 = 1 A, P = 1²(6) = 6 W\n\nSo the 6 Ω load, though mismatched 2:1, still gets 6/6.75 = **89%** of the\navailable power — exactly as the table in §11.4 predicts.\n\n**Example 3.** A 12 V battery with 0.5 Ω internal resistance. What load draws\nmaximum power, and would you ever use it?\n\n    R_L = 0.5 Ω,  P_max = 144/2 = 72 W\n\nBut the battery itself would also dissipate 72 W, at 24 A. It would overheat\nrapidly and the efficiency would be 50%. In practice you would never load a\nbattery this way — this is the classic illustration that maximum power transfer\nis a signal-engineering criterion, not a power-engineering one.\n\n**Example 4 — the variable-source-resistance trap.**\nA fixed 10 Ω load is fed by a source whose internal resistance can be chosen\nanywhere from 2 Ω to 40 Ω. What value maximises load power?\n\nNot 10 Ω. Choose **R_th = 2 Ω**, the smallest available, since\n\n    P_L = V_th²(10)/(R_th + 10)²\n\ndecreases monotonically as R_th grows.\n\n## 11.7 Exercises\n\n1. V_th = 40 V, R_th = 20 Ω. Find R_L, P_max and η. (20 Ω, 20 W, 50%)\n2. A source delivers 100 W to a matched load. What is V_th if R_th = 25 Ω?\n   (100 V)\n3. A network's Norton equivalent is 3 A ∥ 12 Ω. Find P_max. (27 W)\n4. Show that at R_L = 4R_th the load receives 64% of P_max.\n5. Explain why a 400 kV transmission line is not operated at matched load.\n\n## Takeaways\n\n- R_L = R_th for maximum power; P_max = V_th²/(4R_th).\n- Efficiency at match is exactly 50% — fine for signals, unacceptable for power.\n- The peak is flat: ±25% mismatch costs about 1%.\n- If it is R_th that varies rather than R_L, the answer flips to \"make R_th as\n  small as possible\".\n"}, {"num": "12", "title": "Millman, Reciprocity, Substitution and Tellegen", "body": "\nThe four theorems here are narrower than Thévenin and Norton but each solves one\nclass of problem very quickly.\n\n## 12.1 Millman's theorem\n\nFor several **practical voltage sources connected in parallel** across a common\npair of terminals, the single equivalent is:\n\n    V_eq = (V_1G_1 + V_2G_2 + … + V_nG_n) / (G_1 + G_2 + … + G_n)\n    R_eq = 1 / (G_1 + G_2 + … + G_n)\n\nwith G_k = 1/R_k. In resistance form:\n\n    V_eq = (V_1/R_1 + V_2/R_2 + … ) / (1/R_1 + 1/R_2 + … )\n\n**What it really is:** a weighted average of the source voltages, weighted by\nconductance. The stiffest source (lowest R) dominates — which is exactly what\nyour intuition about paralleled batteries should say.\n\n**Conditions:** all branches must be in parallel between the *same* two nodes.\nA branch with no source is included with V_k = 0 (it still contributes its\nconductance to the denominator).\n\n**Example.** Three sources across common terminals: 12 V with 2 Ω, 10 V with\n4 Ω, and 6 V with 4 Ω.\n\n    Numerator = 12/2 + 10/4 + 6/4 = 6 + 2.5 + 1.5 = 10\n    Denominator = 1/2 + 1/4 + 1/4 = 1.0\n    V_eq = 10 V,   R_eq = 1 Ω\n\nNote this is just a one-line nodal analysis. Millman is nodal analysis for the\nsingle-node case, pre-solved.\n\n## 12.2 Reciprocity theorem\n\n> In a linear, **passive**, bilateral network with a **single** source, the\n> source and the response may be interchanged without changing the ratio between\n> them.\n\nPut a voltage source in branch A and measure the current in branch B. Move the\nsame source to branch B: the current now measured in branch A is **identical**.\n\n    I_B / V_A = I_A / V_B\n\n**Strict conditions — all four must hold:**\n1. Linear\n2. Passive — **no dependent sources**, no amplifiers\n3. Bilateral — elements behave the same in both directions (resistors do; diodes\n   do not)\n4. A single independent source\n\nReciprocity fails immediately if a dependent source is present. That is the\npoint of the \"passive\" requirement, and it is why transistor circuits are not\nreciprocal — which is precisely what makes amplification possible.\n\n**Use:** it halves the work when a problem asks for the same network driven from\ntwo different branches, and it is a powerful sanity check on a long solution.\n\n## 12.3 Substitution theorem\n\n> Any branch in a network may be replaced by any other branch that produces the\n> **same voltage across it and current through it**, without disturbing the rest\n> of the circuit.\n\nIf a branch carries 2 A with 6 V across it, it may be replaced by:\n- a 3 Ω resistor, or\n- a 6 V source, or\n- a 2 A source, or\n- any combination with the same terminal v and i.\n\n**Use:** it justifies replacing a complicated subnetwork with a single measured\nsource once you know its operating point, and it is the formal basis for the\n\"replace the load with a source\" step in several proofs. Its limitation is that\nthe substitution is valid **only at that one operating point** — change anything\nelse in the circuit and the equivalence is void.\n\n## 12.4 Compensation theorem\n\n> If a resistance R in a branch carrying current I changes by ΔR, the change in\n> all other currents and voltages is the same as would be produced by inserting\n> a voltage source of value **V_c = I·ΔR** in that branch, opposing the original\n> current, with all other sources deactivated.\n\n**Use:** sensitivity analysis. It tells you how much a circuit's behaviour shifts\nwhen one component drifts, without re-solving the whole network — useful for\ntolerance and error budgets.\n\n**Example.** A branch carries 0.5 A through 20 Ω. The resistor is replaced by a\n22 Ω (a +2 Ω change). The perturbation is equivalent to a source of\n\n    V_c = 0.5 × 2 = 1 V\n\ninserted in opposition, with the original sources off. Solve that much simpler\ncircuit to get the change in every current.\n\n## 12.5 Tellegen's theorem\n\n> For **any** network satisfying KCL and KVL, with branch voltages v_k and\n> branch currents i_k taken in the passive sign convention:\n\n    Σ v_k i_k = 0\n\nThe remarkable part: this needs **no** assumption of linearity, and the elements\nneed not even be the same in the two sets. It depends only on the *topology* —\non KCL and KVL holding — not on what the elements are.\n\nFor a single network it reduces to conservation of power (Module 01). Its deeper\nuse is in network theory proofs and in checking large simulations.\n\n## 12.6 Which theorem for which problem\n\n| Problem shape | Reach for |\n|---|---|\n| Find what a load does | Thévenin or Norton |\n| Best load for max power | Maximum power transfer |\n| Several sources, want one contribution | Superposition |\n| Simplify a source chain | Source transformation |\n| Several parallel practical sources | Millman |\n| Same network driven from two branches | Reciprocity |\n| One component's value drifts | Compensation |\n| Check a solved circuit | Tellegen / Σp = 0 |\n\n## 12.7 Exercises\n\n1. Four sources in parallel: 24 V/6 Ω, 12 V/4 Ω, 0 V/12 Ω, 18 V/9 Ω. Find the\n   Millman equivalent. (V_eq = 14.73 V, R_eq = 1.636 Ω)\n2. A 10 V source in branch A causes 0.4 A in branch B. What current would it\n   cause in A if moved to B? (0.4 A)\n3. A branch carries 1.5 A through 8 Ω. It is changed to 8.5 Ω. Give the\n   compensating source value. (0.75 V)\n4. Why does reciprocity fail for a circuit containing a CCCS?\n5. Verify Tellegen's theorem on Module 04 Example 3.\n\n## Takeaways\n\n- Millman = one-line nodal analysis for parallel practical sources; it is a\n  conductance-weighted average.\n- Reciprocity needs linear, passive, bilateral, single-source — dependent sources\n  kill it.\n- Substitution is valid only at the operating point it was derived from.\n- Compensation converts a component change into an equivalent source.\n- Tellegen needs only KCL and KVL — topology alone.\n"}, {"num": "13", "title": "Capacitors and Inductors", "body": "\nEverything up to here has been resistive, so nothing in the circuit had any\nmemory. Capacitors and inductors **store energy**, which means their behaviour\ndepends on the past, not just the present. That is what makes the rest of this\ncourse — transients, oscillations, transforms — necessary.\n\n## 13.1 The capacitor\n\nTwo conductors separated by a dielectric. Charge q accumulates in proportion to\nvoltage:\n\n    q = Cv          C in farads (F)\n\nDifferentiating, and this is the defining relation:\n\n    i = C dv/dt\n\n**Read it carefully.** Current flows only when voltage is *changing*. Under DC\nsteady state dv/dt = 0, so i = 0: a capacitor is an **open circuit to DC**.\n\nThe inverse relation:\n\n    v(t) = (1/C)∫i dt + v(t_0)\n\n**Energy stored:**\n\n    w = ½Cv²        [J]\n\nThe energy is in the electric field between the plates. A capacitor never\ndissipates — it returns everything it stores.\n\n### The continuity rule\n\n> **The voltage across a capacitor cannot change instantaneously.**\n\nBecause i = C dv/dt, a step change in v would require infinite current. So\nv_C(0⁺) = v_C(0⁻) — the voltage just after switching equals the voltage just\nbefore. This one fact supplies the initial condition for every transient problem\nin Modules 15 and 16.\n\n(The exception is an idealised circuit where a capacitor is switched directly\nacross a voltage source or another capacitor with no resistance. That produces an\nimpulse of current, and real circuits avoid it — the wiring's own resistance\nsaves you.)\n\n### Combinations\n\nCapacitors combine **opposite to resistors**:\n\n    Series:   1/C_eq = 1/C_1 + 1/C_2 + …\n    Parallel: C_eq = C_1 + C_2 + …\n\nIn parallel the plate areas add, so capacitance adds. In series the effective\nseparation adds, so capacitance falls.\n\n## 13.2 The inductor\n\nA coil of wire. Flux linkage is proportional to current, and Faraday's law gives:\n\n    v = L di/dt        L in henries (H)\n\n**Current flows freely under DC** (di/dt = 0 ⇒ v = 0): an inductor is a **short\ncircuit to DC**.\n\n    i(t) = (1/L)∫v dt + i(t_0)\n\n**Energy stored:**\n\n    w = ½Li²        [J]\n\nstored in the magnetic field.\n\n### The continuity rule\n\n> **The current through an inductor cannot change instantaneously.**\n\nA step in i would demand infinite voltage. So i_L(0⁺) = i_L(0⁻).\n\nThis is why opening a switch on an inductive load produces an arc: the circuit\ntries to force di/dt to be huge, and v = L di/dt becomes enormous. Relay coils\nget a flyback diode for exactly this reason.\n\n### Combinations\n\nInductors combine **like resistors**:\n\n    Series:   L_eq = L_1 + L_2 + …\n    Parallel: 1/L_eq = 1/L_1 + 1/L_2 + …\n\n## 13.3 The duality table\n\nCapacitor and inductor are exact duals. Learn one column and the other follows.\n\n| | Capacitor | Inductor |\n|---|---|---|\n| Defining relation | i = C dv/dt | v = L di/dt |\n| Stores energy in | electric field | magnetic field |\n| Energy | ½Cv² | ½Li² |\n| Cannot change instantly | **voltage** | **current** |\n| At DC | open circuit | short circuit |\n| Series | 1/C_eq = Σ1/C_k | L_eq = ΣL_k |\n| Parallel | C_eq = ΣC_k | 1/L_eq = Σ1/L_k |\n| Impedance | 1/(jωC) | jωL |\n\nThe whole of duality in circuits is this swap: v ↔ i, C ↔ L, R ↔ G, series ↔\nparallel, Thévenin ↔ Norton, node ↔ mesh.\n\n## 13.4 DC steady state — a shortcut worth having\n\nAfter all transients have died away in a DC circuit:\n\n- Replace every **capacitor with an open circuit**\n- Replace every **inductor with a short circuit**\n\nWhat remains is a purely resistive network you can solve with Modules 03–06.\nThis gives you the *final* values for transient problems, and is often a whole\nexam question on its own.\n\n## 13.5 Worked examples\n\n**Example 1.** A 10 μF capacitor has v(t) = 50 sin(200t) V. Find i(t) and the\npeak energy stored.\n\n    i = C dv/dt = 10×10⁻⁶ × 50 × 200 cos(200t) = 0.1 cos(200t) A\n\nCurrent **leads** voltage by 90°, as expected for a capacitor.\n\n    w_max = ½Cv_max² = ½(10×10⁻⁶)(50²) = 12.5 mJ\n\n**Example 2.** A 0.5 H inductor carries i(t) = 4e⁻³ᵗ A. Find v(t) and the energy\nat t = 0.\n\n    v = L di/dt = 0.5 × 4(−3)e⁻³ᵗ = −6e⁻³ᵗ V\n    w(0) = ½(0.5)(4²) = 4 J\n\nThe negative voltage says the inductor is *releasing* its stored energy back into\nthe circuit as the current decays.\n\n**Example 3 — DC steady state.** A 12 V source feeds 4 Ω in series with a\nparallel combination of a 6 Ω and a capacitor; an inductor with 2 Ω in series\nbridges to ground. Find the capacitor voltage and inductor current in steady\nstate.\n\nCapacitor → open (carries no current). Inductor → short.\n\nThe circuit becomes 12 V through 4 Ω into 6 Ω ∥ 2 Ω:\n\n    6 ∥ 2 = 1.5 Ω\n    I_total = 12/(4+1.5) = 2.182 A\n    V_node = 2.182 × 1.5 = 3.273 V\n    V_C = V_node = 3.273 V     (capacitor sits across the 6 Ω branch)\n    I_L = 3.273/2 = 1.636 A\n\n**Example 4.** Three capacitors 2 μF, 3 μF, 6 μF in series. Find C_eq.\n\n    1/C_eq = 1/2 + 1/3 + 1/6 = 1  ⇒  C_eq = 1 μF\n\nNote the result is smaller than the smallest — the opposite of series resistors.\n\n## 13.6 Exercises\n\n1. A 100 μF capacitor is charged to 24 V. Find q and w. (2.4 mC, 28.8 mJ)\n2. A 20 mH inductor has v = 10 V applied for 5 ms from rest. Find the final\n   current. (2.5 A)\n3. Two capacitors 4 μF and 12 μF: find C_eq in series and in parallel.\n   (3 μF, 16 μF)\n4. A capacitor voltage is v = 5t² V for a 2 mF capacitor. Find i(t). (0.02t A)\n5. Explain physically why opening a switch in series with an inductor causes a\n   spark, but opening a switch in series with a capacitor does not.\n\n## Takeaways\n\n- i = C dv/dt and v = L di/dt. Everything else follows.\n- v_C and i_L are **continuous** — they set the initial conditions of every\n  transient.\n- At DC: C is open, L is short.\n- Capacitors and inductors are exact duals; learn the table once.\n"}, {"num": "14", "title": "Elementary Signals", "body": "\nThis module follows the ELE 712 lecture notes closely. It is broader than a\ncircuits treatment of signals: it covers **discrete-time** signals, the full\ncatalogue of standard signals, the operations you can perform on them, and the\nclassification scheme — all of which the notes examine directly.\n\n## 14.1 What a signal is\n\nA signal is a **single-valued function of one or more independent variables that\ncarries information**. Usually the independent variable is time, but it may be\ntemperature, pressure or distance.\n\n- **One-dimensional**: depends on one variable, e.g. x(t).\n- **Two-dimensional**: depends on two, e.g. an image f(x, y).\n\n**Continuous-time (CT)** signals are defined at every instant, written x(t).\n**Discrete-time (DT)** signals are defined only at discrete instants, written\nx(n), where n is an **integer**.\n\n## 14.2 Four ways of representing a discrete-time signal\n\n> **Why \"discrete-time\" and not just \"signal\".** This four-way list belongs\n> specifically to **discrete-time** signals, and the lecture notes head the\n> section the same way. The reason is the fourth entry: a *sequence* is a list\n> of values at integer instants, and a continuous-time signal has no such list —\n> it has a value at every instant, uncountably many. The first three do carry\n> over (a continuous signal can be drawn, written as a formula, or sampled into\n> a table), but only a discrete signal can be written out in full. So the\n> heading is not a slip: four ways is a discrete-time count, and for continuous\n> time it would be graphical and functional only.\n\nTake the signal with\nx(−2) = −3, x(−1) = 2, x(0) = 0, x(1) = 3, x(2) = 1, x(3) = 2.\n\n**1. Graphical** — a **stem plot**: at each integer n, a vertical line of the\nright height with a dot at its tip. The dots matter — they say the signal exists\n*only* at the integers, and joining them with a continuous line would assert\nsomething false about the instants in between.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 440 210\" role=\"img\" aria-label=\"Stem plot of the discrete signal x(n) equal to minus 3, 2, 0, 3, 1, 2 at n from minus 2 to 3\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker></defs><line x1=\"60.0\" y1=\"105.0\" x2=\"384.0\" y2=\"105.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"202.7\" y1=\"180.0\" x2=\"202.7\" y2=\"36.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"394.0\" y=\"109.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">n</text><text x=\"207.7\" y=\"32.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">x(n)</text><line x1=\"113.5\" y1=\"114.0\" x2=\"113.5\" y2=\"96.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"113.5\" y=\"120.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-2</text><line x1=\"158.1\" y1=\"114.0\" x2=\"158.1\" y2=\"96.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"158.1\" y=\"120.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-1</text><line x1=\"247.3\" y1=\"114.0\" x2=\"247.3\" y2=\"96.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"247.3\" y=\"120.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><line x1=\"291.9\" y1=\"114.0\" x2=\"291.9\" y2=\"96.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"291.9\" y=\"120.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">2</text><line x1=\"336.5\" y1=\"114.0\" x2=\"336.5\" y2=\"96.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"336.5\" y=\"120.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">3</text><line x1=\"66.6\" y1=\"161.2\" x2=\"76.5\" y2=\"161.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"197.7\" y=\"165.2\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-3</text><line x1=\"66.6\" y1=\"142.5\" x2=\"76.5\" y2=\"142.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"197.7\" y=\"146.5\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-2</text><line x1=\"66.6\" y1=\"123.8\" x2=\"76.5\" y2=\"123.8\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"197.7\" y=\"127.8\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-1</text><line x1=\"66.6\" y1=\"86.2\" x2=\"76.5\" y2=\"86.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"197.7\" y=\"90.2\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><line x1=\"66.6\" y1=\"67.5\" x2=\"76.5\" y2=\"67.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"197.7\" y=\"71.5\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">2</text><line x1=\"66.6\" y1=\"48.8\" x2=\"76.5\" y2=\"48.8\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"197.7\" y=\"52.8\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">3</text><line x1=\"113.5\" y1=\"105.0\" x2=\"113.5\" y2=\"161.2\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\"/><circle cx=\"113.5\" cy=\"161.2\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><line x1=\"158.1\" y1=\"105.0\" x2=\"158.1\" y2=\"67.5\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\"/><circle cx=\"158.1\" cy=\"67.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"202.7\" cy=\"105.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><line x1=\"247.3\" y1=\"105.0\" x2=\"247.3\" y2=\"48.8\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\"/><circle cx=\"247.3\" cy=\"48.8\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><line x1=\"291.9\" y1=\"105.0\" x2=\"291.9\" y2=\"86.2\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\"/><circle cx=\"291.9\" cy=\"86.2\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><line x1=\"336.5\" y1=\"105.0\" x2=\"336.5\" y2=\"67.5\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\"/><circle cx=\"336.5\" cy=\"67.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/></svg><figcaption>Graphical representation of x(n) = {−3, 2, 0, 3, 1, 2}. The signal exists only at integer n; the stems and dots say so, and x(0) = 0 is a real value, not an absence.</figcaption></figure>\n```\n\n**2. Tabular** — sampling instant against magnitude:\n\n| n | −2 | −1 | 0 | 1 | 2 | 3 |\n|---|---|---|---|---|---|---|\n| x(n) | −3 | 2 | 0 | 3 | 1 | 2 |\n\n**3. Functional** — the amplitude written against the values of n:\n\n```cases\nlhs: x(n)  =\n−3 ; n = −2\n2 ; n = −1\n0 ; n = 0\n3 ; n = 1\n1 ; n = 2\n2 ; n = 3\n```\n\nor as a rule:\n\n```cases\nlhs: x(n)  =\n3ⁿ ; n ≥ 0\n0 ; n < 0\n```\n\n**4. Sequence** — list the values with an arrow marking n = 0:\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 430 96\" role=\"img\" aria-label=\"The sequence representation with an arrow marking which term sits at n equals zero\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker></defs><text x=\"30\" y=\"40\" font-size=\"15\" style=\"fill:currentColor\">x(n)  =</text><text x=\"104\" y=\"40\" font-size=\"19\" style=\"fill:currentColor\" opacity=\".6\">{</text><text x=\"128\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--copper,#B4622F)\">−3</text><text x=\"151\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:currentColor\" opacity=\".5\">,</text><text x=\"174\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--copper,#B4622F)\">2</text><text x=\"197\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:currentColor\" opacity=\".5\">,</text><text x=\"220\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--copper,#B4622F)\">0</text><text x=\"243\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:currentColor\" opacity=\".5\">,</text><text x=\"266\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--copper,#B4622F)\">3</text><text x=\"289\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:currentColor\" opacity=\".5\">,</text><text x=\"312\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--copper,#B4622F)\">1</text><text x=\"335\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:currentColor\" opacity=\".5\">,</text><text x=\"358\" y=\"40\" text-anchor=\"middle\" font-size=\"15\" style=\"fill:var(--copper,#B4622F)\">2</text><text x=\"384\" y=\"40\" font-size=\"19\" style=\"fill:currentColor\" opacity=\".6\">}</text><line x1=\"220\" y1=\"66\" x2=\"220\" y2=\"50\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"220\" y=\"82\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:var(--teal,#1C6E7E)\">n = 0</text></svg><figcaption>The sequence representation. The arrow says which term sits at n = 0 — here the third, so the signal starts two samples before the origin.</figcaption></figure>\n```\n\n**The arrow is not decoration.** If no arrow is shown, the convention is that\nthe **first term corresponds to n = 0**. Losing the arrow shifts the whole\nsignal, which changes every subsequent answer.\n\n## 14.3 The standard signals\n\n### (i) Unit step\n\n```cases\nlhs: u(t)  =\n1 ; t ≥ 0\n0 ; t < 0\n```\n\nIts usefulness: multiplying any signal by u(t) forces it to start at t = 0.\n\nShifted: u(t − a) switches on at t = a.\n\nDiscrete:\n\n```cases\nlhs: u(n)  =\n1 ; n ≥ 0\n0 ; n < 0\n```\n\nwith the shifted version u(n − k) switching on at n = k.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 530 165\" role=\"img\" aria-label=\"Unit step and the same step delayed to t equals a\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker></defs><line x1=\"60.0\" y1=\"123.2\" x2=\"244.0\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"120.5\" y1=\"144.0\" x2=\"120.5\" y2=\"40.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"254.0\" y=\"127.2\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">t</text><line x1=\"163.6\" y1=\"129.8\" x2=\"163.6\" y2=\"116.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"163.6\" y=\"138.2\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><line x1=\"206.8\" y1=\"129.8\" x2=\"206.8\" y2=\"116.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"206.8\" y=\"138.2\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">2</text><polyline points=\"60.0,123.2 120.5,123.2\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><polyline points=\"120.5,63.7 250.0,63.7\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"120.5\" y1=\"123.2\" x2=\"120.5\" y2=\"63.7\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"155.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor\" opacity=\".85\">u(t)</text><line x1=\"290.0\" y1=\"123.2\" x2=\"474.0\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"350.5\" y1=\"144.0\" x2=\"350.5\" y2=\"40.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"484.0\" y=\"127.2\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">t</text><line x1=\"393.6\" y1=\"129.8\" x2=\"393.6\" y2=\"116.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"393.6\" y=\"138.2\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><line x1=\"436.8\" y1=\"129.8\" x2=\"436.8\" y2=\"116.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"436.8\" y=\"138.2\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">2</text><polyline points=\"290.0,123.2 402.3,123.2\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><polyline points=\"402.3,63.7 480.0,63.7\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"402.3\" y1=\"123.2\" x2=\"402.3\" y2=\"63.7\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><text x=\"402.3\" y=\"138.2\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">a</text><text x=\"385.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor\" opacity=\".85\">u(t − a)</text></svg><figcaption>The unit step, and the same step delayed to t = a. Subtracting a from the argument moves the signal later — the opposite of what the minus sign suggests at first glance.</figcaption></figure>\n```\n\n### (ii) Unit ramp\n\n```cases\nlhs: r(t)  =\nt ; t ≥ 0\n0 ; t < 0\n```\n\nor, compactly, r(t) = t·u(t).\n\nShifted: r(t − a) = (t − a)u(t − a).\nDiscrete:\n\n```cases\nlhs: r(n)  =\nn ; n ≥ 0\n0 ; n < 0\n```\n\nso r(n) = n·u(n), and r(n − k) = (n − k)u(n − k).\n\n### (iii) Unit impulse (Dirac delta)\n\n```cases\nlhs: δ(t)  =\nunbounded ; t = 0\n0 ; t ≠ 0\n```\n\n    with      ∫_{−∞}^{∞} δ(t) dt = 1\n\n> **A point of care.** The lecture notes write \"δ(t) = 1 for t = 0\". Read that\n> as shorthand. The impulse is not *equal to 1* at the origin — it is unbounded\n> there, and what equals 1 is its **area**. Everything the impulse does follows\n> from the area, so keep that in mind whenever you use it.\n\nRelationship to the step:\n\n    δ(t) = du/dt        u(t) = ∫_{−∞}^{t} δ(τ) dτ\n\n(Note the upper limit is **t**, not ∞; integrating to ∞ would just give 1.)\n\n**Sifting property** — the property you actually use:\n\n    ∫ f(t) δ(t − a) dt = f(a)\n\nDiscrete:\n\n```cases\nlhs: δ(n)  =\n1 ; n = 0\n0 ; n ≠ 0\n```\n\nand δ(n − k) = 1 at n = k, zero elsewhere. For the discrete\nimpulse the value at the origin genuinely **is** 1 — the CT and DT impulses are\ndifferent objects, and only the DT one is an ordinary function.\n\n### (iv) Unit parabolic\n\n```cases\nlhs: p(t)  =\nt²/2 ; t ≥ 0\n0 ; t < 0\n```\n\nor, compactly, p(t) = (t²/2)u(t).\n\nShifted: p(t − a) = ((t−a)²/2)u(t − a).\nDiscrete:\n\n```cases\nlhs: p(n)  =\nn²/2 ; n ≥ 0\n0 ; n < 0\n```\n\n**The integration chain.** Each of these is the integral of the one before:\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 852 200\" role=\"img\" aria-label=\"Impulse, step, ramp and parabolic functions in a row, joined by integration arrows\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker><marker id=\"ar2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"46.0\" y1=\"129.2\" x2=\"215.0\" y2=\"129.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"104.3\" y1=\"150.0\" x2=\"104.3\" y2=\"46.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"225.0\" y=\"133.2\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">t</text><line x1=\"149.2\" y1=\"135.8\" x2=\"149.2\" y2=\"122.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"149.2\" y=\"144.2\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><line x1=\"194.1\" y1=\"135.8\" x2=\"194.1\" y2=\"122.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"194.1\" y=\"144.2\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">2</text><line x1=\"104.3\" y1=\"129.2\" x2=\"104.3\" y2=\"69.7\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" opacity=\"1.0\"/><circle cx=\"104.3\" cy=\"69.7\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><text x=\"98.3\" y=\"73.7\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">1</text><text x \" opacity=\"0.75\">2</text><polyline points=\"637.0,129.2 695.3,129.2\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><polyline points=\"695.3,129.2 696.6,129.2 697.9,129.1 699.1,129.0 700.4,128.8 701.7,128.6 703.0,128.3 704.2,128.0 705.5,127.7 706.8,127.3 708.0,126.8 709.3,126.3 710.6,125.8 711.9,125.2 713.1,124.5 714.4,123.8 715.7,123.1 716.9,122.3 718.2,121.5 719.5,120.6 720.8,119.6 722.0,118.7 723.3,117.6 724.6,116.6 725.8,115.4 727.1,114.3 728.4,113.1 729.7,111.8 730.9,110.5 732.2,109.1 733.5,107.7 734.7,106.3 736.0,104.8 737.3,103.2 738.6,101.6 739.8,100.0 741.1,98.3 742.4,96.5 743.6,94.7 744.9,92.9 746.2,91.0 747.5,89.1 748.7,87.1 750.0,85.1 751.3,83.0 752.5,80.9 753.8,78.7 755.1,76.5 756.4,74.2 757.6,71.9 758.9,69.5 760.2,67.1 761.4,64.7 762.7,62.1 764.0,59.6 765.3,57.0 766.5,54.3 767.8,51.6 769.1,48.9 770.3,46.1 771.6,43.3\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"724.5\" y=\"31.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor\" opacity=\".85\">p(t) = t²/2·u(t)  parabolic</text><line x1=\"224\" y1=\"100\" x2=\"234\" y2=\"100\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" marker-end=\"url(#ar2)\"/><text x=\"232\" y=\"93\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E)\">∫</text><line x1=\"421\" y1=\"100\" x2=\"431\" y2=\"100\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" marker-end=\"url(#ar2)\"/><text x=\"429\" y=\"93\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E)\">∫</text><line x1=\"618\" y1=\"100\" x2=\"628\" y2=\"100\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" marker-end=\"url(#ar2)\"/><text x=\"626\" y=\"93\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E)\">∫</text><text x=\"429\" y=\"185\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor\" opacity=\".7\">each is the integral of the one before; differentiating runs the other way</text></svg><figcaption>The four singularity functions. Integrating moves right along the chain, differentiating moves left — so remembering any one of the four gives you the other three.</figcaption></figure>\n```\n\n    δ(t)  →  u(t)  →  r(t)  →  p(t)\n           ∫        ∫        ∫\n\nand differentiating runs the other way:\n\n    r(t) = dp/dt        u(t) = d²p/dt²        δ(t) = d³p/dt³\n\nKnowing this chain means you only have to remember one transform of the four.\n\n### (v) Sinusoidal\n\n    x(t) = A sin(ωt + φ)\n\nA = amplitude, ω = angular frequency (rad/s), φ = phase (rad),\nT = 1/f = 2π/ω.\n\nDiscrete: x(n) = A sin(ωn + φ), with period N = 2πm/ω for integers N, m.\n\n> **A discrete sinusoid is not automatically periodic.** For x(n) to repeat,\n> ω must be a **rational multiple of 2π**. This has no continuous-time analogue\n> — every CT sinusoid is periodic — and it is a favourite examination point.\n\n### (vi) Real exponential\n\n    x(t) = A e^{αt}\n\nThree cases, decided entirely by α:\n\n| α | Behaviour |\n|---|---|\n| α = 0 | constant for all time |\n| α > 0 | grows exponentially |\n| α < 0 | decays exponentially |\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 165\" role=\"img\" aria-label=\"Real exponential A e to the alpha t for alpha zero, positive and negative\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker></defs><line x1=\"52.0\" y1=\"139.5\" x2=\"196.0\" y2=\"139.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"73.4\" y1=\"146.0\" x2=\"73.4\" y2=\"42.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#a  systems where the\nresponse to positive and negative error must differ.\n\n### (x) Sinc\n\n    sinc(t) = sin(t)/t,     −∞ < t < ∞\n\nwith sinc(0) = 1 (by the limit). It is **even**, oscillates with period 2π, and\ndecays as 1/t. It is the Fourier transform of a rectangular pulse — which is why\nit governs everything about sampling and bandwidth (Module 22).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 155\" role=\"img\" aria-label=\"Rectangular pulse, signum function and sinc function\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker></defs><line x1=\"48.0\" y1=\"87.7\" x2=\"192.0\" y2=\"87.7\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"123.0\" y1=\"136.0\" x2=\"123.0\" y2=\"42.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"202.0\" y=\"91.7\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">t</text><line x1=\"51.0\" y1=\"53.2\" x2=\"55.5\" y2=\"53.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"118.0\" y=\"57.2\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><polyline points=\"48.0,87.7 88.9,87.7\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"88.9\" y1=\"87.7\" x2=\"88.9\" y2=\"53.2\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" opacity=\"1.0\"/><polyline points=\"88.9,53.2 157.1,53.2\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"157.1\" y1=\"53.2\" x2=\"157.1\" y2=\"87.7\" style=\"stroke:var(--copper,#B4622F)\" stroke-widt t₀)\n\n- t₀ **positive** → shift **right** → **delay**\n- t₀ **negative** → shift **left** → **advance**\n\nThe sign trips people up: subtracting from t moves the signal *later*.\n\nDiscrete: y(n) = x(n − N), N an integer.\n\n### Time reversal\n\n    y(t) = x(−t)\n\nA mirror image about the vertical axis. An **even** signal is unchanged by\nreversal; an **odd** signal is negated.\n\n### Time scaling\n\n    y(t) = x(at)\n\n- a > 1 → **compression** by a factor a (the signal happens faster)\n- a < 1 → **expansion** by a factor a (slower)\n\nNote the inversion: multiplying t by a *larger* number makes the signal\n*shorter*. A useful check — x(2t) reaches whatever x(t) reached at t = 2 by the\ntime t = 1.\n\n### Amplitude scaling\n\n    y(t) = A x(t)\n\nA > 1 is **amplification**, A < 1 is **attenuation**.\n\n### Addition and multiplication\n\nBoth are performed **point by point**:\n\n    y(t) = x₁(t) + x₂(t)        y(t) = x₁(t) · x₂(t)\n\nSubtraction likewise. There is no shortcut — you evaluate at each instant.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 580 320\" role=\"img\" aria-label=\"One signal shown unchanged, delayed by one, time reversed, and compressed by two\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker></defs><line x1=\"60.0\" y1=\"117.7\" x2=\"254.0\" y2=\"117.7\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"146.7\" y1=\"130.0\" x2=\"146.7\" y2=\"44.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"264.0\" y=\"121.7\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">t</text><line x1=\"80.0\" y1=\"123.3\" x2=\"80.0\" y2=\"112.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity  — uncertain, irregular, cannot be described by an equation. Noise is\nthe standard example.\n\n### Periodic vs aperiodic\n\n```cases\nlhs: x(t)  =\nx(t + T) for all t ; periodic\nx(t + T) for no T ; aperiodic\n```\n\nDiscrete: x(n) = x(n + N), with N an integer period.\n\n### Energy and power signals\n\n    Energy (CT):  E = ∫_{−∞}^{∞} |x(t)|² dt\n    Energy (DT):  E = Σ_{n=−∞}^{∞} |x(n)|²\n\n    Power (CT):   P = lim_{T→∞} (1/2T) ∫_{−T}^{T} |x(t)|² dt\n    Power (DT):   P = lim_{N→∞} (1/(2N+1)) Σ_{n=−N}^{N} |x(n)|²\n\nThe classification:\n\n```cases\nlhs: x(t) is an\nenergy signal ; 0 < E < ∞, and then P = 0\npower signal ; 0 < P < ∞, and then E = ∞\nneither ; if both fail\n```\n\n**A signal cannot be both**, and some signals are neither. The rule of thumb:\nsignals that die away (pulses, decaying exponentials) are energy signals;\nsignals that persist forever (periodic signals, the step) are power signals.\n\n### Even and odd signals\n\n    Even (symmetric):      x(−t) = x(t)      — symmetric about the vertical axis\n    Odd (antisymmetric):   x(−t) = −x(t)     — and necessarily x(0) = 0\n\ncos is even; sin is odd. Same definitions for x(n).\n\n**Every signal decomposes uniquely** into an even and an odd part:\n\n    x(t) = x_e(t) + x_o(t)\n\nwith\n\n    x_e(t) = ½[x(t) + x(−t)]\n    x_o(t) = ½[x(t) − x(−t)]\n\n> **Watch the sign in the odd part.** The lecture notes' derivation is correct —\n> it reaches 2x_o(t) = x(t) − x(−t) — but the final boxed line is typed with a\n> plus, for both the continuous and discrete cases. It must be a **minus**.\n> Quick self-check: x_e + x_o should give back x(t), and with two plus signs it\n> would give x(t) + x(−t) instead. Use the minus.\n\nDiscrete: x_e(n) = ½[x(n) + x(−n)], x_o(n) = ½[x(n) − x(−n)].\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 195\" role=\"img\" aria-label=\"A signal and its even and odd parts, which sum back to the original\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><de nd the even and odd parts of\nx(t) = e^{−2t}u(t).\n\n    x(−t) = e^{2t}u(−t)\n    x_e(t) = ½[e^{−2t}u(t) + e^{2t}u(−t)]\n    x_o(t) = ½[e^{−2t}u(t) − e^{2t}u(−t)]\n\nCheck at t = +1: x_e = ½e^{−2}, x_o = ½e^{−2}, sum = e^{−2} = x(1) ✓\nCheck at t = −1: x_e = ½e^{−2}, x_o = −½e^{−2}, sum = 0 = x(−1) ✓\n\n**Example 4 — energy or power?** Classify x(t) = e^{−2t}u(t) and x(t) = 5u(t).\n\nFor e^{−2t}u(t):\n\n    E = ∫₀^∞ e^{−4t} dt = [−e^{−4t}/4]₀^∞ = 1/4\n\nFinite ⇒ **energy signal** (and P = 0).\n\nFor 5u(t):  E = ∫₀^∞ 25 dt = ∞, so compute power:\n\n    P = lim (1/2T)∫₀^T 25 dt = lim 25T/2T = 12.5\n\nFinite ⇒ **power signal**.\n\n**Example 5 — combined operations.** Given x(t), sketch x(−2t + 4).\n\nWrite it as x(−2(t − 2)). Read right to left:\n1. **Reverse** (the minus), 2. **compress** by 2, 3. **delay** by 2.\n\nCheck: the point where the argument is zero is t = 2, so whatever x did at its\nown origin now happens at t = 2 ✓\n\n**Example 6 — discrete periodicity.** Is x(n) = cos(3πn/5) periodic? What about\ncos(3n)?\n\nFor cos(3πn/5): ω = 3π/5. Is ω/2π = 3/10 rational? **Yes** ⇒ periodic, with\nN = 10 (the denominator).\n\nFor cos(3n): ω = 3, and 3/2π is **irrational** ⇒ **not periodic**, even though\nthe continuous version cos(3t) certainly is.\n\n## 14.7 Exercises\n\n1. Write the sequence representation of x(n) = {1, 4, 0, −2} with the arrow at\n   n = 1, and give its tabular form.\n2. Express a staircase: 0 V until t = 1, 3 V from 1 to 3, 7 V from 3 to 5,\n   0 after. (3u(t−1) + 4u(t−3) − 7u(t−5))\n3. Find the even and odd parts of x(t) = t + t² + t³.\n   (x_e = t², x_o = t + t³)\n4. Classify x(t) = 10cos(5t) as energy or power, and find the relevant value.\n   (Power signal; P = 50)\n5. Show sgn(t) = 2u(t) − 1 and hence write the ramp in terms of sgn.\n6. Is x(n) = sin(πn/4) + cos(πn/6) periodic? If so find N. (Yes; N = 24)\n7. Given x(t) nonzero only on 0 ≤ t ≤ 2, over what interval is x(3t − 6)\n   nonzero? (2 ≤ t ≤ 8/3)\n\n## Takeaways\n\n- Four representations of a DT signal; the arrow marking n = 0 carries meaning.\n- δ → u → r → p is an integration chain; remember one, derive the rest.\n- e^{st} with s = σ + jω generates every elementary signal — and is the reason\n  the Laplace transform looks the way it does.\n- A discrete sinusoid is periodic only when ω is a rational multiple of 2π.\n- Energy signals have finite E and zero P; power signals have finite P and\n  infinite E; never both.\n- x_e = ½[x(t) + x(−t)], x_o = ½[x(t) **−** x(−t)].\n"}, {"num": "15", "title": "First-Order Circuits", "body": "\nA circuit containing **one** energy-storage element (one C or one L) plus\nresistors is first order: its behaviour is governed by a first-order\ndifferential equation, and its response is always a single exponential.\n\n## 15.1 Source-free (natural) response\n\n### RC circuit\n\nA capacitor charged to V_0 discharges through R. KCL:\n\n    C dv/dt + v/R = 0    ⇒    dv/dt + v/(RC) = 0\n\nSolving:\n\n    v(t) = V_0 e^{−t/τ},     τ = RC\n\n### RL circuit\n\nAn inductor carrying I_0 decays through R. KVL:\n\n    L di/dt + Ri = 0\n\n    i(t) = I_0 e^{−t/τ},     τ = L/R\n\n### The time constant\n\n    τ_RC = RC        τ_RL = L/R\n\nBoth have units of seconds. Larger τ means slower response.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 620 205\" role=\"img\" aria-label=\"Exponential decay and exponential rise, marked at one time constant and at the final value\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker></defs><line x1=\"60.0\" y1=\"147.1\" x2=\"274.0\" y2=\"147.1\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"71.2\" y1=\"160.0\" x2=\"71.2\" y2=\"46.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-e .75\">1</text><polyline points=\"351.2,147.1 352.7,143.8 354.1,140.7 355.6,137.6 357.0,134.7 358.5,131.9 360.0,129.1 361.4,126.5 362.9,124.0 364.4,121.6 365.8,119.3 367.3,117.1 368.8,114.9 370.2,112.9 371.7,110.9 373.2,109.0 374.6,107.1 376.1,105.4 377.6,103.7 379.0,102.1 380.5,100.5 381.9,99.0 383.4,97.5 384.9,96.2 386.3,94.8 387.8,93.5 389.3,92.3 390.7,91.1 392.2,90.0 393.7,88.9 395.1,87.8 396.6,86.8 398.1,85.8 399.5,84.9 401.0,84.0 402.5,83.1 403.9,82.3 405.4,81.5 406.9,80.7 408.3,79.9 409.8,79.2 411.2,78.5 412.7,77.9 414.2,77.3 415.6,76.6 417.1,76.1 418.6,75.5 420.0,75.0 421.5,74.4 423.0,73.9 424.4,73.5 425.9,73.0 427.4,72.5 428.8,72.1 430.3,71.7 431.8,71.3 433.2,70.9 434.7,70.6 436.2,70.2 437.6,69.9 439.1,69.5 440.5,69.2 442.0,68.9 443.5,68.6 444.9,68.4 446.4,68.1 447.9,67.8 449.3,67.6 450.8,67.4 452.3,67.1 453.7,66.9 455.2,66.7 456.7,66.5 458.1,66.3 459.6,66.1 461.1,65.9 462.5,65.8 464.0,65.6 465.4,65.4 466.9,65.3 468.4,65.1 469.8,65.0 471.3,64.8 472.8,64.7 474.2,64.6 475.7,64.5 477.2,64.4 478.6,64.2 480.1,64.1 481.6,64.0 483.0,63.9 484.5,63.8 486.0,63.7 487.4,63.6 488.9,63.6 490.4,63.5 491.8,63.4 493.3,63.3 494.7,63.3 496.2,63.2 497.7,63.1 499.1,63.0 500.6,63.0 502.1,62.9 503.5,62.9 505.0,62.8 506.5,62.8 507.9,62.7 509.4,62.7 510.9,62.6 512.3,62.6 513.8,62.5 515.3,62.5 516.7,62.4 518.2,62.4 519.6,62.4 521.1,62.3 522.6,62.3 524.0,62.3 525.5,62.2 527.0,62.2 528.4,62.2 529.9,62.1 531.4,62.1 532.8,62.1 534.3,62.1 535.8,62.0 537.2,62.0 538.7,62.0 540.2,62.0 541.6,61.9 543.1,61.9 544.6,61.9 546.0,61.9 547.5,61.9 548.9,61.9 550.4,61.8 551.9,61.8 553.3,61.8 554.8,61.8 556.3,61.8\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"351.2\" y1=\"61.4\" x2=\"556.3\" y2=\"61.4\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.45\" stroke-dasharray=\"4 3\"/><line x1=\"388.5\" y1=\"147.1\" x2=\"388.5\" y2=\"93.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.5\" stroke-dasharray=\"3 3\"/><line x1=\"351.2\" y1=\"93.0\" x2=\"388.5\" y2=\"93.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.5\" stroke-dasharray=\"3 3\"/><text x=\"394.5\" y=\"105.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">63.2%</text><text x=\"522.7\" y=\"55.4\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.7\">final value</text><text x=\"450.0\" y=\"31.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor\" opacity=\".85\">rise  x(∞)[1 − e^(−t/τ)]</text><text x=\"310\" y=\"192\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor\" opacity=\".7\">1τ → 63% · 3τ → 95% · 5τ → effectively finished</text></svg><figcaption>Every first-order response is one of these two shapes. The time constant τ is read off at 63% — of the fall for a decay, of the rise for a step — and after 5τ the transient is over for engineering purposes.</figcaption></figure>\n```\n\n**Finding R for τ:** R is the **Thévenin resistance seen by the storage\nelement** — remove C or L, look back into the remaining network with independent\nsources deactivated, and reduce. This is the direct pay-off of Module 09, and is\nwhy the theorems came first.\n\n## 15.2 Step (complete) response\n\nWhen a DC source is switched in at t = 0, the response is the natural response\nplus a forced (steady-state) term. Rather than solve the differential equation\nevery time, use:\n\n> **The general first-order formula**\n>\n>     x(t) = x(∞) + [x(0⁺) − x(∞)] e^{−t/τ}\n\nwhere x is **v_C for a capacitive circuit** or **i_L for an inductive one** —\nthe continuous variable.\n\nThis single equation solves every first-order problem. You need three numbers.\n\n## 15.3 The three-step method\n\n**Step 1 — find x(0⁺), the initial value.**\nAnalyse the circuit *before* switching (at t = 0⁻), in DC steady state:\ncapacitor → open, inductor → short. Read off v_C(0⁻) or i_L(0⁻). By continuity\n(Module 13), x(0⁺) = x(0⁻).\n\n**Step 2 — find x(∞), the final value.**\nAnalyse the circuit *after* switching, again in DC steady state with C open and\nL short.\n\n**Step 3 — find τ.**\nWith the source deactivated, find R_th seen from the terminals of C or L. Then\nτ = R_th C or L/R_th.\n\nSubstitute into the formula. Done.\n\n**Other quantities.** Once you have v_C(t) or i_L(t), get anything else from it:\ni_C = C dv_C/dt, v_L = L di_L/dt, and resistor quantities by Ohm's law. Do **not**\napply the formula directly to a resistor current — it is not continuous and its\ninitial value is not the pre-switch value.\n\n## 15.4 Worked examples\n\n**Example 1 — RC natural response.**\nA 100 μF capacitor charged to 20 V discharges through 5 kΩ. Find v(t), the\ncurrent at t = 0⁺, and the time to fall to 5 V.\n\n    τ = RC = 5000 × 100×10⁻⁶ = 0.5 s\n    v(t) = 20e^{−2t} V\n    i(0⁺) = v/R = 20/5000 = 4 mA\n\nFor v = 5 V:\n\n    5 = 20e^{−2t}  ⇒  e^{−2t} = 0.25  ⇒  −2t = ln 0.25 = −1.386\n    t = 0.693 s\n\n(Note that is exactly τ ln 4; falling to half takes τ ln 2 = 0.347 s.)\n\n**Example 2 — RC step response.**\nA 12 V source is switched at t = 0 through 2 kΩ onto an uncharged 500 μF\ncapacitor. Find v_C(t) and the time to reach 10 V.\n\n    v_C(0⁺) = 0        (uncharged)\n    v_C(∞) = 12 V      (capacitor open, no current, no drop across R)\n    τ = 2000 × 500×10⁻⁶ = 1 s\n\n    v_C(t) = 12 + (0 − 12)e^{−t} = 12(1 − e^{−t}) V\n\nFor 10 V: 10/12 = 1 − e^{−t} ⇒ e^{−t} = 1/6 ⇒ t = ln 6 = **1.79 s**\n\n**Example 3 — RL step response with a pre-existing current.**\nA 2 H inductor is in series with 4 Ω across a 24 V source, in steady state. At\nt = 0 the source is replaced by a 12 V source. Find i(t).\n\n    i(0⁺) = i(0⁻) = 24/4 = 6 A\n    i(∞) = 12/4 = 3 A\n    τ = L/R = 2/4 = 0.5 s\n\n    i(t) = 3 + (6 − 3)e^{−2t} = 3 + 3e^{−2t} A\n\nCheck: at t = 0, i = 6 A ✓; as t → ∞, i → 3 A ✓\n\n**Example 4 — R_th found by Thévenin.**\nA 10 V source in series with 6 Ω feeds a node; from that node a 3 Ω goes to\nground and a 200 μF capacitor also goes to ground. The switch closes at t = 0\nwith the capacitor uncharged. Find v_C(t).\n\n    v_C(0⁺) = 0\n    v_C(∞): capacitor open, divider  =  10 × 3/(6+3) = 3.333 V\n    τ: deactivate the source; capacitor sees 6 ∥ 3 = 2 Ω\n       τ = 2 × 200×10⁻⁶ = 0.4 ms\n\n    v_C(t) = 3.333(1 − e^{−2500t}) V\n\n**Example 5 — finding a non-continuous quantity.**\nFor Example 4, find the current through the 3 Ω resistor at t = 0⁺ and t = ∞.\n\nAt t = 0⁺ the capacitor is uncharged, so it behaves momentarily as a **short**:\nthe node is held at 0 V, so i_3(0⁺) = 0. All the source current goes into the\ncapacitor.\n\nAt t = ∞ the capacitor is open: i_3 = 3.333/3 = 1.111 A.\n\nNote i_3 jumps from 0 to a final 1.111 A — resistor currents *may* be\ndiscontinuous. Only v_C and i_L may not.\n\n## 15.5 Two useful special cases\n\n**An uncharged capacitor at t = 0⁺ acts as a short circuit** (v = 0).\n**An inductor with zero initial current at t = 0⁺ acts as an open circuit**\n(i = 0).\n\nThese give you the instantaneous-after-switching circuit directly, which is how\nyou find initial values of currents and voltages that are *not* continuous.\n\n## 15.6 Exercises\n\n1. A 50 μF capacitor discharges through 20 kΩ from 100 V. Find τ, v(t), and v at\n   t = 2 s. (1 s; 100e^{−t}; 13.5 V)\n2. An RL circuit has L = 0.5 H, R = 250 Ω, switched onto 50 V from rest. Find\n   τ and i(t). (2 ms; 0.2(1 − e^{−500t}) A)\n3. A capacitor charges to 63.2% of its final value in 15 ms. Find τ and the time\n   to reach 99%. (15 ms; 69 ms)\n4. For Example 3, find v_L(t) and confirm it is zero in steady state.\n   (−12e^{−2t} V)\n5. Why must you never apply the general formula directly to a resistor's current?\n\n## Takeaways\n\n- One storage element ⇒ one exponential, one time constant.\n- x(t) = x(∞) + [x(0⁺) − x(∞)]e^{−t/τ}, applied to **v_C or i_L only**.\n- τ = R_th C or L/R_th, with R_th the Thévenin resistance seen by the element.\n- Initial value from the pre-switch steady state, final value from the\n  post-switch steady state, both with C open and L short.\n"}, {"num": "16", "title": "Second-Order Circuits and Oscillations", "body": "\nTwo energy-storage elements — typically one L and one C — give a second-order\ndifferential equation. Energy can now slosh back and forth between the magnetic\nand electric fields, so the response can **oscillate**, which a first-order\ncircuit never does.\n\n## 16.1 The series RLC circuit\n\nKVL around a series RLC loop, source-free:\n\n    L d²i/dt² + R di/dt + i/C = 0\n\nDivide by L and write in standard form:\n\n    d²i/dt² + 2α di/dt + ω_0² i = 0\n\nwith\n\n    α = R/2L           neper frequency (damping), [Np/s]\n    ω_0 = 1/√(LC)      undamped natural (resonant) frequency, [rad/s]\n\n### The LC oscillator — where the oscillation comes from\n\nBefore adding resistance, look at the lossless case, because it shows *why* a\nsecond-order circuit rings at all.\n\nTake a charged capacitor connected across an inductor, with no resistance.\nKVL gives\n\n    L d²q/dt² + q/C = 0     ⇒     q(t) = q₀ cos(ω₀t),   ω₀ = 1/√(LC)\n\nFollow the energy round one cycle:\n\n1. **Capacitor fully charged, current zero.** All energy is electric: ½q₀²/C.\n2. **Capacitor discharging, current rising.** Energy splits between the two.\n3. **Capacitor empty, current maximum.** All energy is magnetic: ½Li₀².\n   The current keeps going — the inductor will not let it stop abruptly.\n4. **Inductor's field collapses, recharging the capacitor the other way.**\n5. Back to state 1 with opposite polarity, and the cycle repeats.\n\n    Total energy = ½q²/C + ½Li² = constant\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 258\" role=\"img\" aria-label=\"The LC oscillation as a four-state cycle: energy moves from the capacitor's electric field to the inductor's magnetic field and back, with the total constant\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker><marker id=\"ar2\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><rect x=\"222\" y=\"21\" width=\"156\" height=\"42\" rx=\"3\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.4\" opacity=\"1\"/><text x=\"300\" y=\"38\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:var(--copper,#B4622F)\" font-weight=\"600\">capacitor full</text><text x=\"300\" y=\"52\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:currentColor\" opacity=\".7\">all energy electric</text><text x=\"300\" y=\"63\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:currentColor\" opacity=\".7\">i = 0</text><rect x=\"308\" y=\"107\" width=\"156\" height=\"42\" rx=\"3\" fill=\"none\" style=\"stroke:currentColor\" stroke-width=\"1.4\" opacity=\"0.55\"/><text x=\"386\" y=\"124\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor\" font-weight=\"600\">discharging</text><text x=\"386\" y=\"138\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:currentColor\" opacity=\".7\">energy splits</text><rect x=\"222\" y=\"193\" width=\"156\" height=\"42\" rx=\"3\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.4\" opacity=\"1\"/><text x=\"300\" y=\"210\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:var(--copper,#B4622F)\" font-weight=\"600\">inductor full</text><text x=\"300\" y=\"224\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:currentColor\" opacity=\".7\">all energy magnetic</text><text x=\"300\" y=\"235\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:currentColor\" opacity=\".7\">v = 0</text><rect x=\"136\" y=\"107\" width=\"156\" height=\"42\" rx=\"3\" fill=\"none\" style=\"stroke:currentColor\" stroke-width=\"1.4\" opacity=\"0.55\"/><text x=\"214\" y=\"124\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor\" font-weight=\"600\">recharging</text><text x=\"214\" y=\"138\" text-anchor=\"middle\" font-size=\"9.5\" style=\"fill:currentColor\" opacity=\".7\">energy splits</text><path d=\"M314.3,78.0 A52,52 0 0 1 350.0,113.7\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" marker-end=\"url(#ar2)\"/><path d=\"M350.0,142.3 A52,52 0 0 1 314.3,178.0\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" marker-end=\"url(#ar2)\"/><path d=\"M285.7,178.0 A52,52 0 0 1 250.0,142.3\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" marker-end=\"url(#ar2)\"/><path d=\"M250.0,113.7 A52,52 0 0 1 285.7,78.0\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" marker-end=\"url(#ar2)\"/><text x=\"300\" y=\"124\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor\" opacity=\".8\">½q²/C + ½Li² = constant</text><text x=\"300\" y=\"140\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor\" opacity=\".6\">ω₀ = 1/√(LC)</text></svg><figcaption>The LC oscillation as a cycle of four states. Energy never leaves — it moves between the capacitor's electric field and the inductor's magnetic field. Adding resistance drains a little each lap, which is what turns the sustained sinusoid into a decaying one.</figcaption></figure>\n```\n\nNothing is lost, so it oscillates forever. Peak current and peak charge are\nlinked by\n\n    i₀ = ω₀q₀\n\n**This is the mechanism behind every second-order response.** Energy sloshing\nbetween the electric and magnetic fields is the oscillation; resistance is what\ndrains it, turning the sustained sinusoid into a decaying one.\n\n### The damped LC oscillator\n\nAdd R and the energy leaks away each cycle:\n\n- The oscillation frequency **shifts** away from 1/√(LC) to ω_d = √(ω₀² − α²).\n- Peak **charge** decays with time constant **2L/R**.\n- For light damping, peak **energy** decays with time constant **L/R** — half\n  the charge time constant, because energy goes as charge squared.\n\n## 16.2 The parallel RLC circuit\n\nFor the parallel case the equation has the same form in v, but α differs:\n\n    α = 1/(2RC)        ω_0 = 1/√(LC)\n\n**Note the inversion.** In series, larger R means *more* damping. In parallel,\nlarger R means *less* damping. Getting these the wrong way round is the standard\nerror in this module — reason it out from where the energy is being lost.\n\n## 16.3 The characteristic equation and the three cases\n\nAssuming a solution e^{st}:\n\n    s² + 2αs + ω_0² = 0\n    s = −α ± √(α² − ω_0²)\n\nThe **damping ratio** ζ = α/ω_0 decides everything:\n\n| Condition | Name | Roots | Response |\n|---|---|---|---|\n| α > ω_0 (ζ > 1) | **Overdamped** | two real, distinct | two decaying exponentials, no oscillation |\n| α = ω_0 (ζ = 1) | **Critically damped** | two real, equal | fastest possible without overshoot |\n| α < ω_0 (ζ < 1) | **Underdamped** | complex conjugates | damped oscillation (ringing) |\n| α = 0 (ζ = 0) | Undamped | pure imaginary | sustained oscillation |\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 700 210\" role=\"img\" aria-label=\"Step response of a second-order circuit for underdamped, critically damped and overdamped cases; only the underdamped case overshoots\" style=\"max-width:100%;height:auto;display:block;margin:0 auto\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".55\"/></marker></defs><line x1=\"66.0\" y1=\"180.3\" x2=\"480.0\" y2=\"180.3\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"78.7\" y1=\"188.0\" x2=\"78.7\" y2=\"44.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"490.0\" y=\"184.3\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">ω₀t</text><line x1=\"206.0\" y1=\"189.3\" x2=\"206.0\" y2=\"171.3\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"206.0\" y=\"195.3\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">5</text><line x1=\"333.3\" y1=\"189.3\" x2=\"333.3\" y2=\"171.3\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"333.3\" y=\"195.3\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">10</text><line x1=\"460.5\" y1=\"189.3\" x2=\"460.5\" y2=\"171.3\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"460.5\" y=\"195.3\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">15</text><line x1=\"74.4\" y1=\"103.4\" x2=\"87.0\" y2=\"103.4\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><text x=\"73.7\" y=\"107.4\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><line x1=\"78.7\" y1=\"103.4\" x2=\"486.0\" y2=\"103.4\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.4\" stroke-dasharray=\"4 3\"/><polyline points=\"78.7,180.3 80.1,180.2 81.4,179.9 82.8,179.5 84.2,179.0 85.5,178.3 86.9,177.6 88.2,176.9 89.6,176.1 90.9,175.3 92.3,174.4 93.7,173.5 95.0,172.7 96.4,171.8 97.7,170.9 99.1,170.0 100.4,169.1 101.8,168.2 103.2,167.3 104.5,166.4 105.9,165.5 107.2,164.7 108.6,163.8 110.0,163.0 111.3,162.1 112.7,161.3 114.0,160.5 115.4,159.7 116.7,158.9 118.1,158.1 119.5,157.3 120.8,156.6 122.2,155.8 123.5,155.1 124.9,154.4 126.2,153.6 127.6,152.9 129.0,152.2 130.3,151.5 131.7,150.8 133.0,150.2 134.4,149.5 135.7,148.9 137.1,148.2 138.5,147.6 139.8,146.9 141.2,146.3 142.5,145.7 143.9,145.1 145.2,144.5 146.6,143.9 148.0,143.4 149.3,142.8 150.7,142.2 152.0,141.7 153.4,141.1 154.8,140.6 156.1,140.1 157.5,139.6 158.8,139.0 160.2,138.5 161.5,138. 103.5 457.5,103.4 458.8,103.3 460.2,103.2 461.6,103.1 462.9,103.0 464.3,102.9 465.6,102.8 467.0,102.7 468.4,102.7 469.7,102.6 471.1,102.5 472.4,102.5 473.8,102.4 475.1,102.4 476.5,102.3 477.9,102.3 479.2,102.2 480.6,102.2 481.9,102.2 483.3,102.1 484.6,102.1 486.0,102.1\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"505\" y1=\"46\" x2=\"535\" y2=\"46\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\"/><text x=\"541\" y=\"50\" font-size=\"10.5\" style=\"fill:currentColor\" opacity=\".85\">underdamped  ζ = 0.25</text><line x1=\"505\" y1=\"63\" x2=\"535\" y2=\"63\" style=\"stroke:currentColor\" stroke-width=\"2\" stroke-dasharray=\"5 3\"/><text x=\"541\" y=\"67\" font-size=\"10.5\" style=\"fill:currentColor\" opacity=\".85\">critically damped  ζ = 1</text><line x1=\"505\" y1=\"80\" x2=\"535\" y2=\"80\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\"/><text x=\"541\" y=\"84\" font-size=\"10.5\" style=\"fill:currentColor\" opacity=\".85\">overdamped  ζ = 2</text></svg><figcaption>Step response for the three cases. Only the underdamped case overshoots; the critically damped case is the fastest approach that does not. All three settle to the same final value.</figcaption></figure>\n```\n\n### The three solution forms\n\n**Overdamped** (s_1, s_2 real):\n\n    x(t) = A_1 e^{s_1 t} + A_2 e^{s_2 t}\n\n**Critically damped** (s = −α twice):\n\n    x(t) = (A_1 + A_2 t) e^{−αt}\n\n**Underdamped** (s = −α ± jω_d, with the **damped frequency**\nω_d = √(ω_0² − α²)):\n\n    x(t) = e^{−αt}(A_1 cos ω_d t + A_2 sin ω_d t)\n\nThe envelope is e^{−αt}, so α controls how fast the ringing dies and ω_d sets\nthe ringing frequency. Note ω_d < ω_0 always — damping slows the oscillation.\n\n## 16.4 Finding the constants\n\nTwo constants need two initial conditions. Get them from the continuity rules:\n\n1. **x(0⁺)** — from v_C(0⁻) or i_L(0⁻), which are continuous.\n2. **dx/dt(0⁺)** — obtained from the *other* storage element, using\n   i_C = C dv_C/dt or v_L = L di_L/dt at t = 0⁺.\n\nThat second step is where marks are lost. For a series RLC solving for v_C:\n\n    dv_C/dt (0⁺) = i_L(0⁺)/C\n\nbecause the inductor current is what charges the capacitor. For a parallel RLC\nsolving for i_L:\n\n    di_L/dt (0⁺) = v_C(0⁺)/L\n\nFor a **step** response, add the forced term: x(t) = x(∞) + [transient form],\nand apply the initial conditions to the *total*.\n\n## 16.5 Practical meaning\n\n- **Overdamped** — sluggish. A door closer set too stiff.\n- **Critically damped** — the fastest approach with no overshoot. The design\n  target for most control and instrument systems.\n- **Underdamped** — fast but overshoots and rings. Acceptable when a little\n  overshoot is cheaper than the extra settling time; unacceptable in, say, a\n  measuring instrument's needle.\n\n**Quality factor** for a resonant circuit:\n\n    Q = ω_0/(2α)\n\nSeries RLC: Q = (1/R)√(L/C). Parallel RLC: Q = R√(C/L) — inverted again.\nHigh Q means low damping, sharp resonance, long ringing.\n\n## 16.6 Worked examples\n\n**Example 1 — classify.** A series RLC has R = 40 Ω, L = 4 H, C = 0.25 F.\n\n    α = R/2L = 40/8 = 5\n    ω_0 = 1/√(LC) = 1/√(1) = 1\n\nα > ω_0 ⇒ **overdamped**.\n\n    s = −5 ± √(25 − 1) = −5 ± 4.899\n    s_1 = −0.101,  s_2 = −9.899\n\n    i(t) = A_1e^{−0.101t} + A_2e^{−9.899t}\n\n**Example 2 — underdamped.** A series RLC has R = 6 Ω, L = 1 H, C = 0.04 F, with\ni(0) = 0 and v_C(0) = 10 V. Find i(t).\n\n    α = 6/2 = 3\n    ω_0 = 1/√(0.04) = 5\n    α < ω_0 ⇒ underdamped\n    ω_d = √(25 − 9) = 4 rad/s\n\n    i(t) = e^{−3t}(A_1 cos 4t + A_2 sin 4t)\n\nInitial conditions. i(0) = 0 ⇒ A_1 = 0.\nFor di/dt(0⁺), use KVL at t = 0⁺: v_L = −v_C − iR = −10 − 0 = −10 V, so\n\n    di/dt(0⁺) = v_L/L = −10 A/s\n\nDifferentiating i(t) = A_2 e^{−3t} sin 4t:\n\n    di/dt = A_2[−3e^{−3t}sin4t + 4e^{−3t}cos4t]\n    di/dt(0) = 4A_2 = −10   ⇒   A_2 = −2.5\n\n    i(t) = −2.5 e^{−3t} sin 4t  A\n\nThe current
