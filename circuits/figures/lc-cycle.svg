lor" opacity=".7">v = 0</text><rect x="136" y="107" width="156" height="42" rx="3" fill="none" style="stroke:currentColor" stroke-width="1.4" opacity="0.55"/><text x="214" y="124" text-anchor="middle" font-size="11.5" style="fill:currentColor" font-weight="600">recharging</text><text x="214" y="138" text-anchor="middle" font-size="9.5" style="fill:currentColor" opacity=".7">energy splits</text><path d="M314.3,78.0 A52,52 0 0 1 350.0,113.7" fill="none" style="stroke:var(--teal,#1C6E7E)" stroke-width="1.4" marker-end="url(#ar2)"/><path d="M350.0,142.3 A52,52 0 0 1 314.3,178.0" fill="none" style="stroke:var(--teal,#1C6E7E)" stroke-width="1.4" marker-end="url(#ar2)"/><path d="M285.7,178.0 A52,52 0 0 1 250.0,142.3" fill="none" style="stroke:var(--teal,#1C6E7E)" stroke-width="1.4" marker-end="url(#ar2)"/><path d="M250.0,113.7 A52,52 0 0 1 285.7,78.0" fill="none" style="stroke:var(--teal,#1C6E7E)" stroke-width="1.4" marker-end="url(#ar2)"/><text x="300" y="124" text-anchor="middle" font-size="11" style="fill:currentColor" opacity=".8">½q²/C + ½Li² = constant</text><text x="300" y="140" text-anchor="middle" font-size="10" style="fill:currentColor" opacity=".6">ω₀ = 1/√(LC)</text></svg>