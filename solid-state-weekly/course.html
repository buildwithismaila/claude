echanism | Thermionic emission | Free flow or field-emission tunnelling |\n| I-V characteristic | Rectifying, exponential | Linear, symmetric |\n| Resistance | Depends on bias and polarity | Small, constant |\n| Purpose | Fast rectifier, detector, MESFET gate | Connecting devices to the circuit |\n| Examples | Au, Pt, W, PtSi on n-Si; Ti/Au on n-GaAs | Al or silicide on n⁺/p⁺ Si; Au–Ge–Ni on n⁺-GaAs |\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 11.1: tungsten on n-type silicon\n\n**Question.** Tungsten (Φ_m = 4.55 eV) is deposited on n-type silicon with N_D = 1×10¹⁵ cm⁻³ (χ = 4.05 eV). Using the ideal model, find Φ_B, Φ_s and V_bi.\n\n**Given:** Φ_m = 4.55 eV, χ = 4.05 eV, N_D = 10¹⁵ cm⁻³, N_c = 2.8×10¹⁹ cm⁻³.\n\n**Find:** Φ_B, Φ_s, V_bi.\n\n**Solution.**\n\n    Φ_B = Φ_m − χ = 4.55 − 4.05 = 0.50 eV\n    E_c − E_F = 0.02585 ln(2.8×10¹⁹/10¹⁵) = 0.265 eV\n    Φ_s = 4.05 + 0.265 = 4.315 eV\n    V_bi = Φ_m − Φ_s = 4.55 − 4.315 = 0.235 V\n\n**Answer:** **Φ_B = 0.50 eV, Φ_s = 4.32 eV, V_bi = 0.24 V.**\n\n#### Practice 11.2: choosing a metal for an Ohmic contact\n\n**Question.** n-type silicon with N_D = 1×10¹⁶ cm⁻³ has Φ_s = 4.26 eV. Using the ideal theory, which of Al (4.28), Ti (4.33), Au (5.1) would give an Ohmic contact? What is done in practice?\n\n**Given:** Φ_s = 4.26 eV; an Ohmic contact on n-type needs Φ_m < Φ_s.\n\n**Find:** a suitable metal.\n\n**Solution.** All three have Φ_m > Φ_s (Al only just, by 0.02 eV), so none meets the ideal Ohmic condition; Au, with the largest Φ_m, would give the strongest barrier.\n\n**Answer:** **None, strictly.** In practice the silicon under the contact is doped n⁺ (above 10¹⁹ cm⁻³) so the barrier becomes thin enough to tunnel through, and Al or a silicide is used.\n\n#### Practice 11.3: Schottky forward voltage\n\n**Question.** A Schottky diode on n-Si has Φ_B = 0.65 eV. Find J_s at 300 K (A∗∗ = 110 A/cm²K²) and the forward voltage at 10 A/cm².\n\n**Given:** Φ_B = 0.65 eV, A∗∗ = 110 A/cm²K², T = 300 K, J = 10 A/cm².\n\n**Find:** J_s and V.\n\n**Solution.**\n\n    J_s = 110 × 300² × e^{−0.65/0.0259} = 9.9×10⁶ × 1.26×10⁻¹¹ = 1.25×10⁻⁴ A/cm²\n    V = 0.0259 ln(10/1.25×10⁻⁴) = 0.0259 × 11.29 = 0.29 V\n\n**Answer:** **J_s = 1.25×10⁻⁴ A/cm², V ≈ 0.29 V.**\n\n#### Practice 11.4: why heavy doping gives tunnelling\n\n**Question.** Find the zero-bias depletion width under a contact with V_bi = 0.6 V for N_D = 1×10¹⁶ cm⁻³ and for N_D = 1×10²⁰ cm⁻³. Explain the result.\n\n**Given:** V_bi = 0.6 V, ε_s = 1.04×10⁻¹² F/cm.\n\n**Find:** W for each doping.\n\n**Solution.**\n\n    W(10¹⁶) = √(2 × 1.04×10⁻¹² × 0.6 / (1.6×10⁻¹⁹ × 10¹⁶)) = 2.8×10⁻⁵ cm = 0.28 μm\n    W(10²⁰) = W(10¹⁶)/√10⁴ = 2.8×10⁻⁷ cm = 2.8 nm\n\n**Answer:** **0.28 μm and 2.8 nm.** A 2.8 nm barrier is thin enough for electrons to tunnel through, so the heavily doped contact is Ohmic even though the barrier is still there.\n\n#### Practice 11.5: contact resistance of a small contact\n\n**Question.** A contact has specific contact resistance ρ_c = 1×10⁻⁶ Ω·cm² and measures 1 μm × 1 μm. Find its resistance.\n\n**Given:** ρ_c = 10⁻⁶ Ω·cm², A = (10⁻⁴ cm)² = 10⁻⁸ cm².\n\n**Find:** R_c.\n\n**Solution.**\n\n    R_c = ρ_c/A = 10⁻⁶/10⁻⁸ = 100 Ω\n\n**Answer:** **R_c = 100 Ω**, large for a small transistor, which is why modern processes need ρ_c near 10⁻⁸ Ω·cm².\n\n#### Practice 11.6: an Ohmic contact by accumulation\n\n**Question.** Describe the band diagram of an ideal Ohmic contact formed by a low work-function metal (Φ_m < Φ_s) on n-type silicon.\n\n**Answer.** Before contact the metal's Fermi level is higher than the semiconductor's. On contact, electrons flow from the metal into the semiconductor until the Fermi levels align. The extra electrons form an **accumulation layer** at the interface, and the semiconductor bands bend **downward** towards it. There is no depletion region and no barrier to electrons in either direction, so current flows freely both ways and the I-V characteristic is linear.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Define work function and electron affinity and relate them. | Write Φ_s in terms of χ. | Φ_s = χ + (E_c − E_F). | The energies involved; Example 11.1 |\n| 2 | Explain how a Schottky barrier forms and calculate Φ_B and V_bi. | Al (4.28 eV) on n-Si (χ = 4.05 eV): find the ideal barrier height. | Φ_B = 4.28 − 4.05 = 0.23 eV. | The Schottky barrier; Example 11.2 |\n| 3 | Explain thermionic emission and calculate Schottky diode currents. | Why does a Schottky diode switch faster than a p-n diode? | It is a majority-carrier device with no stored minority charge. | Current transport; Example 11.3 |\n| 4 | Draw Schottky band diagrams in equilibrium and under bias. | Which barrier stays constant under bias? | qΦ_B, the barrier seen from the metal. | Band diagrams under bias |\n| 5 | Explain the two ways of making Ohmic contacts. | Why does heavy doping make a contact Ohmic? | The depletion layer becomes so thin that electrons tunnel through it. | Ohmic contacts |\n| 6 | Describe the stability problems of metal contacts. | What is electromigration? | Gradual movement of metal atoms by the flowing electrons, forming voids and opens. | Stability of contacts |\n", "group": "Module 4 · Junctions, Interfaces & Characterisation", "eyebrow": "Week 11", "disp": "11"}, {"num": "12", "title": "Interface Characterisation and CAT 2", "body": "\n**Plan:** methods of characterisation (capacitance–voltage C-V profiling, current–voltage I-V analysis); Continuous Assessment Test 2.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Describe I-V measurement and extract I_s, η and R_s.\n2. Explain how the Schottky barrier height is obtained from I-V data.\n3. Explain the principle of C-V measurement.\n4. Extract doping and built-in potential from a Mott–Schottky plot.\n5. Explain doping profiling and the MOS C-V measurement.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| ε_ox | Permittivity of SiO₂, 3.9ε₀ | 3.45×10⁻¹³ F/cm |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| R_s | Sheet resistance (or diode series resistance in Week 12) | Ω/□ (ohms per square); Ω |\n| E (field) | Electric field (on band diagrams, E is energy instead) | V/cm |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| V, V_a | Applied voltage (positive for forward bias) | V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| E_max | Peak electric field, at the junction | V/cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I | Current | A |\n| A (area) | Device or contact area | cm² |\n| η | Ideality factor of a diode, 1 (ideal) to 2 | dimensionless |\n| C, C_j | Capacitance (junction or depletion capacitance) | F (pF = 10⁻¹² F) |\n| Φ_B | Schottky barrier height seen from the metal | eV (or V) |\n| A∗∗ | Effective Richardson constant | A/(cm²·K²); n-Si ≈ 110 |\n| C_ox | Gate-oxide capacitance per unit area, ε_ox/t_ox | F/cm² |\n| t_ox | Gate-oxide thickness | nm |\n| V_T (V_th) | Threshold voltage of a MOSFET | V |\n| V_FB | Flat-band voltage | V |\n| V_GS, V_DS, V_SB, V_G | Gate–source, drain–source, source–body and gate voltages | V |\n| I_D | Drain current | A (mA) |\n| V_junction | Part of the applied voltage that appears across the junction itself | V |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| I-V | Current–voltage (measurement or characteristic) |\n| C-V | Capacitance–voltage (measurement or characteristic) |\n| LCR | Inductance–capacitance–resistance meter |\n| MOS | Metal–oxide–semiconductor |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| BJT | Bipolar junction transistor |\n| CAT | Continuous Assessment Test |\n| DC | Direct current (steady) |\n| AC | Alternating current (small signal) |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n## The big picture\n\nAfter a device is made, how do you know what is inside it? You cannot see the doping or the barrier height. But you can **measure electrically** and compare the results with the theory of Weeks 10–11. Two measurements do most of the work:\n\n- **I-V (current against voltage)** tells you **how current flows**: the saturation current, how ideal the junction is, the series resistance, leakage and breakdown, and for a Schottky diode the barrier height.\n- **C-V (capacitance against voltage)** tells you **how charge is arranged**: the doping concentration (and how it changes with depth) and the built-in potential.\n\nThe trick in both cases is to plot the data so that the theory predicts a **straight line**, then read the answers from the slope and the intercept.\n\n## I-V characterisation\n\n### The measurement\n\nA **source-measure unit** (or a power supply with a series resistor and two meters) applies a voltage to the device in steps, from reverse to forward bias, and records the current at each step. Currents from picoamps to amps may need measuring, often on a probe station, sometimes at several temperatures.\n\n### Turning the curve into a straight line\n\nFor a real diode,\n\n    I = I_s ( e^{qV/ηkT} − 1 )\n\nwhere η (the **ideality factor**) is 1 for a perfect diffusion-current diode and up to 2 when recombination in the depletion region dominates. Above about 0.1 V the −1 is negligible, so take the natural log:\n\n    ln I = ln I_s + (q/ηkT) V\n\nThat is a straight line if you plot **ln I against V** (a semi-log plot):\n\n- the **intercept** at V = 0 gives **ln I_s**, so the saturation current I_s;\n- the **slope** is q/(ηkT), so **η = (q/kT) / slope**.\n\n#### Example 12.1: ideality factor and saturation current from I-V data\n\n**Question.** A silicon diode carries 0.9 μA at a forward voltage of 0.30 V and 40 μA at 0.40 V. Assuming both points lie on the straight part of the semi-log plot, find the ideality factor and the saturation current (300 K).\n\n**Given:** I₁ = 0.9 μA at V₁ = 0.30 V; I₂ = 40 μA at V₂ = 0.40 V; kT/q = 0.0259 V.\n\n**Find:** η and I_s.\n\n**Solution.**\n\nStep 1. Slope of ln I against V:\n\n    slope = ln(I₂/I₁)/(V₂ − V₁) = ln(40/0.9)/0.10 = 3.79/0.10 = 37.9 V⁻¹\n\nStep 2. Ideality factor, slope = q/(ηkT):\n\n    η = 1/(0.0259 × 37.9) = 1.02\n\nStep 3. Extrapolate back to V = 0:\n\n    I_s = I₁ / e^{slope × V₁} = 0.9×10⁻⁶ / e^{37.9 × 0.30} = 0.9×10⁻⁶ / 8.7×10⁴ = 1.0×10⁻¹¹ A\n\n**Answer:** **η = 1.02** (almost ideal diffusion current), **I_s ≈ 1×10⁻¹¹ A.**\n\n### What else the I-V curve shows\n\n- **Series resistance R_s:** at high current the curve bends away from the straight line, because part of the voltage is dropped across the resistance of the bulk and contacts: V = V_junction + IR_s. R_s = (extra voltage)/I.\n- **Reverse leakage and breakdown voltage** from the reverse branch.\n- **Schottky barrier height** from I_s: Φ_B = (kT/q) ln(A∗∗AT²/I_s), where A is the diode area. Measuring at several temperatures and plotting ln(I_s/T²) against 1/T (an **Arrhenius plot**) gives a straight line of slope −qΦ_B/k.\n- **Ohmic contacts:** the I-V between two contacts should be a straight line through the origin, the same in both directions.\n\nTransistors are characterised the same way: MOSFET I_D–V_GS curves give the threshold voltage and mobility (Week 14, Practical 4), and BJT curves give the current gain.\n\n## C-V characterisation\n\n### The measurement\n\nAn **LCR meter** applies a small AC voltage (10–50 mV, typically at 1 MHz) on top of a DC bias, and measures the capacitance. The DC bias is stepped through a range of **reverse** voltages.\n\n### The theory: a capacitor whose plates move\n\nA reverse-biased one-sided junction (p⁺n) or Schottky diode has a depletion region with no mobile carriers, between two conducting regions. It is a **parallel-plate capacitor** whose plate separation is the depletion width W:\n\n    C = ε_s A / W\n\nFrom Week 10, W = √(2ε_s(V_bi − V)/qN), where N is the doping on the lightly doped side. **As the reverse voltage increases, W gets bigger and C gets smaller.** Substituting:\n\n    C = A √( qε_sN / 2(V_bi − V) )\n\n### Turning it into a straight line: the Mott–Schottky plot\n\nSquare both sides and turn upside down:\n\n    1/C² = 2(V_bi − V) / (qε_sNA²)\n\nSo if you plot **1/C² against V**, uniform doping gives a **straight line**:\n\n- **Slope** = −2/(qε_sNA²). Therefore\n\n    N = 2 / ( qε_s A² × |slope| )\n\n- **Intercept** on the voltage axis (where 1/C² = 0) is at V = V_bi: the **built-in potential**.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 210\" role=\"img\" aria-label=\"1 over C squared against bias is a straight line whose slope gives the doping and whose voltage intercept gives the built-in potential\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"184.0\" x2=\"464.0\" y2=\"184.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"388.8\" y1=\"184.0\" x2=\"388.8\" y2=\"30.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"474.0\" y=\"188.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">V (V)</text><text x=\"393.8\" y=\"26.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">1/C²</text><line x1=\"99.0\" y1=\"180.0\" x2=\"99.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"99.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-5</text><line x1=\"157.0\" y1=\"180.0\" x2=\"157.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"157.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-4</text><line x1=\"214.9\" y1=\"180.0\" x2=\"214.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"214.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-3</text><line x1=\"272.9\" y1=\"180.0\" x2=\"272.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"272.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-2</text><line x1=\"330.9\" y1=\"180.0\" x2=\"330.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"330.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-1</text><line x1=\"446.8\" y1=\"180.0\" x2=\"446.8\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"446.8\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><polyline points=\"99.0,52.6 423.6,184.0\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"99.0\" cy=\"52.6\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"157.0\" cy=\"76.1\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"214.9\" cy=\"99.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"272.9\" cy=\"123.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"330.9\" cy=\"146.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"388.8\" cy=\"169.9\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"423.6\" cy=\"184.0\" r=\"3.6\" style=\"fill:var(--teal,#1C6E7E)\"/><text x=\"429.6\" y=\"176.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">V<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"259.7\" y=\"107.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">slope = −2/(qε<tspan dy=\"0.32em\" font-size=\"72%\">sNA</tspan><tspan dy=\"-0.32em\">​</tspan>²)</text><text x=\"81.6\" y=\"36.8\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">reverse bias</text></svg><figcaption>Mott–Schottky plot. For uniform doping the points fall on a straight line; the slope gives the doping and the voltage-axis intercept gives V<sub>bi</sub>.</figcaption></figure>\n```\n\n> **In plain words.** Reverse bias pushes the edge of the depletion region deeper into the semiconductor. How much extra charge is uncovered as the edge moves tells you how many dopant atoms are there. The capacitance measures exactly that.\n\n#### Example 12.2: doping and built-in potential from a C-V plot\n\n**Question.** A silicon Schottky diode of area 1×10⁻³ cm² gives a straight 1/C² against V plot with slope −1.2×10²¹ F⁻²V⁻¹ that meets the voltage axis at +0.60 V. Find the doping concentration and the built-in potential. Also find the capacitance and depletion width at a reverse bias of 5 V.\n\n**Given:** A = 1×10⁻³ cm², slope = −1.2×10²¹ F⁻²V⁻¹, intercept 0.60 V, ε_s = 1.036×10⁻¹² F/cm, q = 1.602×10⁻¹⁹ C, V = −5 V.\n\n**Find:** N_D, V_bi, and C and W at −5 V.\n\n**Solution.**\n\nStep 1. Doping from the slope:\n\n    N_D = 2/(qε_sA²|slope|) = 2 / (1.602×10⁻¹⁹ × 1.036×10⁻¹² × (10⁻³)² × 1.2×10²¹) = 2/1.99×10⁻¹⁶ = 1.0×10¹⁶ cm⁻³\n\nStep 2. Built-in potential from the intercept: V_bi = 0.60 V\n\nStep 3. At V = −5 V, V_bi − V = 5.6 V:\n\n    C = A√(qε_sN_D / 2(V_bi − V)) = 10⁻³ × √(1.66×10⁻¹⁵ / 11.2) = 1.22×10⁻¹¹ F\n\n    W = ε_sA/C = 1.036×10⁻¹⁵ / 1.22×10⁻¹¹ = 8.5×10⁻⁵ cm\n\n**Answer:** **N_D = 1.0×10¹⁶ cm⁻³, V_bi = 0.60 V; at −5 V, C = 12.2 pF and W = 0.85 μm.**\n\n### Doping profiles\n\nIf the doping is **not** uniform, the 1/C² plot curves. The local slope at each bias still gives the doping at the edge of the depletion region, and the capacitance tells you where that edge is:\n\n    N(W) = 2 / ( qε_sA² × d(1/C²)/dV ),     W = ε_sA/C\n\nSweeping the bias moves W deeper and maps out the **doping profile** N(x). This only works for one-sided junctions (p⁺n, n⁺p) or Schottky diodes, where the depletion region is all on one side.\n\n### MOS C-V\n\nFor a MOS capacitor (Week 14), the C-V curve shows accumulation (C = C_ox), depletion (C falling) and inversion. It gives the oxide thickness (from C_ox = ε_oxA/t_ox), the flat-band and threshold voltages, the substrate doping, the charge trapped in the oxide, and the density of interface traps. It is the main tool for checking the quality and stability of gate oxides.\n\n### Getting accurate C-V results\n\n- Measure only in **reverse** bias (forward bias adds a large diffusion capacitance).\n- Subtract stray and probe-pad capacitance (an open-circuit correction).\n- Correct for series resistance.\n- Keep the AC signal small.\n- Choose the frequency so that deep traps do not respond (or so that they do, if you want to measure them).\n- Know the device area accurately: N depends on 1/A².\n\n## Key points of Week 12\n\n- I-V: plot ln I against V. Intercept → I_s; slope → η = (q/kT)/slope; bending at high current → R_s; Arrhenius plot → Φ_B.\n- C-V: a reverse-biased junction is a capacitor C = ε_sA/W, with W growing with reverse bias.\n- Mott–Schottky: 1/C² = 2(V_bi − V)/(qε_sNA²). Slope → N = 2/(qε_sA²|slope|); intercept → V_bi.\n- Non-uniform doping: local slope gives N at depth W = ε_sA/C.\n- MOS C-V gives t_ox, V_FB, V_T, substrate doping and oxide quality.\n\n---\n\n## Examination question solved (Q50)\n\n### Q50. Explain the principles of I-V and C-V characterisation of semiconductor devices and describe how C-V measurements can be used to estimate doping concentration.\n\n**I-V characterisation: principle.** A known DC voltage is applied across the device (swept in steps from reverse to forward bias) and the resulting current is measured with a source-measure unit, usually on a probe station and sometimes at several temperatures. Comparing the measured curve with device theory gives the transport parameters.\n\nFor a diode, I = I_s[exp(qV/ηkT) − 1]. From a semi-log plot of ln I versus V:\n\n- the intercept gives the **saturation current I_s** (and, for Schottky diodes, the **barrier height** Φ_B = (kT/q) ln(AA∗∗T²/I_s));\n- the slope gives the **ideality factor** η (1 for ideal diffusion current, approaching 2 when depletion-region recombination dominates);\n- deviation at high current gives the **series resistance**;\n- the reverse branch gives **leakage current** and **breakdown voltage**;\n- for contacts, a linear symmetric I-V confirms an **Ohmic** contact and gives contact resistance.\n\nI-V curves of transistors give threshold voltage, transconductance, output resistance, mobility and current gain, and repeated I-V measurement after stress is used to test **stability and reliability**.\n\n**C-V characterisation: principle.** A reverse-biased p-n junction or Schottky barrier has a depletion region free of carriers between two conducting regions; it behaves like a parallel-plate capacitor with dielectric ε_s and plate separation W:\n\n    C = ε_s A / W\n\nThe DC reverse bias is swept, and the small-signal capacitance is measured with a small AC voltage (typically 1 MHz, a few tens of mV) using an LCR meter. Since W increases with reverse bias, C decreases.\n\n**Using C-V to estimate doping.** For a one-sided abrupt junction (p⁺n or Schottky on n-type) with uniform doping N:\n\n    W = √( 2ε_s(V_bi − V)/qN )   ⇒   C = A √( qε_sN / 2(V_bi − V) )\n\nRearranging:\n\n    1/C² = 2(V_bi − V) / (qε_s N A²)\n\n1. Measure C at a series of reverse biases V.\n2. Plot **1/C² against V** (the Mott–Schottky plot). For uniform doping it is a **straight line**.\n3. The **slope** is −2/(qε_sNA²), so the doping concentration is **N = 2/(qε_sA²·|slope|)**.\n4. The **intercept** on the V axis gives the built-in potential V_bi (and from it the Schottky barrier height).\n5. **For non-uniform doping**, use the local slope: N(W) = 2/(qε_sA² d(1/C²)/dV) evaluated at each bias, and the depth W = ε_sA/C. This gives the doping profile N(x) as a function of depth.\n\n**Example.** A diode of area 10⁻³ cm² on Si (ε_s = 1.036×10⁻¹² F/cm) gives a 1/C² slope magnitude of 1.2×10²¹ F⁻²V⁻¹:\n\n    N = 2 / (1.602×10⁻¹⁹ × 1.036×10⁻¹² × 10⁻⁶ × 1.2×10²¹) = 1.0×10¹⁶ cm⁻³\n\n**Advantages and limits.** C-V is non-destructive, fast and needs only a simple diode, but only measures the doping on the lightly doped side, only to depths reachable before breakdown, and with resolution limited by the Debye length. Accuracy requires a correct area, correction for stray capacitance and series resistance, and a frequency at which deep traps do not respond.\n\n---\n\n## CAT 2 practice test (60 minutes)\n\nCovers Weeks 7–12. Practice questions, not the actual CAT. Use q = 1.6×10⁻¹⁹ C, kT/q = 0.0259 V, Si: n_i = 1×10¹⁰ cm⁻³, ε_s = 1.04×10⁻¹² F/cm.\n\n1. An n-type Si bar (N_D = 10¹⁶ cm⁻³, μ_n = 1200 cm²/V·s) is 1 cm long with 10⁻³ cm² cross-section. Find its resistance and the current at 5 V.\n2. Find the hole diffusion coefficient in Si if μ_p = 450 cm²/V·s, and the diffusion length if τ_p = 2 μs.\n3. Holes injected into n-Si fall from 10¹⁴ cm⁻³ at x = 0 with L_p = 30 μm. Find the hole diffusion current density at x = 0 (D_p = 11.6 cm²/s).\n4. A Si p⁺n junction has N_D = 5×10¹⁵ cm⁻³ and N_A = 10¹⁸ cm⁻³. Find V_bi, the depletion width at zero bias and at −10 V, and the peak field at −10 V.\n5. The diode of Q4 has area 10⁻³ cm² and I_s = 1×10⁻¹⁴ A. Find the current at 0.6 V and the voltage for 1 mA.\n6. A Schottky diode on n-Si has Φ_B = 0.7 eV. Find J_s at 300 K (A∗∗ = 110 A/cm²K²) and the forward voltage for J = 10 A/cm².\n7. A 1/C² plot for a one-sided junction of area 2×10⁻³ cm² has slope magnitude 4.0×10²⁰ F⁻²V⁻¹. Find the doping.\n\n## CAT 2 solutions\n\n### 1. Resistance of a bar\n\n**Question.** An n-type Si bar (N_D = 10¹⁶ cm⁻³, μ_n = 1200 cm²/V·s) is 1 cm long with 10⁻³ cm² cross-section. Find its resistance and the current at 5 V.\n\n**Solution.**\n\n    σ = qN_Dμ_n = 1.6×10⁻¹⁹ × 10¹⁶ × 1200 = 1.92 S/cm,   ρ = 0.521 Ω·cm\n    R = ρL/A = 0.521 × 1 / 10⁻³ = 521 Ω\n    I = V/R = 5/521 = 9.6 mA\n\n### 2. Einstein relation and diffusion length\n\n**Question.** Find the hole diffusion coefficient in Si if μ_p = 450 cm²/V·s, and the diffusion length if τ_p = 2 μs.\n\n**Solution.**\n\n    D_p = (kT/q)μ_p = 0.0259 × 450 = 11.7 cm²/s\n    L_p = √(D_pτ_p) = √(11.7 × 2×10⁻⁶) = 4.83×10⁻³ cm = 48 μm\n\n### 3. Diffusion current at the injection point\n\n**Question.** Holes injected into n-Si fall from 10¹⁴ cm⁻³ at x = 0 with L_p = 30 μm. Find the hole diffusion current density at x = 0 (D_p = 11.6 cm²/s).\n\n**Solution.**\n\nΔp(x) = Δp(0)e^{−x/L_p}, so dp/dx at x = 0 is −Δp(0)/L_p.\n\n    J_p = −qD_p dp/dx = qD_pΔp(0)/L_p = 1.6×10⁻¹⁹ × 11.6 × 10¹⁴ / 3×10⁻³\n        = 0.062 A/cm²\n\n### 4. Junction parameters\n\n**Question.** A Si p⁺n junction has N_D = 5×10¹⁵ cm⁻³ and N_A = 10¹⁸ cm⁻³. Find V_bi, the depletion width at zero bias and at −10 V, and the peak field at −10 V.\n\n**Solution.**\n\n    V_bi = 0.0259 ln(10¹⁸ × 5×10¹⁵ / 10²⁰) = 0.0259 ln(5×10¹³) = 0.0259 × 31.54 = 0.817 V\n\nOne-sided (N_A ≫ N_D): W = √(2ε_s(V_bi − V)/qN_D).\n\n    V = 0:    W = √(2 × 1.04×10⁻¹² × 0.817 / (1.6×10⁻¹⁹ × 5×10¹⁵)) = √(2.12×10⁻⁹) = 4.6×10⁻⁵ cm = 0.46 μm\n    V = −10:  W = √(2 × 1.04×10⁻¹² × 10.817 / 8×10⁻⁴) = √(2.81×10⁻⁸) = 1.68×10⁻⁴ cm = 1.68 μm\n    E_max = 2(V_bi − V)/W = 2 × 10.817 / 1.68×10⁻⁴ = 1.29×10⁵ V/cm\n\n### 5. Diode current\n\n**Question.** The diode of Q4 has area 10⁻³ cm² and I_s = 1×10⁻¹⁴ A. Find the current at 0.6 V and the voltage for 1 mA.\n\n**Solution.**\n\n    I(0.6 V) = 10⁻¹⁴ (e^{0.6/0.0259} − 1) = 10⁻¹⁴ × 1.15×10¹⁰ = 0.115 mA\n    V(1 mA) = 0.0259 ln(10⁻³/10⁻¹⁴ + 1) = 0.0259 × 25.33 = 0.656 V\n\n### 6. Schottky diode\n\n**Question.** A Schottky diode on n-Si has Φ_B = 0.7 eV. Find J_s at 300 K (A∗∗ = 110 A/cm²K²) and the forward voltage for J = 10 A/cm².\n\n**Solution.**\n\n    J_s = A∗∗T²e^{−qΦ_B/kT} = 110 × 9×10⁴ × e^{−0.7/0.0259} = 9.9×10⁶ × 1.82×10⁻¹² = 1.8×10⁻⁵ A/cm²\n    V = 0.0259 ln(10/1.8×10⁻⁵) = 0.0259 × 13.23 = 0.343 V\n\nA p-n diode needs about 0.7 V for a similar current density, which is why Schottky diodes are used where a low forward drop matters.\n\n### 7. Doping from C-V\n\n**Question.** A 1/C² plot for a one-sided junction of area 2×10⁻³ cm² has slope magnitude 4.0×10²⁰ F⁻²V⁻¹. Find the doping.\n\n**Solution.**\n\n    N = 2/(qε_sA²|slope|) = 2 / (1.6×10⁻¹⁹ × 1.04×10⁻¹² × (2×10⁻³)² × 4.0×10²⁰)\n      = 2 / (2.66×10⁻¹⁶) = 7.5×10¹⁵ cm⁻³\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 12.1: ideality factor\n\n**Question.** A diode carries 1 mA at 0.55 V and 10 mA at 0.62 V. Find its ideality factor.\n\n**Given:** a decade of current over ΔV = 0.07 V, kT/q = 0.0259 V.\n\n**Find:** η.\n\n**Solution.**\n\n    slope = ln 10 / 0.07 = 32.9 V⁻¹\n    η = 1/(0.0259 × 32.9) = 1.17\n\n**Answer:** **η ≈ 1.17**: some depletion-region recombination current is present.\n\n#### Practice 12.2: series resistance\n\n**Question.** At 50 mA a diode's measured voltage is 0.80 V, while the straight line of the semi-log plot predicts 0.70 V at that current. Find the series resistance.\n\n**Given:** I = 50 mA, ΔV = 0.80 − 0.70 = 0.10 V.\n\n**Find:** R_s.\n\n**Solution.**\n\n    R_s = ΔV/I = 0.10/0.05 = 2 Ω\n\n**Answer:** **R_s = 2 Ω.**\n\n#### Practice 12.3: barrier height from the saturation current\n\n**Question.** A Schottky diode of area 1×10⁻⁴ cm² has I_s = 2×10⁻⁹ A at 300 K. Find the barrier height (A∗∗ = 110 A/cm²K²).\n\n**Given:** I_s = 2×10⁻⁹ A, A = 10⁻⁴ cm², A∗∗ = 110 A/cm²K², T = 300 K.\n\n**Find:** Φ_B.\n\n**Solution.**\n\n    Φ_B = (kT/q) ln(A∗∗AT²/I_s) = 0.0259 × ln(110 × 10⁻⁴ × 9×10⁴ / 2×10⁻⁹)\n        = 0.0259 × ln(4.95×10¹¹) = 0.0259 × 26.93 = 0.70 eV\n\n**Answer:** **Φ_B ≈ 0.70 eV.**\n\n#### Practice 12.4: doping from two C-V points\n\n**Question.** A one-sided silicon junction of area 1×10⁻³ cm² has C = 20 pF at −1 V and 12 pF at −4 V. Assuming uniform doping, find N and V_bi.\n\n**Given:** C(−1 V) = 20 pF, C(−4 V) = 12 pF, A = 10⁻³ cm², ε_s = 1.04×10⁻¹² F/cm.\n\n**Find:** N and V_bi.\n\n**Solution.**\n\n    1/C² at −1 V = 1/(20×10⁻¹²)² = 2.50×10²¹ F⁻²\n    1/C² at −4 V = 1/(12×10⁻¹²)² = 6.94×10²¹ F⁻²\n    |slope| = (6.94 − 2.50)×10²¹ / 3 = 1.48×10²¹ F⁻²V⁻¹\n    N = 2/(qε_sA²|slope|) = 2/(1.6×10⁻¹⁹ × 1.04×10⁻¹² × 10⁻⁶ × 1.48×10²¹) = 8.1×10¹⁵ cm⁻³\n    1/C² = |slope|(V_bi − V):  2.50×10²¹ = 1.48×10²¹ (V_bi + 1)  ⇒  V_bi = 0.69 V\n\n**Answer:** **N = 8.1×10¹⁵ cm⁻³, V_bi = 0.69 V.**\n\n#### Practice 12.5: oxide thickness from MOS C-V\n\n**Question.** A MOS capacitor of area 1×10⁻³ cm² shows a capacitance of 345 pF in accumulation. Find the oxide thickness.\n\n**Given:** C = 345 pF, A = 10⁻³ cm², ε_ox = 3.45×10⁻¹³ F/cm.\n\n**Find:** t_ox.\n\n**Solution.**\n\n    C_ox = C/A = 345×10⁻¹² / 10⁻³ = 3.45×10⁻⁷ F/cm²\n    t_ox = ε_ox/C_ox = 3.45×10⁻¹³ / 3.45×10⁻⁷ = 1×10⁻⁶ cm\n\n**Answer:** **t_ox = 10 nm.**\n\n#### Practice 12.6: why one-sided?\n\n**Question.** Why is C-V profiling done on a p⁺n (or n⁺p) junction or a Schottky diode rather than a junction with similar doping on both sides?\n\n**Answer.** The formula N = 2/(qε_sA²|d(1/C²)/dV|) assumes that the depletion region grows into **one** side only, so that the change in charge measures one doping. In a one-sided junction or Schottky diode, almost all of W lies in the lightly doped side, and the measurement gives that side's doping at depth W. If both sides were similarly doped, W would grow into both at once, and the result would be a mixture (an effective N_{A}N_D/(N_A + N_D)) that cannot be assigned to either side or to a depth.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Describe I-V measurement and extract I_s, η and R_s. | What plot gives a straight line for a diode, and what does its slope give? | ln I against V; slope = q/(ηkT). | I-V characterisation; Example 12.1 |\n| 2 | Explain how the Schottky barrier height is obtained from I-V data. | What is plotted in an Arrhenius plot of a Schottky diode? | ln(I_s/T²) against 1/T; slope = −qΦ_B/k. | What else the I-V curve shows |\n| 3 | Explain the principle of C-V measurement. | Why does the junction capacitance fall with reverse bias? | The depletion width W grows, and C = ε_sA/W. | C-V characterisation |\n| 4 | Extract doping and built-in potential from a Mott–Schottky plot. | What gives N and what gives V_bi in a 1/C² plot? | N from the slope, N = 2/(qε_sA²|slope|); V_bi from the voltage intercept. | Mott–Schottky plot; Example 12.2 |\n| 5 | Explain doping profiling and the MOS C-V measurement. | Where is the doping being measured at each bias? | At the depletion edge, depth W = ε_sA/C. | Doping profiles; MOS C-V |\n", "group": "Module 4 · Junctions, Interfaces & Characterisation", "eyebrow": "Week 12", "disp": "12"}, {"num": "13", "title": "Bipolar Junction Transistors (BJTs)", "body": "\n**Plan:** operational physics; minority-carrier profiles in the active regions; emitter efficiency, base transport factor and current gains (α, β). This page follows your lecturer's Weeks 13–15 note (sections 13.1–13.13) and solves its review questions.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Explain the structure and operating principle of NPN and PNP transistors.\n2. Describe injection, diffusion, recombination and collection in the forward-active region.\n3. Sketch and explain the minority-carrier profiles.\n4. Define emitter injection efficiency and base transport factor.\n5. Derive α and β and relate them to γ and α_T.\n6. Solve problems on transistor currents and gains.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| p_n0, n_p0 | Equilibrium minority concentrations: holes on the n side, electrons on the p side | cm⁻³; p_n0 = n_i²/N_D |\n| N_B (C_B) | Background doping of the wafer (in Week 13, N_B is the base doping) | cm⁻³ |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I_E, I_B, I_C | Emitter, base and collector currents | A (mA) |\n| V_BE, V_CE, V_CB | Base–emitter, collector–emitter and collector–base voltages | V |\n| α | Common-base current gain, I_C/I_E | dimensionless; 0.98–0.999 |\n| β | Common-emitter current gain, I_C/I_B (also h_FE) | dimensionless; 50–500 |\n| γ (BJT) | Emitter injection efficiency | dimensionless, close to 1 |\n| α_T | Base transport factor | dimensionless, close to 1 |\n| N_E, W_E, D_E; N_B, W_B, D_B | Doping, width and minority diffusion coefficient of the emitter; of the base | cm⁻³; μm; cm²/s |\n| V_A | Early voltage | V |\n| r_o | Output resistance | Ω |\n| τ_B | Base transit time, W_B²/2D_n | s |\n| f_T | Transition (cut-off) frequency | Hz |\n| n_n0, p_p0, p_n0, n_p0 | Equilibrium densities: majority (n_n0, p_p0) and minority (p_n0 holes on n side, n_p0 electrons on p side) | cm⁻³ |\n| I_{E,n}, I_{E,p}, I_{C,n} | Electron and hole parts of the emitter and collector currents | A |\n| n_B(x) | Minority-electron density in the base of an NPN transistor | cm⁻³ |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| CB | Conduction band |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| BJT | Bipolar junction transistor |\n| NPN | BJT with n-type emitter, p-type base, n-type collector |\n| PNP | BJT with p-type emitter, n-type base, p-type collector |\n| E–B | Emitter–base (junction) |\n| C–B | Collector–base (junction) |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n## The big picture\n\nA transistor is a device in which a **small current or voltage controls a large current**. That is all amplification is.\n\nIn a BJT the trick is geometry. Two p-n junctions (Week 10) are built back to back, with a **very thin** middle layer. One junction pushes carriers into the thin layer; the other junction, a fraction of a micrometre away, pulls them out the other side. Because the middle layer is so thin, almost every carrier that goes in comes out at the far side. A small current into the middle layer (the base) is enough to keep this going, while a large current flows straight through. The physics is the minority-carrier diffusion you met in Weeks 7–9.\n\n## 13.1 Introduction and BJT structure\n\nA **bipolar junction transistor (BJT)** is a three-terminal semiconductor device in which **both electrons and holes** take part in current conduction. That is why it is called \"bipolar\". The three terminals are the **emitter (E)**, **base (B)** and **collector (C)**. A BJT contains two p-n junctions, arranged either as **NPN** or **PNP**.\n\n| Region | Typical doping | Main function |\n|---|---|---|\n| Emitter | Heavily doped (n⁺ in an NPN) | Injects majority carriers into the base |\n| Base | Lightly doped and very thin | Controls carrier transport and limits recombination |\n| Collector | Moderately doped | Collects carriers and supports the voltage |\n\nWhy each choice?\n\n- The **emitter is heavily doped** so that, when its junction is forward biased, it can inject a large concentration of carriers into the base, and so that the base injects very few carriers back into it.\n- The **base is very thin** (often well under 1 μm) and lightly doped, so that most injected carriers cross it before they have time to recombine.\n- The **collector is moderately doped** and physically larger, so that it can collect the carriers and withstand a relatively high reverse voltage without breaking down.\n\n## 13.2 BJT biasing and operational physics\n\nFor normal **forward-active** operation of an NPN transistor:\n\n- the **emitter–base junction is forward biased**;\n- the **collector–base junction is reverse biased**.\n\nWhat happens, step by step:\n\n1. **Injection.** The forward-biased E–B junction lowers its barrier. Electrons flow from the n-type emitter into the p-type base. In the base they are **minority carriers**.\n2. **Diffusion across the base.** There are many injected electrons at the emitter side of the base and almost none at the collector side, so they **diffuse** across. Because the base is thin, most of them get across.\n3. **Recombination (a small loss).** A small fraction of the electrons meet holes in the base and recombine.\n4. **Collection.** The electrons that reach the collector side are swept into the collector by the strong electric field of the reverse-biased C–B junction. They form most of the collector current.\n5. **Base current.** The base current is mainly associated with (a) recombination in the base, which must be replaced by holes flowing in through the base lead, and (b) holes injected from the base into the emitter.\n\nFor a **PNP** transistor the carrier polarities are reversed: holes are injected from the p-type emitter into the n-type base and are collected by the p-type collector. All currents and voltages change sign.\n\n> **In plain words.** The emitter is a crowd pushing through a door (the forward-biased junction) into a narrow corridor (the base). At the other end of the corridor is a slide (the reverse-biased junction) that carries everyone who reaches it away. The corridor is so short that nearly everyone makes it. The base current is the small trickle of people who get lost in the corridor, plus a few who wander back the wrong way.\n\n## 13.3 Minority-carrier concentration profiles\n\nIn a forward-active NPN transistor, electrons are minority carriers in the p-type base. Their concentration is **highest at the emitter side** of the base (because of injection) and **almost zero at the collector side** (because the collector removes them as fast as they arrive). In a thin, uniformly doped base with little recombination, the profile in between is approximately a **straight line**:\n\n    n_B(x) ≈ n_B(0) − [ n_B(0) − n_B(W_B) ] x/W_B\n\n| Symbol | Meaning |\n|---|---|\n| W_B | neutral base width |\n| x | distance measured from the emitter side of the base |\n| n_B(0) | minority-electron concentration at the emitter edge of the base, n_B(0) = n_p0 e^{qV_BE/kT} |\n| n_B(W_B) | minority-electron concentration at the collector edge, ≈ 0 |\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 232\" role=\"img\" aria-label=\"Minority carriers in an npn transistor in active mode: electrons fall linearly across the base to zero at the collector edge, and holes injected into the emitter decay away from the junction\" style=\"width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><rect x=\"40.0\" y=\"40.0\" width=\"160.0\" height=\"150.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:none\" stroke-width=\"1.2\" opacity=\"0.7\"/><rect x=\"200.0\" y=\"40.0\" width=\"130.0\" height=\"150.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"0.7\"/><line x1=\"200.0\" y1=\"36.0\" x2=\"200.0\" y2=\"190.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><line x1=\"330.0\" y1=\"36.0\" x2=\"330.0\" y2=\"190.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><line x1=\"40.0\" y1=\"190.0\" x2=\"520.0\" y2=\"190.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\"/><text x=\"120.0\" y=\"30.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">emitter n⁺</text><text x=\"265.0\" y=\"30.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">base p</text><text x=\"425.0\" y=\"30.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">collector n</text><polyline points=\"200.0,60.0 330.0,188.0\" style=\"fill:none;stroke:var(--copper,#B4622F)\" fill-opacity=\"1.0\" stroke-width=\"2.4\" opacity=\"1.0\" stroke-linejoin=\"round\"/><text x=\"208.0\" y=\"58.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">n<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan>(0) = n<tspan dy=\"0.32em\" font-size=\"72%\">p0</tspan><tspan dy=\"-0.32em\">​</tspan> e<tspan dy=\"-0.45em\" font-size=\"72%\">qV<tspan dy=\"0.32em\" font-size=\"72%\">BE</tspan><tspan dy=\"-0.32em\">​</tspan>/kT</tspan><tspan dy=\"0.45em\">​</tspan></text><text x=\"290.0\" y=\"92.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">electrons diffuse;</text><text x=\"290.0\" y=\"105.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">slope sets I<tspan dy=\"0.32em\" font-size=\"72%\">C</tspan><tspan dy=\"-0.32em\">​</tspan></text><polyline points=\"200.0,120.0 196.0,126.0 192.0,131.4 188.0,136.4 184.0,140.9 180.0,145.1 176.0,148.9 172.0,152.4 168.0,155.6 164.0,158.5 160.0,161.2 156.0,163.7 152.0,165.9 148.0,168.0 144.0,169.8 140.0,171.5 136.0,173.1 132.0,174.6 128.0,175.9 124.0,177.1 120.0,178.2 116.0,179.2 112.0,180.1 108.0,180.9 104.0,181.7 100.0,182.4 96.0,183.1 92.0,183.6 88.0,184.2 84.0,184.7 80.0,185.1 76.0,185.5 72.0,185.9 68.0,186.3 64.0,186.6 60.0,186.9 56.0,187.1 52.0,187.4 48.0,187.6 44.0,187.8 40.0,188.0\" style=\"fill:none;stroke:var(--teal,#1C6E7E)\" fill-opacity=\"1.0\" stroke-width=\"2.2\" opacity=\"1.0\" stroke-linejoin=\"round\"/><text x=\"46.0\" y=\"116.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">holes injected</text><text x=\"46.0\" y=\"129.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">into emitter (I<tspan dy=\"0.32em\" font-size=\"72%\">pE</tspan><tspan dy=\"-0.32em\">​</tspan>)</text><polyline points=\"330.0,188.0 520.0,188.0\" style=\"fill:none;stroke:var(--teal,#1C6E7E)\" fill-opacity=\"1.0\" stroke-width=\"2\" opacity=\"1.0\" stroke-linejoin=\"round\" stroke-dasharray=\"4 3\"/><text x=\"340.0\" y=\"180.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">≈ 0 at the collector edge</text><text x=\"200.0\" y=\"206.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">0</text><text x=\"330.0\" y=\"206.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">W<tspan dy=\"0.32em\" font-size=\"72%\">B</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"280.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E–B forward biased,  C–B reverse biased</text></svg><figcaption>Minority carriers in an NPN transistor in the forward-active mode. Electrons in the base fall almost linearly from n<sub>B</sub>(0) to about zero at the collector edge. Holes injected back into the emitter decay away from the junction.</figcaption></figure>\n```\n\nThe concentration gradient drives electron **diffusion** through the base. By Fick's law the electron diffusion current density is\n\n    J_n = q D_n (dn/dx)\n\nwhere q is the magnitude of the electronic charge and D_n the electron diffusion coefficient (the sign depends on the direction you take as positive). For the straight-line profile, dn/dx = −n_B(0)/W_B, so\n\n    |J_n| = q D_n n_B(0) / W_B\n\nThis is the collector current density. It is controlled by V_BE through n_B(0) = n_p0 e^{qV_BE/kT}, and it is larger for a thinner base.\n\nAt the collector–base junction, the electric field in the reverse-biased depletion region rapidly sweeps the carriers into the collector. Because the collector only has to collect whatever arrives, the collector current is **almost independent of the collector voltage** in the active region, provided the transistor stays away from breakdown and saturation. This is what makes the BJT behave like a current source.\n\n## 13.4 Emitter injection efficiency γ\n\nThe emitter current is made of two parts:\n\n- I_{E,n}: electrons injected from emitter into base (useful: these become the collector current);\n- I_{E,p}: holes injected from base into emitter (wasted: they only add to base current).\n\n**Emitter injection efficiency** γ (gamma) measures what fraction of the emitter current is the useful kind:\n\n    γ = I_{E,n} / (I_{E,n} + I_{E,p})\n\nA well-designed transistor has γ very close to 1. The electrons injected into the base are limited by the base doping, and the holes injected into the emitter by the emitter doping: the more heavily a side is doped, the fewer carriers the other side can inject into it. This gives\n\n    γ ≈ 1 / [ 1 + (D_E N_B W_B) / (D_B N_E W_E) ]\n\nwhere N_E and N_B are the emitter and base dopings, W_E and W_B their widths, D_E and D_B the minority diffusion coefficients. Making **N_E ≫ N_B** makes the fraction small and γ close to 1.\n\nFactors that improve emitter efficiency:\n\n- heavy emitter doping relative to base doping;\n- appropriate semiconductor material and junction design (for example a wider-gap emitter in a heterojunction transistor);\n- proper control of emitter and base widths;\n- minimising unwanted carrier injection.\n\n## 13.5 Base transport factor α_T\n\nOf the electrons injected into the base, a few recombine before reaching the collector. The **base transport factor** α_T is the fraction that make it:\n\n    α_T = I_{C,n} / I_{E,n}\n\nIf recombination in the base is negligible, α_T approaches 1. If the base is thick, or the minority-carrier lifetime is short, more carriers recombine and α_T falls. Quantitatively,\n\n    α_T ≈ 1 − W_B² / (2L_n²),     L_n = √(D_n τ_n)\n\nThe transport factor depends on base width W_B, the minority-carrier diffusion coefficient D_n and the minority-carrier lifetime τ_n. **A thin base and a long lifetime give α_T close to one.** For example W_B = 1 μm and L_n = 20 μm give α_T = 1 − 1/800 = 0.99875.\n\n## 13.6 Common-base current gain α\n\nThe **common-base current gain** is the ratio of collector current to emitter current:\n\n    α = I_C / I_E\n\nThe collector current is slightly less than the emitter current (a little is lost to the base), so α is always less than 1, but for a good transistor it is very close to 1, typically **0.98–0.999**.\n\nPhysically, a current must survive two losses to get from emitter to collector: it must be the right kind of carrier (γ) and it must survive the trip (α_T). So\n\n    α ≈ γ α_T\n\n#### Example 13.1: α from γ and α_T\n\n**Question.** A transistor has an emitter injection efficiency of 0.995 and a base transport factor of 0.990. Estimate its common-base current gain.\n\n**Given:** γ = 0.995, α_T = 0.990.\n\n**Find:** α.\n\n**Solution.**\n\n    α ≈ γα_T = 0.995 × 0.990 = 0.98505\n\n**Answer:** **α ≈ 0.985.**\n\n## 13.7 Common-emitter current gain β\n\nThe **common-emitter current gain** β (also called h_FE under specified conditions) is the ratio of collector current to base current:\n\n    β = I_C / I_B\n\n**Deriving the relation between α and β.** Kirchhoff's current law at the transistor: everything that enters at the emitter leaves at the collector or the base,\n\n    I_E = I_C + I_B\n\nStart from α:\n\n    α = I_C/I_E = I_C/(I_C + I_B)\n\nDivide top and bottom by I_B, and use β = I_C/I_B:\n\n    α = (I_C/I_B) / (I_C/I_B + 1) = β/(β + 1)\n\nSolve for β: α(β + 1) = β ⇒ αβ + α = β ⇒ α = β(1 − α) ⇒\n\n    β = α / (1 − α)\n\nBecause α is close to 1, the denominator 1 − α is a small number, so **a small change in α produces a large change in β**:\n\n| α | 0.98 | 0.99 | 0.995 | 0.999 |\n|---|---|---|---|---|\n| β = α/(1 − α) | 49 | 99 | 199 | 999 |\n\n## 13.8 BJT current relationships\n\n| Quantity | Expression | Meaning |\n|---|---|---|\n| Emitter current | I_E = I_C + I_B | Total transistor current at the emitter |\n| Common-base gain | α = I_C/I_E | Collector current relative to emitter current |\n| Common-emitter gain | β = I_C/I_B | Collector current relative to base current |\n| Relation | β = α/(1 − α) | Converts α to β |\n| Relation | α = β/(β + 1) | Converts β to α |\n| Physics of α | α ≈ γα_T | Injection efficiency × transport factor |\n| Collector current | I_C = I_S e^{qV_BE/kT} | Set by the base–emitter voltage |\n\n## 13.9 Worked example 1: finding α\n\n**Question.** A BJT has an emitter current of 5 mA and a collector current of 4.9 mA. Determine α and the base current.\n\n**Given:** I_E = 5 mA, I_C = 4.9 mA. **Find:** α and I_B.\n\n**Solution.**\n\n    α = I_C/I_E = 4.9/5 = 0.98\n    I_B = I_E − I_C = 5 − 4.9 = 0.1 mA\n\n**α = 0.98, I_B = 0.1 mA.** (And β = 4.9/0.1 = 49.)\n\n## 13.10 Worked example 2: finding β from α\n\n**Question.** A transistor has α = 0.98. Determine β. If the base current is 0.2 mA, determine the collector and emitter currents.\n\n**Given:** α = 0.98, I_B = 0.2 mA. **Find:** β, I_C, I_E.\n\n**Solution.**\n\n    β = α/(1 − α) = 0.98/0.02 = 49\n    I_C = βI_B = 49 × 0.2 mA = 9.8 mA\n    I_E = I_C + I_B = 9.8 + 0.2 = 10.0 mA\n\n**β = 49, I_C = 9.8 mA, I_E = 10 mA.**\n\n## 13.11 Worked example 3: injection efficiency and transport factor\n\n**Question.** An NPN transistor has emitter injection efficiency γ = 0.995 and base transport factor α_T = 0.990. Estimate α and β.\n\n**Given:** γ = 0.995, α_T = 0.990. **Find:** α and β.\n\n**Solution.**\n\n    α ≈ γα_T = 0.995 × 0.990 = 0.98505\n    β = α/(1 − α) = 0.98505/0.01495 ≈ 65.9\n\n**α ≈ 0.985, β ≈ 65.9.** Notice that neither loss is large on its own (0.5 % and 1 %), yet together they hold β down to 66.\n\n## Worked example 4: from device design to gain\n\n**Question.** An NPN silicon transistor has N_E = 10¹⁹ cm⁻³, N_B = 10¹⁷ cm⁻³, W_E = 1 μm, W_B = 0.5 μm, D_E (holes in the emitter) = 2.5 cm²/s, D_B (electrons in the base) = 25 cm²/s, base lifetime τ_n = 1 μs and area 10⁻⁴ cm². Calculate the emitter injection efficiency γ, the base transport factor α_T, the current gains α and β, and the collector and base currents at V_BE = 0.65 V.\n\n**Given:** the dopings, widths, diffusion coefficients and lifetime above; n_i = 10¹⁰ cm⁻³, kT/q = 0.0259 V. **Find:** γ, α_T, α, β, I_C and I_B.\n\n**Solution.**\n\n    γ = 1 / [1 + (2.5 × 10¹⁷ × 0.5)/(25 × 10¹⁹ × 1)] = 1/(1 + 5×10⁻⁴) = 0.99950\n    L_n = √(25 × 10⁻⁶) = 5×10⁻³ cm = 50 μm\n    α_T = 1 − 0.5²/(2 × 50²) = 1 − 5×10⁻⁵ = 0.99995\n    α = γα_T = 0.99945,   β = 0.99945/0.00055 ≈ 1800\n\n    I_S = qAD_Bn_i²/(N_{B}W_B) = (1.6×10⁻¹⁹)(10⁻⁴)(25)(10²⁰)/(10¹⁷ × 5×10⁻⁵) = 8×10⁻¹⁵ A\n    I_C = 8×10⁻¹⁵ × e^{0.65/0.0259} = 8×10⁻¹⁵ × 7.9×10¹⁰ = 0.63 mA,   I_B = I_C/β ≈ 0.35 μA\n\nHere the emitter efficiency limits β. Real devices have lower β (typically 100–300) because of recombination in the E–B depletion region and other non-ideal effects.\n\n## 13.12 BJT operating regions\n\n| Region | Emitter–base junction | Collector–base junction | Typical use |\n|---|---|---|---|\n| Cut-off | Reverse biased | Reverse biased | OFF (switching) |\n| Forward active | Forward biased | Reverse biased | Amplification |\n| Saturation | Forward biased | Forward biased | ON (switching) |\n| Reverse active | Reverse biased | Forward biased | Limited, reverse operation |\n\n- **Cut-off:** no injection, so essentially no current flows: an open switch.\n- **Forward active:** I_C = βI_B, controlled by the base: an amplifier.\n- **Saturation:** both junctions inject; the collector can no longer collect everything independently, I_C < βI_B, and V_CE is small (about 0.2 V): a closed switch.\n- **Reverse active:** emitter and collector swap roles; gain is poor because the collector was not designed to inject.\n\n**Early effect.** In the active region, increasing V_CE widens the collector depletion region slightly into the base, making W_B smaller. A thinner base means a steeper profile and a larger I_C, so the output curves slope upward slightly. Extrapolated backwards they meet at −V_A, the **Early voltage**.\n\n## 13.13 Summary of Week 13\n\n- A BJT uses two p-n junctions and three semiconductor regions (emitter, base, collector).\n- In forward-active operation the E–B junction is forward biased and the C–B junction reverse biased.\n- The thin base lets most injected minority carriers reach the collector; their profile across the base is nearly a straight line.\n- Emitter injection efficiency γ measures the desired carrier injection relative to the total emitter current.\n- Base transport factor α_T measures the fraction of injected carriers that cross the base without recombining.\n- α = I_C/I_E ≈ γα_T is the common-base gain; β = I_C/I_B is the common-emitter gain.\n- The key relationship is **β = α/(1 − α)**.\n\n---\n\n## Review questions, Week 13, solved\n\n### 1. Define a BJT and explain why it is called a bipolar device.\n\nA bipolar junction transistor is a three-terminal semiconductor device consisting of two p-n junctions formed by three alternately doped regions, emitter, base and collector, arranged as NPN or PNP. A small base current (or base–emitter voltage) controls a much larger collector current, so it can amplify and switch. It is called **bipolar** because current is carried by both kinds of carrier: in an NPN, electrons carry the main emitter-to-collector current while holes carry the base current (recombination in the base and injection into the emitter). In contrast, a MOSFET is unipolar: its channel current is carried by one carrier type only.\n\n### 2. Draw and label an NPN transistor and indicate the direction of conventional current and electron flow.\n\nDraw three blocks side by side: **n⁺ emitter | p base | n collector**, with terminal leads E, B and C. Mark the E–B junction \"forward biased\" (base positive with respect to emitter, V_BE ≈ 0.7 V) and the C–B junction \"reverse biased\" (collector positive with respect to base).\n\n- **Electron flow:** from the emitter, through the thin base, into the collector (left to right). A small number recombine with holes in the base; the holes they use up flow in through the base lead.\n- **Conventional current:** opposite to electron flow. I_C flows **into** the collector, I_B flows **into** the base, and I_E = I_C + I_B flows **out of** the emitter. In the circuit symbol, the arrow on the emitter points **outwards** for an NPN, showing the direction of conventional emitter current.\n\n### 3. Explain the operation of a BJT in the forward-active region.\n\nWith the E–B junction forward biased, the emitter barrier is lowered and the heavily doped n⁺ emitter injects a large number of electrons into the p-type base, where they become minority carriers with concentration n_B(0) = n_p0e^{qV_BE/kT} at the emitter edge. The reverse-biased collector holds the electron concentration at the collector edge of the base at almost zero. The resulting nearly linear concentration gradient makes the electrons diffuse across the thin base. Since the base is much thinner than the diffusion length, only a small fraction recombine. On reaching the C–B depletion region, the electrons are swept into the collector by its electric field, forming the collector current I_C = αI_E. The base supplies holes to replace those lost in recombination and those injected into the emitter, which is the small base current I_B = I_C/β. Because I_C depends on V_BE but hardly on V_CB, the transistor acts as a controlled current source, which allows amplification.\n\n### 4. What is emitter injection efficiency? Why should it be close to unity?\n\nEmitter injection efficiency γ = I_{E,n}/(I_{E,n} + I_{E,p}) is the fraction of the emitter current carried by carriers injected from the emitter into the base (electrons in an NPN), rather than by carriers injected from the base back into the emitter (holes). It should be close to unity because only the injected electrons can reach the collector and form useful output current; the back-injected holes simply add to the base current without contributing to I_C. Since α ≈ γα_T and β = α/(1 − α), even a small reduction of γ below 1 sharply reduces the current gain. γ is made close to 1 by doping the emitter much more heavily than the base.\n\n### 5. Define the base transport factor and state two factors that affect it.\n\nThe base transport factor α_T = I_{C,n}/I_{E,n} is the fraction of minority carriers injected into the base that cross it without recombining and reach the collector. It is approximately α_T ≈ 1 − W_B²/(2L_n²). Factors that affect it (any two):\n\n1. **Base width W_B**: a thinner base gives fewer recombinations and a higher α_T.\n2. **Minority-carrier lifetime τ_n** in the base: a longer lifetime (fewer traps, cleaner material) increases L_n and α_T.\n3. **Minority-carrier diffusion coefficient D_n**: faster diffusion means less time in the base and higher α_T.\n4. **Base doping**: heavier doping shortens lifetime and lowers mobility, reducing α_T.\n\n### 6. Derive β = α/(1 − α) from the definitions of α and β.\n\nDefinitions: α = I_C/I_E and β = I_C/I_B. By Kirchhoff's current law, I_E = I_C + I_B.\n\n    α = I_C/I_E = I_C/(I_C + I_B)\n\nDividing numerator and denominator by I_B:\n\n    α = (I_C/I_B)/(I_C/I_B + 1) = β/(β + 1)\n\nRearranging: α(β + 1) = β ⇒ αβ + α = β ⇒ α = β − αβ = β(1 − α), so\n\n    β = α/(1 − α)\n\n### 7. A transistor has I_E = 12 mA and I_C = 11.76 mA. Calculate α, I_B and β.\n\n    α = I_C/I_E = 11.76/12 = 0.98\n    I_B = I_E − I_C = 12 − 11.76 = 0.24 mA\n    β = I_C/I_B = 11.76/0.24 = 49\n\nCheck: α/(1 − α) = 0.98/0.02 = 49. ✓\n\n### 8. Explain the difference between cut-off, active and saturation regions.\n\n| | Cut-off | Forward active | Saturation |\n|---|---|---|---|\n| E–B junction | Reverse (or zero) biased | Forward biased | Forward biased |\n| C–B junction | Reverse biased | Reverse biased | Forward biased |\n| Currents | I_B ≈ 0, I_C ≈ 0 (leakage only) | I_C = βI_B | I_C < βI_B; I_C set by the external circuit |\n| V_CE | Large (≈ supply voltage) | Intermediate | Small, V_CE(sat) ≈ 0.1–0.3 V |\n| Behaves as | Open switch (OFF) | Current-controlled current source | Closed switch (ON) |\n| Use | Digital OFF state | Amplifiers | Digital ON state |\n\nIn cut-off there is no injection, so no carriers cross the base. In the active region the collector collects all carriers that arrive, independently of its voltage. In saturation the collector junction is also forward biased and starts injecting carriers back into the base, so the collector current can no longer rise with base current; the transistor is fully ON.\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 13.1: currents from β\n\n**Question.** A transistor has β = 80 and I_C = 4 mA. Find I_B, I_E and α.\n\n**Given:** β = 80, I_C = 4 mA.\n\n**Find:** I_B, I_E, α.\n\n**Solution.**\n\n    I_B = I_C/β = 4/80 = 0.05 mA = 50 μA\n    I_E = I_C + I_B = 4.05 mA\n    α = β/(β + 1) = 80/81 = 0.988\n\n**Answer:** **I_B = 50 μA, I_E = 4.05 mA, α = 0.988.**\n\n#### Practice 13.2: from doping to gain\n\n**Question.** An NPN transistor has N_E = 5×10¹⁸ cm⁻³, N_B = 5×10¹⁶ cm⁻³, equal emitter and base widths, D_E = 3 cm²/s and D_B = 20 cm²/s. Its base transport factor is 0.995. Find γ, α and β.\n\n**Given:** N_E, N_B, D_E, D_B above, W_E = W_B, α_T = 0.995.\n\n**Find:** γ, α, β.\n\n**Solution.**\n\n    D_{E}N_{B}W_B/(D_{B}N_{E}W_E) = (3 × 5×10¹⁶)/(20 × 5×10¹⁸) = 1.5×10⁻³\n    γ = 1/(1 + 1.5×10⁻³) = 0.9985\n    α = γα_T = 0.9985 × 0.995 = 0.9935\n    β = α/(1 − α) = 0.9935/0.0065 = 153\n\n**Answer:** **γ = 0.9985, α = 0.9935, β ≈ 153.**\n\n#### Practice 13.3: base transport factor\n\n**Question.** A BJT has a base width of 1 μm and an electron diffusion length in the base of 10 μm. Find α_T. What base width would give α_T = 0.999?\n\n**Given:** W_B = 1 μm, L_n = 10 μm.\n\n**Find:** α_T, and W_B for α_T = 0.999.\n\n**Solution.**\n\n    α_T = 1 − W_B²/(2L_n²) = 1 − 1/(2 × 100) = 0.995\n    For 0.999: W_B²/(2L_n²) = 0.001  ⇒  W_B = L_n√0.002 = 10 × 0.0447 = 0.45 μm\n\n**Answer:** **α_T = 0.995; a 0.45 μm base gives 0.999.**\n\n#### Practice 13.4: collector current and V_BE\n\n**Question.** A transistor has I_S = 1×10⁻¹⁵ A. Find I_C at V_BE = 0.70 V, and the V_BE needed for I_C = 5 mA.\n\n**Given:** I_S = 10⁻¹⁵ A, kT/q = 0.0259 V.\n\n**Find:** I_C(0.70 V) and V_BE(5 mA).\n\n**Solution.**\n\n    I_C = I_S e^{V_BE/0.0259} = 10⁻¹⁵ × e^{27.03} = 10⁻¹⁵ × 5.5×10¹¹ = 0.55 mA\n    V_BE = 0.0259 ln(5×10⁻³/10⁻¹⁵) = 0.0259 × 29.24 = 0.757 V\n\n**Answer:** **I_C = 0.55 mA at 0.70 V; V_BE = 0.76 V for 5 mA.**\n\n#### Practice 13.5: the Early effect\n\n**Question.** A transistor has an Early voltage of 100 V and I_C = 1 mA at V_CE = 5 V. Find its output resistance and I_C at V_CE = 10 V (same base drive).\n\n**Given:** V_A = 100 V, I_C(5 V) = 1 mA.\n\n**Find:** r_o and I_C(10 V).\n\n**Solution.**\n\n    r_o = V_A/I_C = 100/10⁻³ = 100 kΩ\n    I_C(10 V) = I_C(5 V) × (1 + 10/100)/(1 + 5/100) = 1 × 1.10/1.05 = 1.048 mA\n\n**Answer:** **r_o = 100 kΩ; I_C rises to 1.05 mA.**\n\n#### Practice 13.6: base transit time\n\n**Question.** An NPN transistor has a 0.2 μm base and D_n = 20 cm²/s. Find the base transit time and the upper limit it places on f_T.\n\n**Given:** W_B = 2×10⁻⁵ cm, D_n = 20 cm²/s.\n\n**Find:** τ_B and f_T.\n\n**Solution.**\n\n    τ_B = W_B²/(2D_n) = (2×10⁻⁵)²/40 = 1×10⁻¹¹ s\n    f_T ≲ 1/(2πτ_B) = 1.6×10¹⁰ Hz\n\n**Answer:** **τ_B = 10 ps, f_T up to about 16 GHz.** Thin bases make fast transistors.\n\n#### Practice 13.7: why the reverse-active gain is poor\n\n**Question.** Explain why a BJT has a much lower current gain in the reverse-active mode.\n\n**Answer.** In reverse-active mode the collector acts as the emitter. But the collector is only moderately (lightly) doped and much larger, while the base is more heavily doped than it. The injection efficiency is therefore poor (the base injects many holes back into the collector), and the collector-side geometry collects carriers badly. The result is a reverse β of typically only 1–5.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Explain the structure and operating principle of NPN and PNP transistors. | Why is the base made very thin? | So that injected carriers cross it before they recombine. | 13.1–13.2 |\n| 2 | Describe injection, diffusion, recombination and collection in the forward-active region. | Which junction is forward biased in forward-active operation? | The emitter–base junction (collector–base is reverse biased). | 13.2 |\n| 3 | Sketch and explain the minority-carrier profiles. | What shape is the electron profile in a thin base, and what does its slope set? | Almost a straight line; its slope sets the collector current. | 13.3 |\n| 4 | Define emitter injection efficiency and base transport factor. | How is γ made close to 1? | By doping the emitter much more heavily than the base. | 13.4–13.5 |\n| 5 | Derive α and β and relate them to γ and α_T. | Write β in terms of α. | β = α/(1 − α). | 13.6–13.8 |\n| 6 | Solve problems on transistor currents and gains. | β = 100, I_C = 5 mA: find I_B and I_E. | I_B = 50 μA, I_E = 5.05 mA. | Worked examples 1–4; review Q7 |\n", "group": "Module 5 · Advanced Device Technology", "eyebrow": "Week 13", "disp": "13"}, {"num": "14", "title": "Field-Effect Transistors (MOSFETs)", "body": "\n**Plan:** ideal MOS capacitor physics (accumulation, depletion, inversion); MOSFET threshold voltage; linear and saturation operating regions. This page follows your lecturer's note (sections 14.1–14.17) and solves its review questions 9–17.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Describe the structure of an ideal MOS capacitor and calculate C_ox.\n2. Explain accumulation, depletion and inversion.\n3. Explain how a MOS capacitor becomes a MOSFET, and enhancement versus depletion mode.\n4. Define the threshold voltage and calculate it.\n5. Determine the operating region and calculate drain current.\n6. Compare BJTs and MOSFETs.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| ε₀ | Permittivity of free space | 8.854×10⁻¹⁴ F/cm |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| ε_ox | Permittivity of SiO₂, 3.9ε₀ | 3.45×10⁻¹³ F/cm |\n| ε_r | Relative permittivity (dielectric constant) | Si 11.7, SiO₂ 3.9, GaAs 12.9 |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_A | Acceptor concentration | cm⁻³ |\n| ψ | Wave function (\\|ψ\\|² is the probability density) | — |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| G, G_L | Generation rate of electron–hole pairs (G_L: by light) | cm⁻³s⁻¹ |\n| I_E, I_B, I_C | Emitter, base and collector currents | A (mA) |\n| α | Common-base current gain, I_C/I_E | dimensionless; 0.98–0.999 |\n| β | Common-emitter current gain, I_C/I_B (also h_FE) | dimensionless; 50–500 |\n| γ (BJT) | Emitter injection efficiency | dimensionless, close to 1 |\n| r_o | Output resistance | Ω |\n| C_ox | Gate-oxide capacitance per unit area, ε_ox/t_ox | F/cm² |\n| t_ox | Gate-oxide thickness | nm |\n| φ_F, ψ_s (φ_s) | Bulk Fermi potential (kT/q)ln(N_A/n_i); surface potential (band bending) | V |\n| W_d, W_dmax, Q_dmax | MOS depletion width, its maximum at inversion, and the depletion charge then | μm; C/cm² |\n| V_T (V_th) | Threshold voltage of a MOSFET | V |\n| V_FB | Flat-band voltage | V |\n| Φ_ms, Q_f | Gate–substrate work-function difference; fixed oxide charge | V; C/cm² |\n| γ (MOSFET) | Body-effect coefficient √(2qε_siN_A)/C_ox | V^{1/2} |\n| V_GS, V_DS, V_SB, V_G | Gate–source, drain–source, source–body and gate voltages | V |\n| I_D | Drain current | A (mA) |\n| W/L | Channel width-to-length ratio | dimensionless |\n| g_m | Transconductance, ∂I_D/∂V_GS | S (A/V) |\n| k (MOSFET) | Device parameter μ_nC_ox(W/L) | A/V² (mA/V²) |\n| λ (MOSFET) | Channel-length modulation parameter | V⁻¹ |\n| ΔV_T | Shift in threshold voltage (e.g. from body bias) | V |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| MOS | Metal–oxide–semiconductor |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| BJT | Bipolar junction transistor |\n| DC | Direct current (steady) |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n## The big picture\n\nA BJT is controlled by a current. A MOSFET is controlled by a **voltage**, and the control works through an electric field, without any current flowing into the control terminal.\n\nThe idea: put a metal plate (the **gate**) just above the silicon surface, separated by a very thin insulator. Put a positive voltage on the plate, and it attracts electrons to the silicon surface just beneath it, the same way a charged comb attracts bits of paper. With enough voltage, those electrons form a thin conducting sheet, a **channel**, connecting two contacts (source and drain). Remove the voltage and the channel disappears. The gate switches the channel on and off, and nothing flows into the gate. That is why billions of MOSFETs can sit on one chip without melting it.\n\n## 14.1 Introduction to MOSFETs\n\nA **metal-oxide-semiconductor field-effect transistor (MOSFET)** is a voltage-controlled semiconductor device. The **gate voltage** controls the conductivity of a channel between the **source** and **drain** terminals. The gate is separated from the semiconductor by a thin insulating oxide layer, so ideally the DC gate current is essentially zero.\n\nThe basic MOS structure is:\n\n    gate (metal or polysilicon) / oxide (SiO₂ insulator) / semiconductor substrate\n\nIn an **n-channel** MOSFET the substrate is normally **p-type**, and an **electron inversion layer** forms when the gate voltage is sufficiently positive. In a **p-channel** MOSFET the polarities are reversed: n-type substrate, hole inversion layer, negative gate voltage.\n\n## 14.2 The ideal MOS capacitor\n\nA MOS capacitor can be viewed as a **parallel-plate capacitor**: one plate is the gate, the other is the semiconductor surface, and the oxide is the dielectric between them. The gate voltage creates an electric field through the oxide and changes the distribution of charge near the semiconductor surface.\n\n    C_ox = ε_ox / t_ox\n\n| Symbol | Meaning |\n|---|---|\n| C_ox | oxide capacitance per unit area (F/cm²) |\n| ε_ox | oxide permittivity, ε_ox = ε_r ε₀ with ε_r ≈ 3.9 for SiO₂: ε_ox = 3.45×10⁻¹³ F/cm |\n| t_ox | oxide thickness |\n\nA **thinner oxide** gives a larger capacitance per unit area, so the same gate voltage induces more charge: stronger electrostatic control of the channel. For t_ox = 10 nm = 10⁻⁶ cm, C_ox = 3.45×10⁻¹³/10⁻⁶ = 3.45×10⁻⁷ F/cm².\n\n\"**Ideal**\" means: no charge trapped in the oxide, no trap states at the interface, no difference between the gate and semiconductor work functions, and an oxide that conducts no current at all.\n\nFor the p-type substrate we also need the **bulk Fermi potential** φ_F, which is how far the Fermi level lies below the intrinsic level in the bulk (from Week 5, E_i − E_F = kT ln(N_A/n_i)):\n\n    φ_F = (kT/q) ln(N_A/n_i)\n\nFor N_A = 10¹⁷ cm⁻³: φ_F = 0.0259 ln(10⁷) = 0.417 V.\n\n## 14.3 Accumulation\n\nTake a p-type silicon substrate and apply a **negative** gate voltage relative to it. The negative gate attracts the positive majority carriers, **holes**, towards the semiconductor–oxide interface. The surface now contains more holes than it does in equilibrium. This is **accumulation**.\n\n- p-type substrate + negative gate voltage → hole accumulation.\n- The surface majority-carrier concentration increases.\n- The surface becomes more strongly p-type.\n- In the band diagram the bands bend **upward** at the surface (E_v moves closer to E_F).\n\n## 14.4 Depletion\n\nApply a **small positive** gate voltage. Holes are now **repelled** from the surface. The region near the oxide is depleted of mobile majority carriers. What remains is the fixed negative charge of the **ionised acceptor atoms**, which cannot move. This is the **depletion region**.\n\n- p-type substrate + moderately positive gate voltage → depletion.\n- Mobile holes are pushed away from the surface.\n- A negative space-charge region of ionised acceptors remains, of width W_d.\n- The bands bend **downward** at the surface by the surface potential ψ_s.\n\nThe depletion width grows with the band bending:\n\n    W_d = √( 2ε_si ψ_s / qN_A )\n\n## 14.5 Inversion\n\nAs the positive gate voltage is increased further, the surface potential becomes positive enough to attract **electrons** (the minority carriers of the p-type substrate) towards the surface. When the electron concentration at the surface becomes large enough that the surface behaves as **n-type**, the semiconductor is said to be **inverted**. This is **inversion**.\n\nFor an ideal p-type substrate, **strong inversion** is conventionally defined as the point where the surface is as strongly n-type as the bulk is p-type. That happens when the band bending is twice the bulk Fermi potential:\n\n    ψ_s ≈ 2φ_F\n\nWhy 2φ_F? In the bulk, E_F is φ_F below E_i. Bending the bands down by φ_F brings E_i down to E_F (the surface is intrinsic). Bending by another φ_F puts E_i φ_F *below* E_F, which is exactly the mirror image of the bulk: n-type to the same degree.\n\nOnce strong inversion is reached, the depletion width stops growing at its maximum\n\n    W_dmax = √( 4ε_si φ_F / qN_A )\n\nand any further gate voltage simply adds electrons to the inversion layer. **This electron layer is the channel of the MOSFET.**\n\nThe exact sign conventions for φ_F and ψ_s differ between textbooks. The physical idea is what matters: the gate field first **depletes** the surface, then attracts minority carriers until an **inversion layer** forms.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 700 210\" role=\"img\" aria-label=\"Ideal MOS capacitor on p-type silicon: bands bend up in accumulation, down in depletion, and far enough down in inversion that the surface becomes n-type\" style=\"width:700px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"110.0\" y=\"18.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Accumulation (V<tspan dy=\"0.32em\" font-size=\"72%\">G</tspan><tspan dy=\"-0.32em\">​</tspan> &lt; 0)</text><rect x=\"10.0\" y=\"40.0\" width=\"40.0\" height=\"140.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:none\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"30.0\" y=\"192.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">gate</text><rect x=\"50.0\" y=\"34.0\" width=\"22.0\" height=\"152.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\" opacity=\"1.0\"/><text x=\"61.0\" y=\"200.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">SiO₂</text><polyline points=\"72.0,56.0 75.0,57.4 78.0
