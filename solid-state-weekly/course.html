></text><text x=\"673.0\" y=\"136.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"673.0\" y=\"158.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"611.0\" y=\"200.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">electrons at surface</text><circle cx=\"538.0\" cy=\"108.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"545.0\" cy=\"108.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"552.0\" cy=\"108.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"559.0\" cy=\"108.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/></svg><figcaption>Band diagrams of an ideal MOS capacitor on p-type silicon. Accumulation: bands bend up and holes gather at the surface. Depletion: bands bend down and holes are pushed away, leaving negative acceptor ions. Inversion: the bands bend so far that the surface becomes n-type.</figcaption></figure>\n```\n\n## 14.6 From MOS capacitor to MOSFET\n\nIn an **n-channel enhancement MOSFET**, two heavily doped **n⁺ regions** form the **source** and **drain** inside a p-type substrate. The gate lies above the region between them, which has length L (channel length) and width W.\n\n- With V_GS below threshold there is no channel. Source and drain are two n⁺ islands in p-type silicon, i.e. two back-to-back p-n junctions: no current flows.\n- With a sufficiently positive gate-to-source voltage, an electron inversion channel forms and connects source to drain.\n- Applying a drain-to-source voltage V_DS then makes electrons **drift** from source to drain. Conventional drain current flows from drain to source.\n\nThe gate voltage controls whether the channel exists and how strongly it conducts. This is the fundamental reason the MOSFET is a **field-effect** device.\n\n**Enhancement and depletion mode.** In an **enhancement-mode** device (the normal kind) there is no channel at V_GS = 0; a gate voltage above V_T must be applied to create (enhance) one. A **depletion-mode** device is built with a channel already present at V_GS = 0 (by doping the surface n-type); a negative gate voltage is needed to remove (deplete) it, so its V_T is negative.\n\n## 14.7 Threshold voltage\n\nThe **threshold voltage** V_T is the gate-to-source voltage at which a strong inversion channel forms and significant conduction begins in an enhancement-mode MOSFET.\n\nA commonly used long-channel expression for an ideal nMOS is:\n\n    V_T = V_FB + 2φ_F + γ √(2φ_F)\n\nwith the **body-effect coefficient**\n\n    γ = √(2qε_si N_A) / C_ox\n\n| Symbol | Meaning |\n|---|---|\n| V_FB | flat-band voltage: the gate voltage that makes the bands flat; zero for an ideal MOS, V_FB = Φ_ms − Q_f/C_ox in a real one |\n| 2φ_F | the band bending needed for strong inversion |\n| γ√(2φ_F) | the voltage dropped across the oxide to support the depletion charge, \\|Q_dmax\\|/C_ox |\n| N_A | substrate acceptor concentration |\n| ε_si | silicon permittivity, 11.7ε₀ = 1.04×10⁻¹² F/cm |\n\n**Reading the formula.** The gate voltage has three jobs: get to flat bands (V_FB), bend the bands by 2φ_F, and hold up the charge of the depletion region across the oxide. **Heavier substrate doping** raises both φ_F and the depletion charge, so V_T rises. A **thinner oxide** (larger C_ox) lowers V_T.\n\n(This γ is not the same as the emitter injection efficiency γ of Week 13; the same Greek letter is used for different things.)\n\nFor simplified ideal MOSFET problems, the threshold voltage may simply be given. Always use the convention and parameters supplied in the question.\n\n#### Example 14.1: calculating the threshold voltage\n\n**Question.** An n-channel MOSFET is built on p-type silicon with N_A = 1×10¹⁷ cm⁻³, a 10 nm SiO₂ gate oxide and an n⁺ polysilicon gate, for which V_FB = −0.98 V. There is no oxide charge. Calculate the threshold voltage at 300 K.\n\n**Given:** N_A = 1×10¹⁷ cm⁻³, t_ox = 10 nm = 1×10⁻⁶ cm, V_FB = −0.98 V, ε_ox = 3.45×10⁻¹³ F/cm, ε_si = 1.04×10⁻¹² F/cm, n_i = 10¹⁰ cm⁻³, kT/q = 0.0259 V.\n\n**Find:** V_T = V_FB + 2φ_F + γ√(2φ_F).\n\n**Solution.**\n\nStep 1. Bulk Fermi potential:\n\n    φ_F = 0.0259 ln(10¹⁷/10¹⁰) = 0.417 V,   2φ_F = 0.834 V\n\nStep 2. Oxide capacitance:\n\n    C_ox = 3.45×10⁻¹³ / 10⁻⁶ = 3.45×10⁻⁷ F/cm²\n\nStep 3. Body-effect coefficient:\n\n    γ = √(2 × 1.6×10⁻¹⁹ × 1.04×10⁻¹² × 10¹⁷) / 3.45×10⁻⁷ = 1.824×10⁻⁷ / 3.45×10⁻⁷ = 0.529 V^{1/2}\n\n    γ√(2φ_F) = 0.529 × √0.834 = 0.529 × 0.913 = 0.483 V\n\nStep 4. Add the three terms:\n\n    V_T = −0.98 + 0.834 + 0.483 = 0.34 V\n\n**Answer:** **V_T ≈ 0.34 V.**\n\n## 14.8 MOSFET regions of operation\n\nFor a long-channel enhancement nMOS transistor, the region depends on V_GS compared with V_T, and on V_DS compared with V_GS − V_T (called the **overdrive voltage**).\n\n| Condition | Operating region | Physical condition |\n|---|---|---|\n| V_GS < V_T | Cut-off | No strong inversion channel |\n| V_GS > V_T and V_DS < V_GS − V_T | Linear (triode) | Channel exists along the entire length |\n| V_GS > V_T and V_DS ≥ V_GS − V_T | Saturation | Channel pinches off near the drain |\n\n## 14.9 Cut-off region\n\nWhen V_GS ≤ V_T, an enhancement nMOS has no strong inversion channel. Ideally the drain current is zero, apart from small leakage:\n\n    I_D ≈ 0\n\n## 14.10 Linear (triode) region\n\nWhen V_GS > V_T and V_DS is smaller than V_GS − V_T, the channel exists all the way from source to drain. The long-channel drain current is:\n\n    I_D = μ_n C_ox (W/L) [ (V_GS − V_T) V_DS − V_DS²/2 ]\n\n| Symbol | Meaning |\n|---|---|\n| μ_n | electron mobility in the channel |\n| C_ox | oxide capacitance per unit area |\n| W, L | channel width and length |\n\n**Where it comes from (in words).** The amount of electron charge in the channel per unit area is C_ox × (how far the gate is above threshold). At the source end that is C_ox(V_GS − V_T); at the drain end the channel is at V_DS, so the gate is only V_GS − V_DS above it and the charge is C_ox(V_GS − V_T − V_DS). The current is (charge per area) × (width) × (drift velocity μ × field). Adding this up along the channel gives the formula; the −V_DS²/2 term is the effect of the channel thinning towards the drain.\n\nFor **small V_DS** the V_DS² term is negligible, and\n\n    I_D ≈ μ_nC_ox(W/L)(V_GS − V_T) V_DS\n\nThe current is proportional to V_DS: the transistor behaves as a **voltage-controlled resistor** whose resistance is set by the gate.\n\n## 14.11 Saturation region\n\nAs V_DS is increased, the channel becomes progressively thinner near the drain. When\n\n    V_DS = V_GS − V_T\n\nthe channel charge at the drain end falls to zero: this is the **onset of pinch-off**. For larger V_DS the device is in **saturation**. The extra voltage is dropped across a short pinched-off region near the drain, and the current stops rising. Ignoring channel-length modulation:\n\n    I_D = ½ μ_n C_ox (W/L) (V_GS − V_T)²\n\nThis is one of the most important MOSFET equations for examination calculations. In saturation the current depends on V_GS but (ideally) not on V_DS: the MOSFET is a **voltage-controlled current source**, which is what an amplifier needs.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"n-channel MOSFET output curves for four gate voltages, rising linearly at low drain voltage and saturating beyond V_DS equal to V_GS minus V_T\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse 3 130.8,184.3 134.0,183.3 137.2,182.2 140.4,181.0 143.6,179.8 146.8,178.6 150.0,177.2 153.2,175.9 156.4,174.5 159.6,173.0 162.8,171.5 166.0,169.9 169.2,168.2 172.4,166.6 175.6,164.8 178.8,163.0 182.0,161.2 185.2,159.3 188.4,157.3 191.6,155.3 194.8,153.2 198.0,151.1 201.2,148.9 204.4,146.7 207.6,144.4 210.8,142.1 214.0,139.7 217.2,137.3 220.4,134.8 223.6,132.2 226.8,129.6 230.0,127.0 233.2,124.3 236.4,121.5 239.6,118.7 242.8,115.8 246.0,112.9 249.2,109.9 252.4,106.9 255.6,103.8 258.8,100.7 262.0,97.5 265.2,94.3 268.4,91.0 271.6,87.6 274.8,84.2 277.9,80.7 281.1,77.2 284.3,73.7 287.5,70.1 290.7,66.4 293.9,62.7 297.1,58.9 300.3,55.0 303.5,51.2 306.7,47.2 309.9,43.2 313.1,39.2 316.3,35.1 319.5,30.9 322.7,26.7 325.9,22.4\" fill=\"none\" style=\"stroke:currentColor\" stroke-width=\"1.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><text x=\"243.2\" y=\"154.8\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">V<tspan dy=\"0.32em\" font-size=\"72%\">DS</tspan><tspan dy=\"-0.32em\">​</tspan> = V<tspan dy=\"0.32em\" font-size=\"72%\">GS</tspan><tspan dy=\"-0.32em\">​</tspan> − V<tspan dy=\"0.32em\" font-size=\"72%\">T</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"240.6\" y1=\"150.8\" x2=\"222.2\" y2=\"136.5\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.6\"/><text x=\"142.2\" y=\"43.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.8\">linear</text><text x=\"358.8\" y=\"33.8\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.8\">saturation</text></svg><figcaption>Output characteristics of an n-channel MOSFET. Each curve rises (linear region) until V<sub>DS</sub> = V<sub>GS</sub> − V<sub>T</sub> (dashed line), then flattens (saturation).</figcaption></figure>\n```\n\n## 14.12 Transconductance\n\nIn saturation the small-signal **transconductance** is\n\n    g_m = ∂I_D/∂V_GS\n\nFor the ideal long-channel saturation equation:\n\n    g_m = μ_nC_ox (W/L)(V_GS − V_T) = 2I_D/(V_GS − V_T)\n\nTransconductance measures how strongly the drain current responds to a small change in gate voltage (unit: siemens, A/V). It plays the role for a MOSFET that β plays for a BJT.\n\n## 14.13 Worked example 1: determining the operating region\n\n**Question.** An nMOS transistor has V_T = 1 V, V_GS = 3 V and V_DS = 1 V. Determine its operating region.\n\n**Given:** V_T = 1 V, V_GS = 3 V, V_DS = 1 V. **Find:** the region of operation.\n\n**Solution.**\n\n    V_GS > V_T (3 > 1), so a channel exists.\n    V_GS − V_T = 3 − 1 = 2 V\n    V_DS = 1 V < 2 V\n\nThe transistor is in the **linear (triode) region**.\n\n## 14.14 Worked example 2: saturation current\n\n**Question.** An nMOS transistor has μ_nC_ox(W/L) = 2 mA/V², V_T = 1 V and V_GS = 4 V. Find the saturation drain current.\n\n**Given:** k = μ_nC_ox(W/L) = 2 mA/V², V_T = 1 V, V_GS = 4 V. **Find:** I_D(sat).\n\n**Solution.**\n\n    I_D = ½ × 2 × (4 − 1)² mA = 1 × 9 = 9 mA\n\n**I_D = 9 mA.**\n\n## 14.15 Worked example 3: linear-region current\n\n**Question.** An nMOS transistor has μ_nC_ox(W/L) = 1 mA/V², V_T = 1 V, V_GS = 3 V and V_DS = 0.5 V. Calculate the drain current.\n\n**Given:** k = 1 mA/V², V_T = 1 V, V_GS = 3 V, V_DS = 0.5 V. **Find:** I_D.\n\n**Solution.**\n\nFirst check the region: V_GS − V_T = 2 V > V_DS = 0.5 V, so it is linear.\n\n    I_D = 1 × [ (3 − 1)(0.5) − (0.5)²/2 ] mA = [1 − 0.125] mA = 0.875 mA\n\n**I_D = 0.875 mA.**\n\n## 14.16 Comparison of BJT and MOSFET\n\n| Feature | BJT | MOSFET |\n|---|---|---|\n| Control | Mainly current-controlled (base current) | Voltage-controlled (gate voltage) |\n| Input current | Requires base current | Ideally zero DC gate current |\n| Carriers | Electrons and holes (bipolar) | Majority-carrier conduction in the channel (unipolar) |\n| Input impedance | Moderate | Very high |\n| Typical use | Amplification, switching, analogue | Digital logic, switching, amplification, power |\n| Key gain parameter | β or α | g_m |\n\n## 14.17 Summary of Week 14\n\n- An ideal MOS capacitor has three electrostatic conditions: accumulation, depletion and inversion.\n- On a p-type substrate: negative gate → accumulation; moderate positive gate → depletion; sufficiently positive gate → inversion.\n- The MOSFET uses the inversion layer as a controllable channel between source and drain.\n- Threshold voltage is the gate voltage at the onset of strong inversion, V_T = V_FB + 2φ_F + γ√(2φ_F).\n- For an nMOS enhancement device: V_GS < V_T gives cut-off; V_GS > V_T and V_DS < V_GS − V_T gives the linear region; V_GS > V_T and V_DS ≥ V_GS − V_T gives saturation.\n- Linear: I_D = μC_ox(W/L)[(V_GS − V_T)V_DS − V_DS²/2]. Saturation: I_D = ½μC_ox(W/L)(V_GS − V_T)².\n\n---\n\n## Review questions, Week 14, solved\n\n### 9. What is a MOS capacitor? Draw and label its basic structure.\n\nA MOS (metal-oxide-semiconductor) capacitor is a three-layer structure in which a conducting gate electrode is separated from a semiconductor substrate by a thin insulating oxide. It acts as a parallel-plate capacitor whose capacitance per unit area is C_ox = ε_ox/t_ox in accumulation; the gate voltage controls the charge at the semiconductor surface.\n\n**Sketch (top to bottom):** a gate contact (metal or n⁺ polysilicon) labelled **G**; a thin layer of **SiO₂** with thickness **t_ox** marked; the **p-type Si substrate** (doping N_A); a metal **substrate (body) contact** at the bottom labelled **B**. Mark V_G applied between G and B.\n\n### 10. Explain accumulation, depletion and inversion for a p-type silicon substrate.\n\n- **Accumulation (V_G < 0):** the negative gate attracts the majority holes to the oxide–silicon interface. The surface becomes more strongly p-type; the bands bend upward.\n- **Depletion (small V_G > 0):** the positive gate repels holes from the surface, leaving a layer of fixed negative acceptor ions of width W_d. There are almost no mobile carriers in this layer; the bands bend downward.\n- **Inversion (V_G > V_T):** the downward band bending becomes large enough (ψ_s ≈ 2φ_F) to attract minority electrons to the surface in large numbers. The surface becomes n-type: an electron inversion layer forms, which is the MOSFET channel. The depletion width stops growing at W_dmax.\n\n### 11. Why is an oxide layer used between the gate and the semiconductor?\n\n1. It **insulates** the gate from the channel, so the gate draws essentially no DC current. This gives the MOSFET its very high input impedance and low power consumption.\n2. It lets the gate control the surface through the **electric field** only, as the dielectric of a capacitor. A thin oxide gives a large C_ox and strong control.\n3. SiO₂ forms a very **clean, stable interface** with silicon (few interface traps), so the surface carriers have good mobility and V_T is stable.\n4. It **passivates** and protects the silicon surface.\n\n### 12. Define threshold voltage.\n\nThe threshold voltage V_T is the gate-to-source voltage at which the semiconductor surface reaches strong inversion (surface potential ψ_s ≈ 2φ_F), so that a conducting inversion channel forms between source and drain and significant drain current begins to flow. For an ideal nMOS, V_T = V_FB + 2φ_F + γ√(2φ_F), with γ = √(2qε_siN_A)/C_ox.\n\n### 13. State the conditions for cut-off, linear and saturation operation of an nMOS transistor.\n\n- **Cut-off:** V_GS < V_T. No channel, I_D ≈ 0.\n- **Linear (triode):** V_GS > V_T and V_DS < V_GS − V_T. I_D = μ_nC_ox(W/L)[(V_GS − V_T)V_DS − V_DS²/2].\n- **Saturation:** V_GS > V_T and V_DS ≥ V_GS − V_T. I_D = ½μ_nC_ox(W/L)(V_GS − V_T)².\n\n### 14. Derive the condition V_DS ≥ V_GS − V_T for saturation.\n\n**Physical argument.** An inversion channel exists at a point in the channel only where the gate is more than V_T above the local channel voltage. At the source end the channel voltage is 0, so the gate–channel voltage is V_GS. At the drain end the channel voltage is V_DS, so the gate–channel voltage is V_GD = V_GS − V_DS. The channel at the drain end disappears (pinches off) when this falls to threshold:\n\n    V_GS − V_DS = V_T   ⇒   V_DS = V_GS − V_T\n\nFor any V_DS larger than this, the drain end stays pinched off and the device is saturated. Hence saturation requires V_DS ≥ V_GS − V_T.\n\n**Mathematical argument.** The linear-region equation I_D = k[(V_GS − V_T)V_DS − V_DS²/2] is a parabola in V_DS. Its maximum is where\n\n    dI_D/dV_DS = k[(V_GS − V_T) − V_DS] = 0   ⇒   V_DS = V_GS − V_T\n\nBeyond this point the equation would predict a falling current, which does not happen physically; instead the current stays at its maximum value, I_D = ½k(V_GS − V_T)². So saturation begins at V_DS = V_GS − V_T.\n\n### 15. Calculate the saturation current when μ_nC_ox(W/L) = 1.5 mA/V², V_GS = 5 V and V_T = 2 V.\n\n    I_D = ½ μ_nC_ox(W/L)(V_GS − V_T)² = ½ × 1.5 × (5 − 2)² = 0.75 × 9 = 6.75 mA\n\n**I_D = 6.75 mA.**\n\n### 16. Calculate the linear-region current for μ_nC_ox(W/L) = 2 mA/V², V_GS = 4 V, V_T = 1 V and V_DS = 0.8 V.\n\nCheck the region: V_GS − V_T = 3 V > V_DS = 0.8 V, so linear.\n\n    I_D = 2 × [ (4 − 1)(0.8) − (0.8)²/2 ] = 2 × [2.4 − 0.32] = 2 × 2.08 = 4.16 mA\n\n**I_D = 4.16 mA.**\n\n### 17. Compare a BJT and a MOSFET in terms of input impedance and control mechanism.\n\n- **Control mechanism.** A BJT is current-controlled: the collector current is set by the base current (I_C = βI_B), or equivalently by the base–emitter voltage through carrier injection across a forward-biased junction. A MOSFET is voltage-controlled: the gate voltage creates an electric field across the oxide that induces the channel charge, with no carrier injection from the gate.\n- **Input impedance.** The BJT's base–emitter junction is forward biased and must be supplied with base current, so its input impedance is moderate (typically kΩ). The MOSFET's gate is insulated by the oxide and draws essentially no DC current, so its input impedance is extremely high (10¹² Ω or more), limited only by the gate capacitance at high frequency.\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 14.1: oxide capacitance of a thin gate\n\n**Question.** Find C_ox for a 3 nm SiO₂ gate oxide.\n\n**Given:** t_ox = 3×10⁻⁷ cm, ε_ox = 3.45×10⁻¹³ F/cm.\n\n**Find:** C_ox.\n\n**Solution.**\n\n    C_ox = ε_ox/t_ox = 3.45×10⁻¹³ / 3×10⁻⁷ = 1.15×10⁻⁶ F/cm²\n\n**Answer:** **C_ox = 1.15 μF/cm².**\n\n#### Practice 14.2: bulk potential and maximum depletion width\n\n**Question.** For p-type silicon with N_A = 5×10¹⁶ cm⁻³, find φ_F and the maximum depletion width at strong inversion.\n\n**Given:** N_A = 5×10¹⁶ cm⁻³, n_i = 10¹⁰ cm⁻³, ε_si = 1.04×10⁻¹² F/cm.\n\n**Find:** φ_F and W_dmax.\n\n**Solution.**\n\n    φ_F = 0.0259 ln(5×10⁶) = 0.400 V\n    W_dmax = √(4ε_siφ_F/qN_A) = √(4 × 1.04×10⁻¹² × 0.400 / (1.6×10⁻¹⁹ × 5×10¹⁶)) = 1.44×10⁻⁵ cm\n\n**Answer:** **φ_F = 0.40 V, W_dmax = 0.144 μm.**\n\n#### Practice 14.3: threshold voltage of an ideal MOSFET\n\n**Question.** Using the substrate of Practice 14.2 with a 20 nm oxide and an ideal gate (V_FB = 0), find the threshold voltage.\n\n**Given:** φ_F = 0.400 V, W_dmax = 1.44×10⁻⁵ cm, t_ox = 2×10⁻⁶ cm.\n\n**Find:** V_T = V_FB + 2φ_F + qN_AW_dmax/C_ox.\n\n**Solution.**\n\n    C_ox = 3.45×10⁻¹³/2×10⁻⁶ = 1.725×10⁻⁷ F/cm²\n    qN_AW_dmax = 1.6×10⁻¹⁹ × 5×10¹⁶ × 1.44×10⁻⁵ = 1.15×10⁻⁷ C/cm²\n    V_T = 0 + 0.80 + 1.15×10⁻⁷/1.725×10⁻⁷ = 0.80 + 0.67 = 1.47 V\n\n**Answer:** **V_T ≈ 1.47 V.** A thinner oxide or a real n⁺ poly gate (negative V_FB) would lower it.\n\n#### Practice 14.4: current in both regions\n\n**Question.** An nMOS has μ_nC_ox(W/L) = 0.5 mA/V² and V_T = 0.8 V, with V_GS = 2.0 V. Find I_D at V_DS = 0.4 V and at V_DS = 2.0 V.\n\n**Given:** k = 0.5 mA/V², V_T = 0.8 V, V_GS = 2.0 V (overdrive 1.2 V).\n\n**Find:** I_D at each V_DS.\n\n**Solution.**\n\n    V_DS = 0.4 V < 1.2 V → linear:  I_D = 0.5 × [1.2 × 0.4 − 0.4²/2] = 0.5 × 0.40 = 0.20 mA\n    V_DS = 2.0 V ≥ 1.2 V → saturation: I_D = ½ × 0.5 × 1.2² = 0.36 mA\n\n**Answer:** **0.20 mA (linear) and 0.36 mA (saturation).**\n\n#### Practice 14.5: transconductance\n\n**Question.** Find the transconductance of the transistor of Practice 14.4 in saturation.\n\n**Given:** I_D = 0.36 mA, V_GS − V_T = 1.2 V.\n\n**Find:** g_m.\n\n**Solution.**\n\n    g_m = 2I_D/(V_GS − V_T) = 2 × 0.36/1.2 = 0.60 mS\n    (check: g_m = k(V_GS − V_T) = 0.5 × 1.2 = 0.60 mS)\n\n**Answer:** **g_m = 0.60 mS.**\n\n#### Practice 14.6: body effect\n\n**Question.** A MOSFET has γ = 0.5 V^{1/2} and 2φ_F = 0.8 V. By how much does its threshold voltage rise when the source is 2 V above the body?\n\n**Given:** γ = 0.5 V^{1/2}, 2φ_F = 0.8 V, V_SB = 2 V.\n\n**Find:** ΔV_T.\n\n**Solution.**\n\n    ΔV_T = γ(√(2φ_F + V_SB) − √(2φ_F)) = 0.5 × (√2.8 − √0.8) = 0.5 × (1.673 − 0.894) = 0.39 V\n\n**Answer:** **V_T rises by 0.39 V.**\n\n#### Practice 14.7: sizing a transistor\n\n**Question.** A MOSFET must carry 1 mA in saturation with an overdrive of 0.5 V. If μ_nC_ox = 200 μA/V², what W/L is needed?\n\n**Given:** I_D = 1 mA, V_GS − V_T = 0.5 V, μ_nC_ox = 200×10⁻⁶ A/V².\n\n**Find:** W/L.\n\n**Solution.**\n\n    W/L = 2I_D / (μ_nC_ox (V_GS − V_T)²) = 2 × 10⁻³ / (200×10⁻⁶ × 0.25) = 40\n\n**Answer:** **W/L = 40.**\n\n#### Practice 14.8: channel-length modulation\n\n**Question.** Why does a real MOSFET's saturation current rise slightly with V_DS?\n\n**Answer.** Beyond pinch-off, increasing V_DS moves the pinch-off point slightly towards the source, so the effective channel length becomes L − ΔL. Since I_D ∝ 1/L, the current rises a little. This is **channel-length modulation**, written I_D = I_D(sat)(1 + λV_DS). It is the MOSFET's equivalent of the BJT's Early effect and gives a finite output resistance r_o ≈ 1/(λI_D).\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Describe the structure of an ideal MOS capacitor and calculate C_ox. | Find C_ox for a 5 nm SiO₂ layer. | 3.45×10⁻¹³/5×10⁻⁷ = 6.9×10⁻⁷ F/cm². | 14.2 |\n| 2 | Explain accumulation, depletion and inversion. | On p-type Si, what forms at the surface in inversion? | A layer of electrons (the surface becomes n-type). | 14.3–14.5 |\n| 3 | Explain how a MOS capacitor becomes a MOSFET, and enhancement versus depletion mode. | Does an enhancement-mode nMOS conduct at V_GS = 0? | No: a gate voltage above V_T is needed to create the channel. | 14.6 |\n| 4 | Define the threshold voltage and calculate it. | What three contributions make up V_T? | V_FB, the band bending 2φ_F, and the depletion-charge term γ√(2φ_F). | 14.7; Example 14.1 |\n| 5 | Determine the operating region and calculate drain current. | V_T = 1 V, V_GS = 2 V, V_DS = 3 V: which region? | Saturation (V_DS ≥ V_GS − V_T = 1 V). | 14.8–14.15 |\n| 6 | Compare BJTs and MOSFETs. | Which has the higher input impedance, and why? | The MOSFET: its gate is insulated by the oxide and draws no DC current. | 14.16; review Q17 |\n", "group": "Module 5 · Advanced Device Technology", "eyebrow": "Week 14", "disp": "14"}, {"num": "15", "title": "Revision and Final Exam Preparation", "body": "\n**Plan:** overview of the entire curriculum, problem-solving clinic and past-question review. The sections follow the Week 15 headings in your lecturer's note: course overview, formula sheet, problem-solving clinic, past-question style exercises, final examination checklist and comprehensive revision questions.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Summarise the whole course and how its ideas connect.\n2. Recall and apply the key formulas.\n3. Answer definitions, derivations and calculations in examination style.\n4. Solve mixed past-question style problems.\n5. Check readiness for the final examination.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| ħ | Reduced Planck constant, h/2π | 1.055×10⁻³⁴ J·s |\n| m₀ | Free-electron mass | 9.11×10⁻³¹ kg |\n| ε₀ | Permittivity of free space | 8.854×10⁻¹⁴ F/cm |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| ε_ox | Permittivity of SiO₂, 3.9ε₀ | 3.45×10⁻¹³ F/cm |\n| ε_r | Relative permittivity (dielectric constant) | Si 11.7, SiO₂ 3.9, GaAs 12.9 |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| Å | Ångström, a unit of length | 1 Å = 10⁻¹⁰ m = 0.1 nm |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_a | Activation energy of dopant diffusion | eV; about 3–4 eV |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| g(E), g_c, g_v | Density of states: allowed states per unit energy per unit volume | states/(eV·cm³) |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| m∗, m_n∗, m_p∗ | Effective mass of electrons or holes | kg, or as a multiple of m₀ |\n| ψ | Wave function (\\|ψ\\|² is the probability density) | — |\n| k (wave vector) | Wave vector, 2π/λ; measures the electron's momentum, p = ħk | m⁻¹ or cm⁻¹ |\n| α (Kronig–Penney) | √(2mE)/ħ, set by the electron energy | m⁻¹ |\n| P (Kronig–Penney) | Barrier strength mV₀ba/ħ² | dimensionless |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| a | Lattice constant: edge length of the cubic unit cell | Å; Si 5.43, Ge and GaAs 5.65 |\n| (h k l), {h k l} | Miller indices of a plane; family of equivalent planes | integers |\n| d_hkl | Spacing between neighbouring (h k l) planes, a/√(h² + k² + l²) | Å |\n| r_nn | Nearest-neighbour distance | Å; Si 2.35 |\n| k₀ | Segregation coefficient, C_s/C_l at the freezing interface | dimensionless; B 0.8, P 0.35 |\n| C_s | Surface concentration of a diffusion (or solid concentration when freezing) | cm⁻³ |\n| C_l, C₀ | Concentration in the melt (liquid); C₀ at the start | cm⁻³ |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| D | Diffusion coefficient (dopants in a furnace, or carriers) | cm²/s |\n| D₀ | Diffusion constant in D = D₀e^{−E_a/kT} | cm²/s |\n| F | Particle flux in Fick's law | particles/(cm²·s) |\n| Q | Dose: dopant atoms per unit area (in Weeks 13–14, Q also means charge) | atoms/cm² (C or C/cm² for charge) |\n| Φ (dose) | Implanted dose (ions per cm²) | cm⁻² |\n| erfc | Complementary error function, erfc(u) = 1 − erf(u); read from a table | dimensionless |\n| x_j | Junction depth: where the dopant concentration equals the background | μm |\n| N_B (C_B) | Background doping of the wafer (in Week 13, N_B is the base doping) | cm⁻³ |\n| R_p | Projected range: average depth at which implanted ions stop | μm |\n| ΔR_p | Straggle: spread of the implanted ions' stopping depths | μm |\n| N_p | Peak concentration of an implanted profile | cm⁻³ |\n| E (field) | Electric field (on band diagrams, E is energy instead) | V/cm |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| μ_L, μ_I | Mobility limited by lattice scattering, by ionised-impurity scattering | cm²/(V·s) |\n| v_d | Drift velocity | cm/s |\n| v_sat | Saturation velocity at high field | ≈ 10⁷ cm/s in Si |\n| τ_m | Mean free time between collisions | s; about 0.1–1 ps |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| G, G_L | Generation rate of electron–hole pairs (G_L: by light) | cm⁻³s⁻¹ |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| U | Net recombination rate, R − G | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| N_t | Density of traps (recombination centres) | cm⁻³ |\n| n₁, p₁ | SRH parameters n_ie^{(E_t − E_i)/kT} and n_ie^{(E_i − E_t)/kT} | cm⁻³ |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| S | Surface recombination velocity | cm/s |\n| N_st | Density of surface traps | cm⁻² |\n| U_s | Recombination rate per unit area at a surface | cm⁻²s⁻¹ |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| V, V_a | Applied voltage (positive for forward bias) | V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| x_n, x_p | Parts of the depletion region on the n side and on the p side | μm |\n| E_max | Peak electric field, at the junction | V/cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I | Current | A |\n| A (area) | Device or contact area | cm² |\n| η | Ideality factor of a diode, 1 (ideal) to 2 | dimensionless |\n| C, C_j | Capacitance (junction or depletion capacitance) | F (pF = 10⁻¹² F) |\n| Φ_m | Work function of a metal | eV; Al 4.28, Au 5.1 |\n| Φ_s | Work function of a semiconductor, χ + (E_c − E_F) | eV |\n| χ | Electron affinity: energy from E_c up to the vacuum level | eV; Si 4.05 |\n| Φ_B | Schottky barrier height seen from the metal | eV (or V) |\n| A∗∗ | Effective Richardson constant | A/(cm²·K²); n-Si ≈ 110 |\n| I_E, I_B, I_C | Emitter, base and collector currents | A (mA) |\n| V_BE, V_CE, V_CB | Base–emitter, collector–emitter and collector–base voltages | V |\n| α | Common-base current gain, I_C/I_E | dimensionless; 0.98–0.999 |\n| β | Common-emitter current gain, I_C/I_B (also h_FE) | dimensionless; 50–500 |\n| γ (BJT) | Emitter injection efficiency | dimensionless, close to 1 |\n| α_T | Base transport factor | dimensionless, close to 1 |\n| N_E, W_E, D_E; N_B, W_B, D_B | Doping, width and minority diffusion coefficient of the emitter; of the base | cm⁻³; μm; cm²/s |\n| τ_B | Base transit time, W_B²/2D_n | s |\n| C_ox | Gate-oxide capacitance per unit area, ε_ox/t_ox | F/cm² |\n| t_ox | Gate-oxide thickness | nm |\n| φ_F, ψ_s (φ_s) | Bulk Fermi potential (kT/q)ln(N_A/n_i); surface potential (band bending) | V |\n| W_d, W_dmax, Q_dmax | MOS depletion width, its maximum at inversion, and the depletion charge then | μm; C/cm² |\n| V_T (V_th) | Threshold voltage of a MOSFET | V |\n| V_FB | Flat-band voltage | V |\n| Φ_ms, Q_f | Gate–substrate work-function difference; fixed oxide charge | V; C/cm² |\n| γ (MOSFET) | Body-effect coefficient √(2qε_siN_A)/C_ox | V^{1/2} |\n| V_GS, V_DS, V_SB, V_G | Gate–source, drain–source, source–body and gate voltages | V |\n| I_D | Drain current | A (mA) |\n| W/L | Channel width-to-length ratio | dimensionless |\n| g_m | Transconductance, ∂I_D/∂V_GS | S (A/V) |\n| k (MOSFET) | Device parameter μ_nC_ox(W/L) | A/V² (mA/V²) |\n| μ_i, τ_i (μ_L, μ_I, N_I) | Mobility and scattering time for one scattering mechanism (L: lattice, I: ionised impurity); N_I = ionised-impurity density | cm²/(V·s); s; cm⁻³ |\n| J_drift, J_diff | Drift and diffusion parts of the current density | A/cm² |\n| G_n, G_p, R_n, R_p | Generation and recombination rates of electrons and holes | cm⁻³s⁻¹ |\n| τ_b (τ_bulk), τ_surface | Lifetime from bulk recombination only; from surface recombination only | s |\n| U_s, p_s, Δp_s | Surface recombination rate; hole density and excess at the surface | cm⁻²s⁻¹; cm⁻³ |\n| p_n, n_p | Minority-carrier density: holes on the n side, electrons on the p side | cm⁻³ |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| FCC | Face-centred cubic lattice |\n| BCC | Body-centred cubic lattice |\n| SC | Simple cubic lattice |\n| APF | Atomic packing factor |\n| MG-Si | Metallurgical-grade silicon (≈ 98 % pure) |\n| EG-Si | Electronic-grade silicon (99.9999999 % or better) |\n| CZ | Czochralski crystal growth |\n| VPE | Vapour-phase epitaxy |\n| LPE | Liquid-phase epitaxy |\n| MBE | Molecular-beam epitaxy |\n| SRH | Shockley–Read–Hall (trap-assisted) recombination |\n| I-V | Current–voltage (measurement or characteristic) |\n| C-V | Capacitance–voltage (measurement or characteristic) |\n| MOS | Metal–oxide–semiconductor |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| BJT | Bipolar junction transistor |\n| PGD | Postgraduate Diploma |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n## 15.1 Course overview\n\nThe whole course tells one story: **how do we make, control and use the free charges in a crystal?**\n\n| Module | Weeks | The question it answers | The one idea to carry into the exam |\n|---|---|---|---|\n| 1. Material physics and growth | 1–3 | What is a semiconductor, and how do we make and dope it? | Conductivity is controllable because of a moderate band gap and doping. Crystals are grown pure by CZ and epitaxy, and doped by diffusion (erfc or Gaussian) or implantation (Gaussian at R_p). |\n| 2. Bands and statistics | 4–6 | How many electrons and holes are there? | n = N_ce^{−(E_c−E_F)/kT}, p = N_ve^{−(E_F−E_v)/kT}, np = n_i². E_F moves 60 mV per decade of doping, and back to mid-gap when hot. |\n| 3. Transport and injection | 7–9 | How do the carriers move, and how long do extra ones last? | J = qnμE + qD dn/dx, D/μ = kT/q. Excess minority carriers recombine with lifetime τ and spread over L = √(Dτ). |\n| 4. Junctions and interfaces | 10–12 | What happens where two materials meet? | V_bi = (kT/q) ln(N_{A}N_D/n_i²); I = I_s(e^{qV/kT} − 1); Schottky Φ_B = Φ_m − χ; 1/C² against V gives the doping. |\n| 5. Devices | 13–15 | How do transistors work? | BJT: β = α/(1 − α), α = γα_T. MOSFET: V_T = V_FB + 2φ_F + γ√(2φ_F); I_D(sat) = ½μC_ox(W/L)(V_GS − V_T)². |\n\n**How the ideas connect.** Doping (Week 3) sets n and p (Week 5). n and p set conductivity (Week 7). Joining p and n regions creates a built-in field (Week 10). Forward bias injects minority carriers that diffuse and recombine (Weeks 7–9), which gives the diode equation. Two junctions close together give the BJT (Week 13); a field-induced inversion layer gives the MOSFET (Week 14).\n\n## 15.2 Formula sheet\n\n### Physical constants\n\n| Quantity | Symbol | Value |\n|---|---|---|\n| Electronic charge | q | 1.602×10⁻¹⁹ C |\n| Boltzmann constant | k | 1.381×10⁻²³ J/K = 8.617×10⁻⁵ eV/K |\n| Thermal energy at 300 K | kT | 0.0259 eV |\n| Thermal voltage at 300 K | kT/q | 0.0259 V (25.9 mV) |\n| Planck constant | h | 6.626×10⁻³⁴ J·s |\n| Reduced Planck constant | ħ | 1.055×10⁻³⁴ J·s |\n| Free electron mass | m₀ | 9.109×10⁻³¹ kg |\n| Permittivity of free space | ε₀ | 8.854×10⁻¹⁴ F/cm |\n| Speed of light | c | 3×10¹⁰ cm/s |\n| Electron-volt | 1 eV | 1.602×10⁻¹⁹ J |\n| Photon wavelength | λ | 1.24/E (μm, with E in eV) |\n\n### Material data at 300 K\n\n| | Si | Ge | GaAs |\n|---|---|---|---|\n| Crystal | Diamond | Diamond | Zinc blende |\n| Lattice constant a (Å) | 5.43 | 5.65 | 5.65 |\n| Atoms/cm³ | 5.0×10²² | 4.4×10²² | 4.4×10²² |\n| E_g (eV) | 1.12 (indirect) | 0.66 (indirect) | 1.42 (direct) |\n| n_i (cm⁻³) | 1×10¹⁰ | 2.4×10¹³ | 2×10⁶ |\n| N_c (cm⁻³) | 2.8×10¹⁹ | 1.04×10¹⁹ | 4.7×10¹⁷ |\n| N_v (cm⁻³) | 1.04×10¹⁹ | 6.0×10¹⁸ | 7.0×10¹⁸ |\n| μ_n (cm²/V·s) | 1350 | 3900 | 8500 |\n| μ_p (cm²/V·s) | 480 | 1900 | 400 |\n| D_n, D_p (cm²/s) | 35, 12.4 | 101, 49 | 220, 10 |\n| ε_r | 11.7 | 16.0 | 12.9 |\n| χ (eV) | 4.05 | 4.0 | 4.07 |\n| v_sat (cm/s) | 1×10⁷ | 6×10⁶ | ≈ 1×10⁷ (peak 2×10⁷) |\n| Melting point (°C) | 1414 | 937 | 1238 |\n\n### Crystals and Miller indices\n\n    Miller indices: intercepts → reciprocals → clear fractions → (h k l)\n    d_{hkl} = a / √(h² + k² + l²)      (cubic)\n    Diamond: 8 atoms/cell, coordination 4, r_nn = (√3/4)a, APF = 0.34\n    SC 1, BCC 2, FCC 4 atoms/cell;  APF 0.52, 0.68, 0.74\n\n### Growth and doping\n\n    SiO₂ + 2C → Si + 2CO;   Si + 3HCl → SiHCl₃ + H₂;   SiHCl₃ + H₂ → Si + 3HCl\n    Segregation: k₀ = C_s/C_l;   C_s = k₀C₀(1 − f)^{k₀ − 1}\n    Fick 1: F = −D ∂C/∂x;   Fick 2: ∂C/∂t = D ∂²C/∂x²;   D = D₀ e^{−E_a/kT}\n    Constant source: C = C_s erfc(x/2√(Dt));   Q = (2/√π)C_s√(Dt)\n    Limited source: C = (Q/√(πDt)) exp(−x²/4Dt)\n    Implant: N(x) = (Φ/√(2π)ΔR_p) exp(−(x − R_p)²/2ΔR_p²);   N_p ≈ 0.4Φ/ΔR_p;   Φ = It/qA\n\n### Bands and statistics\n\n    Schrödinger: −(ħ²/2m) d²ψ/dx² + Vψ = Eψ\n    Kronig–Penney: P sin(αa)/(αa) + cos(αa) = cos(ka)\n    1/m∗ = (1/ħ²) d²E/dk²\n    f(E) = 1/(1 + e^{(E − E_F)/kT})\n    g_c(E) = (4π(2m_n∗)^{3/2}/h³)√(E − E_c)\n    n = N_c e^{−(E_c − E_F)/kT};   p = N_v e^{−(E_F − E_v)/kT}\n    N_c = 2(2πm_n∗kT/h²)^{3/2}\n    n_i = √(N_cN_v) e^{−E_g/2kT};   np = n_i²\n    n = n_i e^{(E_F − E_i)/kT};   p = n_i e^{(E_i − E_F)/kT}\n    n = (N_D − N_A)/2 + √(((N_D − N_A)/2)² + n_i²)\n    E_F − E_i = kT ln(N_D/n_i);   E_i − E_F = kT ln(N_A/n_i)\n\n### Transport\n\n    v_d = μE;   μ = qτ_m/m∗;   1/μ = 1/μ_L + 1/μ_I\n    J_drift = q(nμ_n + pμ_p)E;   σ = q(nμ_n + pμ_p);   ρ = 1/σ\n    J_n = qnμ_nE + qD_n dn/dx;   J_p = qpμ_pE − qD_p dp/dx\n    Einstein: D/μ = kT/q\n    v_d = μE/[1 + (μE/v_sat)^β]^{1/β}\n\n### Recombination and continuity\n\n    SRH: U = (np − n_i²)/[τ_p(n + n₁) + τ_n(p + p₁)];   τ = 1/(σv_thN_t)\n    Low-level, n-type: U = Δp/τ_p;   Δp(t) = Δp(0)e^{−t/τ_p}\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − μ_pE ∂Δp/∂x + G_L − Δp/τ_p\n    L = √(Dτ);   Δp(x) = Δp(0)e^{−x/L_p}\n    Surface: U_s = SΔp_s;   S = σv_thN_st;   1/τ_eff = 1/τ_b + 2S/W\n\n### Junctions and contacts\n\n    V_bi = (kT/q) ln(N_{A}N_D/n_i²)\n    W = √((2ε_s/q)(V_bi − V)(1/N_A + 1/N_D));   N_Ax_p = N_Dx_n;   E_max = qN_Dx_n/ε_s\n    I = I_s(e^{qV/kT} − 1);   J_s = qn_i²(D_p/(L_pN_D) + D_n/(L_nN_A))\n    C_j = ε_sA/W;   1/C² = 2(V_bi − V)/(qε_sNA²);   N = 2/(qε_sA²|d(1/C²)/dV|)\n    Schottky: Φ_B = Φ_m − χ;   V_bi = Φ_m − Φ_s;   J_s = A∗∗T²e^{−qΦ_B/kT}\n    Ohmic (tunnelling): N_D ≳ 10¹⁹ cm⁻³\n\n### Devices\n\n    BJT:  I_C = I_S e^{qV_BE/kT},   I_S = qAD_Bn_i²/(N_{B}W_B)\n          γ = 1/[1 + D_{E}N_{B}W_B/(D_{B}N_{E}W_E)],   α_T ≈ 1 − W_B²/2L_n²\n          α = γα_T,   β = α/(1 − α),   I_E = I_C + I_B,   τ_B = W_B²/2D_B\n    MOS:  C_ox = ε_ox/t_ox,   φ_F = (kT/q)ln(N_A/n_i),   W_dmax = √(4ε_sφ_F/qN_A)\n          V_T = V_FB + 2φ_F + √(4qε_sN_Aφ_F)/C_ox,   V_FB = Φ_ms − Q_f/C_ox\n          Linear: I_D = μC_ox(W/L)[(V_GS − V_T)V_DS − V_DS²/2]\n          Saturation: I_D = ½μC_ox(W/L)(V_GS − V_T)²,   g_m = μC_ox(W/L)(V_GS − V_T)\n\n### Rules of thumb\n\n- Each decade of doping moves E_F by 60 mV; each 60 mV of forward bias raises diode current tenfold (300 K).\n- n_i(Si) roughly doubles every 8 °C.\n- Doping 10¹⁶ cm⁻³ in Si = 1 dopant per 5×10⁶ Si atoms; ρ ≈ 0.5 Ω·cm (n-type), 1.4 Ω·cm (p-type).\n- Diffusion length in good Si: tens to hundreds of μm.\n\n## 15.3 Problem-solving clinic\n\n### How to answer each type of question\n\n1. **Definitions** (2–3 marks). One clear sentence, then an example, then the formula if there is one. *\"The Fermi level is the energy at which the probability of occupation is ½; in n-type Si it lies near E_c; E_F − E_i = kT ln(N_D/n_i).\"*\n2. **\"Explain\" and \"describe\"** questions want the **mechanism**, not just a list. Use the pattern: what happens physically → the equation → the consequence.\n3. **Derivations.** List the assumptions first, number the steps, and box the final result. Examiners give marks for the assumptions.\n4. **Calculations.** Write the formula, substitute **with units**, give the answer to 2–3 significant figures with units. Then sanity-check the size of the answer.\n5. **Comparisons.** Use a table with three to six rows.\n6. **Diagrams** earn marks: band diagrams, carrier profiles, the CZ puller, MOS band bending, BJT and MOSFET cross-sections, I-V curves.\n\n### Unit traps that cost marks\n\n| Trap | Fix |\n|---|---|\n| Mixing μm and cm | 1 μm = 10⁻⁴ cm. Convert depths and widths to cm before using cm²/s, cm⁻³ |\n| Mixing eV and J | kT = 0.02585 eV at 300 K; only convert to joules (× 1.6×10⁻¹⁹) when multiplying by something in SI |\n| Forgetting the factor ½ | I_D(sat) = **½**μC_ox(W/L)(V_GS − V_T)² |\n| Using the wrong form of diffusion length | Use the form the question gives: √(Dt), √(2Dt) or 2√(Dt) |\n| Natural log against log₁₀ | All the semiconductor formulas use ln. ln(10ⁿ) = 2.303n |\n| Dose units | Dose is per cm² (atoms/cm²); concentration is per cm³ |\n\n### Sanity checks\n\n| Quantity | Typical size |\n|---|---|\n| Carrier concentrations | 10⁴ – 10²⁰ cm⁻³ |\n| n_i (Si, 300 K) | 10¹⁰ cm⁻³ |\n| E_F − E_i | 0.2 – 0.5 eV |\n| Diffusion coefficients (dopants in a furnace) | 10⁻¹⁵ – 10⁻¹² cm²/s |\n| Carrier diffusion coefficients | 1 – 100 cm²/s |\n| Built-in voltage | 0.5 – 1.0 V |\n| Depletion width | 0.01 – 10 μm |\n| BJT β | 20 – 500 |\n| MOSFET V_T | 0.2 – 2 V |\n\n## 15.4 Past-question style exercises (with solutions)\n\n### E1. Find the Miller indices of a plane with intercepts 4a, 2b and ∞c.\n\nReciprocals 1/4, 1/2, 0. Multiply by 4: **(1 2 0)**. The plane is parallel to the z-axis.\n\n### E2. Constant-source diffusion with C_s = 5×10¹⁹ cm⁻³, D = 2×10⁻¹³ cm²/s, t = 2 h. Find the concentration at 0.3 μm.\n\n    t = 7200 s,   √(Dt) = √(2×10⁻¹³ × 7200) = √(1.44×10⁻⁹) = 3.79×10⁻⁵ cm\n    u = x/2√(Dt) = 3×10⁻⁵ / (2 × 3.79×10⁻⁵) = 0.395\n    erfc(0.395) = 0.576\n    C = 5×10¹⁹ × 0.576 = 2.88×10¹⁹ cm⁻³\n\n### E3. Silicon is doped with N_A = 2×10¹⁶ cm⁻³ at 300 K (n_i = 10¹⁰ cm⁻³). Find p, n and the Fermi level relative to E_i.\n\n    p ≈ N_A = 2×10¹⁶ cm⁻³\n    n = n_i²/p = 10²⁰/(2×10¹⁶) = 5×10³ cm⁻³\n    E_i − E_F = kT ln(p/n_i) = 0.02585 ln(2×10⁶) = 0.02585 × 14.51 = 0.375 eV\n\nE_F lies 0.375 eV below E_i.\n\n### E4. Find the resistivity of n-type Si with N_D = 10¹⁵ cm⁻³ and μ_n = 1350 cm²/V·s.\n\n    σ = qN_Dμ_n = 1.6×10⁻¹⁹ × 10¹⁵ × 1350 = 0.216 S/cm\n    ρ = 1/σ = 4.63 Ω·cm\n\n### E5. Holes in n-Si have μ_p = 450 cm²/V·s and lifetime 5 μs. Find D_p and the diffusion length L_p.\n\n    D_p = (kT/q)μ_p = 0.02585 × 450 = 11.6 cm²/s\n    L_p = √(D_pτ_p) = √(11.6 × 5×10⁻⁶) = 7.6×10⁻³ cm = 76 μm\n\n### E6. A Si p⁺n junction has N_A = 10¹⁷ cm⁻³ and N_D = 10¹⁵ cm⁻³. Find V_bi and the zero-bias depletion width.\n\n    V_bi = (kT/q) ln(N_{A}N_D/n_i²) = 0.02585 ln(10³²/10²⁰) = 0.02585 × 27.63 = 0.714 V\n\nOne-sided junction, so the depletion region is almost all on the lightly doped n side:\n\n    W ≈ √(2ε_sV_bi/qN_D) = √(2 × 1.04×10⁻¹² × 0.714 / (1.6×10⁻¹⁹ × 10¹⁵)) = 9.6×10⁻⁵ cm = 0.96 μm\n\n### E7. A diode has I_s = 2×10⁻¹⁴ A. Find the current at V = 0.65 V and 300 K.\n\n    I = I_s(e^{qV/kT} − 1) = 2×10⁻¹⁴ × e^{0.65/0.02585} = 2×10⁻¹⁴ × 8.3×10¹⁰ = 1.66 mA\n\n### E8. A BJT has β = 150 and I_B = 20 μA. Find I_C, I_E and α.\n\n    I_C = βI_B = 150 × 20 μA = 3.00 mA\n    I_E = I_C + I_B = 3.02 mA\n    α = β/(β + 1) = 150/151 = 0.9934\n\n### E9. An nMOS has μ_nC_ox(W/L) = 0.8 mA/V² and V_T = 0.7 V, with V_GS = 2 V. Find I_D for V_DS = 0.5 V and for V_DS = 3 V.\n\nV_GS − V_T = 1.3 V.\n\n    V_DS = 0.5 V < 1.3 V → linear:  I_D = 0.8 × [1.3 × 0.5 − 0.5²/2] = 0.8 × 0.525 = 0.42 mA\n    V_DS = 3 V ≥ 1.3 V → saturation: I_D = ½ × 0.8 × 1.3² = 0.4 × 1.69 = 0.676 mA\n\n## 15.5 Final examination checklist\n\n**Before the exam, can you:**\n\n- [Week 1] compare conductors, semiconductors and insulators; Si, Ge and GaAs; find Miller indices including ∞ and negative intercepts?\n- [Week 2] describe MG-Si → EG-Si, the CZ method with its advantages and limitations, and compare VPE, LPE, MBE?\n- [Week 3] state Fick's laws; use the erfc and Gaussian profiles; calculate junction depth, implant peak and dose?\n- [Week 4] state the Schrödinger equation and explain the Kronig–Penney model; compare direct and indirect gaps; derive n_i?\n- [Week 5] use the Fermi–Dirac function; calculate n, p and E_F for any doping; explain the three temperature regions?\n- [Week 7] calculate drift current and conductivity; explain scattering; state and use the Einstein relation?\n- [Week 8] explain velocity saturation, hot carriers, SRH recombination and lifetime?\n- [Week 9] write the continuity equation and solve it for steady injection; explain surface recombination velocity?\n- [Week 10] explain the depletion region; calculate V_bi and W; derive the Shockley equation?\n- [Week 11] draw Schottky and Ohmic band diagrams in equilibrium and under bias?\n- [Week 12] extract doping and V_bi from a 1/C² plot; extract I_s and η from an I-V plot?\n- [Week 13] explain BJT operation and minority-carrier profiles; use γ, α_T, α, β?\n- [Week 14] explain accumulation, depletion, inversion; use V_T; calculate I_D in each region?\n\n**On the day:** bring a scientific calculator (with e^x and ln), a ruler for diagrams, and spare pens. Read every question first, start with the one you know best, and leave 10 minutes to check units.\n\n## 15.6 Comprehensive revision questions\n\nWork through these without notes, then check against the week shown. Full worked answers for the 50 PGD examination questions are on the next page (the answer key) and in each week.\n\n1. Define a semiconductor and explain why its conductivity rises with temperature. (Week 1)\n2. Explain covalent bonding in silicon and electron–hole pair generation. (Week 1)\n3. Find the Miller indices of planes with intercepts (a) a, 2b, 3c; (b) 2a, 3b, ∞c. (Week 1)\n4. Describe the conversion of MG-Si to EG-Si and the Czochralski method. (Week 2)\n5. Compare VPE, LPE and MBE. (Week 2)\n6. State Fick's first and second laws and the two diffusion profiles. (Week 3)\n7. Compare diffusion and ion implantation. Find the junction depth of an implant with N_p = 10¹⁸ cm⁻³, R_p = 0.2 μm, ΔR_p = 0.04 μm into N_B = 10¹⁶ cm⁻³. (Week 3; answer x_j = 0.2 + 0.04√(2 ln 100) = 0.321 μm)\n8. Explain the Kronig–Penney model and how it gives energy bands. (Week 4)\n9. Derive n_i = √(N_cN_v)e^{−E_g/2kT}. (Week 4)\n10. Write the Fermi–Dirac function and describe it at 0 K and 300 K. (Week 5)\n11. Find n, p and E_F for Si with N_D = 5×10¹⁵ cm⁻³. (Week 5; n = 5×10¹⁵, p = 2×10⁴ cm⁻³, E_F − E_i = 0.339 eV)\n12. Derive the drift current density and the Einstein relation. (Week 7)\n13. Explain SRH recombination and define minority-carrier lifetime. (Week 8)\n14. Derive the minority-carrier continuity equation and solve it for steady injection into a long bar. (Week 9)\n15. Explain the formation of the depletion region; derive the Shockley diode equation. (Week 10)\n16. Distinguish Schottky and Ohmic contacts with band diagrams. (Week 11)\n17. Explain how C-V measurements give the doping concentration. (Week 12)\n18. Explain BJT operation and derive β = α/(1 − α). (Week 13)\n19. Explain accumulation, depletion and inversion; derive the saturation condition of a MOSFET. (Week 14)\n20. Compare a BJT and a MOSFET. (Week 14)\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 15.1: one sample, every property\n\n**Question.** n-type silicon has N_D = 2×10¹⁶ cm⁻³, μ_n = 1200 cm²/V·s, μ_p = 420 cm²/V·s and τ_p = 2 μs. At 300 K find (a) n and p, (b) E_F − E_i, (c) the conductivity, (d) D_p and (e) the hole diffusion length.\n\n**Given:** N_D = 2×10¹⁶ cm⁻³, n_i = 10¹⁰ cm⁻³, μ_n = 1200, μ_p = 420 cm²/V·s, τ_p = 2×10⁻⁶ s.\n\n**Find:** n, p, E_F − E_i, σ, D_p, L_p.\n\n**Solution.**\n\n    (a) n = 2×10¹⁶ cm⁻³,  p = 10²⁰/2×10¹⁶ = 5×10³ cm⁻³\n    (b) E_F − E_i = 0.0259 ln(2×10⁶) = 0.376 eV\n    (c) σ = qnμ_n = 1.6×10⁻¹⁹ × 2×10¹⁶ × 1200 = 3.84 S/cm\n    (d) D_p = 0.0259 × 420 = 10.9 cm²/s\n    (e) L_p = √(10.9 × 2×10⁻⁶) = 4.66×10⁻³ cm = 46.6 μm\n\n**Answer:** **n = 2×10¹⁶, p = 5×10³ cm⁻³; E_F = E_i + 0.376 eV; σ = 3.84 S/cm; D_p = 10.9 cm²/s; L_p = 47 μm.**\n\n#### Practice 15.2: a diode made from that sample\n\n**Question.** A p⁺n diode (N_A = 1×10¹⁹ cm⁻³, area 1×10⁻³ cm²) is made on the silicon of Practice 15.1. Find V_bi, the zero-bias depletion width, I_s and the current at 0.65 V.\n\n**Given:** N_A = 10¹⁹, N_D = 2×10¹⁶ cm⁻³, D_p = 10.9 cm²/s, L_p = 4.66×10⁻³ cm, A = 10⁻³ cm².\n\n**Find:** V_bi, W, I_s, I(0.65 V).\n\n**Solution.**\n\n    V_bi = 0.0259 ln(10¹⁹ × 2×10¹⁶/10²⁰) = 0.0259 ln(2×10¹⁵) = 0.913 V\n    W ≈ √(2ε_sV_bi/qN_D) = √(2 × 1.04×10⁻¹² × 0.913/(1.6×10⁻¹⁹ × 2×10¹⁶)) = 2.44×10⁻⁵ cm = 0.24 μm\n    J_s ≈ qn_i²D_p/(L_pN_D) = 1.6×10⁻¹⁹ × 10²⁰ × 10.9/(4.66×10⁻³ × 2×10¹⁶) = 1.87×10⁻¹² A/cm²\n    I_s = 1.87×10⁻¹⁵ A\n    I(0.65 V) = 1.87×10⁻¹⁵ × e^{0.65/0.0259} = 1.87×10⁻¹⁵ × 7.9×10¹⁰ = 0.15 mA\n\n**Answer:** **V_bi = 0.91 V, W = 0.24 μm, I_s = 1.9×10⁻¹⁵ A, I(0.65 V) = 0.15 mA.**\n\n#### Practice 15.3: a complete MOSFET calculation\n\n**Question.** An nMOS has N_A = 1×10¹⁷ cm⁻³, t_ox = 5 nm, V_FB = −0.9 V, μ_n = 350 cm²/V·s and W/L = 20. Find V_T and the saturation current at V_GS = 1.2 V.\n\n**Given:** N_A = 10¹⁷ cm⁻³, t_ox = 5×10⁻⁷ cm, V_FB = −0.9 V, μ_n = 350 cm²/V·s, W/L = 20.\n\n**Find:** V_T and I_D(sat).\n\n**Solution.**\n\n    C_ox = 3.45×10⁻¹³/5×10⁻⁷ = 6.9×10⁻⁷ F/cm²\n    φ_F = 0.417 V,  2φ_F = 0.834 V\n    γ = √(2qε_siN_A)/C_ox = 1.824×10⁻⁷/6.9×10⁻⁷ = 0.264 V^{1/2},  γ√(2φ_F) = 0.241 V\n    V_T = −0.9 + 0.834 + 0.241 = 0.18 V\n    k = μ_nC_ox(W/L) = 350 × 6.9×10⁻⁷ × 20 = 4.83 mA/V²\n    I_D(sat) = ½ × 4.83 × (1.2 − 0.18)² = 2.5 mA\n\n**Answer:** **V_T ≈ 0.18 V, I_D(sat) ≈ 2.5 mA.**\n\n#### Practice 15.4: essay practice\n\n**Question.** In about one page, explain how a p-n junction diode rectifies, starting from the formation of the depletion region and ending with the Shockley equation. (Use the structure of Week 10 and Q47–Q48.)\n\n**Answer outline.** (1) Diffusion of holes and electrons across the junction uncovers fixed ions: the depletion region and its field. (2) Equilibrium: drift balances diffusion, E_F is flat, V_bi = (kT/q) ln(N_{A}N_D/n_i²). (3) Forward bias lowers the barrier; minority carriers are injected (law of the junction, p_n = p_n0e^{qV/kT}). (4) They diffuse and recombine over L_p, L_n; the diffusion currents at the depletion edges add to give I = I_s(e^{qV/kT} − 1). (5) Reverse bias raises the barrier: only the tiny −I_s flows. Hence rectification. Include the band diagram and the I-V sketch.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Summarise the whole course and how its ideas connect. | Trace the chain from doping to the diode equation in one sentence. | Doping sets n and p; a p-n junction forms a barrier; forward bias injects minority carriers that diffuse and recombine, giving I = I_s(e^{qV/kT} − 1). | 15.1 |\n| 2 | Recall and apply the key formulas. | Write the mass-action law, the Einstein relation and the saturation MOSFET current. | np = n_i²; D/μ = kT/q; I_D = ½μC_ox(W/L)(V_GS − V_T)². | 15.2 |\n| 3 | Answer definitions, derivations and calculations in examination style. | What should a derivation answer begin with? | A list of the assumptions. | 15.3 |\n| 4 | Solve mixed past-question style problems. | Find V_bi for N_A = 10¹⁷ and N_D = 10¹⁵ cm⁻³ in Si. | 0.714 V. | 15.4, E6 |\n| 5 | Check readiness for the final examination. | Can you tick every line of the checklist in 15.5? | If not, revise the week named on that line. | 15.5–15.6 |\n", "group": "Module 5 · Advanced Device Technology", "eyebrow": "Week 15", "disp": "15"}, {"num": "16", "title": "Answer Key — All 50 Examination Questions", "body": "\nThe key point of every PGD examination answer in one or two lines. Cover the right-hand column, say the answer aloud, then check. The full worked answer is in the week shown in brackets.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| ħ | Reduced Planck constant, h/2π | 1.055×10⁻³⁴ J·s |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_t | Energy level of a trap (recombination centre) in the gap | eV |\n| E_a | Activation energy of dopant diffusion | eV; about 3–4 eV |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| g(E), g_c, g_v | Density of states: allowed states per unit energy per unit volume | states/(eV·cm³) |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| m∗, m_n∗, m_p∗ | Effective mass of electrons or holes | kg, or as a multiple of m₀ |\n| ψ | Wave function (\\|ψ\\|² is the probability density) | — |\n| α (Kronig–Penney) | √(2mE)/ħ, set by the electron energy | m⁻¹ |\n| P (Kronig–Penney) | Barrier strength mV₀ba/ħ² | dimensionless |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| (h k l), {h k l} | Miller indices of a plane; family of equivalent planes | integers |\n| C_s | Surface concentration of a diffusion (or solid concentration when freezing) | cm⁻³ |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| D | Diffusion coefficient (dopants in a furnace, or carriers) | cm²/s |\n| D₀ | Diffusion constant in D = D₀e^{−E_a/kT} | cm²/s |\n| F | Particle flux in Fick's law | particles/(cm²·s) |\n| Q | Dose: dopant atoms per unit area (in Weeks 13–14, Q also means charge) | atoms/cm² (C or C/cm² for charge) |\n| erfc | Complementary error function, erfc(u) = 1 − erf(u); read from a table | dimensionless |\n| R_p | Projected range: average depth at which implanted ions stop | μm |\n| R_s | Sheet resistance (or diode series resistance in Week 12) | Ω/□ (ohms per square); Ω |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| v_d | Drift velocity | cm/s |\n| v_sat | Saturation velocity at high field | ≈ 10⁷ cm/s in Si |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| T_e | Electron temperature of hot carriers | K |\n| G, G_L | Generation rate of electron–hole pairs (G_L: by light) | cm⁻³s⁻¹ |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| U | Net recombination rate, R − G | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| N_t | Density of traps (recombination centres) | cm⁻³ |\n| n₁, p₁ | SRH parameters n_ie^{(E_t − E_i)/kT} and n_ie^{(E_i − E_t)/kT} | cm⁻³ |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| S | Surface recombination velocity | cm/s |\n| N_st | Density of surface traps | cm⁻² |\n| U_s | Recombination rate per unit area at a surface | cm⁻²s⁻¹ |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I | Current | A |\n| η | Ideality factor of a diode, 1 (ideal) to 2 | dimensionless |\n| C, C_j | Capacitance (junction or depletion capacitance) | F (pF = 10⁻¹² F) |\n| Φ_m | Work function of a metal | eV; Al 4.28, Au 5.1 |\n| Φ_s | Work function of a semiconductor, χ + (E_c − E_F) | eV |\n| χ | Electron affinity: energy from E_c up to the vacuum level | eV; Si 4.05 |\n| Φ_B | Schottky barrier height seen from the metal | eV (or V) |\n| β | Common-emitter current gain, I_C/I_B (also h_FE) | dimensionless; 50–500 |\n| V_T (V_th) | Threshold voltage of a MOSFET | V |\n| v_dn, v_dp | Drift velocity of electrons and holes | cm/s |\n| μ_i, τ_i (μ_L, μ_I, N_I) | Mobility and scattering time for one scattering mechanism (L: lattice, I: ionised impurity); N_I = ionised-impurity density | cm²/(V·s); s; cm⁻³ |\n| G_n, G_p, R_n, R_p | Generation and recombination rates of electrons and holes | cm⁻³s⁻¹ |\n| τ_b (τ_bulk), τ_surface | Lifetime from bulk recombination only; from surface recombination only | s |\n| U_s, p_s, Δp_s | Surface recombination rate; hole density and excess at the surface | cm⁻²s⁻¹; cm⁻³ |\n| p_n, n_p | Minority-carrier density: holes on the n side, electrons on the p side | cm⁻³ |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| InP | Indium phosphide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| CB | Conduction band |\n| VB | Valence band |\n| III–V | Compound of Group III and Group V elements (e.g. GaAs) |\n| MG-Si | Metallurgical-grade silicon (≈ 98 % pure) |\n| EG-Si | Electronic-grade silicon (99.9999999 % or better) |\n| CZ | Czochralski crystal growth |\n| FZ | Float-zone crystal growth |\n| CVD | Chemical vapour deposition |\n| VPE | Vapour-phase epitaxy |\n| LPE | Liquid-phase epitaxy |\n| MBE | Molecular-beam epitaxy |\n| MOCVD | Metal-organic chemical vapour deposition |\n| UHV | Ultra-high vacuum (≈ 10⁻¹⁰ Torr) |\n| SRH | Shockley–Read–Hall (trap-assisted) recombination |\n| LDD | Lightly doped drain |\n| I-V | Current–voltage (measurement or characteristic) |\n| C-V | Capacitance–voltage (measurement or characteristic) |\n| HEMT | High-electron-mobility transistor |\n| BJT | Bipolar junction transistor |\n| HBT | Heterojunction bipolar transistor |\n| IC | Integrated circuit |\n| VLSI | Very-large-scale integration |\n| LED | Light-emitting diode |\n| RF | Radio frequency |\n| PGD | Postgraduate Diploma |\n| LHS | Left-hand side (of an equation) |\n| IR | Infrared |\n\n\n## Material physics and semiconductor growth (Q1–Q13)\n\n| Q | Key answer |\n|---|---|\n| 1 (Week 1) | Conductivity between metal and insulator, controllable by doping, T, light. Metal: no gap, σ falls with T. Insulator: gap > 4 eV. Semiconductor: gap ≈ 1 eV, two carriers, σ rises with T. |\n| 2 (Week 1) | Elemental: one element, Group IV, covalent, e.g. **Si, Ge**. Compound: two or more elements (III–V, II–VI), tunable and often direct gap, e.g. **GaAs, InP**. |\n| 3 (Week 1) | Abundant and cheap; excellent native SiO₂; 1.12 eV gap gives low leakage to 150 °C; large perfect crystals; strong, good thermal conductor; well-understood doping. |\n| 4 (Week 1) | Gaps 1.12 / 0.66 / 1.42 eV; indirect / indirect / direct; μ_n 1350 / 3900 / 8500. Si for ICs and power; Ge for IR and SiGe HBTs; GaAs for RF, LEDs, lasers. |\n| 5 (Week 1) | Lattice = periodic array of points; crystal = lattice + basis. Structure sets bands and gap, mobility, anisotropy, doping sites, epitaxy, cleavage and defects. |\n| 6 (Week 1) | Smallest integers proportional to reciprocals of intercepts. Steps: intercepts → reciprocals → clear fractions → (h k l). Infinite intercept → 0; negative → bar. |\n| 7 (Week 1) | 2, 3, 1 → 1/2, 1/3, 1 → × 6 → **(3 2 6)**. In a cubic crystal d = a/7. |\n| 8 (Week 1) | Covalent: shared pairs, directional. Ionic: electron transfer, Coulomb attraction. Metallic: electron sea. **Si is covalent**: four sp³ bonds, tetrahedral, 109.5°. |\n| 9 (Week 2) | SiO₂ + 2C → MG-Si (98 %); Si + 3HCl → SiHCl₃ (300 °C); fractional distillation; Siemens CVD SiHCl₃ + H₂ → Si + 3HCl (1100 °C) → EG-Si (9N–11N) polysilicon; then CZ/FZ. |\n| 10 (Week 2) | Seed dipped into melt at 1414 °C and slowly pulled (≈ 1 mm/min) with counter-rotation; melt freezes epitaxially on seed; Dash neck removes dislocations; shoulder, body, tail. |\n| 11 (Week 2) | Advantages: large diameter, dislocation-free, controlled doping, low cost, oxygen strengthens and getters. Limitations: O and C contamination from crucible (limits resistivity), axial doping variation from segregation. |\n| 12 (Week 2) | VPE: gas reacts on hot substrate (SiCl₄ + 2H₂ → Si + 4HCl). LPE: precipitation from cooling saturated melt. MBE: atomic beams in UHV with shutters, monolayer control. |\n| 13 (Week 2) | Temperature VPE 1000–1250 °C > LPE 700–900 °C > MBE 500–650 °C. Precision MBE (atomic) > VPE > LPE. Uses: VPE production Si/MOCVD LEDs; LPE LEDs, thick layers; MBE quantum wells, HEMTs. |\n\n## Impurity control and doping (Q14–Q21)\n\n| Q | Key answer |\n|---|---|\n| 14 (Week 3) | Controlled addition of impurities (10¹⁴–10²⁰ cm⁻³). Needed because intrinsic σ is too low and T-sensitive; sets carrier type, makes junctions, sets V_bi, V_T, β, contacts. |\n| 15 (Week 3) | n-type: Group V donors, electrons majority, E_F near E_c, n ≈ N_D. p-type: Group III acceptors, holes majority, E_F near E_v, p ≈ N_A. |\n| 16 (Week 3) | Donor: one extra valence electron, gives it to CB, becomes +, level near E_c (P, As, Sb). Acceptor: one fewer, takes an electron creating a hole, becomes −, level near E_v (B, Al, Ga, In). |\n| 17 (Week 3) | Thermally activated jumps down a gradient. Vacancy (substitutional, slow: B, P, As), interstitial (fast: Au, Cu, Fe), interstitialcy. D = D₀e^{−E_a/kT}. Predeposition + drive-in. |\n| 18 (Week 3) | First law F = −D∂C/∂x (flux ∝ gradient). Second law ∂C/∂t = D∂²C/∂x² (from continuity), gives the profile's time evolution. |\n| 19 (Week 3) | Constant source → C = 10²⁰ erfc(x/2√(Dt)) cm⁻³. Maximum (10²⁰) at the surface, falling monotonically with depth; penetrates as √t; dose Q = (2/√π)C_s√(Dt). |\n| 20 (Week 3) | Ionised, mass-selected dopant ions accelerated (keV–MeV) into the wafer; Gaussian profile at R_p; anneal. Advantages: precise dose, independent depth, low temperature, resist masks, shallow and buried profiles. |\n| 21 (Week 3) | Diffusion: high T, surface-peaked erfc/Gaussian, coupled dose/depth, no damage, cheap batch. Implant: room T, peak at R_p, ±1 % dose, damage needs anneal, channelling, costly, standard for VLSI. |\n\n## Energy bands and carrier statistics (Q22–Q34)\n\n| Q | Key answer |\n|---|---|\n| 22 (Week 4) | Wave nature; fixed nuclei (Born–Oppenheimer); perfect periodic potential; independent electrons in average potential; Bloch functions; Pauli principle; effective mass; Fermi–Dirac statistics. |\n| 23 (Week 4) | −(ħ²/2m)d²ψ/dx² + Vψ = Eψ. Kinetic-energy term + potential-energy term = total energy E; \\|ψ\\|² is probability density; E eigenvalues give quantisation. |\n| 24 (Week 4) | Periodic square wells and barriers; Bloch condition gives P sin(αa)/αa + cos αa = cos ka. Only energies with LHS between ±1 are allowed → bands and gaps; edges at k = nπ/a. |\n| 25 (Week 4) | VB: highest full band at 0 K (bond electrons, holes). CB: lowest empty band (free electrons). Gap E_g = E_c − E_v: no states. |\n| 26 (Week 4) | Direct: CB min and VB max at same k, photon only, efficient light (GaAs). Indirect: different k, phonon needed, poor emitter (Si, Ge). λ = 1.24/E_g μm. |\n| 27 (Week 4) | Pure, n = p = n_i. n = N_ce^{−(E_c−E_F)/kT}, p = N_ve^{−(E_F−E_v)/kT}; multiply: **n_i = √(N_cN_v) e^{−E_g/2kT}** ∝ T^{3/2}e^{−E_g/2kT}. |\n| 28 (Week 4) | Intrinsic: thermal only, n = p = n_i, strongly T-dependent. Extrinsic: from dopants, n ≠ p, n ≈ N_D or p ≈ N_A, nearly T-independent. Linked by np = n_i². |\n| 29 (Week 4) | n = p and np = n_i² ⇒ **n = p = 1.0×10¹⁰ cm⁻³**. |\n| 30 (Week 5) | f(E) = 1/(1 + e^{(E−E_F)/kT}): occupation probability of a state; ½ at E_F. Gives n and p, defines E_F, constant E_F in equilibrium sets junction physics. |\n| 31 (Week 5) | At 0 K f is a step: 1 below E_F, 0 above. VB full, CB empty, pure semiconductor is an insulator. |\n| 32 (Week 5) | g(E) = states per unit energy per unit volume, g_c ∝ (m_n∗)^{3/2}√(E − E_c). n = ∫g f dE; gives N_c, N_v; zero in gap. |\n| 33 (Week 5) | n-type: E_F rises toward E_c, E_F − E_i = kT ln(N_D/n_i). p-type: falls toward E_v. 60 mV per decade; degenerate at very high doping; returns to E_i at high T. |\n| 34 (Week 4) | n ≈ N_D = **5×10¹⁶ cm⁻³**. (p = 2×10³ cm⁻³; E_F − E_i = 0.40 eV in Si.) |\n\n## Carrier transport and injection (Q35–Q46)\n\n| Q | Key answer |\n|---|---|\n| 35 (Week 7) | μ = v_d/E = qτ/m∗. Depends on effective mass, temperature (lattice T^{−3/2}, impurity T^{3/2}), doping, field, defects, surfaces, orientation, strain. |\n| 36 (Week 7) | Lattice (acoustic, optical, polar phonons), ionised impurity, neutral impurity, carrier–carrier, defects, surface roughness, alloy, intervalley. Matthiessen 1/μ = Σ1/μ_i. |\n| 37 (Week 7) | v_dn = −μ_nE, v_dp = μ_pE; J = ρv: J_n = qnμ_nE, J_p = qpμ_pE; **J = q(nμ_n + pμ_p)E**, σ = q(nμ_n + pμ_p). |\n| 38 (Week 7) | J = qnμE = 1.602×10⁻¹⁹ × 2×10¹⁶ × 1350 × 10 = **43.3 A/cm²**. |\n| 39 (Week 7) | Current from carriers moving down a concentration gradient by random motion. Fick: F = −D dC/dx. J_n = qD_n dn/dx, J_p = −qD_p dp/dx. |\n| 40 (Week 7) | **D/μ = kT/q** (0.0259 V). From zero equilibrium current in a non-uniform sample. Si: D_n = 35, D_p = 12.4 cm²/s. |\n| 41 (Week 8) | High field: optical-phonon emission caps v_d at v_sat ≈ 10⁷ cm/s. Hot carriers (T_e ≫ T): impact ionisation, avalanche, oxide injection and V_T drift, substrate current; LDD as cure. |\n| 42 (Week 8) | Generation creates e–h pairs (thermal, optical, impact); recombination annihilates them (radiative, SRH, Auger, surface). Equal in equilibrium; net U = Δp/τ. |\n| 43 (Week 8) | Recombination via mid-gap trap: capture/emission of electrons and holes. U = (np − n_i²)/[τ_p(n + n₁) + τ_n(p + p₁)]; maximum for E_t ≈ E_i; τ = 1/σv_thN_t. |\n| 44 (Week 8) | Average time an excess minority carrier survives: Δp(t) = Δp(0)e^{−t/τ}. Sets L = √(Dτ), diode leakage, switching speed, BJT gain, solar-cell efficiency. |\n| 45 (Week 9) | ∂p/∂t = −(1/q)∂J_p/∂x + G − R; minority form ∂Δp/∂t = D∂²Δp/∂x² − Δp/τ + G. Used for diodes (exponential profile), BJTs, lifetime and Haynes–Shockley, solar cells. |\n| 46 (Week 9) | S defined by U_s = SΔp_s (cm/s), S = σv_thN_st. Dangling-bond surface states are SRH centres: 1/τ_eff = 1/τ_b + 2S/W. Passivate with SiO₂, SiNₓ, Al₂O₃. |\n\n## Junctions, interfaces and characterisation (Q47–Q50)\n\n| Q | Key answer |\n|---|---|\n| 47 (Week 10) | Diffusion of carriers uncovers fixed ions → depletion region and field; drift balances diffusion; flat E_F. **V_bi = (kT/q) ln(N_{A}N_D/n_i²)**; W = √(2ε_sV_bi(N_A + N_D)/qN_{A}N_D). |\n| 48 (Week 10) | Assumptions; law of junction p_n = p_n0e^{qV/kT}; diffusion equation → exponential decay over L_p; currents at edges; **I = I_s(e^{qV/kT} − 1)**, J_s = qn_i²(D_p/L_pN_D + D_n/L_nN_A). Forward: exponential rise; reverse: −I_s. |\n| 49 (Week 11) | Schottky: Φ_m > Φ_s (n-type), upward bending, depletion, barrier Φ_B = Φ_m − χ, rectifying, thermionic, fast. Ohmic: Φ_m < Φ_s or heavy doping, accumulation or tunnelling, linear I-V. |\n| 50 (Week 12) | I-V: ln I vs V gives I_s, η, R_s, breakdown, Φ_B. C-V: C = ε_sA/W; **1/C² = 2(V_bi − V)/(qε_sNA²)**; slope gives N = 2/(qε_sA²·slope), intercept gives V_bi; local slope gives profile N(W). |\n", "group": "Revision & Practicals", "eyebrow": "Revision & Practicals", "disp": "·"}, {"num": "17", "title": "Laboratory and Practical Component", "body": "\nThe course plan requires at least four practical or simulation experiments (3 hours/week). Each practical below gives the aim, theory, procedure, a results table and the analysis. **The readings in the tables are example values** that show what correct results look like; replace them with your own measurements.\n\n## Symbols and abbreviations used on this page\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| R_s | Sheet resistance (or diode series resistance in Week 12) | Ω/□ (ohms per square); Ω |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| V, V_a | Applied voltage (positive for forward bias) | V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I | Current | A |\n| A (area) | Device or contact area | cm² |\n| η | Ideality factor of a diode, 1 (ideal) to 2 | dimensionless |\n| C, C_j | Capacitance (junction or depletion capacitance) | F (pF = 10⁻¹² F) |\n| Φ_B | Schottky barrier height seen from the metal | eV (or V) |\n| A∗∗ | Effective Richardson constant | A/(cm²·K²); n-Si ≈ 110 |\n| C_ox | Gate-oxide capacitance per unit area, ε_ox/t_ox | F/cm² |\n| V_T (V_th) | Threshold voltage of a MOSFET | V |\n| V_GS, V_DS, V_SB, V_G | Gate–source, drain–source, source–body and gate voltages | V |\n| I_D | Drain current | A (mA) |\n| W/L | Channel width-to-length ratio | dimensionless |\n| g_m | Transconductance, ∂I_D/∂V_GS | S (A/V) |\n| k (MOSFET) | Device parameter μ_nC_ox(W/L) | A/V² (mA/V²) |\n| ΔI_D, ΔV_GS | Small changes in drain current and gate voltage (their ratio is g_m) | A; V |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| I-V | Current–voltage (measurement or characteristic) |\n| C-V | Capacitance–voltage (measurement or characteristic) |\n| LCR | Inductance–capacitance–resistance meter |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| DC | Direct current (steady) |\n| AC | Alternating current (small signal) |\n| MATLAB | A numerical computing program (alternative to Python) |\n\n\n---\n\n## Practical 1 — Simulation of carrier transport: Fermi-level shifts in Python\n\n**Aim.** Model how the Fermi level of silicon moves with temperature and with doping, and find the temperature at which a doped sample becomes intrinsic.\n\n**Theory (Weeks 4–5).**\n\n    n_i(T) = √(N_cN_v) e^{−E_g(T)/2kT},   N_c, N_v ∝ T^{3/2},   E_g(T) = 1.17 − 4.73×10⁻⁴T²/(T + 636) eV\n    n = N_D/2 + √((N_D/2)² + n_i²)   (complete ionisation)\n    E_F − E_i = kT ln(n/n_i)\n\n**Procedure.**\n\n1. Run the script below (Python 3 with NumPy and Matplotlib; the same steps work in MATLAB).\n2. Plot E_F − E_i against T from 200 K to 700 K for N_D = 10¹⁴, 10¹⁵, 10¹⁶ and 10¹⁷ cm⁻³.\n3. Plot E_F − E_i against N_D at 300 K from 10¹⁴ to 10¹⁸ cm⁻³ and measure the slope per decade.\n4. For each doping, record the temperature at which n_i = N_D.\n\n```\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nk = 8.617e-5                       # Boltzmann constant, eV/K\nNc300, Nv300 = 2.8e19, 1.04e19     # effective densities of states at 300 K, cm^-3\n\ndef Eg(T):                         # silicon band gap, eV (Varshni)\n    return 1.17 - 4.73e-4 * T**2 / (T + 636)\n\ndef ni(T):\n    Nc = Nc300 * (T / 300)**1.5\n    Nv = Nv300 * (T / 300)**1.5\n    raw = np.sqrt(Nc * Nv) * np.exp(-Eg(T) / (2 * k * T))\n    return raw * 1e10 / ni_raw300  # scale so n_i(300 K) = 1e10 cm^-3\n\nni_raw300 = np.sqrt(Nc300 * Nv300) * np.exp(-Eg(300) / (2 * k * 300))\n\ndef EF_minus_Ei(T, ND):\n    n = ND / 2 + np.sqrt((ND / 2)**2 + ni(T)**2)\n    return k * T * np.log(n / ni(T))\n\nT = np.linspace(200, 700, 501)\nfor ND in (1e14, 1e15, 1e16, 1e17):\n    plt.plot(T, EF_minus_Ei(T, ND), label=f\"N_D = {ND:.0e} cm^-3\")\n    Tint = T[np.argmin(abs(ni(T) - ND))]\n    print(f\"N_D = {ND:.0e}: E_F - E_i at 300 K = {EF_minus_Ei(300, ND):.3f} eV, \"\n          f\"n_i = N_D at about {Tint:.0f} K\")\nplt.xlabel(\"T (K)\"); plt.ylabel(\"E_F - E_i (eV)\"); plt.legend(); plt.grid()\nplt.show()\n\nslope = (EF_minus_Ei(300, 1e17) - EF_minus_Ei(300, 1e16))\nprint(f\"Shift per decade of doping at 300 K: {1000 * slope:.1f} mV\")\n```\n\n**Results** (output of the script):\n\n| N_D (cm⁻³) | E_F − E_i at 300 K (eV) | Temperature where n_i = N_D |\n|---|---|---|\n| 10¹⁴ | 0.238 | ≈ 470 K |\n| 10¹⁵ | 0.298 | ≈ 550 K |\n| 10¹⁶ | 0.357 | ≈ 650 K |\n| 10¹⁷ | 0.417 | above 700 K |\n\nShift per decade of doping at 300 K: 59.5 mV (= kT ln 10).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 225\" role=\"img\" aria-label=\"Fermi level above the intrinsic level against temperature for silicon doped with ten to the 14, 15, 16 and 17 donors per cubic centimetre; each falls towards zero at high temperature\" style=\"width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"196.0\" x2=\"484.0\" y2=\"196.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"70.0\" y1=\"196.0\" x2=\"70.0\" y2=\"32.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"494.0\" y=\"200.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">T (K)</text><text x=\"75.0\" y=\"28.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> (eV)</text><line x1=\"154.0\" y1=\"192.0\" x2=\"1
