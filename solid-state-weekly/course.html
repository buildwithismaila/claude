5 487.9,172.0 490.0,172.5\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"409.0\" y=\"142.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">N<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan> = 10<tspan dy=\"-0.45em\" font-size=\"72%\">17</tspan><tspan dy=\"0.45em\">​</tspan></text></svg><figcaption>Output of Practical 1: Fermi level against temperature for silicon. Each curve falls towards zero (mid-gap) once n<sub>i</sub> approaches N<sub>D</sub>.</figcaption></figure>\n```\n\n**Discussion points.** (1) Why does the curve flatten near zero at high T? (2) Why does heavier doping raise the maximum operating temperature? (3) What would change for germanium (E_g = 0.66 eV)? Germanium reaches n_i = 10¹⁵ cm⁻³ at only about 400 K, which is why Ge devices fail at modest temperatures.\n\n---\n\n## Practical 2 — I-V characterisation of a p-n junction and a Schottky diode\n\n**Aim.** Measure and plot the forward and reverse characteristics of a silicon p-n diode (e.g. 1N4148) and a Schottky diode (e.g. 1N5817 or BAT85); extract the saturation current, ideality factor and series resistance, and compare the two.\n\n**Theory (Weeks 10–12).** I = I_s[exp(qV/ηkT) − 1]. Above about 0.1 V, ln I = ln I_s + qV/(ηkT), so a semi-log plot is a straight line with slope q/(ηkT) and intercept ln I_s.\n\n**Apparatus.** DC supply (0–10 V) or source-measure unit, series resistor (1 kΩ for forward, none for reverse), two digital multimeters, breadboard, diodes.\n\n**Procedure.**\n\n1. Connect supply → resistor → diode (anode to +). Measure the diode voltage V and the current I (from the resistor voltage, or an ammeter).\n2. **Forward:** increase the supply so that V rises from 0 to 0.8 V (p-n) or 0 to 0.5 V (Schottky) in 0.05 V steps. Do not exceed the rated current.\n3. **Reverse:** reverse the diode, remove the resistor (or use 100 kΩ) and step V from 0 to −10 V, reading the small reverse current (μA range for Schottky, nA range for p-n).\n4. Plot I against V on linear axes, and ln I (or log₁₀ I) against V for the forward branch.\n\n**Example readings (forward):**\n\n| V (V) | I, p-n diode | I, Schottky diode |\n|---|---|---|\n| 0.15 | 0.003 μA | 0.016 mA |\n| 0.20 | 0.02 μA | 0.10 mA |\n| 0.25 | 0.13 μA | 0.63 mA |\n| 0.30 | 0.9 μA | 4.0 mA |\n| 0.35 | 5.7 μA | 25 mA |\n| 0.40 | 40 μA | (beyond rating) |\n| 0.50 | 1.7 mA | — |\n| 0.60 | 45 mA (bending: series resistance) | — |\n\n**Analysis.**\n\n- From the straight part of the p-n semi-log plot: between 0.3 V and 0.4 V, I rises from 0.9 μA to 40 μA, a factor of 44.4, so ln(44.4) = 3.79 per 0.1 V, slope = 37.9 V⁻¹. Then η = 1/(0.0259 × 37.9) = 1.02. Extrapolating to V = 0: I_s = 0.9 μA / e^{3.79×3} ≈ 1×10⁻¹¹ A.\n- Schottky diode: between 0.25 V and 0.35 V the current rises 40 times per 0.1 V, giving η ≈ 1.05 and I_s ≈ 0.1 mA / e^{0.20/0.0272} ≈ 6×10⁻⁸ A. It reaches a given current at about 0.25–0.3 V lower voltage than the p-n diode; I_s is several orders of magnitude larger, and the reverse current is much larger (μA instead of nA).\n- At high current the curves bend away from the straight line: the extra voltage is IR_s. R_s = ΔV/I where ΔV is the deviation from the extrapolated line.\n- Schottky barrier height: Φ_B = (kT/q) ln(A∗∗AT²/I_s), using the diode area A from the datasheet.\n\n**Discussion.** Explain the lower turn-on voltage and higher leakage of the Schottky diode in terms of majority-carrier thermionic emission over Φ_B versus minority-carrier diffusion (Weeks 10–11).\n\n---\n\n## Practical 3 — C-V profiling: doping and built-in potential\n\n**Aim.** Measure the capacitance of a reverse-biased one-sided junction (a varactor such as BB112, or a Schottky diode) against bias, and extract the doping concentration and the built-in potential.\n\n**Theory (Week 12).**\n\n    C = A √( qε_sN / 2(V_bi − V) )   ⇒   1/C² = 2(V_bi − V)/(qε_sNA²)\n\nThe plot of 1/C² against V is a straight line: the slope gives N, the voltage intercept gives V_bi.\n\n**Apparatus.** LCR meter with DC bias (1 MHz, 20–50 mV AC level), or a capacitance bridge; DC supply; shielded test fixture.\n\n**Procedure.**\n\n1. Null the fixture with the device removed (open-circuit correction) to remove stray capacitance.\n2. Connect the diode in reverse bias. Record C at V = 0, −1, −2, … −5 V (or the device's rated range).\n3. Plot C against V and 1/C² against V. Fit a straight line to 1/C².\n4. Take the area A from the datasheet (or measure the contact diameter).\n\n**Example readings** (A = 1.0×10⁻³ cm², Si):\n\n| V (V) | C (pF) | 1/C² (F⁻²) |\n|---|---|---|\n| 0 | 37.2 | 7.2×10²⁰ |\n| −1 | 22.8 | 1.92×10²¹ |\n| −2 | 17.9 | 3.12×10²¹ |\n| −3 | 15.2 | 4.33×10²¹ |\n| −4 | 13.4 | 5.57×10²¹ |\n| −5 | 12.2 | 6.72×10²¹ |\n\n**Analysis.**\n\n    Slope: (6.72×10²¹ − 7.2×10²⁰)/(−5 − 0) = −1.20×10²¹ F⁻²V⁻¹\n    N = 2/(qε_sA²|slope|) = 2/(1.602×10⁻¹⁹ × 1.036×10⁻¹² × 10⁻⁶ × 1.20×10²¹) = 1.0×10¹⁶ cm⁻³\n    Intercept: 1/C² = 0 at V = 7.2×10²⁰/1.20×10²¹ = +0.60 V  ⇒  V_bi = 0.60 V\n    Depletion depth at −5 V: W = ε_sA/C = 1.036×10⁻¹⁵/12.2×10⁻¹² = 0.85 μm\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 210\" role=\"img\" aria-label=\"1 over C squared against bias is a straight line whose slope gives the doping and whose voltage intercept gives the built-in potential\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"184.0\" x2=\"464.0\" y2=\"184.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"388.8\" y1=\"184.0\" x2=\"388.8\" y2=\"30.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"474.0\" y=\"188.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">V (V)</text><text x=\"393.8\" y=\"26.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">1/C²</text><line x1=\"99.0\" y1=\"180.0\" x2=\"99.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"99.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-5</text><line x1=\"157.0\" y1=\"180.0\" x2=\"157.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"157.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-4</text><line x1=\"214.9\" y1=\"180.0\" x2=\"214.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"214.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-3</text><line x1=\"272.9\" y1=\"180.0\" x2=\"272.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"272.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-2</text><line x1=\"330.9\" y1=\"180.0\" x2=\"330.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"330.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-1</text><line x1=\"446.8\" y1=\"180.0\" x2=\"446.8\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"446.8\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><polyline points=\"99.0,52.6 423.6,184.0\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"99.0\" cy=\"52.6\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"157.0\" cy=\"76.1\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"214.9\" cy=\"99.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"272.9\" cy=\"123.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"330.9\" cy=\"146.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"388.8\" cy=\"169.9\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"423.6\" cy=\"184.0\" r=\"3.6\" style=\"fill:var(--teal,#1C6E7E)\"/><text x=\"429.6\" y=\"176.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">V<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"259.7\" y=\"107.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">slope = −2/(qε<tspan dy=\"0.32em\" font-size=\"72%\">sNA</tspan><tspan dy=\"-0.32em\">​</tspan>²)</text><text x=\"81.6\" y=\"36.8\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">reverse bias</text></svg><figcaption>Mott–Schottky plot of the example readings. A straight line means uniform doping; curvature would reveal a doping profile N(W).</figcaption></figure>\n```\n\n**Discussion.** Why must the junction be one-sided? What would curvature in 1/C² tell you? Why measure in reverse bias only?\n\n---\n\n## Practical 4 — MOSFET parameter extraction: threshold voltage and channel mobility\n\n**Aim.** Measure the transfer and output characteristics of an n-channel enhancement MOSFET (e.g. a CD4007 array transistor or 2N7000) and extract V_th, μ_n and the transconductance.\n\n**Theory (Week 14).** In the linear region at small V_DS:\n\n    I_D ≈ μ_nC_ox(W/L)[(V_GS − V_T)V_DS − V_DS²/2]\n\nso I_D against V_GS is a straight line of slope g_m = μ_nC_ox(W/L)V_DS that meets I_D = 0 at V_GS = V_T + V_DS/2. In saturation, √I_D = √(μ_nC_oxW/2L)(V_GS − V_T).\n\n**Apparatus.** Two DC supplies (or a semiconductor parameter analyser), ammeter, voltmeters. C_ox, W and L from the datasheet or test structure.\n\n**Procedure.**\n\n1. **Transfer curve (linear):** set V_DS = 0.1 V. Step V_GS from 0 to 2.5 V in 0.25 V steps; record I_D.\n2. **Transfer curve (saturation):** set V_DS = V_GS (gate tied to drain) and repeat; plot √I_D against V_GS.\n3. **Output curves:** for V_GS = 1.0, 1.5, 2.0 V, sweep V_DS from 0 to 3 V; record I_D.\n4. Find V_T by linear extrapolation at the point of maximum slope; find μ_n from the slope.\n\n**Example readings** (linear region, V_DS = 0.1 V; device with C_ox = 3.45×10⁻⁷ F/cm², W/L = 10):\n\n| V_GS (V) | 0.5 | 1.0 | 1.5 | 2.0 | 2.5 |\n|---|---|---|---|---|---|\n| I_D (μA) | 15 | 84 | 153 | 222 | 291 |\n\n**Analysis.**\n\n    g_m = ΔI_D/ΔV_GS = (291 − 84) μA / 1.5 V = 1.38×10⁻⁴ S\n    Line through (1.0 V, 84 μA): I_D = 0 at V_GS = 1.0 − 84/138 = 0.39 V\n    V_T = 0.39 − V_DS/2 = 0.39 − 0.05 = 0.34 V\n    μ_n = g_m L / (W C_ox V_DS) = 1.38×10⁻⁴ / (10 × 3.45×10⁻⁷ × 0.1) = 400 cm²/V·s\n\nThe channel mobility (400) is about a third of bulk electron mobility in Si (1350) because of surface scattering at the Si/SiO₂ interface (Week 7). At high V_GS the measured slope falls further (mobility degradation by the vertical field), so the extraction uses the maximum-slope point.\n\n**Discussion.** Compare V_T from the linear and saturation methods. Why does mobility degrade at high gate voltage? How would a thicker oxide change V_T and g_m?\n\n---\n\n## Report format\n\nFor each practical: title and aim; brief theory with the equations used; circuit diagram; apparatus; procedure; tables of readings with units; graphs (labelled axes, units, fitted lines); calculations; results with uncertainties; discussion of sources of error (lead resistance, stray capacitance, self-heating, meter resolution); conclusion.\n", "group": "Revision & Practicals", "eyebrow": "Revision & Practicals", "disp": "·"}];

const sel  = document.getElementById("sel");
let cur = 0;

let lastGroup = null;
MODS.forEach((m,i)=>{
  if (m.group && m.group !== lastGroup && m.num !== "00") {
    const gl = document.createElement("li");
    gl.className = "seclabel grouplabel"; gl.textContent = m.group;
    list.appendChild(gl);
  }
  lastGroup = m.group;
  const li = document.createElement("li");
  const b  = document.createElement("button");
  b.innerHTML = '<span class="modnum">'+m.disp+'</span><span>'+m.title+'</span><span class="tick">&#10003;</span>';
  b.onclick = ()=>show(i);
  li.appendChild(b); list.appendChild(li);
  const o = document.createElement("option");
  o.value = i; o.textContent = (m.eyebrow && m.num !== "00" ? m.eyebrow : m.disp) + " · " + m.title;
  sel.appendChild(o);
});
sel.onchange = e => show(+e.target.value);

function show(i){
  cur = i;
  const m = MODS[i];
  document.getElementById("eyebrow").textContent =
    m.eyebrow + (m.group && m.eyebrow !== m.group ? "  ·  " + m.group : "");
  document.getElementById("doctitle").textContent = m.title;
  const doc = document.getElementById("doc");
  doc.innerHTML = mdToHtml(m.body);
  /* Only data tables get the scrolling wrapper. Matrices and piecewise cases
     use a table for layout; wrapping them adds the wrapper's bottom margin to
     the flex line, which pushed the brace and the determinant bars out of
     alignment with their own rows. */
  doc.querySelectorAll("table").forEach(t=>{
    if (t.closest(".cases, .mat")) return;
    const w = document.createElement("div");
    w.className = "tablewrap";
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });

  [...list.querySelectorAll("li:not(.grouplabel) button")].forEach((b,j)=>{
    b.setAttribute("aria-current", j===i ? "true" : "false");
    b.parentNode.classList.toggle("done", read.has(MODS[j].num));
  });
  sel.value = i;

  const rb = document.getElementById("readbtn");
  const isRead = read.has(m.num);
  rb.setAttribute("aria-pressed", isRead ? "true" : "false");
  rb.textContent = isRead ? "✓  Marked as read" : "Mark this module read";
  rb.onclick = ()=>{ read.has(m.num) ? read.delete(m.num) : read.add(m.num); save(); show(i); };

  const p = document.getElementById("prev"), n = document.getElementById("next");
  p.disabled = i===0; n.disabled = i===MODS.length-1;
  document.getElementById("prevt").textContent = i>0 ? MODS[i-1].title : "—";
  document.getElementById("nextt").textContent = i<MODS.length-1 ? MODS[i+1].title : "—";
  p.onclick = ()=>show(i-1); n.onclick = ()=>show(i+1);

  window.scrollTo(0,0);
}

document.addEventListener("keydown", e=>{
  if(e.target.tagName === "SELECT") return;
  if(e.key === "ArrowRight" && cur < MODS.length-1) show(cur+1);
  if(e.key === "ArrowLeft"  && cur > 0) show(cur-1);
});

show(0);
</script>
</body>
</html>
