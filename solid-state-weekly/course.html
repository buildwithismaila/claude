1=\"180.0\" x2=\"202.9\" y2=\"49.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"4 3\"/><text x=\"202.9\" y=\"43.6\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">R<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"202.9\" y1=\"100.9\" x2=\"245.7\" y2=\"100.9\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" opacity=\"1.0\"/><text x=\"249.7\" y=\"104.9\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">ΔR<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"60.0\" y1=\"164.3\" x2=\"460.0\" y2=\"164.3\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><text x=\"460.0\" y=\"159.3\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">N<tspan dy=\"0.32em\" font-size=\"72%\">B</tspan><tspan dy=\"-0.32em\">​</tspan></text><circle cx=\"291.1\" cy=\"164.3\" r=\"3.2\" style=\"fill:var(--teal,#1C6E7E)\"/><text x=\"291.1\" y=\"179.3\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">x<tspan dy=\"0.32em\" font-size=\"72%\">j</tspan><tspan dy=\"-0.32em\">​</tspan></text></svg><figcaption>An implanted profile peaks below the surface at the projected range R<sub>p</sub>, unlike a diffused profile, which always peaks at the surface.</figcaption></figure>\n```\n\n## Practical effects\n\n- **Lattice damage.** Each heavy ion displaces thousands of Si atoms. High doses turn the surface **amorphous**.\n- **Annealing** repairs damage and activates dopants: furnace anneal (900–1000 °C, 30 min) or **rapid thermal anneal** (RTA, ≈ 1000–1100 °C for a few seconds) which limits further diffusion. Laser and flash anneals use even shorter times.\n- **Channelling.** Ions entering along a low-index direction (e.g. ⟨110⟩) travel down open \"channels\" in the crystal and go much deeper than predicted. Prevented by **tilting the wafer about 7°**, rotating it, implanting through a thin screen oxide, or pre-amorphising the surface.\n- **Masking.** Photoresist, SiO₂, Si₃N₄ or polysilicon stops the ions where doping is not wanted. A thick enough mask is a few R_p + ΔR_p.\n- **Self-aligned gates.** In a MOSFET the polysilicon gate itself masks the channel while the source and drain are implanted, which aligns them to the gate automatically.\n\n## Part C: Evaluating the impurity distribution\n\nOnce a wafer has been doped, the process engineer must check that the dose, the profile and the junction depth are what was intended. The main methods:\n\n| Method | What it measures | How |\n|---|---|---|\n| Four-point probe | Sheet resistance R_s (Ω/□) | Current through the outer two of four collinear probes, voltage across the inner two |\n| Junction staining / groove-and-stain | Junction depth x_j | Bevel or groove the wafer, stain (e.g. HF + HNO₃ darkens p-type), measure under a microscope |\n| Spreading resistance profiling (SRP) | Carrier concentration against depth | Step two probes down a shallow bevel, measuring resistance at each point |\n| C-V profiling | Doping against depth | Capacitance of a junction or Schottky contact against reverse bias (Week 12) |\n| Secondary-ion mass spectrometry (SIMS) | Total atomic concentration against depth (active or not) | Sputter the surface with an ion beam and mass-analyse the ejected ions |\n| Hall measurement | Carrier type, concentration and mobility | Hall voltage in a magnetic field (Week 7) |\n\n### Sheet resistance\n\nFor a doped layer of thickness (junction depth) x_j:\n\n    R_s = ρ / x_j = 1 / ( q ∫₀^{x_j} μ(x) N(x) dx ) ≈ 1 / (q μ̄ Q)     [Ω/□]\n\nwhere Q is the dose of active dopant per cm². A resistor of length L and width W made from the layer has R = R_s (L/W): the resistance depends only on the number of \"squares\".\n\nFour-point probe on a large, thin sample (probe spacing s ≫ x_j):\n\n    R_s = (π / ln 2) · V/I = 4.532 · V/I\n\n**Example.** A boron predeposition gives V = 2.0 mV for I = 1.0 mA on a four-point probe. R_s = 4.532 × 2.0 = 9.06 Ω/□. If x_j = 1.0 μm, the average resistivity is ρ = R_s x_j = 9.06 × 10⁻⁴ = 9.1×10⁻⁴ Ω·cm, which (from Irvin's curves) corresponds to an average boron concentration of a few times 10¹⁹ cm⁻³.\n\n### Junction depth from the profile\n\nMeasured x_j and R_s are compared with theory:\n\n    erfc profile:     x_j = 2√(Dt) · erfc⁻¹(N_B/C_s)\n    Gaussian profile: x_j = 2√(Dt) · √(ln(C_s/N_B))\n    Implant:          x_j = R_p + ΔR_p √(2 ln(N_p/N_B))\n\n**Irvin's curves** relate surface concentration, background doping and the average conductivity (1/R_sx_j) of erfc and Gaussian layers, so a measured R_s and x_j give C_s.\n\n### Groove-and-stain junction depth\n\nA cylindrical groove of radius R is ground into the surface and stained. If the widths of the stained chord at the surface and at the junction are a and b:\n\n    x_j ≈ (a² − b²) / (8R)        (a, b ≪ R)\n\n---\n\n## Examination questions solved (Q14–Q21)\n\n### Q14. What is semiconductor doping? Explain why doping is necessary in semiconductor device fabrication.\n\n**Doping** is the intentional introduction of controlled, small quantities of specific impurity atoms into a pure (intrinsic) semiconductor to change its electrical properties. Group V donors (P, As, Sb) make silicon **n-type**; Group III acceptors (B, Al, Ga) make it **p-type**. Typical levels are 10¹⁴ to 10²⁰ cm⁻³.\n\n**Why it is necessary:**\n\n1. **Intrinsic conductivity is too low and uncontrolled.** Pure Si has only n_i ≈ 10¹⁰ cm⁻³ carriers, giving ρ = 1/(qn_i(μ_n + μ_p)) ≈ 3×10⁵ Ω·cm. Doping with 10¹⁶ cm⁻³ P raises n a million times, to ρ ≈ 0.5 Ω·cm.\n2. **It sets the carrier type.** Devices depend on regions where electrons or holes dominate. Without n- and p-type regions there can be no p-n junction, no diode, no BJT and no MOSFET.\n3. **Temperature stability.** In an extrinsic semiconductor the carrier density is fixed by N_D or N_A over a wide temperature range (the extrinsic region) instead of varying exponentially with T as n_i does.\n4. **Device design.** Doping profiles set the built-in potential, depletion width, breakdown voltage, threshold voltage of MOSFETs, current gain of BJTs, sheet resistance of resistors and the quality of Ohmic contacts (heavily doped n⁺, p⁺ regions).\n5. **Selective, local control.** Using masks, different areas of one chip can be given different doping, which is what makes integrated circuits possible.\n\n### Q15. Differentiate between n-type and p-type semiconductors.\n\n| Feature | n-type | p-type |\n|---|---|---|\n| Dopant added | Pentavalent (Group V): P, As, Sb | Trivalent (Group III): B, Al, Ga, In |\n| Name of dopant | Donor | Acceptor |\n| Effect of dopant | Donates a free electron to the conduction band | Accepts an electron, creating a hole in the valence band |\n| Fixed ion left behind | Positive donor ion N_D⁺ | Negative acceptor ion N_A⁻ |\n| Majority carriers | Electrons | Holes |\n| Minority carriers | Holes | Electrons |\n| Carrier densities | n ≈ N_D, p = n_i²/N_D | p ≈ N_A, n = n_i²/N_A |\n| Impurity level | E_D just below E_c | E_A just above E_v |\n| Fermi level | Above E_i, towards E_c | Below E_i, towards E_v |\n| Conductivity | σ ≈ qN_Dμ_n | σ ≈ qN_Aμ_p |\n| Hall coefficient | Negative | Positive |\n\nBoth remain electrically neutral overall: every free electron (or hole) is balanced by a fixed ion.\n\n### Q16. Explain the difference between donor impurities and acceptor impurities, giving suitable examples.\n\n**Donor impurities** have **one more** valence electron than the host atom they replace. In Si, Group V atoms such as **phosphorus, arsenic and antimony** have five valence electrons; four form covalent bonds with neighbouring Si atoms, and the fifth is bound only by about 0.04–0.05 eV. It is easily thermally released into the conduction band, leaving a positively charged, immobile donor ion. Donors introduce an energy level E_D just below the conduction band and make the material n-type.\n\n**Acceptor impurities** have **one fewer** valence electron than the host. In Si, Group III atoms such as **boron, aluminium, gallium and indium** have three valence electrons and leave one bond incomplete. A nearby valence electron moves in with very little energy (≈ 0.045 eV for B), so the acceptor becomes a negative ion and a mobile hole is created in the valence band. Acceptors introduce a level E_A just above the valence band and make the material p-type.\n\n| | Donor | Acceptor |\n|---|---|---|\n| Valence electrons (in Si) | 5 | 3 |\n| Gives / takes | Gives an electron | Takes an electron (gives a hole) |\n| Ionised charge | + | − |\n| Level | Near E_c | Near E_v |\n| Examples in Si | P, As, Sb | B, Al, Ga, In |\n| Examples in GaAs | S, Se, Te (on As site); Si on Ga site | Zn, Be, Mg (on Ga site); C on As site |\n\n### Q17. Describe the mechanism of dopant diffusion in a semiconductor.\n\nDiffusion is the net movement of dopant atoms from a region of high concentration to one of low concentration, driven by random thermal jumps of the atoms in the lattice. At room temperature it is negligible; at 900–1200 °C (silicon) it is significant.\n\n**Atomic mechanisms:**\n\n1. **Vacancy (substitutional) diffusion.** Substitutional dopants (B, P, As, Sb) occupy lattice sites. A dopant can jump only when an adjacent lattice site is vacant. The rate depends on the vacancy concentration (which rises steeply with temperature) and the jump probability. High activation energy (≈ 3–4 eV), so D is small (10⁻¹⁵ to 10⁻¹² cm²/s).\n2. **Interstitial diffusion.** Small atoms or those that do not bond into the lattice (Au, Cu, Fe, Na, Li, H) move between lattice sites through the open spaces of the diamond structure. Low activation energy (0.5–1.5 eV), so they diffuse many orders of magnitude faster. These are usually unwanted contaminants.\n3. **Interstitialcy (kick-out) and dissociative mechanisms.** A dopant is pushed off its site by a silicon self-interstitial, travels interstitially, then returns to a substitutional site. This explains enhanced diffusion of B and P during oxidation (oxidation-enhanced diffusion).\n\n**Temperature dependence.** D = D₀ exp(−E_a/kT), so D roughly doubles every 20–30 °C.\n\n**Macroscopic description.** The flux obeys Fick's first law F = −D ∂C/∂x, and the profile evolves by Fick's second law ∂C/∂t = D ∂²C/∂x². In practice a two-step process is used: predeposition from a constant surface source (erfc profile) followed by drive-in of the fixed dose (Gaussian profile). Diffusion is masked by SiO₂ windows, and the dopant spreads sideways under the mask edge by about 0.8 of its depth (lateral diffusion).\n\n### Q18. State and explain Fick's first and second laws of diffusion.\n\n**Fick's first law.** The diffusion flux is proportional to the negative of the concentration gradient:\n\n    F = −D ∂C/∂x\n\n- F: number of atoms crossing unit area per unit time (cm⁻²s⁻¹).\n- C(x, t): impurity concentration (cm⁻³).\n- D: diffusion coefficient (cm²/s), D = D₀exp(−E_a/kT).\n- The minus sign: atoms move from high to low concentration. If there is no gradient, there is no net flux.\n\nIt describes the flux at one instant but not how the profile changes.\n\n**Fick's second law.** Consider a thin slice of thickness dx. Atoms entering minus atoms leaving equals the increase stored (continuity, no generation or loss):\n\n    ∂C/∂t = −∂F/∂x\n\nSubstituting the first law (with D constant):\n\n    ∂C/∂t = D ∂²C/∂x²\n\nThis is the diffusion equation. It says the concentration rises where the profile is curved upward (concave) and falls where it is curved downward, so diffusion always smooths the profile. Its solutions, set by the boundary conditions, are the complementary-error-function profile (constant surface source) and the Gaussian profile (fixed dose) described in Part A above.\n\n### Q19. A semiconductor is doped by diffusion with a constant surface concentration of 1 × 10²⁰ cm⁻³. Explain how the impurity concentration varies with depth.\n\nA constant surface concentration is the **predeposition** (unlimited source) case. Solve Fick's second law with:\n\n- C(0, t) = C_s = 1×10²⁰ cm⁻³ (held fixed for all t)\n- C(∞, t) = 0 (deep in the wafer)\n- C(x, 0) = 0 (no dopant at the start)\n\nThe solution is the **complementary error function**:\n\n    C(x, t) = C_s erfc( x / 2√(Dt) ) = 1×10²⁰ · erfc( x / 2√(Dt) )   cm⁻³\n\n**How it varies with depth:**\n\n1. At the surface (x = 0), erfc(0) = 1, so C = 1×10²⁰ cm⁻³, independent of time.\n2. The concentration **decreases monotonically** with depth. Near the surface it falls almost linearly; deeper it falls faster than exponentially, because erfc(u) ≈ e^{−u²}/(u√π) for large u.\n3. The depth scale is the diffusion length 2√(Dt). At x = 2√(Dt), erfc(1) = 0.157, so C = 1.57×10¹⁹ cm⁻³. At x = 4√(Dt), erfc(2) = 4.7×10⁻³, so C = 4.7×10¹⁷ cm⁻³.\n4. As time increases, the profile penetrates deeper (as √t) while the surface stays at 10²⁰ cm⁻³, so the total dose grows: Q = (2/√π)C_s√(Dt).\n5. If the wafer has background doping N_B of the opposite type, a junction forms where C(x_j) = N_B.\n\n**Worked illustration** (assume boron into n-Si with N_B = 1×10¹⁶ cm⁻³, D = 1×10⁻¹³ cm²/s at about 1100 °C, t = 1 h = 3600 s):\n\n    √(Dt) = √(1×10⁻¹³ × 3600) = 1.90×10⁻⁵ cm = 0.190 μm\n    2√(Dt) = 0.379 μm\n\n    Junction: erfc(u) = N_B/C_s = 10¹⁶/10²⁰ = 10⁻⁴  ⇒  u ≈ 2.75\n    x_j = 2.75 × 0.379 μm ≈ 1.04 μm\n\n    Dose: Q = (2/√π)(1×10²⁰)(1.90×10⁻⁵) = 2.14×10¹⁵ atoms/cm²\n\n| Depth x (μm) | u = x/2√(Dt) | erfc(u) | C (cm⁻³) |\n|---|---|---|---|\n| 0 | 0 | 1 | 1.0×10²⁰ |\n| 0.19 | 0.5 | 0.480 | 4.8×10¹⁹ |\n| 0.38 | 1.0 | 0.157 | 1.6×10¹⁹ |\n| 0.57 | 1.5 | 0.034 | 3.4×10¹⁸ |\n| 0.76 | 2.0 | 4.7×10⁻³ | 4.7×10¹⁷ |\n| 1.04 | 2.75 | 1.0×10⁻⁴ | 1.0×10¹⁶ (junction) |\n\nSo the impurity concentration is highest at the surface and falls off as an erfc curve, reaching the background doping about 1 μm below the surface for these conditions.\n\n### Q20. Explain the principle of ion implantation and identify its major advantages over thermal diffusion.\n\n**Principle.** Ion implantation introduces dopant atoms into a semiconductor by bombarding it with a beam of energetic dopant ions. The dopant is ionised in an ion source, the ions are extracted, selected by mass in a magnetic analyser, accelerated to an energy of a few keV to MeV and scanned uniformly across the wafer. Each ion penetrates the crystal, losing energy by nuclear and electronic collisions, and stops at a depth that depends on its energy and mass. The resulting distribution is approximately Gaussian, peaking at the projected range R_p with straggle ΔR_p. The dose is measured exactly by integrating the beam current in a Faraday cup (Φ = It/qA). Because the impact damages the lattice and leaves dopants on non-lattice sites, the wafer is then annealed (furnace or RTA) to repair the damage and electrically activate the dopants.\n\n**Advantages over thermal diffusion:**\n\n1. **Precise, reproducible dose control** (±1 % or better) over a very wide range, 10¹¹ to 10¹⁶ cm⁻², by measuring charge. Diffusion dose depends on solid solubility, time and temperature and is much less accurate.\n2. **Independent control of depth and dose.** Depth is set by energy, dose by charge. In diffusion both depend on the same Dt product.\n3. **Low-temperature process.** Implantation is done near room temperature; only a short anneal is needed. Existing profiles are not disturbed and the thermal budget is small, which is vital for shallow junctions.\n4. **Wide choice of masks**, including photoresist, which diffusion cannot use.\n5. **Buried and retrograde profiles.** The peak can be placed below the surface (e.g. retrograde wells, buried layers); diffusion always peaks at the surface.\n6. **Very shallow junctions** with low-energy implants.\n7. **Less lateral spread** under the mask edge, allowing smaller devices and self-aligned structures.\n8. **Purity.** Mass separation guarantees only the chosen species is implanted.\n9. **Not limited by solid solubility**: concentrations above solubility can be obtained (though not all are activated).\n10. **Uniformity** across large wafers, and the process is clean (vacuum, dry).\n\n### Q21. Compare diffusion and ion implantation as semiconductor doping techniques.\n\n| Feature | Thermal diffusion | Ion implantation |\n|---|---|---|\n| Principle | Dopant moves in from a surface source by random thermal jumps (Fick's laws) | Energetic ions are driven into the crystal and stop by collisions |\n| Process temperature | High, 900–1200 °C | Room temperature, plus anneal (RTA ≈ 1000 °C for seconds) |\n| Profile shape | erfc or Gaussian, always maximum at the surface | Gaussian peaking at R_p below the surface; buried and retrograde profiles possible |\n| Dose control | Limited (± 5–10 %), set by solubility, T and t | Excellent (± 1 %), set by measured charge |\n| Depth control | Coupled to dose through Dt | Independent: set by energy |\n| Junction depth | Relatively deep; hard to make very shallow junctions | Very shallow junctions possible |\n| Lateral spread | Large (≈ 0.8 × depth) | Small (≈ straggle) |\n| Masking | SiO₂, Si₃N₄ (must survive high T) | Photoresist, oxide, nitride, polysilicon |\n| Lattice damage | None | Significant; needs annealing; amorphisation at high dose |\n| Channelling | Not applicable | Must be avoided (7° tilt, screen oxide) |\n| Throughput and cost | Batch of 100+ wafers, cheap equipment | Single wafer or small batch, expensive equipment |\n| Purity | Depends on source and furnace cleanliness | Mass-analysed, very pure |\n| Concentration limit | Limited by solid solubility | Can exceed solubility |\n| Typical use today | Drive-in, deep wells, solar cells, emitter diffusion in older processes | Source/drain, threshold-adjust, wells, LDD, channel stops in all modern CMOS |\n\n**Summary:** diffusion is simple, cheap and damage-free but gives coarse, coupled control of dose and depth and needs high temperature. Ion implantation gives precise, independent, low-temperature control of dose and depth and is the standard technique for modern VLSI, at the cost of expensive equipment and lattice damage that must be annealed. In practice the two are often combined: implant to set the dose, then a thermal drive-in to set the depth.\n", "group": "Module 1 · Material Physics & Semiconductor Growth", "eyebrow": "Week 3", "disp": "03"}, {"num": "04", "title": "Energy Bands and Carrier Concentrations", "body": "\n**Plan:** quantum-mechanics foundations (Schrödinger equation overview, Kronig–Penney model); energy band gaps, allowed and forbidden states; intrinsic and extrinsic carrier concentrations.\n\nWeek 1 stated that atoms in a solid form bands. This week shows why, using quantum mechanics, and then counts how many electrons and holes the bands hold.\n\n## Part A: Quantum-mechanics foundations\n\n## Why quantum mechanics\n\nThree results from early quantum theory are needed:\n\n- **Energy is quantised.** Electrons bound in atoms occupy discrete levels (Planck, Bohr). A photon has energy E = hν.\n- **Wave–particle duality.** An electron of momentum p behaves as a wave of wavelength λ = h/p (de Broglie). Write p = ħk, where k = 2π/λ is the wave vector.\n- **Uncertainty principle.** Δx·Δp ≥ ħ/2: an electron's position and momentum cannot both be exact, so we describe it by a probability wave ψ.\n\nConstants: h = 6.626×10⁻³⁴ J·s, ħ = h/2π = 1.055×10⁻³⁴ J·s, m₀ = 9.11×10⁻³¹ kg.\n\n## The Schrödinger equation\n\nThe time-independent equation in one dimension:\n\n    −(ħ²/2m) d²ψ/dx² + V(x) ψ = E ψ\n\nIn three dimensions, −(ħ²/2m)∇²ψ + Vψ = Eψ, or Ĥψ = Eψ.\n\n- ψ(x) is the **wave function**. |ψ(x)|² dx is the probability of finding the electron between x and x + dx.\n- The first term is the **kinetic energy** operator (p²/2m with p → −iħ d/dx).\n- V(x) is the **potential energy**: the crystal potential seen by the electron.\n- E is the **total energy**, an eigenvalue. Only certain E give acceptable solutions.\n\nConditions on ψ: finite, single-valued, continuous, with continuous dψ/dx where V is finite, and normalised (∫|ψ|²dx = 1).\n\n**Free electron** (V = 0): ψ = A e^{ikx}, E = ħ²k²/2m. A parabola: any energy is allowed.\n\n**Particle in a box** of width L (infinite walls): ψ = sin(nπx/L), E_n = n²π²ħ²/2mL². Confinement produces discrete levels, as in quantum wells.\n\n## From atoms to bands\n\nBring N identical atoms together. When far apart, each has the same discrete levels. As they approach, their outer wave functions overlap and, by the Pauli exclusion principle, each level must **split into N closely spaced levels**. With N ≈ 5×10²² cm⁻³, these form an almost continuous **band**.\n\nIn Si, the 3s and 3p levels (4 electrons per atom, 8 states) hybridise. At the actual spacing they split into a lower band with 4N states (the **valence band**, completely full at 0 K) and an upper band with 4N states (the **conduction band**, empty at 0 K), separated by the gap E_g = 1.12 eV.\n\n## Bloch's theorem\n\nIn a perfectly periodic potential V(x + a) = V(x), the solutions take the form\n\n    ψ_k(x) = u_k(x) e^{ikx},   with u_k(x + a) = u_k(x)\n\nA plane wave modulated by a function with the lattice period. An electron in a perfect crystal is therefore **not scattered** by the lattice itself; only departures from periodicity scatter it.\n\n## The Kronig–Penney model\n\nKronig and Penney replaced the real crystal potential by a 1-D periodic array of **rectangular barriers**: wells of width a with V = 0, separated by barriers of height V₀ and width b, period (a + b).\n\nThey solved Schrödinger's equation in each region, joined the solutions with continuity of ψ and dψ/dx, and applied Bloch's theorem. In the limit of thin, high barriers (b → 0, V₀ → ∞ with V₀b finite), the condition for a solution is:\n\n    P · sin(αa)/(αa) + cos(αa) = cos(ka)\n\n    α = √(2mE)/ħ,      P = m V₀ b a / ħ²\n\nP measures how strongly the electron is bound (barrier strength).\n\n**How bands appear.** The right side, cos(ka), can only lie between −1 and +1. The left side, as a function of energy (through α), oscillates with an amplitude that exceeds 1. Energies for which the left side lies between ±1 are **allowed** (bands). Energies for which it lies outside are **forbidden** (gaps).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 250\" role=\"img\" aria-label=\"Graph of the Kronig-Penney function against alpha a; energies where it lies between minus one and plus one form allowed bands\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><rect x=\"141.7\" y=\"141.6\" width=\"31.7\" height=\"45.2\" style=\"fill:var(--teal-soft,#E0EEF1)\"/><rect x=\"141.7\" y=\"208.0\" width=\"31.7\" height=\"5\" style=\"fill:var(--teal,#1C6E7E)\"/><rect x=\"230.2\" y=\"141.6\" width=\"56.3\" height=\"45.2\" style=\"fill:var(--teal-soft,#E0EEF1)\"/><rect x=\"230.2\" y=\"208.0\" width=\"56.3\" height=\"5\" style=\"fill:var(--teal,#1C6E7E)\"/><rect x=\"327.6\" y=\"141.6\" width=\"72.2\" height=\"45.2\" style=\"fill:var(--teal-soft,#E0EEF1)\"/><rect x=\"327.6\" y=\"208.0\" width=\"72.2\" height=\"5\" style=\"fill:var( t.\n- **Forbidden gap:** E_g = E_c − E_v. No electron states exist here in a perfect crystal; impurities and defects can add states inside it.\n\nE_g decreases slightly with temperature (Varshni relation, E_g(T) = E_g(0) − αT²/(T + β)): for Si, 1.17 eV at 0 K, 1.12 eV at 300 K.\n\n## Direct and indirect gaps\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"E-k diagrams: in GaAs the band extrema line up at k equals zero; in silicon the conduction-band minimum is displaced in k\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"165.0\" y1=\"204.0\" x2=\"165.0\" y2=\"36.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.4\"/><text x=\"284.0\" y=\"208.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">k</text><text x=\"170.0\" y=\"38.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">E</text><line x1=\"50.0\" y1=\"204.0\" x2=\"280.0\" y2=\"204.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><polyline points=\"50.0,197.3 51.4,195.8 52.9,194.4 54.3,193.0 55.8,191.6 57.2,190.2 58.6,188.9 60.1,187.6 61.5,186.2 62.9,184.9 64.4,183.7 65.8,182.4 67.2,181.2 68.7,179.9 70.1,178.7 71.6,177.5 73.0,176.4 74.4,175.2 75.9,174.1 77.3,172.9 78.8,171 83.7,77.3 485.1,77.8 486.6,78.3 488.0,78.9 489.4,79.4 490.9,80.0 492.3,80.7 493.8,81.3 495.2,82.0 496.6,82.7 498.1,83.4 499.5,84.1 500.9,84.9 502.4,85.7 503.8,86.5 505.2,87.3 506.7,88.1 508.1,88.9 509.6,89.8 511.0,90.6 512.4,91.5 513.9,92.4 515.3,93.2 516.8,94.1 518.2,94.9 519.6,95.8 521.1,96.6 522.5,97.5 523.9,98.3 525.4,99.1 526.8,99.9 528.2,100.6 529.7,101.4 531.1,102.1 532.6,102.8 534.0,103.5 535.4,104.1 536.9,104.7 538.3,105.2 539.8,105.7 541.2,106.2 542.6,106.6 544.1,107.0 545.5,107.3 546.9,107.5 548.4,107.7 549.8,107.8 551.2,107.8 552.7,107.8 554.1,107.7 555.6,107.5 557.0,107.2 558.4,106.8 559.9,106.3 561.3,105.8 562.8,105.1 564.2,104.3 565.6,103.4 567.1,102.4 568.5,101.3 569.9,100.1 571.4,98.7 572.8,97.2 574.2,95.6 575.7,93.8 577.1,91.8 578.6,89.8 580.0,87.5\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"551.2\" cy=\"107.8\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"465.0\" cy=\"139.1\" r=\"3.2\" style=\"fill:none;stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\"/><line x1=\"548.2\" y1=\"110.8\" x2=\"470.0\" y2=\"134.1\" style=\"stroke:currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\" marker-end=\"url(#ar)\"/><text x=\"517.3\" y=\"130.2\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">photon + phonon</text><text x=\"585.0\" y=\"91.7\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">CB</text><text x=\"585.0\" y=\"185.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">VB</text><text x=\"465.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:currentColor\" opacity=\".85\">Indirect gap (Si)</text></svg><figcaption>In a direct-gap material (GaAs) the conduction-band minimum and valence-band maximum are at the same k. In an indirect-gap material (Si) they are at different k, so a phonon must supply the momentum difference.</figcaption></figure>\n```\n\nA photon has very little momentum (k_photon ≈ 10⁵ cm⁻¹ compared with a zone-edge k ≈ 10⁸ cm⁻¹), so an optical transition is essentially vertical on the E–k diagram.\n\n- **Direct gap:** the transition is vertical and needs only a photon. Radiative recombination is fast (ns) and efficient. Strong absorption above E_g. GaAs, InP, GaN, InGaAs.\n- **Indirect gap:** the electron must also change momentum, which requires a **phonon** (lattice vibration) to be absorbed or emitted at the same time. This three-particle process is unlikely, so radiative recombination is slow and inefficient; energy is lost as heat through traps instead. Si, Ge, GaP, AlAs.\n\nThe emission wavelength of a band-to-band transition:\n\n    λ (μm) = 1.24 / E_g (eV)\n\nGaAs: 1.24/1.42 = 0.873 μm (near-infrared). Si: 1.24/1.12 = 1.11 μm, which is also why Si photodetectors stop responding above about 1.1 μm.\n\n## Part C: Intrinsic and extrinsic carrier concentrations\n\nThe electron concentration is the number of available states times the probability that each is filled. Week 5 develops both factors properly; here we use the results.\n\n## Equilibrium carrier concentrations\n\nUsing the Boltzmann approximation and integrating:\n\n    n₀ = N_c exp( −(E_c − E_F)/kT )\n    p₀ = N_v exp( −(E_F − E_v)/kT )\n\nwith the **effective densities of states**\n\n    N_c = 2 (2π m_n∗ kT / h²)^{3/2},     N_v = 2 (2π m_p∗ kT / h²)^{3/2}\n\nAt 300 K: Si N_c = 2.8×10¹⁹, N_v = 1.04×10¹⁹ cm⁻³; GaAs N_c = 4.7×10¹⁷, N_v = 7.0×10¹⁸ cm⁻³. Both scale as T^{3/2}.\n\nN_c is the number of states you would need at the single energy E_c to hold the same number of electrons as the whole band.\n\n## Intrinsic semiconductor\n\nIn a pure crystal every electron in the conduction band left a hole in the valence band, so n₀ = p₀ = n_i. The Fermi level in this case is the **intrinsic level E_i**, very close to mid-gap.\n\n    n_i = √(N_c N_v) exp( −E_g / 2kT )\n\n    E_i = (E_c + E_v)/2 + (3/4)kT ln( m_p∗ / m_n∗ )\n\nFor Si the shift of E_i from mid-gap is only about −0.01 eV.\n\nValues of n_i at 300 K: Si ≈ 1×10¹⁰ cm⁻³ (the accurate modern value is 9.65×10⁹; older texts use 1.5×10¹⁰), Ge 2.4×10¹³, GaAs 2.1×10⁶ cm⁻³.\n\nn_i rises very steeply with temperature, mainly through exp(−E_g/2kT). For Si it roughly doubles every 8 °C near room temperature.\n\n## The mass-action law\n\nMultiply n₀ and p₀:\n\n    n₀ p₀ = N_c N_v exp( −E_g/kT ) = n_i²\n\nThis holds in thermal equilibrium for **any** non-degenerate semiconductor, doped or not. Adding donors raises n and lowers p in proportion.\n\nEquivalent forms using E_i:\n\n    n₀ = n_i exp( (E_F − E_i)/kT ),     p₀ = n_i exp( (E_i − E_F)/kT )\n\n## Extrinsic semiconductor\n\n**Charge neutrality:** p₀ + N_D⁺ = n₀ + N_A⁻. With full ionisation and the mass-action law:\n\n    n₀ = (N_D − N_A)/2 + √( ((N_D − N_A)/2)² + n_i² )\n\nUsual approximations:\n\n- **n-type**, N_D ≫ n_i: n₀ ≈ N_D, p₀ = n_i²/N_D.\n- **p-type**, N_A ≫ n_i: p₀ ≈ N_A, n₀ = n_i²/N_A.\n- **Compensated**: use the net doping |N_D − N_A|.\n\n### Temperature regions (n-type)\n\n1. **Freeze-out** (low T, below about 100 K for Si): donors are not all ionised; n < N_D.\n2. **Extrinsic** (about 150–450 K for Si at 10¹⁵ cm⁻³): n ≈ N_D, constant. Devices operate here.\n3. **Intrinsic** (high T): n_i exceeds N_D and n ≈ n_i rises steeply; the device loses its doping-defined behaviour. Sets the upper operating temperature.\n\n---\n\n## Examination questions solved (Q22–Q29, Q34)\n\n### Q22. Explain the basic assumptions of the quantum mechanical model of electrons in a semiconductor.\n\n1. **Wave nature of electrons.** Each electron is described by a wave function ψ obeying the Schrödinger equation; |ψ|² gives the probability of finding it at a point. Energy and momentum (p = ħk) are related through the band structure E(k).\n2. **Adiabatic (Born–Oppenheimer) approximation.** The nuclei are much heavier than electrons and are treated as fixed at their lattice sites. Their vibrations (phonons) are added later as a perturbation that causes scattering.\n3. **Perfect periodic crystal.** The ion cores form an infinite, perfectly periodic lattice, so the potential energy is periodic, V(r + R) = V(r) for every lattice vector R. Surfaces, impurities and defects are treated separately.\n4. **One-electron (independent-electron) approximation.** Each electron moves independently in an average periodic potential produced by the ion cores and all the other electrons (mean-field or Hartree approximation), so a many-body problem becomes a single-particle one.\n5. **Bloch's theorem** follows: wave functions are modulated plane waves ψ = u_k(r)e^{ik·r}.\n6. **Pauli exclusion principle.** Each quantum state (k and spin) holds at most one electron, so the states fill from the bottom up. This, with the Fermi–Dirac distribution, gives the occupation of the bands.\n7. **Effective-mass approximation.** Near the band edges, electrons and holes respond to external forces as free particles with an effective mass m∗ that contains the effect of the crystal potential.\n8. **Thermal equilibrium statistics.** In equilibrium, electrons are distributed among the available states according to the Fermi–Dirac function.\n\n### Q23. State the time-independent Schrödinger equation and explain the physical meaning of its terms.\n\nIn one dimension:\n\n    −(ħ²/2m) d²ψ(x)/dx² + V(x) ψ(x) = E ψ(x)\n\nIn three dimensions: −(ħ²/2m)∇²ψ(r) + V(r)ψ(r) = Eψ(r), compactly Ĥψ = Eψ.\n\n**Meaning of each term:**\n\n- **ψ(x), the wave function**: the amplitude of the electron's probability wave. It has no direct physical meaning, but |ψ(x)|² dx is the probability of finding the electron between x and x + dx. ψ must be finite, single-valued, continuous and normalised.\n- **ħ = h/2π**, the reduced Planck constant (1.055×10⁻³⁴ J·s); **m**, the electron mass (or the effective mass m∗ in a crystal).\n- **−(ħ²/2m) d²ψ/dx²**: the **kinetic-energy** term. It comes from p²/2m with the momentum operator p = −iħ d/dx. The more sharply ψ curves, the higher the kinetic energy.\n- **V(x)ψ**: the **potential-energy** term. V(x) is the potential energy of the electron at x, e.g. the periodic potential of the crystal ions, a barrier, or a well.\n- **E**: the **total energy** of the electron, a constant (the equation is valid for stationary states whose energy does not change with time). Acceptable solutions exist only for particular values of E (eigenvalues), which is how quantisation arises.\n- The left-hand side as a whole is the **Hamiltonian operator** Ĥ acting on ψ.\n\nThe full time-dependent wave function is Ψ(x, t) = ψ(x)e^{−iEt/ħ}; the time-independent equation is obtained when V does not depend on time.\n\n### Q24. Explain the basic principle of the Kronig-Penney model and how it leads to the formation of energy bands.\n\n**Principle.** The real periodic potential of a crystal is complicated. Kronig and Penney (1931) replaced it with the simplest periodic potential that can be solved exactly: a one-dimensional infinite array of **rectangular potential wells and barriers**. Each well (V = 0, width a) represents the region near an ion; each barrier (height V₀, width b) represents the region between ions. The period is a + b.\n\n**Method.**\n\n1. Solve Schrödinger's equation separately in a well (oscillating solutions, α² = 2mE/ħ²) and in a barrier (exponential solutions, β² = 2m(V₀ − E)/ħ²).\n2. Apply continuity of ψ and dψ/dx at each boundary.\n3. Apply **Bloch's theorem**, ψ(x + (a + b)) = e^{ik(a+b)}ψ(x), because the potential is periodic.\n4. A non-trivial solution exists only if a determinant vanishes. Taking the limit of narrow, high barriers (b → 0, V₀ → ∞, with V₀b finite) gives:\n\n    P · sin(αa)/(αa) + cos(αa) = cos(ka),     P = mV₀ba/ħ²\n\n**How bands form.** The right-hand side, cos(ka), must lie between −1 and +1 for real k. Plot the left-hand side f(αa) against αa (i.e. against energy). It starts at 1 + P, oscillates like a damped cosine, and repeatedly rises above +1 and falls below −1. Only the energy ranges where −1 ≤ f(αa) ≤ +1 are solutions: these are the **allowed energy bands**. The ranges where |f| > 1 have no real k and therefore no electron states: these are the **forbidden energy gaps**.\n\n**Results:**\n\n- The spectrum consists of alternating allowed bands and forbidden gaps.\n- Discontinuities in E(k) occur at k = nπ/a (Brillouin-zone boundaries), where Bragg reflection of the electron wave occurs.\n- The width of allowed bands increases with energy (because the 1/αa factor damps the oscillation).\n- As P → ∞ (electrons tightly bound), bands shrink to discrete atomic levels. As P → 0 (free electrons), the gaps vanish and E = ħ²k²/2m.\n\nThe model explains in a simple way why solids have bands and gaps, which is the basis of the classification into metals, semiconductors and insulators.\n\n### Q25. Distinguish between valence band, conduction band, and forbidden energy gap.\n\n| | Valence band | Conduction band | Forbidden energy gap |\n|---|---|---|---|\n| What it is | The highest band that is completely filled with electrons at 0 K | The lowest band above the valence band, empty at 0 K | The energy range between E_v and E_c in which no electron states exist (in a perfect crystal) |\n| Edge | Top at E_v | Bottom at E_c | Width E_g = E_c − E_v |\n| Electrons | Bound in covalent bonds; cannot conduct while the band is full | Free; move through the crystal and conduct | None (only impurity or defect levels) |\n| Carriers | Holes (empty states) conduct here | Electrons conduct here | — |\n| Origin | Bonding combinations of the atomic sp³ orbitals | Antibonding combinations | Splitting of bonding and antibonding states |\n| Values | — | — | Si 1.12 eV, Ge 0.66 eV, GaAs 1.42 eV, SiO₂ ≈ 9 eV |\n\nAn electron needs at least E_g to jump from the valence to the conduction band; it then leaves a hole behind. The width of the gap decides whether a material is a metal (no gap), a semiconductor (small gap) or an insulator (large gap).\n\n### Q26. Explain the difference between a direct band-gap and an indirect band-gap semiconductor.\n\nOn the E–k diagram, look at where the **conduction-band minimum** and the **valence-band maximum** occur.\n\n| | Direct band gap | Indirect band gap |\n|---|---|---|\n| Band-edge positions | CB minimum and VB maximum at the **same k** (usually k = 0, the Γ point) | CB minimum at a **different k** from the VB maximum |\n| Transition across the gap | Vertical: an electron can drop and emit a photon directly, conserving momentum | Needs a change of momentum, which a photon cannot supply; a **phonon** must take part |\n| Process | Two-particle (electron + photon) | Three-particle (electron + photon + phonon), much less probable |\n| Radiative recombination | Fast, efficient; lifetime ≈ ns | Slow, inefficient; recombination is mostly non-radiative via traps; lifetime μs–ms |\n| Absorption near E_g | Sharp, strong (α ≈ 10⁴ cm⁻¹ just above E_g) | Weak, gradual; thicker material needed to absorb light |\n| Examples | GaAs (1.42 eV), InP, GaN, InGaAs, CdTe | Si (1.12 eV), Ge (0.66 eV), GaP, AlAs, SiC |\n| Applications | LEDs, laser diodes, efficient thin-film solar cells, fast photodetectors | ICs, transistors, power devices, Si solar cells and photodiodes (absorb but do not emit well) |\n\nThe emitted wavelength is λ = hc/E_g, i.e. λ(μm) = 1.24/E_g(eV). GaAs emits at 0.87 μm. Silicon's indirect gap is why there is no practical silicon laser.\n\n### Q27. What is meant by an intrinsic semiconductor? Derive the expression for intrinsic carrier concentration.\n\n**Intrinsic semiconductor.** A pure semiconductor crystal with no significant impurities or defects, in which free carriers are produced **only** by thermal excitation of electrons from the valence band to the conduction band. Each excited electron leaves a hole, so\n\n    n = p = n_i\n\nand the Fermi level lies at the intrinsic level E_i, very near the middle of the gap.\n\n**Derivation.**\n\n*Step 1: electrons.* The electron concentration is the density of states times the occupation probability, integrated over the conduction band:\n\n    n = ∫_{E_c}^{∞} g_c(E) f(E) dE,     g_c(E) = (4π(2m_n∗)^{3/2}/h³) √(E − E_c)\n\n*Step 2: Boltzmann approximation.* For E_c − E_F ≫ kT, f(E) ≈ exp(−(E − E_F)/kT). Then\n\n    n = (4π(2m_n∗)^{3/2}/h³) exp(−(E_c − E_F)/kT) ∫₀^{∞} √x · e^{−x/kT} dx,   x = E − E_c\n\n*Step 3: the integral.* ∫₀^{∞} x^{1/2} e^{−x/kT} dx = (kT)^{3/2} Γ(3/2) = (kT)^{3/2} (√π/2). Hence\n\n    n = N_c exp( −(E_c − E_F)/kT ),     N_c = 2(2πm_n∗kT/h²)^{3/2}\n\n*Step 4: holes.* Similarly, with 1 − f(E) ≈ exp(−(E_F − E)/kT) in the valence band,\n\n    p = N_v exp( −(E_F − E_v)/kT ),     N_v = 2(2πm_p∗kT/h²)^{3/2}\n\n*Step 5: the intrinsic condition.* Multiply n and p. E_F cancels:\n\n    n p = N_c N_v exp( −(E_c − E_v)/kT ) = N_c N_v exp( −E_g/kT )\n\nIn an intrinsic semiconductor n = p = n_i, so n·p = n_i², and\n\n    n_i = √(N_c N_v) · exp( −E_g / 2kT )\n\nSubstituting N_c and N_v gives the explicit temperature dependence:\n\n    n_i = 2 (2πkT/h²)^{3/2} (m_n∗ m_p∗)^{3/4} exp( −E_g / 2kT )   ∝ T^{3/2} e^{−E_g/2kT}\n\n*Step 6: the intrinsic Fermi level.* Setting n = p and solving:\n\n    E_i = (E_c + E_v)/2 + (kT/2) ln(N_v/N_c) = (E_c + E_v)/2 + (3kT/4) ln(m_p∗/m_n∗)\n\n**Numerical check for Si at 300 K:** √(2.8×10¹⁹ × 1.04×10¹⁹) = 1.71×10¹⁹; exp(−1.12/(2 × 0.0259)) = exp(−21.6) = 4.1×10⁻¹⁰; n_i ≈ 7×10⁹ cm⁻³, the same order as the accepted 1×10¹⁰ cm⁻³ (the difference comes from the exact values of E_g and the effective masses).\n\n### Q28. Explain the difference between intrinsic and extrinsic carrier concentrations.\n\n| | Intrinsic carrier concentration | Extrinsic carrier concentration |\n|---|---|---|\n| Material | Pure (undoped) semiconductor | Doped semiconductor |\n| Source of carriers | Thermal breaking of covalent bonds only (band-to-band excitation) | Mainly ionised dopants (donors or acceptors), plus a small thermal contribution |\n| Electron vs hole | n = p = n_i | Unequal: n ≫ p (n-type) or p ≫ n (p-type); majority and minority carriers |\n| Formula | n_i = √(N_cN_v) exp(−E_g/2kT) | n ≈ N_D, p = n_i²/N_D (n-type); p ≈ N_A, n = n_i²/N_A (p-type) |\n| Typical value (Si, 300 K) | 1×10¹⁰ cm⁻³ | 10¹⁴–10²⁰ cm⁻³ majority |\n| Temperature dependence | Very strong, exponential | Nearly constant over the extrinsic range; becomes intrinsic at high T |\n| Controlled by | Material (E_g) and temperature | Doping level, chosen by the designer |\n| Fermi level | At E_i, near mid-gap | Shifted toward E_c (n-type) or E_v (p-type) |\n| Conductivity | Low (σ ≈ 3×10⁻⁶ S/cm for Si) | Much higher, set by doping |\n\nThe two are linked by the mass-action law **np = n_i²**: doping increases one carrier type and decreases the other so that their product equals the intrinsic value squared.\n\n### Q29. Silicon has an intrinsic carrier concentration of approximately 1.0 × 10¹⁰ cm⁻³ at a specified temperature. If the electron and hole concentrations are equal, determine the electron and hole concentrations.\n\nIf n = p, the semiconductor is intrinsic (undoped, or exactly compensated). From the mass-action law:\n\n    n · p = n_i²   and   n = p   ⇒   n² = n_i²   ⇒   n = n_i\n\n**n = p = n_i = 1.0×10¹⁰ cm⁻³**\n\nCheck: n·p = (1.0×10¹⁰)² = 1.0×10²⁰ cm⁻⁶ = n_i². ✓\n\nAt this concentration, using μ_n = 1350 and μ_p = 480 cm²/V·s, the intrinsic conductivity would be σ = qn_i(μ_n + μ_p) = 1.602×10⁻¹⁹ × 10¹⁰ × 1830 = 2.9×10⁻⁶ S/cm, i.e. ρ ≈ 3.4×10⁵ Ω·cm.\n\n### Q34. An n-type semiconductor has a donor concentration of 5 × 10¹⁶ cm⁻³. Assuming complete ionization, determine the approximate majority-carrier concentration.\n\nWith complete ionisation and N_D ≫ n_i (5×10¹⁶ ≫ 10¹⁰), every donor contributes one electron:\n\n    n₀ ≈ N_D = 5 × 10¹⁶ cm⁻³\n\n**Majority-carrier (electron) concentration ≈ 5×10¹⁶ cm⁻³.**\n\nAdditional results (assuming silicon at 300 K, n_i = 1×10¹⁰ cm⁻³):\n\n    Minority holes:  p₀ = n_i²/n₀ = (10¹⁰)² / (5×10¹⁶) = 2×10³ cm⁻³\n\n    Fermi level:  E_F − E_i = kT ln(n₀/n_i) = 0.0259 × ln(5×10⁶) = 0.0259 × 15.42 = 0.40 eV above E_i\n\n    Conductivity:  σ ≈ q n₀ μ_n = 1.602×10⁻¹⁹ × 5×10¹⁶ × 1350 ≈ 10.8 S/cm  (ρ ≈ 0.093 Ω·cm)\n\nThe thermal contribution n_i is negligible, which is why the majority-carrier density is simply the donor density. (Mobility falls at this doping to about 1000 cm²/V·s, so the real σ is nearer 8 S/cm.)\n", "group": "Module 2 · Energy Bands & Carrier Statistics", "eyebrow": "Week 4", "disp": "04"}, {"num": "05", "title": "Carrier Statistics", "body": "\n**Plan:** the Fermi–Dirac distribution function; density of states; Fermi energy level calculation as a function of temperature and doping.\n\nTo find how many electrons and holes there are, multiply **how many states exist** at each energy (density of states) by **the probability each is occupied** (Fermi–Dirac function), and integrate over the band:\n\n    n = ∫ g_c(E) f(E) dE      (over the conduction band)\n    p = ∫ g_v(E) [1 − f(E)] dE   (over the valence band)\n\n## The Fermi–Dirac distribution\n\nElectrons obey the Pauli principle, so the probability that a state at energy E is occupied in thermal equilibrium is:\n\n    f(E) = 1 / ( 1 + exp((E − E_F)/kT) )\n\n- **E_F, the Fermi level**: the energy at which the occupation probability is exactly ½.\n- The probability that a state is **empty** (holds a hole) is 1 − f(E).\n- k = 8.617×10⁻⁵ eV/K; kT = 0.0259 eV at 300 K.\n\n**At T = 0 K**, f(E) is a **step**: f = 1 for E < E_F, f = 0 for E > E_F. All states below E_F are filled, all above are empty.\n\n**At T > 0**, the step is rounded over a width of a few kT around E_F. Some electrons just below E_F move to states just above it. f(E_F) = ½ at every temperature.\n\n**Boltzmann approximation.** When E − E_F > 3kT, exp(...) ≫ 1 and\n\n    f(E) ≈ exp( −(E − E_F)/kT )\n\nThe error is under 5 % (at E − E_F = 3kT, f = 1/(1 + e³) = 0.0474 versus e⁻³ = 0.0498). Semiconductors in which E_F stays more than 3kT from both band edges are called **non-degenerate**, and this approximation makes the integrals easy.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 215\" role=\"img\" aria-label=\"Fermi-Dirac function: a step at zero kelvin, smoothed over a few kT at 300 K and 900 K, always one half at the Fermi level\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"60.0\" y1=\"188.0\" x2=\"454.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"260.0\" y1=\"188.0\" x2=\"260.0\" y2=\"34.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"464.0\" y=\"192.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">E − E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> (eV)</text><text x=\"265.0\" y=\"30.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">f(E)</text><line x1=\"126.7\" y1=\"184.0\" x2=\"126.7\" y2=\"192.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"126.7\" y=\"203.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-0.2</text><line x1=\"193.3\" y1=\"184.0\" 2em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text></svg><figcaption>The Fermi–Dirac function at 0 K (a step) and at higher temperatures (smeared over a few kT). It always passes through ½ at E<sub>F</sub>.</figcaption></figure>\n```\n\n## Density of states\n\nThe **density of states** g(E) is the number of allowed electron states per unit energy per unit volume (cm⁻³eV⁻¹). For parabolic bands with effective masses m_n∗ and m_p∗:\n\n    g_c(E) = (4π (2m_n∗)^{3/2} / h³) √(E − E_c)     for E ≥ E_c\n    g_v(E) = (4π (2m_p∗)^{3/2} / h³) √(E_v − E)     for E ≤ E_v\n\nIt is zero inside the gap and grows as the square root of the energy measured into each band.\n\n**Origin (sketch).** In a cube of side L, the allowed wave vectors form a grid with one point per (2π/L)³ of k-space. Counting points in a spherical shell of radius k, including two spin states, and using E − E_c = ħ²k²/2m_n∗, gives the √(E − E_c) form.\n\n## Position of the Fermi level\n\n    n-type:  E_c − E_F = kT ln(N_c / N_D),    E_F − E_i = kT ln(N_D / n_i)\n    p-type:  E_F − E_v = kT ln(N_v / N_A),    E_i − E_F = kT ln(N_A / n_i)\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 210\" role=\"img\" aria-label=\"Band diagrams showing the Fermi level at mid-gap for intrinsic material, near the conduction band for n-type and near the valence band for p-type\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWid \"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"586.0\" y=\"106.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.75\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"435.0\" y=\"159.6\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"325.0\" y=\"200.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> = kT ln(N<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan>/n<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan>)  for n-type;   E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> = kT ln(N<tspan dy=\"0.32em\" font-size=\"72%\">A</tspan><tspan dy=\"-0.32em\">​</tspan>/n<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan>)  for p-type</text></svg><figcaption>The Fermi level moves towards the conduction band with donor doping and towards the valence band with acceptor doping. Each factor of 10 in doping shifts it by kT ln10 = 60 mV at 300 K.</figcaption></figure>\n```\n\n- The heavier the doping, the closer E_F gets to the band edge. When it comes within about 3kT of the edge (above about 10¹⁸–10¹⁹ cm⁻³ in Si) the semiconductor is **degenerate** and behaves almost like a metal.\n- As temperature rises, n_i grows and E_F moves back towards E_i.\n- **In equilibrium E_F is constant throughout any system**, including across junctions. This single fact sets up the built-in voltage of a p-n junction (Week 10).\n\n## Fermi level against temperature\n\nThe Fermi level depends on temperature through n_i(T) and through the ionisation of dopants.\n\n    n_i(T) = √(N_c N_v) e^{−E_g/2kT},   with N_c, N_v ∝ T^{3/2}\n\nFor n-type material with complete ionisation, solve charge neutrality exactly:\n\n    n = N_D/2 + √( (N_D/2)² + n_i² ),     E_F − E_i = kT ln(n/n_i)\n\n| Region | Condition | n | E_F |\n|---|---|---|---|\n| Freeze-out (low T) | kT ≪ E_c − E_D | n < N_D, donors not ionised | Between E_D and E_c |\n| Extrinsic (normal operation) | n_i ≪ N_D | n ≈ N_D | E_F − E_i = kT ln(N_D/n_i), slowly falling with T |\n| Intrinsic (high T) | n_i ≥ N_D | n ≈ n_i | E_F → E_i (mid-gap) |\n\n### Worked example: Fermi level against temperature\n\nSi with N_D = 10¹⁵ cm⁻³. Here n_i(T) is calculated from n_i ∝ T^{3/2}e^{−E_g(T)/2kT}, with the band gap shrinking slightly with temperature (E_g = 1.12 eV at 300 K, 1.03 eV at 600 K) and scaled to n_i = 1×10¹⁰ cm⁻³ at 300 K.\n\n| T (K) | kT (eV) | n_i (cm⁻³) | n (cm⁻³) | E_F − E_i = kT ln(n/n_i) (eV) |\n|---|---|---|---|---|\n| 300 | 0.0259 | 1.0×10¹⁰ | 1.00×10¹⁵ | 0.0259 × ln(1.0×10⁵) = 0.298 |\n| 400 | 0.0345 | 5.3×10¹² | 1.00×10¹⁵ | 0.0345 × ln(189) = 0.181 |\n| 500 | 0.0431 | 2.6×10¹⁴ | 1.06×10¹⁵ | 0.0431 × ln(4.16) = 0.061 |\n| 600 | 0.0517 | 3.7×10¹⁵ | 4.18×10¹⁵ | 0.0517 × ln(1.15) = 0.007 |\n\nAs T rises, E_F moves back towards mid-gap. Above about 550 K, n_i exceeds N_D and the material is effectively intrinsic: the doping no longer controls it. The Laboratory page simulates this curve in Python (Practical 1).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 225\" role=\"img\" aria-label=\"Fermi level above the intrinsic level against temperature for silicon doped with ten to the 14, 15, 16 and 17 donors per cubic centimetre; each falls towards zero at high temperature\" style=\"width:560px;max-width:100%;height:auto;display:block;marg .4 469.0,166.9 471.1,167.5 473.2,168.1 475.3,168.7 477.4,169.2 479.5,169.8 481.6,170.3 483.7,170.9 485.8,171.5 487.9,172.0 490.0,172.5\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"409.0\" y=\"142.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">N<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan> = 10<tspan dy=\"-0.45em\" font-size=\"72%\">17</tspan><tspan dy=\"0.45em\">​</tspan></text></svg><figcaption>Fermi level relative to E<sub>i</sub> against temperature for silicon at four donor concentrations (cm⁻³). Heavier doping keeps the Fermi level away from mid-gap up to a higher temperature.</figcaption></figure>\n```\n\n### Worked example: Fermi level against doping\n\nSi at 300 K. Find E_F for (a) N_D = 10¹⁷ cm⁻³ and (b) N_A = 5×10¹⁵ cm⁻³, relative to E_i and to the nearest band edge (N_c = 2.8×10¹⁹, N_v = 1.04×10¹⁹ cm⁻³).\n\n    (a) E_F − E_i = 0.0259 ln(10¹⁷/10¹⁰) = 0.0259 × 16.12 = 0.417 eV\n        E_c − E_F = 0.0259 ln(2.8×10¹⁹/10¹⁷) = 0.0259 × 5.63 = 0.146 eV\n\n    (b) E_i − E_F = 0.0259 ln(5×10¹⁵/10¹⁰) = 0.0259 × 13.12 = 0.340 eV\n        E_F − E_v = 0.0259 ln(1.04×10¹⁹/5×10¹⁵) = 0.0259 × 7.64 = 0.198 eV\n\nCheck (a): 0.417 + 0.146 = 0.563 eV ≈ E_g/2 = 0.56 eV. ✓\n\n---\n\n## Examination questions solved (Q30–Q33)\n\n### Q30. Explain the Fermi-Dirac distribution function and its significance in semiconductor physics.\n\n**The function.** Electrons are indistinguishable particles of half-integer spin that obey the Pauli exclusion principle (fermions). In thermal equilibrium at temperature T, the probability that an available state of energy E is occupied by an electron is given by Fermi–Dirac statistics:\n\n    f(E) = 1 / ( 1 + exp((E − E_F)/kT) )\n\nwhere E_F is the Fermi level and k is Boltzmann's constant.\n\n**Properties:**\n\n- 0 ≤ f(E) ≤ 1 (at most one electron per state).\n- f(E_F) = ½ at any temperature: E_F is the energy with a 50 % chance of occupation.\n- f is symmetric about E_F: the probability that a state ΔE above E_F is occupied equals the probability that a state ΔE below E_F is empty, so 1 − f(E_F + ΔE) = f(E_F − ΔE).\n- The transition from 1 to 0 happens over a few kT (about 0.1 eV at 300 K).\n- For E − E_F > 3kT it reduces to the Boltzmann factor exp(−(E − E_F)/kT).\n\n**Significance:**\n\n1. **Gives the carrier concentrations.** n = ∫g_c f dE and p = ∫g_v(1 − f)dE. Without f(E) we could not calculate n, p or n_i.\n2. **Defines the Fermi level**, the single most useful quantity in device physics. Its position relative to E_c and E_v tells immediately whether the material is n-type, p-type or intrinsic and how heavily doped.\n3. **Constant Fermi level in equilibrium.** E_F is flat across any system in equilibrium; this determines band bending and built-in potential in p-n junctions, Schottky contacts and MOS structures.\n4. **Explains temperature dependence** of carrier concentration, intrinsic behaviour, freeze-out and degeneracy.\n5. **Out of equilibrium**, the concept is extended to quasi-Fermi levels E_Fn and E_Fp, which are used to describe biased devices.\n\n### Q31. Write the Fermi-Dirac distribution equation and explain what happens to the distribution at absolute zero.\n\n    f(E) = 1 / ( 1 + e^{(E − E_F)/kT} )\n\n**At T = 0 K**, kT → 0, so the exponent (E − E_F)/kT → ±∞:\n\n- For **E < E_F**: (E − E_F)/kT → −∞, e^{−∞} = 0, so **f(E) = 1/(1 + 0) = 1**. Every state below E_F is certainly filled.\n- For **E > E_F**: (E − E_F)/kT → +∞, e^{+∞} → ∞, so **f(E) = 0**. Every state above E_F is certainly empty.\n\nThe distribution becomes a **sharp rectangular step** at E = E_F. The Fermi level is then the boundary between completely filled and completely empty states: the highest occupied energy at 0 K.\n\nFor a semiconductor this means the valence band is completely full and the conduction band completely empty at 0 K. There are no free carriers, and **a pure semiconductor is a perfect insulator at absolute zero**.\n\n**As T increases**, the step softens over a range of about ±3kT: some states just below E_F become empty and some just above become filled. This tail reaching into the conduction band is what produces free electrons at room temperature. At E = E_F, f = ½ always. (See the Fermi–Dirac figure above.)\n\n| E − E_F | f at 0 K | f at 300 K (kT = 0.0259 eV) |\n|---|---|---|\n| −0.1 eV | 1 | 0.979 |\n| 0 | ½ (undefined step) | 0.500 |\n| +0.1 eV | 0 | 0.021 |\n| +0.3 eV | 0 | 9.3×10⁻⁶ |\n\n### Q32. Define the density of states in a semiconductor and explain its importance in determining carrier concentration.\n\n**Definition.** The density of states g(E) is the number of allowed electron energy states (including both spins) per unit energy interval per unit volume of the crystal, at energy E. Unit: cm⁻³eV⁻¹ (or m⁻³J⁻¹).\n\nFor the conduction and valence bands (parabolic band approximation):\n\n    g_c(E) = (4π (2m_n∗)^{3/2} / h³) √(E − E_c),    E ≥ E_c\n    g_v(E) = (4π (2m_p∗)^{3/2} / h³) √(E_v − E),    E ≤ E_v\n    g(E) = 0  inside the gap\n\n**Physical origin.** In a crystal of volume V, the allowed wave vectors k are quantised, each occupying (2π)³/V of k-space. The number of states with energy up to E is the volume of the sphere of radius k divided by that, times 2 for spin. Differentiating with respect to E, using E − E_c = ħ²k²/2m∗, gives the square-root law. The effective mass enters because it describes the band's curvature: heavier mass means more states per unit energy.\n\n**Importance in determining carrier concentration:**\n\n1. The carrier concentration is the product of **available states** and **probability of occupation**: n = ∫g_c(E)f(E)dE, p = ∫g_v(E)[1 − f(E)]dE. The Fermi function alone says nothing about how many electrons there are; g(E) supplies the number of places they can go.\n2. It produces the **effective densities of states** N_c and N_v, which appear in every carrier-concentration formula (n = N_c e^{−(E_c−E_F)/kT}).\n3. Because g(E) is zero in the gap, no carriers exist there even though f(E) is non-zero, which explains why the gap is \"forbidden\".\n4. It explains differences between materials. GaAs has a small m_n∗ (0.067m₀), so its N_c (4.7×10¹⁷ cm⁻³) is 60 times smaller than Si's; for the same doping its Fermi level sits much closer to E_c and it becomes degenerate at lower doping.\n5. It sets the T^{3/2} factor in N_c, N_v and n_i, and determines where the Fermi level lies relative to mid-gap (E_i shifts by (3/4)kT ln(m_p∗/m_n∗)).\n6. It also governs optical absorption and the density of electrons available for tunnelling and contact behaviour.\n\n### Q33. Explain how the Fermi energy level changes with doping in n-type and p-type semiconductors.\n\nIn an intrinsic semiconductor E_F = E_i, near mid-gap. Doping shifts it so that the carrier concentrations satisfy n = n_i e^{(E_F − E_i)/kT} and p = n_i e^{(E_i − E_F)/kT}.\n\n**n-type (donor doping N_D).** n ≈ N_D > n_i, so E_F moves **up, towards E_c**:\n\n    E_F − E_i = kT ln(N_D/n_i),     E_c − E_F = kT ln(N_c/N_D)\n\n**p-type (acceptor doping N_A).** p ≈ N_A > n_i, so E_F moves **down, towards E_v**:\n\n    E_i − E_F = kT ln(N_A/n_i),     E_F − E_v = kT ln(N_v/N_A)\n\n**Behaviour:**\n\n1. The shift is **logarithmic**: each tenfold increase in doping moves E_F by kT ln10 ≈ 0.06 eV at 300 K.\n2. **Heavier doping → closer to the band edge.** At very high doping (≈ N_c or N_v) E_F reaches or enters the band and the semiconductor becomes **degenerate** (n⁺, p⁺).\n3. **Compensation** (both N_D and N_A) shifts E_F according to the net doping N_D − N_A.\n4. **Temperature:** as T rises, n_i increases and E_F moves back toward E_i; at high enough T every semiconductor becomes intrinsic. At very low T (freeze-out) E_F rises above E_D in n-type material.\n5. In equilibrium the Fermi level must be the same everywhere; when n and p regions meet, bands bend to keep E_F flat.\n\n**Example (Si, 300 K, n_i = 10¹⁰ cm⁻³):**\n\n| Doping | E_F position |\n|---|---|\n| Intrinsic | E_F = E_i |\n| N_D = 10¹⁵ cm⁻³ | E_F − E_i = 0.0259 ln(10⁵) = 0.298 eV |\n| N_D = 10¹⁷ cm⁻³ | E_F − E_i = 0.0259 ln(10⁷) = 0.417 eV |\n| N_A = 10¹⁶ cm⁻³ | E_i − E_F = 0.0259 ln(10⁶) = 0.358 eV |\n\n(See the Fermi-level figure above.)\n", "group": "Module 2 · Energy Bands & Carrier Statistics", "eyebrow": "Week 5", "disp": "05"}, {"num": "06", "title": "Continuous Assessment Test 1 and Review", "body": "\n**Plan:** mid-module evaluation of crystal structures and carrier statistics (Weeks 1–5).\n\nThis page has a one-screen review of what CAT 1 covers, followed by a practice test with full solutions. The questions are written in the style of the lecturer's revision questions and the PGD exam paper. They are practice questions, not the actual CAT.\n\n## Review: what you must be able to do\n\n**Crystals (Week 1)**\n\n- Define lattice, basis, unit cell, lattice constant, coordination number, APF.\n- State the structures: Si and Ge diamond cubic, GaAs zinc blende; 8 atoms per cell; 4 nearest neighbours.\n- Find Miller indices from intercepts (intercepts → reciprocals → clear fractions); handle ∞ (index 0) and negative intercepts (bar).\n- Use d_{hkl} = a/√(h² + k² + l²).\n\n**Materials and bonding (Week 1)**\n\n- Compare conductors, semiconductors and insulators; Si, Ge and GaAs.\n- Explain covalent bonding, electron–hole pairs, n-type and p-type doping.\n\n**Bands and statistics (Weeks 4–5)**\n\n- Schrödinger equation terms; Kronig–Penney: allowed bands where |P sin(αa)/αa + cos αa| ≤ 1.\n- Direct and indirect gaps; λ(μm) = 1.24/E_g(eV).\n- f(E) = 1/(1 + e^{(E−E_F)/kT}); at 0 K a step; Boltzmann approximation for E − E_F > 3kT.\n- n = N_c e^{−(E_c−E_F)/kT}, p = N_v e^{−(E_F−E_v)/kT}, n_i = √(N_cN_v)e^{−E_g/2kT}, np = n_i².\n- Charge neutrality and compensation; E_F − E_i = kT ln(n/n_i).\n\n## Practice test (60 minutes)\n\nUse q = 1.6×10⁻¹⁹ C, kT = 0.0259 eV at 300 K, Si: n_i = 1×10¹⁰ cm⁻³, N_c = 2.8×10¹⁹ cm⁻³, μ_n = 1350, μ_p = 480 cm²/V·s; Ge: n_i = 2.4×10¹³ cm⁻³, μ_n = 3900, μ_p = 1900 cm²/V·s.\n\n1. Silicon has lattice constant 5.43 Å. Calculate (a) the number of atoms per cm³ and (b) the nearest-neighbour distance.\n2. Find the Miller indices of planes with intercepts (a) 3a, 2b, c and (b) a, −b, ∞. For (a), find the interplanar spacing in Si.\n3. Show that the atomic packing factor of the diamond structure is 0.34.\n4. State three differences between direct and indirect band-gap semiconductors and give the emission wavelength of GaAs.\n5. Find the probability that a state (a) 0.1 eV above E_F and (b) kT above E_F is occupied at 300 K.\n6. At what temperature is there a 10⁻⁴ probability that a state 0.30 eV above E_F is occupied?\n7. In a Si sample at 300 K the Fermi level is 0.25 eV below E_c. Find n and p. Is it n- or p-type?\n8. Si is doped with N_A = 1×10¹⁶ cm⁻³ and N_D = 3×10¹⁵ cm⁻³. Find n, p and the Fermi level position at 300 K.\n9. Germanium is doped with N_D = 1×10¹⁵ cm⁻³. Find n and p at 300 K, without assuming n_i is negligible.\n10. Calculate the conductivity and resistivity of intrinsic germanium at 300 K.\n\n## Solutions\n\n### 1. Atom density and nearest neighbours in Si\n\nThe diamond unit cell holds 8 atoms (8 corners × ⅛ + 6 faces × ½ + 4 inside).\n\n    (a) N = 8/a³ = 8/(5.43×10⁻⁸ cm)³ = 8/(1.601×10⁻²² cm³) = 5.0×10²² atoms/cm³\n\n    (b) r_nn = (√3/4)a = 0.433 × 5.43 Å = 2.35 Å\n\n### 2. Miller indices\n\n| | x | y | z |\n|---|---|---|---|\n| (a) Intercepts | 3 | 2 | 1 |\n| Reciprocals | 1/3 | 1/2 | 1 |\n| × 6 | 2 | 3 | 6 |\n\n(a) **(2 3 6)**. d₂₃₆ = 5.43/√(4 + 9 + 36) = 5.43/7 = **0.776 Å**.\n\n(b) Intercepts 1, −1, ∞ → reciprocals 1, −1, 0 → **(1 1̄ 0)**, a plane parallel to z.\n\n### 3. Packing factor of diamond\n\nNearest neighbours touch along the body diagonal at distance (√3/4)a, so the atomic radius is r = (√3/8)a. With 8 atoms per cell:\n\n    APF = 8 × (4/3)πr³ / a³ = 8 × (4/3)π (√3/8)³ = (32π/3)(3√3/512) = π√3/16 = 0.34\n\nOnly 34 % of the volume is filled, an open structure that allows interstitial impurities.\n\n### 4. Direct and indirect gaps\n\n(1) In a direct gap the conduction-band minimum and valence-band maximum are at the same k; in an indirect gap they are at different k. (2) Direct transitions need only a photon; indirect transitions also need a phonon. (3) Direct-gap materials emit light efficiently (GaAs, GaN, InP: LEDs, lasers); indirect ones do not (Si, Ge). Also: absorption near E_g is strong in direct-gap and weak in indirect-gap material; radiative lifetime is ns in direct and much longer in indirect.\n\n    GaAs: λ = 1.24/1.42 = 0.873 μm (near infrared)\n\n### 5. Occupation probabilities\n\n    (a) f = 1/(1 + e^{0.1/0.0259}) = 1/(1 + e^{3.861}) = 1/(1 + 47.5) = 0.0206\n    (b) f = 1/(1 + e^{1}) = 1/3.718 = 0.269\n\n### 6. Temperature for a given probability\n\nSince f is small, use the Boltzmann form: f ≈ e^{−(E − E_F)/kT} = 10⁻⁴.\n\n    0.30/kT = ln(10⁴) = 9.21   ⇒   kT = 0.0326 eV\n    T = 0.0326/8.617×10⁻⁵ = 378 K\n\n(The exact form 1/(1 + e^{x}) = 10⁻⁴ gives x = 9.21 as well, to three figures.)\n\n### 7. Carrier densities from E_F\n\n    n = N_c e^{−(E_c−E_F)/kT} = 2.8×10¹⁹ × e^{−0.25/0.0259} = 2.8×10¹⁹ × e^{−9.65}\n      = 2.8×10¹⁹ × 6.4×10⁻⁵ = 1.8×10¹⁵ cm⁻³\n    p = n_i²/n = 10²⁰/1.8×10¹⁵ = 5.6×10⁴ cm⁻³\n\nn ≫ p, so the sample is **n-type** (doped with about 1.8×10¹⁵ cm⁻³ donors).\n\n### 8. Compensated silicon\n\nN_A > N_D, so the material is p-type with net doping N_A − N_D = 7×10¹⁵ cm⁻³ ≫ n_i.\n\n    p ≈ 7×10¹⁵ cm⁻³\n    n = n_i²/p = 10²⁰/7×10¹⁵ = 1.4×10⁴ cm⁻³\n    E_i − E_F = kT ln(p/n_i) = 0.0259 × ln(7×10⁵) = 0.0259 × 13.46 = 0.349 eV\n\nThe Fermi level is 0.349 eV below E_i. Both dopants still scatter carriers, so mobility is that for 1.3×10¹⁶ cm⁻³ total impurities.\n\n### 9. Lightly doped germanium\n\nn_i = 2.4×10¹³ is not negligible compared with N_D = 10¹⁵, so use the exact neutrality solution:\n\n    n = N_D/2 + √((N_D/2)² + n_i²) = 5×10¹⁴ + √(2.5×10²⁹ + 5.76×10²⁶)\n      = 5×10¹⁴ + 5.006×10¹⁴ = 1.0006×10¹⁵ cm⁻³\n    p = n_i²/n = 5.76×10²⁶/1.0006×10¹⁵ = 5.76×10¹¹ cm⁻³\n\nn is still essentially N_D, but the minority concentration (5.8×10¹¹) is 10⁷ times larger than in silicon with the same doping (10⁵): this is why Ge diodes leak so much.\n\n### 10. Intrinsic germanium\n\n    σ_i = q n_i (μ_n + μ_p) = 1.6×10⁻¹⁹ × 2.4×10¹³ × (3900 + 1900)\n        = 1.6×10⁻¹⁹ × 1.392×10¹⁷ = 0.0223 S/cm\n    ρ_i = 1/σ_i = 44.9 Ω·cm\n\nFor comparison, intrinsic Si is about 3×10⁵ Ω·cm, nearly 10⁴ times higher, because its band gap is larger.\n", "group": "Module 2 · Energy Bands & Carrier Statistics", "eyebrow": "Week 6", "disp": "06"}, {"num": "07", "title": "Drift and Diffusion Currents", "body": "\n**Plan:** carrier mobility, scattering mechanisms and conductivity; diffusion of carriers, Fick's law and the Einstein relation.\n\nCarriers move in two ways: they **drift** when pushed by an electric field, and they **diffuse** when there are more of them in one place than another. Every device current is a mixture of the two.\n\n## Part A: Drift, mobility and conductivity\n\n## Thermal motion and drift\n\nWith no field, carriers move randomly at the thermal velocity\n\n    v_th = √(3kT/m∗) ≈ 10⁷ cm/s   (Si electrons, 300 K)\n\ncolliding (scattering) every **mean free time** τ_m ≈ 0.1–1 ps. The random motion averages to zero, so there is no current.\n\nApply a field E. Between collisions each electron accelerates by −qE/m_n∗. On average it gains a velocity −qEτ_m/m_n∗ before a collision randomises it again. This small average velocity superimposed on the random motion is the **drift velocity**:\n\n    v_dn = −(qτ_m/m_n∗) E = −μ_n E,      v_dp = +μ_p E\n\n## Mobility\n\n    μ = qτ_m / m∗      [cm²/V·s]\n\nMobility is drift velocity per unit field. It is high when scattering is rare (long τ_m) and the effective mass is small.\n\n| Material | μ_n (cm²/V·s) | μ_p (cm²/V·s) |\n|---|---|---|\n| Si | 1350 | 480 |\n| Ge | 3900 | 1900 |\n| GaAs | 8500 | 400 |\n\nElectrons are faster than holes in all three, mainly because of their smaller effective mass.\n\n## Scattering mechanisms\n\n1. **Lattice (phonon) scattering.** Thermal vibration of the lattice atoms disturbs the periodic potential. Acoustic phonons dominate at moderate temperatures; optical phonons at high temperature and high field. It increases with temperature: μ_L ∝ T^{−3/2}.\n2. **Ionised-impurity (Coulomb) scattering.** Charged dopant ions deflect passing carriers. Fast carriers are deflected less, so it weakens with temperature and strengthens with doping: μ_I ∝ T^{3/2}/N_I, where N_I = N_D⁺ + N_A⁻ (compensating dopants still scatter).\n3. **Neutral-impurity scattering.** Un-ionised dopants and other neutral atoms; important only at low temperature (freeze-out).\n4. **Carrier–carrier scattering.** Electron–hole and electron–electron collisions at high carrier density (heavily injected regions).\n5. **Defect scattering.** Dislocations, grain boundaries, vacancies and clusters.\n6. **Surface (interface-roughness) scattering.** In MOSFET inversion layers, carriers pressed against the Si/SiO₂ interface by the gate field are scattered by roughness and interface charges, so channel mobility is only about half the bulk value.\n7. **Polar-optical and piezoelectric scattering.** In compound semiconductors like GaAs, where bonds are partly ionic.\n8. **Alloy scattering.** Random arrangement of atoms in alloys like AlGaAs and SiGe.\n\n**Matthiessen's rule.** Independent mechanisms add as scattering rates, so\n\n    1/μ = 1/μ_L + 1/μ_I + …\n\nThe lowest mobility dominates.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 225\" role=\"img\" aria-label=\"Log-log plot of electron mobility against temperature for light and heavy doping, rising then falling, with the lattice-scattering limit shown dashed\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system  mobility on (110).\n- **Strain:** tensile strain raises electron mobility in Si (used in modern CMOS).\n- **Surfaces and interfaces.**\n\n## Drift current density\n\n    J_drift = q(nμ_n + pμ_p) E = σE\n\n    σ = q(nμ_n + pμ_p),     ρ = 1/σ\n\nFor n-type: σ ≈ qN_Dμ_n. For p-type: σ ≈ qN_Aμ_p.\n\nSheet resistance of a uniformly doped layer of thickness t: R_s = ρ/t (Ω/□), measured by a four-point probe.\n\n## Hall effect\n\nA magnetic field B_z across a current I_x pushes carriers sideways, building a Hall voltage V_H. The Hall coefficient R_H = 1/qp (p-type, positive) or −1/qn (n-type, negative) gives the carrier type and density; combined with resistivity it gives mobility μ = |R_H|σ.\n\n## Part B: Diffusion, Fick's law and the Einstein relation\n\n## Diffusion\n\nRandom thermal motion produces a net flow from high to low concentration. With a gradient dn/dx, more carriers cross a plane from the crowded side than from the sparse side. The particle flux is proportional to the gradient (Fick's first law, Week 3):\n\n    Φ_n = −D_n dn/dx,      Φ_p = −D_p dp/dx\n\nD_n and D_p are the **diffusion coefficients** (cm²/s). In Si at 300 K, D_n ≈ 35 and D_p ≈ 12 cm²/s.\n\n## Diffusion current densities\n\nMultiply the flux by the carrier charge:\n\n    J_{n,diff} = (−q)(−D_n dn/dx) = +q D_n dn/dx\n    J_{p,diff} = (+q)(−D_p dp/dx) = −q D_p dp/dx\n\nNote the signs. Electrons and holes both flow down their gradients, but the electron's negative charge makes electron current flow **up** the electron gradient.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"Electrons and holes both diffuse down their concentration gradients, but electron current flows opposite to electron flux\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-star
