121.6\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"434.5\" cy=\"126.7\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"461.8\" cy=\"130.4\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"489.1\" cy=\"133.3\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><circle cx=\"516.4\" cy=\"135.4\" r=\"2.6\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\"/><text x=\"445.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:currentColor\" opacity=\".85\">holes</text><line x1=\"370\" y1=\"176\" x2=\"520\" y2=\"176\" style=\"stroke:currentColor\" stroke-width=\"1.4\" marker-end=\"url(#ar)\"/><text x=\"445.0\" y=\"170\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor\">flux, down the gradient</text><line x1=\"370\" y1=\"206\" x2=\"520\" y2=\"206\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\" marker-end=\"url(#art)\"/><text x=\"445.0\" y=\"200\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E)\">J_p = −qD_p dp/dx  (with the flux)</text></svg><figcaption>Both carriers diffuse down their concentration gradient. Because electrons are negative, the electron diffusion current points against their flow, while the hole current points with it.</figcaption></figure>\n```\n\n#### Example 7.3: electron diffusion current\n\n**Question.** In a silicon sample the electron concentration falls linearly from 1×10¹⁷ cm⁻³ to zero over a distance of 1 μm. Taking D_n = 35 cm²/s, calculate the electron diffusion current density.\n\n**Given:** Δn = 1×10¹⁷ cm⁻³ over Δx = 1 μm = 1×10⁻⁴ cm, D_n = 35 cm²/s, q = 1.6×10⁻¹⁹ C.\n\n**Find:** J_n(diff).\n\n**Solution.**\n\nStep 1. The concentration gradient:\n\n    dn/dx = −10¹⁷ / 10⁻⁴ = −10²¹ cm⁻⁴\n\nStep 2. J_n = qD_n dn/dx:\n\n    J_n = 1.6×10⁻¹⁹ × 35 × (−10²¹) = −5.6×10³ A/cm²\n\n**Answer:** **|J_n| = 5.6×10³ A/cm²**, flowing in the −x direction (opposite to the electron flow, because electrons are negative).\n\nA large current, from a modest gradient. Diffusion is not a small effect: it carries the whole current in a diode's neutral regions and in a transistor's base.\n\n### The total current equations\n\nWhen a field and a gradient are both present, simply add drift and diffusion:\n\n    J_n = qnμ_nE + qD_n dn/dx\n    J_p = qpμ_pE − qD_p dp/dx\n    J = J_n + J_p\n\nThese two equations, together with the continuity equation (Week 9) and Poisson's equation, describe every semiconductor device.\n\n### The Einstein relation\n\nDrift and diffusion are two responses of the same carriers to two different pushes, and both are limited by the **same collisions**. So it is no surprise that μ and D are related:\n\n    D_n / μ_n = D_p / μ_p = kT/q\n\nkT/q is the **thermal voltage**, 0.0259 V (about 26 mV) at 300 K.\n\n**Why it is true (the equilibrium argument).** Take an n-type sample whose doping is higher on the left than on the right, and leave it alone (no battery).\n\n1. Electrons diffuse from the heavily doped left side towards the right.\n2. As they leave, they uncover positive donor ions on the left. Positive charge on the left and extra electrons on the right create an internal electric field.\n3. The field pulls electrons back to the left: a drift current opposite to the diffusion current.\n4. With no battery, no net current can flow, so in equilibrium **drift exactly cancels diffusion**: 0 = qnμ_nE + qD_n dn/dx.\n5. In equilibrium the Fermi level is flat (Week 5). Using n = N_c e^{−(E_c − E_F)/kT}, the gradient dn/dx can be written in terms of the field: dn/dx = −(qn/kT)E.\n6. Substituting: 0 = qnμ_nE − qD_n(qn/kT)E, which gives D_n/μ_n = kT/q.\n\n**Using it.** Mobility is easy to measure (Hall effect, conductivity), so D follows immediately:\n\n| | μ (cm²/V·s) | D = μ × 0.0259 (cm²/s) |\n|---|---|---|\n| Si electrons | 1350 | 35.0 |\n| Si holes | 480 | 12.4 |\n| GaAs electrons | 8500 | 220 |\n| Ge electrons | 3900 | 101 |\n\n> **In plain words.** A carrier that rarely collides both drifts easily in a field (high μ) and spreads quickly by itself (high D). The ratio between the two depends only on temperature.\n\n## Key points of Week 7\n\n- Drift: v_d = μE, with μ = qτ/m∗. Electrons are faster than holes; GaAs electrons are fastest.\n- Mobility is limited by lattice scattering (worse when hot) and impurity scattering (worse when heavily doped); 1/μ = Σ1/μ_i.\n- Drift current J = q(nμ_n + pμ_p)E = σE; σ ≈ qN_Dμ_n for n-type.\n- Diffusion: carriers flow down their concentration gradient. J_n = qD_n dn/dx, J_p = −qD_p dp/dx.\n- Total current = drift + diffusion.\n- Einstein relation: D/μ = kT/q = 0.0259 V at 300 K.\n\n---\n\n## Examination questions solved (Q35–Q40)\n\n### Q35. Define carrier mobility and explain the factors that affect electron and hole mobility in semiconductors.\n\n**Definition.** Carrier mobility μ is the drift velocity acquired per unit applied electric field:\n\n    μ = |v_d| / E = qτ_m / m∗      [cm²/V·s]\n\nwhere τ_m is the mean free time between collisions and m∗ the effective mass. It measures how easily carriers move through the crystal under a field. Electron mobility μ_n and hole mobility μ_p are different (Si: 1350 and 480 cm²/V·s).\n\n**Factors affecting mobility:**\n\n1. **Effective mass.** μ ∝ 1/m∗. Electrons generally have lighter effective mass than holes, so μ_n > μ_p. GaAs electrons (m∗ = 0.067m₀) have μ_n ≈ 8500 cm²/V·s.\n2. **Temperature.** Two opposing effects:\n   (a) Lattice scattering increases with T, μ_L ∝ T^{−3/2}.\n   (b) Ionised-impurity scattering decreases with T, μ_I ∝ T^{3/2}/N_I, since faster carriers are deflected less.\n   Mobility therefore rises at low T, peaks, and falls at high T. Near room temperature lattice scattering usually dominates and μ falls as T rises.\n3. **Doping (impurity) concentration.** More ionised impurities mean more Coulomb scattering: μ falls as N_D + N_A increases (Si μ_n ≈ 1350 at 10¹⁴ cm⁻³ but about 100 at 10²⁰ cm⁻³). Compensated material has low mobility even though net doping is small.\n4. **Electric field.** At low field μ is constant. At high field carriers heat up, emit optical phonons, and drift velocity saturates, so the effective mobility v_d/E falls.\n5. **Crystal defects** (dislocations, grain boundaries, vacancies) add scattering; polycrystalline and amorphous material have much lower mobility.\n6. **Surface and interface scattering.** In MOSFET channels, roughness and interface charge reduce mobility to roughly half the bulk value, and it falls further with higher gate field.\n7. **Crystal orientation and strain.** Mobility depends on direction in anisotropic bands; strain alters effective masses (strained-Si technology).\n8. **Carrier concentration** at high injection (carrier–carrier scattering).\n\nThese are combined using Matthiessen's rule, 1/μ = 1/μ_L + 1/μ_I + …\n\n### Q36. Explain the mechanisms responsible for carrier scattering in semiconductor materials.\n\nIn a perfectly periodic, motionless lattice an electron would move without scattering (Bloch's theorem). Scattering happens whenever something breaks that perfect periodicity. The main mechanisms:\n\n1. **Lattice (phonon) scattering.** Above 0 K the atoms vibrate about their positions, distorting the periodic potential. Carriers exchange energy and momentum with these lattice vibrations (phonons). *Acoustic-phonon* scattering is low-energy and nearly elastic, dominant at room temperature in Si; its rate increases with T, giving μ_L ∝ T^{−3/2}. *Optical-phonon* scattering involves high-energy phonons (63 meV in Si); it matters at high temperatures and high fields and causes velocity saturation. *Polar-optical and piezoelectric* scattering occur in compound semiconductors (GaAs), where the vibrating ionic bonds create electric fields that scatter carriers strongly.\n2. **Ionised-impurity scattering.** Ionised donors (+) and acceptors (−) have Coulomb fields that deflect passing carriers (Rutherford-like scattering). Slower carriers spend more time near the ion and are deflected more, so it is strongest at low temperature and high doping: μ_I ∝ T^{3/2}/N_I.\n3. **Neutral-impurity scattering.** Non-ionised impurity atoms scatter weakly by their distorted potential. Matters only at low temperatures when dopants are frozen out.\n4. **Carrier–carrier scattering.** Coulomb interactions between carriers. Important at very high carrier densities (heavily doped or highly injected regions, e.g. in power devices and solar cells).\n5. **Defect scattering.** Dislocations (charged lines in n-type material), grain boundaries, stacking faults, vacancies and clusters disturb the lattice and scatter carriers.\n6. **Surface and interface scattering.** At surfaces and at the Si/SiO₂ interface, surface roughness, interface traps and oxide charges scatter carriers confined near the interface (MOSFET channels).\n7. **Alloy scattering.** In alloys such as Al_{x}Ga_{1−x}As or SiGe, the random distribution of different atoms makes the potential non-periodic.\n8. **Intervalley scattering.** Carriers move between equivalent or non-equivalent conduction-band minima by absorbing or emitting phonons (basis of the Gunn effect).\n\nThe total rate is the sum of the individual rates, 1/τ = Σ 1/τ_i, giving Matthiessen's rule 1/μ = Σ 1/μ_i. Near room temperature in lightly doped Si, lattice scattering dominates; in heavily doped Si or at low temperature, ionised-impurity scattering dominates.\n\n### Q37. Derive the expression for drift current density due to electrons and holes.\n\n**Assumptions:** uniform semiconductor, steady state, uniform field E in the +x direction, low enough field that v_d ∝ E.\n\n**Step 1: drift velocity.** An electron experiences force F = −qE. Between collisions (mean free time τ_m), it accelerates by a = −qE/m_n∗. Averaging over all electrons, momentum gained from the field equals momentum lost in collisions:\n\n    m_n∗ v_dn / τ_m = −qE   ⇒   v_dn = −(qτ_m/m_n∗) E = −μ_n E\n\nSimilarly, holes (charge +q) drift with the field:\n\n    v_dp = +(qτ_mp/m_p∗) E = +μ_p E\n\n**Step 2: current density from charge flow.** Current density is charge density × velocity. Consider a bar of cross-section A. In time dt, all carriers within distance v_d·dt of a cross-section pass through it; that is (v_d dt A) × concentration carriers.\n\nFor electrons, charge density −qn and velocity v_dn:\n\n    J_n = (−qn)(v_dn) = (−qn)(−μ_n E) = qnμ_n E\n\nFor holes, charge density +qp and velocity v_dp:\n\n    J_p = (+qp)(+μ_p E) = qpμ_p E\n\nElectrons move against the field but carry negative charge, so their current is in the same direction as the hole current: both are along E.\n\n**Step 3: total drift current density.**\n\n    J_drift = J_n + J_p = q( nμ_n + pμ_p ) E\n\nComparing with Ohm's law J = σE:\n\n    σ = q( nμ_n + pμ_p ),     ρ = 1/σ = 1 / [ q(nμ_n + pμ_p) ]\n\nFor an n-type sample (n ≫ p), σ ≈ qnμ_n ≈ qN_Dμ_n; for p-type, σ ≈ qN_Aμ_p. For an intrinsic sample, σ_i = qn_i(μ_n + μ_p).\n\n### Q38. A semiconductor has an electron concentration of 2 × 10¹⁶ cm⁻³, electron mobility of 1350 cm²/V·s, and an electric field of 10 V/cm. Calculate the electron drift current density.\n\n**Given:** n = 2×10¹⁶ cm⁻³, μ_n = 1350 cm²/V·s, E = 10 V/cm, q = 1.602×10⁻¹⁹ C.\n\n    J_n = q n μ_n E\n        = (1.602×10⁻¹⁹ C)(2×10¹⁶ cm⁻³)(1350 cm²/V·s)(10 V/cm)\n        = (1.602×10⁻¹⁹)(2.7×10²⁰)   A/cm²\n        = 43.3 A/cm²\n\n**J_n ≈ 43.3 A/cm²** (= 4.33×10⁵ A/m²).\n\n**Units check:** C · cm⁻³ · cm²/(V·s) · V/cm = C/(s·cm²) = A/cm². ✓\n\nSupporting quantities:\n\n- Drift velocity v_d = μ_nE = 1350 × 10 = 1.35×10⁴ cm/s (well below v_sat = 10⁷ cm/s, so the linear model is valid).\n- Conductivity σ = qnμ_n = 4.33 S/cm, resistivity ρ = 0.231 Ω·cm, and J = σE = 4.33 × 10 = 43.3 A/cm². ✓\n\n### Q39. Explain diffusion current in a semiconductor and state Fick's law.\n\n**Diffusion current** is the current produced by the net movement of carriers from a region of higher concentration to one of lower concentration, caused by their random thermal motion. No electric field is needed. If the concentration varies with position, more carriers cross any plane from the high-concentration side than from the low side simply because there are more of them, so a net flux results. Because the carriers are charged, this flux is a current.\n\nDiffusion current is important wherever carrier gradients exist: in the neutral regions of a forward-biased p-n junction (injected minority carriers diffusing away from the junction), in the base of a bipolar transistor, under non-uniform illumination, and in non-uniformly doped material.\n\n**Fick's (first) law.** The particle flux is proportional to the negative of the concentration gradient:\n\n    F = −D dC/dx\n\nwhere D is the diffusion coefficient (cm²/s). Applied to electrons and holes:\n\n    Electron flux:  F_n = −D_n dn/dx       Hole flux:  F_p = −D_p dp/dx\n\n**Diffusion current densities** (multiply by the charge, −q for electrons, +q for holes):\n\n    J_{n,diff} = +q D_n dn/dx\n    J_{p,diff} = −q D_p dp/dx\n\nIn three dimensions, J_n = qD_n∇n and J_p = −qD_p∇p.\n\n**Example.** If the electron concentration falls linearly from 10¹⁷ cm⁻³ to 0 over 1 μm in Si (D_n = 35 cm²/s):\n\n    dn/dx = −10¹⁷/10⁻⁴ = −10²¹ cm⁻⁴\n    J_n = q D_n dn/dx = (1.602×10⁻¹⁹)(35)(−10²¹) = −5.6×10³ A/cm²\n\nThe negative sign means the current flows in the −x direction, while the electrons themselves flow in +x (down their gradient).\n\nTotal current when a field is present: J_n = qnμ_nE + qD_n dn/dx and J_p = qpμ_pE − qD_p dp/dx.\n\n### Q40. State and explain the Einstein relation between carrier mobility and diffusion coefficient.\n\n**Statement.**\n\n    D_n/μ_n = kT/q,      D_p/μ_p = kT/q\n\nThe ratio of diffusion coefficient to mobility equals the thermal voltage kT/q (0.0259 V at 300 K), for both electrons and holes, in a non-degenerate semiconductor.\n\n**Explanation.** Drift and diffusion are two responses of the same carriers, both limited by the same random scattering events. Mobility describes the response to an electric field (μ = qτ_m/m∗); diffusion describes the response to a concentration gradient (D = v_th²τ_m/3 ≈ kTτ_m/m∗). Dividing gives D/μ = kT/q: the scattering time and mass cancel, leaving only temperature.\n\n**Derivation (equilibrium argument).** In a non-uniformly doped sample in thermal equilibrium, an internal field E develops such that the drift and diffusion currents cancel exactly:\n\n    J_n = qnμ_nE + qD_n dn/dx = 0\n\nIn equilibrium E_F is constant and n = n_i exp((E_F − E_i)/kT). Since E_i varies with the electrostatic potential, dE_i/dx = qE, so\n\n    dn/dx = −(n/kT) dE_i/dx = −(qn/kT) E\n\nSubstituting:\n\n    qnμ_nE − qD_n(qn/kT)E = 0   ⇒   D_n = (kT/q)μ_n\n\n**Uses.**\n\n1. One measurement gives the other: mobility is easy to measure (Hall effect, conductivity), so D follows. Si electrons: D_n = 0.0259 × 1350 = **35 cm²/s**; holes: D_p = 0.0259 × 480 = **12.4 cm²/s**.\n2. It links the drift and diffusion terms in the current equations and is needed to calculate diffusion lengths L = √(Dτ) and diode saturation currents.\n3. It shows why the built-in voltage of a junction is set by kT/q times a logarithm of a concentration ratio.\n\nFor degenerate semiconductors the relation is modified (D/μ > kT/q), because carriers then obey Fermi–Dirac rather than Boltzmann statistics.\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 7.1: resistivity of p-type silicon\n\n**Question.** Find the resistivity of silicon doped with 5×10¹⁵ cm⁻³ boron, taking μ_p = 470 cm²/V·s.\n\n**Given:** N_A = 5×10¹⁵ cm⁻³, μ_p = 470 cm²/V·s.\n\n**Find:** ρ.\n\n**Solution.**\n\n    σ = qN_Aμ_p = 1.6×10⁻¹⁹ × 5×10¹⁵ × 470 = 0.376 S/cm\n    ρ = 1/σ = 2.66 Ω·cm\n\n**Answer:** **ρ = 2.7 Ω·cm.**\n\n#### Practice 7.2: doping for a target resistivity\n\n**Question.** What phosphorus concentration gives n-type silicon a resistivity of 1 Ω·cm? Take μ_n = 1300 cm²/V·s.\n\n**Given:** ρ = 1 Ω·cm, μ_n = 1300 cm²/V·s.\n\n**Find:** N_D.\n\n**Solution.**\n\n    N_D = 1/(qμ_nρ) = 1/(1.6×10⁻¹⁹ × 1300 × 1) = 4.8×10¹⁵ cm⁻³\n\n**Answer:** **N_D ≈ 4.8×10¹⁵ cm⁻³.**\n\n#### Practice 7.3: Hall measurement\n\n**Question.** A semiconductor sample 0.01 cm thick carries I = 1 mA in a magnetic field of 0.1 T (10⁻⁵ Wb/cm²). A Hall voltage of +2 mV is measured, and the resistivity is 4 Ω·cm. Find the carrier type, concentration and mobility.\n\n**Given:** t = 0.01 cm, I = 10⁻³ A, B = 10⁻⁵ Wb/cm², V_H = +2×10⁻³ V, ρ = 4 Ω·cm.\n\n**Find:** type, p, μ.\n\n**Solution.**\n\n    R_H = V_H t/(IB) = (2×10⁻³ × 0.01)/(10⁻³ × 10⁻⁵) = 2000 cm³/C   (positive → holes)\n    p = 1/(qR_H) = 1/(1.6×10⁻¹⁹ × 2000) = 3.1×10¹⁵ cm⁻³\n    μ_p = R_H/ρ = 2000/4 = 500 cm²/V·s\n\n**Answer:** **p-type, p = 3.1×10¹⁵ cm⁻³, μ_p = 500 cm²/V·s.**\n\n#### Practice 7.4: combining scattering mechanisms\n\n**Question.** In a silicon sample the lattice-limited mobility is 1400 cm²/V·s and the impurity-limited mobility is 2500 cm²/V·s. Find the total mobility.\n\n**Given:** μ_L = 1400, μ_I = 2500 cm²/V·s.\n\n**Find:** μ.\n\n**Solution.**\n\n    1/μ = 1/1400 + 1/2500 = 7.14×10⁻⁴ + 4.0×10⁻⁴ = 1.114×10⁻³\n    μ = 897 cm²/V·s\n\n**Answer:** **μ ≈ 900 cm²/V·s**, lower than either mechanism alone.\n\n#### Practice 7.5: drift plus diffusion\n\n**Question.** In a region of silicon the hole concentration is 1×10¹⁵ cm⁻³ and falls with a gradient of −1×10¹⁸ cm⁻⁴, while a field of 50 V/cm acts in the +x direction. Find the hole drift, diffusion and total current densities (μ_p = 480 cm²/V·s, D_p = 12.4 cm²/s).\n\n**Given:** p = 10¹⁵ cm⁻³, dp/dx = −10¹⁸ cm⁻⁴, E = 50 V/cm, μ_p = 480, D_p = 12.4 cm²/s.\n\n**Find:** J_p(drift), J_p(diff), J_p.\n\n**Solution.**\n\n    J_p(drift) = qpμ_pE = 1.6×10⁻¹⁹ × 10¹⁵ × 480 × 50 = 3.84 A/cm²\n    J_p(diff) = −qD_p dp/dx = −1.6×10⁻¹⁹ × 12.4 × (−10¹⁸) = +1.98 A/cm²\n    J_p = 3.84 + 1.98 = 5.82 A/cm²\n\n**Answer:** **3.84 + 1.98 = 5.8 A/cm²**, both in the +x direction.\n\n#### Practice 7.6: Einstein relation at a higher temperature\n\n**Question.** Holes in a sample have μ_p = 400 cm²/V·s at 400 K. Find D_p.\n\n**Given:** μ_p = 400 cm²/V·s, T = 400 K.\n\n**Find:** D_p.\n\n**Solution.**\n\n    kT/q = 8.617×10⁻⁵ × 400 = 0.0345 V\n    D_p = (kT/q)μ_p = 0.0345 × 400 = 13.8 cm²/s\n\n**Answer:** **D_p = 13.8 cm²/s.**\n\n#### Practice 7.7: why doping lowers mobility\n\n**Question.** Explain why electron mobility in silicon falls from about 1350 to about 100 cm²/V·s as the doping rises from 10¹⁴ to 10²⁰ cm⁻³.\n\n**Answer.** Each dopant is an ionised impurity with a Coulomb field that deflects passing carriers. Mobility is μ = qτ_m/m∗; more ionised impurities mean more frequent scattering, a shorter mean free time τ_m, and so a lower μ. At 10¹⁴ cm⁻³ lattice scattering dominates and impurities hardly matter; at 10²⁰ cm⁻³ impurity scattering dominates completely (Matthiessen: 1/μ = 1/μ_L + 1/μ_I, with μ_I ∝ 1/N_I).\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Explain thermal motion, drift velocity and mobility. | Si electrons in a 500 V/cm field: find v_d. | v_d = 1350 × 500 = 6.75×10⁵ cm/s. | Part A; Example 7.1 |\n| 2 | Explain the scattering mechanisms and the factors that affect mobility. | Which scattering mechanism dominates at low temperature in heavily doped Si? | Ionised-impurity scattering. | Scattering; factors affecting mobility |\n| 3 | Derive and use the drift current density and conductivity. | Find σ for p-type Si with N_A = 10¹⁶ cm⁻³ and μ_p = 480 cm²/V·s. | σ = 1.6×10⁻¹⁹ × 10¹⁶ × 480 = 0.77 S/cm. | Drift current density; Example 7.2 |\n| 4 | Explain carrier diffusion and calculate diffusion current with Fick's law. | Why does electron diffusion current point opposite to the electron flow? | Because the electron charge is negative. | Part B; Example 7.3 |\n| 5 | State, explain and use the Einstein relation. | Find D_n for GaAs (μ_n = 8500 cm²/V·s) at 300 K. | D = 0.0259 × 8500 = 220 cm²/s. | The Einstein relation |\n", "group": "Module 3 · Carrier Transport & Injection Phenomena", "eyebrow": "Week 7", "disp": "07"}, {"num": "08", "title": "High-Field Effects and Excess Carriers", "body": "\n**Plan:** velocity saturation and hot-carrier effects; generation and recombination mechanisms (Shockley–Read–Hall theory); carrier lifetime and steady-state excess carrier injection.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Explain velocity saturation and its effect on devices.\n2. Explain hot-carrier effects and how they are reduced.\n3. Explain excess carriers and low-level injection.\n4. Describe the generation and recombination mechanisms.\n5. Explain SRH recombination and calculate lifetime from trap data.\n6. Calculate decay of excess carriers and steady-state injection levels.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_Fn, E_Fp | Quasi-Fermi levels for electrons and holes, used out of equilibrium | eV |\n| E_t | Energy level of a trap (recombination centre) in the gap | eV |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| n₀, p₀ | Equilibrium electron and hole concentrations | cm⁻³ |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| ν, hν | Frequency of light, and photon energy | Hz; eV |\n| Q | Dose: dopant atoms per unit area (in Weeks 13–14, Q also means charge) | atoms/cm² (C or C/cm² for charge) |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| v_d | Drift velocity | cm/s |\n| v_th | Thermal velocity of carriers | ≈ 10⁷ cm/s at 300 K |\n| v_sat | Saturation velocity at high field | ≈ 10⁷ cm/s in Si |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| T_e | Electron temperature of hot carriers | K |\n| G, G_L | Generation rate of electron–hole pairs (G_L: by light) | cm⁻³s⁻¹ |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| U | Net recombination rate, R − G | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| N_t | Density of traps (recombination centres) | cm⁻³ |\n| σ_n, σ_p | Capture cross-section of a trap for electrons, holes | cm² |\n| n₁, p₁ | SRH parameters n_ie^{(E_t − E_i)/kT} and n_ie^{(E_i − E_t)/kT} | cm⁻³ |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| V, V_a | Applied voltage (positive for forward bias) | V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| A (area) | Device or contact area | cm² |\n| β | Common-emitter current gain, I_C/I_B (also h_FE) | dimensionless; 50–500 |\n| N_E, W_E, D_E; N_B, W_B, D_B | Doping, width and minority diffusion coefficient of the emitter; of the base | cm⁻³; μm; cm²/s |\n| f_T | Transition (cut-off) frequency | Hz |\n| V_T (V_th) | Threshold voltage of a MOSFET | V |\n| V_GS, V_DS, V_SB, V_G | Gate–source, drain–source, source–body and gate voltages | V |\n| E_sat | Field at which the drift velocity saturates, v_sat/μ | V/cm |\n| G_th, R_th | Thermal generation and recombination rates (equal in equilibrium) | cm⁻³s⁻¹ |\n| f_t, e_n, e_p | Probability a trap is occupied by an electron; emission rates of electrons and holes from traps | dimensionless; s⁻¹ |\n| r_a, r_b, r_c, r_d | SRH rates: electron capture, electron emission, hole capture, hole emission | cm⁻³s⁻¹ |\n| τ_SRH, τ_radiative, τ_Auger | Lifetimes set by trap (SRH), radiative and Auger recombination | s |\n| I_gen, J_gen | Generation current (density) from carriers generated in the depletion region | A; A/cm² |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| GaAs | Gallium arsenide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| CB | Conduction band |\n| VB | Valence band |\n| SRH | Shockley–Read–Hall (trap-assisted) recombination |\n| LDD | Lightly doped drain |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| CMOS | Complementary MOS (n- and p-channel MOSFETs together) |\n| BJT | Bipolar junction transistor |\n| LED | Light-emitting diode |\n| IGBT | Insulated-gate bipolar transistor |\n| PCD | Photoconductive decay (lifetime measurement) |\n\n\n## The big picture\n\nThis week covers two separate stories.\n\n**Story 1: what happens at very high fields.** Week 7 said v_d = μE: double the field, double the speed. That stops being true at high fields. Carriers hit a **speed limit**, and the fastest ones become **\"hot\"** and start damaging things. This matters in modern transistors, which are so small that even a volt across them gives enormous fields.\n\n**Story 2: what happens when we disturb the balance of carriers.** Light, or a forward-biased junction, can add **extra** electrons and holes beyond the equilibrium numbers. These extras do not last: they **recombine** and disappear. How long they last, the **lifetime**, controls how diodes switch, how transistors amplify and how well solar cells work.\n\n## Part A: High-field effects\n\n### Velocity saturation\n\nAt low fields carriers lose the energy they pick up from the field to small lattice vibrations, so they stay \"cool\" and v_d = μE.\n\nAt high fields (above about 10⁴ V/cm in Si) they pick up energy faster than they can lose it that way. Once a carrier has about 0.06 eV of extra energy (in Si), it can shake the lattice much harder by emitting an **optical phonon**, which takes that energy away in one go. So every time a carrier speeds up, it is quickly slowed down again. The drift velocity stops increasing and levels off at the **saturation velocity**:\n\n    v_sat ≈ 1×10⁷ cm/s   (Si electrons and holes, at 300 K)\n\n> **In plain words.** Pushing harder on a cyclist on a flat road makes them go faster, until air resistance grows so quickly that extra effort gives almost no extra speed. Optical phonons are the \"air resistance\" for carriers.\n\nAn empirical formula that joins the two regimes smoothly (Caughey–Thomas):\n\n    v_d = μE / [ 1 + (μE/v_sat)^β ]^{1/β}      (β ≈ 2 for Si electrons, about 1 for holes)\n\nAt low field it reduces to μE; at high field to v_sat.\n\n**GaAs is different.** Its electrons speed up to about 2×10⁷ cm/s near 3.5 kV/cm, and then actually **slow down** at higher fields, because they jump into a different part of the conduction band where they are heavier. A region where more field gives less current is called **negative differential mobility**; it is used in Gunn diodes to make microwave oscillators.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 230\" role=\"img\" aria-label=\"Drift velocity against electric field on log axes: silicon electrons and holes saturate near ten to the seven centimetres per second, GaAs electrons peak and then fall\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"203.0\" x2=\"444.0\" y2=\"203.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"70.0\" y1=\"203.0\" x2=\"70.0\" y2=\"34.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"70.0\" y1=\"203.0\" x2=\"70.0\" y2=\"199.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\"/><text x=\"70.0\" y=\"218.0\" text-anchor=\"middle\" font-size=\"10\ 1 357.5,72.9 358.8,72.8 360.1,72.7 361.3,72.6 362.6,72.4 363.9,72.3 365.1,72.2 366.4,72.1 367.7,72.0 368.9,71.9 370.2,71.8 371.5,71.7 372.7,71.6 374.0,71.5 375.3,71.4 376.5,71.3 377.8,71.2 379.1,71.1 380.3,71.1 381.6,71.0 382.9,70.9 384.1,70.8 385.4,70.7 386.7,70.7 387.9,70.6 389.2,70.5 390.5,70.5 391.7,70.4 393.0,70.3 394.3,70.3 395.5,70.2 396.8,70.2 398.1,70.1 399.3,70.1 400.6,70.0 401.9,70.0 403.1,69.9 404.4,69.9 405.7,69.8 406.9,69.8 408.2,69.7 409.5,69.7 410.7,69.6 412.0,69.6 413.3,69.6 414.5,69.5 415.8,69.5 417.1,69.5 418.3,69.4 419.6,69.4 420.9,69.4 422.1,69.3 423.4,69.3 424.7,69.3 425.9,69.2 427.2,69.2 428.5,69.2 429.7,69.2 431.0,69.1 432.3,69.1 433.5,69.1 434.8,69.1 436.1,69.0 437.3,69.0 438.6,69.0 439.9,69.0 441.1,69.0 442.4,68.9 443.7,68.9 444.9,68.9 446.2,68.9 447.5,68.9 448.7,68.8 450.0,68.8\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2.1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"321.0\" y=\"95.4\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">Si holes</text><line x1=\"70.0\" y1=\"63.0\" x2=\"450.0\" y2=\"63.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.45\" stroke-dasharray=\"2 3\"/><text x=\"74.7\" y=\"58.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">v<tspan dy=\"0.32em\" font-size=\"72%\">sat</tspan><tspan dy=\"-0.32em\">​</tspan> ≈ 10<tspan dy=\"-0.45em\" font-size=\"72%\">7</tspan><tspan dy=\"0.45em\">​</tspan> cm/s</text></svg><figcaption>Drift velocity against field. Silicon carriers level off near 10⁷ cm/s. GaAs electrons overshoot to about 2×10⁷ cm/s, then fall as they transfer to a heavier valley.</figcaption></figure>\n```\n\n**Why it matters:** in a short-channel MOSFET the carriers are at v_sat across most of the channel, so the current depends on (V_GS − V_T) rather than (V_GS − V_T)² (Week 14), and the transistor speed is limited to about v_sat/(2πL).\n\n### Hot-carrier effects\n\nWhen carriers gain energy much faster than they lose it, their average energy rises far above the normal thermal energy. They are called **hot carriers** (their energy is described by an \"electron temperature\" T_e much higher than the crystal's temperature). Hot carriers cause:\n\n1. **Velocity saturation** and reduced mobility (above).\n2. **Impact ionisation.** A carrier with energy above about 1.5E_g can knock an electron out of a covalent bond when it collides, creating a new electron–hole pair. The new carriers are accelerated too and do the same: an **avalanche**. This causes **avalanche breakdown** of junctions (Week 10) and is used deliberately in avalanche photodiodes.\n3. **Hot-carrier injection** into the gate oxide of MOSFETs. Near the drain, some electrons gain enough energy (over 3.1 eV) to jump over the Si/SiO₂ barrier into the oxide, where they get trapped or create defects. The threshold voltage slowly shifts and the transistor degrades over months or years: a key **reliability** problem.\n4. **Substrate current** from holes created by impact ionisation, which can trigger unwanted bipolar action or latch-up in CMOS.\n5. **Velocity overshoot** in very short devices, where carriers cross before they have time to reach v_sat, briefly going faster.\n\n**Cures:** the **lightly doped drain (LDD)** structure, which spreads the voltage drop and lowers the peak field; lower supply voltages; better oxides.\n\n## Part B: Generation and recombination\n\n### Equilibrium and excess carriers\n\nIn thermal equilibrium, electron–hole pairs are being created (**generated**) by heat and destroyed (**recombined**) all the time, at exactly equal rates. That balance is what keeps n₀p₀ = n_i².\n\nNow shine light on the sample, or inject carriers through a junction. We get **excess carriers**:\n\n    n = n₀ + Δn,     p = p₀ + Δp\n\nLight creates electrons and holes in pairs, so usually Δn = Δp. Now np > n_i², recombination is faster than generation, and the extras start disappearing.\n\n**Low-level injection** means the excess is much smaller than the majority concentration (Δp ≪ n₀ in n-type). Then:\n\n- the **majority** concentration hardly changes;\n- the **minority** concentration may change enormously.\n\n#### Example 8.1: what low-level injection does to each carrier\n\n**Question.** n-type silicon with N_D = 1×10¹⁶ cm⁻³ (so p₀ = 1×10⁴ cm⁻³) is illuminated, creating Δn = Δp = 1×10¹⁴ cm⁻³ excess carriers. Calculate the new electron and hole concentrations and the factor by which each has changed.\n\n**Given:** n₀ = 1×10¹⁶ cm⁻³, p₀ = 1×10⁴ cm⁻³, Δn = Δp = 1×10¹⁴ cm⁻³.\n\n**Find:** n, p and their change factors.\n\n**Solution.**\n\n    n = n₀ + Δn = 1×10¹⁶ + 1×10¹⁴ = 1.01×10¹⁶ cm⁻³   (n/n₀ = 1.01)\n\n    p = p₀ + Δp = 1×10⁴ + 1×10¹⁴ ≈ 1×10¹⁴ cm⁻³      (p/p₀ = 10¹⁰)\n\n**Answer:** **The electrons change by only 1 %; the holes increase ten-billion-fold.** This is why minority carriers control device behaviour: they are the ones that change.\n\n### How carriers are generated\n\n1. **Thermal generation:** heat breaks a bond. Usually it happens in two small steps through a defect level in the gap, which is easier than one big jump.\n2. **Optical generation:** a photon with energy hν ≥ E_g is absorbed and creates a pair. This is how photodiodes and solar cells work.\n3. **Impact ionisation:** a hot carrier creates a pair (above).\n4. **Tunnelling** across the gap at extremely high fields (Zener effect).\n\n### How carriers recombine\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 640 232\" role=\"img\" aria-label=\"Three recombination paths: direct band-to-band with photon emission, two-step recombination through a mid-gap trap, and Auger recombination giving energy to a third carrier\" style=\"width:640px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"20.0\" y1=\"50.0\" x2=\"600.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"20.0\" y1=\"170.0\" x2=\"600.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><rect x=\"20.0\" y=\"26.0\" width=\"580.0\" height=\"24.0\" rx=\"0\" style=\"fill:none;stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"20.0\" y=\"170.0\" width=\"580.0\" height=\"20.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><text x=\"606.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"606.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><circle cx=\"110.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"110.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"110.0\" y1=\"48.0\" x2=\"110.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><path d=\"M118,110 q6,-8 12,0 t12,0 t12,0 t12,0\" style=\"fill:none;stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-linejoin=\"round\" marker-end=\"url(#ars)\"/><text x=\"144.0\" y=\"100.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">hν ≈ E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"125.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">band-to-band (radiative)</text><text x=\"125.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">GaAs, LEDs, lasers</text><line x1=\"280.0\" y1=\"110.0\" x2=\"340.0\" y2=\"110.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2.4\" opacity=\"1.0\"/><text x=\"344.0\" y=\"114.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">t</tspan><tspan dy=\"-0.32em\">​</tspan></text><circle cx=\"296.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"324.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"296.0\" y1=\"48.0\" x2=\"296.0\" y2=\"106.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><line x1=\"324.0\" y1=\"114.0\" x2=\"324.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><text x=\"290.0\" y=\"84.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">1</text><text x=\"330.0\" y=\"146.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">2</text><text x=\"310.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">Shockley–Read–Hall (trap)</text><text x=\"310.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">Si; energy to phonons</text><circle cx=\"484.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"484.0\" cy=\"178.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"516.0\" cy=\"42.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><line x1=\"484.0\" y1=\"48.0\" x2=\"484.0\" y2=\"166.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\" marker-end=\"url(#ar)\"/><path d=\"M516,38 q4,-10 0,-18\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\" opacity=\"1.0\" stroke-linejoin=\"round\" marker-end=\"url(#ar)\"/><text x=\"522.0\" y=\"26.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">third carrier kicked up</text><text x=\"500.0\" y=\"210.0\" text-anchor=\"middle\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">Auger</text><text x=\"500.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">high carrier density</text></svg><figcaption>The three recombination paths. Band-to-band: the electron drops straight across and emits a photon. Shockley–Read–Hall: it drops in two steps via a trap in the gap, giving heat. Auger: the energy is handed to a third carrier.</figcaption></figure>\n```\n\n1. **Direct (band-to-band, radiative).** An electron drops straight from the conduction band into a hole and emits a photon of energy ≈ E_g. Rate = B·np. Strong in direct-gap GaAs (LEDs, lasers); very weak in indirect-gap Si (Week 4).\n2. **Indirect (trap-assisted, Shockley–Read–Hall, SRH).** The electron drops in two steps through a **trap**, a localised energy level in the gap created by a defect or an impurity atom such as gold, iron or copper. The energy goes into lattice vibrations (heat). **This is the dominant mechanism in silicon.**\n3. **Auger.** The energy released is given to a third carrier, which is kicked high into its band and then cools down. Important at very high carrier densities.\n4. **Surface recombination:** SRH through the many traps at a surface (Week 9).\n\n### Shockley–Read–Hall recombination: how it works\n\nPicture a trap level E_t in the middle of the gap. It can be empty or hold one electron. Four things can happen to it:\n\n| Step | What happens | Result |\n|---|---|---|\n| 1. Electron capture | A conduction-band electron falls into the empty trap | Trap now full |\n| 2. Electron emission | The trapped electron is shaken back up into the conduction band | Trap empty again |\n| 3. Hole capture | The trapped electron drops down into the valence band, filling a hole | A hole disappears; trap empty |\n| 4. Hole emission | A valence-band electron jumps up into the empty trap | A hole appears; trap full |\n\n**Recombination** = step 1 then step 3: an electron and a hole have both disappeared, via the trap. **Generation** = step 4 then step 2: an electron and a hole have both been created.\n\n> **In plain words.** It is much easier to go down a staircase two steps at a time than to jump the whole flight. A trap in the middle of the gap is a landing half-way down. That is why a few impurity atoms can make recombination enormously faster.\n\nWorking out the balance of the four steps gives the **SRH recombination rate**:\n\n    U = (np − n_i²) / [ τ_p(n + n₁) + τ_n(p + p₁) ]\n\n    τ_n = 1/(σ_n v_th N_t),   τ_p = 1/(σ_p v_th N_t)\n    n₁ = n_i e^{(E_t − E_i)/kT},   p₁ = n_i e^{(E_i − E_t)/kT}\n\n| Symbol | Meaning |\n|---|---|\n| U | net recombination rate (pairs per cm³ per second) |\n| N_t | trap density (cm⁻³) |\n| σ_n, σ_p | capture cross-sections: how \"big a target\" the trap is for electrons, holes (cm²) |\n| v_th | thermal velocity, about 10⁷ cm/s |\n| E_t | trap energy level |\n\n**What the formula tells you:**\n\n1. **The top line, np − n_i², is the driving force.** If np > n_i² (extra carriers), U is positive: net recombination. If np < n_i² (carriers removed, as in a reverse-biased depletion region), U is negative: net **generation**, which is the source of diode leakage current. In equilibrium, np = n_i² and U = 0.\n2. **U is largest when E_t is near mid-gap.** Traps near a band edge just catch and re-release carriers. **Mid-gap traps are the effective recombination centres.** Gold sits close to mid-gap, which is why it is used deliberately to make fast-switching diodes.\n3. **More traps, faster recombination:** τ ∝ 1/N_t.\n4. **Low-level injection in n-type** (n ≫ p): the formula simplifies to\n\n    U ≈ Δp / τ_p\n\n   The recombination rate is set by how fast the **minority** carriers (holes) get captured.\n\n#### Example 8.2: lifetime from the trap density\n\n**Question.** An n-type silicon wafer contains 1×10¹³ cm⁻³ mid-gap recombination centres with a hole capture cross-section of 1×10⁻¹⁵ cm². The thermal velocity is 1×10⁷ cm/s. Calculate the minority-carrier (hole) lifetime.\n\n**Given:** N_t = 1×10¹³ cm⁻³, σ_p = 1×10⁻¹⁵ cm², v_th = 1×10⁷ cm/s.\n\n**Find:** τ_p.\n\n**Solution.**\n\n    τ_p = 1/(σ_p v_th N_t) = 1 / (10⁻¹⁵ × 10⁷ × 10¹³) = 1/10⁵ = 1×10⁻⁵ s\n\n**Answer:** **τ_p = 10 μs.** Doubling the trap density would halve the lifetime.\n\n## Part C: Lifetime and steady-state injection\n\n### Minority-carrier lifetime\n\nSwitch off the light at t = 0. With U = Δp/τ_p, the excess holes decay as\n\n    dΔp/dt = −Δp/τ_p   ⇒   Δp(t) = Δp(0) e^{−t/τ_p}\n\nτ_p is the **minority-carrier lifetime**: the average time an extra minority carrier survives before it recombines. After one lifetime, 37 % (1/e) of the excess remains; after five lifetimes, under 1 %.\n\nTypical values: very pure Si, 1 μs to 1 ms; gold-doped Si for fast switching, 1–10 ns; GaAs, 1–10 ns (fast radiative recombination).\n\nIf several mechanisms act together, their rates add: 1/τ = 1/τ_SRH + 1/τ_radiative + 1/τ_{Auger}.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 195\" role=\"img\" aria-label=\"Excess carrier density held constant under illumination, then decaying exponentially after the light is switched off, reaching one over "72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text></svg><figcaption>Under steady illumination the excess holds at Δp = G<sub>L</sub>τ<sub>p</sub>. When the light is switched off it decays exponentially, falling to 1/e in one lifetime.</figcaption></figure>\n```\n\n### Steady-state excess carrier injection\n\nNow keep the light on, generating G_L pairs per cm³ per second uniformly. The excess builds up until recombination exactly balances generation:\n\n    dΔp/dt = G_L − Δp/τ_p = 0   ⇒   Δp = Δn = G_Lτ_p\n\n**The excess equals the generation rate times the lifetime.** A long lifetime lets a large excess build up.\n\nThe extra carriers raise the conductivity, called **photoconductivity**:\n\n    Δσ = q(μ_n + μ_p) Δn = q(μ_n + μ_p) G_Lτ\n\n#### Example 8.3: photoconductivity\n\n**Question.** n-type silicon with N_D = 1×10¹⁵ cm⁻³ and τ_p = 10 μs is uniformly illuminated, generating G_L = 1×10²⁰ electron–hole pairs per cm³ per second. Calculate the steady-state excess carrier concentration, the increase in conductivity, and compare it with the dark conductivity.\n\n**Given:** N_D = 1×10¹⁵ cm⁻³, τ_p = 10 μs = 1×10⁻⁵ s, G_L = 1×10²⁰ cm⁻³s⁻¹, μ_n = 1350, μ_p = 480 cm²/V·s.\n\n**Find:** Δn, Δσ and σ₀.\n\n**Solution.**\n\nStep 1. Steady state, generation = recombination:\n\n    Δn = Δp = G_Lτ_p = 10²⁰ × 10⁻⁵ = 1×10¹⁵ cm⁻³\n\nStep 2. Extra conductivity:\n\n    Δσ = q(μ_n + μ_p)Δn = 1.6×10⁻¹⁹ × (1350 + 480) × 10¹⁵ = 0.293 S/cm\n\nStep 3. Dark conductivity:\n\n    σ₀ = qN_Dμ_n = 1.6×10⁻¹⁹ × 10¹⁵ × 1350 = 0.216 S/cm\n\n**Answer:** **Δn = 10¹⁵ cm⁻³, Δσ = 0.293 S/cm, against σ₀ = 0.216 S/cm**: the conductivity more than doubles in the light.\n\nThis is how a light-dependent resistor works. (Here Δp equals n₀, so this is not low-level injection, and the single-lifetime formula is only approximate.)\n\n### Quasi-Fermi levels\n\nOut of equilibrium, np ≠ n_i², so a single Fermi level cannot describe both carriers. Instead we use **two**: one for electrons, E_{Fn}, and one for holes, E_{Fp}:\n\n    n = n_i e^{(E_{Fn} − E_i)/kT},     p = n_i e^{(E_i − E_{Fp})/kT},     np = n_i² e^{(E_{Fn} − E_{Fp})/kT}\n\nThe **gap between them**, E_{Fn} − E_{Fp}, measures how far from equilibrium the material is. In a forward-biased diode it equals qV; in a solar cell it sets the open-circuit voltage. In equilibrium they merge back into one Fermi level.\n\n## Key points of Week 8\n\n- At high fields drift velocity saturates at v_sat ≈ 10⁷ cm/s (optical-phonon emission).\n- Hot carriers cause impact ionisation (avalanche) and oxide damage in MOSFETs; LDD reduces them.\n- Excess carriers: n = n₀ + Δn. Under low-level injection only the minority concentration changes much.\n- Recombination: band-to-band (light, GaAs), SRH via traps (heat, dominant in Si), Auger (high density).\n- SRH rate U = (np − n_i²)/[τ_p(n + n₁) + τ_n(p + p₁)]: mid-gap traps are most effective; τ = 1/(σv_thN_t).\n- Low-level n-type: U = Δp/τ_p; after switch-off Δp(t) = Δp(0)e^{−t/τ_p}; under steady light Δp = G_Lτ_p.\n\n---\n\n## Examination questions solved (Q41–Q44)\n\n### Q41. Explain velocity saturation and hot-carrier effects in semiconductors.\n\n**Velocity saturation.** At low fields, drift velocity is proportional to the field, v_d = μE, because carriers lose the energy they gain from the field to the lattice (acoustic phonons) and stay near thermal equilibrium. As the field increases (above about 10³–10⁴ V/cm in Si), carriers gain energy faster than acoustic-phonon scattering can remove it. Once their energy reaches the optical-phonon energy (≈ 0.063 eV in Si), they emit optical phonons very rapidly, which transfers energy to the lattice efficiently and limits further gain. The drift velocity therefore stops increasing and approaches a **saturation velocity**:\n\n    v_sat ≈ 10⁷ cm/s  (Si, 300 K)\n\nand is described empirically by v_d = μE/[1 + (μE/v_sat)^β]^{1/β}. The effective mobility v_d/E falls at high field. In GaAs the electron velocity peaks at about 2×10⁷ cm/s then decreases (negative differential mobility) because electrons transfer to the heavier L-valley.\n\n**Consequences:** in short-channel MOSFETs the drain current becomes proportional to (V_GS − V_T) rather than (V_GS − V_T)², and the maximum transconductance and transit-time-limited speed are set by v_sat: f_T ≈ v_sat/(2πL).\n\n**Hot-carrier effects.** Under high fields, carriers acquire an average kinetic energy far greater than the thermal value (3/2)kT; they are described by an effective electron temperature T_e ≫ T. These \"hot\" carriers cause:\n\n1. **Impact ionisation**: carriers with energy above about 1.5E_g break bonds and create electron–hole pairs, leading to avalanche multiplication and **avalanche breakdown** of junctions.\n2. **Hot-carrier injection into gate oxides**: hot electrons near the drain of a MOSFET surmount the 3.1 eV Si/SiO₂ barrier, become trapped in the oxide or create interface traps. The threshold voltage shifts and transconductance degrades over the device's life (hot-carrier degradation).\n3. **Substrate and gate currents**: impact-generated holes flow to the substrate, which can forward-bias source junctions and trigger parasitic bipolar action or CMOS latch-up.\n4. **Velocity overshoot**: in very short channels carriers transit before scattering brings them to steady state, briefly exceeding v_sat.\n5. **Increased noise and light emission.**\n\n**Mitigation:** lightly doped drain (LDD) structures to reduce the peak field, reduced supply voltage, graded junctions, and nitrided or hardened gate oxides.\n\n### Q42. What is meant by generation and recombination of charge carriers?\n\n**Generation** is any process that creates free electron–hole pairs (or a free carrier from a dopant or trap) by giving an electron enough energy to move from the valence band (or a localised state) into the conduction band. The rate G is the number of pairs created per unit volume per unit time (cm⁻³s⁻¹). Mechanisms:\n\n- **Thermal generation** by lattice vibrations, directly or through trap levels in the gap.\n- **Optical generation** by absorption of photons with hν ≥ E_g (photodetectors, solar cells).\n- **Impact ionisation** by energetic carriers in high fields (avalanche).\n- **Tunnelling** generation at very high fields (Zener).\n\n**Recombination** is the reverse: a conduction-band electron falls back to the valence band and fills a hole, so both carriers are annihilated. The released energy E_g appears as a photon, as heat (phonons), or as kinetic energy of a third carrier. The rate R has the same units. Mechanisms:\n\n- **Direct (band-to-band, radiative)** recombination, emitting a photon; dominant in direct-gap materials.\n- **Indirect (trap-assisted, SRH)** recombination through defect or impurity levels in the gap, releasing heat; dominant in Si.\n- **Auger** recombination, energy given to a third carrier; dominant at high carrier density.\n- **Surface** recombination through surface states.\n\n**Equilibrium and non-equilibrium.** In thermal equilibrium the two processes balance (G_th = R_th), giving n₀p₀ = n_i². If excess carriers are introduced (np > n_i²), net recombination U = R − G > 0 restores equilibrium; if carriers are removed (np < n_i², e.g. a reverse-biased depletion region), net generation occurs. For low-level injection the net recombination rate is U = Δp/τ_p (n-type), where τ_p is the minority-carrier lifetime.\n\nGeneration and recombination govern the leakage current of diodes, the operation of solar cells, LEDs and photodetectors, the gain of BJTs and the switching speed of p-n junctions.\n\n### Q43. Explain the Shockley-Read-Hall (SRH) recombination mechanism.\n\n**Principle.** SRH (trap-assisted or indirect) recombination occurs through localised energy levels E_t in the forbidden gap introduced by crystal defects or impurities (e.g. Au, Fe, Cu, vacancies, dislocations). Instead of crossing the whole gap in one step, which in an indirect semiconductor requires an unlikely phonon-assisted transition, the electron makes two smaller steps via the trap, and the energy is released as lattice vibrations (phonons).\n\n**The four processes** at a trap (density N_t, occupation probability f_t):\n\n| Process | Description | Rate |\n|---|---|---|\n| (a) Electron capture | CB electron captured by an empty trap | r_a = v_thσ_n n N_t(1 − f_t) |\n| (b) Electron emission | Trapped electron emitted to CB | r_b = e_n N_t f_t |\n| (c) Hole capture | Trapped electron drops to VB, annihilating a hole | r_c = v_thσ_p p N_t f_t |\n| (d) Hole emission | VB electron captured by empty trap, leaving a hole | r_d = e_p N_t(1 − f_t) |\n\n**Recombination** = (a) then (c). **Generation** = (d) then (b).\n\n**Derivation outline.** In steady state the trap occupation is constant, so the net electron capture rate equals the net hole capture rate: r_a − r_b = r_c − r_d = U. The emission coefficients follow from detailed balance in equilibrium: e_n = v_thσ_n n₁ and e_p = v_thσ_p p₁. Solving for f_t and substituting gives:\n\n    U = (np − n_i²) / [ τ_p(n + n₁) + τ_n(p + p₁) ]\n\nwith τ_n = 1/(σ_n v_th N_t), τ_p = 1/(σ_p v_th N_t), n₁ = n_i e^{(E_t − E_i)/kT}, p₁ = n_i e^{(E_i − E_t)/kT}.\n\n**Interpretation.**\n\n1. The driving force is (np − n_i²): positive for excess carriers (recombination), negative for depletion (generation), zero in equilibrium.\n2. U is maximum when E_t is near mid-gap (E_t ≈ E_i). Shallow levels near a band edge just re-emit carriers and are ineffective. **Deep, mid-gap levels are the effective recombination centres.**\n3. U ∝ N_t: more traps give faster recombination and shorter lifetime.\n4. For low-level injection in n-type material (n ≫ p, n₁, p₁): U = (p − p₀)/τ_p = Δp/τ_p. The rate is limited by capture of the minority carrier.\n5. In a reverse-biased depletion region (n, p ≈ 0): U = −n_i/(τ_p + τ_n) ≈ −n_i/2τ₀, a net generation that produces the generation leakage current J_gen = qn_iW/2τ₀.\n\n**Applications:** gold or platinum doping, or electron irradiation, is deliberately used to reduce lifetime in fast-switching diodes and thyristors. Conversely, gettering and clean processing reduce trap densities for long lifetimes in solar cells, CCDs and low-leakage devices.\n\n### Q44. Define minority-carrier lifetime and explain its significance in semiconductor devices.\n\n**Definition.** The minority-carrier lifetime is the average time an excess minority carrier exists in a semiconductor before it recombines with a majority carrier. For low-level injection, τ_p (holes in n-type) or τ_n (electrons in p-type) is defined by\n\n    U = Δp / τ_p\n\nso that, when generation stops, the excess density decays exponentially:\n\n    Δp(t) = Δp(0) e^{−t/τ_p}\n\nτ_p is the time for the excess to fall to 1/e (37 %) of its initial value. With SRH recombination, τ_p = 1/(σ_p v_th N_t): lifetime is inversely proportional to the trap density. Typical values: 1 ns to 1 ms in Si depending on purity.\n\n**Significance:**\n\n1. **Diffusion length.** Injected minority carriers diffuse an average distance L = √(Dτ) before recombining. In Si with D_p = 12 cm²/s and τ_p = 1 μs, L_p = √(12 × 10⁻⁶) = 35 μm. L determines how far carriers travel and therefore device dimensions.\n2. **Diode current.** The saturation current J_s = qn_i²(D_p/(L_pN_D) + D_n/(L_nN_A)) depends on lifetime through L. Short lifetime raises leakage; generation current in the depletion region is ∝ 1/τ.\n3. **Switching speed.** When a forward-biased diode is turned off, the stored minority charge Q = Iτ must be removed; the reverse-recovery time is ≈ τ. Fast-recovery and switching diodes are gold- or platinum-doped to cut τ to nanoseconds.\n4. **BJT current gain.** Electrons injected into a p-type base must cross it before recombining. The base transport factor ≈ 1 − W_B²/2L_n², so long lifetime (L_n ≫ W_B) gives high β.\n5. **Solar cells and photodetectors.** Photogenerated carriers must reach the junction before recombining; long lifetime (long L) means higher collection efficiency, current and efficiency.\n6. **LEDs and lasers.** The radiative fraction of recombination, and the modulation speed (bandwidth ∝ 1/τ), depend on lifetime.\n7. **Power devices.** In p-i-n diodes and IGBTs, long lifetime gives conductivity modulation and low on-state voltage but slow switching; there is a design trade-off.\n8. **Material quality indicator.** Lifetime is very sensitive to metallic contamination, so it is measured (photoconductive decay, μ-PCD) to monitor crystal growth and process cleanliness.\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 8.1: when does velocity saturate?\n\n**Question.** Estimate the field at which electron drift in silicon starts to saturate (μ_n = 1350 cm²/V·s, v_sat = 1×10⁷ cm/s). Is a 100 nm MOSFET channel with 1 V across it saturated?\n\n**Given:** μ_n = 1350 cm²/V·s, v_sat = 10⁷ cm/s, V = 1 V over L = 100 nm = 10⁻⁵ cm.\n\n**Find:** E where μE = v_sat; the channel field.\n\n**Solution.**\n\n    E_sat ≈ v_sat/μ_n = 10⁷/1350 = 7.4×10³ V/cm\n    Channel field ≈ V/L = 1/10⁻⁵ = 10⁵ V/cm\n\n**Answer:** **E_sat ≈ 7.4 kV/cm; the channel field (100 kV/cm) is over ten times larger, so the carriers are fully velocity-saturated.**\n\n#### Practice 8.2: gold as a lifetime killer\n\n**Question.** A switching diode is doped with 1×10¹⁵ cm⁻³ gold atoms (σ = 1×10⁻¹⁵ cm², v_th = 1×10⁷ cm/s). Find the minority-carrier lifetime.\n\n**Given:** N_t = 10¹⁵ cm⁻³, σ = 10⁻¹⁵ cm², v_th = 10⁷ cm/s.\n\n**Find:** τ.\n\n**Solution.**\n\n    τ = 1/(σv_thN_t) = 1/(10⁻¹⁵ × 10⁷ × 10¹⁵) = 10⁻⁷ s\n\n**Answer:** **τ = 100 ns**, short enough for a fast-recovery diode.\n\n#### Practice 8.3: how long until the excess is gone?\n\n**Question.** After the light is switched off, excess holes in n-type silicon decay with τ_p = 5 μs. How long does it take for the excess to fall to 1 % of its initial value?\n\n**Given:** τ_p = 5 μs, Δp(t)/Δp(0) = 0.01.\n\n**Find:** t.\n\n**Solution.**\n\n    e^{−t/τ} = 0.01   ⇒   t = τ ln(100) = 5 μs × 4.61 = 23 μs\n\n**Answer:** **t ≈ 23 μs (about 4.6 lifetimes).**\n\n#### Practice 8.4: steady-state injection level\n\n**Question.** n-type silicon (N_D = 1×10¹⁶ cm⁻³, τ_p = 20 μs) is uniformly illuminated with G_L = 5×10¹⁹ cm⁻³s⁻¹. Find Δp and decide whether this is low-level injection.\n\n**Given:** G_L = 5×10¹⁹ cm⁻³s⁻¹, τ_p = 2×10⁻⁵ s, N_D = 10¹⁶ cm⁻³.\n\n**Find:** Δp and Δp/n₀.\n\n**Solution.**\n\n    Δp = G_Lτ_p = 5×10¹⁹ × 2×10⁻⁵ = 1×10¹⁵ cm⁻³\n    Δp/n₀ = 10¹⁵/10¹⁶ = 0.1\n\n**Answer:** **Δp = 10¹⁵ cm⁻³, 10 % of n₀**: borderline but usually treated as low-level injection.\n\n#### Practice 8.5: quasi-Fermi level splitting\n\n**Question.** n-type silicon with N_D = 1×10¹⁶ cm⁻³ is illuminated so that Δn = Δp = 1×10¹⁴ cm⁻³. Find E_Fn − E_i, E_i − E_Fp and the splitting E_Fn − E_Fp at 300 K.\n\n**Given:** n = 1.01×10¹⁶, p ≈ 10¹⁴ cm⁻³, n_i = 10¹⁰ cm⁻³, kT = 0.0259 eV.\n\n**Find:** the quasi-Fermi levels and their splitting.\n\n**Solution.**\n\n    E_{Fn} − E_i = kT ln(n/n_i) = 0.0259 ln(1.01×10⁶) = 0.358 eV\n    E_i − E_{Fp} = kT ln(p/n_i) = 0.0259 ln(10⁴) = 0.239 eV\n    E_{Fn} − E_{Fp} = 0.358 + 0.239 = 0.597 eV\n\n**Answer:** **E_{Fn} = E_i + 0.358 eV, E_{Fp} = E_i − 0.239 eV, splitting ≈ 0.60 eV.** The electron level hardly moves; the hole level moves a long way.\n\n#### Practice 8.6: generation current in a depletion region\n\n**Question.** A reverse-biased silicon junction has a depletion width of 1 μm, area 10⁻³ cm² and effective lifetime τ₀ = 1 μs. Estimate the generation leakage current, J_gen = qn_iW/2τ₀.\n\n**Given:** W = 10⁻⁴ cm, A = 10⁻³ cm², τ₀ = 10⁻⁶ s, n_i = 10¹⁰ cm⁻³.\n\n**Find:** J_gen and I_gen.\n\n**Solution.**\n\n    J_gen = qn_iW/(2τ₀) = 1.6×10⁻¹⁹ × 10¹⁰ × 10⁻⁴ / (2×10⁻⁶) = 8×10⁻⁸ A/cm²\n    I_gen = J_genA = 8×10⁻¹¹ A\n\n**Answer:** **J_gen = 8×10⁻⁸ A/cm², I_gen = 80 pA.** In silicon this generation current usually exceeds the ideal diffusion leakage.\n\n#### Practice 8.7: Auger versus SRH\n\n**Question.** Explain why Auger recombination is important in heavily doped emitters but not in lightly doped bulk silicon.\n\n**Answer.** Auger recombination needs three carriers to meet (the recombining electron and hole plus a third carrier that takes the energy), so its rate grows as n²p or np², much faster than SRH, which grows only linearly with the excess. In lightly doped silicon carrier densities are low and three-carrier encounters are rare, so SRH dominates. In emitters doped to 10¹⁹–10²⁰ cm⁻³ the majority density is enormous, Auger becomes the fastest path and it limits the minority-carrier lifetime.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Explain velocity saturation and its effect on devices. | What is the saturation velocity in Si and what causes it? | About 10⁷ cm/s; optical-phonon emission by energetic carriers. | Velocity saturation |\n| 2 | Explain hot-carrier effects and how they are reduced. | How does a hot carrier cause avalanche breakdown? | It impact-ionises, creating new pairs that are accelerated and do the same. | Hot-carrier effects |\n| 3 | Explain excess carriers and low-level injection. | Under low-level injection in n-type material, which carrier concentration changes significantly? | The minority (hole) concentration. | Equilibrium and excess carriers; Example 8.1 |\n| 4 | Describe the generation and recombination mechanisms. | Which recombination mechanism dominates in silicon? | Shockley–Read–Hall (trap-assisted). | Generation; recombination |\n| 5 | Explain SRH recombination and calculate lifetime from trap data. | Why are mid-gap traps the most effective recombination centres? | They capture electrons and holes with similar ease; shallow traps just re-emit carriers. | SRH; Example 8.2 |\n| 6 | Calculate decay of excess carriers and steady-state injection levels. | With G_L = 10¹⁹ cm⁻³s⁻¹ and τ = 2 μs, find Δp. | Δp = G_Lτ = 2×10¹³ cm⁻³. | Part C; Example 8.3 |\n", "group": "Module 3 · Carrier Transport & Injection Phenomena", "eyebrow": "Week 8", "disp": "08"}, {"num": "09", "title": "Continuity Equation and Surface Phenomena", "body": "\n**Plan:** derivation and application of the minority-carrier continuity equation; semiconductor surface states and surface recombination velocity.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Derive the continuity equation for holes and electrons.\n2. Write and interpret the minority-carrier diffusion equation.\n3. Solve the diffusion equation for the standard cases.\n4. Calculate diffusion lengths and explain their importance.\n5. Explain surface states and surface recombination velocity.\n6. Calculate the effective lifetime of a wafer with recombining surfaces.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| R_p | Projected range: average depth at which implanted ions stop | μm |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| v_th | Thermal velocity of carriers | ≈ 10⁷ cm/s at 300 K |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| G, G_L | Generation rate of electron–hole pairs (G_L: by light) | cm⁻³s⁻¹ |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| U | Net recombination rate, R − G | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| σ_n, σ_p | Capture cross-section of a trap for electrons, holes | cm² |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| S | Surface recombination velocity | cm/s |\n| N_st | Density of surface traps | cm⁻² |\n| U_s | Recombination rate per unit area at a surface | cm⁻²s⁻¹ |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| x_n, x_p | Parts of the depletion region on the n side and on the p side | μm |\n| A (area) | Device or contact area | cm² |\n| N_E, W_E, D_E; N_B, W_B, D_B | Doping, width and minority diffusion coefficient of the emitter; of the base | cm⁻³; μm; cm²/s |\n| G_th, R_th | Thermal generation and recombination rates (equal in equilibrium) | cm⁻³s⁻¹ |\n| G_n, G_p, R_n, R_p | Generation and recombination rates of electrons and holes | cm⁻³s⁻¹ |\n| τ_b (τ_bulk), τ_surface | Lifetime from bulk recombination only; from surface recombination only | s |\n| U_s, p_s, Δp_s | Surface recombination rate; hole density and excess at the surface | cm⁻²s⁻¹; cm⁻³ |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| SRH | Shockley–Read–Hall (trap-assisted) recombination |\n| MOS | Metal–oxide–semiconductor |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| BJT | Bipolar junction transistor |\n| TCAD | Technology computer-aided design (device simulation software) |\n\n\n## The big picture\n\nWeeks 7 and 8 gave us all the separate pieces: carriers **flow** (drift and diffusion), and carriers are **created and destroyed** (generation and recombination). The **continuity equation** puts the pieces together into one equation.\n\nIt is nothing more than **book-keeping**, like a bank account:\n\n    change in balance = money in − money out + interest earned − charges paid\n\nFor carriers in a small slice of semiconductor:\n\n    change in carriers = carriers flowing in − carriers flowing out + carriers generated − carriers recombined\n\nSolve this equation and you know where the carriers are and how they change with time. That is how we will get the diode equation in Week 10 and the transistor currents in Week 13.\n\nThe second half of the week is about **surfaces**, where the crystal ends and carriers get lost much faster than inside.\n\n## Deriving the continuity equation\n\nTake a thin slice of semiconductor between x and x + dx, with cross-section area A. Count the holes in it. The number changes for three reasons:\n\n1. **Flow.** Holes enter at x carried by the current J_p(x), and leave at x + dx carried by J_p(x + dx). Dividing a current by q turns it into a number of carriers per second, so the net inflow is [J_p(x) − J_p(x + dx)]A/q.\n2. **Generation** inside the slice: G_p per cm³ per second, times the volume A dx.\n3. **Recombination** inside the slice: R_p per cm³ per second, times A dx.\n\nSo:\n\n    (rate of change of p) × A dx = [J_p(x) − J_p(x + dx)] A/q + (G_p − R_p) A dx\n\nDivide by A dx. As dx → 0, [J_p(x) − J_p(x + dx)]/dx becomes −∂J_p/∂x:\n\n    ∂p/∂t = −(1/q) ∂J_p/∂x + G_p − R_p\n\nFor electrons the sign of the flow term is opposite, because the electron charge is negative:\n\n    ∂n/∂t = +(1/q) ∂J_n/∂x + G_n − R_n\n\n**Reading it.** If more current flows into the slice than out of it (current decreasing with x), carriers pile up. If generation beats recombination, carriers build up. Otherwise they fall.\n\n## The minority-carrier diffusion equation\n\nNow apply it to the case that matters most: **holes as minority carriers in an n-type region**, with low-level injection.\n\n- From Week 7, the hole current is J_p = qpμ_pE − qD_p ∂p/∂x.\n- From Week 8, the net recombination is Δp/τ_p.\n- In a neutral region of a device the field is small, so the drift term can usually be dropped.\n\nSubstituting gives the **minority-carrier diffusion equation**:\n\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − Δp/τ_p + G_L\n\n| Term | Meaning |\n|---|---|\n| ∂Δp/∂t | how fast the excess changes at this point |\n| D_p ∂²Δp/∂x² | diffusion: carriers spread from where there are more to where there are fewer |\n| −Δp/τ_p | recombination: excess carriers die off with lifetime τ_p |\n| G_L | external generation, e.g. by light |\n\n(If there is a field, add −μ_pE ∂Δp/∂x for drift.) For electrons in p-type: ∂Δn/∂t = D_n ∂²Δn/∂x² − Δn/τ_n + G_L.\n\n### The four standard solutions\n\n| Situation | Equation becomes | Solution |\n|---|---|---|\n| Uniform sample, light switched off at t = 0 | dΔp/dt = −Δp/τ_p | Δp(t) = Δp(0) e^{−t/τ_p} (exponential decay in time) |\n| Uniform sample, steady light | 0 = G_L − Δp/τ_p | Δp = G_Lτ_p |\n| Steady injection at x = 0 into a long sample | 0 = D_p d²Δp/dx² − Δp/τ_p | Δp(x) = Δp(0) e^{−x/L_p} (exponential decay in space) |\n| Steady injection into a short sample, W ≪ L_p | d²Δp/dx² ≈ 0 | Δp(x) = Δp(0)(1 − x/W), a straight line |\n\n### The diffusion length\n\nThe third case introduces the **diffusion length**:\n\n    L_p = √(D_p τ_p),     L_n = √(D_n τ_n)\n\nIt is the average distance an injected minority carrier diffuses before it recombines. The excess falls to 1/e (37 %) at one diffusion length, and to under 1 % at five.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 195\" role=\"img\" aria-label=\"Steady-state excess minority-carrier density decaying exponentially from the injection point with characteristic length L_p\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"60.0\" y1=\"168.0\" x2=\"454.0\" y2=\"168.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"60.0\" y1=\"168.0\" x2=\"60.0\" y2=\"34.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"464.0\" y=\"172.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">x / L<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"65.0\" y=\"30.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">Δp(x)/Δp(0)</text><line x1=\"140.0\" y1=\"164.0\" x2=\"140.0\" y2=\"172.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"140.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><line x1=\"220.0\" y1=\"164.0\" x2=\"220.0\" y2=\"172.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"220.0\" y=\"183.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">2</text><line x1=\"300.0\" y1=\"164.0\" x2=\"300.0\" y2=\"172.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"300.0\" y
