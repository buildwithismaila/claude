1.9,150.3 492.5,150.0 493.0,149.7 493.6,149.3 494.2,149.0 494.8,148.7 495.4,148.4 496.0,148.1 496.6,147.8 497.2,147.5 497.7,147.2 498.3,146.9 498.9,146.7 499.5,146.4 500.1,146.1 500.7,145.9 501.3,145.6 501.8,145.3 502.4,145.1 503.0,144.9 503.6,144.6 504.2,144.4 504.8,144.2 505.4,143.9 505.9,143.7 506.5,143.5 507.1,143.3 507.7,143.1 508.3,142.9 508.9,142.7 509.5,142.6 510.1,142.4 510.6,142.2 511.2,142.1 511.8,141.9 512.4,141.8 513.0,141.6 513.6,141.5 514.2,141.4 514.7,141.2 515.3,141.1 515.9,141.0 516.5,140.9 517.1,140.8 517.7,140.7 518.3,140.6 518.9,140.6 519.4,140.5 520.0,140.4 520.6,140.4 521.2,140.3 521.8,140.3 522.4,140.2 523.0,140.2 523.5,140.2 524.1,140.2 524.7,140.2 525.3,140.2 525.9,140.2 526.5,140.2 527.1,140.2 527.7,140.2 528.2,140.2 528.8,140.3 529.4,140.3 530.0,140.4\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"530.0\" y=\"232.0\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E)\">bars mark allowed bands</text></svg><figcaption>The Kronig–Penney condition plotted against αa for P = 3π/2. Shaded strips are the energies where the curve stays between −1 and +1: the allowed bands. Where the curve goes outside ±1 there are no solutions: the forbidden gaps.</figcaption></figure>\n```\n\n**What the model teaches:**\n\n1. The energy spectrum is a series of **allowed bands separated by forbidden gaps**.\n2. The band edges occur at ka = nπ, i.e. k = ±nπ/a, the **Brillouin-zone boundaries**. Physically, at these wavelengths the electron wave reflects off the rows of atoms (Bragg reflection), forming standing waves, which split the energies and open a gap.\n3. Bands get **wider** at higher energy (the curve's wiggles fade, so it spends longer inside ±1).\n4. If the atoms hold their electrons very tightly (P → ∞), the bands shrink to the sharp levels of single atoms.\n5. If the barriers vanish (P → 0), the gaps close and the electron is free: E = ħ²k²/2m.\n\n> **In plain words.** A wave running through a regular row of obstacles is fine at most wavelengths, but at certain wavelengths the reflections from every row add up and the wave cannot travel. Those wavelengths correspond to the forbidden energies: the band gaps.\n\n## Part B: Band gaps, allowed and forbidden states\n\n### E–k diagrams and effective mass\n\nThe **band structure** of a material is a graph of the allowed energies E against the wave vector k. Near the bottom of the conduction band (and the top of the valence band) the curve looks like a parabola, just like a free electron's E = ħ²k²/2m, but with a different curvature. We describe that curvature by an **effective mass** m∗:\n\n    1/m∗ = (1/ħ²) d²E/dk²\n\nThe electron then responds to forces **as if** it were a free particle of mass m∗. The effect of all the crystal's atoms is packed into this one number.\n\n- A **sharply curved** band means small m∗: a light, fast, high-mobility carrier (GaAs electrons, m∗ = 0.067m₀).\n- A **flatter** band means large m∗: a heavy, slow carrier (Si holes, about 0.56m₀).\n\nNear the **top** of the valence band the curve bends downward. An electron there would have negative mass. It is simpler to describe the **missing** electron instead: it behaves as a positive particle with positive mass, the **hole**.\n\n### Valence band, conduction band and forbidden gap\n\n- **Valence band:** the highest band that is completely full at 0 K. Its top is E_v. Its electrons are the bonding electrons. A full band cannot carry current (for every electron moving one way there is one moving the other), but a band with a few **holes** can.\n- **Conduction band:** the next band up, empty at 0 K. Its bottom is E_c. Electrons here move freely and carry current.\n- **Forbidden gap:** E_g = E_c − E_v. In a perfect crystal there are no states here at all. Impurities and defects can add a few states inside it (donor, acceptor and trap levels).\n\nThe gap shrinks slightly with temperature: for Si, 1.17 eV at 0 K and 1.12 eV at 300 K.\n\n### Direct and indirect band gaps\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"E-k diagrams: in GaAs the band extrema line up at k equals zero; in silicon the conduction-band minimum is displaced in k\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"165.0\" y1=\"204.0\" x2=\"165.0\" y2=\"36.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.4\"/><text x=\"284.0\" y=\"208.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">k</text><text x=\"170.0\" y=\"38.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">E</text><line x1=\"50.0\" y1=\"204.0\" x2=\"280.0\" y2=\"204.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><polyline points=\"50.0,197.3 51.4,195.8 52.9,194.4 54.3,193.0 55.8,191.6 57.2,190.2 58.6,188.9 60.1,187.6 61.5,186.2 62.9,184.9 64.4,183.7 65.8,182.4 67.2,181.2 68.7,179.9 70.1,178.7 71.6,177.5 73.0,176.4 74.4,175.2 75.9,174.1 77.3,172.9 78.8,171.8 80.2,170.8 81.6,169.7 83.1,168.7 84.5,167.6 85.9,166.6 87.4,165.6 88.8,164.7 90.2,163.7 91.7,162.8 93.1,161.8 94.6,160.9 96.0,160.1 97.4,159.2 98.9,158.4 100.3,157.5 101.8,156.7 103.2,155.9 104.6,155.2 106.1,154.4 107.5,153.7 108 3.9,92.4 515.3,93.2 516.8,94.1 518.2,94.9 519.6,95.8 521.1,96.6 522.5,97.5 523.9,98.3 525.4,99.1 526.8,99.9 528.2,100.6 529.7,101.4 531.1,102.1 532.6,102.8 534.0,103.5 535.4,104.1 536.9,104.7 538.3,105.2 539.8,105.7 541.2,106.2 542.6,106.6 544.1,107.0 545.5,107.3 546.9,107.5 548.4,107.7 549.8,107.8 551.2,107.8 552.7,107.8 554.1,107.7 555.6,107.5 557.0,107.2 558.4,106.8 559.9,106.3 561.3,105.8 562.8,105.1 564.2,104.3 565.6,103.4 567.1,102.4 568.5,101.3 569.9,100.1 571.4,98.7 572.8,97.2 574.2,95.6 575.7,93.8 577.1,91.8 578.6,89.8 580.0,87.5\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"551.2\" cy=\"107.8\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"465.0\" cy=\"139.1\" r=\"3.2\" style=\"fill:none;stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\"/><line x1=\"548.2\" y1=\"110.8\" x2=\"470.0\" y2=\"134.1\" style=\"stroke:currentColor\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\" marker-end=\"url(#ar)\"/><text x=\"517.3\" y=\"130.2\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">photon + phonon</text><text x=\"585.0\" y=\"91.7\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">CB</text><text x=\"585.0\" y=\"185.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">VB</text><text x=\"465.0\" y=\"25.0\" text-anchor=\"middle\" font-size=\"12\" style=\"fill:currentColor\" opacity=\".85\">Indirect gap (Si)</text></svg><figcaption>In a direct-gap material (GaAs) the bottom of the conduction band sits directly above the top of the valence band in k. In an indirect-gap material (Si) they are at different k, so an electron dropping across the gap must also change its momentum.</figcaption></figure>\n```\n\nWhen an electron falls from the conduction band to the valence band it must lose energy **and** keep momentum balanced. A photon carries plenty of energy but almost no momentum. So on an E–k diagram, a photon can only make **vertical** jumps.\n\n- **Direct gap** (GaAs, InP, GaN): the conduction-band minimum is directly above the valence-band maximum. The electron can drop straight down and give out a photon. Light emission is fast and efficient: **LEDs and lasers**.\n- **Indirect gap** (Si, Ge): the minimum is at a different k. To drop across, the electron must also get rid of momentum, which needs a **phonon** (a lattice vibration) at the same instant. That is unlikely, so the electron usually loses its energy as heat instead. **Silicon is a poor light emitter.**\n\nThe wavelength of light from a band-to-band transition is\n\n    λ (μm) = 1.24 / E_g (eV)\n\nGaAs: 1.24/1.42 = 0.87 μm (near infrared). Si: 1.24/1.12 = 1.11 μm, which is also the longest wavelength a silicon photodetector can absorb.\n\n## Part C: Intrinsic and extrinsic carrier concentrations\n\nNow that we have bands, we can count carriers. The full method (Fermi–Dirac statistics, density of states) is Week 5. Here are the results you need this week.\n\n### The two key equations\n\nThe number of electrons in the conduction band and holes in the valence band depend on how far the **Fermi level** E_F is from each band edge:\n\n    n = N_c e^{−(E_c − E_F)/kT},       p = N_v e^{−(E_F − E_v)/kT}\n\nN_c and N_v are the **effective densities of states** (Si at 300 K: 2.8×10¹⁹ and 1.04×10¹⁹ cm⁻³). The closer E_F is to E_c, the more electrons; the closer to E_v, the more holes.\n\n### Intrinsic semiconductor\n\nIn pure silicon every free electron came from a broken bond, which also left a hole, so n = p = n_i. Multiply the two equations above; E_F cancels:\n\n    n p = N_c N_v e^{−(E_c − E_v)/kT} = N_c N_v e^{−E_g/kT}\n\nWith n = p = n_i:\n\n    n_i = √(N_c N_v) e^{−E_g/2kT}\n\nFor Si at 300 K, n_i ≈ 1×10¹⁰ cm⁻³. The Fermi level of an intrinsic semiconductor, E_i, is almost exactly at **mid-gap**.\n\n**What controls n_i:** the band gap (exponentially: wider gap, far fewer carriers) and temperature (exponentially: hotter, far more carriers). Ge (0.66 eV) has n_i = 2.4×10¹³; GaAs (1.42 eV) has only about 2×10⁶ cm⁻³.\n\n### The mass-action law\n\nBecause E_F cancelled, the product is the same whether or not the material is doped:\n\n    n p = n_i²\n\n### Extrinsic (doped) semiconductor\n\nWith full ionisation and doping well above n_i:\n\n- **n-type:** n ≈ N_D, p = n_i²/N_D.\n- **p-type:** p ≈ N_A, n = n_i²/N_A.\n- **Both present (compensation):** use the net doping. The exact result from charge neutrality is\n\n    n = (N_D − N_A)/2 + √( ((N_D − N_A)/2)² + n_i² )\n\n#### Example 4.1: how doping shifts both carrier concentrations\n\n**Question.** Silicon at 300 K (n_i = 1×10¹⁰ cm⁻³) is doped with N_D = 1×10¹⁶ cm⁻³. Calculate n and p, and compare each with its intrinsic value.\n\n**Given:** N_D = 1×10¹⁶ cm⁻³, n_i = 1×10¹⁰ cm⁻³.\n\n**Find:** n, p, and the factors n/n_i and n_i/p.\n\n**Solution.**\n\n    n ≈ N_D = 1×10¹⁶ cm⁻³\n\n    p = n_i²/n = 10²⁰/10¹⁶ = 1×10⁴ cm⁻³\n\n    n/n_i = 10¹⁶/10¹⁰ = 10⁶,   n_i/p = 10¹⁰/10⁴ = 10⁶\n\n**Answer:** **n = 10¹⁶ cm⁻³, p = 10⁴ cm⁻³.** Doping raised the electrons a million times above n_i and lowered the holes by the same factor, so np = n_i² still holds.\n\n**Temperature regions (n-type):** at very low temperature the donors are not all ionised (**freeze-out**, n < N_D); over the normal range n ≈ N_D (**extrinsic**); at high temperature n_i overtakes N_D and the material behaves as intrinsic (**intrinsic region**). Week 5 works through these in detail.\n\n## Key points of Week 4\n\n- Electrons are waves; the Schrödinger equation is kinetic + potential = total energy, and only certain energies give acceptable waves.\n- Bringing N atoms together splits each level into N levels, forming bands; between them are forbidden gaps.\n- Kronig–Penney: P sin(αa)/(αa) + cos(αa) = cos(ka). Energies where the left side is between ±1 are allowed (bands); elsewhere forbidden (gaps).\n- Effective mass m∗ describes the band curvature. A missing electron near the top of the valence band acts as a positive hole.\n- Direct gap: photon emission is efficient (GaAs). Indirect gap: a phonon is needed, so emission is poor (Si). λ = 1.24/E_g μm.\n- n_i = √(N_cN_v)e^{−E_g/2kT}; np = n_i²; n ≈ N_D in n-type, p ≈ N_A in p-type.\n\n---\n\n## Examination questions solved (Q22–Q29, Q34)\n\n### Q22. Explain the basic assumptions of the quantum mechanical model of electrons in a semiconductor.\n\n1. **Wave nature of electrons.** Each electron is described by a wave function ψ obeying the Schrödinger equation; |ψ|² gives the probability of finding it at a point. Energy and momentum (p = ħk) are related through the band structure E(k).\n2. **Adiabatic (Born–Oppenheimer) approximation.** The nuclei are much heavier than electrons and are treated as fixed at their lattice sites. Their vibrations (phonons) are added later as a perturbation that causes scattering.\n3. **Perfect periodic crystal.** The ion cores form an infinite, perfectly periodic lattice, so the potential energy is periodic, V(r + R) = V(r) for every lattice vector R. Surfaces, impurities and defects are treated separately.\n4. **One-electron (independent-electron) approximation.** Each electron moves independently in an average periodic potential produced by the ion cores and all the other electrons (mean-field or Hartree approximation), so a many-body problem becomes a single-particle one.\n5. **Bloch's theorem** follows: wave functions are modulated plane waves ψ = u_k(r)e^{ik·r}.\n6. **Pauli exclusion principle.** Each quantum state (k and spin) holds at most one electron, so the states fill from the bottom up. This, with the Fermi–Dirac distribution, gives the occupation of the bands.\n7. **Effective-mass approximation.** Near the band edges, electrons and holes respond to external forces as free particles with an effective mass m∗ that contains the effect of the crystal potential.\n8. **Thermal equilibrium statistics.** In equilibrium, electrons are distributed among the available states according to the Fermi–Dirac function.\n\n### Q23. State the time-independent Schrödinger equation and explain the physical meaning of its terms.\n\nIn one dimension:\n\n    −(ħ²/2m) d²ψ(x)/dx² + V(x) ψ(x) = E ψ(x)\n\nIn three dimensions: −(ħ²/2m)∇²ψ(r) + V(r)ψ(r) = Eψ(r), compactly Ĥψ = Eψ.\n\n**Meaning of each term:**\n\n- **ψ(x), the wave function**: the amplitude of the electron's probability wave. It has no direct physical meaning, but |ψ(x)|² dx is the probability of finding the electron between x and x + dx. ψ must be finite, single-valued, continuous and normalised.\n- **ħ = h/2π**, the reduced Planck constant (1.055×10⁻³⁴ J·s); **m**, the electron mass (or the effective mass m∗ in a crystal).\n- **−(ħ²/2m) d²ψ/dx²**: the **kinetic-energy** term. It comes from p²/2m with the momentum operator p = −iħ d/dx. The more sharply ψ curves, the higher the kinetic energy.\n- **V(x)ψ**: the **potential-energy** term. V(x) is the potential energy of the electron at x, e.g. the periodic potential of the crystal ions, a barrier, or a well.\n- **E**: the **total energy** of the electron, a constant (the equation is valid for stationary states whose energy does not change with time). Acceptable solutions exist only for particular values of E (eigenvalues), which is how quantisation arises.\n- The left-hand side as a whole is the **Hamiltonian operator** Ĥ acting on ψ.\n\nThe full time-dependent wave function is Ψ(x, t) = ψ(x)e^{−iEt/ħ}; the time-independent equation is obtained when V does not depend on time.\n\n### Q24. Explain the basic principle of the Kronig-Penney model and how it leads to the formation of energy bands.\n\n**Principle.** The real periodic potential of a crystal is complicated. Kronig and Penney (1931) replaced it with the simplest periodic potential that can be solved exactly: a one-dimensional infinite array of **rectangular potential wells and barriers**. Each well (V = 0, width a) represents the region near an ion; each barrier (height V₀, width b) represents the region between ions. The period is a + b.\n\n**Method.**\n\n1. Solve Schrödinger's equation separately in a well (oscillating solutions, α² = 2mE/ħ²) and in a barrier (exponential solutions, β² = 2m(V₀ − E)/ħ²).\n2. Apply continuity of ψ and dψ/dx at each boundary.\n3. Apply **Bloch's theorem**, ψ(x + (a + b)) = e^{ik(a+b)}ψ(x), because the potential is periodic.\n4. A non-trivial solution exists only if a determinant vanishes. Taking the limit of narrow, high barriers (b → 0, V₀ → ∞, with V₀b finite) gives:\n\n    P · sin(αa)/(αa) + cos(αa) = cos(ka),     P = mV₀ba/ħ²\n\n**How bands form.** The right-hand side, cos(ka), must lie between −1 and +1 for real k. Plot the left-hand side f(αa) against αa (i.e. against energy). It starts at 1 + P, oscillates like a damped cosine, and repeatedly rises above +1 and falls below −1. Only the energy ranges where −1 ≤ f(αa) ≤ +1 are solutions: these are the **allowed energy bands**. The ranges where |f| > 1 have no real k and therefore no electron states: these are the **forbidden energy gaps**.\n\n**Results:**\n\n- The spectrum consists of alternating allowed bands and forbidden gaps.\n- Discontinuities in E(k) occur at k = nπ/a (Brillouin-zone boundaries), where Bragg reflection of the electron wave occurs.\n- The width of allowed bands increases with energy (because the 1/αa factor damps the oscillation).\n- As P → ∞ (electrons tightly bound), bands shrink to discrete atomic levels. As P → 0 (free electrons), the gaps vanish and E = ħ²k²/2m.\n\nThe model explains in a simple way why solids have bands and gaps, which is the basis of the classification into metals, semiconductors and insulators.\n\n### Q25. Distinguish between valence band, conduction band, and forbidden energy gap.\n\n| | Valence band | Conduction band | Forbidden energy gap |\n|---|---|---|---|\n| What it is | The highest band that is completely filled with electrons at 0 K | The lowest band above the valence band, empty at 0 K | The energy range between E_v and E_c in which no electron states exist (in a perfect crystal) |\n| Edge | Top at E_v | Bottom at E_c | Width E_g = E_c − E_v |\n| Electrons | Bound in covalent bonds; cannot conduct while the band is full | Free; move through the crystal and conduct | None (only impurity or defect levels) |\n| Carriers | Holes (empty states) conduct here | Electrons conduct here | — |\n| Origin | Bonding combinations of the atomic sp³ orbitals | Antibonding combinations | Splitting of bonding and antibonding states |\n| Values | — | — | Si 1.12 eV, Ge 0.66 eV, GaAs 1.42 eV, SiO₂ ≈ 9 eV |\n\nAn electron needs at least E_g to jump from the valence to the conduction band; it then leaves a hole behind. The width of the gap decides whether a material is a metal (no gap), a semiconductor (small gap) or an insulator (large gap).\n\n### Q26. Explain the difference between a direct band-gap and an indirect band-gap semiconductor.\n\nOn the E–k diagram, look at where the **conduction-band minimum** and the **valence-band maximum** occur.\n\n| | Direct band gap | Indirect band gap |\n|---|---|---|\n| Band-edge positions | CB minimum and VB maximum at the **same k** (usually k = 0, the Γ point) | CB minimum at a **different k** from the VB maximum |\n| Transition across the gap | Vertical: an electron can drop and emit a photon directly, conserving momentum | Needs a change of momentum, which a photon cannot supply; a **phonon** must take part |\n| Process | Two-particle (electron + photon) | Three-particle (electron + photon + phonon), much less probable |\n| Radiative recombination | Fast, efficient; lifetime ≈ ns | Slow, inefficient; recombination is mostly non-radiative via traps; lifetime μs–ms |\n| Absorption near E_g | Sharp, strong (α ≈ 10⁴ cm⁻¹ just above E_g) | Weak, gradual; thicker material needed to absorb light |\n| Examples | GaAs (1.42 eV), InP, GaN, InGaAs, CdTe | Si (1.12 eV), Ge (0.66 eV), GaP, AlAs, SiC |\n| Applications | LEDs, laser diodes, efficient thin-film solar cells, fast photodetectors | ICs, transistors, power devices, Si solar cells and photodiodes (absorb but do not emit well) |\n\nThe emitted wavelength is λ = hc/E_g, i.e. λ(μm) = 1.24/E_g(eV). GaAs emits at 0.87 μm. Silicon's indirect gap is why there is no practical silicon laser.\n\n### Q27. What is meant by an intrinsic semiconductor? Derive the expression for intrinsic carrier concentration.\n\n**Intrinsic semiconductor.** A pure semiconductor crystal with no significant impurities or defects, in which free carriers are produced **only** by thermal excitation of electrons from the valence band to the conduction band. Each excited electron leaves a hole, so\n\n    n = p = n_i\n\nand the Fermi level lies at the intrinsic level E_i, very near the middle of the gap.\n\n**Derivation.**\n\n*Step 1: electrons.* The electron concentration is the density of states times the occupation probability, integrated over the conduction band:\n\n    n = ∫_{E_c}^{∞} g_c(E) f(E) dE,     g_c(E) = (4π(2m_n∗)^{3/2}/h³) √(E − E_c)\n\n*Step 2: Boltzmann approximation.* For E_c − E_F ≫ kT, f(E) ≈ exp(−(E − E_F)/kT). Then\n\n    n = (4π(2m_n∗)^{3/2}/h³) exp(−(E_c − E_F)/kT) ∫₀^{∞} √x · e^{−x/kT} dx,   x = E − E_c\n\n*Step 3: the integral.* ∫₀^{∞} x^{1/2} e^{−x/kT} dx = (kT)^{3/2} Γ(3/2) = (kT)^{3/2} (√π/2). Hence\n\n    n = N_c exp( −(E_c − E_F)/kT ),     N_c = 2(2πm_n∗kT/h²)^{3/2}\n\n*Step 4: holes.* Similarly, with 1 − f(E) ≈ exp(−(E_F − E)/kT) in the valence band,\n\n    p = N_v exp( −(E_F − E_v)/kT ),     N_v = 2(2πm_p∗kT/h²)^{3/2}\n\n*Step 5: the intrinsic condition.* Multiply n and p. E_F cancels:\n\n    n p = N_c N_v exp( −(E_c − E_v)/kT ) = N_c N_v exp( −E_g/kT )\n\nIn an intrinsic semiconductor n = p = n_i, so n·p = n_i², and\n\n    n_i = √(N_c N_v) · exp( −E_g / 2kT )\n\nSubstituting N_c and N_v gives the explicit temperature dependence:\n\n    n_i = 2 (2πkT/h²)^{3/2} (m_n∗ m_p∗)^{3/4} exp( −E_g / 2kT )   ∝ T^{3/2} e^{−E_g/2kT}\n\n*Step 6: the intrinsic Fermi level.* Setting n = p and solving:\n\n    E_i = (E_c + E_v)/2 + (kT/2) ln(N_v/N_c) = (E_c + E_v)/2 + (3kT/4) ln(m_p∗/m_n∗)\n\n**Numerical check for Si at 300 K:** √(2.8×10¹⁹ × 1.04×10¹⁹) = 1.71×10¹⁹; exp(−1.12/(2 × 0.0259)) = exp(−21.6) = 4.1×10⁻¹⁰; n_i ≈ 7×10⁹ cm⁻³, the same order as the accepted 1×10¹⁰ cm⁻³ (the difference comes from the exact values of E_g and the effective masses).\n\n### Q28. Explain the difference between intrinsic and extrinsic carrier concentrations.\n\n| | Intrinsic carrier concentration | Extrinsic carrier concentration |\n|---|---|---|\n| Material | Pure (undoped) semiconductor | Doped semiconductor |\n| Source of carriers | Thermal breaking of covalent bonds only (band-to-band excitation) | Mainly ionised dopants (donors or acceptors), plus a small thermal contribution |\n| Electron vs hole | n = p = n_i | Unequal: n ≫ p (n-type) or p ≫ n (p-type); majority and minority carriers |\n| Formula | n_i = √(N_cN_v) exp(−E_g/2kT) | n ≈ N_D, p = n_i²/N_D (n-type); p ≈ N_A, n = n_i²/N_A (p-type) |\n| Typical value (Si, 300 K) | 1×10¹⁰ cm⁻³ | 10¹⁴–10²⁰ cm⁻³ majority |\n| Temperature dependence | Very strong, exponential | Nearly constant over the extrinsic range; becomes intrinsic at high T |\n| Controlled by | Material (E_g) and temperature | Doping level, chosen by the designer |\n| Fermi level | At E_i, near mid-gap | Shifted toward E_c (n-type) or E_v (p-type) |\n| Conductivity | Low (σ ≈ 3×10⁻⁶ S/cm for Si) | Much higher, set by doping |\n\nThe two are linked by the mass-action law **np = n_i²**: doping increases one carrier type and decreases the other so that their product equals the intrinsic value squared.\n\n### Q29. Silicon has an intrinsic carrier concentration of approximately 1.0 × 10¹⁰ cm⁻³ at a specified temperature. If the electron and hole concentrations are equal, determine the electron and hole concentrations.\n\nIf n = p, the semiconductor is intrinsic (undoped, or exactly compensated). From the mass-action law:\n\n    n · p = n_i²   and   n = p   ⇒   n² = n_i²   ⇒   n = n_i\n\n**n = p = n_i = 1.0×10¹⁰ cm⁻³**\n\nCheck: n·p = (1.0×10¹⁰)² = 1.0×10²⁰ cm⁻⁶ = n_i². ✓\n\nAt this concentration, using μ_n = 1350 and μ_p = 480 cm²/V·s, the intrinsic conductivity would be σ = qn_i(μ_n + μ_p) = 1.602×10⁻¹⁹ × 10¹⁰ × 1830 = 2.9×10⁻⁶ S/cm, i.e. ρ ≈ 3.4×10⁵ Ω·cm.\n\n### Q34. An n-type semiconductor has a donor concentration of 5 × 10¹⁶ cm⁻³. Assuming complete ionization, determine the approximate majority-carrier concentration.\n\nWith complete ionisation and N_D ≫ n_i (5×10¹⁶ ≫ 10¹⁰), every donor contributes one electron:\n\n    n₀ ≈ N_D = 5 × 10¹⁶ cm⁻³\n\n**Majority-carrier (electron) concentration ≈ 5×10¹⁶ cm⁻³.**\n\nAdditional results (assuming silicon at 300 K, n_i = 1×10¹⁰ cm⁻³):\n\n    Minority holes:  p₀ = n_i²/n₀ = (10¹⁰)² / (5×10¹⁶) = 2×10³ cm⁻³\n\n    Fermi level:  E_F − E_i = kT ln(n₀/n_i) = 0.0259 × ln(5×10⁶) = 0.0259 × 15.42 = 0.40 eV above E_i\n\n    Conductivity:  σ ≈ q n₀ μ_n = 1.602×10⁻¹⁹ × 5×10¹⁶ × 1350 ≈ 10.8 S/cm  (ρ ≈ 0.093 Ω·cm)\n\nThe thermal contribution n_i is negligible, which is why the majority-carrier density is simply the donor density. (Mobility falls at this doping to about 1000 cm²/V·s, so the real σ is nearer 8 S/cm.)\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 4.1: energy levels in a quantum well\n\n**Question.** An electron is confined in a 1 nm wide well with infinitely high walls. Calculate the energies of the first two levels in eV.\n\n**Given:** L = 1×10⁻⁹ m, m = 9.11×10⁻³¹ kg, h = 6.626×10⁻³⁴ J·s.\n\n**Find:** E₁ and E₂.\n\n**Solution.** E_n = n²h²/(8mL²) (the same as n²π²ħ²/2mL²).\n\n    E₁ = (6.626×10⁻³⁴)² / (8 × 9.11×10⁻³¹ × 10⁻¹⁸) = 6.02×10⁻²⁰ J = 0.376 eV\n    E₂ = 4E₁ = 1.50 eV\n\n**Answer:** **E₁ = 0.38 eV, E₂ = 1.50 eV.** Confinement on the nanometre scale gives level spacings comparable to band gaps, the basis of quantum-well lasers.\n\n#### Practice 4.2: wavelength of a thermal electron\n\n**Question.** An electron in a semiconductor at 300 K has a kinetic energy of about (3/2)kT = 0.0388 eV. Find its de Broglie wavelength and compare it with the silicon lattice constant.\n\n**Given:** E = 0.0388 eV = 6.21×10⁻²¹ J, m = 9.11×10⁻³¹ kg.\n\n**Find:** λ = h/p.\n\n**Solution.**\n\n    p = √(2mE) = √(2 × 9.11×10⁻³¹ × 6.21×10⁻²¹) = 1.06×10⁻²⁵ kg·m/s\n    λ = h/p = 6.626×10⁻³⁴ / 1.06×10⁻²⁵ = 6.2×10⁻⁹ m = 6.2 nm\n\n**Answer:** **λ ≈ 6 nm, about 11 times the lattice constant (0.543 nm).** The electron is a wave spread over many atoms, which is why a wave description is needed.\n\n#### Practice 4.3: emission wavelengths\n\n**Question.** Find the band-to-band emission wavelength of GaN (3.4 eV), GaP (2.26 eV) and InP (1.35 eV), and say where each lies in the spectrum.\n\n**Given:** E_g values above; λ(μm) = 1.24/E_g(eV).\n\n**Find:** λ for each.\n\n**Solution.**\n\n    GaN: 1.24/3.4 = 0.365 μm\n    GaP: 1.24/2.26 = 0.549 μm\n    InP: 1.24/1.35 = 0.919 μm\n\n**Answer:** **GaN 365 nm (near ultraviolet), GaP 549 nm (green), InP 919 nm (near infrared).** (GaP is indirect, so its LEDs need special doping; GaN and InP are direct.)\n\n#### Practice 4.4: intrinsic concentration of GaAs\n\n**Question.** For GaAs at 300 K, N_c = 4.7×10¹⁷ cm⁻³, N_v = 7.0×10¹⁸ cm⁻³ and E_g = 1.42 eV. Calculate n_i.\n\n**Given:** N_c, N_v, E_g above; 2kT = 0.0518 eV.\n\n**Find:** n_i.\n\n**Solution.**\n\n    √(N_cN_v) = √(4.7×10¹⁷ × 7.0×10¹⁸) = 1.81×10¹⁸ cm⁻³\n    e^{−E_g/2kT} = e^{−1.42/0.0518} = e^{−27.4} = 1.25×10⁻¹²\n    n_i = 1.81×10¹⁸ × 1.25×10⁻¹² = 2.3×10⁶ cm⁻³\n\n**Answer:** **n_i ≈ 2×10⁶ cm⁻³**, about 4000 times smaller than in silicon, which is why GaAs can be made semi-insulating.\n\n#### Practice 4.5: how fast n_i rises with temperature\n\n**Question.** Ignoring the small change of band gap with temperature, by what factor does n_i of silicon (E_g = 1.12 eV) increase between 300 K and 350 K?\n\n**Given:** n_i ∝ T^{3/2} e^{−E_g/2kT}, E_g = 1.12 eV, k = 8.617×10⁻⁵ eV/K.\n\n**Find:** n_i(350)/n_i(300).\n\n**Solution.**\n\n    (350/300)^{3/2} = 1.26\n    exp[ (E_g/2k)(1/300 − 1/350) ] = exp[ 6499 × 4.76×10⁻⁴ ] = e^{3.09} = 22.1\n    ratio = 1.26 × 22.1 = 27.8\n\n**Answer:** **about 28 times.** A 50 K rise gives a 28-fold increase, almost all from the exponential.\n\n#### Practice 4.6: compensated silicon\n\n**Question.** Silicon contains N_D = 1×10¹⁶ cm⁻³ and N_A = 4×10¹⁵ cm⁻³. Find n and p at 300 K (n_i = 1×10¹⁰ cm⁻³).\n\n**Given:** N_D = 10¹⁶, N_A = 4×10¹⁵, n_i = 10¹⁰ cm⁻³.\n\n**Find:** n and p.\n\n**Solution.**\n\n    N_D > N_A, so the material is n-type with net doping N_D − N_A = 6×10¹⁵ cm⁻³ ≫ n_i\n    n ≈ 6×10¹⁵ cm⁻³\n    p = n_i²/n = 10²⁰/6×10¹⁵ = 1.7×10⁴ cm⁻³\n\n**Answer:** **n = 6×10¹⁵ cm⁻³, p = 1.7×10⁴ cm⁻³.**\n\n#### Practice 4.7: why bands widen\n\n**Question.** Using the Kronig–Penney model, explain why allowed bands become wider at higher energies.\n\n**Answer.** The left-hand side of P sin(αa)/(αa) + cos(αa) = cos(ka) is a cosine plus a term whose amplitude falls as 1/(αa). At low energy (small αa) the P sin(αa)/(αa) term is large, so the curve swings far beyond ±1 and spends only short stretches inside the allowed strip: narrow bands, wide gaps. As energy increases, αa increases, that term shrinks, and the curve is mostly the plain cosine, which stays between ±1 almost everywhere: wide bands, narrow gaps. Physically, high-energy electrons are less affected by the atomic barriers and behave more like free electrons.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | State the basic ideas of quantum mechanics needed for solids. | What is the meaning of |ψ|²? | The probability density of finding the electron at a point. | Why classical physics is not enough |\n| 2 | State the time-independent Schrödinger equation and explain its terms. | Which term of −(ħ²/2m)d²ψ/dx² + Vψ = Eψ is the kinetic energy? | −(ħ²/2m) d²ψ/dx². | The Schrödinger equation |\n| 3 | Explain how discrete atomic levels become energy bands. | Into how many levels does one atomic level split when N atoms form a crystal? | N levels, so close together that they form a band. | From atoms to bands |\n| 4 | Explain the Kronig–Penney model and how it produces allowed and forbidden bands. | In P sin(αa)/(αa) + cos(αa) = cos(ka), which energies are forbidden? | Those for which the left-hand side is greater than +1 or less than −1. | The Kronig–Penney model |\n| 5 | Explain E–k diagrams, effective mass and holes. | Does a strongly curved band give a heavy or a light effective mass? | Light: 1/m∗ = (1/ħ²) d²E/dk² is large. | E–k diagrams and effective mass |\n| 6 | Distinguish direct and indirect band gaps and calculate emission wavelengths. | What wavelength does GaAs (E_g = 1.42 eV) emit? | λ = 1.24/1.42 = 0.87 μm. | Direct and indirect band gaps |\n| 7 | Derive n_i and calculate intrinsic and extrinsic carrier concentrations. | Write n_i in terms of N_c, N_v and E_g. | n_i = √(N_cN_v) e^{−E_g/2kT}. | Part C; Example 4.1; Q27 |\n", "group": "Module 2 · Energy Bands & Carrier Statistics", "eyebrow": "Week 4", "disp": "04"}, {"num": "05", "title": "Carrier Statistics", "body": "\n**Plan:** the Fermi–Dirac distribution function; density of states; Fermi energy level calculation as a function of temperature and doping. This page follows the order of your lecturer's carrier-statistics note (sections 7–26) and adds the background those sections assume.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Define and use the Fermi–Dirac distribution function.\n2. Explain the physical meaning of the Fermi level and the shape of f(E) at 0 K.\n3. Explain the density of states and the effective density of states.\n4. Calculate electron and hole concentrations and apply the mass action law.\n5. Determine the position of the Fermi level for given doping.\n6. Apply the charge-neutrality condition, including compensated material.\n7. Explain the effect of temperature on carrier concentration and the Fermi level.\n8. Distinguish degenerate and non-degenerate semiconductors.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| ħ | Reduced Planck constant, h/2π | 1.055×10⁻³⁴ J·s |\n| m₀ | Free-electron mass | 9.11×10⁻³¹ kg |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_Fn, E_Fp | Quasi-Fermi levels for electrons and holes, used out of equilibrium | eV |\n| E_D | Donor energy level, just below E_c | eV; E_c − E_D ≈ 0.045 eV for P in Si |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| g(E), g_c, g_v | Density of states: allowed states per unit energy per unit volume | states/(eV·cm³) |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| N_D⁺, N_A⁻ | Concentrations of ionised donors and acceptors | cm⁻³ |\n| m∗, m_n∗, m_p∗ | Effective mass of electrons or holes | kg, or as a multiple of m₀ |\n| k (wave vector) | Wave vector, 2π/λ; measures the electron's momentum, p = ħk | m⁻¹ or cm⁻¹ |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| GaAs | Gallium arsenide |\n| MOS | Metal–oxide–semiconductor |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n| FD | Fermi–Dirac (distribution) |\n\n\n## The big picture\n\n**Carrier statistics** is the method for answering one question: **how many free electrons and holes does a piece of semiconductor contain?** Everything else in the course (conductivity, diodes, transistors) depends on that number.\n\nThink of the conduction band as a large theatre:\n\n- The **seats** are the allowed energy states. How many seats there are at each energy is the **density of states**.\n- Whether a seat is **occupied** is a matter of probability. The probability is given by the **Fermi–Dirac function**.\n- The number of electrons = (number of seats) × (probability each is filled), added up over all energies.\n\n    number of electrons = Σ (states available) × (probability occupied)\n\nThe **Fermi level E_F** is the single number that sets those probabilities. Once you know where E_F sits in the band gap, you know n and p. That is why most of this week is about finding E_F.\n\n## 1. The Fermi–Dirac distribution function\n\nElectrons obey the **Pauli exclusion principle**: no two can occupy the same state. In thermal equilibrium, the probability that a state at energy E is occupied by an electron is:\n\n    f(E) = 1 / ( 1 + e^{(E − E_F)/kT} )\n\n| Symbol | Meaning |\n|---|---|\n| f(E) | probability (between 0 and 1) that a state at energy E holds an electron |\n| E | energy of the state (eV) |\n| E_F | the **Fermi energy** or Fermi level (eV) |\n| k | Boltzmann constant, 8.617×10⁻⁵ eV/K |\n| T | absolute temperature (K); kT = 0.02585 eV at 300 K |\n\n### Three things to remember about f(E)\n\n1. **At E = E_F**, the exponent is zero, e⁰ = 1, and f = 1/(1 + 1) = **½**. The Fermi level is the energy where a state has a 50 % chance of being occupied, at any temperature.\n2. **Below E_F** (E < E_F), the exponent is negative, so f is close to 1: states are almost certainly full.\n3. **Above E_F** (E > E_F), the exponent is positive, so f is close to 0: states are almost certainly empty.\n\nThe change from \"full\" to \"empty\" happens over a few kT (about ±0.1 eV at room temperature).\n\n**At absolute zero** (T = 0 K), kT → 0 and the change becomes instantaneous: f = 1 for every state below E_F and f = 0 for every state above. f(E) is a **sharp step**. A pure semiconductor at 0 K therefore has a full valence band, an empty conduction band, and no free carriers.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 215\" role=\"img\" aria-label=\"Fermi-Dirac function: a step at zero kelvin, smoothed over a few kT at 300 K and 900 K, always one half at the Fermi level\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewB 0,166.7 352.5,167.5 355.0,168.4 357.5,169.2 360.0,170.0 362.5,170.7 365.0,171.4 367.5,172.1 370.0,172.8 372.5,173.4 375.0,174.1 377.5,174.7 380.0,175.2 382.5,175.8 385.0,176.3 387.5,176.8 390.0,177.3 392.5,177.8 395.0,178.2 397.5,178.7 400.0,179.1 402.5,179.5 405.0,179.8 407.5,180.2 410.0,180.6 412.5,180.9 415.0,181.2 417.5,181.5 420.0,181.8 422.5,182.1 425.0,182.4 427.5,182.6 430.0,182.9 432.5,183.1 435.0,183.3 437.5,183.5 440.0,183.7 442.5,183.9 445.0,184.1 447.5,184.3 450.0,184.5 452.5,184.6 455.0,184.8 457.5,184.9 460.0,185.1\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2.1\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"80.0\" y=\"39.1\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">0 K</text><text x=\"300.0\" y=\"170.9\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">300 K</text><text x=\"340.0\" y=\"142.3\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">900 K</text><circle cx=\"260.0\" cy=\"116.6\" r=\"3\" style=\"fill:currentColor\"/><text x=\"268.0\" y=\"112.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">f = ½ at E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text></svg><figcaption>The Fermi–Dirac function. At 0 K it is a step at E<sub>F</sub>. At 300 K and 900 K the step is smoothed over a few kT. It always passes through ½ at E<sub>F</sub>.</figcaption></figure>\n```\n\n**Probability that a state is empty.** A state is either full or empty, so\n\n    probability empty = 1 − f(E)\n\nAn empty state in the valence band is a **hole**, so 1 − f(E) is the probability of finding a hole.\n\n### Calculating an occupation probability\n\nAt 300 K (kT = 0.02585 eV), a state 0.10 eV **above** E_F:\n\n    (E − E_F)/kT = 0.10/0.02585 = 3.868\n    f = 1/(1 + e^{3.868}) = 1/(1 + 47.85) = 0.0205\n\nAbout a **2 % chance** of being occupied. A state 0.10 eV **below** E_F has f = 1/(1 + e^{−3.868}) = 0.980, a 98 % chance; its probability of being empty is 2 %. The function is symmetric about E_F.\n\n### The Boltzmann approximation\n\nIf E − E_F is more than about 3kT (0.08 eV at 300 K), e^{(E−E_F)/kT} is much larger than 1, and we can drop the \"1 +\":\n\n    f(E) ≈ e^{−(E − E_F)/kT}       (Maxwell–Boltzmann approximation)\n\nThis is accurate to better than 5 %. For the 0.10 eV example: e^{−3.868} = 0.0209, against the exact 0.0205. Almost every calculation in this course uses this approximation, because the conduction band is usually well above E_F.\n\n## 2. Density of states\n\nThe **density of states** g(E) is the number of allowed electron states per unit energy, per unit volume, at energy E (units: states per eV per cm³).\n\n    Conduction band:  g_c(E) ∝ (m_n∗)^{3/2} √(E − E_c)     for E above E_c\n    Valence band:     g_v(E) ∝ (m_p∗)^{3/2} √(E_v − E)     for E below E_v\n    In the gap:       g(E) = 0\n\nIn words: there are **no states in the gap**; just above E_c the number of states starts at zero and grows as the square root of how far you go into the band. The effective masses m_n∗ and m_p∗ describe the shape of each band; a heavier mass means more states.\n\n### Effective density of states\n\nAdding up \"states × probability\" over the whole conduction band (with the Boltzmann approximation) gives a very simple result. It is **as if** all the conduction-band states were squeezed into one level at E_c, with a total number N_c of them. N_c is the **effective density of states**:\n\n    N_c = 2 (2π m_n∗ kT / h²)^{3/2},     N_v = 2 (2π m_p∗ kT / h²)^{3/2}\n\nFor silicon at 300 K: **N_c = 2.8×10¹⁹ cm⁻³**, **N_v = 1.04×10¹⁹ cm⁻³**. Both grow with temperature as T^{3/2}.\n\n## 7. Electron concentration\n\nThe electron concentration in the conduction band is obtained by adding up available states × occupation probability:\n\n    n = ∫ g_c(E) f(E) dE     (from E_c to the top of the band)\n\nFor a **non-degenerate** semiconductor, f(E) is replaced by the Maxwell–Boltzmann form, and the integral gives:\n\n    n = N_c e^{−(E_c − E_F)/kT}\n\nor, measuring from the intrinsic level E_i,\n\n    n = n_i e^{(E_F − E_i)/kT}\n\n**Reading it.** E_c − E_F is the distance from the Fermi level up to the conduction-band edge. The smaller that distance, the larger n, and the dependence is exponential: every 60 mV that E_F moves towards E_c multiplies n by 10.\n\n## 8. Hole concentration\n\nThe probability that a valence-band state is **empty** is 1 − f(E). The hole concentration is\n\n    p = ∫ g_v(E) [1 − f(E)] dE     (over the valence band)\n\nFor a non-degenerate semiconductor this gives:\n\n    p = N_v e^{−(E_F − E_v)/kT}\n\nand\n\n    p = n_i e^{(E_i − E_F)/kT}\n\nThese four equations (two for n, two for p) are the fundamental equations of semiconductor carrier statistics.\n\n## 9. Position of the Fermi level\n\nTurn the electron equation round to find E_F when n is known. From n = N_c e^{−(E_c − E_F)/kT}, divide by N_c and take the natural logarithm:\n\n    ln(n/N_c) = −(E_c − E_F)/kT\n\nTherefore:\n\n    E_c − E_F = kT ln(N_c/n)\n\nSimilarly, from the hole concentration:\n\n    E_F − E_v = kT ln(N_v/p)\n\nAnd, using the intrinsic level:\n\n    E_F − E_i = kT ln(n/n_i),     E_i − E_F = kT ln(p/n_i)\n\nThese equations let the Fermi level be calculated when the carrier concentration is known.\n\n#### Example 5.1: Fermi level from the electron concentration\n\n**Question.** An n-type silicon sample at 300 K has an electron concentration of 1×10¹⁶ cm⁻³. Taking N_c = 2.8×10¹⁹ cm⁻³ and kT = 0.02585 eV, find how far the Fermi level lies below the conduction-band edge.\n\n**Given:** n = 1×10¹⁶ cm⁻³, N_c = 2.8×10¹⁹ cm⁻³, kT = 0.02585 eV.\n\n**Find:** E_c − E_F.\n\n**Solution.**\n\nUse E_c − E_F = kT ln(N_c/n):\n\n    N_c/n = 2.8×10¹⁹ / 1×10¹⁶ = 2800,   ln(2800) = 7.94\n\n    E_c − E_F = 0.02585 × 7.94 = 0.205 eV\n\n**Answer:** **E_c − E_F = 0.205 eV**: the Fermi level is 0.205 eV below the conduction band.\n\n## 10. Intrinsic semiconductor\n\nA semiconductor with no intentional donor or acceptor doping is called **intrinsic**. Every free electron came from a broken bond that also left a hole, so\n\n    n = p = n_i\n\nwhere n_i is the **intrinsic carrier concentration**. Multiplying the n and p equations, E_F cancels out:\n\n    n · p = N_c N_v e^{−(E_c − E_v)/kT} = N_c N_v e^{−E_g/kT}\n\nand since n = p = n_i,\n\n    n_i = √(N_c N_v) · e^{−E_g/2kT}\n\nwhere E_g = E_c − E_v is the band-gap energy. This equation shows that the intrinsic carrier concentration depends strongly on temperature and on the band gap. For Si at 300 K, n_i ≈ 1×10¹⁰ cm⁻³ (many textbooks use 1.5×10¹⁰; the accurate modern value is 9.65×10⁹).\n\n## 11. Intrinsic Fermi level\n\nFor an intrinsic semiconductor, n = p. Set the two expressions equal:\n\n    N_c e^{−(E_c − E_i)/kT} = N_v e^{−(E_i − E_v)/kT}\n\nSolving for E_i gives\n\n    E_i = (E_c + E_v)/2 + (kT/2) ln(N_v/N_c)\n\nIf N_c and N_v were equal, the logarithm would be zero, and then\n\n    E_i = (E_c + E_v)/2\n\nThus the intrinsic Fermi level is approximately at the **middle of the forbidden gap**. For Si the correction is (0.02585/2) ln(1.04/2.8) = −0.013 eV, only 13 meV below mid-gap.\n\n## 12. Mass action law\n\nFor a semiconductor in thermal equilibrium:\n\n    n · p = n_i²\n\nThis is the **mass action law**. It holds for intrinsic and doped (non-degenerate) material alike, because when we multiplied n by p above, E_F cancelled.\n\n- For an **intrinsic** semiconductor n = p, therefore n = p = n_i.\n- For an **n-type** semiconductor where n ≫ p: n ≈ N_D, and therefore **p = n_i²/N_D**.\n- For a **p-type** semiconductor where p ≫ n: p ≈ N_A, and therefore **n = n_i²/N_A**.\n\n> **In plain words.** n × p is fixed. Add donors, and the extra electrons fill in holes, so the hole count drops by exactly the same factor the electron count rises. Doping one carrier up pushes the other down.\n\n## 13. Effect of doping on the Fermi level\n\nDoping changes the concentration of carriers, and therefore shifts the Fermi level.\n\n**N-type.** Donor atoms introduce additional electrons, so the Fermi level moves **towards the conduction band**:\n\n    E_c − E_F = kT ln(N_c/n),     E_F − E_i = kT ln(n/n_i)\n\nIf donors are fully ionised and N_D ≫ n_i, then n ≈ N_D, and\n\n    E_c − E_F = kT ln(N_c/N_D),     E_F − E_i = kT ln(N_D/n_i)\n\n**P-type.** Acceptor atoms create holes, so the Fermi level moves **towards the valence band**:\n\n    E_F − E_v = kT ln(N_v/p),     E_i − E_F = kT ln(p/n_i)\n\nIf acceptors are fully ionised, p ≈ N_A, so\n\n    E_F − E_v = kT ln(N_v/N_A),     E_i − E_F = kT ln(N_A/n_i)\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 210\" role=\"img\" aria-label=\"Band diagrams showing the Fermi level at mid-gap for intrinsic material, near the conduction band for n-type and near the valence band for p-type\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"110.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">intrinsic</text><line x1=\"40.0\" y1=\"50.0\" x2=\"180.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"40.0\" y1=\"170.0\" x2=\"180.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"40.0\" y1=\"110.0\" x2=\"180.0\" y2=\"110.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><line x1=\"40.0\" y1=\"110.0\" x2=\"180.0\" y2=\"110.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-dasharray=\"6 3\"/><text x=\"186.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"186.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"186.0\" y=\"114.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> = E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"310.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">n-type</text><line x1=\"240.0\" y1=\"50.0\" x2=\"380.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"240.0\" y1=\"170.0\" x2=\"380.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"240.0\" y1=\"110.0\" x2=\"380.0\" y2=\"110.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><line x1=\"240.0\" y1=\"64.4\" x2=\"380.0\" y2=\"64.4\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-dasharray=\"6 3\"/><text x=\"386.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"386.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"386.0\" y=\"122.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.75\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"235.0\" y=\"68.4\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"510.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">p-type</text><line x1=\"440.0\" y1=\"50.0\" x2=\"580.0\" y2=\"50.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"440.0\" y1=\"170.0\" x2=\"580.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.8\" opacity=\"1.0\"/><line x1=\"440.0\" y1=\"110.0\" x2=\"580.0\" y2=\"110.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"2 3\"/><line x1=\"440.0\" y1=\"155.6\" x2=\"580.0\" y2=\"155.6\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-dasharray=\"6 3\"/><text x=\"586.0\" y=\"54.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">c</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"586.0\" y=\"174.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"586.0\" y=\"106.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.75\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"435.0\" y=\"159.6\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"325.0\" y=\"200.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> = kT ln(N<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan>/n<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan>)  for n-type;   E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan> − E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan> = kT ln(N<tspan dy=\"0.32em\" font-size=\"72%\">A</tspan><tspan dy=\"-0.32em\">​</tspan>/n<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan>)  for p-type</text></svg><figcaption>Where the Fermi level sits: at mid-gap (E<sub>i</sub>) when intrinsic, near E<sub>c</sub> for n-type, near E<sub>v</sub> for p-type.</figcaption></figure>\n```\n\n**How big are the shifts?** Each factor of 10 in doping moves E_F by kT ln 10 = 0.0595 eV ≈ 60 mV at 300 K.\n\n| Doping (Si, 300 K) | E_F − E_i | E_c − E_F |\n|---|---|---|\n| Intrinsic | 0 | 0.56 eV |\n| N_D = 10¹⁴ cm⁻³ | 0.238 eV | 0.324 eV |\n| N_D = 10¹⁶ cm⁻³ | 0.357 eV | 0.205 eV |\n| N_D = 10¹⁸ cm⁻³ | 0.476 eV | 0.086 eV |\n\n## 14. Charge neutrality in a doped semiconductor\n\nA piece of semiconductor is electrically neutral overall. The positive charges (holes and ionised donors) must equal the negative charges (electrons and ionised acceptors):\n\n    p + N_D⁺ = n + N_A⁻\n\nwhere p is the hole concentration, n the electron concentration, N_D⁺ the concentration of ionised donors and N_A⁻ the concentration of ionised acceptors. If donors and acceptors are completely ionised (N_D⁺ = N_D, N_A⁻ = N_A):\n\n    p + N_D = n + N_A\n\nThis is the **charge-neutrality condition**. Combined with np = n_i² it gives n exactly:\n\n    n = (N_D − N_A)/2 + √( ((N_D − N_A)/2)² + n_i² )\n\nWhen N_D − N_A ≫ n_i, this reduces to n ≈ N_D − N_A. When both dopants are present they partly cancel, which is called **compensation**.\n\n## 15. N-type semiconductor\n\nWhen silicon is doped with a donor impurity (phosphorus P, arsenic As, antimony Sb), it becomes n-type. A donor contributes an extra electron. If N_D ≫ n_i and all donors are ionised:\n\n    n ≈ N_D\n\nUsing the mass action law np = n_i², we obtain:\n\n    p ≈ n_i² / N_D\n\n## 16. P-type semiconductor\n\nWhen silicon is doped with an acceptor impurity (boron B, aluminium Al, gallium Ga), it becomes p-type. An acceptor creates a hole. If N_A ≫ n_i, then:\n\n    p ≈ N_A\n\nand:\n\n    n ≈ n_i² / N_A\n\n## 17. Fermi level as a function of temperature\n\nTemperature has a major effect on carrier concentration and Fermi level. There are generally three regions:\n\n**Region 1: Freeze-out region.** At very low temperature (below about 100 K in Si), donor and acceptor atoms are not fully ionised: there is not enough thermal energy to free the extra electron from each donor. Consequently there are relatively few free carriers, and n < N_D.\n\n**Region 2: Extrinsic region.** At moderate temperature (roughly 150–450 K for Si), the dopants are fully ionised:\n\n    n-type: n ≈ N_D          p-type: p ≈ N_A\n\nThe carrier concentration is set by the doping and hardly changes with temperature. This is the region used in most basic semiconductor calculations, and the region where devices operate.\n\n**Region 3: Intrinsic region.** At sufficiently high temperature, thermally generated electron–hole pairs become dominant. Eventually\n\n    n_i ≫ N_D   so   n ≈ p ≈ n_i\n\nThe semiconductor behaves more and more like an intrinsic semiconductor, and E_F returns to E_i. The doping no longer controls the material, which is why every device has a maximum operating temperature.\n\n#### Example 5.2: Fermi level against temperature\n\n**Question.** Silicon is doped with N_D = 1×10¹⁵ cm⁻³. Using the intrinsic concentrations in the table (n_i = 1×10¹⁰ cm⁻³ at 300 K, rising with temperature), calculate the electron concentration and the position of the Fermi level relative to E_i at 300, 400, 500 and 600 K. At what temperature does the material become effectively intrinsic?\n\n**Given:** N_D = 1×10¹⁵ cm⁻³, complete ionisation; n_i(T) from n_i ∝ T^{3/2}e^{−E_g(T)/2kT}, scaled to 1×10¹⁰ cm⁻³ at 300 K.\n\n**Find:** n and E_F − E_i at each temperature.\n\n**Solution.** At each temperature use the exact charge-neutrality result, n = N_D/2 + √((N_D/2)² + n_i²), then E_F − E_i = kT ln(n/n_i).\n\n| T (K) | kT (eV) | n_i (cm⁻³) | n (cm⁻³) | E_F − E_i = kT ln(n/n_i) (eV) |\n|---|---|---|---|---|\n| 300 | 0.0259 | 1.0×10¹⁰ | 1.00×10¹⁵ | 0.0259 × ln(1.0×10⁵) = 0.298 |\n| 400 | 0.0345 | 5.3×10¹² | 1.00×10¹⁵ | 0.0345 × ln(189) = 0.181 |\n| 500 | 0.0431 | 2.6×10¹⁴ | 1.06×10¹⁵ | 0.0431 × ln(4.16) = 0.061 |\n| 600 | 0.0517 | 3.7×10¹⁵ | 4.18×10¹⁵ | 0.0517 × ln(1.15) = 0.007 |\n\n**Answer:** E_F − E_i falls from **0.298 eV at 300 K to 0.007 eV at 600 K**. n_i passes N_D at about **550 K**; above that the material is effectively intrinsic and the doping no longer controls it.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 225\" role=\"img\" aria-label=\"Fermi level above the intrinsic level against temperature for silicon doped with ten to the 14, 15, 16 and 17 donors per cubic centimetre; each falls towards zero at high temperature\" style=\"width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" r
