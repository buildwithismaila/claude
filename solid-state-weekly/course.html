<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ELE 717 Weekly Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<style>
:root{
  --bg:#F5F7F8; --surface:#FFFFFF; --sidebar:#EDF1F3;
  --ink:#17212B; --ink-soft:#5A6975; --ink-faint:#8695A1;
  --rule:#D9E1E6; --rule-soft:#E7EDF0;
  --copper:#A2542A; --copper-soft:#F3E7DE;
  --teal:#186A7B; --teal-soft:#E0EEF1;
  --shadow:0 1px 2px rgba(23,33,43,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
    --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
    --rule:#22303A; --rule-soft:#1A252E;
    --copper:#DC8B57; --copper-soft:#2A1D14;
    --teal:#54B4C6; --teal-soft:#122730;
    --shadow:0 1px 2px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0D1319; --surface:#131C23; --sidebar:#101820;
  --ink:#E2E9ED; --ink-soft:#93A3AE; --ink-faint:#6B7B87;
  --rule:#22303A; --rule-soft:#1A252E;
  --copper:#DC8B57; --copper-soft:#2A1D14;
  --teal:#54B4C6; --teal-soft:#122730;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}

*{box-sizing:border-box}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16px; line-height:1.65;
  display:grid; grid-template-columns:272px 1fr; min-height:100vh;
}
::selection{background:var(--copper-soft); color:var(--ink)}
a{color:var(--teal)}
:focus-visible{outline:2px solid var(--copper); outline-offset:2px; border-radius:2px}

/* ---------- sidebar ---------- */
#nav{
  background:var(--sidebar); border-right:1px solid var(--rule);
  padding:26px 0 40px; position:sticky; top:0; height:100vh; overflow-y:auto;
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
}
.brand{padding:0 22px 20px; border-bottom:1px solid var(--rule); margin-bottom:14px}
.brand h1{
  font-size:19px; line-height:1.2; margin:0 0 6px; font-weight:700;
  letter-spacing:-.01em; text-wrap:balance;
}
.brand p{margin:0; font-size:12px; color:var(--ink-faint); letter-spacing:.04em; text-transform:uppercase}
.seclabel{
  padding:0 22px; margin:18px 0 8px; font-size:10.5px; letter-spacing:.13em;
  text-transform:uppercase; color:var(--ink-faint); font-weight:600;
}
.modlist{list-style:none; margin:0; padding:0}
.modlist .grouplabel{margin:20px 0 6px; line-height:1.35; text-wrap:balance}
.modlist button{
  width:100%; text-align:left; background:none; border:0; cursor:pointer;
  display:grid; grid-template-columns:26px 1fr 16px; gap:9px; align-items:baseline;
  padding:7px 22px; font:inherit; font-size:14px; color:var(--ink-soft);
  border-left:2px solid transparent;
}
.modlist button:hover{background:var(--rule-soft); color:var(--ink)}
.modlist button[aria-current="true"]{
  color:var(--ink); font-weight:600; border-left-color:var(--copper); background:var(--rule-soft);
}
.modnum{
  font-family:"IBM Plex Mono",monospace; font-size:11.5px; color:var(--ink-faint);
  font-variant-numeric:tabular-nums;
}
.modlist button[aria-current="true"] .modnum{color:var(--copper)}
.tick{font-size:12px; color:var(--teal); opacity:0; transition:opacity .15s}
.done .tick{opacity:1}
.done .modnum{text-decoration:line-through}

/* ---------- reading column ---------- */
main{padding:0; min-width:0}
.sheet{
  background:var(--surface); border-left:0; min-height:100vh;
  padding:46px 56px 96px; max-width:none;
}
.wrap{max-width:74ch; margin:0 auto}
.eyebrow{
  font-family:"IBM Plex Mono",monospace; font-size:12px; letter-spacing:.12em;
  text-transform:uppercase; color:var(--copper); margin:0 0 8px;
}
h2.doctitle{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:700;
  font-size:38px; line-height:1.1; letter-spacing:-.02em; margin:0 0 6px; text-wrap:balance;
}
.rule{height:1px; background:var(--rule); margin:26px 0 32px}

#doc h2{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:23px; font-weight:600;
  letter-spacing:-.01em; margin:44px 0 12px; padding-top:14px;
  border-top:1px solid var(--rule-soft); text-wrap:balance;
}
#doc h3{
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:17px; font-weight:600;
  margin:28px 0 8px; color:var(--ink);
}
#doc p{margin:0 0 14px}
#doc strong{font-weight:600}
#doc ul,#doc ol{margin:0 0 16px; padding-left:22px}
#doc li{margin:0 0 6px}
#doc hr{border:0; border-top:1px solid var(--rule); margin:34px 0}

/* formulas + code */
#doc code{
  font-family:"IBM Plex Mono",monospace; font-size:.87em;
  background:var(--rule-soft); padding:1px 5px; border-radius:3px;
}
#doc pre{
  font-family:"IBM Plex Mono",monospace; font-size:13.5px; line-height:1.6;
  background:var(--surface); border:1px solid var(--rule);
  border-left:3px solid var(--copper);
  padding:14px 18px; overflow-x:auto; margin:0 0 18px; border-radius:0 3px 3px 0;
}
#doc pre code{background:none; padding:0; font-size:inherit}

/* blockquote = the "warning / think about this" voice */
#doc blockquote{
  margin:0 0 20px; padding:14px 18px; background:var(--teal-soft);
  border-left:3px solid var(--teal); font-style:normal;
}
#doc blockquote p:last-child{margin:0}

/* tables */
.tablewrap{overflow-x:auto; margin:0 0 20px}
#doc .cases .tablewrap, #doc .mat .tablewrap{margin:0; overflow:visible}
#doc table{border-collapse:collapse; width:100%; font-size:14.5px}
#doc th{
  /* deliberately NOT uppercased: in this course a header may be a variable,
     and n, N, v, V, s, S are different quantities */
  font-family:"IBM Plex Sans Condensed",sans-serif; font-weight:600; text-align:left;
  font-size:12.5px; letter-spacing:.03em; color:var(--ink-soft);
  border-bottom:1px solid var(--rule); padding:8px 12px 6px;
}
#doc td{
  padding:8px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:top;
  font-variant-numeric:tabular-nums;
}
#doc tbody tr:last-child td{border-bottom:1px solid var(--rule)}


/* ---------- mathematical typesetting ---------- */
#doc sub, #doc sup{
  font-size:.68em; line-height:0; position:relative; font-feature-settings:"tnum";
  padding-left:.04em;
}
#doc sub{ bottom:-.22em }
#doc sup{ top:-.42em }

/* display equations */
#doc .eq{
  font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16.5px; line-height:2.15; white-space:pre-wrap;
  margin:22px auto; padding:2px 0; max-width:100%;
  width:max-content; text-align:left; overflow-x:auto;
  color:var(--ink);
}
#doc .eq sub{ bottom:-.2em }

/* matrices and determinants */
#doc .eqrow{
  display:flex; align-items:center; justify-content:center; gap:10px;
  margin:26px auto; overflow-x:auto; font-family:"IBM Plex Serif",Georgia,serif;
  font-size:16.5px;
}
#doc .eqlhs{ white-space:nowrap }
#doc .mat{ display:inline-block; position:relative; padding:2px 12px }
#doc .mat table{ border-collapse:collapse; width:auto; margin:0 }
#doc .mat table td,
#doc .mat tbody tr td,
#doc .mat tbody tr:last-child td{
  padding:5px 14px; text-align:center; border:0; white-space:nowrap;
  font-variant-numeric:normal; background:none;
}
#doc .mat::before, #doc .mat::after{
  content:""; position:absolute; top:0; bottom:0; width:1px; background:var(--ink);
}
#doc .mat::before{ left:0 } #doc .mat::after{ right:0 }
#doc .mat-bracket::before, #doc .mat-bracket::after{
  width:7px; background:none; border-top:1px solid var(--ink);
  border-bottom:1px solid var(--ink);
}
#doc .mat-bracket::before{ border-left:1px solid var(--ink) }
#doc .mat-bracket::after{ border-right:1px solid var(--ink) }

@media (max-width:860px){
  #doc .eq, #doc .eqrow{ font-size:15px }
  #doc .mat td{ padding:4px 9px }
}

/* ---------- piecewise definitions ---------- */
/* Centre both children on the same axis. Relying on stretch put the table at
   the container's top while the brace was centred, and the container measured
   20px taller than either child, so the brace hung low by half that. */
#doc .cases{ display:inline-flex; align-items:center; gap:8px; line-height:0 }
#doc .cases .brace{ flex:0 0 auto; display:block; overflow:visible }
#doc .cases table{ line-height:normal }
#doc .cases table{ border-collapse:collapse; width:auto; margin:0 }
#doc .cases table td,
#doc .cases tbody tr td,
#doc .cases tbody tr:last-child td{
  height:30px; padding:0 0 0 2px; border:0; background:none;
  vertical-align:middle; white-space:nowrap; text-align:left;
  font-variant-numeric:normal;
}
#doc .cases td.cval{ padding-right:22px }
#doc .cases td.ccond{ color:var(--ink-soft) }

/* ---------- figures ---------- */
#doc figure.fig{
  margin:26px 0; padding:0; text-align:center;
  color:var(--ink);
}
#doc figure.fig svg{ margin:0 auto 6px }
#doc figure.fig figcaption{
  font-family:"IBM Plex Sans Condensed",system-ui,sans-serif;
  font-size:12px; line-height:1.45; color:var(--ink-soft);
  max-width:60ch; margin:4px auto 0; text-wrap:balance;
}
#doc img{
  display:block; margin:20px auto; max-width:100%; height:auto;
  background:#fff; padding:10px; border:1px solid var(--rule); border-radius:2px;
}

/* ---------- footer nav ---------- */
.pager{
  display:flex; gap:12px; justify-content:space-between; align-items:stretch;
  margin-top:52px; padding-top:22px; border-top:1px solid var(--rule);
}
.pager button{
  flex:1; text-align:left; background:var(--surface); border:1px solid var(--rule);
  padding:12px 16px; cursor:pointer; font-family:"IBM Plex Sans Condensed",sans-serif;
  color:var(--ink); font-size:15px; line-height:1.3;
}
.pager button:hover{border-color:var(--copper)}
.pager button:disabled{opacity:.35; cursor:default}
.pager button.next{text-align:right}
.pager span{display:block; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-bottom:3px}

.readbtn{
  display:inline-flex; align-items:center; gap:8px; margin-top:26px;
  background:none; border:1px solid var(--rule); color:var(--ink-soft);
  font-family:"IBM Plex Sans Condensed",sans-serif; font-size:13.5px;
  padding:8px 14px; cursor:pointer;
}
.readbtn:hover{border-color:var(--teal); color:var(--ink)}
.readbtn[aria-pressed="true"]{border-color:var(--teal); color:var(--teal); background:var(--teal-soft)}

/* ---------- mobile ---------- */
#mobsel{display:none}
@media (max-width:860px){
  body{grid-template-columns:1fr}
  #nav{display:none}
  #mobsel{
    display:block; position:sticky; top:0; z-index:5; background:var(--sidebar);
    border-bottom:1px solid var(--rule); padding:12px 18px;
  }
  #mobsel select{
    width:100%; font-family:"IBM Plex Sans Condensed",sans-serif; font-size:15px;
    padding:9px 10px; background:var(--surface); color:var(--ink);
    border:1px solid var(--rule); border-radius:2px;
  }
  .sheet{padding:28px 20px 72px}
  h2.doctitle{font-size:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<body>

<nav id="nav">
  <div class="brand">
    <h1>Solid State Electronics<br>in 15 Weeks</h1>
    <p>ELE 717 · Lecture 2 plan</p>
  </div>
  <ul class="modlist" id="modlist"></ul>
</nav>

<main>
  <div id="mobsel"><select id="sel" aria-label="Choose module"></select></div>
  <div class="sheet">
    <div class="wrap">
      <p class="eyebrow" id="eyebrow"></p>
      <h2 class="doctitle" id="doctitle"></h2>
      <div class="rule"></div>
      <article id="doc"></article>
      <button class="readbtn" id="readbtn" aria-pressed="false"></button>
      <div class="pager">
        <button id="prev"><span>Previous</span><b id="prevt"></b></button>
        <button id="next" class="next"><span>Next</span><b id="nextt"></b></button>
      </div>
    </div>
  </div>
</main>

<script>
/* ---- Mathematical typesetting -------------------------------------------
   Turns the plain-text notation used in the source files into real typographic
   subscripts and superscripts:

     a_x        -> a with subscript x
     E_t1       -> E with subscript t1
     e^{-jBz}   -> e with superscript -jBz
     r2 / 10-12 written with Unicode super/subscript characters is normalised
     to the same markup, so one mechanism handles everything.

   Runs after bold/italic and before code spans are restored, so code stays
   literal.                                                                  */

const SUP_CHARS = { "⁰":"0","¹":"1","²":"2","³":"3","⁴":"4",
  "⁵":"5","⁶":"6","⁷":"7","⁸":"8","⁹":"9",
  "⁻":"−","⁺":"+","ⁿ":"n" };
const SUB_CHARS = { "₀":"0","₁":"1","₂":"2","₃":"3","₄":"4",
  "₅":"5","₆":"6","₇":"7","₈":"8","₉":"9",
  "₋":"−","₊":"+","ₓ":"x","ᵧ":"y" };

const SUP_RE = /[⁰¹²³⁴-⁹⁺⁻ⁿ]+/g;
const SUB_RE = /[₀-₉₊₋ₓᵧ]+/g;

/* letters (incl. Greek), digits, and a leading sign are allowed in a bare run */
const RUN = "[A-Za-z0-9\\u0370-\\u03FF]";

function normaliseUnicodeScripts(s){
  s = s.replace(SUP_RE, m => "^{" + Array.from(m).map(c => SUP_CHARS[c]).join("") + "}");
  s = s.replace(SUB_RE, m => "_{" + Array.from(m).map(c => SUB_CHARS[c]).join("") + "}");
  return s;
}

/* Resolve marker{...} with brace counting, so a group may contain nested braces
   (Unicode normalisation injects them: e^{jω₀t} becomes e^{j_{0}t} first). */
function braced(s, marker, tag){
  let out = "", i = 0;
  for(;;){
    const j = s.indexOf(marker + "{", i);
    if(j < 0){ out += s.slice(i); return out; }
    out += s.slice(i, j);
    let depth = 0, k = j + 1;
    for(; k < s.length; k++){
      if(s[k] === "{") depth++;
      else if(s[k] === "}" && --depth === 0) break;
    }
    if(k >= s.length){ out += s.slice(j); return out; }   // unbalanced: leave alone
    out += "<" + tag + ">" + mathify(s.slice(j + 2, k)) + "</" + tag + ">";
    i = k + 1;
  }
}

function mathify(s){
  /* explicit groups first, recursing into their contents */
  s = braced(s, "^", "sup");
  s = braced(s, "_", "sub");
  /* then Unicode scripts, which become groups of their own */
  s = normaliseUnicodeScripts(s);
  s = braced(s, "^", "sup");
  s = braced(s, "_", "sub");
  /* finally bare runs: a_x, ^2 */
  s = s.replace(new RegExp("\\^(" + RUN + "+)", "g"), (m,c) => "<sup>" + c + "</sup>");
  s = s.replace(new RegExp("_("  + RUN + "+)", "g"), (m,c) => "<sub>" + c + "</sub>");
  return s;
}

/* ---- Matrices ------------------------------------------------------------
   ```matrix
   lhs: A x B  =
   style: det          (det = vertical bars, bracket = square brackets)
   a_x ; a_y ; a_z
   A_x ; A_y ; A_z
   ```                                                                       */
function matrixToHtml(body, esc){
  let lhs = "", style = "det";
  const rows = [];
  body.split("\n").forEach(line => {
    if(!line.trim()) return;
    const d = line.match(/^\s*(lhs|style)\s*:\s*(.*)$/i);
    if(d){ if(d[1].toLowerCase() === "lhs") lhs = d[2]; else style = d[2].trim(); return; }
    rows.push(line.split(";").map(c => c.trim()));
  });
  const body_ = rows.map(r =>
    "<tr>" + r.map(c => "<td>" + mathify(esc(c)) + "</td>").join("") + "</tr>").join("");
  return '<div class="eqrow">' +
      (lhs ? '<span class="eqlhs">' + mathify(esc(lhs)) + "</span>" : "") +
      '<span class="mat mat-' + (style === "bracket" ? "bracket" : "det") + '">' +
      "<table>" + body_ + "</table></span></div>";
}

/* ---- Piecewise definitions ------------------------------------------------
   ```cases
   lhs: u(t)  =
   1 ; t ≥ 0
   0 ; t < 0
   ```
   The brace is drawn to fit the row count exactly, rather than stretching one
   glyph, so the hooks keep their shape at any number of cases.               */
const CASE_ROW = 30;            /* must match #doc .cases td height in the CSS */

function brace(rows){
  const H = rows * CASE_ROW, m = H / 2, W = 11;
  const d = "M" + (W - 1) + ",1"
          + "C" + (W - 5) + ",1 " + (W - 6) + ",3 " + (W - 6) + ",6"
          + "L" + (W - 6) + "," + (m - 5)
          + "C" + (W - 6) + "," + (m - 2) + " " + (W - 8) + "," + m + " 1," + m
          + "C" + (W - 8) + "," + m + " " + (W - 6) + "," + (m + 2) + " " + (W - 6) + "," + (m + 5)
          + "L" + (W - 6) + "," + (H - 6)
          + "C" + (W - 6) + "," + (H - 3) + " " + (W - 5) + "," + (H - 1) + " " + (W - 1) + "," + (H - 1);
  return '<svg class="brace" width="' + W + '" height="' + H + '" '
       + 'viewBox="0 0 ' + W + ' ' + H + '" aria-hidden="true">'
       + '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="1.3" '
       + 'stroke-linecap="round"/></svg>';
}

function casesToHtml(body, esc){
  let lhs = "";
  const rows = [];
  body.split("\n").forEach(line => {
    if(!line.trim()) return;
    const d = line.match(/^\s*lhs\s*:\s*(.*)$/i);
    if(d){ lhs = d[1]; return; }
    const parts = line.split(";");
    rows.push([parts[0] || "", parts.slice(1).join(";") || ""]);
  });
  const body_ = rows.map(r =>
      '<tr><td class="cval">' + mathify(esc(r[0].trim())) + '</td>'
    + '<td class="ccond">' + mathify(esc(r[1].trim())) + "</td></tr>").join("");
  return '<div class="eqrow">'
       + (lhs ? '<span class="eqlhs">' + mathify(esc(lhs)) + "</span>" : "")
       + '<span class="cases">' + brace(rows.length)
       + "<table>" + body_ + "</table></span></div>";
}

/* Minimal markdown renderer, inlined so the page has no external dependencies. */
function mdToHtml(src){
  const esc = s => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  function inline(s){
    s = esc(s);
    const codes = [], figs = [];
    s = s.replace(/`([^`]+)`/g, function(m,c){ codes.push(c); return "\u0001" + (codes.length-1) + "\u0002"; });
    s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    s = s.replace(/\*([^*]+)\*/g, "<em>$1</em>");
    /* images: ![alt](src) — src is inlined as a data URI at build time */
    /* lazy alt so captions may contain brackets, e.g. "the sequence s[n]" */
    s = s.replace(/!\[([\s\S]*?)\]\(([^)\s]+)\)/g, function(m,alt,src){
      figs.push('<img src="' + src + '" alt="' + alt + '">');
      return "\u0005" + (figs.length-1) + "\u0006";
    });
    s = mathify(s);
    s = s.replace(/\u0005(\d+)\u0006/g, function(m,i){ return figs[+i]; });
    s = s.replace(/\u0001(\d+)\u0002/g, function(m,i){ return "<code>" + codes[+i] + "</code>"; });
    return s;
  }
  // Prose reflows; notation blocks (formula sheet, equation runs) keep their line breaks.
  function joinLines(arr){
    const mathy = arr.filter(x => /[=|⇒⟺→∮∫∇×·√]/.test(x)).length;
    const sep = (arr.length > 1 && mathy >= arr.length / 2) ? "<br>" : " ";
    // Join first, then parse inline markup, so **bold** spanning a source line
    // break is still closed correctly. \u0004 stands in for the join point.
    return inline(arr.join("\u0004")).split("\u0004").join(sep);
  }
  const lines = String(src).replace(/\r\n?/g,"\n").split("\n");
  const blank = l => !l.trim();
  const startsBlock = l =>
    /^#{1,6}\s/.test(l) || /^>\s?/.test(l) || /^```/.test(l) ||
    /^(---|\*\*\*|___)\s*$/.test(l) || /^\s*[-*]\s+/.test(l) ||
    /^\s*\d+\.\s+/.test(l) || /^\s*\|/.test(l) || /^ {4}\S/.test(l);
  const out = [];
  let i = 0;
  while(i < lines.length){
    const l = lines[i];
    if(blank(l)){ i++; continue; }

    if(/^```/.test(l)){
      const isMatrix = /^```\s*matrix\b/.test(l);
      const isFigure = /^```\s*figure\b/.test(l);
      const isCases  = /^```\s*cases\b/.test(l);
      i++; const buf = [];
      while(i < lines.length && !/^```/.test(lines[i])) buf.push(lines[i++]);
      i++;
      out.push(isMatrix ? matrixToHtml(buf.join("\n"), esc)
             : isCases  ? casesToHtml(buf.join("\n"), esc)
             : isFigure ? buf.join("\n")          /* already HTML, built locally */
                        : "<pre><code>" + esc(buf.join("\n")) + "</code></pre>");
      continue;
    }
    if(/^(---|\*\*\*|___)\s*$/.test(l)){ out.push("<hr>"); i++; continue; }

    const h = l.match(/^(#{1,6})\s+(.*)$/);
    if(h){ const n = h[1].length; out.push("<h"+n+">" + inline(h[2]) + "</h"+n+">"); i++; continue; }

    if(/^\s*\|/.test(l) && i+1 < lines.length && /^\s*\|[\s:|-]+\|\s*$/.test(lines[i+1])){
      // "\\|" is an escaped pipe (e.g. |A| for magnitude), not a cell separator.
      const cells = r => r.trim().replace(/\\\|/g,"\u0003").replace(/^\|/,"").replace(/\|$/,"")
                          .split("|").map(c => c.trim().replace(/\u0003/g,"|"));
      const head = cells(l); i += 2; const rows = [];
      while(i < lines.length && /^\s*\|/.test(lines[i])) rows.push(cells(lines[i++]));
      out.push("<table><thead><tr>" + head.map(c => "<th>"+inline(c)+"</th>").join("") +
        "</tr></thead><tbody>" +
        rows.map(r => "<tr>" + r.map(c => "<td>"+inline(c)+"</td>").join("") + "</tr>").join("") +
        "</tbody></table>");
      continue;
    }

    if(/^>\s?/.test(l)){
      const buf = [];
      while(i < lines.length && /^>\s?/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/,""));
      out.push("<blockquote>" + mdToHtml(buf.join("\n")) + "</blockquote>"); continue;
    }

    if(/^ {4}\S/.test(l)){
      const buf = [];
      while(i < lines.length && (/^ {4}/.test(lines[i]) ||
            (blank(lines[i]) && /^ {4}\S/.test(lines[i+1] || "")))){
        buf.push(lines[i].replace(/^ {4}/,"")); i++;
      }
      out.push('<div class="eq">' + mathify(esc(buf.join("\n"))) + "</div>"); continue;
    }

    if(/^\s*[-*]\s+/.test(l) || /^\s*\d+\.\s+/.test(l)){
      const ordered = /^\s*\d+\.\s+/.test(l);
      const re = ordered ? /^\s*\d+\.\s+/ : /^\s*[-*]\s+/;
      const items = [];
      while(i < lines.length && !blank(lines[i])){
        if(re.test(lines[i])){ items.push(lines[i].replace(re,"")); i++; }
        else if(/^\s+\S/.test(lines[i]) && items.length){ items[items.length-1] += "\n" + lines[i].trim(); i++; }
        else break;
      }
      const tag = ordered ? "ol" : "ul";
      out.push("<"+tag+">" + items.map(t => "<li>" + joinLines(t.split("\n")) + "</li>").join("") + "</"+tag+">");
      continue;
    }

    const buf = [];
    while(i < lines.length && !blank(lines[i]) && !startsBlock(lines[i])){ buf.push(lines[i]); i++; }
    if(!buf.length){ buf.push(lines[i]); i++; }
    out.push("<p>" + joinLines(buf) + "</p>");
  }
  return out.join("\n");
}

const MODS = [{"num": "00", "title": "Start Here", "body": "\n**Course:** ELE 717 Solid State Electronics (3 credits, compulsory), Postgraduate Diploma, Nigerian Defence Academy. **Lecturer:** Engr. Mrs Ruby Chinyere Beremeh Onyesoh.\n\nThis course follows the lecturer's own **15-week plan** (Lecture 2). There is one page per week, grouped into the five modules of the plan. Week 1 follows the issued lecture notes slide by slide. Weeks 2–15 teach each topic on the plan from scratch, because the notes for those weeks have not been issued yet.\n\nEach week ends with **solved questions**:\n\n- the lecturer's own **revision and calculation questions** (Week 1);\n- every one of the **50 PGD examination questions** (Q1–Q50), filed under the week that teaches it;\n- **CAT practice tests** with answers in Weeks 6 and 12.\n\n## The 15-week plan\n\n| Week | Topic (from the lecture plan) | Exam questions |\n|---|---|---|\n| **Module 1** | **Material Physics & Semiconductor Growth (Weeks 1–3)** | |\n| 1 | Introduction to semiconductor materials: elemental vs compound (Si, Ge, GaAs); crystal structures, Miller indices and bonding | Q1–Q8 |\n| 2 | Material growth: purification of silicon (metallurgical to electronic grade); Czochralski bulk growth; epitaxy (VPE, LPE, MBE) | Q9–Q13 |\n| 3 | Impurity control and doping: diffusion and ion implantation; controlled doping profiles and evaluation of impurity distribution | Q14–Q21 |\n| **Module 2** | **Energy Bands & Carrier Statistics (Weeks 4–6)** | |\n| 4 | Energy bands and carrier concentrations: quantum mechanics (Schrödinger, Kronig–Penney); band gaps; intrinsic and extrinsic concentrations | Q22–Q29, Q34 |\n| 5 | Carrier statistics: Fermi–Dirac function; density of states; Fermi level against temperature and doping | Q30–Q33 |\n| 6 | Continuous Assessment Test 1 and review: crystal structures and carrier statistics | CAT 1 practice |\n| **Module 3** | **Carrier Transport & Injection Phenomena (Weeks 7–9)** | |\n| 7 | Drift and diffusion currents: mobility, scattering, conductivity; diffusion, Fick's law, Einstein relation | Q35–Q40 |\n| 8 | High-field effects and excess carriers: velocity saturation, hot carriers; generation and recombination (SRH); lifetime and steady-state injection | Q41–Q44 |\n| 9 | Continuity equation and surface phenomena: minority-carrier continuity equation; surface states and surface recombination velocity | Q45–Q46 |\n| **Module 4** | **Junctions, Interfaces & Characterisation (Weeks 10–12)** | |\n| 10 | The p-n junction: built-in potential, depletion width, field profile; Shockley equation under forward and reverse bias | Q47–Q48 |\n| 11 | Metal–semiconductor interfaces: Schottky barrier vs Ohmic contact; band diagrams in equilibrium and under bias | Q49 |\n| 12 | Interface characterisation: C-V profiling, I-V analysis; CAT 2 | Q50, CAT 2 practice |\n| **Module 5** | **Advanced Device Technology (Weeks 13–15)** | |\n| 13 | Bipolar junction transistors: operation, minority-carrier profiles, emitter efficiency, base transport factor, α and β | — |\n| 14 | MOSFETs: ideal MOS capacitor (accumulation, depletion, inversion), threshold voltage, linear and saturation regions | — |\n| 15 | Revision and final exam preparation: formula sheet, problem-solving clinic, past-question review | All |\n\nAfter Week 15 there are two more pages: the **answer key** for all 50 exam questions, and the **laboratory practicals**.\n\n## Laboratory and practical component (3 hours/week)\n\nThe plan requires at least four practical or simulation experiments. Each one has its own section in the Laboratory page:\n\n1. **Simulation of carrier transport:** modelling Fermi-level shifts in MATLAB or Python.\n2. **I-V characterisation:** measuring and plotting the forward and reverse characteristics of a p-n junction and a Schottky diode.\n3. **C-V profiling:** finding doping concentration and built-in potential from capacitance measurements.\n4. **MOSFET parameter extraction:** measuring threshold voltage V_th and channel mobility.\n\n## Assessment\n\n- **CAT 1** (Week 6): crystal structures and carrier statistics (Weeks 1–5).\n- **CAT 2** (Week 12): transport, junctions and interfaces (Weeks 7–12).\n- **Final examination:** the whole course. The 50-question PGD paper is the best guide to its style.\n\n## How to study each week\n\n1. Read the week's notes once, straight through.\n2. Cover the answers and attempt every question on paper.\n3. For derivations, check you stated the assumptions; marks are given for them.\n4. Tick the week as read (the button at the bottom of each page) to track your progress.\n\n> Numbers to know without looking: E_g = 1.12 eV (Si), 0.66 eV (Ge), 1.42 eV (GaAs); n_i(Si) ≈ 1×10¹⁰ cm⁻³; kT/q = 0.0259 V at 300 K; q = 1.6×10⁻¹⁹ C; Si lattice constant 5.43 Å; μ_n(Si) ≈ 1350 cm²/V·s.\n\n## Textbooks\n\n*Fundamentals of Solid State Electronics* (C.-T. Sah, World Scientific, 1991); *Solid State Electronic Circuits* (Edward W. Maby); *Solid State Electronic Devices* (B. G. Streetman and S. K. Banerjee). Further reading: Sze and Ng, *Physics of Semiconductor Devices*; Neamen, *Semiconductor Physics and Devices*; Pierret, *Semiconductor Device Fundamentals*.\n", "group": "Course", "eyebrow": "Orientation", "disp": "00"}, {"num": "01", "title": "Introduction to Semiconductor Materials", "body": "\n**Plan:** elemental vs compound semiconductors (Si, Ge, GaAs); crystal structures, Miller indices and bonding mechanisms. This page follows the issued Lecture 2 notes in their own order, then goes to the depth the examination needs.\n\n## Introduction\n\nSemiconductor materials are the foundation of modern electronic and electrical systems. Almost every modern electronic device depends on them, including computers, mobile phones, solar cells, sensors, communication systems, power converters and control systems.\n\nA **semiconductor** is a material whose electrical conductivity lies between that of a good conductor and an insulator. More importantly, its conductivity can be **controlled** by temperature, light, electric fields, magnetic fields, and the intentional addition of impurities known as **dopants**.\n\nThe most important semiconductor materials used in electronics are:\n\n| Material | Type | Where you meet it |\n|---|---|---|\n| Silicon (Si) | Elemental | ICs, microprocessors, solar cells, power devices |\n| Germanium (Ge) | Elemental | Early transistors, infrared, SiGe high-speed transistors |\n| Gallium arsenide (GaAs) | Compound (III–V) | Microwave, RF, LEDs, lasers |\n| Gallium nitride (GaN) | Compound (III–V), wide gap | Blue/white LEDs, power and RF transistors |\n| Silicon carbide (SiC) | Compound (IV–IV), wide gap | High-voltage, high-temperature power electronics |\n| Indium phosphide (InP) | Compound (III–V) | Fibre-optic lasers and detectors, very high-speed circuits |\n| Gallium phosphide (GaP) | Compound (III–V) | Red, yellow and green indicator LEDs |\n\n## What is a semiconductor?\n\nA semiconductor is a material whose electrical conductivity lies between that of a conductor and an insulator, and can be **significantly controlled** by temperature, impurities, light or applied electric fields. Examples: silicon (Si), germanium (Ge) and gallium arsenide (GaAs).\n\nIts conductivity is **not fixed**, and that is exactly what makes it useful for electronic devices. Pure silicon at room temperature conducts poorly. When a small, controlled quantity of an impurity such as phosphorus or boron is introduced, its conductivity rises dramatically: one phosphorus atom per million silicon atoms raises the conductivity about 100,000 times. This process is called **doping**.\n\n## Classification of materials by electrical conductivity\n\nMaterials can broadly be classified into **conductors**, **semiconductors** and **insulators**.\n\n**Conductors** have a large number of free electrons available for electrical conduction. Examples: copper, aluminium, silver, gold, iron. Copper is widely used in electrical wiring because of its high conductivity. Characteristics:\n\n- high electrical conductivity (σ ≈ 10⁵–10⁶ S/cm);\n- low electrical resistivity (Cu: 1.7×10⁻⁶ Ω·cm);\n- large number of free charge carriers (about 10²² cm⁻³);\n- small, or effectively overlapping, energy gap.\n\n**Insulators** have very few free charge carriers under normal conditions. Examples: glass, rubber, plastic, ceramic, mica. They strongly resist the flow of electric current. Characteristics:\n\n- very high resistivity (10¹⁰–10¹⁸ Ω·cm);\n- very low conductivity;\n- large energy band gap (more than about 4 eV; SiO₂ ≈ 9 eV);\n- electrons strongly bound to their atoms.\n\n**Semiconductors** have conductivity between conductors and insulators. Examples: silicon, germanium, gallium arsenide, silicon carbide, gallium nitride. Their conductivity can be modified through **temperature, doping, illumination, electric field, magnetic field and mechanical stress**. This controllability is one of the most important characteristics of semiconductor materials.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 660 220\" role=\"img\" aria-label=\"Band diagrams of a metal with a partly filled band, a semiconductor with a small gap, and an insulator with a wide gap\" style=\"width:660px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"100.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Metal</text><text x=\"300.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Semiconductor</text><text x=\"500.0\" y=\"24.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Insulator</text><rect x=\"30.0\" y=\"70.0\" width=\"140.0\" height=\"110.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"30.0\" y=\"120.0\" width=\"140.0\" height=\"60.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"30.0\" y=\"70.0\" width=\"140.0\" height=\"110.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"24.0\" y1=\"120.0\" x2=\"176.0\" y2=\"120.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-dasharray=\"5 3\"/><text x=\"178.0\" y=\"124.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"100.0\" y=\"100.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">empty states</text><text x=\"100.0\" y=\"155.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">filled states</text><text x=\"100.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">partly filled band, no gap</text><rect x=\"230.0\" y=\"50.0\" width=\"140.0\" height=\"55.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"230.0\" y=\"135.0\" width=\"140.0\" height=\"55.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><circle cx=\"255.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"255.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"285.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"285.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"315.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"315.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><circle cx=\"345.0\" cy=\"98.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"345.0\" cy=\"142.0\" r=\"3.2\" style=\"fill:var(--surface,#fff);stroke:currentColor\" stroke-width=\"1.2\"/><line x1=\"380.0\" y1=\"105.0\" x2=\"380.0\" y2=\"135.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.8\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><text x=\"385.0\" y=\"124.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan> ≈ 1 eV</text><text x=\"300.0\" y=\"72.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">conduction band</text><text x=\"300.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">valence band</text><text x=\"300.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">small gap, a few carriers</text><rect x=\"430.0\" y=\"40.0\" width=\"140.0\" height=\"40.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"430.0\" y=\"150.0\" width=\"140.0\" height=\"40.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"580.0\" y1=\"80.0\" x2=\"580.0\" y2=\"150.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.8\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><text x=\"585.0\" y=\"119.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">g</tspan><tspan dy=\"-0.32em\">​</tspan> &gt; 4 eV</text><text x=\"500.0\" y=\"64.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">conduction band</text><text x=\"500.0\" y=\"174.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">valence band</text><text x=\"500.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">wide gap, no carriers</text><line x1=\"12.0\" y1=\"195.0\" x2=\"12.0\" y2=\"45.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-end=\"url(#ar)\"/><text x=\"18.0\" y=\"50.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;font-style:italic;\" opacity=\"1.0\">E</text></svg><figcaption>Band pictures at room temperature. In a metal the highest band is partly filled; in a semiconductor a small gap lets some electrons cross by thermal excitation; in an insulator the gap is too wide.</figcaption></figure>\n```\n\n### Comparison of conductors, semiconductors and insulators\n\n| Property | Conductor | Semiconductor | Insulator |\n|---|---|---|---|\n| Conductivity | Very high | Moderate, controllable | Very low |\n| Resistivity | Very low | Intermediate | Very high |\n| Band gap | Approximately zero | Small (≈ 0.5–3.5 eV) | Large (> 4 eV) |\n| Free electrons | Many | Moderate, controllable | Very few |\n| Temperature effect | Conductivity usually **decreases** | Conductivity usually **increases** | Small effect under normal conditions |\n| Examples | Cu, Ag, Al | Si, Ge, GaAs | Glass, rubber, plastic |\n| Main application | Wiring | Electronic devices | Electrical isolation |\n\n**Why the temperature effect is opposite.** In a metal the number of free electrons is fixed; heating only makes the lattice vibrate more, which scatters electrons, so resistance rises. In a semiconductor heating breaks covalent bonds and creates many more carriers (roughly as e^{−E_g/2kT}); the extra carriers far outweigh the extra scattering, so resistance falls.\n\n## Atomic structure of semiconductor materials\n\nAn atom consists of a **nucleus** containing **protons** (positive) and **neutrons** (neutral), with **electrons** (negative) occupying different energy levels (shells) around it, as in the Bohr model. The electrons in the outermost shell are the most important in determining the electrical properties of a material. These are the **valence electrons**.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 470 250\" role=\"img\" aria-label=\"Bohr model of silicon: a nucleus of 14 protons and 14 neutrons with shells holding 2, 8 and 4 electrons\" style=\"width:470px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><circle cx=\"150.0\" cy=\"125.0\" r=\"20\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"150.0\" y=\"123.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">14p</text><text x=\"150.0\" y=\"136.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">14n</text><circle cx=\"150.0\" cy=\"125.0\" r=\"42\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\"/><circle cx=\"192.0\" cy=\"125.0\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"108.0\" cy=\"125.0\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"150.0\" cy=\"125.0\" r=\"70\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\"/><circle cx=\"220.0\" cy=\"125.0\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"199.5\" cy=\"174.5\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"150.0\" cy=\"195.0\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"100.5\" cy=\"174.5\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"80.0\" cy=\"125.0\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"100.5\" cy=\"75.5\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"150.0\" cy=\"55.0\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"199.5\" cy=\"75.5\" r=\"5\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"150.0\" cy=\"125.0\" r=\"98\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\"/><circle cx=\"240.3\" cy=\"163.2\" r=\"5\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><circle cx=\"111.8\" cy=\"215.3\" r=\"5\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><circle cx=\"59.7\" cy=\"86.8\" r=\"5\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><circle cx=\"188.2\" cy=\"34.7\" r=\"5\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><text x=\"255.0\" y=\"30.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">valence shell: 4 electrons</text><line x1=\"254.0\" y1=\"34.0\" x2=\"222.0\" y2=\"52.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1\" opacity=\"0.8\"/><text x=\"290.0\" y=\"100.0\" text-anchor=\"start\" font-size=\"12\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Silicon, Z = 14</text><text x=\"290.0\" y=\"120.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">shells 2, 8, 4</text><text x=\"290.0\" y=\"138.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">1s² 2s² 2p⁶ 3s² 3p²</text><text x=\"290.0\" y=\"156.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"0.8\">atomic mass 28.085</text></svg><figcaption>Bohr model of silicon (Z = 14): shells hold 2, 8 and 4 electrons. The four outer electrons are the valence electrons.</figcaption></figure>\n```\n\n### Valence electrons\n\nThe electrons in the outermost energy level of an atom are its **valence electrons**. They take part in chemical bonding.\n\n| Atom | Z | Electron configuration | Valence electrons | Group |\n|---|---|---|---|---|\n| Silicon (Si) | 14 | 1s²2s²2p⁶3s²3p² (shells 2, 8, 4) | 4 | IV (14) |\n| Germanium (Ge) | 32 | 1s²2s²2p⁶3s²3p⁶4s²3d¹⁰4p² (shells 2, 8, 18, 4) | 4 | IV (14) |\n| Gallium (Ga) | 31 | [Ar]3d¹⁰4s²4p¹ | 3 | III (13) |\n| Arsenic (As) | 33 | [Ar]3d¹⁰4s²4p³ | 5 | V (15) |\n\nSilicon's atomic mass is 28.085. The difference in valence electrons between Ga (3) and As (5) is what allows them to combine into a compound semiconductor (average 4 per atom), and the difference between Si (4) and P (5) or B (3) is what makes doping work.\n\n## Covalent bonding in silicon\n\nSilicon atoms form a **covalent bonding structure**. Each silicon atom has four valence electrons and **shares** them with four neighbouring silicon atoms rrentColor\" stroke-width=\"1.2\"/><text x=\"122.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"122.0\" cy=\"174.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"122.0\" y=\"178.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"184.0\" cy=\"50.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"184.0\" y=\"54.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"184.0\" cy=\"112.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"184.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"184.0\" cy=\"174.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"184.0\" y=\"178.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"246.0\" cy=\"50.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"246.0\" y=\"54.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"246.0\" cy=\"112.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"246.0\" y=\"116.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"246.0\" cy=\"174.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"246.0\" y=\"178.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"162.0\" cy=\"80.0\" r=\"3.6\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><path d=\"M146.0,106 Q148.0,86 158.0,81\" style=\"fill:none;stroke:var(--copper,#B4622F)\" stroke-width=\"1.3\" opacity=\"1.0\" stroke-linejoin=\"round\" stroke-dasharray=\"3 2\" marker-end=\"url(#ars)\"/><line x1=\"166.0\" y1=\"78.0\" x2=\"262.0\" y2=\"40.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"0.8\" opacity=\"0.7\"/><text x=\"266.0\" y=\"38.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">free electron</text><text x=\"148.0\" y=\"146.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">hole</text><line x1=\"146.0\" y1=\"136.0\" x2=\"146.0\" y2=\"118.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"0.8\" opacity=\"1.0\"/></svg><figcaption>Two-dimensional picture of the silicon crystal. Each Si atom shares one electron pair with each of four neighbours. One bond has been broken by thermal energy, creating a free electron and a hole.</figcaption></figure>\n```\n\n- The shared electrons hold the crystal structure together.\n- At very low temperatures nearly all electrons stay in the covalent bonds, so electrical conductivity is very low (pure Si is an insulator at 0 K).\n- When sufficient energy is supplied (heat, light), some electrons break away from their bonds and become mobile.\n\n## Electron–hole pair generation\n\nWhen a valence electron receives sufficient energy (at least E_g = 1.12 eV in Si) from thermal excitation, it can leave its covalent bond:\n\n- the electron becomes a **free electron**;\n- the vacancy it leaves behind in the bond is called a **hole**.\n\n    Energy supplied → electron–hole pair\n\n- The electron carries negative charge, q = −1.6×10⁻¹⁹ C.\n- The hole behaves as if it has positive charge, q = +1.6×10⁻¹⁹ C. A neighbouring bond electron can jump into the hole, so the hole moves in the opposite direction to that electron.\n- **Both electrons and holes contribute to electrical conduction** in semiconductors. This two-carrier conduction is what separates semiconductors from metals.\n\nThe reverse process, a free electron falling back into a hole, is **recombination** (Week 8).\n\n## Intrinsic semiconductor\n\nAn **intrinsic semiconductor** is a pure semiconductor without intentionally introduced impurities. Examples: pure silicon, pure germanium. Every free electron came from a broken bond that also left a hole, so\n\n    n = p = n_i\n\nwhere n is the electron concentration, p the hole concentration and n_i the **intrinsic carrier concentration** (Si: about 1×10¹⁰ cm⁻³ at 300 K; Ge: 2.4×10¹³ cm⁻³). The number of electrons equals the number of holes. In thermal equilibrium the product is constant:\n\n    n · p = n_i²   (mass-action law, true for doped material too)\n\n## Extrinsic semiconductor\n\nAn **extrinsic semiconductor** is one whose electrical properties have been deliberately modified by adding controlled impurities. This process is **doping**. There are two major types: **n-type** and **p-type**.\n\n### N-type semiconductor\n\nProduced by adding a **pentavalent impurity** (five valence electrons): phosphorus (P), arsenic (As) or antimony (Sb). Suppose phosphorus is added to silicon. Four of its five valence electrons form covalent bonds with neighbouring Si atoms; the fifth is only weakly bound (about 0.045 eV) and easily becomes a free electron. The phosphorus atom is called a **donor**, and it is left as a fixed positive ion.\n\n- Majority carriers = **electrons**; minority carriers = **holes**.\n- n ≈ N_D (donor concentration), p = n_i²/N_D.\n\n### P-type semiconductor\n\nProduced by adding a **trivalent impurity** (three valence electrons): boron (B), aluminium (Al), gallium (Ga) or indium (In). When boron is introduced into silicon, only three covalent bonds can be completed. An electron is missing from the fourth bond; this missing electron is a **hole**. A neighbouring electron easily moves in, so the hole wanders through the crystal. Boron is called an **acceptor**, and it is left as a fixed negative ion.\n\n- Majority carriers = **holes**; minority carriers = **electrons**.\n- p ≈ N_A (acceptor concentration), n = n_i²/N_A.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 500 215\" role=\"img\" aria-label=\"Phosphorus in silicon has a fifth, loosely bound electron; boron in silicon leaves one bond short of an electron, a hole\" style=\"width:500px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"65.0\" y1=\"42.5\" x2=\"95.0\" y2=\"42.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.45\"/><line x1=\"65.0\" y1=\"49.5\" x2=\"95.0\" y2=\"49.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.45\"/><circle cx=\"73.0\" cy=\"46.0\" r=\"3\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"87.0\" cy=\"46.0\" r=\"3\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><line x1=\"46.5\" y1=\"61.0\" x2=\"46.5\" y2=\"91.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.45\"/><line x1=\"53.5\" y1=\"61.0\" x2=\"53.5\" y2=\"91.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opac lor\" stroke-width=\"1.2\"/><text x=\"330.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"390.0\" cy=\"46.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"390.0\" y=\"50.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"390.0\" cy=\"106.0\" r=\"14\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"390.0\" y=\"110.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">B</text><circle cx=\"390.0\" cy=\"166.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"390.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"450.0\" cy=\"46.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"450.0\" y=\"50.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"450.0\" cy=\"106.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"450.0\" y=\"110.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><circle cx=\"450.0\" cy=\"166.0\" r=\"14\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\"/><text x=\"450.0\" y=\"170.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Si</text><text x=\"420.0\" y=\"128.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">hole</text><text x=\"390.0\" y=\"205.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">p-type: boron acceptor</text></svg><figcaption>Left: a phosphorus atom in silicon donates its fifth electron (n-type). Right: a boron atom leaves one bond incomplete, creating a hole (p-type).</figcaption></figure>\n```\n\n**Example.** Silicon doped with N_D = 10¹⁶ cm⁻³ phosphorus at 300 K: n ≈ 10¹⁶ cm⁻³, p = (10¹⁰)²/10¹⁶ = 10⁴ cm⁻³. Electrons outnumber holes by 10¹².\n\n## Elemental semiconductors\n\nAn **elemental semiconductor** is made primarily from a single chemical element.\n\n- **Silicon (Si):** atomic number 14, four valence electrons. Widely used in integrated circuits, power electronics and solar cells.\n- **Germanium (Ge):** atomic number 32, four valence electrons. Higher carrier mobility than silicon, lower band gap. Used in specialised high-speed and infrared applications.\n\n## Compound semiconductors\n\n**Compound semiconductors** consist of two or more different elements. Examples: GaAs, GaN, InP, GaP, CdTe. They can provide properties that are difficult to achieve with elemental semiconductors:\n\n- **GaAs** has high electron mobility and is useful in high-frequency electronic systems.\n- **GaN** has a wide band gap (3.4 eV) and is important in power electronics, LEDs, RF systems and high-temperature electronics.\n\nThey are named by the periodic-table groups of their elements: **III–V** (GaAs, GaN, InP, GaP), **II–VI** (CdTe, ZnSe), **IV–IV** (SiC, SiGe). By alloying (e.g. Al_{x}Ga_{1−x}As) the band gap can be tuned, which is called band-gap engineering.\n\n## Silicon, germanium and gallium arsenide\n\n### Silicon\n\nSilicon is the most widely used semiconductor material in modern electronics.\n\n- Atomic number 14; four valence electrons; diamond-cubic crystal structure.\n- Band gap E_g ≈ 1.12 eV at room temperature.\n- Used for microprocessors, memory chips, diodes, transistors, solar cells, power devices, sensors and integrated circuits.\n\nWhy it dominates: it is abundant (sand), cheap, grows an excellent native oxide (SiO₂), has a band gap large enough for low leakage up to about 150 °C, and can be grown as huge, nearly perfect crystals.\n\n### Germanium\n\nGermanium was one of the earliest semiconductor materials, used extensively for early transistor technology (the first transistor, 1947, was germanium).\n\n- Four valence electrons; diamond-cubic crystal structure.\n- Band gap E_g ≈ 0.66 eV at room temperature.\n- **Advantages:** high carrier mobility; useful for high-speed applications; useful in infrared technology.\n- **Disadvantages:** smaller band gap; higher leakage current; less suitable than silicon for high-temperature applications (works only to about 75 °C).\n\n### Gallium arsenide\n\nGallium arsenide is a compound semiconductor of gallium and arsenic (Ga + As), abbreviated **GaAs**.\n\n- Band gap E_g ≈ 1.42 eV at room temperature (direct).\n- High electron mobility (about 8500 cm²/V·s, six times silicon), so it is particularly useful for high-frequency and optoelectronic applications.\n- Applications: microwave circuits, satellite communication, radar, high-frequency amplifiers, LEDs, laser diodes, photodetectors, solar cells.\n\n### Comparison of Si, Ge and GaAs\n\n| Property | Silicon | Germanium | GaAs |\n|---|---|---|---|\n| Symbol | Si | Ge | GaAs |\n| Type | Elemental | Elemental | Compound |\n| Valence electrons | 4 | 4 | III–V compound (average 4) |\n| Band gap | ≈ 1.12 eV | ≈ 0.66 eV | ≈ 1.42 eV |\n| Crystal structure | Diamond cubic | Diamond cubic | Zinc blende |\n| Electron mobility | Moderate (1350) | High (3900) | Very high (8500) |\n| Thermal stability | Good | Lower | Good |\n| Cost | Relatively low | Higher | High |\n| IC manufacturing | Excellent | Limited | Specialised |\n| High-frequency use | Good | Good | Excellent |\n| Optical applications | Limited | Good (infrared) | Excellent |\n\n(Mobilities in cm²/V·s at 300 K, added for reference.)\n\n## Energy band concept\n\nThe electrical behaviour of a semiconductor is explained using **energy bands**. When many atoms come together to form a solid, the discrete energy levels of the individual atoms spread into closely spaced energy states called **energy bands**. The two most important are:\n\n- **Valence band:** contains electrons involved in bonding.\n- **Conduction band:** contains electrons that can move through the material and contribute significantly to conduction.\n\nBetween them is the **forbidden energy gap**, or **band gap E_g**.\n\n### Energy band gap\n\nThe band gap is the energy difference between the conduction band and the valence band:\n\n    E_g = E_C − E_V\n\nwhere E_C is the conduction-band energy (bottom of the conduction band) and E_V the valence-band energy (top of the valence band). It is normally measured in **electron-volts** (1 eV = 1.6×10⁻¹⁹ J).\n\n**Why the band gap is important.** It strongly affects semiconductor behaviour. A smaller band gap makes it easier for electrons to gain enough energy to enter the conduction band; a larger band gap makes it harder. The band gap influences:\n\n- **electrical conductivity** (n_i ∝ e^{−E_g/2kT});\n- **temperature dependence** of conductivity;\n- **optical absorption** (only photons with hν ≥ E_g are absorbed);\n- **light emission** (emitted wavelength λ = 1.24/E_g μm);\n- **leakage current** (smaller gap, more leakage);\n- **breakdown behaviour** (wider gap, higher breakdown field);\n- **device operating temperature** (wider gap, hotter operation).\n\n## Direct and indirect band-gap semiconductors\n\nSemiconductors are classified by the relationship between the valence-band maximum and the conduction-band minimum in momentum (k).\n\n**Direct band gap:** electrons can transition between the conduction and valence bands without a significant change in momentum. Examples: GaAs, GaN, InP. These are suitable for **light-emitting devices**: LEDs, laser diodes, optical communication.\n\n**Indirect band gap:** a momentum change is required during the transition, supplied by a lattice vibration (phonon). Examples: silicon, germanium. Silicon is therefore **not an efficient light emitter**.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"E-k diagrams: in GaAs the band extrema line up at k equals zero; in silicon the conduction-band minimum is displaced in k\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"165.0\" y1=\"204.0\" x2=\"165.0\" y2=\"36.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.4\"/><text x=\"284.0\" y=\"208.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">k</text><text x=\"170.0\" y=\"38.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">E</text><line x1=\"50.0\" y1=\"204.0\" x2=\"280.0\" y2=\"204.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\"/><polyline points=\"50.0,197.3 51.4,195.8 52.9,194.4 54.3,193.0 55.8,191.6 57.2,190.2 58.6,188.9 60.1,187.6 61.5,186.2 62.9,184.9 64.4,183.7 65.8,182.4 67.2,181.2 68.7,179.9 70.1,178.7 71.6,177.5 73.0,176.4 74.4,175.2 75.9,174.1 77.3,172.9 78.8,171.8 80.2,170.8 81.6,169.7 83.1,168.7 84.5,167.6 85.9,166.6 87.4,165.6 88.8,164.7 90.2,163.7 91.7,162.8 93.1,161.8 94.6,160.9 96.0,160.1 97.4,159.2 98.9,158.4 100.3,157.5 101.8 dimensional pattern called a **crystal lattice**, and this crystal structure determines many of its physical properties. The important concepts are: lattice, unit cell, crystal planes, crystal directions, Miller indices and atomic bonding.\n\n### Crystal lattice and unit cell\n\n- A **crystal lattice** is a regular, repeating arrangement of atoms or points in space.\n- A semiconductor crystal can be described by repeating a basic structural unit known as the **unit cell**.\n- The unit cell contains enough information to reproduce the entire crystal by translation.\n\n## The cubic lattices\n\n| Structure | Atoms per cell | Coordination no. | Nearest-neighbour distance | APF |\n|---|---|---|---|---|\n| Simple cubic (SC) | 1 | 6 | a | 0.52 |\n| Body-centred cubic (BCC) | 2 | 8 | (√3/2)a | 0.68 |\n| Face-centred cubic (FCC) | 4 | 12 | (√2/2)a | 0.74 |\n| Diamond cubic | 8 | 4 | (√3/4)a | 0.34 |\n\nCounting atoms in a cubic cell: a corner atom is shared by 8 cells (counts 1/8), a face atom by 2 (counts 1/2), a body atom by 1.\n\n- SC: 8 × 1/8 = 1\n- BCC: 8 × 1/8 + 1 = 2\n- FCC: 8 × 1/8 + 6 × 1/2 = 4\n- Diamond: 8 × 1/8 + 6 × 1/2 + 4 inside = 8\n\n### Silicon crystal structure\n\n- Silicon has a **diamond-cubic** crystal structure.\n- It can be regarded as **two interpenetrating face-centred cubic (FCC)** structures, displaced from each other by a quarter of the body diagonal.\n- Each silicon atom has **four nearest-neighbour** silicon atoms, arranged at the corners of a tetrahedron (bond angle 109.5°).\n- The bonding is predominantly **covalent**.\n- This structure is responsible for many of silicon's useful semiconductor properties.\n\nFor Si (a = 5.43 Å): nearest-neighbour distance = (√3/4)a = 2.35 Å; atom density = 8/a³ = 5.0×10²² atoms/cm³.\n\n### Germanium crystal structure\n\n- Germanium also has the diamond-cubic structure; each Ge atom forms four covalent bonds with neighbouring Ge atoms.\n- Silicon and germanium therefore have similar bonding arrangements, but their atomic sizes (a = 5.65 Å for Ge) and electronic properties differ.\n\n### GaAs crystal structure\n\n- GaAs forms the **zinc-blende** crystal structure under ordinary conditions.\n- It consists of two interpenetrating FCC sublattices, one occupied by gallium and the other by arsenic. Each Ga has four As neighbours and vice versa.\n- The bonding is mainly covalent with partial ionic character (As is more electronegative than Ga). This structure contributes to its important electronic and optical properties.\n\n### Lattice constant\n\nThe **lattice constant** is a characteristic dimension of a crystal unit cell. For a cubic crystal it is written **a** and measured in metres, nanometres or angstroms (1 Å = 10⁻¹⁰ m = 0.1 nm). Si: 5.43 Å; Ge: 5.65 Å; GaAs: 5.65 Å.\n\nThe lattice constant determines: atomic spacing; crystal density; crystal matching between materials; epitaxial growth (a layer grows well only on a substrate with nearly the same a); and semiconductor heterostructures (e.g. AlGaAs on GaAs works because their lattice constants are almost identical).\n\n## Miller indices\n\nMiller indices provide a standard notation for crystallographic planes and directions:\n\n| Notation | Meaning |\n|---|---|\n| (h k l) | A plane |\n| {h k l} | A family of equivalent planes |\n| [u v w] | A direction |\n| ⟨u v w⟩ | A family of equivalent directions |\n\nThey are important in wafer orientation, crystal growth, etching, diffraction and device fabrication.\n\n### Procedure\n\n1. Determine the plane's intercepts on the x, y and z axes in lattice units.\n2. Take the reciprocals of the intercepts.\n3. Multiply by a common factor to obtain the smallest integers.\n4. Write the result as (h k l).\n\n- An intercept of **∞** gives an index of **0**, because the plane is parallel to that axis.\n- **Negative** indices are shown with a bar, e.g. (1̄10).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 640 215\" role=\"img\" aria-label=\"Unit cubes with the (100) face, the (110
