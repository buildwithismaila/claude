66.1,137.7 368.2,138.3 370.3,138.9 372.4,139.5 374.5,140.1 376.6,140.7 378.7,141.3 380.8,141.9 382.9,142.5 385.0,143.1 387.1,143.7 389.2,144.3 391.3,144.9 393.4,145.5 395.5,146.1 397.6,146.6 399.7,147.2 401.8,147.8 403.9,148.4 406.0,149.0 408.1,149.6 410.2,150.2 412.3,150.8 414.4,151.4 416.5,152.0 418.6,152.6 420.7,153.2 422.8,153.8 424.9,154.5 427.0,155.1 429.1,155.7 431.2,156.3 433.3,156.9 435.4,157.5 437.5,158.1 439.6,158.7 441.7,159.3 443.8,159.8 445.9,160.4 448.0,161.0 450.1,161.6 452.2,162.2 454.3,162.8 456.4,163.4 458.5,164.0 460.6,164.6 462.7,165.2 464.8,165.8 466.9,166.4 469.0,166.9 471.1,167.5 473.2,168.1 475.3,168.7 477.4,169.2 479.5,169.8 481.6,170.3 483.7,170.9 485.8,171.5 487.9,172.0 490.0,172.5\" fill=\"none\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"409.0\" y=\"142.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">N<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan> = 10<tspan dy=\"-0.45em\" font-size=\"72%\">17</tspan><tspan dy=\"0.45em\">​</tspan></text></svg><figcaption>Output of Practical 1: Fermi level against temperature for silicon. Each curve falls towards zero (mid-gap) once n<sub>i</sub> approaches N<sub>D</sub>.</figcaption></figure>\n```\n\n**Discussion points.** (1) Why does the curve flatten near zero at high T? (2) Why does heavier doping raise the maximum operating temperature? (3) What would change for germanium (E_g = 0.66 eV)? Germanium reaches n_i = 10¹⁵ cm⁻³ at only about 400 K, which is why Ge devices fail at modest temperatures.\n\n---\n\n## Practical 2 — I-V characterisation of a p-n junction and a Schottky diode\n\n**Aim.** Measure and plot the forward and reverse characteristics of a silicon p-n diode (e.g. 1N4148) and a Schottky diode (e.g. 1N5817 or BAT85); extract the saturation current, ideality factor and series resistance, and compare the two.\n\n**Theory (Weeks 10–12).** I = I_s[exp(qV/ηkT) − 1]. Above about 0.1 V, ln I = ln I_s + qV/(ηkT), so a semi-log plot is a straight line with slope q/(ηkT) and intercept ln I_s.\n\n**Apparatus.** DC supply (0–10 V) or source-measure unit, series resistor (1 kΩ for forward, none for reverse), two digital multimeters, breadboard, diodes.\n\n**Procedure.**\n\n1. Connect supply → resistor → diode (anode to +). Measure the diode voltage V and the current I (from the resistor voltage, or an ammeter).\n2. **Forward:** increase the supply so that V rises from 0 to 0.8 V (p-n) or 0 to 0.5 V (Schottky) in 0.05 V steps. Do not exceed the rated current.\n3. **Reverse:** reverse the diode, remove the resistor (or use 100 kΩ) and step V from 0 to −10 V, reading the small reverse current (μA range for Schottky, nA range for p-n).\n4. Plot I against V on linear axes, and ln I (or log₁₀ I) against V for the forward branch.\n\n**Example readings (forward):**\n\n| V (V) | I, p-n diode | I, Schottky diode |\n|---|---|---|\n| 0.15 | 0.003 μA | 0.016 mA |\n| 0.20 | 0.02 μA | 0.10 mA |\n| 0.25 | 0.13 μA | 0.63 mA |\n| 0.30 | 0.9 μA | 4.0 mA |\n| 0.35 | 5.7 μA | 25 mA |\n| 0.40 | 40 μA | (beyond rating) |\n| 0.50 | 1.7 mA | — |\n| 0.60 | 45 mA (bending: series resistance) | — |\n\n**Analysis.**\n\n- From the straight part of the p-n semi-log plot: between 0.3 V and 0.4 V, I rises from 0.9 μA to 40 μA, a factor of 44.4, so ln(44.4) = 3.79 per 0.1 V, slope = 37.9 V⁻¹. Then η = 1/(0.0259 × 37.9) = 1.02. Extrapolating to V = 0: I_s = 0.9 μA / e^{3.79×3} ≈ 1×10⁻¹¹ A.\n- Schottky diode: between 0.25 V and 0.35 V the current rises 40 times per 0.1 V, giving η ≈ 1.05 and I_s ≈ 0.1 mA / e^{0.20/0.0272} ≈ 6×10⁻⁸ A. It reaches a given current at about 0.25–0.3 V lower voltage than the p-n diode; I_s is several orders of magnitude larger, and the reverse current is much larger (μA instead of nA).\n- At high current the curves bend away from the straight line: the extra voltage is IR_s. R_s = ΔV/I where ΔV is the deviation from the extrapolated line.\n- Schottky barrier height: Φ_B = (kT/q) ln(A∗∗AT²/I_s), using the diode area A from the datasheet.\n\n**Discussion.** Explain the lower turn-on voltage and higher leakage of the Schottky diode in terms of majority-carrier thermionic emission over Φ_B versus minority-carrier diffusion (Weeks 10–11).\n\n---\n\n## Practical 3 — C-V profiling: doping and built-in potential\n\n**Aim.** Measure the capacitance of a reverse-biased one-sided junction (a varactor such as BB112, or a Schottky diode) against bias, and extract the doping concentration and the built-in potential.\n\n**Theory (Week 12).**\n\n    C = A √( qε_sN / 2(V_bi − V) )   ⇒   1/C² = 2(V_bi − V)/(qε_sNA²)\n\nThe plot of 1/C² against V is a straight line: the slope gives N, the voltage intercept gives V_bi.\n\n**Apparatus.** LCR meter with DC bias (1 MHz, 20–50 mV AC level), or a capacitance bridge; DC supply; shielded test fixture.\n\n**Procedure.**\n\n1. Null the fixture with the device removed (open-circuit correction) to remove stray capacitance.\n2. Connect the diode in reverse bias. Record C at V = 0, −1, −2, … −5 V (or the device's rated range).\n3. Plot C against V and 1/C² against V. Fit a straight line to 1/C².\n4. Take the area A from the datasheet (or measure the contact diameter).\n\n**Example readings** (A = 1.0×10⁻³ cm², Si):\n\n| V (V) | C (pF) | 1/C² (F⁻²) |\n|---|---|---|\n| 0 | 37.2 | 7.2×10²⁰ |\n| −1 | 22.8 | 1.92×10²¹ |\n| −2 | 17.9 | 3.12×10²¹ |\n| −3 | 15.2 | 4.33×10²¹ |\n| −4 | 13.4 | 5.57×10²¹ |\n| −5 | 12.2 | 6.72×10²¹ |\n\n**Analysis.**\n\n    Slope: (6.72×10²¹ − 7.2×10²⁰)/(−5 − 0) = −1.20×10²¹ F⁻²V⁻¹\n    N = 2/(qε_sA²|slope|) = 2/(1.602×10⁻¹⁹ × 1.036×10⁻¹² × 10⁻⁶ × 1.20×10²¹) = 1.0×10¹⁶ cm⁻³\n    Intercept: 1/C² = 0 at V = 7.2×10²⁰/1.20×10²¹ = +0.60 V  ⇒  V_bi = 0.60 V\n    Depletion depth at −5 V: W = ε_sA/C = 1.036×10⁻¹⁵/12.2×10⁻¹² = 0.85 μm\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 210\" role=\"img\" aria-label=\"1 over C squared against bias is a straight line whose slope gives the doping and whose voltage intercept gives the built-in potential\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"184.0\" x2=\"464.0\" y2=\"184.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"388.8\" y1=\"184.0\" x2=\"388.8\" y2=\"30.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"474.0\" y=\"188.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">V (V)</text><text x=\"393.8\" y=\"26.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">1/C²</text><line x1=\"99.0\" y1=\"180.0\" x2=\"99.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"99.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-5</text><line x1=\"157.0\" y1=\"180.0\" x2=\"157.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"157.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-4</text><line x1=\"214.9\" y1=\"180.0\" x2=\"214.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"214.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-3</text><line x1=\"272.9\" y1=\"180.0\" x2=\"272.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"272.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-2</text><line x1=\"330.9\" y1=\"180.0\" x2=\"330.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"330.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-1</text><line x1=\"446.8\" y1=\"180.0\" x2=\"446.8\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"446.8\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><polyline points=\"99.0,52.6 423.6,184.0\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"99.0\" cy=\"52.6\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"157.0\" cy=\"76.1\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"214.9\" cy=\"99.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"272.9\" cy=\"123.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"330.9\" cy=\"146.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"388.8\" cy=\"169.9\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"423.6\" cy=\"184.0\" r=\"3.6\" style=\"fill:var(--teal,#1C6E7E)\"/><text x=\"429.6\" y=\"176.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">V<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"259.7\" y=\"107.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">slope = −2/(qε<tspan dy=\"0.32em\" font-size=\"72%\">sNA</tspan><tspan dy=\"-0.32em\">​</tspan>²)</text><text x=\"81.6\" y=\"36.8\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">reverse bias</text></svg><figcaption>Mott–Schottky plot of the example readings. A straight line means uniform doping; curvature would reveal a doping profile N(W).</figcaption></figure>\n```\n\n**Discussion.** Why must the junction be one-sided? What would curvature in 1/C² tell you? Why measure in reverse bias only?\n\n---\n\n## Practical 4 — MOSFET parameter extraction: threshold voltage and channel mobility\n\n**Aim.** Measure the transfer and output characteristics of an n-channel enhancement MOSFET (e.g. a CD4007 array transistor or 2N7000) and extract V_th, μ_n and the transconductance.\n\n**Theory (Week 14).** In the linear region at small V_DS:\n\n    I_D ≈ μ_nC_ox(W/L)[(V_GS − V_T)V_DS − V_DS²/2]\n\nso I_D against V_GS is a straight line of slope g_m = μ_nC_ox(W/L)V_DS that meets I_D = 0 at V_GS = V_T + V_DS/2. In saturation, √I_D = √(μ_nC_oxW/2L)(V_GS − V_T).\n\n**Apparatus.** Two DC supplies (or a semiconductor parameter analyser), ammeter, voltmeters. C_ox, W and L from the datasheet or test structure.\n\n**Procedure.**\n\n1. **Transfer curve (linear):** set V_DS = 0.1 V. Step V_GS from 0 to 2.5 V in 0.25 V steps; record I_D.\n2. **Transfer curve (saturation):** set V_DS = V_GS (gate tied to drain) and repeat; plot √I_D against V_GS.\n3. **Output curves:** for V_GS = 1.0, 1.5, 2.0 V, sweep V_DS from 0 to 3 V; record I_D.\n4. Find V_T by linear extrapolation at the point of maximum slope; find μ_n from the slope.\n\n**Example readings** (linear region, V_DS = 0.1 V; device with C_ox = 3.45×10⁻⁷ F/cm², W/L = 10):\n\n| V_GS (V) | 0.5 | 1.0 | 1.5 | 2.0 | 2.5 |\n|---|---|---|---|---|---|\n| I_D (μA) | 15 | 84 | 153 | 222 | 291 |\n\n**Analysis.**\n\n    g_m = ΔI_D/ΔV_GS = (291 − 84) μA / 1.5 V = 1.38×10⁻⁴ S\n    Line through (1.0 V, 84 μA): I_D = 0 at V_GS = 1.0 − 84/138 = 0.39 V\n    V_T = 0.39 − V_DS/2 = 0.39 − 0.05 = 0.34 V\n    μ_n = g_m L / (W C_ox V_DS) = 1.38×10⁻⁴ / (10 × 3.45×10⁻⁷ × 0.1) = 400 cm²/V·s\n\nThe channel mobility (400) is about a third of bulk electron mobility in Si (1350) because of surface scattering at the Si/SiO₂ interface (Week 7). At high V_GS the measured slope falls further (mobility degradation by the vertical field), so the extraction uses the maximum-slope point.\n\n**Discussion.** Compare V_T from the linear and saturation methods. Why does mobility degrade at high gate voltage? How would a thicker oxide change V_T and g_m?\n\n---\n\n## Report format\n\nFor each practical: title and aim; brief theory with the equations used; circuit diagram; apparatus; procedure; tables of readings with units; graphs (labelled axes, units, fitted lines); calculations; results with uncertainties; discussion of sources of error (lead resistance, stray capacitance, self-heating, meter resolution); conclusion.\n", "group": "Revision & Practicals", "eyebrow": "Revision & Practicals", "disp": "·"}, {"num": "18", "title": "Glossary — Symbols, Constants and Abbreviations", "body": "\nEvery symbol, constant and abbreviation used anywhere in the course, with its meaning and units. Each week also has its own shorter table near the top, listing only what that week uses.\n\n## Constants and units\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| ħ | Reduced Planck constant, h/2π | 1.055×10⁻³⁴ J·s |\n| m₀ | Free-electron mass | 9.11×10⁻³¹ kg |\n| ε₀ | Permittivity of free space | 8.854×10⁻¹⁴ F/cm |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| ε_ox | Permittivity of SiO₂, 3.9ε₀ | 3.45×10⁻¹³ F/cm |\n| ε_r | Relative permittivity (dielectric constant) | Si 11.7, SiO₂ 3.9, GaAs 12.9 |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| Å | Ångström, a unit of length | 1 Å = 10⁻¹⁰ m = 0.1 nm |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n## Symbols\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| E_Fn, E_Fp | Quasi-Fermi levels for electrons and holes, used out of equilibrium | eV |\n| E_D | Donor energy level, just below E_c | eV; E_c − E_D ≈ 0.045 eV for P in Si |\n| E_A | Acceptor energy level, just above E_v | eV; E_A − E_v ≈ 0.045 eV for B in Si |\n| E_t | Energy level of a trap (recombination centre) in the gap | eV |\n| E_a | Activation energy of dopant diffusion | eV; about 3–4 eV |\n| E_n | Allowed energy of level n of a particle in a box | J or eV |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| g(E), g_c, g_v | Density of states: allowed states per unit energy per unit volume | states/(eV·cm³) |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| n₀, p₀ | Equilibrium electron and hole concentrations | cm⁻³ |\n| p_n0, n_p0 | Equilibrium minority concentrations: holes on the n side, electrons on the p side | cm⁻³; p_n0 = n_i²/N_D |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| N_D⁺, N_A⁻ | Concentrations of ionised donors and acceptors | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| m∗, m_n∗, m_p∗ | Effective mass of electrons or holes | kg, or as a multiple of m₀ |\n| ψ | Wave function (\\|ψ\\|² is the probability density) | — |\n| V(x) | Potential energy in the Schrödinger equation | J or eV |\n| k (wave vector) | Wave vector, 2π/λ; measures the electron's momentum, p = ħk | m⁻¹ or cm⁻¹ |\n| α (Kronig–Penney) | √(2mE)/ħ, set by the electron energy | m⁻¹ |\n| P (Kronig–Penney) | Barrier strength mV₀ba/ħ² | dimensionless |\n| V₀ | Height of a potential barrier | J or eV |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| ν, hν | Frequency of light, and photon energy | Hz; eV |\n| a | Lattice constant: edge length of the cubic unit cell | Å; Si 5.43, Ge and GaAs 5.65 |\n| (h k l), {h k l} | Miller indices of a plane; family of equivalent planes | integers |\n| [u v w], ⟨u v w⟩ | A crystal direction; family of equivalent directions | integers |\n| d_hkl | Spacing between neighbouring (h k l) planes, a/√(h² + k² + l²) | Å |\n| r_nn | Nearest-neighbour distance | Å; Si 2.35 |\n| k₀ | Segregation coefficient, C_s/C_l at the freezing interface | dimensionless; B 0.8, P 0.35 |\n| C_s | Surface concentration of a diffusion (or solid concentration when freezing) | cm⁻³ |\n| C_l, C₀ | Concentration in the melt (liquid); C₀ at the start | cm⁻³ |\n| f (growth) | Fraction of the melt already solidified | 0 to 1 |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| D | Diffusion coefficient (dopants in a furnace, or carriers) | cm²/s |\n| D₀ | Diffusion constant in D = D₀e^{−E_a/kT} | cm²/s |\n| J (Fick) | Dopant flux: atoms crossing 1 cm² per second | atoms/(cm²·s) |\n| F | Particle flux in Fick's law | particles/(cm²·s) |\n| Q | Dose: dopant atoms per unit area (in Weeks 13–14, Q also means char const KEY = "pgdee-sse-weekly-read";
let read = new Set();
try { read = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify([...read])); } catch(e) {} }

const list = document.getElementById("modlist");
const sel  = document.getElementById("sel");
let cur = 0;

let lastGroup = null;
MODS.forEach((m,i)=>{
  if (m.group && m.group !== lastGroup && m.num !== "00") {
    const gl = document.createElement("li");
    gl.className = "seclabel grouplabel"; gl.textContent = m.group;
    list.appendChild(gl);
  }
  lastGroup = m.group;
  const li = document.createElement("li");
  const b  = document.createElement("button");
  b.innerHTML = '<span class="modnum">'+m.disp+'</span><span>'+m.title+'</span><span class="tick">&#10003;</span>';
  b.onclick = ()=>show(i);
  li.appendChild(b); list.appendChild(li);
  const o = document.createElement("option");
  o.value = i; o.textContent = (m.eyebrow && m.num !== "00" ? m.eyebrow : m.disp) + " · " + m.title;
  sel.appendChild(o);
});
sel.onchange = e => show(+e.target.value);

function show(i){
  cur = i;
  const m = MODS[i];
  document.getElementById("eyebrow").textContent =
    m.eyebrow + (m.group && m.eyebrow !== m.group ? "  ·  " + m.group : "");
  document.getElementById("doctitle").textContent = m.title;
  const doc = document.getElementById("doc");
  doc.innerHTML = mdToHtml(m.body);
  /* Only data tables get the scrolling wrapper. Matrices and piecewise cases
     use a table for layout; wrapping them adds the wrapper's bottom margin to
     the flex line, which pushed the brace and the determinant bars out of
     alignment with their own rows. */
  doc.querySelectorAll("table").forEach(t=>{
    if (t.closest(".cases, .mat")) return;
    const w = document.createElement("div");
    w.className = "tablewrap";
    t.parentNode.insertBefore(w,t); w.appendChild(t);
  });

  [...list.querySelectorAll("li:not(.grouplabel) button")].forEach((b,j)=>{
    b.setAttribute("aria-current", j===i ? "true" : "false");
    b.parentNode.classList.toggle("done", read.has(MODS[j].num));
  });
  sel.value = i;

  const rb = document.getElementById("readbtn");
  const isRead = read.has(m.num);
  rb.setAttribute("aria-pressed", isRead ? "true" : "false");
  rb.textContent = isRead ? "✓  Marked as read" : "Mark this module read";
  rb.onclick = ()=>{ read.has(m.num) ? read.delete(m.num) : read.add(m.num); save(); show(i); };

  const p = document.getElementById("prev"), n = document.getElementById("next");
  p.disabled = i===0; n.disabled = i===MODS.length-1;
  document.getElementById("prevt").textContent = i>0 ? MODS[i-1].title : "—";
  document.getElementById("nextt").textContent = i<MODS.length-1 ? MODS[i+1].title : "—";
  p.onclick = ()=>show(i-1); n.onclick = ()=>show(i+1);

  window.scrollTo(0,0);
}

document.addEventListener("keydown", e=>{
  if(e.target.tagName === "SELECT") return;
  if(e.key === "ArrowRight" && cur < MODS.length-1) show(cur+1);
  if(e.key === "ArrowLeft"  && cur > 0) show(cur-1);
});

show(0);

/* Downloads: inside claude.ai the page asks the viewer to confirm the save; opened
   as a local file it falls back to a plain link to the file beside it. */
const FILES = { docx: "ELE717-Solid-State-Electronics.docx", pdf: "ELE717-Solid-State-Electronics.pdf" };
function dlMsg(t){ document.querySelectorAll(".dl-msg").forEach(p => p.textContent = t); }
async function download(fmt){
  const name = FILES[fmt], url = "downloads/" + name;
  const btns = document.querySelectorAll(".dlbtn");
  btns.forEach(b => b.disabled = true);
  try {
    const d = window.claude && typeof window.claude.use === "function"
      ? await window.claude.use("downloads") : null;
    if (d) {
      dlMsg("Preparing " + name + "…");
      let data;
      if (fmt === "docx") {
        /* The page host serves no .docx files, so the Word file is published as
           base64 text and rebuilt into bytes here. */
        const r = await fetch(url + ".b64.txt");
        if (!r.ok) throw { code: "missing" };
        const bin = atob((await r.text()).trim());
        data = new Uint8Array(bin.length);
        for (let i = 0; i < bin.length; i++) data[i] = bin.charCodeAt(i);
      } else {
        const r = await fetch(url);
        if (!r.ok) throw { code: "missing" };
        data = await r.blob();
      }
      await d.save({ filename: name, data });
      dlMsg("Saved " + name + ".");
    } else if (location.protocol === "file:" || !window.claude) {
      const a = document.createElement("a");
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      dlMsg("If nothing happens, open the downloads folder next to this page.");
    } else {
      dlMsg("Downloads are not available in this view.");
    }
  } catch (e) {
    const code = e && e.code;
    dlMsg(code === "declined" ? "" :
          code === "rate_limited" ? "A download prompt is already open." :
          code === "missing" ? "The " + fmt.toUpperCase() + " file could not be found." :
          "Downloads are not available in this view.");
  } finally {
    btns.forEach(b => b.disabled = false);
  }
}
document.querySelectorAll(".dlbtn").forEach(b => b.addEventListener("click", () => download(b.dataset.fmt)));
</script>
