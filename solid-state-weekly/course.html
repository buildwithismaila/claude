r(--teal,#1C6E7E);\" opacity=\"1.0\">N<tspan dy=\"0.32em\" font-size=\"72%\">D</tspan><tspan dy=\"-0.32em\">​</tspan> = 10<tspan dy=\"-0.45em\" font-size=\"72%\">17</tspan><tspan dy=\"0.45em\">​</tspan></text></svg><figcaption>Fermi level relative to E<sub>i</sub> against temperature for silicon at four donor concentrations (cm⁻³). Heavier doping keeps the Fermi level away from mid-gap up to a higher temperature.</figcaption></figure>\n```\n\n## 18. Worked example: n-type silicon\n\n#### Example 5.3: majority and minority carriers\n\n**Question.** Silicon at 300 K is doped with N_D = 1×10¹⁶ cm⁻³. Assuming n_i = 1×10¹⁰ cm⁻³ and complete donor ionisation, calculate the electron and hole concentrations and identify the majority and minority carriers.\n\n**Given:** N_D = 1×10¹⁶ cm⁻³, n_i = 1×10¹⁰ cm⁻³, T = 300 K.\n\n**Find:** n, p; majority and minority carriers.\n\n**Solution.**\n\nStep 1: electron concentration. Since N_D ≫ n_i (10¹⁶ ≫ 10¹⁰), every donor contributes one electron:\n\n    n ≈ N_D = 1×10¹⁶ cm⁻³\n\nStep 2: hole concentration, from the mass-action law:\n\n    p = n_i²/n = (1×10¹⁰)² / (1×10¹⁶) = 10²⁰/10¹⁶ = 1×10⁴ cm⁻³\n\n**Answer:** **n = 1×10¹⁶ cm⁻³, p = 1×10⁴ cm⁻³.** Electrons are the majority carriers, holes the minority carriers. (With n_i = 1.5×10¹⁰ cm⁻³, p = 2.25×10⁴ cm⁻³; the method is identical.)\n\n## 19. Worked example: Fermi level of n-type silicon\n\n#### Example 5.4: Fermi level of n-type silicon\n\n**Question.** For the silicon of Example 5.3 (n = N_D = 1×10¹⁶ cm⁻³, n_i = 1×10¹⁰ cm⁻³) at 300 K, calculate the position of the Fermi level relative to the intrinsic level, and estimate how far it lies below the conduction band.\n\n**Given:** n = 1×10¹⁶ cm⁻³, n_i = 1×10¹⁰ cm⁻³, kT = 0.02585 eV, E_g = 1.12 eV.\n\n**Find:** E_F − E_i, and E_c − E_F.\n\n**Solution.**\n\n    E_F − E_i = kT ln(n/n_i) = 0.02585 × ln(10¹⁶/10¹⁰) = 0.02585 × ln(10⁶)\n\nSince ln(10⁶) = 6 × 2.303 = 13.82,\n\n    E_F − E_i = 0.02585 × 13.82 = 0.357 eV\n\nE_i is close to mid-gap, 0.56 eV below E_c, so\n\n    E_c − E_F ≈ 0.56 − 0.357 = 0.20 eV\n\n**Answer:** **E_F = E_i + 0.357 eV**, about 0.20 eV below E_c: the Fermi level has moved up towards the conduction band. (With n_i = 1.5×10¹⁰ cm⁻³: E_F − E_i = 0.02585 ln(6.67×10⁵) = 0.347 eV.)\n\n## 20. Worked example: p-type silicon\n\n#### Example 5.5: carriers and Fermi level in p-type silicon\n\n**Question.** Silicon at 300 K is doped with N_A = 1×10¹⁷ cm⁻³ boron atoms. Taking n_i = 1×10¹⁰ cm⁻³, calculate the hole and electron concentrations and the position of the Fermi level.\n\n**Given:** N_A = 1×10¹⁷ cm⁻³, n_i = 1×10¹⁰ cm⁻³, kT = 0.02585 eV.\n\n**Find:** p, n and E_i − E_F.\n\n**Solution.**\n\n    p ≈ N_A = 1×10¹⁷ cm⁻³\n    n = n_i²/p = 10²⁰/10¹⁷ = 1×10³ cm⁻³\n    E_i − E_F = kT ln(p/n_i) = 0.02585 × ln(10⁷) = 0.02585 × 16.12 = 0.417 eV\n\n**Answer:** **p = 1×10¹⁷ cm⁻³, n = 1×10³ cm⁻³, E_F = E_i − 0.417 eV**: the Fermi level moves down towards the valence band, about 0.56 − 0.417 = 0.14 eV above E_v.\n\n## 21. Degenerate and non-degenerate semiconductors\n\nThe Maxwell–Boltzmann approximation is valid only when the Fermi level is far enough from the band edges. For a **non-degenerate** semiconductor:\n\n    E_c − E_F ≫ kT  (n-type),     E_F − E_v ≫ kT  (p-type)\n\nIn practice \"≫\" means more than about 3kT.\n\nIn a **degenerate** semiconductor the doping is very high (in Si, above about 10¹⁸–10¹⁹ cm⁻³) and the Fermi level approaches, or even enters, the conduction or valence band. Then the full Fermi–Dirac statistics must be used, and the material behaves almost like a metal. Degenerate n⁺ and p⁺ layers are used for Ohmic contacts (Week 11) and tunnel diodes.\n\n| Feature | Non-degenerate | Degenerate |\n|---|---|---|\n| Doping | Relatively low or moderate | Very high |\n| Statistics | Maxwell–Boltzmann approximation | Fermi–Dirac |\n| Fermi level | Inside the band gap, more than 3kT from the edges | Near or inside a band |\n| Carrier concentration | Simple exponential equations | More complex |\n\n**Check.** For Si with N_D = 10¹⁸ cm⁻³, E_c − E_F = 0.02585 ln(2.8×10¹⁹/10¹⁸) = 0.086 eV = 3.3kT, just non-degenerate. At 10¹⁹ cm⁻³, E_c − E_F = 0.027 eV ≈ 1kT: degenerate.\n\n## 22. Relationship between carrier concentration and Fermi level\n\nThe electron concentration increases exponentially as the Fermi level approaches the conduction band, n = N_c e^{−(E_c − E_F)/kT}. Similarly, the hole concentration increases as the Fermi level approaches the valence band, p = N_v e^{−(E_F − E_v)/kT}. Therefore:\n\n- Fermi level closer to E_c → more electrons (n-type).\n- Fermi level closer to E_v → more holes (p-type).\n- Fermi level at E_i → n = p = n_i (intrinsic).\n\n## 23. Temperature dependence of intrinsic carrier concentration\n\nRecall n_i = √(N_cN_v) e^{−E_g/2kT}. Since N_c and N_v are each proportional to T^{3/2}, their product's square root is proportional to T^{3/2}, so approximately\n\n    n_i ∝ T^{3/2} e^{−E_g/2kT}\n\nThe **exponential term** is especially important. As temperature increases, kT increases, the negative exponent −E_g/2kT gets smaller in magnitude, and e^{−E_g/2kT} increases rapidly. The T^{3/2} factor adds a smaller increase. For silicon, n_i roughly doubles every 8 °C near room temperature, and rises about 25,000 times between 300 K and 500 K.\n\nTherefore semiconductor conductivity generally **increases with temperature**, because more electron–hole pairs are thermally generated.\n\n## 24. Formula sheet for carrier statistics\n\n| Quantity | Formula |\n|---|---|\n| Fermi–Dirac function | f(E) = 1/(1 + e^{(E − E_F)/kT}) |\n| Electron concentration | n = N_c e^{−(E_c − E_F)/kT} = n_i e^{(E_F − E_i)/kT} |\n| Hole concentration | p = N_v e^{−(E_F − E_v)/kT} = n_i e^{(E_i − E_F)/kT} |\n| Effective density of states | N_c = 2(2πm_n∗kT/h²)^{3/2}, N_v = 2(2πm_p∗kT/h²)^{3/2} |\n| Intrinsic carrier concentration | n_i = √(N_cN_v) e^{−E_g/2kT} |\n| Mass action law | np = n_i² |\n| Intrinsic Fermi level | E_i = (E_c + E_v)/2 + (kT/2) ln(N_v/N_c) ≈ mid-gap |\n| N-type Fermi level | E_F − E_i = kT ln(N_D/n_i) |\n| P-type Fermi level | E_i − E_F = kT ln(N_A/n_i) |\n| Charge neutrality | p + N_D⁺ = n + N_A⁻ |\n\n## 25. Summary: what you should be able to do\n\n1. Explain the concept of carrier statistics in semiconductors.\n2. Define and use the Fermi–Dirac distribution function.\n3. Explain the physical meaning of the Fermi energy level.\n4. Calculate the probability of electron occupation of an energy state.\n5. Explain the density of states in the conduction and valence bands.\n6. Calculate electron and hole concentrations.\n7. Calculate the intrinsic carrier concentration.\n8. Apply the mass action law.\n9. Determine the position of the Fermi level.\n10. Explain the effect of donor and acceptor doping on the Fermi level.\n11. Distinguish between intrinsic, n-type and p-type semiconductors.\n12. Explain the effect of temperature on carrier concentration.\n13. Distinguish between degenerate and non-degenerate semiconductors.\n14. Apply the charge-neutrality equation to doped semiconductors.\n\n---\n\n## 26. Mid-module evaluation, solved\n\nThese are the lecturer's mid-module evaluation questions. The numerical values in the printed note did not come through in the copy provided, so the calculations below use the standard silicon values stated in each question. If your copy gives different numbers, follow the same steps.\n\n### Part A: short-answer questions\n\n**A1. Define carrier statistics.** Carrier statistics is the study of how electrons and holes are distributed among the allowed energy states of a semiconductor in thermal equilibrium. It combines the density of states with the Fermi–Dirac probability to calculate the electron and hole concentrations and the position of the Fermi level.\n\n**A2. What is the Fermi energy level?** The Fermi level E_F is the energy at which the probability of a state being occupied by an electron is exactly one half. At 0 K it is the boundary between filled and empty states. Its position relative to E_c and E_v determines the electron and hole concentrations, and in equilibrium it is constant throughout a material or device.\n\n**A3. State the Fermi–Dirac distribution function.** f(E) = 1/(1 + e^{(E − E_F)/kT}), where f(E) is the probability that a state of energy E is occupied, E_F the Fermi level, k Boltzmann's constant and T the absolute temperature.\n\n**A4. What is the probability that a state at E = E_F is occupied?** Exactly **½ (50 %)**, because the exponent is zero: f = 1/(1 + e⁰) = 1/2. This is true at any temperature.\n\n**A5. Define density of states.** The density of states g(E) is the number of allowed electron energy states per unit energy per unit volume at energy E (states/eV·cm³). In a parabolic band, g_c(E) ∝ √(E − E_c) in the conduction band and g_v(E) ∝ √(E_v − E) in the valence band; it is zero in the band gap.\n\n**A6. What is meant by effective density of states?** The effective density of states (N_c for the conduction band, N_v for the valence band) is the number of states that, if all placed at the band edge, would give the same carrier concentration as the real distributed band. It lets the carrier concentration be written simply as n = N_ce^{−(E_c − E_F)/kT}. For Si at 300 K, N_c = 2.8×10¹⁹ and N_v = 1.04×10¹⁹ cm⁻³.\n\n**A7. Distinguish between intrinsic and extrinsic semiconductors.** An intrinsic semiconductor is pure: its carriers come only from thermal breaking of bonds, so n = p = n_i and E_F ≈ E_i (mid-gap). An extrinsic semiconductor is doped with donors or acceptors: one carrier type dominates (n ≈ N_D or p ≈ N_A), E_F moves towards E_c or E_v, and the carrier concentration is set by the doping rather than by temperature.\n\n**A8. Define majority and minority carriers.** Majority carriers are the more numerous carrier type in a doped semiconductor (electrons in n-type, holes in p-type). Minority carriers are the less numerous type (holes in n-type, electrons in p-type). In n-type Si with N_D = 10¹⁶ cm⁻³, there are 10¹⁶ majority electrons and only 10⁴ minority holes per cm³.\n\n**A9. State the mass action law.** In thermal equilibrium the product of the electron and hole concentrations is constant at a given temperature: np = n_i², regardless of doping (for a non-degenerate semiconductor).\n\n**A10. Explain why doping changes the Fermi level.** The Fermi level is tied to the carrier concentrations by n = n_ie^{(E_F − E_i)/kT}. Donors add electrons, so n rises above n_i; for the equation to hold, E_F must rise above E_i (towards E_c), by kT ln(N_D/n_i). Acceptors add holes, so p rises and E_F must fall towards E_v by kT ln(N_A/n_i). The heavier the doping, the larger the shift.\n\n### Part B: calculation questions\n\n**B1. At 300 K, find the probability that a state 0.10 eV above the Fermi level is occupied (kT = 0.02585 eV).**\n\n    f = 1/(1 + e^{0.10/0.02585}) = 1/(1 + e^{3.868}) = 1/(1 + 47.85) = 0.0205\n\nThe probability is **0.0205, about 2 %**.\n\n**B2. Silicon has N_D = 1×10¹⁶ cm⁻³ and n_i = 1×10¹⁰ cm⁻³. Assuming complete ionisation, find (a) n, (b) p, (c) the majority carrier.**\n\n    (a) n ≈ N_D = 1×10¹⁶ cm⁻³\n    (b) p = n_i²/n = 10²⁰/10¹⁶ = 1×10⁴ cm⁻³\n    (c) Electrons are the majority carriers (n-type).\n\n**B3. P-type silicon has N_A = 5×10¹⁶ cm⁻³ and n_i = 1×10¹⁰ cm⁻³. Find (a) p, (b) n, (c) the minority carrier.**\n\n    (a) p ≈ N_A = 5×10¹⁶ cm⁻³\n    (b) n = n_i²/p = 10²⁰/(5×10¹⁶) = 2×10³ cm⁻³\n    (c) Electrons are the minority carriers.\n\n**B4. At 300 K an n-type semiconductor has N_D = 1×10¹⁷ cm⁻³ and n_i = 1×10¹⁰ cm⁻³. Find the Fermi level relative to the intrinsic level.**\n\n    E_F − E_i = kT ln(N_D/n_i) = 0.02585 × ln(10⁷) = 0.02585 × 16.12 = 0.417 eV\n\nThe Fermi level is **0.417 eV above E_i**.\n\n**B5. Explain, using equations, why increasing temperature increases the intrinsic carrier concentration.**\n\n    n_i = √(N_cN_v) e^{−E_g/2kT},   with N_c, N_v ∝ T^{3/2}   ⇒   n_i ∝ T^{3/2} e^{−E_g/2kT}\n\nTwo factors increase with T. The T^{3/2} factor grows slowly: more states become effectively available as the electrons' thermal energy spreads. The exponential grows very fast: E_g/2kT becomes smaller as T increases, so e^{−E_g/2kT} increases steeply. Physically, a higher temperature gives more electrons enough thermal energy to cross the band gap, breaking more covalent bonds and creating more electron–hole pairs. For Si, n_i is about 10¹⁰ cm⁻³ at 300 K, 5×10¹² at 400 K and 2.6×10¹⁴ at 500 K.\n\n---\n\n## Examination questions solved (Q30–Q33)\n\n### Q30. Explain the Fermi-Dirac distribution function and its significance in semiconductor physics.\n\n**The function.** Electrons are indistinguishable particles of half-integer spin that obey the Pauli exclusion principle (fermions). In thermal equilibrium at temperature T, the probability that an available state of energy E is occupied by an electron is given by Fermi–Dirac statistics:\n\n    f(E) = 1 / ( 1 + exp((E − E_F)/kT) )\n\nwhere E_F is the Fermi level and k is Boltzmann's constant.\n\n**Properties:**\n\n- 0 ≤ f(E) ≤ 1 (at most one electron per state).\n- f(E_F) = ½ at any temperature: E_F is the energy with a 50 % chance of occupation.\n- f is symmetric about E_F: the probability that a state ΔE above E_F is occupied equals the probability that a state ΔE below E_F is empty, so 1 − f(E_F + ΔE) = f(E_F − ΔE).\n- The transition from 1 to 0 happens over a few kT (about 0.1 eV at 300 K).\n- For E − E_F > 3kT it reduces to the Boltzmann factor exp(−(E − E_F)/kT).\n\n**Significance:**\n\n1. **Gives the carrier concentrations.** n = ∫g_c f dE and p = ∫g_v(1 − f)dE. Without f(E) we could not calculate n, p or n_i.\n2. **Defines the Fermi level**, the single most useful quantity in device physics. Its position relative to E_c and E_v tells immediately whether the material is n-type, p-type or intrinsic and how heavily doped.\n3. **Constant Fermi level in equilibrium.** E_F is flat across any system in equilibrium; this determines band bending and built-in potential in p-n junctions, Schottky contacts and MOS structures.\n4. **Explains temperature dependence** of carrier concentration, intrinsic behaviour, freeze-out and degeneracy.\n5. **Out of equilibrium**, the concept is extended to quasi-Fermi levels E_{Fn} and E_{Fp}, which are used to describe biased devices.\n\n### Q31. Write the Fermi-Dirac distribution equation and explain what happens to the distribution at absolute zero.\n\n    f(E) = 1 / ( 1 + e^{(E − E_F)/kT} )\n\n**At T = 0 K**, kT → 0, so the exponent (E − E_F)/kT → ±∞:\n\n- For **E < E_F**: (E − E_F)/kT → −∞, e^{−∞} = 0, so **f(E) = 1/(1 + 0) = 1**. Every state below E_F is certainly filled.\n- For **E > E_F**: (E − E_F)/kT → +∞, e^{+∞} → ∞, so **f(E) = 0**. Every state above E_F is certainly empty.\n\nThe distribution becomes a **sharp rectangular step** at E = E_F. The Fermi level is then the boundary between completely filled and completely empty states: the highest occupied energy at 0 K.\n\nFor a semiconductor this means the valence band is completely full and the conduction band completely empty at 0 K. There are no free carriers, and **a pure semiconductor is a perfect insulator at absolute zero**.\n\n**As T increases**, the step softens over a range of about ±3kT: some states just below E_F become empty and some just above become filled. This tail reaching into the conduction band is what produces free electrons at room temperature. At E = E_F, f = ½ always. (See the Fermi–Dirac figure above.)\n\n| E − E_F | f at 0 K | f at 300 K (kT = 0.0259 eV) |\n|---|---|---|\n| −0.1 eV | 1 | 0.979 |\n| 0 | ½ (undefined step) | 0.500 |\n| +0.1 eV | 0 | 0.021 |\n| +0.3 eV | 0 | 9.3×10⁻⁶ |\n\n### Q32. Define the density of states in a semiconductor and explain its importance in determining carrier concentration.\n\n**Definition.** The density of states g(E) is the number of allowed electron energy states (including both spins) per unit energy interval per unit volume of the crystal, at energy E. Unit: cm⁻³eV⁻¹ (or m⁻³J⁻¹).\n\nFor the conduction and valence bands (parabolic band approximation):\n\n    g_c(E) = (4π (2m_n∗)^{3/2} / h³) √(E − E_c),    E ≥ E_c\n    g_v(E) = (4π (2m_p∗)^{3/2} / h³) √(E_v − E),    E ≤ E_v\n    g(E) = 0  inside the gap\n\n**Physical origin.** In a crystal of volume V, the allowed wave vectors k are quantised, each occupying (2π)³/V of k-space. The number of states with energy up to E is the volume of the sphere of radius k divided by that, times 2 for spin. Differentiating with respect to E, using E − E_c = ħ²k²/2m∗, gives the square-root law. The effective mass enters because it describes the band's curvature: heavier mass means more states per unit energy.\n\n**Importance in determining carrier concentration:**\n\n1. The carrier concentration is the product of **available states** and **probability of occupation**: n = ∫g_c(E)f(E)dE, p = ∫g_v(E)[1 − f(E)]dE. The Fermi function alone says nothing about how many electrons there are; g(E) supplies the number of places they can go.\n2. It produces the **effective densities of states** N_c and N_v, which appear in every carrier-concentration formula (n = N_c e^{−(E_c−E_F)/kT}).\n3. Because g(E) is zero in the gap, no carriers exist there even though f(E) is non-zero, which explains why the gap is \"forbidden\".\n4. It explains differences between materials. GaAs has a small m_n∗ (0.067m₀), so its N_c (4.7×10¹⁷ cm⁻³) is 60 times smaller than Si's; for the same doping its Fermi level sits much closer to E_c and it becomes degenerate at lower doping.\n5. It sets the T^{3/2} factor in N_c, N_v and n_i, and determines where the Fermi level lies relative to mid-gap (E_i shifts by (3/4)kT ln(m_p∗/m_n∗)).\n6. It also governs optical absorption and the density of electrons available for tunnelling and contact behaviour.\n\n### Q33. Explain how the Fermi energy level changes with doping in n-type and p-type semiconductors.\n\nIn an intrinsic semiconductor E_F = E_i, near mid-gap. Doping shifts it so that the carrier concentrations satisfy n = n_i e^{(E_F − E_i)/kT} and p = n_i e^{(E_i − E_F)/kT}.\n\n**n-type (donor doping N_D).** n ≈ N_D > n_i, so E_F moves **up, towards E_c**:\n\n    E_F − E_i = kT ln(N_D/n_i),     E_c − E_F = kT ln(N_c/N_D)\n\n**p-type (acceptor doping N_A).** p ≈ N_A > n_i, so E_F moves **down, towards E_v**:\n\n    E_i − E_F = kT ln(N_A/n_i),     E_F − E_v = kT ln(N_v/N_A)\n\n**Behaviour:**\n\n1. The shift is **logarithmic**: each tenfold increase in doping moves E_F by kT ln10 ≈ 0.06 eV at 300 K.\n2. **Heavier doping → closer to the band edge.** At very high doping (≈ N_c or N_v) E_F reaches or enters the band and the semiconductor becomes **degenerate** (n⁺, p⁺).\n3. **Compensation** (both N_D and N_A) shifts E_F according to the net doping N_D − N_A.\n4. **Temperature:** as T rises, n_i increases and E_F moves back toward E_i; at high enough T every semiconductor becomes intrinsic. At very low T (freeze-out) E_F rises above E_D in n-type material.\n5. In equilibrium the Fermi level must be the same everywhere; when n and p regions meet, bands bend to keep E_F flat.\n\n**Example (Si, 300 K, n_i = 10¹⁰ cm⁻³):**\n\n| Doping | E_F position |\n|---|---|\n| Intrinsic | E_F = E_i |\n| N_D = 10¹⁵ cm⁻³ | E_F − E_i = 0.0259 ln(10⁵) = 0.298 eV |\n| N_D = 10¹⁷ cm⁻³ | E_F − E_i = 0.0259 ln(10⁷) = 0.417 eV |\n| N_A = 10¹⁶ cm⁻³ | E_i − E_F = 0.0259 ln(10⁶) = 0.358 eV |\n\n(See the Fermi-level figure above.)\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 5.1: accuracy of the Boltzmann approximation\n\n**Question.** Calculate the occupation probability of a state 3kT above the Fermi level using (a) the Fermi–Dirac function and (b) the Boltzmann approximation. What is the error?\n\n**Given:** E − E_F = 3kT.\n\n**Find:** f(FD), f(Boltzmann) and the percentage error.\n\n**Solution.**\n\n    (a) f = 1/(1 + e³) = 1/21.09 = 0.0474\n    (b) f ≈ e^{−3} = 0.0498\n    error = (0.0498 − 0.0474)/0.0474 = 5 %\n\n**Answer:** **0.0474 against 0.0498, a 5 % error**: this is why \"more than 3kT from E_F\" is the rule for using the Boltzmann approximation.\n\n#### Practice 5.2: carriers from the Fermi-level position\n\n**Question.** In silicon at 300 K the Fermi level is 0.30 eV below the conduction band. Find the probability that a state at E_c is occupied, and the electron concentration.\n\n**Given:** E_c − E_F = 0.30 eV, kT = 0.0259 eV, N_c = 2.8×10¹⁹ cm⁻³.\n\n**Find:** f(E_c) and n.\n\n**Solution.**\n\n    f(E_c) ≈ e^{−0.30/0.0259} = e^{−11.58} = 9.3×10⁻⁶\n    n = N_c e^{−(E_c − E_F)/kT} = 2.8×10¹⁹ × 9.3×10⁻⁶ = 2.6×10¹⁴ cm⁻³\n\n**Answer:** **f = 9.3×10⁻⁶, n = 2.6×10¹⁴ cm⁻³.**\n\n#### Practice 5.3: doping for a chosen Fermi level\n\n**Question.** What donor concentration places the Fermi level of silicon 0.20 eV above the intrinsic level at 300 K?\n\n**Given:** E_F − E_i = 0.20 eV, n_i = 10¹⁰ cm⁻³, kT = 0.02585 eV.\n\n**Find:** N_D.\n\n**Solution.**\n\n    N_D = n_i e^{(E_F − E_i)/kT} = 10¹⁰ × e^{0.20/0.02585} = 10¹⁰ × e^{7.74} = 2.3×10¹³ cm⁻³\n\n**Answer:** **N_D ≈ 2.3×10¹³ cm⁻³**, a very light doping.\n\n#### Practice 5.4: compensated p-type silicon\n\n**Question.** Silicon is doped with N_A = 3×10¹⁶ cm⁻³ and N_D = 1×10¹⁶ cm⁻³. Find p, n and the Fermi-level position at 300 K.\n\n**Given:** N_A = 3×10¹⁶, N_D = 10¹⁶, n_i = 10¹⁰ cm⁻³, kT = 0.02585 eV.\n\n**Find:** p, n and E_i − E_F.\n\n**Solution.**\n\n    p ≈ N_A − N_D = 2×10¹⁶ cm⁻³\n    n = n_i²/p = 10²⁰/2×10¹⁶ = 5×10³ cm⁻³\n    E_i − E_F = kT ln(p/n_i) = 0.02585 × ln(2×10⁶) = 0.375 eV\n\n**Answer:** **p = 2×10¹⁶ cm⁻³, n = 5×10³ cm⁻³, E_F = E_i − 0.375 eV.**\n\n#### Practice 5.5: lightly doped germanium\n\n**Question.** Germanium (n_i = 2.4×10¹³ cm⁻³) is doped with N_D = 1×10¹⁴ cm⁻³. Find n and p using the full charge-neutrality equation.\n\n**Given:** N_D = 10¹⁴ cm⁻³, N_A = 0, n_i = 2.4×10¹³ cm⁻³.\n\n**Find:** n and p.\n\n**Solution.**\n\n    n = N_D/2 + √((N_D/2)² + n_i²) = 5×10¹³ + √(2.5×10²⁷ + 5.76×10²⁶)\n      = 5×10¹³ + 5.55×10¹³ = 1.05×10¹⁴ cm⁻³\n    p = n_i²/n = 5.76×10²⁶ / 1.05×10¹⁴ = 5.5×10¹² cm⁻³\n\n**Answer:** **n = 1.05×10¹⁴ cm⁻³, p = 5.5×10¹² cm⁻³.** Thermal generation adds 5 % to the electron count, so n ≈ N_D is only approximate here.\n\n#### Practice 5.6: is it degenerate?\n\n**Question.** Silicon is doped with N_D = 5×10¹⁸ cm⁻³. Find E_c − E_F and decide whether the Boltzmann approximation is valid.\n\n**Given:** N_D = 5×10¹⁸ cm⁻³, N_c = 2.8×10¹⁹ cm⁻³, kT = 0.02585 eV.\n\n**Find:** E_c − E_F in eV and in units of kT.\n\n**Solution.**\n\n    E_c − E_F = kT ln(N_c/N_D) = 0.02585 × ln(5.6) = 0.02585 × 1.72 = 0.045 eV = 1.7kT\n\n**Answer:** **0.045 eV, only 1.7kT**: less than 3kT, so the material is (nearly) degenerate and full Fermi–Dirac statistics should be used.\n\n#### Practice 5.7: where exactly is E_i?\n\n**Question.** Show that the intrinsic level of silicon lies slightly below mid-gap, and by how much.\n\n**Given:** E_i = (E_c + E_v)/2 + (kT/2) ln(N_v/N_c), N_c = 2.8×10¹⁹, N_v = 1.04×10¹⁹ cm⁻³.\n\n**Find:** E_i − mid-gap.\n\n**Solution.**\n\n    (kT/2) ln(N_v/N_c) = (0.02585/2) × ln(1.04/2.8) = 0.0129 × (−0.990) = −0.0128 eV\n\n**Answer:** **E_i is 13 meV below mid-gap**, because the valence band has fewer effective states (N_v < N_c), so E_F must sit a little closer to it to make p equal n.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Define and use the Fermi–Dirac distribution function. | Find the probability that a state 0.2 eV above E_F is occupied at 300 K. | f = 1/(1 + e^{0.2/0.02585}) = 1/(1 + 2290) = 4.4×10⁻⁴. | Section 1 |\n| 2 | Explain the physical meaning of the Fermi level and the shape of f(E) at 0 K. | What is f(E) below and above E_F at 0 K? | 1 below E_F, 0 above: a sharp step. | Section 1 |\n| 3 | Explain the density of states and the effective density of states. | Why are there no carriers in the band gap even though f(E) is not zero there? | The density of states is zero in the gap: there are no states to occupy. | Section 2 |\n| 4 | Calculate electron and hole concentrations and apply the mass action law. | Si with N_A = 10¹⁵ cm⁻³: find p and n (n_i = 10¹⁰ cm⁻³). | p = 10¹⁵, n = 10⁵ cm⁻³. | Sections 7–8, 12, 15–16; Examples 5.3, 5.5 |\n| 5 | Determine the position of the Fermi level for given doping. | Find E_F − E_i for N_D = 10¹⁴ cm⁻³. | 0.02585 ln(10⁴) = 0.238 eV. | Sections 9, 13; Examples 5.1, 5.4 |\n| 6 | Apply the charge-neutrality condition, including compensated material. | Si has N_D = 5×10¹⁶ and N_A = 2×10¹⁶ cm⁻³. Find n. | n ≈ N_D − N_A = 3×10¹⁶ cm⁻³. | Section 14 |\n| 7 | Explain the effect of temperature on carrier concentration and the Fermi level. | Name the three temperature regions and what n equals in the middle one. | Freeze-out, extrinsic (n ≈ N_D), intrinsic. | Sections 17, 23; Example 5.2 |\n| 8 | Distinguish degenerate and non-degenerate semiconductors. | When must full Fermi–Dirac statistics be used instead of the Boltzmann approximation? | When E_F is within about 3kT of a band edge (very heavy doping). | Section 21 |\n", "group": "Module 2 · Energy Bands & Carrier Statistics", "eyebrow": "Week 5", "disp": "05"}, {"num": "06", "title": "Continuous Assessment Test 1 and Review", "body": "\n**Plan:** mid-module evaluation of crystal structures and carrier statistics (Weeks 1–5).\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Revise crystal structures, Miller indices and bonding (Week 1).\n2. Revise energy bands and direct/indirect gaps (Week 4).\n3. Calculate occupation probabilities with the Fermi–Dirac function (Week 5).\n4. Calculate n, p and E_F for doped and compensated silicon and germanium (Weeks 4–5).\n\nThis page has a one-screen review of what CAT 1 covers, followed by a practice test with full solutions. The questions are written in the style of the lecturer's revision questions and the PGD exam paper. They are practice questions, not the actual CAT.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| Å | Ångström, a unit of length | 1 Å = 10⁻¹⁰ m = 0.1 nm |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_v | Effective density of states in the valence band | cm⁻³; Si 1.04×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| k (wave vector) | Wave vector, 2π/λ; measures the electron's momentum, p = ħk | m⁻¹ or cm⁻¹ |\n| α (Kronig–Penney) | √(2mE)/ħ, set by the electron energy | m⁻¹ |\n| P (Kronig–Penney) | Barrier strength mV₀ba/ħ² | dimensionless |\n| λ | Wavelength | μm or nm; λ(μm) = 1.24/E(eV) |\n| a | Lattice constant: edge length of the cubic unit cell | Å; Si 5.43, Ge and GaAs 5.65 |\n| (h k l), {h k l} | Miller indices of a plane; family of equivalent planes | integers |\n| d_hkl | Spacing between neighbouring (h k l) planes, a/√(h² + k² + l²) | Å |\n| r_nn | Nearest-neighbour distance | Å; Si 2.35 |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| λ_max | Longest wavelength a material absorbs, 1.24/E_g (μm, E_g in eV) | μm |\n| σ_i, ρ_i | Conductivity and resistivity of intrinsic (undoped) material; σ_doped after doping | S/cm; Ω·cm |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| GaN | Gallium nitride |\n| InP | Indium phosphide |\n| CB | Conduction band |\n| VB | Valence band |\n| APF | Atomic packing factor |\n| LED | Light-emitting diode |\n| CAT | Continuous Assessment Test |\n| PGD | Postgraduate Diploma |\n\n\n## Review: what you must be able to do\n\n**Crystals (Week 1)**\n\n- Define lattice, basis, unit cell, lattice constant, coordination number, APF.\n- State the structures: Si and Ge diamond cubic, GaAs zinc blende; 8 atoms per cell; 4 nearest neighbours.\n- Find Miller indices from intercepts (intercepts → reciprocals → clear fractions); handle ∞ (index 0) and negative intercepts (bar).\n- Use d_{hkl} = a/√(h² + k² + l²).\n\n**Materials and bonding (Week 1)**\n\n- Compare conductors, semiconductors and insulators; Si, Ge and GaAs.\n- Explain covalent bonding, electron–hole pairs, n-type and p-type doping.\n\n**Bands and statistics (Weeks 4–5)**\n\n- Schrödinger equation terms; Kronig–Penney: allowed bands where |P sin(αa)/αa + cos αa| ≤ 1.\n- Direct and indirect gaps; λ(μm) = 1.24/E_g(eV).\n- f(E) = 1/(1 + e^{(E−E_F)/kT}); at 0 K a step; Boltzmann approximation for E − E_F > 3kT.\n- n = N_c e^{−(E_c−E_F)/kT}, p = N_v e^{−(E_F−E_v)/kT}, n_i = √(N_cN_v)e^{−E_g/2kT}, np = n_i².\n- Charge neutrality and compensation; E_F − E_i = kT ln(n/n_i).\n\n> **Also revise:** the lecturer's own mid-module evaluation (ten short-answer and five calculation questions on carrier statistics) is solved at the end of Week 5, section 26.\n\n## Practice test (60 minutes)\n\nUse q = 1.6×10⁻¹⁹ C, kT = 0.0259 eV at 300 K, Si: n_i = 1×10¹⁰ cm⁻³, N_c = 2.8×10¹⁹ cm⁻³, μ_n = 1350, μ_p = 480 cm²/V·s; Ge: n_i = 2.4×10¹³ cm⁻³, μ_n = 3900, μ_p = 1900 cm²/V·s.\n\n1. Silicon has lattice constant 5.43 Å. Calculate (a) the number of atoms per cm³ and (b) the nearest-neighbour distance.\n2. Find the Miller indices of planes with intercepts (a) 3a, 2b, c and (b) a, −b, ∞. For (a), find the interplanar spacing in Si.\n3. Show that the atomic packing factor of the diamond structure is 0.34.\n4. State three differences between direct and indirect band-gap semiconductors and give the emission wavelength of GaAs.\n5. Find the probability that a state (a) 0.1 eV above E_F and (b) kT above E_F is occupied at 300 K.\n6. At what temperature is there a 10⁻⁴ probability that a state 0.30 eV above E_F is occupied?\n7. In a Si sample at 300 K the Fermi level is 0.25 eV below E_c. Find n and p. Is it n- or p-type?\n8. Si is doped with N_A = 1×10¹⁶ cm⁻³ and N_D = 3×10¹⁵ cm⁻³. Find n, p and the Fermi level position at 300 K.\n9. Germanium is doped with N_D = 1×10¹⁵ cm⁻³. Find n and p at 300 K, without assuming n_i is negligible.\n10. Calculate the conductivity and resistivity of intrinsic germanium at 300 K.\n\n## Solutions\n\n### 1. Atom density and nearest neighbours in Si\n\n**Question.** Silicon has lattice constant 5.43 Å. Calculate (a) the number of atoms per cm³ and (b) the nearest-neighbour distance.\n\n**Solution.**\n\nThe diamond unit cell holds 8 atoms (8 corners × ⅛ + 6 faces × ½ + 4 inside).\n\n    (a) N = 8/a³ = 8/(5.43×10⁻⁸ cm)³ = 8/(1.601×10⁻²² cm³) = 5.0×10²² atoms/cm³\n\n    (b) r_nn = (√3/4)a = 0.433 × 5.43 Å = 2.35 Å\n\n### 2. Miller indices\n\n**Question.** Find the Miller indices of planes with intercepts (a) 3a, 2b, c and (b) a, −b, ∞. For (a), find the interplanar spacing in Si.\n\n**Solution.**\n\n| | x | y | z |\n|---|---|---|---|\n| (a) Intercepts | 3 | 2 | 1 |\n| Reciprocals | 1/3 | 1/2 | 1 |\n| × 6 | 2 | 3 | 6 |\n\n(a) **(2 3 6)**. d₂₃₆ = 5.43/√(4 + 9 + 36) = 5.43/7 = **0.776 Å**.\n\n(b) Intercepts 1, −1, ∞ → reciprocals 1, −1, 0 → **(1 1̄ 0)**, a plane parallel to z.\n\n### 3. Packing factor of diamond\n\n**Question.** Show that the atomic packing factor of the diamond structure is 0.34.\n\n**Solution.**\n\nNearest neighbours touch along the body diagonal at distance (√3/4)a, so the atomic radius is r = (√3/8)a. With 8 atoms per cell:\n\n    APF = 8 × (4/3)πr³ / a³ = 8 × (4/3)π (√3/8)³ = (32π/3)(3√3/512) = π√3/16 = 0.34\n\nOnly 34 % of the volume is filled, an open structure that allows interstitial impurities.\n\n### 4. Direct and indirect gaps\n\n**Question.** State three differences between direct and indirect band-gap semiconductors and give the emission wavelength of GaAs.\n\n**Solution.**\n\n(1) In a direct gap the conduction-band minimum and valence-band maximum are at the same k; in an indirect gap they are at different k. (2) Direct transitions need only a photon; indirect transitions also need a phonon. (3) Direct-gap materials emit light efficiently (GaAs, GaN, InP: LEDs, lasers); indirect ones do not (Si, Ge). Also: absorption near E_g is strong in direct-gap and weak in indirect-gap material; radiative lifetime is ns in direct and much longer in indirect.\n\n    GaAs: λ = 1.24/1.42 = 0.873 μm (near infrared)\n\n### 5. Occupation probabilities\n\n**Question.** Find the probability that a state (a) 0.1 eV above E_F and (b) kT above E_F is occupied at 300 K.\n\n**Solution.**\n\n    (a) f = 1/(1 + e^{0.1/0.0259}) = 1/(1 + e^{3.861}) = 1/(1 + 47.5) = 0.0206\n    (b) f = 1/(1 + e^{1}) = 1/3.718 = 0.269\n\n### 6. Temperature for a given probability\n\n**Question.** At what temperature is there a 10⁻⁴ probability that a state 0.30 eV above E_F is occupied?\n\n**Solution.**\n\nSince f is small, use the Boltzmann form: f ≈ e^{−(E − E_F)/kT} = 10⁻⁴.\n\n    0.30/kT = ln(10⁴) = 9.21   ⇒   kT = 0.0326 eV\n    T = 0.0326/8.617×10⁻⁵ = 378 K\n\n(The exact form 1/(1 + e^{x}) = 10⁻⁴ gives x = 9.21 as well, to three figures.)\n\n### 7. Carrier densities from E_F\n\n**Question.** In a Si sample at 300 K the Fermi level is 0.25 eV below E_c. Find n and p. Is it n- or p-type?\n\n**Solution.**\n\n    n = N_c e^{−(E_c−E_F)/kT} = 2.8×10¹⁹ × e^{−0.25/0.0259} = 2.8×10¹⁹ × e^{−9.65}\n      = 2.8×10¹⁹ × 6.4×10⁻⁵ = 1.8×10¹⁵ cm⁻³\n    p = n_i²/n = 10²⁰/1.8×10¹⁵ = 5.6×10⁴ cm⁻³\n\nn ≫ p, so the sample is **n-type** (doped with about 1.8×10¹⁵ cm⁻³ donors).\n\n### 8. Compensated silicon\n\n**Question.** Si is doped with N_A = 1×10¹⁶ cm⁻³ and N_D = 3×10¹⁵ cm⁻³. Find n, p and the Fermi level position at 300 K.\n\n**Solution.**\n\nN_A > N_D, so the material is p-type with net doping N_A − N_D = 7×10¹⁵ cm⁻³ ≫ n_i.\n\n    p ≈ 7×10¹⁵ cm⁻³\n    n = n_i²/p = 10²⁰/7×10¹⁵ = 1.4×10⁴ cm⁻³\n    E_i − E_F = kT ln(p/n_i) = 0.0259 × ln(7×10⁵) = 0.0259 × 13.46 = 0.349 eV\n\nThe Fermi level is 0.349 eV below E_i. Both dopants still scatter carriers, so mobility is that for 1.3×10¹⁶ cm⁻³ total impurities.\n\n### 9. Lightly doped germanium\n\n**Question.** Germanium is doped with N_D = 1×10¹⁵ cm⁻³. Find n and p at 300 K, without assuming n_i is negligible.\n\n**Solution.**\n\nn_i = 2.4×10¹³ is not negligible compared with N_D = 10¹⁵, so use the exact neutrality solution:\n\n    n = N_D/2 + √((N_D/2)² + n_i²) = 5×10¹⁴ + √(2.5×10²⁹ + 5.76×10²⁶)\n      = 5×10¹⁴ + 5.006×10¹⁴ = 1.0006×10¹⁵ cm⁻³\n    p = n_i²/n = 5.76×10²⁶/1.0006×10¹⁵ = 5.76×10¹¹ cm⁻³\n\nn is still essentially N_D, but the minority concentration (5.8×10¹¹) is 10⁷ times larger than in silicon with the same doping (10⁵): this is why Ge diodes leak so much.\n\n### 10. Intrinsic germanium\n\n**Question.** Calculate the conductivity and resistivity of intrinsic germanium at 300 K.\n\n**Solution.**\n\n    σ_i = q n_i (μ_n + μ_p) = 1.6×10⁻¹⁹ × 2.4×10¹³ × (3900 + 1900)\n        = 1.6×10⁻¹⁹ × 1.392×10¹⁷ = 0.0223 S/cm\n    ρ_i = 1/σ_i = 44.9 Ω·cm\n\nFor comparison, intrinsic Si is about 3×10⁵ Ω·cm, nearly 10⁴ times higher, because its band gap is larger.\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 6.1: intercepts from Miller indices\n\n**Question.** A plane has Miller indices (1 2 3). Find a set of intercepts it makes on the axes.\n\n**Given:** (h k l) = (1 2 3).\n\n**Find:** intercepts.\n\n**Solution.** Intercepts are the reciprocals of the indices: 1, 1/2, 1/3. Multiplying by 6 to clear fractions gives an equivalent parallel plane.\n\n**Answer:** **a, b/2, c/3 (or, equivalently, 6a, 3b, 2c).**\n\n#### Practice 6.2: band gap from an absorption edge\n\n**Question.** A semiconductor stops absorbing light at wavelengths longer than 1.1 μm. Estimate its band gap.\n\n**Given:** λ_max = 1.1 μm.\n\n**Find:** E_g.\n\n**Solution.**\n\n    E_g = 1.24/λ = 1.24/1.1 = 1.13 eV\n\n**Answer:** **E_g ≈ 1.13 eV** (silicon).\n\n#### Practice 6.3: hole concentration from the Fermi level\n\n**Question.** In p-type silicon at 300 K the Fermi level is 0.10 eV above the valence band. Find the hole concentration.\n\n**Given:** E_F − E_v = 0.10 eV, N_v = 1.04×10¹⁹ cm⁻³, kT = 0.0259 eV.\n\n**Find:** p.\n\n**Solution.**\n\n    p = N_v e^{−(E_F − E_v)/kT} = 1.04×10¹⁹ × e^{−3.86} = 1.04×10¹⁹ × 0.0211 = 2.2×10¹⁷ cm⁻³\n\n**Answer:** **p = 2.2×10¹⁷ cm⁻³.**\n\n#### Practice 6.4: probability of a hole\n\n**Question.** What is the probability that a state 0.05 eV below the Fermi level is empty (holds a hole) at 300 K?\n\n**Given:** E = E_F − 0.05 eV, kT = 0.0259 eV.\n\n**Find:** 1 − f(E).\n\n**Solution.**\n\n    1 − f = 1 − 1/(1 + e^{−0.05/0.0259}) = 1/(1 + e^{0.05/0.0259}) = 1/(1 + 6.89) = 0.127\n\n**Answer:** **12.7 %.**\n\n#### Practice 6.5: short-answer revision\n\n**Question.** (a) State the mass-action law. (b) What is the coordination number of the diamond structure? (c) Name the structure of GaAs. (d) Which carrier is the minority carrier in boron-doped silicon?\n\n**Answer.** **(a)** np = n_i² in thermal equilibrium. **(b)** 4. **(c)** Zinc blende. **(d)** Electrons.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Revise crystal structures, Miller indices and bonding (Week 1). | Find the Miller indices for intercepts 2a, 2b, 4c. | 1/2, 1/2, 1/4 → × 4 → (2 2 1). | Review; practice Q1–Q3 |\n| 2 | Revise energy bands and direct/indirect gaps (Week 4). | State one property that distinguishes a direct-gap semiconductor. | Efficient light emission (also: CB minimum and VB maximum at the same k). | Practice Q4 |\n| 3 | Calculate occupation probabilities with the Fermi–Dirac function (Week 5). | What is f at E = E_F + kT? | 1/(1 + e) = 0.269. | Practice Q5–Q6 |\n| 4 | Calculate n, p and E_F for doped and compensated silicon and germanium (Weeks 4–5). | Si with E_F 0.25 eV below E_c: n-type or p-type? | n-type (n = 1.8×10¹⁵ cm⁻³). | Practice Q7–Q10 |\n", "group": "Module 2 · Energy Bands & Carrier Statistics", "eyebrow": "Week 6", "disp": "06"}, {"num": "07", "title": "Drift and Diffusion Currents", "body": "\n**Plan:** carrier mobility, scattering mechanisms and conductivity; diffusion of carriers, Fick's law and the Einstein relation.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Explain thermal motion, drift velocity and mobility.\n2. Explain the scattering mechanisms and the factors that affect mobility.\n3. Derive and use the drift current density and conductivity.\n4. Explain carrier diffusion and calculate diffusion current with Fick's law.\n5. State, explain and use the Einstein relation.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| m₀ | Free-electron mass | 9.11×10⁻³¹ kg |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| n | Electron concentration (free electrons per cm³) | cm⁻³ |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| m∗, m_n∗, m_p∗ | Effective mass of electrons or holes | kg, or as a multiple of m₀ |\n| C(x, t) | Dopant concentration at depth x and time t | cm⁻³ |\n| D | Diffusion coefficient (dopants in a furnace, or carriers) | cm²/s |\n| F | Particle flux in Fick's law | particles/(cm²·s) |\n| R_s | Sheet resistance (or diode series resistance in Week 12) | Ω/□ (ohms per square); Ω |\n| E (field) | Electric field (on band diagrams, E is energy instead) | V/cm |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| μ_L, μ_I | Mobility limited by lattice scattering, by ionised-impurity scattering | cm²/(V·s) |\n| v_d | Drift velocity | cm/s |\n| v_th | Thermal velocity of carriers | ≈ 10⁷ cm/s at 300 K |\n| v_sat | Saturation velocity at high field | ≈ 10⁷ cm/s in Si |\n| τ_m | Mean free time between collisions | s; about 0.1–1 ps |\n| σ | Conductivity, q(nμ_n + pμ_p) (in Week 8, σ is also a capture cross-section) | S/cm (siemens per cm) |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| R_H, V_H, B | Hall coefficient, Hall voltage, magnetic flux density | cm³/C; V; T (Wb/m²) |\n| R | Recombination rate | cm⁻³s⁻¹ |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| I | Current | A |\n| A (area) | Device or contact area | cm² |\n| σ_i, ρ_i | Conductivity and resistivity of intrinsic (undoped) material; σ_doped after doping | S/cm; Ω·cm |\n| F_n, F_p | Particle flux of electrons and holes (carriers crossing 1 cm² per second) | cm⁻²s⁻¹ |\n| B_z, I_x, V_H | Hall effect: magnetic field (z), current (x) and Hall voltage | T (tesla); A; V |\n| R_H | Hall coefficient, 1/qp (p-type) or −1/qn (n-type) | cm³/C |\n| v_dn, v_dp | Drift velocity of electrons and holes | cm/s |\n| μ_i, τ_i (μ_L, μ_I, N_I) | Mobility and scattering time for one scattering mechanism (L: lattice, I: ionised impurity); N_I = ionised-impurity density | cm²/(V·s); s; cm⁻³ |\n| J_drift, J_diff | Drift and diffusion parts of the current density | A/cm² |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n\n\n## The big picture\n\nWeeks 4–5 told us **how many** carriers there are. This week asks **how they move**, because moving charge is current. There are exactly two reasons a carrier moves in a particular direction:\n\n1. **Drift:** an electric field pushes it. Like water flowing downhill because of gravity.\n2. **Diffusion:** there are more carriers in one place than another, and random motion spreads them out. Like a drop of ink spreading in still water (the same idea as dopant diffusion in Week 3, but for electrons and holes, and much faster).\n\nEvery current in every device in this course is drift, diffusion, or a mixture. At the end of the week we will see that the two are tied together by a surprisingly simple rule, the **Einstein relation**.\n\n## Part A: Drift, mobility and conductivity\n\n### Random thermal motion\n\nEven with no voltage applied, electrons in a semiconductor are not still. At room temperature they rush about at the **thermal velocity**, about 10⁷ cm/s (100 km/s), bouncing off vibrating atoms and impurities roughly every 0.1–1 picosecond (the **mean free time** τ_m). Their directions are random, so on average they go nowhere: no current.\n\n### Drift in an electric field\n\nNow apply an electric field E. Between collisions each electron is pushed by the field and gains a little extra speed in one direction. At each collision that extra speed is lost (the direction is randomised again). So on top of the random motion there is a small, steady average **drift velocity**:\n\n    v_d = μE\n\nFor electrons the drift is against the field (they are negative); for holes it is along the field.\n\n> **In plain words.** Picture a crowd milling about randomly in a square. Tilt the square slightly. People still wander randomly, but on average the crowd now slides slowly downhill. The slow average slide is the drift velocity; the random wandering is much faster but cancels out.\n\n### Mobility\n\nThe constant μ is the **mobility**: how much drift velocity you get per unit field.\n\n    μ = v_d / E = qτ_m / m∗      [cm²/V·s]\n\nFrom the formula, mobility is high when:\n\n- **collisions are rare** (long τ_m): fewer things to bump into;\n- **the effective mass is small** (m∗ small): the carrier is easy to accelerate.\n\n| Material | μ_n (cm²/V·s) | μ_p (cm²/V·s) |\n|---|---|---|\n| Si | 1350 | 480 |\n| Ge | 3900 | 1900 |\n| GaAs | 8500 | 400 |\n\nElectrons are faster than holes in all three, mainly because of their smaller effective mass. \n\n#### Example 7.1: drift velocity\n\n**Question.** An electric field of 1000 V/cm is applied to a silicon sample. Calculate the drift velocity of the electrons and of the holes.\n\n**Given:** E = 1000 V/cm, μ_n = 1350 cm²/V·s, μ_p = 480 cm²/V·s.\n\n**Find:** v_dn and v_dp.\n\n**Solution.**\n\n    v_dn = μ_nE = 1350 × 1000 = 1.35×10⁶ cm/s\n    v_dp = μ_pE = 480 × 1000 = 4.8×10⁵ cm/s\n\n**Answer:** **electrons 1.35×10⁶ cm/s, holes 4.8×10⁵ cm/s**, both far below the random thermal velocity of about 10⁷ cm/s.\n\n### What scatters carriers\n\nA perfectly regular, perfectly still crystal would not scatter electrons at all (Bloch's theorem, Week 4). Anything that breaks the perfect regularity causes scattering:\n\n1. **Lattice (phonon) scattering.** The atoms vibrate with heat. The hotter, the more they vibrate, and the more they scatter. Mobility falls as μ_L ∝ T^{−3/2}.\n2. **Ionised-impurity scattering.** The charged donor and acceptor ions deflect passing carriers, like a magnet deflecting a passing steel ball. Slow carriers are deflected more, so this is worst at **low** temperature and **high** doping: μ_I ∝ T^{3/2}/N_I.\n3. **Neutral-impurity scattering**, important only at very low temperature.\n4. **Carrier–carrier scattering**, at very high carrier densities.\n5. **Defect scattering** from dislocations, grain boundaries and vacancies.\n6. **Surface scattering.** In a MOSFET channel, carriers are pressed against the rough Si/SiO₂ surface; channel mobility is only about half the bulk value.\n7. **Polar and alloy scattering** in compound semiconductors and alloys.\n\nWhen several mechanisms act, their scattering rates add, so the reciprocals of the mobilities add (**Matthiessen's rule**):\n\n    1/μ = 1/μ_L + 1/μ_I + …\n\nThe **lowest** mobility dominates, just as the narrowest section of a pipe limits the flow.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 225\" role=\"img\" aria-label=\"Log-log plot of electron mobility against temperature for light and heavy doping, rising then falling, with the lattice-scattering limit shown dashed\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,# "/><text x=\"240.0\" y=\"166.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">heavy doping</text><polyline points=\"141.9,50.8 450.0,147.8\" fill=\"none\" style=\"stroke:currentColor\" stroke-width=\"1\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><text x=\"165.9\" y=\"54.5\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">lattice ∝ T<tspan dy=\"-0.45em\" font-size=\"72%\">−3/2</tspan><tspan dy=\"0.45em\">​</tspan></text></svg><figcaption>Mobility against temperature. At low temperature impurity scattering limits mobility; at high temperature lattice scattering does. Heavier doping lowers the curve and moves its peak to higher temperature.</figcaption></figure>\n```\n\n### What affects mobility (summary)\n\n- **Temperature:** near room temperature, higher T → more lattice vibration → lower μ.\n- **Doping:** more impurities → more scattering → lower μ (Si electrons: 1350 at light doping, about 1000 at 10¹⁷, about 100 at 10²⁰ cm⁻³).\n- **Effective mass:** smaller m∗ → higher μ.\n- **Electric field:** at very high fields μ falls (velocity saturation, Week 8).\n- **Crystal quality, surfaces, orientation and strain.**\n\n### Drift current density\n\n**Current density** J is the charge crossing 1 cm² per second. It equals (charge per carrier) × (number of carriers per cm³) × (their average speed). For electrons, the charge is −q and the velocity is −μ_nE; the two minus signs cancel:\n\n    J_n = (−q)(n)(−μ_nE) = qnμ_nE\n\nFor holes:\n\n    J_p = (+q)(p)(+μ_pE) = qpμ_pE\n\nElectrons move against the field but carry negative charge, so their **current** is in the same direction as the hole current. The total drift current is\n\n    J = q(nμ_n + pμ_p) E = σE\n\nThis is just Ohm's law, with **conductivity** and **resistivity**\n\n    σ = q(nμ_n + pμ_p),     ρ = 1/σ\n\nFor n-type material n ≫ p, so σ ≈ qN_Dμ_n. For p-type, σ ≈ qN_Aμ_p.\n\n#### Example 7.2: conductivity and resistance of a silicon bar\n\n**Question.** A bar of n-type silicon doped with N_D = 1×10¹⁶ cm⁻³ is 1 cm long and has a cross-section of 1 mm². Calculate its conductivity, resistivity and resistance.\n\n**Given:** N_D = 1×10¹⁶ cm⁻³, μ_n = 1350 cm²/V·s, L = 1 cm, A = 1 mm² = 0.01 cm², q = 1.6×10⁻¹⁹ C.\n\n**Find:** σ, ρ and R.\n\n**Solution.**\n\nStep 1. n-type, so σ ≈ qN_Dμ_n:\n\n    σ = 1.6×10⁻¹⁹ × 10¹⁶ × 1350 = 2.16 S/cm\n\nStep 2. ρ = 1/σ = 1/2.16 = 0.46 Ω·cm\n\nStep 3. R = ρL/A:\n\n    R = 0.46 × 1 / 0.01 = 46 Ω\n\n**Answer:** **σ = 2.16 S/cm, ρ = 0.46 Ω·cm, R = 46 Ω.**\n\n**Sheet resistance.** For a thin layer of thickness t, R_s = ρ/t in ohms per square (Ω/□), measured with a four-point probe (Week 3).\n\n### Hall effect\n\nPut a sample carrying current I_x in a magnetic field B_z. The magnetic force pushes the moving carriers sideways, so charge piles up on one side and a small **Hall voltage** V_H appears across the sample. Its **sign** shows whether the carriers are electrons or holes, and its **size** gives their concentration:\n\n    R_H = 1/qp (p-type, positive),   R_H = −1/qn (n-type, negative)\n\nCombined with a resistivity measurement it gives the mobility, μ = |R_H|σ. This is the standard way to measure carrier type, concentration and mobility.\n\n## Part B: Diffusion, Fick's law and the Einstein relation\n\n### Diffusion of carriers\n\nSuppose there are more electrons on the left of a sample than on the right, for example because light shines on the left. Each electron moves randomly. With more of them on the left, more cross any plane from left to right than from right to left. There is a net flow towards the right, with no field at all. This is **carrier diffusion**.\n\nThe flow obeys **Fick's law** (the same law as in Week 3, now for carriers):\n\n    flux of electrons = −D_n dn/dx,     flux of holes = −D_p dp/dx\n\nD_n and D_p are the carrier **diffusion coefficients** (Si at 300 K: D_n ≈ 35 cm²/s, D_p ≈ 12 cm²/s). These are about 10¹⁴ times larger than dopant diffusion coefficients: carriers diffuse across a device in nanoseconds, while dopant atoms need hours in a furnace.\n\n### Diffusion current density\n\nMultiply each particle flux by the charge of the carrier:\n\n    J_n(diff) = (−q)(−D_n dn/dx) = +qD_n dn/dx\n    J_p(diff) = (+q)(−D_p dp/dx) = −qD_p dp/dx\n\n**Watch the signs.** Both electrons and holes flow from high concentration to low. But because the electron charge is negative, the **electron current** points **opposite** to the electron flow, while the hole current points the same way as the hole flow.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"Electrons and holes both diffuse down their concentration gradients, but electron current flows opposite to electron flux\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"50.0\" y1=\"144.0\" x2=\"254.0\" y2=\"144.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"50.0\" y1=\"144.0\" x2=\"50.0\" y2=\"40.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"264.0\" y=\"148.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">x</text><text x=\"55.0\" y=
