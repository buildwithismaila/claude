.0,162.3 307.5,162.5 310.0,162.7 312.5,162.8 315.0,163.0 317.5,163.1 320.0,163.3 322.5,163.4 325.0,163.6 327.5,163.7 330.0,163.8 332.5,164.0 335.0,164.1 337.5,164.2 340.0,164.3 342.5,164.4 345.0,164.5 347.5,164.7 350.0,164.8 352.5,164.9 355.0,165.0 357.5,165.0 360.0,165.1 362.5,165.2 365.0,165.3 367.5,165.4 370.0,165.5 372.5,165.6 375.0,165.6 377.5,165.7 380.0,165.8 382.5,165.8 385.0,165.9 387.5,166.0 390.0,166.0 392.5,166.1 395.0,166.2 397.5,166.2 400.0,166.3 402.5,166.3 405.0,166.4 407.5,166.4 410.0,166.5 412.5,166.5 415.0,166.6 417.5,166.6 420.0,166.6 422.5,166.7 425.0,166.7 427.5,166.8 430.0,166.8 432.5,166.8 435.0,166.9 437.5,166.9 440.0,166.9 442.5,167.0 445.0,167.0 447.5,167.0 450.0,167.1 452.5,167.1 455.0,167.1 457.5,167.2 460.0,167.2\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><line x1=\"140.0\" y1=\"168.0\" x2=\"140.0\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><line x1=\"60.0\" y1=\"123.2\" x2=\"140.0\" y2=\"123.2\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><text x=\"148.0\" y=\"119.2\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Δp falls to 1/e at x = L<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan> = √(D<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan>τ<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan>)</text></svg><figcaption>Steady-state profile when minority carriers are injected at x = 0 into a long n-type bar: an exponential decay with characteristic length L<sub>p</sub>.</figcaption></figure>\n```\n\n> **In plain words.** Inject carriers at one end of a bar and they spread out by diffusion, but they also keep dying by recombination. They spread a typical distance L_p before they die. The longer they live (τ) and the faster they spread (D), the further they get.\n\n#### Example 9.1: diffusion length\n\n**Question.** Holes are injected into n-type silicon in which D_p = 12 cm²/s and the hole lifetime is 1 μs. Calculate the hole diffusion length, and the fraction of the injected excess remaining 100 μm from the injection point.\n\n**Given:** D_p = 12 cm²/s, τ_p = 1 μs = 1×10⁻⁶ s, x = 100 μm.\n\n**Find:** L_p, and Δp(100 μm)/Δp(0).\n\n**Solution.**\n\nStep 1. L_p = √(D_pτ_p) = √(12 × 10⁻⁶) = 3.46×10⁻³ cm = 34.6 μm\n\nStep 2. Δp(x)/Δp(0) = e^{−x/L_p}:\n\n    e^{−100/34.6} = e^{−2.89} = 0.056\n\n**Answer:** **L_p = 34.6 μm**; only **5.6 %** of the excess survives 100 μm from the injection point.\n\nThe hole current at the injection point comes from the slope of the profile there:\n\n    J_p(0) = −qD_p dΔp/dx |₀ = qD_pΔp(0)/L_p\n\nThis is exactly the formula that, applied at the edge of a junction, gives the Shockley diode equation (Week 10). The fourth case (straight-line profile in a short region) is what happens in a transistor's thin base (Week 13).\n\n### Where the continuity equation is used\n\n- **Diodes:** the exponential profile in each neutral region gives the diode current (Week 10).\n- **Bipolar transistors:** the straight-line profile in the thin base gives the collector current and the gain (Week 13).\n- **Measuring lifetime:** the exponential decay after a light pulse (photoconductive decay) gives τ directly.\n- **Haynes–Shockley experiment:** a pulse of carriers drifts and spreads; timing it gives μ, D and τ.\n- **Solar cells and photodiodes:** with generation G_L(x) = G₀e^{−αx}, the solution gives how many carriers are collected.\n- **Device simulators** solve these equations numerically for every chip design.\n\n## Surfaces and surface states\n\n### Why surfaces are special\n\nInside the crystal, every silicon atom is bonded to four neighbours. At a surface the crystal simply stops: the surface atoms have bonds pointing out into nothing, called **dangling bonds**. Adsorbed impurities and defects in any oxide on top add more problems.\n\nThese create a high density of **surface states**: energy levels inside the band gap, located at the surface (typically 10¹⁰–10¹⁵ per cm²). They:\n\n- act as **SRH traps** (Week 8), so carriers recombine much faster at the surface than in the bulk;\n- **trap charge**, which bends the bands near the surface even with no voltage applied;\n- cause noise and instability, and shift the threshold voltage in MOSFETs.\n\n### Surface recombination velocity\n\nRecombination at a surface happens in an extremely thin layer, so it is counted **per unit area**, not per unit volume:\n\n    U_s = S × Δp(0)      [carriers per cm² per second]\n\nwhere Δp(0) is the excess minority concentration at the surface and **S is the surface recombination velocity** (cm/s).\n\n> **In plain words.** Imagine the excess carriers near the surface rushing into it at speed S and vanishing. A surface with S = 100 cm/s swallows carriers as fast as if they flowed into a drain at 100 cm/s. A perfect surface has S = 0; a surface that destroys every carrier that reaches it has S → ∞.\n\nFor surface traps of density N_st (per cm²):\n\n    S = σ_p v_th N_st\n\nIt enters the diffusion equation as a **boundary condition**: the carriers arriving at the surface by diffusion must equal the carriers recombining there,\n\n    D_p dΔp/dx |surface = S Δp(0)\n\n| Surface | Typical S (cm/s) |\n|---|---|\n| Bare or freshly etched Si | 10⁴ – 10⁶ |\n| Thermally oxidised Si | 10 – 100 |\n| Best passivated Si (Al₂O₃, SiNₓ, annealed SiO₂) | below 10 |\n| Ohmic metal contact | → ∞ (Δp forced to 0) |\n\n### How surfaces shorten the lifetime\n\nIn a wafer of thickness W with both surfaces recombining, the measured (effective) lifetime combines bulk and surface losses:\n\n    1/τ_eff = 1/τ_bulk + 2S/W          (for small S)\n\n#### Example 9.2: how surfaces reduce the lifetime\n\n**Question.** A silicon wafer 300 μm thick has a bulk lifetime of 100 μs. Both surfaces are oxidised, giving a surface recombination velocity of 100 cm/s. Calculate the effective lifetime. Repeat for unprotected surfaces with S = 10⁵ cm/s.\n\n**Given:** τ_bulk = 100 μs = 1×10⁻⁴ s, W = 300 μm = 0.03 cm, S = 100 cm/s (then 10⁵ cm/s).\n\n**Find:** τ_eff in each case.\n\n**Solution.**\n\nUse 1/τ_eff = 1/τ_bulk + 2S/W.\n\n    S = 100 cm/s:   2S/W = 2 × 100/0.03 = 6.7×10³ s⁻¹,   1/τ_bulk = 1×10⁴ s⁻¹\n\n                    1/τ_eff = 1.67×10⁴ s⁻¹   ⇒   τ_eff = 60 μs\n\n    S = 10⁵ cm/s:   2S/W = 6.7×10⁶ s⁻¹ ≫ 1/τ_bulk   ⇒   τ_eff ≈ 1/6.7×10⁶ = 0.15 μs\n\n**Answer:** **τ_eff = 60 μs with oxidised surfaces, but only about 0.15 μs with bare surfaces**: an unprotected surface, not the bulk, then controls the lifetime.\n\nWith an unprotected surface (S = 10⁵ cm/s), 2S/W = 6.7×10⁶ s⁻¹ and τ_eff falls to about **0.15 μs**: the surface, not the bulk, then controls everything.\n\n**Reducing surface recombination (passivation):** grow thermal SiO₂ and anneal in hydrogen to tie up dangling bonds; deposit silicon nitride or aluminium oxide; add a heavily doped surface layer that repels minority carriers (a \"back-surface field\" in solar cells); and keep surfaces clean and damage-free.\n\n## Key points of Week 9\n\n- Continuity equation = carrier book-keeping: ∂p/∂t = −(1/q)∂J_p/∂x + G − R.\n- Minority-carrier diffusion equation: ∂Δp/∂t = D_p∂²Δp/∂x² − Δp/τ_p + G_L.\n- Standard solutions: decay in time e^{−t/τ}; steady light Δp = G_Lτ; long bar e^{−x/L}; short region a straight line.\n- Diffusion length L = √(Dτ): how far a minority carrier travels before recombining.\n- Surfaces have dangling bonds → surface states → fast recombination, measured by S (cm/s).\n- 1/τ_eff = 1/τ_bulk + 2S/W; passivation keeps S small.\n\n---\n\n## Examination questions solved (Q45–Q46)\n\n### Q45. Explain the continuity equation for minority carriers and discuss its application to semiconductor devices.\n\n**Statement.** The continuity equation expresses conservation of carriers: in any small volume, the rate of increase of carrier concentration equals the net inflow due to current, plus generation, minus recombination.\n\n    ∂p/∂t = −(1/q) ∂J_p/∂x + G_p − R_p      (holes)\n    ∂n/∂t = +(1/q) ∂J_n/∂x + G_n − R_n      (electrons)\n\n**Derivation.** For a slab of area A and thickness dx, the number of holes increases at the rate (1/q)[J_p(x) − J_p(x + dx)]A from current flow and at (G_p − R_p)A dx from generation and recombination. Dividing by A dx and taking the limit gives the equations above.\n\n**Minority-carrier form.** For holes in an n-type region, substitute the hole current J_p = qμ_ppE − qD_p ∂p/∂x and, for low-level injection, the recombination rate R_p − G_th = Δp/τ_p. With uniform doping:\n\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − μ_pE ∂Δp/∂x − μ_p p ∂E/∂x + G_L − Δp/τ_p\n\nIn a quasi-neutral region E ≈ 0, giving the **ambipolar / minority-carrier diffusion equation**:\n\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − Δp/τ_p + G_L\n\nFor electrons in p-type material: ∂Δn/∂t = D_n ∂²Δn/∂x² − Δn/τ_n + G_L.\n\n**Applications:**\n\n1. **p-n junction diode.** In the neutral regions under steady forward bias, 0 = D_p d²Δp/dx² − Δp/τ_p gives Δp(x) = Δp(x_n)e^{−(x − x_n)/L_p}. The diffusion current at the depletion edge leads directly to the Shockley diode equation (Week 10).\n2. **Bipolar transistor.** In a narrow base (W_B ≪ L_n), solving the equation gives a nearly linear minority-carrier profile; the slope gives collector current, and the small recombination loss gives the base transport factor and current gain.\n3. **Photoconductive decay and lifetime measurement.** For uniform illumination switched off at t = 0, Δp(t) = Δp(0)e^{−t/τ_p}; measuring the decay of conductivity gives τ.\n4. **Haynes–Shockley experiment.** A pulse of minority carriers drifts and spreads; the time-dependent solution, a moving and broadening Gaussian, gives μ_p, D_p and τ_p and was used to verify the Einstein relation.\n5. **Solar cells and photodiodes.** With G_L(x) = G₀e^{−αx}, the solution gives the collection efficiency and photocurrent and shows why the diffusion length must exceed the absorption depth.\n6. **Switching transients.** The time-dependent equation gives stored charge and the reverse-recovery time of diodes.\n7. **Device simulation.** Together with Poisson's equation and the current equations, the continuity equations are solved numerically in every TCAD simulator.\n\n### Q46. What is surface recombination velocity? Explain how semiconductor surface states affect carrier lifetime.\n\n**Surface recombination velocity.** At a semiconductor surface, recombination happens in a very thin layer through surface states. It is described per unit area as\n\n    U_s = S · Δp_s      (cm⁻² s⁻¹)\n\nwhere Δp_s is the excess minority-carrier density at the surface and **S is the surface recombination velocity** (cm/s). It is the effective velocity at which excess carriers move into the surface and are annihilated. For surface traps of density N_st (cm⁻²) with capture cross-section σ_p:\n\n    S = σ_p v_th N_st\n\nS enters the boundary condition for the diffusion equation: D_p dΔp/dx = SΔp at the surface. S = 0 means an ideal surface; S → ∞ means every carrier arriving recombines (Δp_s = 0, like an Ohmic contact). Typical values: unpassivated Si 10⁴–10⁶ cm/s; thermally oxidised Si 10–10³ cm/s; well-passivated Si < 10 cm/s.\n\n**Surface states.** The crystal periodicity ends at the surface, leaving unsaturated (dangling) bonds, as well as adsorbed atoms, oxide defects and contamination. These produce a high density of localised energy levels distributed throughout the band gap, many near mid-gap.\n\n**How they affect lifetime:**\n\n1. **Additional recombination path.** Mid-gap surface states are efficient SRH centres. Carriers that diffuse to the surface recombine there quickly, so the measured (effective) lifetime is lower than the bulk lifetime: 1/τ_eff = 1/τ_bulk + 1/τ_surface, with 1/τ_surface ≈ 2S/W for a wafer of thickness W recombining at both surfaces. In thin wafers and small devices surface recombination can dominate: a 300 μm wafer with τ_bulk = 100 μs falls to τ_eff ≈ 60 μs at S = 100 cm/s and below 1 μs at S = 10⁵ cm/s.\n2. **Carrier depletion near the surface.** The excess carrier density falls towards the surface, creating a gradient that pulls more carriers there, so even carriers generated deep in the material are lost.\n3. **Surface band bending.** Charge in surface states bends the bands, creating depletion or inversion layers. Under depletion, both electrons and holes are present in similar numbers near the surface, which maximises SRH recombination and generation.\n4. **Leakage and noise.** Surface generation adds to reverse leakage current of junctions where they meet the surface; trapping and detrapping produces 1/f noise; charged states cause threshold-voltage drift and instability in MOS devices.\n5. **Device performance.** High S reduces solar-cell efficiency (especially for blue light absorbed near the surface), reduces BJT current gain (surface recombination at the emitter–base perimeter), and degrades photodetector response.\n\n**Reduction (passivation):** thermal oxidation (SiO₂) with forming-gas (H₂) anneal to tie up dangling bonds; silicon nitride and Al₂O₃ films with fixed charge for field-effect passivation; heavily doped surface layers (back-surface field) that repel minority carriers; and clean, damage-free surface preparation.\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 9.1: electron diffusion length\n\n**Question.** Electrons in p-type silicon have D_n = 25 cm²/s and τ_n = 10 μs. Find the diffusion length.\n\n**Given:** D_n = 25 cm²/s, τ_n = 10⁻⁵ s.\n\n**Find:** L_n.\n\n**Solution.**\n\n    L_n = √(D_nτ_n) = √(25 × 10⁻⁵) = 1.58×10⁻² cm = 158 μm\n\n**Answer:** **L_n ≈ 160 μm.**\n\n#### Practice 9.2: injected profile and current\n\n**Question.** Holes are injected at x = 0 into a long n-type bar with Δp(0) = 1×10¹⁴ cm⁻³, D_p = 12 cm²/s and L_p = 30 μm. Find the hole current density at x = 0 and the excess hole concentration at x = 60 μm.\n\n**Given:** Δp(0) = 10¹⁴ cm⁻³, D_p = 12 cm²/s, L_p = 3×10⁻³ cm.\n\n**Find:** J_p(0) and Δp(60 μm).\n\n**Solution.**\n\n    J_p(0) = qD_pΔp(0)/L_p = 1.6×10⁻¹⁹ × 12 × 10¹⁴ / 3×10⁻³ = 0.064 A/cm²\n    Δp(60 μm) = Δp(0) e^{−60/30} = 10¹⁴ × e^{−2} = 1.35×10¹³ cm⁻³\n\n**Answer:** **J_p(0) = 64 mA/cm², Δp(60 μm) = 1.35×10¹³ cm⁻³.**\n\n#### Practice 9.3: diffusion across a short region\n\n**Question.** Electrons are injected into a p-type region only 2 μm wide (much shorter than L_n), with Δn = 1×10¹⁵ cm⁻³ at one side and Δn = 0 at the other. Find the electron current density (D_n = 25 cm²/s).\n\n**Given:** W = 2×10⁻⁴ cm, Δn(0) = 10¹⁵ cm⁻³, Δn(W) = 0, D_n = 25 cm²/s.\n\n**Find:** J_n.\n\n**Solution.** In a short region the profile is a straight line, so the gradient is Δn(0)/W:\n\n    J_n = qD_nΔn(0)/W = 1.6×10⁻¹⁹ × 25 × 10¹⁵ / 2×10⁻⁴ = 20 A/cm²\n\n**Answer:** **J_n = 20 A/cm².** This is exactly the situation in a BJT base (Week 13).\n\n#### Practice 9.4: how good must the surface be?\n\n**Question.** A 200 μm thick wafer has a bulk lifetime of 200 μs. What surface recombination velocity can be tolerated if the effective lifetime must be at least 50 μs?\n\n**Given:** τ_bulk = 2×10⁻⁴ s, τ_eff = 5×10⁻⁵ s, W = 0.02 cm.\n\n**Find:** S.\n\n**Solution.**\n\n    2S/W = 1/τ_eff − 1/τ_bulk = 2×10⁴ − 5×10³ = 1.5×10⁴ s⁻¹\n    S = 1.5×10⁴ × 0.02 / 2 = 150 cm/s\n\n**Answer:** **S ≤ 150 cm/s**, achievable with a good thermal oxide.\n\n#### Practice 9.5: surface recombination current\n\n**Question.** At a surface with S = 1000 cm/s the excess hole concentration is 1×10¹³ cm⁻³. Find the recombination rate per unit area and the equivalent current density lost to the surface.\n\n**Given:** S = 10³ cm/s, Δp_s = 10¹³ cm⁻³.\n\n**Find:** U_s and J = qU_s.\n\n**Solution.**\n\n    U_s = SΔp_s = 10³ × 10¹³ = 10¹⁶ cm⁻²s⁻¹\n    J = qU_s = 1.6×10⁻¹⁹ × 10¹⁶ = 1.6×10⁻³ A/cm²\n\n**Answer:** **U_s = 10¹⁶ cm⁻²s⁻¹, J = 1.6 mA/cm².**\n\n#### Practice 9.6: no recombination\n\n**Question.** What does the steady-state minority-carrier profile look like if the lifetime is infinite (no recombination) and there is no field or generation? Why?\n\n**Answer.** The diffusion equation reduces to D_p d²Δp/dx² = 0, so the second derivative is zero and **Δp is a straight line**. With no recombination, every carrier that enters a slice must leave it, so the current, and hence the slope, is the same everywhere.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Derive the continuity equation for holes and electrons. | Write the continuity equation for holes. | ∂p/∂t = −(1/q)∂J_p/∂x + G_p − R_p. | Deriving the continuity equation |\n| 2 | Write and interpret the minority-carrier diffusion equation. | What does the term −Δp/τ_p represent? | Loss of excess holes by recombination. | The minority-carrier diffusion equation |\n| 3 | Solve the diffusion equation for the standard cases. | What is the steady-state profile for injection into a long bar? | Δp(x) = Δp(0)e^{−x/L_p}. | The four standard solutions |\n| 4 | Calculate diffusion lengths and explain their importance. | Find L_n for D_n = 30 cm²/s, τ_n = 10 μs. | L_n = √(30 × 10⁻⁵) = 1.7×10⁻² cm = 173 μm. | Diffusion length; Example 9.1 |\n| 5 | Explain surface states and surface recombination velocity. | What value of S corresponds to an Ohmic metal contact? | S → ∞ (Δp forced to zero). | Surfaces and surface states |\n| 6 | Calculate the effective lifetime of a wafer with recombining surfaces. | Write 1/τ_eff for a wafer of thickness W. | 1/τ_eff = 1/τ_bulk + 2S/W. | How surfaces shorten the lifetime; Example 9.2 |\n", "group": "Module 3 · Carrier Transport & Injection Phenomena", "eyebrow": "Week 9", "disp": "09"}, {"num": "10", "title": "The p-n Junction Diode", "body": "\n**Plan:** built-in potential, depletion width and electric-field profile; ideal diode (Shockley) equation derivation under forward and reverse bias.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Explain the formation of the depletion region in a p-n junction.\n2. Derive and calculate the built-in potential.\n3. Calculate the depletion width and electric-field profile.\n4. Explain the junction under forward and reverse bias and the law of the junction.\n5. Derive and use the Shockley diode equation.\n6. Explain breakdown and junction capacitance.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_v (E_V) | Energy of the top of the valence band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| E_i | Intrinsic Fermi level, close to mid-gap | eV |\n| p | Hole concentration (holes per cm³) | cm⁻³ |\n| n_i | Intrinsic carrier concentration (n = p = n_i in pure material) | cm⁻³; Si ≈ 1×10¹⁰ at 300 K |\n| p_n0, n_p0 | Equilibrium minority concentrations: holes on the n side, electrons on the p side | cm⁻³; p_n0 = n_i²/N_D |\n| N_D | Donor concentration | cm⁻³ |\n| N_A | Acceptor concentration | cm⁻³ |\n| N_D⁺, N_A⁻ | Concentrations of ionised donors and acceptors | cm⁻³ |\n| Δn, Δp | Excess electron and hole concentrations above equilibrium | cm⁻³ |\n| E (field) | Electric field (on band diagrams, E is energy instead) | V/cm |\n| μ, μ_n, μ_p | Mobility: drift velocity per unit field (electrons, holes) | cm²/(V·s); Si μ_n 1350, μ_p 480 |\n| J, J_n, J_p | Current density (total, electrons, holes) | A/cm² |\n| D_n, D_p | Diffusion coefficients of electrons and holes | cm²/s; Si 35 and 12.4 |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| L, L_n, L_p | Diffusion length √(Dτ): distance a minority carrier travels before recombining | μm or cm |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| V, V_a | Applied voltage (positive for forward bias) | V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| x_n, x_p | Parts of the depletion region on the n side and on the p side | μm |\n| E_max | Peak electric field, at the junction | V/cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I | Current | A |\n| A (area) | Device or contact area | cm² |\n| η | Ideality factor of a diode, 1 (ideal) to 2 | dimensionless |\n| C, C_j | Capacitance (junction or depletion capacitance) | F (pF = 10⁻¹² F) |\n| V_BR | Breakdown voltage | V |\n| n_n0, p_p0, p_n0, n_p0 | Equilibrium densities: majority (n_n0, p_p0) and minority (p_n0 holes on n side, n_p0 electrons on p side) | cm⁻³ |\n| Δp_n, Δn_p | Excess minority carriers at the depletion edges (holes on n side, electrons on p side) | cm⁻³ |\n| p_n, n_p | Minority-carrier density: holes on the n side, electrons on the p side | cm⁻³ |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| C-V | Capacitance–voltage (measurement or characteristic) |\n| MOSFET | Metal–oxide–semiconductor field-effect transistor |\n| LED | Light-emitting diode |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n## The big picture\n\nA **p-n junction** is what you get when one part of a single crystal is p-type and the part next to it is n-type. It is the most important structure in electronics: it is a diode on its own, two of them make a bipolar transistor, and it appears in every MOSFET, solar cell, LED and laser.\n\nIts key property is that it conducts easily one way and hardly at all the other way (**rectification**). This week explains why, using only ideas you already have:\n\n1. **Diffusion** (Week 7) makes carriers cross the junction, leaving fixed charges behind.\n2. Those charges create an **electric field and a built-in voltage**, which stops further diffusion.\n3. An applied voltage raises or lowers that barrier. Lowering it lets minority carriers be **injected**, and they **diffuse and recombine** (Weeks 8–9). Adding up that diffusion gives the diode equation.\n\n## Forming the junction: where the depletion region comes from\n\nImagine joining p-type silicon (lots of holes, doping N_A) and n-type silicon (lots of electrons, doping N_D) in one crystal.\n\n1. **Diffusion starts.** There are many holes on the p side and very few on the n side, so holes diffuse from p into n. Electrons diffuse the other way, from n into p.\n2. **Fixed charges are uncovered.** Each hole that leaves the p side leaves behind a negative acceptor ion (N_A⁻), which is locked in the crystal and cannot move. Each electron that leaves the n side leaves behind a positive donor ion (N_D⁺). The carriers that cross also recombine with the majority carriers on the other side and disappear.\n3. **A charged layer forms.** Near the junction there is now a layer of **negative** ions on the p side and **positive** ions on the n side, with almost no mobile carriers in it. This is the **depletion region** (also called the space-charge region).\n4. **The charges create a field.** Positive charge on the n side and negative on the p side create an electric field pointing from n to p.\n5. **The field pushes back.** That field drives holes back to the p side and electrons back to the n side: a **drift** current opposite to the diffusion current.\n6. **Balance.** The depletion region grows until, for each type of carrier, drift exactly cancels diffusion. Now no net current flows. The **Fermi level is flat** across the whole junction, as it must be in equilibrium (Week 5).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 354\" role=\"img\" aria-label=\"Abrupt p-n junction in equilibrium: fixed charge in the depletion region, the triangular electric field, and the band diagram with a flat Fermi level and bands bent by q V bi\" style=\"width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></ font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"75.2\" y=\"256.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"148.8\" y1=\"205.0\" x2=\"385.0\" y2=\"205.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"0.8\" opacity=\"0\" stroke-dasharray=\"2 3\"/><line x1=\"154.0\" y1=\"205.0\" x2=\"154.0\" y2=\"246.6\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" marker-end=\"url(#art)\"/><line x1=\"143.5\" y1=\"247.6\" x2=\"437.5\" y2=\"247.6\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"0.8\" opacity=\"1.0\" stroke-dasharray=\"2 3\"/><text x=\"160.0\" y=\"230.3\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">qV<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"227.5\" y1=\"22.0\" x2=\"227.5\" y2=\"326.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.45\" stroke-dasharray=\"2 4\"/><text x=\"227.5\" y=\"344.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">−x<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"437.5\" y1=\"22.0\" x2=\"437.5\" y2=\"326.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.45\" stroke-dasharray=\"2 4\"/><text x=\"437.5\" y=\"344.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">x<tspan dy=\"0.32em\" font-size=\"72%\">n</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"280.0\" y=\"344.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">0</text></svg><figcaption>The abrupt p-n junction in equilibrium. Top: the fixed charge in the depletion region (negative on the p side, positive on the n side). Middle: the electric field, strongest at the junction. Bottom: the band diagram; the Fermi level is flat and the bands bend by qV<sub>bi</sub>.</figcaption></figure>\n```\n\n> **In plain words.** Two crowds on either side of a line start mixing. But everyone who crosses leaves a tied-up dog behind, and the dogs bark at anyone trying to follow. Soon the barking (the field) is strong enough to stop the crossing. The strip full of dogs and empty of people is the depletion region.\n\n## The built-in potential\n\nThe field in the depletion region corresponds to a voltage across it, the **built-in potential V_bi**. The n side is at a higher potential than the p side. In the band diagram, the bands on the p side sit higher than on the n side by qV_bi.\n\nWe can find V_bi from the Fermi-level positions of Week 5. On the p side, E_F is kT ln(N_A/n_i) below E_i. On the n side it is kT ln(N_D/n_i) above E_i. In the joined junction E_F is one flat line, so the bands must bend by the sum:\n\n    qV_bi = kT ln(N_A/n_i) + kT ln(N_D/n_i)\n\n    V_bi = (kT/q) ln( N_A N_D / n_i² )\n\n#### Example 10.1: built-in potential\n\n**Question.** A silicon p-n junction has N_A = 1×10¹⁷ cm⁻³ on the p side and N_D = 1×10¹⁶ cm⁻³ on the n side. Calculate the built-in potential at 300 K.\n\n**Given:** N_A = 1×10¹⁷ cm⁻³, N_D = 1×10¹⁶ cm⁻³, n_i = 1×10¹⁰ cm⁻³, kT/q = 0.0259 V.\n\n**Find:** V_bi.\n\n**Solution.**\n\n    V_bi = (kT/q) ln(N_{A}N_D/n_i²) = 0.0259 × ln(10¹⁷ × 10¹⁶ / 10²⁰)\n\n         = 0.0259 × ln(10¹³) = 0.0259 × 29.93 = 0.775 V\n\n**Answer:** **V_bi = 0.775 V.**\n\nYou **cannot** measure V_bi with a voltmeter across a diode: where the wires meet the semiconductor, contact potentials appear that exactly cancel it. It is an internal barrier, not a battery.\n\n## Depletion width and field: the depletion approximation\n\nTo calculate the width of the depletion region we make the **depletion approximation**: inside the region (from −x_p on the p side to x_n on the n side) there are no mobile carriers at all, only the fixed ions; outside it the material is neutral. Then Poisson's equation (the link between charge and field) gives:\n\n**Charge balance.** The total negative charge equals the total positive charge:\n\n    N_A x_p = N_D x_n\n\nSo the depletion region extends **further into the more lightly doped side**. If N_A = 10 × N_D, then x_n = 10 × x_p.\n\n**Width.**\n\n    W = x_n + x_p = √( (2ε_s/q)(V_bi − V_a)(1/N_A + 1/N_D) )\n\nwith x_n = W N_A/(N_A + N_D) and x_p = W N_D/(N_A + N_D). Here ε_s is the permittivity of silicon (11.7 × 8.854×10⁻¹⁴ = 1.04×10⁻¹² F/cm) and V_a the applied voltage (positive for forward bias).\n\n**Peak field** (at the junction):\n\n    E_max = qN_D x_n/ε_s = qN_A x_p/ε_s,   and   V_bi − V_a = ½ E_max W\n\nFor a **one-sided p⁺n junction** (N_A ≫ N_D), almost all of W is on the n side: W ≈ √(2ε_s(V_bi − V_a)/qN_D).\n\n#### Example 10.2: depletion width and peak field\n\n**Question.** For the junction of Example 10.1 at zero bias, calculate the total depletion width, how much of it lies on each side, and the peak electric field.\n\n**Given:** V_bi = 0.775 V, N_A = 10¹⁷ cm⁻³, N_D = 10¹⁶ cm⁻³, ε_s = 1.04×10⁻¹² F/cm, q = 1.6×10⁻¹⁹ C, V_a = 0.\n\n**Find:** W, x_n, x_p and E_max.\n\n**Solution.**\n\nStep 1. Total width:\n\n    W = √( (2ε_s/q) V_bi (1/N_A + 1/N_D) )\n\n      = √( 2 × 1.04×10⁻¹² × 0.775 × (10⁻¹⁷ + 10⁻¹⁶) / 1.6×10⁻¹⁹ ) = √(1.10×10⁻⁹) = 3.32×10⁻⁵ cm\n\nStep 2. Split, using x_n = W N_A/(N_A + N_D):\n\n    x_n = 0.332 × 10/11 = 0.30 μm,   x_p = 0.332 − 0.30 = 0.03 μm\n\nStep 3. Peak field at the junction:\n\n    E_max = qN_Dx_n/ε_s = 1.6×10⁻¹⁹ × 10¹⁶ × 3.0×10⁻⁵ / 1.04×10⁻¹² = 4.7×10⁴ V/cm\n\n**Answer:** **W = 0.33 μm (0.30 μm on the n side, 0.03 μm on the p side), E_max = 4.7×10⁴ V/cm.** The region is narrow but the field in it is large.\n\n## The junction under bias\n\n**Forward bias** (p side made positive, V_a > 0). The applied voltage opposes the built-in voltage, so the barrier **falls** to V_bi − V_a and the depletion region **narrows**. Diffusion now wins over drift. Holes pour from p into n, and electrons from n into p. On arrival they are minority carriers: they are **injected**. They diffuse away from the junction and recombine (Week 9). The current rises steeply (exponentially) with voltage.\n\n**Reverse bias** (p side negative, V_a < 0). The applied voltage adds to the built-in voltage. The barrier **rises** to V_bi + |V_a| and the depletion region **widens**. Diffusion is shut off. The only current left is the tiny drift of the few minority carriers that happen to wander to the edge of the depletion region and get swept across. This is the **reverse saturation current**, almost independent of voltage, until breakdown.\n\n**The law of the junction.** The barrier controls how many carriers can be injected. At the edges of the depletion region, the minority-carrier concentrations become:\n\n    p_n(x_n) = p_n0 e^{qV_a/kT},     n_p(−x_p) = n_p0 e^{qV_a/kT}\n\np_n0 = n_i²/N_D and n_p0 = n_i²/N_A are the equilibrium minority concentrations. Forward bias multiplies them by e^{qV_a/kT}; reverse bias makes them almost zero. Every 60 mV of forward bias multiplies the injected minority carriers by 10.\n\n## The ideal diode (Shockley) equation, in words\n\nThe full derivation is worked in exam question Q48 below. The idea in four steps:\n\n1. **Injection.** The law of the junction gives the excess minority carriers at each edge of the depletion region: Δp = p_n0(e^{qV/kT} − 1) on the n side.\n2. **Diffusion and recombination.** In each neutral region the excess decays exponentially over a diffusion length (Week 9): Δp(x) = Δp(x_n)e^{−(x − x_n)/L_p}.\n3. **Current at the edge.** The diffusion current at the edge is qD_p × slope = (qD_p/L_p)Δp(x_n). Same for electrons on the p side.\n4. **Add them.** The total current is the sum of the hole and electron diffusion currents:\n\n    I = I_s ( e^{qV/kT} − 1 ),     I_s = qA n_i² ( D_p/(L_pN_D) + D_n/(L_nN_A) )\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 220\" role=\"img\" aria-label=\"Ideal silicon diode current against voltage: negligible reverse current and an exponential rise above about 0.6 volts\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"173.6\" x2=\"464.0\" y2=\"173.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"286.2\" y1=\"194.0\" x2=\"286.2\" y2=\"30.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"474.0\" y=\"177.6\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">V (V)</text><text x=\"291.2\" y=\"26.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">I (mA)</text><line x1=\"113.2\" y1=\"169.6\" x2=\"113.2\" y2=\"177.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"113.2\" y=\"188.6\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-0.8</text><line x1=\"199.7\" y1=\"169.6\" x2=\"199.7\" y2=\"177.6\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"199.7\" y=\"188.6\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-0.4</text><line x .6 302.8,173.6 303.7,173.6 304.7,173.6 305.6,173.6 306.5,173.6 307.4,173.6 308.3,173.6 309.3,173.6 310.2,173.6 311.1,173.6 312.0,173.6 312.9,173.6 313.9,173.6 314.8,173.6 315.7,173.6 316.6,173.6 317.5,173.6 318.5,173.6 319.4,173.6 320.3,173.6 321.2,173.6 322.1,173.6 323.1,173.6 324.0,173.6 324.9,173.6 325.8,173.6 326.8,173.6 327.7,173.6 328.6,173.6 329.5,173.6 330.4,173.6 331.4,173.6 332.3,173.6 333.2,173.6 334.1,173.6 335.0,173.6 336.0,173.6 336.9,173.6 337.8,173.6 338.7,173.6 339.6,173.6 340.6,173.6 341.5,173.6 342.4,173.6 343.3,173.6 344.2,173.6 345.2,173.6 346.1,173.6 347.0,173.6 347.9,173.6 348.8,173.6 349.8,173.6 350.7,173.6 351.6,173.6 352.5,173.6 353.4,173.6 354.4,173.6 355.3,173.6 356.2,173.6 357.1,173.6 358.0,173.6 359.0,173.6 359.9,173.6 360.8,173.6 361.7,173.6 362.6,173.6 363.6,173.6 364.5,173.6 365.4,173.6 366.3,173.6 367.2,173.6 368.2,173.6 369.1,173.6 370.0,173.6 370.9,173.6 371.8,173.6 372.8,173.6 373.7,173.6 374.6,173.6 375.5,173.6 376.4,173.6 377.4,173.6 378.3,173.6 379.2,173.6 380.1,173.6 381.0,173.6 382.0,173.6 382.9,173.6 383.8,173.6 384.7,173.6 385.6,173.6 386.6,173.6 387.5,173.6 388.4,173.6 389.3,173.6 390.2,173.6 391.2,173.6 392.1,173.6 393.0,173.6 393.9,173.5 394.8,173.5 395.8,173.5 396.7,173.5 397.6,173.5 398.5,173.5 399.5,173.4 400.4,173.4 401.3,173.4 402.2,173.4 403.1,173.3 404.1,173.3 405.0,173.2 405.9,173.1 406.8,173.0 407.7,172.9 408.7,172.8 409.6,172.7 410.5,172.5 411.4,172.3 412.3,172.1 413.3,171.8 414.2,171.5 415.1,171.1 416.0,170.7 416.9,170.2 417.9,169.6 418.8,168.9 419.7,168.0 420.6,167.0 421.5,165.8 422.5,164.4 423.4,162.8 424.3,160.9 425.2,158.6 426.1,155.9 427.1,152.8 428.0,149.1 428.9,144.7 429.8,139.5 430.7,133.4 431.7,126.2 432.6,117.8 433.5,107.8 434.4,96.1 435.3,82.2 436.3,65.9 437.2,46.7 438.1,24.0\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"80.8\" y=\"165.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">reverse: I ≈ −I<tspan dy=\"0.32em\" font-size=\"72%\">s</tspan><tspan dy=\"-0.32em\">​</tspan> (nA or less)</text><text x=\"414.3\" y=\"105.6\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">≈ 0.6–0.7 V (Si)</text><text x=\"412.3\" y=\"58.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">×10 per 60 mV</text></svg><figcaption>The ideal diode characteristic. Forward current grows ten times for every 60 mV at 300 K; reverse current is a tiny −I<sub>s</sub>.</figcaption></figure>\n```\n\n**What the equation says:**\n\n- **Forward** (V > about 0.1 V): the −1 is negligible and I ≈ I_s e^{qV/kT}. Because I_s is tiny (10⁻¹⁵–10⁻¹² A for small Si diodes), a noticeable current needs about 0.6–0.7 V in Si (0.2–0.3 V in Ge).\n- **Reverse** (V negative, more than a few kT/q): e^{qV/kT} → 0 and I ≈ −I_s, tiny and constant.\n- I_s ∝ n_i², so it rises steeply with temperature and is much larger in small-gap materials (Ge diodes leak far more than Si).\n\n#### Example 10.3: saturation current and forward current of a diode\n\n**Question.** A silicon p⁺n diode has N_D = 1×10¹⁶ cm⁻³ on the n side, hole diffusion coefficient D_p = 10 cm²/s, hole lifetime τ_p = 1 μs and area 10⁻⁴ cm². Calculate the saturation current, and the forward current at 0.6 V and at 0.7 V (300 K).\n\n**Given:** N_D = 10¹⁶ cm⁻³, D_p = 10 cm²/s, τ_p = 10⁻⁶ s, A = 10⁻⁴ cm², n_i = 10¹⁰ cm⁻³, kT/q = 0.0259 V.\n\n**Find:** I_s, I(0.6 V), I(0.7 V).\n\n**Solution.**\n\nStep 1. Diffusion length: L_p = √(D_pτ_p) = √(10 × 10⁻⁶) = 3.16×10⁻³ cm\n\nStep 2. For a p⁺n diode only the hole term matters:\n\n    I_s ≈ qAn_i²D_p/(L_pN_D) = 1.6×10⁻¹⁹ × 10⁻⁴ × 10²⁰ × 10 / (3.16×10⁻³ × 10¹⁶) = 5.1×10⁻¹⁶ A\n\nStep 3. Forward current, I ≈ I_s e^{qV/kT}:\n\n    I(0.6 V) = 5.1×10⁻¹⁶ × e^{0.6/0.0259} = 5.1×10⁻¹⁶ × 1.15×10¹⁰ = 5.9×10⁻⁶ A\n\n    I(0.7 V) = 5.1×10⁻¹⁶ × e^{0.7/0.0259} = 5.1×10⁻¹⁶ × 5.45×10¹¹ = 2.8×10⁻⁴ A\n\n**Answer:** **I_s = 5.1×10⁻¹⁶ A; I = 5.9 μA at 0.6 V and 280 μA at 0.7 V.** An extra 0.1 V multiplies the current by about 47.\n\n## Breakdown\n\nAt large reverse voltage the current suddenly rises. Two mechanisms:\n\n- **Avalanche breakdown.** Carriers crossing the strong depletion field gain enough energy to knock new electron–hole pairs out of the lattice (impact ionisation, Week 8), which multiply in a chain reaction. Typical of lightly doped junctions; breakdown voltage above about 6 V; rises with temperature.\n- **Zener breakdown.** In very heavily doped junctions the depletion region is extremely thin, and electrons **tunnel** straight through from the p-side valence band to the n-side conduction band. Breakdown voltage below about 4 V; falls with temperature. Used in Zener voltage regulators.\n\n## Junction capacitance\n\nThe depletion region is a layer of stored charge between two conducting regions, so it behaves as a **capacitor** with plate separation W:\n\n    C_j = ε_sA/W\n\nSince W grows with reverse bias, C_j **falls** as the reverse voltage increases. Diodes used deliberately as voltage-controlled capacitors (in radio tuning) are called **varactors**. Measuring C_j against voltage is also how doping is measured (C-V profiling, Week 12). Under forward bias the stored minority carriers add a larger **diffusion capacitance**.\n\n## Key points of Week 10\n\n- Diffusion across the junction uncovers fixed ions: the depletion region, with a field from n to p.\n- Equilibrium: drift balances diffusion, E_F is flat, and the bands bend by qV_bi = kT ln(N_{A}N_D/n_i²).\n- N_Ax_p = N_Dx_n: the depletion region lies mostly on the lightly doped side. W = √((2ε_s/q)(V_bi − V)(1/N_A + 1/N_D)).\n- Forward bias lowers the barrier and injects minority carriers (law of the junction); reverse bias raises it.\n- Shockley equation: I = I_s(e^{qV/kT} − 1), from minority-carrier diffusion in the neutral regions.\n- Breakdown by avalanche (lightly doped) or Zener tunnelling (heavily doped); C_j = ε_sA/W.\n\n---\n\n## Examination questions solved (Q47–Q48)\n\n### Q47. Explain the formation of the depletion region and built-in potential in a p-n junction.\n\n**Formation of the depletion region.**\n\n1. When p-type and n-type regions are formed in one crystal, the p side has a high hole concentration (p_p0 ≈ N_A) and the n side a high electron concentration (n_n0 ≈ N_D). The steep concentration gradients cause holes to diffuse from p to n and electrons from n to p.\n2. Holes leaving the p side near the junction leave behind **immobile negative acceptor ions**; electrons leaving the n side leave behind **immobile positive donor ions**. Diffusing carriers also recombine with the majority carriers on the other side.\n3. A region on both sides of the metallurgical junction is therefore stripped of mobile carriers and contains only fixed ionic charge: **negative on the p side, positive on the n side**. This is the **depletion region** or space-charge region, typically 0.1–10 μm wide.\n4. The two charge layers are equal in magnitude, N_A x_p = N_D x_n, so the depletion region extends further into the more lightly doped side.\n5. The space charge produces an **electric field** directed from the positive (n) side to the negative (p) side, maximum at the junction: E_max = qN_D x_n/ε_s.\n6. This field drives drift currents of holes back to p and electrons back to n, opposing the diffusion. The depletion region grows until **drift exactly balances diffusion** for both carriers and the net current is zero. In equilibrium the Fermi level is constant throughout.\n\n**Built-in potential.** The field corresponds to an electrostatic potential difference across the depletion region, the **built-in potential V_bi**, with the n side positive with respect to the p side. In the band diagram, the bands bend by qV_bi so that the flat Fermi level is near E_v on the p side and near E_c on the n side. It forms a potential barrier that majority carriers must surmount to cross.\n\nIts value follows from the Fermi-level positions: q V_bi = (E_i − E_F)_p + (E_F − E_i)_n = kT ln(N_A/n_i) + kT ln(N_D/n_i), so\n\n    V_bi = (kT/q) ln( N_A N_D / n_i² )\n\nWidth of the depletion region:\n\n    W = √( (2ε_s V_bi / q)(N_A + N_D)/(N_A N_D) )\n\n**Example (Si, N_A = 10¹⁷, N_D = 10¹⁶ cm⁻³):** V_bi = 0.0259 ln(10¹³) = **0.775 V**; W = **0.33 μm**, of which 0.30 μm is on the n side; E_max ≈ 4.7×10⁴ V/cm.\n\nThe built-in potential cannot drive current in an external circuit, because in equilibrium it is exactly balanced by the contact potentials at the metal–semiconductor contacts. Applied bias changes the barrier to V_bi − V_a, which is the basis of rectification.\n\n### Q48. Derive the ideal Shockley diode equation and explain the effect of forward and reverse bias.\n\n**Assumptions (Shockley):**\n\n1. Abrupt junction; depletion approximation (no carriers in the depletion region, neutral elsewhere).\n2. Boltzmann statistics apply (non-degenerate).\n3. **Low-level injection**: injected minority densities are much smaller than majority densities.\n4. No generation or recombination inside the depletion region, so electron and hole currents are each constant across it.\n5. All applied voltage V appears across the depletion region; neutral regions have negligible resistance (zero field).\n6. Long neutral regions (longer than the diffusion lengths) terminated by Ohmic contacts.\n\n**Step 1: law of the junction.** In equilibrium n_n0/n_p0 = exp(qV_bi/kT). With bias V the barrier becomes V_bi − V, and (quasi-equilibrium across the depletion region) the minority densities at its edges become:\n\n    p_n(x_n) = p_n0 exp(qV/kT),     n_p(−x_p) = n_p0 exp(qV/kT)\n\nSo the excess minority densities at the edges are:\n\n    Δp_n(x_n) = p_n0 [ exp(qV/kT) − 1 ],     Δn_p(−x_p) = n_p0 [ exp(qV/kT) − 1 ]\n\n**Step 2: minority-carrier diffusion in the neutral n region.** With E = 0 and steady state, the continuity equation reduces to\n\n    D_p d²Δp_n/dx² − Δp_n/τ_p = 0\n\nFor a long region (Δp → 0 as x → ∞) the solution is\n\n    Δp_n(x) = Δp_n(x_n) exp( −(x − x_n)/L_p ),     L_p = √(D_pτ_p)\n\n**Step 3: hole diffusion current at x = x_n.** With no field, the hole current is pure diffusion:\n\n    J_p(x_n) = −qD_p dΔp_n/dx |_{x_n} = (qD_p/L_p) Δp_n(x_n) = (qD_p p_n0/L_p) [ exp(qV/kT) − 1 ]\n\n**Step 4: electron current at x = −x_p.** Similarly in the p region:\n\n    J_n(−x_p) = (qD_n n_p0/L_n) [ exp(qV/kT) − 1 ]\n\n**Step 5: total current.** With no recombination in the depletion region, J_n is the same at x_n as at −x_p, so the total current (constant everywhere) is the sum of the two minority diffusion currents at the depletion edges:\n\n    J = J_p(x_n) + J_n(−x_p) = [ qD_p p_n0/L_p + qD_n n_p0/L_n ] [ exp(qV/kT) − 1 ]\n\nUsing p_n0 = n_i²/N_D and n_p0 = n_i²/N_A:\n\n    J = J_s [ exp(qV/kT) − 1 ],     J_s = q n_i² ( D_p/(L_p N_D) + D_n/(L_n N_A) )\n\nor, for area A, **I = I_s [ exp(qV/kT) − 1 ]** with I_s = AJ_s. This is the ideal Shockley diode equation.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 220\" role=\"img\" aria-label=\"Ideal silicon diode current against voltage: negligible reverse current and an exponential rise above about 0.6 volts\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y  379.2,173.6 380.1,173.6 381.0,173.6 382.0,173.6 382.9,173.6 383.8,173.6 384.7,173.6 385.6,173.6 386.6,173.6 387.5,173.6 388.4,173.6 389.3,173.6 390.2,173.6 391.2,173.6 392.1,173.6 393.0,173.6 393.9,173.5 394.8,173.5 395.8,173.5 396.7,173.5 397.6,173.5 398.5,173.5 399.5,173.4 400.4,173.4 401.3,173.4 402.2,173.4 403.1,173.3 404.1,173.3 405.0,173.2 405.9,173.1 406.8,173.0 407.7,172.9 408.7,172.8 409.6,172.7 410.5,172.5 411.4,172.3 412.3,172.1 413.3,171.8 414.2,171.5 415.1,171.1 416.0,170.7 416.9,170.2 417.9,169.6 418.8,168.9 419.7,168.0 420.6,167.0 421.5,165.8 422.5,164.4 423.4,162.8 424.3,160.9 425.2,158.6 426.1,155.9 427.1,152.8 428.0,149.1 428.9,144.7 429.8,139.5 430.7,133.4 431.7,126.2 432.6,117.8 433.5,107.8 434.4,96.1 435.3,82.2 436.3,65.9 437.2,46.7 438.1,24.0\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"80.8\" y=\"165.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">reverse: I ≈ −I<tspan dy=\"0.32em\" font-size=\"72%\">s</tspan><tspan dy=\"-0.32em\">​</tspan> (nA or less)</text><text x=\"414.3\" y=\"105.6\" text-anchor=\"end\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">≈ 0.6–0.7 V (Si)</text><text x=\"412.3\" y=\"58.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">×10 per 60 mV</text></svg><figcaption>Ideal diode characteristic. Forward current grows by a factor of 10 for every 60 mV at 300 K; reverse current saturates at −I<sub>s</sub>.</figcaption></figure>\n```\n\n**Effect of forward bias (V > 0, p side positive):**\n\n- The barrier is lowered to V_bi − V and the depletion region narrows.\n- Minority carriers are injected: the edge densities increase by exp(qV/kT).\n- For V ≫ kT/q (above about 0.1 V) the −1 is negligible: I ≈ I_s exp(qV/kT). Current increases by a decade every 2.3kT/q ≈ 60 mV.\n- Significant current flows only above the \"cut-in\" voltage (≈ 0.6–0.7 V in Si, ≈ 0.2–0.3 V in Ge), because I_s is so small.\n\n**Effect of reverse bias (V < 0):**\n\n- The barrier rises to V_bi + |V|; the depletion region widens.\n- The edge minority densities fall almost to zero (exp(qV/kT) → 0). Carriers are extracted rather than injected.\n- For |V| ≫ kT/q: I ≈ −I_s, a small, voltage-independent **reverse saturation current** (Si, about 10⁻¹⁵–10⁻¹² A for small diodes) carried by minority carriers generated within a diffusion length of the junction.\n- In real diodes, generation in the depletion region adds a current ∝ W ∝ √|V|, and at large |V| avalanche or Zener breakdown occurs.\n\n**Numerical example.** A Si p⁺n diode with N_D = 10¹⁶ cm⁻³, D_p = 10 cm²/s, τ_p = 1 μs, area 10⁻⁴ cm²: L_p = √(10 × 10⁻⁶) = 3.16×10⁻³ cm; J_s ≈ qn_i²D_p/(L_pN_D) = (1.602×10⁻¹⁹)(10²⁰)(10)/(3.16×10⁻³ × 10¹⁶) = 5.1×10⁻¹² A/cm², so I_s = 5.1×10⁻¹⁶ A. At V = 0.6 V, I = I_s e^{0.6/0.0259} = 5.1×10⁻¹⁶ × 1.15×10¹⁰ ≈ 5.9 μA, and at 0.7 V it is about 280 μA.\n\n**Real diodes** deviate: recombination in the depletion region at low forward bias (I ∝ e^{qV/2kT}), high-level injection at high current, series resistance, and generation current and breakdown in reverse. These are summarised by I = I_s(e^{qV/ηkT} − 1), with ideality factor η between 1 and 2.\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 10.1: built-in potential of a germanium junction\n\n**Question.** A germanium junction has N_A = N_D = 1×10¹⁶ cm⁻³. Find V_bi at 300 K (n_i = 2.4×10¹³ cm⁻³) and compare with silicon.\n\n**Given:** N_A = N_D = 10¹⁶ cm⁻³, n_i = 2.4×10¹³ cm⁻³, kT/q = 0.0259 V.\n\n**Find:** V_bi.\n\n**Solution.**\n\n    V_bi = 0.0259 ln(10³²/5.76×10²⁶) = 0.0259 ln(1.74×10⁵) = 0.0259 × 12.06 = 0.31 V\n\n**Answer:** **V_bi = 0.31 V**, against 0.72 V for silicon with the same doping: the smaller gap gives a smaller barrier.\n\n#### Practice 10.2: reverse-biased depletion width and field\n\n**Question.** A silicon p⁺n junction has N_D = 1×10¹⁵ cm⁻³ and V_bi = 0.7 V. Find the depletion width and peak field at a reverse bias of 5 V.\n\n**Given:** N_D = 10¹⁵ cm⁻³, V_bi − V = 0.7 + 5 = 5.7 V, ε_s = 1.04×10⁻¹² F/cm.\n\n**Find:** W and E_max.\n\n**Solution.**\n\n    W = √(2ε_s(V_bi − V)/qN_D) = √(2 × 1.04×10⁻¹² × 5.7 / (1.6×10⁻¹⁹ × 10¹⁵)) = 2.72×10⁻⁴ cm\n    E_max = 2(V_bi − V)/W = 2 × 5.7/2.72×10⁻⁴ = 4.2×10⁴ V/cm\n\n**Answer:** **W = 2.7 μm, E_max = 4.2×10⁴ V/cm.**\n\n#### Practice 10.3: junction capacitance\n\n**Question.** Find the junction capacitance of the diode in Practice 10.2 if its area is 1×10⁻³ cm².\n\n**Given:** W = 2.72×10⁻⁴ cm, A = 10⁻³ cm², ε_s = 1.04×10⁻¹² F/cm.\n\n**Find:** C_j.\n\n**Solution.**\n\n    C_j = ε_sA/W = 1.04×10⁻¹² × 10⁻³ / 2.72×10⁻⁴ = 3.8×10⁻¹² F\n\n**Answer:** **C_j = 3.8 pF.**\n\n#### Practice 10.4: saturation current with both sides\n\n**Question.** A silicon diode has N_A = 1×10¹⁷ cm⁻³, N_D = 1×10¹⁶ cm⁻³, D_n = 20 cm²/s, L_n = 20 μm, D_p = 10 cm²/s, L_p = 10 μm. Find J_s and the fraction carried by holes.\n\n**Given:** the values above, n_i = 10¹⁰ cm⁻³.\n\n**Find:** J_s and the hole fraction.\n\n**Solution.**\n\n    D_p/(L_pN_D) = 10/(10⁻³ × 10¹⁶) = 1.0×10⁻¹²\n    D_n/(L_nN_A) = 20/(2×10⁻³ × 10¹⁷) = 1.0×10⁻¹³\n    J_s = qn_i²(1.0×10⁻¹² + 1.0×10⁻¹³) = 1.6×10⁻¹⁹ × 10²⁰ × 1.1×10⁻¹² = 1.76×10⁻¹¹ A/cm²\n    hole fraction = 1.0/1.1 = 91 %\n\n**Answer:** **J_s = 1.8×10⁻¹¹ A/cm², 91 % carried by holes injected into the lightly doped n side.**\n\n#### Practice 10.5: temperature and the saturation current\n\n**Question.** By roughly what factor does I_s of a silicon diode increase when the temperature rises from 300 K to 310 K? (Take I_s ∝ n_i² and ignore other temperature effects.)\n\n**Given:** n_i ∝ T^{3/2}e^{−E_g/2kT}, E_g = 1.12 eV.\n\n**Find:** I_s(310)/I_s(300).\n\n**Solution.**\n\n    n_i(310)/n_i(300) = (310/300)^{3/2} × exp[6499 × (1/300 − 1/310)] = 1.050 × e^{0.699} = 2.11\n    I_s ratio = 2.11² = 4.5\n\n**Answer:** **about 4.5 times for a 10 K rise**: reverse leakage is very temperature-sensitive.\n\n#### Practice 10.6: forward voltage per decade\n\n**Question.** How much must the forward voltage of an ideal diode increase to multiply the current by 10 at 300 K? If I = 1 mA at 0.60 V, what is I at 0.66 V?\n\n**Given:** I ∝ e^{qV/kT}, kT/q = 0.0259 V.\n\n**Find:** ΔV per decade; I at 0.66 V.\n\n**Solution.**\n\n    ΔV = (kT/q) ln 10 = 0.0259 × 2.303 = 59.6 mV\n    I(0.66) = 1 mA × e^{0.06/0.0259} = 1 × 10.1 = 10.1 mA\n\n**Answer:** **about 60 mV per decade; I ≈ 10 mA at 0.66 V.**\n\n#### Practice 10.7: avalanche or Zener?\n\n**Question.** A diode breaks down at 3.3 V and its breakdown voltage falls as it warms up. Another breaks down at 50 V and its breakdown voltage rises with temperature. Identify the mechanism in each and explain the temperature behaviour.\n\n**Answer.** The **3.3 V diode is Zener breakdown**: it is heavily doped, its depletion region is very thin, and electrons tunnel across the gap. Heating shrinks the band gap, making tunnelling easier, so V_BR falls. The **50 V diode is avalanche breakdown**: carriers gain energy across a wide depletion region and impact-ionise. Heating increases lattice vibration, so carriers lose more energy to phonons between collisions and need a larger field to ionise, so V_BR rises.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Explain the formation of the depletion region in a p-n junction. | Why is the depletion region empty of mobile carriers? | Carriers diffused across and recombined, leaving only fixed donor and acceptor ions. | Forming the junction |\n| 2 | Derive and calculate the built-in potential. | Find V_bi for N_A = N_D = 10¹⁶ cm⁻³ in Si. | 0.0259 ln(10¹²) = 0.716 V. | The built-in potential; Example 10.1 |\n| 3 | Calculate the depletion width and electric-field profile. | If N_A = 100 N_D, where does most of the depletion region lie? | On the n side (x_n = 100 x_p). | Depletion approximation; Example 10.2 |\n| 4 | Explain the junction under forward and reverse bias and the law of the junction. | By what factor does forward bias of 0.12 V multiply the injected minority carriers? | e^{0.12/0.0259} ≈ 100. | The junction under bias |\n| 5 | Derive and use the Shockley diode equation. | Write the ideal diode equation and its saturation current density. | I = I_s(e^{qV/kT} − 1); J_s = qn_i²(D_p/L_pN_D + D_n/L_nN_A). | Shockley equation; Example 10.3; Q48 |\n| 6 | Explain breakdown and junction capacitance. | Which breakdown mechanism occurs in very heavily doped junctions? | Zener (tunnelling) breakdown. | Breakdown; junction capacitance |\n", "group": "Module 4 · Junctions, Interfaces & Characterisation", "eyebrow": "Week 10", "disp": "10"}, {"num": "11", "title": "Metal–Semiconductor Interfaces", "body": "\n**Plan:** Schottky barrier diode physics versus Ohmic contact mechanisms; energy band diagrams under equilibrium and bias.\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Define work function and electron affinity and relate them.\n2. Explain how a Schottky barrier forms and calculate Φ_B and V_bi.\n3. Explain thermionic emission and calculate Schottky diode currents.\n4. Draw Schottky band diagrams in equilibrium and under bias.\n5. Explain the two ways of making Ohmic contacts.\n6. Describe the stability problems of metal contacts.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| q | Magnitude of the electronic charge | 1.6×10⁻¹⁹ C |\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| kT | Thermal energy | 0.0259 eV (often 0.02585 eV) at 300 K |\n| kT/q | Thermal voltage | 0.0259 V (about 26 mV) at 300 K |\n| T | Absolute temperature | kelvin (K); room temperature = 300 K |\n| ε_s (ε_si) | Permittivity of silicon, 11.7ε₀ | 1.04×10⁻¹² F/cm |\n| eV | Electron-volt, a unit of energy | 1 eV = 1.6×10⁻¹⁹ J |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| E_c (E_C) | Energy of the bottom of the conduction band | eV |\n| E_g | Band-gap energy, E_c − E_v | eV; Si 1.12, Ge 0.66, GaAs 1.42 at 300 K |\n| E_F | Fermi level: the energy at which a state has a 50 % chance of being occupied | eV |\n| N_c | Effective density of states in the conduction band | cm⁻³; Si 2.8×10¹⁹ at 300 K |\n| N_D | Donor concentration | cm⁻³ |\n| Q | Dose: dopant atoms per unit area (in Weeks 13–14, Q also means charge) | atoms/cm² (C or C/cm² for charge) |\n| τ, τ_n, τ_p | Minority-carrier lifetime (τ_eff: effective, including surfaces) | s; Si 1 ns – 1 ms |\n| V_bi | Built-in potential of a junction or Schottky contact | V; typically 0.5–1 V |\n| V, V_a | Applied voltage (positive for forward bias) | V |\n| W | Depletion-region width (in Week 13 W_B, W_E are base and emitter widths; in Week 14 W is channel width) | μm or cm |\n| I_s, J_s (I_S) | Saturation current (density) of a diode or transistor | A; A/cm² |\n| I | Current | A |\n| A (area) | Device or contact area | cm² |\n| η | Ideality factor of a diode, 1 (ideal) to 2 | dimensionless |\n| Φ_m | Work function of a metal | eV; Al 4.28, Au 5.1 |\n| Φ_s | Work function of a semiconductor, χ + (E_c − E_F) | eV |\n| χ | Electron affinity: energy from E_c up to the vacuum level | eV; Si 4.05 |\n| Φ_B | Schottky barrier height seen from the metal | eV (or V) |\n| A∗∗ | Effective Richardson constant | A/(cm²·K²); n-Si ≈ 110 |\n| ρ_c | Specific contact resistance | Ω·cm² |\n| E_vac | Vacuum level: energy of an electron just free of the material | eV |\n| R_c | Contact resistance | Ω (specific: Ω·cm²) |\n| Φ_Bn, Φ_Bp | Schottky barrier height for electrons (n-type) and for holes (p-type) | eV |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| I-V | Current–voltage (measurement or characteristic) |\n| MESFET | Metal–semiconductor field-effect transistor |\n| n⁺ | Very heavily doped n-type (similarly p⁺) |\n\n\n## The big picture\n\nEvery device must be wired to the outside world with metal. You might expect a metal touching a semiconductor to behave like a simple wire connection. Sometimes it does: that is an **Ohmic contact**, which lets current through equally well in both directions. But sometimes the contact itself forms a **barrier** and conducts in only one direction, like a diode: a **Schottky contact**.\n\nWhich one you get depends on the metal, the semiconductor and its doping. Engineers want Ohmic contacts for wiring, and Schottky contacts when they want a very fast diode. This week explains both using band diagrams, with the same flat-Fermi-level reasoning as the p-n junction (Week 10).\n\n## The energies involved\n\nThree quantities describe where the electrons sit, all measured from the **vacuum level** (the energy of an electron just free of the material):\n\n- **Work function Φ_m (metal):** the energy needed to pull an electron from the metal's Fermi level out to the vacuum.\n- **Work function Φ_s (semiconductor):** the same for the semiconductor. It depends on doping, because doping moves E_F.\n- **Electron affinity χ (semiconductor):** the energy from the **bottom of the conduction band** to the vacuum level. This is a fixed property of the material: Si 4.05 eV, GaAs 4.07 eV, Ge 4.0 eV.\n\nThese are linked by\n\n    Φ_s = χ + (E_c − E_F)\n\nMetal work functions (eV): Al 4.28, Ti 4.33, Cr 4.5, W 4.55, Au 5.1, Ni 5.15, Pt 5.65.\n\n#### Example 11.1: work function of doped silicon\n\n**Question.** Calculate the work function of n-type silicon doped with N_D = 1×10¹⁶ cm⁻³ at 300 K. The electron affinity of Si is 4.05 eV.\n\n**Given:** χ = 4.05 eV, N_D = 1×10¹⁶ cm⁻³, N_c = 2.8×10¹⁹ cm⁻³, kT = 0.02585 eV.\n\n**Find:** Φ_s.\n\n**Solution.**\n\nStep 1. Position of E_F (Example 5.1): E_c − E_F = kT ln(N_c/N_D) = 0.205 eV\n\nStep 2. Φ_s = χ + (E_c − E_F) = 4.05 + 0.205 = 4.26 eV\n\n**Answer:** **Φ_s = 4.26 eV.**\n\n## The Schottky barrier (rectifying contact)\n\n### How it forms: metal on n-type with Φ_m > Φ_s\n\n1. **Before contact**, the semiconductor's Fermi level is **higher** than the metal's (its electrons are less tightly held, since Φ_s < Φ_m).\n2. **On contact**, electrons flow \"downhill\" from the semiconductor into the metal, until the two Fermi levels line up, just as in a p-n junction.\n3. The electrons that left uncover **positive donor ions** in the semiconductor near the interface: a **depletion region**, exactly like the n side of a p⁺n junction. A thin sheet of extra electrons sits on the metal surface.\n4. The bands in the semiconductor bend **upward** towards the interface.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 620 275\" role=\"img\" aria-label=\"Band diagram of a metal on n-type silicon after contact: the conduction band bends upward to the barrier q phi B at the interface, with built-in potential q V bi across the depletion width\" style=\"width:620px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">qΦ<tspan dy=\"0.32em\" font-size=\"72%\">B</tspan><tspan dy=\"-0.32em\">​</tspan> = q(Φ<tspan dy=\"0.32em\" font-size=\"72%\">m</tspan><tspan dy=\"-0.32em\">​</tspan> − χ)</text><line x1=\"40.0\" y1=\"20.0\" x2=\"40.0\" y2=\"158.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" marker-end=\"url(#ar)\"/><text x=\"46.0\" y=\"44.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">qΦ<tspan dy=\"0.32em\" font-size=\"72%\">m</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"400.0\" y1=\"130.0\" x2=\"400.0\" y2=\"78.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.4\" opacity=\"1.0\" marker-end=\"url(#ars)\"/><line x1=\"172.0\" y1=\"75.0\" x2=\"410.0\" y2=\"75.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\" stroke-dasharray=\"2 3\"/><text x=\"406.0\" y=\"112.5\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">qV<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"170.0\" y1=\"250.0\" x2=\"330.0\" y2=\"250.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-start=\"url(#ar)\" marker-end=\"url(#ar)\"/><text x=\"250.0\" y=\"266.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">depletion width W</text><text x=\"540.0\" y=\"266.0\" text-anchor=\"end\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\">n-type Si</text></svg><figcaption>Metal on n-type silicon (Φ<sub>m</sub> > Φ<sub>s</sub>) after contact. An electron in the metal sees the barrier qΦ<sub>B</sub>. An electron in the semiconductor sees the smaller built-in barrier qV<sub>bi</sub>.</figcaption></figure>\n```\n\nThere are now **two barriers**, depending on which side the electron starts from:\n\n    seen from the metal (barrier height):       Φ_B = Φ_m − χ       (the ideal Schottky–Mott rule)\n    seen from the semiconductor (built-in):    V_bi = Φ_m − Φ_s = Φ_B − (E_c − E_F)/q\n\n#### Example 11.2: ideal Schottky barrier\n\n**Question.** Gold (Φ_m = 5.1 eV) is deposited on the n-type silicon of Example 11.1. Using the ideal Schottky–Mott model, find the barrier height seen from the metal and the built-in potential seen from the semiconductor. Is the contact rectifying or Ohmic?\n\n**Given:** Φ_m = 5.1 eV, χ = 4.05 eV, Φ_s = 4.26 eV.\n\n**Find:** Φ_B, V_bi, and the type of contact.\n\n**Solution.**\n\n    Φ_B = Φ_m − χ = 5.1 − 4.05 = 1.05 eV\n\n    V_bi = Φ_m − Φ_s = 5.1 − 4.26 = 0.84 V\n\nΦ_m > Φ_s on n-type silicon, so a depletion region forms: the contact is rectifying.\n\n**Answer:** **Φ_B = 1.05 eV, V_bi = 0.84 V: a rectifying (Schottky) contact.** In practice Fermi-level pinning gives a measured Φ_B of about 0.8 eV for Au on n-Si.\n\n(For p-type semiconductors everything flips: a rectifying contact needs Φ_m < Φ_s, and the barrier for holes is Φ_{Bp} = E_g/q − (Φ_m − χ).)\n\n**Fermi-level pinning (what really happens).** Measured barriers depend much less on the metal than the simple rule predicts, because surface states at the interface (Week 9) hold (\"pin\") the Fermi level near a fixed energy. For example, gold on n-Si gives Φ_B ≈ 0.8 eV, not 1.05 eV; on n-GaAs almost every metal gives about 0.8 eV. In calculations, use the measured Φ_B if it is given.\n\n### How current flows: thermionic emission\n\nIn a Schottky diode the current is carried by **majority carriers** (electrons in n-type) jumping **over** the barrier. This is **thermionic emission**: only electrons with enough thermal energy can get over, so the current depends exponentially on the barrier height.\n\n    J = J_s ( e^{qV/ηkT} − 1 ),     J_s = A∗∗ T² e^{−qΦ_B/kT}\n\n| Symbol | Meaning |\n|---|---|\n| A∗∗ | effective Richardson constant (about 110 A/cm²K² for n-Si, 8 for n-GaAs) |\n| T | temperature |\n| Φ_B | barrier height |\n| η | ideality factor, 1.0–1.1 for good diodes |\n\nThe shape is the same as a p-n diode, but J_s is far larger.\n\n#### Example 11.3: Schottky saturation current\n\n**Question.** A Schottky diode on n-type silicon has a barrier height of 0.8 eV. Taking A∗∗ = 110 A/cm²K², calculate the saturation current density at 300 K and the forward voltage needed for 1 A/cm².\n\n**Given:** Φ_B = 0.8 eV, A∗∗ = 110 A/cm²K², T = 300 K, kT = 0.0259 eV, J = 1 A/cm².\n\n**Find:** J_s, and V at J = 1 A/cm².\n\n**Solution.**\n\nStep 1. J_s = A∗∗T²e^{−qΦ_B/kT}:\n\n    J_s = 110 × 300² × e^{−0.8/0.0259} = 9.9×10⁶ × 3.9×10⁻¹⁴ = 3.8×10⁻⁷ A/cm²\n\nStep 2. V = (kT/q) ln(J/J_s) for an ideal diode:\n\n    V = 0.0259 × ln(1/3.8×10⁻⁷) = 0.0259 × 14.8 = 0.38 V\n\n**Answer:** **J_s = 3.8×10⁻⁷ A/cm²; 1 A/cm² flows at about 0.38 V**, compared with about 0.7 V for a p-n diode, because J_s is about 10⁵ times larger.\n\n### Schottky diode versus p-n diode\n\n| | Schottky diode | p-n junction diode |\n|---|---|---|\n| Current carried by | Majority carriers only | Minority carriers injected and diffusing |\n| Mechanism | Thermionic emission over the barrier | Diffusion |\n| Stored minority charge | Practically none | Q = Iτ |\n| Switching speed | Very fast, no reverse-recovery delay | Slower (recovery time ≈ τ) |\n| Turn-on voltage (Si) | 0.2–0.4 V | 0.6–0.7 V |\n| Reverse leakage | Higher | Lower |\n| Breakdown voltage | Lower | Higher |\n| Uses | Fast rectifiers in power supplies, microwave mixers and detectors, clamps, MESFET gates | General rectification, high voltage, low leakage |\n\n## Band diagrams under bias\n\nTake the metal on n-type Si. The key rule: **the barrier seen from the metal, qΦ_B, never changes**, because it is fixed by the interface. The applied voltage appears across the depletion region and changes only the barrier seen from the semiconductor.\n\n| | Equilibrium (V = 0) | Forward bias (metal +, V > 0) | Reverse bias (metal −, V < 0) |\n|---|---|---|---|\n| Fermi levels | One flat E_F | Semiconductor E_F raised by qV relative to the metal | Semiconductor E_F lowered by q\\|V\\| |\n| Band bending | qV_bi | q(V_bi − V), smaller | q(V_bi + \\|V\\|), larger |\n| Depletion width | W₀ = √(2ε_sV_bi/qN_D) | Narrower | Wider |\n| Electrons semiconductor → metal | Balanced by metal → semiconductor | Increase by e^{qV/kT} | Suppressed |\n| Electrons metal → semiconductor | Small, over Φ_B | Unchanged (Φ_B fixed) | Unchanged: this is the saturation current |\n| Net current | 0 | J_s(e^{qV/ηkT} − 1), large | ≈ −J_s, small |\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 670 205\" role=\"img\" aria-label=\"Metal on n-type silicon in equilibrium, forward and reverse bias: the barrier from the metal stays fixed while the semiconductor band bending shrinks under forward bias and grows under reverse bias\" style=\"width:670px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"115.0\" y=\"18.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Equilibrium</text><rect x=\"10.0\" y=\"120.0\" width=\"50.0\" height=\"40.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"60.0\" y1=\"32.0\" x2=\"60.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.3\" opacity=\"1.0\"/><line x1=\"10.0\" y1 122.0 620.0,122.0 624.0,122.0 628.0,122.0 632.0,122.0 636.0,122.0 640.0,122.0\" style=\"fill:none;stroke:currentColor\" fill-opacity=\"1.0\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-linejoin=\"round\"/><polyline points=\"500.0,120.0 504.0,133.8 508.0,146.0 512.0,156.5 516.0,165.3 520.0,172.4 524.0,177.8 528.0,181.5 532.0,183.6 536.0,184.0 540.0,184.0 544.0,184.0 548.0,184.0 552.0,184.0 556.0,184.0 560.0,184.0 564.0,184.0 568.0,184.0 572.0,184.0 576.0,184.0 580.0,184.0 584.0,184.0 588.0,184.0 592.0,184.0 596.0,184.0 600.0,184.0 604.0,184.0 608.0,184.0 612.0,184.0 616.0,184.0 620.0,184.0 624.0,184.0 628.0,184.0 632.0,184.0 636.0,184.0 640.0,184.0\" style=\"fill:none;stroke:currentColor\" fill-opacity=\"1.0\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-linejoin=\"round\"/><line x1=\"508.0\" y1=\"120.0\" x2=\"508.0\" y2=\"61.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" opacity=\"1.0\" marker-end=\"url(#art)\"/><text x=\"496.0\" y=\"93.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">qΦ<tspan dy=\"0.32em\" font-size=\"72%\">B</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"634.0\" y1=\"120.0\" x2=\"634.0\" y2=\"142.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.8\" marker-end=\"url(#ar)\"/><line x1=\"500.0\" y1=\"120.0\" x2=\"640.0\" y2=\"120.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"0.8\" opacity=\"1.0\" stroke-dasharray=\"2 3\"/><text x=\"642.0\" y=\"136.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">qV</text><text x=\"570.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">wider: q(V<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan> + |V|)</text></svg><figcaption>The same Schottky contact in equilibrium, forward bias and reverse bias. The barrier from the metal (qΦ<sub>B</sub>) stays fixed. Forward bias shrinks the semiconductor-side barrier to q(V<sub>bi</sub> − V); reverse bias raises it to q(V<sub>bi</sub> + |V|).</figcaption></figure>\n```\n\n> **In plain words.** The metal side of the hill never changes height. Forward bias lowers the semiconductor side of the hill, so a flood of electrons pours over it into the metal. Reverse bias raises the semiconductor side, stopping that flow, and only the small trickle from the metal side remains.\n\n## Ohmic contacts\n\nAn **Ohmic contact** has a straight-line, symmetric I-V characteristic (it obeys Ohm's law) and a resistance negligible compared with the device. Current passes freely in both directions.\n\nThere are two ways to make one.\n\n**1. Choose a low-barrier metal.** For n-type, use a metal with Φ_m < Φ_s. Now electrons flow from the **metal into the semiconductor** on contact, piling up an **accumulation layer** instead of a depletion layer. The bands bend **downward**, and there is no barrier for electrons in either direction. In practice Fermi-level pinning makes suitable metals rare for Si and GaAs, so the second method is used.\n\n**2. Dope heavily so that electrons tunnel (the practical method).** Dope the semiconductor very heavily just under the contact (n⁺ or p⁺, above about 10¹⁹ cm⁻³). A barrier still exists, but the depletion width W = √(2ε_sV_bi/qN_D) shrinks to a few nanometres. A barrier that thin is no obstacle: electrons **tunnel** straight through it in both directions (quantum tunnelling, called field emission).\n\n> **In plain words.** A wall that is high but paper-thin is no barrier to a quantum particle: it goes straight through. Heavy doping makes the barrier paper-thin.\n\nThe quality of an Ohmic contact is measured by its **specific contact resistance** ρ_c (Ω·cm²), which falls very steeply as the doping increases. Good contacts have ρ_c ≈ 10⁻⁶–10⁻⁸ Ω·cm². Common choices: aluminium or a silicide (TiSi₂, CoSi₂, NiSi) on n⁺ or p⁺ silicon; an alloyed Au–Ge–Ni contact on n-GaAs.\n\n## Stability of contacts\n\nContacts must keep working through hot processing steps and years of operation:\n\n- **Aluminium spiking:** silicon dissolves into aluminium and aluminium spikes into the silicon, which can short out a shallow junction. Prevented by adding 1 % Si to the Al, or by a barrier layer (TiN, TiW).\n- **Electromigration:** at high current density the flowing electrons gradually push metal atoms along, forming voids and breaks. Reduced by Al–Cu alloys or copper wiring.\n- **Interdiffusion and chemical reaction** at high temperature change the barrier height; silicides are used because they form a clean, stable interface.\n- **Contamination and native oxide** at the interface raise ρ_c and change Φ_B.\n\n## Key points of Week 11\n\n- Φ_s = χ + (E_c − E_F). Metal on n-type with Φ_m > Φ_s → Schottky barrier; Φ_m < Φ_s (or heavy doping) → Ohmic.\n- Schottky: depletion region, bands bend up, Φ_B = Φ_m − χ (ideally), V_bi = Φ_m − Φ_s.\n- Current by thermionic emission of majority carriers: J = A∗∗T²e^{−qΦ_B/kT}(e^{qV/kT} − 1). Fast, low turn-on voltage, higher leakage.\n- Under bias, qΦ_B is fixed; only the semiconductor-side barrier changes.\n- Ohmic contacts: accumulation (low barrier) or tunnelling through a thin barrier made by heavy doping (n⁺, p⁺).\n\n---\n\n## Examination question solved (Q49)\n\n### Q49. Differentiate between a Schottky barrier diode and an Ohmic contact. Explain their energy-band characteristics.\n\nBoth are metal–semiconductor junctions. The difference is whether a significant potential barrier to majority-carrier flow exists at the interface.\n\n**Schottky barrier diode (rectifying contact).**\n\n*Condition:* n-type semiconductor with Φ_m > Φ_s (or p-type with Φ_m < Φ_s), moderate doping (≤ 10¹⁷ cm⁻³).\n\n*Energy-band characteristics:*\n\n1. Before contact, E_F in the n-semiconductor lies above E_F in the metal by Φ_m − Φ_s.\n2. On contact, electrons flow from semiconductor to metal until the Fermi levels align. A **depletion region** of ionised donors forms in the semiconductor and the bands bend **upward** at the interface.\n3. A barrier of height **qΦ_B = q(Φ_m − χ)** opposes electron flow from metal to semiconductor; a built-in barrier **qV_bi = q(Φ_m − Φ_s)** opposes flow from semiconductor to metal. (In practice Φ_B is fixed by Fermi-level pinning, e.g. ≈ 0.8 eV for Au on n-Si.)\n4. Forward bias (metal positive) lowers the semiconductor-side barrier to V_bi − V, and electrons are thermionically emitted into the metal: current rises exponentially. Reverse bias raises it to V_bi + |V| while Φ_B stays the same, so only a small saturation current flows.\n\n*I-V:* rectifying, J = A∗∗T²e^{−qΦ_B/kT}[e^{qV/ηkT} − 1].\n\n*Features:* majority-carrier device, negligible minority storage, very fast switching, low forward drop (0.2–0.4 V on Si), higher leakage than a p-n diode.\n\n**Ohmic contact.**\n\n*Condition:* either n-type with Φ_m < Φ_s (p-type with Φ_m > Φ_s), or, in practice, any metal on a **very heavily doped** (n⁺ or p⁺, > 10¹⁹ cm⁻³) surface layer.\n\n*Energy-band characteristics:*\n\n1. **Low-barrier case:** electrons flow from the metal into the semiconductor on contact, forming an **accumulation layer**; the bands bend **downward**. There is no barrier for electrons in either direction.\n2. **Tunnelling case:** a barrier exists, but heavy doping makes the depletion region only a few nanometres thick (W ∝ 1/√N_D). Electrons **tunnel** through it freely in both directions (field emission).\n\n*I-V:* linear and symmetric, V = IR_c, with very low specific contact resistance (ρ_c ≈ 10⁻⁶–10⁻⁸ Ω·cm²).\n\n| Feature | Schottky barrier | Ohmic contact |\n|---|---|---|\n| Work-function condition (n-type) | Φ_m > Φ_s | Φ_m < Φ_s (or heavy doping) |\n| Semiconductor doping | Moderate (10¹⁵–10¹⁷ cm⁻³) | Heavy (> 10¹⁹ cm⁻³) |\n| Band bending at interface (n-type) | Upward, depletion layer | Downward (accumulation) or very thin barrier |\n| Barrier to majority carriers | Yes, qΦ_B and qV_bi | None, or transparent to tunnelling |\n| Conduction m
