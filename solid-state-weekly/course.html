 x1=\"230.0\" y1=\"120.0\" x2=\"280.0\" y2=\"120.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-dasharray=\"5 3\"/><line x1=\"280.0\" y1=\"98.0\" x2=\"420.0\" y2=\"98.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-dasharray=\"5 3\"/><polyline points=\"280.0,58.0 284.0,61.9 288.0,65.3 292.0,68.3 296.0,70.7 300.0,72.7 304.0,74.3 308.0,75.3 312.0,75.9 316.0,76.0 320.0,76.0 324.0,76.0 328.0,76.0 332.0,76.0 336.0,76.0 340.0,76.0 344.0,76.0 348.0,76.0 352.0,76.0 356.0,76.0 360.0,76.0 364.0,76.0 368.0,76.0 372.0,76.0 376.0,76.0 380.0,76.0 384.0,76.0 388.0,76.0 392.0,76.0 396.0,76.0 400.0,76.0 404.0,76.0 408.0,76.0 412.0,76.0 416.0,76.0 420.0,76.0\" style=\"fill:none;stroke:currentColor\" fill-opacity=\"1.0\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-linejoin=\"round\"/><polyline points=\"280.0,120.0 284.0,123.9 288.0,127.3 292.0,130.3 296.0,132.7 300.0,134.7 304.0,136.3 308.0,137.3 312.0,137.9 316.0,138.0 320.0,138.0 324.0,138.0 328.0,138.0 332.0,138.0 336.0,138.0 340.0,138.0 344.0,138.0 348.0,138.0 352.0,138.0 356.0,138.0 360.0,138.0 364.0,138.0 368.0,138.0 372.0,138.0 376.0,138.0 380.0,138.0 384.0,138.0 388.0,138.0 392.0,138.0 396.0,138.0 400.0,138.0 404.0,138.0 408.0,138.0 412.0,138.0 416.0,138.0 420.0,138.0\" style=\"fill:none;stroke:currentColor\" fill-opacity=\"1.0\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-linejoin=\"round\"/><line x1=\"288.0\" y1=\"120.0\" x2=\"288.0\" y2=\"61.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" opacity=\"1.0\" marker-end=\"url(#art)\"/><text x=\"276.0\" y=\"93.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">qΦ<tspan dy=\"0.32em\" font-size=\"72%\">B</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"414.0\" y1=\"120.0\" x2=\"414.0\" y2=\"100.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.8\" marker-end=\"url(#ar)\"/><line x1=\"280.0\" y1=\"120.0\" x2=\"420.0\" y2=\"120.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"0.8\" opacity=\"1.0\" stroke-dasharray=\"2 3\"/><text x=\"422.0\" y=\"113.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">qV</text><text x=\"350.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">narrower: q(V<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan> − V)</text><text x=\"555.0\" y=\"18.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Reverse bias</text><rect x=\"450.0\" y=\"120.0\" width=\"50.0\" height=\"40.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:none\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"500.0\" y1=\"32.0\" x2=\"500.0\" y2=\"170.0\" style=\"stroke:currentColor\" stroke-width=\"1.3\" opacity=\"1.0\"/><line x1=\"450.0\" y1=\"120.0\" x2=\"500.0\" y2=\"120.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-dasharray=\"5 3\"/><line x1=\"500.0\" y1=\"144.0\" x2=\"640.0\" y2=\"144.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-dasharray=\"5 3\"/><polyline points=\"500.0,58.0 504.0,71.8 508.0,84.0 512.0,94.5 516.0,103.3 520.0,110.4 524.0,115.8 528.0,119.5 532.0,121.6 536.0,122.0 540.0,122.0 544.0,122.0 548.0,122.0 552.0,122.0 556.0,122.0 560.0,122.0 564.0,122.0 568.0,122.0 572.0,122.0 576.0,122.0 580.0,122.0 584.0,122.0 588.0,122.0 592.0,122.0 596.0,122.0 600.0,122.0 604.0,122.0 608.0,122.0 612.0,122.0 616.0,122.0 620.0,122.0 624.0,122.0 628.0,122.0 632.0,122.0 636.0,122.0 640.0,122.0\" style=\"fill:none;stroke:currentColor\" fill-opacity=\"1.0\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-linejoin=\"round\"/><polyline points=\"500.0,120.0 504.0,133.8 508.0,146.0 512.0,156.5 516.0,165.3 520.0,172.4 524.0,177.8 528.0,181.5 532.0,183.6 536.0,184.0 540.0,184.0 544.0,184.0 548.0,184.0 552.0,184.0 556.0,184.0 560.0,184.0 564.0,184.0 568.0,184.0 572.0,184.0 576.0,184.0 580.0,184.0 584.0,184.0 588.0,184.0 592.0,184.0 596.0,184.0 600.0,184.0 604.0,184.0 608.0,184.0 612.0,184.0 616.0,184.0 620.0,184.0 624.0,184.0 628.0,184.0 632.0,184.0 636.0,184.0 640.0,184.0\" style=\"fill:none;stroke:currentColor\" fill-opacity=\"1.0\" stroke-width=\"1.8\" opacity=\"1.0\" stroke-linejoin=\"round\"/><line x1=\"508.0\" y1=\"120.0\" x2=\"508.0\" y2=\"61.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" opacity=\"1.0\" marker-end=\"url(#art)\"/><text x=\"496.0\" y=\"93.0\" text-anchor=\"end\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">qΦ<tspan dy=\"0.32em\" font-size=\"72%\">B</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"634.0\" y1=\"120.0\" x2=\"634.0\" y2=\"142.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.8\" marker-end=\"url(#ar)\"/><line x1=\"500.0\" y1=\"120.0\" x2=\"640.0\" y2=\"120.0\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"0.8\" opacity=\"1.0\" stroke-dasharray=\"2 3\"/><text x=\"642.0\" y=\"136.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">qV</text><text x=\"570.0\" y=\"196.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">wider: q(V<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan> + |V|)</text></svg><figcaption>Schottky contact on n-type silicon in equilibrium, forward bias and reverse bias. The barrier seen from the metal (qΦ<sub>B</sub>) never changes; the band bending in the semiconductor shrinks to q(V<sub>bi</sub> − V) under forward bias and grows under reverse bias.</figcaption></figure>\n```\n\nFor an **Ohmic** contact the same diagrams show either no barrier at all (accumulation) or a barrier so thin that electrons tunnel through in both directions, so bias simply drops across the bulk resistance and I ∝ V.\n\n## Ohmic contacts\n\nAn **Ohmic contact** has a linear, symmetric I-V characteristic and a resistance that is negligible compared with the device. It supplies current in either direction without limiting it.\n\nTwo ways to make one:\n\n1. **Low barrier** (Φ_m < Φ_s for n-type, or Φ_m > Φ_s for p-type). Electrons flow from metal to semiconductor on contact, forming an **accumulation** layer instead of a depletion layer. There is no barrier to majority-carrier flow. In practice, pinning makes such low-barrier metals rare for Si and GaAs.\n2. **Tunnelling contact** (the practical method). Dope the semiconductor very heavily under the contact (n⁺ or p⁺, above about 10¹⁹ cm⁻³). The depletion width W = √(2ε_sV_bi/qN_D) becomes only a few nanometres, so electrons **tunnel** straight through the barrier (field emission) in both directions, whatever its height.\n\nQuality is measured by the **specific contact resistance** ρ_c (Ω·cm²). For tunnelling contacts it falls exponentially with doping:\n\n    ρ_c ∝ exp( (2√(ε_s m∗)/ħ) · Φ_B / √N_D )\n\nGood contacts reach ρ_c ≈ 10⁻⁶–10⁻⁸ Ω·cm². Common choices: Al or silicides (TiSi₂, CoSi₂, NiSi) on n⁺/p⁺ Si; alloyed Au–Ge–Ni on n-GaAs. Contact resistance is measured with the transmission-line (TLM) method.\n\n## Stability of contacts\n\nContacts must stay stable through processing and operation:\n\n- **Al spiking:** Si dissolves into Al and Al penetrates into Si, shorting shallow junctions. Prevented by Al–1%Si alloy or barrier layers (TiN, TiW).\n- **Electromigration:** high current densities move metal atoms, causing voids and open circuits. Reduced by Al–Cu alloys or Cu metallisation.\n- **Interdiffusion and reaction** at high temperature change the barrier height; silicides are used because they form a clean, stable interface.\n- **Interface contamination** and native oxide raise ρ_c and change Φ_B.\n\n---\n\n## Examination question solved (Q49)\n\n### Q49. Differentiate between a Schottky barrier diode and an Ohmic contact. Explain their energy-band characteristics.\n\nBoth are metal–semiconductor junctions. The difference is whether a significant potential barrier to majority-carrier flow exists at the interface.\n\n**Schottky barrier diode (rectifying contact).**\n\n*Condition:* n-type semiconductor with Φ_m > Φ_s (or p-type with Φ_m < Φ_s), moderate doping (≤ 10¹⁷ cm⁻³).\n\n*Energy-band characteristics:*\n\n1. Before contact, E_F in the n-semiconductor lies above E_F in the metal by Φ_m − Φ_s.\n2. On contact, electrons flow from semiconductor to metal until the Fermi levels align. A **depletion region** of ionised donors forms in the semiconductor and the bands bend **upward** at the interface.\n3. A barrier of height **qΦ_B = q(Φ_m − χ)** opposes electron flow from metal to semiconductor; a built-in barrier **qV_bi = q(Φ_m − Φ_s)** opposes flow from semiconductor to metal. (In practice Φ_B is fixed by Fermi-level pinning, e.g. ≈ 0.8 eV for Au on n-Si.)\n4. Forward bias (metal positive) lowers the semiconductor-side barrier to V_bi − V, and electrons are thermionically emitted into the metal: current rises exponentially. Reverse bias raises it to V_bi + |V| while Φ_B stays the same, so only a small saturation current flows.\n\n*I-V:* rectifying, J = A∗∗T²e^{−qΦ_B/kT}[e^{qV/ηkT} − 1].\n\n*Features:* majority-carrier device, negligible minority storage, very fast switching, low forward drop (0.2–0.4 V on Si), higher leakage than a p-n diode.\n\n**Ohmic contact.**\n\n*Condition:* either n-type with Φ_m < Φ_s (p-type with Φ_m > Φ_s), or, in practice, any metal on a **very heavily doped** (n⁺ or p⁺, > 10¹⁹ cm⁻³) surface layer.\n\n*Energy-band characteristics:*\n\n1. **Low-barrier case:** electrons flow from the metal into the semiconductor on contact, forming an **accumulation layer**; the bands bend **downward**. There is no barrier for electrons in either direction.\n2. **Tunnelling case:** a barrier exists, but heavy doping makes the depletion region only a few nanometres thick (W ∝ 1/√N_D). Electrons **tunnel** through it freely in both directions (field emission).\n\n*I-V:* linear and symmetric, V = IR_c, with very low specific contact resistance (ρ_c ≈ 10⁻⁶–10⁻⁸ Ω·cm²).\n\n| Feature | Schottky barrier | Ohmic contact |\n|---|---|---|\n| Work-function condition (n-type) | Φ_m > Φ_s | Φ_m < Φ_s (or heavy doping) |\n| Semiconductor doping | Moderate (10¹⁵–10¹⁷ cm⁻³) | Heavy (> 10¹⁹ cm⁻³) |\n| Band bending at interface (n-type) | Upward, depletion layer | Downward (accumulation) or very thin barrier |\n| Barrier to majority carriers | Yes, qΦ_B and qV_bi | None, or transparent to tunnelling |\n| Conduction mechanism | Thermionic emission | Free flow or field-emission tunnelling |\n| I-V characteristic | Rectifying, exponential | Linear, symmetric |\n| Resistance | Depends on bias and polarity | Small, constant |\n| Purpose | Fast rectifier, detector, MESFET gate | Connecting devices to the circuit |\n| Examples | Au, Pt, W, PtSi on n-Si; Ti/Au on n-GaAs | Al or silicide on n⁺/p⁺ Si; Au–Ge–Ni on n⁺-GaAs |\n", "group": "Module 4 · Junctions, Interfaces & Characterisation", "eyebrow": "Week 11", "disp": "11"}, {"num": "12", "title": "Interface Characterisation and CAT 2", "body": "\n**Plan:** methods of characterisation (capacitance–voltage C-V profiling, current–voltage I-V analysis); Continuous Assessment Test 2.\n\n## I-V characterisation\n\n**Set-up.** A source-measure unit (SMU) or semiconductor parameter analyser applies a stepped voltage and measures current (pA to A), usually on a probe station, often at several temperatures.\n\n**What is extracted from a diode:**\n\nPlot ln I against V (semi-log). For the ideal or near-ideal diode\n\n    I = I_s [ exp(qV/ηkT) − 1 ]  ⇒  ln I ≈ ln I_s + qV/(ηkT)\n\n- **Saturation current I_s:** the intercept at V = 0 of the straight-line region.\n- **Ideality factor η:** from the slope, η = (q/kT) / (d ln I/dV). η ≈ 1 means diffusion current; η ≈ 2 means depletion-region recombination dominates.\n- **Series resistance R_s:** from the bending at high current, where V = V_j + IR_s.\n- **Reverse leakage and breakdown voltage V_BR** from the reverse characteristic.\n- **Schottky barrier height** from I_s: Φ_B = (kT/q) ln(A∗∗T²/J_s). With temperature-dependent data, an **Arrhenius plot** of ln(J_s/T²) versus 1/T has slope −qΦ_B/k.\n- **Ohmic contact check:** the I-V of two contacts should be linear and symmetric. Contact resistance is extracted by the transmission-line method (TLM).\n\n**Other I-V tests:** MOSFET output (I_D–V_DS) and transfer (I_D–V_GS) curves give threshold voltage, transconductance and mobility; BJT Gummel plots give current gain; four-point probe gives sheet resistance; Hall measurements give carrier type, density and mobility.\n\n## C-V characterisation\n\n**Set-up.** A small AC voltage (10–50 mV, 10 kHz – 1 MHz) is superimposed on a DC bias V, and an LCR meter measures the small-signal capacitance C = dQ/dV as the DC bias is swept, usually in reverse.\n\n**Theory.** A reverse-biased junction (p⁺n or Schottky) behaves as a parallel-plate capacitor whose plate separation is the depletion width:\n\n    C = ε_s A / W,     W = √( 2ε_s (V_bi − V) / qN )\n\nso\n\n    C = A √( qε_s N / 2(V_bi − V) )\n\nSquaring and inverting:\n\n    1/C² = 2(V_bi − V) / (q ε_s N A²)\n\nFor uniform doping, **1/C² is a straight line against V**:\n\n- **Slope:** d(1/C²)/dV = −2/(qε_s N A²), so\n\n    N = 2 / ( q ε_s A² · |d(1/C²)/dV| )\n\n- **Intercept on the voltage axis** (1/C² = 0) gives V = V_bi. For a Schottky diode, Φ_B = V_bi + (kT/q) ln(N_c/N_D) + kT/q.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 540 210\" role=\"img\" aria-label=\"1 over C squared against bias is a straight line whose slope gives the doping and whose voltage intercept gives the built-in potential\" style=\"width:540px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"70.0\" y1=\"184.0\" x2=\"464.0\" y2=\"184.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><line x1=\"388.8\" y1=\"184.0\" x2=\"388.8\" y2=\"30.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\" marker-end=\"url(#ar)\"/><text x=\"474.0\" y=\"188.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">V (V)</text><text x=\"393.8\" y=\"26.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor\">1/C²</text><line x1=\"99.0\" y1=\"180.0\" x2=\"99.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"99.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-5</text><line x1=\"157.0\" y1=\"180.0\" x2=\"157.0\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"157.0\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-4</text><line x1=\"214.9\" y1=\"180.0\" x2=\"214.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"214.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-3</text><line x1=\"272.9\" y1=\"180.0\" x2=\"272.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"272.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-2</text><line x1=\"330.9\" y1=\"180.0\" x2=\"330.9\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"330.9\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">-1</text><line x1=\"446.8\" y1=\"180.0\" x2=\"446.8\" y2=\"188.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\".55\"/><text x=\"446.8\" y=\"199.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">1</text><polyline points=\"99.0,52.6 423.6,184.0\" fill=\"none\" style=\"stroke:var(--copper,#B4622F)\" stroke-width=\"2.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><circle cx=\"99.0\" cy=\"52.6\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"157.0\" cy=\"76.1\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"214.9\" cy=\"99.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"272.9\" cy=\"123.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"330.9\" cy=\"146.5\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"388.8\" cy=\"169.9\" r=\"3.2\" style=\"fill:var(--copper,#B4622F)\"/><circle cx=\"423.6\" cy=\"184.0\" r=\"3.6\" style=\"fill:var(--teal,#1C6E7E)\"/><text x=\"429.6\" y=\"176.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">V<tspan dy=\"0.32em\" font-size=\"72%\">bi</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"259.7\" y=\"107.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">slope = −2/(qε<tspan dy=\"0.32em\" font-size=\"72%\">sNA</tspan><tspan dy=\"-0.32em\">​</tspan>²)</text><text x=\"81.6\" y=\"36.8\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">reverse bias</text></svg><figcaption>Mott–Schottky plot. For uniform doping 1/C² falls on a straight line; the slope gives the doping, the voltage-axis intercept gives the built-in potential.</figcaption></figure>\n```\n\n**Non-uniform doping: profiling.** If N varies with depth, the local slope gives the doping at the edge of the depletion region, and the capacitance gives where that edge is:\n\n    N(W) = 2 / ( q ε_s A² · d(1/C²)/dV ) = −C³ / ( q ε_s A² · dC/dV ),     W = ε_s A / C\n\nSweeping the reverse bias moves W deeper and maps out the **doping profile** N(x). This works for one-sided junctions (p⁺n, n⁺p) or Schottky diodes, where the depletion region lies in one side only.\n\n**Worked example.** A Si Schottky diode of area A = 1×10⁻³ cm² gives a straight 1/C² plot with slope −1.2×10²¹ F⁻²V⁻¹ and voltage intercept 0.60 V. Then:\n\n    N_D = 2 / (1.602×10⁻¹⁹ × 1.036×10⁻¹² × (10⁻³)² × 1.2×10²¹)\n        = 2 / (1.99×10⁻¹⁶) = 1.0×10¹⁶ cm⁻³\n\n    V_bi = 0.60 V\n\n    At V = −5 V:  C = A√(qε_sN_D/2(V_bi − V)) = 10⁻³ √(1.66×10⁻¹⁵/11.2) = 12.2 pF\n                  W = ε_sA/C = 1.036×10⁻¹⁵/12.2×10⁻¹² = 0.85 μm\n\n**MOS C-V.** On a MOS capacitor, C-V curves (accumulation, depletion, inversion) give the oxide thickness (C_ox = ε_oxA/t_ox), flat-band and threshold voltages, substrate doping, fixed oxide charge, mobile ions (bias–temperature stress shifts) and interface-trap density D_it (from high- and low-frequency curves). This is the main tool for monitoring gate-oxide quality and stability.\n\n**Precautions.** Use reverse bias (forward bias adds diffusion capacitance and conductance); subtract stray and pad capacitance; choose frequency so traps do not respond (or do, deliberately); include series resistance correction; keep the AC signal small; Debye-length limits resolution near abrupt doping steps.\n\n---\n\n## Examination question solved (Q50)\n\n### Q50. Explain the principles of I-V and C-V characterisation of semiconductor devices and describe how C-V measurements can be used to estimate doping concentration.\n\n**I-V characterisation: principle.** A known DC voltage is applied across the device (swept in steps from reverse to forward bias) and the resulting current is measured with a source-measure unit, usually on a probe station and sometimes at several temperatures. Comparing the measured curve with device theory gives the transport parameters.\n\nFor a diode, I = I_s[exp(qV/ηkT) − 1]. From a semi-log plot of ln I versus V:\n\n- the intercept gives the **saturation current I_s** (and, for Schottky diodes, the **barrier height** Φ_B = (kT/q) ln(AA∗∗T²/I_s));\n- the slope gives the **ideality factor** η (1 for ideal diffusion current, approaching 2 when depletion-region recombination dominates);\n- deviation at high current gives the **series resistance**;\n- the reverse branch gives **leakage current** and **breakdown voltage**;\n- for contacts, a linear symmetric I-V confirms an **Ohmic** contact and gives contact resistance.\n\nI-V curves of transistors give threshold voltage, transconductance, output resistance, mobility and current gain, and repeated I-V measurement after stress is used to test **stability and reliability**.\n\n**C-V characterisation: principle.** A reverse-biased p-n junction or Schottky barrier has a depletion region free of carriers between two conducting regions; it behaves like a parallel-plate capacitor with dielectric ε_s and plate separation W:\n\n    C = ε_s A / W\n\nThe DC reverse bias is swept, and the small-signal capacitance is measured with a small AC voltage (typically 1 MHz, a few tens of mV) using an LCR meter. Since W increases with reverse bias, C decreases.\n\n**Using C-V to estimate doping.** For a one-sided abrupt junction (p⁺n or Schottky on n-type) with uniform doping N:\n\n    W = √( 2ε_s(V_bi − V)/qN )   ⇒   C = A √( qε_sN / 2(V_bi − V) )\n\nRearranging:\n\n    1/C² = 2(V_bi − V) / (qε_s N A²)\n\n1. Measure C at a series of reverse biases V.\n2. Plot **1/C² against V** (the Mott–Schottky plot). For uniform doping it is a **straight line**.\n3. The **slope** is −2/(qε_sNA²), so the doping concentration is **N = 2/(qε_sA²·|slope|)**.\n4. The **intercept** on the V axis gives the built-in potential V_bi (and from it the Schottky barrier height).\n5. **For non-uniform doping**, use the local slope: N(W) = 2/(qε_sA² d(1/C²)/dV) evaluated at each bias, and the depth W = ε_sA/C. This gives the doping profile N(x) as a function of depth.\n\n**Example.** A diode of area 10⁻³ cm² on Si (ε_s = 1.036×10⁻¹² F/cm) gives a 1/C² slope magnitude of 1.2×10²¹ F⁻²V⁻¹:\n\n    N = 2 / (1.602×10⁻¹⁹ × 1.036×10⁻¹² × 10⁻⁶ × 1.2×10²¹) = 1.0×10¹⁶ cm⁻³\n\n**Advantages and limits.** C-V is non-destructive, fast and needs only a simple diode, but only measures the doping on the lightly doped side, only to depths reachable before breakdown, and with resolution limited by the Debye length. Accuracy requires a correct area, correction for stray capacitance and series resistance, and a frequency at which deep traps do not respond.\n\n---\n\n## CAT 2 practice test (60 minutes)\n\nCovers Weeks 7–12. Practice questions, not the actual CAT. Use q = 1.6×10⁻¹⁹ C, kT/q = 0.0259 V, Si: n_i = 1×10¹⁰ cm⁻³, ε_s = 1.04×10⁻¹² F/cm.\n\n1. An n-type Si bar (N_D = 10¹⁶ cm⁻³, μ_n = 1200 cm²/V·s) is 1 cm long with 10⁻³ cm² cross-section. Find its resistance and the current at 5 V.\n2. Find the hole diffusion coefficient in Si if μ_p = 450 cm²/V·s, and the diffusion length if τ_p = 2 μs.\n3. Holes injected into n-Si fall from 10¹⁴ cm⁻³ at x = 0 with L_p = 30 μm. Find the hole diffusion current density at x = 0 (D_p = 11.6 cm²/s).\n4. A Si p⁺n junction has N_D = 5×10¹⁵ cm⁻³ and N_A = 10¹⁸ cm⁻³. Find V_bi, the depletion width at zero bias and at −10 V, and the peak field at −10 V.\n5. The diode of Q4 has area 10⁻³ cm² and I_s = 1×10⁻¹⁴ A. Find the current at 0.6 V and the voltage for 1 mA.\n6. A Schottky diode on n-Si has Φ_B = 0.7 eV. Find J_s at 300 K (A∗∗ = 110 A/cm²K²) and the forward voltage for J = 10 A/cm².\n7. A 1/C² plot for a one-sided junction of area 2×10⁻³ cm² has slope magnitude 4.0×10²⁰ F⁻²V⁻¹. Find the doping.\n\n## CAT 2 solutions\n\n### 1. Resistance of a bar\n\n    σ = qN_Dμ_n = 1.6×10⁻¹⁹ × 10¹⁶ × 1200 = 1.92 S/cm,   ρ = 0.521 Ω·cm\n    R = ρL/A = 0.521 × 1 / 10⁻³ = 521 Ω\n    I = V/R = 5/521 = 9.6 mA\n\n### 2. Einstein relation and diffusion length\n\n    D_p = (kT/q)μ_p = 0.0259 × 450 = 11.7 cm²/s\n    L_p = √(D_pτ_p) = √(11.7 × 2×10⁻⁶) = 4.83×10⁻³ cm = 48 μm\n\n### 3. Diffusion current at the injection point\n\nΔp(x) = Δp(0)e^{−x/L_p}, so dp/dx at x = 0 is −Δp(0)/L_p.\n\n    J_p = −qD_p dp/dx = qD_pΔp(0)/L_p = 1.6×10⁻¹⁹ × 11.6 × 10¹⁴ / 3×10⁻³\n        = 0.062 A/cm²\n\n### 4. Junction parameters\n\n    V_bi = 0.0259 ln(10¹⁸ × 5×10¹⁵ / 10²⁰) = 0.0259 ln(5×10¹³) = 0.0259 × 31.54 = 0.817 V\n\nOne-sided (N_A ≫ N_D): W = √(2ε_s(V_bi − V)/qN_D).\n\n    V = 0:    W = √(2 × 1.04×10⁻¹² × 0.817 / (1.6×10⁻¹⁹ × 5×10¹⁵)) = √(2.12×10⁻⁹) = 4.6×10⁻⁵ cm = 0.46 μm\n    V = −10:  W = √(2 × 1.04×10⁻¹² × 10.817 / 8×10⁻⁴) = √(2.81×10⁻⁸) = 1.68×10⁻⁴ cm = 1.68 μm\n    E_max = 2(V_bi − V)/W = 2 × 10.817 / 1.68×10⁻⁴ = 1.29×10⁵ V/cm\n\n### 5. Diode current\n\n    I(0.6 V) = 10⁻¹⁴ (e^{0.6/0.0259} − 1) = 10⁻¹⁴ × 1.15×10¹⁰ = 0.115 mA\n    V(1 mA) = 0.0259 ln(10⁻³/10⁻¹⁴ + 1) = 0.0259 × 25.33 = 0.656 V\n\n### 6. Schottky diode\n\n    J_s = A∗∗T²e^{−qΦ_B/kT} = 110 × 9×10⁴ × e^{−0.7/0.0259} = 9.9×10⁶ × 1.82×10⁻¹² = 1.8×10⁻⁵ A/cm²\n    V = 0.0259 ln(10/1.8×10⁻⁵) = 0.0259 × 13.23 = 0.343 V\n\nA p-n diode needs about 0.7 V for a similar current density, which is why Schottky diodes are used where a low forward drop matters.\n\n### 7. Doping from C-V\n\n    N = 2/(qε_sA²|slope|) = 2 / (1.6×10⁻¹⁹ × 1.04×10⁻¹² × (2×10⁻³)² × 4.0×10²⁰)\n      = 2 / (2.66×10⁻¹⁶) = 7.5×10¹⁵ cm⁻³\n", "group": "Module 4 · Junctions, Interfaces & Characterisation", "eyebrow": "Week 12", "disp": "12"}, {"num": "13", "title": "Bipolar Junction Transistors (BJTs)", "body": "\n**Plan:** operational physics; minority-carrier profiles in the active regions; emitter efficiency, base transport factor and current gains (α, β).\n\nA BJT is two p-n junctions (Week 10) sharing one thin middle region. The physics is the minority-carrier diffusion of Weeks 7–9.\n\n## Structure\n\nAn **npn** transistor has a heavily doped n⁺ **emitter**, a thin, moderately doped p-type **base**, and a lightly doped n-type **collector**: N_E ≫ N_B > N_C. A pnp transistor reverses every type. The base width W_B is typically 0.05–1 μm, much shorter than the electron diffusion length L_n in the base (tens of μm).\n\n## Modes of operation\n\n| Mode | E–B junction | C–B junction | Use |\n|---|---|---|---|\n| Forward active | Forward | Reverse | Amplifier |\n| Saturation | Forward | Forward | Switch ON |\n| Cut-off | Reverse | Reverse | Switch OFF |\n| Reverse active | Reverse | Forward | Rarely used (poor gain) |\n\n## Operation in the forward-active mode (npn)\n\n1. The forward-biased E–B junction lowers its barrier. Electrons are **injected** from the emitter into the base, where they are minority carriers. At the base edge, by the law of the junction, n_p(0) = n_p0 e^{qV_BE/kT}.\n2. Because W_B ≪ L_n, almost every injected electron **diffuses across** the base without recombining.\n3. At the reverse-biased C–B junction the minority concentration is held at nearly zero, n_p(W_B) ≈ 0. The depletion field **sweeps** the arriving electrons into the collector. This is the collector current.\n4. At the same time the forward-biased E–B junction injects some **holes** from the base back into the emitter, and a few electrons **recombine** in the base. Both are supplied by the base current, which is small.\n\nThe collector current is controlled by V_BE but almost independent of V_CB: a small input (base current or V_BE) controls a large output current, which is amplification.\n\n## Minority-carrier profiles\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 232\" role=\"img\" aria-label=\"Minority carriers in an npn transistor in active mode: electrons fall linearly across the base to zero at the collector edge, and holes injected into the emitter decay away from the junction\" style=\"width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><rect x=\"40.0\" y=\"40.0\" width=\"160.0\" height=\"150.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:none\" stroke-width=\"1.2\" opacity=\"0.7\"/><rect x=\"200.0\" y=\"40.0\" width=\"130.0\" height=\"150.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"1.2\" opacity=\"0.7\"/><line x1=\"200.0\" y1=\"36.0\" x2=\"200.0\" y2=\"190.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><line x1=\"330.0\" y1=\"36.0\" x2=\"330.0\" y2=\"190.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" stroke-dasharray=\"3 3\"/><line x1=\"40.0\" y1=\"190.0\" x2=\"520.0\" y2=\"190.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\"/><text x=\"120.0\" y=\"30.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">emitter n⁺</text><text x=\"265.0\" y=\"30.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">base p</text><text x=\"425.0\" y=\"30.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">collector n</text><polyline points=\"200.0,60.0 330.0,188.0\" style=\"fill:none;stroke:var(--copper,#B4622F)\" fill-opacity=\"1.0\" stroke-width=\"2.4\" opacity=\"1.0\" stroke-linejoin=\"round\"/><text x=\"208.0\" y=\"58.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">n<tspan dy=\"0.32em\" font-size=\"72%\">p</tspan><tspan dy=\"-0.32em\">​</tspan>(0) = n<tspan dy=\"0.32em\" font-size=\"72%\">p0</tspan><tspan dy=\"-0.32em\">​</tspan> e<tspan dy=\"-0.45em\" font-size=\"72%\">qV<tspan dy=\"0.32em\" font-size=\"72%\">BE</tspan><tspan dy=\"-0.32em\">​</tspan>/kT</tspan><tspan dy=\"0.45em\">​</tspan></text><text x=\"290.0\" y=\"92.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">electrons diffuse;</text><text x=\"290.0\" y=\"105.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">slope sets I<tspan dy=\"0.32em\" font-size=\"72%\">C</tspan><tspan dy=\"-0.32em\">​</tspan></text><polyline points=\"200.0,120.0 196.0,126.0 192.0,131.4 188.0,136.4 184.0,140.9 180.0,145.1 176.0,148.9 172.0,152.4 168.0,155.6 164.0,158.5 160.0,161.2 156.0,163.7 152.0,165.9 148.0,168.0 144.0,169.8 140.0,171.5 136.0,173.1 132.0,174.6 128.0,175.9 124.0,177.1 120.0,178.2 116.0,179.2 112.0,180.1 108.0,180.9 104.0,181.7 100.0,182.4 96.0,183.1 92.0,183.6 88.0,184.2 84.0,184.7 80.0,185.1 76.0,185.5 72.0,185.9 68.0,186.3 64.0,186.6 60.0,186.9 56.0,187.1 52.0,187.4 48.0,187.6 44.0,187.8 40.0,188.0\" style=\"fill:none;stroke:var(--teal,#1C6E7E)\" fill-opacity=\"1.0\" stroke-width=\"2.2\" opacity=\"1.0\" stroke-linejoin=\"round\"/><text x=\"46.0\" y=\"116.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">holes injected</text><text x=\"46.0\" y=\"129.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--teal,#1C6E7E);\" opacity=\"1.0\">into emitter (I<tspan dy=\"0.32em\" font-size=\"72%\">pE</tspan><tspan dy=\"-0.32em\">​</tspan>)</text><polyline points=\"330.0,188.0 520.0,188.0\" style=\"fill:none;stroke:var(--teal,#1C6E7E)\" fill-opacity=\"1.0\" stroke-width=\"2\" opacity=\"1.0\" stroke-linejoin=\"round\" stroke-dasharray=\"4 3\"/><text x=\"340.0\" y=\"180.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">≈ 0 at the collector edge</text><text x=\"200.0\" y=\"206.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">0</text><text x=\"330.0\" y=\"206.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">W<tspan dy=\"0.32em\" font-size=\"72%\">B</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"280.0\" y=\"224.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.85\">E–B forward biased,  C–B reverse biased</text></svg><figcaption>Minority-carrier profiles in an npn transistor in forward-active mode. Electrons injected into the base fall almost linearly from n<sub>p</sub>(0) to zero at the collector edge; the slope sets the collector current. Holes injected into the emitter decay over the emitter.</figcaption></figure>\n```\n\n**Base.** The continuity equation in the base (Week 9), with W_B ≪ L_n, gives a nearly **linear** profile:\n\n    Δn_p(x) ≈ n_p0 (e^{qV_BE/kT} − 1)(1 − x/W_B)\n\nThe electron diffusion current is proportional to its slope:\n\n    I_C ≈ qA D_n n_p0 e^{qV_BE/kT} / W_B = (qA D_n n_i² / (N_B W_B)) e^{qV_BE/kT} = I_S e^{qV_BE/kT}\n\n**Emitter.** Holes injected into the emitter give the unwanted current\n\n    I_pE = (qA D_E n_i² / (N_E W_E)) (e^{qV_BE/kT} − 1)       (short emitter, W_E ≪ L_pE)\n\n**Collector.** Reverse-biased; only the small leakage I_CBO of minority carriers.\n\n## Current components\n\n    I_E = I_nE + I_pE               (electrons injected into base + holes injected into emitter)\n    I_C = I_nC + I_CBO ≈ I_nC       (electrons reaching the collector)\n    I_B = I_E − I_C = I_pE + (I_nE − I_nC) − I_CBO   (back-injection + base recombination)\n\n## Emitter injection efficiency γ\n\nThe fraction of emitter current carried by the useful carriers (electrons in an npn):\n\n    γ = I_nE / (I_nE + I_pE) = 1 / [ 1 + (D_E N_B W_B) / (D_B N_E W_E) ]\n\nTo make γ → 1, dope the emitter much more heavily than the base (N_E ≫ N_B). Heterojunction bipolar transistors (HBTs) use a wider-gap emitter to suppress I_pE further.\n\n## Base transport factor α_T\n\nThe fraction of injected electrons that survive the trip across the base:\n\n    α_T = I_nC / I_nE ≈ 1 − W_B² / (2L_n²)          (L_n = √(D_Bτ_n))\n\nTo make α_T → 1, make the base thin and the base lifetime long.\n\n## Current gains\n\n**Common-base gain α:**\n\n    α = I_C / I_E = γ α_T     (typically 0.98–0.998)\n\n**Common-emitter gain β:**\n\n    β = I_C / I_B = α / (1 − α)      ⇒      1/β ≈ (D_E N_B W_B)/(D_B N_E W_E) + W_B²/(2L_n²)\n\nSince α is close to 1, β is large (typically 50–500). Small changes in α make large changes in β: α = 0.99 gives β = 99; α = 0.995 gives β = 199.\n\nRelations: I_E = I_C + I_B; I_C = βI_B; I_C = αI_E; α = β/(β + 1).\n\n## Non-ideal effects\n\n- **Early effect (base-width modulation).** Increasing V_CE widens the C–B depletion region into the base, shortening W_B. The slope of n_p(x) steepens, so I_C rises with V_CE. Extrapolated output curves meet at −V_A (the Early voltage); output resistance r_o = V_A/I_C.\n- **High-level injection** at large I_C reduces β (the injected electrons approach N_B).\n- **Recombination in the E–B depletion region** reduces β at low current.\n- **Base resistance** and **emitter current crowding**.\n- **Breakdown:** avalanche at the C–B junction (BV_CBO) and punch-through when the C–B depletion region reaches the emitter.\n- **Base transit time** τ_B = W_B²/2D_n limits speed: f_T ≈ 1/(2πτ_B).\n\n## Worked example\n\nAn npn Si transistor: N_E = 10¹⁹ cm⁻³, N_B = 10¹⁷ cm⁻³, W_E = 1 μm, W_B = 0.5 μm, D_E (holes in emitter) = 2.5 cm²/s, D_B (electrons in base) = 25 cm²/s, τ_n = 1 μs, area A = 10⁻⁴ cm². Find γ, α_T, α, β, I_C at V_BE = 0.65 V, and the base transit time.\n\n    γ = 1 / [1 + (2.5 × 10¹⁷ × 0.5) / (25 × 10¹⁹ × 1)] = 1 / (1 + 5×10⁻⁴) = 0.99950\n\n    L_n = √(25 × 10⁻⁶) = 5×10⁻³ cm = 50 μm\n    α_T = 1 − (0.5)² / (2 × 50²) = 1 − 5×10⁻⁵ = 0.99995\n\n    α = γα_T = 0.99945,     β = α/(1 − α) = 0.99945/0.00055 ≈ 1800\n\n    I_S = qAD_Bn_i²/(N_BW_B) = (1.6×10⁻¹⁹)(10⁻⁴)(25)(10²⁰) / (10¹⁷ × 5×10⁻⁵) = 8×10⁻¹⁵ A\n    I_C = 8×10⁻¹⁵ × e^{0.65/0.0259} = 8×10⁻¹⁵ × 7.9×10¹⁰ = 0.63 mA,   I_B = I_C/β ≈ 0.35 μA\n\n    τ_B = W_B²/2D_B = (5×10⁻⁵)²/50 = 5×10⁻¹¹ s = 50 ps,   f_T ≲ 1/(2πτ_B) ≈ 3 GHz\n\nHere γ limits β (5×10⁻⁴ against 5×10⁻⁵). Real devices have lower β because of depletion-region recombination, band-gap narrowing in the heavily doped emitter and surface recombination.\n\n---\n\n## Practice questions solved\n\n### P1. Explain the operation of an npn transistor in the forward-active mode with the aid of minority-carrier profiles.\n\nWith the E–B junction forward biased and the C–B junction reverse biased, electrons are injected from the n⁺ emitter into the p base, raising the electron density at the emitter edge of the base to n_p0e^{qV_BE/kT}. The reverse-biased collector holds the electron density at the collector edge near zero. Because the base is much thinner than the electron diffusion length, the profile between these two values is nearly linear, and electrons diffuse down it to the collector with very little recombination. The collector current, I_C = qAD_nn_i²e^{qV_BE/kT}/(N_BW_B), is set by the slope of this line and so by V_BE, almost independent of V_CB. The base supplies only the holes injected back into the emitter (kept small by heavy emitter doping) and the holes lost to recombination in the base (kept small by the thin base), so I_B ≪ I_C and the device amplifies. (Sketch: the figure above.)\n\n### P2. Define emitter injection efficiency and base transport factor and show how they determine α and β.\n\nEmitter injection efficiency γ = I_nE/(I_nE + I_pE) is the fraction of emitter current carried by carriers injected into the base; γ = 1/[1 + D_EN_BW_B/(D_BN_EW_E)], so it approaches 1 when N_E ≫ N_B. Base transport factor α_T = I_nC/I_nE is the fraction of those carriers that reach the collector; α_T ≈ 1 − W_B²/2L_n², approaching 1 for a thin base and long lifetime. The common-base gain is their product, α = I_C/I_E = γα_T (ignoring collector multiplication), and the common-emitter gain is β = I_C/I_B = α/(1 − α). Since 1 − α ≈ (1 − γ) + (1 − α_T) is small, β ≈ 1/[(1 − γ) + (1 − α_T)] is large.\n\n### P3. A transistor has α = 0.992. Find β. If I_B = 20 μA, find I_C and I_E.\n\n    β = 0.992/(1 − 0.992) = 124\n    I_C = βI_B = 124 × 20 μA = 2.48 mA\n    I_E = I_C + I_B = 2.50 mA\n\n### P4. What is the Early effect and why is it a problem?\n\nIncreasing V_CB widens the collector–base depletion region, part of which extends into the base, so the neutral base width W_B decreases. The minority-carrier gradient in the base, and hence I_C ∝ 1/W_B, increases with V_CE, so the output characteristics slope upward instead of being flat. Extrapolated, they meet at V_CE = −V_A, the Early voltage. It gives the transistor a finite output resistance r_o = V_A/I_C, limiting the voltage gain of amplifiers (A_v ≤ g_mr_o = V_A/V_T). It also increases β with V_CE and, in the extreme, leads to punch-through. It is reduced by doping the base more heavily than the collector.\n", "group": "Module 5 · Advanced Device Technology", "eyebrow": "Week 13", "disp": "13"}, {"num": "14", "title": "Field-Effect Transistors (MOSFETs)", "body": "\n**Plan:** ideal MOS capacitor physics (accumulation, depletion, inversion); MOSFET threshold voltage; linear and saturation operating regions.\n\nThe MOSFET is the device in every digital IC. It uses the Si/SiO₂ interface (Week 1), band bending (Weeks 10–11) and drift in a surface channel (Week 7).\n\n## The ideal MOS capacitor\n\nA metal (or heavily doped polysilicon) **gate**, a thin **SiO₂** insulator of thickness t_ox, and a **p-type** silicon substrate (doping N_A). \"Ideal\" means: no oxide charge, no interface traps, zero metal–semiconductor work-function difference (Φ_ms = 0), and an oxide that conducts no current.\n\nThe oxide capacitance per unit area:\n\n    C_ox = ε_ox / t_ox,      ε_ox = 3.9ε₀ = 3.45×10⁻¹³ F/cm\n\nThe **bulk Fermi potential** of the substrate:\n\n    φ_F = (kT/q) ln(N_A/n_i)\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 700 210\" role=\"img\" aria-label=\"Ideal MOS capacitor on p-type silicon: bands bend up in accumulation, down in depletion, and far enough down in inversion that the surface becomes n-type\" style=\"width:700px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"110.0\" y=\"18.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">Accumulation (V<tspan dy=\"0.32em\" font-size=\"72%\">G</tspan><tspan dy=\"-0.32em\">​</tspan> &lt; 0)</text><rect x=\"10.0\" y=\"40.0\" width=\"40.0\" height=\"140.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:none\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"30.0\" y=\"192.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">gate</text><rect x=\"50.0\" y=\"34.0\" width=\"22.0\" height=\"152.0\" rx=\"0\" style=\ span><tspan dy=\"-0.32em\">​</tspan></text><text x=\"673.0\" y=\"116.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.75\">E<tspan dy=\"0.32em\" font-size=\"72%\">i</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"673.0\" y=\"136.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">F</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"673.0\" y=\"158.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">E<tspan dy=\"0.32em\" font-size=\"72%\">v</tspan><tspan dy=\"-0.32em\">​</tspan></text><text x=\"611.0\" y=\"200.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.85\">electrons at surface</text><circle cx=\"538.0\" cy=\"108.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"545.0\" cy=\"108.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"552.0\" cy=\"108.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/><circle cx=\"559.0\" cy=\"108.0\" r=\"3.2\" style=\"fill:currentColor;stroke:none\" stroke-width=\"1.2\"/></svg><figcaption>Band diagrams of an ideal MOS capacitor on p-type silicon. Accumulation: bands bend up and holes collect at the surface. Depletion: bands bend down and holes are pushed away. Inversion: the surface becomes n-type once the band bending reaches 2qφ<sub>F</sub>.</figcaption></figure>\n```\n\n### Accumulation (V_G < 0)\n\nA negative gate attracts **holes** to the surface. The bands bend **upward** at the surface, E_F moves closer to E_v there, and a thin hole accumulation layer forms. The capacitance is just the oxide: C = C_ox.\n\n### Depletion (0 < V_G < V_T)\n\nA positive gate repels holes, leaving a layer of negative acceptor ions of width W_d. The bands bend **downward** by the surface potential φ_s. The depletion capacitance C_d = ε_s/W_d is in series with C_ox, so C falls as V_G rises:\n\n    W_d = √(2ε_sφ_s / qN_A),     1/C = 1/C_ox + W_d/ε_s\n\n### Inversion (V_G > V_T)\n\nAs V_G increases further, the surface bends so far that E_i drops below E_F at the surface: the surface now has more electrons than holes and is **inverted** to n-type. **Strong inversion** is defined as the point where the surface is as n-type as the bulk is p-type:\n\n    φ_s = 2φ_F\n\nBeyond this the depletion width stops growing, at its maximum:\n\n    W_dmax = √(4ε_sφ_F / qN_A),     Q_dmax = −qN_AW_dmax\n\nExtra gate charge is balanced by electrons in the inversion layer, a sheet of charge Q_n = −C_ox(V_G − V_T). This layer is the MOSFET channel.\n\n### C-V curve\n\n| Region | Low frequency | High frequency (1 MHz) |\n|---|---|---|\n| Accumulation | C_ox | C_ox |\n| Depletion | Falls | Falls |\n| Inversion | Rises back to C_ox (inversion electrons follow the AC signal) | Stays at minimum C_min = C_ox C_dmin/(C_ox + C_dmin) |\n\nHigh- and low-frequency C-V curves give t_ox, N_A, V_FB, V_T and the interface-trap density (Week 12).\n\n## Threshold voltage\n\nThe gate voltage that brings the surface to strong inversion:\n\n    V_T = V_FB + 2φ_F + |Q_dmax| / C_ox = V_FB + 2φ_F + √(2qε_sN_A · 2φ_F) / C_ox\n\nwith the flat-band voltage (non-ideal MOS)\n\n    V_FB = Φ_ms − Q_f / C_ox\n\nΦ_ms is the gate–substrate work-function difference and Q_f the fixed oxide charge. V_T rises with substrate doping and oxide thickness. It is adjusted in manufacture by ion implantation into the channel (threshold-adjust implant, Week 3).\n\n**Body effect.** With a source-to-body voltage V_SB, the depletion charge grows:\n\n    V_T = V_T0 + γ_b ( √(2φ_F + V_SB) − √(2φ_F) ),     γ_b = √(2qε_sN_A) / C_ox\n\n## The MOSFET\n\nAn n-channel enhancement MOSFET adds n⁺ **source** and **drain** regions on either side of the gate, on a p-type body, with channel length L and width W. With V_GS < V_T there is no channel and no current (two back-to-back p-n junctions). With V_GS > V_T an inversion channel connects source and drain.\n\n### Linear (triode) region: V_DS < V_GS − V_T\n\nGradual-channel approximation: at a point y along the channel the inversion charge is Q_n(y) = −C_ox(V_GS − V_T − V(y)). The drift current I_D = W μ_n |Q_n| dV/dy, integrated from source (V = 0) to drain (V = V_DS):\n\n    I_D = μ_nC_ox (W/L) [ (V_GS − V_T)V_DS − V_DS²/2 ]\n\nFor small V_DS the channel is a voltage-controlled resistor: I_D ≈ μ_nC_ox(W/L)(V_GS − V_T)V_DS.\n\n### Saturation region: V_DS ≥ V_GS − V_T\n\nWhen V_DS = V_GS − V_T the inversion charge at the drain end falls to zero: the channel is **pinched off**. Further V_DS drops across the short pinched-off region, and the current stays nearly constant:\n\n    I_D(sat) = (μ_nC_ox/2)(W/L)(V_GS − V_T)²,     V_DS(sat) = V_GS − V_T\n\nWith **channel-length modulation**, I_D = I_D(sat)(1 + λV_DS).\n\n### Transconductance\n\n    g_m = ∂I_D/∂V_GS = μ_nC_ox (W/L)(V_GS − V_T)     (saturation)\n    g_m = μ_nC_ox (W/L) V_DS                          (linear)\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 600 225\" role=\"img\" aria-label=\"n-channel MOSFET output curves for four gate voltages, rising linearly at low drain voltage and saturating beyond V_DS equal to V_GS minus V_T\" style=\"width:600px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" styl 9.9 252.4,106.9 255.6,103.8 258.8,100.7 262.0,97.5 265.2,94.3 268.4,91.0 271.6,87.6 274.8,84.2 277.9,80.7 281.1,77.2 284.3,73.7 287.5,70.1 290.7,66.4 293.9,62.7 297.1,58.9 300.3,55.0 303.5,51.2 306.7,47.2 309.9,43.2 313.1,39.2 316.3,35.1 319.5,30.9 322.7,26.7 325.9,22.4\" fill=\"none\" style=\"stroke:currentColor\" stroke-width=\"1.2\" stroke-linejoin=\"round\" stroke-linecap=\"round\" stroke-dasharray=\"4 3\"/><text x=\"243.2\" y=\"154.8\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">V<tspan dy=\"0.32em\" font-size=\"72%\">DS</tspan><tspan dy=\"-0.32em\">​</tspan> = V<tspan dy=\"0.32em\" font-size=\"72%\">GS</tspan><tspan dy=\"-0.32em\">​</tspan> − V<tspan dy=\"0.32em\" font-size=\"72%\">T</tspan><tspan dy=\"-0.32em\">​</tspan></text><line x1=\"240.6\" y1=\"150.8\" x2=\"222.2\" y2=\"136.5\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.6\"/><text x=\"142.2\" y=\"43.6\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.8\">linear</text><text x=\"358.8\" y=\"33.8\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.8\">saturation</text></svg><figcaption>Output characteristics of an n-channel MOSFET. The dashed curve V<sub>DS</sub> = V<sub>GS</sub> − V<sub>T</sub> separates the linear region from saturation.</figcaption></figure>\n```\n\n### Short-channel effects\n\nAs L shrinks below about 1 μm: velocity saturation makes I_D ∝ (V_GS − V_T) instead of the square (Week 8); V_T falls with L and with V_DS (drain-induced barrier lowering); hot carriers degrade the oxide (Week 8); subthreshold leakage grows. These shape modern CMOS design.\n\n## Worked example\n\nn-channel MOSFET: p-Si body N_A = 10¹⁷ cm⁻³, t_ox = 10 nm, n⁺-polysilicon gate, no oxide charge, channel mobility μ_n = 400 cm²/V·s, W/L = 10.\n\n    φ_F = 0.0259 ln(10¹⁷/10¹⁰) = 0.417 V\n    C_ox = 3.45×10⁻¹³ / 10⁻⁶ = 3.45×10⁻⁷ F/cm²\n    W_dmax = √(4 × 1.04×10⁻¹² × 0.417 / (1.6×10⁻¹⁹ × 10¹⁷)) = 1.04×10⁻⁵ cm = 0.104 μm\n    |Q_dmax| = qN_AW_dmax = 1.6×10⁻¹⁹ × 10¹⁷ × 1.04×10⁻⁵ = 1.66×10⁻⁷ C/cm²\n\nn⁺ poly gate on p-Si: Φ_ms ≈ −(E_g/2 + φ_F) = −(0.56 + 0.417) = −0.98 V, so V_FB = −0.98 V.\n\n    V_T = −0.98 + 2(0.417) + 1.66×10⁻⁷/3.45×10⁻⁷ = −0.98 + 0.834 + 0.482 = 0.34 V\n\nAt V_GS = 1.5 V (V_GS − V_T = 1.16 V), with k = μ_nC_ox(W/L) = 400 × 3.45×10⁻⁷ × 10 = 1.38×10⁻³ A/V²:\n\n    Linear, V_DS = 0.1 V:  I_D = 1.38×10⁻³ × (1.16 × 0.1 − 0.005) = 0.153 mA\n    Saturation:            I_D = ½ × 1.38×10⁻³ × 1.16² = 0.93 mA,   V_DS(sat) = 1.16 V\n    g_m(sat) = 1.38×10⁻³ × 1.16 = 1.6 mS\n\n---\n\n## Practice questions solved\n\n### P1. Explain accumulation, depletion and inversion in an ideal MOS capacitor on p-type silicon.\n\n**Accumulation** (V_G < V_FB = 0 for the ideal case): the negative gate charge attracts majority holes to the oxide interface. The bands bend upward at the surface, the hole density there exceeds N_A, and the capacitance equals C_ox. **Depletion** (0 < V_G < V_T): the positive gate charge repels holes, exposing a region of width W_d of negative acceptor ions. The bands bend downward by the surface potential φ_s < 2φ_F, and the depletion capacitance in series with C_ox lowers the total capacitance. **Inversion** (V_G > V_T): the downward bending makes E_i cross below E_F at the surface, so electrons (minority carriers in the bulk) become the majority at the surface. At φ_s = 2φ_F the surface electron density equals the bulk hole density (strong inversion); the depletion width saturates at W_dmax and further gate charge is balanced by the electron inversion layer, the channel of a MOSFET.\n\n### P2. Derive the expression for the threshold voltage of an n-channel MOSFET.\n\nAt threshold the surface potential is φ_s = 2φ_F and the depletion region has its maximum width W_dmax = √(2ε_s(2φ_F)/qN_A), holding charge Q_dmax = −qN_AW_dmax = −√(2qε_sN_A(2φ_F)). The inversion charge is still negligible. The gate voltage divides between the oxide and the silicon: V_G = V_FB + V_ox + φ_s. The oxide voltage is the charge it must support divided by its capacitance, V_ox = |Q_dmax|/C_ox. Therefore:\n\n    V_T = V_FB + 2φ_F + √(2qε_sN_A(2φ_F)) / C_ox,     V_FB = Φ_ms − Q_f/C_ox\n\n### P3. Distinguish between the linear and saturation regions of a MOSFET.\n\n| | Linear (triode) | Saturation |\n|---|---|---|\n| Condition | V_GS > V_T, V_DS < V_GS − V_T | V_GS > V_T, V_DS ≥ V_GS − V_T |\n| Channel | Continuous from source to drain | Pinched off near the drain |\n| I_D | μ_nC_ox(W/L)[(V_GS − V_T)V_DS − V_DS²/2] | (μ_nC_ox/2)(W/L)(V_GS − V_T)² |\n| Dependence on V_DS | Strong (≈ linear for small V_DS) | Weak (channel-length modulation only) |\n| Behaviour | Voltage-controlled resistor | Voltage-controlled current source |\n| Use | Switch ON state, analogue resistor | Amplifier |\n\n### P4. How are threshold voltage and channel mobility extracted from measurements?\n\nMeasure I_D against V_GS at a small V_DS (say 0.1 V) in the linear region. The curve is a straight line whose slope is the transconductance g_m = μ_nC_ox(W/L)V_DS, giving **μ_n = g_m L/(W C_ox V_DS)**. Extrapolating the line to I_D = 0 gives V_GS = V_T + V_DS/2, giving **V_T**. Alternatively plot √I_D against V_GS in saturation: the slope is √(μ_nC_oxW/2L) and the intercept is V_T. C_ox is found from the accumulation capacitance of a MOS capacitor (Week 12). See Laboratory Practical 4.\n", "group": "Module 5 · Advanced Device Technology", "eyebrow": "Week 14", "disp": "14"}, {"num": "15", "title": "Revision and Final Exam Preparation", "body": "\n**Plan:** overview of the entire curriculum, problem-solving clinic, and past-question review.\n\n## The course on one page\n\n| Module | Weeks | The one idea to carry into the exam |\n|---|---|---|\n| 1. Material physics and growth | 1–3 | A semiconductor's conductivity is controllable because of a moderate band gap and doping; crystals are grown pure and single by CZ and epitaxy, and doped by diffusion (erfc/Gaussian) or implantation (Gaussian at R_p). |\n| 2. Bands and statistics | 4–6 | n = N_c e^{−(E_c−E_F)/kT}, p = N_v e^{−(E_F−E_v)/kT}, np = n_i²; E_F moves 60 mV per decade of doping and back to mid-gap when hot. |\n| 3. Transport and injection | 7–9 | J = qnμE + qD dn/dx, D/μ = kT/q; excess minority carriers recombine with lifetime τ and diffuse a length L = √(Dτ). |\n| 4. Junctions and interfaces | 10–12 | V_bi = (kT/q)ln(N_AN_D/n_i²); I = I_s(e^{qV/kT} − 1); Schottky Φ_B = Φ_m − χ; 1/C² against V gives doping. |\n| 5. Devices | 13–15 | β = α/(1 − α) with α = γα_T; V_T = V_FB + 2φ_F + Q_dmax/C_ox; I_D(sat) = ½μC_ox(W/L)(V_GS − V_T)². |\n\n## Problem-solving clinic: how to answer\n\n1. **Definitions** carry 2–3 marks. State the definition in one sentence, then give an example and, where relevant, the formula.\n2. **\"Explain\" and \"describe\"** questions want mechanism, not just a list. Use the structure: what happens physically, then the equation, then the consequence.\n3. **Derivations:** list the assumptions first, number the steps, box the final result. Examiners mark the assumptions.\n4. **Calculations:** write the formula, substitute with units, give the answer to 2–3 significant figures with units. Check orders of magnitude: carrier densities 10⁴–10²⁰ cm⁻³, current densities mA/cm² to kA/cm², V_bi 0.5–1 V.\n5. **Comparisons:** use a table. Three to six rows is usually enough.\n6. **Diagrams** earn marks: band diagrams, minority-carrier profiles, CZ puller, MOS band bending.\n\n## Questions most likely to appear\n\nFrom the lecturer's revision list and the PGD paper, these topics recur and are worth rehearsing until they are automatic:\n\n- Conductor, semiconductor and insulator comparison; Si vs Ge vs GaAs table (Week 1).\n- Miller indices from intercepts, including ∞ and negative intercepts (Week 1).\n- Covalent bonding, electron–hole pairs, n-type and p-type (Week 1).\n- CZ growth: principle, steps, advantages and limitations; MG-Si to EG-Si (Week 2).\n- Fick's laws and the erfc profile; diffusion against implantation (Week 3).\n- Kronig–Penney and the origin of bands; direct and indirect gaps (Week 4).\n- Intrinsic carrier concentration derivation; Fermi–Dirac at 0 K; E_F against doping (Weeks 4–5).\n- Conductivity and drift current calculations; Einstein relation (Week 7).\n- SRH recombination and lifetime; continuity equation (Weeks 8–9).\n- Built-in potential and Shockley equation derivation (Week 10).\n- Schottky against Ohmic; C-V doping extraction (Weeks 11–12).\n- BJT α, β, γ, α_T; MOS accumulation, depletion, inversion and V_T (Weeks 13–14).\n\nThe next page is the one-line answer key for all 50 examination questions.\n\n## Formula sheet\n\n## Physical constants\n\n| Quantity | Symbol | Value |\n|---|---|---|\n| Electronic charge | q | 1.602×10⁻¹⁹ C |\n| Boltzmann constant | k | 1.381×10⁻²³ J/K = 8.617×10⁻⁵ eV/K |\n| Thermal energy at 300 K | kT | 0.0259 eV |\n| Thermal voltage at 300 K | kT/q | 0.0259 V (25.9 mV) |\n| Planck constant | h | 6.626×10⁻³⁴ J·s |\n| Reduced Planck constant | ħ | 1.055×10⁻³⁴ J·s |\n| Free electron mass | m₀ | 9.109×10⁻³¹ kg |\n| Permittivity of free space | ε₀ | 8.854×10⁻¹⁴ F/cm |\n| Speed of light | c | 3×10¹⁰ cm/s |\n| Electron-volt | 1 eV | 1.602×10⁻¹⁹ J |\n| Photon wavelength | λ | 1.24/E (μm, with E in eV) |\n\n## Material data at 300 K\n\n| | Si | Ge | GaAs |\n|---|---|---|---|\n| Crystal | Diamond | Diamond | Zinc blende |\n| Lattice constant a (Å) | 5.43 | 5.65 | 5.65 |\n| Atoms/cm³ | 5.0×10²² | 4.4×10²² | 4.4×10²² |\n| E_g (eV) | 1.12 (indirect) | 0.66 (indirect) | 1.42 (direct) |\n| n_i (cm⁻³) | 1×10¹⁰ | 2.4×10¹³ | 2×10⁶ |\n| N_c (cm⁻³) | 2.8×10¹⁹ | 1.04×10¹⁹ | 4.7×10¹⁷ |\n| N_v (cm⁻³) | 1.04×10¹⁹ | 6.0×10¹⁸ | 7.0×10¹⁸ |\n| μ_n (cm²/V·s) | 1350 | 3900 | 8500 |\n| μ_p (cm²/V·s) | 480 | 1900 | 400 |\n| D_n, D_p (cm²/s) | 35, 12.4 | 101, 49 | 220, 10 |\n| ε_r | 11.7 | 16.0 | 12.9 |\n| χ (eV) | 4.05 | 4.0 | 4.07 |\n| v_sat (cm/s) | 1×10⁷ | 6×10⁶ | ≈ 1×10⁷ (peak 2×10⁷) |\n| Melting point (°C) | 1414 | 937 | 1238 |\n\n## Crystals and Miller indices\n\n    Miller indices: intercepts → reciprocals → clear fractions → (h k l)\n    d_{hkl} = a / √(h² + k² + l²)      (cubic)\n    Diamond: 8 atoms/cell, coordination 4, r_nn = (√3/4)a, APF = 0.34\n    SC 1, BCC 2, FCC 4 atoms/cell;  APF 0.52, 0.68, 0.74\n\n## Growth and doping\n\n    SiO₂ + 2C → Si + 2CO;   Si + 3HCl → SiHCl₃ + H₂;   SiHCl₃ + H₂ → Si + 3HCl\n    Segregation: k₀ = C_s/C_l;   C_s = k₀C₀(1 − f)^{k₀ − 1}\n    Fick 1: F = −D ∂C/∂x;   Fick 2: ∂C/∂t = D ∂²C/∂x²;   D = D₀ e^{−E_a/kT}\n    Constant source: C = C_s erfc(x/2√(Dt));   Q = (2/√π)C_s√(Dt)\n    Limited source: C = (Q/√(πDt)) exp(−x²/4Dt)\n    Implant: N(x) = (Φ/√(2π)ΔR_p) exp(−(x − R_p)²/2ΔR_p²);   N_p ≈ 0.4Φ/ΔR_p;   Φ = It/qA\n\n## Bands and statistics\n\n    Schrödinger: −(ħ²/2m) d²ψ/dx² + Vψ = Eψ\n    Kronig–Penney: P sin(αa)/(αa) + cos(αa) = cos(ka)\n    1/m∗ = (1/ħ²) d²E/dk²\n    f(E) = 1/(1 + e^{(E − E_F)/kT})\n    g_c(E) = (4π(2m_n∗)^{3/2}/h³)√(E − E_c)\n    n = N_c e^{−(E_c − E_F)/kT};   p = N_v e^{−(E_F − E_v)/kT}\n    N_c = 2(2πm_n∗kT/h²)^{3/2}\n    n_i = √(N_cN_v) e^{−E_g/2kT};   np = n_i²\n    n = n_i e^{(E_F − E_i)/kT};   p = n_i e^{(E_i − E_F)/kT}\n    n = (N_D − N_A)/2 + √(((N_D − N_A)/2)² + n_i²)\n    E_F − E_i = kT ln(N_D/n_i);   E_i − E_F = kT ln(N_A/n_i)\n\n## Transport\n\n    v_d = μE;   μ = qτ_m/m∗;   1/μ = 1/μ_L + 1/μ_I\n    J_drift = q(nμ_n + pμ_p)E;   σ = q(nμ_n + pμ_p);   ρ = 1/σ\n    J_n = qnμ_nE + qD_n dn/dx;   J_p = qpμ_pE − qD_p dp/dx\n    Einstein: D/μ = kT/q\n    v_d = μE/[1 + (μE/v_sat)^β]^{1/β}\n\n## Recombination and continuity\n\n    SRH: U = (np − n_i²)/[τ_p(n + n₁) + τ_n(p + p₁)];   τ = 1/(σv_thN_t)\n    Low-level, n-type: U = Δp/τ_p;   Δp(t) = Δp(0)e^{−t/τ_p}\n    ∂Δp/∂t = D_p ∂²Δp/∂x² − μ_pE ∂Δp/∂x + G_L − Δp/τ_p\n    L = √(Dτ);   Δp(x) = Δp(0)e^{−x/L_p}\n    Surface: U_s = SΔp_s;   S = σv_thN_st;   1/τ_eff = 1/τ_b + 2S/W\n\n## Junctions and contacts\n\n    V_bi = (kT/q) ln(N_AN_D/n_i²)\n    W = √((2ε_s/q)(V_bi − V)(1/N_A + 1/N_D));   N_Ax_p = N_Dx_n;   E_max = qN_Dx_n/ε_s\n    I = I_s(e^{qV/kT} − 1);   J_s = qn_i²(D_p/(L_pN_D) + D_n/(L_nN_A))\n    C_j = ε_sA/W;   1/C² = 2(V_bi − V)/(qε_sNA²);   N = 2/(qε_sA²|d(1/C²)/dV|)\n    Schottky: Φ_B = Φ_m − χ;   V_bi = Φ_m − Φ_s;   J_s = A∗∗T²e^{−qΦ_B/kT}\n    Ohmic (tunnelling): N_D ≳ 10¹⁹ cm⁻³\n\n## Devices\n\n    BJT:  I_C = I_S e^{qV_BE/kT},   I_S = qAD_Bn_i²/(N_BW_B)\n          γ = 1/[1 + D_EN_BW_B/(D_BN_EW_E)],   α_T ≈ 1 − W_B²/2L_n²\n          α = γα_T,   β = α/(1 − α),   I_E = I_C + I_B,   τ_B = W_B²/2D_B\n    MOS:  C_ox = ε_ox/t_ox,   φ_F = (kT/q)ln(N_A/n_i),   W_dmax = √(4ε_sφ_F/qN_A)\n          V_T = V_FB + 2φ_F + √(4qε_sN_Aφ_F)/C_ox,   V_FB = Φ_ms − Q_f/C_ox\n          Linear: I_D = μC_ox(W/L)[(V_GS − V_T)V_DS − V_DS²/2]\n          Saturation: I_D = ½μC_ox(W/L)(V_GS − V_T)²,   g_m = μC_ox(W/L)(V_GS − V_T)\n\n## Rules of thumb\n\n- Each decade of doping moves E_F by 60 mV; each 60 mV of forward bias raises diode current tenfold (300 K).\n- n_i(Si) roughly doubles every 8 °C.\n- Doping 10¹⁶ cm⁻³ in Si = 1 dopant per 5×10⁶ Si atoms; ρ ≈ 0.5 Ω·cm (n-type), 1.4 Ω·cm (p-type).\n- Diffusion length in good Si: tens to hundreds of μm.\n", "group": "Module 5 · Advanced Device Technology", "eyebrow": "Week 15", "disp": "15"}, {"num": "16", "title": "Answer Key — All 50 Examination Questions", "body": "\nThe key point of every PGD examination answer in one or two lines. Cover the right-hand column, say the answer aloud, then check. The full worked answer is in the week shown in brackets.\n\n## Material physics and semiconductor growth (Q1–Q13)\n\n| Q | Key answer |\n|---|---|\n| 1 (Week 1) | Conductivity between metal and insulator, controllable by doping, T, light. Metal: no gap, σ falls with T. Insulator: gap > 4 eV. Semiconductor: gap ≈ 1 eV, two carriers, σ rises with T. |\n| 2 (Week 1) | Elemental: one element, Group IV, covalent, e.g. **Si, Ge**. Compound: two or more elements (III–V, II–VI), tunable and often direct gap, e.g. **GaAs, InP**. |\n| 3 (Week 1) | Abundant and cheap; excellent native SiO₂; 1.12 eV gap gives low leakage to 150 °C; large perfect crystals; strong, good thermal conductor; well-understood doping. |\n| 4 (Week 1) | Gaps 1.12 / 0.66 / 1.42 eV; indirect / indirect / direct; μ_n 1350 / 3900 / 8500. Si for ICs and power; Ge for IR and SiGe HBTs; GaAs for RF, LEDs, lasers. |\n| 5 (Week 1) | Lattice = periodic array of points; crystal = lattice + basis. Structure sets bands and gap, mobility, anisotropy, doping sites, epitaxy, cleavage and defects. |\n| 6 (Week 1) | Smallest integers proportional to reciprocals of intercepts. Steps: intercepts → reciprocals → clear fractions → (h k l). Infinite intercept → 0; negative → bar. |\n| 7 (Week 1) | 2, 3, 1 → 1/2, 1/3, 1 → × 6 → **(3 2 6)**. In a cubic crystal d = a/7. |\n| 8 (Week 1) | Covalent: shared pairs, directional. Ionic: electron transfer, Coulomb attraction. Metallic: electron sea. **Si is covalent**: four sp³ bonds, tetrahedral, 109.5°. |\n| 9 (Week 2) | SiO₂ + 2C → MG-Si (98 %); Si + 3HCl → SiHCl₃ (300 °C); fractional distillation; Siemens CVD SiHCl₃ + H₂ → Si + 3HCl (1100 °C) → EG-Si (9N–11N) polysilicon; then CZ/FZ. |\n| 10 (Week 2) | Seed dipped into melt at 1414 °C and slowly pulled (≈ 1 mm/min) with counter-rotation; melt freezes epitaxially on seed; Dash neck removes dislocations; shoulder, body, tail. |\n| 11 (Week 2) | Advantages: large diameter, dislocation-free, controlled doping, low cost, oxygen strengthens and getters. Limitations: O and C contamination from crucible (limits resistivity), axial doping variation from segregation. |\n| 12 (Week 2) | VPE: gas reacts on hot substrate (SiCl₄ + 2H₂ → Si + 4HCl). LPE: precipitation from cooling saturated melt. MBE: atomic beams in UHV with shutters, monolayer control. |\n| 13 (Week 2) | Temperature VPE 1000–1250 °C > LPE 700–900 °C > MBE 500–650 °C. Precision MBE (atomic) > VPE > LPE. Uses: VPE production Si/MOCVD LEDs; LPE LEDs, thick layers; MBE quantum wells, HEMTs. |\n\n## Impurity control and doping (Q14–Q21)\n\n| Q | Key answer |\n|---|---|\n| 14 (Week 3) | Controlled addition of impurities (10¹⁴–10²⁰ cm⁻³). Needed because intrinsic σ is too low and T-sensitive; sets carrier type, makes junctions, sets V_bi, V_T, β, contacts. |\n| 15 (Week 3) | n-type: Group V donors, electrons majority, E_F near E_c, n ≈ N_D. p-type: Group III acceptors, holes majority, E_F near E_v, p ≈ N_A. |\n| 16 (Week 3) | Donor: one extra valence electron, gives it to CB, becomes +, level near E_c (P, As, Sb). Acceptor: one fewer, takes an electron creating a hole, becomes −, level near E_v (B, Al, Ga, In). |\n| 17 (Week 3) | Thermally activated jumps down a gradient. Vacancy (substitutional, slow: B, P, As), interstitial (fast: Au, Cu, Fe), interstitialcy. D = D₀e^{−E_a/kT}. Predeposition + drive-in. |\n| 18 (Week 3) | First law F = −D∂C/∂x (flux ∝ gradient). Second law ∂C/∂t = D∂²C/∂x² (from continuity), gives the profile's time evolution. |\n| 19 (Week 3) | Constant source → C = 10²⁰ erfc(x/2√(Dt)) cm⁻³. Maximum (10²⁰) at the surface, falling monotonically with depth; penetrates as √t; dose Q = (2/√π)C_s√(Dt). |\n| 20 (Week 3) | Ionised, mass-selected dopant ions accelerated (keV–MeV) into the wafer; Gaussian profile at R_p; anneal. Advantages: precise dose, independent depth, low temperature, resist masks, shallow and buried profiles. |\n| 21 (Week 3) | Diffusion: high T, surface-peaked erfc/Gaussian, coupled dose/depth, no damage, cheap batch. Implant: room T, peak at R_p, ±1 % dose, damage needs anneal, channelling, costly, standard for VLSI. |\n\n## Energy bands and carrier statistics (Q22–Q34)\n\n| Q | Key answer |\n|---|---|\n| 22 (Week 4) | Wave nature; fixed nuclei (Born–Oppenheimer); perfect periodic potential; independent electrons in average potential; Bloch functions; Pauli principle; effective mass; Fermi–Dirac statistics. |\n| 23 (Week 4) | −(ħ²/2m)d²ψ/dx² + Vψ = Eψ. Kinetic-energy term + potential-energy term = total energy E; \\|ψ\\|² is probability density; E eigenvalues give quantisation. |\n| 24 (Week 4) | Periodic square wells and barriers; Bloch condition gives P sin(αa)/αa + cos αa = cos ka. Only energies with LHS between ±1 are allowed → bands and gaps; edges at k = nπ/a. |\n| 25 (Week 4) | VB: highest full band at 0 K (bond electrons, holes). CB: lowest empty band (free electrons). Gap E_g = E_c − E_v: no states. |\n| 26 (Week 4) | Direct: CB min and VB max at same k, photon only, efficient light (GaAs). Indirect: different k, phonon needed, poor emitter (Si, Ge). λ = 1.24/E_g μm. |\n| 27 (Week 4) | Pure, n = p = n_i. n = N_ce^{−(E_c−E_F)/kT}, p = N_ve^{−(E_F−E_v)/kT}; multiply: **n_i = √(N_cN_v) e^{−E_g/2kT}** ∝ T^{3/2}e^{−E_g/2kT}. |\n| 28 (Week 4) | Intrinsic: thermal only, n = p = n_i, strongly T-dependent. Extrinsic: from dopants, n ≠ p, n ≈ N_D or p ≈ N_A, nearly T-independent. Linked by np = n_i². |\n| 29 (Week 4) | n = p and np = n_i² ⇒ **n = p = 1.0×10¹⁰ cm⁻³**. |\n| 30 (Week 5) | f(E) = 1/(1 + e^{(E−E_F)/kT}): occupation probability of a state; ½ at E_F. Gives n and p, defines E_F, constant E_F in equilibrium sets junction physics. |\n| 31 (Week 5) | At 0 K f is a step: 1 below E_F, 0 above. VB full, CB empty, pure semiconductor is an insulator. |\n| 32 (Week 5) | g(E) = states per unit energy per unit volume, g_c ∝ (m_n∗)^{3/2}√(E − E_c). n = ∫g f dE; gives N_c, N_v; zero in gap. |\n| 33 (Week 5) | n-type: E_F rises toward E_c, E_F − E_i = kT ln(N_D/n_i). p-type: falls toward E_v. 60 mV per decade; degenerate at very high doping; returns to E_i at high T. |\n| 34 (Week 4) | n ≈ N_D = **5×10¹⁶ cm⁻³**. (p = 2×10³ cm⁻³; E_F − E_i = 0.40 eV in Si.) |\n\n## Carrier transport and injection (Q35–Q46)\n\n| Q | Key answer |\n|---|---|\n| 35 (Week 7) | μ = v_d/E = qτ/m∗. Depends on effective mass, temperature (lattice T^{−3/2}, impurity T^{3/2}), doping, field, defects, surfaces, orientation, strain. |\n| 36 (Week 7) | Lattice (acoustic, optical, polar phonons), ionised impurity, neutral impurity, carrier–carrier, defects, surface roughness, alloy, intervalley. Matthiessen 1/μ = Σ1/μ_i. |\n| 37 (Week 7) | v_dn = −μ_nE, v_dp = μ_pE; J = ρv: J_n = qnμ_nE, J_p = qpμ_pE; **J = q(nμ_n + pμ_p)E**, σ = q(nμ_n + pμ_p). |\n| 38 (Week 7) | J = qnμE = 1.602×10⁻¹⁹ × 2×10¹⁶ × 1350 × 10 = **43.3 A/cm²**. |\n| 39 (Week 7) | Current from carriers moving down a concentration gradient by random motion. Fick: F = −D dC/dx. J_n = qD_n dn/dx, J_p = −qD_p dp/dx. |\n| 40 (Week 7) | **D/μ = kT/q** (0.0259 V). From zero equilibrium current in a non-uniform sample. Si: D_n = 35, D_p = 12.4 cm²/s. |\n| 41 (Week 8) | High field: optical-phonon emission caps v_d at v_sat ≈ 10⁷ cm/s. Hot carriers (T_e ≫ T): impact ionisation, avalanche, oxide injection and V_T drift, substrate current; LDD as cure. |\n| 42 (Week 8) | Generation creates e–h pairs (thermal, optical, impact); recombination annihilates them (radiative, SRH, Auger, surface). Equal in equilibrium; net U = Δp/τ. |\n| 43 (Week 8) | Recombination via mid-gap trap: capture/emission of electrons and holes. U = (np − n_i²)/[τ_p(n + n₁) + τ_n(p + p₁)]; maximum for E_t ≈ E_i; τ = 1/σv_thN_t. |\n| 44 (Week 8) | Average time an excess minority carrier survives: Δp(t) = Δp(0)e^{−t/τ}. Sets L = √(Dτ), diode leakage, switching speed, BJT gain, solar-cell efficiency. |\n| 45 (Week 9) | ∂p/∂t = −(1/q)∂J_p/∂x + G − R; minority form ∂Δp/∂t = D∂²Δp/∂x² − Δp/τ + G. Used for diodes (exponential profile), BJTs, lifetime and Haynes–Shockley, solar cells. |\n| 46 (Week 9) | S defined by U_s = SΔp_s (cm/s), S = σv_thN_st. Dangling-bond surface states are SRH centres: 1/τ_eff = 1/τ_b + 2S/W. Passivate with SiO₂, SiNₓ, Al₂O₃. |\n\n## Junctions, interfaces and characterisation (Q47–Q50)\n\n| Q | Key answer |\n|---|---|\n| 47 (Week 10) | Diffusion of carriers uncovers fixed ions → depletion region and field; drift balances diffusion; flat E_F. **V_bi = (kT/q) ln(N_AN_D/n_i²)**; W = √(2ε_sV_bi(N_A + N_D)/qN_AN_D). |\n| 48 (Week 10) | Assumptions; law of junction p_n = p_n0e^{qV/kT}; diffusion equation → exponential decay over L_p; currents at edges; **I = I_s(e^{qV/kT} − 1)**, J_s = qn_i²(D_p/L_pN_D + D_n/L_nN_A). Forward: exponential rise; reverse: −I_s. |\n| 49 (Week 11) | Schottky: Φ_m > Φ_s (n-type), upward bending, depletion, barrier Φ_B = Φ_m − χ, rectifying, thermionic, fast. Ohmic: Φ_m < Φ_s or heavy doping, accumulation or tunnelling, linear I-V. |\n| 50 (Week 12) | I-V: ln I vs V gives I_s, η, R_s, breakdown, Φ_B. C-V: C = ε_sA/W; **1/C² = 2(V_bi − V)/(qε_sNA²)**; slope gives N = 2/(qε_sA²·slope), intercept gives V_bi; local slope gives profile N(W). |\n", "group": "Revision & Practicals", "eyebrow": "Revision & Practicals", "disp": "·"}, {"num": "17", "title": "Laboratory and Practical Component", "body": "\nThe course plan requires at least four practical or simulation experiments (3 hours/week). Each practical below gives the aim, theory, procedure, a results table and the analysis. **The readings in the tables are example values** that show what correct results look like; replace them with your own measurements.\n\n---\n\n## Practical 1 — Simulation of carrier transport: Fermi-level shifts in Python\n\n**Aim.** Model how the Fermi level of silicon moves with temperature and with doping, and find the temperature at which a doped sample becomes intrinsic.\n\n**Theory (Weeks 4–5).**\n\n    n_i(T) = √(N_cN_v) e^{−E_g(T)/2kT},   N_c, N_v ∝ T^{3/2},   E_g(T) = 1.17 − 4.73×10⁻⁴T²/(T + 636) eV\n    n = N_D/2 + √((N_D/2)² + n_i²)   (complete ionisation)\n    E_F − E_i = kT ln(n/n_i)\n\n**Procedure.**\n\n1. Run the script below (Python 3 with NumPy and Matplotlib; the same steps work in MATLAB).\n2. Plot E_F − E_i against T from 200 K to 700 K for N_D = 10¹⁴, 10¹⁵, 10¹⁶ and 10¹⁷ cm⁻³.\n3. Plot E_F − E_i against N_D at 300 K from 10¹⁴ to 10¹⁸ cm⁻³ and measure the slope per decade.\n4. For each doping, record the temperature at which n_i = N_D.\n\n```\nimport numpy as np\nimport matplotlib.pyplot as plt\n\nk = 8.617e-5                       # Boltzmann constant, eV/K\nNc300, Nv300 = 2.8e19, 1.04e19     # effective densities of states at 300 K, cm^-3\n\ndef Eg(T):                         # silicon band gap, eV (Varshni)\n    return 1.17 - 4.73e-4 * T**2 / (T + 636)\n\ndef ni(T):\n    Nc = Nc300 * (T / 300)**1.5\n    Nv = Nv300 * (T / 300)**1.5\n    raw = np.sqrt(Nc * Nv) * np.exp(-Eg(T) / (2 * k * T))\n    return raw * 1e10 / ni_raw300  # scale so n_i(300 K) = 1e10 cm^-3\n\nni_raw300 = np.sqrt(Nc300 * Nv300) * np.exp(-Eg(300) / (2 * k * 300))\n\ndef EF_minus_Ei(T, ND):\n    n = ND / 2 + np.sqrt((ND / 2)**2 + ni(T)**2)\n    return k * T * np.log(n / ni(T))\n\nT = np.linspace(200, 700, 501)\nfor ND in (1e14, 1e15, 1e16, 1e17):\n    plt.plot(T, EF_minus_Ei(T, ND), label=f\"N_D = {ND:.0e} cm^-3\")\n    Tint = T[np.argmin(abs(ni(T) - ND))]\n    print(f\"N_D = {ND:.0e}: E_F - E_i at 300 K = {EF_minus_Ei(300, ND):.3f} eV, \"\n          f\"n_i = N_D at about {Tint:.0f} K\")\nplt.xlabel(\"T (K)\"); plt.ylabel(\"E_F - E_i (eV)\"); plt.legend(); plt.grid()\nplt.show()\n\nslope = (EF_minus_Ei(300, 1e17) - EF_minus_Ei(300, 1e16))\nprint(f\"Shift per decade of doping at 300 K: {1000 * slope:.1f} mV\")\n```\n\n**Results** (output of the script):\n\n| N_D (cm⁻³) | E_F − E_i at 300 K (eV) | Temperature where n_i = N_D |\n|---|---|---|\n| 10¹⁴ | 0.238 | ≈ 470 K |\n| 10¹⁵ | 0.298 | ≈ 550 K |\n| 10¹⁶ | 0.357 | ≈ 650 K |\n| 10¹⁷ | 0.417 | above 700 K |\n\nShift per decade of doping at 300 K: 59.5 mV (= kT ln 10).\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 560 225\" role=\"img\" aria-label=\"Fermi level above the intrinsic level against temperature for silicon doped with ten to the 14, 15, 16 and 17 donors per cubic centimetre; each falls towards zero at high temperature\" style=\"width:560px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0
