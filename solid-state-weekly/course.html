centres** (shorter lifetime, more leakage), **traps** (charge storage and noise) and **diffusion paths**. Not all impurities are unwanted: deliberate dopants are substitutional point defects.\n\n## Key points of Week 1\n\n- A semiconductor's conductivity lies between a conductor's and an insulator's and can be **controlled**, above all by doping.\n- Conductors: bands overlap, conductivity falls when hot. Insulators: gap > 4 eV. Semiconductors: gap ≈ 1 eV, conductivity rises when hot.\n- Si and Ge have 4 valence electrons and form 4 covalent bonds (diamond cubic). GaAs averages 4 per atom (zinc blende).\n- Breaking a bond (energy ≥ E_g) makes an electron–hole pair; both carry current. Intrinsic: n = p = n_i.\n- Pentavalent donors (P, As, Sb) → n-type, electrons majority. Trivalent acceptors (B, Al, Ga, In) → p-type, holes majority. np = n_i².\n- E_g = E_C − E_V sets conductivity, leakage, light emission (λ = 1.24/E_g μm) and maximum temperature. Direct gap (GaAs) emits light; indirect (Si) does not.\n- Miller indices: intercepts → reciprocals → smallest integers → (h k l); ∞ gives 0. d = a/√(h² + k² + l²).\n\n---\n\n## Lecture revision questions solved\n\nThese are the lecturer's own Week 1 revision questions (Lecture 2, pages 41–43), in her order.\n\n### R1. Define a semiconductor.\n\nA semiconductor is a material whose electrical conductivity lies between that of a conductor and an insulator (ρ ≈ 10⁻³ to 10⁸ Ω·cm), and whose conductivity can be significantly controlled by temperature, light, electric and magnetic fields, and especially by adding small amounts of impurities (doping). Examples: Si, Ge, GaAs.\n\n### R2. Distinguish between a conductor, semiconductor and insulator.\n\nA **conductor** has many free electrons and overlapping (or no) band gap, very high conductivity, and its conductivity falls as temperature rises (Cu, Ag, Al). An **insulator** has a large band gap (> 4 eV), very few free carriers, very high resistivity, and is used for isolation (glass, rubber, mica). A **semiconductor** has a small band gap (Si 1.12 eV), a moderate and controllable number of carriers (both electrons and holes), and its conductivity rises with temperature and with doping (Si, Ge, GaAs). See the comparison table above.\n\n### R3. What are valence electrons?\n\nValence electrons are the electrons in the outermost energy level (shell) of an atom. They take part in chemical bonding and determine the electrical properties of a material. Silicon has 4, gallium 3, arsenic and phosphorus 5, boron 3.\n\n### R4. Why does silicon have four valence electrons?\n\nSilicon has atomic number Z = 14, so its 14 electrons fill the shells as 2, 8 and 4 (configuration 1s²2s²2p⁶3s²3p²). The first two shells (n = 1 and n = 2) are complete; the third shell (n = 3) holds only 3s²3p², i.e. **4 electrons**. These four outer electrons are the valence electrons, which places silicon in Group IV (14) of the periodic table.\n\n### R5. Explain covalent bonding in silicon.\n\nEach silicon atom has four valence electrons. In the crystal it shares one electron with each of four neighbouring Si atoms, and each neighbour shares one back, so each pair of atoms is joined by a shared **electron pair** (a covalent bond). Each atom therefore forms four covalent bonds, arranged tetrahedrally at 109.5° (diamond-cubic structure), and is surrounded by eight shared electrons, a stable full shell. The shared electrons hold the crystal together. At low temperature all electrons are locked in bonds, so pure Si hardly conducts; when energy of at least 1.12 eV is supplied, a bond breaks and creates a free electron and a hole.\n\n### R6. Define intrinsic semiconductor.\n\nAn intrinsic semiconductor is a pure semiconductor with no intentionally added impurities, in which carriers are produced only by thermal breaking of bonds. Electrons and holes are therefore equal in number: n = p = n_i (Si: n_i ≈ 1×10¹⁰ cm⁻³ at 300 K).\n\n### R7. Define extrinsic semiconductor.\n\nAn extrinsic semiconductor is one whose electrical properties have been deliberately modified by adding controlled amounts of impurity atoms (doping). It is n-type if doped with donors (electrons are majority carriers) or p-type if doped with acceptors (holes are majority carriers). n ≠ p, but np = n_i² still holds.\n\n### R8. What is doping?\n\nDoping is the deliberate, controlled introduction of small amounts of specific impurity atoms (typically 10¹⁴–10²⁰ cm⁻³) into a pure semiconductor to increase its conductivity and set its carrier type. Pentavalent dopants (P, As, Sb) give n-type material; trivalent dopants (B, Al, Ga, In) give p-type. Methods are covered in Week 3 (diffusion and ion implantation).\n\n### R9. Differentiate between n-type and p-type semiconductors.\n\n| | n-type | p-type |\n|---|---|---|\n| Impurity | Pentavalent (P, As, Sb) | Trivalent (B, Al, Ga, In) |\n| Impurity name | Donor | Acceptor |\n| Majority carriers | Electrons | Holes |\n| Minority carriers | Holes | Electrons |\n| Fixed ion left | Positive | Negative |\n| Concentrations | n ≈ N_D, p = n_i²/N_D | p ≈ N_A, n = n_i²/N_A |\n| Fermi level | Near the conduction band | Near the valence band |\n\n### R10. What is a donor impurity?\n\nA donor is a pentavalent impurity atom (P, As or Sb in silicon) with five valence electrons. Four form covalent bonds with neighbouring Si atoms; the fifth is weakly bound (≈ 0.045 eV) and is \"donated\" to the conduction band as a free electron. The donor becomes a fixed positive ion and makes the material n-type.\n\n### R11. What is an acceptor impurity?\n\nAn acceptor is a trivalent impurity atom (B, Al, Ga or In in silicon) with three valence electrons. It completes only three bonds; the incomplete fourth bond \"accepts\" an electron from a neighbouring bond, creating a mobile hole in the valence band. The acceptor becomes a fixed negative ion and makes the material p-type.\n\n### R12. Define energy band gap.\n\nThe energy band gap E_g is the energy difference between the bottom of the conduction band and the top of the valence band, E_g = E_C − E_V. It is the minimum energy needed to free an electron from a covalent bond and create an electron–hole pair. It is measured in eV: Si 1.12 eV, Ge 0.66 eV, GaAs 1.42 eV.\n\n### R13. Differentiate between direct and indirect band-gap semiconductors.\n\nIn a **direct** band-gap semiconductor (GaAs, GaN, InP) the conduction-band minimum and valence-band maximum occur at the same momentum, so an electron can fall across the gap and emit a photon without any change in momentum. Light emission is efficient: LEDs, laser diodes, optical communication. In an **indirect** band-gap semiconductor (Si, Ge) they occur at different momenta, so a transition also needs a phonon (lattice vibration) to supply the momentum. This is unlikely, so light emission is very inefficient; the energy is mostly lost as heat. Silicon is therefore not used for LEDs or lasers.\n\n### R14. State the crystal structure of silicon.\n\nSilicon has the **diamond-cubic** crystal structure: two interpenetrating face-centred cubic lattices displaced by one quarter of the body diagonal. Each atom has four nearest neighbours at the corners of a tetrahedron, bonded covalently. Lattice constant a = 5.43 Å, 8 atoms per unit cell, nearest-neighbour distance 2.35 Å.\n\n### R15. State the crystal structure of GaAs.\n\nGaAs has the **zinc-blende** crystal structure: two interpenetrating FCC sublattices, one of gallium atoms and one of arsenic atoms, displaced by a quarter of the body diagonal. Each Ga atom has four As nearest neighbours and each As has four Ga neighbours, tetrahedrally arranged. Lattice constant a = 5.65 Å. The bonding is covalent with partial ionic character.\n\n### R16. What are Miller indices?\n\nMiller indices are a set of three integers (h k l), obtained from the reciprocals of a plane's intercepts on the crystal axes (in lattice units) reduced to the smallest whole numbers, that identify the orientation of a crystal plane. The same notation gives directions [u v w], families of planes {h k l} and families of directions ⟨u v w⟩. They are used to specify wafer orientation, etching and cleavage planes, epitaxial growth and X-ray diffraction.\n\n### R17. Why is silicon widely used in integrated circuits?\n\n1. It is abundant and cheap (sand, quartz), with a mature refining industry.\n2. It grows a stable, high-quality native oxide, SiO₂, used for masking, passivation, isolation and the MOSFET gate insulator.\n3. Its 1.12 eV band gap gives low leakage and operation up to about 150 °C.\n4. Large, nearly defect-free single crystals (300 mm wafers) can be grown.\n5. It is mechanically strong and conducts heat well.\n6. Its doping by diffusion and ion implantation is well understood and controllable.\n\n### R18. State three applications of GaAs.\n\nAny three of: microwave and RF amplifiers (mobile phones, radar); satellite communication circuits; high-frequency transistors (HEMTs, MESFETs); LEDs; laser diodes for optical-fibre communication; photodetectors; high-efficiency solar cells for satellites.\n\n### R19. Define carrier mobility.\n\nCarrier mobility μ is the average drift velocity acquired by a charge carrier per unit applied electric field: μ = v_d/E, in cm²/V·s. It measures how easily electrons or holes move through the crystal. In silicon μ_n ≈ 1350 and μ_p ≈ 480 cm²/V·s. (Full treatment in Week 7.)\n\n### R20. Explain why semiconductor conductivity increases with temperature.\n\nConductivity is σ = q(nμ_n + pμ_p). As temperature rises, more valence electrons gain enough thermal energy to cross the band gap, breaking covalent bonds and creating electron–hole pairs. The intrinsic carrier concentration rises exponentially, n_i ∝ T^{3/2}e^{−E_g/2kT}: in Si it roughly doubles every 8 °C. Mobility does fall slightly with temperature because of increased lattice scattering (μ ∝ T^{−3/2}), but this is a weak power law against an exponential increase in carriers, so the overall conductivity increases. This is the opposite of a metal, where the carrier number is fixed and only scattering increases.\n\n## Lecture calculation questions solved\n\n### C1. An n-type semiconductor has an electron concentration of 5 × 10¹⁶ cm⁻³. If the electron mobility is 1200 cm²/V·s, calculate its conductivity, assuming hole conduction is negligible.\n\nWith hole conduction neglected, σ = q n μ_n:\n\n    σ = (1.6×10⁻¹⁹ C)(5×10¹⁶ cm⁻³)(1200 cm²/V·s)\n      = 1.6×10⁻¹⁹ × 6×10¹⁹\n      = 9.6 S/cm   (Ω⁻¹cm⁻¹)\n\n**σ = 9.6 S/cm** (= 960 S/m), so the resistivity is ρ = 1/σ = **0.104 Ω·cm**. (With q = 1.602×10⁻¹⁹ C, σ = 9.61 S/cm.)\n\n### C2. A semiconductor has n = 2 × 10¹⁶ cm⁻³, p = 5 × 10¹⁵ cm⁻³, μ_n = 1300 cm²/V·s, μ_p = 450 cm²/V·s. Calculate its conductivity using σ = q(nμ_n + pμ_p).\n\n    nμ_n = 2×10¹⁶ × 1300 = 2.6×10¹⁹\n    pμ_p = 5×10¹⁵ × 450 = 2.25×10¹⁸\n    nμ_n + pμ_p = 2.825×10¹⁹   (cm·V·s)⁻¹\n\n    σ = 1.6×10⁻¹⁹ × 2.825×10¹⁹ = 4.52 S/cm\n\n**σ ≈ 4.52 S/cm**, ρ = 1/σ ≈ **0.221 Ω·cm**. The electrons contribute 92 % of the conductivity (2.6 of 2.825), the holes 8 %.\n\n### C3. Explain why GaAs is preferred to silicon for some high-frequency applications.\n\n1. **Higher electron mobility**: about 8500 cm²/V·s against 1350 for Si, because of its small electron effective mass (0.067m₀). Electrons cross a transistor faster, giving higher transconductance and cut-off frequency (f_T), and lower noise.\n2. **Higher peak electron velocity** (about 2×10⁷ cm/s against 1×10⁷ cm/s), so short transit times in small devices.\n3. **Semi-insulating substrates** (ρ ≈ 10⁸ Ω·cm) reduce parasitic capacitance and substrate losses, ideal for microwave integrated circuits (MMICs) with on-chip transmission lines.\n4. It supports **heterostructure devices** (AlGaAs/GaAs HEMTs and HBTs) with very high mobility two-dimensional electron gases.\n5. **Larger band gap** (1.42 eV) gives better radiation hardness and higher-temperature operation than Si.\n\nSilicon is still preferred where cost, integration density and hole mobility matter.\n\n### C4. A crystal plane has intercepts 2a, 3b and ∞c. Determine its Miller indices.\n\n| Step | x | y | z |\n|---|---|---|---|\n| Intercepts | 2 | 3 | ∞ |\n| Reciprocals | 1/2 | 1/3 | 0 |\n| Multiply by 6 | 3 | 2 | 0 |\n\n**Miller indices (3 2 0).** The zero shows that the plane is parallel to the z-axis. For a cubic crystal, d₃₂₀ = a/√(9 + 4 + 0) = a/√13.\n\n### C5. Explain the importance of semiconductor band gap in electronic and optoelectronic device design.\n\n**Electronic devices.**\n\n1. **Intrinsic carrier concentration and leakage:** n_i ∝ e^{−E_g/2kT}. A wider gap gives far fewer thermally generated carriers, so lower reverse leakage and less noise (Si leaks less than Ge).\n2. **Maximum operating temperature:** a device stops working when n_i approaches the doping level. Ge fails at about 75 °C, Si at about 150–200 °C, and SiC and GaN (3.3–3.4 eV) work above 300 °C.\n3. **Breakdown field and power handling:** wider gap means a higher critical field (Si 0.3 MV/cm, GaN 3.3 MV/cm), so thinner, lower-resistance high-voltage devices.\n4. **Turn-on voltage:** the diode forward voltage rises with E_g (Ge ≈ 0.3 V, Si ≈ 0.7 V, GaAs ≈ 1.1 V).\n\n**Optoelectronic devices.**\n\n1. **Emission wavelength:** an LED or laser emits at λ = hc/E_g, i.e. λ(μm) = 1.24/E_g(eV). Designers choose or alloy materials for the colour: GaAs 0.87 μm (infrared), GaP green-yellow, GaN 365 nm (blue/UV with InGaN), InGaAsP 1.3–1.55 μm for optical fibres.\n2. **Absorption and detection:** only photons with hν ≥ E_g are absorbed. Si detects up to 1.1 μm; Ge and InGaAs are used for longer wavelengths.\n3. **Solar cells:** the band gap sets the trade-off between absorbing more of the spectrum and the voltage obtained; the optimum single-junction gap is about 1.1–1.4 eV (Si, GaAs).\n4. **Direct or indirect:** only direct-gap materials emit light efficiently.\n\n---\n\n## Examination questions solved (Q1–Q8)\n\n### Q1. Define a semiconductor and explain how its electrical conductivity differs from that of a conductor and an insulator.\n\n**Definition.** A semiconductor is a material whose conductivity lies between that of conductors and insulators (resistivity roughly 10⁻³ to 10⁸ Ω·cm) and can be controlled by temperature, light, electric field and, above all, by adding small amounts of impurity (doping). Examples: Si, Ge, GaAs.\n\n**Difference, explained with energy bands.**\n\n1. **Conductor.** The valence and conduction bands overlap, or the highest band is only partly filled. There is no gap, so a huge number of free electrons (about 10²² cm⁻³) is always present. Conductivity is very high (σ ≈ 10⁶ S/cm) and almost independent of impurities. It **decreases** as temperature rises because lattice scattering increases.\n2. **Insulator.** The valence band is full and the conduction band is empty, separated by a wide gap (E_g > about 4 eV, e.g. SiO₂ ≈ 9 eV). Thermal energy at room temperature (kT ≈ 0.026 eV) cannot lift electrons across, so there are practically no carriers. Conductivity is extremely small (σ < 10⁻¹⁰ S/cm).\n3. **Semiconductor.** Same full/empty arrangement but a **small gap** (Si 1.12 eV). At room temperature a small fraction of electrons is thermally excited into the conduction band, leaving holes behind, so both electrons and holes conduct. Conductivity is moderate and **increases** with temperature (negative temperature coefficient of resistance), and can be raised by many orders of magnitude by doping.\n\n**Summary.** Conductors have no gap and fixed, abundant carriers; insulators have a wide gap and essentially no carriers; semiconductors have a small gap, two carrier types, and a carrier density that can be engineered.\n\n### Q2. Distinguish between elemental semiconductors and compound semiconductors, giving two examples of each.\n\n| | Elemental | Compound |\n|---|---|---|\n| Composition | One chemical element | Two or more elements |\n| Periodic table | Group IV (14) | Combinations such as III–V, II–VI, IV–IV |\n| Crystal structure | Diamond cubic | Zinc blende or wurtzite |\n| Bonding | Purely covalent | Covalent with partial ionic character |\n| Band gap | Fixed by the element; Si and Ge are indirect | Adjustable by choice of elements and alloying; many are direct |\n| Processing | Mature, cheap (especially Si) | More difficult and costly; stoichiometry must be controlled |\n| Typical use | ICs, power, detectors | Optoelectronics, RF, high power |\n| **Examples** | **Silicon (Si), Germanium (Ge)** | **Gallium arsenide (GaAs), Indium phosphide (InP)**; also GaN, SiC, CdTe |\n\n### Q3. Explain why silicon is widely used in semiconductor device fabrication.\n\n1. **Abundance and cost.** Si makes up about 28 % of the Earth's crust as SiO₂ (sand, quartz). Raw material is cheap and the refining industry is enormous.\n2. **Excellent native oxide.** Silicon oxidises to SiO₂, which is stable, insoluble in water, an excellent insulator (E_g ≈ 9 eV, breakdown ≈ 10 MV/cm) and forms a very clean interface with Si (interface trap density about 10¹⁰ cm⁻²eV⁻¹). SiO₂ is used as a diffusion mask, surface passivation, field isolation and the MOSFET gate dielectric. No other semiconductor has a comparable oxide.\n3. **Suitable band gap.** At 1.12 eV it is large enough to give low intrinsic concentration and low leakage, so devices work up to about 150 °C (Ge fails above about 75 °C), yet small enough for good conduction when doped.\n4. **Mature crystal growth.** Very large (300 mm), nearly defect-free, highly pure single crystals are routinely grown by the Czochralski method.\n5. **Mechanical and thermal strength.** Si is hard, can be handled as thin wafers, and conducts heat well (about 3 times better than GaAs), which matters in power devices and dense ICs.\n6. **Well-understood doping.** B, P, As and Sb dope it predictably by diffusion and ion implantation.\n7. **Elemental.** No stoichiometry to control and no toxic constituents, unlike GaAs.\n\nIts main limitation is the indirect gap, which makes it a poor light emitter; that is why lasers and LEDs use compound semiconductors.\n\n### Q4. Compare the properties and applications of silicon (Si), germanium (Ge), and gallium arsenide (GaAs).\n\nUse the comparison table of Si, Ge and GaAs above as the core of the answer, then comment:\n\n- **Structure and bonding.** Si and Ge are elemental, diamond cubic, purely covalent. GaAs is a III–V compound, zinc blende, mainly covalent with partial ionic character (As is more electronegative than Ga).\n- **Band gap.** Ge (0.66 eV) < Si (1.12 eV) < GaAs (1.42 eV). The larger the gap, the lower n_i, the lower the leakage and the higher the maximum operating temperature. Si and Ge are **indirect**; GaAs is **direct**, so only GaAs emits light efficiently.\n- **Mobility.** GaAs electrons are fastest (8500), then Ge (3900), then Si (1350) cm²/V·s. Hence GaAs and Ge suit high-speed work, though GaAs hole mobility is poor.\n- **Oxide.** Only Si has an excellent native oxide, which is why MOS technology and VLSI are silicon.\n- **Cost and processing.** Si cheapest and most mature; Ge more expensive; GaAs most expensive, brittle and toxic.\n\n**Applications.**\n\n- **Si:** microprocessors, memories, all digital and analogue ICs, MOSFETs and BJTs, power devices (IGBTs, thyristors), solar cells, sensors and MEMS.\n- **Ge:** infrared detectors and lenses, high-speed SiGe heterojunction transistors, substrates for multi-junction space solar cells; historically the first transistors.\n- **GaAs:** microwave and RF amplifiers in mobile phones and radar, satellite communication, HEMTs and MESFETs, LEDs, laser diodes for optical fibre links, high-efficiency solar cells for satellites.\n\n### Q5. What is a crystal lattice? Explain the significance of crystal structure in semiconductor materials.\n\n**Crystal lattice.** A crystal lattice is an infinite, periodic three-dimensional array of points in space such that every point has identical surroundings. It is generated by repeating a unit cell (edges a, b, c and angles α, β, γ) by translation. Attaching a basis of one or more atoms to each lattice point gives the real crystal: crystal = lattice + basis. Si, for example, is an FCC lattice with a two-atom basis, which produces the diamond structure.\n\n**Significance of crystal structure.**\n\n1. **It produces the energy bands.** The periodic potential of the lattice splits the atomic levels into allowed bands and forbidden gaps (Bloch's theorem, Kronig–Penney model). The size and type (direct or indirect) of the band gap depend on the structure and the atomic spacing.\n2. **Carrier mobility.** In a perfect periodic lattice electrons move without scattering; departures from periodicity (vibrations, impurities, defects, grain boundaries) cause scattering. Single crystals therefore have much higher mobility than polycrystalline or amorphous material.\n3. **Anisotropy.** Properties such as surface atom density, oxidation rate, etch rate, interface trap density, piezoelectric response and mobility differ with crystal direction. Wafer orientation ((100) or (111)) is chosen accordingly.\n4. **Doping and diffusion.** Dopant atoms sit on substitutional lattice sites to become active. Open structures (diamond, APF 0.34) allow interstitial diffusion.\n5. **Epitaxy and heterostructures.** Layers can be grown defect-free only on substrates with matching structure and lattice constant (e.g. AlGaAs on GaAs).\n6. **Mechanical behaviour.** Cleavage planes, hardness and how wafers are diced all follow from the structure and bond directions.\n7. **Defects.** Departures from the ideal structure (vacancies, dislocations) create states in the gap that act as traps and recombination centres, shortening carrier lifetime.\n\n### Q6. Define Miller indices and explain how they are used to identify crystal planes.\n\n**Definition.** Miller indices are a set of three smallest integers (h k l), proportional to the **reciprocals of the intercepts** a plane makes on the crystal axes (measured in units of the lattice constants), that specify the orientation of that plane and all planes parallel to it.\n\n**How they identify a plane (procedure):**\n\n1. Choose the origin at a lattice point not on the plane. Find the intercepts on x, y, z in units of a, b, c: say p, q, r.\n2. Take reciprocals 1/p, 1/q, 1/r. A plane parallel to an axis has an infinite intercept and so a zero index.\n3. Multiply by the lowest common multiple of the denominators to obtain integers.\n4. Reduce to the smallest integers and enclose in round brackets (h k l). Negative indices carry a bar.\n\n**Use and notation.** (h k l) names a particular plane; {h k l} the family of symmetry-equivalent planes; [u v w] a direction and ⟨u v w⟩ a family of directions. In cubic crystals [h k l] is normal to (h k l), and the spacing between planes is d = a/√(h² + k² + l²). Miller indices are used to specify wafer orientation ((100) for MOS, (111) for bipolar), etch planes, cleavage planes and X-ray diffraction peaks.\n\n**Example.** Intercepts a, 2b, 3c → reciprocals 1, 1/2, 1/3 → × 6 → **(6 3 2)**.\n\n### Q7. Determine the Miller indices of a crystal plane having intercepts of 2a, 3b, and 1c.\n\n| Step | x | y | z |\n|---|---|---|---|\n| Intercepts (in units of a, b, c) | 2 | 3 | 1 |\n| Reciprocals | 1/2 | 1/3 | 1/1 |\n| Multiply by the LCM of the denominators, 6 | 3 | 2 | 6 |\n\n**Miller indices = (3 2 6).**\n\nCheck: the integers 3, 2, 6 have no common factor, so no further reduction is possible. If the crystal is cubic with lattice constant a, the spacing of these planes is d₃₂₆ = a/√(9 + 4 + 36) = a/√49 = **a/7**.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 470 225\" role=\"img\" aria-label=\"The plane cutting the x axis at 2a, the y axis at 3b and the z axis at c, with Miller indices 3 2 6\" style=\"width:470px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"170.0\" y1=\"160.0\" x2=\"93.4\" y2=\"204.5\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" marker-end=\"url(#ar)\"/><text x=\"83.4\" y=\"214.5\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;font-style:italic;\" opacity=\"1.0\">x</text><line x1=\"170.0\" y1=\"160.0\" x2=\"362.0\" y2=\"160.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" marker-end=\"url(#ar)\"/><text x=\"370.0\" y=\"164.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;font-style:italic;\" opacity=\"1.0\">y</text><line x1=\"170.0\" y1=\"160.0\" x2=\"170.0\" y2=\"68.8\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.6\" marker-end=\"url(#ar)\"/><text x=\"178.0\" y=\"64.8\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:currentColor;font-style:italic;\" opacity=\"1.0\">z</text><line x1=\"139.6\" y1=\"172.4\" x2=\"147.6\" y2=\"178.4\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"113.2\" y1=\"187.7\" x2=\"121.2\" y2=\"193.7\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"218.0\" y1=\"156.0\" x2=\"218.0\" y2=\"164.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"266.0\" y1=\"156.0\" x2=\"266.0\" y2=\"164.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"314.0\" y1=\"156.0\" x2=\"314.0\" y2=\"164.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><line x1=\"166.0\" y1=\"112.0\" x2=\"174.0\" y2=\"112.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\"/><polygon points=\"117.2,190.7 314.0,160.0 170.0,112.0\" style=\"fill:var(--copper,#B4622F);stroke:var(--copper,#B4622F)\" fill-opacity=\"0.25\" stroke-width=\"1.6\" opacity=\"1.0\" stroke-linejoin=\"round\"/><circle cx=\"117.2\" cy=\"190.7\" r=\"3.2\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><text x=\"101.2\" y=\"204.7\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">2a</text><circle cx=\"314.0\" cy=\"160.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><text x=\"318.0\" y=\"178.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">3b</text><circle cx=\"170.0\" cy=\"112.0\" r=\"3.2\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\"/><text x=\"154.0\" y=\"114.0\" text-anchor=\"middle\" font-size=\"11.5\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">1c</text><text x=\"330.0\" y=\"40.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">intercepts 2, 3, 1</text><text x=\"330.0\" y=\"58.0\" text-anchor=\"start\" font-size=\"11\" style=\"fill:currentColor;\" opacity=\"1.0\">reciprocals ½, ⅓, 1</text><text x=\"330.0\" y=\"76.0\" text-anchor=\"start\" font-size=\"12\" style=\"fill:var(--copper,#B4622F);\" opacity=\"1.0\" font-weight=\"600\">× 6  →  (3 2 6)</text></svg><figcaption>The (3 2 6) plane, cutting the axes at 2a, 3b and 1c.</figcaption></figure>\n```\n\n### Q8. Explain the difference between covalent, ionic, and metallic bonding and identify the dominant bonding mechanism in silicon.\n\n**Covalent bonding.** Adjacent atoms share pairs of valence electrons so that each completes a stable outer shell. The shared electrons are localised between the two atoms, making the bond strong and directional. Covalent solids are hard, have high melting points, and are semiconductors or insulators depending on how tightly the bonds hold their electrons.\n\n**Ionic bonding.** An electropositive atom gives up valence electrons to an electronegative atom; the resulting positive and negative ions attract electrostatically. The bond is strong but non-directional, there are no free electrons, and ionic solids (NaCl, MgO) are brittle insulators that conduct only when molten or dissolved.\n\n**Metallic bonding.** Each atom releases its valence electrons into a common delocalised electron gas that binds the positive ion cores. The bond is non-directional, and the mobile electron gas gives high electrical and thermal conductivity, ductility and metallic lustre.\n\n**Key differences:** how the electrons are held (shared between pairs / transferred to ions / shared by all atoms), directionality (yes / no / no), and the resulting electrical behaviour (semiconductor or insulator / insulator / conductor).\n\n**Bonding in silicon: covalent.** Si has four valence electrons. In the diamond-cubic lattice each Si atom forms four sp³ covalent bonds with four nearest neighbours at 109.5°, sharing one electron pair with each so that every atom has a full octet. Because Si–Si bonds are between identical atoms there is no ionic character. The modest bond strength (equivalent to E_g = 1.12 eV) is what lets thermal energy break a few bonds at room temperature, creating electron–hole pairs and giving silicon its semiconducting behaviour.\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 1.1: why germanium leaks more than silicon\n\n**Question.** Explain why a germanium diode has a much larger reverse leakage current than a silicon diode of the same doping.\n\n**Answer.** Leakage is carried by minority carriers, whose concentration is n_i²/N. Germanium's band gap (0.66 eV) is much smaller than silicon's (1.12 eV), so far more bonds are broken thermally: n_i(Ge) ≈ 2.4×10¹³ cm⁻³ against 1×10¹⁰ cm⁻³ for Si. Since leakage ∝ n_i², the Ge diode has about (2.4×10³)² ≈ 6×10⁶ times more minority carriers and a correspondingly larger leakage current.\n\n#### Practice 1.2: Miller indices with a negative intercept\n\n**Question.** A plane cuts the x-axis at −a, the y-axis at 2b and is parallel to the z-axis. Determine its Miller indices.\n\n**Given:** intercepts −1, 2, ∞ (lattice units).\n\n**Find:** (h k l).\n\n**Solution.**\n\n    Reciprocals: −1, 1/2, 0\n    Multiply by 2: −2, 1, 0\n\n**Answer:** **(2̄ 1 0)**, written with a bar over the 2 (in plain text (−2 1 0)).\n\n#### Practice 1.3: interplanar spacing in germanium\n\n**Question.** Germanium has a lattice constant of 5.65 Å. Calculate the spacing of the (110) and (111) planes.\n\n**Given:** a = 5.65 Å.\n\n**Find:** d₁₁₀ and d₁₁₁.\n\n**Solution.**\n\n    d₁₁₀ = a/√(1 + 1 + 0) = 5.65/√2 = 3.995 Å\n    d₁₁₁ = a/√(1 + 1 + 1) = 5.65/√3 = 3.262 Å\n\n**Answer:** **d₁₁₀ = 4.00 Å, d₁₁₁ = 3.26 Å.**\n\n#### Practice 1.4: atom density and mass density of silicon\n\n**Question.** Silicon has the diamond structure with a = 5.43 Å and atomic mass 28.085 g/mol. Calculate the number of atoms per cm³ and the density of silicon in g/cm³.\n\n**Given:** a = 5.43×10⁻⁸ cm, 8 atoms per unit cell, M = 28.085 g/mol, N_A(Avogadro) = 6.022×10²³ mol⁻¹.\n\n**Find:** atoms per cm³ and density ρ.\n\n**Solution.**\n\n    Cell volume a³ = (5.43×10⁻⁸)³ = 1.601×10⁻²² cm³\n    Atoms per cm³ = 8/a³ = 8/1.601×10⁻²² = 5.0×10²² cm⁻³\n    Mass of one cell = 8 × 28.085/6.022×10²³ = 3.731×10⁻²² g\n    ρ = 3.731×10⁻²² / 1.601×10⁻²² = 2.33 g/cm³\n\n**Answer:** **5.0×10²² atoms/cm³; ρ = 2.33 g/cm³.**\n\n#### Practice 1.5: atom density of GaAs\n\n**Question.** GaAs has the zinc-blende structure with a = 5.65 Å. Each unit cell contains 4 Ga and 4 As atoms; the molar mass of GaAs is 144.64 g/mol. Find the total atom density and the density of GaAs.\n\n**Given:** a = 5.65×10⁻⁸ cm, 8 atoms (4 GaAs pairs) per cell, M = 144.64 g/mol.\n\n**Find:** atoms per cm³ and ρ.\n\n**Solution.**\n\n    a³ = (5.65×10⁻⁸)³ = 1.804×10⁻²² cm³\n    Atoms per cm³ = 8/a³ = 4.44×10²² cm⁻³\n    ρ = 4 × 144.64 / (6.022×10²³ × 1.804×10⁻²²) = 578.6/108.6 = 5.33 g/cm³\n\n**Answer:** **4.44×10²² atoms/cm³ (half Ga, half As); ρ = 5.33 g/cm³.**\n\n#### Practice 1.6: the effect of doping on conductivity\n\n**Question.** Compare the conductivity of intrinsic silicon (n_i = 1×10¹⁰ cm⁻³) with that of silicon doped with 1×10¹⁵ cm⁻³ donors. Use μ_n = 1350 and μ_p = 480 cm²/V·s.\n\n**Given:** n_i = 10¹⁰ cm⁻³, N_D = 10¹⁵ cm⁻³, μ_n = 1350, μ_p = 480 cm²/V·s.\n\n**Find:** σ_intrinsic, σ_doped and their ratio.\n\n**Solution.**\n\n    σ_i = qn_i(μ_n + μ_p) = 1.6×10⁻¹⁹ × 10¹⁰ × 1830 = 2.93×10⁻⁶ S/cm\n    σ = qN_Dμ_n = 1.6×10⁻¹⁹ × 10¹⁵ × 1350 = 0.216 S/cm\n    ratio = 0.216/2.93×10⁻⁶ = 7.4×10⁴\n\n**Answer:** **doping with only one atom in 5×10⁷ raises the conductivity about 74 000 times.**\n\n#### Practice 1.7: which light can silicon absorb?\n\n**Question.** What is the longest wavelength of light that silicon (E_g = 1.12 eV) can absorb? Can a silicon photodiode detect the 1.55 μm light used in optical-fibre links?\n\n**Given:** E_g = 1.12 eV.\n\n**Find:** λ_max, and whether 1.55 μm is absorbed.\n\n**Solution.**\n\n    λ_max = 1.24/E_g = 1.24/1.12 = 1.11 μm\n    A 1.55 μm photon has energy 1.24/1.55 = 0.80 eV < 1.12 eV\n\n**Answer:** **λ_max = 1.11 μm; no**, 1.55 μm photons do not have enough energy to create electron–hole pairs in silicon. Fibre receivers use Ge or InGaAs.\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column before moving on.\n\n| # | Objective | Check yourself | Answer | Where it is taught |\n|---|---|---|---|---|\n| 1 | Define a semiconductor and distinguish it from a conductor and an insulator. | Why does a semiconductor conduct better when it is heated, while a metal conducts worse? | Heat breaks bonds and creates many more electron–hole pairs (∝ e^{−E_g/2kT}); in a metal the carrier number is fixed and only scattering increases. | Classification of materials |\n| 2 | Describe the atomic structure of Si, Ge, Ga and As and identify their valence electrons. | How many valence electrons do Si, Ga and As have? | Si 4, Ga 3, As 5 (GaAs averages 4 per atom). | Atomic structure; valence electrons |\n| 3 | Explain covalent bonding in silicon and electron–hole pair generation. | What two carriers are created when a covalent bond in Si breaks, and what minimum energy is needed? | A free electron and a hole; at least E_g = 1.12 eV. | Covalent bonding; electron–hole pairs |\n| 4 | Distinguish intrinsic, n-type and p-type semiconductors, and donors from acceptors. | Si is doped with 10¹⁷ cm⁻³ boron. Is it n- or p-type, and what is the electron concentration (n_i = 10¹⁰ cm⁻³)? | p-type; n = n_i²/N_A = 10³ cm⁻³. | Intrinsic and extrinsic semiconductors |\n| 5 | Compare elemental and compound semiconductors, and Si, Ge and GaAs. | Give one reason GaAs is preferred to Si for high-frequency work and one reason Si is preferred for ICs. | GaAs: electron mobility ≈ 8500 vs 1350 cm²/V·s. Si: excellent native SiO₂ (also cheaper, larger wafers). | Elemental and compound; comparison table |\n| 6 | Explain the energy-band picture, the band gap and direct versus indirect gaps. | Why is silicon not used for LEDs? | Its gap is indirect: a phonon is needed to conserve momentum, so radiative recombination is very inefficient. | Energy band concept; direct and indirect band gaps |\n| 7 | Describe crystal lattices, unit cells and the diamond and zinc-blende structures. | How many atoms are in the diamond-cubic unit cell, and how many nearest neighbours does each atom have? | 8 atoms per cell; 4 nearest neighbours. | Semiconductor crystal structure |\n| 8 | Determine Miller indices of planes and the spacing between planes. | Find the Miller indices of a plane with intercepts 3a, ∞, c. | Reciprocals 1/3, 0, 1 → × 3 → (1 0 3). | Miller indices; Examples 1.2–1.3 |\n", "group": "Module 1 · Material Physics & Semiconductor Growth", "eyebrow": "Week 1", "disp": "01"}, {"num": "02", "title": "Material Growth Techniques", "body": "\n**Plan:** purification of silicon (metallurgical to electronic grade); the Czochralski bulk crystal growth method; epitaxial growth techniques (VPE, LPE, MBE).\n\n## Learning objectives\n\nBy the end of this week you should be able to:\n\n1. Describe the conversion of quartzite into metallurgical-grade silicon.\n2. Explain how MG-Si is purified into electronic-grade silicon.\n3. Explain the principle and steps of the Czochralski method.\n4. State the advantages and limitations of CZ growth and compare it with float-zone growth.\n5. Use the segregation coefficient to predict doping along an ingot.\n6. Explain the principles of VPE, LPE and MBE and compare them.\n\n## Symbols and abbreviations used this week\n\nEvery symbol, constant and abbreviation on this page is listed here, even if an earlier week already defined it, so you can study this page on its own.\n\n**Constants and units**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| k | Boltzmann constant | 8.617×10⁻⁵ eV/K = 1.381×10⁻²³ J/K |\n| h | Planck constant | 6.626×10⁻³⁴ J·s |\n| Å | Ångström, a unit of length | 1 Å = 10⁻¹⁰ m = 0.1 nm |\n| μm | Micrometre (micron) | 1 μm = 10⁻⁴ cm = 10⁻⁶ m |\n\n**Symbols**\n\n| Symbol | Meaning | Units / typical value |\n|---|---|---|\n| f(E) | Fermi–Dirac function: probability that a state at energy E is occupied | dimensionless, 0 to 1 |\n| a | Lattice constant: edge length of the cubic unit cell | Å; Si 5.43, Ge and GaAs 5.65 |\n| k₀ | Segregation coefficient, C_s/C_l at the freezing interface | dimensionless; B 0.8, P 0.35 |\n| C_s | Surface concentration of a diffusion (or solid concentration when freezing) | cm⁻³ |\n| C_l, C₀ | Concentration in the melt (liquid); C₀ at the start | cm⁻³ |\n| f (growth) | Fraction of the melt already solidified | 0 to 1 |\n| ρ | Resistivity, 1/σ | Ω·cm |\n| a_layer, a_sub | Lattice constants of the grown layer and of the substrate | Å |\n\n**Abbreviations**\n\n| Abbreviation | Meaning |\n|---|---|\n| Si | Silicon |\n| Ge | Germanium |\n| GaAs | Gallium arsenide |\n| InP | Indium phosphide |\n| SiO₂ | Silicon dioxide (silica), the oxide insulator |\n| III–V | Compound of Group III and Group V elements (e.g. GaAs) |\n| MG-Si | Metallurgical-grade silicon (≈ 98 % pure) |\n| EG-Si | Electronic-grade silicon (99.9999999 % or better) |\n| CZ | Czochralski crystal growth |\n| FZ | Float-zone crystal growth |\n| CVD | Chemical vapour deposition |\n| VPE | Vapour-phase epitaxy |\n| LPE | Liquid-phase epitaxy |\n| MBE | Molecular-beam epitaxy |\n| MOCVD | Metal-organic chemical vapour deposition |\n| UHV | Ultra-high vacuum (≈ 10⁻¹⁰ Torr) |\n| RHEED | Reflection high-energy electron diffraction (counts atomic layers during MBE) |\n| CMOS | Complementary MOS (n- and p-channel MOSFETs together) |\n| HEMT | High-electron-mobility transistor |\n| BJT | Bipolar junction transistor |\n| HBT | Heterojunction bipolar transistor |\n| LED | Light-emitting diode |\n| RF | Radio frequency |\n| VCSEL | Vertical-cavity surface-emitting laser |\n\n\n## The big picture\n\nTo make a chip you need three things, in this order:\n\n1. **Extremely pure silicon.** A device stops working if more than about one atom in a billion is an unwanted impurity. Sand is nowhere near that pure.\n2. **One single crystal.** The atoms must be lined up perfectly across the whole wafer (Week 1). Polycrystalline silicon, with grains pointing in different directions, scatters carriers and leaks current.\n3. **Thin layers on top**, with different doping or even a different material, grown so that they continue the crystal perfectly.\n\nThis week covers each step: **purification** (sand → pure polysilicon), **crystal growth** (polysilicon → one big crystal, by the Czochralski method), and **epitaxy** (growing thin crystalline layers on top).\n\n## Part A: Purification of silicon\n\nThe whole route, from sand to wafer:\n\n    quartzite (SiO₂) → metallurgical-grade Si (98 %) → trichlorosilane SiHCl₃ → purified SiHCl₃ → electronic-grade polysilicon → single crystal → wafers\n\n| Stage | Product | Purity |\n|---|---|---|\n| Arc furnace (reduction with carbon) | Metallurgical-grade Si (MG-Si) | About 98–99 % |\n| Chlorination, distillation, Siemens CVD | Electronic-grade polysilicon (EG-Si) | 99.9999999 % (\"nine nines\", 9N) or better |\n| Czochralski or float-zone growth | Single-crystal ingot, doped as required | Dopant added deliberately |\n\n### Step 1: making metallurgical-grade silicon (MG-Si)\n\nQuartzite, a fairly pure form of SiO₂ (sand, quartz), is mixed with carbon (coal, coke, wood chips) and heated to about **2000 °C** in an electric arc furnace. Carbon pulls the oxygen off the silicon:\n\n    SiO₂ + 2C → Si + 2CO\n\nMolten silicon is drained from the furnace. This **MG-Si** is about 98 % pure. The 2 % of impurities (Fe, Al, Ca, C, B, P) is still about 10²⁰ impurity atoms per cm³, a hundred million times too many for devices. MG-Si is good enough for making steel and aluminium alloys, but not chips.\n\n### Step 2: turning silicon into a liquid that can be purified\n\nSolids are hard to purify; liquids are easy to purify by distillation. So the next step is to convert silicon into a liquid compound. MG-Si powder is reacted with hydrogen chloride gas at about **300 °C**:\n\n    Si + 3HCl → SiHCl₃ + H₂\n\nThe product, **trichlorosilane (SiHCl₃)**, is a liquid that boils at only 32 °C. The impurities also react with HCl and form their own chlorides (FeCl₃, BCl₃, PCl₃ and so on), which boil at different temperatures.\n\n### Step 3: fractional distillation\n\nThe trichlorosilane is purified by **fractional distillation**, the same process used to separate petrol from crude oil. Because SiHCl₃ and each impurity chloride boil at different temperatures, repeated distillation leaves SiHCl₃ with impurities at only a few **parts per billion**.\n\n### Step 4: Siemens process (back to solid silicon)\n\nThe pure SiHCl₃ is now turned back into silicon. It is mixed with pure hydrogen and passed over thin silicon rods heated electrically to about **1100 °C** inside a reactor. Silicon deposits on the hot rods (chemical vapour deposition, CVD):\n\n    SiHCl₃ + H₂ → Si + 3HCl\n\nOver many hours the rods grow into thick bars of **electronic-grade polycrystalline silicon (EG-Si)**, 9N to 11N pure. The HCl is recycled.\n\nEG-Si is pure but still **polycrystalline** (many small grains) and undoped. The next step turns it into a single crystal and adds the doping.\n\n> **In plain words.** Steps 2–4 are a round trip: solid silicon → liquid compound → solid silicon. The trip is worth it because the liquid can be distilled, and distillation removes almost all the impurities.\n\n## Part B: Czochralski (CZ) crystal growth\n\n### The principle\n\nDip a small **seed crystal** into molten silicon and pull it out very slowly. Silicon from the melt freezes onto the seed, and as each atom freezes it lines up with the atoms already there. So the growing piece continues the seed's crystal, and you end up with one large single crystal (an **ingot**) with the same orientation as the seed.\n\nIt is like pulling a candle out of hot wax, except that each new layer copies the arrangement of the layer before it.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 470 345\" role=\"img\" aria-label=\"Czochralski crystal puller: a rotating seed is slowly withdrawn from silicon melt in a heated quartz crucible, growing a single-crystal ingot\" style=\"width:470px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><line x1=\"200.0\" y1=\"10.0\" x2=\"200.0\" y2=\"62.0\" style=\"stroke:currentColor\" stroke-width=\"2.2\" opacity=\"1.0\"/><path d=\"M184,34 a16,6 0 1,0 32,0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" stroke-linejoin=\"round\" marker-end=\"url(#ar)\"/><line x1=\"226.0\" y1=\"52.0\" x2=\"226.0\" y2=\"22.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" opacity=\"1.0\" marker-end=\"url(#art)\"/><rect x=\"193.0\" y=\"62.0\" width=\"14.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"196.0\" y=\"76.0\" width=\"8.0\" height=\"12.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"197.5\" y=\"88.0\" width=\"5.0\" height=\"22.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><path d=\"M197.5,110 L162,140 L162,212 Q200,222 238,212 L238,140 L202.5,110 Z\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.3\" opacity=\"1.0\" stroke-linejoin=\"round\"/><path d=\"M110,190 L110,280 Q200,300 290,280 L290,190\" style=\"fill:none;stroke:currentColor\" stroke-width=\"2.4\" opacity=\"1.0\" stroke-linejoin=\"round\"/><path d=\"M120,214 L120,276 Q200,292 280,276 L280,214 Z\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:none\" stroke-width=\"0\" opacity=\"1.0\" stroke-linejoin=\"round\"/><line x1=\"120.0\" y1=\"214.0\" x2=\"160.0\" y2=\"214.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" opacity=\"1.0\"/><line x1=\"240.0\" y1=\"214.0\" x2=\"280.0\" y2=\"214.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.4\" opacity=\"1.0\"/><path d=\"M100,186 L100,288 Q200,312 300,288 L300,186\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\" opacity=\"0.55\" stroke-linejoin=\"round\"/><rect x=\"79.0\" y=\"196.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"212.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"228.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"244.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"260.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"79.0\" y=\"276.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"196.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"212.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"228.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"244.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"260.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><rect x=\"301.0\" y=\"276.0\" width=\"10.0\" height=\"10.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.75\"/><path d=\"M182,304 a18,6 0 1,1 36,0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" stroke-linejoin=\"round\" marker-end=\"url(#ar)\"/><text x=\"236.0\" y=\"30.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">pull rod: rotate and lift slowly (≈ 1 mm/min)</text><text x=\"212.0\" y=\"83.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">seed crystal (sets orientation)</text><text x=\"210.0\" y=\"102.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Dash neck (removes dislocations)</text><text x=\"244.0\" y=\"172.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">single-crystal ingot</text><text x=\"304.0\" y=\"236.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">Si melt, ≈ 1420 °C</text><text x=\"304.0\" y=\"266.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">quartz crucible</text><text x=\"312.0\" y=\"296.0\" text-anchor=\"start\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">heater</text><line x1=\"300.0\" y1=\"233.0\" x2=\"252.0\" y2=\"240.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\"/><line x1=\"300.0\" y1=\"263.0\" x2=\"287.0\" y2=\"262.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\"/><line x1=\"308.0\" y1=\"293.0\" x2=\"312.0\" y2=\"286.0\" style=\"stroke:currentColor\" stroke-width=\"0.8\" opacity=\"0.5\"/><text x=\"200.0\" y=\"335.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"0.8\">crucible counter-rotates; chamber filled with argon</text></svg><figcaption>The Czochralski puller. The seed is dipped into the melt and slowly withdrawn while seed and crucible rotate in opposite directions; the melt freezes onto the seed with the seed's orientation.</figcaption></figure>\n```\n\n### The equipment\n\n- A **quartz (SiO₂) crucible** holding the molten silicon, inside a graphite holder.\n- **Heaters** (RF induction or resistance) keeping the melt just above silicon's melting point, **1414 °C**.\n- A **pull rod** holding the seed, which rotates and rises slowly.\n- A chamber filled with **argon** gas, so the hot silicon does not react with air.\n- Sensors and control electronics to keep the diameter constant.\n\n### The steps\n\n1. **Load.** Chunks of EG-Si and a carefully weighed amount of dopant (boron for p-type; phosphorus, arsenic or antimony for n-type) go into the crucible.\n2. **Melt.** The chamber is filled with argon and the charge is melted at about 1420 °C.\n3. **Dip.** The seed (cut to the wanted orientation, e.g. ⟨100⟩) is lowered until it just touches the melt.\n4. **Neck (Dash technique).** The seed is pulled up quickly, growing a thin neck about 3 mm across. Dipping a cold seed into hot liquid creates crystal defects (dislocations); in a thin neck they run out of the sides and disappear, so the crystal below is dislocation-free.\n5. **Shoulder and body.** The pull rate is reduced so the crystal widens to the full diameter (up to 300 mm). It is then pulled at about **1 mm per minute** while the seed and crucible rotate in **opposite directions** (10–30 rpm) to stir the melt and keep temperature and doping even.\n6. **Tail.** At the end the pull rate is increased so the diameter narrows to a cone before the crystal leaves the melt. A sudden break would send defects back up the crystal.\n7. **Cool** slowly. A typical ingot is 300 mm wide and up to 2 m long.\n\n**Controlling the diameter:** pulling faster, or making the melt hotter, gives a thinner crystal; pulling slower or cooler gives a thicker one.\n\nAfter growth the ingot is ground to an exact diameter, marked with a flat or notch to show its orientation, sliced into wafers with a wire saw, then lapped, etched and polished to a mirror finish.\n\n### Dopant segregation: why the doping changes along the ingot\n\nWhen silicon freezes, impurity atoms \"prefer\" to stay in the liquid. The **segregation coefficient** measures this:\n\n    k₀ = C_s / C_l\n\nC_s is the concentration in the solid and C_l in the liquid where they meet. For most dopants k₀ < 1: the crystal takes in less dopant than the melt contains.\n\n| Impurity | B | P | As | Sb | Al | Ga | O | Fe |\n|---|---|---|---|---|---|---|---|---|\n| k₀ in Si | 0.8 | 0.35 | 0.3 | 0.023 | 0.002 | 0.008 | 0.25 | 8×10⁻⁶ |\n\n**Consequence.** The dopant left behind builds up in the shrinking pool of melt. So the end of the ingot that grows last is more heavily doped than the start. If C₀ is the starting melt concentration and f the fraction already frozen,\n\n    C_s = k₀ C₀ (1 − f)^{k₀ − 1}\n\n#### Example 2.1: dopant segregation in a CZ crystal\n\n**Question.** A boron-doped silicon crystal is to be grown by the Czochralski method with a boron concentration of 1×10¹⁶ cm⁻³ at the seed end. The segregation coefficient of boron in silicon is k₀ = 0.8. (a) What boron concentration must the melt contain at the start? (b) What is the boron concentration in the crystal when half of the melt has solidified?\n\n**Given:** C_s(start) = 1×10¹⁶ cm⁻³, k₀ = 0.8, f = 0.5 for part (b).\n\n**Find:** (a) C₀, the initial melt concentration; (b) C_s at f = 0.5.\n\n**Solution.**\n\n(a) At the start, C_s = k₀C₀, so\n\n    C₀ = C_s/k₀ = 1×10¹⁶ / 0.8 = 1.25×10¹⁶ cm⁻³\n\n(b) Use C_s = k₀C₀(1 − f)^{k₀ − 1} with f = 0.5:\n\n    C_s = 0.8 × 1.25×10¹⁶ × (0.5)^{−0.2} = 1×10¹⁶ × 1.149 = 1.15×10¹⁶ cm⁻³\n\n**Answer:** **(a) C₀ = 1.25×10¹⁶ cm⁻³; (b) C_s = 1.15×10¹⁶ cm⁻³**, about 15 % higher than at the seed end, because rejected boron builds up in the melt.\n\nThe same effect also **purifies**: iron (k₀ ≈ 10⁻⁵) is almost entirely rejected into the melt.\n\n### Float-zone (FZ) growth, for comparison\n\nA polysilicon rod is held vertically and a narrow molten zone, heated by an RF coil, is moved slowly along it, starting from a seed. **No crucible** touches the molten silicon, so there is almost no oxygen or carbon contamination, and very pure, high-resistivity silicon (up to 10⁴ Ω·cm) can be made. FZ is used for power devices and radiation detectors, but wafers are smaller (≤ 200 mm) and more expensive.\n\n## Part C: Epitaxial growth\n\n### What epitaxy is and why we need it\n\n**Epitaxy** (Greek *epi*, \"upon\", and *taxis*, \"arrangement\") is the growth of a thin single-crystal layer on a single-crystal wafer (the **substrate**), so that the new layer continues the substrate's crystal structure and orientation.\n\nWhy not just make everything in the bulk crystal? Because devices need **thin layers with different properties stacked on each other**, with sharp boundaries:\n\n- a lightly doped layer on a heavily doped substrate (bipolar transistors, power diodes);\n- a layer of a different material, such as AlGaAs on GaAs or InGaAs on InP (lasers, LEDs, high-speed transistors);\n- a layer cleaner than the CZ substrate (less oxygen, fewer defects).\n\n**Homoepitaxy:** same material (Si on Si). **Heteroepitaxy:** different materials (GaAs on Si, AlGaAs on GaAs). In heteroepitaxy the two **lattice constants** must be nearly equal (Week 1); otherwise the mismatch creates defects.\n\n```figure\n<figure class=\"fig\"><svg viewBox=\"0 0 640 186\" role=\"img\" aria-label=\"Schematics of vapour-phase, liquid-phase and molecular-beam epitaxy\" style=\"width:640px;max-width:100%;height:auto;display:block;margin:0 auto;font-family:\"IBM Plex Sans Condensed\",system-ui,sans-serif\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:currentColor\" opacity=\".7\"/></marker><marker id=\"ars\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--copper,#B4622F)\"/></marker><marker id=\"art\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"5\" markerHeight=\"5\" orient=\"auto-start-reverse\"><path d=\"M0,1 L9,5 L0,9 z\" style=\"fill:var(--teal,#1C6E7E)\"/></marker></defs><text x=\"100.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">VPE / CVD</text><rect x=\"30.0\" y=\"40.0\" width=\"140.0\" height=\"90.0\" rx=\"4\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.6\"/><rect x=\"55.0\" y=\"108.0\" width=\"90.0\" height=\"14.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.55\"/><rect x=\"65.0\" y=\"100.0\" width=\"70.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"8.0\" y1=\"60.0\" x2=\"160.0\" y2=\"60.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" opacity=\"1.0\" marker-end=\"url(#art)\"/><line x1=\"8.0\" y1=\"76.0\" x2=\"160.0\" y2=\"76.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.3\" opacity=\"1.0\" marker-end=\"url(#art)\"/><text x=\"30.0\" y=\"55.0\" text-anchor=\"start\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">SiCl₄ + H₂</text><line x1=\"170.0\" y1=\"90.0\" x2=\"190.0\" y2=\"90.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-end=\"url(#ar)\"/><text x=\"178.0\" y=\"104.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">HCl</text><text x=\"100.0\" y=\"162.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">gas reacts on hot</text><text x=\"100.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">substrate, 1000–1250 °C</text><text x=\"315.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">LPE</text><rect x=\"245.0\" y=\"60.0\" width=\"140.0\" height=\"40.0\" rx=\"0\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.4\" opacity=\"1.0\"/><rect x=\"270.0\" y=\"62.0\" width=\"50.0\" height=\"26.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"330.0\" y=\"62.0\" width=\"40.0\" height=\"26.0\" rx=\"0\" style=\"fill:var(--teal-soft,#E0EEF1);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.6\"/><rect x=\"275.0\" y=\"88.0\" width=\"40.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><line x1=\"385.0\" y1=\"92.0\" x2=\"415.0\" y2=\"92.0\" style=\"stroke:currentColor\" stroke-width=\"1\" opacity=\"0.7\" marker-end=\"url(#ar)\"/><text x=\"295.0\" y=\"54.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">Ga + As melt</text><text x=\"315.0\" y=\"120.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"0.8\">slider moves substrate</text><text x=\"315.0\" y=\"162.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">cool slowly: GaAs</text><text x=\"315.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">precipitates, 700–900 °C</text><text x=\"535.0\" y=\"20.0\" text-anchor=\"middle\" font-size=\"12.5\" style=\"fill:currentColor;\" opacity=\"1.0\" font-weight=\"600\">MBE</text><rect x=\"460.0\" y=\"34.0\" width=\"150.0\" height=\"100.0\" rx=\"30\" style=\"fill:none;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.6\"/><rect x=\"505.0\" y=\"44.0\" width=\"60.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper-soft,#F3E7DE);stroke:currentColor\" stroke-width=\"1.2\" opacity=\"1.0\"/><rect x=\"510.0\" y=\"36.0\" width=\"50.0\" height=\"8.0\" rx=\"0\" style=\"fill:var(--copper,#B4622F);stroke:none\" stroke-width=\"1.2\" opacity=\"0.55\"/><rect x=\"473.0\" y=\"112.0\" width=\"18.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"482.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">Ga</text><line x1=\"482.0\" y1=\"110.0\" x2=\"521.8\" y2=\"56.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.1\" opacity=\"1.0\" stroke-dasharray=\"3 3\"/><rect x=\"526.0\" y=\"112.0\" width=\"18.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"535.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">As</text><line x1=\"535.0\" y1=\"110.0\" x2=\"535.0\" y2=\"56.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.1\" opacity=\"1.0\" stroke-dasharray=\"3 3\"/><rect x=\"579.0\" y=\"112.0\" width=\"18.0\" height=\"14.0\" rx=\"0\" style=\"fill:currentColor;stroke:currentColor\" stroke-width=\"1.2\" opacity=\"0.8\"/><text x=\"588.0\" y=\"140.0\" text-anchor=\"middle\" font-size=\"10\" style=\"fill:currentColor;\" opacity=\"1.0\">Si</text><line x1=\"588.0\" y1=\"110.0\" x2=\"548.2\" y2=\"56.0\" style=\"stroke:var(--teal,#1C6E7E)\" stroke-width=\"1.1\" opacity=\"1.0\" stroke-dasharray=\"3 3\"/><line x1=\"470.0\" y1=\"100.0\" x2=\"494.0\" y2=\"100.0\" style=\"stroke:currentColor\" stroke-width=\"1.6\" opacity=\"1.0\"/><text x=\"535.0\" y=\"162.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">UHV ≈ 10⁻¹⁰ Torr, 500–650 °C</text><text x=\"535.0\" y=\"177.0\" text-anchor=\"middle\" font-size=\"10.5\" style=\"fill:currentColor;\" opacity=\"1.0\">atomic-layer control</text></svg><figcaption>The three methods side by side: gas reacting on a hot surface (VPE), a cooling saturated melt (LPE), and atomic beams in ultra-high vacuum (MBE).</figcaption></figure>\n```\n\n### Vapour-phase epitaxy (VPE), also called CVD epitaxy\n\n**Principle.** Gases containing silicon flow over a heated wafer. At the hot surface they react or break down, leaving silicon atoms behind. The atoms move about on the surface until they find the right place in the crystal, so the layer grows as a continuation of the wafer.\n\nFor silicon, the common reactions are:\n\n    SiCl₄ + 2H₂ → Si + 4HCl      (≈ 1150–1250 °C)\n    SiH₂Cl₂ → Si + 2HCl          (≈ 1000–1100 °C)\n    SiH₄ → Si + 2H₂              (≈ 600–1000 °C)\n\nDoping is done by adding a little dopant gas: **B₂H₆** (diborane) for p-type, **PH₃** (phosphine) or **AsH₃** (arsine) for n-type.\n\nThe growth rate is limited by one of two steps: how fast gas can reach the surface (**mass-transport limited**, at high temperature) or how fast the reaction happens on the surface (**reaction-rate limited**, at lower temperature).\n\nFor compound semiconductors the metal-organic version, **MOCVD**, is used: (CH₃)₃Ga + AsH₃ → GaAs + 3CH₄ at about 600–750 °C. Nearly all commercial LEDs are made this way.\n\n- Growth rate 0.1–5 μm/min; good uniformity; many wafers at once: the industrial workhorse.\n- Problems: dopant from the substrate can evaporate and re-enter the layer (**autodoping**), and at high temperature dopant diffuses up from the substrate (**out-diffusion**), blurring the boundary.\n\n### Liquid-phase epitaxy (LPE)\n\n**Principle.** Dissolve the semiconductor in a molten metal until no more will dissolve (a **saturated solution**), like sugar in hot water. Bring the wafer into contact with it and cool slowly. As the liquid cools it can hold less, so the extra semiconductor comes out of solution and crystallises onto the wafer, continuing its crystal.\n\n**Example:** GaAs dissolved in molten gallium, at about **700–900 °C**, cooled at 0.1–1 °C per minute. A **sliding graphite boat** with several wells of different melts moves the wafer from one melt to the next to build up layers.\n\n- Growth happens close to equilibrium, so crystal quality is excellent and defects few; the equipment is simple and cheap.\n- But thickness control is poor (about 0.1 μm at best), boundaries are not sharp, surfaces are rough, and the area is small.\n- Used for LEDs and the first heterostructure lasers.\n\n### Molecular-beam epitaxy (MBE)\n\n**Principle.** In an **ultra-high vacuum** (about 10⁻¹⁰ Torr, roughly a ten-trillionth of atmospheric pressure), each element (Ga, As, Al, dopants) is heated in its own small oven (**effusion cell**). Atoms evaporate and travel in straight lines, as a beam, to the heated wafer, because there is no air to collide with. They land, move around, and join the crystal. Each oven has a **shutter** that can open or close in a fraction of a second, switching that element on or off.\n\n**Example:** GaAs from Ga and As cells, wafer at about 550–650 °C.\n\n- Growth is slow, about **1 μm per hour**, which is about **one atomic layer per second**. So layers can be controlled to **a single atomic layer**.\n- Boundaries are atomically sharp. Ideal for quantum wells, superlattices, high-electron-mobility transistors (HEMTs) and advanced lasers.\n- Growth can be watched while it happens by **RHEED** (electron diffraction), which counts the atomic layers.\n- Very expensive equipment, slow, low throughput.\n\n### Comparing the three at a glance\n\n| | VPE (CVD) | LPE | MBE |\n|---|---|---|---|\n| Atoms arrive from | A gas, by chemical reaction | A liquid solution, by precipitation | A beam of atoms, in vacuum |\n| Temperature | Highest (Si: 1000–1250 °C) | Medium (700–900 °C) | Lowest (500–650 °C) |\n| Thickness control | Good (tens of nm) | Poor (~0.1 μm) | Excellent (one atomic layer) |\n| Speed | Fast | Fast | Slow |\n| Cost | Moderate | Low | Very high |\n| Best for | Mass production (Si epi, LEDs by MOCVD) | Simple, thick, high-quality layers | Atomic-scale research and advanced devices |\n\n## Key points of Week 2\n\n- MG-Si (98 %) is made from quartz and carbon in an arc furnace: SiO₂ + 2C → Si + 2CO.\n- It is purified by converting it to liquid SiHCl₃, distilling, then depositing EG-Si by the Siemens process: SiHCl₃ + H₂ → Si + 3HCl.\n- CZ growth: a seed is pulled slowly from the melt, rotating; the crystal copies the seed. Dash necking removes dislocations.\n- CZ gives large, cheap, dislocation-free crystals, but oxygen from the crucible and segregation (k₀ < 1) are its limitations.\n- Epitaxy grows thin crystalline layers on a wafer: VPE from gas (production), LPE from a cooling melt (simple), MBE from atomic beams in vacuum (atomic precision).\n\n---\n\n## Examination questions solved (Q9–Q13)\n\n### Q9. Describe the major stages involved in converting metallurgical-grade silicon (MG-Si) into electronic-grade silicon (EG-Si).\n\n**Starting point: production of MG-Si.** Quartzite is reduced with carbon in an electric arc furnace at about 2000 °C: SiO₂ + 2C → Si + 2CO. The product is about 98 % pure, with Fe, Al, Ca, B, P and C as the main impurities.\n\n**Stage 1: Hydrochlorination (conversion to a volatile compound).** Pulverised MG-Si is reacted with anhydrous HCl at about 300 °C, usually with a catalyst in a fluidised bed: Si + 3HCl → SiHCl₃ + H₂. Silicon becomes trichlorosilane, a liquid boiling at 32 °C. Impurities form their own chlorides.\n\n**Stage 2: Purification by fractional distillation.** Because SiHCl₃ and the impurity chlorides have different boiling points, repeated fractional distillation separates them, leaving SiHCl₃ with electrically active impurities at parts-per-billion levels.\n\n**Stage 3: Reduction and deposition (Siemens process).** The purified SiHCl₃ is mixed with high-purity hydrogen and passed over electrically heated thin silicon filaments (about 1100 °C) in a CVD reactor: SiHCl₃ + H₂ → Si + 3HCl. Silicon deposits on the rods, which grow into thick polycrystalline bars of **electronic-grade silicon** (purity 9N–11N, i.e. 99.9999999 % or better). HCl and unreacted chlorosilanes are recovered and recycled.\n\n**Stage 4 (to make device material): single-crystal growth.** The EG-Si polysilicon is broken into chunks, melted with the required dopant and grown into a single-crystal ingot by Czochralski or float-zone growth. Segregation during freezing purifies it further. The ingot is then shaped, sliced, lapped, etched and polished into wafers.\n\n### Q10. Explain the principle and operation of the Czochralski (CZ) crystal growth method.\n\n**Principle.** Crystal pulling from the melt. A small single-crystal seed of known orientation is brought into contact with molten silicon held slightly above its melting point (1414 °C). Heat is conducted away up the seed, so the melt at the seed–melt interface solidifies. The freezing atoms take up positions that continue the seed's lattice, so the growing ingot is a single crystal with the same orientation as the seed. Pull rate and temperature control the diameter.\n\n**Equipment.** Furnace (quartz crucible in a graphite susceptor, RF or resistance heater); crystal-pulling mechanism (seed holder on a rotating, slowly rising shaft; crucible rotation and lift); ambient control (argon flow at reduced pressure); diameter and temperature control system.\n\n**Operation.**\n\n1. Polysilicon EG-Si and a precise amount of dopant are loaded into the crucible. The chamber is purged with argon and the charge is melted.\n2. The seed is lowered to touch the melt surface.\n3. A thin neck is pulled quickly (Dash necking) to eliminate dislocations.\n4. The pull rate and temperature are lowered so the crystal widens (shoulder) to the target diameter.\n5. The body is grown at constant diameter with typical pull rate about 1 mm/min while seed and crucible counter-rotate to stir the melt and keep it thermally symmetric.\n6. At the end the diameter is tapered to a tail cone and the crystal is lifted clear and cooled slowly.\n\nThe finished ingot is then characterised for orientation, resistivity and defects before being sliced into wafers.\n\n### Q11. State four advantages and two limitations of the Czochralski method.\n\n**Advantages:**\n\n1. **Large diameters**: 200 mm and 300 mm ingots are routine, which lowers cost per chip.\n2. **Dislocation-free crystals** of controlled orientation ((100), (111)) from the seed, thanks to Dash necking.\n3. **Controlled doping**: dopant added to the melt gives the required type and resistivity.\n4. **High throughput and low cost**: mature, highly automated, relatively fast growth.\n5. **Oxygen content strengthens the wafer** against warping and slip, and allows **intrinsic gettering** (oxygen precipitates in the bulk trap metallic impurities away from the device surface).\n\n**Limitations:**\n\n1. **Contamination from the crucible**: the quartz crucible dissolves slowly, introducing oxygen (≈ 10¹⁸ cm⁻³) and the graphite parts introduce carbon. Oxygen forms thermal donors and precipitates, and limits the attainable resistivity (CZ cannot easily exceed about 100 Ω·cm), so FZ is preferred for high-power and detector devices.\n2. **Non-uniform axial doping** because of segregation (k₀ < 1): the dopant concentration rises from seed end to tail end, so resistivity varies along the ingot. Melt convection also causes radial non-uniformity and growth striations.\n\n(Also acceptable: the crucible is consumed in each run; high energy consumption; batch process.)\n\n### Q12. Explain the principles of vapour-phase epitaxy (VPE), liquid-phase epitaxy (LPE), and molecular-beam epitaxy (MBE).\n\nEpitaxy is the growth of a thin single-crystal film on a single-crystal substrate such that the film adopts the substrate's crystal structure and orientation. The three methods differ in the phase from which atoms arrive.\n\n**Vapour-phase epitaxy (VPE).** The semiconductor is supplied as a gas-phase chemical compound carried by hydrogen over a heated substrate inside a reactor. The compound decomposes or is reduced at the hot surface, and the released atoms move to lattice sites. For silicon the standard reaction is hydrogen reduction of silicon tetrachloride at about 1200 °C, SiCl₄ + 2H₂ → Si + 4HCl; silane SiH₄ → Si + 2H₂ is used at lower temperature. Doping is achieved by adding gases such as PH₃, AsH₃ or B₂H₆. The rate is set either by mass transport of reactants through the gas boundary layer or by the surface reaction. MOCVD is the metal-organic version used for III–V compounds.\n\n**Liquid-phase epitaxy (LPE).** The substrate is placed in contact with a saturated solution of the semiconductor in a molten metal solvent (e.g. GaAs in liquid Ga). On slow, controlled cooling the solubility decreases, the solution becomes supersaturated and the semiconductor precipitates epitaxially on the substrate. Growth occurs near thermodynamic equilibrium. A sliding graphite boat moves the substrate under successive melts to grow multilayers.\n\n**Molecular-beam epitaxy (MBE).** In ultra-high vacuum (≈ 10⁻¹⁰ Torr), elemental sources in heated effusion cells produce collision-free molecular beams aimed at a heated substrate. Atoms adsorb, migrate and incorporate in the lattice. Each beam has a shutter, so composition and doping can be switched abruptly. Growth is slow (≈ 1 monolayer/s) and is monitored in real time by RHEED, so thickness is controlled to atomic precision.\n\n### Q13. Compare VPE, LPE, and MBE in terms of growth mechanism, temperature, precision, and applications.\n\n| Feature | VPE (CVD) | LPE | MBE |\n|---|---|---|---|\n| Source phase | Gas (chlorosilanes, silane, metal-organics) | Liquid solution (melt) | Atomic or molecular beams from solid sources |\n| Growth mechanism | Chemical reaction / decomposition at the hot surface | Precipitation from a supersaturated solution on cooling; near equilibrium | Physical deposition: adsorption and surface migration; far from equilibrium |\n| Environment | Atmospheric or reduced pressure, H₂ carrier | Inert or H₂, graphite boat | Ultra-high vacuum, 10⁻¹⁰–10⁻¹¹ Torr |\n| Typical temperature | High: Si 1000–1250 °C; MOCVD 600–750 °C | Intermediate: 700–900 °C (GaAs) | Low: 400–650 °C (GaAs ≈ 600 °C) |\n| Growth rate | 0.1–5 μm/min | 0.1–1 μm/min | ≈ 1 μm/h (≈ 1 monolayer/s) |\n| Thickness precision | ≈ tens of nm; good uniformity | Poor, ≈ 0.1 μm; rough surface | Excellent, one atomic layer |\n| Interface abruptness | Moderate (autodoping, out-diffusion) | Poor (graded) | Atomically abrupt |\n| Crystal purity | Good | Very high, low deep-level defects | Very high (UHV) |\n| In-situ monitoring | Limited | None | RHEED, mass spectrometry |\n| Cost and throughput | Moderate cost, high throughput (batch) | Low cost, low throughput, small area | Very high cost, low throughput |\n| Applications | Si epi layers for BJTs, CMOS, power devices; MOCVD for LEDs, lasers, solar cells | LEDs, early heterostructure lasers, thick layers, photodetectors | Quantum wells, superlattices, HEMTs, HBTs, quantum-cascade and VCSEL lasers, research |\n\n**Conclusion.** VPE is the industrial choice for volume production, LPE is a simple low-cost method giving high-quality thick layers with poor control, and MBE gives the ultimate atomic-scale control for advanced heterostructure devices at high cost.\n\n---\n\n## Practice questions\n\nThese extra questions practise this week's ideas. Work each one on paper before reading the solution; the calculation questions follow the same Question, Given, Find, Solution, Answer layout as the worked examples.\n\n#### Practice 2.1: the purification route\n\n**Question.** List the stages from quartzite to electronic-grade silicon, giving the chemical reaction and approximate temperature of each.\n\n**Answer.**\n\n| Stage | Reaction | Temperature |\n|---|---|---|\n| 1. Arc furnace → MG-Si (98 %) | SiO₂ + 2C → Si + 2CO | ≈ 2000 °C |\n| 2. Hydrochlorination | Si + 3HCl → SiHCl₃ + H₂ | ≈ 300 °C |\n| 3. Fractional distillation of SiHCl₃ | (physical separation by boiling point) | ≈ 32 °C boiling point |\n| 4. Siemens CVD → EG-Si polysilicon | SiHCl₃ + H₂ → Si + 3HCl | ≈ 1100 °C |\n\n#### Practice 2.2: phosphorus segregation along an ingot\n\n**Question.** An n-type CZ crystal must have 5×10¹⁵ cm⁻³ phosphorus at the seed end. The segregation coefficient of P in Si is 0.35. Find the starting melt concentration and the phosphorus concentration in the crystal when 80 % of the melt has solidified.\n\n**Given:** C_s(0) = 5×10¹⁵ cm⁻³, k₀ = 0.35, f = 0.8.\n\n**Find:** C₀ and C_s at f = 0.8.\n\n**Solution.**\n\n    C₀ = C_s/k₀ = 5×10¹⁵/0.35 = 1.43×10¹⁶ cm⁻³\n    C_s = k₀C₀(1 − f)^{k₀ − 1} = 5×10¹⁵ × (0.2)^{−0.65} = 5×10¹⁵ × 2.85 = 1.42×10¹⁶ cm⁻³\n\n**Answer:** **C₀ = 1.43×10¹⁶ cm⁻³; at f = 0.8, C_s = 1.42×10¹⁶ cm⁻³**, almost three times the seed-end value. This is why P-doped CZ ingots vary so much in resistivity along their length.\n\n#### Practice 2.3: how much silicon in an ingot?\n\n**Question.** A CZ ingot is 300 mm in diameter and 1.5 m long. Find its mass (density 2.33 g/cm³) and how many wafers it gives if each wafer is 775 μm thick and the saw removes another 200 μm per cut.\n\n**Given:** diameter 30 cm, length 150 cm, ρ = 2.33 g/cm³, 775 + 200 = 975 μm per wafer.\n\n**Find:** mass and number of wafers.\n\n**Solution.**\n\n    Volume = π r² L = π × 15² × 150 = 1.06×10⁵ cm³\n    Mass = 1.06×10⁵ × 2.33 = 2.47×10⁵ g = 247 kg\n    Wafers = 150 cm / 0.0975 cm = 1538\n\n**Answer:** **about 247 kg and roughly 1500 wafers** (fewer after the shoulder and tail are cut off).\n\n#### Practice 2.4: MBE growth time\n\n**Question.** A 0.5 μm GaAs layer is grown by MBE at 1 μm/h. How long does it take, and how many monolayers (each a/2 = 0.2825 nm thick) are deposited? What is the average monolayer rate?\n\n**Given:** thickness 500 nm, rate 1 μm/h, monolayer 0.2825 nm.\n\n**Find:** time, number of monolayers, rate.\n\n**Solution.**\n\n    t = 0.5 μm / (1 μm/h) = 0.5 h = 1800 s\n    monolayers = 500 nm / 0.2825 nm = 1770\n    rate = 1770/1800 ≈ 1 monolayer per second\n\n**Answer:** **30 minutes, about 1770 monolayers, at about one atomic layer per second**, which is why MBE can control thickness to a single layer.\n\n#### Practice 2.5: lattice mismatch\n\n**Question.** Calculate the lattice mismatch for (a) Ge on Si (a = 5.65 and 5.43 Å) and (b) AlAs on GaAs (a = 5.661 and 5.653 Å). Which pair is suitable for defect-free heteroepitaxy?\n\n**Given:** lattice constants above. f = (a_layer − a_sub)/a_sub.\n\n**Find:** f for each pair.\n\n**Solution.**\n\n    (a) f = (5.65 − 5.43)/5.43 = 0.041 = 4.1 %\n    (b) f = (5.661 − 5.653)/5.653 = 0.0014 = 0.14 %\n\n**Answer:** **4.1 % and 0.14 %.** AlAs/GaAs is almost perfectly matched and grows defect-free, which is why AlGaAs/GaAs heterostructures are so widely used. Ge on Si quickly forms misfit dislocations unless the layer is very thin or graded.\n\n#### Practice 2.6: CZ operating conditions\n\n**Question.** Why is the CZ puller filled with argon, and why do the seed and crucible rotate in opposite directions?\n\n**Answer.** Argon is inert: it stops the hot silicon reacting with oxygen and nitrogen, and the gas flow carries away SiO evaporating from the melt. Counter-rotation stirs the melt, so the temperature around the growing crystal is uniform (giving a round, constant-diameter crystal) and dopant is mixed evenly (giving uniform radial resistivity).\n\n---\n\n## Objectives check\n\nUse this table to confirm you have met this week's objectives. Cover the Answer column and answer each check question from memory. If you cannot, go back to the section in the last column befo
